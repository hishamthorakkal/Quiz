<script>
const quiz=[{"num": 17, "level": "", "question": "Which site is recommended for preductal pulse oximetry in routine CCHD screening?", "options": ["Either foot", "Left foot", "Left hand exclusively", "Right hand"], "answer": 3, "explanation": "right hand is reliably preductal. Why not the others: A. Either foot — Either foot is postductal.; B. Left foot — Left foot is postductal.; C. Left hand exclusively — Left-hand preductal status can be anatomy dependent.", "pearl": "Screen right hand AND one foot.", "srcAnswer": "D"}, {"num": 18, "level": "", "question": "In the IAP-NNF 2026 CCHD pathway, a single SpO2 of 88% in either screening site means:", "options": ["Routine discharge if other site is 96%", "Repeat twice at 1-hour intervals before action", "Immediate failed screen and clinical evaluation", "Pass if infant has no murmur"], "answer": 2, "explanation": "any site below 90% is an immediate fail. Why not the others: A. Routine discharge if other site is 96% — The higher value at the other site cannot cancel a <90% result.; B. Repeat twice at 1-hour intervals before action — Immediate failures should not wait for rescreens.; D. Pass if infant has no murmur — Murmur absence does not change the result.", "pearl": "SpO2 <90% at either site: immediate fail.", "srcAnswer": "C"}, {"num": 19, "level": "", "question": "Which result passes the IAP-NNF 2026 CCHD screening algorithm?", "options": ["Right hand 96%, foot 93%", "Right hand 98%, foot 94%", "Right hand 95%, foot 95%", "Right hand 94%, foot 95%"], "answer": 2, "explanation": "both ≥95% and difference ≤3%. Why not the others: A. Right hand 96%, foot 93% — Foot is below 95%, so not a pass.; B. Right hand 98%, foot 94% — Foot below 95% despite a 4-point difference.; D. Right hand 94%, foot 95% — Right hand is below 95%, so not a pass.", "pearl": "2026 IAP-NNF adopts 2025 AAP: ≥95% BOTH sites, ≤3% difference.", "srcAnswer": "C"}, {"num": 20, "level": "", "question": "An asymptomatic newborn has 96% in the right hand and 92% in the foot at 26 hours. Best next screening step?", "options": ["Send home because both values are ≥90%", "Repeat both sites once after 1 hour", "Pass because the right hand is ≥95%", "Repeat only the right hand immediately"], "answer": 1, "explanation": "one rescreen in 1 hour under current pathway. Why not the others: A. Send home because both values are ≥90% — This is an indeterminate screen, not a pass.; C. Pass because the right hand is ≥95% — Foot is below 95% and gradient is >3%.; D. Repeat only the right hand immediately — Both sites must be measured on repeat.", "pearl": "One rescreen only for an indeterminate screen.", "srcAnswer": "B"}, {"num": 21, "level": "", "question": "A well newborn fails the CCHD screen. Which statement is best?", "options": ["Normal auscultation rules out serious disease", "All failed screens indicate structural CHD", "An ECG alone confirms a CCHD lesion", "Sepsis or PPHN can also cause failure"], "answer": 3, "explanation": "evaluate cardiac and noncardiac causes of hypoxaemia. Why not the others: A. Normal auscultation rules out serious disease — Auscultation can be normal in critical lesions.; B. All failed screens indicate structural CHD — Noncardiac hypoxaemia is an important alternative.; C. An ECG alone confirms a CCHD lesion — ECG is supportive, not anatomic confirmation.", "pearl": "A failed screen is an emergency signal, not a specific diagnosis.", "srcAnswer": "D"}, {"num": 22, "level": "", "question": "A 30-hour newborn has right-hand SpO2 94%, foot 94%. After 1 hour both remain 94%. What is the screen outcome?", "options": ["Pass; gradient is zero", "Second rescreen after another hour", "Routine discharge because SpO2 exceeds 90%", "Fail: clinical evaluation and echo"], "answer": 3, "explanation": "persistent indeterminate after one repeat is fail. Why not the others: A. Pass; gradient is zero — Both sites are below 95%, so no pass.; B. Second rescreen after another hour — Current IAP-NNF uses only one rescreen.; C. Routine discharge because SpO2 exceeds 90% — ≥90% alone is insufficient for pass.", "pearl": "Two 94/94 readings one hour apart = failed screen.", "srcAnswer": "D"}, {"num": 23, "level": "", "question": "A newborn has SpO2 97% in both sites, but femoral pulses are weak and upper-limb pressure exceeds lower-limb pressure. Next step?", "options": ["Treat presumed asthma", "Urgent echo despite passing oximetry", "Discharge; oximetry excludes coarctation", "Repeat only pulse oximetry in one week"], "answer": 1, "explanation": "coarctation can pass pulse oximetry. Why not the others: A. Treat presumed asthma — Asthma does not explain weak femorals in a newborn.; C. Discharge; oximetry excludes coarctation — Oximetry misses many left-sided obstructive lesions.; D. Repeat only pulse oximetry in one week — Do not delay assessment of abnormal pulses.", "pearl": "Pulse oximetry is not a rule-out test for coarctation.", "srcAnswer": "B"}, {"num": 24, "level": "", "question": "A cyanotic 12-hour-old infant has SpO2 84% in both sites and little respiratory distress. What should take priority?", "options": ["Wait until 24 hours for screening", "Stabilize and obtain urgent echo", "Observe for a murmur", "Use only chest radiography and defer echo"], "answer": 1, "explanation": "symptomatic hypoxaemia is an emergency. Why not the others: A. Wait until 24 hours for screening — A symptomatic infant requires assessment now, not screening later.; C. Observe for a murmur — Critical lesions can be silent on auscultation.; D. Use only chest radiography and defer echo — CXR does not replace echo.", "pearl": "Screening algorithms are for well newborns; sick infants need diagnostic care.", "srcAnswer": "B"}, {"num": 25, "level": "", "question": "Which newborn has the strongest indication for targeted fetal echocardiography?", "options": ["Maternal seasonal rhinitis alone", "Uncomplicated pregnancy with normal anomaly scan", "Isolated maternal iron deficiency without fetal abnormality", "Maternal anti-Ro/SSA positivity"], "answer": 3, "explanation": "anti-Ro is associated with congenital conduction disease. Why not the others: A. Maternal seasonal rhinitis alone — Rhinitis is not a recognized cardiac-risk indication.; B. Uncomplicated pregnancy with normal anomaly scan — Routine pregnancy does not itself mandate targeted fetal echo.; C. Isolated maternal iron deficiency without fetal abnormality — Iron deficiency alone is not a fetal echo trigger.", "pearl": "Maternal anti-Ro/La: think congenital heart block risk.", "srcAnswer": "D"}, {"num": 26, "level": "", "question": "A neonate with failed screening has a normal chest radiograph. Which test is best to define cardiac anatomy?", "options": ["Serial plain CXR alone", "Echocardiography with Doppler", "Serum troponin alone", "Single resting ECG"], "answer": 1, "explanation": "echocardiography defines structure and flow. Why not the others: A. Serial plain CXR alone — CXR can be normal in critical lesions.; C. Serum troponin alone — Troponin does not establish congenital anatomy.; D. Single resting ECG — ECG does not define great-vessel anatomy.", "pearl": "Echo is the definitive first-line structural study.", "srcAnswer": "B"}, {"num": 27, "level": "", "question": "An infant is on supplemental oxygen in NICU and has no established CHD. How should the routine screening protocol be applied?", "options": ["Use only left hand and omit foot", "Screen off oxygen when clinically appropriate", "Perform routine pass/fail screening on oxygen without caveat", "Skip screening forever if oxygen was used"], "answer": 1, "explanation": "defer routine screen until off oxygen; evaluate illness directly. Why not the others: A. Use only left hand and omit foot — Sites remain right hand and foot.; C. Perform routine pass/fail screening on oxygen without caveat — Oxygen can mask hypoxaemia; screen is designed for room-air conditions.; D. Skip screening forever if oxygen was used — NICU history does not eliminate need for assessment.", "pearl": "Screening is not equivalent to clinical monitoring during oxygen therapy.", "srcAnswer": "B"}, {"num": 28, "level": "", "question": "A 2-day-old is cyanotic with PaO₂ 48 mmHg in room air (right radial sample). After 10 minutes of 100% oxygen the PaO₂ is 56 mmHg. Which interpretation is most appropriate?", "options": ["Parenchymal lung disease, because PaO₂ has risen", "Normal response, so no further work-up is needed", "Oxygen toxicity from ductal closure", "Fixed shunt: CHD or severe PPHN; do echo"], "answer": 3, "explanation": "a blunted rise to 100% oxygen indicates fixed right-to-left shunting. The test cannot separate cyanotic CHD from severe PPHN, so echocardiography is the next step. Why not the others: A. Parenchymal lung disease, because PaO₂ has risen — A rise of only 8 mmHg is blunted. In lung disease PaO₂ typically rises substantially (often above about 150 mmHg).; B. Normal response, so no further work-up is needed — A normal response would be a large rise; this blunted rise needs evaluation.; C. Oxygen toxicity from ductal closure — Ductal closure from oxygen does not explain a persistently low PaO₂ and is not a diagnosis.", "pearl": "Hyperoxia test: a large PaO₂ rise favours lung disease; a blunted rise means fixed shunt (CHD or severe PPHN) and needs echo.", "srcAnswer": "D"}, {"num": 29, "level": "", "question": "A 26-hour-old has right-hand SpO₂ 97% and foot 94%. Which single finding by itself prevents a PASS?", "options": ["Both sites above 90%", "Right hand above 95%", "Foot below 95%", "No murmur on auscultation"], "answer": 2, "explanation": "a pass needs both sites ≥95%. The 3-point difference alone would be acceptable, but the foot value fails the absolute criterion. Why not the others: A. Both sites above 90% — Being above 90% avoids immediate failure but is not enough to pass.; B. Right hand above 95% — One good site cannot establish a pass; both sites must be at least 95%.; D. No murmur on auscultation — Murmur presence or absence is not a pass criterion.", "pearl": "PASS needs BOTH sites ≥95% AND a difference of ≤3 points.", "srcAnswer": "C"}, {"num": 30, "level": "", "question": "Why is the right hand preferred over the left hand for preductal SpO2?", "options": ["Left hand samples pulmonary artery blood", "Right hand is always postductal", "Right subclavian arises proximal to the duct", "Foot saturation is never clinically useful"], "answer": 2, "explanation": "typical arch anatomy makes right arm a robust preductal site. Why not the others: A. Left hand samples pulmonary artery blood — The left hand also receives systemic arterial blood.; B. Right hand is always postductal — Right hand is selected because it is preductal.; D. Foot saturation is never clinically useful — Foot is essential to detect differential saturation.", "pearl": "The choice of right hand is anatomical, not arbitrary.", "srcAnswer": "C"}, {"num": 31, "level": "", "question": "A preterm infant born at 28 weeks is assessed at 18 weeks chronological age. What is corrected age?", "options": ["46 weeks", "10 weeks", "18 weeks", "6 weeks"], "answer": 3, "explanation": "18 − (40−28) = 6 weeks. Why not the others: A. 46 weeks — 46 weeks is PMA, not corrected age.; B. 10 weeks — 10 weeks subtracts an incorrect prematurity offset.; C. 18 weeks — 18 weeks is chronological age.", "pearl": "Corrected age = chronological age − weeks premature.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q46 — corrected age"}}, {"num": 32, "level": "", "question": "A newborn has a passing pulse-ox screen but harsh systolic murmur, abnormal S2 and tachypnoea. Best action?", "options": ["Discharge; pass overrides examination", "Repeat pulse ox only after one month", "Order routine ECG alone and reassure", "Urgent cardiology review and echo"], "answer": 3, "explanation": "symptomatic pathologic examination warrants echo. Why not the others: A. Discharge; pass overrides examination — Clinical red flags override a screening pass.; B. Repeat pulse ox only after one month — Waiting may miss serious structural CHD.; C. Order routine ECG alone and reassure — ECG cannot exclude important CHD.", "pearl": "Screening complements, never replaces, examination.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day16',label:'Day 16',set:'Quiz 2',href:'Day16/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day16_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 16 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 16 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 16'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 16');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day16:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
