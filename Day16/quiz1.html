<script>
const quiz=[{"num": 1, "level": "", "question": "Which fetal vessel carries oxygenated placental blood toward the inferior vena cava?", "options": ["Umbilical artery", "Superior vena cava", "Ductus arteriosus", "Ductus venosus"], "answer": 3, "explanation": "ductus venosus bypasses much of the hepatic sinusoids. Why not the others: A. Umbilical artery — Umbilical arteries return fetal blood to the placenta.; B. Superior vena cava — Superior vena cava returns blood from the upper fetal body.; C. Ductus arteriosus — Ductus arteriosus connects pulmonary artery to aorta.", "pearl": "Placenta → umbilical vein → ductus venosus → IVC.", "srcAnswer": "D"}, {"num": 2, "level": "", "question": "In fetal circulation, the foramen ovale primarily permits which flow?", "options": ["Pulmonary vein to vena cava", "Left atrium to right atrium", "Right atrium to left atrium", "Aorta to pulmonary artery"], "answer": 2, "explanation": "oxygen-rich IVC blood is preferentially directed across the septum. Why not the others: A. Pulmonary vein to vena cava — Pulmonary venous return is small but enters the left atrium.; B. Left atrium to right atrium — Left-to-right is the opposite of the dominant fetal atrial stream.; D. Aorta to pulmonary artery — Aortic-to-pulmonary flow is not the fetal atrial shunt.", "pearl": "FO bypasses high-resistance fetal lungs.", "srcAnswer": "C"}, {"num": 3, "level": "", "question": "Which vessel carries most right-ventricular output away from high-resistance fetal lungs?", "options": ["Ductus arteriosus", "Umbilical vein", "Coronary sinus", "Ductus venosus"], "answer": 0, "explanation": "pulmonary artery to descending aorta via ductus. Why not the others: B. Umbilical vein — Umbilical vein brings placental blood toward the fetus.; C. Coronary sinus — Coronary sinus drains cardiac veins.; D. Ductus venosus — Ductus venosus bypasses fetal liver.", "pearl": "Fetal PDA is a right-to-left pulmonary-to-systemic bypass.", "srcAnswer": "A"}, {"num": 4, "level": "", "question": "The earliest major pulmonary vascular change after effective aeration at birth is:", "options": ["Decrease in systemic vascular resistance", "Increase in placental venous return", "Rapid decrease in pulmonary vascular resistance", "Increase in pulmonary vascular resistance"], "answer": 2, "explanation": "oxygenation and lung expansion dilate pulmonary arterioles. Why not the others: A. Decrease in systemic vascular resistance — Removal of placenta raises systemic vascular resistance.; B. Increase in placental venous return — Placental circulation is interrupted after birth.; D. Increase in pulmonary vascular resistance — Aeration lowers, not raises, PVR.", "pearl": "Breathing decreases PVR; cord clamping increases SVR.", "srcAnswer": "C"}, {"num": 5, "level": "", "question": "Functional foramen ovale closure after birth is promoted primarily by:", "options": ["A sudden increase in pulmonary arterial resistance", "Pulmonary venous return raising LA pressure", "Higher right atrial than left atrial pressure", "Prostaglandin E1 administration"], "answer": 1, "explanation": "pulmonary flow raises LA pressure relative to RA. Why not the others: A. A sudden increase in pulmonary arterial resistance — Pulmonary resistance normally falls after birth.; C. Higher right atrial than left atrial pressure — Fetal right-atrial dominance maintains the shunt.; D. Prostaglandin E1 administration — PGE1 maintains ductal patency, not FO closure.", "pearl": "FO closure is pressure-driven; anatomical fusion may take longer.", "srcAnswer": "B"}, {"num": 6, "level": "", "question": "Which event most directly favors functional ductus arteriosus constriction?", "options": ["Persistence of fetal right-to-left shunting", "Falling PaO2 and increased PGE2", "Rising PaO₂ with loss of placental prostaglandins", "Rise in pulmonary arterial pressure alone"], "answer": 2, "explanation": "oxygen rise and prostaglandin fall promote constriction. Why not the others: A. Persistence of fetal right-to-left shunting — Persistent fetal shunting indicates failed transition.; B. Falling PaO2 and increased PGE2 — Low oxygen and prostaglandins maintain patency.; D. Rise in pulmonary arterial pressure alone — Pressure change alone is not the principal constrictor signal.", "pearl": "Ductal closure is oxygen/prostaglandin sensitive.", "srcAnswer": "C"}, {"num": 7, "level": "", "question": "Which pairing correctly describes normal postnatal circulatory transition?", "options": ["PVR rises; SVR falls", "Both PVR and SVR fall", "Both PVR and SVR rise", "PVR falls; SVR rises"], "answer": 3, "explanation": "lung aeration lowers PVR; placental removal raises SVR. Why not the others: A. PVR rises; SVR falls — This reverses the true transitional changes.; B. Both PVR and SVR fall — SVR does not fall immediately after cord clamping.; C. Both PVR and SVR rise — PVR falls rather than rises.", "pearl": "After birth, pulmonary and systemic circuits shift from parallel to series.", "srcAnswer": "D"}, {"num": 8, "level": "", "question": "A 36-hour neonate with initially normal feeding develops poor perfusion and weak femoral pulses. Which physiological event can unmask critical systemic outflow obstruction?", "options": ["Ductus arteriosus constricts", "Foramen ovale becomes larger", "Pulmonary venous return falls to zero", "Systemic resistance drops due to placenta reopening"], "answer": 0, "explanation": "ductal closure removes systemic bypass flow. Why not the others: B. Foramen ovale becomes larger — FO size does not explain delayed systemic collapse.; C. Pulmonary venous return falls to zero — Pulmonary venous return increases after birth.; D. Systemic resistance drops due to placenta reopening — Placenta does not reopen.", "pearl": "Shock after 24–72 h with weak femorals: think duct-dependent systemic flow.", "srcAnswer": "A"}, {"num": 9, "level": "", "question": "A newborn with suspected pulmonary atresia has worsening cyanosis as the ductus closes. The ductus was supporting:", "options": ["Coronary sinus outflow", "Pulmonary venous drainage", "Systemic venous return", "Pulmonary arterial blood flow"], "answer": 3, "explanation": "aorta-to-PA ductal flow supplies the lungs. Why not the others: A. Coronary sinus outflow — Coronary sinus drains into the right atrium.; B. Pulmonary venous drainage — Pulmonary veins return blood to the left atrium.; C. Systemic venous return — Systemic venous return does not depend on the ductus.", "pearl": "Pulmonary-flow duct dependence causes progressive cyanosis.", "srcAnswer": "D"}, {"num": 10, "level": "", "question": "A 2-day-old with severe hypoxaemia has preductal saturation 96% and postductal 82%, with a structurally normal heart and high estimated pulmonary pressure. Best physiology?", "options": ["Left-to-right shunt across the PDA only", "Normal transition with no hypoxaemia", "Right-to-left ductal shunting in PPHN", "Obligate intracardiac mixing in ASD"], "answer": 2, "explanation": "high PVR sends desaturated blood from PA to descending aorta. Why not the others: A. Left-to-right shunt across the PDA only — Left-to-right ductal shunt does not explain lower foot saturation.; B. Normal transition with no hypoxaemia — A 14-point differential with hypoxaemia is abnormal.; D. Obligate intracardiac mixing in ASD — An ASD does not necessarily cause this differential pattern.", "pearl": "Differential cyanosis can reflect PPHN as well as structural CHD.", "srcAnswer": "C"}, {"num": 11, "level": "", "question": "In a neonate with suspected duct-dependent systemic blood flow, which intervention may worsen systemic perfusion if it excessively lowers PVR?", "options": ["Prompt cardiology consultation", "Monitoring serial lactate", "Maintaining normothermia", "Hyperventilation and hyperoxia"], "answer": 3, "explanation": "lower PVR can steal flow toward the lungs in parallel physiology. Why not the others: A. Prompt cardiology consultation — Specialist evaluation is essential.; B. Monitoring serial lactate — Lactate trending detects hypoperfusion.; C. Maintaining normothermia — Normothermia supports stability.", "pearl": "Avoid indiscriminate hyperoxia in selected parallel-circulation lesions.", "srcAnswer": "D"}, {"num": 12, "level": "", "question": "A neonate with aortic atresia and restrictive ductus has rising lactate. Which finding most strongly supports duct-dependent systemic flow rather than pulmonary-flow dependence?", "options": ["Isolated respiratory alkalosis", "Poor lower-body perfusion as ductal flow falls", "Normal femoral pulses despite shock", "Severe cyanosis with well-perfused limbs"], "answer": 1, "explanation": "ductus is needed to deliver systemic output. Why not the others: A. Isolated respiratory alkalosis — Respiratory alkalosis is nonspecific.; C. Normal femoral pulses despite shock — Femoral pulses may be reduced in systemic obstruction.; D. Severe cyanosis with well-perfused limbs — Cyanosis can accompany either type.", "pearl": "Low systemic output and lactate after ductal closure demand urgent PGE1 consideration.", "srcAnswer": "B"}, {"num": 13, "level": "", "question": "At 35 weeks PMA, a preterm infant has zone II stage 2 ROP with definite plus disease. Which management classification is appropriate?", "options": ["Type 2 ROP; observe only at long interval", "Stage 1 ROP; routine annual follow-up", "Type 1 ROP; prompt treatment assessment", "Mature retina; discharge screening"], "answer": 2, "explanation": "Type 1 ROP includes zone II stage 2 or 3 with plus. Why not the others: A. Type 2 ROP; observe only at long interval — Zone II stage 2 plus meets Type 1 criteria, not Type 2.; B. Stage 1 ROP; routine annual follow-up — The described ridge is stage 2, not stage 1.; D. Mature retina; discharge screening — Retinal vascularization is not complete.", "pearl": "Zone II stage 2 + plus = ETROP Type 1.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 14, "level": "", "question": "A neonate with severe pulmonary hypertension has right-to-left ductal shunting. Why can right-hand saturation remain higher than foot saturation?", "options": ["Right hand samples ascending-aortic preductal blood", "Foot blood bypasses all systemic arteries", "Right hand is supplied by pulmonary artery", "Right hand receives descending-aortic postductal flow"], "answer": 0, "explanation": "right hand is preductal; ductal admixture affects descending aorta. Why not the others: B. Foot blood bypasses all systemic arteries — Foot blood still travels via systemic arteries.; C. Right hand is supplied by pulmonary artery — Pulmonary artery does not directly supply the right hand.; D. Right hand receives descending-aortic postductal flow — The descending aorta supplies the foot, not right hand.", "pearl": "Always use RIGHT hand for preductal measurement.", "srcAnswer": "A"}, {"num": 15, "level": "", "question": "A neonate has reversed differential cyanosis (right-hand SpO2 lower than foot). Which combination is a classic possibility?", "options": ["Isolated restrictive VSD with normal great arteries", "d-TGA with raised pulmonary pressure", "Innocent pulmonary flow murmur", "Mild isolated ASD with normal pressures"], "answer": 1, "explanation": "oxygenated PA blood can reach postductal aorta in TGA physiology. Why not the others: A. Isolated restrictive VSD with normal great arteries — Restrictive VSD does not usually produce reversed differential saturation.; C. Innocent pulmonary flow murmur — Innocent murmurs do not cause reversed differential cyanosis.; D. Mild isolated ASD with normal pressures — Mild ASD is not an adequate explanation.", "pearl": "Reversed differential saturation is a high-value TGA physiology clue.", "srcAnswer": "B"}, {"num": 16, "level": "", "question": "A cyanotic neonate has poor pulses, severe metabolic acidosis and no murmur. What is the safest interpretation?", "options": ["Only sepsis can cause metabolic acidosis at 48 hours", "Absence of a murmur excludes critical CHD", "Critical CHD possible; stabilize, urgent echo", "A normal prenatal scan rules out ductal lesions"], "answer": 2, "explanation": "hemodynamic instability overrides auscultation. Why not the others: A. Only sepsis can cause metabolic acidosis at 48 hours — Sepsis is important but not exclusive.; B. Absence of a murmur excludes critical CHD — Many critical lesions have no audible murmur.; D. A normal prenatal scan rules out ductal lesions — Prenatal ultrasound does not detect every CHD.", "pearl": "Never use “no murmur” to rule out CCHD.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day16',label:'Day 16',set:'Quiz 1',href:'Day16/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day16_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 16 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 16 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 16'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 16');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day16:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
