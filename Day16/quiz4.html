<script>
const quiz=[{"num": 49, "level": "", "question": "Under the explicitly named AAP 2018 ROP schedule, when is the first retinal examination for an infant born at 24 weeks GA?", "options": ["At 2 weeks chronological age", "31 weeks PMA (7 weeks of age)", "At 4 weeks chronological age", "At 40 weeks PMA"], "answer": 1, "explanation": "31 weeks PMA = 7 weeks PNA. Why not the others: A. At 2 weeks chronological age — AAP 2018 uses later timing for extremely immature infants.; C. At 4 weeks chronological age — 4 weeks is not the specified 24-week schedule entry.; D. At 40 weeks PMA — Waiting until term is unsafe.", "pearl": "Read the named guideline: AAP 2018 is not an Indian schedule.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 11 Q55 — AAP 2018 ROP timing"}}, {"num": 50, "level": "", "question": "A term neonate at 18 hours has upright T waves in V1 with otherwise normal ECG. Interpretation?", "options": ["Diagnostic of hyperkalaemia", "Diagnostic of left bundle-branch block", "Normal age-related pattern", "Diagnostic of severe RVH"], "answer": 2, "explanation": "upright V1 T waves may be normal in the first 2–3 days. Why not the others: A. Diagnostic of hyperkalaemia — Hyperkalaemia needs diffuse characteristic changes and clinical context.; B. Diagnostic of left bundle-branch block — LBBB requires QRS morphology and duration criteria.; D. Diagnostic of severe RVH — Persistent upright V1 T waves after the first week are more concerning.", "pearl": "V1 T waves normally invert during the first week.", "srcAnswer": "C"}, {"num": 51, "level": "", "question": "A 10-day-old has persistently upright T waves in V1. Which statement is best?", "options": ["Consider RV strain or hypertrophy", "Always normal until adolescence", "Diagnostic of left atrial enlargement", "Means isolated hypocalcaemia"], "answer": 0, "explanation": "persistent upright V1 T beyond a week raises RV concern. Why not the others: B. Always normal until adolescence — Most infants invert V1 T waves by the first week.; C. Diagnostic of left atrial enlargement — LA enlargement is assessed using P-wave morphology.; D. Means isolated hypocalcaemia — Hypocalcaemia chiefly affects QT interval.", "pearl": "Persistently upright V1 T after week 1 is a red flag.", "srcAnswer": "A"}, {"num": 52, "level": "", "question": "Which ECG axis finding is particularly associated with AV septal defect?", "options": ["Superior/leftward QRS axis for age", "Pure vertical P-wave axis without QRS changes", "Marked rightward axis as the sole required sign", "Normal age-appropriate axis always"], "answer": 0, "explanation": "endocardial cushion defects often show superior axis. Why not the others: B. Pure vertical P-wave axis without QRS changes — P-wave axis alone is not the signature.; C. Marked rightward axis as the sole required sign — RV dominance alone is less discriminating.; D. Normal age-appropriate axis always — AVSD often has a superior QRS axis.", "pearl": "Superior axis in an infant suggests AVSD or tricuspid atresia.", "srcAnswer": "A"}, {"num": 53, "level": "", "question": "A 3-week infant has QRS axis +120° and normal intervals. Which interpretation is most appropriate?", "options": ["Diagnostic of tricuspid atresia", "Can be within age-related neonatal range", "Diagnostic of ventricular tachycardia", "Clearly pathologic adult-style right-axis deviation"], "answer": 1, "explanation": "newborns may have a rightward axis. Why not the others: A. Diagnostic of tricuspid atresia — Tricuspid atresia often has superior/leftward axis.; C. Diagnostic of ventricular tachycardia — VT diagnosis depends on rhythm and QRS complexes.; D. Clearly pathologic adult-style right-axis deviation — Adult axis standards cannot be transplanted to infancy.", "pearl": "Neonatal +120° can be physiological.", "srcAnswer": "B"}, {"num": 54, "level": "", "question": "A 5-year-old with syncope has a corrected QT interval clearly prolonged on repeated ECG. What is the key next step?", "options": ["Urgent long-QT and arrhythmia work-up", "Diagnose PDA from QTc", "Reassure as normal neonatal physiology", "Prescribe an innocent-murmur label"], "answer": 0, "explanation": "review drugs/electrolytes, family history and cardiology evaluation. Why not the others: B. Diagnose PDA from QTc — QTc prolongation does not identify PDA.; C. Reassure as normal neonatal physiology — Age 5 is not a neonatal ECG.; D. Prescribe an innocent-murmur label — Syncope with prolonged QTc is not benign.", "pearl": "Syncope plus QT prolongation warrants serious assessment.", "srcAnswer": "A"}, {"num": 55, "level": "", "question": "A 9-year-old with a regular narrow-complex tachycardia at 230/min has no obvious P waves. Most useful initial ECG interpretation?", "options": ["Atrial standstill with ventricular escape", "Complete heart block", "Likely SVT; assess stability", "Normal sinus tachycardia solely from age"], "answer": 2, "explanation": "rate, regularity and P-wave relation suggest SVT. Why not the others: A. Atrial standstill with ventricular escape — Escape rhythm is typically slow.; B. Complete heart block — Heart block generally causes bradycardia, not this pattern.; D. Normal sinus tachycardia solely from age — Sinus tachycardia usually has identifiable sinus P waves and physiologic context.", "pearl": "Rate alone is not enough; assess regularity, QRS and P waves.", "srcAnswer": "C"}, {"num": 56, "level": "", "question": "A 2-month-old with a known structural lesion has a QRS axis -60°. What does this finding suggest?", "options": ["Normal adult QRS axis", "Superior axis; correlate with lesion", "Physiologic newborn right axis", "Isolated sinus arrhythmia"], "answer": 1, "explanation": "a superior axis can occur with AVSD/tricuspid atresia. Why not the others: A. Normal adult QRS axis — -60° is not a normal adult axis.; C. Physiologic newborn right axis — A negative axis is not the typical neonatal right axis.; D. Isolated sinus arrhythmia — Sinus arrhythmia changes RR intervals, not QRS axis.", "pearl": "A superior QRS axis is a structural clue, not a diagnosis.", "srcAnswer": "B"}, {"num": 57, "level": "", "question": "A 4-year-old has an ECG with upright T in V1, deep S in V6 and rightward axis beyond age norms. Most consistent with:", "options": ["An isolated venous hum", "Isolated LVH", "Right ventricular hypertrophy/strain", "Normal transition of a newborn"], "answer": 2, "explanation": "combined axis/voltage/repolarization findings suggest RV pressure load. Why not the others: A. An isolated venous hum — A venous hum is not an ECG diagnosis.; B. Isolated LVH — LVH favors different lateral-lead voltage patterns.; D. Normal transition of a newborn — The child is too old for neonatal T-wave pattern.", "pearl": "Interpret ECG patterns in combination and against age.", "srcAnswer": "C"}, {"num": 58, "level": "", "question": "A term infant at 2 days has rightward axis and positive T in V1. Which finding would most strengthen a pathological interpretation?", "options": ["A heart rate of 130/min during quiet sleep", "Normal feeding and perfusion", "No symptoms and normal oxygenation", "Cyanosis with RV pressure overload on echo"], "answer": 3, "explanation": "concordant clinical/echo findings change significance. Why not the others: A. A heart rate of 130/min during quiet sleep — 130/min can be a normal neonatal rate.; B. Normal feeding and perfusion — Normal perfusion is reassuring.; C. No symptoms and normal oxygenation — Normal clinical status favors age-related physiology.", "pearl": "An isolated neonatal rightward axis is not equivalent to RVH.", "srcAnswer": "D"}, {"num": 59, "level": "", "question": "A child has a PR interval of 0.10 s at age 2 years. What is the best interpretation?", "options": ["Proof of ventricular pre-excitation", "May be normal; check rhythm and tracing", "Always first-degree AV block", "Diagnostic of complete AV block"], "answer": 1, "explanation": "pediatric PR intervals are shorter than adult norms. Why not the others: A. Proof of ventricular pre-excitation — Pre-excitation also needs delta wave/short PR criteria.; C. Always first-degree AV block — First-degree block requires age-adjusted prolonged PR.; D. Diagnostic of complete AV block — Complete block needs AV dissociation.", "pearl": "Age-specific intervals prevent false conduction diagnoses.", "srcAnswer": "B"}, {"num": 60, "level": "", "question": "A 3-year-old with known AVSD has an ECG showing a superior QRS axis. Which conclusion is defensible?", "options": ["ECG suggests pattern; echo defines anatomy", "ECG alone quantifies the shunt size", "Superior axis excludes any structural defect", "ECG replaces echocardiography for surgical planning"], "answer": 0, "explanation": "ECG supports but does not replace echocardiography. Why not the others: B. ECG alone quantifies the shunt size — Shunt size is not directly quantified by axis.; C. Superior axis excludes any structural defect — Superior axis is compatible with AVSD.; D. ECG replaces echocardiography for surgical planning — Surgical anatomy requires imaging.", "pearl": "ECG is a clue; echo is the structural arbiter.", "srcAnswer": "A"}, {"num": 61, "level": "", "question": "A teenager has palpitations and a short PR with delta wave in sinus rhythm. Which ECG concept is illustrated?", "options": ["Ventricular pre-excitation (accessory pathway)", "Physiologic newborn RV dominance", "Isolated first-degree AV block", "Atrial enlargement only"], "answer": 0, "explanation": "delta wave + short PR suggest WPW pattern. Why not the others: B. Physiologic newborn RV dominance — RV dominance does not produce a delta wave.; C. Isolated first-degree AV block — First-degree AV block prolongs PR.; D. Atrial enlargement only — Atrial enlargement changes P waves.", "pearl": "Recognize WPW pattern; clinical arrhythmia work-up is Day 21.", "srcAnswer": "A"}, {"num": 62, "level": "", "question": "A 6-week-old with failure to thrive has a superior QRS axis and fixed wide S2 splitting. Which next test best clarifies the suspected structural mechanism?", "options": ["Routine serial CXR alone", "A single troponin value", "Echocardiography with Doppler", "Exercise treadmill ECG"], "answer": 2, "explanation": "define atrial/AV septal anatomy and flow. Why not the others: A. Routine serial CXR alone — CXR cannot define septal defects.; B. A single troponin value — Troponin is not an anatomic test.; D. Exercise treadmill ECG — Infant treadmill testing is inappropriate.", "pearl": "Combine exam and ECG, then confirm with echo.", "srcAnswer": "C"}, {"num": 63, "level": "", "question": "A 4-day-old with suspected CHD has ECG rightward axis but normal oxygenation and femoral pulses. What is the safest inference?", "options": ["Normal oxygenation rules out every CHD", "ECG is definitive and no echo is ever needed", "Rightward axis alone does not diagnose CHD", "Rightward axis confirms pulmonary atresia"], "answer": 2, "explanation": "interpret within age and clinical context. Why not the others: A. Normal oxygenation rules out every CHD — Many noncyanotic CHDs have normal saturations.; B. ECG is definitive and no echo is ever needed — Echo is used if other indications exist.; D. Rightward axis confirms pulmonary atresia — Pulmonary atresia requires clinical/imaging evidence.", "pearl": "Do not create disease from an isolated normal-age ECG feature.", "srcAnswer": "C"}, {"num": 64, "level": "", "question": "A cyanotic neonate has a narrow mediastinum and an “egg-on-string” cardiac silhouette. Classic association?", "options": ["Coarctation of aorta", "Truncus arteriosus", "Isolated secundum ASD", "d-transposition (d-TGA)"], "answer": 3, "explanation": "narrow pedicle and ovoid heart classically suggest d-TGA. Why not the others: A. Coarctation of aorta — Coarctation lacks this classic neonatal silhouette.; B. Truncus arteriosus — Truncus has variable cardiomegaly and increased flow.; C. Isolated secundum ASD — ASD does not cause egg-on-string appearance.", "pearl": "Egg-on-string is suggestive, not sufficiently sensitive to rule in/out TGA.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day16',label:'Day 16',set:'Quiz 4',href:'Day16/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day16_QuizSet4_Q49-64_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 16 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–64</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 16 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 16'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 16');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day16:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
