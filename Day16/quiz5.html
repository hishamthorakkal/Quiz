<script>
const quiz=[{"num": 65, "level": "", "question": "A clinically stable preterm infant receives 125 kcal/kg/day and 3.8 g/kg/day enteral protein. Which interpretation is most defensible?", "options": ["Energy is too low for any preterm infant", "Protein is always toxic at this intake", "Both are necessarily excessive", "Both fall within usual target ranges"], "answer": 3, "explanation": "both values fit common preterm ranges with monitoring. Why not the others: A. Energy is too low for any preterm infant — 125 kcal/kg/day is within many commonly used energy targets.; B. Protein is always toxic at this intake — 3.8 g/kg/day can be appropriate depending on gestation/clinical status.; C. Both are necessarily excessive — These values are not automatically excessive.", "pearl": "Interpret preterm nutrition as ranges, not single magic numbers.", "srcAnswer": "D", "retest": {"stage": "R2", "from": "Day 8 Q41 — preterm nutrition targets"}}, {"num": 66, "level": "", "question": "A cyanotic child has a boot-shaped cardiac silhouette with diminished pulmonary vascular markings. Most classic lesion?", "options": ["Tetralogy of Fallot", "Large PDA", "Unobstructed TAPVC", "Isolated VSD"], "answer": 0, "explanation": "RV hypertrophy and pulmonary outflow obstruction produce classic boot. Why not the others: B. Large PDA — Large PDA usually increases pulmonary flow.; C. Unobstructed TAPVC — Unobstructed TAPVC often increases pulmonary flow.; D. Isolated VSD — Isolated VSD generally has pulmonary plethora if large.", "pearl": "Boot-shaped heart plus oligemia suggests TOF.", "srcAnswer": "A"}, {"num": 67, "level": "", "question": "A child with cyanosis has a “snowman” appearance on chest radiograph. Which physiology should be considered?", "options": ["Supracardiac TAPVC (vertical vein/SVC)", "Isolated pulmonary stenosis", "Critical aortic stenosis", "Obstructed infracardiac TAPVC in a neonate"], "answer": 0, "explanation": "supracardiac TAPVC may produce snowman when venous channels enlarge. Why not the others: B. Isolated pulmonary stenosis — Isolated PS does not enlarge supracardiac venous pathway.; C. Critical aortic stenosis — Aortic stenosis does not cause snowman.; D. Obstructed infracardiac TAPVC in a neonate — Obstructed infracardiac TAPVC often shows pulmonary edema, not classic snowman.", "pearl": "Snowman sign is usually a later appearance, not a reliable early-neonate sign.", "srcAnswer": "A"}, {"num": 68, "level": "", "question": "A 6-week infant has tachypnoea, cardiomegaly and increased pulmonary vascular markings. Which hemodynamic group fits best?", "options": ["Normal cardiopulmonary circulation", "Large L→R shunt with overcirculation", "Severe isolated pulmonary atresia", "Pure reduced pulmonary blood flow physiology"], "answer": 1, "explanation": "increased pulmonary flow and volume load can cause these findings. Why not the others: A. Normal cardiopulmonary circulation — These findings are not typical normal findings.; C. Severe isolated pulmonary atresia — Pulmonary atresia usually reduces native pulmonary flow.; D. Pure reduced pulmonary blood flow physiology — Oligemic lesions show reduced vascularity.", "pearl": "Plethoric lung fields point toward increased pulmonary flow.", "srcAnswer": "B"}, {"num": 69, "level": "", "question": "A cyanotic newborn has a normal-sized heart with markedly reduced pulmonary vascularity. What general physiology is suggested?", "options": ["Pure pulmonary edema from LV failure", "Pulmonary venous obstruction with edema", "Reduced flow from outflow obstruction", "Unobstructed high-flow left-to-right shunt"], "answer": 2, "explanation": "pulmonary oligemia suggests reduced flow. Why not the others: A. Pure pulmonary edema from LV failure — LV failure usually increases venous congestion.; B. Pulmonary venous obstruction with edema — Pulmonary venous obstruction gives congestion/edema.; D. Unobstructed high-flow left-to-right shunt — High-flow shunts increase vascularity.", "pearl": "Oligemia versus plethora is more robust than isolated silhouette signs.", "srcAnswer": "C"}, {"num": 70, "level": "", "question": "A term neonate has severe hypoxaemia, diffuse pulmonary edema on CXR and a small or normal heart. Which structural diagnosis is an important urgent consideration?", "options": ["Mild pulmonary stenosis", "Obstructed TAPVC", "Tiny PDA", "Isolated small ASD"], "answer": 1, "explanation": "pulmonary venous obstruction produces severe congestion. Why not the others: A. Mild pulmonary stenosis — Mild PS reduces pulmonary flow rather than causing venous edema.; C. Tiny PDA — Tiny PDA cannot explain the syndrome.; D. Isolated small ASD — Small ASD rarely causes neonatal edema.", "pearl": "Obstructed TAPVC can mimic primary lung disease.", "srcAnswer": "B"}, {"num": 71, "level": "", "question": "A neonatal CXR shows an enlarged cardiac silhouette on an AP supine film. What is the key limitation?", "options": ["Cardiomegaly alone defines a septal defect", "AP films always underestimate heart size", "Thymic shadow proves congenital cardiomyopathy", "Magnification and thymus mimic enlargement"], "answer": 3, "explanation": "projection, rotation and thymus confound apparent size. Why not the others: A. Cardiomegaly alone defines a septal defect — Cardiomegaly is nonspecific.; B. AP films always underestimate heart size — AP films often magnify rather than underestimate.; C. Thymic shadow proves congenital cardiomyopathy — Thymus is a normal mediastinal structure.", "pearl": "Check projection and thymus before calling cardiomegaly.", "srcAnswer": "D"}, {"num": 72, "level": "", "question": "A 10-year-old with upper-limb hypertension and weak femoral pulses has inferior rib notching on chest radiograph. Most direct mechanism?", "options": ["Pulmonary artery enlargement", "Enlarged intercostal collateral arteries", "Rib fracture callus from exercise", "Thymic hyperplasia"], "answer": 1, "explanation": "collateral intercostal vessels remodel rib undersurfaces. Why not the others: A. Pulmonary artery enlargement — Pulmonary artery enlargement does not erode inferior rib margins.; C. Rib fracture callus from exercise — Symmetric notching is not fracture callus.; D. Thymic hyperplasia — Thymus is unrelated in an older child.", "pearl": "Rib notching is usually a later collateral-flow clue, not neonatal.", "srcAnswer": "B"}, {"num": 73, "level": "", "question": "A thriving 2-week-old term infant has a soft systolic murmur at the left upper sternal border radiating to the axillae and back. SpO₂ is 99% and pulses are normal. What is the most likely explanation?", "options": ["Physiological peripheral pulmonary stenosis murmur", "Valvar pulmonary stenosis needing valvotomy", "A large VSD", "Coarctation of the aorta"], "answer": 0, "explanation": "newborn peripheral pulmonary branch flow murmur radiates to axillae/back and usually resolves by about 6 months. Why not the others: B. Valvar pulmonary stenosis needing valvotomy — Valvar pulmonary stenosis gives a louder ejection murmur with click or thrill and does not typically radiate to the axillae.; C. A large VSD — A large VSD gives a harsh holosystolic murmur at the lower sternal border, with symptoms later.; D. Coarctation of the aorta — Coarctation presents with weak femoral pulses and an arm–leg pressure difference.", "pearl": "Newborn peripheral PS murmur: soft, radiates to axillae/back, resolves by about 6 months.", "srcAnswer": "A"}, {"num": 74, "level": "", "question": "A cyanotic neonate has diffuse pulmonary edema, and echo shows obstructed infracardiac TAPVC. What is the role of prostaglandin E1?", "options": ["Contraindicated because it closes the duct", "Useful only after surgical repair", "Unhelpful and possibly harmful; urgent surgery", "Lifesaving; start it to keep the duct open"], "answer": 2, "explanation": "PGE1 does not relieve pulmonary venous obstruction and may worsen edema by raising pulmonary flow. Urgent surgical repair is the definitive step. Why not the others: A. Contraindicated because it closes the duct — PGE1 keeps the duct open, it does not close it.; B. Useful only after surgical repair — There is no recognised role for PGE1 after repair in this lesion.; D. Lifesaving; start it to keep the duct open — Here the problem is pulmonary venous obstruction, not duct dependence; keeping the duct open does not relieve it.", "pearl": "Obstructed TAPVC: surgery is urgent; PGE1 does not fix pulmonary venous obstruction.", "srcAnswer": "C"}, {"num": 75, "level": "", "question": "A newborn with maternal pregestational diabetes has a normal anomaly scan. Which statement about CHD risk is best?", "options": ["Only ECG is indicated if symptoms develop", "Normal scan eliminates all risk", "No neonatal examination is necessary", "Pregestational diabetes (consider fetal echo)"], "answer": 3, "explanation": "maternal diabetes is a recognized fetal echo risk factor. Why not the others: A. Only ECG is indicated if symptoms develop — Targeted fetal assessment is relevant during pregnancy.; B. Normal scan eliminates all risk — Prenatal imaging is not perfectly sensitive.; C. No neonatal examination is necessary — Every newborn still needs a clinical exam.", "pearl": "Maternal risk factors should inform fetal echo referral.", "srcAnswer": "D"}, {"num": 76, "level": "", "question": "A term infant with tachypnoea has SpO2 97%/97%, normal femorals, a harsh pansystolic LLSB murmur and poor weight gain at 8 weeks. Next diagnostic priority?", "options": ["Doppler echo for L→R shunt", "Treat isolated neonatal PPHN", "Assume screening excluded CHD", "Routine ECG alone to quantify shunt"], "answer": 0, "explanation": "noncyanotic VSD-type lesions can cause delayed pulmonary overcirculation. Why not the others: B. Treat isolated neonatal PPHN — PPHN is not suggested by normal oxygenation at 8 weeks.; C. Assume screening excluded CHD — Pulse oximetry does not detect many acyanotic defects.; D. Routine ECG alone to quantify shunt — ECG cannot quantify septal flow.", "pearl": "A normal CCHD screen does not rule out a symptomatic VSD.", "srcAnswer": "A"}, {"num": 77, "level": "", "question": "A neonate has holoprosencephaly, postaxial polydactyly and aplasia cutis of the scalp. Which aneuploidy is most characteristic?", "options": ["Trisomy 21", "Trisomy 18", "Trisomy 13", "Monosomy X"], "answer": 2, "explanation": "Patau syndrome combines midline defects, polydactyly and scalp aplasia. Why not the others: A. Trisomy 21 — Trisomy 21 more often causes hypotonia and AVSD.; B. Trisomy 18 — Trisomy 18 often causes overlapping fingers and rocker-bottom feet.; D. Monosomy X — Turner syndrome causes short stature/lymphoedema and coarctation.", "pearl": "Patau = holoprosencephaly + polydactyly + scalp defects.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q30 — Patau vs Down"}}, {"num": 78, "level": "", "question": "A neonate becomes pale and shocked on day 3, with metabolic acidosis and barely palpable femoral pulses. Which immediate pathway is most appropriate?", "options": ["Defer echo until a repeat chest radiograph", "Reassure because no cyanosis is visible", "Observe overnight for a murmur", "Resuscitate; urgent PGE1 and echo transfer"], "answer": 3, "explanation": "treat shock and preserve ductal flow pending urgent imaging. Why not the others: A. Defer echo until a repeat chest radiograph — Repeat CXR must not delay emergency stabilization.; B. Reassure because no cyanosis is visible — Pallor/shock can signal critical CHD without cyanosis.; C. Observe overnight for a murmur — Murmur absence does not exclude obstruction.", "pearl": "Ductal-dependent systemic lesions may present as shock rather than cyanosis.", "srcAnswer": "D"}, {"num": 79, "level": "", "question": "A 2-day-old has persistent preductal and postductal saturations near 82%, little respiratory distress and no audible murmur. Which additional pattern most strongly favors a cyanotic cardiac mixing lesion over primary pulmonary parenchymal disease?", "options": ["Profound cyanosis out of proportion to respiratory distress, with relatively clear lung fields", "Rapid improvement to normal saturation after airway recruitment and supplemental oxygen", "Markedly labile pre/postductal saturation gradient with loud P2 and signs of raised pulmonary vascular resistance", "Pronounced retractions and grunting with bilateral air-space infiltrates on chest radiograph"], "answer": 0, "explanation": "Best discriminator here: severe hypoxaemia with limited parenchymal disease raises concern for cyanotic CHD, including mixing physiology; urgent echocardiography remains essential. Why not the others: B. Rapid improvement to normal saturation after airway recruitment and supplemental oxygen — Favors a reversible respiratory component rather than persistent fixed cyanotic mixing physiology.; C. Markedly labile pre/postductal saturation gradient with loud P2 and signs of raised pulmonary vascular resistance — Supports pulmonary hypertension/ductal shunting; it does not specifically favor an intracardiac mixing lesion.; D. Pronounced retractions and grunting with bilateral air-space infiltrates on chest radiograph — More consistent with clinically significant parenchymal lung disease, although mixed pathology can occur.", "pearl": "Profound cyanosis despite little lung disease warrants urgent echocardiography; absence of a murmur does not exclude critical CHD.", "srcAnswer": "A"}, {"num": 80, "level": "", "question": "An infant has a screening pass at 26 hours, then develops poor perfusion at 48 hours. ECG shows age-appropriate rightward axis; CXR is nonspecific. What is the best next action?", "options": ["Repeat routine screening at 1 month only", "Urgent echo and stabilize", "Rule out CHD using the normal ECG", "Treat as innocent murmur if no thrill"], "answer": 1, "explanation": "clinical deterioration supersedes reassuring adjuncts. Why not the others: A. Repeat routine screening at 1 month only — Delay is unsafe in a potentially duct-dependent lesion.; C. Rule out CHD using the normal ECG — Age-appropriate ECG does not exclude anatomy.; D. Treat as innocent murmur if no thrill — Absence of thrill is not reassuring in shock.", "pearl": "Never let three imperfect screening clues outweigh shock.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day16',label:'Day 16',set:'Quiz 5',href:'Day16/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day16_QuizSet5_Q65-80_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 16 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 65–80</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 16 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 16'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 16');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day16:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
