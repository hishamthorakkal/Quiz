const quiz=[{"num": 1, "level": "Basic/Recall", "question": "Which radiographic finding defines definite (Bell stage II) NEC in the appropriate clinical context?", "options": ["Portal venous gas alone", "Persistent nonspecific bowel dilatation", "Isolated gastric residual", "Pneumatosis intestinalis"], "answer": 3, "explanation": "Pneumatosis is gas within the bowel wall and is the classic defining imaging feature of definite NEC. Closest distractor: Portal venous gas supports severity but pneumatosis is the classic defining bowel-wall sign. Why not the others: A. Portal venous gas alone — Portal gas supports NEC but does not replace the bowel-wall pneumatosis criterion in the classic staging framework.; B. Persistent nonspecific bowel dilatation — Dilated loops are nonspecific and occur in ileus/sepsis/CPAP belly.; C. Isolated gastric residual — Residuals alone are too nonspecific to define NEC.", "pearl": "Pneumatosis = definite NEC; free intraperitoneal air upgrades the disease to perforated NEC.", "srcAnswer": "D"}, {"num": 2, "level": "Basic/Recall", "question": "Pneumoperitoneum in NEC corresponds to which modified Bell category?", "options": ["Stage IIB", "Stage IIIA", "Stage IIA", "Stage IIIB"], "answer": 3, "explanation": "Bell IIIB is advanced NEC with bowel perforation and free intraperitoneal air. Closest distractor: The decisive discriminator between IIIA and IIIB is radiographic free intraperitoneal air.", "pearl": "IIIA = advanced disease without free air; IIIB = perforated disease with free air.", "srcAnswer": "D"}, {"num": 3, "level": "Basic/Recall", "question": "D10 contains approximately how much glucose?", "options": ["100 mg/mL", "1000 mg/mL", "1 mg/mL", "10 mg/mL"], "answer": 0, "explanation": "A 10% w/v solution contains 10 g/100 mL = 100 mg/mL. Closest distractor: Convert % w/v to g/100 mL before converting to mg/mL.", "pearl": "D10 = 100 mg/mL; D12.5 = 125 mg/mL.", "srcAnswer": "A"}, {"num": 4, "level": "Basic/Recall", "question": "Glucose infusion rate (GIR) is expressed as", "options": ["mg/kg/min", "g/kg/day", "kcal/kg/min", "mL/kg/hour"], "answer": 0, "explanation": "GIR standardizes glucose delivery as milligrams of glucose per kilogram per minute. Closest distractor: GIR is a rate of glucose mass, not fluid volume or energy. Why not the others: B. g/kg/day — g/kg/day is used for daily macronutrient dosing; GIR specifically uses mg/kg/min.; C. kcal/kg/min — kcal/kg/min is an energy-rate unit; GIR is expressed as glucose mass in mg/kg/min.", "pearl": "Never mix GIR units with daily carbohydrate grams.", "srcAnswer": "A"}, {"num": 5, "level": "Basic/Recall", "question": "For a hospitalized VLBW infant, the preferred enteral substrate is", "options": ["Preterm formula before human milk", "Unfortified term formula", "Pasteurized donor human milk before MOM", "Mother's own milk, appropriately fortified"], "answer": 3, "explanation": "MOM is first-line; fortification closes the protein/mineral/energy gap of unfortified milk. Closest distractor: PDHM is the preferred substitute, not preferred over available MOM. Why not the others: A. Preterm formula before human milk — Formula is used when human milk options are unavailable/declined; it is not preferred over available mother's own milk or donor human milk in the VLBW context.; B. Unfortified term formula — Formula is used when human milk options are unavailable/declined; it is not preferred over available mother's own milk or donor human milk in the VLBW context.; C. Pasteurized donor human milk before MOM — PDHM is the preferred substitute when MOM is insufficient/unavailable; it does not outrank available mother's own milk.", "pearl": "Hierarchy: fortified MOM first, PDHM when MOM is insufficient/unavailable, then preterm formula when donor milk is unavailable/declined.", "srcAnswer": "D"}, {"num": 6, "level": "Basic/Recall", "question": "The 2026 AAP VLBW human-milk clinical report states that PDHM can optimally continue until NEC risk is low at approximately", "options": ["40–42 weeks PMA in every infant", "Only the first 72 hours", "30–32 weeks PMA", "34–36 weeks PMA"], "answer": 3, "explanation": "AAP 2026 identifies approximately 34–36 weeks PMA as a reasonable point when NEC risk has fallen enough for many units to transition from donor milk. Closest distractor: The AAP explicitly frames this as approximate and policy-dependent. Why not the others: A. 40–42 weeks PMA in every infant — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The AAP explicitly frames this as approximate and policy-dependent.", "pearl": "34–36 weeks PMA is a policy anchor, not an absolute biologic cutoff for every infant.", "srcAnswer": "D"}, {"num": 7, "level": "Basic/Recall", "question": "A commonly used trophic/minimal enteral feeding range in a stable preterm infant is approximately", "options": ["100–120 mL/kg/day", "10–20 mL/kg/day", "40–60 mL/kg/day", "1–2 mL/kg/day"], "answer": 1, "explanation": "Minimal enteral nutrition commonly uses small volumes around 10–20 mL/kg/day while PN provides most nutrients. Closest distractor: Values near 100 mL/kg/day are no longer trophic feeding.", "pearl": "Trophic feeds prime the gut; they are not intended to meet full nutritional requirements.", "srcAnswer": "B"}, {"num": 8, "level": "Conceptual", "question": "Why does portal venous gas appear more peripheral in the liver than pneumobilia?", "options": ["Portal gas is actually extrahepatic", "Pneumobilia is confined to bowel loops", "Portal venous flow carries gas into smaller peripheral portal radicals", "Bile flow always carries gas toward the capsule"], "answer": 2, "explanation": "Gas entering the portal circulation follows progressively smaller intrahepatic portal branches toward the periphery, whereas biliary gas tends to be central near the hilum. Closest distractor: Direction/distribution of the branching gas is the decisive feature. Why not the others: B. Pneumobilia is confined to bowel loops — Pneumobilia is predominantly central/hilar biliary gas; the stem describes the peripheral portal distribution instead.; D. Bile flow always carries gas toward the capsule — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, Direction/distribution of the branching gas is the decisive feature.", "pearl": "Peripheral branching hepatic lucency = portal venous gas; central hilar branching = pneumobilia.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "Why is human-milk fortification usually required in VLBW infants even when milk volume is adequate?", "options": ["Human milk lacks all essential amino acids", "Unfortified human milk may not supply enough protein, calcium, phosphorus and energy for preterm accretion", "Fortifier sterilizes expressed milk", "Fortifier is primarily an NEC treatment"], "answer": 1, "explanation": "Preterm nutrient accretion requirements exceed what unfortified human milk reliably provides at practical volumes. Closest distractor: The issue is nutrient density, not absence of human-milk benefits.", "pearl": "Fortification targets growth and mineral/protein accretion, not sterilization.", "srcAnswer": "B"}, {"num": 10, "level": "Conceptual", "question": "Which feature most strongly favors spontaneous intestinal perforation (SIP) over NEC in an ELBW infant?", "options": ["Portal venous gas with abdominal wall edema", "Bloody stool with thrombocytopenia and metabolic acidosis", "Isolated early perforation with free air but no pneumatosis or portal venous gas", "Diffuse pneumatosis involving multiple loops"], "answer": 2, "explanation": "SIP is typically focal, earlier, and lacks the diffuse inflammatory bowel-wall gas pattern of NEC. Closest distractor: Absence of diffuse NEC imaging/systemic pattern favors SIP.", "pearl": "Free air is not synonymous with NEC; always ask whether pneumatosis/portal gas preceded perforation.", "srcAnswer": "C"}, {"num": 11, "level": "Conceptual", "question": "Why should gastric residual volume not be used alone to diagnose NEC?", "options": ["Residual volume directly measures bowel perfusion", "Residuals are nonspecific and must be interpreted with systemic status, abdominal findings and imaging", "Any residual proves mucosal necrosis", "A residual is equivalent to bilious vomiting"], "answer": 1, "explanation": "Residuals can occur in immature gastric emptying and many benign settings; NEC requires a broader pathologic pattern. Closest distractor: The key discriminator is the accompanying systemic/abdominal/imaging context.", "pearl": "A small nonbilious residual in a well infant is very different from bilious aspirate plus abdominal/systemic illness.", "srcAnswer": "B"}, {"num": 12, "level": "Conceptual", "question": "Why are standardized preterm feeding protocols favored over highly variable bedside advancement?", "options": ["They require the same rate for every infant", "They remove the need for clinical assessment", "They eliminate NEC completely", "They reduce practice variation while supporting earlier human-milk feeding and consistent safety triggers"], "answer": 3, "explanation": "Protocols improve consistency but still require individualized pauses/escalation for illness and red flags. Closest distractor: A protocol guides the pathway; clinical instability still overrides the schedule. Why not the others: A. They require the same rate for every infant — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, A protocol guides the pathway; clinical instability still overrides the schedule.; C. They eliminate NEC completely — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, A protocol guides the pathway; clinical instability still overrides the schedule.", "pearl": "Standardization is not rigidity.", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "Compared with formula, donor human milk in very preterm/VLBW infants is best described as", "options": ["Associated with lower NEC risk but potentially slower growth unless nutrient delivery is optimized", "Equivalent NEC risk and always faster growth", "Nutritionally complete without fortification", "Contraindicated once fortification is needed"], "answer": 0, "explanation": "Trials/meta-analyses support lower NEC with donor milk versus formula, while growth may be slower without adequate fortification. Closest distractor: NEC protection and growth velocity point in different directions unless fortification is optimized. Why not the others: B. Equivalent NEC risk and always faster growth — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, NEC protection and growth velocity point in different directions unless fortification is optimized.", "pearl": "Do not turn an association into the claim that a single formula directly 'causes' NEC.", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "Why should routine probiotic use be interpreted in a guideline-specific way?", "options": ["AAP mandates one universal product", "Efficacy and safety depend on strain/product quality and societies differ in recommendations", "NNF prohibits probiotics in all LBW infants", "All probiotics are pharmacologically identical"], "answer": 1, "explanation": "Evidence is preparation-specific, and regulatory/product-quality differences lead societies to different implementation recommendations. Closest distractor: The decisive issue is society/product context, not whether the word 'probiotic' appears. Why not the others: A. AAP mandates one universal product — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The decisive issue is society/product context, not whether the word 'probiotic' appears.", "pearl": "Follow the society named in the stem: NNF practice may be more permissive than AAP.", "srcAnswer": "B"}, {"num": 15, "level": "Conceptual", "question": "Why can abrupt interruption of a glucose-containing PN infusion cause hypoglycemia?", "options": ["IV lipid immediately blocks hepatic glycogenolysis", "The infant becomes insulin deficient", "Amino acids directly consume all circulating glucose", "A sudden fall in exogenous glucose may exceed the infant's ability to maintain plasma glucose"], "answer": 3, "explanation": "Preterm infants have limited glycogen stores and metabolic reserve; abrupt loss of a significant GIR can precipitate hypoglycemia. Closest distractor: The mechanism is sudden substrate withdrawal in an infant with limited reserve. Why not the others: B. The infant becomes insulin deficient — Insulin may be considered only after auditing glucose delivery and reversible causes; it is not the automatic first response to neonatal hyperglycemia.", "pearl": "Whenever PN stops unexpectedly, think about glucose continuity first.", "srcAnswer": "D"}, {"num": 16, "level": "", "question": "A ventilated neonate has sudden desaturation and a low-exhaled-volume alarm. The ETT depth is unchanged, and inspection shows the ventilator tubing detached at the humidifier outlet. Which DOPE category best fits?", "options": ["Displacement", "Obstruction", "Pneumothorax", "Equipment failure"], "answer": 3, "explanation": "The failure is in the ventilator circuit itself, so the DOPE category is Equipment failure. Closest distractor: DOPE 'D' concerns tube position; 'E' concerns ventilator/circuit/oxygen-source failure. Why not the others: A. Displacement — ETT migration is not described; the visible problem is in the circuit.; B. Obstruction — Obstruction implies a blocked/kinked ETT or mucus plug, not detached tubing.; C. Pneumothorax — Pneumothorax is a patient-side cause and does not explain the visible circuit disconnection.", "pearl": "If the circuit is visibly disconnected, classify the problem as Equipment failure.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day8',label:'Day 8',set:'Quiz 1',href:'Day8/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

}

function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 8 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 8'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 8');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day8:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=4041b023"></script></body></html>
