const quiz=[{"num": 17, "level": "Conceptual", "question": "Why is urine output/renal function checked before adding substantial potassium to neonatal PN?", "options": ["Impaired renal potassium excretion can rapidly produce dangerous hyperkalemia", "Potassium cannot be given with amino acids", "Potassium prevents urine production", "Renal function only affects sodium"], "answer": 0, "explanation": "Preterm renal function is immature; oliguria/AKI increases the risk of potassium accumulation. Closest distractor: The concern is accumulation from reduced excretion.", "pearl": "Electrolytes are prescribed to physiology, not by a fixed bag recipe.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "A rising triglyceride concentration during neonatal PN most directly prompts reassessment of", "options": ["Intravenous lipid dose and clearance context", "Amino-acid dose only", "Human-milk fortification", "Calcium-phosphate ratio only"], "answer": 0, "explanation": "Hypertriglyceridemia reflects limited lipid clearance and may worsen with sepsis/critical illness. Closest distractor: Triglycerides track lipid handling, not carbohydrate or calcium delivery. Why not the others: B. Amino-acid dose only — Triglyceride concentration primarily reflects lipid delivery/clearance rather than amino-acid dose.; D. Calcium-phosphate ratio only — Calcium-phosphate prescription affects mineral balance, not triglyceride clearance.", "pearl": "Check the lipid dose, infusion, illness severity and sampling timing before reflexively abandoning PN.", "srcAnswer": "A"}, {"num": 19, "level": "Conceptual", "question": "Why does increasing enteral feed volume usually allow PN to be reduced only after recalculation?", "options": ["PN must stop once any feeds are started", "Only total water volume matters", "Every milliliter of milk is nutritionally identical to PN", "Enteral fluid may not replace the same glucose, protein, energy and electrolyte delivery as the PN volume removed"], "answer": 3, "explanation": "Fluid replacement and nutrient replacement are not equivalent; GIR and protein/mineral delivery must be recalculated. Closest distractor: Compare nutrient delivery, not just mL/kg/day. Why not the others: B. Only total water volume matters — Water/glucose water is not nutritionally complete and cannot meet preterm protein, fat, mineral and micronutrient requirements.", "pearl": "Never wean PN by volume alone.", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "Abdominal ultrasound is most useful in NEC because it", "options": ["Rules out NEC when pneumatosis is absent", "Adds dynamic information on bowel perfusion, wall appearance, peristalsis, portal gas and complex fluid", "Is useful only after perforation", "Replaces radiographs in every infant"], "answer": 1, "explanation": "Ultrasound complements rather than universally replaces radiographs and can identify perfusion/viability-related findings. Closest distractor: The key added value is dynamic bowel and fluid/perfusion information. Why not the others: D. Replaces radiographs in every infant — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The key added value is dynamic bowel and fluid/perfusion information.", "pearl": "Radiograph + ultrasound is complementary imaging.", "srcAnswer": "B"}, {"num": 21, "level": "Conceptual", "question": "Why should acid-suppression exposure be minimized in preterm infants without a clear indication?", "options": ["It causes volvulus mechanically", "It prevents human-milk fortification", "It directly perforates the bowel", "Reduced gastric acidity may alter microbial defense and has been associated with NEC and infection"], "answer": 3, "explanation": "Acid suppression changes host defense and has observational links with NEC/infection; avoid unnecessary exposure. Closest distractor: The mechanism is altered microbial defense, not mechanical obstruction.", "pearl": "Medication stewardship is part of NEC prevention.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical/Application", "question": "A 28-week infant on day 14 has recurrent apnea, abdominal distension, blood-streaked stool, platelets 92,000/mm3 and pneumatosis. The best immediate management bundle is", "options": ["Reduce fortifier but continue feeds", "NPO, gastric decompression, stabilization, cultures/labs, IV antibiotics and serial imaging with early surgical awareness", "Observe for 12 hours before cultures", "Switch to donor milk and repeat platelets tomorrow"], "answer": 1, "explanation": "The infant has definite NEC with systemic involvement; enteral feeding must stop while resuscitation, decompression, infection management and serial assessment begin. Closest distractor: Pneumatosis plus systemic illness excludes simple feeding intolerance. Why not the others: C. Observe for 12 hours before cultures — Delay is unsafe in the presented emergency; the stem already contains a management-changing red flag requiring prompt escalation.", "pearl": "NEC management is a bundle, not a single drug or feeding change.", "srcAnswer": "B"}, {"num": 23, "level": "Clinical/Application", "question": "A preterm infant with pneumatosis has mild metabolic acidosis, mild thrombocytopenia, abdominal wall edema and portal venous gas. Which Bell category fits best?", "options": ["Stage IIIA", "Stage IIA", "Stage IIB", "Stage IB"], "answer": 2, "explanation": "IIB adds moderate systemic illness (acidosis/thrombocytopenia) and more advanced abdominal/imaging findings such as portal gas/ascites. Closest distractor: Moderate systemic derangement + portal gas points to IIB.", "pearl": "IIA is definite but milder; IIIA implies severe systemic failure/peritonitis without perforation.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical/Application", "question": "A neonate with NEC has hypotension requiring inotropes, respiratory failure, severe acidosis, DIC, peritonitis and ascites but no free air. This is", "options": ["Stage IIB", "Stage IIIA", "Stage IIIB", "Stage IIA"], "answer": 1, "explanation": "This is advanced NEC with severe systemic illness and intact bowel on imaging: IIIA. Closest distractor: Severe disease without pneumoperitoneum = IIIA.", "pearl": "No free air keeps the infant in IIIA; free air would make it IIIB.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical/Application", "question": "A term neonate develops sudden green bilious vomiting and abdominal tenderness. Plain radiograph is nonspecific. The most important next principle is", "options": ["Treat as possible malrotation/volvulus and obtain urgent surgical evaluation with definitive imaging if stable", "Label feeding intolerance and observe", "Wait for pneumatosis before consulting surgery", "Start fortifier-free human milk"], "answer": 0, "explanation": "Bilious emesis in a neonate is obstruction/volvulus until proved otherwise because delay risks bowel necrosis. Closest distractor: The color of emesis and acute obstruction phenotype outweigh a nonspecific initial film. Why not the others: B. Label feeding intolerance and observe — Simple feeding intolerance does not explain the surgical red flags or pathologic imaging/systemic findings presented.; C. Wait for pneumatosis before consulting surgery — Delay is unsafe in the presented emergency; the stem already contains a management-changing red flag requiring prompt escalation.", "pearl": "Bilious vomiting is a surgical red flag even when the first film is nondiagnostic.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "A thriving 3-week-old infant has small streaks of bright blood in stool but is afebrile, feeding well, has a soft abdomen and normal imaging. The most likely alternative to NEC is", "options": ["Malrotation with volvulus", "Food-protein allergic proctocolitis", "Bell IIB NEC", "Spontaneous intestinal perforation"], "answer": 1, "explanation": "Well appearance with isolated blood streaking and no systemic/imaging abnormalities favors allergic proctocolitis. Closest distractor: Systemic toxicity and pathologic imaging are absent.", "pearl": "Sick preterm infant + pneumatosis is NEC; well infant + isolated blood may be allergy.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical/Application", "question": "A septic preterm infant has diffuse bowel gaseous distension but no pneumatosis, no portal gas and no blood per rectum. The abdominal finding is best interpreted as", "options": ["SIP", "Nonspecific ileus that requires serial reassessment rather than definite NEC", "Definite Bell II NEC", "Malrotation by definition"], "answer": 1, "explanation": "Sepsis can cause ileus; without definite bowel-wall signs the infant should be watched for evolution rather than automatically staged as NEC. Closest distractor: Serial evolution and bowel-wall/portal findings separate ileus from definite NEC. Why not the others: A. SIP — SIP is usually an isolated focal perforation phenotype without diffuse pneumatosis/portal gas; the stem instead fits NEC.", "pearl": "Nonspecific dilation is not pneumatosis.", "srcAnswer": "B"}, {"num": 28, "level": "Clinical/Application", "question": "A deteriorating 25-week infant has free intraperitoneal air. The next step is", "options": ["Begin oral probiotics", "Restart feeds after decompression", "Repeat the film after 24 hours before calling surgery", "Immediate stabilization and urgent pediatric-surgical management"], "answer": 3, "explanation": "Free air means perforation; resuscitation and surgery proceed in parallel. Closest distractor: Do not wait for additional laboratory deterioration once perforation is shown.", "pearl": "Perforation is an absolute surgical indication.", "srcAnswer": "D"}, {"num": 29, "level": "Clinical/Application", "question": "A loop remains markedly dilated in the same location on serial films 6 hours apart while platelets fall. The best interpretation is", "options": ["Concerning for focal severely diseased/necrotic bowel and warrants escalation", "A normal consequence of donor milk", "Proof of pyloric stenosis", "Physiologic CPAP belly"], "answer": 0, "explanation": "Persistence and focality plus laboratory deterioration make a fixed loop concerning. Closest distractor: Dynamic change distinguishes nonspecific ileus from a persistent diseased segment. Why not the others: C. Proof of pyloric stenosis — Pyloric stenosis causes non-bilious gastric outlet obstruction and does not produce the bowel-wall/perforation findings in the stem.", "pearl": "One film is suggestive; persistence on serial imaging raises concern.", "srcAnswer": "A", "img": "img/gen_fixed_loop.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 30, "level": "Clinical/Application", "question": "A 24-week ELBW infant on day 5 after indomethacin exposure develops abrupt abdominal discoloration and pneumoperitoneum, with no preceding pneumatosis or portal gas. The leading diagnosis is", "options": ["Hypertrophic pyloric stenosis", "Hirschsprung-associated enterocolitis", "Perforated NEC", "Spontaneous intestinal perforation"], "answer": 3, "explanation": "Early isolated perforation in an ELBW infant without classic NEC imaging strongly favors SIP. Closest distractor: Timing + focal free air + absent pneumatosis/portal gas favor SIP over NEC. Why not the others: A. Hypertrophic pyloric stenosis — Pyloric stenosis causes non-bilious gastric outlet obstruction and does not produce the bowel-wall/perforation findings in the stem.; B. Hirschsprung-associated enterocolitis — Hirschsprung-related disease has a different obstructive background (delayed meconium/constipation) and does not fit the presented acute pattern.; C. Perforated NEC — Perforated NEC remains a close mimic, but the early isolated perforation phenotype without preceding pneumatosis/portal gas favors SIP.", "pearl": "SIP is a phenotype diagnosis; management remains urgent even while the label is refined.", "srcAnswer": "D"}, {"num": 31, "level": "Clinical/Application", "question": "After medically treated NEC, an infant is clinically well, abdominal examination is normal and serial imaging/labs have resolved. The best feeding approach is", "options": ["Permanent avoidance of human milk", "Mandatory 14-day fasting for every infant", "Cautious individualized reintroduction of human milk rather than a fixed prolonged fast", "Immediate full-volume feeding"], "answer": 2, "explanation": "Evidence does not support an arbitrary prolonged fast once disease has clearly resolved; cautious refeeding reduces PN exposure. Closest distractor: The infant's recovery trajectory—not a universal fasting duration—drives refeeding. Why not the others: B. Mandatory 14-day fasting for every infant — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The infant's recovery trajectory—not a universal fasting duration—drives refeeding.", "pearl": "Recovery criteria matter more than a fixed calendar rule.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical/Application", "question": "A VLBW infant reaches 150 mL/kg/day of human milk but has poor weight gain and low protein intake. The first nutritional review should focus on", "options": ["Stopping human milk", "Starting clear glucose water", "Fortification strategy and total protein-energy delivery", "Withholding feeds to prevent NEC"], "answer": 2, "explanation": "Adequate volume does not guarantee adequate protein/energy density in preterm infants. Closest distractor: The issue is nutrient adequacy, not milk intolerance. Why not the others: B. Starting clear glucose water — Water/glucose water is not nutritionally complete and cannot meet preterm protein, fat, mineral and micronutrient requirements.", "pearl": "Growth failure on human milk usually prompts nutrient-density review before abandoning human milk.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day8',label:'Day 8',set:'Quiz 2',href:'Day8/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;

 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}

}

}

function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 8 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 → Correct + understood → R1 → Improving" for each notebook retest in this set.
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  if(!a)return`Day 8 Q${q.num} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`Day 8 Q${q.num} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`Day 8 Q${q.num} → Correct + understood → ${st} → Improving`;
  return`Day 8 Q${q.num} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 8'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 8');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day8:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
