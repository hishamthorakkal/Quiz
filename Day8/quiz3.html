<script>
const quiz=[{"num": 33, "level": "Clinical/Application", "question": "A VLBW infant receiving donor milk grows more slowly than expected but remains clinically stable. The most appropriate interpretation is", "options": ["Donor milk can have lower/variable protein-energy content; optimize fortification and growth monitoring", "Soy formula should replace donor milk", "The infant has NEC until proven otherwise", "Donor milk must be stopped because it causes growth failure"], "answer": 0, "explanation": "Donor milk can be protective against NEC yet require aggressive nutritional optimization. Closest distractor: Growth velocity is a nutrition problem unless there are separate illness signs. Why not the others: B. Soy formula should replace donor milk — Soy formula is not the preferred nutrition for preterm/VLBW infants and does not provide the NEC-protective role of human milk.", "pearl": "Do not trade NEC protection for growth without first fixing nutrient density.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical/Application", "question": "An ELBW infant on PN develops persistent glucose 230 mg/dL after a GIR increase. The best first response is", "options": ["Start insulin immediately without recalculation", "Stop amino acids first", "Verify sampling and total GIR from every glucose source, then reduce excessive glucose and assess stress/sepsis/drugs", "Increase lipid to dilute glucose"], "answer": 2, "explanation": "Audit the actual glucose delivery and reversible drivers before insulin. Closest distractor: The first discriminator is whether glucose delivery is excessive versus stress-mediated hyperglycemia. Why not the others: A. Start insulin immediately without recalculation — Insulin may be considered only after auditing glucose delivery and reversible causes; it is not the automatic first response to neonatal hyperglycemia.", "pearl": "Insulin is not the reflex first answer to neonatal PN hyperglycemia.", "srcAnswer": "C"}, {"num": 35, "level": "", "question": "A preterm infant is assessed at 36 weeks PMA. Which single respiratory-support finding places the infant in Jensen Grade 3 BPD?", "options": ["Low-flow nasal cannula at 1 L/min", "CPAP", "Invasive mechanical ventilation", "Room air with tachypnea"], "answer": 2, "explanation": "Jensen Grade 3 BPD at 36 weeks PMA is defined by invasive mechanical ventilation. Closest distractor: The decisive split is invasive versus non-invasive support at 36 weeks PMA. Why not the others: A. Low-flow nasal cannula at 1 L/min — Low-flow cannula belongs to a lower severity category.; B. CPAP — Non-invasive positive-pressure support does not meet Grade 3.; D. Room air with tachypnea — Symptoms alone do not define Jensen Grade 3.", "pearl": "Jensen Grade 3 = invasive mechanical ventilation at 36 weeks PMA.", "srcAnswer": "C", "retest": {"stage": "R1", "from": ""}}, {"num": 36, "level": "Clinical/Application", "question": "A preterm infant on prolonged PN develops direct hyperbilirubinemia. The most appropriate approach is", "options": ["Evaluate other cholestasis causes while maximizing safe enteral nutrition and optimizing PN/lipid strategy", "Switch to soy formula", "Assume PN is the only cause and stop all nutrition", "Ignore sepsis and biliary obstruction"], "answer": 0, "explanation": "PN/intestinal-failure–associated cholestasis is common, but sepsis, biliary atresia and metabolic disease still require consideration. Closest distractor: Diagnosis of exclusion/parallel evaluation separates PNAC/IFALD from other causes. Why not the others: B. Switch to soy formula — Soy formula is not the preferred nutrition for preterm/VLBW infants and does not provide the NEC-protective role of human milk.", "pearl": "PN exposure does not exempt the infant from a cholestasis differential.", "srcAnswer": "A"}, {"num": 37, "level": "Clinical/Application", "question": "A 30-week infant on prolonged PN has rising ALP and low serum phosphate with suboptimal mineral intake. The main concern is", "options": ["SIP", "Biliary atresia", "Metabolic bone disease of prematurity", "NEC stage IIB"], "answer": 2, "explanation": "Inadequate calcium/phosphate delivery with biochemical changes raises concern for metabolic bone disease. Closest distractor: ALP/phosphate pattern points to bone mineralization, not NEC.", "pearl": "Think minerals whenever prolonged PN and poor enteral mineral accretion coexist.", "srcAnswer": "C"}, {"num": 38, "level": "Clinical/Application", "question": "A 1.2-kg infant is prescribed 150 mL/kg/day of feeds. What is the total daily volume?", "options": ["150 mL/day", "125 mL/day", "180 mL/day", "300 mL/day"], "answer": 2, "explanation": "150 mL/kg/day × 1.2 kg = 180 mL/day. Closest distractor: The unit kg cancels, leaving mL/day.", "pearl": "Always multiply the weight in kilograms by the prescribed mL/kg/day.", "srcAnswer": "C"}, {"num": 39, "level": "Clinical/Application", "question": "The same infant receives 180 mL/day every 3 hours. What is each feed?", "options": ["22.5 mL", "30 mL", "18 mL", "15 mL"], "answer": 0, "explanation": "Every 3 hours = 8 feeds/day; 180 ÷ 8 = 22.5 mL/feed. Closest distractor: The discriminator is 8 feeds/day, not 6 or 12.", "pearl": "Convert schedule frequency to feeds/day before dividing.", "srcAnswer": "A"}, {"num": 40, "level": "Clinical/Application", "question": "A 1-kg infant receives D10 at 100 mL/kg/day. Approximate GIR is", "options": ["10 mg/kg/min", "0.69 mg/kg/min", "69 mg/kg/min", "6.9 mg/kg/min"], "answer": 3, "explanation": "D10 = 100 mg/mL; GIR = 100 × 100 ÷ 1440 = 6.94 mg/kg/min. Closest distractor: Errors usually come from missing the 1440 min/day conversion or a decimal.", "pearl": "Use mg/mL × mL/kg/day ÷ 1440.", "srcAnswer": "D"}, {"num": 41, "level": "Clinical/Application", "question": "A 1.4-kg infant receives amino acids at 3.5 g/kg/day. Total amino acids delivered per day are", "options": ["2.45 g/day", "7.0 g/day", "4.9 g/day", "3.5 g/day"], "answer": 2, "explanation": "3.5 g/kg/day × 1.4 kg = 4.9 g/day. Closest distractor: Multiply by actual weight in kg.", "pearl": "Protein dose is weight-based; do not confuse prescribed g/kg/day with total grams.", "srcAnswer": "C"}, {"num": 42, "level": "Clinical/Application", "question": "Total fluid goal is 160 mL/kg/day and enteral feeds provide 110 mL/kg/day; medication/flush volume is 15 mL/kg/day. What is the remaining PN/IV fluid allowance?", "options": ["65 mL/kg/day", "35 mL/kg/day", "50 mL/kg/day", "145 mL/kg/day"], "answer": 1, "explanation": "160 − 110 − 15 = 35 mL/kg/day. Closest distractor: Subtract every non-PN fluid source, not only feeds.", "pearl": "Medication and flush volumes count toward total fluid.", "srcAnswer": "B"}, {"num": 43, "level": "Clinical/Application", "question": "A stable preterm infant is taking 125 kcal/kg/day and 3.8 g/kg/day protein. This is best interpreted as", "options": ["Severe protein restriction", "Excessive calories requiring fasting", "Within commonly used enteral target ranges for many preterm infants", "Incompatible with human milk"], "answer": 2, "explanation": "Common targets are roughly 110–135/140 kcal/kg/day and ~3.5–4.5 g/kg/day protein depending on infant and guideline. Closest distractor: Both energy and protein sit within typical target ranges.", "pearl": "Use ranges as anchors, not rigid universal prescriptions.", "srcAnswer": "C"}, {"num": 44, "level": "Clinical/Application", "question": "In an Indian NICU, which intervention should routinely accompany nutritional support for an LBW infant when clinically feasible?", "options": ["Kangaroo Mother Care / skin-to-skin care", "Routine prolonged fasting", "Routine soy formula", "Routine acid suppression"], "answer": 0, "explanation": "NNF/Indian guidance strongly supports KMC for LBW infants, with benefits that include thermoregulation and support of lactation/feeding. Closest distractor: KMC supports feeding and thermoregulation; the other choices increase risk or are inappropriate. Why not the others: B. Routine prolonged fasting — Prolonged fasting increases PN exposure and is not supported as a universal NEC-prevention or post-NEC strategy.; C. Routine soy formula — Soy formula is not the preferred nutrition for preterm/VLBW infants and does not provide the NEC-protective role of human milk.; D. Routine acid suppression — Routine acid suppression is not a nutritional-support intervention and may increase infectious/NEC risk when used without indication.", "pearl": "KMC is part of comprehensive LBW care, not merely bonding.", "srcAnswer": "A"}, {"num": 45, "level": "Clinical/Application", "question": "An exam stem explicitly asks for NNF guidance on probiotics in a stable LBW infant ready for enteral feeds. The best answer is", "options": ["AAP's caution means NNF also universally prohibits them", "Probiotics replace human milk", "Every probiotic product is interchangeable", "Selected multistrain probiotics may be used according to NNF guidance and local product policy"], "answer": 3, "explanation": "NNF guidance is more permissive than AAP's universal-use caution, illustrating society-specific recommendations. Closest distractor: The discriminator is the named guideline, not personal unit practice. Why not the others: A. AAP's caution means NNF also universally prohibits them — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The discriminator is the named guideline, not personal unit practice.", "pearl": "When a stem names the society, answer within that framework.", "srcAnswer": "D"}, {"num": 46, "level": "Clinical/Application", "question": "A term infant with cyanotic congenital heart disease and systemic hypoperfusion develops abdominal distension and blood in stool. The best interpretation is", "options": ["Only SIP occurs in term infants", "This must be allergic proctocolitis", "NEC is impossible at term", "NEC can occur in term infants with congenital heart disease/hypoperfusion and should be evaluated seriously"], "answer": 3, "explanation": "Term NEC often has a secondary hypoperfusion/cardiac context rather than the classic prematurity phenotype. Closest distractor: The cardiac/hypoperfusion phenotype makes NEC plausible despite term gestation. Why not the others: A. Only SIP occurs in term infants — SIP is usually an isolated focal perforation phenotype without diffuse pneumatosis/portal gas; the stem instead fits NEC.; B. This must be allergic proctocolitis — Allergic proctocolitis typically occurs in a well-appearing infant with isolated blood-streaking, not the systemic/inflammatory or obstructive pattern in this stem.", "pearl": "Prematurity is dominant, not exclusive.", "srcAnswer": "D"}, {"num": 47, "level": "Clinical/Application", "question": "A preterm infant develops NEC temporally after a packed-RBC transfusion. Which statement is most accurate?", "options": ["The temporal association is described, but causality remains debated and should not be treated as settled", "Transfusion completely protects from NEC", "Feeding during transfusion is universally contraindicated by all societies", "Transfusion is a proven direct cause of NEC"], "answer": 0, "explanation": "Transfusion-associated NEC remains controversial; observational associations do not establish simple causality. Closest distractor: The key is uncertainty/heterogeneity of the evidence. Why not the others: B. Transfusion completely protects from NEC — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The key is uncertainty/heterogeneity of the evidence.; C. Feeding during transfusion is universally contraindicated by all societies — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The key is uncertainty/heterogeneity of the evidence.", "pearl": "Association is not causation.", "srcAnswer": "A"}, {"num": 48, "level": "Clinical/Application", "question": "A stable infant with Bell IIA NEC has negative cultures and improves. Antibiotic duration should be", "options": ["Guided by stage, clinical course, cultures and local neonatal stewardship protocol rather than one universal fixed regimen", "Stopped immediately after one normal film", "Oral antibiotics only", "Exactly 14 days in every infant"], "answer": 0, "explanation": "Traditional Bell-based duration anchors exist, but modern stewardship requires clinical and microbiologic context. Closest distractor: The stem lacks a unit protocol, so rigid duration is inappropriate. Why not the others: D. Exactly 14 days in every infant — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The stem lacks a unit protocol, so rigid duration is inappropriate.", "pearl": "Know the exam anchors, but do not present them as universal evidence-based mandates.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day8',label:'Day 8',set:'Quiz 3',href:'Day8/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day8_QuizSet3_Q33-48_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 8 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–48</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 → Correct + understood → R1 → Improving" for each notebook retest in this set.
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  if(!a)return`Day 8 Q${q.num} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`Day 8 Q${q.num} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`Day 8 Q${q.num} → Correct + understood → ${st} → Improving`;
  return`Day 8 Q${q.num} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 8'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 8');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day8:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
