const quiz=[{"num": 49, "level": "Clinical/Application", "question": "A preterm infant on PN develops fever and a positive blood culture with a central line in situ. Which PN complication is most directly implicated?", "options": ["SIP", "Metabolic bone disease", "Catheter-related bloodstream infection", "Malrotation"], "answer": 2, "explanation": "Central access required for prolonged PN carries infection risk; culture/source control decisions follow neonatal sepsis practice. Closest distractor: The central-line bacteremia phenotype is specific for catheter-associated infection.", "pearl": "Line sepsis is a major reason to shorten PN dependence when enteral nutrition becomes safe.", "srcAnswer": "C"}, {"num": 50, "level": "High-Difficulty", "question": "A 27-week infant has pneumatosis and mild tenderness but no acidosis or thrombocytopenia. Which staging-management pairing is most defensible?", "options": ["Bell IIA: definite mild NEC; NPO/decompression/antibiotics with close serial reassessment", "Bell IB: suspected NEC because pneumatosis is nonspecific", "Bell IIB: moderate NEC solely because pneumatosis is present", "Bell IIIA: advanced NEC because any tenderness implies peritonitis"], "answer": 0, "explanation": "Pneumatosis establishes definite NEC; absence of moderate systemic derangement favors IIA rather than IIB/III. Closest distractor: The closest distractor is IIB; acidosis/thrombocytopenia/portal gas/ascites would push toward IIB.", "pearl": "Pneumatosis defines definite disease but does not by itself define advanced severity.", "srcAnswer": "A"}, {"num": 51, "level": "High-Difficulty", "question": "A 24-week infant has free air, abrupt abdominal discoloration and no prior pneumatosis. Platelets and lactate are initially normal. Which interpretation best avoids anchoring bias?", "options": ["The infant should be observed until pneumatosis appears", "SIP is strongly favored, but perforation still requires urgent surgical management while diagnosis is refined", "Free air proves Bell IIIB NEC", "Normal platelets exclude intestinal perforation"], "answer": 1, "explanation": "The phenotype favors SIP, yet the management priority is still perforation stabilization/surgery. Closest distractor: The closest distractor is perforated NEC; prior diffuse NEC features are absent. Why not the others: A. The infant should be observed until pneumatosis appears — Delay is unsafe in the presented emergency; the stem already contains a management-changing red flag requiring prompt escalation.", "pearl": "Diagnosis refinement must not delay source control.", "srcAnswer": "B"}, {"num": 52, "level": "High-Difficulty", "question": "An ELBW infant with intestinal perforation is too unstable for transport to the operating theatre. Which statement about primary peritoneal drainage is most accurate?", "options": ["It is contraindicated in SIP", "It is always superior to laparotomy for NEC", "It can be used as an initial surgical strategy in selected unstable ELBW infants; diagnosis and local surgical judgment influence whether later laparotomy is needed", "It eliminates the need for subsequent surgery"], "answer": 2, "explanation": "Drainage is an accepted initial strategy in selected unstable infants, but trial data do not support a universal one-size-fits-all winner over laparotomy. Closest distractor: Avoid absolute claims of universal superiority or definitive cure. Why not the others: A. It is contraindicated in SIP — Peritoneal drainage can be used in selected SIP/ELBW perforation scenarios; it is not categorically contraindicated.; B. It is always superior to laparotomy for NEC — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, Avoid absolute claims of universal superiority or definitive cure.", "pearl": "Procedure choice depends on physiology, suspected NEC vs SIP and surgical expertise.", "srcAnswer": "C"}, {"num": 53, "level": "High-Difficulty", "question": "A 26-week infant with Bell IIIA NEC has worsening acidosis, thrombocytopenia, abdominal wall erythema and ultrasound showing absent bowel-wall perfusion with complex ascites, but no free air. The best next step is", "options": ["Restart feeds because there is no perforation", "Delay surgery until cultures are positive", "Urgent surgical reassessment for possible necrotic bowel despite absence of pneumoperitoneum", "Continue medical therapy until free air appears"], "answer": 2, "explanation": "Clinical and ultrasound evidence of nonviable bowel can justify surgery without pneumoperitoneum. Closest distractor: The closest distractor is waiting for free air; that may be dangerously late.", "pearl": "Free air is an absolute indication, not the only indication.", "srcAnswer": "C"}, {"num": 54, "level": "High-Difficulty", "question": "A preterm infant with NEC has portal venous gas, mild metabolic acidosis and platelets 105,000/mm3 but no shock or respiratory failure. The best stage is", "options": ["Bell IIB", "Bell IIA", "Bell IIIB", "Bell IIIA"], "answer": 0, "explanation": "Portal gas with mild systemic derangement fits moderate definite NEC (IIB), not advanced stage III disease. Closest distractor: Mild acidosis/thrombocytopenia and portal gas push beyond IIA.", "pearl": "Stage is determined by the whole severity pattern, not a single dramatic imaging sign.", "srcAnswer": "A"}, {"num": 55, "level": "", "question": "At 36 weeks PMA, Infant A is on CPAP and Infant B remains invasively ventilated. Under the Jensen severity system, which statement is correct?", "options": ["Both are Grade 3 because both need respiratory support", "Infant A is Grade 3 and Infant B is Grade 2", "Infant B is Grade 3; non-invasive support does not meet Grade 3", "FiO2 alone, not support mode, defines Grade 3"], "answer": 2, "explanation": "Jensen severity is support-mode based; invasive mechanical ventilation at 36 weeks PMA is Grade 3, while CPAP/non-invasive support is not Grade 3. Closest distractor: CPAP versus invasive ventilation is the decisive split. Why not the others: A. Both are Grade 3 because both need respiratory support — Grade 3 specifically requires invasive ventilation.; B. Infant A is Grade 3 and Infant B is Grade 2 — The grades are reversed relative to support intensity.; D. FiO2 alone, not support mode, defines Grade 3 — Support mode is central to Jensen severity classification.", "pearl": "Do not grade Jensen BPD from oxygen percentage alone.", "srcAnswer": "C"}, {"num": 56, "level": "High-Difficulty", "question": "Three weeks after recovery from NEC, an infant develops recurrent distension, vomiting and difficulty passing stool while inflammatory markers remain normal. The most likely late complication is", "options": ["SIP", "Pyloric stenosis", "Recurrent acute NEC by definition", "Post-NEC intestinal stricture"], "answer": 3, "explanation": "Post-NEC strictures often present weeks later with obstructive symptoms after the inflammatory episode has settled. Closest distractor: Normal inflammatory markers and delayed timing favor stricture over recurrent NEC. Why not the others: A. SIP — SIP is usually an isolated focal perforation phenotype without diffuse pneumatosis/portal gas; the stem instead fits NEC.; B. Pyloric stenosis — Pyloric stenosis causes non-bilious gastric outlet obstruction and does not produce the bowel-wall/perforation findings in the stem.", "pearl": "Late obstruction after NEC = think stricture, especially colonic.", "srcAnswer": "D"}, {"num": 57, "level": "High-Difficulty", "question": "Which statement about post-NEC strictures is most exam-appropriate?", "options": ["They always present during the acute inflammatory phase", "They are seen only after surgical NEC", "They are a common late complication and often involve the colon", "They occur only in the duodenum"], "answer": 2, "explanation": "Strictures are an important late complication and are commonly colonic, including left-sided segments. Closest distractor: Location/timing distinguish stricture from acute necrosis. Why not the others: A. They always present during the acute inflammatory phase — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, Location/timing distinguish stricture from acute necrosis.", "pearl": "Weeks-later obstruction should trigger a contrast evaluation pathway as clinically appropriate.", "srcAnswer": "C"}, {"num": 58, "level": "High-Difficulty", "question": "A surgical-NEC survivor has extensive bowel resection, persistent high-output stoma, poor enteral tolerance and prolonged PN dependence. The major long-term syndrome is", "options": ["Short bowel syndrome / intestinal failure", "Uncomplicated allergic proctocolitis", "Isolated physiologic reflux", "Transient feeding intolerance with no nutritional consequence"], "answer": 0, "explanation": "Loss of absorptive surface can cause intestinal failure requiring prolonged PN and adaptation strategies. Closest distractor: Persistent PN dependence after major resection is the decisive clue. Why not the others: B. Uncomplicated allergic proctocolitis — Allergic proctocolitis typically occurs in a well-appearing infant with isolated blood-streaking, not the systemic/inflammatory or obstructive pattern in this stem.; C. Isolated physiologic reflux — Physiologic reflux is typically non-bilious and does not explain the acute obstructive phenotype in the stem.; D. Transient feeding intolerance with no nutritional consequence — Simple feeding intolerance does not explain the surgical red flags or pathologic imaging/systemic findings presented.", "pearl": "The downstream risks include line sepsis, IFALD/PNAC and growth failure.", "srcAnswer": "A"}, {"num": 59, "level": "High-Difficulty", "question": "A neonate with bilious vomiting is hemodynamically stable; abdominal radiograph is nondiagnostic. Which investigation is classically used to evaluate malrotation/volvulus when available and the infant is stable?", "options": ["Barium enema as the universal first test", "Urgent upper GI contrast study", "Routine head ultrasound", "HIDA scan"], "answer": 1, "explanation": "Upper GI contrast evaluation is the classic study for malrotation in a stable infant, though local ultrasound expertise may also contribute. Closest distractor: The test should demonstrate duodenal position/rotation rather than hepatobiliary function. Why not the others: A. Barium enema as the universal first test — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The test should demonstrate duodenal position/rotation rather than hepatobiliary function.", "pearl": "Bilious emesis requires time-critical anatomic evaluation.", "srcAnswer": "B"}, {"num": 60, "level": "High-Difficulty", "question": "A Bell IIB infant improves rapidly, cultures are sterile and serial examinations normalize. Which antibiotic principle is best?", "options": ["Give 14 days in every Bell IIB infant regardless of course", "Switch to oral antibiotics at the first feed", "Stop after 24 hours because cultures are negative", "Use a stage- and response-informed local stewardship pathway rather than automatically extending to the longest traditional duration"], "answer": 3, "explanation": "Cultures, response, stage and local data all matter; the evidence does not mandate a universal longest course. Closest distractor: Negative cultures alone do not prove absence of NEC, but rapid recovery may support shorter protocol-defined therapy.", "pearl": "Traditional duration tables are exam anchors, not a substitute for stewardship.", "srcAnswer": "D"}, {"num": 61, "level": "High-Difficulty", "question": "A stable 29-week infant is ready for feeds. The unit uses an NNF-style multistrain probiotic protocol, but a US-trained examiner asks what AAP emphasizes. The best reconciliation is", "options": ["AAP and NNF have identical universal probiotic recommendations", "Ignore the named guideline and choose personal preference", "Probiotics can replace donor milk", "State the society-specific recommendation explicitly; do not silently merge a permissive NNF protocol with AAP's product/safety caution"], "answer": 3, "explanation": "Different authoritative groups can reach different implementation recommendations because product regulation and evidence certainty differ. Closest distractor: The named society is the decisive discriminator. Why not the others: A. AAP and NNF have identical universal probiotic recommendations — The absolute wording is the problem: current neonatal practice is conditional on the clinical/guideline context. Here, The named society is the decisive discriminator.; B. Ignore the named guideline and choose personal preference — The named society/guideline in the stem should determine the exam answer, not individual unit preference.", "pearl": "Label the framework and answer the framework in the stem.", "srcAnswer": "D"}, {"num": 62, "level": "High-Difficulty", "question": "A growth-restricted preterm infant begins aggressive PN and develops hypophosphatemia, hypokalemia and worsening glucose intolerance. The best unifying concern is", "options": ["Refeeding-type electrolyte shifts in a severely growth-restricted infant", "Bell IIB NEC", "Physiologic transition", "SIP"], "answer": 0, "explanation": "High anabolic substrate delivery can precipitate intracellular shifts of phosphate/potassium in severely growth-restricted infants. Closest distractor: The electrolyte pattern after nutritional escalation is the key.", "pearl": "Monitor phosphate, potassium and magnesium when nutrition is advanced rapidly in high-risk infants.", "srcAnswer": "A"}, {"num": 63, "level": "High-Difficulty", "question": "An ELBW infant on steroids has glucose 250 mg/dL. GIR is 4 mg/kg/min after recalculation, and there are new temperature instability and rising CRP. The next priority is", "options": ["Start insulin before evaluating infection", "Increase dextrose because the infant is preterm", "Evaluate/treat stress or sepsis while maintaining adequate—not excessive—glucose delivery; insulin may be considered only if hyperglycemia persists per protocol", "Further reduce GIR to zero immediately"], "answer": 2, "explanation": "Once excessive GIR is excluded, hyperglycemia may reflect illness/steroids; treatment must address the driver while avoiding starvation. Closest distractor: A low-normal GIR makes 'too much dextrose' a weaker explanation. Why not the others: A. Start insulin before evaluating infection — Insulin may be considered only after auditing glucose delivery and reversible causes; it is not the automatic first response to neonatal hyperglycemia.", "pearl": "Hyperglycemia management is cause-directed after an accurate GIR audit.", "srcAnswer": "C"}, {"num": 64, "level": "High-Difficulty", "question": "A VLBW infant on fortified PDHM has poor linear growth, but energy intake is adequate and BUN is very low. Which adjustment is most rational?", "options": ["Hold feeds for NEC prevention", "Stop donor milk", "Reduce protein further", "Review protein delivery/fortification strategy before simply adding more nonprotein calories"], "answer": 3, "explanation": "Low BUN with poor growth despite adequate energy can suggest inadequate protein delivery, though interpretation is clinical and protocol-dependent. Closest distractor: The data point toward protein inadequacy, not energy deficit.", "pearl": "Growth quality depends on protein as well as calories.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day8',label:'Day 8',set:'Quiz 4',href:'Day8/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];

 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}

 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}

const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}

function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}

 const selected=document.querySelector('input[name="answer"]:checked');

 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}

function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 8 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–64</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 8'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 8');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day8:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=4041b023"></script></body></html>
