<script>
const quiz=[{"num": 65, "level": "High-Difficulty", "question": "A preterm infant with NEC has ultrasound showing absent bowel-wall perfusion, thinning, complex ascites and no peristalsis. Plain film shows no free air. These findings should", "options": ["Reassure because radiography lacks pneumoperitoneum", "Increase concern for nonviable bowel and lower the threshold for surgical involvement", "Be ignored because ultrasound cannot assess NEC", "Prompt feed advancement"], "answer": 1, "explanation": "Ultrasound signs of poor perfusion and complex fluid can identify severe disease before perforation is visible. Closest distractor: The severe viability findings outweigh a negative free-air sign.", "pearl": "Ultrasound can change urgency even without free air.", "srcAnswer": "B"}, {"num": 66, "level": "High-Difficulty", "question": "A term infant with duct-dependent congenital heart disease develops NEC-like bowel injury. Which pathophysiologic theme is most relevant?", "options": ["Milk-protein allergy as the sole mechanism", "Mesenteric hypoperfusion/oxygen-delivery imbalance superimposed on intestinal vulnerability", "Only immature microbiota from extreme prematurity", "Mechanical pyloric obstruction"], "answer": 1, "explanation": "Term cardiac NEC has a stronger perfusion/oxygen-delivery component than classic preterm NEC. Closest distractor: Term gestation shifts the risk framework toward circulatory disease. Why not the others: D. Mechanical pyloric obstruction — Pyloric stenosis causes non-bilious gastric outlet obstruction and does not produce the bowel-wall/perforation findings in the stem.", "pearl": "NEC is a syndrome with different risk architectures across populations.", "srcAnswer": "B"}, {"num": 67, "level": "High-Difficulty", "question": "A CPAP-supported preterm infant has a distended but soft abdomen, active bowel sounds, stable vitals, no blood in stool and a film showing diffuse gaseous distension without pneumatosis. Best interpretation?", "options": ["CPAP-related gaseous distension/ileus phenotype is more likely than definite NEC, but serial clinical reassessment is required", "SIP", "Definite Bell II NEC", "Perforated NEC"], "answer": 0, "explanation": "CPAP belly can mimic early NEC radiographically, but the absence of systemic illness, blood and pathognomonic signs lowers the probability of definite NEC. Closest distractor: Soft abdomen + stability + nonspecific gas favor benign distension. Why not the others: B. SIP — SIP is usually an isolated focal perforation phenotype without diffuse pneumatosis/portal gas; the stem instead fits NEC.", "pearl": "Do not let an alarming abdomen replace syndrome-level assessment.", "srcAnswer": "A"}, {"num": 68, "level": "High-Difficulty", "question": "A 900-g infant receives feeds 80 mL/kg/day and D12.5 PN 60 mL/kg/day. Ignoring other glucose sources, approximate GIR from PN is", "options": ["12.5 mg/kg/min", "5.2 mg/kg/min", "3.1 mg/kg/min", "8.7 mg/kg/min"], "answer": 1, "explanation": "D12.5 = 125 mg/mL; GIR = 125 × 60 ÷ 1440 = 5.21 mg/kg/min. Weight cancels because the fluid order is already in mL/kg/day. Closest distractor: The decisive issue is recognizing that mL/kg/day already incorporates weight.", "pearl": "When volume is already weight-normalized, do not multiply by weight again.", "srcAnswer": "B"}, {"num": 69, "level": "High-Difficulty", "question": "A 1.1-kg infant receives 140 mL/kg/day total fluid: 70 mL/kg/day enteral feeds, 10 mL/kg/day medications and D10 PN for the remainder. What GIR does the PN provide?", "options": ["Approximately 6.9 mg/kg/min", "Approximately 10 mg/kg/min", "Approximately 4.2 mg/kg/min", "Approximately 2.1 mg/kg/min"], "answer": 2, "explanation": "Remaining PN = 140−70−10 = 60 mL/kg/day; D10 GIR = 100×60/1440 = 4.17 mg/kg/min. Closest distractor: Skipping medication volume gives the wrong PN rate.", "pearl": "First solve the fluid allocation, then calculate GIR.", "srcAnswer": "C"}, {"num": 70, "level": "High-Difficulty", "question": "A VLBW infant has direct bilirubin 1.4 mg/dL after prolonged PN but is clinically well and feeding is increasing. Which statement is most precise?", "options": ["The value is normal in every preterm infant", "Direct bilirubin >1 mg/dL proves PNAC with no differential", "This meets a cholestasis threshold and warrants trend/evaluation; PN exposure is a contributor, not a proof of PN-associated liver disease by itself", "Feeds should be stopped to rest the liver"], "answer": 2, "explanation": "Direct bilirubin >1 mg/dL is abnormal/cholestatic, but etiologic attribution requires clinical context and exclusion of other causes. Closest distractor: Abnormal direct bilirubin ≠ automatic proof of PN causation.", "pearl": "Define cholestasis separately from assigning cause.", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A neonate with rapidly rising unconjugated bilirubin has suspected G6PD deficiency. DAT is negative. Which interpretation is best?", "options": ["A negative DAT excludes hemolysis", "G6PD hemolysis is nonimmune, so DAT may remain negative despite hemolysis", "G6PD deficiency produces only conjugated hyperbilirubinemia", "Exchange transfusion is never needed in G6PD deficiency"], "answer": 1, "explanation": "G6PD-related hemolysis is nonimmune, so DAT may be negative even when clinically important hemolysis is occurring. Closest distractor: DAT tests immune RBC coating; it does not test whether nonimmune hemolysis exists. Why not the others: A. A negative DAT excludes hemolysis — It mainly argues against antibody-mediated immune hemolysis.; C. G6PD deficiency produces only conjugated hyperbilirubinemia — It can produce severe unconjugated hyperbilirubinemia.; D. Exchange transfusion is never needed in G6PD deficiency — Treatment depends on bilirubin level, neurotoxicity risk and response to intensive phototherapy.", "pearl": "DAT-negative hemolysis should keep G6PD deficiency and other nonimmune causes in the differential.", "srcAnswer": "B"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "IMAGE STATION: The radiograph-style schematic shows bubbly/linear lucencies tracking along the bowel wall rather than remaining inside the lumen. In a 28-week infant with abdominal distension, the best interpretation is", "options": ["Intraluminal stool mottling", "Pneumatosis intestinalis supporting definite NEC", "Pneumobilia", "Portal venous gas"], "answer": 1, "explanation": "The decisive visual feature is gas outlining/tracking the bowel wall—pneumatosis—not irregular material inside the lumen. Closest distractor: Closest mimic: stool mottling; location within the bowel wall is the discriminator. Why not the others: A. Intraluminal stool mottling — Stool mottling remains within the bowel lumen; pneumatosis tracks the bowel wall itself.; C. Pneumobilia — Pneumobilia is predominantly central/hilar biliary gas; the stem describes the peripheral portal distribution instead.; D. Portal venous gas — Portal venous gas can accompany NEC but is not the same as intramural bowel-wall pneumatosis, which is the decisive finding here.", "pearl": "Wall-tracking lucencies = pneumatosis; intraluminal mottling stays inside the gas/stool column.", "srcAnswer": "B", "img": "img/gen_pneumatosis.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "IMAGE STATION: Branching hepatic lucencies extend toward the liver periphery. Which interpretation is most likely?", "options": ["Free intraperitoneal air", "Pneumobilia", "Portal venous gas", "Normal bowel gas projected over the liver"], "answer": 2, "explanation": "Peripheral branching within the hepatic parenchyma is typical of portal venous gas; biliary gas is more central. Closest distractor: Distribution of branching gas—not simply 'gas near liver'—is decisive. Why not the others: B. Pneumobilia — Pneumobilia is predominantly central/hilar biliary gas; the stem describes the peripheral portal distribution instead.; D. Normal bowel gas projected over the liver — Normal projected bowel gas does not form the characteristic peripheral intrahepatic branching pattern described in the stem.", "pearl": "Peripheral = portal; central hilar = biliary.", "srcAnswer": "C", "img": "img/gen_portal_gas.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "IMAGE STATION: An ELBW infant has free intraperitoneal air on a radiograph but no pneumatosis or portal gas on current or prior films. The most exam-appropriate response is", "options": ["Diagnose NEC IIIB with certainty", "Restart feeds once decompressed", "Wait for pneumatosis to appear before acting", "Consider SIP strongly, but stabilize and involve surgery urgently because perforation management cannot wait"], "answer": 3, "explanation": "The visual finding proves perforation, but the absence of diffuse NEC features makes SIP a strong etiologic alternative. Closest distractor: perforated NEC; missing antecedent pneumatosis/portal gas favors SIP. Why not the others: A. Diagnose NEC IIIB with certainty — Perforated NEC remains a close mimic, but the early isolated perforation phenotype without preceding pneumatosis/portal gas favors SIP.; C. Wait for pneumatosis to appear before acting — Delay is unsafe in the presented emergency; the stem already contains a management-changing red flag requiring prompt escalation.", "pearl": "Free air tells you 'perforation'; the rest of the pattern helps tell you 'why'.", "srcAnswer": "D", "img": "img/gen_free_air.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "DATA STATION: A 1-kg infant has a total-fluid target of 150 mL/kg/day. Feeds provide 90, medications 10, and the remaining PN is D12.5. What is the PN GIR?", "options": ["Approximately 6.9 mg/kg/min", "Approximately 4.3 mg/kg/min", "Approximately 12.5 mg/kg/min", "Approximately 8.7 mg/kg/min"], "answer": 1, "explanation": "PN volume = 150−90−10 = 50 mL/kg/day; D12.5 = 125 mg/mL; GIR = 125×50/1440 = 4.34 mg/kg/min. Closest distractor: The trap is forgetting medication volume before calculating GIR.", "pearl": "Two-step calculations are more realistic than isolated formula substitution.", "srcAnswer": "B"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "A 28-week infant treated medically for NEC returns 3 weeks later with progressive abdominal distension, feeding intolerance and intermittent bilious aspirates. Contrast study shows a short narrowed segment in the left colon with proximal dilatation. What is the most likely late complication?", "options": ["Recurrent spontaneous intestinal perforation", "Cow’s-milk protein allergy", "Post-NEC intestinal stricture", "Hypertrophic pyloric stenosis"], "answer": 2, "explanation": "A post-NEC infant who develops delayed obstructive symptoms with a focal colonic narrowing and proximal dilatation has a post-NEC intestinal stricture, a classic late complication. Closest distractor: Delayed obstructive symptoms plus a focal colonic narrowing after NEC point to stricture, not recurrent inflammatory NEC or allergy. Why not the others: A. Recurrent spontaneous intestinal perforation — SIP is an acute focal perforation phenotype, not a delayed fixed colonic narrowing weeks after NEC.; B. Cow’s-milk protein allergy — Allergy can cause blood-streaked stool in a well infant but does not produce a fixed anatomic stricture with proximal obstruction.; D. Hypertrophic pyloric stenosis — Pyloric stenosis causes non-bilious gastric outlet obstruction, not a distal colonic narrowing.", "pearl": "Think post-NEC stricture when feeding intolerance/obstruction appears weeks after apparent recovery; the colon is a common site.", "srcAnswer": "C"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "A 27-week infant with NEC has pneumatosis, portal venous gas, mild metabolic acidosis and thrombocytopenia, but no shock, DIC or free intraperitoneal air. Which modified Bell stage best fits?", "options": ["Stage IIA", "Stage IIB", "Stage IIIA", "Stage IIIB"], "answer": 1, "explanation": "Portal venous gas together with mild metabolic acidosis and thrombocytopenia, without shock/DIC or perforation, fits modified Bell stage IIB (moderately ill definite NEC). Closest distractor: IIB versus IIIA hinges on moderate versus severe systemic illness; IIIB additionally requires perforation. Why not the others: A. Stage IIA — IIA is definite but mildly ill NEC; the systemic deterioration and portal venous gas in this stem push the infant beyond IIA.; C. Stage IIIA — IIIA requires severe systemic illness such as hypotension, severe acidosis, respiratory failure, DIC or marked peritonitis without free air.; D. Stage IIIB — IIIB requires perforation with pneumoperitoneum.", "pearl": "IIB = definite NEC plus moderate systemic deterioration/portal gas; IIIA = severe illness without free air; IIIB = perforated.", "srcAnswer": "B"}, {"num": 78, "level": "Integrated/Rank-Differentiating", "question": "A 900-g infant on fortified human milk has poor linear growth, rising alkaline phosphatase and low serum phosphate while calcium is normal. Which interpretation/action is most appropriate?", "options": ["Suspect metabolic bone disease of prematurity and review calcium/phosphate/vitamin-D delivery plus overall protein-energy intake", "Stop fortification because fortifier is the likely cause", "Diagnose PN-associated cholestasis from the alkaline phosphatase alone", "Increase free water without changing mineral intake"], "answer": 0, "explanation": "Poor growth with elevated alkaline phosphatase and low phosphate in an extremely preterm infant suggests metabolic bone disease of prematurity; mineral and overall nutrient delivery should be reviewed. Closest distractor: ALP must be interpreted with phosphate, growth and prematurity; direct bilirubin, not ALP alone, drives the cholestasis question. Why not the others: B. Stop fortification because fortifier is the likely cause — Fortification usually improves protein and mineral delivery; stopping it can worsen the underlying deficit.; C. Diagnose PN-associated cholestasis from the alkaline phosphatase alone — Cholestasis is assessed with direct bilirubin and liver parameters; isolated ALP elevation in this context points toward bone/mineral turnover.; D. Increase free water without changing mineral intake — Free water does not correct phosphate/mineral deficiency and may worsen nutrient density.", "pearl": "In a very preterm infant, rising ALP + low phosphate + poor growth should trigger a mineral-delivery and metabolic-bone-disease review.", "srcAnswer": "A"}, {"num": 79, "level": "Integrated/Rank-Differentiating", "question": "A 26-week infant on day 12 has Bell IIB NEC with portal gas. After 48 hours, lactate rises, platelets fall, abdominal wall erythema progresses and ultrasound shows absent perfusion but there is still no free air. Which single management principle is most important?", "options": ["Restart trophic human milk to reduce PN exposure", "Escalate urgently to pediatric surgery for suspected nonviable bowel; do not wait for pneumoperitoneum", "Remain on the same plan until Bell IIIB criteria appear", "Delay surgery because cultures are negative"], "answer": 1, "explanation": "Serial clinical, laboratory and ultrasound deterioration can indicate necrotic bowel before perforation; surgery may be required without free air. Closest distractor: The closest distractor is waiting for IIIB; that confuses an absolute indication with the only indication.", "pearl": "Free air is an absolute indication, not a prerequisite for surgery.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day8',label:'Day 8',set:'Quiz 5',href:'Day8/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day8_QuizSet5_Q65-79_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 8 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 65–79</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 8'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 8');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day8:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=4041b023"></script></body></html>
