<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=3"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=3"><meta name="theme-color" content="#1e3a8a"><meta name="color-scheme" content="only light">
<title>Day 22 — Calculation Drill</title><style>:root{color-scheme:only light}
:root{--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}
.ansrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ansrow input{font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;width:200px;font-variant-numeric:tabular-nums}
.ansrow input:focus{outline:none;border-color:var(--blue)}.unit{font-size:17px;font-weight:650;color:#334155}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.feedback{margin-top:18px;padding:16px;border-radius:14px;line-height:1.6}
.feedback.correct{background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.work{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.trap{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.row{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.5}.row.ok{border-color:#bbf7d0;background:#f0fdf4}.row.no{border-color:#fecaca;background:#fff7f7}
@media(max-width:650px){.wrap{padding:12px 10px 20px}h1{font-size:20px}.q{font-size:17px}.card{padding:14px}.ansrow input{width:100%;font-size:18px}.stats{grid-template-columns:1fr 1fr 1fr}.actions button{flex:1}}
</style></head>
<body><div class="wrap">
<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><a class="btn secondary" href="index.html#/quizzes">← Day 22 portal</a><span data-countdown="chip"></span></div>
<h1>Day 22 — Calculation Drill</h1>
<div class="sub">Numeric problems · type your answer in the unit shown · answers within about 2% (rounding) count as correct · not scored with the MCQs</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span></div>
<div class="card" id="app"></div>
</div>
<script>
const CALC=[{"num": 1, "tol": null, "title": "EEG discharge frequency", "question": "A generalized spike-wave pattern shows 18 cycles in 6 seconds. What is its frequency?", "working": "18 / 6 = 3 Hz", "trap": "Do not confuse number of cycles with duration.", "parts": [{"answer": 3, "unit": "Hz"}], "answer": 3, "unit": "Hz"}, {"num": 2, "tol": null, "title": "EEG period per cycle", "question": "A discharge runs at 2.5 Hz. What is the approximate period of one cycle, in milliseconds?", "working": "1 / 2.5 = 0.4 s = 400 ms", "trap": "Hz means cycles per second.", "parts": [{"answer": 400, "unit": "ms"}], "answer": 400, "unit": "ms"}, {"num": 3, "tol": null, "title": "Seizure burden", "question": "Over 60 minutes of EEG, six electrographic seizures last 40, 55, 35, 60, 50 and 60 seconds. What is the percent seizure burden?", "working": "(40 + 55 + 35 + 60 + 50 + 60) / 3600 × 100 = 300 / 3600 × 100 = 8.33%", "trap": "Convert monitoring duration to seconds first.", "parts": [{"answer": 8.33, "unit": "%"}], "answer": 8.33, "unit": "%"}, {"num": 4, "tol": null, "title": "Dextrose % from GIR (repair)", "question": "At 120 mL/kg/day, what dextrose concentration (%) supplies a GIR of 7 mg/kg/min?", "working": "7 × 144 / 120 = 8.4% (D8.4)", "trap": "Do not omit the 144 conversion factor.", "parts": [{"answer": 8.4, "unit": "%"}], "answer": 8.4, "unit": "%"}, {"num": 5, "tol": null, "title": "F-75 daily volume (repair)", "question": "A 7.5-kg child is ordered F-75 at 130 mL/kg/day. What is the total volume per day?", "working": "7.5 × 130 = 975 mL/day", "trap": "Do not treat the rate as the daily total.", "parts": [{"answer": 975, "unit": "mL/day"}], "answer": 975, "unit": "mL/day"}, {"num": 6, "tol": null, "title": "F-100 kcal conversion (repair)", "question": "At a 1 kcal/mL F-100 equivalent, what theoretical volume supplies 1,350 kcal?", "working": "1350 / 1 = 1,350 mL", "trap": "Theoretical equivalence is not a clinical fluid prescription.", "parts": [{"answer": 1350, "unit": "mL"}], "answer": 1350, "unit": "mL"}, {"num": 7, "tol": null, "title": "D10 glucose mass (repair)", "question": "A child receives 27.5 mL of D10. How much glucose is delivered?", "working": "27.5 × 0.1 g/mL = 2.75 g", "trap": "D10 is 10 g/100 mL, not 10 g/mL.", "parts": [{"answer": 2.75, "unit": "g"}], "answer": 2.75, "unit": "g"}, {"num": 8, "tol": null, "title": "Corrected age", "question": "An infant born at 29 weeks GA is now 15 weeks old. What is the corrected age?", "working": "15 − (40 − 29) = 4 weeks", "trap": "PMA = 44 weeks; corrected age is 4 weeks, not 44.", "parts": [{"answer": 4, "unit": "weeks"}], "answer": 4, "unit": "weeks"}];
const DAY=22, KEY='portal:Day'+DAY+':calc';
let i=0;const res=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n.toFixed(2)).toString();
const close=(v,c)=>Math.abs(v-c.answer)<=(c.tol!=null?c.tol:Math.max(Math.abs(c.answer)*0.02,0.05));   // per answer box
function head(){
  document.getElementById('counter').textContent=`Problem ${Math.min(i+1,CALC.length)} / ${CALC.length}`;
  document.getElementById('score').textContent=`Correct: ${res.filter(r=>r.ok).length}`;
  document.getElementById('progress').style.width=(res.length/CALC.length*100)+'%';
}
function show(){
  head();const c=CALC[i],r=res[i];
  document.getElementById('app').innerHTML=`<div class="badge">${esc(c.title)}</div>
  <div class="q">C${c.num}. ${esc(c.question)}</div>
  ${parts(c).map((p,k)=>`${p.label?`<div class="small" style="margin:10px 0 4px;color:#475569;font-weight:600">${esc(p.label)}</div>`:''}<div class="ansrow"><input class="ans" data-k="${k}" inputmode="decimal" autocomplete="off" placeholder="Your answer" ${r?'disabled value="'+esc(r.raws[k])+'"':''}><span class="unit">${esc(p.unit)}</span></div>`).join('')}
  <div class="err" id="err"></div>
  ${r?`<div class="feedback ${r.ok?'correct':'wrong'}"><b>${r.ok?'Correct':'Not quite'}</b> — answer: <b>${parts(c).map(p=>`${fmt(p.answer)}${p.tol!=null?' ±'+fmt(p.tol):''} ${esc(p.unit)}`).join(' · ')}</b>${r.ok?'':` (you entered ${esc(r.raws.join(' · '))})`}
     <div class="work"><b>Working:</b> ${esc(c.working)}</div>${c.trap?`<div class="trap"><b>Trap:</b> ${esc(c.trap)}</div>`:''}</div>`:''}
  <div class="actions">${r?`<button class="primary" id="next">${i===CALC.length-1?'See results':'Next problem'}</button>`:'<button class="primary" id="check">Check answer</button>'}</div>`;
  const ins=[...document.querySelectorAll('input.ans')];
  if(!r){ins[0].focus();ins.forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});inp.addEventListener('input',()=>document.getElementById('err').textContent='');});document.getElementById('check').onclick=check;}
  else document.getElementById('next').onclick=()=>{i++;i<CALC.length?show():finish();};
}
const parts=c=>c.parts&&c.parts.length?c.parts:[{answer:c.answer,unit:c.unit,tol:c.tol}];
function check(){
  const c=CALC[i],raws=[...document.querySelectorAll('input.ans')].map(x=>x.value.trim().replace(',','.'));
  if(raws.some(raw=>raw===''||!/^-?\d*\.?\d+$/.test(raw))){document.getElementById('err').textContent='Enter a number in every box (digits and a decimal point only).';return;}
  const oks=parts(c).map((p,k)=>close(parseFloat(raws[k]),p));
  res[i]={raw:raws.join(' · '),raws,ok:oks.every(Boolean)};show();
}
function finish(){
  head();const n=CALC.length,ok=res.filter(r=>r.ok).length;
  try{const p=JSON.parse(localStorage.getItem(KEY))||{best:0,attempts:0};localStorage.setItem(KEY,JSON.stringify({n,best:Math.max(p.best||0,ok),last:ok,attempts:(p.attempts||0)+1,at:Date.now()}));}catch(e){}
  const wrong=CALC.map((c,k)=>[c,res[k]]).filter(([,r])=>!r.ok);
  const lines=[`Score: ${ok} / ${n}`,...(wrong.length?['','Wrong: Day → Problem → Entered → Correct',...wrong.map(([c,r])=>`Day ${DAY} → C${c.num} ${c.title} → ${r.raw} → ${parts(c).map(p=>fmt(p.answer)+' '+p.unit).join(' · ')}`)]:['All correct'])];
  Notify.send(`Day ${DAY} — Calculation Drill: ${ok}/${n}`,'abacus',lines.join('\n'));
  document.getElementById('app').innerHTML=`<h2 style="margin-top:0">Drill finished</h2>
  <div class="stats"><div class="stat"><strong>${ok}/${n}</strong>Correct</div><div class="stat"><strong>${n-ok}</strong>Wrong</div><div class="stat"><strong>${Math.round(ok/n*100)}%</strong>Accuracy</div></div>
  ${CALC.map((c,k)=>`<div class="row ${res[k].ok?'ok':'no'}"><b>C${c.num}. ${esc(c.title)}</b> — ${res[k].ok?'✓':'✗'} you: ${esc(res[k].raw)} · answer: <b>${parts(c).map(p=>fmt(p.answer)+' '+esc(p.unit)).join(' · ')}</b><br><span style="color:#475569">${esc(c.working)}</span></div>`).join('')}
  <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to quizzes</a><button class="primary" onclick="location.reload()">Retake drill</button></div>`;
}
show();
</script><script src="../assets/notify.js?v=a980f196"></script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
