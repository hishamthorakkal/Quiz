@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 35, "level": "", "question": "A 20-month-old has two febrile seizures during the same illness, each lasting 4 minutes and generalized, with full recovery. Best classification?", "options": ["Dravet syndrome with prolonged fever-triggered seizures", "Simple febrile seizure (single generalized event)", "Epilepsy with unprovoked recurrent seizures", "Complex febrile seizure (recurrent in 24 h)"], "answer": 3, "explanation": "Recurrence within 24 hours makes the episode complex despite brief generalized seizures. Why not the others: A. Dravet syndrome with prolonged fever-triggered seizures — Recurrent brief generalized febrile seizures alone do not establish Dravet.; B. Simple febrile seizure (single generalized event) — A simple febrile seizure should not recur within 24 hours.; C. Epilepsy with unprovoked recurrent seizures — These are fever-associated events, not unprovoked seizures.", "pearl": "A single complex criterion is sufficient for complex febrile seizure classification.", "srcAnswer": "D"}, {"num": 36, "level": "", "question": "Which EEG feature most strongly distinguishes Lennox–Gastaut syndrome from childhood absence epilepsy?", "options": ["Normal background with brief 3-Hz generalized spike-wave", "Isolated photic driving without epileptiform discharge", "Sleep-activated centrotemporal sharp waves with normal background", "Slow generalized spike-and-wave ≤2.5 Hz plus sleep paroxysmal fast activity"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (Normal background with brief 3-Hz generalized spike-wave). Decisive discriminator: LGS EEG includes both slow spike-wave and sleep paroxysmal fast activity. Why not the others: A. Normal background with brief 3-Hz generalized spike-wave — This favors CAE rather than LGS.; B. Isolated photic driving without epileptiform discharge — Physiologic photic driving is not diagnostic of LGS.; C. Sleep-activated centrotemporal sharp waves with normal background — This favors SeLECTS.", "pearl": "LGS EEG includes both slow spike-wave and sleep paroxysmal fast activity.", "srcAnswer": "D"}, {"num": 37, "level": "", "question": "A previously normally developing 3-year-old develops sudden brief shoulder jerks immediately followed by head drops and falls. EEG: generalized 3–5-Hz polyspike-wave. Best syndrome?", "options": ["Infantile epileptic spasms syndrome", "Epilepsy with myoclonic–atonic seizures", "Lennox–Gastaut syndrome", "Self-limited epilepsy with autonomic seizures"], "answer": 1, "explanation": "Myoclonic jerk followed by loss of tone is defining for EMAtS. Why not the others: A. Infantile epileptic spasms syndrome — Spasms begin in infancy and often cluster on awakening.; C. Lennox–Gastaut syndrome — LGS typically has tonic seizures and slow spike-wave ≤2.5 Hz.; D. Self-limited epilepsy with autonomic seizures — Autonomic vomiting episodes, not myoclonic–atonic drops, predominate.", "pearl": "EMAtS was historically called Doose syndrome.", "srcAnswer": "B"}, {"num": 38, "level": "", "question": "A 10-year-old has two afebrile unprovoked stereotyped focal seizures 3 days apart; both routine EEGs are normal. What is the best conclusion?", "options": ["The child needs a third seizure to qualify", "The episodes are unclassified acute symptomatic seizures", "Normal EEG rules out epilepsy", "Epilepsy is established clinically despite normal interictal EEG"], "answer": 3, "explanation": "Two unprovoked seizures >24 hours apart meet ILAE definition; EEG may be normal. Why not the others: A. The child needs a third seizure to qualify — A third event is not required under the practical definition.; B. The episodes are unclassified acute symptomatic seizures — No provoking metabolic or acute illness is described.; C. Normal EEG rules out epilepsy — Normal interictal studies do not override qualifying clinical history.", "pearl": "Clinical epilepsy definition and EEG sensitivity are different concepts.", "srcAnswer": "D"}, {"num": 39, "level": "", "question": "A 9-month-old with prolonged fever-sensitive hemiclonic seizures has a normal early EEG and normal development. Which combined statement is best?", "options": ["Dravet is possible; EEG may initially be normal and genetic testing can aid diagnosis", "Only generalized 3-Hz spike-wave confirms Dravet", "Any fever-associated seizure automatically meets epilepsy definition", "Normal EEG excludes Dravet; treat as uncomplicated SeLECTS"], "answer": 0, "explanation": "Phenotype precedes the emergence of many EEG abnormalities. Why not the others: B. Only generalized 3-Hz spike-wave confirms Dravet — 3-Hz spike-wave is an absence marker, not a Dravet requirement.; C. Any fever-associated seizure automatically meets epilepsy definition — Febrile seizures alone are not necessarily epilepsy.; D. Normal EEG excludes Dravet; treat as uncomplicated SeLECTS — SeLECTS onset is later and early EEG may be normal in Dravet.", "pearl": "Normal early investigations do not erase a strong Dravet phenotype.", "srcAnswer": "A"}, {"num": 40, "level": "", "question": "A 7-month-old has a 24-minute hemiclonic febrile seizure and a similar event 3 weeks later. Development was normal before onset. Which is most appropriate?", "options": ["Suspected Dravet syndrome needing specialist review", "Classify as routine simple febrile seizures", "Childhood absence epilepsy despite infant onset", "Conclude epilepsy is excluded because fever was present"], "answer": 0, "explanation": "Prolonged recurrent hemiclonic fever-sensitive seizures in infancy are a Dravet red flag. Why not the others: B. Classify as routine simple febrile seizures — Focal prolonged events are not simple febrile seizures.; C. Childhood absence epilepsy despite infant onset — CAE occurs later with frequent typical absences.; D. Conclude epilepsy is excluded because fever was present — Febrile triggers do not exclude an epilepsy syndrome.", "pearl": "Prolonged hemiclonic febrile seizures in infancy are not routine simple febrile seizures.", "srcAnswer": "A"}, {"num": 41, "level": "", "question": "A child has new acquired language regression with sleep spike-wave activation. Why is a 20-minute awake EEG inadequate as the only test?", "options": ["MRI is never needed in these children", "Awake EEG cannot show any epileptiform discharge", "NREM sleep may show much greater epileptiform burden than wakefulness", "Only REM sleep reveals spike-wave activation"], "answer": 2, "explanation": "The key syndrome-defining activation can be missed without sleep. Why not the others: A. MRI is never needed in these children — Imaging may be indicated depending on phenotype and examination.; B. Awake EEG cannot show any epileptiform discharge — Awake recordings may show discharges but may underestimate sleep activation.; D. Only REM sleep reveals spike-wave activation — NREM sleep is particularly important for SWAS.", "pearl": "Sleep state matters when evaluating epilepsy-associated cognitive regression.", "srcAnswer": "C"}, {"num": 42, "level": "", "question": "Why is recording drowsiness and non-REM sleep valuable when SeLECTS is suspected?", "options": ["Sleep converts all focal epilepsies to generalized epilepsies", "Sleep removes all focal epileptiform discharges", "Centrotemporal epileptiform discharges are often activated by sleep", "Only sleep EEG can prove a focal structural lesion"], "answer": 2, "explanation": "Sleep may reveal the characteristic spikes even when the awake record is unrevealing. Why not the others: A. Sleep converts all focal epilepsies to generalized epilepsies — Sleep-related activation does not change seizure-network origin.; B. Sleep removes all focal epileptiform discharges — The opposite can occur; sleep frequently activates centrotemporal spikes.; D. Only sleep EEG can prove a focal structural lesion — EEG localization does not establish an anatomical lesion.", "pearl": "Sleep activation of spikes is an important SeLECTS clue.", "srcAnswer": "C"}, {"num": 43, "level": "", "question": "A 7-year-old with previously normal speech develops auditory verbal agnosia, nocturnal focal seizures and near-continuous temporal spikes in NREM sleep. Most appropriate syndrome framing?", "options": ["Childhood absence epilepsy because staring may occur", "Epilepsy–aphasia / SWAS spectrum", "Sleep-related parasomnia with language regression", "Uncomplicated SeLECTS because focal spikes are present"], "answer": 1, "explanation": "Acquired receptive language loss with sleep-activated temporal spikes is the key phenotype. Why not the others: A. Childhood absence epilepsy because staring may occur — Absence EEG and semiology do not explain the acquired auditory agnosia.; C. Sleep-related parasomnia with language regression — Parasomnias do not explain progressive aphasia with epileptiform sleep activation.; D. Uncomplicated SeLECTS because focal spikes are present — Regression changes the syndrome and requires further evaluation.", "pearl": "A syndrome can evolve; reassess when cognition or language changes.", "srcAnswer": "B"}, {"num": 44, "level": "", "question": "An 8-year-old previously diagnosed with SeLECTS develops acquired dyslexia and behavioral regression. Which new investigation has the highest immediate diagnostic yield?", "options": ["Skull X-ray for cortical calcification", "Repeat a 5-minute awake EEG only", "Overnight EEG quantifying sleep spike-wave activation", "Routine visual-evoked potentials"], "answer": 2, "explanation": "Close-distractor check: tempting alternative A (Skull X-ray for cortical calcification). Decisive discriminator: Sleep EEG is a management-changing test in SeLECTS with regression. Why not the others: A. Skull X-ray for cortical calcification — This does not evaluate acquired epilepsy-related cognitive regression.; B. Repeat a 5-minute awake EEG only — Awake EEG may miss the marked NREM activation.; D. Routine visual-evoked potentials — VEP does not assess epileptiform burden in NREM sleep.", "pearl": "Sleep EEG is a management-changing test in SeLECTS with regression.", "srcAnswer": "C"}, {"num": 45, "level": "", "question": "A 4-year-old with developmental delay has tonic seizures during sleep, atypical absences and falls. EEG shows 2-Hz slow spike-wave plus sleep fast activity. Best syndrome?", "options": ["Childhood absence epilepsy", "Lennox–Gastaut syndrome", "Self-limited epilepsy with centrotemporal spikes", "Epilepsy with eyelid myoclonia"], "answer": 1, "explanation": "Multiple seizure types and characteristic slow spike-wave/fast activity fit LGS. Why not the others: A. Childhood absence epilepsy — CAE lacks slow spike-wave and tonic sleep seizures.; C. Self-limited epilepsy with centrotemporal spikes — SeLECTS has focal oropharyngeal seizures and normal background.; D. Epilepsy with eyelid myoclonia — Eye-closure-provoked eyelid jerks are not the main feature.", "pearl": "Sleep tonic seizures are an important LGS clue.", "srcAnswer": "B"}, {"num": 46, "level": "", "question": "A child with developmental impairment has prolonged staring and gradual recovery; EEG shows 2-Hz generalized slow spike-wave. Best classification of the episodes?", "options": ["Eyelid myoclonia", "Focal preserved-consciousness seizures", "Typical absence seizures", "Atypical absence seizures"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (Eyelid myoclonia). Decisive discriminator: Atypical absence often occurs in an epileptic encephalopathy context. Why not the others: A. Eyelid myoclonia — The primary event is not rhythmic eye-closure-triggered eyelid jerking.; B. Focal preserved-consciousness seizures — Behavioral impairment and generalized EEG argue against focal preserved consciousness.; C. Typical absence seizures — Typical absence usually has abrupt events with ~3-Hz generalized spike-wave.", "pearl": "Atypical absence often occurs in an epileptic encephalopathy context.", "srcAnswer": "D"}, {"num": 47, "level": "", "question": "A 14-year-old drops a toothbrush each morning because of sudden bilateral arm jerks after staying awake late. Later has a generalized convulsion. EEG: generalized polyspike-wave. Diagnosis?", "options": ["Juvenile myoclonic epilepsy", "Epilepsy with myoclonic–atonic seizures", "Lennox–Gastaut syndrome", "Self-limited epilepsy with centrotemporal spikes"], "answer": 0, "explanation": "Morning myoclonus, sleep deprivation trigger and generalized polyspike-wave are classic. Why not the others: B. Epilepsy with myoclonic–atonic seizures — EMAtS usually starts in younger children and involves loss of tone after jerk.; C. Lennox–Gastaut syndrome — LGS has tonic/drop seizures with developmental impairment and slow spike-wave.; D. Self-limited epilepsy with centrotemporal spikes — SeLECTS presents with focal nocturnal oropharyngeal symptoms.", "pearl": "Ask adolescents specifically about morning jerks and dropped objects.", "srcAnswer": "A"}, {"num": 48, "level": "", "question": "A 16-month-old has a 3-minute generalized seizure during fever, then fully recovers. EEG done next day shows nonspecific slowing. Which conclusion is best?", "options": ["The child meets the two-unprovoked-seizure definition", "The event must be a focal seizure", "A single simple febrile seizure remains the leading clinical classification", "Nonspecific slowing proves an epileptic encephalopathy"], "answer": 2, "explanation": "Transient slowing after illness/seizure does not by itself establish epilepsy. Why not the others: A. The child meets the two-unprovoked-seizure definition — Only one fever-associated event occurred.; B. The event must be a focal seizure — No focal onset is reported.; D. Nonspecific slowing proves an epileptic encephalopathy — Background slowing is not syndrome-specific and may be transient.", "pearl": "EEG nonspecificity matters especially after an acute event.", "srcAnswer": "C"}, {"num": 49, "level": "", "question": "A preterm infant has a saw-tooth rise on aEEG and evolving rhythmic discharges on simultaneous raw EEG, with minimal visible movements. Best interpretation?", "options": ["Normal neonatal discontinuity", "Electrographic neonatal seizure", "Isolated electrode artifact", "Physiologic sleep cycling"], "answer": 1, "explanation": "Evolution on raw EEG with a compatible aEEG trend supports seizure despite subtle clinical signs. Why not the others: A. Normal neonatal discontinuity — Discontinuity alone does not explain an evolving rhythmic seizure pattern.; C. Isolated electrode artifact — Artifact generally lacks a reproducible evolving cerebral ictal pattern.; D. Physiologic sleep cycling — Sleep cycling does not produce evolving ictal discharges.", "pearl": "Raw EEG is necessary to confirm suspicious aEEG patterns.", "srcAnswer": "B"}, {"num": 50, "level": "", "question": "Which feature most strongly favors epilepsy with eyelid myoclonia over a simple motor tic?", "options": ["Suppressible eyelid movements with premonitory urge", "Brief rhythmic eyelid jerks with upward eye deviation immediately after eye closure in bright light", "Infrequent eyelid movement only when fatigued without eye-closure sensitivity", "Isolated blinking during dry-eye irritation"], "answer": 1, "explanation": "Eye-closure sensitivity and associated generalized EEG activity support epileptic eyelid myoclonia. Why not the others: A. Suppressible eyelid movements with premonitory urge — Suppressibility and urge are characteristic of tics.; C. Infrequent eyelid movement only when fatigued without eye-closure sensitivity — This lacks the characteristic photosensitive/eye-closure phenotype.; D. Isolated blinking during dry-eye irritation — Peripheral ocular irritation is a common non-epileptic explanation.", "pearl": "Eye closure in light is a distinctive trigger for eyelid myoclonia.", "srcAnswer": "B"}, {"num": 51, "level": "", "question": "A normally developing 7-month-old has a prolonged fever-associated hemiclonic seizure; months later similar alternating-sided events occur. Initial EEG was normal. Best evolving syndrome?", "options": ["Childhood absence epilepsy", "Self-limited infantile epilepsy", "Self-limited epilepsy with centrotemporal spikes", "Dravet syndrome with fever-sensitive infantile seizures"], "answer": 3, "explanation": "Prolonged fever-sensitive hemiclonic seizures in infancy with initially normal development suggest Dravet. Why not the others: A. Childhood absence epilepsy — Typical absence seizures are brief and not prolonged hemiclonic events.; B. Self-limited infantile epilepsy — Self-limited infantile focal seizures are usually short with favorable course.; C. Self-limited epilepsy with centrotemporal spikes — SeLECTS begins later with brief oropharyngeal focal seizures.", "pearl": "Early EEG may be normal in Dravet syndrome.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day22',label:'Day 22',set:'Quiz 3',href:'Day22/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day22_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 22 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 22 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 22'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 22');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day22:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
