@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "", "question": "A 6-year-old has 20 daily 8-second staring spells with eyelid flutter, immediate recovery and no postictal confusion. Hyperventilation elicits 3-Hz generalized spike-wave. Best diagnosis?", "options": ["Lennox–Gastaut syndrome", "Childhood absence epilepsy", "Focal impaired-consciousness epilepsy", "Juvenile absence epilepsy"], "answer": 1, "explanation": "Frequent daily brief typical absences with classic EEG and age support CAE. Why not the others: A. Lennox–Gastaut syndrome — LGS typically has multiple seizure types, abnormal background and slow spike-wave.; C. Focal impaired-consciousness epilepsy — Focal spells are usually longer and may have focal evolution or postictal symptoms.; D. Juvenile absence epilepsy — JAE usually begins later and often has less frequent absence seizures.", "pearl": "CAE has multiple daily typical absences and normal baseline neurological function.", "srcAnswer": "B"}, {"num": 2, "level": "", "question": "A 6-year-old has episodes of pallor, vomiting, eye deviation and prolonged unresponsiveness with normal development between attacks. EEG has posterior spikes; a separate short EEG is normal. Best conclusion?", "options": ["SeLEAS is likely despite a normal second routine EEG", "IESS because events cluster during illness", "Normal second EEG rules out focal epilepsy", "LGS because one episode was prolonged"], "answer": 0, "explanation": "Clinical autonomic phenotype and intermittent EEG abnormalities fit SeLEAS. Why not the others: B. IESS because events cluster during illness — IESS requires epileptic spasms in infancy.; C. Normal second EEG rules out focal epilepsy — Interictal EEG may vary across recordings.; D. LGS because one episode was prolonged — LGS requires a different seizure/EEG/developmental pattern.", "pearl": "Interictal EEG variability does not negate a consistent syndrome phenotype.", "srcAnswer": "A"}, {"num": 3, "level": "", "question": "A 6-week-old has frequent tonic seizures, poor interaction and EEG with burst-suppression. Which syndrome category fits best?", "options": ["Self-limited epilepsy with centrotemporal spikes", "Childhood absence epilepsy", "Self-limited neonatal epilepsy", "Early-infantile developmental and epileptic encephalopathy"], "answer": 3, "explanation": "Early tonic seizures, developmental impairment and burst-suppression support EIDEE. Why not the others: A. Self-limited epilepsy with centrotemporal spikes — SeLECTS starts years later and is usually self-limited.; B. Childhood absence epilepsy — CAE does not begin at six weeks and has a different EEG.; C. Self-limited neonatal epilepsy — Self-limited neonatal epilepsy has relatively normal development and no burst-suppression.", "pearl": "EIDEE is a modern umbrella term replacing some older early infantile syndrome labels.", "srcAnswer": "D"}, {"num": 4, "level": "", "question": "A child has stereotyped epigastric aura, behavioral arrest, automatisms, then bilateral tonic–clonic movements. Which 2025 ILAE description is most accurate?", "options": ["Generalized tonic–clonic seizure from onset", "Typical absence followed by generalized convulsion", "Unknown-origin bilateral tonic–clonic seizure", "Focal seizure evolving to bilateral tonic–clonic seizure"], "answer": 3, "explanation": "Initial experiential aura and automatisms provide focal onset before bilateral spread. Why not the others: A. Generalized tonic–clonic seizure from onset — Generalized onset is contradicted by the focal aura and evolution.; B. Typical absence followed by generalized convulsion — A focal aura with automatisms is not a typical absence.; C. Unknown-origin bilateral tonic–clonic seizure — The focal onset is documented, so origin is not unknown.", "pearl": "Document temporal evolution instead of labeling only the final convulsion.", "srcAnswer": "D"}, {"num": 5, "level": "", "question": "A neurologically normal 18-month-old has a single generalized 4-minute seizure with fever, no focal features and no recurrence within 24 hours. Which classification fits?", "options": ["Simple febrile seizure", "Febrile status epilepticus", "Dravet syndrome", "Complex febrile seizure"], "answer": 0, "explanation": "Generalized, <15 minutes, once in 24 hours and age appropriate is simple febrile seizure. Why not the others: B. Febrile status epilepticus — The event is far shorter than prolonged febrile status.; C. Dravet syndrome — One typical brief simple febrile seizure alone does not establish Dravet.; D. Complex febrile seizure — Complex features include focality, ≥15 minutes, or recurrence within 24 hours.", "pearl": "Simple febrile seizure: generalized, <15 minutes, no repeat in 24 hours.", "srcAnswer": "A"}, {"num": 6, "level": "", "question": "An 11-year-old has one unprovoked seizure. MRI shows a remote cortical scar, and a specialist estimates a 65% 10-year recurrence risk. Which statement is best?", "options": ["The practical epilepsy definition can be met after one seizure", "Only an abnormal EEG can establish epilepsy after one seizure", "Any cortical scar proves epilepsy without a seizure", "Epilepsy always requires two events separated by at least one month"], "answer": 0, "explanation": "The ≥60% ten-year recurrence criterion is satisfied with documented risk. Why not the others: B. Only an abnormal EEG can establish epilepsy after one seizure — The practical definition is not contingent on a particular EEG finding.; C. Any cortical scar proves epilepsy without a seizure — An epilepsy diagnosis still requires a qualifying event or syndrome.; D. Epilepsy always requires two events separated by at least one month — The ILAE definition includes high-risk single-event situations.", "pearl": "Risk-based diagnosis is permitted after one unprovoked seizure.", "srcAnswer": "A"}, {"num": 7, "level": "", "question": "A previously healthy 5-year-old awakens pale, vomits repeatedly, becomes briefly unresponsive, and has eye deviation; recovery takes an hour. Which syndrome best fits?", "options": ["Self-limited epilepsy with centrotemporal spikes", "Self-limited epilepsy with autonomic seizures", "Childhood absence epilepsy", "Epilepsy with myoclonic–atonic seizures"], "answer": 1, "explanation": "Prolonged autonomic ictal symptoms and vomiting strongly support SeLEAS. Why not the others: A. Self-limited epilepsy with centrotemporal spikes — SeLECTS usually causes oropharyngeal focal motor seizures.; C. Childhood absence epilepsy — Typical absence is brief, frequent, and lacks prolonged vomiting.; D. Epilepsy with myoclonic–atonic seizures — EMAtS causes myoclonic–atonic drops rather than autonomic attacks.", "pearl": "SeLEAS can mimic acute gastrointestinal illness.", "srcAnswer": "B"}, {"num": 8, "level": "", "question": "An adolescent has long fluctuating episodes with asynchronous limb movements and retained responsiveness; typical spells on video EEG have no ictal epileptiform correlate. Most appropriate conclusion?", "options": ["Infantile epileptic spasms syndrome", "Frontal lobe hypermotor epilepsy", "Typical absence epilepsy", "Functional nonepileptic events"], "answer": 3, "explanation": "Habitual event capture with characteristic semiology and no ictal correlate supports a nonepileptic diagnosis. Why not the others: A. Infantile epileptic spasms syndrome — Infantile spasms occur in infancy and are brief clustered flexor/extensor events.; B. Frontal lobe hypermotor epilepsy — Some frontal seizures are hypermotor, but the described captured events need careful electroclinical review.; C. Typical absence epilepsy — Typical absence is brief and has generalized spike-wave during the event.", "pearl": "Video EEG of the habitual event is valuable; some focal seizures may be scalp-EEG-negative.", "srcAnswer": "D"}, {"num": 9, "level": "", "question": "A neonatal aEEG trace rises abruptly during a suspected spell. Raw EEG shows synchronous evolving rhythmic activity over several channels, while the video shows no movement. What is the best next conclusion?", "options": ["Electrographic-only neonatal seizure is likely", "Motion artifact is certain because the video is quiet", "The 2025 ILAE clinical classification calls this generalized absence", "Physiologic sleep cycling is proven"], "answer": 0, "explanation": "An evolving raw EEG ictal pattern can define a neonatal seizure without visible movement. Why not the others: B. Motion artifact is certain because the video is quiet — Lack of movement does not negate a raw EEG ictal pattern.; C. The 2025 ILAE clinical classification calls this generalized absence — Neonatal electrographic seizures use separate neonatal terminology.; D. Physiologic sleep cycling is proven — Sleep cycling does not explain evolving rhythmic ictal activity.", "pearl": "aEEG is screening; raw EEG supplies diagnostic confirmation.", "srcAnswer": "A"}, {"num": 10, "level": "", "question": "A teenager collapses after prolonged standing in a hot room, with nausea, pallor and immediate orientation after lying down; brief jerks occur after loss of tone. Most likely?", "options": ["Generalized tonic–clonic epilepsy", "Convulsive vasovagal syncope", "Typical absence seizure", "Focal to bilateral tonic–clonic seizure"], "answer": 1, "explanation": "Prodrome, posture and rapid recovery favor syncope despite brief myoclonic jerks. Why not the others: A. Generalized tonic–clonic epilepsy — Postictal confusion and abrupt convulsion without vasovagal prodrome are more typical.; C. Typical absence seizure — Absence does not produce sustained collapse with autonomic prodrome.; D. Focal to bilateral tonic–clonic seizure — No focal onset or stereotyped aura is described.", "pearl": "Brief jerks can accompany syncope and are not diagnostic of epilepsy.", "srcAnswer": "B"}, {"num": 11, "level": "", "question": "A child has suspected nocturnal focal seizures but a normal short awake EEG. Which investigation improves the chance of identifying sleep-activated discharges?", "options": ["Brain CT in place of all EEG", "Only hyperventilation without EEG", "Repeat only awake EEG with identical protocol", "Sleep-inclusive or sleep-deprived EEG with appropriate monitoring"], "answer": 3, "explanation": "Drowsiness and sleep can activate epileptiform discharges missed awake. Why not the others: A. Brain CT in place of all EEG — CT does not substitute for electrical event characterization.; B. Only hyperventilation without EEG — Hyperventilation alone cannot characterize nocturnal focal discharges.; C. Repeat only awake EEG with identical protocol — A second identical brief awake study may again miss sleep activation.", "pearl": "A normal routine EEG does not exclude epilepsy.", "srcAnswer": "D"}, {"num": 12, "level": "", "question": "A 7-year-old has 12-second arrest with subtle oral automatisms dozens of times daily. Hyperventilation evokes generalized 3-Hz spike-wave and immediate recovery. Most defensible diagnosis?", "options": ["Typical absence seizure with automatisms", "Focal impaired-consciousness seizure", "Atypical absence in LGS", "Nonepileptic daydreaming"], "answer": 0, "explanation": "Close-distractor check: tempting alternative B (Focal impaired-consciousness seizure). Decisive discriminator: Oral automatisms do not automatically imply focal epilepsy. Why not the others: B. Focal impaired-consciousness seizure — Focal seizures can have automatisms, but typical generalized 3-Hz EEG during events favors absence.; C. Atypical absence in LGS — Atypical absences usually accompany slower EEG and abnormal development/background.; D. Nonepileptic daydreaming — An ictal generalized spike-wave correlate confirms epileptic events.", "pearl": "Oral automatisms do not automatically imply focal epilepsy.", "srcAnswer": "A"}, {"num": 13, "level": "", "question": "An 8-month-old has clusters of brief focal seizures, normal MRI and development, and a family history of similar self-remitting infantile seizures. Which diagnosis is most likely?", "options": ["Epilepsy of infancy with migrating focal seizures", "Dravet syndrome (SCN1A-associated epilepsy)", "Self-limited (familial) infantile epilepsy", "Infantile epileptic spasms syndrome"], "answer": 2, "explanation": "Infantile brief focal clusters with normal development and family history fit SeLIE. Why not the others: A. Epilepsy of infancy with migrating focal seizures — Migrating seizures and developmental impairment are absent.; B. Dravet syndrome (SCN1A-associated epilepsy) — Prolonged fever-sensitive hemiclonic seizures and later deterioration are more characteristic.; D. Infantile epileptic spasms syndrome — Clusters of spasms and developmental plateau are absent.", "pearl": "PRRT2 variants are a common genetic association with SeLIE.", "srcAnswer": "C"}, {"num": 14, "level": "", "question": "An 8-year-old has brief stereotyped multicolored visual hallucinations in one hemifield followed by eye deviation, with occipital ictal EEG onset. Best syndrome group?", "options": ["Childhood occipital visual epilepsy", "Self-limited epilepsy with centrotemporal spikes", "Self-limited epilepsy with autonomic seizures", "Childhood absence epilepsy"], "answer": 0, "explanation": "Brief elementary visual symptoms with occipital ictal origin fit childhood occipital visual epilepsy. Why not the others: B. Self-limited epilepsy with centrotemporal spikes — SeLECTS has oropharyngeal focal motor symptoms.; C. Self-limited epilepsy with autonomic seizures — SeLEAS has autonomic vomiting and longer autonomic seizures.; D. Childhood absence epilepsy — Absence seizures cause brief staring without a focal visual aura.", "pearl": "Occipital epileptic visual phenomena are often brief, colored and stereotyped.", "srcAnswer": "A"}, {"num": 15, "level": "", "question": "A child reports a stereotyped unpleasant smell followed by right-arm dystonia and oral automatisms. What is the strongest inference?", "options": ["Focal seizure with sequential sensory and motor features", "Generalized absence with automatisms", "Vasovagal syncope with motor jerks", "Primary paroxysmal movement disorder"], "answer": 0, "explanation": "A stereotyped olfactory aura followed by lateralized signs and automatisms supports focal origin. Why not the others: B. Generalized absence with automatisms — The focal aura and lateralized dystonia argue against generalized typical absence.; C. Vasovagal syncope with motor jerks — Syncope does not usually cause a repeated focal sensory aura and sequential automatisms.; D. Primary paroxysmal movement disorder — The stereotyped experiential aura with altered responsiveness favors seizure.", "pearl": "Describe focal seizure signs in chronological order.", "srcAnswer": "A"}, {"num": 16, "level": "", "question": "A 3-year-old has frequent falls. Video reveals initial myoclonic jerk followed by atonia; EEG shows generalized 4-Hz polyspike-wave and normal background. Best fit?", "options": ["Epilepsy with myoclonic–atonic seizures", "Infantile epileptic spasms syndrome", "Childhood absence epilepsy", "Lennox–Gastaut syndrome"], "answer": 0, "explanation": "Close-distractor check: tempting alternative B (Infantile epileptic spasms syndrome). Decisive discriminator: A drop is a manifestation; the preceding motor sequence defines the seizure. Why not the others: B. Infantile epileptic spasms syndrome — Spasms are not the same as myoclonic–atonic drop attacks.; C. Childhood absence epilepsy — Absences do not produce the characteristic myoclonic–atonic sequence.; D. Lennox–Gastaut syndrome — LGS generally has tonic seizures, slow spike-wave and abnormal background.", "pearl": "A drop is a manifestation; the preceding motor sequence defines the seizure.", "srcAnswer": "A"}, {"num": 17, "level": "", "question": "Which finding is most concerning for an underlying focal structural abnormality in a child with otherwise suspected genetic generalized epilepsy?", "options": ["Brief generalized spike-wave with a normal background", "Persistent reproducible focal slowing in the same region", "Normal posterior dominant rhythm for age", "Physiologic sleep spindles symmetric in N2"], "answer": 1, "explanation": "Persistent focal slowing warrants evaluation for a structural or focal process. Why not the others: A. Brief generalized spike-wave with a normal background — This supports a generalized epilepsy pattern.; C. Normal posterior dominant rhythm for age — A normal background rhythm does not imply a lesion.; D. Physiologic sleep spindles symmetric in N2 — Sleep spindles are normal sleep graphoelements.", "pearl": "Consistent focal slowing is a red flag, not a seizure-type label.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day22',label:'Day 22',set:'Quiz 1',href:'Day22/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day22_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 22 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 22 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 22'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 22');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day22:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
