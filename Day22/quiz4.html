@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 52, "level": "", "question": "A 7-month-old has clusters of 1-second flexor events after waking, loss of babbling and a chaotic high-amplitude EEG. Most likely syndrome?", "options": ["Self-limited epilepsy with centrotemporal spikes", "Childhood absence epilepsy", "Infantile epileptic spasms syndrome", "Self-limited infantile epilepsy"], "answer": 2, "explanation": "Clustered spasms, developmental regression and hypsarrhythmic EEG support IESS. Why not the others: A. Self-limited epilepsy with centrotemporal spikes — Age and spasms are incompatible with typical SeLECTS.; B. Childhood absence epilepsy — Typical absence epilepsy presents later with brief staring, not flexor spasms.; D. Self-limited infantile epilepsy — That syndrome has focal seizures with generally preserved development.", "pearl": "IESS is an urgent developmental-neurology diagnosis.", "srcAnswer": "C"}, {"num": 53, "level": "", "question": "An EEG has interictal spikes but no recorded habitual events. Which statement is most accurate?", "options": ["Spikes always localize a resectable lesion", "Absence of captured seizure rules out epilepsy", "Spikes establish that every reported spell is epileptic", "Interictal spikes support epileptic propensity but require clinical correlation"], "answer": 3, "explanation": "Spikes may strengthen suspicion but are not a stand-alone epilepsy diagnosis. Why not the others: A. Spikes always localize a resectable lesion — Interictal discharges do not automatically define a surgical target.; B. Absence of captured seizure rules out epilepsy — Routine recordings often miss intermittent habitual events.; C. Spikes establish that every reported spell is epileptic — Nonepileptic events may coexist with interictal epileptiform abnormalities.", "pearl": "Interpret interictal EEG in the clinical context.", "srcAnswer": "D"}, {"num": 54, "level": "", "question": "Which statement about neonatal seizures and the ILAE 2025 classification is correct?", "options": ["Neonatal seizures must be labeled generalized by default", "Neonatal seizures are addressed by a separate ILAE framework", "A neonatal electrographic-only event is a 2025 focal clinical seizure", "The 2025 system eliminated neonatal EEG terminology"], "answer": 1, "explanation": "The 2025 clinical seizure update explicitly excludes neonatal seizures. Why not the others: A. Neonatal seizures must be labeled generalized by default — Neonatal seizures frequently have focal electrographic patterns.; C. A neonatal electrographic-only event is a 2025 focal clinical seizure — The 2025 scheme addresses clinical seizures and does not replace neonatal definitions.; D. The 2025 system eliminated neonatal EEG terminology — Separate neonatal classification remains relevant.", "pearl": "Use neonatal-specific electroclinical terminology for neonates.", "srcAnswer": "B"}, {"num": 55, "level": "", "question": "A 13-year-old describes shimmering zigzag visual disturbance gradually spreading over 20 minutes followed by headache, with full awareness and no motor signs. Most likely?", "options": ["Occipital focal seizure", "Typical absence seizure", "Migraine visual aura", "Self-limited epilepsy with autonomic seizures"], "answer": 2, "explanation": "Gradual spread over many minutes followed by headache favors migraine aura. Why not the others: A. Occipital focal seizure — Epileptic visual symptoms are usually briefer and more abrupt.; B. Typical absence seizure — Absence causes impaired behavior, not 20-minute visual scintillation.; D. Self-limited epilepsy with autonomic seizures — Autonomic ictal vomiting rather than progressive visual scintillation is typical.", "pearl": "Gradual visual evolution over 5–60 minutes is characteristic of migraine aura.", "srcAnswer": "C"}, {"num": 56, "level": "", "question": "Which observation distinguishes self-limited epilepsy with autonomic seizures from focal impaired-consciousness seizures of another cause?", "options": ["Brief repetitive hemifacial clonic events with speech arrest", "Prolonged autonomic-dominant attacks with vomiting, often during sleep", "Frequent daily 10-second absences provoked by hyperventilation", "Clusters of flexor spasms on awakening in infancy"], "answer": 1, "explanation": "Ictal vomiting and prolonged autonomic features are typical for SeLEAS. Why not the others: A. Brief repetitive hemifacial clonic events with speech arrest — This is more typical of SeLECTS.; C. Frequent daily 10-second absences provoked by hyperventilation — This favors childhood absence epilepsy.; D. Clusters of flexor spasms on awakening in infancy — This favors IESS.", "pearl": "SeLEAS was historically termed Panayiotopoulos syndrome.", "srcAnswer": "B"}, {"num": 57, "level": "", "question": "A seizure begins with a rising epigastric sensation followed by lip smacking and failure to respond to questions. How should consciousness be classified under the 2025 ILAE scheme?", "options": ["Generalized absence seizure", "Unclassified seizure", "Focal seizure with preserved consciousness", "Focal seizure with impaired consciousness"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (Generalized absence seizure). Decisive discriminator: The 2025 classifier is consciousness, operationalized using awareness and responsiveness. Why not the others: A. Generalized absence seizure — A focal experiential aura preceding automatisms argues against generalized onset.; B. Unclassified seizure — Detailed temporal semiology permits a focal classification.; C. Focal seizure with preserved consciousness — Preservation requires both awareness and responsiveness; the child fails the responsiveness component.", "pearl": "The 2025 classifier is consciousness, operationalized using awareness and responsiveness.", "srcAnswer": "D"}, {"num": 58, "level": "", "question": "A 4-year-old has recurrent falls, developmental regression, tonic seizures in sleep, 2-Hz slow spike-wave awake and sleep paroxysmal fast activity. Most defensible diagnosis?", "options": ["Lennox–Gastaut syndrome", "Epilepsy with myoclonic–atonic seizures", "Self-limited epilepsy with centrotemporal spikes", "Childhood absence epilepsy"], "answer": 0, "explanation": "Tonic sleep seizures plus two hallmark EEG patterns strongly favor LGS. Why not the others: B. Epilepsy with myoclonic–atonic seizures — EMAtS needs jerk–atonia and lacks the typical LGS slow/fast EEG combination.; C. Self-limited epilepsy with centrotemporal spikes — SeLECTS lacks generalized slow spike-wave and tonic sleep seizures.; D. Childhood absence epilepsy — CAE has brief typical absences with ~3-Hz generalized EEG and normal development.", "pearl": "Two EEG signatures plus tonic sleep seizures outweigh nonspecific “falls.”", "srcAnswer": "A"}, {"num": 59, "level": "", "question": "A 6-month-old with suspected spasms has a normal 15-minute awake EEG. Parents show a video of clustered symmetric flexions on waking. Best next step?", "options": ["Wait until school age for a sleep EEG", "Urgent prolonged video EEG capturing sleep and awakening", "Reassure because the routine EEG is normal", "Diagnose CAE and use hyperventilation"], "answer": 1, "explanation": "Close-distractor check: tempting alternative A (Wait until school age for a sleep EEG). Decisive discriminator: Sleep and wake transition increase EEG yield in IESS. Why not the others: A. Wait until school age for a sleep EEG — Delay can compromise developmental outcomes.; C. Reassure because the routine EEG is normal — A short normal awake record cannot exclude IESS.; D. Diagnose CAE and use hyperventilation — CAE does not present as infantile clusters of flexor spasms.", "pearl": "Sleep and wake transition increase EEG yield in IESS.", "srcAnswer": "B"}, {"num": 60, "level": "", "question": "A 6-month-old with clinical spasms has a markedly disorganized EEG in sleep but a relatively improved waking background. Which statement is correct?", "options": ["Only generalized 3-Hz spike-wave can confirm spasms", "A waking improvement excludes epileptic spasms", "IESS requires identical EEG abnormalities in every state", "Sleep–wake variability is compatible with IESS"], "answer": 3, "explanation": "Hypsarrhythmic or multifocal patterns may be accentuated during sleep or awakening. Why not the others: A. Only generalized 3-Hz spike-wave can confirm spasms — 3-Hz spike-wave is associated with typical absence, not IESS.; B. A waking improvement excludes epileptic spasms — Clinical spasms and sleep EEG can still establish the diagnosis.; C. IESS requires identical EEG abnormalities in every state — State-dependent changes are well described.", "pearl": "EEG sampling of sleep is essential in suspected IESS.", "srcAnswer": "D"}, {"num": 61, "level": "", "question": "An untreated cooperative 7-year-old has suspected frequent typical absences. Which EEG activation is most useful?", "options": ["Well-performed approximately 3-minute hyperventilation", "Prolonged breath-holding without EEG", "Only REM sleep recording", "Single flash of light with no EEG recording"], "answer": 0, "explanation": "Hyperventilation frequently elicits generalized spike-wave and clinical absences in CAE. Why not the others: B. Prolonged breath-holding without EEG — This is not standardized EEG activation and may produce syncope.; C. Only REM sleep recording — REM sleep alone is not the preferred provocation for typical absence seizures.; D. Single flash of light with no EEG recording — Intermittent photic stimulation tests photosensitivity, not the strongest CAE activation.", "pearl": "Effective hyperventilation is a high-yield activation maneuver for CAE.", "srcAnswer": "A"}, {"num": 62, "level": "", "question": "A generalized spike-wave discharge fragments into unilateral-appearing spike bursts during sleep. What is the safest interpretation?", "options": ["Conclude a structural focal lesion from one unilateral fragment", "Consider fragmented generalized discharge and review the whole recording", "Diagnose SeLECTS solely from any unilateral spike", "Rule out generalized epilepsy because a focal fragment occurred"], "answer": 1, "explanation": "Generalized spike-wave may fragment in sleep and mimic focal activity. Why not the others: A. Conclude a structural focal lesion from one unilateral fragment — Consistent focal slowing or other concordant evidence is needed.; C. Diagnose SeLECTS solely from any unilateral spike — Centrotemporal morphology, age and semiology are needed for SeLECTS.; D. Rule out generalized epilepsy because a focal fragment occurred — Focal fragments can occur in genetic generalized epilepsies.", "pearl": "Fragmented generalized discharges can appear focal.", "srcAnswer": "B"}, {"num": 63, "level": "", "question": "A 10-year-old has frequent brief eye closure–triggered rhythmic eyelid jerks with upward eye deviation. EEG shows generalized polyspike-wave during eye closure. Best syndrome?", "options": ["Childhood absence epilepsy", "Focal motor epilepsy", "Epilepsy with eyelid myoclonia", "Self-limited epilepsy with centrotemporal spikes"], "answer": 2, "explanation": "Eye-closure sensitivity with generalized EEG correlate is characteristic. Why not the others: A. Childhood absence epilepsy — CAE may show eyelid flutter but not obligatory eye-closure sensitivity.; B. Focal motor epilepsy — A focal motor seizure would not explain consistent generalized eye-closure-triggered activity.; D. Self-limited epilepsy with centrotemporal spikes — SeLECTS produces focal oropharyngeal symptoms rather than photosensitive eyelid myoclonia.", "pearl": "Eyelid myoclonia is a seizure type and can define a syndrome.", "srcAnswer": "C"}, {"num": 64, "level": "", "question": "In a 5-month-old with clusters of flexor spasms and developmental plateau, the most urgent diagnostic next step is:", "options": ["Routine EEG several months later if spasms persist", "Provoked hyperventilation test without EEG", "Prompt awake-and-sleep video EEG including sleep–wake transition", "Elective CT alone before arranging EEG"], "answer": 2, "explanation": "Urgent EEG helps document spasms and the relevant background while treatment planning proceeds. Why not the others: A. Routine EEG several months later if spasms persist — Delay risks ongoing developmental harm in infantile epileptic spasms syndrome.; B. Provoked hyperventilation test without EEG — Hyperventilation is a childhood absence activation technique, not the primary evaluation for spasms.; D. Elective CT alone before arranging EEG — CT does not characterize epileptic spasms or EEG patterns.", "pearl": "Hypsarrhythmia is characteristic but is not present in every child with IESS.", "srcAnswer": "C"}, {"num": 65, "level": "", "question": "A teenager reports brief bilateral jerks only when exposed to rapidly flickering lights. EEG shows photoparoxysmal generalized spike-wave. Which conclusion is most justified?", "options": ["Reflex photosensitive epileptic seizures are plausible", "Only focal occipital epilepsy can be photosensitive", "A photoparoxysmal response always means daily spontaneous seizures", "Any photic driving proves epilepsy"], "answer": 0, "explanation": "Reproducible trigger with generalized epileptiform EEG response supports photosensitivity. Why not the others: B. Only focal occipital epilepsy can be photosensitive — Generalized epilepsies can show photoparoxysmal responses.; C. A photoparoxysmal response always means daily spontaneous seizures — EEG photosensitivity does not necessarily imply frequent spontaneous clinical seizures.; D. Any photic driving proves epilepsy — Physiologic photic driving is not an epileptiform response.", "pearl": "Distinguish physiologic photic driving from a photoparoxysmal response.", "srcAnswer": "A"}, {"num": 66, "level": "", "question": "Which history alone satisfies the usual ILAE practical definition of epilepsy without additional recurrence-risk estimation?", "options": ["One unprovoked seizure with normal examination", "Two febrile seizures on one febrile day", "Two hypoglycemic seizures in separate illnesses", "Two unprovoked seizures 36 hours apart"], "answer": 3, "explanation": "Two unprovoked events more than 24 hours apart meet one operational criterion. Why not the others: A. One unprovoked seizure with normal examination — A single event needs an additional qualifying criterion, such as high recurrence risk or a syndrome.; B. Two febrile seizures on one febrile day — Provoked febrile events do not by themselves establish epilepsy.; C. Two hypoglycemic seizures in separate illnesses — Acute symptomatic seizures do not satisfy the unprovoked-event criterion.", "pearl": "Epilepsy definition includes syndrome diagnosis and selected single-seizure high-risk situations.", "srcAnswer": "D"}, {"num": 67, "level": "", "question": "A 5-month-old has repeated flexion clusters only on waking, often with brief eye elevation and developmental plateau. A video captures events but the first EEG lacks hypsarrhythmia. Best next interpretation?", "options": ["Treat as suspected IESS requiring urgent epilepsy evaluation", "Sandifer syndrome because flexion is brief", "Benign startle because no hypsarrhythmia was captured", "Simple febrile seizure because events are brief"], "answer": 0, "explanation": "Spasms and developmental change are compelling even without classic hypsarrhythmia. Why not the others: B. Sandifer syndrome because flexion is brief — Sandifer is associated with feeding/reflux-related dystonia rather than stereotyped awakening clusters.; C. Benign startle because no hypsarrhythmia was captured — Spasms may show focal/multifocal discharges or be missed in short EEG.; D. Simple febrile seizure because events are brief — Febrile seizures do not present as daily clusters of infantile spasms.", "pearl": "Classic EEG patterns are helpful but not absolute requirements.", "srcAnswer": "A"}, {"num": 68, "level": "", "question": "A 12-year-old has eye-closure-triggered eyelid jerks and EEG generalized polyspike-wave. Which EEG maneuver is most informative when performed safely?", "options": ["Only recording during deep sleep", "Hyperventilation as the sole maneuver", "Eye closure in a well-lit setting with simultaneous EEG/video", "Stopping EEG during bright-light exposure"], "answer": 2, "explanation": "Eye-closure sensitivity is central to the epilepsy-with-eyelid-myoclonia phenotype. Why not the others: A. Only recording during deep sleep — Sleep may show discharges but misses the characteristic eye-closure trigger.; B. Hyperventilation as the sole maneuver — Hyperventilation is useful for absence, but eye closure is more specific here.; D. Stopping EEG during bright-light exposure — The event must be correlated with EEG safely to distinguish epileptic from nonepileptic jerks.", "pearl": "Eye closure and photosensitivity are distinct but often linked phenomena.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day22',label:'Day 22',set:'Quiz 4',href:'Day22/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day22_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 22 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 22 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 22'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 22');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day22:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
