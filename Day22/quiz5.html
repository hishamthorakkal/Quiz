@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 69, "level": "", "question": "An EEG rhythmic pattern appears only on one lead when the child chews, disappears with jaw relaxation and lacks evolution across neighboring channels. Best interpretation?", "options": ["Centrotemporal interictal spike", "Generalized spike-wave", "Muscle/movement artifact", "Focal electrographic seizure"], "answer": 2, "explanation": "Behavior-linked, non-evolving single-channel activity supports artifact. Why not the others: A. Centrotemporal interictal spike — An epileptiform spike has a cerebral field and stereotyped morphology.; B. Generalized spike-wave — A generalized discharge is bilateral and synchronous across many leads.; D. Focal electrographic seizure — True ictal activity usually shows plausible field and evolution.", "pearl": "EEG artifacts must be checked against behavior and electrode fields.", "srcAnswer": "C"}, {"num": 70, "level": "", "question": "An infant has fever-triggered prolonged hemiclonic seizures and normal early MRI/EEG. Which finding would most strongly reinforce a Dravet syndrome diagnosis?", "options": ["Normal EEG at first seizure assessment", "PRRT2 variant with self-remitting brief infantile seizures", "Pathogenic SCN1A loss-of-function variant in the appropriate phenotype", "KCNQ2 variant with self-limited neonatal day-3 seizures"], "answer": 2, "explanation": "SCN1A is a major genetic cause of Dravet; phenotype remains essential. Why not the others: A. Normal EEG at first seizure assessment — Early normal EEG is compatible but less specific than a relevant pathogenic variant.; B. PRRT2 variant with self-remitting brief infantile seizures — PRRT2 is more typical of self-limited infantile epilepsy.; D. KCNQ2 variant with self-limited neonatal day-3 seizures — This phenotype suggests SeLNE, not classic Dravet.", "pearl": "SCN1A is common but genetic negativity does not completely exclude Dravet.", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A 9-year-old has recurrent 15-second multicolored visual circles, abrupt onset and ipsilateral eye deviation. EEG shows occipital spikes. Which feature most separates epilepsy from migraine aura?", "options": ["Visual phenomena in both eyes", "Presence of a headache after the event", "Abrupt stereotyped seconds-long visual events", "Occasional nausea"], "answer": 2, "explanation": "Short abrupt elementary visual symptoms favor occipital seizures. Why not the others: A. Visual phenomena in both eyes — Binocular visual symptoms occur in both cortical epilepsy and migraine.; B. Presence of a headache after the event — Headache may follow either epilepsy or migraine.; D. Occasional nausea — Nausea is nonspecific and may occur with both conditions.", "pearl": "Visual aura duration is a high-value discriminator.", "srcAnswer": "C"}, {"num": 72, "level": "", "question": "A 12-year-old with congenital heart disease has sudden collapse during exertion, immediate recovery, no prodrome and a few brief jerks. Which approach best avoids a dangerous diagnostic error?", "options": ["Assume CAE because consciousness was briefly lost", "Label functional seizures because recovery was rapid", "Prioritize urgent cardiac assessment while considering convulsive syncope", "Diagnose generalized epilepsy from jerks alone"], "answer": 2, "explanation": "Exertional collapse with structural cardiac history is a high-risk cardiac red flag. Why not the others: A. Assume CAE because consciousness was briefly lost — Absence does not typically cause exertional collapse.; B. Label functional seizures because recovery was rapid — Rapid recovery does not exclude a serious arrhythmia.; D. Diagnose generalized epilepsy from jerks alone — Convulsive movements can occur during cerebral hypoperfusion.", "pearl": "Cardiac syncope can be life-threatening and may mimic a seizure.", "srcAnswer": "C"}, {"num": 73, "level": "", "question": "A cooperative untreated 8-year-old suspected of CAE performs 3 minutes of effective hyperventilation without generalized spike-wave. Which interpretation follows ILAE CAE criteria?", "options": ["It establishes Lennox–Gastaut syndrome", "It proves focal temporal epilepsy", "CAE becomes unlikely after effective negative hyperventilation", "It confirms CAE because absence EEG may always be normal"], "answer": 2, "explanation": "ILAE syndrome guidance treats lack of generalized spike-wave after effective hyperventilation as an exclusionary/strong caution in untreated CAE. Why not the others: A. It establishes Lennox–Gastaut syndrome — LGS requires characteristic seizure types and EEG patterns.; B. It proves focal temporal epilepsy — Negative hyperventilation does not identify an alternative focal syndrome.; D. It confirms CAE because absence EEG may always be normal — A properly performed activation has high diagnostic yield in untreated CAE.", "pearl": "A well-performed activation is more informative than a poorly performed one.", "srcAnswer": "C"}, {"num": 74, "level": "", "question": "A 6-year-old has nocturnal hemifacial clonic seizures, hypersalivation and speech arrest, with normal development. The most likely syndrome is:", "options": ["Self-limited epilepsy with centrotemporal spikes", "Lennox–Gastaut syndrome", "Self-limited epilepsy with autonomic seizures", "Childhood absence epilepsy"], "answer": 0, "explanation": "Characteristic age, oropharyngeal focal semiology, and sleep activation fit SeLECTS. Why not the others: B. Lennox–Gastaut syndrome — Multiple seizure types, developmental problems and abnormal background are expected.; C. Self-limited epilepsy with autonomic seizures — That syndrome more often features prolonged autonomic symptoms such as vomiting.; D. Childhood absence epilepsy — Brief generalized staring episodes are typical; focal oropharyngeal motor symptoms are not.", "pearl": "SeLECTS is the modern name for the syndrome historically called Rolandic epilepsy.", "srcAnswer": "A"}, {"num": 75, "level": "", "question": "A witnessed epileptic event starts with right-hand clonic jerking, then spreads to the right face while the child remains responsive. Under ILAE 2025, which primary class fits best?", "options": ["Unclassified epileptic seizure", "Focal epileptic seizure", "Generalized epileptic seizure", "Seizure of unknown focal/generalized origin"], "answer": 1, "explanation": "Initial unilateral, anatomically evolving manifestations support focal network onset. Why not the others: A. Unclassified epileptic seizure — There is enough semiologic information to classify the event as focal.; C. Generalized epileptic seizure — Generalized classification requires evidence of rapid bilateral network engagement from onset.; D. Seizure of unknown focal/generalized origin — The clearly lateralized onset provides sufficient information to favor focal classification.", "pearl": "2025 terminology removes “onset” from the main class label.", "srcAnswer": "B"}, {"num": 76, "level": "", "question": "A 60-hour-old newborn has recurrent low glucose and the team is comparing two named guidelines. Which statement correctly separates their time windows?", "options": ["PES uses a glucose value of 48 mg/dL as its time boundary", "Both CPS and PES use exactly 48 h for all transitional thresholds", "Both use 72 h for defining persistent hypoglycemia", "CPS transitional framework extends to 72 h; PES persistent-disorder evaluation considers beyond 48 h"], "answer": 3, "explanation": "These are different guideline purposes and time anchors. Why not the others: A. PES uses a glucose value of 48 mg/dL as its time boundary — 48 hours is a time, not a concentration.; B. Both CPS and PES use exactly 48 h for all transitional thresholds — CPS transitional period is not restricted to 48 h.; C. Both use 72 h for defining persistent hypoglycemia — PES uses an earlier >48-h evaluation threshold.", "pearl": "Do not exchange CPS 72-hour and PES 48-hour windows.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 10 Q8 — CPS 72-h transitional vs PES >48-h persistent hypoglycemia"}}, {"num": 77, "level": "", "question": "A preterm infant at 36 weeks PMA needs nasal cannula 2.5 L/min without invasive ventilation. Under Jensen grading, what is the BPD severity?", "options": ["No BPD", "Grade 3", "Grade 1", "Grade 2"], "answer": 3, "explanation": ">2 L/min nasal cannula or noninvasive positive-pressure support is grade 2. Why not the others: A. No BPD — Respiratory support at 36 weeks PMA is compatible with BPD grading.; B. Grade 3 — Grade 3 requires invasive mechanical ventilation.; C. Grade 1 — Grade 1 corresponds to ≤2 L/min nasal cannula.", "pearl": "Distinguish ≤2 versus >2 L/min; grade 3 is invasive ventilation.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 5 Q53 — Jensen BPD grading at 36 weeks PMA"}}, {"num": 78, "level": "", "question": "A question explicitly asks for the AAP 2018 initial ROP screening schedule in a 24-week infant. Which timing is correct?", "options": ["31 weeks PMA (7 weeks after birth)", "27 weeks PMA (3 weeks after birth)", "30 weeks PMA (6 weeks after birth)", "32 weeks PMA (8 weeks after birth)"], "answer": 0, "explanation": "AAP 2018 table specifies 31 weeks PMA for GA 24 weeks. Why not the others: B. 27 weeks PMA (3 weeks after birth) — That is earlier than the AAP 2018 table.; C. 30 weeks PMA (6 weeks after birth) — This does not match the AAP 2018 table for GA 24 weeks.; D. 32 weeks PMA (8 weeks after birth) — This is later than the AAP 2018 first examination for GA 24 weeks.", "pearl": "When an international guideline is explicitly named, answer that guideline and label it.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q55 — AAP 2018 ROP first screen for 24-week infant"}}, {"num": 79, "level": "", "question": "A clinician uses BEARS for a school-age sleep history. Which set of domains is correct?", "options": ["Bedtime problems, Excessive daytime sleepiness, Awakenings, Regularity/duration, Snoring", "Breathing, EEG, Arousal index, REM, Sleep latency", "Behavior, Exercise, Appetite, Restlessness, Somnolence", "Bedtime, Epilepsy, Apnea, Reflux, Seizures"], "answer": 0, "explanation": "These are the five BEARS screening domains. Why not the others: B. Breathing, EEG, Arousal index, REM, Sleep latency — These are sleep laboratory concepts, not BEARS domains.; C. Behavior, Exercise, Appetite, Restlessness, Somnolence — This is not the BEARS acronym.; D. Bedtime, Epilepsy, Apnea, Reflux, Seizures — This substitutes unrelated conditions for the standardized domains.", "pearl": "BEARS is a clinical sleep history, not polysomnography.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 13 Q5 — BEARS sleep-history mnemonic"}}, {"num": 80, "level": "", "question": "A 7.5-kg child with complicated SAM is prescribed F-75 at 130 mL/kg/day under a clinician-led protocol. What total daily volume is ordered?", "options": ["130 mL/day", "975 mL per feed", "975 mL/day", "750 mL/day"], "answer": 2, "explanation": "7.5 × 130 = 975 mL/day. Why not the others: A. 130 mL/day — This confuses per-kg volume with total volume.; B. 975 mL per feed — The calculated value is a daily total, not per feed.; D. 750 mL/day — This does not apply the ordered 130 mL/kg/day rate.", "pearl": "Always multiply kg × mL/kg/day; do not treat a numerical practice order as universal protocol.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 starter feed volume from mL/kg/day"}}, {"num": 81, "level": "", "question": "An infant has early bilateral cataracts but comparatively little liver disease, normal growth and no severe systemic illness. Which enzyme deficiency best fits?", "options": ["Aldolase B deficiency", "OTC deficiency", "GALT deficiency", "Galactokinase (GALK1) deficiency"], "answer": 3, "explanation": "Galactitol accumulation can cause cataracts with milder systemic disease. Why not the others: A. Aldolase B deficiency — Hereditary fructose intolerance manifests after fructose/sucrose/sorbitol exposure.; B. OTC deficiency — OTC causes hyperammonemia, not an isolated early cataract phenotype.; C. GALT deficiency — Classic galactosemia commonly causes liver dysfunction, feeding illness and sepsis risk.", "pearl": "GALK1 cataracts with relatively little systemic illness versus classic GALT disease.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase vs classic galactosemia vs HFI"}}, {"num": 82, "level": "", "question": "A toddler has fasting-triggered hypoketotic hypoglycemia. Acylcarnitine analysis shows marked C8 octanoylcarnitine elevation. Best disorder?", "options": ["Propionic acidemia", "Maple syrup urine disease", "MCAD deficiency", "VLCAD deficiency"], "answer": 2, "explanation": "C8 is the characteristic acylcarnitine marker. Why not the others: A. Propionic acidemia — C3 elevation is characteristic of propionic acidemia.; B. Maple syrup urine disease — Alloisoleucine and branched-chain amino acids are typical markers.; D. VLCAD deficiency — C14:1 is more characteristic of VLCAD.", "pearl": "MCAD = C8; VLCAD = C14:1; PA = C3; MSUD = alloisoleucine.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD fasting hypoketotic hypoglycemia, C8"}}, {"num": 83, "level": "", "question": "A neonate needs GIR 7 mg/kg/min at a fluid rate of 120 mL/kg/day. Which dextrose concentration is closest?", "options": ["D7.0", "D10.1", "D8.4", "D12.0"], "answer": 2, "explanation": "7 × 144 ÷ 120 = 8.4% dextrose. Why not the others: A. D7.0 — This omits the conversion factor 144.; B. D10.1 — This would correspond to a higher GIR at the same volume.; D. D12.0 — This confuses fluid rate with concentration.", "pearl": "Dextrose % = GIR × 144 ÷ mL/kg/day.", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 10 Q47 — GIR to dextrose concentration conversion"}}, {"num": 84, "level": "", "question": "During hypoglycemia, an infant has suppressed BOHB and FFA; plasma glucose rises 36 mg/dL after glucagon. What mechanism is most supported?", "options": ["Ketotic hypoglycemia", "Isolated growth hormone deficiency", "Fatty acid oxidation disorder", "Excess insulin action"], "answer": 3, "explanation": "Low ketones/FFA with >30 mg/dL glucagon rise supports hyperinsulinism. Why not the others: A. Ketotic hypoglycemia — Ketotic hypoglycemia features elevated ketones.; B. Isolated growth hormone deficiency — This pattern is less specific than the hyperinsulinism signature.; C. Fatty acid oxidation disorder — FAOD often causes low ketones but elevated FFA.", "pearl": "Suppressed BOHB/FFA plus glucagon glucose rise ≥30 mg/dL supports insulin excess.", "srcAnswer": "D", "retest": {"stage": "R2", "from": "Day 10 Q50 — Hyperinsulinism: low ketones/FFA and glucagon response"}}, {"num": 85, "level": "", "question": "A newborn aEEG trace rises repetitively while raw EEG shows a changing rhythmic discharge with spatial spread. Video shows minimal movement. Most likely?", "options": ["Electrographic seizure", "Electrode artifact", "Normal sleep cycling", "Movement artifact"], "answer": 0, "explanation": "Evolving rhythmic raw EEG with matching aEEG trend supports seizure. Why not the others: B. Electrode artifact — Artifact usually lacks convincing evolving cerebral ictal activity.; C. Normal sleep cycling — Sleep cycling lacks a focal evolving ictal rhythm.; D. Movement artifact — Minimal movement and convincing EEG evolution argue against movement artifact.", "pearl": "Evolving raw EEG, not aEEG trend alone, confirms seizure.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 7 Q34 — Neonatal aEEG saw-tooth with evolving raw EEG"}}];
const NB_CTX={srcId:'Day22',label:'Day 22',set:'Quiz 5',href:'Day22/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day22_QuizSet5_Q69-85_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 22 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–85</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 22 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 22'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 22');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day22:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
