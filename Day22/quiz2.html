@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "", "question": "A 7-year-old with daily abrupt brief behavioral arrest has a typical ictal EEG in childhood absence epilepsy. Which pattern is most characteristic?", "options": ["Sleep-activated centrotemporal spikes", "Regular generalized approximately 3-Hz spike-and-wave", "Generalized paroxysmal fast activity during sleep", "Generalized slow spike-and-wave at 1.5 Hz"], "answer": 1, "explanation": "Typical absence seizures in CAE are associated with approximately 3-Hz generalized spike-wave. Why not the others: A. Sleep-activated centrotemporal spikes — That interictal pattern supports SeLECTS rather than typical absence.; C. Generalized paroxysmal fast activity during sleep — That pattern is strongly associated with LGS, particularly tonic seizures.; D. Generalized slow spike-and-wave at 1.5 Hz — Slow generalized spike-wave points toward atypical absence or LGS contexts.", "pearl": "Generalized 2.5–4 Hz spike-wave is typical for CAE; 3 Hz is the exam anchor.", "srcAnswer": "B"}, {"num": 19, "level": "", "question": "One unprovoked seizure occurs after a remote structural brain insult. What further evidence may satisfy the practical epilepsy definition after this single event?", "options": ["A documented ≥60% probability of another unprovoked seizure over 10 years", "Any interictal focal slowing without risk estimation", "Normal 20-minute routine EEG", "An acute metabolic abnormality causing the event"], "answer": 0, "explanation": "The ILAE definition accepts a high estimated recurrence risk after one event. Why not the others: B. Any interictal focal slowing without risk estimation — Focal slowing is nonspecific and is not itself the 60% recurrence criterion.; C. Normal 20-minute routine EEG — A normal routine EEG neither proves nor excludes future recurrence risk.; D. An acute metabolic abnormality causing the event — That would favor an acute symptomatic rather than unprovoked seizure.", "pearl": "The ≥60% over 10 years criterion is a recurrence-risk definition, not an EEG threshold.", "srcAnswer": "A"}, {"num": 20, "level": "", "question": "A term neonate on day 4 develops brief focal tonic–clonic seizures with normal examination between events and multiple similarly affected relatives. Which syndrome is most likely?", "options": ["Infantile epileptic spasms syndrome", "Self-limited familial neonatal epilepsy", "Early infantile developmental epileptic encephalopathy", "Epilepsy of infancy with migrating focal seizures"], "answer": 1, "explanation": "Day 2–7 focal seizures with normal interictal examination and family history fit SeLNE. Why not the others: A. Infantile epileptic spasms syndrome — Epileptic spasms usually start later in infancy.; C. Early infantile developmental epileptic encephalopathy — EIDEE usually has early developmental/neurological impairment and severe EEG abnormalities.; D. Epilepsy of infancy with migrating focal seizures — Migrating focal seizures with progressive impairment are not described.", "pearl": "KCNQ2/KCNQ3 are common genes in self-limited neonatal epilepsy.", "srcAnswer": "B"}, {"num": 21, "level": "", "question": "A 7-year-old with previously acquired language has worsening comprehension and school performance. Overnight EEG shows near-continuous spike-wave activation in NREM sleep. Best category?", "options": ["Self-limited epilepsy with autonomic seizures", "Childhood absence epilepsy", "Sleep-activated epileptic encephalopathy (SWAS)", "Uncomplicated self-limited centrotemporal epilepsy"], "answer": 2, "explanation": "Regression with marked sleep-activated epileptiform burden fits DEE-SWAS/EE-SWAS spectrum. Why not the others: A. Self-limited epilepsy with autonomic seizures — SeLEAS is dominated by autonomic focal seizures, not language regression.; B. Childhood absence epilepsy — CAE has brief absences with generalized spike-wave, not near-continuous sleep activation.; D. Uncomplicated self-limited centrotemporal epilepsy — Uncomplicated SeLECTS should not cause substantial acquired regression.", "pearl": "A sleep EEG is essential when cognitive or language regression accompanies focal epilepsy.", "srcAnswer": "C"}, {"num": 22, "level": "", "question": "A 9-year-old awakens with unilateral mouth twitching, drooling, and transient inability to speak. Examination is normal. EEG reveals sleep-activated centrotemporal spikes. Best syndrome?", "options": ["Childhood absence epilepsy", "Childhood occipital visual epilepsy", "Self-limited epilepsy with autonomic seizures", "Self-limited epilepsy with centrotemporal spikes"], "answer": 3, "explanation": "Oropharyngeal focal seizures plus centrotemporal sleep-activated spikes fit SeLECTS. Why not the others: A. Childhood absence epilepsy — Typical absences do not cause unilateral facial clonic seizures.; B. Childhood occipital visual epilepsy — Visual phenomena, not hemifacial clonus, predominate.; C. Self-limited epilepsy with autonomic seizures — Autonomic-dominant prolonged vomiting is more typical.", "pearl": "SeLECTS often begins during sleep and remits by adolescence.", "srcAnswer": "D"}, {"num": 23, "level": "", "question": "A 6-month-old has asymmetric clusters of spasms, developmental regression and focal EEG spikes. Which combined diagnostic plan is best?", "options": ["Urgent sleep-inclusive video EEG and epilepsy-protocol MRI with specialist evaluation", "Only repeat short awake EEG after several months", "Diagnose uncomplicated self-limited infantile epilepsy", "Only metabolic screening with no EEG or imaging"], "answer": 0, "explanation": "Spasms need electroclinical confirmation and asymmetric features warrant structural search. Why not the others: B. Only repeat short awake EEG after several months — Delay risks developmental consequences and misses sleep activation.; C. Diagnose uncomplicated self-limited infantile epilepsy — Regression and spasms are incompatible with a self-limited phenotype.; D. Only metabolic screening with no EEG or imaging — Metabolic testing may help but does not replace EEG and MRI.", "pearl": "Spasm phenotype and asymmetry jointly drive urgency and etiologic work-up.", "srcAnswer": "A"}, {"num": 24, "level": "", "question": "A 6-year-old has one prolonged nocturnal event with pallor, vomiting, eye deviation and postictal sleep, then is entirely well and afebrile. EEG later shows occipital spikes. Best syndrome?", "options": ["Infantile epileptic spasms syndrome", "Self-limited epilepsy with centrotemporal spikes", "Self-limited epilepsy with autonomic seizures", "Viral encephalitis"], "answer": 2, "explanation": "Autonomic-dominant prolonged focal event with normal baseline fits SeLEAS. Why not the others: A. Infantile epileptic spasms syndrome — Infantile clustered spasms do not match this age and autonomic phenotype.; B. Self-limited epilepsy with centrotemporal spikes — Oropharyngeal clonus and speech arrest, not vomiting, are defining clues.; D. Viral encephalitis — Encephalitis usually produces persistent encephalopathy and other illness features.", "pearl": "SeLEAS may produce prolonged autonomic seizures without chronic encephalopathy.", "srcAnswer": "C"}, {"num": 25, "level": "", "question": "A child with new focal seizures has persistent unilateral weakness and a reproducible focal EEG abnormality. Best investigation to seek an underlying cause?", "options": ["Routine skull radiograph", "Brain MRI using an epilepsy-oriented protocol", "Sleep-only EEG as the sole next investigation", "No imaging because EEG already localizes"], "answer": 1, "explanation": "Focal deficit and concordant EEG make structural imaging important. Why not the others: A. Routine skull radiograph — Plain radiography does not evaluate cortical structural causes.; C. Sleep-only EEG as the sole next investigation — Additional EEG may help but does not replace indicated MRI.; D. No imaging because EEG already localizes — EEG does not reveal the underlying lesion reliably.", "pearl": "Focal neurological signs increase the need for MRI.", "srcAnswer": "B"}, {"num": 26, "level": "", "question": "A child with epileptic spasms has asymmetric flexion clusters and focal EEG discharges. Which etiologic approach is most justified?", "options": ["Prioritize high-quality MRI for a structural lesion while pursuing urgent treatment", "Assume all spasms are idiopathic generalized epilepsy", "Exclude IESS because events are asymmetric", "Defer imaging until seizures remit spontaneously"], "answer": 0, "explanation": "Asymmetry and focal features increase suspicion of a structural substrate. Why not the others: B. Assume all spasms are idiopathic generalized epilepsy — Focal structural causes are important in IESS.; C. Exclude IESS because events are asymmetric — Spasms can be asymmetric, especially with structural lesions.; D. Defer imaging until seizures remit spontaneously — Delayed etiologic work-up can miss a treatable structural cause.", "pearl": "Asymmetric spasms warrant careful search for structural pathology.", "srcAnswer": "A"}, {"num": 27, "level": "", "question": "An 11-year-old has morning myoclonic jerks, a generalized tonic–clonic seizure after sleep deprivation and generalized polyspike-wave. Which feature would most undermine a JME diagnosis?", "options": ["EEG photosensitivity without focal slowing", "Myoclonus shortly after waking", "Persistent focal slowing with focal neurological deficit", "Seizure after sleep deprivation"], "answer": 2, "explanation": "A concordant focal deficit and focal slowing suggest an alternative structural process. Why not the others: A. EEG photosensitivity without focal slowing — Photosensitivity is common in JME.; B. Myoclonus shortly after waking — Morning myoclonus is a defining JME clue.; D. Seizure after sleep deprivation — Sleep deprivation is a classic precipitant in JME.", "pearl": "JME can coexist with focal EEG fragments, but persistent focal deficits demand reassessment.", "srcAnswer": "C"}, {"num": 28, "level": "", "question": "A sharp transient occurs in a single electrode with abrupt baseline shift, no plausible cerebral field, and simultaneous electrode movement. Best interpretation?", "options": ["Generalized epileptiform discharge", "Electrode artifact", "Focal electrographic seizure", "Interictal temporal spike"], "answer": 1, "explanation": "An isolated electrode shift without a physiologic field favors artifact. Why not the others: A. Generalized epileptiform discharge — A generalized discharge would have a broader bilateral distribution.; C. Focal electrographic seizure — An ictal pattern should show sustained rhythmic evolution, not an isolated electrode pop.; D. Interictal temporal spike — A true temporal spike generally has a field over adjacent electrodes.", "pearl": "A cerebral field is an important check before labeling spikes.", "srcAnswer": "B"}, {"num": 29, "level": "", "question": "An infant with clinical spasms has multifocal epileptiform discharges but no classic hypsarrhythmia. Which interpretation is best?", "options": ["The EEG establishes SeLECTS", "The pattern proves an artifact rather than epilepsy", "IESS is excluded unless hypsarrhythmia appears", "IESS remains possible and requires urgent specialist assessment"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (The EEG establishes SeLECTS). Decisive discriminator: Clinical spasms are mandatory; classic hypsarrhythmia is not universally present. Why not the others: A. The EEG establishes SeLECTS — SeLECTS does not present as clustered infantile spasms.; B. The pattern proves an artifact rather than epilepsy — Multifocal discharges in the right clinical context cannot be dismissed as artifact.; C. IESS is excluded unless hypsarrhythmia appears — Focal or multifocal EEG abnormalities can occur in IESS.", "pearl": "Clinical spasms are mandatory; classic hypsarrhythmia is not universally present.", "srcAnswer": "D"}, {"num": 30, "level": "", "question": "A 4-month-old has increasingly frequent focal seizures whose ictal EEG onset migrates between hemispheres during the same episode, with developmental stagnation. Best syndrome?", "options": ["Self-limited neonatal epilepsy", "Self-limited infantile epilepsy", "Infantile epileptic spasms syndrome", "Epilepsy of infancy with migrating focal seizures"], "answer": 3, "explanation": "Migrating ictal onset with severe infantile epilepsy and regression defines EIMFS. Why not the others: A. Self-limited neonatal epilepsy — SeLNE begins in the neonatal period and generally remits early.; B. Self-limited infantile epilepsy — SeLIE has brief focal seizures without migrating ictal pattern or regression.; C. Infantile epileptic spasms syndrome — Spasm clusters, not migrating focal ictal discharges, are mandatory for IESS.", "pearl": "EIMFS is a severe infantile DEE; migrating ictal pattern is decisive.", "srcAnswer": "D"}, {"num": 31, "level": "", "question": "A 5-month-old has dozens of seizures daily. Video EEG shows seizures beginning left temporal, then right occipital during the same event, and development is worsening. Strongest diagnosis?", "options": ["Self-limited neonatal epilepsy", "Dravet syndrome with fever-sensitive seizures", "Self-limited infantile epilepsy", "Epilepsy of infancy with migrating focal seizures"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (Self-limited neonatal epilepsy). Decisive discriminator: “Migrating” describes ictal evolution within seizures, not just alternating sides over days. Why not the others: A. Self-limited neonatal epilepsy — Onset and worsening course are not typical of SeLNE.; B. Dravet syndrome with fever-sensitive seizures — Dravet often has prolonged fever-sensitive hemiclonic seizures, not this hallmark migrating pattern.; C. Self-limited infantile epilepsy — SeLIE can cluster but does not have migrating ictal foci and progressive regression.", "pearl": "“Migrating” describes ictal evolution within seizures, not just alternating sides over days.", "srcAnswer": "D"}, {"num": 32, "level": "", "question": "An epileptic event is confidently witnessed as bilateral convulsion, but no reliable early-phase description or EEG exists. The best 2025 ILAE main class is:", "options": ["Unclassified seizure", "Focal to bilateral tonic–clonic seizure", "Generalized seizure", "Unknown whether focal or generalized"], "answer": 3, "explanation": "Close-distractor check: tempting alternative A (Unclassified seizure). Decisive discriminator: Unknown and unclassified are not synonyms. Why not the others: A. Unclassified seizure — There is meaningful information: the event is a bilateral convulsion, though origin is unknown.; B. Focal to bilateral tonic–clonic seizure — That requires positive evidence of focal beginning.; C. Generalized seizure — A bilateral convulsion can follow a focal onset, so this is not certain.", "pearl": "Unknown and unclassified are not synonyms.", "srcAnswer": "D"}, {"num": 33, "level": "", "question": "A 6-year-old progressively fails to understand spoken language despite normal hearing, and EEG reveals temporal epileptiform discharges strongly activated in sleep. Most likely syndrome?", "options": ["SeLECTS without language dysfunction", "Epilepsy–aphasia spectrum / Landau–Kleffner phenotype", "Self-limited epilepsy with autonomic seizures", "Childhood absence epilepsy"], "answer": 1, "explanation": "Acquired auditory verbal agnosia with sleep-activated temporal epileptiform activity is characteristic. Why not the others: A. SeLECTS without language dysfunction — Simple SeLECTS does not explain severe acquired auditory language impairment.; C. Self-limited epilepsy with autonomic seizures — Autonomic ictal symptoms do not explain isolated language regression.; D. Childhood absence epilepsy — Absences do not selectively cause acquired receptive aphasia.", "pearl": "Acquired aphasia may occur with few obvious clinical seizures.", "srcAnswer": "B"}, {"num": 34, "level": "", "question": "A 15-year-old has occasional typical absences and a generalized tonic–clonic seizure on awakening. EEG shows generalized 4-Hz spike-wave; development is normal. Best syndrome?", "options": ["Childhood absence epilepsy", "Epilepsy with eyelid myoclonia", "Juvenile absence epilepsy", "Lennox–Gastaut syndrome"], "answer": 2, "explanation": "Adolescent onset, less frequent absences, and GTCS fit JAE. Why not the others: A. Childhood absence epilepsy — CAE more often begins younger with many daily absences.; B. Epilepsy with eyelid myoclonia — Characteristic eye-closure-induced eyelid jerks are absent.; D. Lennox–Gastaut syndrome — Normal development and 4-Hz generalized activity argue against LGS.", "pearl": "JAE typically has less frequent absences and higher GTCS risk than CAE.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day22',label:'Day 22',set:'Quiz 2',href:'Day22/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day22_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 22 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 22 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 22'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 22');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day22:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
