<script>
const quiz=[{"num": 37, "level": "", "question": "An infant with neonatal basal-ganglia injury develops fluctuating tone and involuntary twisting movements. Which CP motor subtype is most likely?", "options": ["Pure flaccid neuropathy", "Dyskinetic cerebral palsy", "Ataxic CP", "Spastic diplegia"], "answer": 1, "explanation": "Deep gray injury and variable dystonic/choreoathetoid movements suggest dyskinetic CP. Why not the others: A. Pure flaccid neuropathy — Lower motor neuron signs differ from fluctuating central tone.; C. Ataxic CP — Ataxia is characterized by dysmetria and balance problems.; D. Spastic diplegia — This more often shows fixed velocity-dependent leg spasticity.", "pearl": "Deep gray injury and variable dystonic/choreoathetoid movements suggest dyskinetic CP.", "srcAnswer": "B"}, {"num": 38, "level": "", "question": "An infant persistently reaches with one hand at 7 months, with reduced use of the other. Which interpretation is most appropriate?", "options": ["Hand dominance is established normally at 6 months", "This proves a primary muscle disease", "Delay evaluation until school entry", "Early hand preference is a motor asymmetry red flag warranting developmental assessment"], "answer": 3, "explanation": "Hand preference before 1 year may indicate unilateral CP. Why not the others: A. Hand dominance is established normally at 6 months — Persistent early asymmetry is not routinely reassuring.; B. This proves a primary muscle disease — Asymmetry may be central and needs evaluation.; C. Delay evaluation until school entry — Early recognition supports timely intervention.", "pearl": "Hand preference before 1 year may indicate unilateral CP.", "srcAnswer": "D"}, {"num": 39, "level": "", "question": "A child with presumed CP has progressive loss of walking ability, new optic atrophy and deteriorating cognition. Best next step?", "options": ["Progression of the established CP phenotype", "Physiotherapy intensification before diagnostic reassessment", "Contracture-related immobility with incidental optic findings", "Reassess diagnosis for a progressive neurologic or metabolic disorder"], "answer": 3, "explanation": "Progressive regression is atypical for the nonprogressive brain disturbance defining CP. Why not the others: A. Progression of the established CP phenotype — New multisystem deterioration requires reconsideration.; B. Physiotherapy intensification before diagnostic reassessment — Optic atrophy points to broader neurologic disease.; C. Contracture-related immobility with incidental optic findings — Therapy does not substitute for etiologic reassessment.", "pearl": "Progressive regression is atypical for the nonprogressive brain disturbance defining CP.", "srcAnswer": "D"}, {"num": 40, "level": "", "question": "In a child with CP who cannot sit independently and has severe mobility limitation, which additional health issue warrants systematic surveillance?", "options": ["Routine abdominal surgery risk screening", "Hip displacement and pain", "Routine screening for primary adrenal failure", "Primary surveillance for retinal detachment"], "answer": 1, "explanation": "Children with severe motor impairment have increased musculoskeletal complication risk. Why not the others: A. Routine abdominal surgery risk screening — Not a universal CP complication.; C. Routine screening for primary adrenal failure — General pediatric illness can occur but does not replace CP-specific surveillance.; D. Primary surveillance for retinal detachment — Visual issues occur but retinal detachment is not a routine defining risk.", "pearl": "Children with severe motor impairment have increased musculoskeletal complication risk.", "srcAnswer": "B"}, {"num": 41, "level": "", "question": "A child with spastic CP has difficulty with transfers due to painful focal adductor spasticity despite therapy. Which management principle is most appropriate?", "options": ["Generalized tone reduction without transfer assessment", "Sedating systemic medication without functional goals", "Hip surveillance after the onset of dislocation pain", "Goal-directed multidisciplinary tone management with functional outcome targets"], "answer": 3, "explanation": "Treatment should target pain, care and function with individualized therapy. Why not the others: A. Generalized tone reduction without transfer assessment — Focal and generalized approaches differ.; B. Sedating systemic medication without functional goals — Some tone may contribute to function; goals matter.; C. Hip surveillance after the onset of dislocation pain — Preventive surveillance remains important.", "pearl": "Treatment should target pain, care and function with individualized therapy.", "srcAnswer": "D"}, {"num": 42, "level": "", "question": "A 5-year-old has rhythmic tremor at rest, rigidity and bradykinesia. Which movement-system localization is most consistent?", "options": ["Basal ganglia extrapyramidal circuitry", "Cerebellar hemisphere alone", "Neuromuscular junction alone", "Peripheral sensory nerve alone"], "answer": 0, "explanation": "Rest tremor with rigidity and bradykinesia points toward basal ganglia dysfunction. Why not the others: B. Cerebellar hemisphere alone — Cerebellar disease typically causes intention tremor and dysmetria.; C. Neuromuscular junction alone — NMJ disease causes fatigable weakness rather than rigidity.; D. Peripheral sensory nerve alone — Sensory neuropathy does not cause classic rigidity/bradykinesia.", "pearl": "Rest tremor with rigidity and bradykinesia points toward basal ganglia dysfunction.", "srcAnswer": "A"}, {"num": 43, "level": "", "question": "A child has worsening intention tremor and overshoot on finger-nose testing. Which additional finding best supports cerebellar dysfunction?", "options": ["Fasciculations", "Dysdiadochokinesia", "Cogwheel rigidity", "Fatigable ptosis"], "answer": 1, "explanation": "Impaired rapid alternating movements is a cerebellar sign. Why not the others: A. Fasciculations — These suggest lower motor neuron involvement.; C. Cogwheel rigidity — This is an extrapyramidal sign.; D. Fatigable ptosis — This suggests neuromuscular junction dysfunction.", "pearl": "Impaired rapid alternating movements is a cerebellar sign.", "srcAnswer": "B"}, {"num": 44, "level": "", "question": "A 7-year-old has frequent motor and vocal tics with significant school impairment. Which nonpharmacologic treatment has evidence as a first-line option when available?", "options": ["EEG biofeedback as the preferred tic intervention", "Physical restraint during predictable tic episodes", "Supportive counseling without tic-specific training", "Comprehensive behavioral intervention for tics"], "answer": 3, "explanation": "CBIT is an evidence-based behavioral intervention for tic disorders. Why not the others: A. EEG biofeedback as the preferred tic intervention — This is not an established tic intervention.; B. Physical restraint during predictable tic episodes — Immobilization is not an appropriate tic treatment.; C. Supportive counseling without tic-specific training — EEG biofeedback is not the standard first-line intervention.", "pearl": "CBIT is an evidence-based behavioral intervention for tic disorders.", "srcAnswer": "D"}, {"num": 45, "level": "", "question": "A child with dystonia, variable tone and neonatal MRI showing bilateral putaminal injury is referred as 'spastic diplegia'. What is the strongest reason to revisit subtype?", "options": ["Dystonic phenomenology plus basal-ganglia injury supports dyskinetic CP", "Leg involvement alone establishes spastic diplegia", "A normal strength examination excludes CP", "All neonatal brain injury produces identical CP subtypes"], "answer": 0, "explanation": "Clinical movement phenomenology and MRI distribution are aligned with dyskinesia. Why not the others: B. Leg involvement alone establishes spastic diplegia — Distribution without tone phenomenology is insufficient.; C. A normal strength examination excludes CP — CP may present primarily with abnormal movement and posture.; D. All neonatal brain injury produces identical CP subtypes — Lesion distribution influences motor phenotype.", "pearl": "Clinical movement phenomenology and MRI distribution are aligned with dyskinesia.", "srcAnswer": "A"}, {"num": 46, "level": "", "question": "Which gross motor finding in a high-risk infant is a referral trigger for suspected CP?", "options": ["Not running by 12 months corrected age", "Not hopping by 18 months corrected age", "Not walking by 8 months corrected age", "Not sitting by 8 months corrected age"], "answer": 3, "explanation": "NICE identifies delayed sitting by 8 months corrected age as a warning sign. Why not the others: A. Not running by 12 months corrected age — Running is not an expected milestone at 12 months.; B. Not hopping by 18 months corrected age — Hopping develops much later.; C. Not walking by 8 months corrected age — Walking is not expected this early.", "pearl": "NICE identifies delayed sitting by 8 months corrected age as a warning sign.", "srcAnswer": "D"}, {"num": 47, "level": "", "question": "A child with spastic quadriplegia has coughing during feeds and poor weight gain. Which assessment should be prioritized?", "options": ["Formal IQ testing alone", "Routine lumbar puncture", "Isolated serum CK testing", "Swallowing safety and nutritional evaluation"], "answer": 3, "explanation": "Oropharyngeal dysfunction and aspiration risk need multidisciplinary assessment. Why not the others: A. Formal IQ testing alone — Cognition matters but does not address aspiration and malnutrition.; B. Routine lumbar puncture — LP is not indicated solely for feeding dysfunction.; C. Isolated serum CK testing — CK is not the primary evaluation for dysphagia in established CP.", "pearl": "Oropharyngeal dysfunction and aspiration risk need multidisciplinary assessment.", "srcAnswer": "D"}, {"num": 48, "level": "", "question": "A child with ataxia has frequent falls, oculomotor apraxia and recurrent sinopulmonary infections. Which diagnosis should be considered?", "options": ["Acute cerebellitis", "Ataxia-telangiectasia", "Ataxic cerebral palsy", "Friedreich ataxia"], "answer": 1, "explanation": "Progressive ataxia and immunodeficiency are characteristic; telangiectasias may appear later. Why not the others: A. Acute cerebellitis — Chronic progressive multisystem features are not typical of acute cerebellitis.; C. Ataxic cerebral palsy — Progression and immunodeficiency suggest a different condition.; D. Friedreich ataxia — Cardiomyopathy and areflexia are more characteristic; immunodeficiency is not typical.", "pearl": "Progressive ataxia and immunodeficiency are characteristic; telangiectasias may appear later.", "srcAnswer": "B"}, {"num": 49, "level": "", "question": "A boy with proximal weakness, Gowers maneuver and markedly elevated CK most likely has pathology involving which protein?", "options": ["Survival motor neuron protein", "Peripheral myelin protein 22", "Dystrophin", "Acetylcholine receptor"], "answer": 2, "explanation": "Duchenne muscular dystrophy is caused by loss of functional dystrophin. Why not the others: A. Survival motor neuron protein — SMN deficiency causes anterior horn cell SMA.; B. Peripheral myelin protein 22 — PMP22 disorders cause some hereditary neuropathies.; D. Acetylcholine receptor — AChR autoimmunity causes acquired myasthenia gravis.", "pearl": "Duchenne muscular dystrophy is caused by loss of functional dystrophin.", "srcAnswer": "C"}, {"num": 50, "level": "", "question": "A 5-year-old boy with calf pseudohypertrophy, Gowers sign and CK >10,000 U/L needs which first-line molecular strategy?", "options": ["Acetylcholine receptor antibody panel as first test", "Muscle biopsy before targeted DMD genetic testing", "DMD deletion/duplication analysis with sequencing if negative", "SMN1 copy-number testing as first-line molecular test"], "answer": 2, "explanation": "Molecular testing for dystrophin gene variants establishes diagnosis. Why not the others: A. Acetylcholine receptor antibody panel as first test — That evaluates spinal muscular atrophy, not classic DMD.; B. Muscle biopsy before targeted DMD genetic testing — That assesses autoimmune NMJ disease.; D. SMN1 copy-number testing as first-line molecular test — Genetic testing is typically preferred before invasive biopsy.", "pearl": "Molecular testing for dystrophin gene variants establishes diagnosis.", "srcAnswer": "C"}, {"num": 51, "level": "", "question": "A frameshift DMD variant is associated with severe childhood loss of ambulation. Which reading-frame principle is most relevant?", "options": ["All variant classes have similar protein consequences", "Out-of-frame variants generally disrupt dystrophin and favor Duchenne phenotype", "SMN2 copy number as the main severity modifier", "In-frame variants more often abolish all dystrophin"], "answer": 1, "explanation": "Reading-frame disruption is usually associated with more severe dystrophin deficiency. Why not the others: A. All variant classes have similar protein consequences — SMN2 modifies SMA, not dystrophinopathy.; C. SMN2 copy number as the main severity modifier — In-frame variants more often produce Becker phenotype, with exceptions.; D. In-frame variants more often abolish all dystrophin — Variant type influences residual dystrophin expression.", "pearl": "Reading-frame disruption is usually associated with more severe dystrophin deficiency.", "srcAnswer": "B"}, {"num": 52, "level": "", "question": "A boy with DMD has preserved ambulation but declining left ventricular systolic function. Which principle is most important?", "options": ["Cardiac surveillance and early specialist-directed cardiomyopathy treatment", "Avoid cardiac imaging because muscle disease explains exercise limitation", "Use CK trends alone to assess myocardial function", "Wait for chest pain before cardiac assessment"], "answer": 0, "explanation": "Cardiomyopathy may progress before overt cardiac symptoms and requires surveillance. Why not the others: B. Avoid cardiac imaging because muscle disease explains exercise limitation — Cardiac disease is an important independent complication.; C. Use CK trends alone to assess myocardial function — CK does not quantify ventricular function.; D. Wait for chest pain before cardiac assessment — Cardiac involvement can be asymptomatic.", "pearl": "Cardiomyopathy may progress before overt cardiac symptoms and requires surveillance.", "srcAnswer": "A"}, {"num": 53, "level": "", "question": "A 4-month-old has symmetric hypotonia, tongue fasciculations, absent reflexes and preserved alertness. Most appropriate genetic test?", "options": ["NF1 sequencing", "TSC2 sequencing", "SMN1 deletion/copy-number testing", "DMD gene testing as sole first test"], "answer": 2, "explanation": "Classic 5q SMA causes lower motor neuron weakness and is confirmed molecularly. Why not the others: A. NF1 sequencing — NF1 does not explain this classic anterior horn cell phenotype.; B. TSC2 sequencing — TSC is associated with hamartomas and epilepsy, not isolated LMN infantile weakness.; D. DMD gene testing as sole first test — DMD typically presents later with proximal weakness and high CK.", "pearl": "Classic 5q SMA causes lower motor neuron weakness and is confirmed molecularly.", "srcAnswer": "C"}, {"num": 54, "level": "", "question": "A newborn screen confirms biallelic SMN1 loss in an asymptomatic infant. Which management principle is best?", "options": ["Urgent specialist referral for presymptomatic disease-modifying therapy assessment", "Observe for early weakness at scheduled visits", "Begin treatment after CK elevation is confirmed", "Start rehabilitation while awaiting clinical weakness"], "answer": 0, "explanation": "Outcomes are better with early treatment before irreversible motor neuron loss. Why not the others: B. Observe for early weakness at scheduled visits — Waiting forfeits the presymptomatic treatment window.; C. Begin treatment after CK elevation is confirmed — CK is not the key marker for SMA treatment timing.; D. Start rehabilitation while awaiting clinical weakness — Supportive care does not replace timely disease-modifying treatment.", "pearl": "Outcomes are better with early treatment before irreversible motor neuron loss.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 3',href:'Day28/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet3_Q37-54_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 37–54</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
