@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 91, "level": "", "question": "An infant has extreme irritability, stiffness, developmental regression and optic atrophy; globoid cells are seen on pathology. Most likely?", "options": ["Canavan disease", "Pelizaeus-Merzbacher disease", "Krabbe disease", "Metachromatic leukodystrophy"], "answer": 2, "explanation": "Galactocerebrosidase deficiency causes globoid-cell leukodystrophy. Why not the others: A. Canavan disease — Canavan typically features macrocephaly and elevated NAA.; B. Pelizaeus-Merzbacher disease — PLP1-related hypomyelination has a different pathologic signature.; D. Metachromatic leukodystrophy — MLD features sulfatide accumulation and peripheral neuropathy.", "pearl": "Galactocerebrosidase deficiency causes globoid-cell leukodystrophy.", "srcAnswer": "C"}, {"num": 92, "level": "", "question": "A 9-year-old has progressive early-morning headache, vomiting and new gait ataxia. Which action is most appropriate?", "options": ["Reassure as uncomplicated tension headache", "Urgent assessment for intracranial pathology with neuroimaging", "Start migraine prophylaxis without examination", "Perform routine LP before imaging despite possible mass lesion"], "answer": 1, "explanation": "Progressive headache with vomiting and ataxia is a major pediatric red flag. Why not the others: A. Reassure as uncomplicated tension headache — Focal neurologic signs and progression make reassurance unsafe.; C. Start migraine prophylaxis without examination — Secondary causes must be excluded first.; D. Perform routine LP before imaging despite possible mass lesion — LP may be unsafe with obstructive hydrocephalus or mass effect.", "pearl": "Progressive headache with vomiting and ataxia is a major pediatric red flag.", "srcAnswer": "B"}, {"num": 93, "level": "", "question": "A child has headache that wakes them from sleep and is worse with coughing; fundus shows papilledema. Which mechanism is most concerning?", "options": ["Primary migraine without aura alone", "Simple tension-type headache", "Raised intracranial pressure", "Peripheral neuropathy"], "answer": 2, "explanation": "Valsalva-sensitive headache and papilledema suggest elevated ICP. Why not the others: A. Primary migraine without aura alone — Papilledema is not a typical primary migraine finding.; B. Simple tension-type headache — Usually lacks papilledema and Valsalva worsening.; D. Peripheral neuropathy — Does not explain papilledema.", "pearl": "Valsalva-sensitive headache and papilledema suggest elevated ICP.", "srcAnswer": "C"}, {"num": 94, "level": "", "question": "A child with headache has a cystic suprasellar lesion with calcification and bitemporal visual-field loss. Most likely tumor?", "options": ["Craniopharyngioma", "Diffuse intrinsic pontine glioma", "Medulloblastoma", "Ependymoma"], "answer": 0, "explanation": "Suprasellar mixed cystic-solid calcified lesion with visual/endocrine symptoms is classic. Why not the others: B. Diffuse intrinsic pontine glioma — A brainstem lesion would not be suprasellar.; C. Medulloblastoma — Usually posterior fossa and may seed CSF.; D. Ependymoma — Often arises near the fourth ventricle in children.", "pearl": "Suprasellar mixed cystic-solid calcified lesion with visual/endocrine symptoms is classic.", "srcAnswer": "A"}, {"num": 95, "level": "", "question": "A child has posterior fossa mass, truncal ataxia and hydrocephalus. MRI suggests a midline cerebellar embryonal tumor with CSF dissemination risk. Most likely?", "options": ["Craniopharyngioma", "Pilocytic astrocytoma", "Optic pathway glioma", "Medulloblastoma"], "answer": 3, "explanation": "A malignant cerebellar embryonal tumor can disseminate through CSF. Why not the others: A. Craniopharyngioma — Typically suprasellar, not a midline cerebellar embryonal lesion.; B. Pilocytic astrocytoma — Often circumscribed and less prone to CSF dissemination.; C. Optic pathway glioma — Typically along the optic pathway, not the cerebellar vermis.", "pearl": "A malignant cerebellar embryonal tumor can disseminate through CSF.", "srcAnswer": "D"}, {"num": 96, "level": "", "question": "A child has a posterior fossa tumor extending through the foramina of Luschka and Magendie. Which tumor is classically associated?", "options": ["Ependymoma", "Optic pathway glioma", "Craniopharyngioma", "Pineoblastoma"], "answer": 0, "explanation": "Fourth-ventricle ependymomas may extend through ventricular outlets. Why not the others: B. Optic pathway glioma — Typically affects optic nerves/chiasm.; C. Craniopharyngioma — Arises near the sellar region.; D. Pineoblastoma — Arises in the pineal region.", "pearl": "Fourth-ventricle ependymomas may extend through ventricular outlets.", "srcAnswer": "A"}, {"num": 97, "level": "", "question": "A child with a VP shunt develops vomiting, lethargy and headache; CT shows interval enlargement of lateral ventricles compared with the last scan. Which complication is most likely?", "options": ["Shunt overdrainage with slit ventricles", "Shunt-associated subdural fluid collection", "Shunt infection without impaired CSF drainage", "Shunt obstruction with recurrent hydrocephalus"], "answer": 3, "explanation": "Mechanical obstruction can cause acute raised ICP without fever. Why not the others: A. Shunt overdrainage with slit ventricles — Overdrainage typically produces slit ventricles or low-pressure symptoms, not new ventriculomegaly.; B. Shunt-associated subdural fluid collection — A subdural collection may cause symptoms but the stem specifically documents recurrent ventricular enlargement.; C. Shunt infection without impaired CSF drainage — Shunt infection is possible even without fever, but ventricular enlargement favors impaired CSF drainage in this stem.", "pearl": "Mechanical obstruction can cause acute raised ICP without fever.", "srcAnswer": "D"}, {"num": 98, "level": "", "question": "A 4-year-old with headaches has new upward-gaze limitation and enlarged lateral and third ventricles but normal fourth ventricle. Where is obstruction most likely?", "options": ["Foramen of Magendie alone", "Arachnoid granulations", "Cerebral aqueduct", "Bilateral foramina of Luschka"], "answer": 2, "explanation": "Aqueductal obstruction dilates lateral and third ventricles while sparing the fourth. Why not the others: A. Foramen of Magendie alone — Fourth ventricle would generally also enlarge.; B. Arachnoid granulations — Impaired absorption tends to enlarge the whole ventricular system.; D. Bilateral foramina of Luschka — Outlet obstruction usually involves fourth ventricular enlargement.", "pearl": "Aqueductal obstruction dilates lateral and third ventricles while sparing the fourth.", "srcAnswer": "C"}, {"num": 99, "level": "", "question": "A child with NF1 has gradually worsening vision and optic pathway enlargement on MRI. Which tumor association is most characteristic?", "options": ["Ependymoma", "Craniopharyngioma", "Medulloblastoma", "Optic pathway glioma"], "answer": 3, "explanation": "NF1 predisposes to optic pathway gliomas. Why not the others: A. Ependymoma — Not the defining NF1 association.; B. Craniopharyngioma — Suprasellar tumor not characteristically driven by NF1.; C. Medulloblastoma — Not the hallmark NF1-associated pediatric brain tumor.", "pearl": "NF1 predisposes to optic pathway gliomas.", "srcAnswer": "D"}, {"num": 100, "level": "", "question": "A child has a cerebellar cystic mass with an enhancing mural nodule and relatively circumscribed margins. Most likely histology?", "options": ["Pilocytic astrocytoma", "Craniopharyngioma", "Diffuse midline glioma", "Medulloblastoma"], "answer": 0, "explanation": "This classic imaging pattern is associated with pilocytic astrocytoma. Why not the others: B. Craniopharyngioma — Usually suprasellar with calcified cystic components.; C. Diffuse midline glioma — Infiltrative brainstem disease has a different appearance.; D. Medulloblastoma — Typically a more cellular solid midline lesion.", "pearl": "This classic imaging pattern is associated with pilocytic astrocytoma.", "srcAnswer": "A"}, {"num": 101, "level": "", "question": "A 10-year-old has a bicuspid aortic valve with systolic doming and a high Doppler velocity measured across the leaflets; the aortic arch is normal. Which level is primarily obstructed?", "options": ["Valvular aortic stenosis", "Discrete subaortic stenosis", "Supravalvular aortic stenosis", "Aortic coarctation"], "answer": 0, "explanation": "The high gradient is localized across the doming aortic valve. Why not the others: B. Discrete subaortic stenosis — A subaortic membrane lies below the leaflets and is not described.; C. Supravalvular aortic stenosis — Narrowing above the sinotubular junction is not shown.; D. Aortic coarctation — Arch narrowing is absent and would be distal to the valve.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 19 Q6 — Valvular LVOT obstruction"}}, {"num": 102, "level": "", "question": "A cyanotic newborn has severe respiratory distress, diffuse pulmonary edema and an infradiaphragmatic pulmonary venous channel compressed at the diaphragm. After initial stabilization, what is the definitive priority?", "options": ["PGE1 alone as definitive therapy", "Emergency surgical relief of pulmonary venous obstruction", "Elective repair after pulmonary edema resolves", "Atrial septostomy as definitive therapy"], "answer": 1, "explanation": "Obstructed infracardiac TAPVC requires urgent correction of venous drainage. Why not the others: A. PGE1 alone as definitive therapy — Ductal patency does not correct obstructed pulmonary venous return.; C. Elective repair after pulmonary edema resolves — The venous obstruction itself causes the edema and waiting is unsafe.; D. Atrial septostomy as definitive therapy — Improving atrial mixing does not relieve pulmonary venous obstruction.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 19 Q11 — Obstructed infracardiac TAPVC"}}, {"num": 103, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease on retinal examination. Which category best guides referral for treatment evaluation?", "options": ["Immature retina without clinically staged ROP", "Type 2 ROP requiring scheduled observation", "Type 1 ROP requiring prompt treatment evaluation", "Zone III ROP without definite plus disease"], "answer": 2, "explanation": "Zone II stage 2 with plus disease meets ETROP Type 1 criteria. Why not the others: A. Immature retina without clinically staged ROP — Staging and plus disease are already documented.; B. Type 2 ROP requiring scheduled observation — Type 2 in zone II requires stage 3 without plus disease.; D. Zone III ROP without definite plus disease — The disease is in zone II, not zone III.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 104, "level": "", "question": "An infant born at 30 weeks gestation is now 18 weeks old chronologically. What is the corrected age in weeks?", "options": ["30 weeks", "48 weeks", "18 weeks", "8 weeks"], "answer": 3, "explanation": "Prematurity is 10 weeks; corrected age is 18 minus 10 = 8 weeks. Why not the others: A. 30 weeks — This is gestational age at birth, not corrected age.; B. 48 weeks — This is current postmenstrual age, not corrected age.; C. 18 weeks — This is chronological age, not corrected age.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q46 — Corrected versus postmenstrual age"}}, {"num": 105, "level": "", "question": "A 14-month-old becomes hypoketotic and hypoglycemic after prolonged fasting; tandem MS shows increased C8 acylcarnitine. Most likely defect?", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Propionic acidemia", "Very-long-chain acyl-CoA dehydrogenase deficiency", "Maple syrup urine disease"], "answer": 0, "explanation": "C8 elevation with hypoketotic hypoglycemia is characteristic of MCAD deficiency. Why not the others: B. Propionic acidemia — This is associated with C3 acylcarnitine and metabolic acidosis.; C. Very-long-chain acyl-CoA dehydrogenase deficiency — VLCAD more typically elevates long-chain C14:1 species.; D. Maple syrup urine disease — MSUD produces elevated branched-chain amino acids and alloisoleucine.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD versus VLCAD/MSUD"}}, {"num": 106, "level": "", "question": "An echocardiography teaching session asks which anatomic VSD subtype is most frequent in congenital VSD cohorts. Which is correct?", "options": ["Muscular VSD", "Perimembranous VSD", "Inlet VSD", "Outlet/subarterial VSD"], "answer": 1, "explanation": "Perimembranous defects are the most common anatomic subtype. Why not the others: A. Muscular VSD — Muscular defects often close spontaneously but are not the most frequent type.; C. Inlet VSD — Inlet defects are less frequent and may accompany AV septal defects.; D. Outlet/subarterial VSD — Outlet defects are less common overall, with geographic variation.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 17 Q22 — Commonest VSD anatomical subtype"}}, {"num": 107, "level": "", "question": "A ventilated neonate abruptly desaturates; the ET tube remains at the correct depth, breath sounds are symmetric, and the ventilator circuit is visibly disconnected. Which DOPE category identifies the immediate problem?", "options": ["Pneumothorax", "Obstruction of endotracheal tube", "Equipment failure", "Displacement of endotracheal tube"], "answer": 2, "explanation": "A disconnected ventilator circuit is an equipment issue. Why not the others: A. Pneumothorax — Breath sounds are symmetric and the observed disconnection is sufficient.; B. Obstruction of endotracheal tube — A blocked tube would not explain a visibly disconnected circuit.; D. Displacement of endotracheal tube — Tube position is unchanged and circuit separation is observed.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 5 Q34 — DOPE equipment disconnection"}}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 6',href:'Day28/quiz6.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet6_Q91-107_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 6 — Wrong Answer Report</h1><p><b>Questions:</b> 91–107</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['6']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['6']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 6 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
