@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 19, "level": "", "question": "A child continues convulsing for 6 minutes in a clinic with IV access and resuscitation facilities. First-line drug class?", "options": ["Sodium-channel blocker as first action", "Benzodiazepine", "Maintenance corticosteroid", "Prophylactic antibiotic alone"], "answer": 1, "explanation": "A benzodiazepine is first-line emergency treatment for convulsive status epilepticus. Why not the others: A. Sodium-channel blocker as first action — A second-line antiseizure medicine is used after adequate benzodiazepine treatment.; C. Maintenance corticosteroid — Steroids are not initial anticonvulsants for convulsive status.; D. Prophylactic antibiotic alone — Antibiotics address an infection when indicated, not the ongoing convulsion.", "pearl": "A benzodiazepine is first-line emergency treatment for convulsive status epilepticus.", "srcAnswer": "B"}, {"num": 20, "level": "", "question": "A 6-year-old continues convulsing after two appropriate benzodiazepine doses with airway support available. Which is the next antiseizure strategy?", "options": ["Administer a third full benzodiazepine dose before choosing another class", "Wait for EEG confirmation before further antiseizure therapy", "Give an appropriate IV second-line antiseizure medication and prepare escalation", "Begin an oral maintenance antiseizure drug while continuing observation"], "answer": 2, "explanation": "Established status after benzodiazepines needs second-line therapy. Why not the others: A. Administer a third full benzodiazepine dose before choosing another class — Repeated benzodiazepines increase respiratory risk and delay second-line treatment.; B. Wait for EEG confirmation before further antiseizure therapy — Convulsive status is a clinical emergency; treatment must not await EEG.; D. Begin an oral maintenance antiseizure drug while continuing observation — Oral administration is unsuitable during ongoing convulsive status.", "pearl": "Established status after benzodiazepines needs second-line therapy.", "srcAnswer": "C"}, {"num": 21, "level": "", "question": "An actively convulsing child has no IV access in the community. Which first-line route is supported?", "options": ["Oral valproate loading under observation", "Intramuscular phenobarbital as initial rescue", "Buccal midazolam per emergency plan", "Rectal levetiracetam as initial rescue"], "answer": 2, "explanation": "Non-IV benzodiazepine routes are appropriate when IV access is unavailable. Why not the others: A. Oral valproate loading under observation — Oral dosing is unsafe and too slow during active convulsions.; B. Intramuscular phenobarbital as initial rescue — A benzodiazepine is preferred initial community rescue treatment.; D. Rectal levetiracetam as initial rescue — Levetiracetam is an IV/oral antiseizure drug, not a validated rectal first-line rescue route for convulsive status.", "pearl": "Non-IV benzodiazepine routes are appropriate when IV access is unavailable.", "srcAnswer": "C"}, {"num": 22, "level": "", "question": "A child with typical absence epilepsy requires long-term monotherapy and has no generalized tonic-clonic seizures. Which agent is classically preferred?", "options": ["Gabapentin", "Ethosuximide", "Phenytoin", "Carbamazepine"], "answer": 1, "explanation": "Ethosuximide is effective for typical absence seizures and avoids unnecessary broad-spectrum exposure when absences are isolated. Why not the others: A. Gabapentin — Not established as effective for typical absence seizures.; C. Phenytoin — Not a preferred agent for typical absence seizures and may aggravate them.; D. Carbamazepine — Can worsen absence seizures in generalized epilepsies.", "pearl": "Ethosuximide is effective for typical absence seizures and avoids unnecessary broad-spectrum exposure when absences are isolated.", "srcAnswer": "B"}, {"num": 23, "level": "", "question": "A child with Dravet syndrome develops more myoclonic seizures after starting carbamazepine. Most likely explanation?", "options": ["Sodium-channel blocking antiseizure medicine may exacerbate seizures in Dravet syndrome", "Myoclonic events exclude epileptic disease", "Carbamazepine is first-line for all generalized epilepsies", "The EEG must be normal for Dravet syndrome"], "answer": 0, "explanation": "SCN1A-related Dravet often worsens with several sodium-channel blockers. Why not the others: B. Myoclonic events exclude epileptic disease — Myoclonus may be epileptic.; C. Carbamazepine is first-line for all generalized epilepsies — It can worsen several generalized seizure types.; D. The EEG must be normal for Dravet syndrome — EEG abnormalities may evolve over time.", "pearl": "SCN1A-related Dravet often worsens with several sodium-channel blockers.", "srcAnswer": "A"}, {"num": 24, "level": "", "question": "A teenager taking valproate develops abdominal pain, vomiting and markedly raised serum lipase. What adverse effect requires consideration?", "options": ["Expected asymptomatic hyperammonemia", "Transient cosmetic alopecia", "Benign dose-related tremor", "Valproate-associated pancreatitis"], "answer": 3, "explanation": "Pancreatitis is a serious recognized valproate adverse effect. Why not the others: A. Expected asymptomatic hyperammonemia — Hyperammonemia has a different presentation and does not explain elevated lipase.; B. Transient cosmetic alopecia — Hair loss does not cause acute pancreatic inflammation.; C. Benign dose-related tremor — Tremor does not explain lipase elevation and abdominal pain.", "pearl": "Pancreatitis is a serious recognized valproate adverse effect.", "srcAnswer": "D"}, {"num": 25, "level": "", "question": "A child on valproate becomes encephalopathic with high ammonia but near-normal transaminases. Best explanation?", "options": ["Acute hepatocellular injury with ammonia rise", "Valproate-associated hyperammonemic encephalopathy", "Postictal somnolence without drug toxicity", "Levetiracetam-related behavioral syndrome"], "answer": 1, "explanation": "Hyperammonemia can occur without major hepatocellular injury. Why not the others: A. Acute hepatocellular injury with ammonia rise — Persistent encephalopathy with high ammonia needs assessment.; C. Postictal somnolence without drug toxicity — Valproate hyperammonemia need not have marked transaminitis.; D. Levetiracetam-related behavioral syndrome — That does not explain the ammonia elevation.", "pearl": "Hyperammonemia can occur without major hepatocellular injury.", "srcAnswer": "B"}, {"num": 26, "level": "", "question": "A patient on carbamazepine develops fever, widespread rash and mucosal erosions. Which reaction must be excluded urgently?", "options": ["Dose-related diplopia alone", "Benign fixed drug eruption without systemic involvement", "Stevens-Johnson syndrome or toxic epidermal necrolysis", "Simple transient flushing"], "answer": 2, "explanation": "Mucosal involvement and systemic illness are major warning signs. Why not the others: A. Dose-related diplopia alone — Diplopia is not the primary issue with fever and erosive rash.; B. Benign fixed drug eruption without systemic involvement — Extensive systemic symptoms suggest a severe cutaneous reaction.; D. Simple transient flushing — Flushing does not explain mucosal erosions.", "pearl": "Mucosal involvement and systemic illness are major warning signs.", "srcAnswer": "C"}, {"num": 27, "level": "", "question": "A child with epilepsy has new irritability and aggression after an antiseizure medicine was added. Which agent is especially associated with behavioral adverse effects?", "options": ["Acetazolamide", "Ethosuximide", "Pyridoxine", "Levetiracetam"], "answer": 3, "explanation": "Behavioral irritability and mood changes are recognized adverse effects. Why not the others: A. Acetazolamide — Paresthesias and metabolic effects are more typical.; B. Ethosuximide — GI effects are more typical; behavioral symptoms are less characteristic.; C. Pyridoxine — Not the usual culprit in this antiseizure medication scenario.", "pearl": "Behavioral irritability and mood changes are recognized adverse effects.", "srcAnswer": "D"}, {"num": 28, "level": "", "question": "A child with refractory status epilepticus is intubated, sedated and no longer shows motor convulsions. Which monitoring best establishes whether seizures have stopped?", "options": ["Serial bedside Glasgow Coma Scale alone", "Intermittent serum lactate trends alone", "Continuous EEG monitoring", "Hourly pupillary examinations alone"], "answer": 2, "explanation": "Electrographic seizures can persist despite cessation of motor manifestations. Why not the others: A. Serial bedside Glasgow Coma Scale alone — Sedation confounds clinical examination and does not detect electrographic seizures.; B. Intermittent serum lactate trends alone — Lactate may normalize despite nonconvulsive seizures.; D. Hourly pupillary examinations alone — Pupils assess neurologic status but cannot determine ongoing seizure activity.", "pearl": "Electrographic seizures can persist despite cessation of motor manifestations.", "srcAnswer": "C"}, {"num": 29, "level": "", "question": "An infant with spasms due to TSC and a 10-year-old with isolated absence seizures require different therapies. Which pairing best reflects syndrome-specific choices?", "options": ["Ethosuximide for TSC spasms; vigabatrin for isolated absences", "Carbamazepine for both syndromes", "Gabapentin for both syndromes", "Vigabatrin for TSC-related spasms; ethosuximide for isolated typical absences"], "answer": 3, "explanation": "Therapy is tailored to epilepsy syndrome and etiology. Why not the others: A. Ethosuximide for TSC spasms; vigabatrin for isolated absences — These choices reverse the usual indications.; B. Carbamazepine for both syndromes — It is not a first-line therapy for either typical spasms or absences.; C. Gabapentin for both syndromes — It lacks established efficacy for these syndromes.", "pearl": "Therapy is tailored to epilepsy syndrome and etiology.", "srcAnswer": "D"}, {"num": 30, "level": "", "question": "A child has ongoing confusion after visible convulsions stop. Which diagnostic possibility should be actively assessed?", "options": ["New cerebral palsy", "Seizure cessation is proven by lack of limb jerking", "Nonconvulsive status epilepticus", "All confusion is due to sedative medication"], "answer": 2, "explanation": "Persistent altered mental state may reflect electrographic seizure activity. Why not the others: A. New cerebral palsy — CP does not present as an acute postictal confusion syndrome.; B. Seizure cessation is proven by lack of limb jerking — Electrographic seizures may continue without convulsions.; D. All confusion is due to sedative medication — Drug effects are possible but not the only cause.", "pearl": "Persistent altered mental state may reflect electrographic seizure activity.", "srcAnswer": "C"}, {"num": 31, "level": "", "question": "A child with epilepsy starts a new drug and develops low sodium with confusion. Which antiseizure agent is a recognized cause of SIADH-like hyponatremia?", "options": ["Levetiracetam", "Oxcarbazepine", "Ethosuximide", "Vigabatrin"], "answer": 1, "explanation": "Oxcarbazepine can cause clinically significant hyponatremia. Why not the others: A. Levetiracetam — Hyponatremia is less characteristic than behavioral adverse effects.; C. Ethosuximide — Typical adverse effects are gastrointestinal and fatigue.; D. Vigabatrin — Visual field toxicity is a more characteristic concern.", "pearl": "Oxcarbazepine can cause clinically significant hyponatremia.", "srcAnswer": "B"}, {"num": 32, "level": "", "question": "A child taking vigabatrin requires surveillance for which important treatment-related toxicity?", "options": ["Aplastic anemia", "Peripheral visual-field constriction", "Severe ototoxicity", "Pulmonary fibrosis"], "answer": 1, "explanation": "Vigabatrin may cause irreversible visual field loss. Why not the others: A. Aplastic anemia — Not the major toxicity used to monitor vigabatrin.; C. Severe ototoxicity — This is not its signature toxicity.; D. Pulmonary fibrosis — Not a characteristic vigabatrin adverse effect.", "pearl": "Vigabatrin may cause irreversible visual field loss.", "srcAnswer": "B"}, {"num": 33, "level": "", "question": "An adolescent has focal epilepsy but develops generalized myoclonic jerks after a new medication. Which review is most important?", "options": ["Attribute the jerks to anxiety-related movements", "Escalate the same drug without reassessment", "Abrupt withdrawal of current antiseizure drugs", "Reassess seizure classification and potential drug-induced aggravation"], "answer": 3, "explanation": "Sodium-channel agents may worsen generalized myoclonic seizures when epilepsy was misclassified. Why not the others: A. Attribute the jerks to anxiety-related movements — Abrupt withdrawal may precipitate seizures.; B. Escalate the same drug without reassessment — Escalation may worsen seizure aggravation.; C. Abrupt withdrawal of current antiseizure drugs — A medication-associated change requires neurologic reassessment.", "pearl": "Sodium-channel agents may worsen generalized myoclonic seizures when epilepsy was misclassified.", "srcAnswer": "D"}, {"num": 34, "level": "", "question": "A convulsing child receives a rescue benzodiazepine and becomes apneic. Which priority is appropriate while treating ongoing seizures?", "options": ["Withhold airway support until EEG is available", "Discharge once motor activity decreases", "Support airway and ventilation immediately while continuing protocol-directed seizure care", "Give oral fluids to improve consciousness"], "answer": 2, "explanation": "Respiratory depression requires resuscitation; treatment and stabilization proceed together. Why not the others: A. Withhold airway support until EEG is available — Airway management cannot wait for EEG.; B. Discharge once motor activity decreases — Apnea is an emergency regardless of visible seizure activity.; D. Give oral fluids to improve consciousness — Aspiration risk is high during altered consciousness.", "pearl": "Respiratory depression requires resuscitation; treatment and stabilization proceed together.", "srcAnswer": "C"}, {"num": 35, "level": "", "question": "A 3-year-old has a fixed pattern of spastic motor impairment after early periventricular brain injury, with no loss of acquired skills. Which description best fits cerebral palsy?", "options": ["Permanent movement and posture impairment from a nonprogressive disturbance of the developing brain", "Progressive inherited spastic paraplegia", "Acquired inflammatory myelopathy", "Chronic distal motor neuropathy"], "answer": 0, "explanation": "CP results from a nonprogressive brain disturbance, though secondary manifestations may evolve. Why not the others: B. Progressive inherited spastic paraplegia — Hereditary spastic paraplegia may progress rather than remain static.; C. Acquired inflammatory myelopathy — A spinal cord inflammatory process has a different course and localization.; D. Chronic distal motor neuropathy — Peripheral neuropathy does not explain this static central motor syndrome.", "pearl": "CP results from a nonprogressive brain disturbance, though secondary manifestations may evolve.", "srcAnswer": "A"}, {"num": 36, "level": "", "question": "A former preterm infant has leg-predominant spasticity and periventricular white-matter injury on MRI. Most consistent motor phenotype?", "options": ["Spastic diplegia", "Distal hereditary motor neuropathy", "Dyskinetic quadriplegia", "Pure cerebellar ataxia"], "answer": 0, "explanation": "Periventricular leukomalacia in preterm children is associated with leg-predominant spastic CP. Why not the others: B. Distal hereditary motor neuropathy — This would not account for central spasticity and PVL.; C. Dyskinetic quadriplegia — Deep gray matter injury more often accompanies dyskinesia.; D. Pure cerebellar ataxia — Cerebellar dysfunction does not explain pyramidal leg-predominant signs.", "pearl": "Periventricular leukomalacia in preterm children is associated with leg-predominant spastic CP.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 2',href:'Day28/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet2_Q19-36_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 19–36</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
