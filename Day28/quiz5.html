const quiz=[{"num": 73, "level": "", "question": "An 8-year-old develops encephalopathy and multifocal deficits 12 days after a viral illness; MRI shows bilateral large, poorly demarcated white-matter lesions. Most likely?", "options": ["Typical multiple sclerosis relapse without encephalopathy", "Bacterial meningitis without encephalitis", "Peripheral Guillain-Barré syndrome", "Acute disseminated encephalomyelitis"], "answer": 3, "explanation": "Postinfectious encephalopathy with multifocal CNS deficits and large poorly demarcated lesions suggests ADEM. Why not the others: A. Typical multiple sclerosis relapse without encephalopathy — ADEM classically includes encephalopathy, unlike typical first MS relapse.; B. Bacterial meningitis without encephalitis — This usually has meningeal features and inflammatory CSF rather than this MRI pattern.; C. Peripheral Guillain-Barré syndrome — GBS causes peripheral areflexic weakness without brain white-matter lesions.", "pearl": "Postinfectious encephalopathy with multifocal CNS deficits and large poorly demarcated lesions suggests ADEM.", "srcAnswer": "D"}, {"num": 74, "level": "", "question": "A child with suspected ADEM has altered consciousness and multiple neurologic deficits. Which feature is particularly important in differentiating ADEM from a typical first MS attack?", "options": ["A history of preceding infection alone", "Presence of any focal weakness", "Any MRI white-matter lesion", "Encephalopathy not explained by fever or seizures alone"], "answer": 3, "explanation": "Encephalopathy is central to classic pediatric ADEM definitions. Why not the others: A. A history of preceding infection alone — Postinfectious history supports but does not define ADEM.; B. Presence of any focal weakness — Focal weakness can occur in both ADEM and MS.; C. Any MRI white-matter lesion — Both disorders can produce white-matter lesions.", "pearl": "Encephalopathy is central to classic pediatric ADEM definitions.", "srcAnswer": "D"}, {"num": 75, "level": "", "question": "A child has suspected bacterial meningitis, but safe LP would delay antibiotics by 90 minutes. What is best?", "options": ["Take appropriate blood samples rapidly and begin IV antibiotics without waiting for LP", "Delay all antibiotics until LP can be completed", "Send home for outpatient LP", "Give corticosteroids alone while waiting for LP"], "answer": 0, "explanation": "NICE recommends antibiotics within 1 hour and LP only if safe and not delaying therapy. Why not the others: B. Delay all antibiotics until LP can be completed — This increases risk from untreated infection.; C. Send home for outpatient LP — Unsafe for suspected bacterial meningitis.; D. Give corticosteroids alone while waiting for LP — Steroids are adjunctive, not definitive therapy.", "pearl": "NICE recommends antibiotics within 1 hour and LP only if safe and not delaying therapy.", "srcAnswer": "A"}, {"num": 76, "level": "", "question": "Which MRI distribution is especially suggestive of HSV encephalitis?", "options": ["Symmetric bilateral globus pallidus signal changes", "Asymmetric mesial temporal and inferior frontal involvement", "Periventricular calcifications with cortical atrophy", "Isolated contrast enhancement of spinal nerve roots"], "answer": 1, "explanation": "HSV has a predilection for temporal and frontoinsular regions. Why not the others: A. Symmetric bilateral globus pallidus signal changes — This suggests metabolic or toxic pathology.; C. Periventricular calcifications with cortical atrophy — This suggests congenital infection patterns.; D. Isolated contrast enhancement of spinal nerve roots — This is more compatible with peripheral radiculitis.", "pearl": "HSV has a predilection for temporal and frontoinsular regions.", "srcAnswer": "B"}, {"num": 77, "level": "", "question": "A child with meningitis develops unilateral weakness and seizures despite antimicrobial therapy. Which complication requires evaluation?", "options": ["Benign postural hypotension alone", "Cerebral vasculitis or infarction", "New isolated absence epilepsy", "Primary dystrophinopathy"], "answer": 1, "explanation": "Inflammation-related vascular injury can complicate meningitis, especially TBM. Why not the others: A. Benign postural hypotension alone — Persistent focal deficits warrant neuroimaging.; C. New isolated absence epilepsy — Absence seizures do not explain focal weakness in meningitis.; D. Primary dystrophinopathy — Acute focal deficit is not typical DMD.", "pearl": "Inflammation-related vascular injury can complicate meningitis, especially TBM.", "srcAnswer": "B"}, {"num": 78, "level": "", "question": "A patient with encephalitis has prominent psychiatric change, dyskinesias and autonomic instability. Which diagnosis should be considered?", "options": ["Anti-NMDA receptor encephalitis", "Childhood absence epilepsy", "Typical bacterial meningitis alone", "Guillain-Barré syndrome"], "answer": 0, "explanation": "Psychiatric symptoms, movement disorder and autonomic features suggest anti-NMDAR encephalitis. Why not the others: B. Childhood absence epilepsy — Typical absences do not cause progressive encephalopathy and dysautonomia.; C. Typical bacterial meningitis alone — Usually has fever, meningism and bacterial CSF pattern.; D. Guillain-Barré syndrome — GBS does not primarily cause psychiatric symptoms and dyskinesias.", "pearl": "Psychiatric symptoms, movement disorder and autonomic features suggest anti-NMDAR encephalitis.", "srcAnswer": "A"}, {"num": 79, "level": "", "question": "A child with possible raised intracranial pressure is hyperventilated aggressively for hours without signs of impending herniation. Why is this concerning?", "options": ["Hyperventilation produces a sustained rise in ICP", "Sustained hypocapnia can reduce cerebral perfusion and cause ischemia", "Low CO2 has no effect on cerebral circulation", "Hyperventilation replaces treatment of the underlying lesion"], "answer": 1, "explanation": "Prolonged hyperventilation is not routine ICP therapy because of cerebral vasoconstriction. Why not the others: A. Hyperventilation produces a sustained rise in ICP — It initially reduces cerebral blood volume and may lower ICP.; C. Low CO2 has no effect on cerebral circulation — CO2 strongly affects cerebrovascular tone.; D. Hyperventilation replaces treatment of the underlying lesion — It is at most a temporizing measure in selected emergencies.", "pearl": "Prolonged hyperventilation is not routine ICP therapy because of cerebral vasoconstriction.", "srcAnswer": "B"}, {"num": 80, "level": "", "question": "An immunocompetent child has fever, headache, photophobia and CSF lymphocytes with normal glucose; neurologic examination is otherwise normal. Most likely broad category?", "options": ["Viral meningitis", "Duchenne muscular dystrophy", "Typical pyogenic bacterial meningitis", "Obstructive hydrocephalus alone"], "answer": 0, "explanation": "Aseptic CSF pattern with preserved glucose is compatible with viral meningitis. Why not the others: B. Duchenne muscular dystrophy — Does not cause acute meningeal inflammation.; C. Typical pyogenic bacterial meningitis — Usually has more marked neutrophils and low glucose before treatment.; D. Obstructive hydrocephalus alone — Would not produce a viral inflammatory CSF pattern.", "pearl": "Aseptic CSF pattern with preserved glucose is compatible with viral meningitis.", "srcAnswer": "A"}, {"num": 81, "level": "", "question": "A child with fever and meningism has paired blood glucose 100 mg/dL and CSF glucose 30 mg/dL, CSF protein 180 mg/dL and 450 leukocytes/uL. Which interpretation is most defensible?", "options": ["CSF-to-blood glucose ratio 3.3 suggests a noninflammatory CSF pattern", "CSF-to-blood glucose ratio 0.70 favors uncomplicated viral meningitis", "CSF-to-blood glucose ratio 0.30 is concerning for bacterial or tuberculous meningitis", "CSF glucose 30 mg/dL rules out tuberculous meningitis"], "answer": 2, "explanation": "Markedly reduced CSF glucose with high protein and pleocytosis warrants urgent infectious evaluation. Why not the others: A. CSF-to-blood glucose ratio 3.3 suggests a noninflammatory CSF pattern — This reverses the ratio and ignores pleocytosis.; B. CSF-to-blood glucose ratio 0.70 favors uncomplicated viral meningitis — The actual ratio is 30/100=0.30, not 0.70.; D. CSF glucose 30 mg/dL rules out tuberculous meningitis — TB meningitis commonly causes low CSF glucose and high protein.", "pearl": "Markedly reduced CSF glucose with high protein and pleocytosis warrants urgent infectious evaluation.", "srcAnswer": "C"}, {"num": 82, "level": "", "question": "A child with treated bacterial meningitis improves clinically but has new hearing difficulty. Which follow-up is important?", "options": ["Reassurance without hearing evaluation", "Antiseizure medication levels in every child", "Formal audiological assessment", "Routine CK measurement alone"], "answer": 2, "explanation": "Hearing loss is a recognized sequela of bacterial meningitis and warrants evaluation. Why not the others: A. Reassurance without hearing evaluation — Early identification enables rehabilitation.; B. Antiseizure medication levels in every child — Not relevant without a specific indication.; D. Routine CK measurement alone — CK does not assess hearing injury.", "pearl": "Hearing loss is a recognized sequela of bacterial meningitis and warrants evaluation.", "srcAnswer": "C"}, {"num": 83, "level": "", "question": "In a prepubertal child, how many cafe-au-lait macules greater than 5 mm constitute one pigmentary NF1 diagnostic criterion?", "options": ["Ten or more", "Two or more", "Three or more", "Six or more"], "answer": 3, "explanation": "The 2021 NF1 consensus specifies at least six appropriately sized macules. Why not the others: A. Ten or more — The threshold is six, not ten.; B. Two or more — Two macules are insufficient for this criterion.; C. Three or more — Three macules are insufficient for this criterion.", "pearl": "The 2021 NF1 consensus specifies at least six appropriately sized macules.", "srcAnswer": "D"}, {"num": 84, "level": "", "question": "A child has multiple cafe-au-lait macules but no neurofibromas, optic glioma or other NF1 criteria; a parent has similar isolated pigmentary findings. Which alternate diagnosis merits consideration?", "options": ["Sturge-Weber syndrome", "Legius syndrome", "X-linked adrenoleukodystrophy", "Tuberous sclerosis complex"], "answer": 1, "explanation": "SPRED1-related Legius syndrome can mimic pigmentary NF1 without typical tumors. Why not the others: A. Sturge-Weber syndrome — SWS features facial capillary malformation and leptomeningeal involvement.; C. X-linked adrenoleukodystrophy — X-ALD does not primarily cause isolated cafe-au-lait macules.; D. Tuberous sclerosis complex — TSC typically has hypomelanotic rather than cafe-au-lait lesions.", "pearl": "SPRED1-related Legius syndrome can mimic pigmentary NF1 without typical tumors.", "srcAnswer": "B"}, {"num": 85, "level": "", "question": "A child with TSC has two major features: cortical tubers and subependymal nodules. What is the clinical diagnostic classification?", "options": ["Indeterminate TSC pending molecular confirmation", "Possible tuberous sclerosis with one major feature", "Definite tuberous sclerosis complex by clinical criteria", "Neurofibromatosis type 1 by clinical criteria"], "answer": 2, "explanation": "Two major features fulfill 2021 definite TSC clinical criteria. Why not the others: A. Indeterminate TSC pending molecular confirmation — The listed major features are characteristic of TSC.; B. Possible tuberous sclerosis with one major feature — Possible TSC includes one major feature, but two major fulfill definite criteria.; D. Neurofibromatosis type 1 by clinical criteria — Clinical criteria can establish diagnosis.", "pearl": "Two major features fulfill 2021 definite TSC clinical criteria.", "srcAnswer": "C"}, {"num": 86, "level": "", "question": "An infant with facial port-wine capillary malformation in the V1 distribution has early focal seizures. Which syndrome is most likely?", "options": ["Ataxia-telangiectasia", "Tuberous sclerosis complex", "Neurofibromatosis type 1", "Sturge-Weber syndrome"], "answer": 3, "explanation": "Facial capillary malformation with leptomeningeal vascular involvement and seizures suggests SWS. Why not the others: A. Ataxia-telangiectasia — AT presents with progressive ataxia and immunodeficiency.; B. Tuberous sclerosis complex — TSC features hypomelanotic macules and cortical tubers.; C. Neurofibromatosis type 1 — NF1 is associated with cafe-au-lait macules and neurofibromas.", "pearl": "Facial capillary malformation with leptomeningeal vascular involvement and seizures suggests SWS.", "srcAnswer": "D"}, {"num": 87, "level": "", "question": "A boy develops behavioral decline, spasticity, hyperpigmentation and adrenal insufficiency; MRI shows posterior cerebral white-matter disease. Which test is most useful?", "options": ["Very-long-chain fatty acids with ABCD1 molecular evaluation", "Serum SMN1 gene copy-number testing", "Plasma arylsulfatase A enzyme activity", "Urinary catecholamine metabolite testing"], "answer": 0, "explanation": "X-linked adrenoleukodystrophy affects CNS myelin and adrenal cortex. Why not the others: B. Serum SMN1 gene copy-number testing — This evaluates autoimmune myasthenia gravis.; C. Plasma arylsulfatase A enzyme activity — This diagnoses 5q spinal muscular atrophy.; D. Urinary catecholamine metabolite testing — Not the primary diagnostic test for X-ALD.", "pearl": "X-linked adrenoleukodystrophy affects CNS myelin and adrenal cortex.", "srcAnswer": "A"}, {"num": 88, "level": "", "question": "A boy with genetically confirmed X-linked adrenoleukodystrophy has normal neurologic examination. Which ongoing surveillance is especially important?", "options": ["No surveillance until clinical regression", "Annual EEG alone without other evaluation", "Serum CK alone every five years", "Adrenal function and brain MRI surveillance according to specialist protocols"], "answer": 3, "explanation": "Cerebral disease and adrenal failure can emerge independently. Why not the others: A. No surveillance until clinical regression — Presymptomatic surveillance may detect treatable disease.; B. Annual EEG alone without other evaluation — EEG does not assess adrenal or evolving cerebral white-matter disease.; C. Serum CK alone every five years — CK is not the primary surveillance marker.", "pearl": "Cerebral disease and adrenal failure can emerge independently.", "srcAnswer": "D"}, {"num": 89, "level": "", "question": "A toddler has macrocephaly, hypotonia and MRI with diffuse spongiform white-matter change. N-acetylaspartate is elevated. Most likely disorder?", "options": ["Canavan disease", "Krabbe disease", "Metachromatic leukodystrophy", "Adrenoleukodystrophy"], "answer": 0, "explanation": "Aspartoacylase deficiency causes elevated NAA and spongy white-matter degeneration. Why not the others: B. Krabbe disease — Krabbe is galactocerebrosidase deficiency.; C. Metachromatic leukodystrophy — MLD is arylsulfatase A deficiency and demyelination.; D. Adrenoleukodystrophy — X-ALD is ABCD1-related peroxisomal VLCFA accumulation.", "pearl": "Aspartoacylase deficiency causes elevated NAA and spongy white-matter degeneration.", "srcAnswer": "A"}, {"num": 90, "level": "", "question": "A child has progressive peripheral neuropathy, regression and white-matter changes; urine sulfatides are elevated. Which enzyme deficiency is likely?", "options": ["Aspartoacylase deficiency", "Galactocerebrosidase deficiency", "Arylsulfatase A deficiency", "Hexosaminidase A deficiency"], "answer": 2, "explanation": "Metachromatic leukodystrophy involves impaired sulfatide breakdown. Why not the others: A. Aspartoacylase deficiency — This causes Canavan disease.; B. Galactocerebrosidase deficiency — This causes Krabbe disease.; D. Hexosaminidase A deficiency — This causes Tay-Sachs disease.", "pearl": "Metachromatic leukodystrophy involves impaired sulfatide breakdown.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 5',href:'Day28/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet5_Q73-90_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 73–90</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
