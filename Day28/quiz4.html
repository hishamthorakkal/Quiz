const quiz=[{"num": 55, "level": "", "question": "Which factor most strongly modifies the usual severity of 5q spinal muscular atrophy?", "options": ["Serum antistreptolysin O titer", "DMD deletion reading frame", "Acetylcholine receptor antibody level", "SMN2 copy number"], "answer": 3, "explanation": "More SMN2 copies generally produce more full-length SMN protein and milder phenotypes, though not perfectly predictive. Why not the others: A. Serum antistreptolysin O titer — This does not modify SMA severity.; B. DMD deletion reading frame — This pertains to dystrophinopathy.; C. Acetylcholine receptor antibody level — This pertains to autoimmune NMJ disease.", "pearl": "More SMN2 copies generally produce more full-length SMN protein and milder phenotypes, though not perfectly predictive.", "srcAnswer": "D"}, {"num": 56, "level": "", "question": "A child has fluctuating ptosis and diplopia that worsen in the evening; pupils and reflexes are normal. Most likely localization?", "options": ["Anterior horn cell", "Neuromuscular junction", "Corticospinal tract", "Cerebellar vermis"], "answer": 1, "explanation": "Fatigable ocular weakness with preserved reflexes is typical of myasthenia. Why not the others: A. Anterior horn cell — SMA causes fixed weakness and often reduced reflexes.; C. Corticospinal tract — Upper motor neuron lesions cause hyperreflexia and spasticity.; D. Cerebellar vermis — Cerebellar disease causes ataxia rather than fatigable ptosis.", "pearl": "Fatigable ocular weakness with preserved reflexes is typical of myasthenia.", "srcAnswer": "B"}, {"num": 57, "level": "", "question": "A patient with suspected myasthenia gravis develops dysphagia, weak cough and rapidly worsening respiratory effort. What is the most important immediate action?", "options": ["Increase oral pyridostigmine and send home", "Urgent airway and respiratory assessment for myasthenic crisis", "Wait for antibody confirmation before support", "Perform routine exercise testing before stabilization"], "answer": 1, "explanation": "Bulbar and respiratory weakness can deteriorate rapidly and requires monitored support. Why not the others: A. Increase oral pyridostigmine and send home — Impending respiratory failure needs inpatient urgent assessment.; C. Wait for antibody confirmation before support — Clinical respiratory risk determines emergency management.; D. Perform routine exercise testing before stabilization — Provocative testing is unsafe in unstable respiratory weakness.", "pearl": "Bulbar and respiratory weakness can deteriorate rapidly and requires monitored support.", "srcAnswer": "B"}, {"num": 58, "level": "", "question": "A child develops ascending weakness and areflexia 10 days after gastroenteritis. Which diagnosis is most likely?", "options": ["Juvenile myoclonic epilepsy", "Cerebral palsy", "Duchenne muscular dystrophy", "Guillain-Barré syndrome"], "answer": 3, "explanation": "Acute postinfectious flaccid weakness and areflexia suggest GBS. Why not the others: A. Juvenile myoclonic epilepsy — Epilepsy does not explain progressive areflexic weakness.; B. Cerebral palsy — CP is not an acute postinfectious peripheral neuropathy.; C. Duchenne muscular dystrophy — DMD is chronic progressive proximal weakness.", "pearl": "Acute postinfectious flaccid weakness and areflexia suggest GBS.", "srcAnswer": "D"}, {"num": 59, "level": "", "question": "In early GBS, CSF protein is normal despite typical clinical features. Which statement is most accurate?", "options": ["GBS is excluded by a normal first-week CSF protein", "Marked CSF neutrophilic pleocytosis is obligatory", "A normal early CSF protein does not exclude GBS", "Normal CSF proves a primary muscle disease"], "answer": 2, "explanation": "Albuminocytologic dissociation may emerge later in the course. Why not the others: A. GBS is excluded by a normal first-week CSF protein — Early CSF may be normal.; B. Marked CSF neutrophilic pleocytosis is obligatory — Typical GBS does not require a neutrophilic CSF response.; D. Normal CSF proves a primary muscle disease — Clinical and electrodiagnostic context remain necessary.", "pearl": "Albuminocytologic dissociation may emerge later in the course.", "srcAnswer": "C"}, {"num": 60, "level": "", "question": "A child with GBS cannot walk unaided 8 days after onset. Which disease-modifying therapy is supported?", "options": ["High-dose oral corticosteroids as disease-modifying therapy", "IV immunoglobulin or plasma exchange after specialist assessment", "Second IVIG course before clinical response assessment", "Empiric antibiotics directed at antecedent diarrhea"], "answer": 1, "explanation": "Both are established effective therapies in functionally significant GBS. Why not the others: A. High-dose oral corticosteroids as disease-modifying therapy — A routine second course is not recommended for poor prognosis alone.; C. Second IVIG course before clinical response assessment — Corticosteroids are not recommended as effective GBS disease-modifying treatment.; D. Empiric antibiotics directed at antecedent diarrhea — Postinfectious GBS is immune mediated; antibiotics are not disease-modifying therapy.", "pearl": "Both are established effective therapies in functionally significant GBS.", "srcAnswer": "B"}, {"num": 61, "level": "", "question": "A child with ascending weakness has new dysautonomia and falling vital capacity. Which monitoring strategy is most appropriate?", "options": ["Serial respiratory measurements and cardiac/autonomic monitoring in a monitored unit", "Serial pulse oximetry and neurologic examination", "Daily serum CK and quantitative muscle strength", "Daily fluid balance and body-weight measurements"], "answer": 0, "explanation": "GBS can cause respiratory failure and arrhythmias even before overt hypoxemia. Why not the others: B. Serial pulse oximetry and neurologic examination — Pulse oximetry may remain normal despite declining ventilatory capacity.; C. Daily serum CK and quantitative muscle strength — CK does not assess ventilatory muscle failure or autonomic instability.; D. Daily fluid balance and body-weight measurements — Weight does not substitute for respiratory and cardiac monitoring.", "pearl": "GBS can cause respiratory failure and arrhythmias even before overt hypoxemia.", "srcAnswer": "A"}, {"num": 62, "level": "", "question": "A schoolchild has distal wasting, pes cavus, foot drop and family history across generations. Which group of disorders is most likely?", "options": ["Acute transverse myelitis", "Dystonic cerebral palsy", "Hereditary motor and sensory neuropathy (Charcot-Marie-Tooth)", "Acquired myasthenia gravis"], "answer": 2, "explanation": "Chronic distal weakness and cavus feet with familial pattern suggest CMT. Why not the others: A. Acute transverse myelitis — Myelitis produces an acute spinal cord syndrome rather than chronic distal neuropathy.; B. Dystonic cerebral palsy — CP is central and does not cause a familial length-dependent neuropathy pattern.; D. Acquired myasthenia gravis — MG causes fluctuating fatigable weakness without typical pes cavus.", "pearl": "Chronic distal weakness and cavus feet with familial pattern suggest CMT.", "srcAnswer": "C"}, {"num": 63, "level": "", "question": "A child has ophthalmoplegia, ataxia and areflexia after infection but little limb weakness. Which GBS variant is most likely?", "options": ["Miller Fisher syndrome", "Friedreich ataxia", "Acute disseminated encephalomyelitis", "Myasthenic crisis"], "answer": 0, "explanation": "The ophthalmoplegia-ataxia-areflexia triad is characteristic. Why not the others: B. Friedreich ataxia — A chronic inherited ataxia is not a sudden postinfectious ophthalmoplegic syndrome.; C. Acute disseminated encephalomyelitis — ADEM usually causes encephalopathy and CNS lesions.; D. Myasthenic crisis — MG causes fatigable weakness but not typically areflexia with ataxia.", "pearl": "The ophthalmoplegia-ataxia-areflexia triad is characteristic.", "srcAnswer": "A"}, {"num": 64, "level": "", "question": "A toddler has normal sensation, tongue fasciculations and symmetrical proximal weakness. Which examination feature supports anterior horn cell disease over primary myopathy?", "options": ["Ocular fatigability with normal reflexes", "Markedly reduced deep tendon reflexes with fasciculations", "Hyperreflexia with extensor plantar responses", "Sensory level at the umbilicus"], "answer": 1, "explanation": "Lower motor neuron loss produces fasciculations and areflexia. Why not the others: A. Ocular fatigability with normal reflexes — This suggests NMJ dysfunction.; C. Hyperreflexia with extensor plantar responses — These favor upper motor neuron disease.; D. Sensory level at the umbilicus — This suggests spinal cord pathology.", "pearl": "Lower motor neuron loss produces fasciculations and areflexia.", "srcAnswer": "B"}, {"num": 65, "level": "", "question": "A boy has progressive proximal weakness, high CK and a pathogenic in-frame DMD deletion. Which interpretation is most appropriate?", "options": ["A neonatal-onset SMN1-associated phenotype", "A non-dystrophinopathy myopathy is established", "An autoimmune neuromuscular junction disorder", "A Becker-spectrum dystrophinopathy is more likely, with phenotype confirmation needed"], "answer": 3, "explanation": "In-frame variants often retain partial dystrophin function; clinical severity can vary. Why not the others: A. A neonatal-onset SMN1-associated phenotype — SMA involves SMN1, not DMD reading frame.; B. A non-dystrophinopathy myopathy is established — MG typically does not produce very high CK.; C. An autoimmune neuromuscular junction disorder — They are a common mechanism of Becker dystrophy.", "pearl": "In-frame variants often retain partial dystrophin function; clinical severity can vary.", "srcAnswer": "D"}, {"num": 66, "level": "", "question": "Which CSF pattern most strongly favors untreated pyogenic bacterial meningitis?", "options": ["High glucose with no cells and normal protein", "Neutrophilic pleocytosis, low CSF glucose and elevated protein", "Low cell count with intrathecal oligoclonal bands", "Lymphocytes with normal glucose and mildly raised protein"], "answer": 1, "explanation": "Typical bacterial meningitis has neutrophil predominance and reduced CSF-to-blood glucose ratio. Why not the others: A. High glucose with no cells and normal protein — Does not support pyogenic meningitis.; C. Low cell count with intrathecal oligoclonal bands — May suggest noninfectious inflammatory disease.; D. Lymphocytes with normal glucose and mildly raised protein — More typical of many viral meningitides.", "pearl": "Typical bacterial meningitis has neutrophil predominance and reduced CSF-to-blood glucose ratio.", "srcAnswer": "B"}, {"num": 67, "level": "", "question": "A febrile child with neck stiffness and petechial rash is in shock. Which sequence is best?", "options": ["Give oral antibiotics after outpatient observation", "Resuscitate, obtain blood cultures if feasible without delay, and give immediate empiric IV antibiotics", "Wait for CT to confirm meningitis before antibiotics", "Perform lumbar puncture before any fluids or antibiotics"], "answer": 1, "explanation": "Shock and suspected meningococcal disease demand urgent stabilization and treatment. Why not the others: A. Give oral antibiotics after outpatient observation — This is inadequate for suspected invasive bacterial disease.; C. Wait for CT to confirm meningitis before antibiotics — Imaging should not delay lifesaving treatment.; D. Perform lumbar puncture before any fluids or antibiotics — LP is unsafe in shock and must not delay antibiotics.", "pearl": "Shock and suspected meningococcal disease demand urgent stabilization and treatment.", "srcAnswer": "B"}, {"num": 68, "level": "", "question": "A child with suspected meningitis has focal neurologic deficit, abnormal pupils and a declining conscious level. Which statement about lumbar puncture is most accurate?", "options": ["Immediate LP before stabilizing neurologic decline", "LP before antibiotics despite focal neurologic signs", "Defer LP and stabilize while treating suspected infection and assessing intracranial pathology", "Normal fundus findings as the principal LP safety test"], "answer": 2, "explanation": "Focal signs and possible raised ICP are major LP safety concerns. Why not the others: A. Immediate LP before stabilizing neurologic decline — Papilledema may be absent despite raised intracranial pressure.; B. LP before antibiotics despite focal neurologic signs — Antibiotics should not be delayed when LP is unsafe.; D. Normal fundus findings as the principal LP safety test — Focal neurologic signs raise herniation risk.", "pearl": "Focal signs and possible raised ICP are major LP safety concerns.", "srcAnswer": "C"}, {"num": 69, "level": "", "question": "A child has fever, altered behavior, focal seizures and temporal-lobe MRI abnormalities. Which agent provides specific empiric coverage for suspected HSV encephalitis?", "options": ["Intravenous acyclovir for suspected HSV encephalitis", "IV ceftriaxone for pyogenic bacterial coverage", "IV isoniazid-rifampicin based antitubercular therapy", "IV methylprednisolone for inflammatory demyelination"], "answer": 0, "explanation": "HSV encephalitis is treatable and delays worsen outcomes. Why not the others: B. IV ceftriaxone for pyogenic bacterial coverage — This does not treat HSV encephalitis.; C. IV isoniazid-rifampicin based antitubercular therapy — Therapy should not wait for confirmatory PCR when suspicion is strong.; D. IV methylprednisolone for inflammatory demyelination — ICP management alone does not treat viral encephalitis.", "pearl": "HSV encephalitis is treatable and delays worsen outcomes.", "srcAnswer": "A"}, {"num": 70, "level": "", "question": "Early CSF HSV PCR is negative but the clinical and MRI pattern remains strongly suggestive. Best response?", "options": ["Discontinue acyclovir after the initial negative PCR", "Begin antitubercular therapy for an alternative infection", "Continue acyclovir and repeat appropriate testing with specialist input", "Reclassify the temporal lesion as ischemic infarction"], "answer": 2, "explanation": "Very early testing can be falsely negative; clinical suspicion should guide ongoing therapy. Why not the others: A. Discontinue acyclovir after the initial negative PCR — HSV is an important treatable differential.; B. Begin antitubercular therapy for an alternative infection — TB treatment depends on compatible clinical evidence.; D. Reclassify the temporal lesion as ischemic infarction — Early false negatives are possible.", "pearl": "Very early testing can be falsely negative; clinical suspicion should guide ongoing therapy.", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A 6-year-old has subacute headache, cranial nerve palsy, basal meningeal enhancement and hydrocephalus. CSF is lymphocytic with low glucose. Most likely diagnosis?", "options": ["Tuberculous meningitis", "Typical enteroviral meningitis", "Simple febrile seizure", "Migraine with aura"], "answer": 0, "explanation": "Basal exudates, cranial neuropathies, hydrocephalus and low CSF glucose suggest TBM. Why not the others: B. Typical enteroviral meningitis — Usually more acute with preserved CSF glucose and less basal hydrocephalus.; C. Simple febrile seizure — Does not explain basal meningeal disease.; D. Migraine with aura — Does not cause inflammatory CSF or hydrocephalus.", "pearl": "Basal exudates, cranial neuropathies, hydrocephalus and low CSF glucose suggest TBM.", "srcAnswer": "A"}, {"num": 72, "level": "", "question": "A child with presumed drug-susceptible TB meningitis is treated using the standard WHO long regimen. Which duration is correct?", "options": ["Twelve months with 2HRZE followed by 10HR", "Six weeks of ceftriaxone alone", "Four months with 2HRZE followed by 2HR", "Three months of isoniazid monotherapy"], "answer": 0, "explanation": "WHO retains the 12-month regimen; a 6-month intensive alternative is conditional in selected children. Why not the others: B. Six weeks of ceftriaxone alone — This does not treat TBM.; C. Four months with 2HRZE followed by 2HR — The shorter pulmonary TB regimen is not the standard TB meningitis regimen.; D. Three months of isoniazid monotherapy — Monotherapy is inadequate for active TB meningitis.", "pearl": "WHO retains the 12-month regimen; a 6-month intensive alternative is conditional in selected children.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 4',href:'Day28/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet4_Q55-72_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 55–72</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
