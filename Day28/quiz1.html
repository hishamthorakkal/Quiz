@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "", "question": "A 9-year-old has an episode beginning with right-hand clonic jerking and preserved responsiveness. Under the 2025 ILAE scheme, which main seizure class applies?", "options": ["Unclassified seizure", "Generalized seizure", "Focal seizure", "Unknown whether focal or generalized"], "answer": 2, "explanation": "A unilateral initial manifestation with retained responsiveness supports focal seizure classification. Why not the others: A. Unclassified seizure — There is adequate clinical information for classification.; B. Generalized seizure — Generalized seizures involve networks in both hemispheres from the outset, not a clearly unilateral initial event.; D. Unknown whether focal or generalized — The focal clinical onset is established, so onset is not unknown.", "pearl": "A unilateral initial manifestation with retained responsiveness supports focal seizure classification.", "srcAnswer": "C"}, {"num": 2, "level": "", "question": "A schoolchild has repeated 8-second staring spells with abrupt onset and offset; hyperventilation provokes regular generalized 3-Hz spike-wave. Most likely syndrome?", "options": ["Lennox-Gastaut syndrome", "Focal impaired-consciousness seizures", "Self-limited epilepsy with centrotemporal spikes", "Childhood absence epilepsy"], "answer": 3, "explanation": "Typical absences with generalized near-3-Hz spike-wave and normal development indicate CAE. Why not the others: A. Lennox-Gastaut syndrome — LGS combines multiple seizure types and slow spike-wave with developmental impairment.; B. Focal impaired-consciousness seizures — Focal seizures are less stereotypically brief and usually lack generalized 3-Hz spike-wave.; C. Self-limited epilepsy with centrotemporal spikes — SeLECTS typically produces focal orofacial seizures, often during sleep.", "pearl": "Typical absences with generalized near-3-Hz spike-wave and normal development indicate CAE.", "srcAnswer": "D"}, {"num": 3, "level": "", "question": "A 7-month-old loses developmental skills and has clusters of brief flexion spasms on awakening. Which investigation is most urgent to confirm the syndrome and guide treatment?", "options": ["Brain MRI before recording EEG", "EEG including sleep", "Short routine EEG recorded awake", "Surface EMG during observed spasms"], "answer": 1, "explanation": "Sleep EEG may show hypsarrhythmia or related epileptic abnormalities in infantile epileptic spasms syndrome. Why not the others: A. Brain MRI before recording EEG — Imaging may evaluate etiology but cannot replace EEG for syndrome confirmation.; C. Short routine EEG recorded awake — A short awake recording may miss the diagnostic abnormality and delays treatment.; D. Surface EMG during observed spasms — EMG can document contractions but does not establish epileptic cortical activity.", "pearl": "Sleep EEG may show hypsarrhythmia or related epileptic abnormalities in infantile epileptic spasms syndrome.", "srcAnswer": "B"}, {"num": 4, "level": "", "question": "An infant has definite epileptic spasms but no classic hypsarrhythmia on the first EEG. Which inference is most appropriate?", "options": ["Repeat EEG before further syndrome assessment", "Defer syndrome therapy pending repeat EEG", "Classify the episodes as nonepileptic shuddering", "Treat the clinical syndrome promptly while extending diagnostic evaluation"], "answer": 3, "explanation": "Hypsarrhythmia is not universal; absence of this pattern should not delay syndrome-specific treatment. Why not the others: A. Repeat EEG before further syndrome assessment — Delay risks worse developmental outcome.; B. Defer syndrome therapy pending repeat EEG — The syndrome can occur without classical hypsarrhythmia.; C. Classify the episodes as nonepileptic shuddering — Developmental regression and stereotyped clusters make a benign movement disorder unlikely.", "pearl": "Hypsarrhythmia is not universal; absence of this pattern should not delay syndrome-specific treatment.", "srcAnswer": "D"}, {"num": 5, "level": "", "question": "A 10-year-old has nocturnal hemifacial twitching, drooling and speech arrest with normal development; EEG shows centrotemporal spikes. Which syndrome fits best?", "options": ["Childhood absence epilepsy", "Epilepsy with eyelid myoclonia", "Self-limited epilepsy with centrotemporal spikes", "Lennox-Gastaut syndrome"], "answer": 2, "explanation": "Age, sleep-related focal oropharyngeal seizures and centrotemporal spikes are characteristic. Why not the others: A. Childhood absence epilepsy — CAE causes brief generalized staring, not focal orofacial motor events.; B. Epilepsy with eyelid myoclonia — This produces eye-closure-related eyelid jerks and photosensitivity.; D. Lennox-Gastaut syndrome — LGS has a more severe developmental and multi-seizure phenotype.", "pearl": "Age, sleep-related focal oropharyngeal seizures and centrotemporal spikes are characteristic.", "srcAnswer": "C"}, {"num": 6, "level": "", "question": "A 6-year-old with severe developmental delay has tonic seizures in sleep, atypical absences and slow generalized spike-wave below 2.5 Hz. Best syndrome?", "options": ["Childhood absence epilepsy", "Self-limited epilepsy with autonomic seizures", "Lennox-Gastaut syndrome", "Juvenile myoclonic epilepsy"], "answer": 2, "explanation": "Multiple seizure types, tonic sleep seizures and slow spike-wave with impairment are typical. Why not the others: A. Childhood absence epilepsy — CAE has regular faster generalized spike-wave and usually preserved development.; B. Self-limited epilepsy with autonomic seizures — This causes prolonged autonomic focal events rather than a severe multi-seizure encephalopathy.; D. Juvenile myoclonic epilepsy — JME typically begins in adolescence with myoclonic jerks and generalized polyspike-wave.", "pearl": "Multiple seizure types, tonic sleep seizures and slow spike-wave with impairment are typical.", "srcAnswer": "C"}, {"num": 7, "level": "", "question": "A previously normal 6-year-old has new acquired language regression with sleep-activated epileptiform discharges and few overt seizures. Which evaluation is most discriminating?", "options": ["Nerve conduction study", "Prolonged EEG capturing non-REM sleep", "Audiogram alone", "Routine CT without EEG"], "answer": 1, "explanation": "Sleep potentiation is central to the epileptic encephalopathy with spike-and-wave activation in sleep spectrum. Why not the others: A. Nerve conduction study — Peripheral nerve testing does not assess cortical epileptic activity.; C. Audiogram alone — Hearing evaluation is useful but cannot explain epileptiform sleep activation.; D. Routine CT without EEG — CT may detect a structural lesion but cannot assess sleep-related epileptiform burden.", "pearl": "Sleep potentiation is central to the epileptic encephalopathy with spike-and-wave activation in sleep spectrum.", "srcAnswer": "B"}, {"num": 8, "level": "", "question": "A child with TSC develops clusters of spasms and regression. Which statement best links etiology and management?", "options": ["Recognize infantile epileptic spasms syndrome and arrange urgent syndrome-directed treatment", "Use a normal interictal awake EEG to rule out epilepsy", "Defer intervention until cortical tubers enlarge", "Treat as simple febrile seizures because spasms occur in clusters"], "answer": 0, "explanation": "TSC is a recognized cause of epileptic spasms; rapid specialist treatment matters. Why not the others: B. Use a normal interictal awake EEG to rule out epilepsy — Awake EEG may miss diagnostic sleep abnormalities.; C. Defer intervention until cortical tubers enlarge — Spasms warrant prompt management independent of interval tuber growth.; D. Treat as simple febrile seizures because spasms occur in clusters — Spasms with regression are not typical febrile seizures.", "pearl": "TSC is a recognized cause of epileptic spasms; rapid specialist treatment matters.", "srcAnswer": "A"}, {"num": 9, "level": "", "question": "A 14-year-old has brief morning bilateral arm jerks causing dropped objects, with occasional generalized tonic-clonic seizures. Most likely epilepsy pattern?", "options": ["Self-limited epilepsy with centrotemporal spikes", "Epilepsy with autonomic seizures", "Juvenile myoclonic epilepsy", "Childhood absence epilepsy"], "answer": 2, "explanation": "Morning myoclonic jerks and generalized convulsions in adolescence are characteristic. Why not the others: A. Self-limited epilepsy with centrotemporal spikes — This is a childhood focal epilepsy with oropharyngeal semiology.; B. Epilepsy with autonomic seizures — Autonomic seizures feature emesis and pallor rather than morning myoclonus.; D. Childhood absence epilepsy — Typical absences dominate rather than morning myoclonic jerks.", "pearl": "Morning myoclonic jerks and generalized convulsions in adolescence are characteristic.", "srcAnswer": "C"}, {"num": 10, "level": "", "question": "During an event, a child shows unilateral rhythmic jerks progressing to bilateral convulsions. Which description best preserves the onset information?", "options": ["Focal to bilateral tonic-clonic seizure", "Generalized tonic-clonic seizure without qualification", "Non-epileptic paroxysmal event", "Unknown-onset tonic-clonic seizure"], "answer": 0, "explanation": "Focal onset followed by bilateral tonic-clonic activity is the relevant evolution. Why not the others: B. Generalized tonic-clonic seizure without qualification — This loses the observed focal onset.; C. Non-epileptic paroxysmal event — The evolution and motor pattern are compatible with epileptic seizure.; D. Unknown-onset tonic-clonic seizure — Onset was witnessed as focal, not unknown.", "pearl": "Focal onset followed by bilateral tonic-clonic activity is the relevant evolution.", "srcAnswer": "A"}, {"num": 11, "level": "", "question": "A child has vomiting, pallor, eye deviation and prolonged altered responsiveness, with otherwise normal development. Which epilepsy syndrome is most compatible?", "options": ["Typical childhood absence epilepsy", "Self-limited epilepsy with autonomic seizures", "Epilepsy with eyelid myoclonia", "Juvenile myoclonic epilepsy"], "answer": 1, "explanation": "Autonomic symptoms, especially vomiting, are prominent in this childhood focal syndrome. Why not the others: A. Typical childhood absence epilepsy — Typical absences are short and lack prominent prolonged emesis.; C. Epilepsy with eyelid myoclonia — Eye closure and eyelid jerks, not prolonged vomiting, dominate.; D. Juvenile myoclonic epilepsy — Myoclonus on awakening is more characteristic.", "pearl": "Autonomic symptoms, especially vomiting, are prominent in this childhood focal syndrome.", "srcAnswer": "B"}, {"num": 12, "level": "", "question": "A toddler has developmental regression and recurrent brief falls from sudden loss of axial tone. Which seizure type best describes the falls?", "options": ["Focal sensory seizures", "Atonic seizures", "Absence seizures", "Myoclonic seizures"], "answer": 1, "explanation": "Sudden loss of postural tone can cause drop attacks. Why not the others: A. Focal sensory seizures — Sensory symptoms alone do not cause generalized loss of postural tone.; C. Absence seizures — Typical absence usually causes behavioral arrest without abrupt collapse.; D. Myoclonic seizures — Brief positive muscle contraction differs from sudden loss of tone.", "pearl": "Sudden loss of postural tone can cause drop attacks.", "srcAnswer": "B"}, {"num": 13, "level": "", "question": "A child has recurrent stereotyped attacks but routine EEG between events is normal. What is the best interpretation?", "options": ["Epilepsy is excluded if routine EEG is normal", "All episodes must be psychogenic", "MRI must show a lesion to diagnose epilepsy", "A normal interictal EEG does not exclude epilepsy"], "answer": 3, "explanation": "Interictal epileptiform discharges may be absent during a short routine study. Why not the others: A. Epilepsy is excluded if routine EEG is normal — Clinical diagnosis cannot be ruled out by one normal tracing.; B. All episodes must be psychogenic — A normal interictal EEG does not establish a functional event.; C. MRI must show a lesion to diagnose epilepsy — Many epilepsy syndromes have normal structural imaging.", "pearl": "Interictal epileptiform discharges may be absent during a short routine study.", "srcAnswer": "D"}, {"num": 14, "level": "", "question": "A 4-year-old has a febrile convulsion and returns to baseline. Which accompanying finding would most strongly require investigation beyond a typical simple febrile seizure?", "options": ["Persistent unilateral weakness after the postictal period", "A brief generalized convulsion lasting 2 minutes", "Rapid recovery to normal interaction", "One convulsion during a single febrile illness"], "answer": 0, "explanation": "A lasting focal deficit suggests another acute neurological cause. Why not the others: B. A brief generalized convulsion lasting 2 minutes — A short generalized seizure is compatible with a simple febrile seizure.; C. Rapid recovery to normal interaction — Return to baseline is reassuring rather than concerning.; D. One convulsion during a single febrile illness — Single occurrence within 24 hours is compatible with simple febrile seizure.", "pearl": "A lasting focal deficit suggests another acute neurological cause.", "srcAnswer": "A"}, {"num": 15, "level": "", "question": "A child with developmental regression has multifocal seizures and abnormal MRI. Which is the most defensible diagnostic strategy?", "options": ["Treat MRI abnormalities as nonspecific findings", "Classify from EEG without clinical correlation", "Integrate electroclinical phenotype, developmental course, MRI and targeted genetics", "Assign a genetic etiology from age of onset"], "answer": 2, "explanation": "Syndromic classification and etiology together guide treatment and prognosis. Why not the others: A. Treat MRI abnormalities as nonspecific findings — Early onset does not establish a genetic cause.; B. Classify from EEG without clinical correlation — Structural findings may be etiologically important.; D. Assign a genetic etiology from age of onset — EEG patterns require clinical and developmental correlation.", "pearl": "Syndromic classification and etiology together guide treatment and prognosis.", "srcAnswer": "C"}, {"num": 16, "level": "", "question": "A 9-year-old has repetitive blinking with a premonitory urge and transient suppression, without altered consciousness. Which clue favors a tic over an epileptic event?", "options": ["Premonitory urge with temporary suppressibility", "Brief stereotyped recurrence during wakefulness", "Short episodes without loss of posture", "Recurrent episodes during school-age years"], "answer": 0, "explanation": "These are typical clinical features of tics. Why not the others: B. Brief stereotyped recurrence during wakefulness — Both tics and seizures can be stereotyped.; C. Short episodes without loss of posture — Both conditions may produce brief events.; D. Recurrent episodes during school-age years — Age alone is not discriminatory.", "pearl": "These are typical clinical features of tics.", "srcAnswer": "A"}, {"num": 17, "level": "", "question": "A 12-year-old with known focal epilepsy has 25 minutes of unilateral weakness immediately after a witnessed focal-to-bilateral tonic-clonic seizure, then complete resolution. Most likely mechanism?", "options": ["Todd paresis", "Transient ischemic attack", "Functional neurologic weakness", "Hemiplegic migraine"], "answer": 0, "explanation": "A transient postictal focal motor deficit is characteristic, although acute stroke remains an important differential. Why not the others: B. Transient ischemic attack — Can produce reversible weakness, but the witnessed focal seizure and postictal timing favor Todd paresis.; C. Functional neurologic weakness — Can mimic weakness but is less directly supported by this stereotyped postictal course.; D. Hemiplegic migraine — May cause reversible weakness but the immediate postconvulsive sequence favors Todd paresis.", "pearl": "A transient postictal focal motor deficit is characteristic, although acute stroke remains an important differential.", "srcAnswer": "A"}, {"num": 18, "level": "", "question": "At what seizure duration should a generalized convulsive seizure be managed as convulsive status epilepticus in current emergency guidance?", "options": ["Twenty minutes", "Thirty minutes", "Ten minutes", "Five minutes"], "answer": 3, "explanation": "NICE recommends emergency treatment for convulsive seizures lasting 5 minutes or longer. Why not the others: A. Twenty minutes — This is too late for initial emergency intervention.; B. Thirty minutes — Historical thresholds do not guide timely treatment initiation.; C. Ten minutes — Waiting until 10 minutes risks treatment delay.", "pearl": "NICE recommends emergency treatment for convulsive seizures lasting 5 minutes or longer.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day28',label:'Day 28',set:'Quiz 1',href:'Day28/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day28_QuizSet1_Q1-18_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 28 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–18</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 28 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 28'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 28');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day28:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
