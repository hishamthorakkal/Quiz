temperature in mild HIE — It can, but benefit is unproven.; B. Mild HIE always progresses to severe HIE — False.; C. Mild HIE never has developmental risk — Some infants do have later difficulties.", "pearl": "Risk is not the same as proven treatment benefit.", "srcAnswer": "D"}, {"num": 19, "level": "Conceptual", "question": "Why is hyperthermia actively avoided after HIE?", "options": ["It is required for EEG seizure detection", "It prevents bilirubin conjugation", "Higher temperature can amplify metabolic demand and secondary brain injury", "It improves cerebral oxygen extraction"], "answer": 2, "explanation": "Important supportive neuroprotection principle. Why not the others: A. It is required for EEG seizure detection — False.; B. It prevents bilirubin conjugation — Not the main issue.; D. It improves cerebral oxygen extraction — Not a therapeutic goal in HIE.", "pearl": "Even non-cooled HIE infants should avoid fever.", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "Why should neonatal seizure treatment include correction of glucose/electrolytes even when ASM is given?", "options": ["Phenobarbital permanently corrects hypoglycemia", "Metabolic abnormalities are unrelated to neonatal seizures", "Electrolytes matter only in older children", "A reversible metabolic trigger can continue generating seizures despite antiseizure medication"], "answer": 3, "explanation": "Tests comprehensive acute management. Why not the others: A. Phenobarbital permanently corrects hypoglycemia — It does not.; B. Metabolic abnormalities are unrelated to neonatal seizures — They are common reversible causes.; C. Electrolytes matter only in older children — False.", "pearl": "Treat cause and seizure in parallel.", "srcAnswer": "D"}, {"num": 21, "level": "Clinical/Application", "question": "38 wk, 2 h old; cord pH 6.90, BD 19; lethargic, hypotonic, weak suck. Best next step?", "options": ["Warm to 38°C", "Observe until a seizure occurs", "Wait for MRI", "Initiate therapeutic-hypothermia pathway now"], "answer": 3, "explanation": "Tests rapid recognition and sequencing. Why not the others: A. Warm to 38°C — Hyperthermia should be avoided.; B. Observe until a seizure occurs — Moderate encephalopathy already satisfies neurologic severity.; C. Wait for MRI — Delay risks losing the 6-h window.", "pearl": "This is a classic cooling candidate.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical/Application", "question": "39 wk infant after shoulder dystocia has Apgar 3/7, cord pH 7.24 and normal neurologic exam at 2 h. Best interpretation?", "options": ["Low Apgar alone does not establish HIE or cooling eligibility", "Cool automatically for 72 h", "Give phenobarbital prophylactically", "Diagnose severe HIE"], "answer": 0, "explanation": "Prevents overtreatment. Why not the others: B. Cool automatically for 72 h — No moderate/severe encephalopathy or strong biochemical evidence.; C. Give phenobarbital prophylactically — No seizures.; D. Diagnose severe HIE — Neurologic exam is normal.", "pearl": "Do not equate resuscitation with HIE.", "srcAnswer": "A"}, {"num": 23, "level": "Clinical/Application • Close-Distractor", "question": "35+3 wk infant with uterine rupture, pH 6.92 and moderate encephalopathy at 1 h. Best approach?", "options": ["Delay decision until 12 h", "Urgent expert assessment and individualized cooling discussion because evidence at 35+0–35+6 wk is limited", "Never cool any infant under 36 wk", "Routine cooling exactly as ≥36 wk without discussion"], "answer": 1, "explanation": "Tests 2026 nuance. Why not the others: A. Delay decision until 12 h — Time-sensitive decision.; C. Never cool any infant under 36 wk — Current AAP allows individualized consideration at 35–35+6.; D. Routine cooling exactly as ≥36 wk without discussion — Evidence base is weaker and requires nuance.", "pearl": "Current guidance changed the old binary cutoff.", "srcAnswer": "B"}, {"num": 24, "level": "Clinical/Application", "question": "34+4 wk infant with moderate encephalopathy after abruption. Best statement?", "options": ["Cooling benefit is proven equal to term infants", "Cooling is mandatory", "Only head cooling is recommended", "Routine therapeutic hypothermia is not recommended at <35 weeks"], "answer": 3, "explanation": "Avoids therapeutic creep. Why not the others: A. Cooling benefit is proven equal to term infants — False.; B. Cooling is mandatory — Not recommended below 35 weeks by current AAP report.; C. Only head cooling is recommended — No evidence-based exception.", "pearl": "Know the lower gestational boundary.", "srcAnswer": "D"}, {"num": 25, "level": "Clinical/Application", "question": "Cooled infant at 33.5°C has HR 78, MAP appropriate, warm extremities, lactate improving. Best action?", "options": ["Continue cooling and monitor perfusion", "Give adenosine", "Give atropine immediately", "Stop cooling permanently"], "answer": 0, "explanation": "Tests cooling physiology. Why not the others: B. Give adenosine — Not an SVT.; C. Give atropine immediately — Expected sinus bradycardia with stable perfusion does not require atropine.; D. Stop cooling permanently — No evidence of hemodynamic intolerance.", "pearl": "Perfusion outranks isolated HR.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "At 72 h of cooling, infant is stable. Correct next step?", "options": ["Keep cooled for 120 h routinely", "Stop EEG before rewarming", "Rewarm gradually at about 0.5°C/h while continuing EEG and hemodynamic monitoring", "Warm rapidly to 37°C in 30 min"], "answer": 2, "explanation": "Tests protocol completion. Why not the others: A. Keep cooled for 120 h routinely — Longer cooling is not standard and may be harmful.; B. Stop EEG before rewarming — Seizures may recur during rewarming.; D. Warm rapidly to 37°C in 30 min — Too fast.", "pearl": "Rewarming is monitored therapy.", "srcAnswer": "C"}, {"num": 27, "level": "Clinical/Application", "question": "Term infant has rhythmic right arm jerking with eye deviation that persists despite holding the limb. Best next diagnostic test?", "options": ["Serum bilirubin only", "aEEG alone as definitive test", "No test; this is jitteriness", "Continuous conventional EEG"], "answer": 3, "explanation": "Distinguishes seizure from jitteriness. Why not the others: A. Serum bilirubin only — Does not diagnose seizure.; B. aEEG alone as definitive test — Useful adjunct but conventional EEG is gold standard.; C. No test; this is jitteriness — Persistence with restraint and eye deviation favor seizure.", "pearl": "Semiology should trigger EEG confirmation.", "srcAnswer": "D"}, {"num": 28, "level": "Clinical/Application", "question": "Newborn has stimulus-sensitive tremor that stops with limb flexion; glucose 32 mg/dL. Best next step?", "options": ["Fosphenytoin immediately", "Correct hypoglycemia and reassess", "Therapeutic hypothermia", "Phenobarbital load first"], "answer": 1, "explanation": "Avoids unnecessary ASM. Why not the others: A. Fosphenytoin immediately — No confirmed seizure.; C. Therapeutic hypothermia — No HIE data.; D. Phenobarbital load first — Likely jitteriness from hypoglycemia.", "pearl": "Metabolic mimics are common.", "srcAnswer": "B"}, {"num": 29, "level": "Clinical/Application", "question": "HIE infant receives phenobarbital; clonic movements stop but EEG shows recurrent electrographic seizures. Best action?", "options": ["Ignore because there are no movements", "Stop EEG", "Escalate seizure treatment guided by EEG", "Declare seizure freedom"], "answer": 2, "explanation": "Tests EEG-guided treatment. Why not the others: A. Ignore because there are no movements — Electroclinical dissociation is clinically important.; B. Stop EEG — Would miss ongoing burden.; D. Declare seizure freedom — Electrographic seizures persist.", "pearl": "Clinical silence can hide ongoing seizures.", "srcAnswer": "C"}, {"num": 30, "level": "Clinical/Application", "question": "Term infant with HIE has a confirmed electrographic seizure. Best initial ASM?", "options": ["Carbamazepine orally", "Phenobarbital 20 mg/kg IV", "Levetiracetam 60 mg/kg as obligatory first-line", "No ASM because cooling treats all seizures"], "answer": 1, "explanation": "Core neonatal seizure treatment. Why not the others: A. Carbamazepine orally — Not standard acute first-line.; C. Levetiracetam 60 mg/kg as obligatory first-line — ILAE still favors phenobarbital first-line.; D. No ASM because cooling treats all seizures — Cooling does not reliably terminate seizures.", "pearl": "Phenobarbital remains first-line.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day7',label:'Day 7',set:'Quiz 2',href:'Day7/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day7_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 7 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){

 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 7'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 7');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day7:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
