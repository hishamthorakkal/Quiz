const quiz=[{"num": 61, "level": "High-Difficulty", "question": "Infant has brief recurrent seizures from hypocalcemia that stop after calcium correction. Best long-term ASM plan?", "options": ["Continue phenobarbital for 1 year in all cases", "Start carbamazepine lifelong", "Do not continue ASM automatically once acute provoked seizures have resolved and epilepsy is not suspected", "No need to correct calcium"], "answer": 2, "explanation": "Tests stewardship. Why not the others: A. Continue phenobarbital for 1 year in all cases — Not recommended.; B. Start carbamazepine lifelong — No indication.; D. No need to correct calcium — Cause treatment is essential.", "pearl": "Cause-directed care can avoid unnecessary exposure.", "srcAnswer": "C"}, {"num": 62, "level": "High-Difficulty • Close-Distractor", "question": "A term infant with HIE has a normal aEEG but intermittent focal facial twitching. Best next step?", "options": ["Give no further evaluation", "Diagnose jitteriness based on aEEG", "Obtain/continue conventional EEG because limited-channel aEEG can miss focal seizures", "Exclude seizures completely"], "answer": 2, "explanation": "Tests sensitivity limitation. Why not the others: A. Give no further evaluation — Inappropriate.; B. Diagnose jitteriness based on aEEG — Clinical event is focal facial twitching, not classic jitter.; D. Exclude seizures completely — aEEG is not fully sensitive.", "pearl": "Normal aEEG does not rule out focal seizures.", "srcAnswer": "C"}, {"num": 63, "level": "High-Difficulty", "question": "Which cooling modification has NOT shown improved outcomes and may increase harm?", "options": ["Deeper cooling to about 32°C or extending routine cooling to 120 h", "Slow rewarming", "Starting within 6 h", "Maintaining 33.5°C for 72 h"], "answer": 0, "explanation": "Prevents protocol drift. Why not the others: B. Slow rewarming — Evidence-based.; C. Starting within 6 h — Evidence-based.; D. Maintaining 33.5°C for 72 h — Evidence-based.", "pearl": "More intensive cooling is not better.", "srcAnswer": "A"}, {"num": 64, "level": "High-Difficulty", "question": "A 36+2-wk infant at 5.5 h has moderate encephalopathy but transfer to cooling center will take 2 h. Best systems-level action?", "options": ["Begin protocolized monitored cooling/transport pathway without delaying transfer, preferably servo-controlled when feasible", "Use ice packs directly on skin", "Cancel transfer if passive cooling started", "Wait until arrival to start any cooling"], "answer": 0, "explanation": "Tests time-critical systems thinking. Why not the others: B. Use ice packs directly on skin — Risk of overcooling/cold injury.; C. Cancel transfer if passive cooling started — Needs specialized center care.; D. Wait until arrival to start any cooling — May lose optimal window.", "pearl": "Transport planning is part of neuroprotection.", "srcAnswer": "A"}, {"num": 65, "level": "High-Difficulty", "question": "After rewarming, temperature rises to 38.2°C. Best principle?", "options": ["Ignore because cooling course is complete", "Actively prevent/treat hyperthermia because fever can exacerbate secondary brain injury", "Re-cool to 30°C for 24 h", "Fever is therapeutic rebound"], "answer": 1, "explanation": "Tests post-TH care. Why not the others: A. Ignore because cooling course is complete — Hyperthermia remains harmful.; C. Re-cool to 30°C for 24 h — Not evidence-based.; D. Fever is therapeutic rebound — No.", "pearl": "Neuroprotection continues after cooling.", "srcAnswer": "B"}, {"num": 66, "level": "High-Difficulty", "question": "Infant’s early EEG is severely suppressed but normalizes by 48 h; MRI shows mild watershed injury. Which counseling is most appropriate?", "options": ["Severe disability is inevitable because early EEG was suppressed", "Follow-up is unnecessary if MRI is mild", "Normal outcome is guaranteed", "Trajectory is encouraging, but outcome prediction remains probabilistic and requires developmental follow-up"], "answer": 3, "explanation": "Tests counseling maturity. Why not the others: A. Severe disability is inevitable because early EEG was suppressed — Serial recovery matters.; B. Follow-up is unnecessary if MRI is mild — All HIE/TH infants need follow-up.; C. Normal outcome is guaranteed — Too certain.", "pearl": "Serial evolution changes prognosis.", "srcAnswer": "D"}, {"num": 67, "level": "High-Difficulty", "question": "Which factor can falsely worsen the apparent neurologic examination during TH?", "options": ["Improving perfusion", "Return of sleep-wake cycling", "Normal glucose", "Sedative/antiseizure medication accumulation"], "answer": 3, "explanation": "Tests confounder recognition. Why not the others: A. Improving perfusion — Should not falsely worsen exam.; B. Return of sleep-wake cycling — Usually favorable.; C. Normal glucose — Not a confounder toward worse exam.", "pearl": "Drug accumulation is common when clearance falls.", "srcAnswer": "D"}, {"num": 68, "level": "Integrated/Rank-Differentiating • Close-Distractor", "question": "39 wk infant after abruption: pH 6.89, BD 20, ventilated 15 min; at 2 h moderate encephalopathy and electrographic seizures. Best complete management bundle?", "options": ["Start TH now + continuous EEG + phenobarbital for seizures + multiorgan supportive monitoring", "Phenobarbital only; defer cooling until seizures stop", "MRI first, then decide cooling", "Cooling alone; seizures need no treatment"], "answer": 0, "explanation": "Integrated next-best-step. Why not the others: B. Phenobarbital only; defer cooling until seizures stop — Cooling is time-critical and should proceed in parallel.; C. MRI first, then decide cooling — Delays neuroprotection.; D. Cooling alone; seizures need no treatment — Seizure burden requires treatment.", "pearl": "Neuroprotection, seizure control and organ support occur simultaneously.", "srcAnswer": "A"}, {"num": 69, "level": "Integrated/Rank-Differentiating • Close-Distractor", "question": "38 wk infant at 4 h meets cooling criteria. aEEG is normal, conventional EEG not yet available. Best decision?", "options": ["Normal aEEG excludes HIE", "Cool only if MRI abnormal", "Do not withhold cooling solely because aEEG is normal if clinical/biochemical criteria are met", "Wait for seizures to appear"], "answer": 2, "explanation": "Prevents overreliance on aEEG. Why not the others: A. Normal aEEG excludes HIE — False.; B. Cool only if MRI abnormal — MRI is not an entry requirement.; D. Wait for seizures to appear — Would delay therapy.", "pearl": "Neurologic exam/criteria outweigh a normal screening trend.", "srcAnswer": "C"}, {"num": 70, "level": "Integrated/Rank-Differentiating", "question": "Cooled infant at 24 h develops focal seizures, asymmetric exam and MRI shows left MCA infarct plus mild watershed injury. Best interpretation?", "options": ["Ignore focality because HIE explains all seizures", "Stroke can coexist with perinatal hypoxic-ischemic stress; treat seizures and individualize prognosis to both injuries", "Continue cooling solely to treat stroke", "MRI disproves HIE completely"], "answer": 1, "explanation": "Advanced integration. Why not the others: A. Ignore focality because HIE explains all seizures — Focal stroke changes diagnosis/prognosis.; C. Continue cooling solely to treat stroke — TH is for HIE protocol, not isolated stroke.; D. MRI disproves HIE completely — Coexisting pathology is possible.", "pearl": "Multiple pathologies can coexist.", "srcAnswer": "B"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "During rewarming, infant develops hypotension, rising lactate and recurrent electrographic seizures. Best response?", "options": ["Stop EEG and obtain MRI immediately", "Treat seizures only", "Continue rapid rewarming regardless", "Slow/temporarily pause rewarming as clinically appropriate, stabilize hemodynamics, treat seizures and reassess metabolic/electrolyte status"], "answer": 3, "explanation": "Tests dynamic protocol management. Why not the others: A. Stop EEG and obtain MRI immediately — Acute stabilization comes first.; B. Treat seizures only — Hemodynamics and metabolic factors also need correction.; C. Continue rapid rewarming regardless — Could worsen instability.", "pearl": "Rewarming complications demand integrated physiologic management.", "srcAnswer": "D"}, {"num": 72, "level": "Integrated/Rank-Differentiating • Close-Distractor", "question": "Term infant with encephalopathy, pH 7.25, fever, maternal chorioamnionitis and CSF pleocytosis. Best approach?", "options": ["Give phenobarbital only", "Treat suspected infection/meningoencephalitis urgently; HIE/cooling eligibility should not be assumed without supporting hypoxic-ischemic criteria", "Cool automatically because encephalopathy is moderate", "Ignore infection because HIE is more common"], "answer": 1, "explanation": "Differential integration. Why not the others: A. Give phenobarbital only — Does not treat infection.; C. Cool automatically because encephalopathy is moderate — Etiology is uncertain and infection strongly supported.; D. Ignore infection because HIE is more common — Dangerous anchoring.", "pearl": "The syndrome “encephalopathy” demands etiologic reasoning.", "srcAnswer": "B"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "After phenobarbital, no clinical seizures are visible. aEEG seems improved but raw EEG shows 8 electrographic seizures/hour. MRI later shows BGT injury. Best interpretation?", "options": ["Persistent electrographic seizure burden remains clinically important despite improved bedside appearance/aEEG trend", "BGT injury proves seizures are artifact", "aEEG always overrides raw EEG", "No further ASM is needed because movements stopped"], "answer": 0, "explanation": "EEG + MRI integration. Why not the others: B. BGT injury proves seizures are artifact — MRI does not invalidate EEG.; C. aEEG always overrides raw EEG — Opposite; raw/conventional EEG is more definitive.; D. No further ASM is needed because movements stopped — Electroclinical dissociation.", "pearl": "Use the highest-resolution data source for seizure control.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated/Rank-Differentiating • Close-Distractor", "question": "35+5 wk infant at 7 h was missed initially; now moderate HIE, stable organs. Best current-guidance discussion?", "options": ["No neurologic monitoring is needed if cooling is not done", "Both gestational age and delayed presentation fall into lower-certainty zones; consider TH only after expert multidisciplinary and parental risk-benefit discussion", "Cooling is absolutely prohibited", "Standard routine cooling with proven benefit"], "answer": 1, "explanation": "High-level guideline nuance. Why not the others: A. No neurologic monitoring is needed if cooling is not done — Monitoring remains essential.; C. Cooling is absolutely prohibited — AAP allows consideration at 35+0–35+6 and 6–24 h in selected cases.; D. Standard routine cooling with proven benefit — Evidence is less certain on both dimensions.", "pearl": "Two gray zones compound uncertainty.", "srcAnswer": "B"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "Cooled infant has no seizures after 36 h, EEG background recovers, MRI shows mild watershed injury, feeding improves. What is the best discharge strategy?", "options": ["Start prophylactic levetiracetam after stopping phenobarbital", "Consider stopping ASM if acute provoked seizures are resolved and epilepsy is not suspected, plus structured neurodevelopmental follow-up", "No follow-up because MRI is mild", "Continue phenobarbital for 12 months automatically"], "answer": 1, "explanation": "Integrates acute treatment with long-term care. Why not the others: A. Start prophylactic levetiracetam after stopping phenobarbital — No indication.; C. No follow-up because MRI is mild — HIE survivors require surveillance.; D. Continue phenobarbital for 12 months automatically — Unnecessary exposure in many acute provoked cases.", "pearl": "De-escalation and follow-up are both evidence-based.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day7',label:'Day 7',set:'Quiz 5',href:'Day7/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day7_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 7 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 7'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 7');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day7:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
