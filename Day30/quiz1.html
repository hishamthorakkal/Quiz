@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
const quiz=[{"num": 1, "level": "Basic", "question": "A 4-year-old has periorbital edema, first-morning urine protein/creatinine 3.6 g/g and albumin 2.1 g/dL. Which diagnostic interpretation is most accurate?", "options": ["Isolated orthostatic proteinuria is most likely", "Nephrotic syndrome is established by nephrotic-range proteinuria with hypoalbuminemia", "Nephritic syndrome is established by proteinuria alone", "Nephrotic syndrome requires a 24-hour urine collection"], "answer": 1, "explanation": "uPCR ≥2 g/g and albumin <3 g/dL meet KDIGO 2025 criteria. Why not the others: A. Isolated orthostatic proteinuria is most likely — Orthostatic proteinuria disappears in the first-morning specimen.; C. Nephritic syndrome is established by proteinuria alone — Nephritic syndrome requires a glomerular inflammatory phenotype, usually hematuria and hypertension.; D. Nephrotic syndrome requires a 24-hour urine collection — Spot first-morning uPCR is accepted and 24-hour collection is unnecessary.", "pearl": "", "srcAnswer": "B"}, {"num": 2, "level": "Conceptual", "question": "A child has first-morning uPCR 1.7 g/g, serum albumin 2.2 g/dL and edema. Which interpretation best follows the KDIGO 2025 protein threshold?", "options": ["Proteinuria is below the KDIGO nephrotic-range cutoff and requires reassessment", "Normal albumin is required for nephrotic syndrome", "A first-morning uPCR cannot be used for diagnosis", "The urine ratio alone confirms nephrotic-range proteinuria"], "answer": 0, "explanation": "The nephrotic-range uPCR cutoff is ≥2 g/g; low albumin does not replace quantification. Why not the others: B. Normal albumin is required for nephrotic syndrome — Hypoalbuminemia is characteristic, not exclusionary.; C. A first-morning uPCR cannot be used for diagnosis — First-morning uPCR is preferred to exclude orthostatic proteinuria.; D. The urine ratio alone confirms nephrotic-range proteinuria — 1.7 g/g is below the specified ≥2 g/g threshold.", "pearl": "", "srcAnswer": "A"}, {"num": 3, "level": "Conceptual", "question": "A typical 3-year-old with first-onset steroid-sensitive nephrotic syndrome undergoes biopsy for another reason. Which finding best fits minimal change disease?", "options": ["Subepithelial humps with diffuse endocapillary proliferation", "Diffuse podocyte foot-process effacement on electron microscopy", "Linear IgG deposition along glomerular capillaries", "Dominant mesangial IgA immune deposits"], "answer": 1, "explanation": "Minimal change disease shows podocyte effacement with near-normal light microscopy. Why not the others: A. Subepithelial humps with diffuse endocapillary proliferation — Humps and exudative GN favor postinfectious GN.; C. Linear IgG deposition along glomerular capillaries — Linear IgG supports anti-GBM disease.; D. Dominant mesangial IgA immune deposits — Mesangial IgA supports IgA nephropathy.", "pearl": "", "srcAnswer": "B"}, {"num": 4, "level": "Conceptual", "question": "A 10-year-old has nephrotic syndrome and persistent steroid resistance. Biopsy shows sclerosis involving segments of some glomeruli. Which lesion is described?", "options": ["Minimal change podocytopathy", "Diffuse endocapillary proliferative glomerulonephritis", "Diffuse global glomerulosclerosis", "Focal segmental glomerulosclerosis"], "answer": 3, "explanation": "Focal refers to some glomeruli; segmental refers to part of the tuft. Why not the others: A. Minimal change podocytopathy — Minimal change does not show segmental sclerosis on light microscopy.; B. Diffuse endocapillary proliferative glomerulonephritis — That describes an inflammatory rather than segmental sclerosing lesion.; C. Diffuse global glomerulosclerosis — Diffuse/global means all or nearly all glomeruli and the entire tuft.", "pearl": "", "srcAnswer": "D"}, {"num": 5, "level": "Conceptual", "question": "A child with heavy proteinuria has edema despite low effective arterial volume. Which mechanism is most compatible with the underfill model?", "options": ["Increased oncotic pressure drives fluid into interstitium", "Reduced plasma oncotic pressure promotes interstitial fluid shift and RAAS activation", "Glomerular hematuria directly increases plasma oncotic pressure", "Primary renal sodium excretion produces volume contraction without edema"], "answer": 1, "explanation": "Hypoalbuminemia can reduce oncotic pressure and stimulate sodium retention via underfilling. Why not the others: A. Increased oncotic pressure drives fluid into interstitium — Higher oncotic pressure favors intravascular retention.; C. Glomerular hematuria directly increases plasma oncotic pressure — Hematuria does not restore albumin-dependent oncotic pressure.; D. Primary renal sodium excretion produces volume contraction without edema — Sodium loss does not explain edema with sodium retention.", "pearl": "", "srcAnswer": "B"}, {"num": 6, "level": "Clinical", "question": "A child with nephrotic edema is hypertensive, has warm extremities and no clinical hypoperfusion. Which edema mechanism is plausible?", "options": ["Reduced oncotic pressure with secondary RAAS activation", "Increased sodium retention from reduced cardiac output", "Primary tubular sodium retention with relative intravascular expansion", "Predominant sodium retention after loss of effective arterial volume"], "answer": 2, "explanation": "The overfill phenotype features intrinsic renal sodium retention. Why not the others: A. Reduced oncotic pressure with secondary RAAS activation — This underfill mechanism is plausible in nephrosis, but the stable hypertensive phenotype favors primary renal sodium retention.; B. Increased sodium retention from reduced cardiac output — There is no evidence of cardiac dysfunction to make this the leading mechanism.; D. Predominant sodium retention after loss of effective arterial volume — Underfill can occur, but warm perfused hypertensive edema favors overfill in this stem.", "pearl": "", "srcAnswer": "C"}, {"num": 7, "level": "Basic", "question": "After initial remission, urine dipsticks become 3+ on three consecutive mornings. Which event has occurred?", "options": ["Steroid resistance is already established", "Relapse of nephrotic syndrome", "Sustained complete remission", "Steroid dependence is already established"], "answer": 1, "explanation": "Recurrent nephrotic-range proteinuria after remission meets relapse criteria. Why not the others: A. Steroid resistance is already established — Steroid resistance is based on failure to remit after adequate therapy.; C. Sustained complete remission — 3+ on three days is not negative/trace proteinuria.; D. Steroid dependence is already established — Steroid dependence requires relation to steroid exposure and consecutive relapses.", "pearl": "", "srcAnswer": "B"}, {"num": 8, "level": "Basic", "question": "A child treated for first-episode nephrotic syndrome has negative/trace urine protein for three consecutive mornings. Which response is demonstrated?", "options": ["Partial remission with persistent low-grade proteinuria", "Steroid-sensitive disease without established remission", "Complete remission", "Transient remission after one negative dipstick"], "answer": 2, "explanation": "Negative/trace proteinuria for ≥3 days meets the remission definition. Why not the others: A. Partial remission with persistent low-grade proteinuria — Partial remission requires proteinuria above the complete-remission range.; B. Steroid-sensitive disease without established remission — Negative/trace protein for three days already documents complete remission.; D. Transient remission after one negative dipstick — Three consecutive negative/trace days meet the complete remission definition.", "pearl": "", "srcAnswer": "C"}, {"num": 9, "level": "Basic", "question": "A child reaches complete remission by day 21 of standard daily prednisolone. Under KDIGO 2025, which response category fits?", "options": ["Steroid-dependent nephrotic syndrome", "Steroid-resistant nephrotic syndrome", "Frequently relapsing nephrotic syndrome", "Steroid-sensitive nephrotic syndrome"], "answer": 3, "explanation": "Remission within four weeks defines steroid sensitivity. Why not the others: A. Steroid-dependent nephrotic syndrome — Dependence requires relapses linked to steroid taper or cessation.; B. Steroid-resistant nephrotic syndrome — SRNS is lack of remission after four weeks of standard treatment.; C. Frequently relapsing nephrotic syndrome — Frequency requires a longitudinal relapse history.", "pearl": "", "srcAnswer": "D"}, {"num": 10, "level": "Clinical", "question": "A child remains nephrotic after four weeks of adequate daily prednisolone. Which KDIGO 2025 interpretation is most accurate?", "options": ["Secondary steroid resistance despite no earlier remission", "Meets the four-week SRNS definition; initiate specialist confirmation and evaluation", "Delay classification until the 12-week course is complete", "Classify as steroid dependent on day 28"], "answer": 1, "explanation": "KDIGO 2025 defines SRNS at four weeks, with a 4–6-week confirmation window for partial responders. Why not the others: A. Secondary steroid resistance despite no earlier remission — Secondary resistance requires a prior steroid-sensitive episode.; C. Delay classification until the 12-week course is complete — KDIGO 2025 defines resistance at four weeks, with confirmation pathways for partial responders.; D. Classify as steroid dependent on day 28 — Dependence requires repeated relapses related to steroid exposure, not primary nonresponse.", "pearl": "", "srcAnswer": "B"}, {"num": 11, "level": "Clinical", "question": "Two consecutive relapses occur during alternate-day prednisolone taper or within 14 days of stopping it. What pattern is most appropriate?", "options": ["Congenital nephrotic syndrome", "Steroid-dependent nephrotic syndrome", "Infrequently relapsing nephrotic syndrome", "Steroid-resistant nephrotic syndrome"], "answer": 1, "explanation": "The temporal pattern of two consecutive relapses during/within 14 days of therapy meets dependence criteria. Why not the others: A. Congenital nephrotic syndrome — Congenital refers to onset in the first three months of life.; C. Infrequently relapsing nephrotic syndrome — This is dependence regardless of whether annual count is low.; D. Steroid-resistant nephrotic syndrome — Both episodes remitted, so resistance is not established.", "pearl": "", "srcAnswer": "B"}, {"num": 12, "level": "Conceptual", "question": "A child has two relapses within six months after remission of the first episode. What is the KDIGO 2025 category?", "options": ["Infrequently relapsing nephrotic syndrome", "Steroid resistance by definition", "Secondary nephrotic syndrome by definition", "Frequently relapsing nephrotic syndrome"], "answer": 3, "explanation": "At least two relapses in six months after initial remission meets frequent relapse definition. Why not the others: A. Infrequently relapsing nephrotic syndrome — Infrequent is fewer than two in this first six-month interval.; B. Steroid resistance by definition — Relapse frequency is independent of failure to remit with steroids.; C. Secondary nephrotic syndrome by definition — Secondary describes cause, not relapse count.", "pearl": "", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "A parent asks the best home strategy for recognizing relapse early. Which plan is recommended?", "options": ["Record first-morning urine protein dipsticks and symptoms", "Obtain daily serum albumin at home", "Track serum cholesterol alone each week", "Use weight alone without urine protein checks"], "answer": 0, "explanation": "Serial home dipstick monitoring detects remission and relapse trends. Why not the others: B. Obtain daily serum albumin at home — Home serum testing is impractical and not the recommended monitor.; C. Track serum cholesterol alone each week — Cholesterol is not a reliable immediate relapse marker.; D. Use weight alone without urine protein checks — Weight can change with edema but does not establish relapse.", "pearl": "", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "A 5-year-old has typical idiopathic nephrotic syndrome, normal blood pressure and kidney function, and no gross hematuria. What is the usual initial biopsy strategy?", "options": ["Treat and assess steroid response without routine biopsy", "Biopsy at onset to distinguish minimal change from FSGS", "Biopsy at onset because uPCR exceeds 2 g/g", "Biopsy after remission to document the histologic diagnosis"], "answer": 0, "explanation": "Typical first-episode childhood nephrotic syndrome does not require biopsy at presentation. Why not the others: B. Biopsy at onset to distinguish minimal change from FSGS — Routine biopsy is not recommended for typical first-episode childhood nephrosis.; C. Biopsy at onset because uPCR exceeds 2 g/g — Nephrotic-range proteinuria alone does not mandate a biopsy.; D. Biopsy after remission to document the histologic diagnosis — Remission by itself is not an indication for biopsy.", "pearl": "", "srcAnswer": "A"}, {"num": 15, "level": "Clinical", "question": "An infant presents with nephrotic syndrome at 7 months and sensorineural hearing loss. Which diagnostic strategy is most defensible?", "options": ["Defer all investigation until school age", "Treat as typical age-three minimal change disease without further assessment", "Use an isolated cholesterol measurement to determine etiology", "Early pediatric-nephrology referral with genetic evaluation and consideration of biopsy"], "answer": 3, "explanation": "Infantile onset and extrarenal features raise monogenic/syndromic podocytopathy probability. Why not the others: A. Defer all investigation until school age — Delay risks missing a genetic or progressive cause.; B. Treat as typical age-three minimal change disease without further assessment — Infantile and syndromic presentation is atypical.; C. Use an isolated cholesterol measurement to determine etiology — Cholesterol does not define the underlying glomerular cause.", "pearl": "", "srcAnswer": "D"}, {"num": 16, "level": "Clinical", "question": "Under the Indian Society of Pediatric Nephrology 2021 first-episode recommendation, which regimen is specified for typical SSNS?", "options": ["Alternate-day prednisolone for 12 weeks without daily induction", "Prednisolone daily for 6 weeks followed by alternate-day for 6 weeks", "Daily prednisolone for 12 weeks without an alternate-day phase", "Daily prednisolone for 4 weeks followed by alternate-day for 4 weeks as the sole Indian recommendation"], "answer": 1, "explanation": "Indian 2021 recommends 6+6 weeks; KDIGO 2025 permits either 4+4 or 6+6. Why not the others: A. Alternate-day prednisolone for 12 weeks without daily induction — Initial daily induction is recommended.; C. Daily prednisolone for 12 weeks without an alternate-day phase — This does not match the recommended phased course.; D. Daily prednisolone for 4 weeks followed by alternate-day for 4 weeks as the sole Indian recommendation — 4+4 is a KDIGO 2025 option, not the specific Indian 2021 recommendation.", "pearl": "", "srcAnswer": "B"}, {"num": 17, "level": "Clinical", "question": "A guideline comparison question explicitly asks for KDIGO 2025 accepted initial glucocorticoid durations. Which pair is correct?", "options": ["Eight weeks (4+4) or twelve weeks (6+6)", "Twelve weeks of daily therapy without alternate-day phase", "Six weeks (3+3) or ten weeks (5+5)", "Four or eight weeks of alternate-day treatment without daily induction"], "answer": 0, "explanation": "KDIGO 2025 accepts both regimens with daily then alternate-day phases. Why not the others: B. Twelve weeks of daily therapy without alternate-day phase — KDIGO recommends daily followed by alternate-day treatment.; C. Six weeks (3+3) or ten weeks (5+5) — Neither schedule is an accepted KDIGO 2025 first-episode option.; D. Four or eight weeks of alternate-day treatment without daily induction — Both accepted regimens begin with daily induction.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day30',label:'Day 30',set:'Quiz 1',href:'Day30/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day30_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 30 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 30 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 30'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 30');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day30:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=267c69f6"></script></body></html>
