@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 69, "level": "Integrated", "question": "A rapidly progressive GN patient has both ANCA and anti-GBM antibodies. What is the key treatment implication?", "options": ["Consider the anti-GBM overlap pathway including plasma exchange", "Start azathioprine maintenance without acute induction", "Use an isolated ANCA induction pathway without assessing anti-GBM therapy", "Defer treatment until repeat serology confirms persistence"], "answer": 0, "explanation": "KDIGO ANCA guidance supports adding plasma exchange in anti-GBM overlap. Why not the others: B. Start azathioprine maintenance without acute induction — Severe anti-GBM overlap needs urgent induction and often plasma exchange.; C. Use an isolated ANCA induction pathway without assessing anti-GBM therapy — Dual-positive disease requires consideration of anti-GBM-specific treatment.; D. Defer treatment until repeat serology confirms persistence — Delays can permit irreversible renal injury.", "pearl": "", "srcAnswer": "A"}, {"num": 70, "level": "Integrated", "question": "A child with nephritic AKI has serum C3 low for four months and biopsy with dominant C3 staining and scant immunoglobulin. What diagnosis needs focused evaluation?", "options": ["Minimal-change disease", "Anti-GBM disease with linear IgG", "C3 glomerulopathy due to alternative-pathway dysregulation", "Typical PSGN with expected complement normalization"], "answer": 2, "explanation": "Persistent low C3 with C3-dominant deposits suggests C3G rather than resolving PSGN. Why not the others: A. Minimal-change disease — Minimal change does not yield C3-dominant immune deposits.; B. Anti-GBM disease with linear IgG — Anti-GBM has linear IgG rather than dominant C3.; D. Typical PSGN with expected complement normalization — Four months of low C3 is atypical for uncomplicated PSGN.", "pearl": "", "srcAnswer": "C"}, {"num": 71, "level": "Integrated", "question": "A child with rapidly progressive GN is oliguric with potassium 7.0 mmol/L and ECG widening. Which action has priority?", "options": ["Repeat urine protein in one week before intervention", "Begin steroid-sparing maintenance therapy before cardiac stabilization", "Wait for kidney biopsy before treating potassium", "Immediate stabilization of hyperkalemia while arranging urgent renal support"], "answer": 3, "explanation": "Life-threatening hyperkalemia is an immediate emergency irrespective of GN subtype. Why not the others: A. Repeat urine protein in one week before intervention — Delayed evaluation is unsafe in ECG-changing hyperkalemia.; B. Begin steroid-sparing maintenance therapy before cardiac stabilization — Immunosuppression does not immediately stabilize arrhythmia risk.; C. Wait for kidney biopsy before treating potassium — Cardiac instability requires immediate treatment.", "pearl": "", "srcAnswer": "D"}, {"num": 72, "level": "Conceptual", "question": "A child has nephritic AKI, C3 low, C4 normal and no clear infection history. What diagnostic approach is best?", "options": ["Assume anti-GBM because C4 is normal", "Exclude glomerulonephritis because C4 is normal", "Evaluate infection-related and complement-mediated GN using history, serology and trajectory", "Assume PSGN is certain from low C3 alone"], "answer": 2, "explanation": "Selective C3 reduction is not exclusive to PSGN; persistent abnormalities suggest complement dysregulation. Why not the others: A. Assume anti-GBM because C4 is normal — Anti-GBM is defined by antibody and IF, not isolated complement pattern.; B. Exclude glomerulonephritis because C4 is normal — Normal C4 does not exclude GN.; D. Assume PSGN is certain from low C3 alone — Low C3 has several glomerular causes.", "pearl": "", "srcAnswer": "C"}, {"num": 73, "level": "Integrated", "question": "A child with acute nephritis has severe headache, visual symptoms, BP well above the 99th percentile and papilledema. What is the most urgent interpretation?", "options": ["Uncomplicated PSGN requiring no inpatient assessment", "Hypertensive emergency with end-organ involvement", "Routine steroid-sensitive relapse without urgent concern", "Benign isolated microscopic hematuria"], "answer": 1, "explanation": "Neurologic and ocular findings with severe hypertension require urgent controlled treatment. Why not the others: A. Uncomplicated PSGN requiring no inpatient assessment — Severe neurologic hypertension is a major PSGN complication.; C. Routine steroid-sensitive relapse without urgent concern — Nephrotic relapse does not make papilledema benign.; D. Benign isolated microscopic hematuria — This does not account for hypertensive end-organ signs.", "pearl": "", "srcAnswer": "B"}, {"num": 74, "level": "Integrated", "question": "An adolescent with nephritis has normal complement, PR3-ANCA positivity and upper-airway granulomatous symptoms. Which diagnosis is most likely?", "options": ["Granulomatosis with polyangiitis", "Minimal-change nephrotic syndrome", "Lupus nephritis", "Typical PSGN"], "answer": 0, "explanation": "ENT disease with PR3-ANCA and pauci-immune GN favors GPA. Why not the others: B. Minimal-change nephrotic syndrome — Minimal change does not explain destructive ENT disease and nephritic AKI.; C. Lupus nephritis — Lupus often has systemic autoantibodies and low complement.; D. Typical PSGN — PSGN usually follows infection with low C3.", "pearl": "", "srcAnswer": "A"}, {"num": 75, "level": "Integrated", "question": "A child with hematuria, proteinuria and rising creatinine has suspected RPGN. What is the most appropriate diagnostic sequence?", "options": ["Start an empiric four-week steroid trial before serology or biopsy", "Measure complement serially for eight weeks before biopsy", "Treat AKI with diuretics while deferring etiologic investigation", "Urgent nephrology assessment, targeted serology and timely biopsy without delaying stabilization"], "answer": 3, "explanation": "RPGN needs urgent renal assessment and etiologic biopsy while addressing emergencies. Why not the others: A. Start an empiric four-week steroid trial before serology or biopsy — A typical nephrotic steroid trial is not appropriate for rapidly progressive nephritic AKI.; B. Measure complement serially for eight weeks before biopsy — Rapid functional decline warrants urgent evaluation, not waiting for C3 recovery.; C. Treat AKI with diuretics while deferring etiologic investigation — Supportive care does not replace urgent diagnosis of RPGN.", "pearl": "", "srcAnswer": "D"}, {"num": 76, "level": "", "question": "A stable growing preterm infant receives 126 kcal/kg/day and 3.8 g/kg/day protein. Which assessment is most appropriate?", "options": ["Protein is necessarily excessive at 3.8 g/kg/day", "Within commonly used enteral targets; individualize by growth and tolerance", "Energy must always be below 100 kcal/kg/day", "The intake alone establishes feeding intolerance"], "answer": 1, "explanation": "Both values fall in commonly used target ranges, although local NICU protocols and clinical context govern. Why not the others: A. Protein is necessarily excessive at 3.8 g/kg/day — A protein intake of 3.8 g/kg/day is within many preterm target ranges.; C. Energy must always be below 100 kcal/kg/day — The energy target is commonly higher than 100 kcal/kg/day.; D. The intake alone establishes feeding intolerance — Feeding tolerance requires clinical growth and GI data, not intake alone.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 8 Q41 — Preterm energy/protein targets"}}, {"num": 77, "level": "", "question": "A preterm infant has a rising aEEG trace; simultaneous raw EEG shows evolving rhythmic discharges in frequency and morphology. What is the best interpretation?", "options": ["Electrographic seizure supported by evolving raw EEG", "Motion artifact without electrographic evolution", "Normal sleep-wake cycling alone", "Isolated electrode disconnection pattern"], "answer": 0, "explanation": "Evolving rhythmic raw EEG distinguishes an ictal event from common artifacts. Why not the others: B. Motion artifact without electrographic evolution — A true seizure shows evolving electrographic features, unlike motion artifact.; C. Normal sleep-wake cycling alone — Sleep cycling lacks the described ictal evolution.; D. Isolated electrode disconnection pattern — Electrode disconnection does not produce sustained evolving rhythmic raw EEG.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 7 Q34 — aEEG seizure vs artifact"}}, {"num": 78, "level": "", "question": "At 36 weeks postmenstrual age, an infant with BPD is receiving nasal cannula oxygen at 1.5 L/min and no positive pressure. What Jensen grade fits?", "options": ["Grade 2 BPD requiring >2 L/min or noninvasive pressure", "No BPD solely because flow is below 2 L/min", "Grade 3 BPD requiring invasive ventilation", "Grade 1 bronchopulmonary dysplasia"], "answer": 3, "explanation": "Jensen Grade 1: nasal cannula ≤2 L/min; Grade 2: >2 L/min or noninvasive positive-pressure support; Grade 3: invasive ventilation. Why not the others: A. Grade 2 BPD requiring >2 L/min or noninvasive pressure — Grade 2 requires >2 L/min nasal cannula or noninvasive positive pressure.; B. No BPD solely because flow is below 2 L/min — Grade 1 includes low-flow cannula support at 36 weeks PMA.; C. Grade 3 BPD requiring invasive ventilation — Grade 3 requires invasive mechanical ventilation.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 5 Q53 — Jensen BPD grade"}}, {"num": 79, "level": "", "question": "An infant is 60 hours old and remains hypoglycemic. Which statement correctly distinguishes guideline time windows?", "options": ["CPS transitional period necessarily ends at 48 h", "Both PES and CPS define transition as ending at 24 h", "PES persistent-hypoglycemia evaluation after 48 h differs from CPS transitional period through 72 h", "PES uses 72 h as its sole persistent-disorder boundary"], "answer": 2, "explanation": "The time thresholds describe different guideline scopes, not glucose concentrations. Why not the others: A. CPS transitional period necessarily ends at 48 h — CPS transitional framework extends to 72 hours.; B. Both PES and CPS define transition as ending at 24 h — CPS and PES do not share a universal 24-hour transitional cutoff.; D. PES uses 72 h as its sole persistent-disorder boundary — PES considers persistent hypoglycemia after 48 hours, not exclusively 72.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}, {"num": 80, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. What ETROP classification and action are appropriate?", "options": ["Type 2 ROP; observation only for several weeks", "Type 1 ROP; prompt treatment assessment", "Type 2 ROP; discharge from screening", "Type 1 ROP only if stage 3 develops"], "answer": 1, "explanation": "Zone II stage 2 or 3 with plus disease is Type 1 ROP. Why not the others: A. Type 2 ROP; observation only for several weeks — Zone II stage 2 with plus disease is Type 1, not Type 2.; C. Type 2 ROP; discharge from screening — Type 1 ROP needs prompt treatment assessment, not screening discharge.; D. Type 1 ROP only if stage 3 develops — Stage 3 is not required when zone II stage 2 has definite plus.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 81, "level": "", "question": "A pediatrician uses the BEARS mnemonic to screen a child with school sleepiness. Which domains are included?", "options": ["Bedtime problems, Excessive sleepiness, Awakenings, Regularity/duration, Snoring", "Bedtime, Epilepsy, Activity, Respiration, Saturation", "Breathing rate, EEG, Apnea index, REM, Seizures", "Behavior, Eye movements, Arousal index, REM latency, SpO2"], "answer": 0, "explanation": "BEARS is a five-domain clinical history screen. Why not the others: B. Bedtime, Epilepsy, Activity, Respiration, Saturation — The listed terms do not match the validated five BEARS domains.; C. Breathing rate, EEG, Apnea index, REM, Seizures — BEARS is a clinical sleep history tool, not an EEG mnemonic.; D. Behavior, Eye movements, Arousal index, REM latency, SpO2 — BEARS does not denote polysomnography indices.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 13 Q5 — BEARS sleep screen"}}, {"num": 82, "level": "", "question": "A child with complicated SAM weighs 8 kg and is prescribed 130 mL/kg/day of F-75. What is the prescribed total volume per day?", "options": ["104 mL/day", "130 mL/day", "800 mL/day", "1040 mL/day"], "answer": 3, "explanation": "8 kg × 130 mL/kg/day = 1040 mL/day; this is a mathematical repair item, not a clinical prescription. Why not the others: A. 104 mL/day — 104 mL/day is a tenfold calculation error.; B. 130 mL/day — 130 is mL/kg/day, not the daily total for an 8-kg child.; C. 800 mL/day — 800 mL/day does not equal 8×130 mL/day.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 daily feed volume"}}, {"num": 83, "level": "", "question": "A neonatal fluid order is 120 mL/kg/day and desired GIR is 7.5 mg/kg/min. Which dextrose concentration is calculated?", "options": ["Dextrose 6% approximately", "Dextrose 15% approximately", "Dextrose 9% approximately", "Dextrose 12% approximately"], "answer": 2, "explanation": "Dextrose % = GIR × 144 / fluid rate = 7.5 × 144 / 120 = 9%. Why not the others: A. Dextrose 6% approximately — 6% at 120 mL/kg/day supplies GIR 5 mg/kg/min, not 7.5.; B. Dextrose 15% approximately — 15% supplies GIR 12.5 mg/kg/min at the stated volume.; D. Dextrose 12% approximately — 12% supplies GIR 10 mg/kg/min at the stated volume.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 10 Q47 — GIR and dextrose %"}}, {"num": 84, "level": "", "question": "During hypoglycemia, an infant has suppressed beta-hydroxybutyrate and free fatty acids, and glucose rises 38 mg/dL after glucagon. What mechanism is supported?", "options": ["Primary cortisol deficiency with appropriate ketosis", "Excess insulin action despite possibly undetectable measured insulin", "Fatty-acid oxidation defect with elevated free fatty acids", "Ketotic hypoglycemia with increased beta-hydroxybutyrate"], "answer": 1, "explanation": "Suppressed alternate fuels and a glucagon response ≥30 mg/dL support inappropriate insulin action. Why not the others: A. Primary cortisol deficiency with appropriate ketosis — The suppressed fuels plus glucagon rise are more typical of excess insulin action.; C. Fatty-acid oxidation defect with elevated free fatty acids — FAOD commonly has elevated FFA rather than suppressed FFA.; D. Ketotic hypoglycemia with increased beta-hydroxybutyrate — Ketotic hypoglycemia has increased ketones, not suppressed beta-hydroxybutyrate.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 10 Q50 — Hyperinsulinism critical sample"}}];
const NB_CTX={srcId:'Day30',label:'Day 30',set:'Quiz 5',href:'Day30/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day30_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 30 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 30 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 30'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 30');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day30:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=267c69f6"></script></body></html>
