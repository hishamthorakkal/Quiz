<script>
const quiz=[{"num": 46, "level": "", "question": "Which biochemical test is generally used to screen suspected GH excess?", "options": ["Urine glucose alone", "Serum calcium alone", "Age-adjusted IGF-1", "Random insulin only"], "answer": 2, "explanation": "IGF-1 integrates GH action better than random GH for excess screening. Why not the others (added — not from source): A. Urine glucose alone — Urine glucose may reflect secondary diabetes but is neither sensitive nor specific for GH excess.; B. Serum calcium alone — Serum calcium is not a screening test for GH excess.; D. Random insulin only — Random insulin does not assess GH secretion and is not a screen for GH excess.", "pearl": "", "srcAnswer": "A"}, {"num": 47, "level": "", "question": "A newborn screen reports elevated TSH. Which confirmatory blood tests are most appropriate?", "options": ["Total T3 alone", "Venous TSH and free T4", "Thyroglobulin only", "TSH-receptor antibody only"], "answer": 1, "explanation": "Confirmatory venous thyroid function tests determine urgency and phenotype. Why not the others (added — not from source): A. Total T3 alone — Total T3 is often maintained in hypothyroidism and does not confirm the diagnosis; free T4 with TSH is needed.; C. Thyroglobulin only — Thyroglobulin helps classify aetiology (e.g. athyreosis) but does not confirm thyroid dysfunction.; D. TSH-receptor antibody only — TSH-receptor antibodies are an adjunct for suspected maternal autoimmune transient hypothyroidism, not the primary confirmation.", "pearl": "", "srcAnswer": "B"}, {"num": 48, "level": "", "question": "A neonate has prolonged jaundice, macroglossia and large fontanelle. Which diagnosis is important?", "options": ["Congenital hypothyroidism", "Diabetes insipidus", "Cushing syndrome", "Graves disease"], "answer": 0, "explanation": "Classic findings warrant urgent thyroid testing and treatment evaluation. Why not the others (added — not from source): B. Diabetes insipidus — Diabetes insipidus presents with polyuria, dehydration and hypernatraemia, not macroglossia or a large fontanelle.; C. Cushing syndrome — Cushing syndrome is very rare in neonates and does not cause macroglossia or a large posterior fontanelle.; D. Graves disease — Neonatal Graves disease causes tachycardia, irritability and goitre, not prolonged jaundice with macroglossia.", "pearl": "", "srcAnswer": "C"}, {"num": 49, "level": "", "question": "Which treatment principle matters most in confirmed congenital hypothyroidism?", "options": ["Use iodine alone in all cases", "Delay therapy until age 2 years", "Start levothyroxine promptly", "Wait until speech delay appears"], "answer": 2, "explanation": "Early replacement protects neurodevelopment. Why not the others (added — not from source): A. Use iodine alone in all cases — Iodine alone does not treat dysgenesis or dyshormonogenesis; levothyroxine is standard therapy.; B. Delay therapy until age 2 years — Delaying treatment until age 2 years would cause permanent intellectual impairment; therapy should start within the first two weeks.; D. Wait until speech delay appears — Waiting for speech delay means irreversible neurodevelopmental damage has already occurred.", "pearl": "", "srcAnswer": "D"}, {"num": 50, "level": "", "question": "A child has low FT4 with non-elevated TSH. Which diagnosis must be considered?", "options": ["Graves disease", "Uncomplicated primary hypothyroidism", "Iodine excess always", "Central hypothyroidism"], "answer": 3, "explanation": "TSH may be inappropriately normal or low in central hypothyroidism. Why not the others (added — not from source): A. Graves disease — Graves disease causes high FT4 with suppressed TSH, not low FT4.; B. Uncomplicated primary hypothyroidism — Primary hypothyroidism produces an elevated TSH; a non-elevated TSH with low FT4 argues against it.; C. Iodine excess always — Iodine excess can cause hypothyroidism, usually with raised TSH, and the word always makes this option incorrect.", "pearl": "", "srcAnswer": "A"}, {"num": 51, "level": "", "question": "Before thyroid replacement in a child with suspected multiple pituitary deficits, which issue is important?", "options": ["Exclude or treat cortisol deficiency", "Administer radioiodine", "Start methimazole", "Avoid all cortisol testing"], "answer": 0, "explanation": "Levothyroxine can precipitate adrenal crisis when central adrenal insufficiency is untreated. Why not the others (added — not from source): B. Administer radioiodine — Radioiodine is a definitive treatment for hyperthyroidism and has no role in a child about to start levothyroxine for central hypothyroidism.; C. Start methimazole — Methimazole blocks thyroid hormone synthesis and treats hyperthyroidism; it would worsen a child who needs thyroid replacement.; D. Avoid all cortisol testing — Cortisol status must be assessed, not avoided; missed central adrenal insufficiency can be unmasked into adrenal crisis once levothyroxine accelerates cortisol clearance.", "pearl": "", "srcAnswer": "B"}, {"num": 52, "level": "", "question": "Which thyroid profile most supports untreated primary hypothyroidism?", "options": ["High TSH and low FT4", "Normal TSH and high FT4", "Low TSH and normal FT4 only", "Low TSH and high FT4"], "answer": 0, "explanation": "Loss of thyroid feedback increases TSH in primary disease. Why not the others (added — not from source): B. Normal TSH and high FT4 — Normal TSH with high FT4 suggests assay interference, TSH-secreting adenoma or thyroid hormone resistance, not primary hypothyroidism.; C. Low TSH and normal FT4 only — Low TSH with normal FT4 indicates subclinical hyperthyroidism or non-thyroidal illness, the opposite direction of primary thyroid failure.; D. Low TSH and high FT4 — Suppressed TSH with high FT4 is the pattern of primary thyrotoxicosis, not hypothyroidism.", "pearl": "", "srcAnswer": "C"}, {"num": 53, "level": "", "question": "Which profile supports primary thyrotoxicosis?", "options": ["High TSH and low FT4", "Low FT4 with normal TSH", "Suppressed TSH and elevated FT4/T3", "High TSH and normal FT4 only"], "answer": 2, "explanation": "Thyroid hormone excess suppresses pituitary TSH. Why not the others (added — not from source): A. High TSH and low FT4 — High TSH with low FT4 is the pattern of primary hypothyroidism, the opposite of thyrotoxicosis.; B. Low FT4 with normal TSH — Low FT4 with an inappropriately normal TSH suggests central hypothyroidism, not thyroid hormone excess.; D. High TSH and normal FT4 only — Raised TSH with normal FT4 defines subclinical hypothyroidism; in primary thyrotoxicosis TSH is suppressed.", "pearl": "", "srcAnswer": "D"}, {"num": 54, "level": "", "question": "A school-age child has painless goitre, high TSH and anti-TPO antibodies. Most likely?", "options": ["Thyroid storm", "Thyroglossal duct cyst", "Autoimmune thyroiditis", "Pituitary adenoma"], "answer": 2, "explanation": "Autoimmune thyroiditis commonly causes goitre and primary hypothyroidism. Why not the others (added — not from source): A. Thyroid storm — Thyroid storm is an acute decompensated thyrotoxic state with fever and tachycardia, and TSH would be suppressed, not high.; B. Thyroglossal duct cyst — A thyroglossal duct cyst is a midline neck swelling that moves on tongue protrusion; it does not cause diffuse goitre, raised TSH or anti-TPO antibodies.; D. Pituitary adenoma — A pituitary adenoma would cause low or inappropriately normal TSH with central hypothyroidism, or TSH-driven hyperthyroidism, and does not explain anti-TPO positivity.", "pearl": "", "srcAnswer": "A"}, {"num": 55, "level": "", "question": "Which sign is more typical of Graves disease than uncomplicated autoimmune hypothyroidism?", "options": ["Delayed relaxation of reflexes", "Tachycardia and tremor", "Bradycardia", "Constipation"], "answer": 1, "explanation": "Adrenergic symptoms accompany thyroid hormone excess. Why not the others (added — not from source): A. Delayed relaxation of reflexes — Delayed relaxation of deep-tendon reflexes is a classical hypothyroid sign; Graves disease causes brisk reflexes.; C. Bradycardia — Bradycardia reflects hypothyroidism; thyroid hormone excess in Graves disease causes tachycardia.; D. Constipation — Constipation is typical of hypothyroidism; Graves disease more often causes increased stool frequency.", "pearl": "", "srcAnswer": "B"}, {"num": 56, "level": "", "question": "An adolescent taking methimazole reports fever and severe sore throat. Best response?", "options": ["Switch to iodine indefinitely without review", "Reassure without evaluation", "Double the dose", "Stop drug and urgently obtain clinical assessment and CBC"], "answer": 3, "explanation": "Agranulocytosis is a rare but dangerous antithyroid-drug adverse effect. Why not the others (added — not from source): A. Switch to iodine indefinitely without review — Iodine is only a short-term adjunct, and switching without review ignores the urgent need to exclude agranulocytosis with a blood count.; B. Reassure without evaluation — Reassurance without a CBC risks missing agranulocytosis, which can progress rapidly to life-threatening sepsis.; C. Double the dose — Fever and sore throat on methimazole suggest agranulocytosis; increasing the dose could worsen a potentially fatal marrow toxicity.", "pearl": "", "srcAnswer": "C"}, {"num": 57, "level": "", "question": "Why is propylthiouracil generally avoided in children?", "options": ["Risk of severe liver injury", "It causes congenital hypothyroidism in all", "It has no antithyroid action", "It is always ineffective"], "answer": 0, "explanation": "PTU carries severe hepatotoxicity risk, making methimazole preferred in most paediatric cases. Why not the others (added — not from source): B. It causes congenital hypothyroidism in all — PTU does not cause congenital hypothyroidism in all exposed infants; it is even preferred in the first trimester of pregnancy.; C. It has no antithyroid action — PTU inhibits thyroid peroxidase and peripheral T4-to-T3 conversion, so it clearly has antithyroid action.; D. It is always ineffective — PTU is an effective antithyroid drug; it is avoided because of hepatotoxicity, not lack of efficacy.", "pearl": "", "srcAnswer": "D"}, {"num": 58, "level": "", "question": "An asymptomatic child has TSH 6 mIU/L with normal FT4. Which interpretation is best?", "options": ["Thyroid storm", "Overt primary hypothyroidism", "Central hypothyroidism proven", "Mild subclinical hypothyroidism requiring context and follow-up"], "answer": 3, "explanation": "Mild TSH elevation with normal FT4 is not automatically an indication for treatment. Why not the others (added — not from source): A. Thyroid storm — Thyroid storm is severe decompensated thyrotoxicosis with suppressed TSH; this child is asymptomatic with a mildly raised TSH.; B. Overt primary hypothyroidism — Overt primary hypothyroidism requires a low FT4; here FT4 is normal and the TSH rise is mild.; C. Central hypothyroidism proven — Central hypothyroidism shows low FT4 with low or inappropriately normal TSH, not a raised TSH with normal FT4.", "pearl": "", "srcAnswer": "A"}, {"num": 59, "level": "", "question": "A child with Down syndrome develops slowing growth and constipation. Which test is particularly important?", "options": ["TSH and FT4", "Serum copper", "Random GH only", "Urinary ketones only"], "answer": 0, "explanation": "Thyroid dysfunction is common and may mimic nonspecific symptoms. Why not the others (added — not from source): B. Serum copper — Serum copper is relevant to Wilson disease or copper deficiency, not to the hypothyroid-like picture common in Down syndrome.; C. Random GH only — A random GH level is uninformative because GH is pulsatile, and thyroid dysfunction is the more likely and treatable cause here.; D. Urinary ketones only — Urinary ketones do not assess slowing growth or constipation and ignore the high risk of hypothyroidism in Down syndrome.", "pearl": "", "srcAnswer": "B"}, {"num": 60, "level": "", "question": "Which statement about neonatal thyroid screening is correct?", "options": ["Screening removes need to evaluate symptomatic infants", "All screens measure FT4", "Screening always detects every form of hypothyroidism", "A normal screen never excludes central hypothyroidism in all programmes"], "answer": 3, "explanation": "TSH-only programmes can miss central hypothyroidism; symptomatic infants still need evaluation. Why not the others (added — not from source): A. Screening removes need to evaluate symptomatic infants — A normal newborn screen never overrides clinical suspicion; symptomatic infants still need serum TSH and FT4.; B. All screens measure FT4 — Many programmes, including most Indian ones, use primary TSH screening; FT4 or T4 is not measured universally.; C. Screening always detects every form of hypothyroidism — No programme detects every case; TSH-based screens miss central hypothyroidism and delayed TSH rise can be missed in preterm or sick infants.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day42',label:'Day 42',set:'Quiz 4',href:'Day42/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day42_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 42 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 42 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 42'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 42');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day42:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
