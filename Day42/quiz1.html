:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}

@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<h1>Day 42 — Quiz 1</h1>
<div class="sub">Questions 1–15 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>

<script>
const quiz=[{"num": 1, "level": "", "question": "A 7-year-old boy has height below −2 SDS. What is the most useful first step to distinguish normal variant from pathological growth failure?", "options": ["One serum cortisol", "Accurate serial height measurements and growth velocity", "Single weight percentile", "Random GH level"], "answer": 1, "explanation": "Growth velocity and accurate serial measurements establish the pattern; a random GH concentration is pulsatile and uninformative. Why not the others (added — not from source): A. One serum cortisol — A single cortisol is not a screen for short stature and is only relevant when a specific adrenal or Cushing picture is suspected.; C. Single weight percentile — A single weight percentile says nothing about the linear growth pattern; serial height and growth velocity define whether growth is failing.; D. Random GH level — GH is secreted in pulses, so a random level is usually low even in normal children and cannot separate variant from pathology; auxology must come first.", "pearl": "", "srcAnswer": "B"}, {"num": 2, "level": "", "question": "An 8-year-old with short stature has delayed bone age, normal growth velocity for bone age and family history of late puberty. Most likely?", "options": ["Turner syndrome", "Constitutional delay of growth and puberty", "Skeletal dysplasia", "Primary hypothyroidism"], "answer": 1, "explanation": "Constitutional delay commonly features delayed skeletal maturation and family history of delayed maturation. Why not the others (added — not from source): A. Turner syndrome — Turner syndrome shows progressive growth decline with falling velocity and no family history of late puberty; karyotype is reserved when the pattern is not reassuring.; C. Skeletal dysplasia — Skeletal dysplasia causes disproportionate short stature, not proportionate growth with delayed bone age and familial late puberty.; D. Primary hypothyroidism — Acquired hypothyroidism causes markedly reduced growth velocity with weight gain, not normal velocity with a familial late-maturation pattern.", "pearl": "", "srcAnswer": "A"}, {"num": 3, "level": "", "question": "A 9-year-old has short stature, normal bone age, normal growth velocity, and both parents are short. Most likely?", "options": ["Cushing syndrome", "Familial short stature", "GH deficiency", "Untreated coeliac disease"], "answer": 1, "explanation": "Familial short stature often has normal growth velocity and skeletal age near chronological age. Why not the others (added — not from source): A. Cushing syndrome — Cushing syndrome causes growth arrest with weight gain, not normal growth velocity in a child of short parents.; C. GH deficiency — GH deficiency causes subnormal growth velocity and delayed bone age, whereas here both are normal.; D. Untreated coeliac disease — Untreated coeliac disease causes poor weight gain, slowed growth velocity and delayed bone age, unlike this normal-velocity, normal-bone-age child of short parents.", "pearl": "", "srcAnswer": "C"}, {"num": 4, "level": "", "question": "A girl with unexplained short stature and no obvious dysmorphism should be evaluated for which chromosomal condition?", "options": ["Turner syndrome", "Klinefelter syndrome", "Trisomy 21", "Fragile X syndrome"], "answer": 0, "explanation": "Turner syndrome can present primarily with short stature; karyotype should be considered. Why not the others (added — not from source): B. Klinefelter syndrome — Klinefelter syndrome (47,XXY) occurs in males and is associated with tall rather than short stature.; C. Trisomy 21 — Trisomy 21 is almost always clinically obvious from dysmorphism and developmental delay, so it is not the hidden cause in a non-dysmorphic short girl.; D. Fragile X syndrome — Fragile X mainly presents with intellectual disability and behavioural features, not isolated short stature in girls.", "pearl": "", "srcAnswer": "B"}, {"num": 5, "level": "", "question": "A 6-year-old has growth deceleration, constipation and fatigue. Best initial thyroid tests?", "options": ["Total T3 alone", "Random GH", "TSH and free T4", "Thyroglobulin alone"], "answer": 2, "explanation": "TSH with free T4 helps identify primary and central thyroid dysfunction. Why not the others (added — not from source): A. Total T3 alone — Total T3 alone is often maintained until late hypothyroidism and is affected by binding proteins, so it misses most hypothyroid children.; B. Random GH — Random GH is pulsatile and non-diagnostic, and constipation with fatigue points to the thyroid axis first.; D. Thyroglobulin alone — Thyroglobulin is not a test of thyroid function; it is used in dysgenesis work-up and thyroid cancer follow-up.", "pearl": "", "srcAnswer": "A"}, {"num": 6, "level": "", "question": "Which pattern most strongly suggests an endocrine rather than systemic cause of short stature?", "options": ["Severe undernutrition", "Low height with low weight for height", "Poor linear growth with preserved or increased weight", "Chronic diarrhoea and wasting"], "answer": 2, "explanation": "Endocrine causes often preserve or increase weight relative to height, unlike chronic systemic undernutrition. Why not the others (added — not from source): A. Severe undernutrition — Severe undernutrition reduces weight more than height and is a systemic, not endocrine, cause of growth failure.; B. Low height with low weight for height — Low height with low weight-for-height suggests undernutrition or systemic disease, where weight falls before or with height.; D. Chronic diarrhoea and wasting — Chronic diarrhoea with wasting points to a gastrointestinal or malabsorptive cause such as coeliac disease, not an endocrine one.", "pearl": "", "srcAnswer": "B"}, {"num": 7, "level": "", "question": "A child is measured with shoes on using a wall mark, giving a low-quality height measurement. Best correction?", "options": ["Use a calibrated stadiometer with standard positioning", "Use recalled height", "Measure supine length at age 10", "Estimate from arm span only"], "answer": 0, "explanation": "Standardized anthropometry is essential before classifying growth abnormalities. Why not the others (added — not from source): B. Use recalled height — Recalled heights are unreliable and cannot substitute for an accurate standardised measurement.; C. Measure supine length at age 10 — Supine length is used under 2 years; a 10-year-old should be measured standing on a stadiometer.; D. Estimate from arm span only — Arm span is a proportion check or a height surrogate only when standing height cannot be measured, not a correction for poor technique.", "pearl": "", "srcAnswer": "C"}, {"num": 8, "level": "", "question": "A child has disproportionate short stature and bowed legs. Most appropriate next focus?", "options": ["Only thyroid antibodies", "Assess body proportions and skeletal dysplasia/rickets", "Exclude constitutional delay", "Only GH stimulation"], "answer": 1, "explanation": "Disproportion and deformity require skeletal and metabolic evaluation, not just endocrine testing. Why not the others (added — not from source): A. Only thyroid antibodies — Thyroid antibodies do not explain disproportionate stature with bowed legs and would miss rickets or dysplasia.; C. Exclude constitutional delay — Constitutional delay produces proportionate short stature without limb deformity, so excluding it is not the priority here.; D. Only GH stimulation — GH stimulation does not address disproportion or bowing; skeletal dysplasia or rickets must be assessed first.", "pearl": "", "srcAnswer": "D"}, {"num": 9, "level": "", "question": "A prepubertal child has a sustained fall across height centiles. Which finding most warrants further investigation?", "options": ["Growth velocity below expected for age", "Height at 25th percentile with stable trajectory", "One inconsistent height measurement", "Tall parents"], "answer": 0, "explanation": "Sustained growth deceleration is a red flag even before severe short stature develops. Why not the others (added — not from source): B. Height at 25th percentile with stable trajectory — A height on the 25th percentile with a stable trajectory is normal growth and needs no investigation.; C. One inconsistent height measurement — A single inconsistent measurement should be repeated, not investigated, as it may be measurement error.; D. Tall parents — Tall parents alone are not a finding needing work-up, though they make a falling trajectory more concerning in context.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "", "question": "Why is a random serum GH level not a diagnostic test for GH deficiency?", "options": ["GH does not affect IGF-1", "GH secretion is pulsatile", "GH is secreted continuously", "GH is only measurable in urine"], "answer": 1, "explanation": "GH is secreted in pulses; diagnosis relies on integrated auxology and specialist testing. Why not the others (added — not from source): A. GH does not affect IGF-1 — GH drives hepatic IGF-1 production, which is why IGF-1 is used as a screening marker.; C. GH is secreted continuously — GH is not secreted continuously; its pulsatile release is exactly why random levels mislead.; D. GH is only measurable in urine — GH is measured in serum; urinary GH is not a standard diagnostic test.", "pearl": "", "srcAnswer": "B"}, {"num": 11, "level": "", "question": "Low IGF-1 in a malnourished child is best interpreted as?", "options": ["Diagnostic of acromegaly", "Definitive isolated GH deficiency", "Potentially reflecting nutritional status, not diagnostic alone", "Proof of pituitary tumour"], "answer": 2, "explanation": "IGF-1 depends on age, pubertal stage and nutrition; low values are nonspecific. Why not the others (added — not from source): A. Diagnostic of acromegaly — Acromegaly or GH excess raises IGF-1, the opposite of this finding.; B. Definitive isolated GH deficiency — Malnutrition itself lowers IGF-1, so a low value cannot define isolated GH deficiency without stimulation testing and auxology.; D. Proof of pituitary tumour — A low IGF-1 is non-specific and is not evidence of a pituitary tumour, which needs imaging and endocrine assessment.", "pearl": "", "srcAnswer": "C"}, {"num": 12, "level": "", "question": "A child has severe growth failure, neonatal hypoglycaemia and micropenis. What should be considered?", "options": ["Simple obesity", "Isolated iron deficiency", "Familial tall stature", "Pituitary hormone deficiencies"], "answer": 3, "explanation": "These are clues to congenital hypopituitarism; evaluate other pituitary axes urgently. Why not the others (added — not from source): A. Simple obesity — Simple obesity is associated with normal or accelerated linear growth, not severe growth failure with hypopituitary clues.; B. Isolated iron deficiency — Iron deficiency does not cause neonatal hypoglycaemia or micropenis.; C. Familial tall stature — Familial tall stature is the opposite of severe growth failure and lacks hypoglycaemia or micropenis.", "pearl": "", "srcAnswer": "A"}, {"num": 13, "level": "", "question": "Which assessment is essential before GH treatment in suspected GH deficiency?", "options": ["Exclude systemic disease and evaluate pituitary axes under specialist care", "Use random GH as sole criterion", "Start GH solely from low height", "Avoid bone age"], "answer": 0, "explanation": "GH therapy requires accurate diagnosis, review of other axes and relevant contraindications. Why not the others (added — not from source): B. Use random GH as sole criterion — Random GH is pulsatile and cannot be a diagnostic criterion.; C. Start GH solely from low height — Low height alone does not establish GH deficiency; other causes and pituitary axes must be evaluated before treatment.; D. Avoid bone age — Bone age is part of the standard evaluation and helps assess growth potential, so it should not be avoided.", "pearl": "", "srcAnswer": "B"}, {"num": 14, "level": "", "question": "A child receiving GH develops headache, vomiting and visual symptoms. Important adverse event to exclude?", "options": ["Intracranial hypertension", "Acute appendicitis", "Iron deficiency", "Simple viral rhinitis only"], "answer": 0, "explanation": "GH therapy is associated with intracranial hypertension; urgent assessment is indicated. Why not the others (added — not from source): B. Acute appendicitis — Appendicitis does not explain headache with visual symptoms and is not a GH-related adverse effect.; C. Iron deficiency — Iron deficiency does not produce headache, vomiting and visual disturbance as a GH complication.; D. Simple viral rhinitis only — Rhinitis does not cause vomiting and visual symptoms; attributing these to a viral illness risks missing raised intracranial pressure.", "pearl": "", "srcAnswer": "C"}, {"num": 15, "level": "", "question": "A child on GH develops limp and hip pain. Which diagnosis is important?", "options": ["Otitis media", "Lactose intolerance", "Nephrotic syndrome", "Slipped capital femoral epiphysis"], "answer": 3, "explanation": "SCFE is an important orthopaedic complication requiring prompt assessment. Why not the others (added — not from source): A. Otitis media — Otitis media does not cause limp or hip pain.; B. Lactose intolerance — Lactose intolerance causes gastrointestinal symptoms, not limp or hip pain.; C. Nephrotic syndrome — Nephrotic syndrome presents with oedema and proteinuria, not hip pain, and is not a GH complication.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day42',label:'Day 42',set:'Quiz 1',href:'Day42/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day42_QuizSet1_Q1-15_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 42 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–15</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 42 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 42'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 42');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day42:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
