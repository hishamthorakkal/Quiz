@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 61, "level": "High", "question": "For typical d-TGA suitable for anatomical correction in neonatal period, preferred definitive operation?", "options": ["Isolated PDA ligation", "Arterial switch operation with coronary transfer", "Bidirectional Glenn alone", "Fontan completion"], "answer": 1, "explanation": "Restores ventriculoarterial concordance and coronary supply. Why not the others: A. Isolated PDA ligation — Would not correct transposed great arteries.; C. Bidirectional Glenn alone — Palliation for univentricular pathway.; D. Fontan completion — For selected single-ventricle physiology, not routine d-TGA.", "pearl": "Restores ventriculoarterial concordance and coronary supply.", "srcAnswer": "B"}, {"num": 62, "level": "Clinical", "question": "A neonate has severe hypoxemia, pulmonary edema, small LA and vertical venous drainage with obstruction. Priority?", "options": ["Elective review after 6 months", "Routine prolonged PGE1 as definitive therapy", "Urgent surgical repair of obstructed TAPVC after stabilization", "Isolated PDA closure"], "answer": 2, "explanation": "Pulmonary venous obstruction is a surgical emergency. Why not the others: A. Elective review after 6 months — Severe pulmonary venous obstruction cannot wait.; B. Routine prolonged PGE1 as definitive therapy — Does not anatomically relieve obstructed pulmonary veins.; D. Isolated PDA closure — Does not relieve pulmonary venous obstruction.", "pearl": "Pulmonary venous obstruction is a surgical emergency.", "srcAnswer": "C"}, {"num": 63, "level": "Clinical", "question": "Echo shows all four pulmonary veins draining to a confluence entering the coronary sinus. Type?", "options": ["Supracardiac TAPVC", "Mixed TAPVC", "Infracardiac TAPVC", "Cardiac TAPVC"], "answer": 3, "explanation": "Pulmonary venous return reaches right atrium via coronary sinus. Why not the others: A. Supracardiac TAPVC — Usually vertical vein to innominate/SVC.; B. Mixed TAPVC — Multiple separate drainage pathways.; C. Infracardiac TAPVC — Descends below diaphragm to portal/hepatic/IVC systems.", "pearl": "Pulmonary venous return reaches right atrium via coronary sinus.", "srcAnswer": "D"}, {"num": 64, "level": "Clinical", "question": "A newborn has a single arterial trunk supplying systemic, coronary and pulmonary circulations plus VSD. Diagnosis?", "options": ["d-TGA with intact septum", "TOF with pulmonary atresia", "Double-outlet right ventricle", "Persistent truncus arteriosus"], "answer": 3, "explanation": "One common arterial trunk and VSD define truncus. Why not the others: A. d-TGA with intact septum — Has two great arteries with parallel circulation.; B. TOF with pulmonary atresia — Separate systemic aorta and pulmonary supply pathways.; C. Double-outlet right ventricle — Two great arteries arise from RV, not one common truncus.", "pearl": "One common arterial trunk and VSD define truncus.", "srcAnswer": "D"}, {"num": 65, "level": "High", "question": "A child with truncus arteriosus has hypocalcemia and thymic hypoplasia. Genetic association?", "options": ["Trisomy 21", "22q11.2 deletion syndrome", "7q11.23 deletion", "Monosomy X"], "answer": 1, "explanation": "Conotruncal defect, hypocalcemia and thymic hypoplasia suggest 22q11.2 deletion. Why not the others: A. Trisomy 21 — More associated with AVSD.; C. 7q11.23 deletion — Williams syndrome with supravalvar AS.; D. Monosomy X — Turner syndrome with coarctation.", "pearl": "Conotruncal defect, hypocalcemia and thymic hypoplasia suggest 22q11.2 deletion.", "srcAnswer": "B"}, {"num": 66, "level": "Integrated", "question": "A neonate becomes shocked as duct closes, with strong upper pulses and weak femoral pulses. Likely lesion?", "options": ["Isolated mild pulmonary stenosis", "Large secundum ASD", "Small restrictive VSD", "Critical coarctation of aorta"], "answer": 3, "explanation": "Duct-dependent systemic flow and pulse discrepancy suggest CoA. Why not the others: A. Isolated mild pulmonary stenosis — Does not cause weak femoral pulses.; B. Large secundum ASD — Usually no neonatal duct-dependent shock.; C. Small restrictive VSD — Not associated with systemic outflow shock.", "pearl": "Duct-dependent systemic flow and pulse discrepancy suggest CoA.", "srcAnswer": "D"}, {"num": 67, "level": "Conceptual", "question": "A schoolchild has right-arm BP 145/85, leg BP 105/65 and delayed femorals. Next targeted evaluation?", "options": ["Observation because leg pressure is normally lower", "Routine chest CT without clinical cardiac evaluation", "Echo for isolated ASD as first hypothesis", "Echocardiography for coarctation and arch anatomy"], "answer": 3, "explanation": "Arm-leg gradient and pulse delay suggest CoA. Why not the others: A. Observation because leg pressure is normally lower — Normal leg systolic pressure is usually similar/higher, not markedly lower.; B. Routine chest CT without clinical cardiac evaluation — Echo is appropriate initial anatomical test in children.; C. Echo for isolated ASD as first hypothesis — ASD does not explain differential systemic pressures.", "pearl": "Arm-leg gradient and pulse delay suggest CoA.", "srcAnswer": "D"}, {"num": 68, "level": "Clinical", "question": "A girl with short stature, webbed neck and coarctation most likely has?", "options": ["Turner syndrome", "Down syndrome", "Noonan syndrome", "Williams syndrome"], "answer": 0, "explanation": "Monosomy X strongly associates with CoA/bicuspid valve. Why not the others: B. Down syndrome — AVSD is classic association.; C. Noonan syndrome — Pulmonary stenosis and hypertrophic cardiomyopathy are typical.; D. Williams syndrome — More strongly linked to supravalvar aortic stenosis.", "pearl": "Monosomy X strongly associates with CoA/bicuspid valve.", "srcAnswer": "A"}, {"num": 69, "level": "Recall", "question": "A child has elfin facial features, hypercalcemia history and supravalvar aortic stenosis. Molecular lesion?", "options": ["22q11.2 deletion", "7q11.23 deletion including ELN", "Monosomy X", "Trisomy 21"], "answer": 1, "explanation": "Williams syndrome results from 7q11.23 microdeletion with elastin haploinsufficiency. Why not the others: A. 22q11.2 deletion — Conotruncal defects and immune/calcium problems.; C. Monosomy X — CoA and bicuspid aortic valve.; D. Trisomy 21 — AVSD association.", "pearl": "Williams syndrome results from 7q11.23 microdeletion with elastin haploinsufficiency.", "srcAnswer": "B"}, {"num": 70, "level": "Clinical", "question": "A child with valvar aortic stenosis has exertional syncope and harsh ejection murmur radiating to neck. Principal lesion?", "options": ["Large PDA", "Left ventricular outflow obstruction at aortic valve", "Isolated ASD", "Right ventricular outflow obstruction at pulmonary valve"], "answer": 1, "explanation": "Valve narrowing causes LV pressure overload and exertional symptoms. Why not the others: A. Large PDA — Continuous runoff lesion rather than valvar LVOT.; C. Isolated ASD — RV volume load with fixed split S2.; D. Right ventricular outflow obstruction at pulmonary valve — Usually radiates to back and loads RV.", "pearl": "Valve narrowing causes LV pressure overload and exertional symptoms.", "srcAnswer": "B"}, {"num": 71, "level": "Clinical", "question": "An asymptomatic child has ejection click and systolic murmur at LUSB with RV pressure overload on echo. Lesion?", "options": ["Large VSD", "Supravalvar aortic stenosis", "PDA", "Valvar pulmonary stenosis"], "answer": 3, "explanation": "RV outflow obstruction at pulmonary valve produces ejection murmur/click. Why not the others: A. Large VSD — Holosystolic LLSB murmur and LV volume load.; B. Supravalvar aortic stenosis — LVOT murmur radiating to neck.; C. PDA — Continuous murmur and bounding pulses.", "pearl": "RV outflow obstruction at pulmonary valve produces ejection murmur/click.", "srcAnswer": "D"}, {"num": 72, "level": "Clinical", "question": "A 3-day-old has small ascending aorta, mitral/aortic atresia and collapse as PDA constricts. Stabilization priority?", "options": ["Close ductus with ibuprofen", "Balloon pulmonary valvotomy", "Isolated oxygen without assessing ductal dependence", "Maintain ductal systemic perfusion with PGE1 and urgent cardiac referral"], "answer": 3, "explanation": "HLHS systemic output depends on ductal flow. Why not the others: A. Close ductus with ibuprofen — Would abolish systemic perfusion.; B. Balloon pulmonary valvotomy — Does not correct HLHS anatomy.; C. Isolated oxygen without assessing ductal dependence — Does not restore systemic output.", "pearl": "HLHS systemic output depends on ductal flow.", "srcAnswer": "D"}, {"num": 73, "level": "High", "question": "What is the purpose of the Norwood stage in classic HLHS?", "options": ["Create unobstructed systemic outflow and controlled pulmonary blood flow", "Repair isolated primum ASD", "Switch great arteries and transfer coronaries", "Close all systemic-to-pulmonary connections"], "answer": 0, "explanation": "Norwood reconstructs neoaorta and establishes pulmonary flow source. Why not the others: B. Repair isolated primum ASD — Not the primary HLHS physiology.; C. Switch great arteries and transfer coronaries — Arterial switch is for TGA.; D. Close all systemic-to-pulmonary connections — Would remove pulmonary perfusion.", "pearl": "Norwood reconstructs neoaorta and establishes pulmonary flow source.", "srcAnswer": "A"}, {"num": 74, "level": "Clinical", "question": "Under the 2019 Indian CHD consensus, routine bidirectional Glenn timing with suitable physiology is?", "options": ["6–12 months, with selected consideration at 4–6 months", "18–24 months as routine first cavopulmonary step", "4–7 years as routine Glenn timing", "Birth to 4 weeks in all stable infants"], "answer": 0, "explanation": "Indian consensus lists 6–12 months Class I and selected 4–6 months. Why not the others: B. 18–24 months as routine first cavopulmonary step — Later than usual Glenn timing.; C. 4–7 years as routine Glenn timing — This is more typical Fontan completion window.; D. Birth to 4 weeks in all stable infants — Not routine Glenn timing.", "pearl": "Indian consensus lists 6–12 months Class I and selected 4–6 months.", "srcAnswer": "A"}, {"num": 75, "level": "Clinical", "question": "Which physiology is most favorable before Fontan completion?", "options": ["Marked branch PA obstruction", "High PVR with severe AV valve regurgitation", "Severe ventricular diastolic dysfunction", "Low PVR, good ventricular function and minimal AV-valve regurgitation"], "answer": 3, "explanation": "Passive cavopulmonary flow requires low resistance and good filling/pump function. Why not the others: A. Marked branch PA obstruction — Creates excessive cavopulmonary resistance.; B. High PVR with severe AV valve regurgitation — Raises Fontan failure risk.; C. Severe ventricular diastolic dysfunction — Impairs passive venous return.", "pearl": "Passive cavopulmonary flow requires low resistance and good filling/pump function.", "srcAnswer": "D"}, {"num": 76, "level": "Clinical", "question": "Echo shows AV and ventriculoarterial discordance with systemic morphologic RV. Lesion?", "options": ["Congenitally corrected TGA", "Truncus arteriosus", "d-TGA with AV concordance", "Classic TOF"], "answer": 0, "explanation": "Double discordance yields physiologically corrected circulation with systemic RV. Why not the others: B. Truncus arteriosus — One arterial trunk rather than two discordant connections.; C. d-TGA with AV concordance — Parallel circulation, not double discordance.; D. Classic TOF — VSD with RVOT obstruction and overriding aorta.", "pearl": "Double discordance yields physiologically corrected circulation with systemic RV.", "srcAnswer": "A"}, {"num": 77, "level": "High", "question": "A teenager with ccTGA develops progressive conduction disease. Recognized association?", "options": ["Spontaneous complete AV block", "Atrial flutter only after Fontan", "Obligate WPW in all cases", "Isolated sinus tachycardia only"], "answer": 0, "explanation": "Abnormal conduction system in ccTGA predisposes to AV block. Why not the others: B. Atrial flutter only after Fontan — ccTGA is not necessarily Fontan physiology.; C. Obligate WPW in all cases — Accessory pathways are not universal.; D. Isolated sinus tachycardia only — Does not explain progressive AV conduction disease.", "pearl": "Abnormal conduction system in ccTGA predisposes to AV block.", "srcAnswer": "A"}, {"num": 78, "level": "Conceptual", "question": "A cyanotic neonate has PaO2 38 mmHg in room air and only 47 mmHg after 100% oxygen; lung exam relatively clear. Interpretation?", "options": ["Definitive proof of isolated pneumonia", "Critical cyanotic CHD or PPHN warrants urgent echo", "Definitive proof of d-TGA only", "Excludes congenital heart disease"], "answer": 1, "explanation": "Poor hyperoxia response suggests shunt physiology; test does not distinguish CHD from PPHN reliably. Why not the others: A. Definitive proof of isolated pneumonia — Parenchymal disease may improve more with oxygen but is variable.; C. Definitive proof of d-TGA only — Other cyanotic lesions and PPHN also give poor response.; D. Excludes congenital heart disease — Low response increases concern rather than excludes.", "pearl": "Poor hyperoxia response suggests shunt physiology; test does not distinguish CHD from PPHN reliably.", "srcAnswer": "B"}, {"num": 79, "level": "Integrated", "question": "An unrepaired large VSD adolescent now has cyanosis, high PVR and bidirectional shunt. Best interpretation?", "options": ["Isolated pulmonary venous hypertension from mitral stenosis", "Eisenmenger physiology from advanced pulmonary vascular disease", "Small restrictive VSD without pulmonary hypertension", "Uncomplicated left-to-right shunt suitable for immediate closure"], "answer": 1, "explanation": "Long-standing shunt can reverse/bidirectional with irreversible high PVR. Why not the others: A. Isolated pulmonary venous hypertension from mitral stenosis — Different primary physiology.; C. Small restrictive VSD without pulmonary hypertension — Would not cause cyanosis and severe PVR rise.; D. Uncomplicated left-to-right shunt suitable for immediate closure — Closure may be dangerous in advanced Eisenmenger.", "pearl": "Long-standing shunt can reverse/bidirectional with irreversible high PVR.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 4',href:'Day21/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet4_Q61-79_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 61–79</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
