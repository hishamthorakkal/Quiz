<script>
const quiz=[{"num": 99, "level": "Clinical", "question": "A child with TOF has classic chest radiograph silhouette. Expected?", "options": ["Boot-shaped heart with pulmonary oligemia", "Globular cardiomegaly with massive effusion", "Snowman sign", "Egg-on-string silhouette with pulmonary plethora"], "answer": 0, "explanation": "RVH lifts apex and concave PA segment; reduced lung flow. Why not the others: B. Globular cardiomegaly with massive effusion — Not typical uncomplicated TOF.; C. Snowman sign — Supracardiac TAPVC in older infant.; D. Egg-on-string silhouette with pulmonary plethora — Classically d-TGA.", "pearl": "RVH lifts apex and concave PA segment; reduced lung flow.", "srcAnswer": "A"}, {"num": 100, "level": "Conceptual", "question": "A cyanotic neonate has narrow mediastinum and oval cardiac silhouette on CXR. Classic association?", "options": ["Supracardiac TAPVC snowman", "TOF boot shape", "Ebstein wall-to-wall heart", "d-TGA egg-on-string configuration"], "answer": 3, "explanation": "Narrow superior mediastinum and oval heart are classic TGA clues. Why not the others: A. Supracardiac TAPVC snowman — Vertical vein/SVC enlargement in older patient.; B. TOF boot shape — RVH and concave PA segment produce boot heart.; C. Ebstein wall-to-wall heart — Massive right atrial enlargement produces box-shaped heart.", "pearl": "Narrow superior mediastinum and oval heart are classic TGA clues.", "srcAnswer": "D"}, {"num": 101, "level": "High", "question": "An older infant with unobstructed supracardiac TAPVC develops snowman/figure-of-eight CXR. Which structure creates upper contour?", "options": ["Left ventricular aneurysm", "Vertical vein, innominate vein and SVC dilation", "Descending aortic coarctation notch", "Pulmonary valve annulus dilation alone"], "answer": 1, "explanation": "Enlarged anomalous venous pathway forms upper snowman silhouette. Why not the others: A. Left ventricular aneurysm — Not upper venous contour.; C. Descending aortic coarctation notch — Rib notching is different sign.; D. Pulmonary valve annulus dilation alone — Does not form classic snowman.", "pearl": "Enlarged anomalous venous pathway forms upper snowman silhouette.", "srcAnswer": "B"}, {"num": 102, "level": "Clinical", "question": "A harsh crescendo-decrescendo systolic murmur at RUSB radiates to carotids, with delayed carotid upstroke. Most likely?", "options": ["Significant aortic stenosis", "Pulmonary stenosis", "PDA", "Mitral regurgitation"], "answer": 0, "explanation": "LVOT obstruction produces carotid radiation and delayed pulse. Why not the others: B. Pulmonary stenosis — Usually LUSB and back radiation.; C. PDA — Continuous left infraclavicular murmur.; D. Mitral regurgitation — Holosystolic apical murmur to axilla.", "pearl": "LVOT obstruction produces carotid radiation and delayed pulse.", "srcAnswer": "A"}, {"num": 103, "level": "Recall", "question": "A small restrictive VSD has a loud high-pitched holosystolic murmur. Why can it be louder than large VSD?", "options": ["Small VSD necessarily causes more pulmonary hypertension", "Higher pressure gradient through small defect creates turbulent jet", "Small VSD always has right-to-left flow", "All large VSDs are silent because PVR is always zero"], "answer": 1, "explanation": "Loudness does not linearly track shunt size. Why not the others: A. Small VSD necessarily causes more pulmonary hypertension — Often large nonrestrictive VSD has greater hemodynamic burden.; C. Small VSD always has right-to-left flow — Typically restrictive left-to-right flow.; D. All large VSDs are silent because PVR is always zero — Not correct physiologic explanation.", "pearl": "Loudness does not linearly track shunt size.", "srcAnswer": "B"}, {"num": 104, "level": "Clinical", "question": "A continuous machinery murmur is loudest at left infraclavicular area. Hemodynamic origin?", "options": ["Persistent aorta-to-PA pressure gradient in systole and diastole", "Only atrial shunt during diastole", "Mitral regurgitation throughout systole", "Only RVOT ejection during systole"], "answer": 0, "explanation": "Ductal flow occurs across both phases. Why not the others: B. Only atrial shunt during diastole — ASD has no typical machinery murmur.; C. Mitral regurgitation throughout systole — Apical holosystolic rather than continuous.; D. Only RVOT ejection during systole — Pulmonary stenosis is systolic.", "pearl": "Ductal flow occurs across both phases.", "srcAnswer": "A"}, {"num": 105, "level": "Integrated", "question": "A cyanotic neonate has preductal saturation 96% and postductal 82% with labile oxygenation. Interpretation?", "options": ["Confirms normal transition", "Differential ductal shunting suggests PPHN or ductal physiology; urgent echo needed", "Rules out pulmonary hypertension", "Confirms isolated ASD"], "answer": 1, "explanation": "Pre/post difference can reflect right-to-left ductal flow and is not diagnostic alone. Why not the others: A. Confirms normal transition — Large sustained gap is abnormal.; C. Rules out pulmonary hypertension — PPHN is a major differential.; D. Confirms isolated ASD — ASD does not typically cause differential cyanosis.", "pearl": "Pre/post difference can reflect right-to-left ductal flow and is not diagnostic alone.", "srcAnswer": "B"}, {"num": 106, "level": "Clinical", "question": "A child with severe valvar pulmonary stenosis has RV pressure overload. Expected auscultatory clue?", "options": ["Systolic ejection murmur at LUSB with possible click", "Holosystolic apex-to-axilla murmur", "Continuous machinery murmur below left clavicle", "Diastolic rumble at apex"], "answer": 0, "explanation": "Pulmonary valve obstruction creates systolic turbulence. Why not the others: B. Holosystolic apex-to-axilla murmur — Mitral regurgitation.; C. Continuous machinery murmur below left clavicle — PDA pattern.; D. Diastolic rumble at apex — Mitral stenosis.", "pearl": "Pulmonary valve obstruction creates systolic turbulence.", "srcAnswer": "A"}, {"num": 107, "level": "Clinical", "question": "A child has measured QT 400 ms at RR 1.00 second. Bazett QTc equals?", "options": ["600 ms", "500 ms", "400 ms", "320 ms"], "answer": 2, "explanation": "Square root of 1 is 1, so corrected and measured QT coincide. Why not the others: A. 600 ms — Not supported by RR 1 s.; B. 500 ms — Would require shorter RR or longer measured QT.; D. 320 ms — Would require RR greater than 1 s under Bazett.", "pearl": "Square root of 1 is 1, so corrected and measured QT coincide.", "srcAnswer": "C"}, {"num": 108, "level": "Clinical", "question": "An infant with previously unrecognized SVT has poor feeding, hepatomegaly and pallor but no murmur. Best unifying diagnosis?", "options": ["Isolated bronchiolitis without cardiac involvement", "Tachycardia-mediated heart failure", "Small ASD causing profound failure", "Isolated pulmonary valve stenosis"], "answer": 1, "explanation": "Sustained rapid SVT can cause HF even without structural murmur. Why not the others: A. Isolated bronchiolitis without cardiac involvement — Does not explain sustained fixed tachycardia with hepatomegaly.; C. Small ASD causing profound failure — Small ASD rarely causes acute infant HF.; D. Isolated pulmonary valve stenosis — Would usually yield characteristic murmur and RV load.", "pearl": "Sustained rapid SVT can cause HF even without structural murmur.", "srcAnswer": "B"}, {"num": 109, "level": "High", "question": "A narrow-complex tachycardia at 240/min has retrograde P deflection immediately after QRS. Most likely timing relationship?", "options": ["Complete AV block", "Sinus tachycardia with normal P before QRS", "Long-RP automatic atrial tachycardia", "Short-RP tachycardia compatible with AVRT/AVNRT"], "answer": 3, "explanation": "Retrograde P shortly after QRS supports AV-node-dependent reentry. Why not the others: A. Complete AV block — Independent atrial and ventricular rates rather than retrograde 1:1.; B. Sinus tachycardia with normal P before QRS — P precedes QRS and has normal axis.; C. Long-RP automatic atrial tachycardia — P usually further from preceding QRS.", "pearl": "Retrograde P shortly after QRS supports AV-node-dependent reentry.", "srcAnswer": "D"}, {"num": 110, "level": "Clinical", "question": "ECG shows atrial flutter at 300/min and ventricular response 100/min. Conduction ratio?", "options": ["2:1 conduction", "4:1 conduction", "3:1 AV conduction", "1:1 conduction"], "answer": 2, "explanation": "300 divided by 100 equals 3 atrial impulses per QRS. Why not the others: A. 2:1 conduction — Would give ventricular rate 150/min.; B. 4:1 conduction — Would give ventricular rate 75/min.; D. 1:1 conduction — Would give ventricular rate 300/min.", "pearl": "300 divided by 100 equals 3 atrial impulses per QRS.", "srcAnswer": "C"}, {"num": 111, "level": "Conceptual", "question": "A 35-kg child has refractory VF and escalating shock energy. AHA upper limit is?", "options": ["No more than 10 J/kg or adult maximum, whichever is lower", "Exactly 2 J/kg for every shock", "Unlimited escalation until sinus rhythm", "Always 20 J/kg in refractory VF"], "answer": 0, "explanation": "AHA permits escalation but caps at 10 J/kg/adult maximum. Why not the others: B. Exactly 2 J/kg for every shock — Subsequent energy commonly rises to 4 J/kg.; C. Unlimited escalation until sinus rhythm — Exceeds safety ceiling.; D. Always 20 J/kg in refractory VF — Above pediatric ceiling.", "pearl": "AHA permits escalation but caps at 10 J/kg/adult maximum.", "srcAnswer": "A"}, {"num": 112, "level": "Clinical", "question": "A 12-kg child has vagally mediated bradycardia requiring atropine under standard PALS dose 0.02 mg/kg. Dose?", "options": ["0.024 mg IV/IO", "0.12 mg IV/IO", "0.24 mg IV/IO", "2.4 mg IV/IO"], "answer": 2, "explanation": "12 times 0.02 equals 0.24 mg. Why not the others: A. 0.024 mg IV/IO — Tenfold underdose.; B. 0.12 mg IV/IO — 0.01 mg/kg is lower than atropine dose.; D. 2.4 mg IV/IO — Tenfold overdose.", "pearl": "12 times 0.02 equals 0.24 mg.", "srcAnswer": "C"}, {"num": 113, "level": "High", "question": "A child with symptomatic complete AV block remains unstable despite oxygenation, ventilation and medication. Specialist emergency consideration?", "options": ["Defibrillation for every QRS complex", "Transcutaneous pacing as bridge to definitive pacing", "Adenosine infusion", "Vagal maneuvers"], "answer": 1, "explanation": "Refractory symptomatic high-grade block may require temporary pacing. Why not the others: A. Defibrillation for every QRS complex — Not treatment of organized bradycardia with pulse.; C. Adenosine infusion — Further AV blockade is harmful.; D. Vagal maneuvers — Increase AV block rather than correct it.", "pearl": "Refractory symptomatic high-grade block may require temporary pacing.", "srcAnswer": "B"}, {"num": 114, "level": "Clinical", "question": "Stable SVT persists after vagal maneuver and appropriate adenosine. Most appropriate next step?", "options": ["Discharge without ECG or assessment", "Immediate permanent pacemaker in all patients", "Expert electrophysiology/cardiology consultation and rhythm-directed escalation", "Give adenosine continuously as maintenance infusion"], "answer": 2, "explanation": "AHA recommends expert input for drug-refractory stable SVT. Why not the others: A. Discharge without ECG or assessment — Persistent tachyarrhythmia needs evaluation.; B. Immediate permanent pacemaker in all patients — Pacing is not default SVT treatment.; D. Give adenosine continuously as maintenance infusion — Adenosine has ultrashort action and is not chronic infusion.", "pearl": "AHA recommends expert input for drug-refractory stable SVT.", "srcAnswer": "C"}, {"num": 115, "level": "Clinical", "question": "In d-TGA with restrictive atrial septum, why may PGE1 alone fail to normalize oxygenation?", "options": ["All d-TGA infants have complete pulmonary atresia", "Pulmonary veins drain to right atrium in all d-TGA", "PGE1 directly closes the foramen ovale", "Ductal patency may not provide sufficient intercirculatory mixing without atrial communication"], "answer": 3, "explanation": "Atrial septostomy may be required despite open ductus. Why not the others: A. All d-TGA infants have complete pulmonary atresia — Not typical.; B. Pulmonary veins drain to right atrium in all d-TGA — Not the defining anatomy.; C. PGE1 directly closes the foramen ovale — It does not close the atrial septum.", "pearl": "Atrial septostomy may be required despite open ductus.", "srcAnswer": "D"}, {"num": 116, "level": "Clinical", "question": "Why does unobstructed TAPVC usually require an interatrial communication for systemic output?", "options": ["Pulmonary veins normally connect to LA in TAPVC", "Aortic blood must cross PDA into left atrium", "Pulmonary venous blood returns to right atrium and must cross to left heart", "The VSD is always obligatory in TAPVC"], "answer": 2, "explanation": "Interatrial passage enables LV preload/systemic flow. Why not the others: A. Pulmonary veins normally connect to LA in TAPVC — By definition anomalous return bypasses LA.; B. Aortic blood must cross PDA into left atrium — Not normal systemic pathway.; D. The VSD is always obligatory in TAPVC — ASD/PFO is the usual required communication.", "pearl": "Interatrial passage enables LV preload/systemic flow.", "srcAnswer": "C"}, {"num": 117, "level": "High", "question": "A neonate with CoA becomes acidotic as duct closes. Why can lower-limb perfusion collapse?", "options": ["Ductus had supplied descending aortic flow beyond critical narrowing", "ASD spontaneously closes at 72 hours", "PDA was stealing blood from legs into PA in all cases", "Pulmonary veins become obstructed by duct closure"], "answer": 0, "explanation": "Closure removes alternative systemic route. Why not the others: B. ASD spontaneously closes at 72 hours — Not the mechanism.; C. PDA was stealing blood from legs into PA in all cases — Critical duct-dependent systemic flow has opposite function.; D. Pulmonary veins become obstructed by duct closure — Unrelated anatomy.", "pearl": "Closure removes alternative systemic route.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 6',href:'Day21/quiz6.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet6_Q99-117_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 6 — Wrong Answer Report</h1><p><b>Questions:</b> 99–117</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['6']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['6']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 6 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
