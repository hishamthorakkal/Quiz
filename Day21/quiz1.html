<script>
const quiz=[{"num": 1, "level": "Recall", "question": "A 3-month-old has an abrupt regular narrow-complex rate of 255/min, absent discernible sinus P waves and unchanged RR intervals despite calming. Most likely rhythm?", "options": ["AV re-entrant supraventricular tachycardia", "Atrial fibrillation", "Sinus tachycardia", "Multifocal atrial tachycardia"], "answer": 0, "explanation": "Abrupt fixed-rate narrow tachycardia in infancy commonly reflects AVRT. Why not the others: B. Atrial fibrillation — AF produces irregularly irregular ventricular intervals.; C. Sinus tachycardia — Sinus rate usually varies with stimulation and has normal P waves.; D. Multifocal atrial tachycardia — This is typically irregular with multiple P morphologies.", "pearl": "Abrupt fixed-rate narrow tachycardia in infancy commonly reflects AVRT.", "srcAnswer": "A"}, {"num": 2, "level": "Clinical", "question": "A febrile 5-year-old has HR 166/min, normal P before each QRS, gradual rate change with fever reduction. Best interpretation?", "options": ["Sinus tachycardia from physiologic stress", "AVNRT", "Ectopic atrial tachycardia", "Orthodromic AVRT"], "answer": 0, "explanation": "Normal P axis and rate variability with fever support sinus tachycardia. Why not the others: B. AVNRT — AVNRT is paroxysmal and generally not driven by gradual temperature change.; C. Ectopic atrial tachycardia — EAT has abnormal atrial activation/P axis and can be incessant.; D. Orthodromic AVRT — AVRT usually begins abruptly and has relatively fixed RR intervals.", "pearl": "Normal P axis and rate variability with fever support sinus tachycardia.", "srcAnswer": "A"}, {"num": 3, "level": "Clinical", "question": "A perfused 9-year-old has regular narrow SVT at 210/min, BP normal and no altered consciousness. First maneuver while monitored?", "options": ["Synchronized cardioversion", "Age-appropriate vagal maneuver", "Amiodarone infusion", "Unsynchronized defibrillation"], "answer": 1, "explanation": "Stable SVT merits vagal stimulation before medication. Why not the others: A. Synchronized cardioversion — Electrical treatment is prioritized for compromise or failed appropriate therapy.; C. Amiodarone infusion — Not the first maneuver for uncomplicated stable narrow SVT.; D. Unsynchronized defibrillation — This is for pulseless VT/VF, not perfusing narrow SVT.", "pearl": "Stable SVT merits vagal stimulation before medication.", "srcAnswer": "B"}, {"num": 4, "level": "Clinical", "question": "A 20-kg child with stable regular narrow SVT remains tachycardic after vagal maneuver. What first IV adenosine dose follows AHA 2025?", "options": ["1 mg rapid IV push", "4 mg rapid IV push followed by flush", "6 mg slow IV infusion", "2 mg rapid IV push followed by immediate flush"], "answer": 3, "explanation": "0.1 mg/kg times 20 kg equals 2 mg, below 6 mg cap. Why not the others: A. 1 mg rapid IV push — 0.05 mg/kg underdoses the AHA initial recommendation.; B. 4 mg rapid IV push followed by flush — 0.2 mg/kg is the usual second dose, not first.; C. 6 mg slow IV infusion — The drug needs rapid administration and is not routinely started at a fixed 6 mg for this weight.", "pearl": "0.1 mg/kg times 20 kg equals 2 mg, below 6 mg cap.", "srcAnswer": "D"}, {"num": 5, "level": "High", "question": "A 35-kg child has persistent regular SVT after an appropriate first adenosine dose. AHA 2025 repeat dose?", "options": ["12 mg slow IV infusion", "14 mg rapid IV push", "7 mg rapid IV push and flush", "3.5 mg rapid IV push"], "answer": 2, "explanation": "0.2 mg/kg times 35 kg equals 7 mg, below 12 mg maximum. Why not the others: A. 12 mg slow IV infusion — Even if capped, adenosine must be rapid; calculated second dose here is 7 mg.; B. 14 mg rapid IV push — This exceeds the 12 mg second-dose maximum.; D. 3.5 mg rapid IV push — 0.1 mg/kg is the initial, not repeat, dose.", "pearl": "0.2 mg/kg times 35 kg equals 7 mg, below 12 mg maximum.", "srcAnswer": "C"}, {"num": 6, "level": "Clinical", "question": "An 80-kg adolescent with regular narrow SVT needs the first AHA 2025 adenosine dose. Best dose?", "options": ["4 mg rapid IV push", "6 mg rapid IV push", "8 mg rapid IV push", "12 mg rapid IV push"], "answer": 1, "explanation": "0.1 mg/kg gives 8 mg but first-dose maximum is 6 mg. Why not the others: A. 4 mg rapid IV push — Not the weight-calculated dose or cap.; C. 8 mg rapid IV push — Fails the first-dose cap.; D. 12 mg rapid IV push — This is the maximum for the second dose, not the first.", "pearl": "0.1 mg/kg gives 8 mg but first-dose maximum is 6 mg.", "srcAnswer": "B"}, {"num": 7, "level": "Clinical", "question": "A 7-kg infant has narrow SVT at 290/min, hypotension and poor perfusion; IV access is not yet available. Immediate definitive rhythm treatment?", "options": ["Synchronized cardioversion 0.5–1 J/kg", "Oral propranolol loading", "Repeated vagal maneuvers until access is secured", "Unsynchronized shock 2 J/kg"], "answer": 0, "explanation": "Compromise and no immediate access favor prompt synchronized cardioversion. Why not the others: B. Oral propranolol loading — Oral maintenance therapy is inappropriate for shock.; C. Repeated vagal maneuvers until access is secured — They must not delay cardioversion in shock.; D. Unsynchronized shock 2 J/kg — Defibrillation is for pulseless VT/VF, not organized perfusing SVT.", "pearl": "Compromise and no immediate access favor prompt synchronized cardioversion.", "srcAnswer": "A"}, {"num": 8, "level": "Clinical", "question": "A 12-kg child with unstable SVT remains tachycardic after synchronized cardioversion at 1 J/kg. Next electrical dose?", "options": ["4 J/kg unsynchronized", "0.1 J/kg synchronized", "2 J/kg synchronized", "10 J/kg unsynchronized"], "answer": 2, "explanation": "AHA escalation after 0.5–1 J/kg is 2 J/kg. Why not the others: A. 4 J/kg unsynchronized — This changes modality and follows a pulseless shockable pathway.; B. 0.1 J/kg synchronized — This is below recommended initial energy.; D. 10 J/kg unsynchronized — This is a defibrillation ceiling, not next SVT dose.", "pearl": "AHA escalation after 0.5–1 J/kg is 2 J/kg.", "srcAnswer": "C"}, {"num": 9, "level": "High", "question": "A stable child has regular monomorphic wide-complex tachycardia; expert help is at bedside. Which drug may be considered diagnostically under AHA 2025?", "options": ["Digoxin empirically for any wide tachycardia", "Verapamil empirically for any wide tachycardia", "Adenosine for irregular polymorphic wide tachycardia", "Adenosine with monitoring and expert consultation"], "answer": 3, "explanation": "Regular monomorphic wide-complex rhythm is the limited circumstance where adenosine can help. Why not the others: A. Digoxin empirically for any wide tachycardia — Accessory-pathway conduction and rhythm uncertainty make this unsafe.; B. Verapamil empirically for any wide tachycardia — Negative inotropy and diagnostic uncertainty create risk.; C. Adenosine for irregular polymorphic wide tachycardia — Irregular wide rhythms can be pre-excited AF and AV-node blockade is dangerous.", "pearl": "Regular monomorphic wide-complex rhythm is the limited circumstance where adenosine can help.", "srcAnswer": "D"}, {"num": 10, "level": "Clinical", "question": "An adolescent with known WPW develops irregular very rapid wide-complex tachycardia and hypotension. Best action?", "options": ["IV verapamil bolus", "IV digoxin loading", "Urgent synchronized electrical cardioversion with expert support", "IV adenosine bolus"], "answer": 2, "explanation": "Unstable pre-excited AF requires electrical rhythm control, avoiding AV nodal blockers. Why not the others: A. IV verapamil bolus — AV nodal blockade may precipitate ventricular fibrillation.; B. IV digoxin loading — It can facilitate accessory-pathway conduction in pre-excited AF.; D. IV adenosine bolus — AV nodal blockade may promote accessory-pathway conduction in pre-excited AF.", "pearl": "Unstable pre-excited AF requires electrical rhythm control, avoiding AV nodal blockers.", "srcAnswer": "C"}, {"num": 11, "level": "Clinical", "question": "An asymptomatic 12-year-old has short PR, delta wave and widened QRS in sinus rhythm. Diagnosis?", "options": ["First-degree AV block", "Complete right bundle branch block alone", "Ventricular pre-excitation pattern", "Long-QT syndrome"], "answer": 2, "explanation": "Delta wave with short PR is the classic WPW ECG pattern. Why not the others: A. First-degree AV block — PR would be prolonged, not short.; B. Complete right bundle branch block alone — Does not explain the delta upstroke and short PR.; D. Long-QT syndrome — Defined by repolarization prolongation rather than delta wave.", "pearl": "Delta wave with short PR is the classic WPW ECG pattern.", "srcAnswer": "C"}, {"num": 12, "level": "Conceptual", "question": "A child with pre-excitation history develops a regular narrow QRS tachycardia. Which circuit direction most likely explains the narrow QRS?", "options": ["Automatic ventricular focus", "Antegrade conduction through accessory pathway and retrograde AV node", "Atrial flutter with fixed 2:1 block", "Antegrade conduction through AV node and retrograde accessory pathway"], "answer": 3, "explanation": "Orthodromic AVRT activates ventricles normally through His-Purkinje system. Why not the others: A. Automatic ventricular focus — This produces ventricular activation outside normal His-Purkinje conduction.; B. Antegrade conduction through accessory pathway and retrograde AV node — Antidromic AVRT is typically wide-complex.; C. Atrial flutter with fixed 2:1 block — Flutter is an intra-atrial macroreentry circuit, not orthodromic AVRT.", "pearl": "Orthodromic AVRT activates ventricles normally through His-Purkinje system.", "srcAnswer": "D"}, {"num": 13, "level": "High", "question": "A WPW patient has regular wide-complex tachycardia with pre-excited ventricular activation. Most plausible mechanism?", "options": ["Antegrade AV nodal and retrograde accessory-pathway conduction", "Antegrade accessory-pathway and retrograde AV nodal conduction", "Atrial ectopic focus with normal conduction", "Sinus tachycardia with rate-related aberrancy"], "answer": 1, "explanation": "Antidromic AVRT is wide because ventricles are activated through the accessory pathway. Why not the others: A. Antegrade AV nodal and retrograde accessory-pathway conduction — That is orthodromic AVRT, typically narrow.; C. Atrial ectopic focus with normal conduction — Would not inherently pre-excite the ventricle.; D. Sinus tachycardia with rate-related aberrancy — Does not explain an accessory-pathway reentry mechanism when documented.", "pearl": "Antidromic AVRT is wide because ventricles are activated through the accessory pathway.", "srcAnswer": "B"}, {"num": 14, "level": "Integrated", "question": "A 15-year-old with abrupt narrow SVT has retrograde P embedded at end of QRS and dual AV nodal pathways on EP study. Most likely?", "options": ["Ectopic atrial tachycardia", "Atrial flutter", "AV nodal reentrant tachycardia", "Permanent junctional reciprocating tachycardia"], "answer": 2, "explanation": "Dual AV nodal pathways support AVNRT, commoner in adolescents than infants. Why not the others: A. Ectopic atrial tachycardia — Usually abnormal P axis with an atrial automatic focus.; B. Atrial flutter — Intra-atrial macroreentry shows flutter waves rather than dual-node mechanism.; D. Permanent junctional reciprocating tachycardia — Uses a slowly conducting accessory pathway and often long-RP tachycardia.", "pearl": "Dual AV nodal pathways support AVNRT, commoner in adolescents than infants.", "srcAnswer": "C"}, {"num": 15, "level": "Clinical", "question": "An infant has incessant long-RP tachycardia, inferior-lead negative P waves, moderate rate and dilated LV. Best mechanism?", "options": ["Permanent junctional reciprocating tachycardia", "Sinus tachycardia", "Atrial fibrillation", "Typical AVNRT"], "answer": 0, "explanation": "A decremental retrograde accessory pathway causes incessant long-RP SVT and cardiomyopathy. Why not the others: B. Sinus tachycardia — Normal sinus P axis and physiologic variability are expected.; C. Atrial fibrillation — Irregular ventricular rhythm, not fixed long-RP tachycardia.; D. Typical AVNRT — Usually paroxysmal short-RP tachycardia.", "pearl": "A decremental retrograde accessory pathway causes incessant long-RP SVT and cardiomyopathy.", "srcAnswer": "A"}, {"num": 16, "level": "Clinical", "question": "A 2-year-old with incessant abnormal-P-axis tachycardia has transient AV block during adenosine, but atrial activity persists. Diagnosis?", "options": ["AVRT", "Ectopic atrial tachycardia", "Sinus arrest", "Typical AVNRT"], "answer": 1, "explanation": "Adenosine may unmask atrial activity without terminating an automatic atrial focus. Why not the others: A. AVRT — AV-node dependent reentry usually terminates with AV block.; C. Sinus arrest — Atrial activity would pause, not continue ectopically.; D. Typical AVNRT — AV-node dependent circuit generally terminates with adenosine.", "pearl": "Adenosine may unmask atrial activity without terminating an automatic atrial focus.", "srcAnswer": "B"}, {"num": 17, "level": "High", "question": "A newborn has atrial rate 360/min, ventricular rate 180/min, sawtooth flutter waves. Mechanism?", "options": ["Sinus tachycardia with 1:1 conduction", "Complete AV block", "Atrial flutter with 2:1 AV conduction", "AVRT with 1:1 conduction"], "answer": 2, "explanation": "Atrial 360 and ventricular 180 indicate 2:1 block. Why not the others: A. Sinus tachycardia with 1:1 conduction — Sinus P waves and atrial rate 180 would be expected.; B. Complete AV block — Ventricular escape would be much slower and independent.; D. AVRT with 1:1 conduction — Atrial and ventricular rates generally track together.", "pearl": "Atrial 360 and ventricular 180 indicate 2:1 block.", "srcAnswer": "C"}, {"num": 18, "level": "Recall", "question": "In a stable neonate with suspected flutter, adenosine produces transient AV block and reveals sawtooth atrial waves without terminating them. Interpretation?", "options": ["Evidence of sinus tachycardia", "Proof of ventricular tachycardia", "Definitive cure of atrial flutter", "AV nodal block unmasks atrial flutter"], "answer": 3, "explanation": "Adenosine may reveal flutter waves without terminating intra-atrial reentry. Why not the others: A. Evidence of sinus tachycardia — Sinus tachycardia does not produce persistent sawtooth waves.; B. Proof of ventricular tachycardia — Atrial flutter waves and transient AV block favor atrial origin.; C. Definitive cure of atrial flutter — Persistent atrial waves show arrhythmia remains.", "pearl": "Adenosine may reveal flutter waves without terminating intra-atrial reentry.", "srcAnswer": "D"}, {"num": 19, "level": "Clinical", "question": "A 2-month-old after complex congenital cardiac surgery develops narrow tachycardia with AV dissociation and fever; HR 210. Most likely?", "options": ["Orthodromic AVRT", "Junctional ectopic tachycardia", "Atrial flutter", "Sinus tachycardia"], "answer": 1, "explanation": "Postoperative JET is automatic junctional tachycardia with AV dissociation. Why not the others: A. Orthodromic AVRT — Usually 1:1 VA relationship in reentry.; C. Atrial flutter — Atrial rate generally faster with flutter waves.; D. Sinus tachycardia — Sinus P waves precede QRS and track ventricles.", "pearl": "Postoperative JET is automatic junctional tachycardia with AV dissociation.", "srcAnswer": "B"}, {"num": 20, "level": "Clinical", "question": "A child develops postoperative JET with low cardiac output. Best initial supportive bundle?", "options": ["High-dose catecholamine escalation without review", "Repeated adenosine alone until sustained termination", "Immediate long-term oral digoxin without monitoring", "Optimize sedation, temperature, electrolytes and hemodynamics with specialist rhythm plan"], "answer": 3, "explanation": "Cooling/trigger control and supportive care address automatic JET physiology. Why not the others: A. High-dose catecholamine escalation without review — Catecholamines can aggravate automatic tachycardia.; B. Repeated adenosine alone until sustained termination — JET is not usually AV-node dependent and adenosine may only clarify diagnosis.; C. Immediate long-term oral digoxin without monitoring — Does not stabilize acute low-output JET.", "pearl": "Cooling/trigger control and supportive care address automatic JET physiology.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 1',href:'Day21/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet1_Q1-20_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–20</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
