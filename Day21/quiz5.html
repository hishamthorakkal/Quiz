@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<h1>Day 21 — Quiz 5</h1>

<script>
const quiz=[{"num": 80, "level": "Clinical", "question": "Why do large post-tricuspid shunts become symptomatic after early neonatal weeks?", "options": ["Ductus always closes after 6 months", "Systemic resistance falls below pulmonary resistance permanently", "Pulmonary vascular resistance falls, increasing pulmonary overcirculation", "LV becomes unable to contract in all neonates"], "answer": 2, "explanation": "Declining PVR raises left-to-right flow through large VSD/PDA. Why not the others: A. Ductus always closes after 6 months — Duct closure timing does not explain VSD symptoms.; B. Systemic resistance falls below pulmonary resistance permanently — Not usual transition.; D. LV becomes unable to contract in all neonates — Not the primary physiological trigger.", "pearl": "Declining PVR raises left-to-right flow through large VSD/PDA.", "srcAnswer": "C"}, {"num": 81, "level": "High", "question": "A 3-month-old with VSD has tachypnea, sweating with feeds, poor weight gain and hepatomegaly. Best syndrome?", "options": ["Simple viral URI without hemodynamic effect", "Congestive heart failure from pulmonary overcirculation", "Primary asthma alone", "Isolated renal edema without cardiac load"], "answer": 1, "explanation": "Feeding diaphoresis, tachypnea and hepatomegaly fit infant HF. Why not the others: A. Simple viral URI without hemodynamic effect — Does not account for persistent growth failure.; C. Primary asthma alone — Does not explain hepatomegaly and shunt history.; D. Isolated renal edema without cardiac load — No nephrotic signs supplied.", "pearl": "Feeding diaphoresis, tachypnea and hepatomegaly fit infant HF.", "srcAnswer": "B"}, {"num": 82, "level": "Clinical", "question": "A child with dilated cardiomyopathy has pulmonary crackles, hepatomegaly and edema but reasonable perfusion. Immediate symptom-directed drug class?", "options": ["High-volume saline bolus without reassessment", "Routine systemic vasoconstrictor in well-perfused child", "Adenosine as diuretic substitute", "Loop diuretic with renal/electrolyte monitoring"], "answer": 3, "explanation": "Relieves congestion while longer-term HF strategy is assessed. Why not the others: A. High-volume saline bolus without reassessment — May worsen fluid overload.; B. Routine systemic vasoconstrictor in well-perfused child — May worsen afterload unnecessarily.; C. Adenosine as diuretic substitute — Antiarrhythmic does not remove congestion.", "pearl": "Relieves congestion while longer-term HF strategy is assessed.", "srcAnswer": "D"}, {"num": 83, "level": "Clinical", "question": "A stable child has LV systolic dysfunction without LV outflow obstruction, BP adequate and persistent HF. Why consider ACE inhibition?", "options": ["Reduce systemic afterload and adverse remodeling", "Close a large PDA pharmacologically in older child", "Increase dynamic LVOT obstruction in HCM intentionally", "Treat ventricular fibrillation directly"], "answer": 0, "explanation": "Afterload reduction can improve forward flow in suitable systolic HF. Why not the others: B. Close a large PDA pharmacologically in older child — ACE inhibition does not close structural shunt.; C. Increase dynamic LVOT obstruction in HCM intentionally — Afterload reduction may worsen obstructive physiology.; D. Treat ventricular fibrillation directly — ACE inhibitors are not acute antiarrhythmics.", "pearl": "Afterload reduction can improve forward flow in suitable systolic HF.", "srcAnswer": "A"}, {"num": 84, "level": "Clinical", "question": "A previously healthy 9-year-old develops viral prodrome, chest pain, high troponin, global LV dysfunction and arrhythmias. Most likely?", "options": ["Uncomplicated ASD", "Isolated costochondritis", "Acute myocarditis", "Mild pulmonary stenosis"], "answer": 2, "explanation": "Inflammatory myocardial injury can cause biomarker rise, dysfunction and arrhythmias. Why not the others: A. Uncomplicated ASD — Not typical acute troponin-positive illness.; B. Isolated costochondritis — Does not cause LV dysfunction/troponin rise.; D. Mild pulmonary stenosis — Does not explain acute myocardial injury.", "pearl": "Inflammatory myocardial injury can cause biomarker rise, dysfunction and arrhythmias.", "srcAnswer": "C"}, {"num": 85, "level": "High", "question": "A 7-year-old with suspected fulminant myocarditis has cool extremities, low EF and lactate 6 mmol/L. Best next disposition?", "options": ["Give repeated large fluid boluses without reassessment", "Exercise stress testing immediately", "PICU/cardiac center for monitored vasoactive and mechanical-support evaluation", "Discharge after oral diuretic prescription"], "answer": 2, "explanation": "Fulminant myocarditis may rapidly deteriorate and need ECMO/advanced support. Why not the others: A. Give repeated large fluid boluses without reassessment — Can worsen failing ventricular function.; B. Exercise stress testing immediately — Contraindicated in acute shock.; D. Discharge after oral diuretic prescription — Shock is unsafe for outpatient care.", "pearl": "Fulminant myocarditis may rapidly deteriorate and need ECMO/advanced support.", "srcAnswer": "C"}, {"num": 86, "level": "Recall", "question": "A stable adolescent has suspected myocarditis and echo LV dysfunction; which imaging can support tissue characterization?", "options": ["ECG alone", "Pulse oximetry alone", "Plain CXR alone", "Cardiac MRI using updated Lake Louise framework"], "answer": 3, "explanation": "CMR assesses edema and nonischemic injury patterns. Why not the others: A. ECG alone — May be abnormal but cannot characterize tissue.; B. Pulse oximetry alone — Does not establish myocardial inflammation.; C. Plain CXR alone — Shows size/congestion but not myocardial tissue inflammation.", "pearl": "CMR assesses edema and nonischemic injury patterns.", "srcAnswer": "D"}, {"num": 87, "level": "Clinical", "question": "A child has dilated LV, reduced EF and functional mitral regurgitation. Cardiomyopathy phenotype?", "options": ["Restrictive cardiomyopathy", "Dilated cardiomyopathy", "Arrhythmogenic RV cardiomyopathy", "Hypertrophic cardiomyopathy"], "answer": 1, "explanation": "Dilation with systolic dysfunction defines DCM phenotype. Why not the others: A. Restrictive cardiomyopathy — Impaired filling and biatrial enlargement with relatively preserved cavity size.; C. Arrhythmogenic RV cardiomyopathy — Predominantly RV arrhythmogenic disease.; D. Hypertrophic cardiomyopathy — Increased wall thickness without required dilation dominates.", "pearl": "Dilation with systolic dysfunction defines DCM phenotype.", "srcAnswer": "B"}, {"num": 88, "level": "Clinical", "question": "An adolescent has asymmetric septal hypertrophy, systolic anterior mitral motion and dynamic LVOT gradient. Diagnosis?", "options": ["Obstructive hypertrophic cardiomyopathy", "Dilated cardiomyopathy", "Restrictive cardiomyopathy", "Isolated coarctation"], "answer": 0, "explanation": "Septal hypertrophy plus SAM and dynamic gradient fit HOCM. Why not the others: B. Dilated cardiomyopathy — Ventricular dilation and reduced systolic function predominate.; C. Restrictive cardiomyopathy — Marked diastolic restriction without asymmetric hypertrophy.; D. Isolated coarctation — Can cause LVH but not classic SAM dynamic obstruction.", "pearl": "Septal hypertrophy plus SAM and dynamic gradient fit HOCM.", "srcAnswer": "A"}, {"num": 89, "level": "Conceptual", "question": "In obstructive HCM, why can dehydration worsen outflow gradient?", "options": ["Increased preload always worsens obstruction", "It closes the ductus arteriosus", "Reduced preload narrows LV cavity and increases dynamic obstruction", "It causes acute pulmonary valve stenosis"], "answer": 2, "explanation": "Lower filling can accentuate SAM-related LVOT gradient. Why not the others: A. Increased preload always worsens obstruction — Opposite typical dynamic physiology.; B. It closes the ductus arteriosus — Unrelated to adolescent HCM gradient.; D. It causes acute pulmonary valve stenosis — Anatomically unrelated.", "pearl": "Lower filling can accentuate SAM-related LVOT gradient.", "srcAnswer": "C"}, {"num": 90, "level": "Clinical", "question": "A child has marked biatrial enlargement, nondilated ventricles and severe diastolic dysfunction. Most likely?", "options": ["Restrictive cardiomyopathy", "Dilated cardiomyopathy", "TOF", "Isolated ASD"], "answer": 0, "explanation": "Poor compliance with large atria and relatively nondilated ventricles suggests RCM. Why not the others: B. Dilated cardiomyopathy — Would show enlarged ventricles with systolic failure.; C. TOF — RVOT obstruction and VSD dominate.; D. Isolated ASD — Usually RV enlargement rather than severe biventricular restriction.", "pearl": "Poor compliance with large atria and relatively nondilated ventricles suggests RCM.", "srcAnswer": "A"}, {"num": 91, "level": "Clinical", "question": "An infant has TR jet suggesting elevated RV systolic pressure, RV enlargement and septal flattening. What does echo primarily estimate?", "options": ["Coronary artery stenosis severity", "Probability/severity indicators of pulmonary hypertension", "Definitive histology of pulmonary arterioles", "Direct definitive PVR measurement"], "answer": 1, "explanation": "Echo supports PH assessment but catheterization is reference for hemodynamics. Why not the others: A. Coronary artery stenosis severity — Not determined by TR jet.; C. Definitive histology of pulmonary arterioles — Requires tissue, not echo.; D. Direct definitive PVR measurement — Echo does not directly quantify PVR reliably.", "pearl": "Echo supports PH assessment but catheterization is reference for hemodynamics.", "srcAnswer": "B"}, {"num": 92, "level": "Integrated", "question": "A child with suspected pulmonary arterial hypertension needs definitive pressure/PVR assessment before targeted therapy. Reference test?", "options": ["Routine spirometry alone", "Chest radiograph alone", "Right heart catheterization in expert center", "Pulse oximetry alone"], "answer": 2, "explanation": "Invasive hemodynamics define mPAP, wedge and PVR when safe/indicated. Why not the others: A. Routine spirometry alone — Evaluates lung mechanics, not invasive pulmonary hemodynamics.; B. Chest radiograph alone — Cannot measure pulmonary vascular resistance.; D. Pulse oximetry alone — Does not define pressure or wedge.", "pearl": "Invasive hemodynamics define mPAP, wedge and PVR when safe/indicated.", "srcAnswer": "C"}, {"num": 93, "level": "High", "question": "A postoperative cardiac child acutely desaturates, systemic BP falls and RV pressure rises. First crisis response?", "options": ["Stop all oxygen immediately", "Large uncontrolled fluid boluses regardless RV status", "Deliberate hypoventilation to raise CO2", "Optimize oxygenation, ventilation, sedation and correct acidosis while activating PH rescue plan"], "answer": 3, "explanation": "Avoiding hypoxia, hypercarbia and acidosis reduces PVR; targeted vasodilator support may follow. Why not the others: A. Stop all oxygen immediately — Hypoxia can worsen pulmonary vasoconstriction.; B. Large uncontrolled fluid boluses regardless RV status — May aggravate RV failure.; C. Deliberate hypoventilation to raise CO2 — Hypercarbia raises PVR.", "pearl": "Avoiding hypoxia, hypercarbia and acidosis reduces PVR; targeted vasodilator support may follow.", "srcAnswer": "D"}, {"num": 94, "level": "Clinical", "question": "A 2-day-old with duct-dependent systemic circulation deteriorates as duct closes. What does alprostadil accomplish?", "options": ["Maintains/reopens ductal patency as bridge to intervention", "Directly cures obstructed TAPVC", "Closes PDA to reduce pulmonary runoff", "Repairs coarctation anatomy"], "answer": 0, "explanation": "PGE1 can sustain duct-dependent flow, with apnea monitoring. Why not the others: B. Directly cures obstructed TAPVC — Cannot relieve pulmonary venous obstruction.; C. Closes PDA to reduce pulmonary runoff — Opposite action.; D. Repairs coarctation anatomy — Does not eliminate structural narrowing.", "pearl": "PGE1 can sustain duct-dependent flow, with apnea monitoring.", "srcAnswer": "A"}, {"num": 95, "level": "Clinical", "question": "During PGE1 infusion for critical CHD, which adverse effect needs immediate readiness?", "options": ["Permanent AV block as obligatory toxicity", "Apnea requiring ventilatory support", "Pulmonary valve rupture", "Severe hyperglycemia in all patients"], "answer": 1, "explanation": "PGE1 can cause apnea, especially in neonates. Why not the others: A. Permanent AV block as obligatory toxicity — Not expected principal adverse effect.; C. Pulmonary valve rupture — Not an infusion effect.; D. Severe hyperglycemia in all patients — Not hallmark.", "pearl": "PGE1 can cause apnea, especially in neonates.", "srcAnswer": "B"}, {"num": 96, "level": "Clinical", "question": "A teenager with large PDA has differential cyanosis: lower-limb desaturation greater than right arm. Explanation?", "options": ["TOF without ductus", "Isolated secundum ASD with normal PVR", "Right-to-left ductal flow into descending aorta in advanced pulmonary hypertension", "Critical AS with normal oxygen saturation"], "answer": 2, "explanation": "Ductal insertion distal to head/arm vessels causes lower-body cyanosis. Why not the others: A. TOF without ductus — Typically generalized cyanosis.; B. Isolated secundum ASD with normal PVR — Does not create differential cyanosis.; D. Critical AS with normal oxygen saturation — Does not cause ductal differential saturation.", "pearl": "Ductal insertion distal to head/arm vessels causes lower-body cyanosis.", "srcAnswer": "C"}, {"num": 97, "level": "High", "question": "A school-age child has hemodynamically significant secundum ASD with RV volume overload and adequate rims. Common treatment?", "options": ["Transcatheter device closure after specialist evaluation", "Close all tiny ASDs irrespective of RV size", "PGE1 infusion until adulthood", "Routine device closure of any primum ASD"], "answer": 0, "explanation": "Suitable secundum defects may be closed percutaneously. Why not the others: B. Close all tiny ASDs irrespective of RV size — Not every small ASD needs closure.; C. PGE1 infusion until adulthood — Not therapy for ASD.; D. Routine device closure of any primum ASD — Primum ASD requires surgical repair.", "pearl": "Suitable secundum defects may be closed percutaneously.", "srcAnswer": "A"}, {"num": 98, "level": "Clinical", "question": "Which finding most strongly argues against routine VSD closure?", "options": ["Recurrent chest infections with large shunt", "Severe irreversible pulmonary vascular disease with right-to-left shunt", "Failure to thrive with high pulmonary flow", "Progressive left-heart dilation from large shunt"], "answer": 1, "explanation": "Closure in Eisenmenger physiology may be harmful. Why not the others: A. Recurrent chest infections with large shunt — May favor closure.; C. Failure to thrive with high pulmonary flow — Often supports intervention.; D. Progressive left-heart dilation from large shunt — Often an indication for closure.", "pearl": "Closure in Eisenmenger physiology may be harmful.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 5',href:'Day21/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet5_Q80-98_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 80–98</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
