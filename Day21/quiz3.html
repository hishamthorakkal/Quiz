@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 41, "level": "High", "question": "A renal patient has K 7.2 mmol/L, broad QRS and peaked T waves. Priority membrane-stabilizing intervention?", "options": ["IV propranolol", "IV adenosine", "IV calcium under monitored hyperkalemia protocol", "Oral digoxin"], "answer": 2, "explanation": "Calcium stabilizes myocardium while potassium-shifting/removal measures proceed. Why not the others: A. IV propranolol — Does not immediately stabilize cardiac membrane.; B. IV adenosine — AV-node block does not protect hyperkalemic myocardium.; D. Oral digoxin — May aggravate conduction toxicity and is not urgent stabilization.", "pearl": "Calcium stabilizes myocardium while potassium-shifting/removal measures proceed.", "srcAnswer": "C"}, {"num": 42, "level": "Clinical", "question": "A child with congenital long-QT syndrome is prescribed a new macrolide. Safest medication-safety step?", "options": ["Use adenosine before each dose", "Ignore interaction if baseline heart rate normal", "Check QT-prolonging interaction and choose alternative when feasible", "Add digoxin prophylactically"], "answer": 2, "explanation": "QT-active medicines may increase torsades risk. Why not the others: A. Use adenosine before each dose — Not a prevention strategy.; B. Ignore interaction if baseline heart rate normal — Rate does not remove QT risk.; D. Add digoxin prophylactically — Does not prevent torsades and may cause toxicity.", "pearl": "QT-active medicines may increase torsades risk.", "srcAnswer": "C"}, {"num": 43, "level": "Clinical", "question": "Which rhythm mechanism is most typical for paroxysmal infant SVT with termination by adenosine?", "options": ["Multifocal atrial automaticity", "AV node-dependent reentry through an accessory pathway", "Incessant ectopic atrial automaticity", "Sinus-node acceleration from fever"], "answer": 1, "explanation": "AVRT is common in infants and is terminated by transient AV-node block. Why not the others: A. Multifocal atrial automaticity — Irregular P morphologies and RR intervals expected.; C. Incessant ectopic atrial automaticity — May persist through AV block.; D. Sinus-node acceleration from fever — Gradual onset and normal P axis expected.", "pearl": "AVRT is common in infants and is terminated by transient AV-node block.", "srcAnswer": "B"}, {"num": 44, "level": "Clinical", "question": "A 5-month-old has weeks of persistent tachycardia and LV EF 30%, no structural defect. Most important potentially reversible mechanism?", "options": ["Tachycardia-induced cardiomyopathy", "Primary restrictive cardiomyopathy", "Hypertrophic cardiomyopathy", "Isolated pulmonary stenosis"], "answer": 0, "explanation": "Incessant tachyarrhythmia can cause reversible LV dysfunction. Why not the others: B. Primary restrictive cardiomyopathy — Typically impaired filling and biatrial enlargement.; C. Hypertrophic cardiomyopathy — Wall hypertrophy and diastolic dysfunction dominate.; D. Isolated pulmonary stenosis — Right-sided pressure overload, not typical diffuse LV failure.", "pearl": "Incessant tachyarrhythmia can cause reversible LV dysfunction.", "srcAnswer": "A"}, {"num": 45, "level": "Conceptual", "question": "At standard 25 mm/s ECG speed, one small 1-mm horizontal square represents?", "options": ["0.04 seconds", "0.02 seconds", "0.10 seconds", "0.20 seconds"], "answer": 0, "explanation": "25 mm each second means 1 mm is 0.04 s. Why not the others: B. 0.02 seconds — Would correspond to 50 mm/s paper speed.; C. 0.10 seconds — Not the standard 1-mm interval.; D. 0.20 seconds — Five small squares at 25 mm/s.", "pearl": "25 mm each second means 1 mm is 0.04 s.", "srcAnswer": "A"}, {"num": 46, "level": "Clinical", "question": "Regular ECG R–R interval is four large squares at 25 mm/s. Approximate ventricular rate?", "options": ["100/min", "75/min", "60/min", "150/min"], "answer": 1, "explanation": "300 divided by 4 large squares equals 75/min. Why not the others: A. 100/min — Three large squares gives 100/min.; C. 60/min — Five large squares would give 60/min.; D. 150/min — Two large squares gives 150/min.", "pearl": "300 divided by 4 large squares equals 75/min.", "srcAnswer": "B"}, {"num": 47, "level": "Clinical", "question": "An older child has marked right axis deviation, dominant R in V1 and tall P waves. Most likely pressure-load chamber?", "options": ["Left ventricle with left atrial load", "Right ventricle with possible right atrial load", "Isolated left atrium", "Biventricular failure without hypertrophy"], "answer": 1, "explanation": "Rightward axis and prominent right precordial R favor RVH. Why not the others: A. Left ventricle with left atrial load — LVH typically left precordial voltage and leftward forces.; C. Isolated left atrium — P-wave morphology, not dominant V1 R, identifies LA load.; D. Biventricular failure without hypertrophy — Does not specifically explain RVH voltage pattern.", "pearl": "Rightward axis and prominent right precordial R favor RVH.", "srcAnswer": "B"}, {"num": 48, "level": "Clinical", "question": "A child with complete AVSD has left-axis deviation despite RV volume load. Why is this finding useful?", "options": ["It proves TOF", "It proves isolated secundum ASD", "Superior/leftward QRS axis supports AV canal physiology", "It rules out AVSD"], "answer": 2, "explanation": "AVSD classically produces superior axis due to conduction anatomy. Why not the others: A. It proves TOF — TOF often has right-axis deviation and RVH.; B. It proves isolated secundum ASD — Secundum ASD more often has right axis/incomplete RBBB.; D. It rules out AVSD — Leftward axis is a classic clue rather than exclusion.", "pearl": "AVSD classically produces superior axis due to conduction anatomy.", "srcAnswer": "C"}, {"num": 49, "level": "High", "question": "A child with regular narrow SVT converts after adenosine. What ECG should be reviewed next?", "options": ["Routine troponin as sole follow-up", "12-lead sinus-rhythm ECG for pre-excitation", "Exercise ECG immediately during recovery", "Only repeat heart rate count"], "answer": 1, "explanation": "Baseline ECG may show WPW delta wave or other substrate. Why not the others: A. Routine troponin as sole follow-up — Cannot define accessory pathway substrate.; C. Exercise ECG immediately during recovery — Not the priority baseline evaluation.; D. Only repeat heart rate count — Misses diagnostic pre-excitation.", "pearl": "Baseline ECG may show WPW delta wave or other substrate.", "srcAnswer": "B"}, {"num": 50, "level": "Clinical", "question": "Which maneuver is contraindicated for an infant with stable SVT?", "options": ["Carefully supervised vagal stimulation", "Rapid transition to adenosine if vagal fails", "Direct ocular pressure", "Age-appropriate facial cold stimulus under monitoring"], "answer": 2, "explanation": "Ocular pressure risks retinal/eye injury and should not be used. Why not the others: A. Carefully supervised vagal stimulation — First-line for stable SVT.; B. Rapid transition to adenosine if vagal fails — Appropriate escalation.; D. Age-appropriate facial cold stimulus under monitoring — Accepted infant vagal maneuver in appropriate stable setting.", "pearl": "Ocular pressure risks retinal/eye injury and should not be used.", "srcAnswer": "C"}, {"num": 51, "level": "Clinical", "question": "What explains risk of adenosine in irregular wide-complex tachycardia with pre-excitation?", "options": ["It invariably lengthens QTc beyond 600 ms", "It causes permanent AV block in all patients", "It increases pulmonary vascular resistance directly", "Blocking AV node can favor rapid accessory-pathway conduction to ventricles"], "answer": 3, "explanation": "Pre-excited AF may degenerate to VF with AV nodal blockers. Why not the others: A. It invariably lengthens QTc beyond 600 ms — Not the key mechanism.; B. It causes permanent AV block in all patients — Adenosine block is usually transient.; C. It increases pulmonary vascular resistance directly — Not the main arrhythmic danger.", "pearl": "Pre-excited AF may degenerate to VF with AV nodal blockers.", "srcAnswer": "D"}, {"num": 52, "level": "Recall", "question": "A 5-month-old has large perimembranous VSD, tachypnea and hepatomegaly after PVR falls. Main hemodynamic mechanism?", "options": ["Reduced pulmonary flow from severe RVOT obstruction", "Isolated right-to-left shunting with normal PVR", "Increased pulmonary flow with left-heart volume overload", "Primary LV outflow obstruction"], "answer": 2, "explanation": "Postnatal PVR decline increases left-to-right shunt and pulmonary venous return. Why not the others: A. Reduced pulmonary flow from severe RVOT obstruction — Would produce cyanosis rather than classic large VSD failure.; B. Isolated right-to-left shunting with normal PVR — Does not explain typical infancy pulmonary overcirculation.; D. Primary LV outflow obstruction — Pressure load differs from VSD shunt.", "pearl": "Postnatal PVR decline increases left-to-right shunt and pulmonary venous return.", "srcAnswer": "C"}, {"num": 53, "level": "Integrated", "question": "An asymptomatic schoolchild has fixed wide split S2 and systolic flow murmur at left upper sternal border. Likely lesion?", "options": ["Large VSD with LV volume overload", "Severe valvar AS", "Secundum ASD with RV volume overload", "PDA with descending aortic runoff"], "answer": 2, "explanation": "Fixed splitting reflects relatively fixed increased RV stroke volume. Why not the others: A. Large VSD with LV volume overload — Usually holosystolic murmur at lower sternal border.; B. Severe valvar AS — Ejection murmur radiates to neck, not fixed split S2.; D. PDA with descending aortic runoff — Continuous infraclavicular murmur typical.", "pearl": "Fixed splitting reflects relatively fixed increased RV stroke volume.", "srcAnswer": "C"}, {"num": 54, "level": "Clinical", "question": "A 4-month-old has bounding pulses, wide pulse pressure and continuous left infraclavicular murmur. Diagnosis?", "options": ["Patent ductus arteriosus", "Small secundum ASD", "Valvar pulmonary stenosis", "Coarctation"], "answer": 0, "explanation": "Aortic runoff into PA produces continuous murmur and wide pulse pressure. Why not the others: B. Small secundum ASD — Usually no wide pulse pressure or continuous murmur.; C. Valvar pulmonary stenosis — Systolic ejection murmur with RV pressure load.; D. Coarctation — Typically weak femorals and arm-leg BP difference.", "pearl": "Aortic runoff into PA produces continuous murmur and wide pulse pressure.", "srcAnswer": "A"}, {"num": 55, "level": "Clinical", "question": "A 2-month-old with trisomy 21 has common AV valve, primum atrial defect and inlet ventricular defect. Diagnosis?", "options": ["Partial anomalous pulmonary venous return", "Isolated secundum ASD", "Isolated perimembranous VSD", "Complete atrioventricular septal defect"], "answer": 3, "explanation": "Common AV junction plus primum ASD and inlet VSD define complete AVSD. Why not the others: A. Partial anomalous pulmonary venous return — Venous anomaly rather than common AV valve.; B. Isolated secundum ASD — Lacks inlet VSD/common AV valve.; C. Isolated perimembranous VSD — No common AV junction.", "pearl": "Common AV junction plus primum ASD and inlet VSD define complete AVSD.", "srcAnswer": "D"}, {"num": 56, "level": "Conceptual", "question": "A cyanotic 1-year-old has VSD, overriding aorta, RVH and subpulmonary narrowing. Major determinant of cyanosis?", "options": ["Size of secundum ASD", "Severity of aortic regurgitation", "Severity of right ventricular outflow obstruction", "Degree of mitral stenosis"], "answer": 2, "explanation": "RVOT obstruction determines right-to-left shunt fraction across VSD. Why not the others: A. Size of secundum ASD — Not core determinant of TOF cyanosis.; B. Severity of aortic regurgitation — Not the main mechanism of TOF cyanosis.; D. Degree of mitral stenosis — Not characteristic of TOF.", "pearl": "RVOT obstruction determines right-to-left shunt fraction across VSD.", "srcAnswer": "C"}, {"num": 57, "level": "High", "question": "A toddler with TOF becomes suddenly deeply cyanosed and agitated after crying. First bedside positioning intervention?", "options": ["Routine adenosine push", "Immediate vigorous diuresis", "Flat supine position with vigorous stimulation", "Knee-chest position with calming and oxygen as appropriate"], "answer": 3, "explanation": "Increasing systemic vascular resistance reduces right-to-left shunting while resuscitation proceeds. Why not the others: A. Routine adenosine push — Not treatment for hypercyanotic spell.; B. Immediate vigorous diuresis — May reduce preload and worsen obstruction.; C. Flat supine position with vigorous stimulation — Agitation may worsen dynamic RVOT obstruction.", "pearl": "Increasing systemic vascular resistance reduces right-to-left shunting while resuscitation proceeds.", "srcAnswer": "D"}, {"num": 58, "level": "Clinical", "question": "Before TOF surgical repair, a coronary artery crossing RVOT is identified. Why important?", "options": ["It contraindicates all future TOF repair", "It can alter RVOT incision/repair strategy", "It mandates PDA closure as first procedure", "It proves anomalous pulmonary venous return"], "answer": 1, "explanation": "Crossing coronary may be injured by conventional ventriculotomy. Why not the others: A. It contraindicates all future TOF repair — Requires adapted technique, not permanent inoperability.; C. It mandates PDA closure as first procedure — Coronary course does not imply ductal management.; D. It proves anomalous pulmonary venous return — Unrelated vascular territory.", "pearl": "Crossing coronary may be injured by conventional ventriculotomy.", "srcAnswer": "B"}, {"num": 59, "level": "Clinical", "question": "A newborn has d-TGA with intact septum and severe cyanosis. Survival depends on?", "options": ["High PVR alone without mixing", "Isolated LV outflow obstruction", "Complete separation of systemic and pulmonary circulations", "Mixing between parallel systemic and pulmonary circuits"], "answer": 3, "explanation": "PFO/ASD, PDA or VSD permit oxygenated blood to reach systemic circuit. Why not the others: A. High PVR alone without mixing — Does not solve parallel-circuit physiology.; B. Isolated LV outflow obstruction — Not a required survival mechanism.; C. Complete separation of systemic and pulmonary circulations — Would prevent oxygenated systemic flow.", "pearl": "PFO/ASD, PDA or VSD permit oxygenated blood to reach systemic circuit.", "srcAnswer": "D"}, {"num": 60, "level": "Clinical", "question": "A d-TGA newborn remains severely hypoxemic despite PGE1; echo shows restrictive interatrial communication. Best next stabilization?", "options": ["Urgent balloon atrial septostomy in expert center", "Increase PGE1 alone indefinitely", "Close the PFO surgically", "Delay intervention for spontaneous PVR fall"], "answer": 0, "explanation": "Improves atrial mixing while definitive repair is planned. Why not the others: B. Increase PGE1 alone indefinitely — A restrictive atrial septum may still prevent adequate mixing.; C. Close the PFO surgically — Further reduces mixing.; D. Delay intervention for spontaneous PVR fall — Unsafe in refractory hypoxemia.", "pearl": "Improves atrial mixing while definitive repair is planned.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 3',href:'Day21/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet3_Q41-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 41–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
