<script>
const quiz=[{"num": 118, "level": "Integrated", "question": "A 2-year-old with large VSD and high pulmonary artery pressure is considered for closure. Which assessment is crucial if advanced pulmonary vascular disease suspected?", "options": ["Only VSD diameter without hemodynamics", "Pulmonary vascular resistance and operability assessment", "Murmur loudness alone", "Pulse oximetry alone"], "answer": 1, "explanation": "Pressure alone does not establish reversibility/closure safety. Why not the others: A. Only VSD diameter without hemodynamics — Shunt size alone insufficient in late presentation.; C. Murmur loudness alone — Does not quantify PVR or operability.; D. Pulse oximetry alone — Cannot fully characterize PVR.", "pearl": "Pressure alone does not establish reversibility/closure safety.", "srcAnswer": "B"}, {"num": 119, "level": "Clinical", "question": "A child with myocarditis develops frequent ventricular ectopy and low EF. Which principle is safest?", "options": ["Perform maximal exercise challenge during acute illness", "Assume ectopy is always benign if fever present", "Continuous rhythm monitoring and correction of triggers with specialist care", "Discontinue monitoring after one normal ECG"], "answer": 2, "explanation": "Inflamed myocardium can develop malignant arrhythmias. Why not the others: A. Perform maximal exercise challenge during acute illness — Risky with active myocardial inflammation.; B. Assume ectopy is always benign if fever present — Ventricular arrhythmias in myocarditis may be dangerous.; D. Discontinue monitoring after one normal ECG — Arrhythmias can be intermittent.", "pearl": "Inflamed myocardium can develop malignant arrhythmias.", "srcAnswer": "C"}, {"num": 120, "level": "Recall", "question": "A Fontan patient develops increasing cyanosis and exercise intolerance with elevated pulmonary vascular resistance. Main hemodynamic issue?", "options": ["High PVR increases LV preload beneficially", "Pulmonary blood flow is always driven by a normal RV", "Passive venous-to-pulmonary flow is impeded by high PVR", "Ductus arteriosus closure is the only mechanism"], "answer": 2, "explanation": "Fontan circulation lacks a subpulmonary pump, so resistance impairs preload and output. Why not the others: A. High PVR increases LV preload beneficially — Typically reduces venous return and cardiac output.; B. Pulmonary blood flow is always driven by a normal RV — Fontan bypasses a functional subpulmonary ventricle.; D. Ductus arteriosus closure is the only mechanism — Not the general Fontan physiology.", "pearl": "Fontan circulation lacks a subpulmonary pump, so resistance impairs preload and output.", "srcAnswer": "C"}, {"num": 121, "level": "", "question": "A term newborn is 60 hours old with repeated low glucose. Which statement correctly distinguishes the named CPS and PES time boundaries?", "options": ["PES states all glucose disorders resolve at 72 h", "CPS transitional period extends to 72 h; PES focuses persistent-disorder evaluation after 48 h", "Both use 48 h as the identical transition boundary", "CPS defines 48 mg/dL as its 48-hour time boundary"], "answer": 1, "explanation": "The guidelines use different purposes and time windows, not glucose concentrations. Why not the others: A. PES states all glucose disorders resolve at 72 h — PES does not guarantee spontaneous resolution.; C. Both use 48 h as the identical transition boundary — CPS uses 72 h, so these are not identical.; D. CPS defines 48 mg/dL as its 48-hour time boundary — Hours and concentration units must not be confused.", "pearl": "The guidelines use different purposes and time windows, not glucose concentrations.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q8 — Neonatal hypoglycemia — CPS 72 h vs PES 48 h"}}, {"num": 122, "level": "", "question": "A ventilated neonate acutely desaturates; inspection finds a disconnected inspiratory limb. In DOPE, the cause is?", "options": ["Equipment failure", "Displacement of endotracheal tube", "Pneumothorax", "Obstruction of endotracheal tube"], "answer": 0, "explanation": "Disconnected circuit is equipment failure in DOPE. Why not the others: B. Displacement of endotracheal tube — ETT remains correctly placed in the stem.; C. Pneumothorax — A circuit disconnection directly accounts for the event.; D. Obstruction of endotracheal tube — No blocked tube is identified.", "pearl": "Disconnected circuit is equipment failure in DOPE.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 5 Q34 — Ventilator DOPE — circuit disconnection/equipment failure"}}, {"num": 123, "level": "", "question": "A preterm infant at 36 weeks PMA receives 2.5 L/min nasal cannula oxygen and no invasive ventilation. Jensen BPD grade?", "options": ["No BPD by support classification", "Grade 3", "Grade 1", "Grade 2"], "answer": 3, "explanation": ">2 L/min nasal cannula is Grade 2 in Jensen 2019 classification. Why not the others: A. No BPD by support classification — The specified respiratory support meets Jensen Grade 2.; B. Grade 3 — Grade 3 requires invasive mechanical ventilation.; C. Grade 1 — Grade 1 uses nasal cannula ≤2 L/min.", "pearl": ">2 L/min nasal cannula is Grade 2 in Jensen 2019 classification.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 5 Q53 — Jensen BPD grade at 36 weeks PMA"}}, {"num": 124, "level": "", "question": "A 2-day-old boy has severe unconjugated jaundice, negative DAT and modest anemia; family history suggests enzyme deficiency. Leading diagnosis?", "options": ["Rh isoimmunization", "Biliary atresia", "G6PD deficiency", "Physiologic jaundice alone"], "answer": 2, "explanation": "DAT-negative nonimmune hemolysis can cause severe jaundice with modest anemia. Why not the others: A. Rh isoimmunization — Usually immune hemolysis with supporting maternal/infant serology.; B. Biliary atresia — Causes conjugated rather than unconjugated cholestasis.; D. Physiologic jaundice alone — Severity and family pattern argue for a pathologic contributor.", "pearl": "DAT-negative nonimmune hemolysis can cause severe jaundice with modest anemia.", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 6 Q60 — G6PD neonatal unconjugated jaundice with DAT-negative hemolysis"}}, {"num": 125, "level": "", "question": "A 29-week preterm infant loses physiologic weight in the first days with rising urine output. Best sodium-fluid principle?", "options": ["Ignore daily weight and sodium until day 7", "Individualize sodium and fluid to weight trend, urine, serum sodium and gestation", "Prescribe fixed sodium load irrespective of urine output", "Assume neonates cannot excrete sodium at all"], "answer": 1, "explanation": "Early ECF contraction and natriuresis vary with gestation and clinical status. Why not the others: A. Ignore daily weight and sodium until day 7 — Monitoring is important in preterm infants.; C. Prescribe fixed sodium load irrespective of urine output — Risks sodium imbalance.; D. Assume neonates cannot excrete sodium at all — Natriuresis occurs during postnatal adaptation.", "pearl": "Early ECF contraction and natriuresis vary with gestation and clinical status.", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 10 Q15 — Early neonatal extracellular fluid contraction and natriuresis"}}, {"num": 126, "level": "", "question": "A 3-kg neonate needs GIR 7 mg/kg/min at 120 mL/kg/day. Required dextrose percentage (approximately)?", "options": ["D8.4", "D10.8", "D5.8", "D12.0"], "answer": 0, "explanation": "Dextrose % = GIR×144/fluid = 7×144/120 = 8.4%. Why not the others: B. D10.8 — Overestimates calculated concentration.; C. D5.8 — Underestimates dextrose concentration for prescribed GIR.; D. D12.0 — Would deliver GIR 10 mg/kg/min at 120 mL/kg/day.", "pearl": "Dextrose % = GIR×144/fluid = 7×144/120 = 8.4%.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 10 Q47 — GIR to dextrose percentage at restricted fluids"}}, {"num": 127, "level": "", "question": "During hypoglycemia an infant has suppressed BOHB and FFA, and glucose rises 36 mg/dL after glucagon. Best interpretation?", "options": ["Ketotic hypoglycemia from fasting", "Fatty-acid oxidation defect with elevated FFA", "Cortisol deficiency alone with high ketones", "Excess insulin action consistent with hyperinsulinism"], "answer": 3, "explanation": "Suppressed alternative fuels plus glucagon rise support insulin action. Why not the others: A. Ketotic hypoglycemia from fasting — Ketones would usually be elevated.; B. Fatty-acid oxidation defect with elevated FFA — FAOD often has elevated FFA, unlike the stem.; C. Cortisol deficiency alone with high ketones — Suppressed ketones/FFA and glucagon rise are more insulin-specific.", "pearl": "Suppressed alternative fuels plus glucagon rise support insulin action.", "srcAnswer": "D", "retest": {"stage": "R2", "from": "Day 10 Q50 — Hyperinsulinism critical sample — suppressed BOHB/FFA, glucagon response"}}, {"num": 128, "level": "", "question": "A neonate has hyperammonemia, low citrulline and markedly high urinary orotic acid. Most likely defect?", "options": ["CPS1 deficiency", "NAGS deficiency", "Ornithine transcarbamylase deficiency", "ASS1 deficiency"], "answer": 2, "explanation": "Excess mitochondrial carbamoyl phosphate diverts into pyrimidine synthesis. Why not the others: A. CPS1 deficiency — Usually low/normal urinary orotic acid.; B. NAGS deficiency — Typically low/normal orotic acid; carglumic acid is relevant therapy.; D. ASS1 deficiency — Usually markedly elevated citrulline.", "pearl": "Excess mitochondrial carbamoyl phosphate diverts into pyrimidine synthesis.", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 10 Q65 — OTC versus CPS1/NAGS — urinary orotic acid"}}, {"num": 129, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. ETROP classification and next step?", "options": ["Mild ROP requiring no follow-up", "Type 1 ROP requiring prompt treatment assessment", "Type 2 ROP for routine later review", "Treat only after stage 3 appears"], "answer": 1, "explanation": "Zone II stage 2 with plus disease is Type 1. Why not the others: A. Mild ROP requiring no follow-up — Plus disease makes this clinically significant.; C. Type 2 ROP for routine later review — Type 2 zone II stage 3 without plus or zone I stage 1/2 without plus.; D. Treat only after stage 3 appears — Stage 2 with plus already qualifies as Type 1.", "pearl": "Zone II stage 2 with plus disease is Type 1.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 11 Q25 — ROP ETROP Type 1 — zone II stage 2 plus disease"}}, {"num": 130, "level": "", "question": "Infant born at 29 weeks gestation is now 15 weeks chronological age. Corrected age?", "options": ["4 weeks", "15 weeks", "11 weeks", "44 weeks"], "answer": 0, "explanation": "15 − (40−29) = 4 weeks corrected age. Why not the others: B. 15 weeks — Chronological age is uncorrected.; C. 11 weeks — 11 weeks is the prematurity correction, not the corrected age.; D. 44 weeks — 44 weeks is postmenstrual age, not corrected age.", "pearl": "15 − (40−29) = 4 weeks corrected age.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q46 — Corrected age vs PMA in preterm infant"}}, {"num": 131, "level": "", "question": "A 24-week GA infant is assessed using explicitly named AAP 2018 ROP schedule. Initial exam at?", "options": ["29 weeks PMA, 5 weeks after birth", "34 weeks PMA, 10 weeks after birth", "27 weeks PMA, 3 weeks after birth", "31 weeks PMA, approximately 7 weeks after birth"], "answer": 3, "explanation": "The AAP 2018 schedule for GA 24 weeks starts at 31 weeks PMA. Why not the others: A. 29 weeks PMA, 5 weeks after birth — Earlier than the named AAP schedule.; B. 34 weeks PMA, 10 weeks after birth — Later than recommended initial examination.; C. 27 weeks PMA, 3 weeks after birth — That is not the named AAP timing for GA 24 weeks.", "pearl": "The AAP 2018 schedule for GA 24 weeks starts at 31 weeks PMA.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q55 — AAP 2018 ROP first-screen timing for GA 24 weeks"}}, {"num": 132, "level": "", "question": "A 6-year-old with school inattention is screened with BEARS. Which set of domains is correct?", "options": ["Behaviour, Eating, Anxiety, Reflux, Sleepwalking", "Bedtime, Epilepsy, Activity, Reflexes, Snoring", "Bedtime, Excessive sleepiness, Awakenings, Regularity/duration, Snoring", "Breathing, EEG, Arousals, REM, Seizures"], "answer": 2, "explanation": "BEARS is a structured clinical sleep-history screen. Why not the others: A. Behaviour, Eating, Anxiety, Reflux, Sleepwalking — These are differential symptoms, not the five BEARS domains.; B. Bedtime, Epilepsy, Activity, Reflexes, Snoring — The middle domains are not the mnemonic.; D. Breathing, EEG, Arousals, REM, Seizures — These are polysomnography-related terms, not BEARS.", "pearl": "BEARS is a structured clinical sleep-history screen.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 13 Q5 — BEARS paediatric sleep-history mnemonic"}}, {"num": 133, "level": "", "question": "A 7.5-kg child with complicated SAM is prescribed F-75 at 130 mL/kg/day. Total ordered daily volume?", "options": ["130 mL/day", "975 mL/day", "750 mL/day", "97.5 mL/day"], "answer": 1, "explanation": "7.5 × 130 = 975 mL/day. Why not the others: A. 130 mL/day — Confuses rate per kg with total daily volume.; C. 750 mL/day — Does not use the ordered 130 mL/kg/day.; D. 97.5 mL/day — Tenfold underestimation.", "pearl": "7.5 × 130 = 975 mL/day.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 starter feed weight × prescribed mL/kg/day"}}, {"num": 134, "level": "", "question": "An infant has microcephaly, growth restriction, seizures and Greek-warrior helmet appearance. Which deletion?", "options": ["4p deletion", "7q11.23 deletion", "5p deletion", "15q11.2 paternal deletion"], "answer": 0, "explanation": "Wolf–Hirschhorn syndrome is 4p deletion. Why not the others: B. 7q11.23 deletion — Williams syndrome is associated with supravalvar AS.; C. 5p deletion — Cri-du-chat is 5p deletion with characteristic cat-like cry.; D. 15q11.2 paternal deletion — Prader–Willi syndrome differs in phenotype.", "pearl": "Wolf–Hirschhorn syndrome is 4p deletion.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q31 — Wolf–Hirschhorn syndrome — 4p deletion / Greek-warrior helmet"}}, {"num": 135, "level": "", "question": "A milk-fed infant develops early bilateral cataracts with little hepatic dysfunction or systemic illness. Most likely?", "options": ["Hereditary fructose intolerance", "Tyrosinemia type I", "Classic GALT deficiency", "Galactokinase (GALK1) deficiency"], "answer": 3, "explanation": "Galactitol-associated cataracts with limited systemic toxicity fit GALK1. Why not the others: A. Hereditary fructose intolerance — Appears after fructose/sucrose/sorbitol introduction.; B. Tyrosinemia type I — Typically systemic liver/renal disease with succinylacetone.; C. Classic GALT deficiency — Usually more severe liver dysfunction and systemic disease.", "pearl": "Galactitol-associated cataracts with limited systemic toxicity fit GALK1.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase GALK1 vs classic GALT galactosemia"}}, {"num": 136, "level": "", "question": "After overnight fasting, a toddler has hypoketotic hypoglycemia and marked octanoylcarnitine (C8) elevation. Diagnosis?", "options": ["VLCAD deficiency", "MSUD", "MCAD deficiency", "Propionic acidemia"], "answer": 2, "explanation": "C8 acylcarnitine is characteristic of medium-chain acyl-CoA dehydrogenase deficiency. Why not the others: A. VLCAD deficiency — Typically C14:1 acylcarnitine elevation.; B. MSUD — Alloisoleucine and branched-chain amino acid elevations dominate.; D. Propionic acidemia — Typically C3 elevation with organic acidemia.", "pearl": "C8 acylcarnitine is characteristic of medium-chain acyl-CoA dehydrogenase deficiency.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD ACADM — fasting hypoketotic hypoglycemia with C8"}}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 7',href:'Day21/quiz7.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet7_Q118-136_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 7 — Wrong Answer Report</h1><p><b>Questions:</b> 118–136</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['7']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['7']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 7 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
