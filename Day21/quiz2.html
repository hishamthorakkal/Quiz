@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 21, "level": "High", "question": "An ECG shows ventricular QRS complexes at 150/min and independent P waves at 90/min. Which interpretation is strongest?", "options": ["First-degree AV block", "Atrial flutter with 2:1 conduction", "Sinus tachycardia with 1:1 conduction", "Ventricular/junctional tachycardia with AV dissociation"], "answer": 3, "explanation": "Ventricles faster than atria and independent activity suggest non-atrial-driven rhythm. Why not the others: A. First-degree AV block — Retains 1:1 AV conduction with prolonged PR.; B. Atrial flutter with 2:1 conduction — Atria should generally be faster than ventricles.; C. Sinus tachycardia with 1:1 conduction — Requires atrial activation before each QRS.", "pearl": "Ventricles faster than atria and independent activity suggest non-atrial-driven rhythm.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical", "question": "A 10-year-old has monomorphic wide VT at 190/min with hypotension but a definite pulse. Next action?", "options": ["Immediate synchronized cardioversion", "Observation for spontaneous termination", "Defibrillation without synchronization as first step", "IV adenosine trial despite shock"], "answer": 0, "explanation": "Wide tachycardia with compromise and pulse warrants synchronized cardioversion. Why not the others: B. Observation for spontaneous termination — Unsafe in hypotension.; C. Defibrillation without synchronization as first step — Used for pulseless VT/VF or polymorphic rhythm not synchronizable.; D. IV adenosine trial despite shock — Do not delay electrical therapy in compromise.", "pearl": "Wide tachycardia with compromise and pulse warrants synchronized cardioversion.", "srcAnswer": "A"}, {"num": 23, "level": "Conceptual", "question": "A 12-year-old is unresponsive, pulseless, with organized wide tachycardia on monitor. Priority rhythm treatment?", "options": ["Defibrillation with CPR", "Synchronized cardioversion with sedation", "Adenosine diagnostic bolus", "Vagal maneuver"], "answer": 0, "explanation": "Pulseless VT is a shockable arrest rhythm. Why not the others: B. Synchronized cardioversion with sedation — Synchronization and sedation delay arrest treatment.; C. Adenosine diagnostic bolus — Not appropriate for cardiac arrest.; D. Vagal maneuver — Cannot restore circulation in pulseless VT.", "pearl": "Pulseless VT is a shockable arrest rhythm.", "srcAnswer": "A"}, {"num": 24, "level": "Clinical", "question": "A 15-kg child in ventricular fibrillation receives first manual shock under 2025 AHA teaching dose. Energy?", "options": ["60 J", "15 J", "150 J", "30 J"], "answer": 3, "explanation": "2 J/kg times 15 kg equals 30 J. Why not the others: A. 60 J — 4 J/kg is common subsequent dose, though 2–4 initial range exists.; B. 15 J — 1 J/kg is below teaching initial dose.; C. 150 J — 10 J/kg is upper limit, not initial teaching dose.", "pearl": "2 J/kg times 15 kg equals 30 J.", "srcAnswer": "D"}, {"num": 25, "level": "High", "question": "A 25-kg child remains in VF after first shock and CPR. AHA usual next energy?", "options": ["100 J", "25 J", "50 J", "250 J"], "answer": 0, "explanation": "4 J/kg times 25 kg equals 100 J. Why not the others: B. 25 J — 1 J/kg is below usual shock energy.; C. 50 J — 2 J/kg is usual initial teaching energy.; D. 250 J — 10 J/kg is ceiling, not routine second shock.", "pearl": "4 J/kg times 25 kg equals 100 J.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical", "question": "A child with bradycardia, cyanosis and poor perfusion is hypoventilating. Best first corrective action?", "options": ["Adenosine rapid bolus", "Atropine before airway support in all cases", "Effective airway support, oxygenation and ventilation", "Immediate defibrillation"], "answer": 2, "explanation": "Pediatric bradycardia is often hypoxic; correct ventilation immediately. Why not the others: A. Adenosine rapid bolus — Would worsen AV conduction rather than correct hypoxia.; B. Atropine before airway support in all cases — Atropine is reserved for vagal/AV-block causes, not universal first step.; D. Immediate defibrillation — Bradycardia is not a shockable rhythm.", "pearl": "Pediatric bradycardia is often hypoxic; correct ventilation immediately.", "srcAnswer": "C"}, {"num": 27, "level": "Integrated", "question": "A 6-year-old remains HR 48/min with poor perfusion despite effective oxygenation and ventilation. Best next action?", "options": ["Synchronized cardioversion", "Rapid adenosine", "Begin CPR while continuing bradycardia algorithm", "Observe because a pulse is present"], "answer": 2, "explanation": "HR below 60 with compromise despite ventilation warrants compressions. Why not the others: A. Synchronized cardioversion — Not treatment for profound bradycardia.; B. Rapid adenosine — Could worsen bradycardia.; D. Observe because a pulse is present — Pulse presence does not exclude compressions in this circumstance.", "pearl": "HR below 60 with compromise despite ventilation warrants compressions.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical", "question": "A child has symptomatic bradycardia clearly triggered by increased vagal tone during airway instrumentation. Appropriate drug?", "options": ["Atropine IV/IO with airway optimization", "Amiodarone", "Adenosine", "Digoxin"], "answer": 0, "explanation": "Atropine is useful for vagally mediated bradycardia or primary AV block. Why not the others: B. Amiodarone — Antiarrhythmic infusion may further slow conduction.; C. Adenosine — Transient AV blockade worsens bradycardia.; D. Digoxin — AV nodal slowing is not acute treatment.", "pearl": "Atropine is useful for vagally mediated bradycardia or primary AV block.", "srcAnswer": "A"}, {"num": 29, "level": "High", "question": "An ECG shows P waves 110/min and QRS escape 48/min with no fixed PR relation. Diagnosis?", "options": ["Mobitz II block", "First-degree AV block", "Mobitz I block", "Third-degree AV block"], "answer": 3, "explanation": "Atria and ventricles dissociate completely. Why not the others: A. Mobitz II block — Intermittent dropped QRS with stable conducted PR, not complete dissociation.; B. First-degree AV block — PR is prolonged but each P conducts.; C. Mobitz I block — Progressive PR prolongation with dropped beats occurs.", "pearl": "Atria and ventricles dissociate completely.", "srcAnswer": "D"}, {"num": 30, "level": "Clinical", "question": "An ECG shows progressive PR lengthening until a P wave fails to conduct, then cycle repeats. Diagnosis?", "options": ["Mobitz type I second-degree AV block", "Complete AV block", "First-degree AV block", "Mobitz type II second-degree AV block"], "answer": 0, "explanation": "Wenckebach pattern is progressive PR lengthening then block. Why not the others: B. Complete AV block — No consistent atrioventricular conduction exists.; C. First-degree AV block — Every atrial impulse conducts.; D. Mobitz type II second-degree AV block — Conducted PR intervals remain fixed before a dropped QRS.", "pearl": "Wenckebach pattern is progressive PR lengthening then block.", "srcAnswer": "A"}, {"num": 31, "level": "Clinical", "question": "An ECG shows constant PR for conducted beats with intermittent nonconducted P waves. Diagnosis?", "options": ["Mobitz I block", "Sinus pause", "First-degree block", "Mobitz type II second-degree AV block"], "answer": 3, "explanation": "Fixed conducted PR and sudden dropped QRS indicate Mobitz II. Why not the others: A. Mobitz I block — Requires progressive PR lengthening.; B. Sinus pause — There would be absence of P wave rather than nonconducted P.; C. First-degree block — No QRS is dropped.", "pearl": "Fixed conducted PR and sudden dropped QRS indicate Mobitz II.", "srcAnswer": "D"}, {"num": 32, "level": "Clinical", "question": "A 10-year-old has prolonged age-adjusted PR interval with every P followed by QRS and stable rhythm. Diagnosis?", "options": ["Complete AV block", "Junctional rhythm", "First-degree AV block", "Second-degree type I"], "answer": 2, "explanation": "Prolonged PR with 1:1 conduction defines first-degree block. Why not the others: A. Complete AV block — Atrial and ventricular activities are dissociated.; B. Junctional rhythm — Typically absent/inverted P or altered relation to QRS.; D. Second-degree type I — Needs dropped QRS following progressive PR changes.", "pearl": "Prolonged PR with 1:1 conduction defines first-degree block.", "srcAnswer": "C"}, {"num": 33, "level": "High", "question": "A newborn has persistent complete AV block, structurally normal heart and maternal anti-Ro/SSA antibodies. Most likely etiology?", "options": ["Acute rheumatic carditis", "Immune-mediated congenital AV block", "Maternal beta-blocker alone", "Hyperkalemia alone"], "answer": 1, "explanation": "Transplacental anti-Ro/SSA or anti-La/SSB can injure conduction tissue. Why not the others: A. Acute rheumatic carditis — Not the usual mechanism of isolated neonatal complete block.; C. Maternal beta-blocker alone — May cause transient bradycardia, not fixed AV dissociation.; D. Hyperkalemia alone — Causes conduction changes but not classic maternal antibody-associated block.", "pearl": "Transplacental anti-Ro/SSA or anti-La/SSB can injure conduction tissue.", "srcAnswer": "B"}, {"num": 34, "level": "Conceptual", "question": "A child develops persistent complete AV block after VSD surgical repair. Best long-term specialist consideration?", "options": ["Long-term adenosine", "Repeat synchronized cardioversion", "Routine beta-blocker monotherapy", "Permanent pacing if block persists per postoperative criteria"], "answer": 3, "explanation": "Sustained high-grade postoperative block may require permanent pacemaker. Why not the others: A. Long-term adenosine — Transient AV block aggravates the problem.; B. Repeat synchronized cardioversion — Not a remedy for persistent complete block.; C. Routine beta-blocker monotherapy — Can worsen conduction.", "pearl": "Sustained high-grade postoperative block may require permanent pacemaker.", "srcAnswer": "D"}, {"num": 35, "level": "Recall", "question": "A child has QT 0.36 s and RR 0.64 s. Bazett corrected QT approximates?", "options": ["0.36 s", "0.56 s", "0.29 s", "0.45 s"], "answer": 3, "explanation": "0.36 divided by square root of 0.64 (0.8) gives 0.45 s. Why not the others: A. 0.36 s — This leaves QT uncorrected.; B. 0.56 s — This uses RR directly instead of its square root.; C. 0.29 s — This multiplies rather than divides by square root RR.", "pearl": "0.36 divided by square root of 0.64 (0.8) gives 0.45 s.", "srcAnswer": "D"}, {"num": 36, "level": "Clinical", "question": "A teenager collapses while swimming; ECG shows prolonged QTc, family history of exertional syncope. Most likely syndrome?", "options": ["WPW syndrome", "Congenital long-QT syndrome", "Brugada syndrome", "Catecholaminergic polymorphic VT"], "answer": 1, "explanation": "Swimming/exertional triggers with QT prolongation strongly suggest channelopathy. Why not the others: A. WPW syndrome — Short PR/delta wave, not long QT.; C. Brugada syndrome — Typically right-precordial coved ST elevation and fever/rest triggers.; D. Catecholaminergic polymorphic VT — Exercise-triggered syncope but resting QT usually normal.", "pearl": "Swimming/exertional triggers with QT prolongation strongly suggest channelopathy.", "srcAnswer": "B"}, {"num": 37, "level": "High", "question": "An 11-year-old has exertional syncope, normal resting ECG/QTc and exercise-induced bidirectional VT. Diagnosis?", "options": ["Atrial flutter", "Catecholaminergic polymorphic ventricular tachycardia", "AVNRT", "Congenital long-QT syndrome"], "answer": 1, "explanation": "Exercise-triggered bidirectional VT with normal baseline QT is classic. Why not the others: A. Atrial flutter — Organized atrial tachycardia, not bidirectional VT.; C. AVNRT — Narrow SVT, not bidirectional ventricular ectopy.; D. Congenital long-QT syndrome — Usually QT prolongation at baseline or on provocative assessment.", "pearl": "Exercise-triggered bidirectional VT with normal baseline QT is classic.", "srcAnswer": "B"}, {"num": 38, "level": "Clinical", "question": "A 14-year-old with febrile syncope has coved ST elevation in V1–V2 and ventricular arrhythmia history. Diagnosis?", "options": ["Long-QT syndrome", "WPW", "Arrhythmogenic RV cardiomyopathy", "Brugada pattern/syndrome requiring specialist assessment"], "answer": 3, "explanation": "Type 1 coved right-precordial ST elevation is characteristic. Why not the others: A. Long-QT syndrome — Repolarization abnormality is prolonged QT, not type 1 coved ST.; B. WPW — Pre-excitation delta wave and short PR dominate.; C. Arrhythmogenic RV cardiomyopathy — May show epsilon waves/T inversion and ventricular arrhythmias, not diagnostic coved pattern.", "pearl": "Type 1 coved right-precordial ST elevation is characteristic.", "srcAnswer": "D"}, {"num": 39, "level": "Clinical", "question": "A child on QT-prolonging medication develops recurrent polymorphic VT twisting around baseline. Best immediate adjunct while correcting triggers?", "options": ["Verapamil loading", "Digoxin loading", "Adenosine as primary therapy", "IV magnesium sulfate with expert resuscitation support"], "answer": 3, "explanation": "Magnesium is a standard treatment for torsades, along with correcting K and QT drugs. Why not the others: A. Verapamil loading — Not the preferred torsades treatment.; B. Digoxin loading — May worsen arrhythmia and does not correct QT mechanism.; C. Adenosine as primary therapy — Not a treatment for polymorphic ventricular tachycardia.", "pearl": "Magnesium is a standard treatment for torsades, along with correcting K and QT drugs.", "srcAnswer": "D"}, {"num": 40, "level": "Integrated", "question": "A child on diuretics has K 2.6 mmol/L with flattened T waves and prominent U waves. Best interpretation?", "options": ["Hypokalemia-related repolarization changes", "Hyperkalemia with peaked T waves", "Acute pericarditis", "WPW pre-excitation"], "answer": 0, "explanation": "Flattened T and U waves support hypokalemia. Why not the others: B. Hyperkalemia with peaked T waves — Hyperkalemia classically produces tall peaked T and QRS widening.; C. Acute pericarditis — Diffuse ST elevation/PR depression rather than U waves.; D. WPW pre-excitation — Delta wave and short PR are different features.", "pearl": "Flattened T and U waves support hypokalemia.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day21',label:'Day 21',set:'Quiz 2',href:'Day21/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day21_QuizSet2_Q21-40_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 21 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 21–40</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 21 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 21'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 21');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day21:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
