<script>
const quiz=[{"num": 79, "level": "Integrated revision", "question": "A child receiving loop diuretics has AKI. Which statement about FeNa is most accurate?", "options": ["A FeNa above 1% always proves ATN", "Diuretics can make FeNa less reliable", "A FeNa below 1% excludes glomerulonephritis", "FeNa is unaffected by saline infusion"], "answer": 1, "explanation": "Loop diuretics increase urinary sodium, confounding FeNa. Why not the others: A. A FeNa above 1% always proves ATN — High FeNa can reflect diuretics and other causes.; C. A FeNa below 1% excludes glomerulonephritis — Low FeNa does not exclude intrinsic causes.; D. FeNa is unaffected by saline infusion — Recent fluids can also change urine sodium indices.", "pearl": "", "srcAnswer": "B"}, {"num": 80, "level": "Integrated revision", "question": "A child with AKI, diarrhoea and pallor has thrombocytopenia and schistocytes. What is the leading syndrome?", "options": ["Poststreptococcal glomerulonephritis", "Typical haemolytic uraemic syndrome", "Acute interstitial nephritis", "Minimal-change nephrotic syndrome"], "answer": 1, "explanation": "Microangiopathic haemolysis, thrombocytopenia and AKI suggest HUS. Why not the others: A. Poststreptococcal glomerulonephritis — PSGN features nephritic urine and low C3, not a characteristic MAHA triad.; C. Acute interstitial nephritis — AIN often follows drug exposure with inflammatory urine findings.; D. Minimal-change nephrotic syndrome — Minimal change usually causes heavy proteinuria and oedema.", "pearl": "", "srcAnswer": "B"}, {"num": 81, "level": "Integrated revision", "question": "Which fluid is preferred initially for routine IV maintenance in most hospitalized children under NICE NG29?", "options": ["0.45% sodium chloride without glucose", "0.18% sodium chloride with dextrose", "An isotonic crystalloid with appropriate glucose", "Sterile water alone"], "answer": 2, "explanation": "NICE recommends isotonic crystalloid sodium 131–154 mmol/L, with glucose as clinically indicated. Why not the others: A. 0.45% sodium chloride without glucose — Hypotonic saline is not NICE’s routine starting choice.; B. 0.18% sodium chloride with dextrose — Very hypotonic fluids raise hospital-acquired hyponatraemia risk.; D. Sterile water alone — Sterile water IV would be unsafe.", "pearl": "", "srcAnswer": "C"}, {"num": 82, "level": "Integrated revision", "question": "What is the best interpretation of a falling creatinine after successful relief of bilateral urinary obstruction?", "options": ["Evidence against any AKI ever having occurred", "Improvement of a reversible postrenal component", "Proof of primary glomerulonephritis", "Confirmation of irreversible cortical necrosis"], "answer": 1, "explanation": "Rapid improvement after relief supports postrenal reversibility. Why not the others: A. Evidence against any AKI ever having occurred — AKI may have been present before decompression.; C. Proof of primary glomerulonephritis — GN does not typically reverse with bladder decompression.; D. Confirmation of irreversible cortical necrosis — Irreversible cortical necrosis would not promptly resolve.", "pearl": "", "srcAnswer": "B"}, {"num": 83, "level": "Integrated revision", "question": "A 7-year-old with facial oedema, cola-coloured urine and hypertension develops AKI. Which urine finding best supports a nephritic process?", "options": ["Broad waxy casts", "Lipid-laden oval fat bodies", "Isolated glycosuria", "RBC casts"], "answer": 3, "explanation": "RBC casts support glomerular bleeding. Why not the others: A. Broad waxy casts — Broad waxy casts suggest chronic severe kidney disease.; B. Lipid-laden oval fat bodies — Oval fat bodies favor nephrotic lipiduria.; C. Isolated glycosuria — Glycosuria suggests proximal tubular dysfunction.", "pearl": "", "srcAnswer": "D"}, {"num": 84, "level": "Integrated revision", "question": "A septic child with AKI receives antibiotics. Which prescribing adjustment is most important?", "options": ["Double all doses because creatinine rises", "Give nephrotoxic combinations without monitoring", "Review renal clearance and dose interval while treating infection promptly", "Automatically stop all antimicrobials"], "answer": 2, "explanation": "Renal dosing and stewardship preserve effective treatment with reduced toxicity. Why not the others: A. Double all doses because creatinine rises — Dose escalation without PK rationale risks accumulation.; B. Give nephrotoxic combinations without monitoring — Avoidable nephrotoxin exposure should be minimized.; D. Automatically stop all antimicrobials — Untreated sepsis worsens AKI.", "pearl": "", "srcAnswer": "C"}, {"num": 85, "level": "Integrated revision", "question": "A postoperative child has Na 126, concentrated urine and clinically euvolaemic status. What physiology most strongly supports SIADH?", "options": ["Nonosmotic ADH causing impaired free-water excretion", "Osmotic diuresis from glucosuria", "Obligate sodium loss from renal salt wasting", "Suppressed ADH with maximally dilute urine"], "answer": 0, "explanation": "ADH-mediated water retention dilutes serum sodium. Why not the others: B. Osmotic diuresis from glucosuria — Osmotic diuresis produces different urine and volume findings.; C. Obligate sodium loss from renal salt wasting — Renal salt wasting usually involves hypovolaemia and natriuresis.; D. Suppressed ADH with maximally dilute urine — SIADH has inappropriate water retention, not dilute urine.", "pearl": "", "srcAnswer": "A"}, {"num": 86, "level": "Integrated revision", "question": "A 2-year-old has Na 160 and shock from diarrhoea. What is the first priority?", "options": ["Restrict all fluids until sodium falls", "Start free water IV bolus", "Immediately lower sodium to 140 within two hours", "Restore circulation with isotonic resuscitation before controlled deficit correction"], "answer": 3, "explanation": "Shock takes priority; controlled sodium correction follows. Why not the others: A. Restrict all fluids until sodium falls — Fluid restriction worsens shock.; B. Start free water IV bolus — IV free water bolus is dangerous.; C. Immediately lower sodium to 140 within two hours — Rapid correction risks cerebral oedema.", "pearl": "", "srcAnswer": "D"}, {"num": 87, "level": "Integrated revision", "question": "A child on diuretics has K 2.6 mmol/L and prominent U waves. Which abnormality is most consistent?", "options": ["Hypokalaemia", "Hypernatraemia", "Hypermagnesaemia", "Hyperkalaemia"], "answer": 0, "explanation": "Low K and U waves are characteristic of hypokalaemia. Why not the others: B. Hypernatraemia — High Na does not characteristically cause U waves.; C. Hypermagnesaemia — Magnesium excess causes different conduction findings.; D. Hyperkalaemia — Hyperkalaemia causes peaked T and QRS changes.", "pearl": "", "srcAnswer": "A"}, {"num": 88, "level": "Integrated revision", "question": "A child with tumour lysis syndrome has high phosphate, low calcium and AKI. Which principle is safest?", "options": ["Give calcium routinely for asymptomatic laboratory hypocalcaemia", "Avoid unnecessary calcium loading; treat symptomatic hypocalcaemia with specialist guidance", "Assume phosphate is low in tumour lysis", "Replace phosphate aggressively"], "answer": 1, "explanation": "Treat symptomatic hypocalcaemia carefully while controlling phosphate and TLS. Why not the others: A. Give calcium routinely for asymptomatic laboratory hypocalcaemia — Calcium may increase calcium-phosphate deposition when phosphate is high.; C. Assume phosphate is low in tumour lysis — TLS often causes hyperphosphataemia.; D. Replace phosphate aggressively — Additional phosphate worsens hyperphosphataemia.", "pearl": "", "srcAnswer": "B"}, {"num": 89, "level": "Integrated revision", "question": "A 20-kg child receives 1.4 L fluids and excretes 0.4 L urine plus 0.2 L stool over 24 h. What is the recorded balance (ignoring insensible losses)?", "options": ["+1.0 L", "+0.6 L", "+0.4 L", "+0.8 L"], "answer": 3, "explanation": "1.4−0.4−0.2=+0.8 L. Why not the others: A. +1.0 L — +1.0 ignores stool loss.; B. +0.6 L — +0.6 ignores one loss component.; C. +0.4 L — +0.4 undercounts net retention.", "pearl": "", "srcAnswer": "D"}, {"num": 90, "level": "Integrated revision", "question": "An adolescent with glucose 500 mg/dL has measured Na 128 mmol/L. Which principle is correct?", "options": ["A low Na proves SIADH regardless of glucose", "Glucose raises measured Na in every case", "Measured Na always equals tonicity-adjusted Na", "Hyperglycaemia lowers measured Na by transcellular water shift; interpret corrected Na"], "answer": 3, "explanation": "Corrected Na contextualizes water balance; correction factors vary. Why not the others: A. A low Na proves SIADH regardless of glucose — SIADH cannot be diagnosed without accounting for glucose.; B. Glucose raises measured Na in every case — Glucose does not always raise measured Na.; C. Measured Na always equals tonicity-adjusted Na — Hyperglycaemia can dilute measured sodium.", "pearl": "", "srcAnswer": "D"}, {"num": 91, "level": "Integrated revision", "question": "A child with crush injury has dark urine, dipstick positive for blood but few RBCs on microscopy, and rising creatinine. Which cause is most likely?", "options": ["Nephrotic lipiduria", "Isolated lower UTI", "Myoglobin-associated pigment nephropathy", "Immune haematuria from PSGN"], "answer": 2, "explanation": "Dipstick detects heme pigment; few RBCs with muscle injury suggests myoglobin. Why not the others: A. Nephrotic lipiduria — Lipiduria is not heme-positive dark urine.; B. Isolated lower UTI — UTI typically has pyuria/bacteriuria.; D. Immune haematuria from PSGN — Glomerular haematuria has RBCs/casts.", "pearl": "", "srcAnswer": "C"}, {"num": 92, "level": "Integrated revision", "question": "A child in vasopressor-dependent shock requires continuous solute and fluid control. Which modality is often advantageous where available?", "options": ["No extracorporeal option until shock resolves", "Routine forced diuresis only", "Continuous kidney replacement therapy", "Intermittent haemodialysis with rapid ultrafiltration"], "answer": 2, "explanation": "CKRT allows gradual fluid/solute management in unstable patients. Why not the others: A. No extracorporeal option until shock resolves — KRT may be lifesaving despite shock.; B. Routine forced diuresis only — Forced diuresis cannot replace renal support in severe AKI.; D. Intermittent haemodialysis with rapid ultrafiltration — Rapid IHD fluid shifts can worsen hypotension.", "pearl": "", "srcAnswer": "C"}, {"num": 93, "level": "Integrated revision", "question": "A child has first-morning uPCR 1.7 g/g, serum albumin 2.2 g/dL and edema. Which interpretation best follows the KDIGO 2025 protein threshold?", "options": ["Proteinuria is below the KDIGO nephrotic-range cutoff and requires reassessment", "Normal albumin is required for nephrotic syndrome", "A first-morning uPCR cannot be used for diagnosis", "The urine ratio alone confirms nephrotic-range proteinuria"], "answer": 0, "explanation": "The nephrotic-range uPCR cutoff is ≥2 g/g; low albumin does not replace quantification. Why not the others: B. Normal albumin is required for nephrotic syndrome — Hypoalbuminemia is characteristic, not exclusionary.; C. A first-morning uPCR cannot be used for diagnosis — First-morning uPCR is preferred to exclude orthostatic proteinuria.; D. The urine ratio alone confirms nephrotic-range proteinuria — 1.7 g/g is below the specified ≥2 g/g threshold.", "pearl": "", "srcAnswer": "A"}, {"num": 94, "level": "Integrated revision", "question": "A child with heavy proteinuria has edema despite low effective arterial volume. Which mechanism is most compatible with the underfill model?", "options": ["Increased oncotic pressure drives fluid into interstitium", "Reduced plasma oncotic pressure promotes interstitial fluid shift and RAAS activation", "Glomerular hematuria directly increases plasma oncotic pressure", "Primary renal sodium excretion produces volume contraction without edema"], "answer": 1, "explanation": "Hypoalbuminemia can reduce oncotic pressure and stimulate sodium retention via underfilling. Why not the others: A. Increased oncotic pressure drives fluid into interstitium — Higher oncotic pressure favors intravascular retention.; C. Glomerular hematuria directly increases plasma oncotic pressure — Hematuria does not restore albumin-dependent oncotic pressure.; D. Primary renal sodium excretion produces volume contraction without edema — Sodium loss does not explain edema with sodium retention.", "pearl": "", "srcAnswer": "B"}, {"num": 95, "level": "Integrated revision", "question": "A child treated for first-episode nephrotic syndrome has negative/trace urine protein for three consecutive mornings. Which response is demonstrated?", "options": ["Partial remission with persistent low-grade proteinuria", "Steroid-sensitive disease without established remission", "Complete remission", "Transient remission after one negative dipstick"], "answer": 2, "explanation": "Negative/trace proteinuria for ≥3 days meets the remission definition. Why not the others: A. Partial remission with persistent low-grade proteinuria — Partial remission requires proteinuria above the complete-remission range.; B. Steroid-sensitive disease without established remission — Negative/trace protein for three days already documents complete remission.; D. Transient remission after one negative dipstick — Three consecutive negative/trace days meet the complete remission definition.", "pearl": "", "srcAnswer": "C"}, {"num": 96, "level": "Integrated revision", "question": "Two consecutive relapses occur during alternate-day prednisolone taper or within 14 days of stopping it. What pattern is most appropriate?", "options": ["Congenital nephrotic syndrome", "Steroid-dependent nephrotic syndrome", "Infrequently relapsing nephrotic syndrome", "Steroid-resistant nephrotic syndrome"], "answer": 1, "explanation": "The temporal pattern of two consecutive relapses during/within 14 days of therapy meets dependence criteria. Why not the others: A. Congenital nephrotic syndrome — Congenital refers to onset in the first three months of life.; C. Infrequently relapsing nephrotic syndrome — This is dependence regardless of whether annual count is low.; D. Steroid-resistant nephrotic syndrome — Both episodes remitted, so resistance is not established.", "pearl": "", "srcAnswer": "B"}, {"num": 97, "level": "Integrated revision", "question": "A 5-year-old has typical idiopathic nephrotic syndrome, normal blood pressure and kidney function, and no gross hematuria. What is the usual initial biopsy strategy?", "options": ["Treat and assess steroid response without routine biopsy", "Biopsy at onset to distinguish minimal change from FSGS", "Biopsy at onset because uPCR exceeds 2 g/g", "Biopsy after remission to document the histologic diagnosis"], "answer": 0, "explanation": "Typical first-episode childhood nephrotic syndrome does not require biopsy at presentation. Why not the others: B. Biopsy at onset to distinguish minimal change from FSGS — Routine biopsy is not recommended for typical first-episode childhood nephrosis.; C. Biopsy at onset because uPCR exceeds 2 g/g — Nephrotic-range proteinuria alone does not mandate a biopsy.; D. Biopsy after remission to document the histologic diagnosis — Remission by itself is not an indication for biopsy.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day32',label:'Day 32',set:'Quiz 5',href:'Day32/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day32_QuizSet5_Q79-97_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 32 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 79–97</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 32 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 32'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 32');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day32:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
