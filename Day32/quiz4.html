<script>
const quiz=[{"num": 60, "level": "High-difficulty", "question": "A toddler with grade II VUR, no recurrent febrile UTI and no BBD is otherwise well. Which prophylaxis stance is most aligned with ISPN 2023?", "options": ["Proceed directly to ureteric reimplantation", "Give prophylaxis only if asymptomatic bacteriuria is found", "All grade II reflux requires prophylaxis until adolescence", "Do not automatically prescribe long-term prophylaxis solely for low-grade reflux"], "answer": 3, "explanation": "Prophylaxis decisions focus on high-grade reflux and recurrent UTI/BBD risks. Why not the others: A. Proceed directly to ureteric reimplantation — Surgery is not routine for uncomplicated low-grade VUR.; B. Give prophylaxis only if asymptomatic bacteriuria is found — Asymptomatic bacteriuria is not an indication.; C. All grade II reflux requires prophylaxis until adolescence — Benefit is less clear in low-grade reflux.", "pearl": "", "srcAnswer": "D"}, {"num": 61, "level": "Integrated", "question": "An 8-year-old with CAKUT, recurrent UTI, CKD G3a and proteinuria is being followed. Which monitoring plan best addresses both infection and progression risks?", "options": ["Only repeat VCUG while ignoring BP", "Urine cultures every week despite no symptoms", "Track BP, urine protein, eGFR, growth, BBD and recurrence pattern", "Renal DMSA every month"], "answer": 2, "explanation": "CAKUT care integrates structural, infectious and CKD progression surveillance. Why not the others: A. Only repeat VCUG while ignoring BP — CKD progression risk requires BP and proteinuria monitoring.; B. Urine cultures every week despite no symptoms — Routine surveillance cultures in asymptomatic children are discouraged.; D. Renal DMSA every month — Repeated nuclear imaging adds burden without routine benefit.", "pearl": "", "srcAnswer": "C"}, {"num": 62, "level": "Clinical", "question": "A 6-year-old with diarrheal dehydration has creatinine rising from 0.4 to 0.76 mg/dL in 36 hours, urine output preserved. Which interpretation is correct?", "options": ["AKI cannot be diagnosed until 7 days pass", "AKI is present by absolute and relative creatinine rise even without oliguria", "AKI requires anuria", "AKI is stage 3 by this creatinine ratio"], "answer": 1, "explanation": "Absolute rise ≥0.3 mg/dL within 48 h satisfies KDIGO AKI criterion. Why not the others: A. AKI cannot be diagnosed until 7 days pass — A rise within 48 h can establish AKI.; C. AKI requires anuria — Creatinine criteria are independent of urine-output criteria.; D. AKI is stage 3 by this creatinine ratio — The ratio is <3 and there is no stage-3 threshold described.", "pearl": "", "srcAnswer": "B"}, {"num": 63, "level": "High-difficulty", "question": "A 9-year-old has serum Na 118 mmol/L, generalized seizure and no signs of volume overload. What is the immediate treatment principle?", "options": ["Oral sodium tablets only", "Fluid restriction alone while seizure continues", "Rapid correction to 140 within an hour", "Prompt controlled hypertonic saline bolus per emergency protocol with close sodium monitoring"], "answer": 3, "explanation": "Seizures from severe hyponatremia require emergency hypertonic saline; exact protocol must be locally verified. Why not the others: A. Oral sodium tablets only — Not reliable for an active seizure.; B. Fluid restriction alone while seizure continues — Severe symptomatic hyponatremia needs urgent sodium correction.; C. Rapid correction to 140 within an hour — Overcorrection risks neurologic injury.", "pearl": "", "srcAnswer": "D"}, {"num": 64, "level": "Clinical", "question": "An oliguric child has K 7.0 mmol/L with QRS widening. Which immediate intervention addresses myocardial membrane excitability?", "options": ["Sodium polystyrene sulfonate alone", "Insulin with glucose alone", "IV calcium under ECG monitoring", "Dialysis before any cardiac stabilization"], "answer": 2, "explanation": "Calcium stabilizes myocardium while K-shifting and removal measures are arranged. Why not the others: A. Sodium polystyrene sulfonate alone — Onset is too slow for ECG-threatening hyperkalemia.; B. Insulin with glucose alone — Shifts K intracellularly but does not directly stabilize myocardium.; D. Dialysis before any cardiac stabilization — Definitive removal may be needed but stabilization cannot wait.", "pearl": "", "srcAnswer": "C"}, {"num": 65, "level": "Conceptual", "question": "A 4-year-old with nephrotic-range proteinuria has albumin 1.9 g/dL, edema and normal complement. Which process best explains edema?", "options": ["Reduced plasma oncotic pressure plus renal sodium retention", "Isolated hematuria-induced osmotic diuresis", "Primary hypernatremia without sodium retention", "Elevated serum albumin raising interstitial oncotic pressure"], "answer": 0, "explanation": "Underfill and overfill mechanisms may coexist in nephrotic syndrome. Why not the others: B. Isolated hematuria-induced osmotic diuresis — Hematuria does not explain generalized nephrotic edema.; C. Primary hypernatremia without sodium retention — Nephrotic edema is multifactorial.; D. Elevated serum albumin raising interstitial oncotic pressure — Albumin is low, not high.", "pearl": "", "srcAnswer": "A"}, {"num": 66, "level": "Integrated", "question": "A 5-year-old with first-episode steroid-sensitive nephrotic syndrome is treated under Indian ISPN 2021 protocol. Which induction framework is correct?", "options": ["Alternate-day treatment only from day one", "Daily 12 weeks without alternate-day phase", "Daily 4 weeks followed by alternate-day 4 weeks as the sole ISPN 2021 default", "Daily prednisolone for 6 weeks followed by alternate-day prednisolone for 6 weeks"], "answer": 3, "explanation": "Label the source: ISPN 2021 uses 6+6; KDIGO 2025 accepts 4+4 or 6+6. Why not the others: A. Alternate-day treatment only from day one — Initial daily induction is required.; B. Daily 12 weeks without alternate-day phase — Does not match standard ISPN initial schedule.; C. Daily 4 weeks followed by alternate-day 4 weeks as the sole ISPN 2021 default — 4+4 is an accepted KDIGO 2025 option but differs from specified ISPN framework.", "pearl": "", "srcAnswer": "D"}, {"num": 67, "level": "Clinical", "question": "A 7-year-old develops cola urine, edema and hypertension 12 days after streptococcal pharyngitis; C3 is low. Which is the most likely diagnosis?", "options": ["Isolated urinary tract infection", "Minimal-change nephrotic syndrome", "Post-streptococcal glomerulonephritis", "IgA nephropathy presenting simultaneously with sore throat"], "answer": 2, "explanation": "PSGN has a latent interval after GAS infection and often transient C3 reduction. Why not the others: A. Isolated urinary tract infection — Does not typically cause low C3 with RBC casts.; B. Minimal-change nephrotic syndrome — Usually lacks gross hematuria and low C3.; D. IgA nephropathy presenting simultaneously with sore throat — Synpharyngitic timing differs from delayed PSGN.", "pearl": "", "srcAnswer": "C"}, {"num": 68, "level": "High-difficulty", "question": "A 3-year-old develops schistocytes, thrombocytopenia and AKI after bloody diarrhea; ADAMTS13 activity is 65%. Which interpretation is strongest?", "options": ["DIC is established without coagulation data", "TTP is confirmed because ADAMTS13 exceeds 10%", "Immune thrombocytopenia explains schistocytes and AKI", "STEC-associated HUS is more likely than severe ADAMTS13-deficient TTP"], "answer": 3, "explanation": "The antecedent diarrhea and preserved ADAMTS13 favor STEC-HUS; test stool for Shiga toxin. Why not the others: A. DIC is established without coagulation data — Coagulation consumption is not shown.; B. TTP is confirmed because ADAMTS13 exceeds 10% — Severe deficiency is generally <10%.; C. Immune thrombocytopenia explains schistocytes and AKI — ITP does not produce microangiopathic hemolysis.", "pearl": "", "srcAnswer": "D"}, {"num": 69, "level": "Conceptual", "question": "An infant with non-anion-gap metabolic acidosis has urine pH 6.4 despite plasma bicarbonate 12 mmol/L, nephrocalcinosis and growth failure. Which defect is most likely?", "options": ["Diarrheal bicarbonate loss with appropriate ammonium excretion", "Distal (type 1) renal tubular acidosis", "Type 4 RTA with hyperkalemia", "Proximal RTA with complete distal acidification"], "answer": 1, "explanation": "Failure to acidify urine in systemic acidosis plus nephrocalcinosis favors distal RTA. Why not the others: A. Diarrheal bicarbonate loss with appropriate ammonium excretion — Usually urine acidification/ammonium response is preserved.; C. Type 4 RTA with hyperkalemia — Type 4 commonly has hyperkalemia and may acidify urine.; D. Proximal RTA with complete distal acidification — Proximal RTA may acidify urine once plasma bicarbonate falls below threshold.", "pearl": "", "srcAnswer": "B"}, {"num": 70, "level": "Clinical", "question": "A child has hypokalemic alkalosis, hypomagnesemia, hypocalciuria and normal BP. Which tubulopathy is most likely?", "options": ["Gitelman syndrome", "Bartter syndrome with loop-like hypercalciuria", "Primary hyperaldosteronism", "Distal RTA"], "answer": 0, "explanation": "Gitelman resembles thiazide effect: hypomagnesemia and hypocalciuria. Why not the others: B. Bartter syndrome with loop-like hypercalciuria — Bartter more often has normal/high urinary calcium.; C. Primary hyperaldosteronism — Usually causes hypertension.; D. Distal RTA — Causes metabolic acidosis, not alkalosis.", "pearl": "", "srcAnswer": "A"}, {"num": 71, "level": "High-difficulty", "question": "ABG shows pH 7.25, HCO3 12 mmol/L and PCO2 35 mmHg. Which interpretation follows Winter formula?", "options": ["Metabolic alkalosis with hypoventilation", "Pure respiratory alkalosis", "Metabolic acidosis with superimposed respiratory acidosis", "Appropriate respiratory compensation"], "answer": 2, "explanation": "Winter: 1.5×12+8=26 ±2; actual 35 is too high. Why not the others: A. Metabolic alkalosis with hypoventilation — Bicarbonate is decreased.; B. Pure respiratory alkalosis — Bicarbonate is low and pH acidemic.; D. Appropriate respiratory compensation — Expected PCO2 is 26 ±2, not 35.", "pearl": "", "srcAnswer": "C"}, {"num": 72, "level": "Conceptual", "question": "A toddler has normoglycemic glycosuria, aminoaciduria, phosphaturia and bicarbonaturia. Which nephron process is affected?", "options": ["Selective distal hydrogen ion secretion", "Generalized proximal tubular reabsorption (Fanconi syndrome)", "Collecting duct aldosterone response alone", "Thick ascending limb NKCC2 alone"], "answer": 1, "explanation": "Fanconi syndrome is generalized proximal tubule dysfunction; consider cystinosis in children. Why not the others: A. Selective distal hydrogen ion secretion — Would not explain generalized solute losses.; C. Collecting duct aldosterone response alone — Does not cause broad proximal solute wasting.; D. Thick ascending limb NKCC2 alone — Explains Bartter phenotype, not glycosuria and aminoaciduria.", "pearl": "", "srcAnswer": "B"}, {"num": 73, "level": "Integrated", "question": "An oliguric child with HUS has refractory hyperkalemia, acidosis and pulmonary edema despite stabilization. Which indication most strongly supports urgent kidney replacement therapy?", "options": ["Refractory life-threatening electrolyte/volume complications", "A normal platelet count after transfusion", "A creatinine threshold of 2 mg/dL alone", "Mild isolated microscopic hematuria"], "answer": 0, "explanation": "AEIOU-type indications matter more than an isolated laboratory cutoff. Why not the others: B. A normal platelet count after transfusion — Platelets do not determine KRT need.; C. A creatinine threshold of 2 mg/dL alone — Dialysis is not triggered by one creatinine number.; D. Mild isolated microscopic hematuria — This does not justify dialysis.", "pearl": "", "srcAnswer": "A"}, {"num": 74, "level": "Clinical", "question": "A 9-year-old with gross hematuria, RBC casts and rapidly rising creatinine has suspected RPGN. Which diagnostic step best avoids delay to disease-specific therapy?", "options": ["Urgent nephrology review, serology and kidney biopsy when safe", "Give routine nephrotic prednisolone without defining etiology", "Treat as uncomplicated cystitis without microscopy", "Four-week empirical observation before serology"], "answer": 0, "explanation": "RPGN requires expedited biopsy and targeted therapy after stabilization. Why not the others: B. Give routine nephrotic prednisolone without defining etiology — RPGN treatment depends on cause.; C. Treat as uncomplicated cystitis without microscopy — RBC casts indicate glomerular bleeding.; D. Four-week empirical observation before serology — Rapidly progressive disease requires urgent evaluation.", "pearl": "", "srcAnswer": "A"}, {"num": 75, "level": "High-difficulty", "question": "A 6-year-old has sodium 150, chloride 115, bicarbonate 14 and albumin 2 g/dL. Which interpretation of the uncorrected anion gap is correct?", "options": ["Uncorrected AG is 35 mmol/L", "Uncorrected AG is 21 mmol/L; hypoalbuminemia makes the corrected gap higher", "Hypoalbuminemia increases the measured uncorrected gap", "Uncorrected AG is 7 mmol/L"], "answer": 1, "explanation": "AG=Na−(Cl+HCO3)=21; low albumin masks additional unmeasured anions. Why not the others: A. Uncorrected AG is 35 mmol/L — This incorrectly excludes chloride.; C. Hypoalbuminemia increases the measured uncorrected gap — Low albumin reduces the uncorrected AG.; D. Uncorrected AG is 7 mmol/L — Arithmetic should be 150−(115+14)=21.", "pearl": "", "srcAnswer": "B"}, {"num": 76, "level": "Integrated revision", "question": "In a 10-year-old with baseline creatinine 0.5 mg/dL, the value is 1.1 mg/dL on day 4. No urine data are available. What is the creatinine-based AKI stage?", "options": ["Stage 2", "Stage 3", "No AKI", "Stage 1"], "answer": 0, "explanation": "2.2× baseline falls in stage 2. Why not the others: B. Stage 3 — Stage 3 needs ≥3×, KRT or another stage-3 criterion.; C. No AKI — A rise above 1.5× baseline in 7 days qualifies.; D. Stage 1 — Stage 1 covers 1.5–1.9×, not 2.2×.", "pearl": "", "srcAnswer": "A"}, {"num": 77, "level": "Integrated revision", "question": "A child has no urine output for 13 hours despite a patent catheter. What KDIGO urine-output stage is met?", "options": ["Stage 3", "Stage 2", "Stage 1", "Not stageable without creatinine"], "answer": 0, "explanation": "Anuria ≥12 h is stage 3. Why not the others: B. Stage 2 — Anuria for 13 h meets stage 3, not merely stage 2.; C. Stage 1 — Anuria for 13 h is beyond stage 1.; D. Not stageable without creatinine — Urine output alone can stage AKI.", "pearl": "", "srcAnswer": "A"}, {"num": 78, "level": "Integrated revision", "question": "A boy has oliguria, a distended bladder and a poor urinary stream. Which first investigation most directly evaluates obstruction?", "options": ["Fractional excretion of sodium", "Kidney biopsy", "Renal-bladder ultrasound", "Complement C3 assay"], "answer": 2, "explanation": "Ultrasound assesses hydronephrosis and bladder distension promptly. Why not the others: A. Fractional excretion of sodium — FeNa does not diagnose anatomical obstruction.; B. Kidney biopsy — Biopsy does not evaluate outlet obstruction first.; D. Complement C3 assay — C3 is useful in selected glomerulonephritis.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day32',label:'Day 32',set:'Quiz 4',href:'Day32/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day32_QuizSet4_Q60-78_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 32 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 60–78</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 32 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 32'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 32');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day32:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
