const quiz=[{"num": 1, "level": "Basic", "question": "An 8-year-old with bilateral renal dysplasia has an eGFR of 72 mL/min/1.73 m² on repeated measurements over 5 months and persistent albuminuria. Which CKD G category applies?", "options": ["G2 (60–89 mL/min/1.73 m²)", "G1 (≥90)", "G3a (45–59)", "G3b (30–44)"], "answer": 0, "explanation": "G category follows persistent eGFR range; albuminuria provides an additional risk axis. Why not the others: B. G1 (≥90) — The measured eGFR is below 90.; C. G3a (45–59) — The value is above the G3a range.; D. G3b (30–44) — The value is above the G3b range.", "pearl": "", "srcAnswer": "A"}, {"num": 2, "level": "Conceptual", "question": "A 9-year-old has congenital solitary kidney, persistent albuminuria and eGFR 105 for 7 months. Which statement about CKD is correct?", "options": ["Structural kidney abnormality with health implications can establish CKD despite preserved eGFR", "An isolated high eGFR excludes kidney disease", "CKD requires eGFR <60 for at least 3 months", "CKD diagnosis requires dialysis dependence"], "answer": 0, "explanation": "CKD is chronic structural or functional abnormality, not merely a low creatinine-based eGFR. Why not the others: B. An isolated high eGFR excludes kidney disease — Hyperfiltration may coexist with nephron deficit.; C. CKD requires eGFR <60 for at least 3 months — Structural damage can establish CKD at normal GFR.; D. CKD diagnosis requires dialysis dependence — Kidney failure is only one stage of CKD.", "pearl": "", "srcAnswer": "A"}, {"num": 3, "level": "Clinical", "question": "An 11-year-old with CAKUT has eGFR 38 mL/min/1.73 m² stable for 6 months. Which CKD G category is appropriate?", "options": ["G4", "G3a", "G3b", "G5"], "answer": 2, "explanation": "eGFR 30–44 corresponds to G3b; pediatric CKD monitoring also requires growth and BP assessment. Why not the others: A. G4 — G4 is 15–29.; B. G3a — G3a is 45–59.; D. G5 — G5 is <15.", "pearl": "", "srcAnswer": "C"}, {"num": 4, "level": "Basic", "question": "A 12-year-old with reflux nephropathy has persistent urine albumin-to-creatinine ratio 460 mg/g. Which KDIGO albuminuria category applies?", "options": ["A2, moderately increased", "No albuminuria category can be assigned in children", "A1, normal to mildly increased", "A3, severely increased albuminuria"], "answer": 3, "explanation": "ACR >300 mg/g is A3; assess persistence and clinical context. Why not the others: A. A2, moderately increased — A2 is 30–300 mg/g.; B. No albuminuria category can be assigned in children — Albuminuria categories are part of CGA classification.; C. A1, normal to mildly increased — A1 is <30 mg/g.", "pearl": "", "srcAnswer": "D"}, {"num": 5, "level": "High-difficulty", "question": "A 5-year-old with growth failure has serum creatinine 0.8 mg/dL, height 100 cm. Using bedside Schwartz (eGFR = 0.413 × height cm / creatinine mg/dL), what is the approximate eGFR?", "options": ["41 mL/min/1.73 m²", "83 mL/min/1.73 m²", "52 mL/min/1.73 m²", "65 mL/min/1.73 m²"], "answer": 2, "explanation": "0.413×100/0.8 = 51.6 mL/min/1.73 m²; interpret with height, assay and chronicity. Why not the others: A. 41 mL/min/1.73 m² — This omits the 0.413 factor or miscalculates the ratio.; B. 83 mL/min/1.73 m² — This corresponds to using a substantially smaller creatinine.; D. 65 mL/min/1.73 m² — This exceeds the formula result for the given inputs.", "pearl": "", "srcAnswer": "C"}, {"num": 6, "level": "Clinical", "question": "A child with CKD G4 has pallor, Hb 8.9 g/dL and low transferrin saturation. Which sequence is most defensible before starting an erythropoiesis-stimulating agent?", "options": ["Treat presumed hemolysis without hemolysis evidence", "Start ESA without checking iron status", "Evaluate and correct iron deficiency and other reversible anemia contributors", "Transfuse red cells solely because Hb is below 9"], "answer": 2, "explanation": "KDIGO 2026 anemia guidance emphasizes evaluation, iron status and individualized ESA decisions in children. Why not the others: A. Treat presumed hemolysis without hemolysis evidence — CKD anemia is often hypoproliferative, not hemolytic.; B. Start ESA without checking iron status — Iron deficiency can impair response and should be assessed.; D. Transfuse red cells solely because Hb is below 9 — Transfusion is individualized; unnecessary sensitization matters for transplantation.", "pearl": "", "srcAnswer": "C"}, {"num": 7, "level": "High-difficulty", "question": "A child on peritoneal dialysis has Hb 10.6 g/dL while receiving ESA, is asymptomatic and has stable iron indices. Which statement about a universal pediatric hemoglobin target is most accurate?", "options": ["There is no single high-certainty pediatric maintenance Hb target; individualize and avoid overtreatment", "ESA should be stopped whenever Hb exceeds 10 g/dL", "All children must be driven above 13.5 g/dL", "Hb below 12 mandates transfusion regardless of symptoms"], "answer": 0, "explanation": "KDIGO 2026 explicitly notes limited pediatric RCT evidence for a fixed maintenance Hb target. Why not the others: B. ESA should be stopped whenever Hb exceeds 10 g/dL — This rigid cutoff is not a pediatric guideline rule.; C. All children must be driven above 13.5 g/dL — Higher targets are not established and may cause harm.; D. Hb below 12 mandates transfusion regardless of symptoms — Transfusion depends on clinical need and transplant considerations.", "pearl": "", "srcAnswer": "A"}, {"num": 8, "level": "Clinical", "question": "A 7-year-old with CKD G4 has high phosphate, rising PTH and low growth velocity. Which monitoring set best addresses CKD-mineral bone disorder?", "options": ["Serum vitamin B12 and folate alone", "Urine calcium alone", "Serial calcium, phosphate, PTH and alkaline phosphatase interpreted together with growth", "A single PTH measurement alone"], "answer": 2, "explanation": "CKD-MBD management relies on serial trends and pediatric growth/bone context. Why not the others: A. Serum vitamin B12 and folate alone — These address alternative anemia causes, not CKD-MBD.; B. Urine calcium alone — It cannot characterize CKD-MBD.; D. A single PTH measurement alone — Trends and multiple biochemical variables are needed.", "pearl": "", "srcAnswer": "C"}, {"num": 9, "level": "Integrated", "question": "An 8-year-old with CKD G3b has persistent hypertension and proteinuria. What is the principal renoprotective rationale for ACE inhibitor therapy when tolerated?", "options": ["Reduce intraglomerular pressure and proteinuria while controlling BP", "Increase glomerular capillary pressure to raise eGFR acutely", "Prevent UTI by sterilizing refluxing urine", "Correct anemia by increasing erythropoietin secretion"], "answer": 0, "explanation": "RAAS blockade is considered for proteinuric CKD, with potassium and creatinine monitoring. Why not the others: B. Increase glomerular capillary pressure to raise eGFR acutely — This could worsen protein leakage.; C. Prevent UTI by sterilizing refluxing urine — ACE inhibitors do not treat infection.; D. Correct anemia by increasing erythropoietin secretion — RAAS blockade is not an anemia treatment.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "Clinical", "question": "A child with proteinuric CKD starts an ACE inhibitor. Which early follow-up safety panel is most important?", "options": ["Blood pressure and ferritin only", "Blood pressure, serum creatinine and potassium", "Urine culture and CRP only", "Serum calcium and alkaline phosphatase only"], "answer": 1, "explanation": "RAAS blockade can alter potassium and creatinine; clinical volume status also matters. Why not the others: A. Blood pressure and ferritin only — Ferritin does not detect RAAS-blockade hyperkalemia or GFR changes.; C. Urine culture and CRP only — Infection tests do not monitor ACE inhibitor toxicity.; D. Serum calcium and alkaline phosphatase only — These are CKD-MBD markers rather than immediate ACE inhibitor safety tests.", "pearl": "", "srcAnswer": "B"}, {"num": 11, "level": "Clinical", "question": "A 4-year-old with CKD and severe growth failure has poor caloric intake and metabolic acidosis. What should precede consideration of recombinant growth hormone?", "options": ["Optimize nutrition, acidosis, CKD-MBD and other modifiable causes of poor growth", "Use protein restriction to suppress all growth signals", "Start growth hormone without nutritional assessment", "Delay growth assessment until kidney transplantation"], "answer": 0, "explanation": "Correct reversible contributors before specialist-directed growth hormone evaluation. Why not the others: B. Use protein restriction to suppress all growth signals — Children need adequate age-appropriate nutrition.; C. Start growth hormone without nutritional assessment — Untreated nutritional deficits limit response.; D. Delay growth assessment until kidney transplantation — Growth surveillance is necessary throughout CKD.", "pearl": "", "srcAnswer": "A"}, {"num": 12, "level": "High-difficulty", "question": "A child with CKD G5 has progressive anorexia, refractory fluid overload and declining school attendance despite maximal conservative care. Which factor most strongly supports dialysis initiation?", "options": ["Serum creatinine alone reaching a fixed arbitrary value", "A normal serum potassium on one blood draw", "Clinical uremic burden and refractory complications rather than an isolated eGFR threshold", "The first appearance of mild isolated microscopic hematuria"], "answer": 2, "explanation": "Pediatric dialysis timing integrates symptoms, growth, nutrition, biochemical and volume complications. Why not the others: A. Serum creatinine alone reaching a fixed arbitrary value — Creatinine depends on muscle mass and is not a sole dialysis trigger.; B. A normal serum potassium on one blood draw — Normal potassium does not exclude severe uremic indications.; D. The first appearance of mild isolated microscopic hematuria — Hematuria alone does not mandate dialysis.", "pearl": "", "srcAnswer": "C"}, {"num": 13, "level": "Conceptual", "question": "A stable school-aged child needs chronic home-based kidney replacement therapy while awaiting transplantation. Which modality offers continuous solute and fluid management without vascular access?", "options": ["Intermittent hemodialysis", "Continuous veno-venous hemofiltration", "Isolated ultrafiltration", "Peritoneal dialysis"], "answer": 3, "explanation": "Peritoneal dialysis is a common home modality for children, subject to patient suitability. Why not the others: A. Intermittent hemodialysis — Requires extracorporeal vascular access.; B. Continuous veno-venous hemofiltration — Usually intensive-care extracorporeal support, not routine home therapy.; C. Isolated ultrafiltration — Does not provide the same ongoing solute clearance as dialysis.", "pearl": "", "srcAnswer": "D"}, {"num": 14, "level": "Clinical", "question": "A child on peritoneal dialysis develops cloudy effluent and abdominal pain without an obvious exit-site infection. What is the immediate diagnostic priority?", "options": ["Remove the catheter before any effluent testing", "Send effluent for cell count/differential and culture, and promptly assess for peritonitis", "Assume sterile chemical irritation and wait a week", "Obtain only a serum urea level"], "answer": 1, "explanation": "Cloudy PD effluent is peritonitis until assessed; management follows current local PD infection protocol. Why not the others: A. Remove the catheter before any effluent testing — Initial testing and targeted treatment generally precede catheter decisions.; C. Assume sterile chemical irritation and wait a week — Cloudy effluent with pain requires urgent peritonitis evaluation.; D. Obtain only a serum urea level — Serum urea does not diagnose PD-associated peritonitis.", "pearl": "", "srcAnswer": "B"}, {"num": 15, "level": "Integrated", "question": "A 10-year-old with a solitary dysplastic kidney has BP above the 95th percentile, ACR 380 mg/g and eGFR 62. Which risk-modifying priority is most directly supported?", "options": ["Reassure because eGFR is above 60", "Order kidney biopsy before checking BP technique", "Start long-term antibiotic prophylaxis solely for solitary kidney", "Confirm and treat hypertension and proteinuria while tracking eGFR and growth"], "answer": 3, "explanation": "In pediatric CKD, BP and proteinuria are actionable progression risks. Why not the others: A. Reassure because eGFR is above 60 — Proteinuria and hypertension predict progression even with G2.; B. Order kidney biopsy before checking BP technique — Structural CAKUT with clear imaging does not always need biopsy.; C. Start long-term antibiotic prophylaxis solely for solitary kidney — Solitary kidney alone is not an indication for prophylaxis.", "pearl": "", "srcAnswer": "D"}, {"num": 16, "level": "Basic", "question": "A 10-year-old has auscultatory BP persistently at the 96th percentile for age, sex and height across appropriate visits. Under AAP 2017 terminology, which classification is correct?", "options": ["Elevated BP only (90th to <95th percentile)", "Hypertension requires BP at the 99th percentile", "Hypertension (at least the 95th percentile)", "Normotension because the child is younger than 13"], "answer": 2, "explanation": "For children younger than 13, hypertension begins at the 95th percentile, confirmed appropriately. Why not the others: A. Elevated BP only (90th to <95th percentile) — The measured percentile exceeds that range.; B. Hypertension requires BP at the 99th percentile — The diagnostic threshold is lower.; D. Normotension because the child is younger than 13 — Percentile thresholds apply in this age group.", "pearl": "", "srcAnswer": "C"}, {"num": 17, "level": "Clinical", "question": "A 14-year-old has repeatedly measured clinic BP 132/82 mmHg with correct technique. Under AAP 2017 adolescent thresholds, how is this categorized?", "options": ["Stage 2 hypertension", "Normal BP", "Stage 1 hypertension", "Elevated BP"], "answer": 2, "explanation": "AAP 2017 uses fixed adult-like cutoffs for age ≥13 years. Why not the others: A. Stage 2 hypertension — Stage 2 begins at ≥140/90 for this age threshold.; B. Normal BP — Both values exceed normal adolescent limits.; D. Elevated BP — At ≥13 years, elevated is 120–129/<80.", "pearl": "", "srcAnswer": "C"}, {"num": 18, "level": "High-difficulty", "question": "An 11-year-old has high office BP on three visits but normal 24-hour ambulatory mean and load under the lab reference. What is the most likely phenotype?", "options": ["Nocturnal hypertension", "White-coat hypertension", "Sustained hypertension", "Masked hypertension"], "answer": 1, "explanation": "ABPM separates white-coat, masked and sustained patterns. Why not the others: A. Nocturnal hypertension — Requires elevated asleep ambulatory measurements.; C. Sustained hypertension — Both office and ambulatory BP are elevated.; D. Masked hypertension — Masked HTN has normal office but high ambulatory BP.", "pearl": "", "srcAnswer": "B"}, {"num": 19, "level": "Clinical", "question": "A 12-year-old with repaired coarctation has normal clinic BP but elevated ambulatory systolic pressure. What is the phenotype?", "options": ["Isolated prehypertension", "White-coat hypertension", "Hypertensive emergency", "Masked hypertension"], "answer": 3, "explanation": "ABPM is valuable in high-risk children, including repaired coarctation. Why not the others: A. Isolated prehypertension — ABPM demonstrates actual hypertension.; B. White-coat hypertension — Office BP would be high with normal ABPM.; C. Hypertensive emergency — No acute end-organ injury is described.", "pearl": "", "srcAnswer": "D"}, {"num": 20, "level": "Clinical", "question": "A restless 6-year-old has an oscillometric BP 132/85 at triage. What should be done before assigning a chronic hypertension stage?", "options": ["Measure over clothing while the child is standing", "Repeat with correct cuff and auscultatory measurements after rest", "Diagnose sustained stage 2 from a single automated reading", "Use a smaller cuff to avoid underdiagnosis"], "answer": 1, "explanation": "Confirm elevated oscillometric readings by auscultation using correct cuff size. Why not the others: A. Measure over clothing while the child is standing — Technique can distort classification.; C. Diagnose sustained stage 2 from a single automated reading — A single oscillometric value is insufficient.; D. Use a smaller cuff to avoid underdiagnosis — Undersized cuffs overestimate BP.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day32',label:'Day 32',set:'Quiz 1',href:'Day32/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day32_QuizSet1_Q1-20_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 32 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–20</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 32 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 32'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 32');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day32:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
