const quiz=[{"num": 117, "level": "Integrated revision", "question": "Which feature is most helpful to distinguish disseminated intravascular coagulation (DIC) from uncomplicated HUS in a septic child?", "options": ["Presence of thrombocytopenia", "Marked coagulation-factor consumption with prolonged PT/aPTT and low fibrinogen", "Elevation of LDH", "Presence of anaemia"], "answer": 1, "explanation": "DIC commonly affects coagulation assays; HUS typically has relatively preserved PT/aPTT. Why not the others: A. Presence of thrombocytopenia — Low platelets are common in both.; C. Elevation of LDH — LDH can rise in haemolysis and tissue injury across several conditions.; D. Presence of anaemia — Anaemia can occur in both.", "pearl": "", "srcAnswer": "B"}, {"num": 118, "level": "Integrated revision", "question": "A child with TMA has seizures and renal failure. Which conclusion is safest?", "options": ["Neurological manifestations do not by themselves distinguish TTP from HUS variants", "Renal failure always excludes TTP", "TMA cannot affect the brain", "Seizures always prove TTP"], "answer": 0, "explanation": "Severe neurological involvement can occur in several TMAs; mechanism-specific tests are required. Why not the others: B. Renal failure always excludes TTP — TTP may involve kidneys, although severity patterns differ.; C. TMA cannot affect the brain — Microvascular injury may cause neurologic complications.; D. Seizures always prove TTP — Neurological symptoms are not pathognomonic.", "pearl": "", "srcAnswer": "A"}, {"num": 119, "level": "Integrated revision", "question": "A child has hyperkalaemia 6.1 mmol/L, mild normal-anion-gap acidosis and low aldosterone activity. Which RTA mechanism is most likely?", "options": ["Gitelman syndrome", "Type 2 RTA from isolated bicarbonate leak", "Type 1 RTA with isolated hypokalaemia", "Type 4 RTA due to reduced aldosterone effect"], "answer": 3, "explanation": "Aldosterone deficiency/resistance impairs K and acid excretion, often with acidic urine. Why not the others: A. Gitelman syndrome — Gitelman produces hypokalaemic metabolic alkalosis.; B. Type 2 RTA from isolated bicarbonate leak — Proximal RTA typically has low potassium and greater bicarbonate loss.; C. Type 1 RTA with isolated hypokalaemia — Distal RTA is usually hypokalaemic and associated with high urine pH.", "pearl": "", "srcAnswer": "D"}, {"num": 120, "level": "Integrated revision", "question": "Which urinary feature explains the risk of calcium-phosphate nephrocalcinosis in distal RTA?", "options": ["Alkaline urine with hypercalciuria and hypocitraturia", "Low urinary calcium with high citrate", "High urinary cystine in all cases", "Profound glycosuria alone"], "answer": 0, "explanation": "These changes favor calcium phosphate precipitation. Why not the others: B. Low urinary calcium with high citrate — That combination is not the characteristic distal-RTA stone profile.; C. High urinary cystine in all cases — Cystinuria is a distinct stone disorder.; D. Profound glycosuria alone — Glycosuria is a proximal solute loss and not the characteristic stone mechanism.", "pearl": "", "srcAnswer": "A"}, {"num": 121, "level": "Integrated revision", "question": "A child has HCO3 12 mmol/L and arterial PCO2 26 mmHg. What does Winter’s formula suggest?", "options": ["Superimposed respiratory alkalosis", "Superimposed respiratory acidosis", "Appropriate respiratory compensation for metabolic acidosis", "Primary metabolic alkalosis"], "answer": 2, "explanation": "Expected PCO2 = 1.5×12 + 8 = 26 ±2 mmHg. Why not the others: A. Superimposed respiratory alkalosis — Actual PCO2 is not below the expected range.; B. Superimposed respiratory acidosis — Actual PCO2 is not above the expected range.; D. Primary metabolic alkalosis — Low bicarbonate and acidemia indicate metabolic acidosis.", "pearl": "", "srcAnswer": "C"}, {"num": 122, "level": "Integrated revision", "question": "Why can the urine anion gap mislead in patients excreting large quantities of unmeasured urinary anions?", "options": ["It directly measures serum lactate", "It is unaffected by urinary ion composition", "It is identical to serum anion gap", "It estimates ammonium indirectly and assumes NH4+ is largely accompanied by chloride"], "answer": 3, "explanation": "Ketoanions, hippurate and other unmeasured anions can uncouple UAG from NH4+ excretion. Why not the others: A. It directly measures serum lactate — UAG uses urine Na, K and Cl only.; B. It is unaffected by urinary ion composition — Its interpretation depends on urinary ions and counteranions.; C. It is identical to serum anion gap — They use different compartments and purposes.", "pearl": "", "srcAnswer": "D"}, {"num": 123, "level": "Integrated revision", "question": "A child with confirmed cystinosis takes systemic cysteamine but continues to develop corneal crystal symptoms. Why may eye-specific therapy be needed?", "options": ["Topical cysteamine treats complement activation", "Corneal crystals always resolve without treatment by age 2", "Systemic cysteamine directly causes all corneal crystals", "The avascular cornea receives insufficient systemic cysteamine; topical cysteamine is used"], "answer": 3, "explanation": "Systemic treatment preserves organ function but corneal crystal control often requires local therapy. Why not the others: A. Topical cysteamine treats complement activation — It is directed at corneal cystine, not TMA.; B. Corneal crystals always resolve without treatment by age 2 — They may persist or progress without ocular therapy.; C. Systemic cysteamine directly causes all corneal crystals — Crystals result from cystine accumulation due to the genetic disease.", "pearl": "", "srcAnswer": "D"}, {"num": 124, "level": "Integrated revision", "question": "An infant has polyuria, severe hypernatraemia, high plasma osmolality and persistently dilute urine. What is the key physiology of nephrogenic diabetes insipidus?", "options": ["Excessive vasopressin release causes water retention", "Proximal bicarbonate leak", "Renal collecting ducts fail to respond adequately to vasopressin", "Severe ADAMTS13 deficiency"], "answer": 2, "explanation": "Nephrogenic DI produces inability to concentrate urine despite endogenous ADH. Why not the others: A. Excessive vasopressin release causes water retention — That would favor SIADH physiology.; B. Proximal bicarbonate leak — This causes type 2 RTA, not isolated water-concentration failure.; D. Severe ADAMTS13 deficiency — This causes TTP, not DI.", "pearl": "", "srcAnswer": "C"}, {"num": 125, "level": "Integrated revision", "question": "An adolescent with hypokalaemic alkalosis has very low urine chloride after recurrent vomiting. Which interpretation is most appropriate?", "options": ["Urine chloride <20 mmol/L proves Bartter", "Urine chloride <20 mmol/L proves Gitelman", "Extrarenal chloride loss is more likely than ongoing Bartter/Gitelman renal chloride wasting", "The patient has type 1 RTA"], "answer": 2, "explanation": "Vomiting often causes chloride-responsive alkalosis with low urinary chloride. Why not the others: A. Urine chloride <20 mmol/L proves Bartter — Bartter also typically wastes chloride.; B. Urine chloride <20 mmol/L proves Gitelman — Gitelman usually has inappropriate renal chloride wasting.; D. The patient has type 1 RTA — Distal RTA causes metabolic acidosis.", "pearl": "", "srcAnswer": "C"}, {"num": 126, "level": "Clinical", "question": "A 2-month-old has bilateral cataracts, normal liver function, no sepsis and elevated erythrocyte galactose after milk feeding. Which enzyme deficiency best fits?", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Aldolase B deficiency", "Galactose-1-phosphate uridyltransferase (GALT) deficiency", "Galactokinase (GALK1) deficiency"], "answer": 3, "explanation": "Isolated infantile cataracts with relatively mild systemic illness point to GALK1; this is a repair/retention item, not proof of mastery. Why not the others: A. Medium-chain acyl-CoA dehydrogenase deficiency — MCAD causes fasting intolerance with hypoketotic hypoglycemia.; B. Aldolase B deficiency — Hereditary fructose intolerance follows fructose/sucrose exposure, not milk lactose alone.; C. Galactose-1-phosphate uridyltransferase (GALT) deficiency — Classic galactosemia commonly causes systemic liver and sepsis manifestations.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase versus GALT versus hereditary fructose intolerance"}}, {"num": 127, "level": "Clinical", "question": "An infant has a fasting-triggered hypoketotic hypoglycemic crisis; newborn-screen acylcarnitines show dominant C8 elevation. Which disorder is most likely?", "options": ["VLCAD deficiency", "Propionic acidemia", "MCAD deficiency", "Maple syrup urine disease"], "answer": 2, "explanation": "C8 octanoylcarnitine is the discriminator for MCAD. Why not the others: A. VLCAD deficiency — VLCAD typically elevates C14:1.; B. Propionic acidemia — Propionic acidemia often raises C3 and causes high-anion-gap acidosis.; D. Maple syrup urine disease — MSUD has elevated branched-chain amino acids and alloisoleucine.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD deficiency — C8 acylcarnitine"}}, {"num": 128, "level": "Clinical", "question": "A teenager develops exertional angina and new regional LV dysfunction years after arterial switch repair for d-TGA. Which lesion should be excluded urgently?", "options": ["Neoaortic regurgitation alone", "Isolated branch pulmonary artery stenosis", "Residual atrial septal defect alone", "Transferred coronary ostial or proximal coronary obstruction"], "answer": 3, "explanation": "Regional dysfunction after ASO warrants coronary evaluation. Why not the others: A. Neoaortic regurgitation alone — Can cause LV loading but is less specific for regional ischemia.; B. Isolated branch pulmonary artery stenosis — Usually produces RV pressure effects rather than regional LV ischemia.; C. Residual atrial septal defect alone — Does not characteristically cause regional LV ischemia.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 19 Q23 — TGA"}}, {"num": 129, "level": "Clinical", "question": "A child after TAPVC repair develops pulmonary hypertension, recurrent chest infections and pulmonary venous congestion. Which complication best explains the pattern?", "options": ["Pulmonary venous anastomotic stenosis", "Residual small ASD alone", "Branch pulmonary artery stenosis", "Mild tricuspid regurgitation alone"], "answer": 0, "explanation": "Pulmonary venous restenosis after TAPVC repair causes pulmonary congestion. Why not the others: B. Residual small ASD alone — Usually cannot explain severe pulmonary venous congestion.; C. Branch pulmonary artery stenosis — Can raise RV pressure but does not directly cause venous congestion.; D. Mild tricuspid regurgitation alone — Does not produce a pulmonary venous obstruction pattern.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 19 Q28 — TAPVC"}}, {"num": 130, "level": "Clinical", "question": "A school-aged Fontan survivor develops edema, serum albumin 2.1 g/dL and increased stool alpha-1 antitrypsin clearance. Which complication is most likely?", "options": ["Fontan-associated liver disease alone", "Plastic bronchitis", "Fontan-associated protein-losing enteropathy", "Chylothorax"], "answer": 2, "explanation": "Stool alpha-1 antitrypsin loss is the key diagnostic discriminator. Why not the others: A. Fontan-associated liver disease alone — May cause portal changes but stool protein loss points to PLE.; B. Plastic bronchitis — Causes branching airway casts and respiratory symptoms.; D. Chylothorax — Requires pleural chylous effusion rather than intestinal protein loss.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 19 Q35 — Single ventricle"}}, {"num": 131, "level": "Clinical", "question": "A Fontan patient develops low output after an acute increase in pulmonary vascular resistance. What is the main hemodynamic mechanism?", "options": ["Increased subpulmonary RV stroke volume", "Improved pulmonary venous return", "Impaired passive cavopulmonary flow and reduced ventricular preload", "Increased systemic ventricular preload"], "answer": 2, "explanation": "Fontan flow depends critically on low PVR. Why not the others: A. Increased subpulmonary RV stroke volume — Fontan physiology lacks a subpulmonary ventricle.; B. Improved pulmonary venous return — Higher PVR impedes flow.; D. Increased systemic ventricular preload — Fontan preload generally falls when PVR rises.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 19 Q56 — Single ventricle"}}, {"num": 132, "level": "Clinical", "question": "A neonate with truncus arteriosus has controlled pulmonary overcirculation and heart failure. Under the specified Indian 2019 framework, what repair timing is favored?", "options": ["Definitive repair only after pulmonary vascular disease develops", "Early surgical repair at approximately 3–6 weeks of age", "Routine delay until one year", "Elective repair at 3–6 months"], "answer": 1, "explanation": "This is guideline-specific; surgical timing is individualized by anatomy and instability. Why not the others: A. Definitive repair only after pulmonary vascular disease develops — Pulmonary vascular disease is a reason to avoid delay.; C. Routine delay until one year — Delay is not the recommended strategy.; D. Elective repair at 3–6 months — Prolonged pulmonary overcirculation increases risk.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 19 Q70 — Truncus"}}, {"num": 133, "level": "Clinical", "question": "A 60-hour-old infant has persistent low glucose. Which statement correctly separates CPS transitional and PES persistent-hypoglycemia frameworks?", "options": ["PES begins persistent evaluation only after 7 days", "CPS transitional period extends to 72 h; PES persistent-disorder evaluation is emphasized after 48 h", "CPS defines all low glucose after 48 h as persistent", "Both guidelines define transition ending at 24 h"], "answer": 1, "explanation": "Do not transfer thresholds across differently scoped guidelines. Why not the others: A. PES begins persistent evaluation only after 7 days — The PES focus is after 48 h.; C. CPS defines all low glucose after 48 h as persistent — CPS transition is commonly through 72 h.; D. Both guidelines define transition ending at 24 h — The time windows differ.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}, {"num": 134, "level": "Clinical", "question": "A premature infant has ROP zone II, stage 2 and unequivocal plus disease. Under ETROP, which category applies?", "options": ["Type 1 ROP requiring prompt treatment assessment", "Observe until ridge becomes extraretinal proliferation", "Type 2 ROP for routine delayed review", "No ROP because stage 3 is absent"], "answer": 0, "explanation": "Zone II stage 2 plus is Type 1 ROP. Why not the others: B. Observe until ridge becomes extraretinal proliferation — Plus disease changes treatment threshold.; C. Type 2 ROP for routine delayed review — Zone II stage 2 plus is Type 1.; D. No ROP because stage 3 is absent — Type 1 includes stage 2 with plus in zone II.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 135, "level": "Clinical", "question": "At 36 weeks PMA, a preterm infant remains on nasal cannula 2.5 L/min without invasive ventilation. Under Jensen 2019 BPD severity grading, which grade applies?", "options": ["Grade 1 BPD", "Grade 2 BPD", "Grade 3 BPD", "No BPD by support-based definition"], "answer": 1, "explanation": "Jensen grade 2 includes nasal cannula >2 L/min or noninvasive positive-pressure support. Why not the others: A. Grade 1 BPD — Grade 1 is nasal cannula ≤2 L/min.; C. Grade 3 BPD — Grade 3 requires invasive mechanical ventilation.; D. No BPD by support-based definition — The respiratory support qualifies for grade 2.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 5 Q53 — Jensen BPD grade"}}];
const NB_CTX={srcId:'Day32',label:'Day 32',set:'Quiz 7',href:'Day32/quiz7.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day32_QuizSet7_Q117-135_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 32 Quiz 7 — Wrong Answer Report</h1><p><b>Questions:</b> 117–135</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 32 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 32'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 32');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day32:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['7']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['7']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 7 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=84eb225a"></script></body></html>
