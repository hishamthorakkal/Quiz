<script>
const quiz=[{"num": 31, "level": "Clinical/Application", "question": "DAT−, MCHC 37.5, spherocytes, paternal splenectomy. Most likely?", "options": ["HS", "G6PD", "ABO HDFN", "Physiologic"], "answer": 0, "explanation": "Classic HS pattern. Why not the others: B. G6PD — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.; C. ABO HDFN — ABO HDFN is immune and is usually supported by maternal-infant ABO incompatibility and often a positive DAT; DAT-negative hemolysis requires nonimmune causes such as HS/G6PD to be considered.; D. Physiologic — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: classic hs pattern.", "srcAnswer": "A"}, {"num": 32, "level": "Clinical/Application", "question": "36 wk infant had significant instability in last 24 h. This:", "options": ["Is a neurotoxicity risk factor", "Matters only if DAT+", "Makes albumin irrelevant", "Does not alter threshold"], "answer": 0, "explanation": "Recent significant instability is a neurotoxicity risk. Why not the others: B. Matters only if DAT+ — Clinical instability is an independent neurotoxicity risk; it does not require a positive DAT to affect bilirubin management.; C. Makes albumin irrelevant — Albumin remains relevant because a level <3.0 g/dL is independently listed as a neurotoxicity risk factor.; D. Does not alter threshold — Significant clinical instability in the previous 24 hours is an AAP neurotoxicity risk factor and therefore can lower treatment thresholds.", "pearl": "When a vignette resembles Q32, do not choose by the bilirubin number alone; recent significant instability is a neurotoxicity risk.", "srcAnswer": "A"}, {"num": 33, "level": "Clinical/Application", "question": "During escalation, TSB interval?", "options": ["Weekly", "24 h", "At least q2h", "Only after stopping lights"], "answer": 2, "explanation": "AAP recommends at least every 2 hours. Why not the others: A. Weekly — Weekly monitoring is incompatible with the rapid kinetics of hazardous neonatal hyperbilirubinemia during escalation.; B. 24 h — A 24-hour interval is far too slow during escalation; AAP recommends TSB at least every 2 hours.; D. Only after stopping lights — During escalation the trajectory must be followed while treatment is ongoing; waiting until lights stop could miss a rapidly rising TSB.", "pearl": "The rank-differentiating clue here is 'At least q2h'. Translate that clue into action: aap recommends at least every 2 hours.", "srcAnswer": "C"}, {"num": 34, "level": "Clinical/Application", "question": "DAT+ infant at escalation receives IVIG. What remains essential?", "options": ["Continue all escalation measures and exchange readiness", "Cancel exchange preparation", "Stop lights", "Stop TSB monitoring"], "answer": 0, "explanation": "IVIG is adjunctive and benefit uncertain. Why not the others: B. Cancel exchange preparation — IVIG has uncertain benefit and may not work fast enough; exchange readiness must continue while the infant remains near the exchange threshold.; C. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; D. Stop TSB monitoring — IVIG does not eliminate the need for q2h TSB monitoring during escalation because the bilirubin may continue to rise.", "pearl": "A useful one-line rule for this scenario is: IVIG is adjunctive and benefit uncertain.", "srcAnswer": "A"}, {"num": 35, "level": "Clinical/Application", "question": "39 wk, albumin 2.6, no hemolysis. Implication?", "options": ["Irrelevant", "Proves cholestasis", "Exchange regardless", "Neurotoxicity risk; may change threshold"], "answer": 3, "explanation": "Albumin <3.0 is a risk factor. Why not the others: A. Irrelevant — Albumin <3.0 g/dL is specifically an AAP neurotoxicity risk factor, so 2.6–2.8 g/dL materially changes threshold selection.; B. Proves cholestasis — Low albumin is nonspecific and does not diagnose cholestasis; cholestasis is identified by direct hyperbilirubinemia and clinical findings such as pale stools/dark urine.; C. Exchange regardless — Exchange transfusion is reserved for the exchange threshold or significant ABE; feeding problems alone do not mandate exchange at any bilirubin level.", "pearl": "In neonatal jaundice questions, this finding changes management because albumin <3.0 is a risk factor.", "srcAnswer": "D"}, {"num": 36, "level": "Clinical/Application", "question": "Severe jaundice + recurrent apnea + opisthotonos. Best?", "options": ["Repeat tomorrow", "Home lights", "Stop lights", "Urgent exchange + intensive support"], "answer": 3, "explanation": "Advanced ABE requires emergency exchange. Why not the others: A. Repeat tomorrow — Recurrent apnea with opisthotonos is advanced acute bilirubin encephalopathy; delaying reassessment until the next day risks irreversible kernicterus and is unsafe.; B. Home lights — Recurrent apnea/opisthotonos indicates advanced bilirubin neurotoxicity requiring NICU emergency management, not outpatient phototherapy.; C. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.", "pearl": "For bilirubin neurotoxicity and neurologic escalation, anchor the answer to the decisive clue in this stem: advanced abe requires emergency exchange.", "srcAnswer": "D"}, {"num": 37, "level": "Clinical/Application", "question": "35+5 wk well infant, no additional risks. Clinician uses additional-risk curve solely due to GA. Error?", "options": ["No effect", "Undertreatment", "Potential overtreatment from double-counting GA", "Missing cholestasis"], "answer": 2, "explanation": "GA is already built into the curves. Why not the others: A. No effect — Choosing the wrong AAP risk curve directly changes phototherapy/exchange thresholds and can materially alter management.; B. Undertreatment — Using a lower curve than indicated would tend toward earlier treatment (overtreatment), not undertreatment.; D. Missing cholestasis — The error described is threshold selection, not failure to investigate conjugated jaundice; there are no pale stools, dark urine or direct-bilirubin findings in this stem to suggest cholestasis.", "pearl": "When a vignette resembles Q37, do not choose by the bilirubin number alone; ga is already built into the curves.", "srcAnswer": "C"}, {"num": 38, "level": "Clinical/Application", "question": "Hb 9, retic 13%, DAT+, maternal anti-D. Mechanism?", "options": ["Reduced production", "IgG-mediated RBC destruction", "Biliary obstruction", "UGT overactivity"], "answer": 1, "explanation": "Rh alloantibody causes immune RBC destruction. Why not the others: A. Reduced production — Anti-D causes antibody-mediated RBC destruction, which increases bilirubin production and often produces anemia/reticulocytosis.; C. Biliary obstruction — Biliary obstruction causes conjugated cholestasis; maternal anti-D with anemia/reticulocytosis/DAT positivity indicates immune RBC destruction.; D. UGT overactivity — UGT1A1 handles bilirubin conjugation; maternal anti-D causes hemolysis upstream by targeting fetal/neonatal RBCs.", "pearl": "The rank-differentiating clue here is 'IgG-mediated RBC destruction'. Translate that clue into action: rh alloantibody causes immune rbc destruction.", "srcAnswer": "B"}, {"num": 39, "level": "Clinical/Application", "question": "Large cephalohematoma, normal Hb/retic, DAT−, rising bilirubin. Why?", "options": ["Immune hemolysis proven", "Cholestasis", "Phototherapy causes bilirubin", "Extravascular blood breakdown"], "answer": 3, "explanation": "Breakdown of pooled blood adds bilirubin load. Why not the others: A. Immune hemolysis proven — A cephalohematoma is an extravascular blood reservoir and can raise bilirubin even with normal Hb/retic and a negative DAT; immune hemolysis is not proven.; B. Cholestasis — A cephalohematoma raises unconjugated bilirubin through breakdown of extravascular blood; cholestasis would instead produce a direct-bilirubin pattern, often with dark urine or pale stools.; C. Phototherapy causes bilirubin — Phototherapy converts bilirubin to excretable photoisomers; it does not generate bilirubin.", "pearl": "A useful one-line rule for this scenario is: Breakdown of pooled blood adds bilirubin load.", "srcAnswer": "D"}, {"num": 40, "level": "Clinical/Application", "question": "TSB 18, direct 2.5. Value compared with AAP threshold?", "options": ["15.5", "18", "B/A only", "2.5"], "answer": 1, "explanation": "AAP uses total bilirubin. Why not the others: A. 15.5 — AAP treatment curves use the measured total serum bilirubin; subtracting the direct fraction or substituting the direct value underestimates the threshold-relevant TSB.; C. B/A only — The bilirubin/albumin ratio is an adjunct in exchange decision-making; it does not replace the primary TSB threshold or neurologic examination.; D. 2.5 — AAP treatment curves use the measured total serum bilirubin; subtracting the direct fraction or substituting the direct value underestimates the threshold-relevant TSB.", "pearl": "In neonatal jaundice questions, this finding changes management because aap uses total bilirubin.", "srcAnswer": "B"}, {"num": 41, "level": "Clinical/Application", "question": "Day 4 infant, no hemolysis; albumin 2.7. Most important implication?", "options": ["Proves cholestasis", "None", "Additional neurotoxicity risk", "Exchange mandatory"], "answer": 2, "explanation": "Low albumin changes risk assessment. Why not the others: A. Proves cholestasis — Low albumin is nonspecific and does not diagnose cholestasis; cholestasis is identified by direct hyperbilirubinemia and clinical findings such as pale stools/dark urine.; B. None — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; D. Exchange mandatory — A risk factor modifies the treatment threshold but does not by itself mandate exchange; the exchange threshold and ABE signs determine that intervention.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: low albumin changes risk assessment.", "srcAnswer": "C"}, {"num": 42, "level": "Clinical/Application", "question": "Below phototherapy threshold but close at discharge. Follow-up primarily based on:", "options": ["Old risk zone only", "Difference from phototherapy threshold + context", "DAT only", "Birthweight only"], "answer": 1, "explanation": "AAP follow-up uses distance from threshold. Why not the others: A. Old risk zone only — AAP 2022 post-discharge follow-up is based primarily on how far the bilirubin is below the phototherapy threshold, together with clinical factors, rather than the older nomogram risk zones alone.; C. DAT only — DAT informs hemolysis etiology but does not capture the infant’s distance from the phototherapy threshold, which drives follow-up timing.; D. Birthweight only — Birth weight alone cannot determine follow-up because gestational age, age in hours and distance from the phototherapy threshold are more directly relevant.", "pearl": "When a vignette resembles Q42, do not choose by the bilirubin number alone; aap follow-up uses distance from threshold.", "srcAnswer": "B"}, {"num": 43, "level": "Clinical/Application", "question": "38 wk, jaundiced at 10 h, DAT−. Best reasoning?", "options": ["Physiologic because DAT−", "Still evaluate nonimmune hemolysis/sepsis/other causes", "No bilirubin needed", "Only breast-milk jaundice"], "answer": 1, "explanation": "Negative DAT does not make first-day jaundice benign. Why not the others: A. Physiologic because DAT− — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.; C. No bilirubin needed — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; D. Only breast-milk jaundice — Breast-milk jaundice is typically a later diagnosis in an otherwise thriving infant after dangerous causes have been excluded; it does not explain this early/hemolytic presentation.", "pearl": "The rank-differentiating clue here is 'Still evaluate nonimmune hemolysis/sepsis/other causes'. Translate that clue into action: negative dat does not make first-day jaundice benign.", "srcAnswer": "B"}, {"num": 44, "level": "Clinical/Application", "question": "Infant at exchange threshold, no neurologic signs. Best?", "options": ["Urgent exchange while continuing escalation", "Stop lights", "IVIG alone", "Observe 12 h"], "answer": 0, "explanation": "At/above exchange threshold is an urgent exchange indication. Why not the others: B. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; C. IVIG alone — IVIG is only an adjunct for selected DAT-positive isoimmune disease and cannot substitute for exchange when the exchange threshold is reached.; D. Observe 12 h — TSB at the exchange threshold is an urgent indication for exchange; waiting 12 hours risks further bilirubin entry into the CNS.", "pearl": "A useful one-line rule for this scenario is: At/above exchange threshold is an urgent exchange indication.", "srcAnswer": "A"}, {"num": 45, "level": "Clinical/Application", "question": "Severe G6PD-associated neonatal jaundice with no known oxidative trigger. Correct statement?", "options": ["No trigger excludes G6PD", "G6PD can present without obvious trigger", "DAT should be positive", "Only direct bilirubin rises"], "answer": 1, "explanation": "An obvious trigger is not required. Why not the others: A. No trigger excludes G6PD — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.; C. DAT should be positive — G6PD deficiency is a nonimmune enzymopathy, so DAT is expected to be negative unless a separate immune process coexists.; D. Only direct bilirubin rises — G6PD hemolysis raises unconjugated bilirubin through increased heme breakdown; it is not a primary conjugated cholestatic disorder.", "pearl": "In neonatal jaundice questions, this finding changes management because an obvious trigger is not required.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day6',label:'Day 6',set:'Quiz 3',href:'Day6/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day6_QuizSet3_Q31-45_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 6 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 31–45</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 6'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 6');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day6:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
