<script>
const quiz=[{"num": 46, "level": "High-Difficulty", "question": "37+1 wk, no added risk; albumin later 2.8. Best?", "options": ["Reassess with additional-risk framework", "No change", "Use TcB", "Immediate exchange"], "answer": 0, "explanation": "Albumin <3 adds a neurotoxicity risk. Why not the others: B. No change — Albumin <3.0 g/dL is an added AAP neurotoxicity risk; it changes which risk curve is used even if the infant was previously on the no-additional-risk curve.; C. Use TcB — TcB is a screening tool; TSB is required for definitive treatment decisions and when TcB is close to the phototherapy threshold or high.; D. Immediate exchange — Low albumin lowers the threshold but does not independently mandate exchange; the current TSB relative to the exchange line and neurologic status still decide exchange.", "pearl": "For AAP neurotoxicity-risk threshold selection, anchor the answer to the decisive clue in this stem: albumin <3 adds a neurotoxicity risk.", "srcAnswer": "B"}, {"num": 47, "level": "High-Difficulty", "question": "DAT+ infant at escalation with slowly falling TSB under intensive lights. IVIG?", "options": ["Only for G6PD", "May be considered; uncertain benefit means exchange readiness continues", "Mandatory", "Contraindicated"], "answer": 1, "explanation": "AAP IVIG is optional, not mandatory. Why not the others: A. Only for G6PD — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.; C. Mandatory — AAP describes IVIG as an option, not a mandatory treatment, because benefit is uncertain and adverse effects such as NEC have been reported.; D. Contraindicated — IVIG is not contraindicated in DAT-positive isoimmune HDFN; it may be considered at/above escalation threshold while maintaining exchange readiness.", "pearl": "When a vignette resembles Q47, do not choose by the bilirubin number alone; aap ivig is optional, not mandatory.", "srcAnswer": "C"}, {"num": 48, "level": "High-Difficulty", "question": "39 wk, TSB 1.5 mg/dL below exchange line, clinically stable. Best?", "options": ["Stop lights", "Discharge", "Escalation-of-care pathway", "Routine observation"], "answer": 2, "explanation": "Within 2 mg/dL of exchange line is escalation. Why not the others: A. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; B. Discharge — Discharge is unsafe while the infant is in or near the escalation/exchange zone or still requires intensive monitoring.; D. Routine observation — Being 1.5 mg/dL below exchange threshold places the TSB inside the 2-mg/dL escalation zone, requiring emergency-level management.", "pearl": "The rank-differentiating clue here is 'Escalation-of-care pathway'. Translate that clue into action: within 2 mg/dl of exchange line is escalation.", "srcAnswer": "D"}, {"num": 49, "level": "High-Difficulty", "question": "Exchange being prepared; TSB falls 0.5 below exchange line; neuro exam normal. Best?", "options": ["Stop monitoring", "May defer; continue intensive lights + q2h TSB until below escalation", "IVIG for all", "Exchange still mandatory"], "answer": 1, "explanation": "AAP permits deferral under strict conditions. Why not the others: A. Stop monitoring — Bilirubin can rebound or re-rise from ongoing hemolysis; close monitoring remains necessary until the infant is safely below the escalation threshold.; C. IVIG for all — IVIG is not a universal rescue treatment; it is limited to selected DAT-positive isoimmune hemolysis and does not replace continued intensive phototherapy and q2h TSB monitoring when exchange is deferred.; D. Exchange still mandatory — AAP permits deferring exchange if the TSB falls below the exchange threshold and there are no intermediate/advanced ABE signs, provided intensive therapy and q2h monitoring continue.", "pearl": "A useful one-line rule for this scenario is: AAP permits deferral under strict conditions.", "srcAnswer": "A"}, {"num": 50, "level": "High-Difficulty", "question": "36 wk + sepsis + albumin 2.6. Threshold logic?", "options": ["Ignore risks", "Exchange regardless", "Use lower additional-risk framework", "Use term thresholds"], "answer": 2, "explanation": "Sepsis and low albumin are additional risks. Why not the others: A. Ignore risks — Sepsis and albumin <3 g/dL are explicit additional neurotoxicity risks and cannot be ignored in a 36-week infant.; B. Exchange regardless — Exchange transfusion is reserved for the exchange threshold or significant ABE; feeding problems alone do not mandate exchange at any bilirubin level.; D. Use term thresholds — Using a more mature gestational-age curve would overestimate the bilirubin threshold and can undertreat a 35–37-week infant.", "pearl": "In neonatal jaundice questions, this finding changes management because sepsis and low albumin are additional risks.", "srcAnswer": "B"}, {"num": 51, "level": "High-Difficulty", "question": "Severe jaundice, DAT−, retic 2%, Hb normal, large cephalohematoma. Mechanism?", "options": ["Immune hemolysis", "UGT excess", "Extravascular blood breakdown", "Cholestasis"], "answer": 2, "explanation": "The hematoma is a bilirubin source without systemic hemolysis. Why not the others: A. Immune hemolysis — Normal Hb/retic and negative DAT argue against active immune hemolysis; the cephalohematoma itself is a large extravascular bilirubin source.; B. UGT excess — UGT1A1 handles bilirubin conjugation; maternal anti-D causes hemolysis upstream by targeting fetal/neonatal RBCs.; D. Cholestasis — A large cephalohematoma supplies heme for unconjugated bilirubin production while Hb and reticulocytes can remain normal; cholestasis would be suggested by a raised direct fraction rather than this pattern.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: the hematoma is a bilirubin source without systemic hemolysis.", "srcAnswer": "C"}, {"num": 52, "level": "High-Difficulty", "question": "Strongest evidence for ongoing hemolysis?", "options": ["11% weight loss", "Reticulocytosis + falling Hb", "Poor latch", "Scant stools"], "answer": 1, "explanation": "This directly signals RBC destruction. Why not the others: A. 11% weight loss — Weight loss supports inadequate intake/dehydration but does not directly demonstrate RBC destruction; falling Hb with reticulocytosis does.; C. Poor latch — Poor latch explains intake-related jaundice but not a regenerative anemia; reticulocytosis plus falling Hb is the hemolysis signal.; D. Scant stools — Scant stools support increased enterohepatic circulation, not hemolysis; reticulocytosis plus falling hemoglobin is stronger evidence of RBC destruction.", "pearl": "When a vignette resembles Q52, do not choose by the bilirubin number alone; this directly signals rbc destruction.", "srcAnswer": "D"}, {"num": 53, "level": "High-Difficulty", "question": "Spherocytes + positive DAT. Safest inference?", "options": ["HS proven", "Immune hemolysis can produce spherocytes; integrate all data", "G6PD proven", "ABO excluded"], "answer": 1, "explanation": "Spherocytes are not specific. Why not the others: A. HS proven — Spherocytes are not pathognomonic for HS; with a positive DAT, immune hemolysis can produce the same morphology.; C. G6PD proven — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.; D. ABO excluded — A positive DAT and spherocytes do not exclude ABO HDFN; ABO immune hemolysis can itself produce spherocytes.", "pearl": "The rank-differentiating clue here is 'Immune hemolysis can produce spherocytes; integrate all data'. Translate that clue into action: spherocytes are not specific.", "srcAnswer": "A"}, {"num": 54, "level": "High-Difficulty", "question": "33 wk infant with hyperbilirubinemia. Best guideline statement?", "options": ["Exchange never used", "No phototherapy below 35 wk", "Use AAP ≥35 wk graphs", "Use preterm NICU protocol"], "answer": 3, "explanation": "AAP 2022 graphs are for ≥35 weeks. Why not the others: A. Exchange never used — Exchange transfusion can be necessary in very preterm infants with hazardous hyperbilirubinemia; gestational age changes thresholds, not the existence of the treatment.; B. No phototherapy below 35 wk — Preterm infants <35 weeks can require phototherapy, but thresholds come from preterm-specific guidance rather than the AAP ≥35-week charts.; C. Use AAP ≥35 wk graphs — The AAP 2022 treatment curves apply to infants ≥35 weeks; a 33-week infant requires a preterm-specific NICU protocol.", "pearl": "A useful one-line rule for this scenario is: AAP 2022 graphs are for ≥35 weeks.", "srcAnswer": "B"}, {"num": 55, "level": "High-Difficulty", "question": "Why dangerous to subtract direct bilirubin before threshold use?", "options": ["Raises TcB", "Underestimates treatment-relevant TSB", "Causes hemolysis", "Direct always zero"], "answer": 1, "explanation": "AAP treatment uses TSB. Why not the others: A. Raises TcB — Subtracting a laboratory fraction does not change TcB; it simply misapplies the AAP TSB threshold.; C. Causes hemolysis — Mathematically subtracting a direct fraction does not cause hemolysis; it causes an incorrect, falsely low treatment value.; D. Direct always zero — Direct bilirubin can be elevated in cholestasis; the error is not that direct bilirubin is zero, but that AAP thresholds use total bilirubin without subtraction.", "pearl": "In neonatal jaundice questions, this finding changes management because aap treatment uses tsb.", "srcAnswer": "C"}, {"num": 56, "level": "High-Difficulty", "question": "Infant at escalation being transferred. Continue if feasible?", "options": ["Phenobarbital only", "No monitoring", "Intensive phototherapy + IV hydration", "Stop therapy"], "answer": 2, "explanation": "Escalation treatment continues during transfer. Why not the others: A. Phenobarbital only — Phenobarbital is not an emergency treatment for intermediate ABE; urgent exchange is required when hypertonia/retrocollis/opisthotonos appear.; B. No monitoring — An infant in the escalation zone can cross the exchange threshold quickly; transfer should continue intensive therapy with close cardiorespiratory and bilirubin surveillance rather than suspend monitoring.; D. Stop therapy — During transfer for escalation, intensive phototherapy and supportive care should continue to prevent further bilirubin accumulation.", "pearl": "For escalation and exchange timing, anchor the answer to the decisive clue in this stem: escalation treatment continues during transfer.", "srcAnswer": "D"}, {"num": 57, "level": "High-Difficulty", "question": "DAT+ infant below escalation but rising. IVIG?", "options": ["For cholestasis", "Before phototherapy", "Give because DAT+", "Not routinely indicated solely for DAT positivity below escalation"], "answer": 3, "explanation": "AAP IVIG requires reaching/exceeding escalation threshold. Why not the others: A. For cholestasis — IVIG has no role in neonatal cholestasis; its neonatal jaundice use is limited to selected isoimmune hemolysis.; B. Before phototherapy — Phototherapy is first-line when the phototherapy threshold is reached; IVIG is reserved for selected DAT-positive isoimmune disease in the escalation zone.; C. Give because DAT+ — AAP does not recommend IVIG for DAT positivity alone; it is an option for DAT-positive isoimmune hemolysis when TSB reaches/exceeds the escalation threshold.", "pearl": "When a vignette resembles Q57, do not choose by the bilirubin number alone; aap ivig requires reaching/exceeding escalation threshold.", "srcAnswer": "A"}, {"num": 58, "level": "High-Difficulty", "question": "Term infant needs phototherapy at 18 h. Key etiologic clue?", "options": ["Always physiologic", "Proves breast-milk jaundice", "Excludes G6PD", "Early need suggests hemolysis"], "answer": 3, "explanation": "Very early significant hyperbilirubinemia is atypical. Why not the others: A. Always physiologic — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.; B. Proves breast-milk jaundice — Breast-milk jaundice is typically a later diagnosis in an otherwise thriving infant after dangerous causes have been excluded; it does not explain this early/hemolytic presentation.; C. Excludes G6PD — Early severe jaundice does not exclude G6PD deficiency; G6PD is an important cause of hazardous early unconjugated hyperbilirubinemia.", "pearl": "The rank-differentiating clue here is 'Early need suggests hemolysis'. Translate that clue into action: very early significant hyperbilirubinemia is atypical.", "srcAnswer": "B"}, {"num": 59, "level": "High-Difficulty", "question": "Bilirubin/albumin ratio looks acceptable but TSB at exchange threshold. Best?", "options": ["Stop lights", "B/A overrides TSB", "B/A is adjunctive; exchange threshold remains central", "No exchange possible"], "answer": 2, "explanation": "B/A does not replace TSB/exam criteria. Why not the others: A. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; B. B/A overrides TSB — The bilirubin/albumin ratio is an adjunct in exchange decision-making; it does not replace the primary TSB threshold or neurologic examination.; D. No exchange possible — An apparently favorable B/A ratio does not prohibit exchange when the TSB threshold or ABE criteria are met.", "pearl": "A useful one-line rule for this scenario is: B/A does not replace TSB/exam criteria.", "srcAnswer": "C"}, {"num": 60, "level": "High-Difficulty", "question": "Severe jaundice, DAT−, no striking anemia. Important cause still?", "options": ["Biliary atresia", "Rh disease", "G6PD deficiency", "ABO proven"], "answer": 2, "explanation": "G6PD can cause severe bilirubin with modest anemia. Why not the others: A. Biliary atresia — Biliary atresia produces conjugated hyperbilirubinemia with pale stools/dark urine; it does not explain a hemolytic unconjugated pattern.; B. Rh disease — Rh alloimmune HDFN is generally DAT-positive and requires maternal alloantibody evidence; DAT-negative severe jaundice without marked anemia keeps G6PD high on the differential.; D. ABO proven — ABO HDFN requires compatible maternal-infant ABO context and usually immune evidence such as DAT positivity; a DAT-negative infant with severe bilirubin and little anemia remains compatible with G6PD deficiency.", "pearl": "In neonatal jaundice questions, this finding changes management because g6pd can cause severe bilirubin with modest anemia.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day6',label:'Day 6',set:'Quiz 4',href:'Day6/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day6_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 6 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 6');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day6:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook){const ids=Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note})));
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,ids,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{auto:true});}
}
render();
</script></body></html>
