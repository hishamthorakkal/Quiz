<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "A term infant is visibly jaundiced at 14 hours. Best interpretation?", "options": ["No bilirubin measurement is needed", "Physiologic jaundice", "Breast-milk jaundice", "Pathologic jaundice until evaluated"], "answer": 3, "explanation": "Jaundice in the first 24 hours is a red flag and must be evaluated. Why not the others: A. No bilirubin measurement is needed — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; B. Physiologic jaundice — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.; C. Breast-milk jaundice — Breast-milk jaundice is typically a later diagnosis in an otherwise thriving infant after dangerous causes have been excluded; it does not explain this early/hemolytic presentation.", "pearl": "For neonatal hyperbilirubinemia decision-making, anchor the answer to the decisive clue in this stem: jaundice in the first 24 hours is a red flag and must be evaluated.", "srcAnswer": "D"}, {"num": 2, "level": "Basic/Recall", "question": "Definitive value for AAP treatment decisions?", "options": ["TcB", "TSB", "Direct bilirubin only", "Bilirubin/albumin ratio only"], "answer": 1, "explanation": "TSB is the definitive treatment-decision value. Why not the others: A. TcB — TcB is a screening tool; TSB is required for definitive treatment decisions and when TcB is close to the phototherapy threshold or high.; C. Direct bilirubin only — Direct bilirubin is essential for evaluating cholestasis, but AAP phototherapy/exchange decisions are based on total serum bilirubin.; D. Bilirubin/albumin ratio only — The bilirubin/albumin ratio is an adjunct in exchange decision-making; it does not replace the primary TSB threshold or neurologic examination.", "pearl": "When a vignette resembles Q2, do not choose by the bilirubin number alone; tsb is the definitive treatment-decision value.", "srcAnswer": "B"}, {"num": 3, "level": "Basic/Recall", "question": "AAP escalation threshold is:", "options": ["1 mg/dL below phototherapy line", "2 mg/dL below exchange line", "At phototherapy line", "Only after exchange line is crossed"], "answer": 1, "explanation": "AAP defines escalation at 2 mg/dL below exchange threshold. Why not the others: A. 1 mg/dL below phototherapy line — AAP escalation is not defined relative to the phototherapy line; it begins when TSB is 2 mg/dL below the exchange-transfusion threshold.; C. At phototherapy line — AAP escalation is not defined relative to the phototherapy line; it begins when TSB is 2 mg/dL below the exchange-transfusion threshold.; D. Only after exchange line is crossed — Waiting until the exchange line is crossed misses the AAP escalation window, which starts 2 mg/dL earlier.", "pearl": "The rank-differentiating clue here is '2 mg/dL below exchange line'. Translate that clue into action: aap defines escalation at 2 mg/dl below exchange threshold.", "srcAnswer": "B"}, {"num": 4, "level": "Basic/Recall", "question": "Which is a neurotoxicity risk factor?", "options": ["Albumin 3.8", "Exclusive breastfeeding", "Cephalohematoma alone", "Albumin 2.7"], "answer": 3, "explanation": "Albumin <3.0 g/dL is a neurotoxicity risk. Why not the others: A. Albumin 3.8 — Albumin 3.8 g/dL is not the AAP low-albumin neurotoxicity criterion; the risk threshold is albumin <3.0 g/dL.; B. Exclusive breastfeeding — Exclusive breastfeeding by itself is not an AAP bilirubin-neurotoxicity risk factor; inadequate intake can increase bilirubin production/enterohepatic circulation but is a different concept.; C. Cephalohematoma alone — Cephalohematoma increases bilirubin load through breakdown of extravascular blood, but it is not one of the AAP neurotoxicity risk factors that lowers treatment thresholds.", "pearl": "A useful one-line rule for this scenario is: Albumin <3.0 g/dL is a neurotoxicity risk.", "srcAnswer": "D"}, {"num": 5, "level": "Basic/Recall", "question": "Typical intermediate ABE finding?", "options": ["Hypertonia with retrocollis/opisthotonos", "Mild jaundice alone", "Pale stool", "Isolated hepatomegaly"], "answer": 0, "explanation": "Hypertonia, arching and retrocollis/opisthotonos are dangerous ABE signs. Why not the others: B. Mild jaundice alone — Mild jaundice alone is not a neurologic sign of acute bilirubin encephalopathy; tone, feeding, cry, posture, apnea and seizures determine neurologic staging.; C. Pale stool — Pale stool points to reduced bile pigment and cholestasis, not the hypertonic neurologic phase of acute bilirubin encephalopathy.; D. Isolated hepatomegaly — Isolated hepatomegaly suggests hepatic/systemic disease rather than the characteristic neurologic syndrome of intermediate ABE.", "pearl": "In neonatal jaundice questions, this finding changes management because hypertonia, arching and retrocollis/opisthotonos are dangerous abe signs.", "srcAnswer": "A"}, {"num": 6, "level": "Basic/Recall", "question": "Effective intensive phototherapy spectrum is approximately:", "options": ["280–320 nm", "320–400 nm", "460–490 nm", "600–700 nm"], "answer": 2, "explanation": "Blue-green 460–490 nm light is effective for bilirubin photochemistry. Why not the others: A. 280–320 nm — Ultraviolet/near-UV wavelengths are not the preferred bilirubin-treatment spectrum; intensive phototherapy uses blue-green light around 460–490 nm.; B. 320–400 nm — Ultraviolet/near-UV wavelengths are not the preferred bilirubin-treatment spectrum; intensive phototherapy uses blue-green light around 460–490 nm.; D. 600–700 nm — Red light has poor overlap with bilirubin absorption; blue-green light around 460–490 nm is used for effective phototherapy.", "pearl": "For effective phototherapy delivery, anchor the answer to the decisive clue in this stem: blue-green 460–490 nm light is effective for bilirubin photochemistry.", "srcAnswer": "C"}, {"num": 7, "level": "Basic/Recall", "question": "ABO HDFN:", "options": ["Cannot affect first pregnancy", "Occurs only in Rh-negative mothers", "Always causes hydrops", "Can affect first pregnancy"], "answer": 3, "explanation": "ABO HDFN can occur in a first pregnancy. Why not the others: A. Cannot affect first pregnancy — ABO HDFN can occur in a first pregnancy because group O mothers may already have IgG anti-A/anti-B antibodies that cross the placenta.; B. Occurs only in Rh-negative mothers — ABO incompatibility is determined by maternal/infant ABO groups, not maternal RhD status; an RhD-positive mother can still have ABO HDFN.; C. Always causes hydrops — ABO HDFN is usually milder than severe Rh alloimmunization and does not invariably cause fetal hydrops.", "pearl": "When a vignette resembles Q7, do not choose by the bilirubin number alone; abo hdfn can occur in a first pregnancy.", "srcAnswer": "D"}, {"num": 8, "level": "Conceptual", "question": "Dark urine + pale stools in a jaundiced neonate suggests:", "options": ["Need for stronger phototherapy", "Routine IVIG indication", "Cholestasis", "Physiologic jaundice"], "answer": 2, "explanation": "This is a classic conjugated/cholestatic warning pattern. Why not the others: A. Need for stronger phototherapy — Phototherapy targets unconjugated bilirubin; dark urine, acholic stool and a high direct fraction require evaluation for cholestasis rather than simply increasing light intensity.; B. Routine IVIG indication — AAP does not recommend IVIG for DAT positivity alone; it is an option for DAT-positive isoimmune hemolysis when TSB reaches/exceeds the escalation threshold.; D. Physiologic jaundice — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.", "pearl": "The rank-differentiating clue here is 'Cholestasis'. Translate that clue into action: this is a classic conjugated/cholestatic warning pattern.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "A 36+2 wk infant has no additional neurotoxicity risks. Correct framework?", "options": ["Use additional-risk curve solely because GA <38", "Use GA-specific curve without additional risk", "Use ≥40 wk curve", "AAP does not cover 36 wk"], "answer": 1, "explanation": "Gestational age is already built into AAP curves; another neurotoxicity risk is required. Why not the others: A. Use additional-risk curve solely because GA <38 — Gestational age is already built into the AAP curves; a 35–37 6/7-week infant needs another neurotoxicity risk factor to use the additional-risk curve.; C. Use ≥40 wk curve — Using a more mature gestational-age curve would overestimate the bilirubin threshold and can undertreat a 35–37-week infant.; D. AAP does not cover 36 wk — The AAP 2022 hyperbilirubinemia guideline covers newborns ≥35 weeks; a 36-week infant is within its scope.", "pearl": "A useful one-line rule for this scenario is: Gestational age is already built into AAP curves; another neurotoxicity risk is required.", "srcAnswer": "B"}, {"num": 10, "level": "Conceptual", "question": "Poor milk intake raises bilirubin mainly by:", "options": ["Immune hemolysis", "Increasing enterohepatic reabsorption through reduced intake/stooling", "Increasing stooling", "Bile duct obstruction"], "answer": 1, "explanation": "Reduced intake and stooling increase enterohepatic circulation. Why not the others: A. Immune hemolysis — Poor intake raises bilirubin mainly by reduced stooling and increased enterohepatic circulation; it does not directly produce antibody-mediated RBC destruction.; C. Increasing stooling — More stooling promotes bilirubin elimination; reduced feeding/stooling increases enterohepatic reabsorption and worsens intake-related jaundice.; D. Bile duct obstruction — Bile duct obstruction causes conjugated cholestasis; the feeding-associated mechanism in this stem is increased enterohepatic circulation of unconjugated bilirubin.", "pearl": "In neonatal jaundice questions, this finding changes management because reduced intake and stooling increase enterohepatic circulation.", "srcAnswer": "B"}, {"num": 11, "level": "Conceptual", "question": "DAT-negative hemolysis + spherocytes most appropriately suggests:", "options": ["ABO disease proven", "Spherocytes exclude HS", "HS should be evaluated", "Phototherapy contraindicated"], "answer": 2, "explanation": "DAT-negative hemolysis with spherocytes raises HS strongly. Why not the others: A. ABO disease proven — ABO HDFN is immune and is usually supported by maternal-infant ABO incompatibility and often a positive DAT; DAT-negative hemolysis requires nonimmune causes such as HS/G6PD to be considered.; B. Spherocytes exclude HS — Spherocytes are a hallmark clue for HS; they are not specific because immune hemolysis can also produce them, but they certainly do not exclude HS.; D. Phototherapy contraindicated — Phototherapy is not contraindicated in hereditary spherocytosis; bilirubin is treated by the same severity/threshold framework while the hemolytic cause is investigated.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: dat-negative hemolysis with spherocytes raises hs strongly.", "srcAnswer": "C"}, {"num": 12, "level": "Conceptual", "question": "Why can G6PD assay be falsely normal during acute hemolysis?", "options": ["Bilirubin activates G6PD", "Older deficient cells are removed, leaving younger cells with higher activity", "Phototherapy normalizes G6PD", "DAT neutralizes assay"], "answer": 1, "explanation": "Reticulocytosis and selective loss of older deficient cells can mask deficiency. Why not the others: A. Bilirubin activates G6PD — Bilirubin does not normalize or activate erythrocyte G6PD; the false-normal problem comes from selective loss of older deficient cells and reticulocytosis.; C. Phototherapy normalizes G6PD — Phototherapy changes bilirubin photochemistry; it does not restore a genetically deficient RBC enzyme.; D. DAT neutralizes assay — DAT detects antibody/complement on RBCs and does not correct or neutralize the enzymatic G6PD assay.", "pearl": "When a vignette resembles Q12, do not choose by the bilirubin number alone; reticulocytosis and selective loss of older deficient cells can mask deficiency.", "srcAnswer": "B"}, {"num": 13, "level": "Conceptual", "question": "TSB 18 mg/dL, direct 3 mg/dL. Value used for AAP threshold?", "options": ["15", "18", "3", "B/A ratio only"], "answer": 1, "explanation": "Do not subtract direct bilirubin from TSB. Why not the others: A. 15 — AAP treatment curves use the measured total serum bilirubin; subtracting the direct fraction or substituting the direct value underestimates the threshold-relevant TSB.; C. 3 — AAP treatment curves use the measured total serum bilirubin; subtracting the direct fraction or substituting the direct value underestimates the threshold-relevant TSB.; D. B/A ratio only — The bilirubin/albumin ratio is an adjunct in exchange decision-making; it does not replace the primary TSB threshold or neurologic examination.", "pearl": "The rank-differentiating clue here is '18'. Translate that clue into action: do not subtract direct bilirubin from tsb.", "srcAnswer": "B"}, {"num": 14, "level": "Conceptual", "question": "Albumin matters because:", "options": ["Binding reduces free bilirubin available to cross BBB", "It conjugates bilirubin", "It prevents hemolysis", "Only direct bilirubin binds it"], "answer": 0, "explanation": "Albumin binding reduces the unbound neurotoxic fraction. Why not the others: B. It conjugates bilirubin — UGT1A1 in hepatocytes conjugates bilirubin; albumin transports unconjugated bilirubin in plasma and limits the unbound fraction.; C. It prevents hemolysis — Albumin does not prevent RBC destruction; its relevance is bilirubin binding and the concentration of unbound bilirubin available to enter the brain.; D. Only direct bilirubin binds it — Unconjugated bilirubin is the fraction substantially carried bound to albumin; this binding is central to bilirubin neurotoxicity risk.", "pearl": "A useful one-line rule for this scenario is: Albumin binding reduces the unbound neurotoxic fraction.", "srcAnswer": "A"}, {"num": 15, "level": "Conceptual", "question": "Most accurate AAP IVIG statement?", "options": ["Give all DAT+ infants", "Use only after exchange", "Use routinely for G6PD", "Consider 0.5–1 g/kg in DAT+ isoimmune disease at/above escalation threshold; benefit uncertain"], "answer": 3, "explanation": "AAP restricts IVIG to a narrow isoimmune/escalation setting. Why not the others: A. Give all DAT+ infants — AAP does not recommend IVIG for DAT positivity alone; it is an option for DAT-positive isoimmune hemolysis when TSB reaches/exceeds the escalation threshold.; B. Use only after exchange — Waiting until the exchange line is crossed misses the AAP escalation window, which starts 2 mg/dL earlier.; C. Use routinely for G6PD — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.", "pearl": "In neonatal jaundice questions, this finding changes management because aap restricts ivig to a narrow isoimmune/escalation setting.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day6',label:'Day 6',set:'Quiz 1',href:'Day6/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day6_QuizSet1_Q1-15_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 6 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–15</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 6'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 6');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day6:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=34a5c329"></script></body></html>
