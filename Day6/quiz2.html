@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 16, "level": "Conceptual", "question": "Why does positive DAT alone not determine therapy?", "options": ["DAT measures albumin", "Treatment depends on bilirubin, age, GA, risks, trajectory and neurology", "DAT is valid only after exchange", "DAT is useless"], "answer": 1, "explanation": "DAT is etiologic evidence, not a treatment threshold. Why not the others: A. DAT measures albumin — DAT detects immunoglobulin/complement coating RBCs; serum albumin is measured separately and contributes to neurotoxicity-risk assessment.; C. DAT is valid only after exchange — Waiting until the exchange line is crossed misses the AAP escalation window, which starts 2 mg/dL earlier.; D. DAT is useless — DAT is useful for identifying isoimmune hemolysis, but it does not replace the hour-specific bilirubin threshold or the infant’s clinical status.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: dat is etiologic evidence, not a treatment threshold.", "srcAnswer": "D"}, {"num": 17, "level": "Conceptual", "question": "Adequate phototherapy but bilirubin continues to rise rapidly. Best explanation?", "options": ["Phototherapy raises bilirubin", "Albumin always rises", "Ongoing brisk production such as hemolysis", "TcB becomes more accurate"], "answer": 2, "explanation": "Production can outpace elimination. Why not the others: A. Phototherapy raises bilirubin — Effective phototherapy lowers bilirubin by photoisomerization; a rising TSB despite adequate light suggests production is exceeding elimination.; B. Albumin always rises — Phototherapy does not reliably raise serum albumin; persistent TSB rise should trigger evaluation of light delivery and bilirubin production.; D. TcB becomes more accurate — Phototherapy alters skin bilirubin and can reduce TcB reliability; serum TSB remains the treatment-monitoring standard.", "pearl": "When a vignette resembles Q17, do not choose by the bilirubin number alone; production can outpace elimination.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "Suboptimal-intake jaundice is most suggested by:", "options": ["First 6-hour onset of breast-milk jaundice", "Conjugated bilirubin", "Poor transfer + weight loss + scant stools", "Positive DAT"], "answer": 2, "explanation": "The feeding/weight-loss pattern is characteristic. Why not the others: A. First 6-hour onset of breast-milk jaundice — Breast-milk jaundice is typically a later diagnosis in an otherwise thriving infant after dangerous causes have been excluded; it does not explain this early/hemolytic presentation.; B. Conjugated bilirubin — Suboptimal-intake jaundice is predominantly unconjugated; a conjugated pattern requires a separate cholestasis work-up.; D. Positive DAT — A positive DAT indicates immune RBC sensitization and points away from a purely feeding-mediated mechanism.", "pearl": "The rank-differentiating clue here is 'Poor transfer + weight loss + scant stools'. Translate that clue into action: the feeding/weight-loss pattern is characteristic.", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "Why may anti-Kell disease show severe anemia without proportionally dramatic reticulocytosis?", "options": ["Kell can suppress erythropoiesis", "Kell causes cholestasis", "Kell improves conjugation", "Kell prevents DAT positivity"], "answer": 0, "explanation": "Anti-Kell can inhibit erythroid precursors in addition to immune RBC effects. Why not the others: B. Kell causes cholestasis — Anti-Kell HDFN is important because it can suppress fetal erythropoiesis as well as cause immune RBC destruction; the other proposed mechanisms are not the defining pathology.; C. Kell improves conjugation — Anti-Kell HDFN is important because it can suppress fetal erythropoiesis as well as cause immune RBC destruction; the other proposed mechanisms are not the defining pathology.; D. Kell prevents DAT positivity — Anti-Kell HDFN is important because it can suppress fetal erythropoiesis as well as cause immune RBC destruction; the other proposed mechanisms are not the defining pathology.", "pearl": "A useful one-line rule for this scenario is: Anti-Kell can inhibit erythroid precursors in addition to immune RBC effects.", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "Highest rebound-risk pattern after phototherapy?", "options": ["40 wk, started 72 h, no hemolysis", "<38 wk, started <48 h, hemolysis", "Large birth weight", "Formula feeding"], "answer": 1, "explanation": "These are major rebound predictors. Why not the others: A. 40 wk, started 72 h, no hemolysis — Greater gestational maturity, later start of phototherapy and absence of hemolysis are lower—not higher—rebound-risk features.; C. Large birth weight — Birth weight by itself is not a key AAP rebound predictor once gestation, timing of therapy, hemolysis and distance from threshold are considered.; D. Formula feeding — Formula feeding alone is not a principal rebound predictor; GA <38 weeks, early phototherapy and hemolysis are stronger predictors.", "pearl": "In neonatal jaundice questions, this finding changes management because these are major rebound predictors.", "srcAnswer": "D"}, {"num": 21, "level": "Clinical/Application", "question": "38 wk: TSB 7 at 8 h and 11 at 20 h (≈0.33 mg/dL/h). Next?", "options": ["Breast-milk jaundice", "TcB only", "Reassure", "Evaluate hemolysis and reassess threshold"], "answer": 3, "explanation": "This is a hemolytic rate of rise in the first 24 h. Why not the others: A. Breast-milk jaundice — Breast-milk jaundice is typically a later diagnosis in an otherwise thriving infant after dangerous causes have been excluded; it does not explain this early/hemolytic presentation.; B. TcB only — TcB is a screening tool; TSB is required for definitive treatment decisions and when TcB is close to the phototherapy threshold or high.; C. Reassure — The bilirubin kinetics are not reassuring. This is a hemolytic rate of rise in the first 24 h; reassurance without hemolysis assessment could delay treatment.", "pearl": "For bilirubin measurement and threshold interpretation, anchor the answer to the decisive clue in this stem: this is a hemolytic rate of rise in the first 24 h.", "srcAnswer": "A"}, {"num": 22, "level": "Clinical/Application", "question": "37 wk infant with sepsis has same TSB as healthy 37 wk infant. Compared with healthy infant:", "options": ["No difference", "Lower threshold", "No TSB needed", "Higher treatment threshold"], "answer": 1, "explanation": "Sepsis is a neurotoxicity risk factor. Why not the others: A. No difference — AAP explicitly treats sepsis as a neurotoxicity risk factor; the same TSB therefore has different implications in a septic infant.; C. No TSB needed — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; D. Higher treatment threshold — Sepsis increases bilirubin neurotoxicity vulnerability, so it lowers rather than raises the applicable treatment threshold.", "pearl": "When a vignette resembles Q22, do not choose by the bilirubin number alone; sepsis is a neurotoxicity risk factor.", "srcAnswer": "B"}, {"num": 23, "level": "Clinical/Application", "question": "DAT+ infant on intensive phototherapy is 1.2 mg/dL below exchange threshold. Best management?", "options": ["Discharge", "Escalation bundle + q2h TSB + type/cross + exchange readiness", "Stop lights and give albumin", "Routine ward observation"], "answer": 1, "explanation": "The infant is already inside the escalation zone. Why not the others: A. Discharge — Discharge is unsafe while the infant is in or near the escalation/exchange zone or still requires intensive monitoring.; C. Stop lights and give albumin — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; D. Routine ward observation — Once TSB is within 2 mg/dL of the exchange threshold, AAP defines a medical emergency requiring escalation-level care rather than routine ward observation.", "pearl": "The rank-differentiating clue here is 'Escalation bundle + q2h TSB + type/cross + exchange readiness'. Translate that clue into action: the infant is already inside the escalation zone.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical/Application", "question": "High-pitched cry, hypertonia and opisthotonos; TSB slightly below exchange line. Best action?", "options": ["Urgent exchange", "Stop lights", "Observe", "Phenobarbital"], "answer": 0, "explanation": "Intermediate ABE is itself an urgent exchange indication. Why not the others: B. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; C. Observe — Hypertonia, a high-pitched cry and opisthotonos indicate intermediate acute bilirubin encephalopathy; observation would permit ongoing bilirubin neurotoxicity when urgent exchange transfusion is indicated.; D. Phenobarbital — Phenobarbital is not an emergency treatment for intermediate ABE; urgent exchange is required when hypertonia/retrocollis/opisthotonos appear.", "pearl": "A useful one-line rule for this scenario is: Intermediate ABE is itself an urgent exchange indication.", "srcAnswer": "D"}, {"num": 25, "level": "Clinical/Application", "question": "Severe jaundice, DAT−, retic 14%, normal acute G6PD assay. Best?", "options": ["Repeat DAT until positive", "HS impossible", "G6PD excluded", "Repeat G6PD later if suspicion remains"], "answer": 3, "explanation": "Acute hemolysis can mask G6PD deficiency. Why not the others: A. Repeat DAT until positive — Repeated DAT testing does not diagnose G6PD deficiency; DAT assesses immune coating, whereas G6PD is an enzymopathy.; B. HS impossible — Hereditary spherocytosis remains a possible DAT-negative hemolytic disorder; smear, MCHC and family history determine its likelihood.; C. G6PD excluded — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.", "pearl": "In neonatal jaundice questions, this finding changes management because acute hemolysis can mask g6pd deficiency.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "TcB lies 2 mg/dL below phototherapy threshold. Next test?", "options": ["TSB", "None", "Repeat TcB after lights", "Direct bilirubin only"], "answer": 0, "explanation": "TcB within 3 mg/dL of threshold needs TSB. Why not the others: B. None — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; C. Repeat TcB after lights — A TcB this close to the phototherapy threshold must be confirmed with serum TSB; phototherapy also alters skin bilirubin, making an immediate repeat TcB an unreliable basis for treatment.; D. Direct bilirubin only — Direct bilirubin is essential for evaluating cholestasis, but AAP phototherapy/exchange decisions are based on total serum bilirubin.", "pearl": "For effective phototherapy delivery, anchor the answer to the decisive clue in this stem: tcb within 3 mg/dl of threshold needs tsb.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical/Application", "question": "Day 4 breastfed infant: 12% weight loss, scant stools, rising unconjugated bilirubin. Best principle?", "options": ["Diagnose cholestasis", "Stop breastfeeding permanently", "Exchange regardless", "Correct feeding/supplement as indicated and treat bilirubin by threshold"], "answer": 3, "explanation": "Both feeding and bilirubin severity require management. Why not the others: A. Diagnose cholestasis — The stem describes unconjugated jaundice with dehydration/poor intake; cholestasis would be suggested by a direct bilirubin rise, dark urine or pale stools.; B. Stop breastfeeding permanently — Permanent breastfeeding cessation is unnecessary; the priority is to correct milk transfer, supplement when indicated, and treat bilirubin by threshold.; C. Exchange regardless — Exchange transfusion is reserved for the exchange threshold or significant ABE; feeding problems alone do not mandate exchange at any bilirubin level.", "pearl": "When a vignette resembles Q27, do not choose by the bilirubin number alone; both feeding and bilirubin severity require management.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical/Application", "question": "3-day-old: dark urine, acholic stools, high direct bilirubin. Next?", "options": ["Urgent cholestasis evaluation", "Physiologic diagnosis", "IVIG", "Intensified phototherapy"], "answer": 0, "explanation": "This is a cholestatic pattern. Why not the others: B. Physiologic diagnosis — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.; C. IVIG — IVIG is reserved for selected DAT-positive isoimmune hemolysis near the exchange threshold; acholic stools, dark urine and direct hyperbilirubinemia instead require urgent cholestasis evaluation.; D. Intensified phototherapy — Phototherapy targets unconjugated bilirubin; dark urine, acholic stool and a high direct fraction require evaluation for cholestasis rather than simply increasing light intensity.", "pearl": "The rank-differentiating clue here is 'Urgent cholestasis evaluation'. Translate that clue into action: this is a cholestatic pattern.", "srcAnswer": "D"}, {"num": 29, "level": "Clinical/Application", "question": "“Double phototherapy,” irradiance 12 µW/cm²/nm, TSB rising. First correction?", "options": ["Optimize measured light dose and assess hemolysis/escalation", "Exchange regardless", "Stop feeds", "IVIG"], "answer": 0, "explanation": "The measured phototherapy dose is inadequate. Why not the others: B. Exchange regardless — Exchange transfusion is reserved for the exchange threshold or significant ABE; feeding problems alone do not mandate exchange at any bilirubin level.; C. Stop feeds — Withholding feeds does not correct inadequate phototherapy and can worsen hydration; the light dose and hemolysis/escalation status must be addressed.; D. IVIG — IVIG does not correct inadequate irradiance and is not indicated without DAT-positive isoimmune hemolysis at the escalation threshold; the first problem here is a subtherapeutic light dose.", "pearl": "A useful one-line rule for this scenario is: The measured phototherapy dose is inadequate.", "srcAnswer": "A"}, {"num": 30, "level": "Clinical/Application", "question": "Mother O+, infant A+, DAT+, mild anemia. Best statement?", "options": ["DAT mandates exchange", "Rh disease proven", "Cannot occur first pregnancy", "ABO immune hemolysis plausible; severity follows trajectory"], "answer": 3, "explanation": "Classic ABO setting; DAT does not determine therapy. Why not the others: A. DAT mandates exchange — DAT positivity identifies immune sensitization but exchange is determined by TSB threshold and neurologic status, not DAT alone.; B. Rh disease proven — Rh HDFN requires Rh/antibody incompatibility; an O mother with an A/B infant and DAT positivity is more consistent with ABO immune hemolysis unless specific anti-D evidence exists.; C. Cannot occur first pregnancy — ABO HDFN can affect a first pregnancy because group O mothers may already possess IgG anti-A/anti-B antibodies before pregnancy; unlike anti-D sensitization, prior pregnancy is not required.", "pearl": "In neonatal jaundice questions, this finding changes management because classic abo setting; dat does not determine therapy.", "srcAnswer": "B"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day6_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 6 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines){if(!list.length)return;const L=i=>String.fromCharCode(65+i),cut=(s,n=70)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};lines.push('',`Wrong answers (${list.length}):`);for(let i=0;i<list.length;i++){const w=list[i],l=`Q${w.num}: chose ${L(w.chosen)}. ${cut(w.options[w.chosen])} → correct ${L(w.answer)}. ${cut(w.options[w.answer])}`;if(new Blob([lines.join('\n')+'\n'+l]).size>3800){lines.push(`…and ${list.length-i} more — see the wrong-answer report`);break}lines.push(l)}}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const lines=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`];
 wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines);
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day6:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
