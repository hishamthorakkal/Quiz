<script>
const quiz=[{"num": 61, "level": "High-Difficulty", "question": "Rapid TSB rise continues despite verified intensive lights. Best paired action?", "options": ["Evaluate hemolysis AND escalation status", "Feeds only", "IVIG without DAT", "Stop lights and use TcB"], "answer": 0, "explanation": "Production may be overwhelming elimination and exchange risk may be near. Why not the others: B. Feeds only — Feeding support is useful, but a rapid TSB rise despite verified intensive phototherapy requires evaluation for brisk hemolysis and imminent escalation.; C. IVIG without DAT — AAP IVIG use requires DAT-positive isoimmune hemolysis; giving IVIG without evidence of an immune mechanism exposes the infant to risk without a defined indication.; D. Stop lights and use TcB — TcB is a screening tool; TSB is required for definitive treatment decisions and when TcB is close to the phototherapy threshold or high.", "pearl": "For effective phototherapy delivery, anchor the answer to the decisive clue in this stem: production may be overwhelming elimination and exchange risk may be near.", "srcAnswer": "A"}, {"num": 62, "level": "High-Difficulty", "question": "Chronic kernicterus pattern?", "options": ["Poor suck at 48 h", "Isolated jaundice", "Dystonia + auditory neuropathy + gaze abnormality months later", "Early hypotonia only"], "answer": 2, "explanation": "These are chronic sequelae. Why not the others: A. Poor suck at 48 h — Poor suck can be an early acute ABE sign; dystonia, auditory neuropathy and gaze abnormalities months later characterize chronic kernicterus.; B. Isolated jaundice — Jaundice alone is a bilirubin level sign, not the chronic neurologic syndrome of kernicterus.; D. Early hypotonia only — Early hypotonia belongs to acute bilirubin encephalopathy, whereas chronic kernicterus manifests persistent movement/hearing/gaze sequelae.", "pearl": "When a vignette resembles Q62, do not choose by the bilirubin number alone; these are chronic sequelae.", "srcAnswer": "B"}, {"num": 63, "level": "High-Difficulty", "question": "At escalation, IV access not yet obtained. Priority?", "options": ["Oral water", "Wait for DAT", "Start/continue intensive lights while securing IV and arranging higher care", "Delay lights"], "answer": 2, "explanation": "Do not delay phototherapy. Why not the others: A. Oral water — Oral water neither corrects the underlying bilirubin kinetics nor replaces IV hydration and intensive phototherapy during escalation.; B. Wait for DAT — Etiologic confirmation must not delay bilirubin-lowering treatment when the infant is already in the escalation zone.; D. Delay lights — Intensive phototherapy is immediately available and should not be delayed while IV access is being obtained in an escalation emergency.", "pearl": "The rank-differentiating clue here is 'Start/continue intensive lights while securing IV and arranging higher care'. Translate that clue into action: do not delay phototherapy.", "srcAnswer": "C"}, {"num": 64, "level": "High-Difficulty", "question": "Direct bilirubin >50% of TSB in severe hyperbilirubinemia. Best?", "options": ["Phototherapy alone always enough", "Seek expert input; do not invent corrected TSB", "Ignore it", "Subtract it"], "answer": 1, "explanation": "This unusual scenario requires expert interpretation. Why not the others: A. Phototherapy alone always enough — Phototherapy does not treat the underlying cholestatic process and cannot be assumed sufficient when the direct fraction is very high.; C. Ignore it — A direct fraction >50% is clinically important and suggests major conjugated disease; it should trigger expert evaluation, not be ignored.; D. Subtract it — AAP does not endorse subtracting the direct component to create an “indirect treatment value”; an unusually high direct fraction calls for expert input.", "pearl": "A useful one-line rule for this scenario is: This unusual scenario requires expert interpretation.", "srcAnswer": "D"}, {"num": 65, "level": "High-Difficulty", "question": "37 wk infant discharged below phototherapy line. AAP follow-up?", "options": ["Only if DAT+", "None", "Difference from line + clinical context", "Old risk zones alone"], "answer": 2, "explanation": "Distance below threshold informs follow-up. Why not the others: A. Only if DAT+ — Clinical instability is an independent neurotoxicity risk; it does not require a positive DAT to affect bilirubin management.; B. None — The stem contains a trigger for serum bilirubin assessment; omitting measurement risks missing a treatment-threshold or rapidly rising TSB.; D. Old risk zones alone — AAP 2022 post-discharge follow-up is based primarily on how far the bilirubin is below the phototherapy threshold, together with clinical factors, rather than the older nomogram risk zones alone.", "pearl": "In neonatal jaundice questions, this finding changes management because distance below threshold informs follow-up.", "srcAnswer": "A"}, {"num": 66, "level": "High-Difficulty", "question": "DAT+ HDFN with mild bilirubin but severe anemia. Best?", "options": ["Bilirubin management solves all", "Anemia and bilirubin need parallel management/follow-up", "Exchange mandatory for anemia alone", "Phototherapy fixes anemia"], "answer": 1, "explanation": "HDFN can produce important anemia independently. Why not the others: A. Bilirubin management solves all — HDFN can cause clinically important anemia even when bilirubin is controlled; hemoglobin and late-anemia follow-up require separate attention.; C. Exchange mandatory for anemia alone — A risk factor modifies the treatment threshold but does not by itself mandate exchange; the exchange threshold and ABE signs determine that intervention.; D. Phototherapy fixes anemia — Phototherapy lowers bilirubin but does not replace destroyed RBCs or correct anemia.", "pearl": "For hemolysis classification, anchor the answer to the decisive clue in this stem: hdfn can produce important anemia independently.", "srcAnswer": "B"}, {"num": 67, "level": "High-Difficulty", "question": "Which overrides a reassuring downward TSB trend?", "options": ["New hypertonia/opisthotonos", "Weight gain", "Improved feeding", "More stools"], "answer": 0, "explanation": "ABE neurologic signs demand urgent action. Why not the others: B. Weight gain — These are reassuring feeding/elimination trends, but they do not indicate acute bilirubin neurotoxicity; new hypertonia/opisthotonos is the emergency finding.; C. Improved feeding — These are reassuring feeding/elimination trends, but they do not indicate acute bilirubin neurotoxicity; new hypertonia/opisthotonos is the emergency finding.; D. More stools — These are reassuring feeding/elimination trends, but they do not indicate acute bilirubin neurotoxicity; new hypertonia/opisthotonos is the emergency finding.", "pearl": "When a vignette resembles Q67, do not choose by the bilirubin number alone; abe neurologic signs demand urgent action.", "srcAnswer": "C"}, {"num": 68, "level": "Integrated/Rank-Differentiating", "question": "36 wk + sepsis + albumin 2.7 + DAT+ ABO, TSB rising despite lights. Best reasoning?", "options": ["DAT alone mandates exchange", "Albumin irrelevant", "Multiple risks + active hemolysis require lower framework and close escalation assessment", "Count only one risk"], "answer": 2, "explanation": "This combines GA, multiple risk factors and ongoing production. Why not the others: A. DAT alone mandates exchange — DAT identifies immune sensitization but exchange requires the exchange TSB threshold or significant ABE, not a positive DAT alone.; B. Albumin irrelevant — Albumin <3.0 g/dL is specifically an AAP neurotoxicity risk factor, so 2.6–2.8 g/dL materially changes threshold selection.; D. Count only one risk — AAP risk assessment is not limited to one factor; sepsis, low albumin and hemolysis can coexist and all reduce the bilirubin safety margin.", "pearl": "The rank-differentiating clue here is 'Multiple risks + active hemolysis require lower framework and close escalation assessment'. Translate that clue into action: this combines ga, multiple risk factors and ongoing production.", "srcAnswer": "D"}, {"num": 69, "level": "Integrated/Rank-Differentiating", "question": "Ventilated infant born at 34 wk, rising TSB. Best?", "options": ["Preterm-specific NICU bilirubin protocol", "Term exchange line", "AAP ≥35 wk chart", "No treatment because ventilated"], "answer": 0, "explanation": "AAP ≥35-week graphs do not apply at 34 weeks. Why not the others: B. Term exchange line — Applying a term exchange threshold to a 34-week infant can dangerously overestimate the bilirubin level that is safe for a preterm brain.; C. AAP ≥35 wk chart — A 34-week infant is outside the population covered by the AAP ≥35-week treatment curves; preterm-specific NICU thresholds are required.; D. No treatment because ventilated — Ventilation does not protect against bilirubin neurotoxicity; illness may actually increase vulnerability and the infant still needs gestation-specific management.", "pearl": "A useful one-line rule for this scenario is: AAP ≥35-week graphs do not apply at 34 weeks.", "srcAnswer": "A"}, {"num": 70, "level": "Integrated/Rank-Differentiating", "question": "39 wk with G6PD + sepsis + rapidly rising TSB. Why amplified risk?", "options": ["Only direct bilirubin rises", "G6PD protects brain", "Hemolysis increases load while sepsis adds neurotoxicity vulnerability", "Sepsis lowers production"], "answer": 2, "explanation": "Both bilirubin production and CNS vulnerability worsen. Why not the others: A. Only direct bilirubin rises — G6PD hemolysis raises unconjugated bilirubin through increased heme breakdown; it is not a primary conjugated cholestatic disorder.; B. G6PD protects brain — G6PD deficiency is a hemolytic risk, not a neuroprotective state; oxidative vulnerability can accelerate bilirubin production.; D. Sepsis lowers production — Sepsis does not protect against bilirubin accumulation; it increases neurotoxicity vulnerability while G6PD hemolysis increases bilirubin production.", "pearl": "In neonatal jaundice questions, this finding changes management because both bilirubin production and cns vulnerability worsen.", "srcAnswer": "B"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "DAT+ infant at escalation, albumin 2.5, early hypertonia. Priority?", "options": ["Stop lights", "Use TcB", "Escalation emergency with urgent exchange readiness", "Wait for IVIG"], "answer": 2, "explanation": "Biochemical and neurologic risk make delay unsafe. Why not the others: A. Stop lights — Stopping intensive phototherapy removes the fastest available bilirubin-lowering therapy during an active high-risk episode or escalation pathway.; B. Use TcB — TcB is a screening tool; TSB is required for definitive treatment decisions and when TcB is close to the phototherapy threshold or high.; D. Wait for IVIG — Early hypertonia signals neurologic toxicity; exchange readiness should not be delayed while waiting to see whether IVIG lowers bilirubin.", "pearl": "For bilirubin neurotoxicity and neurologic escalation, anchor the answer to the decisive clue in this stem: biochemical and neurologic risk make delay unsafe.", "srcAnswer": "C"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "Anemia + retic + spherocytes + positive DAT. Best integrated interpretation?", "options": ["Immune hemolysis strongly supported; spherocytes do not prove HS", "HS certain", "G6PD certain", "No hemolysis"], "answer": 0, "explanation": "Positive DAT shifts interpretation toward immune hemolysis. Why not the others: B. HS certain — A positive DAT establishes immune coating of RBCs; spherocytes can occur in immune hemolysis, so HS cannot be declared certain from morphology alone.; C. G6PD certain — G6PD deficiency is nonimmune hemolysis and is DAT-negative; IVIG targets isoimmune antibody-mediated hemolysis, not an RBC enzyme deficiency.; D. No hemolysis — Anemia plus reticulocytosis is a regenerative hemolytic pattern, and a positive DAT provides direct evidence of immune RBC coating.", "pearl": "When a vignette resembles Q72, do not choose by the bilirubin number alone; positive dat shifts interpretation toward immune hemolysis.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "Under phototherapy, direct hyperbilirubinemia + bronze-gray discoloration. Best?", "options": ["Proves ABE", "Physiologic", "Immediate IVIG", "Consider bronze-baby/cholestasis context and investigate conjugated disease"], "answer": 3, "explanation": "This suggests conjugated disease context, not automatic light escalation. Why not the others: A. Proves ABE — Bronze-gray discoloration under phototherapy is associated with conjugated hyperbilirubinemia (“bronze baby” phenomenon), not a diagnostic neurologic sign of ABE.; B. Physiologic — Physiologic jaundice usually becomes apparent after the first 24 hours; first-day jaundice or a cholestatic pattern requires a pathologic evaluation.; C. Immediate IVIG — IVIG is reserved for selected isoimmune hemolysis; bronze discoloration with direct hyperbilirubinemia instead calls for cholestasis evaluation.", "pearl": "The rank-differentiating clue here is 'Consider bronze-baby/cholestasis context and investigate conjugated disease'. Translate that clue into action: this suggests conjugated disease context, not automatic light escalation.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "38 wk, 12% weight loss, poor feeding, DAT− reticulocytosis, rapid TSB rise. Best?", "options": ["Correct feeding AND investigate hemolysis", "Stop breastfeeding permanently", "No labs", "Assume intake only"], "answer": 0, "explanation": "Mixed clues require dual-pathway reasoning. Why not the others: B. Stop breastfeeding permanently — Permanent breastfeeding cessation is unnecessary; the priority is to correct milk transfer, supplement when indicated, and treat bilirubin by threshold.; C. No labs — Reticulocytosis and rapid bilirubin kinetics are objective red flags for hemolysis and require laboratory evaluation.; D. Assume intake only — Poor intake explains weight loss, but reticulocytosis and a rapid TSB rise indicate an additional hemolytic process that must be investigated.", "pearl": "A useful one-line rule for this scenario is: Mixed clues require dual-pathway reasoning.", "srcAnswer": "B"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "Term infant initially at exchange line; intensive lights during transfer lower TSB below line; neuro exam normal. Best?", "options": ["May defer if now below line and no intermediate/advanced ABE; continue intensive therapy + q2h TSB until below escalation", "Discharge", "Exchange always mandatory once crossed", "Stop monitoring"], "answer": 0, "explanation": "AAP allows dynamic deferral under close monitoring. Why not the others: B. Discharge — Discharge is unsafe while the infant is in or near the escalation/exchange zone or still requires intensive monitoring.; C. Exchange always mandatory once crossed — AAP allows a prepared exchange to be deferred if intensive therapy lowers TSB below the exchange line and there are no intermediate/advanced ABE signs, with continued q2h monitoring.; D. Stop monitoring — Bilirubin can rebound or re-rise from ongoing hemolysis; close monitoring remains necessary until the infant is safely below the escalation threshold.", "pearl": "In neonatal jaundice questions, this finding changes management because aap allows dynamic deferral under close monitoring.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day6',label:'Day 6',set:'Quiz 5',href:'Day6/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day6_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 6 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 6'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 6');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day6:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
