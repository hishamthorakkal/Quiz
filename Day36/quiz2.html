@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<h1>Day 36 — Quiz 2</h1>

<script>
const quiz=[{"num": 20, "level": "High", "question": "A mother breastfeeding an infant with suspected non-IgE milk allergy is asked to eliminate dairy. Which additional step is essential?", "options": ["Avoid all grains indefinitely", "Assume symptoms prove milk allergy without reintroduction", "Stop breastfeeding immediately", "Plan time-limited diagnostic reintroduction and protect maternal calcium/nutrition"], "answer": 3, "explanation": "Diagnostic maternal elimination must be purposeful, time-limited and nutritionally supported. Why not the others: A. Avoid all grains indefinitely — Broad restrictions are not indicated.; B. Assume symptoms prove milk allergy without reintroduction — Symptom fluctuation can mislead.; C. Stop breastfeeding immediately — Breastfeeding can usually continue.", "pearl": "", "srcAnswer": "B"}, {"num": 21, "level": "High", "question": "Which statement about Kayser–Fleischer rings in children is most accurate?", "options": ["They diagnose Wilson disease without any other assessment", "They are universally present in all paediatric hepatic cases", "Their absence does not exclude hepatic Wilson disease", "They are specific to neonatal biliary atresia"], "answer": 2, "explanation": "KF rings may be absent in liver-predominant childhood disease. Why not the others: A. They diagnose Wilson disease without any other assessment — KF rings are supportive but not independently sufficient in every clinical context.; B. They are universally present in all paediatric hepatic cases — They may be absent in children with predominantly hepatic presentations.; D. They are specific to neonatal biliary atresia — KF rings are associated with copper deposition, not biliary atresia.", "pearl": "", "srcAnswer": "C"}, {"num": 22, "level": "Basic", "question": "Which transporter underlies glucose-facilitated sodium absorption during oral rehydration?", "options": ["SGLT1 on the intestinal brush border", "ENaC in distal colonic epithelium", "CFTR on the apical membrane", "NKCC2 in the thick ascending limb"], "answer": 0, "explanation": "SGLT1 cotransports sodium with glucose across enterocytes. Why not the others: B. ENaC in distal colonic epithelium — ENaC is not the main glucose-coupled ORS mechanism.; C. CFTR on the apical membrane — CFTR secretes chloride; it is not glucose-sodium uptake.; D. NKCC2 in the thick ascending limb — NKCC2 is a renal transporter.", "pearl": "", "srcAnswer": "B"}, {"num": 23, "level": "Clinical", "question": "A severely affected infant continues reacting to extensively hydrolysed formula with growth faltering. Which alternative is appropriate after specialist assessment?", "options": ["Goat milk formula", "Amino-acid-based formula", "Lactose-free intact cow milk", "Diluted standard formula"], "answer": 1, "explanation": "Amino-acid formula can be needed for severe or eHF-refractory CMA. Why not the others: A. Goat milk formula — Milk protein cross-reactivity can occur.; C. Lactose-free intact cow milk — Milk proteins remain intact.; D. Diluted standard formula — Dilution worsens nutritional adequacy and retains allergen.", "pearl": "", "srcAnswer": "A"}, {"num": 24, "level": "Clinical", "question": "A child with chronic cholestatic liver disease develops pruritus. Which mechanism is implicated?", "options": ["Isolated hypercalcaemia in all patients", "A single high AST result without cholestasis", "Uncomplicated haemolysis alone", "Cholestatic retention of pruritogenic mediators"], "answer": 3, "explanation": "Pruritus in cholestasis has complex mediator pathways; assess severity and specialist therapy. Why not the others: A. Isolated hypercalcaemia in all patients — Hypercalcaemia is not the universal mechanism of cholestatic itch.; B. A single high AST result without cholestasis — AST alone is an injury marker, not a mechanism of cholestatic pruritus.; C. Uncomplicated haemolysis alone — Haemolysis alone does not explain chronic cholestatic pruritus.", "pearl": "", "srcAnswer": "B"}, {"num": 25, "level": "Conceptual", "question": "In WHO Plan C, a 9-month-old without shock should receive the 30 mL/kg first phase over approximately:", "options": ["3 hours", "1 hour", "30 minutes", "5 hours"], "answer": 1, "explanation": "For infants <12 months, the first 30 mL/kg is over 1 h. Why not the others: A. 3 hours — Three hours is the total older-child regimen.; C. 30 minutes — 30 minutes is the first-phase timing for older children.; D. 5 hours — Five hours is the infant second phase.", "pearl": "", "srcAnswer": "D"}, {"num": 26, "level": "Clinical", "question": "A child with normal total IgA has tTG-IgA 13× assay ULN. Which additional finding is required for the ESPGHAN 2020 no-biopsy pathway?", "options": ["Iron deficiency alone", "Raised total IgE", "Positive EMA-IgA on a second blood sample", "HLA-DQ2 positivity alone"], "answer": 2, "explanation": "The 10× ULN threshold and second-sample EMA are both required, with specialist agreement. Why not the others: A. Iron deficiency alone — Symptoms or iron deficiency do not replace second-sample EMA.; B. Raised total IgE — IgE is unrelated to the coeliac no-biopsy criterion.; D. HLA-DQ2 positivity alone — HLA testing is not obligatory in this pathway.", "pearl": "", "srcAnswer": "B"}, {"num": 27, "level": "High", "question": "Which histological pattern may support extrahepatic biliary obstruction in an infant?", "options": ["Only granulomatous inflammation", "Pure centrilobular necrosis after shock", "Isolated macrovesicular steatosis with no portal changes", "Ductular proliferation with portal fibrosis and bile plugs"], "answer": 3, "explanation": "Biliary obstruction produces portal/ductular changes; biopsy is supportive, not standalone proof. Why not the others: A. Only granulomatous inflammation — Granulomas suggest other inflammatory differentials rather than a typical obstructive pattern.; B. Pure centrilobular necrosis after shock — Centrilobular necrosis is more compatible with ischaemic injury than extrahepatic obstruction.; C. Isolated macrovesicular steatosis with no portal changes — Steatosis alone does not show the portal ductular reaction of obstruction.", "pearl": "", "srcAnswer": "A"}, {"num": 28, "level": "Clinical", "question": "A severely dehydrated child has serum Na 159 mmol/L. Which principle is most important after initial circulation stabilization?", "options": ["Avoid checking sodium after treatment begins", "Normalize sodium immediately using unrestricted hypotonic boluses", "Correct the water deficit carefully with serial sodium and neurological monitoring", "Give diuretics to accelerate sodium reduction"], "answer": 2, "explanation": "Hypernatremia needs cautious correction after resuscitation to avoid cerebral edema. Why not the others: A. Avoid checking sodium after treatment begins — Serial electrolyte monitoring is essential.; B. Normalize sodium immediately using unrestricted hypotonic boluses — Rapid correction increases neurological risk.; D. Give diuretics to accelerate sodium reduction — Diuresis is not a routine correction strategy.", "pearl": "", "srcAnswer": "A"}, {"num": 29, "level": "Clinical", "question": "A child has deep ulcers, perianal fistula and marked growth delay at Crohn diagnosis. According to the 2026 guideline, which strategy is favoured?", "options": ["Wait years before escalating therapy", "Use corticosteroids indefinitely as maintenance", "Early anti-TNF therapy for high-risk disease", "Dietary reassurance alone"], "answer": 2, "explanation": "High-risk paediatric Crohn disease warrants early biologic therapy and monitoring. Why not the others: A. Wait years before escalating therapy — Delay can worsen growth and bowel damage.; B. Use corticosteroids indefinitely as maintenance — Chronic steroid toxicity and poor maintenance efficacy are major concerns.; D. Dietary reassurance alone — High-risk phenotype requires active disease control.", "pearl": "", "srcAnswer": "A"}, {"num": 30, "level": "High", "question": "Which test most directly assesses suspected oesophageal varices?", "options": ["Plain abdominal radiograph", "Upper gastrointestinal endoscopy", "Sweat chloride alone", "Routine EEG"], "answer": 1, "explanation": "Endoscopy visualises varices and permits therapy where indicated. Why not the others: A. Plain abdominal radiograph — Plain radiography cannot directly visualise oesophageal varices.; C. Sweat chloride alone — Sweat chloride is a cystic fibrosis test, not a variceal assessment.; D. Routine EEG — EEG evaluates cerebral electrical activity, not oesophageal veins.", "pearl": "", "srcAnswer": "B"}, {"num": 31, "level": "Conceptual", "question": "A 2-year-old with diarrhoea is restless, has sunken eyes, drinks eagerly and skin pinch returns slowly. Which IMCI category fits best?", "options": ["Severe dehydration", "No dehydration", "Some dehydration", "Septic shock by definition"], "answer": 2, "explanation": "Two or more relevant signs including thirst and slow pinch indicate some dehydration. Why not the others: A. Severe dehydration — Severe category requires severe signs such as lethargy, poor drinking or very slow pinch.; B. No dehydration — Multiple dehydration signs exclude no dehydration.; D. Septic shock by definition — These signs alone do not establish shock.", "pearl": "", "srcAnswer": "D"}, {"num": 32, "level": "Conceptual", "question": "An 8-year-old with Down syndrome and faltering growth needs coeliac case finding. What is the appropriate initial test while on gluten?", "options": ["Serum amylase alone", "HLA-DQ8 alone", "Anti-endomysial IgE alone", "Total IgA with tTG-IgA"], "answer": 3, "explanation": "At-risk groups still use serology with total IgA. Why not the others: A. Serum amylase alone — Amylase is a pancreatic enzyme, not a coeliac test.; B. HLA-DQ8 alone — Genetic predisposition is insufficient.; C. Anti-endomysial IgE alone — EMA-IgE is not the recommended screen.", "pearl": "", "srcAnswer": "C"}, {"num": 33, "level": "High", "question": "A baby has conjugated jaundice and a normal gallbladder on ultrasound. What should the team conclude?", "options": ["Biliary atresia is impossible", "Only hemolysis remains possible", "Biliary atresia cannot be excluded by a normal ultrasound", "A liver biopsy is always contraindicated"], "answer": 2, "explanation": "Ultrasound sensitivity is imperfect; clinical urgency persists. Why not the others: A. Biliary atresia is impossible — Ultrasound lacks sufficient sensitivity to exclude biliary atresia.; B. Only hemolysis remains possible — A normal gallbladder does not restrict the differential to haemolysis.; D. A liver biopsy is always contraindicated — Biopsy may be considered by the specialist; it is not universally contraindicated.", "pearl": "", "srcAnswer": "D"}, {"num": 34, "level": "High", "question": "A 9-kg infant with some dehydration needs Plan B ORS. Which calculation is correct?", "options": ["900 mL over 30 minutes", "675 mL over 4 hours", "1350 mL over 4 hours", "450 mL over 4 hours"], "answer": 1, "explanation": "9×75=675 mL over four hours. Why not the others: A. 900 mL over 30 minutes — 900 mL rapidly is not Plan B.; C. 1350 mL over 4 hours — 1350 corresponds to 150 mL/kg.; D. 450 mL over 4 hours — 450 corresponds to 50 mL/kg.", "pearl": "", "srcAnswer": "C"}, {"num": 35, "level": "Conceptual", "question": "A 3-year-old has diarrhoea that persists during fasting and stool osmotic gap 25 mOsm/kg. Which mechanism is favoured?", "options": ["Secretory diarrhoea", "Osmotic lactose malabsorption", "Functional constipation", "Pancreatic fat maldigestion"], "answer": 0, "explanation": "Low osmotic gap and persistence during fasting support secretory losses. Why not the others: B. Osmotic lactose malabsorption — High gap and fasting improvement would be more typical.; C. Functional constipation — It does not cause persistent high-volume watery stool.; D. Pancreatic fat maldigestion — This more often causes greasy stools.", "pearl": "", "srcAnswer": "D"}, {"num": 36, "level": "Conceptual", "question": "A child with acute liver failure has a new seizure and sodium disturbance. Which initial priority is most appropriate?", "options": ["Wait for routine outpatient EEG", "Assume the event is benign breath-holding", "Administer unmonitored hypotonic fluids", "Stabilise airway, breathing and circulation while urgently evaluating metabolic triggers"], "answer": 3, "explanation": "PALF neurodeterioration is an emergency requiring critical-care assessment. Why not the others: A. Wait for routine outpatient EEG — An outpatient EEG cannot replace immediate stabilisation.; B. Assume the event is benign breath-holding — A seizure in acute liver failure requires emergency assessment, not benign attribution.; C. Administer unmonitored hypotonic fluids — Unmonitored hypotonic fluids can worsen cerebral oedema or dysnatraemia.", "pearl": "", "srcAnswer": "D"}, {"num": 37, "level": "Clinical", "question": "Which interpretation of the 2023 ESPGHAN probiotic position paper is accurate when compared with WHO 2024?", "options": ["Both organizations give a strong recommendation for every strain", "ESPGHAN allows selected strains as weak optional adjuncts; WHO suggests against routine probiotics", "ESPGHAN mandates all commercial probiotic products", "ESPGHAN replaces oral rehydration with Lactobacillus"], "answer": 1, "explanation": "ESPGHAN gives strain-specific weak options, unlike the WHO 2024 suggestion against routine use. Why not the others: A. Both organizations give a strong recommendation for every strain — Neither gives strong support to every formulation.; C. ESPGHAN mandates all commercial probiotic products — Efficacy is strain-specific and evidence is limited.; D. ESPGHAN replaces oral rehydration with Lactobacillus — ORS remains first-line in both frameworks.", "pearl": "", "srcAnswer": "B"}, {"num": 38, "level": "Clinical", "question": "A 7-month-old with chronic diarrhoea improves after milk elimination. What establishes a causal non-IgE milk-allergy diagnosis more reliably than improvement alone?", "options": ["Elevated total IgE alone", "Recurrence of compatible symptoms with appropriate reintroduction", "An abdominal radiograph", "A family history of eczema"], "answer": 1, "explanation": "Elimination response alone is insufficient because symptoms often fluctuate. Why not the others: A. Elevated total IgE alone — Total IgE is nonspecific.; C. An abdominal radiograph — Imaging is not a confirmatory allergy test.; D. A family history of eczema — Atopy increases suspicion but does not prove causation.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day36',label:'Day 36',set:'Quiz 2',href:'Day36/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day36_QuizSet2_Q20-38_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 36 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 20–38</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 36 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 36'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 36');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day36:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
