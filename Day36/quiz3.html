@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 39, "level": "High", "question": "Which statement about the timing of BA screening is best aligned with AAP 2025?", "options": ["Routine evaluation should first occur after 6 months", "Screen only infants with failure to thrive", "Evaluate suspicious features at the 2–4-week visit rather than waiting for 2 months", "Screen only infants with high unconjugated bilirubin"], "answer": 2, "explanation": "The 2025 AAP approach targets recognition at 2–4 weeks. Why not the others: A. Routine evaluation should first occur after 6 months — Waiting six months loses the optimal window for intervention.; B. Screen only infants with failure to thrive — Infants with biliary atresia can initially grow well.; D. Screen only infants with high unconjugated bilirubin — The AAP screen uses jaundice, stool colour and earlier direct bilirubin, not unconjugated bilirubin alone.", "pearl": "", "srcAnswer": "B"}, {"num": 40, "level": "Basic", "question": "A child has watery stools for 16 consecutive days, with no blood. Under WHO syndrome classification, what is the correct label?", "options": ["Acute watery diarrhoea (<14 days)", "Persistent diarrhoea (≥14 days)", "Post-infectious constipation syndrome", "Acute bloody diarrhoea (dysentery)"], "answer": 1, "explanation": "Duration ≥14 days defines persistent diarrhoea. Why not the others: A. Acute watery diarrhoea (<14 days) — Acute watery diarrhoea is shorter than 14 days.; C. Post-infectious constipation syndrome — Constipation does not explain ongoing watery stools.; D. Acute bloody diarrhoea (dysentery) — Dysentery is defined by visible blood.", "pearl": "", "srcAnswer": "B"}, {"num": 41, "level": "Clinical", "question": "A 12-year-old with coeliac disease has normal symptoms but poor linear growth and persistent tTG elevation after diagnosis. Most useful interpretation?", "options": ["Normal stools prove histologic healing", "Stop follow-up once diagnosis is made", "Growth failure is unrelated to coeliac disease", "Assess dietary gluten exposure and nutritional recovery rather than declaring remission"], "answer": 3, "explanation": "Follow-up requires growth, nutrition, symptoms and serology trends. Why not the others: A. Normal stools prove histologic healing — Clinical symptoms do not reliably prove healing.; B. Stop follow-up once diagnosis is made — Growth and serologic follow-up remain important.; C. Growth failure is unrelated to coeliac disease — Untreated or ongoing disease can impair growth.", "pearl": "", "srcAnswer": "A"}, {"num": 42, "level": "Integrated", "question": "A child with suspected PALF is being managed in a district hospital. Which referral principle is safest?", "options": ["Refer only when bilirubin exceeds 30 mg/dL", "Refer only after prolonged coma develops", "Refer only after ascites becomes refractory", "Early discussion with paediatric liver-transplant-capable centre"], "answer": 3, "explanation": "Early referral allows evaluation before irreversible multi-organ complications. Why not the others: A. Refer only when bilirubin exceeds 30 mg/dL — Bilirubin >30 mg/dL is not required for PALF referral.; B. Refer only after prolonged coma develops — Prolonged coma is a late and dangerous trigger for referral.; C. Refer only after ascites becomes refractory — Waiting for refractory ascites delays assessment of a rapidly progressive emergency.", "pearl": "", "srcAnswer": "D"}, {"num": 43, "level": "Clinical", "question": "After a week of bloody diarrhoea, a 4-year-old develops pallor, bruising and oliguria. Which complication should be urgently evaluated?", "options": ["Uncomplicated rotavirus infection", "Shiga toxin-associated hemolytic uremic syndrome", "Isolated iron deficiency without renal injury", "Transient physiological oliguria from age"], "answer": 1, "explanation": "Hemolysis, thrombocytopenia and AKI after diarrhoea suggest HUS. Why not the others: A. Uncomplicated rotavirus infection — Rotavirus does not characteristically cause this triad.; C. Isolated iron deficiency without renal injury — Iron deficiency does not explain acute oliguria and thrombocytopenia.; D. Transient physiological oliguria from age — Oliguria with bruising is not physiological.", "pearl": "", "srcAnswer": "A"}, {"num": 44, "level": "High", "question": "A child has colitis that cannot be confidently assigned to UC or Crohn after full investigation. Which term is appropriate?", "options": ["Functional diarrhoea by default", "Crohn disease based solely on age", "Coeliac disease without serology", "IBD-unclassified (IBD-U)"], "answer": 3, "explanation": "IBD-U is reserved for genuine uncertainty after complete phenotyping. Why not the others: A. Functional diarrhoea by default — Objective chronic inflammation has been demonstrated.; B. Crohn disease based solely on age — Age alone does not classify IBD.; C. Coeliac disease without serology — IBD-U is a distinct classification.", "pearl": "", "srcAnswer": "B"}, {"num": 45, "level": "Clinical", "question": "A 3-month-old with PALF has hypoglycaemia and lactic acidosis. Which approach is best?", "options": ["Assume every infant has hepatitis E", "Exclude inherited disease because of young age", "Wait for neurologic signs before metabolic testing", "Investigate metabolic/mitochondrial disorders alongside infection and other causes"], "answer": 3, "explanation": "Metabolic causes are particularly important in infantile PALF. Why not the others: A. Assume every infant has hepatitis E — Assuming hepatitis E overlooks metabolic, mitochondrial and other causes.; B. Exclude inherited disease because of young age — Infancy is a high-risk period for inherited metabolic decompensation.; C. Wait for neurologic signs before metabolic testing — Metabolic testing must not wait for overt encephalopathy in an infant.", "pearl": "", "srcAnswer": "D"}, {"num": 46, "level": "Clinical", "question": "A child has profuse watery stools even while fasting. Which mechanism best explains persistence?", "options": ["Only unabsorbed dietary lactose", "Excess dietary sorbitol alone", "Active intestinal electrolyte secretion", "Exclusive fructose malabsorption"], "answer": 2, "explanation": "Secretory diarrhoea continues despite fasting. Why not the others: A. Only unabsorbed dietary lactose — Osmotic lactose diarrhoea typically improves with fasting.; B. Excess dietary sorbitol alone — Sorbitol-associated osmotic losses decrease when removed.; D. Exclusive fructose malabsorption — Fructose-related osmotic losses decrease without intake.", "pearl": "", "srcAnswer": "D"}, {"num": 47, "level": "Integrated", "question": "For suspected mild non-IgE cow’s-milk allergy, what is the usual diagnostic elimination interval before reintroduction?", "options": ["At least 12 months before any reintroduction", "Approximately 2–4 weeks", "Exactly 24 hours", "Only 30 minutes"], "answer": 1, "explanation": "WAO DRACMA suggests 2–4 weeks for diagnostic elimination in non-IgE CMA. Why not the others: A. At least 12 months before any reintroduction — That confuses diagnosis with later therapeutic avoidance.; C. Exactly 24 hours — Delayed symptoms may require longer to resolve.; D. Only 30 minutes — That may assess immediate symptoms, not delayed non-IgE disease.", "pearl": "", "srcAnswer": "D"}, {"num": 48, "level": "High", "question": "An infant has cholestasis with an enlarged echogenic liver and unexplained renal cysts. Which strategy is most appropriate?", "options": ["Perform isolated phototherapy without fractionation", "Assume physiological jaundice and stop testing", "Evaluate syndromic/metabolic causes and refer for specialist work-up", "Diagnose biliary atresia from ultrasound alone"], "answer": 2, "explanation": "Multisystem signs broaden the differential; no single imaging feature confirms the cause. Why not the others: A. Perform isolated phototherapy without fractionation — Phototherapy treats unconjugated hyperbilirubinaemia, not a multisystem cholestatic syndrome.; B. Assume physiological jaundice and stop testing — Conjugated cholestasis with multisystem findings is never dismissed as physiological jaundice.; D. Diagnose biliary atresia from ultrasound alone — Ultrasound findings alone cannot establish biliary atresia.", "pearl": "", "srcAnswer": "D"}, {"num": 49, "level": "Integrated", "question": "A 3-year-old has watery diarrhoea and severe dehydration, but an oral glucose-electrolyte solution is unavailable. Which next principle is safest?", "options": ["Give plain water alone for severe dehydration", "Use undiluted fruit syrup for all losses", "Delay treatment until ORS becomes available", "Arrange urgent facility-based rehydration"], "answer": 3, "explanation": "Severe dehydration requires prompt supervised fluid therapy. Why not the others: A. Give plain water alone for severe dehydration — Water alone does not replace electrolytes and is inadequate for severe dehydration.; B. Use undiluted fruit syrup for all losses — Concentrated sugar worsens osmotic losses.; C. Delay treatment until ORS becomes available — Delay can be fatal.", "pearl": "", "srcAnswer": "C"}, {"num": 50, "level": "Conceptual", "question": "After a diagnostic elimination period, a stable infant with suspected mild non-IgE CMA has no red flags. What is the main purpose of planned reintroduction?", "options": ["To measure serum calcium absorption", "To determine whether milk exposure reproduces symptoms and confirms the diagnosis", "To diagnose coeliac disease", "To induce immediate lifelong tolerance in one day"], "answer": 1, "explanation": "Reintroduction reduces unnecessary prolonged elimination and overdiagnosis. Why not the others: A. To measure serum calcium absorption — That is not the allergy confirmation goal.; C. To diagnose coeliac disease — Milk reintroduction does not test gluten autoimmunity.; D. To induce immediate lifelong tolerance in one day — Diagnostic reintroduction does not guarantee tolerance.", "pearl": "", "srcAnswer": "B"}, {"num": 51, "level": "Integrated", "question": "A child with severe acute hepatitis becomes drowsy and hypoglycaemic. Which response is safest?", "options": ["Delay assessment until ALT normalises", "Prescribe sedatives to facilitate examination", "Use oral iron as the only intervention", "Urgent intensive monitoring, glucose correction and transplant-centre discussion"], "answer": 3, "explanation": "Encephalopathy and hypoglycaemia signal potentially rapidly progressive PALF. Why not the others: A. Delay assessment until ALT normalises — ALT normalization is not a prerequisite for recognizing and stabilizing acute liver failure.; B. Prescribe sedatives to facilitate examination — Sedation without stabilization can obscure encephalopathy and compromise airway assessment.; C. Use oral iron as the only intervention — Oral iron does not address hypoglycaemia, encephalopathy or failing hepatic synthesis.", "pearl": "", "srcAnswer": "A"}, {"num": 52, "level": "Integrated", "question": "A child has repeated diarrhoeal episodes and no documented rotavirus immunization. Which preventive strategy is relevant?", "options": ["Avoidance of breastfeeding for the first year", "Age-appropriate rotavirus vaccination according to the national schedule", "Routine long-term antibiotics to suppress all viruses", "Prophylactic loperamide before travel"], "answer": 1, "explanation": "Rotavirus immunization reduces severe rotavirus gastroenteritis risk. Why not the others: A. Avoidance of breastfeeding for the first year — Breastfeeding reduces diarrhoeal risk.; C. Routine long-term antibiotics to suppress all viruses — Antibiotics do not prevent viral infection.; D. Prophylactic loperamide before travel — Loperamide prophylaxis is inappropriate in children.", "pearl": "", "srcAnswer": "C"}, {"num": 53, "level": "High", "question": "A child with suspected milk allergy has a positive milk-specific IgE test but has never reacted clinically. Which statement is most accurate?", "options": ["Any positive IgE establishes anaphylaxis risk and clinical disease", "A negative skin test rules out all non-IgE disease", "Sensitisation alone does not prove clinical allergy", "Milk-specific IgE diagnoses non-IgE FPIAP"], "answer": 2, "explanation": "Interpret sensitisation with reaction history and supervised assessment. Why not the others: A. Any positive IgE establishes anaphylaxis risk and clinical disease — Sensitisation and clinical reactivity differ.; B. A negative skin test rules out all non-IgE disease — Non-IgE phenotypes may have negative tests.; D. Milk-specific IgE diagnoses non-IgE FPIAP — Non-IgE disease cannot be confirmed by IgE alone.", "pearl": "", "srcAnswer": "A"}, {"num": 54, "level": "High", "question": "A jaundiced 4-week-old infant has a high GGT. Which differential is especially important?", "options": ["Normal breast-milk jaundice", "Biliary atresia or other obstructive cholangiopathy", "Pure haemolytic disease without liver injury", "PFIC type 1 as the only possibility"], "answer": 1, "explanation": "GGT can help phenotype cholestasis; high values suggest cholangiopathic/obstructive disease, not prove a single cause. Why not the others: A. Normal breast-milk jaundice — Breast-milk jaundice is predominantly unconjugated.; C. Pure haemolytic disease without liver injury — Pure haemolysis produces predominantly unconjugated bilirubin, not high-GGT cholestasis.; D. PFIC type 1 as the only possibility — PFIC1 typically has low/normal GGT, and is not the only possible cause.", "pearl": "", "srcAnswer": "C"}, {"num": 55, "level": "High", "question": "In severely malnourished children with suspected cholera or profuse watery diarrhoea, which oral fluid exception is highlighted by WHO?", "options": ["Concentrated salt water is preferred to ORS", "ReSoMal must replace all ORS in every cholera case", "No oral rehydration should be used under any circumstance", "Standard low-osmolarity ORS may be needed rather than ReSoMal"], "answer": 3, "explanation": "WHO notes standard low-osmolarity ORS for cholera/profuse watery losses in SAM. Why not the others: A. Concentrated salt water is preferred to ORS — Concentrated saline is not a rehydration formulation.; B. ReSoMal must replace all ORS in every cholera case — ReSoMal may not supply sufficient sodium for high-output cholera.; C. No oral rehydration should be used under any circumstance — Oral therapy remains useful when clinically appropriate.", "pearl": "", "srcAnswer": "A"}, {"num": 56, "level": "High", "question": "A teenager with coeliac disease asks whether a positive HLA-DQ2 test alone confirms disease. Best response?", "options": ["Yes, if haemoglobin is low", "Yes, if lactose intolerance coexists", "No; it indicates susceptibility but has low positive predictive value", "Yes; HLA-DQ2 is diagnostic"], "answer": 2, "explanation": "HLA absence is useful to make disease unlikely; presence is not proof. Why not the others: A. Yes, if haemoglobin is low — Anaemia is nonspecific.; B. Yes, if lactose intolerance coexists — Lactase deficiency does not establish coeliac disease.; D. Yes; HLA-DQ2 is diagnostic — Many healthy individuals carry DQ2.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day36',label:'Day 36',set:'Quiz 3',href:'Day36/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day36_QuizSet3_Q39-56_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 36 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 39–56</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 36 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 36'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 36');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day36:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
