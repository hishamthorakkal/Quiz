@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
const quiz=[{"num": 1, "level": "High", "question": "A child with prolonged diarrhoea has recent antibiotic exposure and new fever with abdominal pain. Which next step is reasonable?", "options": ["Reassess for antibiotic-associated colitis and other inflammatory causes", "Ignore medication history because it is unrelated", "Increase antidiarrhoeal dose empirically", "Assume ordinary viral diarrhoea without review"], "answer": 0, "explanation": "Antibiotic exposure can change the differential and warrants reassessment. Why not the others: B. Ignore medication history because it is unrelated — Medication history is diagnostically important.; C. Increase antidiarrhoeal dose empirically — Antimotility drugs may be unsafe in colitis.; D. Assume ordinary viral diarrhoea without review — New systemic signs require evaluation.", "pearl": "", "srcAnswer": "A"}, {"num": 2, "level": "Clinical", "question": "A 12-year-old with functional abdominal pain misses school frequently. Which treatment has strong guideline support in 2025?", "options": ["Routine broad-spectrum antibiotics", "Gut-directed cognitive behavioural therapy", "Prolonged systemic corticosteroids", "Repeated abdominal CT scans"], "answer": 1, "explanation": "ESPGHAN/NASPGHAN 2025 strongly recommends CBT; evidence certainty is low. Why not the others: A. Routine broad-spectrum antibiotics — Antibiotics do not address a gut–brain pain disorder.; C. Prolonged systemic corticosteroids — Steroids have no routine role in FAP.; D. Repeated abdominal CT scans — Imaging without red flags adds radiation without benefit.", "pearl": "", "srcAnswer": "B"}, {"num": 3, "level": "Basic", "question": "Which laboratory test best reflects hepatic synthetic dysfunction in acute liver failure?", "options": ["Isolated ALT magnitude", "Isolated alkaline phosphatase", "Urine bilirubin alone", "Prothrombin time/INR"], "answer": 3, "explanation": "INR assesses clotting factor synthesis and is central to PALF severity; ALT alone is not synthetic function. Why not the others: A. Isolated ALT magnitude — ALT measures hepatocyte injury, not synthetic capacity.; B. Isolated alkaline phosphatase — ALP can reflect cholestasis or bone growth, not acute synthetic function.; C. Urine bilirubin alone — Urine bilirubin indicates conjugated pigment but not synthesis of clotting factors.", "pearl": "", "srcAnswer": "B"}, {"num": 4, "level": "Conceptual", "question": "A 7-month-old with severe dehydration and no shock receives WHO Plan C at a facility. Which initial IV volume is given first?", "options": ["20 mL/kg dextrose bolus, then no reassessment", "30 mL/kg, followed by 70 mL/kg", "75 mL/kg orally, without IV treatment", "70 mL/kg, followed by 30 mL/kg"], "answer": 1, "explanation": "WHO Plan C sequence is 30 then 70 mL/kg, with age-specific timing. Why not the others: A. 20 mL/kg dextrose bolus, then no reassessment — Dextrose bolus is not standard primary dehydration replacement.; C. 75 mL/kg orally, without IV treatment — Plan B oral regimen is inappropriate for severe dehydration.; D. 70 mL/kg, followed by 30 mL/kg — 70 then 30 reverses the sequence.", "pearl": "", "srcAnswer": "C"}, {"num": 5, "level": "Conceptual", "question": "A teenager on anti-TNF therapy loses response with low trough level and anti-drug antibodies. Which next concept is relevant?", "options": ["Therapeutic drug monitoring to guide dose optimization or switching", "Stop all monitoring once an infusion was given", "Use calprotectin alone to measure drug exposure", "Assume every loss of response is functional pain"], "answer": 0, "explanation": "The 2026 Crohn update incorporates proactive and reactive drug monitoring. Why not the others: B. Stop all monitoring once an infusion was given — Loss of response needs reassessment.; C. Use calprotectin alone to measure drug exposure — Calprotectin measures inflammation, not trough concentration.; D. Assume every loss of response is functional pain — Objective markers and drug levels should be evaluated.", "pearl": "", "srcAnswer": "D"}, {"num": 6, "level": "Basic", "question": "Which stool finding is most concerning in a jaundiced 3-week-old infant?", "options": ["Green stools in an otherwise well infant", "Loose mustard stools with normal hydration", "Persistent grey or white stools", "Frequent yellow stools after feeds"], "answer": 2, "explanation": "Acholic stool warrants prompt fractionated bilirubin and evaluation. Why not the others: A. Green stools in an otherwise well infant — Green stool indicates bile pigment reaching the intestine.; B. Loose mustard stools with normal hydration — Normal mustard stool is not acholic.; D. Frequent yellow stools after feeds — Yellow stool after feeding is generally bile-pigmented.", "pearl": "", "srcAnswer": "A"}, {"num": 7, "level": "High", "question": "A previously well 3-year-old develops transient loose stools after a viral illness when large lactose loads are reintroduced. Which explanation is plausible?", "options": ["Shigella dysentery without blood or fever", "Congenital sucrase-isomaltase deficiency diagnosed by age alone", "Intestinal volvulus with no other symptoms", "Secondary transient lactase deficiency after mucosal injury"], "answer": 3, "explanation": "Temporary brush-border lactase reduction may follow gastroenteritis. Why not the others: A. Shigella dysentery without blood or fever — Shigella usually produces inflammatory symptoms.; B. Congenital sucrase-isomaltase deficiency diagnosed by age alone — Congenital enzyme deficiency is not established by this history.; C. Intestinal volvulus with no other symptoms — Volvulus causes obstructive danger signs.", "pearl": "", "srcAnswer": "B"}, {"num": 8, "level": "High", "question": "A child with Crohn disease improves symptomatically but faecal calprotectin remains high and growth is poor. Best long-term treatment target?", "options": ["Objective mucosal remission and normal growth, not symptoms alone", "Persistent steroid use regardless of response", "No follow-up if pain resolves", "Weight gain alone without inflammatory assessment"], "answer": 0, "explanation": "Treat-to-target integrates clinical, biochemical, endoscopic and growth outcomes. Why not the others: B. Persistent steroid use regardless of response — Steroids are not maintenance targets.; C. No follow-up if pain resolves — Symptoms can underestimate inflammation.; D. Weight gain alone without inflammatory assessment — Growth is necessary but not sufficient.", "pearl": "", "srcAnswer": "A"}, {"num": 9, "level": "Integrated", "question": "A premature infant receiving prolonged parenteral nutrition develops conjugated jaundice. Which statement is safest?", "options": ["Parenteral nutrition excludes biliary atresia", "PN-associated cholestasis is possible, but biliary atresia still must be considered", "All direct hyperbilirubinaemia is physiologic in prematurity", "No investigation is required before 6 months"], "answer": 1, "explanation": "PN exposure is a risk factor but does not rule out time-critical causes. Why not the others: A. Parenteral nutrition excludes biliary atresia — Parenteral nutrition does not exclude coexisting biliary atresia.; C. All direct hyperbilirubinaemia is physiologic in prematurity — Direct hyperbilirubinaemia is not a physiological consequence of prematurity.; D. No investigation is required before 6 months — Cholestasis in infancy requires timely assessment; waiting six months is unsafe.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "Integrated", "question": "A 4-year-old has acute diarrhoea and drinks ORS well but caregivers request a drug to stop stooling immediately. Which counselling is best?", "options": ["Loperamide is required before any ORS", "Antimotility therapy prevents STEC-associated HUS", "Rehydration and feeding are primary; avoid routine antimotility agents in young children", "Stopping stools is more important than replacing fluids"], "answer": 2, "explanation": "Fluid replacement is the cornerstone and antimotility agents can harm children. Why not the others: A. Loperamide is required before any ORS — ORS should not be delayed.; B. Antimotility therapy prevents STEC-associated HUS — Antimotility agents may increase HUS risk.; D. Stopping stools is more important than replacing fluids — Hydration, not stool suppression, prevents shock.", "pearl": "", "srcAnswer": "D"}, {"num": 11, "level": "Clinical", "question": "A 9-year-old has stereotyped attacks of severe midline pain with nausea, pallor and symptom-free intervals. Which functional diagnosis is plausible?", "options": ["Pyloric stenosis", "Abdominal migraine", "Chronic appendicitis in every episode", "Nephrotic syndrome"], "answer": 1, "explanation": "Abdominal migraine is episodic, stereotyped and often accompanied by pallor/nausea. Why not the others: A. Pyloric stenosis — Pyloric stenosis presents in early infancy with vomiting.; C. Chronic appendicitis in every episode — Stereotyped symptom-free attacks are not classic appendicitis.; D. Nephrotic syndrome — Nephrotic syndrome presents with proteinuria and oedema.", "pearl": "", "srcAnswer": "B"}, {"num": 12, "level": "Basic", "question": "Which gene is implicated in Wilson disease?", "options": ["UGT1A1", "ATP8B1", "ABCB11", "ATP7B"], "answer": 3, "explanation": "ATP7B encodes a copper-transporting ATPase needed for biliary copper excretion. Why not the others: A. UGT1A1 — UGT1A1 is involved in bilirubin conjugation disorders, not copper transport.; B. ATP8B1 — ATP8B1 is associated with PFIC1, not Wilson disease.; C. ABCB11 — ABCB11 encodes BSEP and is associated with PFIC2, not Wilson disease.", "pearl": "", "srcAnswer": "C"}, {"num": 13, "level": "Clinical", "question": "A toddler has watery diarrhoea for 18 days, weight loss and reduced intake. Which initial clinical priority is most important?", "options": ["Assess hydration, nutrition, feeding history and growth trend", "Prescribe antimotility therapy as the sole intervention", "Begin a lifelong gluten-free diet without evaluation", "Defer nutritional assessment until the stools stop"], "answer": 0, "explanation": "Persistent diarrhoea requires nutritional and hydration assessment before cause-specific workup. Why not the others: B. Prescribe antimotility therapy as the sole intervention — Antimotility monotherapy is inappropriate.; C. Begin a lifelong gluten-free diet without evaluation — Specific exclusion diets need an indication.; D. Defer nutritional assessment until the stools stop — Malnutrition can worsen prolonged diarrhoea.", "pearl": "", "srcAnswer": "B"}, {"num": 14, "level": "Conceptual", "question": "A newly diagnosed low-risk child with active luminal Crohn disease prefers nutrition-based induction. What does the 2026 ECCO–ESPGHAN update support?", "options": ["Long-term steroids as maintenance", "Exclusive enteral nutrition as a preferred first-line induction option", "Immediate colectomy for all children", "Antibiotics alone for all luminal disease"], "answer": 1, "explanation": "EEN or Crohn disease exclusion diet plus partial EN are preferred low-risk nutritional induction strategies. Why not the others: A. Long-term steroids as maintenance — Corticosteroids are not appropriate maintenance treatment.; C. Immediate colectomy for all children — Surgery is not first-line for low-risk luminal disease.; D. Antibiotics alone for all luminal disease — Antibiotics are not routine definitive induction for uncomplicated luminal Crohn disease.", "pearl": "", "srcAnswer": "C"}, {"num": 15, "level": "Clinical", "question": "At 3 weeks, direct bilirubin is 1.4 mg/dL and total bilirubin 5 mg/dL. The best interpretation is:", "options": ["Pathological conjugated hyperbilirubinaemia requiring prompt evaluation", "Normal neonatal bilirubin maturation until 3 months", "Physiological jaundice because the direct fraction is under 20%", "Breast-milk jaundice with no further testing"], "answer": 0, "explanation": "Direct bilirubin above 1 mg/dL is abnormal in the guideline; do not insist on a 20% fraction. Why not the others: B. Normal neonatal bilirubin maturation until 3 months — Waiting until 3 months risks delayed diagnosis of biliary atresia.; C. Physiological jaundice because the direct fraction is under 20% — A direct value >=1 mg/dL is abnormal even when its percentage of total is below 20%.; D. Breast-milk jaundice with no further testing — Breast-milk jaundice cannot explain away an elevated direct bilirubin.", "pearl": "", "srcAnswer": "C"}, {"num": 16, "level": "High", "question": "An 8-month-old with acute gastroenteritis has sunken eyes but drinks normally and skin pinch is normal. What is the safest classification method?", "options": ["Use the full IMCI sign cluster rather than one isolated sign", "Use stool frequency as the only severity marker", "Declare severe dehydration from sunken eyes alone", "Declare no dehydration solely from preserved urine"], "answer": 0, "explanation": "IMCI requires at least two signs for some/severe classifications. Why not the others: B. Use stool frequency as the only severity marker — Stool count does not replace clinical assessment.; C. Declare severe dehydration from sunken eyes alone — A single sign is insufficient for severe dehydration.; D. Declare no dehydration solely from preserved urine — Urine alone cannot exclude dehydration.", "pearl": "", "srcAnswer": "B"}, {"num": 17, "level": "Basic", "question": "An infant has diarrhoea, severe eczema and weight loss while on standard formula. Which first priority is appropriate?", "options": ["Assess nutritional status and arrange supervised elimination/formula plan with follow-up", "Ignore faltering growth if stools are frequent", "Assume lactose intolerance is the sole cause", "Prescribe multiple food exclusions without review"], "answer": 0, "explanation": "Faltering growth requires a structured assessment and nutrition-safe management. Why not the others: B. Ignore faltering growth if stools are frequent — Growth failure is an alarm sign.; C. Assume lactose intolerance is the sole cause — Severe eczema and systemic features require broader assessment.; D. Prescribe multiple food exclusions without review — Broad exclusion risks malnutrition.", "pearl": "", "srcAnswer": "C"}, {"num": 18, "level": "High", "question": "A child with suspected Wilson disease has ceruloplasmin 18 mg/dL. Which interpretation is correct?", "options": ["Sufficient by itself for definite Wilson diagnosis", "Supportive but neither diagnostic nor exclusionary alone", "It proves autoimmune hepatitis", "Normal ceruloplasmin excludes Wilson disease"], "answer": 1, "explanation": "Ceruloplasmin is imperfect; combine clinical, urine copper, ocular and genetic evidence. Why not the others: A. Sufficient by itself for definite Wilson diagnosis — Ceruloplasmin alone lacks sufficient specificity for definitive diagnosis.; C. It proves autoimmune hepatitis — A low ceruloplasmin value does not prove autoimmune hepatitis.; D. Normal ceruloplasmin excludes Wilson disease — Normal ceruloplasmin can occur in Wilson disease and cannot exclude it.", "pearl": "", "srcAnswer": "D"}, {"num": 19, "level": "Conceptual", "question": "For a 10-kg child with some dehydration, what is the approximate initial WHO Plan B ORS volume?", "options": ["1500 mL over 4 hours", "750 mL over 4 hours", "1000 mL IV over 1 hour", "500 mL over 4 hours"], "answer": 1, "explanation": "Plan B uses 75 mL/kg × 10 kg = 750 mL over four hours. Why not the others: A. 1500 mL over 4 hours — 150 mL/kg doubles the recommended Plan B estimate.; C. 1000 mL IV over 1 hour — IV Plan C and rapid infusion are not indicated for some dehydration.; D. 500 mL over 4 hours — 50 mL/kg is below the Plan B calculation.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day36',label:'Day 36',set:'Quiz 1',href:'Day36/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day36_QuizSet1_Q1-19_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 36 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–19</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 36 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 36'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 36');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day36:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
