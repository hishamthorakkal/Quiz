<script>
const quiz=[{"num": 75, "level": "Conceptual", "question": "An infant has BA with decompensated cirrhosis despite prior Kasai. Which pathway should be considered?", "options": ["Stop all nutritional support", "Repeat phototherapy as definitive management", "Liver-transplant evaluation", "Treat solely with oral iron"], "answer": 2, "explanation": "Progressive decompensation may require transplantation. Why not the others: A. Stop all nutritional support — Nutritional support is essential in advanced paediatric liver disease.; B. Repeat phototherapy as definitive management — Phototherapy does not treat biliary obstruction or end-stage cirrhosis.; D. Treat solely with oral iron — Oral iron cannot reverse decompensated biliary cirrhosis.", "pearl": "", "srcAnswer": "A"}, {"num": 76, "level": "Conceptual", "question": "An infant vomits during supervised oral rehydration but remains alert and able to drink. What is the best immediate adjustment?", "options": ["Give a full four-hour ORS volume as a rapid bolus", "Pause about 10 minutes and resume ORS more slowly", "Withhold all liquids until the next day", "Stop ORS permanently and start antidiarrhoeal medication"], "answer": 1, "explanation": "Brief pause and slower small sips improve tolerance. Why not the others: A. Give a full four-hour ORS volume as a rapid bolus — Rapid large-volume administration worsens vomiting.; C. Withhold all liquids until the next day — Fluid withholding increases dehydration risk.; D. Stop ORS permanently and start antidiarrhoeal medication — Vomiting alone does not mandate abandoning ORS.", "pearl": "", "srcAnswer": "D"}, {"num": 77, "level": "High", "question": "An infant has watery stool that becomes acidic after a lactose-containing feed and improves on lactose reduction. Which test finding supports carbohydrate malabsorption?", "options": ["High stool fat alone", "Positive stool reducing substances with low stool pH", "High faecal calprotectin alone", "Positive occult blood alone"], "answer": 1, "explanation": "Unabsorbed sugars undergo bacterial fermentation to organic acids. Why not the others: A. High stool fat alone — That points toward lipid malabsorption.; C. High faecal calprotectin alone — This indicates inflammation, not specifically carbohydrate malabsorption.; D. Positive occult blood alone — Blood is not a carbohydrate-specific marker.", "pearl": "", "srcAnswer": "B"}, {"num": 78, "level": "Clinical", "question": "Which complication of chronic cholestasis is related to impaired intestinal absorption?", "options": ["Isolated folate overproduction", "Universal vitamin B12 excess", "Primary vitamin C intoxication", "Fat-soluble vitamin deficiency"], "answer": 3, "explanation": "Reduced bile delivery compromises absorption of vitamins A, D, E and K. Why not the others: A. Isolated folate overproduction — Folate overproduction is not a consequence of impaired bile-mediated fat absorption.; B. Universal vitamin B12 excess — B12 excess is not the characteristic malabsorption problem.; C. Primary vitamin C intoxication — Vitamin C intoxication is unrelated to chronic cholestatic fat malabsorption.", "pearl": "", "srcAnswer": "A"}, {"num": 79, "level": "High", "question": "A child with diarrhoea has normal urine output and oral intake after four hours of Plan B. Which next step follows WHO IMCI?", "options": ["Reassess hydration classification and choose Plan A/B/C accordingly", "Discharge without any feeding or danger-sign advice", "Begin IV antibiotics automatically because Plan B was needed", "Continue 75 mL/kg every four hours regardless of response"], "answer": 0, "explanation": "Plan B includes mandatory reassessment after four hours. Why not the others: B. Discharge without any feeding or danger-sign advice — Counselling is essential before discharge.; C. Begin IV antibiotics automatically because Plan B was needed — Dehydration alone is not an antibiotic indication.; D. Continue 75 mL/kg every four hours regardless of response — Repeated fixed doses without reassessment risk over/under-treatment.", "pearl": "", "srcAnswer": "B"}, {"num": 80, "level": "High", "question": "An adolescent has epigastric pain/fullness after meals without structural disease. Which Rome IV category may fit?", "options": ["Coeliac crisis", "FPIES", "Functional dyspepsia", "Acute severe ulcerative colitis"], "answer": 2, "explanation": "Postprandial distress and epigastric pain syndromes are functional dyspepsia phenotypes. Why not the others: A. Coeliac crisis — No malabsorption or autoimmune evidence is presented.; B. FPIES — FPIES is a food-triggered acute vomiting syndrome.; D. Acute severe ulcerative colitis — No bloody diarrhoea or objective colitis is described.", "pearl": "", "srcAnswer": "D"}, {"num": 81, "level": "Clinical", "question": "Which clinical finding most strongly suggests portal hypertension in a child with chronic liver disease?", "options": ["Splenomegaly with abdominal collaterals", "Normal growth with no stigmata", "A single episode of constipation", "Isolated mildly raised ALT"], "answer": 0, "explanation": "Splenomegaly and portosystemic collaterals indicate elevated portal pressure. Why not the others: B. Normal growth with no stigmata — Normal growth without stigmata is not evidence of elevated portal pressure.; C. A single episode of constipation — Constipation is not a clinical marker of portal hypertension.; D. Isolated mildly raised ALT — Mild ALT elevation reflects hepatocyte injury, not portal pressure.", "pearl": "", "srcAnswer": "A"}, {"num": 82, "level": "Basic", "question": "Which value represents the total osmolarity of standard WHO reduced-osmolarity ORS?", "options": ["180 mOsm/L", "350 mOsm/L", "245 mOsm/L", "311 mOsm/L"], "answer": 2, "explanation": "Reduced-osmolarity WHO ORS totals 245 mOsm/L. Why not the others: A. 180 mOsm/L — 180 mOsm/L is not the specified formula.; B. 350 mOsm/L — 350 mOsm/L is excessively concentrated for WHO ORS.; D. 311 mOsm/L — 311 mOsm/L is the older formula.", "pearl": "", "srcAnswer": "A"}, {"num": 83, "level": "Clinical", "question": "A thriving infant with isolated colic is labelled milk allergic and placed on indefinite avoidance. Which diagnostic principle is most important?", "options": ["Avoid overdiagnosis; confirm clinically relevant symptoms by time-limited elimination and reintroduction", "Continue elimination for life without challenge", "Positive family atopy alone proves allergy", "Use total serum IgE as a definitive test"], "answer": 0, "explanation": "DRACMA emphasizes elimination followed by reintroduction to establish causality. Why not the others: B. Continue elimination for life without challenge — Unconfirmed avoidance has nutritional and social harms.; C. Positive family atopy alone proves allergy — Family history is not diagnostic.; D. Use total serum IgE as a definitive test — Total IgE cannot establish milk allergy.", "pearl": "", "srcAnswer": "D"}, {"num": 84, "level": "Clinical", "question": "Which finding differentiates a compensated from a decompensated chronic liver disease presentation?", "options": ["Isolated stable mild transaminase elevation", "A normal abdominal examination", "Normal coagulation studies", "New ascites or variceal bleeding"], "answer": 3, "explanation": "Ascites and variceal bleeding are decompensating events. Why not the others: A. Isolated stable mild transaminase elevation — Stable transaminase elevation may occur without decompensation.; B. A normal abdominal examination — Normal examination does not distinguish the new complication being asked about.; C. Normal coagulation studies — Normal coagulation does not by itself define decompensation.", "pearl": "", "srcAnswer": "D"}, {"num": 85, "level": "High", "question": "A 4-year-old with acute watery diarrhoea is well, has normal hydration and no blood. Which routine laboratory approach is best?", "options": ["Daily stool culture until symptoms cease", "Immediate blood cultures for every watery episode", "Routine abdominal CT before oral fluids", "No routine stool culture or electrolyte panel unless specific indications arise"], "answer": 3, "explanation": "Uncomplicated cases are usually clinical diagnoses. Why not the others: A. Daily stool culture until symptoms cease — Daily cultures are unnecessary.; B. Immediate blood cultures for every watery episode — Blood cultures require systemic/sepsis indications.; C. Routine abdominal CT before oral fluids — CT is not a routine gastroenteritis test.", "pearl": "", "srcAnswer": "D"}, {"num": 86, "level": "Conceptual", "question": "A child has high tTG-IgA but second-sample EMA-IgA is negative. Which action best respects ESPGHAN 2020?", "options": ["Do not automatically apply no-biopsy diagnosis; investigate discordance", "Use anti-tTG IgG instead without context", "Diagnose coeliac without further evaluation", "Stop all evaluation if symptoms are mild"], "answer": 0, "explanation": "Discordant results warrant review of assay, gluten intake and histology decisions. Why not the others: B. Use anti-tTG IgG instead without context — Switching is not a substitute when total IgA is normal.; C. Diagnose coeliac without further evaluation — The confirmatory EMA criterion is unmet.; D. Stop all evaluation if symptoms are mild — Discordance requires specialist interpretation.", "pearl": "", "srcAnswer": "C"}, {"num": 87, "level": "Conceptual", "question": "After Kasai, fever, recurrent jaundice and pale stools should prompt evaluation for:", "options": ["Intussusception as the default diagnosis", "Ascending cholangitis", "Isolated physiological jaundice", "Simple dietary lactose intolerance"], "answer": 1, "explanation": "Cholangitis is a serious post-Kasai complication needing urgent assessment. Why not the others: A. Intussusception as the default diagnosis — Intussusception does not explain the post-Kasai febrile cholestatic relapse as well as cholangitis.; C. Isolated physiological jaundice — Recurrent conjugated jaundice after surgery is not physiological.; D. Simple dietary lactose intolerance — Lactose intolerance does not cause febrile cholestasis.", "pearl": "", "srcAnswer": "B"}, {"num": 88, "level": "High", "question": "A 5-week-old has progressive nonbilious projectile vomiting, persistent hunger and weight loss. Which diagnosis is most likely?", "options": ["Hypertrophic pyloric stenosis", "Malrotation with midgut volvulus", "Shigella dysentery", "Acute rotavirus enteritis"], "answer": 0, "explanation": "Typical age, projectile nonbilious vomiting and hunger favor pyloric stenosis. Why not the others: B. Malrotation with midgut volvulus — Volvulus often causes bilious vomiting.; C. Shigella dysentery — Shigella causes inflammatory stools rather than isolated vomiting.; D. Acute rotavirus enteritis — Rotavirus generally causes watery diarrhoea with vomiting.", "pearl": "", "srcAnswer": "A"}, {"num": 89, "level": "Integrated", "question": "Which colonoscopic pattern is most characteristic of typical ulcerative colitis?", "options": ["Normal rectum with isolated jejunal disease", "Skip lesions with deep ileal ulcers", "Continuous mucosal inflammation extending proximally from rectum", "Isolated perianal fistulae"], "answer": 2, "explanation": "Typical UC has continuous rectal-to-proximal colitis. Why not the others: A. Normal rectum with isolated jejunal disease — This is not typical UC.; B. Skip lesions with deep ileal ulcers — These favour Crohn disease.; D. Isolated perianal fistulae — Fistulae are more typical of Crohn disease.", "pearl": "", "srcAnswer": "A"}, {"num": 90, "level": "High", "question": "An adolescent with ALF has Coombs-negative haemolysis and disproportionate bilirubin elevation. Which inherited disorder is important?", "options": ["Classic isolated Gilbert syndrome", "G6PD trait as the sole cause without evaluation", "Lactase deficiency", "Wilson disease"], "answer": 3, "explanation": "Fulminant Wilson disease may present with Coombs-negative haemolysis. Why not the others: A. Classic isolated Gilbert syndrome — Gilbert syndrome does not cause acute liver failure with haemolysis.; B. G6PD trait as the sole cause without evaluation — G6PD status alone does not account for the entire liver-failure phenotype.; C. Lactase deficiency — Lactase deficiency is intestinal and does not explain this hepatic/haemolytic pattern.", "pearl": "", "srcAnswer": "C"}, {"num": 91, "level": "Conceptual", "question": "A breastfed 5-month-old has mild watery diarrhoea without dehydration. What feeding advice is appropriate?", "options": ["Continue breastfeeding frequently", "Replace breast milk with fruit juice", "Start a low-protein fasting regimen", "Stop breastfeeding until stools normalize"], "answer": 0, "explanation": "Continue breastfeeding throughout diarrhoea. Why not the others: B. Replace breast milk with fruit juice — Juice is not nutritionally or osmotically equivalent.; C. Start a low-protein fasting regimen — Fasting worsens nutritional recovery.; D. Stop breastfeeding until stools normalize — Stopping feeds risks dehydration and malnutrition.", "pearl": "", "srcAnswer": "C"}, {"num": 92, "level": "Clinical", "question": "An asymptomatic sibling of a child with coeliac disease has tTG-IgA ≥10× ULN, normal total IgA and second-sample EMA positivity. Under ESPGHAN 2020, which statement is correct?", "options": ["Symptoms are not obligatory for the no-biopsy diagnostic pathway", "Abdominal pain is mandatory", "No-biopsy diagnosis is forbidden in asymptomatic children", "HLA-DQ2 is mandatory"], "answer": 0, "explanation": "ESPGHAN 2020 permits a no-biopsy pathway independent of symptom status. Why not the others: B. Abdominal pain is mandatory — ESPGHAN 2020 removed mandatory symptoms.; C. No-biopsy diagnosis is forbidden in asymptomatic children — ESPGHAN 2020 allows it when criteria are met.; D. HLA-DQ2 is mandatory — HLA is not obligatory for this pathway.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day36',label:'Day 36',set:'Quiz 5',href:'Day36/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day36_QuizSet5_Q75-92_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 36 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 75–92</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 36 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 36'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 36');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day36:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
