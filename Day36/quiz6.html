<script>
const quiz=[{"num": 93, "level": "Clinical", "question": "A child with portal hypertension presents with haematemesis and shock. Which action is first?", "options": ["Schedule elective outpatient endoscopy in 4 weeks", "Start unrestricted oral fluids only", "Immediate resuscitation and urgent specialist management of variceal bleeding", "Give prophylactic iron and discharge"], "answer": 2, "explanation": "Bleeding varices are a life-threatening emergency; stabilisation precedes definitive endoscopic therapy. Why not the others: A. Schedule elective outpatient endoscopy in 4 weeks — Variceal haemorrhage requires urgent resuscitation and specialist haemostasis.; B. Start unrestricted oral fluids only — Oral fluid alone is unsafe with active major upper-GI bleeding and shock.; D. Give prophylactic iron and discharge — Iron replacement cannot stabilise haemorrhagic shock.", "pearl": "", "srcAnswer": "C"}, {"num": 94, "level": "Clinical", "question": "A question explicitly cites the WHO 2024/2025 global diarrhoea guideline for children up to 10 years. Which zinc dose is conditionally suggested?", "options": ["20 mg orally daily for 14 days", "5 mg orally daily for up to 14 days", "No zinc at all for persistent diarrhoea", "10 mg orally daily for 14 days"], "answer": 1, "explanation": "WHO 2024 update conditionally suggests 5 mg/day up to 14 days (low certainty). Why not the others: A. 20 mg orally daily for 14 days — 20 mg is older WHO/Indian programme guidance.; C. No zinc at all for persistent diarrhoea — WHO recommends adjunctive zinc for persistent diarrhoea.; D. 10 mg orally daily for 14 days — 10 mg is the older infant dose, not the new global suggestion.", "pearl": "", "srcAnswer": "C"}, {"num": 95, "level": "Clinical", "question": "A child with established coeliac disease continues to have diarrhoea despite a reported gluten-free diet. Best first reassessment?", "options": ["Review inadvertent gluten exposure, adherence, growth and alternative causes", "Assume refractory coeliac disease immediately", "Exclude disease because symptoms persist", "Give prolonged empirical corticosteroids"], "answer": 0, "explanation": "Re-evaluate diagnosis and dietary exposure before rare refractory labels. Why not the others: B. Assume refractory coeliac disease immediately — True refractory disease is uncommon in children.; C. Exclude disease because symptoms persist — Symptoms can persist from exposure or comorbidity.; D. Give prolonged empirical corticosteroids — Steroids are not routine first-line for persistent symptoms.", "pearl": "", "srcAnswer": "B"}, {"num": 96, "level": "High", "question": "A child with acute liver failure develops renal dysfunction. Which statement is safest?", "options": ["Creatinine is irrelevant to ALF severity", "Renal impairment excludes hepatic encephalopathy", "All children should receive unrestricted fluid boluses", "Renal injury can complicate PALF and requires close fluid/electrolyte monitoring"], "answer": 3, "explanation": "PALF can involve multi-organ failure; management must be individualised. Why not the others: A. Creatinine is irrelevant to ALF severity — Creatinine and urine output are central to assessing multi-organ dysfunction.; B. Renal impairment excludes hepatic encephalopathy — Renal dysfunction can coexist with encephalopathy.; C. All children should receive unrestricted fluid boluses — Unrestricted boluses may worsen fluid overload and cerebral oedema.", "pearl": "", "srcAnswer": "C"}, {"num": 97, "level": "Clinical", "question": "Which statement accurately reconciles zinc recommendations in an Indian 2026 examination?", "options": ["All guidelines now mandate 5 mg without exceptions", "WHO 2024 recommends 20 mg for all children aged 0–10 years", "India NHM discontinued zinc after WHO 2024", "State the guideline and date: NHM 10/20 mg versus WHO 2024 conditional 5 mg"], "answer": 3, "explanation": "Explicit guideline provenance prevents conflicting answer keys. Why not the others: A. All guidelines now mandate 5 mg without exceptions — The new WHO dose is conditional and India retains its programme schedule.; B. WHO 2024 recommends 20 mg for all children aged 0–10 years — WHO 2024 does not use universal 20 mg.; C. India NHM discontinued zinc after WHO 2024 — NHM continues distributing and recommending zinc.", "pearl": "", "srcAnswer": "D"}, {"num": 98, "level": "High", "question": "A child with suspected Crohn has a normal colonoscopy but growth failure and persistent inflammatory markers. Which next investigation may identify proximal small-bowel disease?", "options": ["Repeat stool occult blood only", "Chest radiograph", "MR enterography or other appropriate small-bowel imaging", "Electrocardiography"], "answer": 2, "explanation": "Porto criteria recommend small-bowel evaluation, especially when Crohn is suspected. Why not the others: A. Repeat stool occult blood only — It does not image small bowel.; B. Chest radiograph — It does not assess bowel inflammation.; D. Electrocardiography — It does not investigate small-bowel Crohn disease.", "pearl": "", "srcAnswer": "C"}, {"num": 99, "level": "Clinical", "question": "A neonate has hyperammonaemia, low citrulline and high urinary orotic acid. Which urea-cycle defect is suggested?", "options": ["Arginase deficiency", "Ornithine transcarbamylase deficiency", "NAGS deficiency", "CPS1 deficiency"], "answer": 1, "explanation": "OTC deficiency diverts excess carbamoyl phosphate to pyrimidine/orotic acid. Why not the others: A. Arginase deficiency — Arginase deficiency typically causes hyperargininaemia and later neurological features.; C. NAGS deficiency — NAGS deficiency similarly does not characteristically raise urinary orotic acid.; D. CPS1 deficiency — CPS1 deficiency generally has low/normal urinary orotic acid rather than high.", "pearl": "", "srcAnswer": "A"}, {"num": 100, "level": "Conceptual", "question": "A child has severe diarrhoea and weight loss after extensive small-bowel resection. Which condition is most likely?", "options": ["Functional IBS alone", "Primary milk allergy by definition", "Simple isolated lactose intolerance", "Short bowel syndrome with reduced absorptive surface"], "answer": 3, "explanation": "Loss of intestinal length reduces nutrient, fluid and electrolyte absorption. Why not the others: A. Functional IBS alone — Anatomic loss explains nutrient and fluid malabsorption.; B. Primary milk allergy by definition — Resection does not establish immune allergy.; C. Simple isolated lactose intolerance — Extensive resection causes broader deficits.", "pearl": "", "srcAnswer": "D"}, {"num": 101, "level": "", "question": "An angiogram shows a PDA narrowing at its pulmonary end and widening toward the aorta (a cone). Which Krichenko type is this?", "options": ["Type C tubular", "Type A conical", "Type E elongated", "Type B window"], "answer": 1, "explanation": "Conical PDA is Krichenko type A; type C is tubular. Why not the others (added — not from source): A. Type C tubular — Type C is tubular, a duct without constriction; a cone narrowing at the pulmonary end is type A.; C. Type E elongated — Type E is elongated with a constriction remote from the trachea edge, not a simple cone.; D. Type B window — Type B is a short window-like duct with aortic-end narrowing, not a conical duct.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 17 Q44 — Krichenko PDA classification"}}, {"num": 102, "level": "", "question": "A neonate develops cataracts after milk feeds but has no sepsis, hepatic failure or coagulopathy. Which defect most directly fits isolated galactosaemia-related cataracts?", "options": ["ALDOB deficiency (hereditary fructose intolerance)", "ATP7B deficiency", "Galactokinase (GALK1) deficiency", "GALT deficiency (classic galactosaemia)"], "answer": 2, "explanation": "GALK1 deficiency causes galactitol accumulation and early cataracts; GALT deficiency often produces systemic hepatic/septic illness. Why not the others (added — not from source): A. ALDOB deficiency (hereditary fructose intolerance) — ALDOB deficiency (hereditary fructose intolerance) presents after fructose or sucrose exposure with hypoglycaemia and liver dysfunction, not milk-related cataracts.; B. ATP7B deficiency — ATP7B deficiency is Wilson disease, presenting later in childhood with liver or neuropsychiatric disease, not neonatal cataracts.; D. GALT deficiency (classic galactosaemia) — Classic GALT deficiency causes cataracts but with hepatic failure, coagulopathy and E. coli sepsis; their absence favours galactokinase deficiency.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase versus GALT versus hereditary fructose intolerance"}}, {"num": 103, "level": "", "question": "A local inpatient complicated-SAM protocol prescribes F-75 at 130 mL/kg/day for a 7-kg child without severe oedema. What is the prescribed total per day?", "options": ["910 mL", "1,300 mL", "700 mL", "1,820 mL"], "answer": 0, "explanation": "130 × 7 = 910 mL/day; severe oedema and local protocols may change prescribed volumes. Why not the others (added — not from source): B. 1,300 mL — 1,300 mL comes from multiplying 130 by 10 kg instead of 7 kg.; C. 700 mL — 700 mL corresponds to 100 mL/kg/day, not the prescribed 130 mL/kg/day.; D. 1,820 mL — 1,820 mL is double the correct product (130 x 7 x 2), a doubling error.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 daily feed volume"}}, {"num": 104, "level": "", "question": "A child has microcephaly, seizures, severe growth restriction and a Greek-warrior helmet facial appearance. Which genetic lesion is most likely?", "options": ["22q11.2 deletion", "7q11.23 deletion", "4p deletion (Wolf–Hirschhorn)", "5p deletion (cri-du-chat)"], "answer": 2, "explanation": "Wolf–Hirschhorn is due to 4p deletion and the characteristic Greek-warrior helmet phenotype. Why not the others (added — not from source): A. 22q11.2 deletion — 22q11.2 deletion causes conotruncal heart disease, hypocalcaemia and thymic hypoplasia, not Greek-warrior helmet facies.; B. 7q11.23 deletion — 7q11.23 deletion (Williams) causes elfin facies, supravalvar aortic stenosis and hypercalcaemia.; D. 5p deletion (cri-du-chat) — Cri-du-chat (5p deletion) causes a high-pitched cat-like cry and microcephaly but not the Greek-warrior helmet facies.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q31 — Wolf–Hirschhorn syndrome — 4p deletion / Greek-warrior helmet"}}, {"num": 105, "level": "", "question": "A term infant remains hypoglycaemic at 60 hours with low ketones and a concerning critical sample. Under the PES approach, which statement is best?", "options": ["An undetectable insulin value excludes hyperinsulinism", "Wait until 72 hours because PES never evaluates earlier", "Persistent hypoglycaemia evaluation is appropriate after 48 hours when indicated", "All hypoglycaemia in the first week is physiological"], "answer": 2, "explanation": "PES considers persistent hypoglycaemia after 48 h; the CPS transitional window is defined differently (<72 h). Why not the others (added — not from source): A. An undetectable insulin value excludes hyperinsulinism — Insulin may be undetectable in hyperinsulinism; suppressed ketones and FFA with a glucagon response indicate insulin action.; B. Wait until 72 hours because PES never evaluates earlier — PES allows evaluation after 48 hours when hypoglycaemia persists; insisting on 72 hours misapplies the transitional window.; D. All hypoglycaemia in the first week is physiological — Hypoglycaemia persisting beyond 48 hours with low ketones is not physiological and needs evaluation.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}, {"num": 106, "level": "", "question": "At 36 weeks PMA, a preterm infant needs 3 L/min nasal cannula support. Which Jensen BPD grade best fits?", "options": ["Grade 3", "Grade 1", "Grade 2", "No BPD"], "answer": 2, "explanation": "Jensen grade 2 includes nasal cannula >2 L/min or noninvasive positive-pressure support; grade 3 requires invasive ventilation. Why not the others (added — not from source): A. Grade 3 — Grade 3 requires invasive mechanical ventilation; nasal cannula is non-invasive support.; B. Grade 1 — Jensen grade 1 is nasal cannula at or below 2 L/min; 3 L/min exceeds this.; D. No BPD — Any qualifying respiratory support at 36 weeks PMA defines BPD; 3 L/min cannula is not no BPD.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R3", "from": "Day 5 Q53 — Jensen BPD grade"}}, {"num": 107, "level": "", "question": "A neonate born at 24 weeks GA is being scheduled using the explicitly named AAP 2018 ROP screening table. At what PMA is the first exam scheduled?", "options": ["24 weeks PMA", "36 weeks PMA", "40 weeks PMA", "31 weeks PMA"], "answer": 3, "explanation": "AAP 2018: for GA 24 weeks, first ROP examination at 31 weeks PMA (7 weeks chronological age). Indian timing may differ. Why not the others (added — not from source): A. 24 weeks PMA — 24 weeks PMA is the age at birth; the first exam is deferred because treatable ROP does not develop that early.; B. 36 weeks PMA — 36 weeks PMA is far too late for a 24-week infant and risks missing treatment-requiring ROP.; C. 40 weeks PMA — 40 weeks PMA is term-equivalent age and would miss the window for timely treatment.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 11 Q55 — ROP screening timing"}}, {"num": 108, "level": "", "question": "An infusion of D12.5 at 90 mL/kg/day delivers approximately what GIR? Use GIR = dextrose% × mL/kg/day ÷ 144.", "options": ["7.8 mg/kg/min", "12.5 mg/kg/min", "10.4 mg/kg/min", "5.2 mg/kg/min"], "answer": 0, "explanation": "12.5 × 90 / 144 = 7.8125 mg/kg/min. Why not the others (added — not from source): B. 12.5 mg/kg/min — 12.5 simply restates the dextrose percentage instead of calculating the GIR.; C. 10.4 mg/kg/min — 10.4 is what 12.5 x 120 / 144 gives, i.e. using 120 instead of 90 mL/kg/day.; D. 5.2 mg/kg/min — 5.2 is what 12.5 x 60 / 144 gives, i.e. using 60 instead of 90 mL/kg/day.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R3", "from": "Day 10 Q47 — GIR to dextrose concentration"}}, {"num": 109, "level": "", "question": "During documented hypoglycaemia, ketones and free fatty acids are suppressed and plasma glucose rises 38 mg/dL after glucagon. Which physiology is most supported?", "options": ["Ketotic fasting hypoglycaemia", "Isolated renal glucosuria", "Classic fatty-acid oxidation disorder with elevated FFA", "Excess insulin action, even if insulin is not measurable"], "answer": 3, "explanation": "Suppressed ketones/FFA plus glucagon rise >=30 mg/dL supports hyperinsulinism physiology. Why not the others (added — not from source): A. Ketotic fasting hypoglycaemia — Ketotic hypoglycaemia shows high ketones and a poor glucagon response, the opposite of these findings.; B. Isolated renal glucosuria — Renal glucosuria does not cause hypoglycaemia with suppressed ketones and a brisk glucagon response.; C. Classic fatty-acid oxidation disorder with elevated FFA — Fatty-acid oxidation defects show elevated FFA with low ketones; here FFA are suppressed.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R3", "from": "Day 10 Q50 — Hyperinsulinism — glucagon response"}}, {"num": 110, "level": "", "question": "A cyanotic neonate with infracardiac TAPVC has pulmonary venous obstruction, severe pulmonary oedema and deteriorating oxygenation. What is definitive management?", "options": ["Urgent surgery to relieve obstruction and repair anomalous return", "PDA closure alone", "Discharge with oral iron", "Elective follow-up after six months"], "answer": 0, "explanation": "Obstructed TAPVC is a neonatal surgical emergency; stabilization must not delay urgent repair. Why not the others (added — not from source): B. PDA closure alone — The duct is not the problem; obstructed pulmonary venous return needs surgical repair.; C. Discharge with oral iron — Oral iron is irrelevant to an obstructed TAPVC surgical emergency.; D. Elective follow-up after six months — Obstructed TAPVC causes progressive pulmonary oedema and death within hours to days; elective follow-up is lethal.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 19 Q11 — obstructed infracardiac TAPVC"}}];
const NB_CTX={srcId:'Day36',label:'Day 36',set:'Quiz 6',href:'Day36/quiz6.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day36_QuizSet6_Q93-110_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 36 Quiz 6 — Wrong Answer Report</h1><p><b>Questions:</b> 93–110</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 36 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 36'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 36');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day36:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['6']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['6']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 6 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
