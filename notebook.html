<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=2"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2"><meta name="theme-color" content="#1e3a8a">
<title>Error Notebook — NEET-SS + ICP Paediatrics</title>
<style>
:root{--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.5}
.wrap{max-width:900px;margin:auto;padding:24px 14px 48px}h1{margin:0 0 6px;font-size:26px}.sub{color:var(--muted);margin:0 0 16px}
.back{display:inline-block;background:#e2e8f0;color:#1e293b;border-radius:10px;padding:9px 14px;font-weight:700;text-decoration:none;margin-bottom:14px}
.src{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.src button{border:1.5px solid #cbd5e1;background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:14px}
.src button.on{background:#2563eb;border-color:#2563eb;color:#fff}
</style></head>
<body><div class="wrap">
<a class="back" href="index.html">← Home</a>
<h1>📒 Error Notebook</h1>
<p class="sub">Every wrong answer from daily quiz sets, the Day 1–5 mock and grand mocks is saved here automatically. Tag each one K/C/R/G/S, add a correction rule, and retest after 48–72 hours. Saved in this browser only.</p>
<div class="src" id="src"></div>
<div id="nb"></div>
</div>
<script src="assets/notebook.js"></script>
<script>
// Source switcher (All / Day 5 / Day 6 / mocks…) built from what is actually in the notebook.
let cur = '';
function draw() {
  const all = Notebook.list({}), srcs = [...new Map(all.map(e => [e.srcId, e.src])).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, { numeric: true }));
  document.getElementById('src').innerHTML = [['', 'All (' + all.length + ')'], ...srcs.map(([id, l]) => [id, l + ' (' + all.filter(e => e.srcId === id).length + ')'])]
    .map(([id, l]) => `<button type="button" data-src="${id}" class="${cur === id ? 'on' : ''}">${l}</button>`).join('');
  const box = document.getElementById('nb'), fresh = box.cloneNode(false); box.replaceWith(fresh); // drop old listeners
  Notebook.page(fresh, cur ? { srcId: cur } : {}, '');
}
document.getElementById('src').addEventListener('click', e => { const b = e.target.closest('[data-src]'); if (b) { cur = b.dataset.src; draw(); } });
window.addEventListener('storage', e => { if (e.key === 'neetss:notebook:v1') draw(); });
draw();
</script></body></html>
