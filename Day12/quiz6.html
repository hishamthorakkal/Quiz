const quiz=[{"num": 91, "level": "High-Difficulty", "question": "A 3-day-old has ammonia 650 µmol/L, low citrulline and normal urinary orotic acid, no ketosis or acidosis. Which diagnosis is favored over OTC deficiency?", "options": ["Carbamoyl phosphate synthetase 1 deficiency", "Argininosuccinate synthetase deficiency", "OTC deficiency", "Methylmalonic acidemia"], "answer": 0, "explanation": "CPS1 deficiency prevents carbamoyl phosphate generation and lacks orotic overflow. Closest distractor: Low citrulline is shared by OTC and CPS1; orotic acid separates them. Why not the others: B. Argininosuccinate synthetase deficiency — Citrulline should be high.; C. OTC deficiency — Orotic acid is usually elevated due to carbamoyl phosphate diversion.; D. Methylmalonic acidemia — Metabolic acidosis/ketosis is often present.", "pearl": "Do not diagnose OTC from hyperammonemia alone.", "srcAnswer": "A"}, {"num": 92, "level": "High-Difficulty", "question": "A 1.2-kg infant on D12.5 at 120 mL/kg/day has glucose 245 mg/dL and rising osmotic diuresis. What GIR is being delivered, and what does it imply?", "options": ["Approximately 6.0 mg/kg/min; unchanged standard delivery", "Approximately 1.0 mg/kg/min; severe glucose deficiency", "Approximately 15 mg/kg/min; immediate insulin is mandatory", "Approximately 10.4 mg/kg/min; review excessive carbohydrate delivery before reflex insulin"], "answer": 3, "explanation": "GIR = 12.5×120/144 = 10.42 mg/kg/min; excessive delivery may contribute to hyperglycemia. Calculation check: formula uses % dextrose and mL/kg/day; substitution and mg/kg/min (or %) appear in Core reasoning. Trap: never substitute 0.10 for 10% in the GIR formula. Closest distractor: Calculate GIR before attributing every high glucose to infection. Why not the others: A. Approximately 6.0 mg/kg/min; unchanged standard delivery — 12.5×120/144 is >10.; B. Approximately 1.0 mg/kg/min; severe glucose deficiency — Dextrose % must not be treated as fraction in GIR equation.; C. Approximately 15 mg/kg/min; immediate insulin is mandatory — Arithmetic is incorrect and insulin is not automatically first-line.", "pearl": "Correct substrate calculation guides safe PN adjustment.", "srcAnswer": "D"}, {"num": 93, "level": "High-Difficulty", "question": "A 34-week infant with meconium aspiration has OI 28 and echo-confirmed PPHN. After surfactant/recruitment, SpO₂ improves but systemic BP falls and ductal right-to-left flow increases. Which next step is most physiologic?", "options": ["Close ductus with ibuprofen immediately", "Stop ventilation because oxygenation improved briefly", "Reassess preload, ventricular function and systemic perfusion, then titrate support to restore systemic pressure", "Increase iNO alone while ignoring systemic hypotension"], "answer": 2, "explanation": "Systemic hypotension can increase right-to-left shunting despite improved lung aeration. Closest distractor: Separate pulmonary recruitment from systemic hemodynamic support. Why not the others: A. Close ductus with ibuprofen immediately — A high-PVR ductus may be a systemic decompression route.; B. Stop ventilation because oxygenation improved briefly — Lung recruitment remains necessary.; D. Increase iNO alone while ignoring systemic hypotension — Falling SVR can worsen right-to-left shunting.", "pearl": "PPHN is a coupled lung-heart-circulation disorder.", "srcAnswer": "C"}, {"num": 94, "level": "High-Difficulty", "question": "A cooled infant has severe suppression on aEEG but the raw trace shows repetitive high-amplitude spikes during nursing repositioning without rhythmic evolution. Which interpretation avoids an EEG trap? [Interpret Visual Station 1 alongside the clinical data.]", "options": ["Increase phenobarbital solely because aEEG amplitude rose", "Call every high-amplitude spike a seizure", "Discontinue EEG because artifact makes monitoring useless", "Review raw EEG, electrode impedance and video before labeling seizure burden"], "answer": 3, "explanation": "Artifact recognition requires morphology, evolution and clinical/video correlation. Closest distractor: Evolving ictal rhythm versus abrupt handling-associated artifact. Why not the others: A. Increase phenobarbital solely because aEEG amplitude rose — Compressed amplitude trends can be misleading.; B. Call every high-amplitude spike a seizure — Movement/electrode artifacts can create spikes without evolution.; C. Discontinue EEG because artifact makes monitoring useless — Correcting electrodes can restore interpretability.", "pearl": "False seizures cause unnecessary drug exposure and mask true encephalopathy.", "srcAnswer": "D"}, {"num": 95, "level": "High-Difficulty", "question": "A 28-week infant tolerates feeds but has falling serum phosphate, rising alkaline phosphatase and poor linear growth after prolonged PN. Which integrated explanation is most likely?", "options": ["Insufficient calcium/phosphate mineral delivery with metabolic bone disease risk", "Pure isolated iron deficiency", "Physiologic transient jaundice", "Adequate minerals with only a measurement artifact"], "answer": 0, "explanation": "Premature mineral accretion is high; prolonged PN can leave Ca/P deficits. Closest distractor: Growth faltering plus phosphate/ALP abnormalities versus calorie deficit alone. Why not the others: B. Pure isolated iron deficiency — Iron deficiency does not explain phosphate depletion and ALP rise.; C. Physiologic transient jaundice — This does not cause hypophosphatemia or bone marker changes.; D. Adequate minerals with only a measurement artifact — Consistent trends and growth impairment argue against this.", "pearl": "Mineral monitoring is distinct from energy/protein monitoring.", "srcAnswer": "A"}, {"num": 96, "level": "High-Difficulty", "question": "A preterm infant’s sodium falls from 164 to 146 mmol/L over 12 hours after hypotonic fluid; new seizures develop. Which mechanism is most concerning?", "options": ["Normal physiological postnatal natriuresis", "Persistent hypernatremia as the sole cause despite rapid correction", "Too-rapid fall in serum sodium causing cerebral edema", "Primary isolated hypocalcemia without any data"], "answer": 2, "explanation": "Correction rate was 18/12 = 1.5 mmol/L/h, well above common safe targets. Calculation check: ΔNa/time = (164−146) mmol/L ÷12 h = 1.5 mmol/L/h. Trap: assess rate, not just the final sodium. Closest distractor: Corrected value may look normal while rate of change is harmful. Why not the others: A. Normal physiological postnatal natriuresis — An 18 mmol/L drop in 12 h is excessive.; B. Persistent hypernatremia as the sole cause despite rapid correction — The large fall itself is dangerous.; D. Primary isolated hypocalcemia without any data — Sodium trajectory supplies the key clue.", "pearl": "Serial sodium trend is more informative than final sodium alone.", "srcAnswer": "C"}, {"num": 97, "level": "High-Difficulty", "question": "A 40-week infant after HIE has severe hypotension and reduced LV function while undergoing cooling. Which adjustment is most rational?", "options": ["Increase cooling depth to 30°C to improve contractility", "Use echo-guided circulatory support and avoid reflex repeated large boluses that could worsen myocardial dysfunction", "Give repeated 20 mL/kg boluses until BP normalizes", "Stop all fluids irrespective of perfusion"], "answer": 1, "explanation": "HIE often coexists with myocardial dysfunction and requires phenotype-specific support. Closest distractor: Low BP from myocardial dysfunction versus true hypovolemia. Why not the others: A. Increase cooling depth to 30°C to improve contractility — Excessive hypothermia worsens hemodynamics.; C. Give repeated 20 mL/kg boluses until BP normalizes — Myocardial dysfunction may not be fluid responsive.; D. Stop all fluids irrespective of perfusion — Maintenance and perfusion require individualization.", "pearl": "Treat the circulation while maintaining neuroprotective temperature targets.", "srcAnswer": "B"}, {"num": 98, "level": "High-Difficulty", "question": "A 25-week infant has severe IVH and a large PDA; clinicians propose early PDA closure solely to prevent further IVH. Which evidence statement is safest?", "options": ["Treat hsPDA based on current clinical/echo impact; routine closure solely as IVH prevention is unproven", "The ductus cannot alter cerebral hemodynamics", "All COX inhibitors improve neurodevelopment when given prophylactically", "Any PDA proves the cause of IVH"], "answer": 0, "explanation": "PDA is a hemodynamic modifier, not a universal IVH treatment target. Closest distractor: Association with IVH is not proof that routine closure prevents injury. Why not the others: B. The ductus cannot alter cerebral hemodynamics — Shunts may influence systemic perfusion but causality is complex.; C. All COX inhibitors improve neurodevelopment when given prophylactically — Severe-IVH reduction has not translated consistently into disability-free survival.; D. Any PDA proves the cause of IVH — IVH is multifactorial.", "pearl": "The examiner tests causal inference versus correlation.", "srcAnswer": "A"}, {"num": 99, "level": "High-Difficulty", "question": "A 26-week infant has no severe IVH on day-5 cUS, but at 5 weeks develops bilateral periventricular cysts. Which interpretation is best?", "options": ["Grade III IVH must have been missed", "Evolving cystic PVL; early ultrasound could not exclude delayed white-matter injury", "This is normal germinal matrix involution", "A normal day-5 scan proves imaging artifact now"], "answer": 1, "explanation": "PVL may become cystic several weeks after the insult. Closest distractor: Timing and tissue compartment separate PVL from IVH. Why not the others: A. Grade III IVH must have been missed — No ventricular blood/distension is described.; C. This is normal germinal matrix involution — Bilateral periventricular cysts in this context are concerning.; D. A normal day-5 scan proves imaging artifact now — Cystic injury can evolve later.", "pearl": "Serial cranial imaging detects lesions missed in the first week.", "srcAnswer": "B"}, {"num": 100, "level": "High-Difficulty", "question": "A 27-week infant receives three 15 mL/kg rapid saline boluses for MAP 25 mmHg. Lactate is 1.8, capillary refill 2 s and urine output 2 mL/kg/h; cranial US shows new IVH. What is the best critical appraisal?", "options": ["Assume new IVH proves sepsis", "Give immediate diuretic to reverse IVH", "Continue boluses until MAP >35 regardless of perfusion", "Blood-pressure number alone did not establish poor perfusion; avoid further rapid boluses and reassess hemodynamics"], "answer": 3, "explanation": "Perfusion indicators were reassuring despite low measured MAP. Closest distractor: Hypotension as association versus proof of volume-responsive shock. Why not the others: A. Assume new IVH proves sepsis — IVH is multifactorial and cannot diagnose infection.; B. Give immediate diuretic to reverse IVH — Diuresis does not treat intracranial hemorrhage.; C. Continue boluses until MAP >35 regardless of perfusion — Fixed pressure chasing may destabilize cerebral flow.", "pearl": "Fragile cerebral autoregulation makes unnecessary rapid volume loading hazardous.", "srcAnswer": "D"}, {"num": 101, "level": "High-Difficulty", "question": "A 5-day-old with persistent hypoglycemia has BOHB 0.2 mmol/L, FFA 2.8 mmol/L and raised C8 acylcarnitine during illness. Which differential outranks hyperinsulinism?", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Congenital hyperinsulinism", "Isolated galactosemia", "Physiologic transitional hypoglycemia"], "answer": 0, "explanation": "High FFA with low ketones and C8 elevation favors MCAD deficiency. Closest distractor: Low ketones are shared; FFA direction and acylcarnitines distinguish. Why not the others: B. Congenital hyperinsulinism — Insulin should suppress FFA, not leave it elevated.; C. Isolated galactosemia — C8 acylcarnitine elevation points to fatty-acid oxidation.; D. Physiologic transitional hypoglycemia — Day 5 and abnormal acylcarnitines argue against simple transition.", "pearl": "Avoid fasting and provide IV glucose during catabolic illness.", "srcAnswer": "A"}, {"num": 102, "level": "High-Difficulty", "question": "A 30-week infant is fed donor milk with fortifier but develops repeated desaturations during feeds and mild abdominal distension; abdominal film has no pneumatosis. Which next assessment is most informative?", "options": ["Proceed to surgery because donor milk can cause perforation", "Remove fortifier permanently without assessment", "Assume NEC is proven by desaturation during feeds", "Evaluate feed administration, reflux/aspiration risk, cardiorespiratory stability and serial abdominal signs"], "answer": 3, "explanation": "Feeding-associated respiratory events have several mechanisms besides NEC. Closest distractor: Desaturation plus distension is not synonymous with pneumatosis. Why not the others: A. Proceed to surgery because donor milk can cause perforation — No surgical signs are present.; B. Remove fortifier permanently without assessment — Fortifier is not necessarily the cause.; C. Assume NEC is proven by desaturation during feeds — No diagnostic imaging or systemic NEC features are given.", "pearl": "A differential approach avoids both missed aspiration and unnecessary NEC treatment.", "srcAnswer": "D"}, {"num": 103, "level": "High-Difficulty", "question": "A 38-week infant has no visible seizures after phenobarbital but EEG continues to show recurrent evolving discharges. What is the most appropriate measure of response?", "options": ["Stop monitoring to avoid unnecessary alarms", "Attribute all EEG evolution to sedation", "Continue EEG-guided seizure management because electroclinical dissociation is present", "Declare complete seizure control because motor activity stopped"], "answer": 2, "explanation": "Antiseizure medication may uncouple motor manifestations from cortical ictal activity. Closest distractor: Electroclinical dissociation requires EEG-based response assessment. Why not the others: A. Stop monitoring to avoid unnecessary alarms — Continued seizures may be clinically silent.; B. Attribute all EEG evolution to sedation — True ictal evolution is not automatically an anesthetic artifact.; D. Declare complete seizure control because motor activity stopped — Clinical cessation can occur without electrographic control.", "pearl": "The exam asks for the monitored endpoint, not just a drug choice.", "srcAnswer": "C"}, {"num": 104, "level": "High-Difficulty", "question": "A 26-week infant has persistent hsPDA after one ibuprofen course, but ventilator requirement is improving and systemic diastolic flow reversal has resolved. What is the best next step?", "options": ["Reassess whether the PDA remains clinically significant before another course or closure", "Automatically repeat ibuprofen until echo shows zero ductal flow", "Increase fluids to maintain ductal patency", "Ligation is mandatory after one failed course"], "answer": 0, "explanation": "Clinical improvement can change the risk–benefit balance even with residual patency. Closest distractor: Failure to close anatomically is not necessarily treatment failure clinically. Why not the others: B. Automatically repeat ibuprofen until echo shows zero ductal flow — Treatment risks accumulate and significance may have changed.; C. Increase fluids to maintain ductal patency — This can worsen pulmonary overcirculation.; D. Ligation is mandatory after one failed course — Invasive closure is individualized.", "pearl": "Serial phenotype reassessment prevents overtreatment.", "srcAnswer": "A"}, {"num": 105, "level": "High-Difficulty", "question": "A 38-week infant with hypoxemia and clear lungs has equal pre/postductal saturations of 84%, prominent right ventricular hypertrophy and right-to-left atrial shunt on echo. What inference is safest?", "options": ["PPHN is excluded by equal saturations", "PPHN remains possible; absence of differential saturation does not exclude atrial-level shunting", "TTN is proven by absence of a ductal gradient", "RDS is certain because oxygenation is low"], "answer": 1, "explanation": "Atrial-level shunting may not create a pre/postductal saturation difference. Closest distractor: Pre/postductal gradient is supportive but not a mandatory diagnostic criterion. Why not the others: A. PPHN is excluded by equal saturations — Atrial shunting may affect both pre/postductal blood.; C. TTN is proven by absence of a ductal gradient — TTN requires fluid-clearance clinical/radiographic pattern.; D. RDS is certain because oxygenation is low — Clear lungs and echo favor vascular physiology.", "pearl": "Echo is the definitive physiological discriminator when gradients are absent.", "srcAnswer": "B"}, {"num": 106, "level": "High-Difficulty", "question": "A 27-week infant has severe ROP treated with anti-VEGF and later mild motor asymmetry; normal early cUS is used to reassure the family that CP is impossible. What is the best response?", "options": ["Normal early US guarantees normal cognition and motor outcome", "Wait until school age before evaluating asymmetry", "Normal early US cannot exclude noncystic WMI or later CP; perform structured developmental evaluation", "ROP treatment directly proves CP"], "answer": 2, "explanation": "Motor trajectory, GMA/HINE and imaging are complementary. Closest distractor: Early normal ultrasound is not equivalent to absence of brain injury. Why not the others: A. Normal early US guarantees normal cognition and motor outcome — Sensitivity is limited.; B. Wait until school age before evaluating asymmetry — Early intervention is beneficial.; D. ROP treatment directly proves CP — Ocular disease does not establish motor diagnosis.", "pearl": "Risk counselling must avoid false certainty.", "srcAnswer": "C"}, {"num": 107, "level": "High-Difficulty", "question": "A 2-day-old after perinatal asphyxia has oliguria, sodium 128, urine output 0.3 mL/kg/h and a positive fluid balance. Which management principle is best?", "options": ["Give rapid 3% saline to normalize asymptomatic sodium immediately", "Assess fluid overload, renal function and ADH physiology before giving sodium or fluid boluses", "Give repeated isotonic boluses until urine output rises regardless of edema", "Stop monitoring sodium because 128 is always harmless"], "answer": 1, "explanation": "HIE-associated AKI/SIADH can cause dilutional hyponatremia and oliguria. Closest distractor: Volume status determines treatment more than sodium alone. Why not the others: A. Give rapid 3% saline to normalize asymptomatic sodium immediately — Severe symptomatic hyponatremia is a different indication.; C. Give repeated isotonic boluses until urine output rises regardless of edema — Oliguria may reflect AKI/SIADH, not hypovolemia.; D. Stop monitoring sodium because 128 is always harmless — Trend and neurologic state matter.", "pearl": "Avoid reflex sodium replacement in fluid-overloaded infants.", "srcAnswer": "B"}, {"num": 108, "level": "High-Difficulty", "question": "A 30-week infant has fever-free apnea, glucose 31 mg/dL and temperature 35.5°C at 18 hours; CBC is normal, blood culture pending. Which statement best avoids premature diagnostic closure?", "options": ["Hypoglycemia proves an isolated endocrine disorder", "Normal CBC excludes EOS", "No fever rules out sepsis", "Correct glucose and temperature while evaluating/treating sepsis according to clinical risk; normal CBC cannot exclude it"], "answer": 3, "explanation": "Multiple reversible contributors and sepsis can coexist in an ill neonate. Closest distractor: A normal early CBC is not a negative culture. Why not the others: A. Hypoglycemia proves an isolated endocrine disorder — Infection and inadequate intake can also cause hypoglycemia.; B. Normal CBC excludes EOS — Neonatal CBC lacks sufficient sensitivity for rule-out.; C. No fever rules out sepsis — Hypothermia and apnea are common neonatal infection presentations.", "pearl": "Stabilization and etiologic evaluation proceed in parallel.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 6',href:'Day12/quiz6.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet6_Q91-108_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 6 — Wrong Answer Report</h1><p><b>Questions:</b> 91–108</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['6']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['6']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 6 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
