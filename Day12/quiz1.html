@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "Under ETROP, which zone I lesion requires treatment assessment even without plus disease?", "options": ["Zone III stage 2 without plus", "Zone I stage 3 ROP", "Zone II stage 1 without plus", "Zone I stage 1 without plus"], "answer": 1, "explanation": "Zone I stage 3 is Type 1 even in the absence of plus. Closest distractor: Zone I stage 3 no plus versus zone I stage 1–2 no plus. Why not the others: A. Zone III stage 2 without plus — This does not meet ETROP Type 1.; C. Zone II stage 1 without plus — This is below Type 1 threshold.; D. Zone I stage 1 without plus — This is Type 2 and usually observed closely.", "pearl": "Type 1 treatment thresholds do not all require plus.", "srcAnswer": "B"}, {"num": 2, "level": "Basic/Recall", "question": "Under CPS guidance, the transitional neonatal hypoglycemia period extends through which age?", "options": ["The first 12 hours only", "The first 48 hours only", "The first 72 hours after birth", "The first 7 days for all infants"], "answer": 2, "explanation": "CPS distinguishes transitional (<72 h) from persistent (≥72 h) hypoglycemia. Closest distractor: CPS 72-hour versus PES 48-hour frameworks. Why not the others: A. The first 12 hours only — CPS explicitly uses 72 hours.; B. The first 48 hours only — PES uses a different 48-hour transition.; D. The first 7 days for all infants — CPS persistent thresholds begin after 72 hours.", "pearl": "Always read the named society before applying a time cutoff.", "srcAnswer": "C"}, {"num": 3, "level": "Basic/Recall", "question": "A 30-week infant develops grunting within 20 minutes of birth; the film shows low-volume lungs with diffuse fine granularity. Which primary deficiency is responsible?", "options": ["Delayed epithelial sodium absorption", "Aspiration of meconium", "Pulmonary vascular remodeling", "Pulmonary surfactant deficiency"], "answer": 3, "explanation": "Low surfactant raises surface tension and causes atelectasis in a preterm infant. Closest distractor: RDS low volumes versus TTN fluid-retention pattern. Why not the others: A. Delayed epithelial sodium absorption — This is TTN, usually with perihilar streaking and fluid in fissures.; B. Aspiration of meconium — Meconium aspiration is mainly a term/post-term condition with coarse patchy opacities.; C. Pulmonary vascular remodeling — This produces PPHN physiology rather than low-volume granular lungs.", "pearl": "Air bronchograms plus low lung volume are classic RDS discriminators.", "srcAnswer": "D"}, {"num": 4, "level": "Basic/Recall", "question": "What is the standard duration of therapeutic hypothermia for eligible term/near-term infants with moderate–severe HIE?", "options": ["24 hours", "12 hours", "72 hours", "7 days"], "answer": 2, "explanation": "Trial-based cooling continues for 72 hours at approximately 33.5°C. Closest distractor: Duration versus target temperature are separate protocol variables. Why not the others: A. 24 hours — Trials used substantially longer treatment.; B. 12 hours — This is insufficient for the evidence-based cooling protocol.; D. 7 days — Prolonged cooling is not the established protocol.", "pearl": "Controlled rewarming follows the 72-hour cooling phase.", "srcAnswer": "C"}, {"num": 5, "level": "Basic/Recall", "question": "Which echocardiographic feature most directly supports ductal systemic steal in a preterm infant?", "options": ["Holodiastolic flow reversal in descending aorta", "An isolated patent foramen ovale", "Small restrictive left-to-right PDA without flow reversal", "Normal LA/Ao ratio alone"], "answer": 0, "explanation": "Descending-aortic diastolic reversal reflects runoff through a substantial ductal shunt. Closest distractor: Ductal diameter versus systemic perfusion impact. Why not the others: B. An isolated patent foramen ovale — PFO is not a ductal steal marker.; C. Small restrictive left-to-right PDA without flow reversal — This may be hemodynamically minor.; D. Normal LA/Ao ratio alone — This does not show systemic diastolic steal.", "pearl": "Interpret PDA significance using several echo and clinical measures.", "srcAnswer": "A"}, {"num": 6, "level": "Basic/Recall", "question": "Which abdominal imaging finding establishes definite NEC in the modified Bell framework? [Interpret Visual Station 2 alongside the clinical data.]", "options": ["Pneumatosis intestinalis", "Mild diffuse bowel distension", "Isolated gastric residual", "Absent stool for 12 hours"], "answer": 0, "explanation": "Intramural gas supports modified Bell stage II definite NEC. Closest distractor: Nonspecific distension versus pneumatosis. Why not the others: B. Mild diffuse bowel distension — This can occur with feeding intolerance without NEC.; C. Isolated gastric residual — Residual alone is nonspecific.; D. Absent stool for 12 hours — This is not a radiographic diagnostic criterion.", "pearl": "Portal venous gas may coexist but is not required for every stage II case.", "srcAnswer": "A"}, {"num": 7, "level": "Basic/Recall", "question": "Which biochemical pair is characteristically suppressed during insulin-mediated hypoglycemia?", "options": ["Cortisol and growth hormone in every case", "Sodium and chloride", "Lactate and ammonia in every case", "Beta-hydroxybutyrate and free fatty acids"], "answer": 3, "explanation": "Insulin suppresses lipolysis and ketogenesis. Closest distractor: Hyperinsulinism versus FAOD (often high FFA). Why not the others: A. Cortisol and growth hormone in every case — Counter-regulatory hormones may be appropriate or impaired.; B. Sodium and chloride — Electrolytes do not define hyperinsulinism.; C. Lactate and ammonia in every case — These are not defining suppressed insulin-action markers.", "pearl": "Undetectable measured insulin does not exclude excessive insulin action.", "srcAnswer": "D"}, {"num": 8, "level": "Basic/Recall", "question": "What is the definitive bedside test to distinguish PPHN physiology from structural cyanotic CHD?", "options": ["Pre/postductal saturation difference alone", "Targeted echocardiography", "Single chest radiograph", "Blood glucose level"], "answer": 1, "explanation": "Echo defines shunt direction, ventricular function and cardiac structure. Closest distractor: Differential SpO₂ supports but does not establish the diagnosis. Why not the others: A. Pre/postductal saturation difference alone — Gradients can overlap and may be absent.; C. Single chest radiograph — CXR does not define intracardiac anatomy.; D. Blood glucose level — Glucose is relevant to illness but not shunt anatomy.", "pearl": "Do not administer a pulmonary vasodilator without understanding the circulation.", "srcAnswer": "B"}, {"num": 9, "level": "Basic/Recall", "question": "What is the preferred first enteral milk for a stable very-preterm infant when available?", "options": ["Mother’s own milk", "Standard adult enteral formula", "Water with glucose only", "Unmodified cow’s milk"], "answer": 0, "explanation": "Mother’s own milk provides immune and gut-protective benefits. Closest distractor: Mother’s milk versus donor milk as first and second choices. Why not the others: B. Standard adult enteral formula — This is not a neonatal milk substitute.; C. Water with glucose only — This cannot meet protein, mineral and energy needs.; D. Unmodified cow’s milk — It lacks appropriate preterm nutrient and infection profile.", "pearl": "Donor human milk is often preferred to formula if maternal milk unavailable.", "srcAnswer": "A"}, {"num": 10, "level": "Basic/Recall", "question": "Which right-sided site is used for preductal pulse-oximetry during neonatal resuscitation?", "options": ["Left foot only", "Either foot", "Umbilical stump", "Right hand or wrist"], "answer": 3, "explanation": "The right upper limb samples preductal systemic arterial oxygenation. Closest distractor: Right hand versus lower extremity readings in ductal shunting. Why not the others: A. Left foot only — This is postductal and may reflect ductal mixing.; B. Either foot — Both feet are postductal to a patent ductus.; C. Umbilical stump — No validated preductal pulse-oximetry site is there.", "pearl": "Preductal means right hand/wrist, not merely any upper limb.", "srcAnswer": "D"}, {"num": 11, "level": "Basic/Recall", "question": "Which EEG feature most strongly distinguishes a neonatal electrographic seizure from movement artifact? [Interpret Visual Station 1 alongside the clinical data.]", "options": ["A flat artifact band during handling", "Evolving rhythmic ictal activity on raw EEG", "A normal background with no change", "An isolated abrupt amplitude step without evolution"], "answer": 1, "explanation": "Evolution in frequency, amplitude or spatial distribution is a defining ictal clue. Closest distractor: aEEG trend alone is insufficient without raw EEG when available. Why not the others: A. A flat artifact band during handling — Handling artifact is not ictal evolution.; C. A normal background with no change — This provides no ictal correlate.; D. An isolated abrupt amplitude step without evolution — Electrode movement can cause a step artifact.", "pearl": "Electrographic-only seizures are common in neonatal encephalopathy.", "srcAnswer": "B"}, {"num": 12, "level": "Basic/Recall", "question": "Which term is preferred for the parenchymal hemorrhagic lesion formerly called “grade IV IVH”?", "options": ["Subdural hematoma", "Grade II germinal-matrix hemorrhage", "Periventricular hemorrhagic infarction (PVHI)", "Cystic PVL"], "answer": 2, "explanation": "PVHI is a separate venous hemorrhagic infarction often associated with GMH-IVH. Closest distractor: Parenchymal infarction is not merely more intraventricular blood. Why not the others: A. Subdural hematoma — This is extra-axial, not periventricular venous infarction.; B. Grade II germinal-matrix hemorrhage — This describes ventricular blood without distension.; D. Cystic PVL — PVL is white-matter injury rather than hemorrhagic venous infarction.", "pearl": "Use modern Volpe terminology in imaging questions.", "srcAnswer": "C"}, {"num": 13, "level": "Conceptual", "question": "Why is pneumatosis a stronger NEC discriminator than a high gastric residual? [Interpret Visual Station 2 alongside the clinical data.]", "options": ["It reflects only swallowed air in the stomach", "It indicates gas within the bowel wall rather than nonspecific delayed gastric emptying", "It directly proves intestinal perforation", "It proves isolated spontaneous intestinal perforation"], "answer": 1, "explanation": "Intramural gas indicates bowel wall pathology in the correct clinical setting. Closest distractor: Intramural versus intraperitoneal gas are different findings. Why not the others: A. It reflects only swallowed air in the stomach — Intramural gas is not simply gastric air.; C. It directly proves intestinal perforation — Free intraperitoneal gas indicates perforation.; D. It proves isolated spontaneous intestinal perforation — SIP often lacks widespread pneumatosis.", "pearl": "The imaging compartment matters for Bell staging and surgical urgency.", "srcAnswer": "B"}, {"num": 14, "level": "Conceptual", "question": "Why can a large left-to-right PDA worsen lung disease in a 26-week infant after PVR falls?", "options": ["Pulmonary overcirculation increases interstitial fluid and ventilatory demand", "It always produces severe cyanosis from right-to-left flow", "It directly causes surfactant deficiency at birth", "It eliminates systemic diastolic runoff"], "answer": 0, "explanation": "Postnatal fall in PVR drives pulmonary blood flow through a patent ductus. Closest distractor: Direction of ductal flow changes with resistance over time. Why not the others: B. It always produces severe cyanosis from right-to-left flow — Low PVR usually favors left-to-right flow.; C. It directly causes surfactant deficiency at birth — RDS is a distinct early lung process.; D. It eliminates systemic diastolic runoff — A large PDA may cause steal.", "pearl": "A PDA can worsen ventilation without being the primary initial lung diagnosis.", "srcAnswer": "A"}, {"num": 15, "level": "Conceptual", "question": "Why does normal early cranial ultrasound not exclude later PVL?", "options": ["PVL is always present as cysts on day 1", "Ultrasound always overestimates every brain lesion", "Cystic evolution can take weeks and diffuse noncystic WMI may be sonographically subtle", "MRI can never detect white-matter injury"], "answer": 2, "explanation": "PVL may be delayed or noncystic and missed by early sonography. Closest distractor: Early normal US versus later brain-injury evolution. Why not the others: A. PVL is always present as cysts on day 1 — Lesions evolve over time.; B. Ultrasound always overestimates every brain lesion — Sensitivity varies by injury type and timing.; D. MRI can never detect white-matter injury — MRI can show noncystic WMI.", "pearl": "Serial imaging and neurologic follow-up remain necessary.", "srcAnswer": "C"}, {"num": 16, "level": "Conceptual", "question": "In a 31-week infant with RDS, early CPAP reduces the need for invasive ventilation chiefly by what mechanism?", "options": ["Increasing hemoglobin oxygen affinity", "Closing the ductus arteriosus", "Suppressing surfactant degradation completely", "Establishing functional residual capacity and preventing alveolar collapse"], "answer": 3, "explanation": "Distending pressure recruits alveoli and maintains end-expiratory lung volume. Closest distractor: Recruitment versus pharmacologic surfactant replacement. Why not the others: A. Increasing hemoglobin oxygen affinity — CPAP does not change Hb biochemistry.; B. Closing the ductus arteriosus — Ductal constriction is not CPAP’s primary respiratory mechanism.; C. Suppressing surfactant degradation completely — CPAP supports aeration but does not replace surfactant.", "pearl": "CPAP can stabilize RDS yet does not eliminate rescue surfactant needs.", "srcAnswer": "D"}, {"num": 17, "level": "Conceptual", "question": "Why may an insulin level be undetectable in true neonatal hyperinsulinism during hypoglycemia?", "options": ["Insulin has no role in neonatal glucose control", "Insulin action can persist despite assay detection limits and episodic secretion", "A negative assay always excludes congenital disease", "Ketones must be high in hyperinsulinism"], "answer": 1, "explanation": "Insulin concentrations may be below detection while metabolic effects remain evident. Closest distractor: Biochemical insulin action versus a single plasma insulin number. Why not the others: A. Insulin has no role in neonatal glucose control — Insulin is a major regulator.; C. A negative assay always excludes congenital disease — Biochemical action markers are more informative.; D. Ketones must be high in hyperinsulinism — Insulin suppresses ketogenesis.", "pearl": "Glucagon response and suppressed fuels improve diagnosis.", "srcAnswer": "B"}, {"num": 18, "level": "Clinical/Application", "question": "A 54-hour-old asymptomatic SGA infant has a glucose of 52 mg/dL. The examiner asks which society has already crossed its defined transitional window and therefore applies its later higher glucose target. Which is correct?", "options": ["Pediatric Endocrine Society, because its transition point is 48 hours", "Both societies, because both use 24 hours", "Neither society, because both use 7 days", "Canadian Paediatric Society, because it uses 48 hours"], "answer": 0, "explanation": "PES considers >48 hours outside its early transitional period; CPS continues transition to 72 hours. Closest distractor: Same 54-hour infant sits on opposite sides of the two named timing boundaries. Why not the others: B. Both societies, because both use 24 hours — Their transition points differ and are later.; C. Neither society, because both use 7 days — PES changes after 48 h, CPS after 72 h.; D. Canadian Paediatric Society, because it uses 48 hours — CPS uses 72 hours for transitional hypoglycemia.", "pearl": "Framework naming is essential in glucose threshold questions.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 1',href:'Day12/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet1_Q1-18_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–18</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
