<script>
const quiz=[{"num": 19, "level": "Conceptual", "question": "Why must hypothermia be started early after a perinatal hypoxic-ischemic insult?", "options": ["It corrects all metabolic acidosis directly", "It prevents every later seizure", "It reverses all primary necrosis instantly", "It interrupts evolving secondary energy failure during the latent period"], "answer": 3, "explanation": "The latent phase precedes delayed excitotoxic and inflammatory secondary injury. Closest distractor: Primary irreversible injury versus modifiable secondary cascade. Why not the others: A. It corrects all metabolic acidosis directly — Acid-base correction is not the primary neuroprotective mechanism.; B. It prevents every later seizure — Seizures can still occur despite cooling.; C. It reverses all primary necrosis instantly — Established primary injury is not erased by cooling.", "pearl": "The ≤6-hour window follows injury biology, not an arbitrary ward schedule.", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "Why is preplus not interchangeable with plus in ETROP treatment decisions?", "options": ["Preplus means retinal detachment", "Preplus is below the reference severity for plus despite requiring closer surveillance", "Preplus automatically means stage 3", "Preplus guarantees regression"], "answer": 1, "explanation": "Posterior vascular abnormality is a continuum but treatment uses defined criteria. Closest distractor: Close follow-up is not equivalent to immediate Type 1 treatment. Why not the others: A. Preplus means retinal detachment — Detachment defines stage 4/5, not preplus.; C. Preplus automatically means stage 3 — Plus/preplus is vascular activity, not retinal stage.; D. Preplus guarantees regression — Posterior disease can progress.", "pearl": "Do not erase the preplus/plus threshold in exam reasoning.", "srcAnswer": "B"}, {"num": 21, "level": "Conceptual", "question": "A 40-week newborn has low Apgar but normal neurological examination at 2 hours and no biochemical evidence of hypoxia. Why is cooling not automatic?", "options": ["A normal cord pH always excludes HIE", "Cooling is restricted to neonates with visible seizures", "Apgar alone does not establish moderate–severe HIE eligibility", "Any 1-minute Apgar <7 mandates cooling"], "answer": 2, "explanation": "Cooling requires qualifying encephalopathy and trial-based evidence of perinatal insult. Closest distractor: Resuscitation intensity versus true encephalopathy severity. Why not the others: A. A normal cord pH always excludes HIE — Clinical and biochemical criteria must be integrated.; B. Cooling is restricted to neonates with visible seizures — Moderate/severe HIE may exist without seizures.; D. Any 1-minute Apgar <7 mandates cooling — Resuscitation score alone is insufficient.", "pearl": "Avoid overcooling mild or non-HIE infants.", "srcAnswer": "C"}, {"num": 22, "level": "Conceptual", "question": "How can systemic hypotension worsen PPHN oxygenation?", "options": ["It removes pulmonary vascular resistance", "It always closes the ductus", "It increases pulmonary oxygen diffusion automatically", "Lower SVR may increase right-to-left shunting across ductus/foramen"], "answer": 3, "explanation": "Relative systemic and pulmonary pressures govern shunt direction. Closest distractor: A falling systemic pressure can aggravate shunt physiology. Why not the others: A. It removes pulmonary vascular resistance — PVR may remain high despite falling SVR.; B. It always closes the ductus — Ductal closure is not caused by acute hypotension.; C. It increases pulmonary oxygen diffusion automatically — Perfusion pressure loss can worsen shunting.", "pearl": "PPHN care requires adequate systemic perfusion as well as oxygen.", "srcAnswer": "D"}, {"num": 23, "level": "Conceptual", "question": "A term infant has tachypnea after elective caesarean delivery; CXR shows fluid in interlobar fissures and normal-to-high lung volumes. What mechanism fits best?", "options": ["Type II pneumocyte destruction", "Airway obstruction by thick meconium", "Delayed fetal lung-fluid clearance", "Right-to-left ductal shunting alone"], "answer": 2, "explanation": "Absence of labour-related fluid clearance explains TTN after elective caesarean. Closest distractor: TTN versus RDS radiographic lung volume. Why not the others: A. Type II pneumocyte destruction — Severe surfactant loss produces low-volume granular lungs.; B. Airway obstruction by thick meconium — No meconium exposure or coarse infiltrates are given.; D. Right-to-left ductal shunting alone — That causes hypoxemia but not fissural fluid.", "pearl": "TTN often improves over 24–72 hours, unlike severe untreated RDS.", "srcAnswer": "C"}, {"num": 24, "level": "Conceptual", "question": "How does fortification benefit many VLBW infants receiving human milk?", "options": ["It raises protein and mineral delivery toward preterm growth needs", "It prevents every NEC case", "It eliminates the need for all biochemical monitoring", "It replaces the need for adequate volume intake"], "answer": 0, "explanation": "Unfortified human milk may not meet high preterm protein/calcium/phosphate demands. Closest distractor: Human milk’s protective properties versus its nutrient-density limits. Why not the others: B. It prevents every NEC case — Human milk reduces risk but no intervention is absolute.; C. It eliminates the need for all biochemical monitoring — Fortification does not remove growth/electrolyte monitoring.; D. It replaces the need for adequate volume intake — Both composition and volume matter.", "pearl": "Fortification supports growth without negating the value of human milk.", "srcAnswer": "A"}, {"num": 25, "level": "Conceptual", "question": "Why does physiologic neonatal weight loss occur after birth?", "options": ["Failure of all neonatal kidneys to excrete sodium", "Extracellular fluid contraction with diuresis and natriuresis", "Loss of lean tissue only", "Obligate hyperglycemia-driven dehydration in every infant"], "answer": 1, "explanation": "Postnatal adaptation involves net water and sodium loss. Closest distractor: Physiologic diuresis versus pathological dehydration. Why not the others: A. Failure of all neonatal kidneys to excrete sodium — Neonates can excrete sodium, though immature.; C. Loss of lean tissue only — Fluid shifts dominate early physiologic weight change.; D. Obligate hyperglycemia-driven dehydration in every infant — Most normal infants lose extracellular fluid without hyperglycemia.", "pearl": "Fluid and sodium prescriptions should follow serial weights and labs.", "srcAnswer": "B"}, {"num": 26, "level": "Conceptual", "question": "What is the major limitation of using gastric residual volume alone to stop feeds?", "options": ["Residuals identify the infecting organism", "Residuals always indicate bowel necrosis", "Residuals poorly discriminate NEC from normal immature gastric motility", "Residuals directly measure intestinal perfusion"], "answer": 2, "explanation": "Isolated residuals lack specificity for NEC. Closest distractor: Residual plus systemic signs/imaging differs from residual alone. Why not the others: A. Residuals identify the infecting organism — They are not microbiologic tests.; B. Residuals always indicate bowel necrosis — Many healthy preterms have residuals.; D. Residuals directly measure intestinal perfusion — They do not quantify mesenteric blood flow.", "pearl": "Avoid unnecessary prolonged feed interruption without supporting clinical evidence.", "srcAnswer": "C"}, {"num": 27, "level": "Conceptual", "question": "Why does a sudden drop in systemic vascular resistance worsen right-to-left ductal shunting in PPHN?", "options": ["The systemic-to-pulmonary pressure gradient favors ductal flow toward the aorta", "It guarantees left-to-right ductal flow", "It directly increases surfactant secretion", "It closes the foramen ovale immediately"], "answer": 0, "explanation": "Ductal flow direction follows relative pulmonary and systemic pressure/resistance. Closest distractor: Shunt direction is hemodynamic, not fixed by ductal patency alone. Why not the others: B. It guarantees left-to-right ductal flow — Low SVR relative to high PVR favors right-to-left flow.; C. It directly increases surfactant secretion — Surfactant secretion does not govern shunt direction.; D. It closes the foramen ovale immediately — Foramen closure is not caused by abrupt SVR fall.", "pearl": "PPHN may worsen during systemic hypotension even without new lung pathology.", "srcAnswer": "A"}, {"num": 28, "level": "Conceptual", "question": "What does a basal-ganglia/thalamic injury pattern on HIE MRI classically suggest?", "options": ["A purely watershed partial-prolonged pattern", "Benign transient hypoglycemia only", "Isolated peripheral neuropathy", "Acute profound hypoxic-ischemic insult"], "answer": 3, "explanation": "Deep gray injury is associated with acute severe energy failure. Closest distractor: Basal-ganglia/thalamic versus watershed distribution. Why not the others: A. A purely watershed partial-prolonged pattern — Watershed injury favors parasagittal cortical/subcortical regions.; B. Benign transient hypoglycemia only — Hypoglycemia more often has posterior cortical patterns, though overlap exists.; C. Isolated peripheral neuropathy — This would not cause deep-gray diffusion abnormalities.", "pearl": "MRI pattern informs but does not determine individual prognosis.", "srcAnswer": "D"}, {"num": 29, "level": "Conceptual", "question": "Why is routine treatment of every echocardiographically patent ductus not evidence-based?", "options": ["PDA can never contribute to pulmonary edema", "Ductal patency alone does not prove net harm or improved outcomes from closure", "All PDA treatments cause NEC in every infant", "Every PDA closes by 24 hours"], "answer": 1, "explanation": "Treatment decisions depend on clinical and hemodynamic significance, not mere patency. Closest distractor: Association with morbidity does not prove closure prevents that morbidity. Why not the others: A. PDA can never contribute to pulmonary edema — Large hsPDA can cause overcirculation.; C. All PDA treatments cause NEC in every infant — Harms vary by drug and infant.; D. Every PDA closes by 24 hours — Persistence is common in extremely preterm infants.", "pearl": "Avoid reflex pharmacologic closure based only on ductal diameter.", "srcAnswer": "B"}, {"num": 30, "level": "Conceptual", "question": "What is the principal advantage of combining GMA, HINE and imaging for early CP prediction?", "options": ["Different domains of motor behavior, examination and injury pattern improve risk identification", "GMA replaces all hearing and vision follow-up", "Normal imaging excludes motor disability", "A single HINE cutoff proves CP in every infant"], "answer": 0, "explanation": "Multimodal evidence is stronger than one test in isolation. Closest distractor: Predictive cutoffs versus diagnostic certainty. Why not the others: B. GMA replaces all hearing and vision follow-up — Sensory outcomes need separate assessment.; C. Normal imaging excludes motor disability — Noncystic injury and functional deficits can be missed.; D. A single HINE cutoff proves CP in every infant — Scores are predictive, not standalone diagnostic.", "pearl": "Early intervention can start before a definitive CP label.", "srcAnswer": "A"}, {"num": 31, "level": "Conceptual", "question": "A 3-day-old has ammonia 680 µmol/L, normal anion gap, low citrulline and high urinary orotic acid. Which metabolic block best explains it?", "options": ["Propionic acidemia", "Carbamoyl phosphate synthetase 1 deficiency", "Ornithine transcarbamylase deficiency", "Argininosuccinate synthetase deficiency"], "answer": 2, "explanation": "OTC deficiency diverts mitochondrial carbamoyl phosphate into pyrimidine/orotic acid production. Closest distractor: OTC high orotic versus CPS1 low orotic acid. Why not the others: A. Propionic acidemia — High-anion-gap ketoacidosis is more typical.; B. Carbamoyl phosphate synthetase 1 deficiency — This generally has low urinary orotic acid.; D. Argininosuccinate synthetase deficiency — Citrulline would be markedly elevated.", "pearl": "Hyperammonemia without acidosis is a urea-cycle emergency.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical/Application", "question": "A 26-week infant has bounding pulses, wide pulse pressure, increasing FiO₂, LA/Ao 1.7 and diastolic reversal in descending aorta. What is the best interpretation?", "options": ["Pure PPHN with exclusively right-to-left PDA", "Small incidental PDA without systemic effects", "Only anemia explains all findings", "A hemodynamically significant left-to-right PDA is likely contributing to pulmonary/systemic effects"], "answer": 3, "explanation": "Clinical and echo features converge on significant ductal shunting. Closest distractor: LA enlargement plus aortic runoff is stronger than murmur alone. Why not the others: A. Pure PPHN with exclusively right-to-left PDA — Echo evidence indicates left-to-right systemic runoff.; B. Small incidental PDA without systemic effects — Several independent markers indicate significant shunting.; C. Only anemia explains all findings — Anemia alone does not produce aortic diastolic flow reversal.", "pearl": "Treatment discussion should incorporate this integrated phenotype.", "srcAnswer": "D"}, {"num": 33, "level": "Clinical/Application", "question": "A 28-week infant on day 12 develops distension, bloody stools, apnea, platelets 82,000 and abdominal radiograph with pneumatosis but no free air. Which management bundle is best? [Interpret Visual Station 2 alongside the clinical data.]", "options": ["Stop feeds, decompress, culture, start protocol-guided IV antibiotics/PN and arrange serial assessment with surgical input", "Continue full feeds because no free air is present", "Immediate elective contrast enema as first treatment", "Give only oral probiotic and observe"], "answer": 0, "explanation": "Definite NEC without perforation is managed medically with vigilant surgical surveillance. Closest distractor: Absence of free air does not make pneumatosis benign. Why not the others: B. Continue full feeds because no free air is present — Pneumatosis establishes definite NEC.; C. Immediate elective contrast enema as first treatment — Enema is not standard first-line NEC management.; D. Give only oral probiotic and observe — Systemic illness requires urgent NEC care.", "pearl": "Early treatment aims to prevent progression to shock/perforation.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical/Application", "question": "A 28-week newborn has respiratory distress and FiO₂ rises from 0.25 to 0.42 on CPAP 6 cm H₂O; lung US shows diffuse compact B-lines and no air leak. Which approach is most appropriate?", "options": ["Stop CPAP because any oxygen rise proves pneumothorax", "Switch to high-dose systemic steroid immediately", "Give furosemide as first-line treatment", "Assess for rescue surfactant using the unit’s CPAP/FiO₂ threshold while optimizing support"], "answer": 3, "explanation": "Worsening oxygen requirement on CPAP in a very preterm infant can trigger rescue surfactant assessment. Closest distractor: Escalating RDS support versus unindicated diuresis. Why not the others: A. Stop CPAP because any oxygen rise proves pneumothorax — Lung ultrasound lacks air-leak evidence.; B. Switch to high-dose systemic steroid immediately — Steroids are not initial rescue for early RDS.; C. Give furosemide as first-line treatment — Surfactant-deficient RDS is not primarily pulmonary edema.", "pearl": "FiO₂ thresholds for rescue surfactant are protocol-dependent; name the local pathway.", "srcAnswer": "D"}, {"num": 35, "level": "Clinical/Application", "question": "A 28-week infant at 34 weeks PMA has Zone II stage 2 ROP with unequivocal plus. What is the ETROP classification? [Interpret Visual Station 5 alongside the clinical data.]", "options": ["Normal immature retinal vascularization", "Type 2 until stage 3 appears", "Type 1 ROP requiring prompt treatment assessment", "Stage 4A because plus is severe"], "answer": 2, "explanation": "Zone II stage 2 plus is ETROP Type 1. Closest distractor: Retinal stage and plus are independent descriptors. Why not the others: A. Normal immature retinal vascularization — Stage 2 ridge and plus are pathological.; B. Type 2 until stage 3 appears — Zone II stage 2 with plus already meets Type 1.; D. Stage 4A because plus is severe — Stage 4 requires retinal detachment.", "pearl": "Do not wait for stage 3 if Type 1 is already present.", "srcAnswer": "C"}, {"num": 36, "level": "Clinical/Application", "question": "A 2-day-old at-risk infant has glucose 38 mg/dL but is alert and feeding; CPS transitional framework is named. Which action is appropriate?", "options": ["Start diazoxide immediately after one low reading", "Wait until 72 hours before any intervention", "Provide enteral supplementation or dextrose gel per protocol and recheck glucose in 30 minutes", "Ignore because 38 mg/dL is always normal on day 2"], "answer": 2, "explanation": "Asymptomatic at-risk infant with glucose <2.6 mmol/L needs prompt feeding-based intervention and reassessment. Closest distractor: Treatment in transition versus etiologic persistent workup. Why not the others: A. Start diazoxide immediately after one low reading — Persistent hyperinsulinism is not established.; B. Wait until 72 hours before any intervention — Transitional hypoglycemia still requires treatment when below threshold.; D. Ignore because 38 mg/dL is always normal on day 2 — CPS intervention threshold is 2.6 mmol/L.", "pearl": "A 30-minute response check prevents prolonged unrecognized hypoglycemia.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 2',href:'Day12/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet2_Q19-36_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 19–36</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
