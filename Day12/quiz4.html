D. Give only phenobarbital because metabolic abnormalities are secondary — Both are independently harmful and treatable.", "pearl": "Early glucose/calcium monitoring is integral to postresuscitation care.", "srcAnswer": "A"}, {"num": 57, "level": "Clinical/Application", "question": "A 26-week infant on PN has glucose 220 mg/dL, triglycerides 330 mg/dL and poor growth. What is the best principle?", "options": ["Ignore triglycerides because PN lipids never require monitoring", "Increase dextrose to correct poor growth", "Stop all amino acids indefinitely", "Reassess GIR and lipid delivery, infection/stress and overall nutrition before making protocol-guided adjustments"], "answer": 3, "explanation": "PN toxicity and nutritional inadequacy must be balanced using measured tolerance. Closest distractor: Hyperglycemia does not automatically mean all calories must be stopped. Why not the others: A. Ignore triglycerides because PN lipids never require monitoring — Hypertriglyceridemia may require lipid adjustment.; B. Increase dextrose to correct poor growth — This may worsen hyperglycemia.; C. Stop all amino acids indefinitely — This worsens protein deficit and growth.", "pearl": "Review substrate-specific delivery and clinical stressors.", "srcAnswer": "D"}, {"num": 58, "level": "Clinical/Application", "question": "A term infant at 36 hours has generalized seizures, ionized calcium 0.65 mmol/L and glucose 82 mg/dL. What is the immediate targeted therapy?", "options": ["Rapid oral calcium only despite ongoing seizures", "Dextrose bolus as sole treatment", "Phenobarbital alone without correcting calcium", "Monitored IV calcium replacement per neonatal protocol with ECG/extravasation precautions"], "answer": 3, "explanation": "Severe ionized hypocalcemia is a treatable seizure cause. Closest distractor: Treat metabolic cause alongside seizure control. Why not the others: A. Rapid oral calcium only despite ongoing seizures — Symptomatic severe hypocalcemia requires urgent monitored therapy.; B. Dextrose bolus as sole treatment — Glucose is normal and does not correct low ionized calcium.; C. Phenobarbital alone without correcting calcium — ASM does not remove the metabolic seizure trigger.", "pearl": "IV calcium extravasation and arrhythmia are important bedside hazards.", "srcAnswer": "D"}, {"num": 59, "level": "Clinical/Application", "question": "A 27-week infant has PDA and platelets 42,000 with new NEC concern. Which drug-selection consideration is important?", "options": ["Paracetamol is guaranteed to close every PDA", "Ibuprofen has no GI or platelet effects", "Avoid reflex cyclooxygenase-inhibitor therapy while gut/platelet/renal risks are evaluated", "Indomethacin prevents NEC when given after symptoms begin"], "answer": 2, "explanation": "PDA medication choice must consider contraindications and concurrent NEC risk. Closest distractor: Hemodynamic significance and drug safety must both be assessed. Why not the others: A. Paracetamol is guaranteed to close every PDA — Efficacy varies and liver monitoring may be needed.; B. Ibuprofen has no GI or platelet effects — NSAIDs can have relevant adverse effects.; D. Indomethacin prevents NEC when given after symptoms begin — It is not NEC therapy.", "pearl": "A ductal murmur never overrides a surgical abdomen.", "srcAnswer": "C"}, {"num": 60, "level": "Clinical/Application", "question": "A 27-week infant has Zone I stage 2 preplus ROP; no stage 3 or true plus. What is the most appropriate approach?", "options": ["Discharge from ROP screening at 34 weeks PMA", "Close specialist surveillance with shortened interval if progression occurs", "Label stage 4A because disease is in Zone I", "Immediate treatment is mandatory solely because preplus is present"], "answer": 1, "explanation": "Zone I stage 2 without plus is Type 2 but high-risk for progression. Closest distractor: Location heightens vigilance without changing ETROP definition. Why not the others: A. Discharge from ROP screening at 34 weeks PMA — Posterior immature retina remains at risk.; C. Label stage 4A because disease is in Zone I — Stage depends on morphology/detachment.; D. Immediate treatment is mandatory solely because preplus is present — Preplus is not automatically Type 1.", "pearl": "Near-threshold posterior disease requires reliable follow-up.", "srcAnswer": "B"}, {"num": 61, "level": "Clinical/Application", "question": "A 38-week infant after cooling has diffusion restriction in parasagittal cortical–subcortical border zones rather than basal ganglia. Which injury pattern is described?", "options": ["Deep nuclear acute profound pattern", "Watershed-predominant hypoxic-ischemic injury", "PVHI in a preterm infant", "Cystic PVL alone"], "answer": 1, "explanation": "Parasagittal border-zone lesions are characteristic of watershed injury. Closest distractor: Topographic distribution matters more than the word “diffusion.” Why not the others: A. Deep nuclear acute profound pattern — Basal ganglia and thalami would predominate.; C. PVHI in a preterm infant — PVHI is periventricular venous hemorrhagic infarction.; D. Cystic PVL alone — PVL is periventricular white-matter injury in preterms.", "pearl": "Watershed injury may have later cognitive/language consequences.", "srcAnswer": "B"}, {"num": 62, "level": "Clinical/Application", "question": "A 33-week infant develops apnea, hypothermia and prolonged capillary refill at 8 hours; maternal intrapartum fever occurred. Which immediate sequence is best?", "options": ["Blood culture promptly, then empiric antibiotics and resuscitation without delaying treatment", "Wait for CRP rise before antibiotics", "Discharge after a normal temperature repeat", "Use procalcitonin alone to exclude infection"], "answer": 0, "explanation": "Unwell neonate with maternal risk needs prompt sepsis treatment and hemodynamic support. Closest distractor: Culture-before-antibiotics when feasible versus treatment delay. Why not the others: B. Wait for CRP rise before antibiotics — Early CRP may be low despite sepsis.; C. Discharge after a normal temperature repeat — Shock/apnea require urgent evaluation.; D. Use procalcitonin alone to exclude infection — One biomarker cannot safely exclude sepsis in an unstable infant.", "pearl": "A normal early inflammatory marker does not rule out EOS.", "srcAnswer": "A"}, {"num": 63, "level": "Clinical/Application", "question": "A 26-week infant after intravitreal anti-VEGF for Zone I ROP has apparent regression at 43 weeks PMA. What is the follow-up priority?", "options": ["Assume laser follow-up duration is identical", "Stop visits because early regression guarantees cure", "Continue prolonged retinal surveillance for late reactivation/persistent avascular retina", "Give routine propranolol to prevent recurrence"], "answer": 2, "explanation": "Anti-VEGF suppresses neovascularization but may leave peripheral retina avascular. Closest distractor: Early regression versus durable completion of vascularization. Why not the others: A. Assume laser follow-up duration is identical — Anti-VEGF can have delayed reactivation.; B. Stop visits because early regression guarantees cure — Late recurrence can occur after anti-VEGF.; D. Give routine propranolol to prevent recurrence — Propranolol is not routine ROP prophylaxis.", "pearl": "Lost follow-up after anti-VEGF can cause preventable visual loss.", "srcAnswer": "C"}, {"num": 64, "level": "Clinical/Application", "question": "A 1.2-kg infant needs GIR 7.5 mg/kg/min but the fluid prescription is limited to 90 mL/kg/day. Which dextrose percentage most closely supplies the target?", "options": ["D7.5", "D9", "D16", "D12"], "answer": 3, "explanation": "Required D% = GIR×144/fluid = 7.5×144/90 = 12%. Calculation check: formula uses % dextrose and mL/kg/day; substitution and mg/kg/min (or %) appear in Core reasoning. Trap: never substitute 0.10 for 10% in the GIR formula. Closest distractor: Use mL/kg/day and factor 144; total daily mL for the patient is not substituted here. Why not the others: A. D7.5 — GIR is not equal to dextrose concentration.; B. D9 — 9×90/144 = 5.63 mg/kg/min, below target.; C. D16 — 16×90/144 = 10 mg/kg/min, above target.", "pearl": "Restricted fluid prescriptions can require higher dextrose concentration.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 10 Q47 — GIR concentration conversion"}}, {"num": 65, "level": "Clinical/Application", "question": "A term infant has PaO₂ 55 mmHg on FiO₂ 0.80 and mean airway pressure 15 cm H₂O. What is the oxygenation index?", "options": ["Approximately 12", "Approximately 21.8", "Approximately 44", "Approximately 2.2"], "answer": 1, "explanation": "OI = 15×0.8×100/55 = 21.82. Calculation check: OI = MAP×FiO₂×100/PaO₂; MAP in cm H₂O, FiO₂ fraction, PaO₂ mmHg. Trap: 80% must be 0.80, not 80. Closest distractor: FiO₂ must be 0.80, not 80, in the formula. Why not the others: A. Approximately 12 — This is 15×0.8 without PaO₂ division.; C. Approximately 44 — This doubles the correct value without justification.; D. Approximately 2.2 — The factor 100 was omitted.", "pearl": "OI helps quantify severe oxygenation failure for PPHN escalation.", "srcAnswer": "B"}, {"num": 66, "level": "Clinical/Application", "question": "A newborn has lip smacking and bicycling movements during handling but continuous raw EEG remains unchanged. What interpretation is most defensible?", "options": ["Immediate escalating ASM doses are mandatory", "Normal raw EEG guarantees no neonatal epilepsy ever", "Every stereotyped neonatal movement is a seizure", "The movements are not proven electrographic seizures; investigate artifact and other causes"], "answer": 3, "explanation": "No evolving ictal EEG correlate reduces confidence that the observed event is epileptic. Closest distractor: Observed movement versus confirmed ictal discharge. Why not the others: A. Immediate escalating ASM doses are mandatory — Avoid treating unconfirmed events without evaluating EEG.; B. Normal raw EEG guarantees no neonatal epilepsy ever — This only addresses the observed event.; C. Every stereotyped neonatal movement is a seizure — Clinical semiology alone has low specificity.", "pearl": "Video-EEG correlation reduces overtreatment.", "srcAnswer": "D"}, {"num": 67, "level": "Clinical/Application", "question": "A 40-week infant born through meconium-stained fluid is apneic and HR 70/min. What should be prioritized?", "options": ["Start effective PPV rather than routine tracheal suction solely for meconium", "Routine intubation and suction before ventilation", "Immediate chest compressions", "Observe for spontaneous respiration"], "answer": 0, "explanation": "Current neonatal resuscitation emphasizes ventilation, not automatic suction for meconium. Closest distractor: Nonvigorous meconium does not by itself mandate tracheal suction. Why not the others: B. Routine intubation and suction before ventilation — This delays essential ventilation without proven benefit.; C. Immediate chest compressions — HR 70 improves first with effective ventilation.; D. Observe for spontaneous respiration — Apnea and bradycardia need PPV.", "pearl": "Delaying PPV worsens hypoxia and bradycardia.", "srcAnswer": "A"}, {"num": 68, "level": "Clinical/Application", "question": "A 2-day-old infant has glucose 29 mg/dL, BOHB 0.1 mmol/L, FFA suppressed and glucose rises 42 mg/dL after glucagon. What is the most likely mechanism?", "options": ["Starvation ketosis", "Fatty-acid oxidation defect", "Excess insulin action", "Primary cortisol deficiency as the only explanation"], "answer": 2, "explanation": "Hypoketotic hypoglycemia with suppressed FFA and large glucagon response supports hyperinsulinism. Closest distractor: FAOD has low ketones but typically high FFA. Why not the others: A. Starvation ketosis — Ketones should be elevated in an appropriate fasting response.; B. Fatty-acid oxidation defect — FFA is generally elevated with impaired oxidation.; D. Primary cortisol deficiency as the only explanation — The marked glucagon rise with suppressed fuels favors insulin action.", "pearl": "Critical-sample patterns outweigh an isolated insulin assay result.", "srcAnswer": "C"}, {"num": 69, "level": "Clinical/Application", "question": "A 29-week infant develops distension after feeds; radiograph shows only gaseous dilation and no pneumatosis, while vitals, platelets and perfusion are normal. What is most appropriate?", "options": ["Reassess feeding tolerance and monitor closely rather than label definite NEC from dilation alone", "Perform emergency laparotomy", "Diagnose Bell III NEC immediately", "Start long-term parenteral antibiotics solely from bowel gas"], "answer": 0, "explanation": "Nonspecific bowel dilation requires serial clinical context. Closest distractor: Bell I suspicion versus Bell II proof. Why not the others: B. Perform emergency laparotomy — No perforation or severe deterioration is described.; C. Diagnose Bell III NEC immediately — There is no shock, DIC or free air.; D. Start long-term parenteral antibiotics solely from bowel gas — Nonspecific gas is not definitive NEC.", "pearl": "Avoid overdiagnosis while maintaining surveillance for evolving NEC.", "srcAnswer": "A"}, {"num": 70, "level": "Clinical/Application", "question": "A preterm infant undergoing ROP screening develops bradycardia and desaturation after speculum placement. What is the safest action?", "options": ["Complete the exam regardless of physiologic instability", "Remove monitoring leads and proceed", "Pause examination, stabilize the infant and resume only when safe", "Give extra phenylephrine despite full dilation"], "answer": 2, "explanation": "Screening may provoke apnea/bradycardia and requires immediate safety response. Closest distractor: Completion urgency does not outrank cardiorespiratory stabilization. Why not the others: A. Complete the exam regardless of physiologic instability — Safety overrides retinal documentation.; B. Remove monitoring leads and proceed — Monitoring is important in fragile infants.; D. Give extra phenylephrine despite full dilation — Additional drug does not treat bradycardia.", "pearl": "Topical anesthetic, swaddling, sucrose and asepsis are supportive screening measures.", "srcAnswer": "C"}, {"num": 71, "level": "Clinical/Application", "question": "A 32-week infant on CPAP suddenly becomes hypotensive with asymmetric chest expansion and absent right lung sliding on ultrasound. Which next step is safest?", "options": ["Give surfactant before addressing the air leak", "Immediate pleural decompression if tension pneumothorax is suspected", "Wait for confirmatory radiograph before any intervention", "Increase CPAP pressure to recruit the right lung"], "answer": 1, "explanation": "Acute asymmetry plus hemodynamic collapse and absent lung sliding strongly suggest tension pneumothorax. Closest distractor: Air-leak stabilization versus imaging delay. Why not the others: A. Give surfactant before addressing the air leak — Tension physiology requires decompression first.; C. Wait for confirmatory radiograph before any intervention — Unstable tension physiology is a clinical emergency.; D. Increase CPAP pressure to recruit the right lung — Higher pressure may worsen an air leak.", "pearl": "A lung point helps diagnosis but is not required before emergency decompression.", "srcAnswer": "B"}, {"num": 72, "level": "Clinical/Application", "question": "A 39-week infant completes cooling and rewarming. There are no clinical seizures, but MRI shows moderate basal-ganglia injury. What discharge plan is most appropriate?", "options": ["Routine antiseizure medication for five years", "No follow-up because seizures stopped", "Assure normal outcome based solely on feeding at discharge", "Structured neurologic, hearing, vision, feeding and developmental follow-up with early referral as indicated"], "answer": 3, "explanation": "MRI injury plus HIE history warrants multidisciplinary developmental surveillance. Closest distractor: Seizure cessation is not a surrogate for normal neurodevelopment. Why not the others: A. Routine antiseizure medication for five years — Long-term ASM is not automatic after resolved acute symptomatic seizures.; B. No follow-up because seizures stopped — MRI injury carries developmental risk independent of seizures.; C. Assure normal outcome based solely on feeding at discharge — Early feeding does not predict later cognition.", "pearl": "Prognosis is longitudinal and multimodal.", "srcAnswer": "D"}];

let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}

// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet4_Q55-72_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 55–72</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
