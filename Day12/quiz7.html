<script>
const quiz=[{"num": 109, "level": "High-Difficulty", "question": "A 26-week infant with NEC recovers after 10 days of bowel rest; weight is falling and the team debates rapid full-volume feeds. Which plan best balances relapse and malnutrition?", "options": ["Restart cautiously with human milk and stepwise advancement guided by clinical recovery and unit protocol", "Use only glucose water for several weeks", "Return immediately to full feeds regardless of bowel findings", "Keep NPO indefinitely to prevent recurrence"], "answer": 0, "explanation": "Refeeding follows clinical recovery, with gradual advancement and monitoring. Closest distractor: Neither indefinite fasting nor unmonitored rapid full feeds is appropriate. Why not the others: B. Use only glucose water for several weeks — This cannot meet nutritional requirements.; C. Return immediately to full feeds regardless of bowel findings — Abrupt full volumes may be poorly tolerated.; D. Keep NPO indefinitely to prevent recurrence — Prolonged fasting causes growth/PN harms.", "pearl": "Post-NEC recovery requires a structured nutrition plan.", "srcAnswer": "A"}, {"num": 110, "level": "High-Difficulty", "question": "A 39-week infant is assessed for cooling at 8 hours after delayed referral; moderate HIE is documented. Which statement is evidence-calibrated?", "options": ["Cooling is mandatory through 24 hours in all moderate HIE", "Cooling at 8 hours is equivalent to initiation at 3 hours", "Standard benefit is for initiation ≤6 hours; 6–24-hour cooling is individualized after family discussion and specialist review", "No supportive care is worthwhile after 6 hours"], "answer": 2, "explanation": "The international AAP 2026 report distinguishes standard and later-start evidence. Closest distractor: Later initiation is neither equivalent nor universally prohibited. Why not the others: A. Cooling is mandatory through 24 hours in all moderate HIE — Later initiation is not routine standard care.; B. Cooling at 8 hours is equivalent to initiation at 3 hours — Evidence strength differs by timing.; D. No supportive care is worthwhile after 6 hours — Seizure, glucose and perfusion management remain essential.", "pearl": "Evidence uncertainty must be explicitly conveyed in time-window questions.", "srcAnswer": "C"}, {"num": 111, "level": "High-Difficulty", "question": "A 25-week infant with IVH develops progressive ventriculomegaly; repeated reservoir taps are planned. Which safety principle is most important?", "options": ["Use a universal CSF protein <1.5 g/L rule to mandate shunt in every center", "Use strict asepsis and controlled drainage, monitor infection/CSF loss and individualize shunt timing", "Ignore protein and electrolytes because CSF loss is nutritionally irrelevant", "Remove CSF as rapidly as possible without monitoring"], "answer": 1, "explanation": "Temporizing PHVD drainage has infection, obstruction, leak and CSF-loss risks. Closest distractor: Study-specific volumes/protein thresholds are not universal commands. Why not the others: A. Use a universal CSF protein <1.5 g/L rule to mandate shunt in every center — That cutoff is protocol-dependent.; C. Ignore protein and electrolytes because CSF loss is nutritionally irrelevant — Repeated losses can matter.; D. Remove CSF as rapidly as possible without monitoring — Rapid drainage can cause hemodynamic/hemorrhagic problems.", "pearl": "Management quality includes procedural safety, not just VI numbers.", "srcAnswer": "B"}, {"num": 112, "level": "High-Difficulty", "question": "A 39-week infant has OI 25 and severe hypoxemia; echo reveals obstructed total anomalous pulmonary venous return rather than PPHN. What is the most important implication?", "options": ["Close PDA pharmacologically to cure TAPVR", "Treat as isolated PPHN because OI is high", "Reassure because no differential SpO₂ is recorded", "Urgent cardiac specialist pathway; isolated PPHN vasodilator algorithms are inappropriate"], "answer": 3, "explanation": "Structural pulmonary venous obstruction changes management fundamentally. Closest distractor: Echo anatomy must precede definitive PPHN treatment assumptions. Why not the others: A. Close PDA pharmacologically to cure TAPVR — Ductal closure does not correct pulmonary venous obstruction.; B. Treat as isolated PPHN because OI is high — OI measures oxygenation, not anatomy.; C. Reassure because no differential SpO₂ is recorded — Structural CHD can cause profound hypoxemia without a gradient.", "pearl": "Not all severe neonatal hypoxemia is primary pulmonary hypertension.", "srcAnswer": "D"}, {"num": 113, "level": "Integrated/Rank-Differentiating", "question": "A 36-week infant with severe HIE develops a 12-minute evolving EEG seizure, glucose 29 mg/dL, and hypotension at hour 5. Which priority bundle is best?", "options": ["Complete MRI before any treatment", "Use phenobarbital only; glucose correction can wait", "Cancel cooling because a seizure is present", "Correct glucose and perfusion, treat electrographic seizure and commence eligible cooling without missing the window"], "answer": 3, "explanation": "Secondary injury prevention requires parallel metabolic, hemodynamic, seizure and cooling care. Closest distractor: No single abnormality should monopolize management in evolving HIE. Why not the others: A. Complete MRI before any treatment — MRI is not needed before time-critical stabilization and cooling.; B. Use phenobarbital only; glucose correction can wait — Hypoglycemia is an independent neurotoxic insult.; C. Cancel cooling because a seizure is present — Seizures may support moderate/severe encephalopathy.", "pearl": "Integrated management reduces avoidable additional brain injury.", "srcAnswer": "D"}, {"num": 114, "level": "Clinical/Application", "question": "A 3-day-old boy becomes lethargic after feeding. Ammonia is 690 µmol/L, anion gap 10, plasma citrulline low, and urine orotic acid markedly elevated. Which enzyme defect is most likely?", "options": ["Ornithine transcarbamylase deficiency", "Carbamoyl phosphate synthetase 1 deficiency", "Argininosuccinate synthetase deficiency", "Propionyl-CoA carboxylase deficiency"], "answer": 0, "explanation": "OTC block diverts excess carbamoyl phosphate to orotic acid production. Closest distractor: Low citrulline alone cannot separate OTC from CPS1; urinary orotic acid does. Why not the others: B. Carbamoyl phosphate synthetase 1 deficiency — Low citrulline fits, but orotic acid is usually low.; C. Argininosuccinate synthetase deficiency — Citrulline is typically markedly elevated.; D. Propionyl-CoA carboxylase deficiency — Organic acidemia usually causes high-anion-gap ketoacidosis.", "pearl": "Treat hyperammonemia immediately while confirming the metabolic diagnosis.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 10 Q65 — OTC versus CPS1 orotic acid"}}, {"num": 115, "level": "Integrated/Rank-Differentiating", "question": "A 25-week infant with new ventilator instability has FiO₂ 0.7, unilateral absent breath sounds, MAP 23, glucose 34 and an aEEG burst of abnormal activity. Which immediate sequence minimizes secondary injury?", "options": ["Proceed to MRI immediately", "Give three rapid fluid boluses before chest assessment", "Check airway/circuit and decompress suspected tension air leak while supporting ventilation; correct glucose and assess EEG after stabilization", "Start antiseizure medication before addressing ventilation"], "answer": 2, "explanation": "The airway and obstructive shock threat comes before etiologic neurologic testing. Closest distractor: Life-threatening physiology outranks isolated monitor abnormalities. Why not the others: A. Proceed to MRI immediately — Imaging delays life-saving stabilization and correction of glucose.; B. Give three rapid fluid boluses before chest assessment — This ignores an obstructive air-leak cause of shock.; D. Start antiseizure medication before addressing ventilation — An untreated tension pneumothorax can rapidly cause cardiovascular collapse.", "pearl": "Integrated stabilization prevents avoidable hypoxic and hypoglycemic brain injury.", "srcAnswer": "C"}, {"num": 116, "level": "Integrated/Rank-Differentiating", "question": "A 3-day-old with severe hypoglycemia has insulin below assay detection, BOHB 0.1, FFA 0.15 and glucagon glucose rise 36 mg/dL. A colleague dismisses hyperinsulinism. What is the best response?", "options": ["FFA suppression indicates FAOD", "Biochemical insulin action is present despite undetectable measured insulin; evaluate/treat hyperinsulinism", "Undetectable insulin conclusively excludes excess insulin action", "Glucagon rise excludes insulin-mediated hypoglycemia"], "answer": 1, "explanation": "The combined fuel suppression and glucagon response indicate inappropriate insulin effect. Closest distractor: Functional evidence can be stronger than one hormone assay. Why not the others: A. FFA suppression indicates FAOD — FAOD generally has elevated FFA.; C. Undetectable insulin conclusively excludes excess insulin action — Suppressed fuels and glucagon response contradict this.; D. Glucagon rise excludes insulin-mediated hypoglycemia — A rise ≥30 mg/dL supports insulin action.", "pearl": "Prevents delayed recognition of a treatable neuroglycopenic disorder.", "srcAnswer": "B"}, {"num": 117, "level": "Integrated/Rank-Differentiating", "question": "A 27-week infant on day 5 has NEC-like distension, rising lactate, large left-to-right PDA with aortic diastolic reversal, and no pneumatosis. Which plan is most defensible?", "options": ["Continue full feeds without monitoring because film is negative", "Stabilize gut/perfusion, investigate evolving NEC and reassess hsPDA contribution without attributing all bowel findings to one cause", "Label definite NEC solely from ductal steal", "Close PDA immediately and ignore bowel assessment"], "answer": 1, "explanation": "Ductal steal and intestinal disease can coexist; both need evaluation. Closest distractor: Perfusion association does not establish NEC or mandate ductal closure. Why not the others: A. Continue full feeds without monitoring because film is negative — Early NEC can precede radiographic signs.; C. Label definite NEC solely from ductal steal — No pneumatosis or definite NEC proof yet.; D. Close PDA immediately and ignore bowel assessment — Distension/lactate may signal evolving NEC.", "pearl": "Integrated hemodynamic and surgical reasoning prevents anchoring.", "srcAnswer": "B"}, {"num": 118, "level": "Integrated/Rank-Differentiating", "question": "A 25-week infant with severe IVH, high-threshold PHVD and absent fidgety movements at 4 months corrected age is assessed for prognosis. Which statement is most defensible?", "options": ["An absent fidgety pattern alone proves a fixed CP subtype", "Neurosurgical treatment guarantees normal neurodevelopment", "Normal head circumference excludes PHVD sequelae", "High CP risk warrants early intervention and multidisciplinary follow-up, but no single scan or HINE cutoff predicts exact outcome"], "answer": 3, "explanation": "PHVD trajectory and GMA findings together indicate high developmental risk. Closest distractor: Risk prediction is probabilistic, not absolute. Why not the others: A. An absent fidgety pattern alone proves a fixed CP subtype — Prediction is strong but clinical diagnosis evolves.; B. Neurosurgical treatment guarantees normal neurodevelopment — Early intervention reduces secondary injury but cannot reverse all primary damage.; C. Normal head circumference excludes PHVD sequelae — Ventricular measurements and injury matter more.", "pearl": "Start therapy while monitoring motor, vision, hearing and cognition.", "srcAnswer": "D"}, {"num": 119, "level": "Integrated/Rank-Differentiating", "question": "A 25-week infant has suspected NEC, thrombocytopenia, pH 7.18 and glucose 32 mg/dL; bedside film shows intramural gas. Which priority order is best?", "options": ["Stop feeds/decompress, correct glucose and perfusion, obtain cultures and start antibiotics/PN with surgical surveillance", "Delay glucose correction until the antibiotic course is complete", "Operate immediately solely because platelets are low", "Continue feeds because pneumatosis alone does not indicate NEC"], "answer": 0, "explanation": "Definite NEC and metabolic instability need simultaneous stabilization and etiologic management. Closest distractor: Pneumatosis mandates NEC care, not necessarily immediate laparotomy. Why not the others: B. Delay glucose correction until the antibiotic course is complete — Hypoglycemia is immediately harmful.; C. Operate immediately solely because platelets are low — Surgical indication requires trajectory/free air/peritonitis.; D. Continue feeds because pneumatosis alone does not indicate NEC — Intramural gas supports definite NEC.", "pearl": "Integrates bowel, infection, metabolic and surgical decision points.", "srcAnswer": "A"}, {"num": 120, "level": "Integrated/Rank-Differentiating", "question": "A term infant with severe pneumonia, PPHN, hypoglycemia and reduced LV function remains hypoxemic despite FiO₂ 1.0. What is the most rational immediate bundle?", "options": ["Give only more oxygen without ventilatory recruitment", "Give iNO without checking ventricular function", "Optimize lung recruitment, correct glucose, assess/treat LV perfusion and use echo-guided pulmonary vasodilation", "Stop glucose infusion to reduce pulmonary edema"], "answer": 2, "explanation": "Multiple reversible contributors require coordinated treatment. Closest distractor: PPHN management is not one-drug therapy. Why not the others: A. Give only more oxygen without ventilatory recruitment — FiO₂ alone may not fix shunt or atelectasis.; B. Give iNO without checking ventricular function — LV failure may worsen with indiscriminate vasodilation.; D. Stop glucose infusion to reduce pulmonary edema — Hypoglycemia must be treated; fluid composition can be optimized.", "pearl": "Tests prioritization of lung, circulation and metabolic stabilization.", "srcAnswer": "C"}, {"num": 121, "level": "Integrated/Rank-Differentiating", "question": "A 4-day-old infant has seizures, ammonia 720 µmol/L, glucose 43, normal anion gap, low citrulline and high urinary orotic acid. Which combined action is best?", "options": ["Treat hypoglycemia, initiate UCD anti-catabolic/scavenger therapy and urgent ammonia clearance planning", "Give protein loading to confirm UCD", "Assume organic acidemia because every hyperammonemia has ketoacidosis", "Treat only seizures and wait for molecular confirmation"], "answer": 0, "explanation": "OTC-type UCD crisis and hypoglycemia need simultaneous stabilization. Closest distractor: Diagnosis and neuroprotection proceed before genetic confirmation. Why not the others: B. Give protein loading to confirm UCD — This can worsen nitrogen toxicity.; C. Assume organic acidemia because every hyperammonemia has ketoacidosis — Normal gap and high orotic acid favor OTC.; D. Treat only seizures and wait for molecular confirmation — Hyperammonemia causes ongoing brain injury.", "pearl": "Integrates metabolic pattern recognition with emergency sequencing.", "srcAnswer": "A"}, {"num": 122, "level": "Integrated/Rank-Differentiating", "question": "A 36-week infant after resuscitation is lethargic, has metabolic acidosis and electrographic seizures at 3 hours; mild meconium aspiration is also present. Which plan is best?", "options": ["Use a normal 10-minute Apgar to reject HIE automatically", "Assess moderate/severe HIE cooling eligibility now, stabilize oxygenation and treat electrographic seizures concurrently", "Exclude HIE because meconium aspiration explains hypoxemia", "Wait until 12 hours to determine if encephalopathy persists"], "answer": 1, "explanation": "The time-critical cooling decision coexists with respiratory and seizure management. Closest distractor: Do not let a competing pulmonary diagnosis obscure encephalopathy. Why not the others: A. Use a normal 10-minute Apgar to reject HIE automatically — Apgar alone does not define or exclude encephalopathy.; C. Exclude HIE because meconium aspiration explains hypoxemia — Respiratory disease and HIE may coexist.; D. Wait until 12 hours to determine if encephalopathy persists — Standard cooling window begins within 6 hours.", "pearl": "Early multimodal assessment preserves the hypothermia treatment window.", "srcAnswer": "B"}, {"num": 123, "level": "Integrated/Rank-Differentiating", "question": "A 28-week infant has Zone II stage 2 plus ROP, persistent oxygen need and Jensen Grade 2 BPD at 36 weeks PMA. What integrated care plan is best?", "options": ["Delay ROP until BPD resolves", "Assume Grade 2 BPD means invasive ventilation", "Arrange timely Type 1 ROP treatment assessment, optimize respiratory support and ensure prolonged vision/development follow-up", "Treat BPD with propranolol to reverse ROP"], "answer": 2, "explanation": "ROP treatment threshold and BPD severity are independent classifications needing parallel care. Closest distractor: Grade 2 BPD is noninvasive support or >2 L/min nasal cannula. Why not the others: A. Delay ROP until BPD resolves — Type 1 ROP is time-sensitive.; B. Assume Grade 2 BPD means invasive ventilation — Grade 3 is invasive ventilation.; D. Treat BPD with propranolol to reverse ROP — Propranolol is not routine ROP therapy.", "pearl": "Prematurity complications require coordinated rather than sequential care.", "srcAnswer": "C"}, {"num": 124, "level": "Integrated/Rank-Differentiating", "question": "A 29-week infant after NEC surgery has 25 cm of residual small bowel, high stoma output and recurrent electrolyte depletion. Which long-term focus is essential?", "options": ["Ignore sodium losses because PN contains electrolytes", "Stop all enteral stimulation permanently", "Intestinal rehabilitation with individualized enteral/PN balance, fluid-electrolyte replacement and growth monitoring", "Treat only recurrent sepsis without nutrition planning"], "answer": 2, "explanation": "Short-bowel physiology creates malabsorption, dehydration and central-line risks. Closest distractor: Surgical survival does not end NEC morbidity. Why not the others: A. Ignore sodium losses because PN contains electrolytes — High-output stomas may cause major losses.; B. Stop all enteral stimulation permanently — Adaptation benefits from individualized enteral nutrition when feasible.; D. Treat only recurrent sepsis without nutrition planning — Short bowel requires coordinated nutrition and infection care.", "pearl": "Growth and intestinal adaptation are central long-term outcomes.", "srcAnswer": "C"}, {"num": 125, "level": "Integrated/Rank-Differentiating", "question": "A 39-week cooled infant has no EEG seizures after day 2, mild watershed MRI injury, normal hearing screen, and poor visual tracking at 3 months corrected age. Which follow-up decision is best?", "options": ["Wait until school age for visual assessment", "Discharge from follow-up because the hearing screen passed", "Continue phenobarbital indefinitely to improve vision", "Arrange formal vision/developmental evaluation despite reassuring EEG and newborn hearing results"], "answer": 3, "explanation": "HIE sequelae can emerge in domains not reflected by seizure resolution. Closest distractor: A normal hearing test does not exclude cortical visual impairment. Why not the others: A. Wait until school age for visual assessment — Early visual problems merit timely assessment/intervention.; B. Discharge from follow-up because the hearing screen passed — Hearing and vision are independent domains.; C. Continue phenobarbital indefinitely to improve vision — ASM does not treat cortical visual dysfunction.", "pearl": "Neurodevelopmental follow-up is domain-specific, not a single pass/fail test.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 7',href:'Day12/quiz7.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet7_Q109-125_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 7 — Wrong Answer Report</h1><p><b>Questions:</b> 109–125</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['7']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['7']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 7 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
