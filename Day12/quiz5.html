<script>
const quiz=[{"num": 73, "level": "Clinical/Application", "question": "A preterm infant after medically treated NEC has recurrent bilious emesis and abdominal distension 5 weeks later. Which complication must be considered?", "options": ["Post-NEC intestinal stricture", "Congenital pyloric stenosis by default", "Physiologic gastric residuals only", "Delayed isolated ROP recurrence"], "answer": 0, "explanation": "Healing after NEC can produce fibrotic intestinal narrowing. Closest distractor: Late stricture versus acute active NEC. Why not the others: B. Congenital pyloric stenosis by default — Bilious obstruction and NEC history favor stricture.; C. Physiologic gastric residuals only — Persistent bilious emesis requires obstruction workup.; D. Delayed isolated ROP recurrence — This would not cause obstructive GI symptoms.", "pearl": "Follow-up must include obstruction, growth and short-bowel complications.", "srcAnswer": "A"}, {"num": 74, "level": "Clinical/Application", "question": "A 4-day-old has ammonia 900 µmol/L, no major acidosis and lethargy despite initial scavenger treatment. What is the next urgent escalation?", "options": ["Observe for 12 hours without change", "Arrange rapid extracorporeal ammonia clearance with continued anti-catabolic therapy and specialist input", "Start a high-protein feed immediately", "Use oral lactulose as sole definitive treatment"], "answer": 1, "explanation": "Very high or rising ammonia needs urgent clearance while preventing catabolism. Closest distractor: Hemodialysis/CRRT consultation versus waiting for genetic confirmation. Why not the others: A. Observe for 12 hours without change — Severe ammonia causes ongoing neurotoxicity.; C. Start a high-protein feed immediately — Nitrogen load can worsen hyperammonemia.; D. Use oral lactulose as sole definitive treatment — This is insufficient for severe neonatal UCD crisis.", "pearl": "Brain injury risk rises with ammonia concentration and duration.", "srcAnswer": "B"}, {"num": 75, "level": "Clinical/Application", "question": "A 29-week infant with a large PDA has oliguria and echo showing low diastolic aortic flow; lactate rises while BP remains near normal. What is the key inference?", "options": ["Normal BP excludes ductal steal", "A large PDA cannot affect mesenteric or renal perfusion", "Oliguria proves intrinsic renal malformation", "Systemic hypoperfusion may exist despite a near-normal mean arterial pressure"], "answer": 3, "explanation": "Ductal steal can impair end-organ flow independently of MAP. Closest distractor: Perfusion markers and echo trump BP alone. Why not the others: A. Normal BP excludes ductal steal — Organ perfusion can be abnormal before hypotension.; B. A large PDA cannot affect mesenteric or renal perfusion — Diastolic runoff can reduce systemic organ flow.; C. Oliguria proves intrinsic renal malformation — Hemodynamic renal hypoperfusion is plausible.", "pearl": "A normal BP should not falsely reassure when organ output deteriorates.", "srcAnswer": "D"}, {"num": 76, "level": "High-Difficulty", "question": "A 60-hour-old neonate has glucose 53 mg/dL and no symptoms. A question asks which framework first considers this beyond its usual transitional window. What is correct?", "options": ["CPS and PES both use 24 hours", "Neither framework distinguishes transition from persistence", "PES (48-hour transition), not CPS (72-hour transition)", "CPS alone because its transition is 48 hours"], "answer": 2, "explanation": "PES raises target after 48 hours; CPS defines persistent hypoglycemia after 72 hours. Closest distractor: Same patient, different framework-dependent classification. Why not the others: A. CPS and PES both use 24 hours — Neither uses 24 hours as the principal transition point.; B. Neither framework distinguishes transition from persistence — Both explicitly do.; D. CPS alone because its transition is 48 hours — CPS uses 72 hours.", "pearl": "Time-window words are high-value close distractors.", "srcAnswer": "C"}, {"num": 77, "level": "High-Difficulty", "question": "A 24-week infant at day 7 has sudden free air with minimal preceding feeding exposure, no pneumatosis and relatively localized abdominal pathology. Which differential is particularly important?", "options": ["Severe constipation", "Spontaneous intestinal perforation rather than classic widespread NEC", "An isolated feeding residual", "Pure TTN"], "answer": 1, "explanation": "Early focal perforation without widespread NEC changes favors SIP. Closest distractor: SIP and NEC can both perforate but differ in antecedent course/imaging. Why not the others: A. Severe constipation — Constipation does not explain pneumoperitoneum.; C. An isolated feeding residual — A residual does not cause radiographic free gas.; D. Pure TTN — Respiratory fluid retention is unrelated to bowel free air.", "pearl": "Recognize a surgical bowel emergency without forcing NEC label.", "srcAnswer": "B"}, {"num": 78, "level": "High-Difficulty", "question": "A 25-week infant at 5 minutes needs respiratory support; SpO₂ remains 68% on FiO₂ 0.21 despite effective PPV. A colleague cites an older universal 21–30% preterm starting rule. What is the best evidence-aware adjustment?", "options": ["Switch immediately to 100% and leave it unchanged", "Abandon ventilation because SpO₂ is low", "Keep 21% for 10 minutes to avoid ROP", "Increase FiO₂ promptly with preductal titration; 2025 guidance allows 30–100% initial oxygen for <32 weeks"], "answer": 3, "explanation": "International 2025 AHA/AAP oxygen starting ranges differ by gestation; <32 weeks may require higher initial oxygen. Closest distractor: Do not conflate an initial FiO₂ range with an unchanging target. Why not the others: A. Switch immediately to 100% and leave it unchanged — High oxygen may be needed transiently but should not remain fixed.; B. Abandon ventilation because SpO₂ is low — Effective ventilation remains essential alongside oxygen titration.; C. Keep 21% for 10 minutes to avoid ROP — Prolonged hypoxemia is harmful; titration is required.", "pearl": "The updated guideline avoids both persistent hypoxia and unmonitored hyperoxia.", "srcAnswer": "D"}, {"num": 79, "level": "High-Difficulty", "question": "A 35+3-week infant with moderate encephalopathy presents at 4 hours after profound acidosis. Under NNF India selection criteria, how should eligibility for therapeutic hypothermia be interpreted? (Contrast the international AAP discussion only after deciding the Indian standard.)", "options": ["Evidence is limited at 35–35+6 weeks; consider specialist risk–benefit discussion rather than automatic cooling", "Cooling is forbidden at exactly 35 weeks regardless of circumstances", "Cooling is absolutely recommended for every 35-week infant", "Standard trial evidence is equally strong from 34 weeks"], "answer": 0, "explanation": "NNF India routine therapeutic hypothermia selection uses ≥36 weeks; the 35-week discussion in AAP is international evidence, not an Indian standard indication. Closest distractor: 35-week individualization versus ≥36-week standard eligibility. Why not the others: B. Cooling is forbidden at exactly 35 weeks regardless of circumstances — The report allows carefully considered discussion at 35 weeks.; C. Cooling is absolutely recommended for every 35-week infant — Evidence and safety uncertainty require individualization.; D. Standard trial evidence is equally strong from 34 weeks — Major trials predominantly enrolled ≥36 weeks.", "pearl": "Source-year updates matter when gestational thresholds are tested.", "srcAnswer": "A"}, {"num": 80, "level": "High-Difficulty", "question": "A 27-week infant has Zone I stage 3 ROP without plus, clear media and posterior avascular retina. A clinician proposes observation until plus develops. What is the best rebuttal?", "options": ["Anti-VEGF is mandatory for all Zone I disease regardless of stage", "Treatment must wait for stage 4 detachment", "Zone I stage 3 already meets Type 1; assess prompt treatment and then individualize laser versus anti-VEGF", "Without plus, all zone I disease is Type 2"], "answer": 2, "explanation": "ETROP Type 1 includes Zone I stage 3 without plus. Closest distractor: Indication to treat is distinct from treatment modality. Why not the others: A. Anti-VEGF is mandatory for all Zone I disease regardless of stage — Treatment choice is individualized.; B. Treatment must wait for stage 4 detachment — This misses the pre-detachment treatment window.; D. Without plus, all zone I disease is Type 2 — Stage 3 is the exception.", "pearl": "Two-step decisions prevent delayed treatment in posterior disease.", "srcAnswer": "C"}, {"num": 81, "level": "High-Difficulty", "question": "A 38-week infant with PPHN receives iNO, but oxygenation worsens and echo now shows LV dysfunction, elevated LA pressure and pulmonary edema. What is the best mechanistic explanation?", "options": ["Pulmonary vasodilation increased flow into a failing LV, aggravating pulmonary venous congestion", "The ductus necessarily became anatomically closed", "iNO directly caused surfactant gene deletion", "Every PPHN patient requires higher iNO despite edema"], "answer": 0, "explanation": "In LV failure, lowering PVR may increase pulmonary venous return beyond LV capacity. Closest distractor: PPHN with postcapillary congestion differs from isolated precapillary vasoconstriction. Why not the others: B. The ductus necessarily became anatomically closed — No closure evidence is given.; C. iNO directly caused surfactant gene deletion — This does not explain acute edema.; D. Every PPHN patient requires higher iNO despite edema — Escalation must consider LV phenotype.", "pearl": "Echo phenotype should guide vasodilator and circulatory therapy.", "srcAnswer": "A"}, {"num": 82, "level": "High-Difficulty", "question": "A 1.4-kg infant must receive GIR 8 mg/kg/min at restricted fluid 100 mL/kg/day. What dextrose concentration is required?", "options": ["Approximately D8.0", "Approximately D5.6", "Approximately D11.5", "Approximately D14.4"], "answer": 2, "explanation": "Dextrose % = 8×144/100 = 11.52%. Closest distractor: The dextrose percentage is not numerically equal to GIR. Why not the others: A. Approximately D8.0 — This omits the 144/day conversion.; B. Approximately D5.6 — This halves the required carbohydrate.; D. Approximately D14.4 — This misplaces fluid and GIR factors.", "pearl": "Fluid restriction changes concentration needed for the same glucose delivery.", "srcAnswer": "C"}, {"num": 83, "level": "High-Difficulty", "question": "A 37-week infant with pH 7.02 at birth is alert at 2 hours, then develops unequivocal electrographic seizures and lethargy at 4 hours. Which action best follows evolving HIE assessment?", "options": ["Wait for day-5 MRI to decide cooling", "Reassess encephalopathy immediately for cooling eligibility within 6 hours rather than relying on the earlier normal exam", "Exclude cooling permanently because the 2-hour exam was normal", "Treat seizures only and ignore systemic injury evidence"], "answer": 1, "explanation": "Eligibility is based on the evolving early clinical state and trial criteria. Closest distractor: Early normal examination is not a lifetime exclusion when status changes before 6 hours. Why not the others: A. Wait for day-5 MRI to decide cooling — This forfeits time-sensitive treatment.; C. Exclude cooling permanently because the 2-hour exam was normal — Neurologic signs may evolve within the window.; D. Treat seizures only and ignore systemic injury evidence — Seizures and encephalopathy require integrated assessment.", "pearl": "Serial neurologic examination can preserve an otherwise missed cooling opportunity.", "srcAnswer": "B"}, {"num": 84, "level": "High-Difficulty", "question": "A 29-week infant on ventilation develops rising FiO₂ and a new murmur. CXR is low-volume and granular; echo shows small left-to-right PDA without diastolic steal. Which initial treatment best addresses the dominant physiology?", "options": ["Immediate ductal ligation", "Give repeated rapid fluid boluses", "Start sildenafil as primary therapy", "Optimize RDS ventilation and consider surfactant; do not close the small PDA solely because it is present"], "answer": 3, "explanation": "RDS radiography and absent hsPDA markers point to parenchymal lung disease. Closest distractor: Murmur presence is not proof of hemodynamically significant ductus. Why not the others: A. Immediate ductal ligation — Small PDA without systemic steal is unlikely to explain the acute RDS pattern.; B. Give repeated rapid fluid boluses — This may worsen pulmonary edema and cerebral flow fluctuations.; C. Start sildenafil as primary therapy — No evidence of severe PPHN physiology is provided.", "pearl": "Treat the dominant cause of respiratory deterioration, not the most noticeable echo finding.", "srcAnswer": "D"}, {"num": 85, "level": "High-Difficulty", "question": "A 27-week infant with Bell II NEC develops rising lactate, platelets 34,000, escalating pressors and a fixed dilated loop but no free air. Which next decision is most appropriate?", "options": ["Increase enteral feeds to stimulate motility", "Wait for free air as the only permissible surgical indication", "Stop antibiotics because cultures are negative", "Urgent repeat surgical assessment; worsening systemic/abdominal findings can require surgery without pneumoperitoneum"], "answer": 3, "explanation": "Progressive shock, thrombocytopenia and fixed loop suggest severe intestinal compromise. Closest distractor: Absence of free air does not exclude transmural necrosis. Why not the others: A. Increase enteral feeds to stimulate motility — Feeds remain contraindicated during active NEC.; B. Wait for free air as the only permissible surgical indication — Deterioration and fixed loop are concerning.; C. Stop antibiotics because cultures are negative — Clinical NEC may have negative blood cultures.", "pearl": "Escalation is based on trajectory, not one radiographic threshold.", "srcAnswer": "D"}, {"num": 86, "level": "High-Difficulty", "question": "A 27-week infant’s ductus measures 2.2 mm, but LA/Ao is 1.1, no diastolic reversal and respiratory support is falling. What is the best critique of “large PDA = treat”?", "options": ["All infants with ducts >2 mm need ligation", "Ductal diameter without flow/perfusion consequences is insufficient for treatment decision", "Normal LA/Ao rules out any future PDA effects", "2.2 mm proves irreversible pulmonary hypertension"], "answer": 1, "explanation": "Shunt physiology depends on resistance, flow and systemic consequences. Closest distractor: Size is not synonymous with hemodynamic significance. Why not the others: A. All infants with ducts >2 mm need ligation — No universal diameter-only mandate exists.; C. Normal LA/Ao rules out any future PDA effects — Serial assessment may still be needed.; D. 2.2 mm proves irreversible pulmonary hypertension — Size does not define pulmonary vascular resistance.", "pearl": "Avoid binary decisions from a single echo dimension.", "srcAnswer": "B"}, {"num": 87, "level": "High-Difficulty", "question": "A 24-week infant with progressive PHVD has VI p97+5 mm, AHW 11 mm and TOD 31 mm, but no fontanelle bulge. What is the best next step? [Interpret Visual Station 6 alongside the clinical data.]", "options": ["Urgent neonatal-neurosurgical review for temporizing drainage planning based on high-threshold trajectory", "Automatic permanent VP shunt without assessing weight/CSF/infection", "Monthly ultrasound only because fontanelle is flat", "Give acetazolamide plus furosemide as standard definitive therapy"], "answer": 0, "explanation": "High-threshold serial measurements warrant urgent escalation. Closest distractor: Threshold crossing triggers a pathway, not automatic permanent hardware. Why not the others: B. Automatic permanent VP shunt without assessing weight/CSF/infection — Definitive shunt readiness is individualized.; C. Monthly ultrasound only because fontanelle is flat — Clinical signs may lag.; D. Give acetazolamide plus furosemide as standard definitive therapy — This regimen is not recommended for PHVD.", "pearl": "The 2026 ELVIS reanalysis favors avoiding delayed measurement-led intervention.", "srcAnswer": "A"}, {"num": 88, "level": "High-Difficulty", "question": "A 25-week infant’s cranial US shows a unilateral wedge-shaped echogenic parenchymal lesion next to a grade III IVH. What diagnosis best accounts for the asymmetry?", "options": ["Subarachnoid hemorrhage only", "Symmetric cystic PVL", "Periventricular hemorrhagic venous infarction", "Normal choroid plexus"], "answer": 2, "explanation": "PVHI often appears as unilateral wedge-shaped hemorrhagic venous infarction. Closest distractor: PVHI versus bilateral ischemic PVL. Why not the others: A. Subarachnoid hemorrhage only — The lesion is periventricular parenchymal.; B. Symmetric cystic PVL — PVL usually develops as white-matter injury and is often bilateral.; D. Normal choroid plexus — Wedge-shaped extraventricular lesion is abnormal.", "pearl": "Modern terminology changes interpretation and prognosis.", "srcAnswer": "C"}, {"num": 89, "level": "High-Difficulty", "question": "A 37-week infant with severe hypoxemia has preductal SpO₂ 96%, postductal 82%, right-to-left PDA shunt and reduced LV shortening fraction. Which step should accompany oxygenation optimization before indiscriminate vasodilator escalation?", "options": ["Give maximal inhaled NO without reassessing LV function", "Detailed echo-guided assessment of LV function and systemic perfusion", "Close the ductus urgently with ibuprofen", "Ignore the pre/postductal difference because PPHN cannot cause it"], "answer": 1, "explanation": "PPHN with LV dysfunction needs phenotype-specific hemodynamic management. Closest distractor: iNO responsiveness differs when LV dysfunction/pulmonary venous hypertension predominates. Why not the others: A. Give maximal inhaled NO without reassessing LV function — Severe LV dysfunction can make pulmonary vasodilation hazardous.; C. Close the ductus urgently with ibuprofen — Right-to-left ductal shunting reflects high PVR and may support systemic output.; D. Ignore the pre/postductal difference because PPHN cannot cause it — Differential saturation supports right-to-left ductal shunt.", "pearl": "A shunt pattern must be interpreted alongside ventricular function.", "srcAnswer": "B"}, {"num": 90, "level": "Clinical/Application", "question": "A 5-day-old infant has plasma glucose 32 mg/dL, BOHB 0.1 mmol/L, FFA 0.12 mmol/L, insulin below assay detection and a 38 mg/dL glucose rise after glucagon. Which mechanism is most consistent?", "options": ["Isolated growth-hormone deficiency proven by these results", "Starvation response", "Excess insulin action despite undetectable insulin", "MCAD deficiency"], "answer": 2, "explanation": "Suppressed ketones and FFA with glucagon response ≥30 mg/dL strongly indicate insulin action. Closest distractor: Functional markers can identify hyperinsulinism even if insulin assay is negative. Why not the others: A. Isolated growth-hormone deficiency proven by these results — Hormone deficiency is not proven; fuel suppression and glucagon response favor insulin.; B. Starvation response — Appropriate starvation raises ketones and FFA.; D. MCAD deficiency — FAOD usually produces elevated FFA, not profound suppression.", "pearl": "A single undetectable insulin measurement is not an exclusion test.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q50 — hyperinsulinism critical sample"}}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 5',href:'Day12/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet5_Q73-90_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 73–90</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
