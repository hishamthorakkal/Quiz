<script>
const quiz=[{"num": 37, "level": "Clinical/Application", "question": "A 39-week infant at 4 hours has lethargy, weak suck, hypotonia, pH 6.95 and base deficit 18 mmol/L after placental abruption. Which time-critical action is indicated?", "options": ["Wait for MRI before cooling", "Start eligibility-confirmed servo-controlled cooling while continuing stabilization", "Give phenobarbital prophylactically instead of cooling", "Observe until 24 hours because seizures are absent"], "answer": 1, "explanation": "Biochemical and neurological evidence strongly supports cooling evaluation within the window. Closest distractor: Moderate/severe encephalopathy can qualify without overt seizures. Why not the others: A. Wait for MRI before cooling — MRI delays the <6-hour therapeutic window.; C. Give phenobarbital prophylactically instead of cooling — ASM does not replace neuroprotection.; D. Observe until 24 hours because seizures are absent — Seizures are not required for moderate/severe HIE.", "pearl": "Initiate cooling based on early clinical criteria, not late imaging.", "srcAnswer": "B"}, {"num": 38, "level": "Clinical/Application", "question": "A cooled infant at 18 hours has repeated rhythmic electrographic seizures but no visible movements. What is the appropriate principle? [Interpret Visual Station 1 alongside the clinical data.]", "options": ["Treat EEG-confirmed seizures and reassess electrographic response", "Ignore seizures without motor correlate", "Stop cooling to improve EEG visibility", "Give repeated glucose boluses despite normal glucose"], "answer": 0, "explanation": "Seizure burden is electrographic and needs treatment/monitoring. Closest distractor: Clinical quietness does not equal seizure control. Why not the others: B. Ignore seizures without motor correlate — Electrographic-only seizures may cause additional burden.; C. Stop cooling to improve EEG visibility — Cooling should not be stopped solely for seizures.; D. Give repeated glucose boluses despite normal glucose — Normoglycemia does not treat ictal discharges.", "pearl": "EEG response, not disappearance of jerking, confirms control.", "srcAnswer": "A"}, {"num": 39, "level": "Clinical/Application", "question": "A 35-week newborn requires positive-pressure ventilation after birth. Under the current IAP-NNF Indian resuscitation approach, with preductal oximetry available, what initial oxygen strategy is reasonable?", "options": ["100% for every depressed neonate", "21% with rapid preductal SpO₂-guided titration", "50% fixed for 10 minutes", "30–100% solely because the infant is late preterm"], "answer": 1, "explanation": "For infants ≥35 weeks, initial air is reasonable during respiratory support. Closest distractor: 2025 gestation-specific starting oxygen versus outdated universal rule. Why not the others: A. 100% for every depressed neonate — Routine high oxygen at ≥35 weeks is not recommended.; C. 50% fixed for 10 minutes — Fixed FiO₂ ignores pulse-oximetry targets.; D. 30–100% solely because the infant is late preterm — That range is considered for <32 weeks.", "pearl": "Initial oxygen is a starting point, not a fixed concentration.", "srcAnswer": "B"}, {"num": 40, "level": "Clinical/Application", "question": "A 25-week infant has abrupt abdominal discoloration, metabolic acidosis and pneumoperitoneum. What is the immediate implication?", "options": ["Wait 72 hours for repeat radiographs", "Restart milk feeds to restore gut motility", "Give a laxative and observe", "Urgent surgical consultation and stabilization for bowel perforation"], "answer": 3, "explanation": "Pneumoperitoneum indicates perforation requiring urgent surgical pathway. Closest distractor: Definite NEC with free air versus uncomplicated Bell II disease. Why not the others: A. Wait 72 hours for repeat radiographs — Free air is an emergency finding.; B. Restart milk feeds to restore gut motility — Feeding is contraindicated with suspected perforation.; C. Give a laxative and observe — This cannot treat perforated intestine.", "pearl": "A surgical indication can be present before a complete etiologic label.", "srcAnswer": "D"}, {"num": 41, "level": "Clinical/Application", "question": "A 30-week infant loses 7% of birth weight over 72 hours, develops good urine output, and serum Na rises mildly from 137 to 143 mmol/L. The infant is otherwise stable. What physiology best explains this pattern?", "options": ["Primary hyperaldosteronism in every preterm infant", "Acute SIADH with water retention", "Complete inability of neonatal kidneys to excrete sodium", "Expected extracellular-fluid contraction with postnatal diuresis and natriuresis"], "answer": 3, "explanation": "Early physiologic weight loss reflects ECF contraction and renal water/sodium adaptation. Closest distractor: Weight and urine trends must be interpreted with sodium, not one isolated value. Why not the others: A. Primary hyperaldosteronism in every preterm infant — There is no evidence of pathologic mineralocorticoid excess.; B. Acute SIADH with water retention — SIADH more often produces hyponatremia and low urine output.; C. Complete inability of neonatal kidneys to excrete sodium — Diuresis and natriuresis are normal adaptive processes.", "pearl": "Do not automatically give sodium in the first days without checking physiology.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 10 Q15 — postnatal natriuresis"}}, {"num": 42, "level": "Clinical/Application", "question": "A 26-week infant with stage III IVH has VI rising above p97 and AHW 8 mm, but head circumference is unchanged. What should guide the next decision? [Interpret Visual Station 6 alongside the clinical data.]", "options": ["Serial ventricular measurements and early specialist escalation rather than waiting for bulging fontanelle", "Perform permanent VP shunt automatically at first abnormal scan", "Ignore TOD and AHW because VI alone is irrelevant", "Wait for head circumference to rise by 3 cm"], "answer": 0, "explanation": "Progressive PHVD is detected by cUS before clinical pressure signs. Closest distractor: Low-threshold measurements prompt timely escalation, not a one-number operation. Why not the others: B. Perform permanent VP shunt automatically at first abnormal scan — Thresholds trigger evaluation, not automatic definitive shunting.; C. Ignore TOD and AHW because VI alone is irrelevant — Combined metrics guide PHVD trajectory.; D. Wait for head circumference to rise by 3 cm — Pressure signs may lag in preterm skulls.", "pearl": "Early measurement-led pathways may reduce secondary brain injury.", "srcAnswer": "A"}, {"num": 43, "level": "Clinical/Application", "question": "A 37-week infant with severe hypoxemia has preductal SpO₂ 95% and postductal 80%, echo shows right-to-left PDA and normal anatomy. What is the dominant physiology?", "options": ["Isolated neonatal hypoglycemia", "Simple TTN with no shunt", "Elevated PVR with right-to-left ductal shunting consistent with PPHN", "A large left-to-right PDA causing systemic steal"], "answer": 2, "explanation": "Right-to-left ductal flow supplies desaturated blood to descending aorta. Closest distractor: Differential cyanosis points to ductal shunt but still needs echo. Why not the others: A. Isolated neonatal hypoglycemia — It does not cause the described differential saturation.; B. Simple TTN with no shunt — Echo demonstrates right-to-left ductal flow.; D. A large left-to-right PDA causing systemic steal — That would not explain higher preductal saturation from right-to-left mixing.", "pearl": "Assess PPHN severity and reversible triggers.", "srcAnswer": "C"}, {"num": 44, "level": "Clinical/Application", "question": "A 4-day-old infant has recurrent glucose 47 mg/dL; the stem explicitly asks for CPS persistent-hypoglycemia target. What is the target?", "options": ["At least 8.0 mmol/L", "At least 3.3 mmol/L (about 60 mg/dL)", "At least 2.0 mmol/L", "At least 2.6 mmol/L only"], "answer": 1, "explanation": "Beyond 72 hours CPS targets ≥3.3 mmol/L. Closest distractor: Target versus critical-sample threshold (2.8 mmol/L). Why not the others: A. At least 8.0 mmol/L — This is not a standard target and risks excess dextrose.; C. At least 2.0 mmol/L — This is below CPS persistent target.; D. At least 2.6 mmol/L only — This is the transitional target.", "pearl": "Do not carry the 72-hour transitional goal into persistent hypoglycemia.", "srcAnswer": "B"}, {"num": 45, "level": "Clinical/Application", "question": "A 28-week infant with a small restrictive PDA, normal LA size and no descending-aortic flow reversal is stable on low CPAP. What is reasonable?", "options": ["Increase fluid boluses to enlarge the ductus", "Give ibuprofen immediately because every PDA requires closure", "Perform surgical ligation before discharge", "Observation and ongoing clinical/echo assessment without automatic drug closure"], "answer": 3, "explanation": "Small PDA without markers of harm often warrants expectant management. Closest distractor: Patency versus hsPDA are different concepts. Why not the others: A. Increase fluid boluses to enlarge the ductus — This may worsen respiratory status.; B. Give ibuprofen immediately because every PDA requires closure — No hemodynamic impact is established.; C. Perform surgical ligation before discharge — Invasive closure is not justified by small incidental PDA.", "pearl": "Avoid treating a measurement instead of a patient.", "srcAnswer": "D"}, {"num": 46, "level": "Clinical/Application", "question": "A 37-week infant with moderate encephalopathy is referred at 3 hours; the transport team lacks servo-control. What is safest?", "options": ["Cool to 30°C to maximize neuroprotection", "Arrange monitored transfer to a cooling-capable NICU and avoid uncontrolled overcooling", "Delay all transport until 7 hours", "Place ice packs directly on skin without temperature monitoring"], "answer": 1, "explanation": "Early referral and controlled temperature are essential to safe therapeutic hypothermia. Closest distractor: Initiation urgency must be balanced against overcooling risk. Why not the others: A. Cool to 30°C to maximize neuroprotection — Excessive hypothermia is harmful.; C. Delay all transport until 7 hours — This loses the standard therapeutic window.; D. Place ice packs directly on skin without temperature monitoring — Uncontrolled cooling risks dangerous hypothermia.", "pearl": "Servo-controlled systems are preferred for reliable 33.5°C targeting.", "srcAnswer": "B"}, {"num": 47, "level": "Clinical/Application", "question": "A 25-week infant has IVH occupying >50% of ventricle with acute distension; no parenchymal lesion. What is the appropriate grading?", "options": ["Grade III IVH", "Grade I GMH only", "PVHI", "Grade II IVH"], "answer": 0, "explanation": "Grade III IVH includes major intraventricular blood with acute dilatation. Closest distractor: Ventricular distension distinguishes II from III. Why not the others: B. Grade I GMH only — Blood extends extensively into the ventricle.; C. PVHI — No hemorrhagic parenchymal venous infarct is shown.; D. Grade II IVH — Grade II lacks acute ventricular distension.", "pearl": "Avoid calling every extensive hemorrhage PVHI.", "srcAnswer": "A"}, {"num": 48, "level": "Clinical/Application", "question": "A 27-week infant weighing 1.1 kg receives 140 mL/kg/day of fortified milk supplying 125 kcal/kg/day and 3.8 g/kg/day protein. How should these intakes be interpreted?", "options": ["Protein is excessive because >3 g/kg/day is always unsafe", "Energy is inadequate unless >160 kcal/kg/day for every infant", "They fall within commonly recommended preterm energy/protein ranges", "Both values must be halved in infants <1.5 kg"], "answer": 2, "explanation": "ESPGHAN 2022 targets approximately 115–140 kcal/kg/day and 3.5–4.0 g/kg/day protein. Closest distractor: Range-based interpretation versus a rigid single number. Why not the others: A. Protein is excessive because >3 g/kg/day is always unsafe — ESPGHAN 2022 commonly targets 3.5–4.0.; B. Energy is inadequate unless >160 kcal/kg/day for every infant — 115–140 is typical, with higher only selected.; D. Both values must be halved in infants <1.5 kg — Smaller preterms often need greater nutrient density.", "pearl": "This corrects a known overinterpretation of adequate intake.", "srcAnswer": "C"}, {"num": 49, "level": "Clinical/Application", "question": "A 3-day-old weighing 1.5 kg receives D10 at 100 mL/kg/day. What is the GIR?", "options": ["Approximately 14.4 mg/kg/min", "Approximately 10 mg/kg/min", "Approximately 6.94 mg/kg/min", "Approximately 0.69 mg/kg/min"], "answer": 2, "explanation": "GIR = 10×100/144 = 6.94 mg/kg/min. Calculation check: formula uses % dextrose and mL/kg/day; substitution and mg/kg/min (or %) appear in Core reasoning. Trap: never substitute 0.10 for 10% in the GIR formula. Closest distractor: Use mL/kg/day, not total mL/day, in the formula. Why not the others: A. Approximately 14.4 mg/kg/min — This reverses the 144 conversion.; B. Approximately 10 mg/kg/min — This ignores fluid volume and the factor 144.; D. Approximately 0.69 mg/kg/min — The dextrose percentage was mishandled.", "pearl": "This conversion is fundamental to neonatal glucose management.", "srcAnswer": "C"}, {"num": 50, "level": "Clinical/Application", "question": "A 26-week infant in the delivery room is apneic with HR 80/min. Which intervention should precede chest compressions?", "options": ["Effective PPV with visible chest movement and reassessment of heart rate", "IV epinephrine before PPV", "Immediate chest compressions without ventilation", "Only tactile stimulation for five minutes"], "answer": 0, "explanation": "Ventilation is the key intervention for neonatal bradycardia. Closest distractor: HR <100 PPV threshold versus HR <60 compression threshold. Why not the others: B. IV epinephrine before PPV — Medication is later if HR remains <60 after effective ventilation/compressions.; C. Immediate chest compressions without ventilation — Bradycardia at 80/min is primarily treated by ventilation.; D. Only tactile stimulation for five minutes — Apnea with HR <100 requires assisted ventilation.", "pearl": "Assess chest rise before escalating resuscitation.", "srcAnswer": "A"}, {"num": 51, "level": "Clinical/Application", "question": "A ventilated 29-week infant abruptly desaturates; airway pressure alarm falls and tubing is visibly disconnected. What is the DOPE category?", "options": ["Pneumothorax", "Tube obstruction", "Tube displacement into right mainstem", "Equipment failure"], "answer": 3, "explanation": "The circuit disconnection is a direct equipment failure in DOPE. Closest distractor: Visible disconnected tubing outranks speculative intrathoracic diagnoses. Why not the others: A. Pneumothorax — No sudden unilateral chest finding; circuit disconnection is directly seen.; B. Tube obstruction — Obstruction generally raises resistance/pressure, not a disconnected circuit.; C. Tube displacement into right mainstem — This would create asymmetric ventilation rather than a broken circuit.", "pearl": "In DOPE, identify the actual fault before broad differential escalation.", "srcAnswer": "D"}, {"num": 52, "level": "Clinical/Application", "question": "A 25-week infant has cystic bilateral periventricular white-matter injury on term-equivalent imaging. Which motor pattern is classically associated?", "options": ["Isolated peripheral facial palsy", "Spastic diplegia with greater lower-limb involvement", "Pure ataxia without corticospinal signs", "Acute flaccid paralysis from anterior horn disease"], "answer": 1, "explanation": "Periventricular leg corticospinal fibers are vulnerable in PVL. Closest distractor: Bilateral PVL versus unilateral PVHI motor phenotype. Why not the others: A. Isolated peripheral facial palsy — This is a focal cranial nerve disorder.; C. Pure ataxia without corticospinal signs — PVL classically affects descending motor pathways.; D. Acute flaccid paralysis from anterior horn disease — This is a different neuroanatomical lesion.", "pearl": "Imaging topography predicts pattern, not absolute individual outcome.", "srcAnswer": "B"}, {"num": 53, "level": "Clinical/Application", "question": "A stable 30-week infant is tolerating mother’s milk 60 mL/kg/day with a soft abdomen and no systemic symptoms. Which feeding decision is reasonable?", "options": ["Advance enteral feeds according to a defined preterm protocol with monitoring", "Start broad antibiotics solely because feeds are advancing", "Use full-strength formula to eliminate NEC risk", "Stop all feeds because 60 mL/kg/day is above trophic volume"], "answer": 0, "explanation": "Advancement is individualized but not contraindicated by tolerance alone. Closest distractor: Feeding progression versus unnecessary fasting. Why not the others: B. Start broad antibiotics solely because feeds are advancing — No infection/NEC signs are given.; C. Use full-strength formula to eliminate NEC risk — Formula does not eliminate NEC and may raise risk.; D. Stop all feeds because 60 mL/kg/day is above trophic volume — Tolerated advancement is appropriate.", "pearl": "Protocols often advance ~20–30 mL/kg/day in stable infants, with caveats.", "srcAnswer": "A"}, {"num": 54, "level": "Clinical/Application", "question": "A preterm infant has serum sodium 158 mmol/L and 14% weight loss after inadequate intake; neurologic status is stable. Which correction strategy is safest? [Interpret Visual Station 4 alongside the clinical data.]", "options": ["Give hypertonic saline because sodium is high", "Calculate fluid deficit and correct cautiously with serial sodium/weight monitoring, generally ≤0.5 mmol/L/h", "Give a rapid hypotonic bolus to normalize sodium within 2 hours", "Restrict all fluids until sodium falls spontaneously"], "answer": 1, "explanation": "Chronic/uncertain hypernatremia needs careful water replacement and monitoring. Closest distractor: Hypernatremic dehydration versus symptomatic hyponatremia protocols. Why not the others: A. Give hypertonic saline because sodium is high — Hypertonic saline would worsen hypernatremia.; C. Give a rapid hypotonic bolus to normalize sodium within 2 hours — Rapid correction risks cerebral edema.; D. Restrict all fluids until sodium falls spontaneously — Dehydration requires fluid replacement.", "pearl": "Correction rate matters as much as the starting sodium.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day12',label:'Day 12',set:'Quiz 3',href:'Day12/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day12_QuizSet3_Q37-54_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 12 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 37–54</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 12 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 12'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 12');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day12:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
