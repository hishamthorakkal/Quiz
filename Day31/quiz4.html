<script>
const quiz=[{"num": 52, "level": "Conceptual", "question": "Which transporter defect is classically associated with Gitelman syndrome?", "options": ["ATP6V1B1 proton pump in intercalated cells", "CFTR in airway epithelium", "SLC12A1 NKCC2 in the thick ascending limb", "SLC12A3 thiazide-sensitive NaCl cotransporter"], "answer": 3, "explanation": "NCC dysfunction in the distal convoluted tubule produces Gitelman physiology. Why not the others: A. ATP6V1B1 proton pump in intercalated cells — This is a distal RTA gene.; B. CFTR in airway epithelium — CFTR loss causes cystic fibrosis.; C. SLC12A1 NKCC2 in the thick ascending limb — NKCC2 loss is associated with Bartter type I.", "pearl": "", "srcAnswer": "D"}, {"num": 53, "level": "High-difficulty", "question": "Which pattern most reliably separates Bartter from Gitelman when both show hypokalaemic alkalosis and high renin?", "options": ["Bartter tends to have normal/high urine calcium; Gitelman tends to have low urine calcium", "Only Bartter has elevated renin", "Gitelman causes metabolic acidosis; Bartter alkalosis", "Bartter causes severe hyperkalaemia; Gitelman causes low K"], "answer": 0, "explanation": "Urinary calcium and magnesium patterns help distinguish the loop versus distal convoluted tubule defects. Why not the others: B. Only Bartter has elevated renin — Both salt-wasting disorders may activate renin-angiotensin-aldosterone.; C. Gitelman causes metabolic acidosis; Bartter alkalosis — Both typically produce metabolic alkalosis.; D. Bartter causes severe hyperkalaemia; Gitelman causes low K — Both usually cause hypokalaemia.", "pearl": "", "srcAnswer": "A"}, {"num": 54, "level": "Clinical", "question": "An infant has polyuria, severe hypernatraemia, high plasma osmolality and persistently dilute urine. What is the key physiology of nephrogenic diabetes insipidus?", "options": ["Excessive vasopressin release causes water retention", "Proximal bicarbonate leak", "Renal collecting ducts fail to respond adequately to vasopressin", "Severe ADAMTS13 deficiency"], "answer": 2, "explanation": "Nephrogenic DI produces inability to concentrate urine despite endogenous ADH. Why not the others: A. Excessive vasopressin release causes water retention — That would favor SIADH physiology.; B. Proximal bicarbonate leak — This causes type 2 RTA, not isolated water-concentration failure.; D. Severe ADAMTS13 deficiency — This causes TTP, not DI.", "pearl": "", "srcAnswer": "C"}, {"num": 55, "level": "Clinical", "question": "A child with Fanconi syndrome has severe phosphate wasting and rickets. Which replacement is most directly targeted to the bone abnormality?", "options": ["Aldosterone antagonist alone", "Phosphate with appropriate active vitamin D and electrolyte/alkali management under specialist supervision", "C5 inhibition", "Iron alone without mineral correction"], "answer": 1, "explanation": "Phosphate depletion contributes to rickets; treatment must address multiple proximal losses. Why not the others: A. Aldosterone antagonist alone — This does not correct Fanconi phosphate wasting.; C. C5 inhibition — Complement blockade is for selected TMAs, not phosphate-wasting rickets.; D. Iron alone without mineral correction — Iron does not replace urinary phosphate losses.", "pearl": "", "srcAnswer": "B"}, {"num": 56, "level": "Clinical", "question": "An infant with antenatal Bartter syndrome has low-normal blood pressure despite elevated renin and aldosterone. What explains this?", "options": ["Glomerular nephrosis causes the hypokalaemic alkalosis", "Renal artery stenosis is established by alkalosis", "Renal salt wasting causes chronic volume contraction and secondary RAAS activation", "Primary aldosterone excess causes volume expansion"], "answer": 2, "explanation": "Loss of loop NaCl reabsorption causes hypovolaemia despite hormonal compensation. Why not the others: A. Glomerular nephrosis causes the hypokalaemic alkalosis — Nephrotic syndrome is not the classic cause of this salt-wasting pattern.; B. Renal artery stenosis is established by alkalosis — Alkalosis alone cannot establish renovascular disease.; D. Primary aldosterone excess causes volume expansion — Primary hyperaldosteronism generally causes hypertension, not salt wasting.", "pearl": "", "srcAnswer": "C"}, {"num": 57, "level": "Clinical", "question": "A child with renal Fanconi syndrome has urine glucose positive, plasma glucose 88 mg/dL, low urate and low phosphate. Which finding would further support the same mechanism?", "options": ["High serum bicarbonate with metabolic alkalosis", "Very low urinary sodium with isolated dehydration", "Isolated urinary RBC casts", "Generalized aminoaciduria"], "answer": 3, "explanation": "Broad proximal reabsorptive failure causes aminoaciduria. Why not the others: A. High serum bicarbonate with metabolic alkalosis — Fanconi often causes proximal bicarbonate loss and acidosis.; B. Very low urinary sodium with isolated dehydration — This is not a characteristic broad proximal solute defect.; C. Isolated urinary RBC casts — Casts suggest glomerular inflammation.", "pearl": "", "srcAnswer": "D"}, {"num": 58, "level": "High-difficulty", "question": "An adolescent with hypokalaemic alkalosis has very low urine chloride after recurrent vomiting. Which interpretation is most appropriate?", "options": ["Urine chloride <20 mmol/L proves Bartter", "Urine chloride <20 mmol/L proves Gitelman", "Extrarenal chloride loss is more likely than ongoing Bartter/Gitelman renal chloride wasting", "The patient has type 1 RTA"], "answer": 2, "explanation": "Vomiting often causes chloride-responsive alkalosis with low urinary chloride. Why not the others: A. Urine chloride <20 mmol/L proves Bartter — Bartter also typically wastes chloride.; B. Urine chloride <20 mmol/L proves Gitelman — Gitelman usually has inappropriate renal chloride wasting.; D. The patient has type 1 RTA — Distal RTA causes metabolic acidosis.", "pearl": "", "srcAnswer": "C"}, {"num": 59, "level": "Clinical", "question": "Which statement about cystinosis is most accurate in early infancy?", "options": ["Normal creatinine rules out Fanconi syndrome", "Cysteamine eliminates all need for electrolyte replacement", "Absence of corneal crystals before age 2 does not exclude the diagnosis", "Corneal crystals are mandatory at birth"], "answer": 2, "explanation": "Corneal deposits can appear later than renal Fanconi features. Why not the others: A. Normal creatinine rules out Fanconi syndrome — Tubular losses may precede measurable GFR decline.; B. Cysteamine eliminates all need for electrolyte replacement — Fanconi losses may persist despite disease-modifying therapy.; D. Corneal crystals are mandatory at birth — They often develop during the second year.", "pearl": "", "srcAnswer": "C"}, {"num": 60, "level": "High-difficulty", "question": "A child with Bartter physiology has nephrocalcinosis. Which feature links the transporter defect to this complication?", "options": ["Increased urinary calcium loss from thick ascending limb transport dysfunction", "Low urinary calcium from NCC dysfunction", "Persistent alkaline urine due to distal H+ pump loss", "Primary glucosuria from SGLT2 deficiency"], "answer": 0, "explanation": "Loop NaCl transport supports paracellular calcium reabsorption; loss favors hypercalciuria. Why not the others: B. Low urinary calcium from NCC dysfunction — This is more characteristic of Gitelman.; C. Persistent alkaline urine due to distal H+ pump loss — That describes distal RTA, not the typical Bartter mechanism.; D. Primary glucosuria from SGLT2 deficiency — Glucosuria does not explain loop-related hypercalciuria.", "pearl": "", "srcAnswer": "A"}, {"num": 61, "level": "Integrated", "question": "A 9-year-old with shock has pH 7.20, HCO3 10 mmol/L, PCO2 25 mmHg, Na 138, Cl 103. Which acid-base pattern is present?", "options": ["Normal-anion-gap metabolic acidosis", "High-anion-gap metabolic acidosis with approximately appropriate respiratory compensation", "Primary metabolic alkalosis", "Primary respiratory alkalosis without metabolic disorder"], "answer": 1, "explanation": "AG = 138−(103+10)=25; Winter expected PCO2 23±2, measured 25 at upper limit. Why not the others: A. Normal-anion-gap metabolic acidosis — AG 25 is elevated.; C. Primary metabolic alkalosis — The bicarbonate is reduced and pH acidemic.; D. Primary respiratory alkalosis without metabolic disorder — Low bicarbonate and high AG indicate metabolic acidosis.", "pearl": "", "srcAnswer": "B"}, {"num": 62, "level": "Basic", "question": "An acidotic child has Na 140, Cl 112 and HCO3 16 mmol/L. What is the uncorrected anion gap?", "options": ["−12 mmol/L", "44 mmol/L", "28 mmol/L", "12 mmol/L"], "answer": 3, "explanation": "AG = 140 − (112 + 16) = 12 mmol/L. Why not the others: A. −12 mmol/L — The arithmetic sign is positive.; B. 44 mmol/L — This is not obtained by the standard AG formula.; C. 28 mmol/L — This incorrectly omits bicarbonate from the subtracted terms.", "pearl": "", "srcAnswer": "D"}, {"num": 63, "level": "High-difficulty", "question": "A child has pH 7.24, HCO3 12 mmol/L and PCO2 40 mmHg. What additional process is likely?", "options": ["Superimposed respiratory alkalosis", "Superimposed respiratory acidosis", "Pure metabolic alkalosis", "Appropriate respiratory compensation"], "answer": 1, "explanation": "Winter expected PCO2 about 26±2; actual 40 indicates inadequate ventilation in addition to metabolic acidosis. Why not the others: A. Superimposed respiratory alkalosis — Respiratory alkalosis would lower PCO2 below expected.; C. Pure metabolic alkalosis — HCO3 is low, not high.; D. Appropriate respiratory compensation — PCO2 40 is much higher than expected.", "pearl": "", "srcAnswer": "B"}, {"num": 64, "level": "Clinical", "question": "A child has pH 7.29, HCO3 14 mmol/L and PCO2 20 mmHg. What is the interpretation?", "options": ["Primary metabolic alkalosis", "Pure compensated metabolic acidosis", "Metabolic acidosis plus respiratory acidosis", "Metabolic acidosis plus superimposed respiratory alkalosis"], "answer": 3, "explanation": "Winter expected PCO2 29±2; actual 20 is lower than compensation predicts. Why not the others: A. Primary metabolic alkalosis — The low bicarbonate and acidemia exclude primary metabolic alkalosis.; B. Pure compensated metabolic acidosis — Actual PCO2 is below expected range.; C. Metabolic acidosis plus respiratory acidosis — Respiratory acidosis would raise PCO2 above expected.", "pearl": "", "srcAnswer": "D"}, {"num": 65, "level": "Clinical", "question": "In a child with severe hypoalbuminaemia, which statement about the measured serum anion gap is most accurate?", "options": ["Low albumin always increases the measured gap", "Low albumin can mask a high-anion-gap acidosis; interpret a corrected AG", "A normal measured AG excludes lactic acidosis in hypoalbuminaemia", "Albumin has no effect on anion gap"], "answer": 1, "explanation": "Albumin is a major unmeasured anion, so hypoalbuminaemia lowers the observed gap. Why not the others: A. Low albumin always increases the measured gap — The effect is generally to lower AG.; C. A normal measured AG excludes lactic acidosis in hypoalbuminaemia — A masked elevation is possible.; D. Albumin has no effect on anion gap — Albumin contributes substantially to unmeasured anions.", "pearl": "", "srcAnswer": "B"}, {"num": 66, "level": "Clinical", "question": "A 5-year-old has Na 136, Cl 100, HCO3 8 mmol/L, albumin 2.0 g/dL and lactate 7 mmol/L. What is the measured AG before albumin correction?", "options": ["36 mmol/L", "20 mmol/L", "8 mmol/L", "28 mmol/L"], "answer": 3, "explanation": "AG = 136 − (100 + 8) = 28 mmol/L. Why not the others: A. 36 mmol/L — This omits bicarbonate.; B. 20 mmol/L — This subtracts an additional incorrect quantity.; C. 8 mmol/L — This is the bicarbonate value, not the anion gap.", "pearl": "", "srcAnswer": "D"}, {"num": 67, "level": "Clinical", "question": "A child with diarrhoea has pH 7.28, HCO3 14 mmol/L, Na 139, Cl 113. Which mechanism most directly causes the acid-base change?", "options": ["Accumulation of unmeasured ketoacids", "Renal hydrogen-ion secretory failure proven by diarrhoea", "Primary respiratory acidosis", "Gastrointestinal bicarbonate loss with compensatory hyperchloraemia"], "answer": 3, "explanation": "Diarrhoea can cause normal-AG metabolic acidosis via stool bicarbonate losses. Why not the others: A. Accumulation of unmeasured ketoacids — That usually increases anion gap.; B. Renal hydrogen-ion secretory failure proven by diarrhoea — The gastrointestinal source is more direct in this scenario.; C. Primary respiratory acidosis — The pattern has low bicarbonate and hyperchloraemia.", "pearl": "", "srcAnswer": "D"}, {"num": 68, "level": "Conceptual", "question": "Which bedside pairing is most useful to distinguish vomiting-related from diarrhoea-related acid-base disorders?", "options": ["Vomiting causes RTA and diarrhoea causes TTP", "Both consistently produce high-AG acidosis", "Both consistently cause hyperkalaemic alkalosis", "Vomiting often causes hypochloraemic alkalosis; diarrhoea often causes hyperchloraemic acidosis"], "answer": 3, "explanation": "Loss of gastric HCl versus intestinal bicarbonate produces contrasting patterns. Why not the others: A. Vomiting causes RTA and diarrhoea causes TTP — These are different mechanisms and diagnoses.; B. Both consistently produce high-AG acidosis — Neither produces high-AG acidosis as the characteristic direct mechanism.; C. Both consistently cause hyperkalaemic alkalosis — Potassium changes vary; these are not characteristic pairings.", "pearl": "", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day31',label:'Day 31',set:'Quiz 4',href:'Day31/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day31_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 31 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 31 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 31'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 31');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day31:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
