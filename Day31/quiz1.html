@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "Clinical", "question": "A 4-year-old develops pallor, oliguria and bruising 6 days after bloody diarrhoea. Hb 7.5 g/dL, platelets 45,000/µL, creatinine 1.8 mg/dL and schistocytes are present. Which process best explains the syndrome?", "options": ["Immune-complex glomerular deposition after streptococcal infection", "Shiga-toxin endothelial injury causing renal-predominant thrombotic microangiopathy", "Isolated intravascular volume depletion", "ADAMTS13 deficiency causing TTP"], "answer": 1, "explanation": "The diarrhoeal prodrome plus microangiopathic haemolysis, thrombocytopenia and AKI strongly supports STEC-HUS. Why not the others: A. Immune-complex glomerular deposition after streptococcal infection — PSGN is a nephritic illness, not typically a haemolytic thrombocytopenic TMA.; C. Isolated intravascular volume depletion — Dehydration alone does not explain schistocytes and thrombocytopenia.; D. ADAMTS13 deficiency causing TTP — TTP is possible in TMA but requires specific assessment and does not best fit the classic STEC prodrome.", "pearl": "", "srcAnswer": "B"}, {"num": 2, "level": "Clinical", "question": "A child has suspected STEC gastroenteritis with blood-streaked stools and no sepsis. Which early intervention is most appropriate?", "options": ["Empirical fluoroquinolone solely to prevent HUS", "Careful isotonic hydration with reassessment of perfusion, urine output and fluid overload", "Immediate eculizumab before stool testing in all cases", "Loperamide to suppress stool output"], "answer": 1, "explanation": "Early volume support during diarrhoeal illness may reduce kidney complications; reassess frequently. Why not the others: A. Empirical fluoroquinolone solely to prevent HUS — Antibiotics in STEC may increase HUS risk and are not routine prophylaxis.; C. Immediate eculizumab before stool testing in all cases — C5 inhibition is not routine first-line therapy for uncomplicated suspected STEC infection.; D. Loperamide to suppress stool output — Antimotility drugs are avoided in bloody diarrhoea and STEC.", "pearl": "", "srcAnswer": "B"}, {"num": 3, "level": "Conceptual", "question": "A child with bloody diarrhoea has normal platelets on day 2 but worsening abdominal pain. Which follow-up strategy best detects evolving HUS?", "options": ["D-dimer alone determines the diagnosis", "Serial CBC, creatinine, electrolytes and urine-output assessment", "Single normal platelet count excludes later HUS", "Serum amylase alone is sufficient"], "answer": 1, "explanation": "The HUS triad may evolve after the diarrhoeal illness begins; trends are more useful than a single normal test. Why not the others: A. D-dimer alone determines the diagnosis — D-dimer is nonspecific and cannot replace haemolysis and renal evaluation.; C. Single normal platelet count excludes later HUS — A normal early platelet count does not rule out subsequent TMA.; D. Serum amylase alone is sufficient — Pancreatic injury is possible but amylase cannot screen for the TMA triad.", "pearl": "", "srcAnswer": "B"}, {"num": 4, "level": "Clinical", "question": "In an oliguric child with STEC-HUS, K 6.8 mmol/L and broad QRS complexes, what is the first immediate priority?", "options": ["Cardiac membrane stabilization with intravenous calcium while initiating hyperkalaemia treatment", "Oral potassium-binding resin as the sole urgent treatment", "Wait for stool PCR before intervening", "Platelet transfusion to correct the thrombocytopenia first"], "answer": 0, "explanation": "ECG changes indicate immediate arrhythmia risk; calcium stabilizes myocardium but does not lower serum potassium. Why not the others: B. Oral potassium-binding resin as the sole urgent treatment — Resins act slowly and are insufficient for ECG-threatening hyperkalaemia.; C. Wait for stool PCR before intervening — Aetiologic confirmation must not delay emergency stabilization.; D. Platelet transfusion to correct the thrombocytopenia first — The immediate life threat is hyperkalaemic arrhythmia; platelet transfusion is not routinely indicated.", "pearl": "", "srcAnswer": "A"}, {"num": 5, "level": "Clinical", "question": "A child with HUS has platelets 28,000/µL, no active bleeding, and no planned invasive procedure. What is the most appropriate platelet approach?", "options": ["Transfuse to normalize platelet count regardless of symptoms", "Start aspirin to increase platelet count", "Give IVIG as universal first-line therapy", "Avoid routine prophylactic platelet transfusion; reassess for bleeding or procedures"], "answer": 3, "explanation": "Routine platelets are generally avoided in TMA without bleeding/procedural indication because thrombosis is central to pathogenesis. Why not the others: A. Transfuse to normalize platelet count regardless of symptoms — Routine correction of count alone does not treat the microangiopathy.; B. Start aspirin to increase platelet count — Aspirin does not correct thrombocytopenia and may increase bleeding risk.; C. Give IVIG as universal first-line therapy — IVIG is not standard treatment for STEC-HUS thrombocytopenia.", "pearl": "", "srcAnswer": "D"}, {"num": 6, "level": "Basic", "question": "Which laboratory pattern is most consistent with microangiopathic rather than immune haemolysis in HUS?", "options": ["Spherocytes with strongly positive direct antiglobulin test", "Schistocytes, raised LDH, low haptoglobin and usually negative direct antiglobulin test", "Normal blood film and isolated prolonged PT", "Microcytosis with low ferritin and normal LDH"], "answer": 1, "explanation": "Mechanical red-cell fragmentation across injured microvasculature causes Coombs-negative haemolysis in typical HUS. Why not the others: A. Spherocytes with strongly positive direct antiglobulin test — This pattern favors immune haemolysis rather than typical STEC-HUS.; C. Normal blood film and isolated prolonged PT — A coagulation defect alone is not diagnostic of TMA.; D. Microcytosis with low ferritin and normal LDH — Iron deficiency does not produce the TMA haemolysis pattern.", "pearl": "", "srcAnswer": "B"}, {"num": 7, "level": "High-difficulty", "question": "A child with STEC-HUS develops pulmonary oedema, persistent anuria and refractory hyperkalaemia despite medical stabilization. What is the next renal support strategy?", "options": ["Increase maintenance IV fluid despite pulmonary oedema", "Urgent kidney replacement therapy in a paediatric nephrology/PICU setting", "Begin prophylactic plasma exchange in every STEC-HUS patient", "Delay dialysis until creatinine reaches a fixed numerical cutoff"], "answer": 1, "explanation": "Refractory electrolyte, volume or uraemic complications are indications for dialysis irrespective of stool results. Why not the others: A. Increase maintenance IV fluid despite pulmonary oedema — Additional fluid worsens overload in anuria.; C. Begin prophylactic plasma exchange in every STEC-HUS patient — Plasma exchange is not routine for uncomplicated microbiologically confirmed STEC-HUS.; D. Delay dialysis until creatinine reaches a fixed numerical cutoff — Dialysis decisions depend on clinical complications, not a single creatinine threshold.", "pearl": "", "srcAnswer": "B"}, {"num": 8, "level": "Basic", "question": "Which microbiological study is most directly relevant early in a child with diarrhoea-associated HUS?", "options": ["Serum anti-dsDNA as the sole test", "Serum complement C3 alone", "Stool testing for Shiga toxin or stx genes, alongside appropriate culture", "Anti-streptolysin O titre alone"], "answer": 2, "explanation": "STEC identification supports diagnosis and infection-control/public-health actions. Why not the others: A. Serum anti-dsDNA as the sole test — Anti-dsDNA is for lupus evaluation, not primary STEC confirmation.; B. Serum complement C3 alone — Complement levels do not identify Shiga-toxin infection.; D. Anti-streptolysin O titre alone — ASO assesses prior streptococcal exposure, not STEC.", "pearl": "", "srcAnswer": "C"}, {"num": 9, "level": "Clinical", "question": "A child has confirmed STEC-HUS and severe hypertension. Which statement best guides therapy?", "options": ["Treat hypertension and fluid status according to severity while monitoring renal and neurologic complications", "Hypertension always resolves with unrestricted fluids", "All children need chronic C5 inhibition", "Hypertension excludes STEC-HUS"], "answer": 0, "explanation": "Supportive management includes blood-pressure control, volume management and complication surveillance. Why not the others: B. Hypertension always resolves with unrestricted fluids — Fluid excess may exacerbate hypertension and pulmonary oedema.; C. All children need chronic C5 inhibition — Complement blockade is not routine standard treatment for typical STEC-HUS.; D. Hypertension excludes STEC-HUS — Hypertension is common with AKI and volume dysregulation in HUS.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "Conceptual", "question": "Why is a normal initial creatinine insufficient to exclude developing STEC-HUS?", "options": ["Stool PCR always becomes negative before AKI begins", "Schistocytes only occur after dialysis", "Creatinine is never affected in HUS", "Microangiopathic haemolysis and thrombocytopenia may precede a measurable creatinine rise"], "answer": 3, "explanation": "AKI can evolve; serial evaluation is essential in at-risk children. Why not the others: A. Stool PCR always becomes negative before AKI begins — Microbiological timing is variable and not a substitute for renal surveillance.; B. Schistocytes only occur after dialysis — Fragmented cells result from TMA, not dialysis itself.; C. Creatinine is never affected in HUS — Renal injury is a core component of HUS.", "pearl": "", "srcAnswer": "D"}, {"num": 11, "level": "Integrated", "question": "An 8-year-old has recurrent Coombs-negative TMA without a diarrhoeal prodrome; STEC testing is negative and ADAMTS13 activity is 58%. What is the leading mechanistic category?", "options": ["Alternative-complement-pathway dysregulation causing complement-mediated HUS", "Isolated iron-deficiency anaemia", "Severe ADAMTS13 deficiency causing TTP", "Simple prerenal azotaemia"], "answer": 0, "explanation": "Recurrent TMA with STEC and severe ADAMTS13 deficiency excluded raises complement-mediated aHUS. Why not the others: B. Isolated iron-deficiency anaemia — Iron deficiency does not explain thrombocytopenia, schistocytes and AKI.; C. Severe ADAMTS13 deficiency causing TTP — ADAMTS13 of 58% is not in the severe deficiency range typical of TTP.; D. Simple prerenal azotaemia — Prerenal injury does not produce a systemic TMA triad.", "pearl": "", "srcAnswer": "A"}, {"num": 12, "level": "Conceptual", "question": "A child has convincing complement-mediated aHUS but normal serum C3. What is the most defensible interpretation?", "options": ["Normal C3 confirms STEC-HUS", "Normal C3 proves TTP", "Normal C3 rules out aHUS with near certainty", "Normal C3 does not exclude complement-mediated aHUS"], "answer": 3, "explanation": "C3 has insufficient sensitivity and can be normal despite complement dysregulation. Why not the others: A. Normal C3 confirms STEC-HUS — STEC requires appropriate microbiological evidence.; B. Normal C3 proves TTP — TTP diagnosis relies on ADAMTS13 and clinical context.; C. Normal C3 rules out aHUS with near certainty — Normal complement concentration is not an exclusion test.", "pearl": "", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "Which genetic change is a recognized loss-of-function mechanism predisposing to complement-mediated aHUS?", "options": ["Activating variant in RET", "Loss of CFTR chloride-channel function", "Pathogenic loss-of-function variant in CFH", "Gain-of-function mutation in the beta-globin gene"], "answer": 2, "explanation": "Factor H restrains the alternative complement pathway; reduced regulation predisposes to endothelial injury. Why not the others: A. Activating variant in RET — RET activation is not a canonical aHUS complement regulator mechanism.; B. Loss of CFTR chloride-channel function — CFTR causes cystic fibrosis, not the canonical complement-regulator defect.; D. Gain-of-function mutation in the beta-globin gene — Beta-globin variants do not explain this complement-mediated TMA mechanism.", "pearl": "", "srcAnswer": "C"}, {"num": 14, "level": "Conceptual", "question": "A 10-year-old with TMA has anti-factor H autoantibodies. Which pathophysiologic process is implicated?", "options": ["Immune destruction of platelets without haemolysis", "Acquired disruption of factor H regulation of the alternative complement pathway", "Autoantibody inhibition of acetylcholine receptor", "Loss of renal bicarbonate reclamation"], "answer": 1, "explanation": "Anti-factor H antibodies impair complement control and can cause autoimmune aHUS. Why not the others: A. Immune destruction of platelets without haemolysis — Isolated ITP does not account for schistocytes and AKI.; C. Autoantibody inhibition of acetylcholine receptor — That causes myasthenia gravis, not aHUS.; D. Loss of renal bicarbonate reclamation — This describes proximal RTA, not autoimmune TMA.", "pearl": "", "srcAnswer": "B"}, {"num": 15, "level": "Basic", "question": "Which drug class directly blocks terminal complement activation in aHUS?", "options": ["C5 inhibitors such as eculizumab or ravulizumab", "Oral acetazolamide", "Anti-CD20 monotherapy in all patients", "Calcineurin inhibitors"], "answer": 0, "explanation": "These agents block C5 cleavage and terminal complement injury. Why not the others: B. Oral acetazolamide — This carbonic anhydrase inhibitor does not treat complement TMA.; C. Anti-CD20 monotherapy in all patients — Rituximab may be used for autoimmune anti-FH disease but does not directly block C5.; D. Calcineurin inhibitors — These do not directly inhibit C5 and may themselves trigger TMA.", "pearl": "", "srcAnswer": "A"}, {"num": 16, "level": "Integrated", "question": "A child has strongly suspected aHUS with rapid renal deterioration. ADAMTS13 and genetic tests were drawn but results are pending. What is the 2026 IPNA approach?", "options": ["Give only oral bicarbonate until haemolysis resolves", "Prompt specialist-directed C5 inhibition without waiting for genetic or ADAMTS13 results when aHUS is suspected", "Wait several weeks for complete gene sequencing before treatment", "Treat as STEC-HUS solely because the child is young"], "answer": 1, "explanation": "Early targeted therapy is recommended while urgent differential evaluation proceeds; TTP and other causes must be considered. Why not the others: A. Give only oral bicarbonate until haemolysis resolves — Bicarbonate does not address complement-driven TMA.; C. Wait several weeks for complete gene sequencing before treatment — Delay may increase irreversible renal injury.; D. Treat as STEC-HUS solely because the child is young — Age alone does not establish STEC aetiology.", "pearl": "", "srcAnswer": "B"}, {"num": 17, "level": "Conceptual", "question": "Which pre-treatment safety issue is especially important before C5 inhibition?", "options": ["Avoid all vaccines permanently", "Use aspirin as the sole infection prophylaxis", "Meningococcal vaccination and appropriate antibiotic prophylaxis according to urgency and local protocol", "Routine varicella-zoster immunoglobulin for every dose"], "answer": 2, "explanation": "Terminal complement blockade increases susceptibility to encapsulated organisms, particularly meningococcus. Why not the others: A. Avoid all vaccines permanently — Vaccination is recommended, not prohibited, around C5 inhibition.; B. Use aspirin as the sole infection prophylaxis — Aspirin has no antimicrobial effect.; D. Routine varicella-zoster immunoglobulin for every dose — This is not the specific prophylaxis required for C5 blockade.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day31',label:'Day 31',set:'Quiz 1',href:'Day31/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day31_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 31 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 31 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 31'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 31');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day31:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
