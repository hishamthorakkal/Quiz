@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<h1>Day 31 — Quiz 2</h1>

<script>
const quiz=[{"num": 18, "level": "High-difficulty", "question": "A child with recurrent aHUS has normal CFH sequencing but suspicion remains high. Which genomic limitation must be addressed?", "options": ["Copy-number and rearrangement testing across the CFH/CFHR region", "Peripheral smear alone", "Serum sodium alone", "Renal ultrasound alone"], "answer": 0, "explanation": "The regulator-of-complement-activation locus contains rearrangements not reliably detected by simple sequence-only analysis. Why not the others: B. Peripheral smear alone — Smear establishes TMA morphology but not CFH/CFHR copy-number variation.; C. Serum sodium alone — Sodium does not detect structural genetic variants.; D. Renal ultrasound alone — Ultrasound cannot resolve complement-gene rearrangements.", "pearl": "", "srcAnswer": "A"}, {"num": 19, "level": "High-difficulty", "question": "A child with suspected aHUS has homocysteine markedly elevated and methylmalonic acid elevated. Which alternative diagnosis deserves urgent evaluation?", "options": ["Cobalamin C processing disorder (MMACHC-related TMA)", "STEC infection proven by these metabolites", "Isolated Gitelman syndrome", "Primary nephrogenic diabetes insipidus"], "answer": 0, "explanation": "cblC deficiency is a treatable metabolic cause of paediatric TMA and may mimic aHUS. Why not the others: B. STEC infection proven by these metabolites — Metabolite elevations are not tests for Shiga toxin.; C. Isolated Gitelman syndrome — Gitelman produces hypokalaemic alkalosis, not homocysteine/MMA-associated TMA.; D. Primary nephrogenic diabetes insipidus — NDI does not explain the TMA plus metabolic markers.", "pearl": "", "srcAnswer": "A"}, {"num": 20, "level": "High-difficulty", "question": "Which mutation is associated with non-complement genetic TMA in infancy and may show limited response to C5 inhibition?", "options": ["DGKE-associated TMA", "CFB gain-of-function", "CFH loss-of-function", "CFI loss-of-function"], "answer": 0, "explanation": "DGKE disease is a non-complement genetic TMA phenotype; mechanism and response differ from complement-mediated aHUS. Why not the others: B. CFB gain-of-function — CFB activates the alternative complement pathway.; C. CFH loss-of-function — CFH is a complement regulator and usually points toward complement-mediated disease.; D. CFI loss-of-function — CFI is a complement regulatory protein.", "pearl": "", "srcAnswer": "A"}, {"num": 21, "level": "Integrated", "question": "An Indian centre lacks timely access to eculizumab for severe suspected aHUS. Which statement correctly reconciles guidance?", "options": ["Indian guidance requires antibiotics alone for aHUS", "Both guidelines require withholding treatment until sequencing returns", "2026 IPNA favors C5 inhibition when available; Indian 2020 guidance describes urgent plasma exchange as a resource-constrained alternative", "C5 inhibition is contraindicated in all Indian children"], "answer": 2, "explanation": "This is a genuine availability-based difference, not evidence that plasma exchange is biologically equivalent. Why not the others: A. Indian guidance requires antibiotics alone for aHUS — Antibiotics do not treat complement-mediated TMA.; B. Both guidelines require withholding treatment until sequencing returns — Neither recommends prolonged delay for a critically ill child.; D. C5 inhibition is contraindicated in all Indian children — Access and infection-prevention logistics matter; nationality is not a contraindication.", "pearl": "", "srcAnswer": "C"}, {"num": 22, "level": "High-difficulty", "question": "Which statement best describes anti-factor H antibody-associated aHUS treatment?", "options": ["Isolated steroid eye drops", "No treatment after one normal C3 result", "Routine platelet transfusions alone", "Complement blockade or plasma exchange together with appropriate immunosuppression may be required"], "answer": 3, "explanation": "Autoimmune anti-FH disease can need suppression of antibody production in addition to acute TMA control. Why not the others: A. Isolated steroid eye drops — Ocular steroid drops have no role in systemic TMA.; B. No treatment after one normal C3 result — Normal C3 does not rule out active aHUS.; C. Routine platelet transfusions alone — Platelets do not remove anti-factor H autoantibodies or block complement.", "pearl": "", "srcAnswer": "D"}, {"num": 23, "level": "Basic", "question": "A child with TMA has ADAMTS13 activity 3% before plasma therapy. Which diagnosis is most supported?", "options": ["Type 1 renal tubular acidosis", "Complement-mediated aHUS established solely by this test", "Thrombotic thrombocytopenic purpura", "STEC-HUS established by ADAMTS13"], "answer": 2, "explanation": "Severe ADAMTS13 deficiency below 10% strongly supports TTP in the appropriate TMA context. Why not the others: A. Type 1 renal tubular acidosis — Distal RTA does not cause severe ADAMTS13 deficiency.; B. Complement-mediated aHUS established solely by this test — Severe deficiency points to TTP rather than typical complement-mediated aHUS.; D. STEC-HUS established by ADAMTS13 — STEC diagnosis depends on Shiga toxin evidence, not low ADAMTS13.", "pearl": "", "srcAnswer": "C"}, {"num": 24, "level": "Integrated", "question": "A child with suspected immune TTP is deteriorating and ADAMTS13 results will take 48 hours. What is the immediate approach?", "options": ["Wait for gene sequencing before initiating therapy", "Obtain a pretreatment ADAMTS13 sample and initiate urgent specialist-directed plasma exchange and immunosuppression", "Treat as uncomplicated iron deficiency", "Administer oral citrate as definitive therapy"], "answer": 1, "explanation": "High-probability TTP is an emergency; treatment should not wait for confirmatory activity testing. Why not the others: A. Wait for gene sequencing before initiating therapy — Delay can be life-threatening in TTP.; C. Treat as uncomplicated iron deficiency — The clinical TMA requires urgent specific evaluation and treatment.; D. Administer oral citrate as definitive therapy — Alkali does not replace plasma therapy for TTP.", "pearl": "", "srcAnswer": "B"}, {"num": 25, "level": "Integrated", "question": "A child with pneumonia, invasive pneumococcal infection, haemolysis, thrombocytopenia and AKI has a positive direct antiglobulin test. Which TMA is particularly suggested?", "options": ["Isolated immune thrombocytopenia", "Primary factor H deficiency proven by Coombs positivity", "Pneumococcal-associated HUS", "Classical STEC-HUS"], "answer": 2, "explanation": "Pneumococcal neuraminidase exposure of T-antigen may produce Coombs positivity in this setting. Why not the others: A. Isolated immune thrombocytopenia — ITP does not explain AKI and microangiopathic haemolysis.; B. Primary factor H deficiency proven by Coombs positivity — DAT positivity does not prove CFH deficiency.; D. Classical STEC-HUS — Typical STEC-HUS is generally Coombs-negative and follows enteric infection.", "pearl": "", "srcAnswer": "C"}, {"num": 26, "level": "Conceptual", "question": "Which feature is most helpful to distinguish disseminated intravascular coagulation (DIC) from uncomplicated HUS in a septic child?", "options": ["Presence of thrombocytopenia", "Marked coagulation-factor consumption with prolonged PT/aPTT and low fibrinogen", "Elevation of LDH", "Presence of anaemia"], "answer": 1, "explanation": "DIC commonly affects coagulation assays; HUS typically has relatively preserved PT/aPTT. Why not the others: A. Presence of thrombocytopenia — Low platelets are common in both.; C. Elevation of LDH — LDH can rise in haemolysis and tissue injury across several conditions.; D. Presence of anaemia — Anaemia can occur in both.", "pearl": "", "srcAnswer": "B"}, {"num": 27, "level": "Clinical", "question": "Which clinical history most increases suspicion for recurrent complement-mediated TMA rather than a single STEC-HUS episode?", "options": ["Previous unexplained TMA relapse and affected first-degree relative", "Isolated vomiting with normal blood count", "One episode of bloody diarrhoea after a foodborne outbreak", "Isolated positive urine nitrite"], "answer": 0, "explanation": "Recurrence and family history increase the probability of an inherited complement predisposition. Why not the others: B. Isolated vomiting with normal blood count — This does not establish TMA.; C. One episode of bloody diarrhoea after a foodborne outbreak — This pattern is characteristic of STEC infection.; D. Isolated positive urine nitrite — Urinary infection does not specifically diagnose aHUS.", "pearl": "", "srcAnswer": "A"}, {"num": 28, "level": "High-difficulty", "question": "A child with TMA has ADAMTS13 activity 15%. What is the best interpretation?", "options": ["aHUS is definitely proven at 15%", "All TMA has been excluded", "TTP is definitely proven at 15%", "Indeterminate activity: integrate clinical probability and repeat/extend testing"], "answer": 3, "explanation": "10–20% is not the clear severe-deficiency range and requires clinical judgment. Why not the others: A. aHUS is definitely proven at 15% — ADAMTS13 alone cannot establish complement-mediated aHUS.; B. All TMA has been excluded — The presence of haemolysis and thrombocytopenia still demands evaluation.; C. TTP is definitely proven at 15% — The strong diagnostic cutoff is generally <10%.", "pearl": "", "srcAnswer": "D"}, {"num": 29, "level": "Conceptual", "question": "Which test should be drawn before plasma exchange when TTP is suspected, if doing so does not delay treatment?", "options": ["Only serum ferritin", "ADAMTS13 activity and inhibitor/antibody testing", "Only urine pH", "Only urine ketones"], "answer": 1, "explanation": "Plasma therapy can alter test interpretation; obtain pretreatment sample urgently. Why not the others: A. Only serum ferritin — Ferritin cannot replace ADAMTS13 testing.; C. Only urine pH — Urine pH is relevant to RTA, not specific TTP.; D. Only urine ketones — Ketones do not diagnose TTP.", "pearl": "", "srcAnswer": "B"}, {"num": 30, "level": "High-difficulty", "question": "A child with TMA has seizures and renal failure. Which conclusion is safest?", "options": ["Neurological manifestations do not by themselves distinguish TTP from HUS variants", "Renal failure always excludes TTP", "TMA cannot affect the brain", "Seizures always prove TTP"], "answer": 0, "explanation": "Severe neurological involvement can occur in several TMAs; mechanism-specific tests are required. Why not the others: B. Renal failure always excludes TTP — TTP may involve kidneys, although severity patterns differ.; C. TMA cannot affect the brain — Microvascular injury may cause neurologic complications.; D. Seizures always prove TTP — Neurological symptoms are not pathognomonic.", "pearl": "", "srcAnswer": "A"}, {"num": 31, "level": "Integrated", "question": "A 2-year-old has growth failure, HCO3 13 mmol/L, chloride 113 mmol/L, K 2.8 mmol/L and urine pH 6.4 during systemic acidosis. Ultrasound shows nephrocalcinosis. Which defect is most likely?", "options": ["Isolated respiratory alkalosis", "Impaired distal hydrogen-ion secretion (type 1 RTA)", "Proximal bicarbonate leak after plasma bicarbonate has fallen below threshold", "Hypoaldosteronism-related type 4 RTA"], "answer": 1, "explanation": "Inappropriately alkaline urine during systemic acidosis, hypokalaemia and nephrocalcinosis point to distal RTA. Why not the others: A. Isolated respiratory alkalosis — The low bicarbonate with hyperchloraemia and growth failure requires metabolic acid-base assessment.; C. Proximal bicarbonate leak after plasma bicarbonate has fallen below threshold — Steady-state proximal RTA can acidify urine once bicarbonate is depleted.; D. Hypoaldosteronism-related type 4 RTA — Type 4 classically produces hyperkalaemia, not this hypokalaemic stone-forming phenotype.", "pearl": "", "srcAnswer": "B"}, {"num": 32, "level": "High-difficulty", "question": "A child with proximal bicarbonate wasting initially has alkaline urine after bicarbonate infusion but urine pH falls to 5.0 after serum bicarbonate decreases. Why?", "options": ["The distal H+ pump is permanently absent", "A positive stool culture directly controls urine pH", "The distal nephron can acidify urine once filtered bicarbonate falls below the reduced proximal reabsorptive threshold", "Aldosterone deficiency causes universal acidic urine"], "answer": 2, "explanation": "Proximal RTA is a threshold defect, so urine pH varies with plasma bicarbonate. Why not the others: A. The distal H+ pump is permanently absent — That would favor distal RTA with persistently high urine pH.; B. A positive stool culture directly controls urine pH — Stool infection does not explain the proximal threshold phenomenon.; D. Aldosterone deficiency causes universal acidic urine — This does not explain bicarbonate-dependent urinary alkalinization.", "pearl": "", "srcAnswer": "C"}, {"num": 33, "level": "Basic", "question": "A child has hyperkalaemia 6.1 mmol/L, mild normal-anion-gap acidosis and low aldosterone activity. Which RTA mechanism is most likely?", "options": ["Gitelman syndrome", "Type 2 RTA from isolated bicarbonate leak", "Type 1 RTA with isolated hypokalaemia", "Type 4 RTA due to reduced aldosterone effect"], "answer": 3, "explanation": "Aldosterone deficiency/resistance impairs K and acid excretion, often with acidic urine. Why not the others: A. Gitelman syndrome — Gitelman produces hypokalaemic metabolic alkalosis.; B. Type 2 RTA from isolated bicarbonate leak — Proximal RTA typically has low potassium and greater bicarbonate loss.; C. Type 1 RTA with isolated hypokalaemia — Distal RTA is usually hypokalaemic and associated with high urine pH.", "pearl": "", "srcAnswer": "D"}, {"num": 34, "level": "High-difficulty", "question": "An acidotic child has urine pH 6.8 but urine culture grows Proteus. What is the best diagnostic caution?", "options": ["Urease-producing urinary infection can falsely elevate urine pH; reassess before diagnosing distal RTA", "Urine pH >5.5 proves distal RTA in every context", "Proteus causes isolated respiratory acidosis", "Urine pH alone establishes proximal Fanconi syndrome"], "answer": 0, "explanation": "Alkaline urine is not specific for distal RTA when urease-positive infection is present. Why not the others: B. Urine pH >5.5 proves distal RTA in every context — Infection, sample handling and volume depletion can confound pH.; C. Proteus causes isolated respiratory acidosis — This is not the mechanism of alkaline urine.; D. Urine pH alone establishes proximal Fanconi syndrome — Fanconi requires evidence of multiple proximal solute losses.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day31',label:'Day 31',set:'Quiz 2',href:'Day31/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day31_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 31 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 31 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 31'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 31');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day31:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
