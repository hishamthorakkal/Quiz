@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "", "question": "A 4-year-old boy has Gowers manoeuvre, calf pseudohypertrophy and CK 15,000 U/L. Most appropriate first definitive molecular test?", "options": ["DMD gene deletion/duplication analysis with reflex sequencing", "Anti-AChR antibody testing", "SMN1 exon 7 copy-number analysis", "Muscle biopsy as first test in every child"], "answer": 0, "explanation": "Genetic testing for dystrophinopathy is first-line, with sequencing for variants missed by copy-number testing. Why not the others (added — not from source): B. Anti-AChR antibody testing — AChR antibodies test for autoimmune myasthenia gravis; a very high CK with calf pseudohypertrophy points to a dystrophinopathy.; C. SMN1 exon 7 copy-number analysis — SMN1 testing confirms SMA, which has a normal or mildly raised CK and no pseudohypertrophy.; D. Muscle biopsy as first test in every child — Genetic testing is first-line; biopsy is kept for cases where genetic testing is inconclusive.", "pearl": "Genetic testing for dystrophinopathy is first-line, with sequencing for variants missed by copy-number testing.", "srcAnswer": "B"}, {"num": 2, "level": "", "question": "A boy with DMD has a nonsense variant. What genetic consequence is most typical?", "options": ["Premature termination of dystrophin translation", "Deletion of SMN1 with SMN2 modifier", "Stable in-frame internally shortened dystrophin", "Expansion of DMPK CTG repeats"], "answer": 0, "explanation": "A premature stop codon disrupts full-length dystrophin production. Why not the others (added — not from source): B. Deletion of SMN1 with SMN2 modifier — That describes 5q SMA, not a dystrophin nonsense variant.; C. Stable in-frame internally shortened dystrophin — That is the Becker mechanism; a nonsense variant creates a premature stop codon and absent dystrophin.; D. Expansion of DMPK CTG repeats — DMPK CTG expansion causes myotonic dystrophy type 1.", "pearl": "A premature stop codon disrupts full-length dystrophin production.", "srcAnswer": "C"}, {"num": 3, "level": "", "question": "A milder adolescent dystrophinopathy preserves walking into adulthood. Which molecular pattern supports Becker rather than Duchenne?", "options": ["In-frame dystrophin variant preserving reading frame", "Out-of-frame frameshift with absent dystrophin", "Biallelic SMN1 loss", "Maternal mitochondrial heteroplasmy"], "answer": 0, "explanation": "Reading-frame rule often predicts milder Becker phenotype, with exceptions. Why not the others (added — not from source): B. Out-of-frame frameshift with absent dystrophin — Out-of-frame variants with absent dystrophin typically cause Duchenne, the more severe form.; C. Biallelic SMN1 loss — Biallelic SMN1 loss causes SMA, not a dystrophinopathy.; D. Maternal mitochondrial heteroplasmy — Dystrophinopathies are X-linked; heteroplasmy concerns mitochondrial DNA disorders.", "pearl": "Reading-frame rule often predicts milder Becker phenotype, with exceptions.", "srcAnswer": "D"}, {"num": 4, "level": "", "question": "A child with proximal weakness uses his hands to climb up his thighs. What does this sign indicate?", "options": ["Distal sensory neuropathy", "Neuromuscular fatigability confined to eyes", "Primary cerebellar ataxia", "Hip girdle weakness causing compensatory ascent"], "answer": 3, "explanation": "Gowers sign reflects proximal pelvic-girdle weakness. Why not the others (added — not from source): A. Distal sensory neuropathy — Neuropathy causes distal weakness and sensory loss; the Gowers sign reflects proximal weakness.; B. Neuromuscular fatigability confined to eyes — Ocular myasthenia causes ptosis and diplopia, not proximal hip weakness.; C. Primary cerebellar ataxia — Ataxia causes incoordination; climbing up the thighs reflects proximal hip-girdle weakness.", "pearl": "Gowers sign reflects proximal pelvic-girdle weakness.", "srcAnswer": "A"}, {"num": 5, "level": "", "question": "Boy with CK ~20,000 U/L has normal nerve-conduction velocity. What does the pattern favour?", "options": ["Pure autonomic neuropathy", "Primary myopathy rather than demyelinating neuropathy", "Anterior horn cell disease confirmed by normal NCS", "Acquired demyelinating polyneuropathy"], "answer": 1, "explanation": "Marked CK elevation and normal sensory conduction point toward muscle disease. Why not the others (added — not from source): A. Pure autonomic neuropathy — Autonomic neuropathy does not cause a CK of about 20,000 U/L or proximal weakness.; C. Anterior horn cell disease confirmed by normal NCS — SMA shows reduced CMAP amplitudes and a normal or mildly raised CK, not CK 20,000; normal NCS does not confirm it.; D. Acquired demyelinating polyneuropathy — Demyelinating neuropathy slows nerve conduction; normal NCS with very high CK indicates myopathy.", "pearl": "Marked CK elevation and normal sensory conduction point toward muscle disease.", "srcAnswer": "B"}, {"num": 6, "level": "", "question": "An affected father with X-linked DMD has an unaffected partner. Which offspring necessarily inherit his pathogenic X chromosome?", "options": ["All daughters, but none of his sons", "All sons and none of his daughters", "Half of sons and half of daughters", "Only children with high SMN2 copy number"], "answer": 0, "explanation": "Fathers transmit their X to daughters and Y to sons; phenotypic expression in daughters varies. Why not the others (added — not from source): B. All sons and none of his daughters — Sons receive their father's Y chromosome, so they cannot inherit his X-linked variant.; C. Half of sons and half of daughters — A father passes his X to every daughter and his Y to every son.; D. Only children with high SMN2 copy number — SMN2 copy number concerns SMA, not X-linked transmission.", "pearl": "Fathers transmit their X to daughters and Y to sons; phenotypic expression in daughters varies.", "srcAnswer": "C"}, {"num": 7, "level": "", "question": "Carrier mother of pathogenic DMD variant and unaffected father seek recurrence risk for each son. What is the probability?", "options": ["50% chance of inheriting the variant", "0% chance of inheriting the variant", "25% chance of inheriting the variant", "100% chance of inheriting the variant"], "answer": 0, "explanation": "Each son independently has a one-half risk of receiving maternal affected X. Why not the others (added — not from source): B. 0% chance of inheriting the variant — A carrier mother can pass the variant X to her sons.; C. 25% chance of inheriting the variant — 25% is the risk for any child of being an affected son; for a son specifically it is 50%.; D. 100% chance of inheriting the variant — A heterozygous carrier mother passes the variant X to half her children, not all.", "pearl": "Each son independently has a one-half risk of receiving maternal affected X.", "srcAnswer": "D"}, {"num": 8, "level": "", "question": "An ambulant school-age child with confirmed DMD has declining motor performance. Which longitudinal therapy has evidence of prolonging ambulation?", "options": ["Routine systemic antibiotics", "Long-term pyridostigmine as the primary disease therapy", "Specialist-supervised glucocorticoid treatment with monitoring", "Repeated IVIg courses"], "answer": 2, "explanation": "Glucocorticoids are established disease-modifying supportive treatment, with bone/endocrine monitoring. Why not the others (added — not from source): A. Routine systemic antibiotics — Antibiotics treat infection; they have no effect on dystrophic muscle decline.; B. Long-term pyridostigmine as the primary disease therapy — Pyridostigmine treats myasthenia; it does not slow DMD progression.; D. Repeated IVIg courses — IVIg treats immune-mediated neuropathy or myasthenia; DMD is not autoimmune.", "pearl": "Glucocorticoids are established disease-modifying supportive treatment, with bone/endocrine monitoring.", "srcAnswer": "A"}, {"num": 9, "level": "", "question": "Why is serial cardiac evaluation essential in DMD even in a child without chest symptoms?", "options": ["Normal ECG excludes future cardiomyopathy", "Cardiac involvement occurs only after loss of ambulation", "CK reflects left ventricular ejection fraction", "Cardiomyopathy may evolve before overt symptoms"], "answer": 3, "explanation": "Myocardial disease may be subclinical; specialist echocardiographic/CMR follow-up is necessary. Why not the others (added — not from source): A. Normal ECG excludes future cardiomyopathy — A normal ECG does not exclude evolving fibrosis; echo or cardiac MRI surveillance continues.; B. Cardiac involvement occurs only after loss of ambulation — Cardiomyopathy can start while the child still walks; surveillance begins at diagnosis.; C. CK reflects left ventricular ejection fraction — CK reflects skeletal muscle breakdown and falls as muscle is lost; it does not measure cardiac function.", "pearl": "Myocardial disease may be subclinical; specialist echocardiographic/CMR follow-up is necessary.", "srcAnswer": "B"}, {"num": 10, "level": "", "question": "DMD adolescent has progressive nocturnal headaches and morning fatigue. Which complication requires screening?", "options": ["Central diabetes insipidus", "Thyroid storm", "Isolated peripheral vestibulopathy", "Nocturnal hypoventilation"], "answer": 3, "explanation": "Respiratory muscle weakness produces nocturnal hypoventilation before daytime respiratory failure. Why not the others (added — not from source): A. Central diabetes insipidus — Diabetes insipidus causes polyuria and polydipsia, not morning headaches from CO₂ retention.; B. Thyroid storm — Morning headache and fatigue in advanced DMD point to nocturnal hypoventilation, not thyroid disease.; C. Isolated peripheral vestibulopathy — Vestibular disorders cause vertigo, not morning headache with fatigue.", "pearl": "Respiratory muscle weakness produces nocturnal hypoventilation before daytime respiratory failure.", "srcAnswer": "C"}, {"num": 11, "level": "", "question": "Why should chronic corticosteroids not be abruptly stopped in a DMD patient with major surgery?", "options": ["Risk of rebound hyperthyroidism", "Risk of adrenal suppression and need for stress-dose planning", "Risk of sudden SMN2 exon skipping", "Risk of cholinergic crisis"], "answer": 1, "explanation": "Long-term glucocorticoids suppress HPA axis, requiring perioperative endocrine planning. Why not the others (added — not from source): A. Risk of rebound hyperthyroidism — Stopping steroids does not cause hyperthyroidism; the risk is adrenal insufficiency.; C. Risk of sudden SMN2 exon skipping — SMN2 splicing concerns SMA therapy and is not affected by steroids.; D. Risk of cholinergic crisis — Cholinergic crisis comes from excess anticholinesterase in myasthenia, not from stopping steroids.", "pearl": "Long-term glucocorticoids suppress HPA axis, requiring perioperative endocrine planning.", "srcAnswer": "D"}, {"num": 12, "level": "", "question": "Which feature is particularly important before considering exon-skipping treatment?", "options": ["Presence of elevated CSF protein", "Positive anti-MuSK antibody titre", "Mutation amenability to the specific exon-targeted agent", "Number of SMN2 copies only"], "answer": 2, "explanation": "Mutation-specific eligibility is mandatory; approvals and outcomes vary by jurisdiction. Why not the others (added — not from source): A. Presence of elevated CSF protein — Raised CSF protein suggests GBS or CIDP; it is irrelevant to exon-skipping eligibility.; B. Positive anti-MuSK antibody titre — MuSK antibodies relate to myasthenia gravis, not dystrophin exon skipping.; D. Number of SMN2 copies only — SMN2 copy number guides SMA prognosis, not DMD exon-skipping eligibility.", "pearl": "Mutation-specific eligibility is mandatory; approvals and outcomes vary by jurisdiction.", "srcAnswer": "A"}, {"num": 13, "level": "", "question": "A toddler with DMD has significant difficulty rising but intact pinprick and vibration. Which pattern is most typical?", "options": ["Proximal motor-predominant weakness with preserved sensation", "Length-dependent sensory loss preceding weakness", "Pure dysautonomia with normal muscle strength", "Fluctuating diplopia isolated to evenings"], "answer": 0, "explanation": "DMD is a myopathy, with sensory examination usually intact. Why not the others (added — not from source): B. Length-dependent sensory loss preceding weakness — That is neuropathy; DMD spares sensation.; C. Pure dysautonomia with normal muscle strength — DMD causes marked proximal weakness, not isolated autonomic failure.; D. Fluctuating diplopia isolated to evenings — Fatigable diplopia suggests myasthenia, not a dystrophy.", "pearl": "DMD is a myopathy, with sensory examination usually intact.", "srcAnswer": "B"}, {"num": 14, "level": "", "question": "Which muscle pathology is classically seen in dystrophinopathy biopsy when genetics is inconclusive?", "options": ["Degeneration-regeneration and reduced dystrophin staining", "Onion-bulb formations confined to peripheral nerve", "Grouped small angular fibres with normal dystrophin", "Postsynaptic receptor loss with normal muscle histology"], "answer": 0, "explanation": "Dystrophin deficiency produces dystrophic muscle fibre changes and abnormal staining. Why not the others (added — not from source): B. Onion-bulb formations confined to peripheral nerve — Onion bulbs are seen in nerve biopsy in demyelinating neuropathy (e.g. CMT1A).; C. Grouped small angular fibres with normal dystrophin — Grouped atrophy indicates neurogenic disease such as SMA, with normal dystrophin.; D. Postsynaptic receptor loss with normal muscle histology — That describes myasthenia; dystrophinopathy shows necrosis, regeneration and absent dystrophin.", "pearl": "Dystrophin deficiency produces dystrophic muscle fibre changes and abnormal staining.", "srcAnswer": "C"}, {"num": 15, "level": "", "question": "A 9-year-old with DMD has progressive contractures. Which approach best preserves function?", "options": ["Avoiding assessment until wheelchair dependence", "Immobilization without physiotherapy", "Multidisciplinary stretching, orthoses and mobility planning", "Bed rest to prevent all muscle use"], "answer": 2, "explanation": "Anticipatory rehabilitation, range-of-motion support and equipment planning reduce complications. Why not the others (added — not from source): A. Avoiding assessment until wheelchair dependence — Contractures are prevented by early, regular assessment, not by waiting for wheelchair use.; B. Immobilization without physiotherapy — Immobility worsens contractures; daily stretching and orthoses help preserve range.; D. Bed rest to prevent all muscle use — Bed rest accelerates weakness and contractures in DMD.", "pearl": "Anticipatory rehabilitation, range-of-motion support and equipment planning reduce complications.", "srcAnswer": "D"}, {"num": 16, "level": "", "question": "Which laboratory biomarker typically rises dramatically before overt weakness in DMD?", "options": ["Serum creatine kinase", "Plasma copper concentration", "Serum acetylcholine receptor antibody", "CSF oligoclonal bands"], "answer": 0, "explanation": "Muscle-fibre damage elevates CK, often markedly and early. Why not the others (added — not from source): B. Plasma copper concentration — Copper is relevant to Wilson and Menkes disease, not DMD.; C. Serum acetylcholine receptor antibody — AChR antibodies are markers of myasthenia, not muscular dystrophy.; D. CSF oligoclonal bands — Oligoclonal bands suggest CNS inflammation such as MS, not dystrophy.", "pearl": "Muscle-fibre damage elevates CK, often markedly and early.", "srcAnswer": "A"}, {"num": 17, "level": "", "question": "What is the characteristic pattern of inheritance of most dystrophinopathies?", "options": ["X-linked recessive", "Mitochondrial maternal inheritance", "Autosomal dominant with full penetrance", "Autosomal recessive with SMN1 biallelic loss"], "answer": 0, "explanation": "DMD pathogenic variants are on Xp21, with carrier and de novo possibilities. Why not the others (added — not from source): B. Mitochondrial maternal inheritance — Mitochondrial inheritance affects both sexes via the mother; DMD is X-linked.; C. Autosomal dominant with full penetrance — Dystrophinopathies are X-linked recessive, affecting mainly males.; D. Autosomal recessive with SMN1 biallelic loss — That is SMA inheritance; dystrophinopathies are X-linked.", "pearl": "DMD pathogenic variants are on Xp21, with carrier and de novo possibilities.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day25',label:'Day 25',set:'Quiz 1',href:'Day25/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day25_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 25 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 25 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 25'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 25');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day25:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
