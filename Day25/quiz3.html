@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
const quiz=[{"num": 35, "level": "", "question": "An SMA child has reduced cough strength. What is an appropriate longitudinal priority?", "options": ["Routine high-dose sedatives", "Respiratory assessment and airway-clearance support", "Cease infection prevention", "Obtain lumbar puncture at every visit"], "answer": 1, "explanation": "Respiratory infections and ineffective cough are major morbidity drivers. Why not the others (added — not from source): A. Routine high-dose sedatives — Sedatives depress respiratory drive in children with weak respiratory muscles.; C. Cease infection prevention — Vaccination and infection prevention are key in weak-cough SMA.; D. Obtain lumbar puncture at every visit — Lumbar puncture is for nusinersen dosing, not routine respiratory care.", "pearl": "Respiratory infections and ineffective cough are major morbidity drivers.", "srcAnswer": "D"}, {"num": 36, "level": "", "question": "SMA type 1 historically corresponds to what untreated motor milestone?", "options": ["Independent walking achieved in infancy", "Normal adult ambulation", "Only distal hand weakness after puberty", "Never independently sitting"], "answer": 3, "explanation": "Classical SMA type 1 typically presents in infancy and never sits unsupported without disease-modifying therapy. Why not the others (added — not from source): A. Independent walking achieved in infancy — Independent walking defines SMA type 3, not type 1.; B. Normal adult ambulation — Type 1 children never sit unaided; adult ambulation describes type 4.; C. Only distal hand weakness after puberty — SMA is proximal-predominant; type 1 presents in early infancy.", "pearl": "Classical SMA type 1 typically presents in infancy and never sits unsupported without disease-modifying therapy.", "srcAnswer": "A"}, {"num": 37, "level": "", "question": "SMA type 2 historically has which motor milestone pattern?", "options": ["Onset only after age 18 years", "Never achieves independent head control in all cases", "Always walks independently", "Sits but does not independently walk"], "answer": 3, "explanation": "Type 2 sitters attain sitting but not unassisted walking in untreated natural history. Why not the others (added — not from source): A. Onset only after age 18 years — Adult onset is SMA type 4.; B. Never achieves independent head control in all cases — That describes type 1; type 2 children sit independently.; C. Always walks independently — Independent walking defines type 3, not type 2.", "pearl": "Type 2 sitters attain sitting but not unassisted walking in untreated natural history.", "srcAnswer": "B"}, {"num": 38, "level": "", "question": "SMA type 3 generally is characterized by what?", "options": ["Always fatal respiratory failure in infancy", "Never sitting independently", "Achieved independent walking, with possible later loss", "Severe prenatal contractures in all patients"], "answer": 2, "explanation": "Type 3 patients initially walk independently, though endurance may decline. Why not the others (added — not from source): A. Always fatal respiratory failure in infancy — That describes untreated type 1.; B. Never sitting independently — That defines type 1.; D. Severe prenatal contractures in all patients — Prenatal onset with contractures is type 0; type 3 children walk.", "pearl": "Type 3 patients initially walk independently, though endurance may decline.", "srcAnswer": "C"}, {"num": 39, "level": "", "question": "An unaffected couple has a child with biallelic SMN1-related SMA. Which recurrence risk applies to each subsequent pregnancy?", "options": ["100% of pregnancies", "25% when both parents are carriers", "50% for each son but none of daughters", "0% if the first child survived"], "answer": 1, "explanation": "Classical 5q SMA is autosomal recessive, though carrier-testing nuances exist. Why not the others (added — not from source): A. 100% of pregnancies — Two carriers have a 25% risk in each pregnancy.; C. 50% for each son but none of daughters — That is an X-linked pattern; SMA is autosomal recessive.; D. 0% if the first child survived — Recurrence risk is independent of a sibling's outcome.", "pearl": "Classical 5q SMA is autosomal recessive, though carrier-testing nuances exist.", "srcAnswer": "D"}, {"num": 40, "level": "", "question": "Which assay is central in first-line molecular confirmation of suspected 5q SMA?", "options": ["SMN1 copy-number assay with sequence analysis when indicated", "Serum anti-AChR immunoassay", "DMD immunohistochemistry alone", "Only CSF oligoclonal band testing"], "answer": 0, "explanation": "Molecular assessment of SMN1 deletion/copies establishes most cases. Why not the others (added — not from source): B. Serum anti-AChR immunoassay — AChR antibodies are for myasthenia.; C. DMD immunohistochemistry alone — Dystrophin staining evaluates dystrophinopathy, not SMA.; D. Only CSF oligoclonal band testing — Oligoclonal bands are for CNS inflammation.", "pearl": "Molecular assessment of SMN1 deletion/copies establishes most cases.", "srcAnswer": "A"}, {"num": 41, "level": "", "question": "Why should an SMA patient have swallowing assessment despite gene-directed therapy?", "options": ["Aspiration cannot occur without fever", "Treatment eliminates all dysphagia risk", "Bulbar weakness and aspiration risk may persist", "Feeding tests determine DMD exon position"], "answer": 2, "explanation": "Respiratory, feeding and orthopedic needs can remain despite disease-modifying therapy. Why not the others (added — not from source): A. Aspiration cannot occur without fever — Silent aspiration is common and often afebrile.; B. Treatment eliminates all dysphagia risk — Bulbar weakness may persist or progress despite treatment.; D. Feeding tests determine DMD exon position — Swallow assessment has no link to DMD genetics.", "pearl": "Respiratory, feeding and orthopedic needs can remain despite disease-modifying therapy.", "srcAnswer": "B"}, {"num": 42, "level": "", "question": "After AAV9-based SMA gene therapy, monitoring should include which adverse-effect domain?", "options": ["Selective nephrotic syndrome as the sole toxicity", "Hepatic injury and thrombocytopenia with specialist surveillance", "Only peripheral neuropathy", "Only lens opacity"], "answer": 1, "explanation": "Gene therapy carries potentially serious hepatic/hematologic risks and requires protocol-led monitoring. Why not the others (added — not from source): A. Selective nephrotic syndrome as the sole toxicity — Renal TMA can occur, but liver injury and thrombocytopenia are the key monitored effects.; C. Only peripheral neuropathy — Neuropathy is not the main toxicity; hepatotoxicity and thrombocytopenia (and TMA) are.; D. Only lens opacity — Lens opacity is not a recognised onasemnogene toxicity; the liver and platelets are monitored.", "pearl": "Gene therapy carries potentially serious hepatic/hematologic risks and requires protocol-led monitoring.", "srcAnswer": "C"}, {"num": 43, "level": "", "question": "Which distinguishing finding supports SMA over DMD in an infant?", "options": ["Marked calf pseudohypertrophy and classic Gowers", "Fluctuating isolated ocular diplopia", "Tongue fasciculations and generalized areflexia", "Primary distal sensory loss"], "answer": 2, "explanation": "Anterior horn cell degeneration gives LMN signs, unlike preschool muscular dystrophy. Why not the others (added — not from source): A. Marked calf pseudohypertrophy and classic Gowers — These are DMD features, not SMA.; B. Fluctuating isolated ocular diplopia — Fatigable diplopia suggests myasthenia.; D. Primary distal sensory loss — Both SMA and DMD spare sensation.", "pearl": "Anterior horn cell degeneration gives LMN signs, unlike preschool muscular dystrophy.", "srcAnswer": "D"}, {"num": 44, "level": "", "question": "An SMA newborn screen is positive. What must happen before treatment planning?", "options": ["Use creatine kinase alone to confirm SMA", "Wait until independent walking age", "Prompt confirmatory genetic testing and urgent neuromuscular referral", "Delay until motor milestones are lost"], "answer": 2, "explanation": "Screening is not the final molecular diagnosis; early referral and confirmation are critical. Why not the others (added — not from source): A. Use creatine kinase alone to confirm SMA — CK is normal or mildly raised in SMA; genetic confirmation is needed.; B. Wait until independent walking age — Delay loses the presymptomatic treatment window.; D. Delay until motor milestones are lost — Delay allows irreversible motor-neuron loss; presymptomatic therapy is best.", "pearl": "Screening is not the final molecular diagnosis; early referral and confirmation are critical.", "srcAnswer": "A"}, {"num": 45, "level": "", "question": "Child develops ascending flaccid weakness and areflexia 10 days after diarrhoea. Leading working diagnosis?", "options": ["Guillain–Barré syndrome", "Duchenne muscular dystrophy", "Spinal muscular atrophy type 1", "Juvenile myasthenia gravis"], "answer": 0, "explanation": "GBS is a monophasic immune polyradiculoneuropathy often post-infectious. Why not the others (added — not from source): B. Duchenne muscular dystrophy — DMD is slowly progressive proximal weakness, not acute post-infectious paralysis.; C. Spinal muscular atrophy type 1 — SMA type 1 presents in early infancy, not after diarrhoea in a previously normal child.; D. Juvenile myasthenia gravis — Myasthenia causes fatigable ocular/bulbar weakness with preserved reflexes.", "pearl": "GBS is a monophasic immune polyradiculoneuropathy often post-infectious.", "srcAnswer": "B"}, {"num": 46, "level": "", "question": "Weak child after gastroenteritis develops rapidly progressive weakness and dysautonomia. Immediate priority?", "options": ["Begin long-term oral steroids as sole therapy", "Discharge because weakness is symmetrical", "Wait for CSF protein rise before monitoring", "Monitor respiratory mechanics, bulbar function and autonomic instability"], "answer": 3, "explanation": "Respiratory and autonomic complications can evolve rapidly in GBS. Why not the others (added — not from source): A. Begin long-term oral steroids as sole therapy — Steroids are ineffective in GBS; monitoring and IVIg or plasma exchange are needed.; B. Discharge because weakness is symmetrical — Symmetrical rapidly progressive weakness is typical of GBS and needs admission.; C. Wait for CSF protein rise before monitoring — CSF protein may be normal early; monitoring cannot wait.", "pearl": "Respiratory and autonomic complications can evolve rapidly in GBS.", "srcAnswer": "C"}, {"num": 47, "level": "", "question": "Early GBS lumbar puncture shows normal CSF protein. Best interpretation?", "options": ["Normal protein establishes SMA", "Normal CSF mandates a primary myopathy diagnosis", "Normal CSF protein early does not exclude GBS", "Normal protein excludes GBS at any time"], "answer": 2, "explanation": "Albuminocytologic dissociation can be absent early in the course. Why not the others (added — not from source): A. Normal protein establishes SMA — CSF protein does not diagnose SMA.; B. Normal CSF mandates a primary myopathy diagnosis — A normal early CSF does not point to myopathy.; D. Normal protein excludes GBS at any time — Albuminocytological dissociation often appears only after the first week.", "pearl": "Albuminocytologic dissociation can be absent early in the course.", "srcAnswer": "D"}, {"num": 48, "level": "", "question": "GBS patient cannot walk independently 8 days after onset. Guideline-supported treatment?", "options": ["IVIg total 2 g/kg, commonly 0.4 g/kg/day for 5 days", "Exon-skipping dystrophin treatment", "Pyridostigmine alone", "Long-course oral prednisolone alone"], "answer": 0, "explanation": "EAN/PNS supports IVIg 0.4 g/kg/day for five days for nonambulant early GBS. Why not the others (added — not from source): B. Exon-skipping dystrophin treatment — Exon skipping is a DMD therapy.; C. Pyridostigmine alone — Pyridostigmine treats myasthenia, not GBS.; D. Long-course oral prednisolone alone — Oral steroids are not effective in GBS.", "pearl": "EAN/PNS supports IVIg 0.4 g/kg/day for five days for nonambulant early GBS.", "srcAnswer": "A"}, {"num": 49, "level": "", "question": "Which therapy is comparable in efficacy to IVIg in appropriate severe GBS cases?", "options": ["Intrathecal nusinersen", "Systemic corticosteroids alone", "Plasma exchange", "Acetazolamide"], "answer": 2, "explanation": "Plasma exchange is a validated alternative to IVIg for GBS. Why not the others (added — not from source): A. Intrathecal nusinersen — Nusinersen treats SMA.; B. Systemic corticosteroids alone — Steroids alone have not been shown to help GBS.; D. Acetazolamide — Acetazolamide is used for periodic paralysis and IIH, not GBS.", "pearl": "Plasma exchange is a validated alternative to IVIg for GBS.", "srcAnswer": "B"}, {"num": 50, "level": "", "question": "After 10 weeks of progressive relapsing neuropathic weakness, which diagnostic reconsideration is most appropriate?", "options": ["Congenital myasthenic syndrome only", "Dystrophinopathy only", "Persistent simple Bell palsy", "Acute-onset CIDP rather than monophasic GBS"], "answer": 3, "explanation": "Progression beyond 8 weeks should prompt consideration of acute-onset CIDP. Why not the others (added — not from source): A. Congenital myasthenic syndrome only — CMS is a congenital NMJ disorder, not an acquired relapsing neuropathy.; B. Dystrophinopathy only — Dystrophinopathy is a slowly progressive myopathy, not a relapsing neuropathy.; C. Persistent simple Bell palsy — Bell palsy is an isolated facial nerve palsy.", "pearl": "Progression beyond 8 weeks should prompt consideration of acute-onset CIDP.", "srcAnswer": "C"}, {"num": 51, "level": "", "question": "GBS child develops ophthalmoplegia, ataxia, areflexia. Which GBS variant is classic?", "options": ["DMD carrier phenotype", "Pure sensory small-fibre neuropathy", "AMAN without cranial features", "Miller Fisher syndrome"], "answer": 3, "explanation": "Miller Fisher is characterized by ophthalmoplegia, ataxia and areflexia, often anti-GQ1b associated. Why not the others (added — not from source): A. DMD carrier phenotype — DMD carriers do not develop ophthalmoplegia, ataxia and areflexia.; B. Pure sensory small-fibre neuropathy — Small-fibre neuropathy causes pain and dysautonomia, not ophthalmoplegia and ataxia.; C. AMAN without cranial features — AMAN is pure motor axonal GBS without ophthalmoplegia or ataxia.", "pearl": "Miller Fisher is characterized by ophthalmoplegia, ataxia and areflexia, often anti-GQ1b associated.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day25',label:'Day 25',set:'Quiz 3',href:'Day25/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day25_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 25 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 25 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 25'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 25');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day25:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
