@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "", "question": "An adolescent with dystrophinopathy loses independent walking. Which surveillance should continue?", "options": ["Only weekly visual acuity measurement", "Only muscle CK serial monitoring", "Cardiac, respiratory, scoliosis and bone-health assessment", "Stop cardiology visits after wheelchair use"], "answer": 2, "explanation": "Multisystem deterioration continues despite loss of walking. Why not the others (added — not from source): A. Only weekly visual acuity measurement — DMD does not mainly affect vision; heart, lungs, spine and bone need surveillance.; B. Only muscle CK serial monitoring — CK falls as muscle is lost and does not track cardiac, respiratory or spinal complications.; D. Stop cardiology visits after wheelchair use — Cardiac risk increases after loss of ambulation; surveillance must continue.", "pearl": "Multisystem deterioration continues despite loss of walking.", "srcAnswer": "C"}, {"num": 19, "level": "", "question": "DMD child is prescribed steroids and has vertebral pain. Which complication should be specifically considered?", "options": ["Adenomatous polyposis", "Fragility vertebral fracture", "Acute inflammatory demyelinating neuropathy", "Optic neuritis"], "answer": 1, "explanation": "Steroids, immobilization and disease contribute to osteoporosis/vertebral fractures. Why not the others (added — not from source): A. Adenomatous polyposis — Polyposis is unrelated to steroids or DMD; back pain on steroids suggests a vertebral fracture.; C. Acute inflammatory demyelinating neuropathy — GBS causes ascending weakness and areflexia; vertebral pain on chronic steroids suggests a fragility fracture.; D. Optic neuritis — Optic neuritis causes visual loss with painful eye movements, not vertebral pain.", "pearl": "Steroids, immobilization and disease contribute to osteoporosis/vertebral fractures.", "srcAnswer": "D"}, {"num": 20, "level": "", "question": "Newborn boy has high CK and maternal male relatives with early loss of ambulation. Which counselling fact matters?", "options": ["Daughters of affected fathers never inherit the variant", "A normal maternal CK excludes carrier status", "Some variants arise de novo, so a negative family history does not exclude DMD", "All affected boys must have affected fathers"], "answer": 2, "explanation": "De novo variants and germline mosaicism complicate pedigree interpretation. Why not the others (added — not from source): A. Daughters of affected fathers never inherit the variant — An affected father passes his X to every daughter, so all are obligate carriers.; B. A normal maternal CK excludes carrier status — Carrier CK is normal in many carriers; genetic testing is required.; D. All affected boys must have affected fathers — DMD is X-linked; fathers pass a Y to sons, so affected boys inherit the variant from their mothers or de novo.", "pearl": "De novo variants and germline mosaicism complicate pedigree interpretation.", "srcAnswer": "A"}, {"num": 21, "level": "", "question": "A child has calf enlargement and proximal weakness. Why is this called pseudohypertrophy?", "options": ["Synovial proliferation within the knee", "Fatty and fibrous replacement enlarges the calf despite loss of functional tissue", "Peripheral oedema from kidney failure", "Increase in contractile muscle fibres alone"], "answer": 1, "explanation": "Dystrophic muscle replacement by fat/fibrosis increases girth but not strength. Why not the others (added — not from source): A. Synovial proliferation within the knee — Pseudohypertrophy is in the calf muscle, not the knee joint.; C. Peripheral oedema from kidney failure — Oedema is soft and pitting; DMD calves are firm because of fibro-fatty replacement.; D. Increase in contractile muscle fibres alone — True hypertrophy would increase strength; in DMD fat and fibrosis replace muscle.", "pearl": "Dystrophic muscle replacement by fat/fibrosis increases girth but not strength.", "srcAnswer": "B"}, {"num": 22, "level": "", "question": "In an advanced DMD patient, weak cough and recurrent infections indicate need for what?", "options": ["Respiratory assessment including cough-assist strategy", "Peripheral nerve decompression", "Long-term anti-epileptic monotherapy", "Routine plasma exchange"], "answer": 0, "explanation": "Airway clearance and ventilatory support planning reduce respiratory complications. Why not the others (added — not from source): B. Peripheral nerve decompression — Weak cough in DMD comes from respiratory muscle weakness, not nerve entrapment.; C. Long-term anti-epileptic monotherapy — Antiseizure drugs do not treat respiratory muscle weakness.; D. Routine plasma exchange — Plasma exchange removes antibodies (GBS, myasthenia); it does not help DMD respiratory weakness.", "pearl": "Airway clearance and ventilatory support planning reduce respiratory complications.", "srcAnswer": "C"}, {"num": 23, "level": "", "question": "Which distinction best separates congenital myotonic dystrophy from classic DMD?", "options": ["X-linked pedigree with high CK", "Neonatal hypotonia with maternal myotonia and DMPK expansion", "Absent dystrophin immunostaining", "Preschool Gowers and dystrophin deletion"], "answer": 1, "explanation": "Congenital DM1 is often maternally transmitted and presents in infancy, unlike typical preschool DMD. Why not the others (added — not from source): A. X-linked pedigree with high CK — That pattern supports DMD; congenital myotonic dystrophy is autosomal dominant with maternal transmission.; C. Absent dystrophin immunostaining — Absent dystrophin confirms DMD; dystrophin is normal in myotonic dystrophy.; D. Preschool Gowers and dystrophin deletion — These are DMD features and do not separate it from myotonic dystrophy.", "pearl": "Congenital DM1 is often maternally transmitted and presents in infancy, unlike typical preschool DMD.", "srcAnswer": "D"}, {"num": 24, "level": "", "question": "For mutation-confirmed DMD, why is treatment selection not based on CK value alone?", "options": ["CK level uniquely predicts exon amenability", "CK alone determines glucocorticoid stress dosing", "CK excludes cardiac risk", "Mutation class, functional stage, regulatory eligibility and safety determine therapy"], "answer": 3, "explanation": "Precision therapeutics require genotype-specific and clinical eligibility evaluation. Why not the others (added — not from source): A. CK level uniquely predicts exon amenability — Exon amenability depends on the specific deletion, not on CK.; B. CK alone determines glucocorticoid stress dosing — Stress dosing depends on steroid exposure and the procedure or illness, not on CK.; C. CK excludes cardiac risk — CK does not reflect cardiac involvement.", "pearl": "Precision therapeutics require genotype-specific and clinical eligibility evaluation.", "srcAnswer": "A"}, {"num": 25, "level": "", "question": "DMD patient develops swallowing difficulty late in disease. Which assessment is appropriate?", "options": ["Eliminate respiratory surveillance", "Speech/swallow and nutrition evaluation for aspiration risk", "Serum anti-AChR alone as definitive DMD progression marker", "Treat all dysphagia as conversion disorder"], "answer": 1, "explanation": "Bulbar and respiratory complications call for coordinated nutritional/swallow care. Why not the others (added — not from source): A. Eliminate respiratory surveillance — Dysphagia raises aspiration risk, so respiratory surveillance becomes more important.; C. Serum anti-AChR alone as definitive DMD progression marker — AChR antibodies are irrelevant in DMD.; D. Treat all dysphagia as conversion disorder — Late DMD dysphagia is organic (oropharyngeal weakness) and risks aspiration.", "pearl": "Bulbar and respiratory complications call for coordinated nutritional/swallow care.", "srcAnswer": "B"}, {"num": 26, "level": "", "question": "A floppy infant with tongue fasciculations, absent reflexes and preserved cognition most likely has what localization?", "options": ["Neuromuscular junction autoimmune blockade", "Primary corticospinal tract disease", "Anterior horn cell motor-neuron disorder", "Peripheral sensory neuronopathy"], "answer": 2, "explanation": "SMA causes LMN motor weakness with areflexia and tongue fasciculations. Why not the others (added — not from source): A. Neuromuscular junction autoimmune blockade — NMJ disorders give fatigable weakness without fasciculations or areflexia.; B. Primary corticospinal tract disease — Upper motor neuron disease gives hyperreflexia, not areflexia with tongue fasciculations.; D. Peripheral sensory neuronopathy — Sensory neuronopathy causes sensory ataxia, not fasciculations with profound weakness.", "pearl": "SMA causes LMN motor weakness with areflexia and tongue fasciculations.", "srcAnswer": "C"}, {"num": 27, "level": "", "question": "What genetic alteration causes most classic 5q spinal muscular atrophy?", "options": ["DMD exon deletion on Xp21", "Biallelic loss or pathogenic variants of SMN1", "CTG expansion in DMPK", "PMP22 duplication"], "answer": 1, "explanation": "5q SMA results from SMN1 deficiency; SMN2 modulates phenotype. Why not the others (added — not from source): A. DMD exon deletion on Xp21 — Xp21 deletions cause Duchenne/Becker, not SMA.; C. CTG expansion in DMPK — DMPK CTG expansion causes myotonic dystrophy type 1.; D. PMP22 duplication — PMP22 duplication causes CMT1A.", "pearl": "5q SMA results from SMN1 deficiency; SMN2 modulates phenotype.", "srcAnswer": "D"}, {"num": 28, "level": "", "question": "What generally predicts milder SMA phenotypes among similar patients?", "options": ["Positive anti-AChR antibodies", "Lower SMN2 copy number in every case", "Higher DMD copy number", "Higher SMN2 copy number, with exceptions"], "answer": 3, "explanation": "More SMN2 copies generally correlate with greater SMN protein and milder phenotype. Why not the others (added — not from source): A. Positive anti-AChR antibodies — AChR antibodies indicate myasthenia and do not modify SMA.; B. Lower SMN2 copy number in every case — Fewer SMN2 copies predict a more severe phenotype, not a milder one.; C. Higher DMD copy number — DMD gene copies are unrelated to SMA severity.", "pearl": "More SMN2 copies generally correlate with greater SMN protein and milder phenotype.", "srcAnswer": "A"}, {"num": 29, "level": "", "question": "An SMA infant receives nusinersen. What is its mechanism?", "options": ["Dystrophin exon 51 skipping", "Small-molecule SMN2 splicing taken orally", "Antisense modulation of SMN2 splicing to include exon 7", "AAV delivery of an SMN1 transgene"], "answer": 2, "explanation": "Nusinersen is an intrathecal antisense oligonucleotide that promotes full-length SMN from SMN2. Why not the others (added — not from source): A. Dystrophin exon 51 skipping — Exon 51 skipping (eteplirsen) is a DMD therapy.; B. Small-molecule SMN2 splicing taken orally — That is risdiplam; nusinersen is an intrathecal antisense oligonucleotide.; D. AAV delivery of an SMN1 transgene — That is onasemnogene abeparvovec (gene therapy), not nusinersen.", "pearl": "Nusinersen is an intrathecal antisense oligonucleotide that promotes full-length SMN from SMN2.", "srcAnswer": "B"}, {"num": 30, "level": "", "question": "Which route characterizes nusinersen administration?", "options": ["Intramuscular weekly injection", "Intrathecal injection", "Intravenous single infusion", "Oral daily liquid"], "answer": 1, "explanation": "Nusinersen requires intrathecal delivery, with loading and maintenance phases. Why not the others (added — not from source): A. Intramuscular weekly injection — Nusinersen is not given intramuscularly.; C. Intravenous single infusion — A single IV infusion describes onasemnogene; nusinersen is given intrathecally.; D. Oral daily liquid — Oral daily dosing describes risdiplam.", "pearl": "Nusinersen requires intrathecal delivery, with loading and maintenance phases.", "srcAnswer": "C"}, {"num": 31, "level": "", "question": "An SMA child is offered risdiplam. Which statement accurately describes treatment?", "options": ["Oral SMN2 splicing modifier", "Intravenous dystrophin replacement", "Intrathecal SMN1 antisense oligonucleotide", "One-time AAV9 SMN1 replacement"], "answer": 0, "explanation": "Risdiplam is an oral SMN2 splicing modifier; local approval and eligibility vary. Why not the others (added — not from source): B. Intravenous dystrophin replacement — No such therapy exists, and dystrophin is irrelevant to SMA.; C. Intrathecal SMN1 antisense oligonucleotide — Nusinersen is an intrathecal ASO acting on SMN2; risdiplam is oral.; D. One-time AAV9 SMN1 replacement — That is onasemnogene abeparvovec.", "pearl": "Risdiplam is an oral SMN2 splicing modifier; local approval and eligibility vary.", "srcAnswer": "D"}, {"num": 32, "level": "", "question": "Onasemnogene abeparvovec works primarily by which approach?", "options": ["Neutralization of acetylcholine receptors", "Intrathecal ASO blocking SMN2 silencer", "AAV9-mediated delivery of functional SMN1", "Daily oral SMN2 exon inclusion"], "answer": 2, "explanation": "Gene transfer delivers SMN1 via an AAV9 vector. Why not the others (added — not from source): A. Neutralization of acetylcholine receptors — This is the myasthenia mechanism, not SMA gene therapy.; B. Intrathecal ASO blocking SMN2 silencer — That describes nusinersen.; D. Daily oral SMN2 exon inclusion — That describes risdiplam.", "pearl": "Gene transfer delivers SMN1 via an AAV9 vector.", "srcAnswer": "A"}, {"num": 33, "level": "", "question": "Why is treatment before symptoms especially valuable after newborn SMA screening?", "options": ["Makes genotype confirmation unnecessary", "Eliminates the need for multidisciplinary respiratory care", "Reverses all lost motor neurons regardless of stage", "Prevents irreversible motor-neuron loss before major denervation"], "answer": 3, "explanation": "Earlier SMN-directed treatment improves potential outcomes but cannot resurrect lost motor neurons. Why not the others (added — not from source): A. Makes genotype confirmation unnecessary — A positive screen still needs confirmatory SMN1/SMN2 testing.; B. Eliminates the need for multidisciplinary respiratory care — Treated children still need respiratory, nutritional and orthopaedic care.; C. Reverses all lost motor neurons regardless of stage — Lost motor neurons do not regenerate; that is why early treatment matters.", "pearl": "Earlier SMN-directed treatment improves potential outcomes but cannot resurrect lost motor neurons.", "srcAnswer": "B"}, {"num": 34, "level": "", "question": "A neonate with severe SMA has paradoxical breathing and bell-shaped chest. Which muscle pattern explains this?", "options": ["Isolated upper-airway structural stenosis", "Weak intercostals with relative diaphragmatic preservation", "Isolated cardiomyopathy", "Severe primary diaphragmatic paralysis with normal intercostals"], "answer": 1, "explanation": "Early intercostal weakness with relatively spared diaphragm produces paradoxical respiratory motion. Why not the others (added — not from source): A. Isolated upper-airway structural stenosis — Upper-airway stenosis causes stridor, not a bell-shaped chest with paradoxical breathing.; C. Isolated cardiomyopathy — SMA does not cause cardiomyopathy; the chest shape reflects intercostal weakness.; D. Severe primary diaphragmatic paralysis with normal intercostals — In SMA the diaphragm is relatively spared and the intercostals are weak — the reverse.", "pearl": "Early intercostal weakness with relatively spared diaphragm produces paradoxical respiratory motion.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day25',label:'Day 25',set:'Quiz 2',href:'Day25/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day25_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 25 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 25 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 25'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 25');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day25:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
