<script>
const quiz=[{"num": 52, "level": "", "question": "Electrophysiology shows severe demyelination and conduction block in a child with subacute neuropathy. What is being measured?", "options": ["Neuromuscular junction antibody titre", "Peripheral nerve conduction abnormalities", "SMN2 copy number", "Direct quantification of dystrophin protein"], "answer": 1, "explanation": "NCS assesses nerve conduction, latency and amplitude for neuropathy classification. Why not the others (added — not from source): A. Neuromuscular junction antibody titre — Antibodies are serological tests, not electrophysiology.; C. SMN2 copy number — SMN2 copies are measured by genetic testing.; D. Direct quantification of dystrophin protein — Dystrophin is measured on muscle biopsy, not by nerve conduction.", "pearl": "NCS assesses nerve conduction, latency and amplitude for neuropathy classification.", "srcAnswer": "A"}, {"num": 53, "level": "", "question": "Painless distal weakness, pes cavus, hammer toes and family history suggest which disorder?", "options": ["Charcot–Marie–Tooth neuropathy", "Juvenile ocular myasthenia", "Congenital muscular dystrophy in all cases", "Acute GBS"], "answer": 0, "explanation": "CMT is hereditary motor-sensory neuropathy with foot deformity and distal wasting. Why not the others (added — not from source): B. Juvenile ocular myasthenia — Ocular myasthenia causes ptosis and diplopia, not distal wasting with pes cavus.; C. Congenital muscular dystrophy in all cases — CMD is a myopathy with high CK, not a familial distal neuropathy.; D. Acute GBS — GBS is acute; a familial, chronic distal neuropathy with pes cavus is CMT.", "pearl": "CMT is hereditary motor-sensory neuropathy with foot deformity and distal wasting.", "srcAnswer": "B"}, {"num": 54, "level": "", "question": "Uniformly slowed nerve conduction in inherited neuropathy with distal wasting suggests which common genetic subtype?", "options": ["5q SMA from SMN1 deletion", "CMT1A from PMP22 duplication", "Congenital myotonic dystrophy", "DMD from dystrophin out-of-frame variant"], "answer": 1, "explanation": "PMP22 duplication is a common cause of demyelinating CMT1A. Why not the others (added — not from source): A. 5q SMA from SMN1 deletion — SMA affects motor neurons with normal sensory conduction.; C. Congenital myotonic dystrophy — Myotonic dystrophy is a myopathy and does not uniformly slow conduction.; D. DMD from dystrophin out-of-frame variant — DMD is a myopathy with normal nerve conduction.", "pearl": "PMP22 duplication is a common cause of demyelinating CMT1A.", "srcAnswer": "C"}, {"num": 55, "level": "", "question": "A child with pes cavus has absent ankle reflexes and reduced vibration sense. What localization is favoured?", "options": ["Pure primary cerebellar lesion", "Isolated corticospinal spasticity", "Primary junction disorder with normal sensation", "Length-dependent peripheral neuropathy"], "answer": 3, "explanation": "Distal sensory loss plus hyporeflexia implies peripheral nerve disease. Why not the others (added — not from source): A. Pure primary cerebellar lesion — Cerebellar lesions do not cause areflexia and reduced vibration with pes cavus.; B. Isolated corticospinal spasticity — Corticospinal lesions cause hyperreflexia.; C. Primary junction disorder with normal sensation — NMJ disorders preserve sensation and reflexes.", "pearl": "Distal sensory loss plus hyporeflexia implies peripheral nerve disease.", "srcAnswer": "D"}, {"num": 56, "level": "", "question": "An infant has unilateral wrist-drop after prolonged compression. Which general pathological mechanism may explain focal deficit?", "options": ["Biallelic SMN1 loss", "Focal mononeuropathy of affected motor nerve", "Autoimmune generalized myasthenia", "Generalized dystrophin deficiency"], "answer": 1, "explanation": "Focal nerve injury follows the specific nerve distribution. Why not the others (added — not from source): A. Biallelic SMN1 loss — Biallelic SMN1 loss causes SMA, not a dystrophinopathy.; C. Autoimmune generalized myasthenia — Myasthenia causes fatigable generalised weakness, not focal compressive wrist drop.; D. Generalized dystrophin deficiency — Dystrophin deficiency causes generalised myopathy, not focal wrist drop.", "pearl": "Focal nerve injury follows the specific nerve distribution.", "srcAnswer": "A"}, {"num": 57, "level": "", "question": "Acute ascending areflexic paralysis follows Campylobacter infection. Which subtype is associated with axonal motor neuropathy?", "options": ["Acute motor axonal neuropathy (AMAN)", "Demyelinating CMT1A", "Congenital dystrophinopathy", "Ocular myasthenia"], "answer": 0, "explanation": "AMAN is a motor axonal GBS variant often associated with anti-ganglioside immune responses. Why not the others (added — not from source): B. Demyelinating CMT1A — CMT1A is an inherited chronic neuropathy.; C. Congenital dystrophinopathy — Dystrophinopathy is not post-infectious or acute.; D. Ocular myasthenia — Ocular myasthenia is not ascending areflexic paralysis.", "pearl": "AMAN is a motor axonal GBS variant often associated with anti-ganglioside immune responses.", "srcAnswer": "B"}, {"num": 58, "level": "", "question": "A suspected GBS child has severe back and limb pain. What is an appropriate interpretation?", "options": ["Pain proves DMD gene deletion", "Pain may be a substantial GBS feature requiring assessment", "Pain excludes GBS", "Pain confirms pure central demyelination"], "answer": 1, "explanation": "GBS can cause significant neuropathic or radicular pain. Why not the others (added — not from source): A. Pain proves DMD gene deletion — Pain is unrelated to DMD.; C. Pain excludes GBS — Back and limb pain is common in childhood GBS and can precede weakness.; D. Pain confirms pure central demyelination — Pain in GBS is radicular or neuropathic, not evidence of central demyelination.", "pearl": "GBS can cause significant neuropathic or radicular pain.", "srcAnswer": "C"}, {"num": 59, "level": "", "question": "A GBS child deteriorates and needs ventilation. Which finding should prompt higher acuity regardless of limb score?", "options": ["Bulbar weakness and declining respiratory effort", "Preserved normal CK", "No family history of neuropathy", "Normal vision"], "answer": 0, "explanation": "Respiratory and bulbar impairment supersede locomotor staging in urgency. Why not the others (added — not from source): B. Preserved normal CK — CK is usually normal in GBS and does not guide acuity.; C. No family history of neuropathy — Family history is irrelevant to acute GBS deterioration.; D. Normal vision — Vision does not predict respiratory failure.", "pearl": "Respiratory and bulbar impairment supersede locomotor staging in urgency.", "srcAnswer": "D"}, {"num": 60, "level": "", "question": "Schoolchild has fluctuating ptosis and diplopia worse late in day; reflexes and sensation normal. Best localization?", "options": ["Anterior horn cell", "Primary length-dependent sensory nerve", "Neuromuscular junction", "Corticospinal tract"], "answer": 2, "explanation": "Fatigable ocular weakness with intact sensation and reflexes points to junction disorder. Why not the others (added — not from source): A. Anterior horn cell — Anterior horn cell disease causes fasciculations and areflexia, not fatigable ptosis.; B. Primary length-dependent sensory nerve — Sensory neuropathy does not cause fatigable ptosis and diplopia.; D. Corticospinal tract — UMN lesions cause spasticity and hyperreflexia, not fluctuating ptosis.", "pearl": "Fatigable ocular weakness with intact sensation and reflexes points to junction disorder.", "srcAnswer": "A"}, {"num": 61, "level": "", "question": "Which autoantibody is commonly tested first in suspected autoimmune juvenile myasthenia?", "options": ["Anti-GQ1b as sole test", "Acetylcholine-receptor antibody", "PMP22 antibody", "Anti-dystrophin antibody"], "answer": 1, "explanation": "AChR antibody is common in autoimmune MG; a negative result does not exclude it. Why not the others (added — not from source): A. Anti-GQ1b as sole test — Anti-GQ1b supports Miller Fisher syndrome, not myasthenia.; C. PMP22 antibody — PMP22 is a gene (CMT1A), not an autoantibody target.; D. Anti-dystrophin antibody — There is no autoimmune anti-dystrophin test for myasthenia.", "pearl": "AChR antibody is common in autoimmune MG; a negative result does not exclude it.", "srcAnswer": "B"}, {"num": 62, "level": "", "question": "If juvenile myasthenia is seronegative for AChR antibodies, which additional antibody may be considered?", "options": ["Anti-insulin receptor antibody", "Anti-TPO antibody", "Anti-GBM antibody", "MuSK antibody"], "answer": 3, "explanation": "MuSK-associated MG is a distinct autoimmune NMJ subtype. Why not the others (added — not from source): A. Anti-insulin receptor antibody — This relates to severe insulin resistance syndromes.; B. Anti-TPO antibody — Anti-TPO indicates autoimmune thyroiditis.; C. Anti-GBM antibody — Anti-GBM antibodies cause Goodpasture disease.", "pearl": "MuSK-associated MG is a distinct autoimmune NMJ subtype.", "srcAnswer": "C"}, {"num": 63, "level": "", "question": "What electrophysiologic pattern may support generalized myasthenia gravis?", "options": ["Uniform slowing of all sensory velocities", "Loss of all SNAPs in every case", "Elevated CK alone", "Decrement on low-frequency repetitive nerve stimulation"], "answer": 3, "explanation": "Postsynaptic transmission failure can yield decremental compound muscle action potential response. Why not the others (added — not from source): A. Uniform slowing of all sensory velocities — Uniform slowing indicates demyelinating neuropathy.; B. Loss of all SNAPs in every case — SNAPs are normal in myasthenia.; C. Elevated CK alone — CK is normal in myasthenia.", "pearl": "Postsynaptic transmission failure can yield decremental compound muscle action potential response.", "srcAnswer": "D"}, {"num": 64, "level": "", "question": "A child with autoimmune MG has dysphagia and respiratory distress. What is immediate priority?", "options": ["Emergency airway/ventilation assessment and specialist crisis treatment", "Isolated exercise therapy", "Ambulatory outpatient observation", "Delay until antibody results return"], "answer": 0, "explanation": "Myasthenic crisis can produce ventilatory failure and requires urgent care. Why not the others (added — not from source): B. Isolated exercise therapy — Exercise worsens fatigable weakness in crisis.; C. Ambulatory outpatient observation — Bulbar and respiratory weakness is myasthenic crisis and needs emergency care.; D. Delay until antibody results return — Crisis is treated immediately on clinical grounds.", "pearl": "Myasthenic crisis can produce ventilatory failure and requires urgent care.", "srcAnswer": "A"}, {"num": 65, "level": "", "question": "Which symptomatic drug enhances neuromuscular transmission in myasthenia gravis?", "options": ["Riluzole", "Pyridostigmine", "Risdiplam", "Eteplirsen"], "answer": 1, "explanation": "Acetylcholinesterase inhibition increases available acetylcholine at the synaptic cleft. Why not the others (added — not from source): A. Riluzole — Riluzole is used in ALS.; C. Risdiplam — Risdiplam treats SMA.; D. Eteplirsen — Eteplirsen is a DMD exon-51-skipping drug.", "pearl": "Acetylcholinesterase inhibition increases available acetylcholine at the synaptic cleft.", "srcAnswer": "B"}, {"num": 66, "level": "", "question": "A neonate has episodic apnea and fatigability from a genetically proven junction disorder. Which diagnosis class is likely?", "options": ["CMT1A", "Acute inflammatory demyelinating GBS", "Classic DMD", "Congenital myasthenic syndrome"], "answer": 3, "explanation": "CMS involves inherited defects of NMJ transmission; treatment varies by subtype. Why not the others (added — not from source): A. CMT1A — CMT1A is an inherited demyelinating neuropathy, not a junction disorder.; B. Acute inflammatory demyelinating GBS — GBS is acquired and post-infectious, not a congenital junction disorder.; C. Classic DMD — DMD is a myopathy, not a junction disorder.", "pearl": "CMS involves inherited defects of NMJ transmission; treatment varies by subtype.", "srcAnswer": "C"}, {"num": 67, "level": "", "question": "Why is precise molecular diagnosis vital before selecting drugs for congenital myasthenic syndrome?", "options": ["All cases require SMN1 gene replacement", "All subtypes respond identically to acetylcholinesterase inhibitors", "Some subtype-specific treatments help while others can worsen symptoms", "Antibodies predict every congenital subtype"], "answer": 2, "explanation": "Mechanism-specific junction syndromes vary in drug response; some worsen with pyridostigmine. Why not the others (added — not from source): A. All cases require SMN1 gene replacement — SMN1 replacement is SMA therapy.; B. All subtypes respond identically to acetylcholinesterase inhibitors — Some CMS subtypes (e.g. DOK7, slow-channel) worsen with pyridostigmine.; D. Antibodies predict every congenital subtype — CMS is genetic and seronegative; subtype is defined by genetics.", "pearl": "Mechanism-specific junction syndromes vary in drug response; some worsen with pyridostigmine.", "srcAnswer": "D"}, {"num": 68, "level": "", "question": "Infant has bilateral ptosis, fatigability but normal CK. Which condition is more likely than dystrophinopathy?", "options": ["SMA type 1 with pure diplopia", "CMT1A presenting as isolated ocular deficit", "Congenital myasthenic syndrome", "Typical DMD with high CK"], "answer": 2, "explanation": "Ocular fatigability and normal CK support junction localization. Why not the others (added — not from source): A. SMA type 1 with pure diplopia — SMA spares extraocular muscles.; B. CMT1A presenting as isolated ocular deficit — CMT1A does not present with ptosis.; D. Typical DMD with high CK — Normal CK makes DMD unlikely.", "pearl": "Ocular fatigability and normal CK support junction localization.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day25',label:'Day 25',set:'Quiz 4',href:'Day25/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day25_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 25 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 25 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 25'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 25');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day25:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
