<script>
const quiz=[{"num": 69, "level": "", "question": "Which toxin causes descending flaccid weakness with pupillary/autonomic involvement in infant botulism?", "options": ["Botulinum neurotoxin inhibiting presynaptic acetylcholine release", "AChR-blocking autoantibodies", "SMN1 deficiency", "Loss of dystrophin crosslinkage"], "answer": 0, "explanation": "Botulinum toxin blocks presynaptic ACh release, creating a peripheral junction blockade. Why not the others (added — not from source): B. AChR-blocking autoantibodies — That is autoimmune myasthenia, not botulism.; C. SMN1 deficiency — SMN1 deficiency is SMA, not a toxin.; D. Loss of dystrophin crosslinkage — That is a dystrophinopathy mechanism.", "pearl": "Botulinum toxin blocks presynaptic ACh release, creating a peripheral junction blockade.", "srcAnswer": "B"}, {"num": 70, "level": "", "question": "A constipated infant with weak suck and hypotonia has descending weakness. Most concerning diagnosis?", "options": ["Isolated absence epilepsy", "CIDP", "DMD", "Infant botulism"], "answer": 3, "explanation": "Bulbar dysfunction, constipation and descending paralysis are characteristic clues for infant botulism. Why not the others (added — not from source): A. Isolated absence epilepsy — Absence seizures are brief lapses of awareness, not hypotonia and weak suck.; B. CIDP — CIDP is a chronic acquired neuropathy, not descending weakness with constipation in an infant.; C. DMD — DMD does not present in infancy with descending bulbar weakness and constipation.", "pearl": "Bulbar dysfunction, constipation and descending paralysis are characteristic clues for infant botulism.", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A fatigable child has normal sensation and repeatedly preserved reflexes, unlike GBS. Which feature most clearly points to NMJ rather than peripheral nerve?", "options": ["Marked CK rise above 10,000 U/L", "Prominent length-dependent sensory impairment", "Universal absent tendon reflexes", "Weakness fluctuates substantially with use and rest"], "answer": 3, "explanation": "Use-dependent fatigability in the setting of preserved sensation is characteristic of NMJ disease. Why not the others (added — not from source): A. Marked CK rise above 10,000 U/L — Very high CK indicates myopathy, not NMJ disease.; B. Prominent length-dependent sensory impairment — Sensory loss indicates neuropathy; NMJ disorders spare sensation.; C. Universal absent tendon reflexes — Absent reflexes suggest neuropathy such as GBS.", "pearl": "Use-dependent fatigability in the setting of preserved sensation is characteristic of NMJ disease.", "srcAnswer": "D"}, {"num": 72, "level": "", "question": "An immunomodulatory MG therapy is considered for crisis. What treatment class is used for short-term stabilization under specialist care?", "options": ["Long-term anti-tubercular therapy", "Dystrophin exon skipping", "IVIg or plasma exchange", "Oral risdiplam"], "answer": 2, "explanation": "IVIg or exchange may be used in severe myasthenic exacerbations alongside airway support. Why not the others (added — not from source): A. Long-term anti-tubercular therapy — Anti-tubercular therapy has no role in myasthenic crisis.; B. Dystrophin exon skipping — Exon skipping is a DMD therapy with no role in myasthenic crisis.; D. Oral risdiplam — Risdiplam treats SMA.", "pearl": "IVIg or exchange may be used in severe myasthenic exacerbations alongside airway support.", "srcAnswer": "A"}, {"num": 73, "level": "", "question": "Which clinical response supports a diagnosis of fluctuating postsynaptic NMJ transmission dysfunction?", "options": ["Uniformly slow motor and sensory conduction without fatigability", "Improvement with rest after repetitive activity", "Proximal weakness with CK 20,000 U/L", "Gradually progressive fixed distal sensory loss"], "answer": 1, "explanation": "Fatigability and improvement with rest are central clinical clues in myasthenia. Why not the others (added — not from source): A. Uniformly slow motor and sensory conduction without fatigability — This describes demyelinating neuropathy.; C. Proximal weakness with CK 20,000 U/L — Very high CK with fixed proximal weakness indicates a myopathy, not fluctuating junction dysfunction.; D. Gradually progressive fixed distal sensory loss — Fixed distal sensory loss is a neuropathy, not fluctuating NMJ dysfunction.", "pearl": "Fatigability and improvement with rest are central clinical clues in myasthenia.", "srcAnswer": "B"}, {"num": 74, "level": "", "question": "A newborn of a mother with autoimmune MG develops transient poor suck and hypotonia. Likely mechanism?", "options": ["PMP22 duplication in all newborns", "Inherited DMD variant from father's Y chromosome", "Postinfectious autoimmune neuropathy at birth", "Transplacental maternal pathogenic antibodies"], "answer": 3, "explanation": "Transient neonatal myasthenia results from transplacental antibodies and usually resolves as they clear. Why not the others (added — not from source): A. PMP22 duplication in all newborns — PMP22 duplication causes CMT1A, not transient neonatal weakness.; B. Inherited DMD variant from father's Y chromosome — DMD is X-linked; fathers pass a Y to sons.; C. Postinfectious autoimmune neuropathy at birth — GBS does not occur at birth from maternal MG; transient neonatal MG does.", "pearl": "Transient neonatal myasthenia results from transplacental antibodies and usually resolves as they clear.", "srcAnswer": "C"}, {"num": 75, "level": "", "question": "A child with SMA has progressive scoliosis. Which surveillance best anticipates functional compromise?", "options": ["Only annual creatine kinase", "Orthopedic and respiratory multidisciplinary review", "Serial acetylcholine receptor antibodies", "Routine CSF protein testing every month"], "answer": 1, "explanation": "Scoliosis can compromise seating and respiratory mechanics and requires multidisciplinary assessment. Why not the others (added — not from source): A. Only annual creatine kinase — CK does not monitor scoliosis or respiratory compromise.; C. Serial acetylcholine receptor antibodies — AChR antibodies are irrelevant to SMA.; D. Routine CSF protein testing every month — CSF protein has no role in scoliosis surveillance.", "pearl": "Scoliosis can compromise seating and respiratory mechanics and requires multidisciplinary assessment.", "srcAnswer": "D"}, {"num": 76, "level": "", "question": "During inspiration S2 separation increases, narrowing on expiration. Which diagnosis best explains this?", "options": ["Fixed splitting from ASD", "Paradoxical splitting from LBBB", "Wide splitting due to PS", "Physiological respiratory splitting"], "answer": 3, "explanation": "Normal splitting widens on inspiration. Why not the others (added — not from source): A. Fixed splitting from ASD — ASD causes wide, fixed splitting that does not vary with respiration.; B. Paradoxical splitting from LBBB — In paradoxical splitting the interval narrows in inspiration and widens in expiration.; C. Wide splitting due to PS — PS delays P2, giving persistently wide splitting.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 16 Q41 — physiological versus fixed S2 splitting"}}, {"num": 77, "level": "", "question": "A cyanotic newborn has pulmonary edema and obstructed infracardiac venous drainage. What definitive management is required?", "options": ["Urgent surgical relief of venous obstruction", "Routine PGE1 as definitive therapy", "Elective catheter ASD device closure", "Observe until pulmonary edema subsides"], "answer": 0, "explanation": "Pulmonary venous obstruction requires urgent surgery. Why not the others (added — not from source): B. Routine PGE1 as definitive therapy — PGE1 cannot relieve pulmonary venous obstruction and may worsen oedema.; C. Elective catheter ASD device closure — Closing the atrial communication would worsen an obstructed TAPVC; the obstruction needs surgery.; D. Observe until pulmonary edema subsides — Obstructed TAPVC is a neonatal surgical emergency.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 16 Q74 — obstructed infracardiac TAPVC"}}, {"num": 78, "level": "", "question": "Weeks after ASD device closure, a child has chest pain, hypotension and pericardial effusion. Most urgent evaluation?", "options": ["Empirical antireflux therapy", "Exercise stress testing first", "Emergency echo and device erosion assessment", "Routine echo at the annual visit"], "answer": 2, "explanation": "Device erosion and tamponade are urgent complications. Why not the others (added — not from source): A. Empirical antireflux therapy — Chest pain with hypotension and effusion is not reflux.; B. Exercise stress testing first — Hypotension with effusion after device closure suggests erosion with tamponade; exercise testing is dangerous.; D. Routine echo at the annual visit — Urgent echocardiography is needed now.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 17 Q17 — ASD device erosion"}}, {"num": 79, "level": "", "question": "An infant has an isolated congenital VSD. Which morphologic location is most common overall?", "options": ["Perimembranous", "Outlet supracristal", "Apical muscular", "Inlet septal"], "answer": 0, "explanation": "Perimembranous VSD is the most common anatomical type. Why not the others (added — not from source): B. Outlet supracristal — Supracristal VSDs are uncommon (more frequent in Asian populations).; C. Apical muscular — Muscular VSDs are common in neonates but perimembranous defects are the most common overall.; D. Inlet septal — Inlet VSDs are typical of AV septal defects and uncommon in isolation.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 17 Q22 — common VSD anatomy"}}, {"num": 80, "level": "", "question": "Angiography shows a funnel-shaped duct with ampulla at aortic end. Which Krichenko classification?", "options": ["Type C tubular", "Type D complex", "Type B window", "Type A conical"], "answer": 3, "explanation": "The conical morphology is classified as type A. Why not the others (added — not from source): A. Type C tubular — Type C is tubular, without constriction.; B. Type D complex — Type D has multiple constrictions; a funnel with an aortic ampulla is type A.; C. Type B window — Type B is short and window-like.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 17 Q44 — Krichenko PDA morphology"}}, {"num": 81, "level": "", "question": "Echo reveals an elongated narrowed LVOT and anteriorly displaced unwedged aorta in AVSD. Name the configuration.", "options": ["Isolated pulmonary venous obstruction", "Fixed supravalvar aortic stenosis", "Subpulmonary infundibular narrowing", "Gooseneck LVOT"], "answer": 3, "explanation": "AVSD gooseneck reflects unwedged aorta and elongated LVOT. Why not the others (added — not from source): A. Isolated pulmonary venous obstruction — Pulmonary venous obstruction is unrelated to the LVOT shape in AVSD.; B. Fixed supravalvar aortic stenosis — Supravalvar AS is above the valve (e.g. Williams syndrome), not the elongated LVOT of AVSD.; C. Subpulmonary infundibular narrowing — That is right-sided outflow obstruction.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 17 Q56 — AVSD gooseneck LVOT"}}, {"num": 82, "level": "", "question": "Primum ASD and small restrictive inlet VSD coexist with two distinct AV valve orifices. Classification?", "options": ["Partial AVSD without VSD", "Intermediate/transitional AVSD", "Isolated secundum ASD", "Complete AVSD with common valve"], "answer": 1, "explanation": "Two distinct AV valve orifices and inlet VSD indicate intermediate AVSD. Why not the others (added — not from source): A. Partial AVSD without VSD — Partial AVSD has no ventricular-level shunt.; C. Isolated secundum ASD — A secundum ASD has normal AV valves and no inlet VSD.; D. Complete AVSD with common valve — Complete AVSD has a common valve and a large nonrestrictive VSD.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 17 Q58 — intermediate AVSD"}}, {"num": 83, "level": "", "question": "An infant with severe TOF RVOTO is unsuitable for immediate full repair; anatomy permits RVOT stenting. Which palliation may be selected?", "options": ["Balloon mitral valvotomy", "Pulmonary vein stent", "RVOT stent", "Atrial septal device closure"], "answer": 2, "explanation": "RVOT stenting may palliate select severe RVOTO while awaiting repair. Why not the others (added — not from source): A. Balloon mitral valvotomy — Balloon mitral valvotomy treats mitral stenosis, not RVOT obstruction.; B. Pulmonary vein stent — Pulmonary vein stents treat pulmonary vein stenosis.; D. Atrial septal device closure — Closing the atrial septum would not improve pulmonary blood flow in TOF.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 18 Q33 — TOF RVOT palliation"}}, {"num": 84, "level": "", "question": "Which guideline pair correctly distinguishes CPS transitional period and PES evaluation after transitional hypoglycaemia?", "options": ["CPS 48 h and PES >72 h", "Both guidelines 7 days", "CPS 72 h and PES >48 h", "Both guidelines 24 h"], "answer": 2, "explanation": "The two guidance frameworks define transitional/persistent evaluation differently. Why not the others (added — not from source): A. CPS 48 h and PES >72 h — The windows are reversed: CPS uses 72 h and PES evaluates persistence after 48 h.; B. Both guidelines 7 days — Neither framework uses a 7-day boundary.; D. Both guidelines 24 h — Neither framework uses a single 24-hour window.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 10 Q8 — persistent neonatal hypoglycaemia time frames"}}];
const NB_CTX={srcId:'Day25',label:'Day 25',set:'Quiz 5',href:'Day25/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day25_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 25 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 25 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 25'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 25');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day25:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
