<script>
const quiz=[{"num": 67, "level": "Clinical/Application", "question": "A 6-week-old with complete AVSD has intractable heart failure despite stabilization. Preferred management?", "options": ["Transcatheter secundum ASD occluder", "Observe until the toddler years", "Expedited surgical repair as soon as feasible", "Escalate medical therapy and wait for improvement"], "answer": 2, "explanation": "Uncontrolled HF warrants urgent complete repair. Why not the others: A. Transcatheter secundum ASD occluder — Wrong device; the common valve and inlet VSD remain.; B. Observe until the toddler years — Intractable failure calls for early repair.; D. Escalate medical therapy and wait for improvement — There is no spontaneous resolution, and delay worsens PH.", "pearl": "Uncontrolled complete AVSD needs early surgery.", "srcAnswer": "C"}, {"num": 68, "level": "Integrated/Rank Differentiating", "question": "A 2-year-old has partial AVSD, stable growth, normal PA pressures and mild AV valve regurgitation. Indian consensus timing?", "options": ["Repair within 48 hours", "Leave untreated because it is only an atrial defect", "PDA occluder as definitive repair", "Plan surgical repair at about 2–3 years"], "answer": 3, "explanation": "Stable partial AVSD is generally repaired at 2–3 years. Why not the others: A. Repair within 48 hours — No urgency in a stable child.; B. Leave untreated because it is only an atrial defect — The cleft valve and shunt need repair.; C. PDA occluder as definitive repair — Wrong device.", "pearl": "Partial AVSD has a later repair window than complete AVSD.", "srcAnswer": "D"}, {"num": 69, "level": "Integrated/Rank Differentiating", "question": "A 7-month-old with partial AVSD develops worsening moderate-to-severe left AV-valve regurgitation. Best principle?", "options": ["Diuretics alone, with repeat echo at 3 years", "Defer surgery until ventricular dysfunction appears", "Close only the atrial communication with a device", "Consider earlier surgical repair"], "answer": 3, "explanation": "Significant AV-valve regurgitation may accelerate timing. Why not the others: A. Diuretics alone, with repeat echo at 3 years — Diuretics palliate; progressive regurgitation brings surgery forward.; B. Defer surgery until ventricular dysfunction appears — Waiting for dysfunction risks a harder repair.; C. Close only the atrial communication with a device — Does not treat the cleft regurgitation, and primum defects are not device lesions.", "pearl": "Valve regurgitation can override elective AVSD timing.", "srcAnswer": "D"}, {"num": 70, "level": "Integrated/Rank Differentiating", "question": "After apparently successful AVSD repair, which surveillance approach is most appropriate?", "options": ["Lifelong congenital cardiology follow-up", "Discharge after the first post-operative echo", "Daily antibiotics for life", "No echo unless cyanosis develops"], "answer": 0, "explanation": "Residual AV valve regurgitation, LVOT obstruction and arrhythmia may emerge. Why not the others: B. Discharge after the first post-operative echo — Late problems occur.; C. Daily antibiotics for life — Not recommended.; D. No echo unless cyanosis develops — Residual leaks and LVOT obstruction are silent.", "pearl": "AVSD repair requires lifelong surveillance.", "srcAnswer": "A"}, {"num": 71, "level": "Integrated/Rank Differentiating", "question": "An 8-month-old has LA/LV dilation, bounding pulses and continuous murmur. Echo finds a 4-mm PDA; no ASD. What is the dominant cause of LV volume overload?", "options": ["Cleft AV valve from partial AVSD", "Isolated pulmonary valve stenosis", "Aortic-to-PA recirculation", "Right-to-left atrial shunting"], "answer": 2, "explanation": "Pulmonary venous return is increased by ductal left-to-right flow. Why not the others: A. Cleft AV valve from partial AVSD — Excluded by the echo.; B. Isolated pulmonary valve stenosis — RV pressure load, not LV volume.; D. Right-to-left atrial shunting — Would cause cyanosis, not LV overload.", "pearl": "Integrate murmur, pulses and chamber load to identify PDA.", "srcAnswer": "C"}, {"num": 72, "level": "Integrated/Rank Differentiating", "question": "A 4-month-old with loud VSD murmur and LA/LV enlargement now has new AR. Echo shows outlet VSD with cusp prolapse. What best changes management?", "options": ["ASD device closure of the atrial defect", "Wait for a louder VSD murmur", "Medical treatment with review in two years", "Prompt surgical assessment of valve injury"], "answer": 3, "explanation": "Cusp prolapse with more-than-trivial AR is a closure trigger. Why not the others: A. ASD device closure of the atrial defect — Wrong lesion.; B. Wait for a louder VSD murmur — The murmur does not guide timing; the AR does.; C. Medical treatment with review in two years — No medication corrects cusp prolapse.", "pearl": "Aortic cusp prolapse is a management-changing VSD complication.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated/Rank Differentiating", "question": "A 3-month-old with trisomy 21 has HF, superior axis, primum ASD, inlet VSD and common AV valve. Which plan fits Indian timing?", "options": ["Manage as an isolated small muscular VSD", "Stabilize; plan complete repair by 3 months", "Observe to 4 years as for secundum ASD", "Device-close only the atrial component"], "answer": 1, "explanation": "The anatomy is complete AVSD with early repair recommendation. Why not the others: A. Manage as an isolated small muscular VSD — Wrong lesion.; C. Observe to 4 years as for secundum ASD — ASD timing does not apply to complete AVSD.; D. Device-close only the atrial component — Wrong approach.", "pearl": "Correct classification dictates markedly different closure timing.", "srcAnswer": "B"}, {"num": 74, "level": "Integrated/Rank Differentiating", "question": "A child with secundum ASD has RV dilation, but echo also shows PAPVC. What is the most consequential pre-intervention decision?", "options": ["Assume RV dilation is unrelated to the shunt", "Treat RV dilation with diuretics and observe", "Map anomalous veins; plan surgical correction", "Choose a device by ASD diameter"], "answer": 2, "explanation": "Device closure alone can leave pulmonary venous anomaly. Why not the others: A. Assume RV dilation is unrelated to the shunt — The shunt load needs assessment.; B. Treat RV dilation with diuretics and observe — Diuretics do not treat a structural shunt.; D. Choose a device by ASD diameter — Misses the PAPVC.", "pearl": "PAPVC is a critical ASD device-closure exclusion.", "srcAnswer": "C"}, {"num": 75, "level": "Integrated/Rank Differentiating", "question": "A 14-year-old with unrepaired large VSD has cyanosis, clubbing and high PVR judged irreversible. Which choice best avoids harm?", "options": ["Urgently close the VSD because saturation is low", "Occlude the ductus to stop right-to-left flow", "Treat as an innocent murmur", "Do not close; refer for specialist PH care"], "answer": 3, "explanation": "Fixed high PVR makes shunt closure dangerous. Why not the others: A. Urgently close the VSD because saturation is low — Closure with irreversible PVR is contraindicated.; B. Occlude the ductus to stop right-to-left flow — There is no PDA, and closing shunts removes decompression.; C. Treat as an innocent murmur — Cyanosis and clubbing are pathological.", "pearl": "Eisenmenger physiology reverses usual shunt-closure logic.", "srcAnswer": "D"}, {"num": 76, "level": "", "question": "A 28-week infant has zone II stage 2 ROP with definite plus disease. Which management interpretation is best?", "options": ["Type 2 ROP observed at routine long interval", "Immediate discharge from ROP screening", "Type 1 ROP requiring prompt treatment assessment", "No ROP because stage 3 is absent"], "answer": 2, "explanation": "Zone II stage 2 with plus meets ETROP Type 1. Why not the others: A. Type 2 ROP observed at routine long interval — Plus disease changes urgency.; B. Immediate discharge from ROP screening — Disease requires active specialist follow-up.; D. No ROP because stage 3 is absent — Stage 2 plus can already be Type 1.", "pearl": "Plus disease changes zone II stage 2 into Type 1.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 11 Q25"}}, {"num": 77, "level": "", "question": "An infant born at 28 weeks GA is now 17 weeks old chronologically. What is corrected age?", "options": ["5 weeks", "12 weeks", "45 weeks", "17 weeks"], "answer": 0, "explanation": "Corrected age = 17 − (40−28) = 5 weeks. Why not the others: B. 12 weeks — This is the number of weeks premature, not corrected age.; C. 45 weeks — This is postmenstrual age, not corrected age.; D. 17 weeks — Chronological age has not been corrected for prematurity.", "pearl": "Corrected age and PMA are distinct quantities.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q46"}}, {"num": 78, "level": "", "question": "Under AAP 2018 screening timing, a baby born at 24 weeks GA has the initial eye examination at which age?", "options": ["27 weeks PMA (3 weeks after birth)", "36 weeks PMA (12 weeks after birth)", "28 weeks PMA (4 weeks after birth)", "31 weeks PMA (7 weeks after birth)"], "answer": 3, "explanation": "AAP 2018 timing for 24-week GA uses 31 weeks PMA. Why not the others: A. 27 weeks PMA (3 weeks after birth) — That is not the specified AAP schedule for 24-week infants.; B. 36 weeks PMA (12 weeks after birth) — Too late for initial AAP screening.; C. 28 weeks PMA (4 weeks after birth) — This confuses a generic chronological interval with the AAP table.", "pearl": "When a question explicitly names AAP, use its table; Indian rules are separately labelled.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q55"}}, {"num": 79, "level": "", "question": "Which domains belong to the BEARS pediatric sleep screening history?", "options": ["Breathing, EEG, Arousal index, REM, Seizures", "Bedtime, Excessive sleepiness, Awakenings, Regularity/duration, Snoring", "Bedwetting, Epilepsy, Anxiety, Reflux, Sweating", "Behavior, Exercise, Appetite, Respiration, Schooling"], "answer": 1, "explanation": "BEARS is a brief clinical history screen. Why not the others: A. Breathing, EEG, Arousal index, REM, Seizures — These are sleep-study concepts, not the BEARS mnemonic.; C. Bedwetting, Epilepsy, Anxiety, Reflux, Sweating — Not the established mnemonic.; D. Behavior, Exercise, Appetite, Respiration, Schooling — This is not BEARS.", "pearl": "BEARS is a sleep-history screen, not polysomnography.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 13 Q5"}}, {"num": 80, "level": "", "question": "A 1.1-kg preterm infant receives 125 kcal/kg/day and 3.8 g/kg/day enteral protein. How should these values be interpreted?", "options": ["Adequacy can be determined without growth or clinical monitoring", "Clearly toxic protein and energy excess in all infants", "Severely inadequate energy and protein in every preterm infant", "Broadly within common preterm target ranges, individualized clinically"], "answer": 3, "explanation": "These values fall in commonly used ranges for many preterm infants. Why not the others: A. Adequacy can be determined without growth or clinical monitoring — Individual growth and tolerance remain essential.; B. Clearly toxic protein and energy excess in all infants — Neither value alone indicates universal excess.; C. Severely inadequate energy and protein in every preterm infant — Both values are within typical target ranges.", "pearl": "Interpret preterm nutrition using ranges and clinical context.", "srcAnswer": "D", "retest": {"stage": "R2", "from": "Day 8 Q41"}}, {"num": 81, "level": "", "question": "An aEEG shows a rising saw-tooth band; simultaneous raw EEG shows evolving rhythmic ictal discharges. Best interpretation?", "options": ["Electrographic seizure", "Motion artifact alone", "Normal sleep cycling", "Isolated electrode impedance change"], "answer": 0, "explanation": "Evolving raw EEG corroborates a seizure. Why not the others: B. Motion artifact alone — Artifact lacks an evolving cerebral ictal pattern.; C. Normal sleep cycling — Sleep cycling has a different temporal pattern.; D. Isolated electrode impedance change — Impedance change does not explain evolving ictal raw EEG.", "pearl": "Raw EEG confirmation separates seizure from aEEG artifact.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 7 Q34"}}, {"num": 82, "level": "", "question": "At 36 weeks PMA, an infant with BPD receives noninvasive positive-pressure respiratory support. Jensen severity grade?", "options": ["Grade 3", "Grade 1", "Grade 2", "No BPD by definition"], "answer": 2, "explanation": "Jensen Grade 2 includes noninvasive positive-pressure support or nasal cannula >2 L/min. Why not the others: A. Grade 3 — Grade 3 requires invasive mechanical ventilation.; B. Grade 1 — Grade 1 includes nasal cannula ≤2 L/min.; D. No BPD by definition — The support category indicates ongoing respiratory morbidity.", "pearl": "Jensen classification uses respiratory support at 36 weeks PMA.", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 5 Q53"}}];
const NB_CTX={srcId:'Day17',label:'Day 17',set:'Quiz 5',href:'Day17/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day17_QuizSet5_Q67-82_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 17 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 67–82</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 17 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 17'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 17');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day17:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
