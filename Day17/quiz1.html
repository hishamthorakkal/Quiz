@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<h1>Day 17 — Quiz 1</h1>
<div class="sub">Questions 1–17 · 17 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>

<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "A child has a true defect at the fossa ovalis with otherwise separate atrioventricular valves. What is the anatomical diagnosis?", "options": ["Ostium primum ASD", "Coronary sinus ASD", "Ostium secundum ASD", "Sinus venosus ASD"], "answer": 2, "explanation": "Secundum defects involve the fossa ovalis region. Why not the others: A. Ostium primum ASD — A primum defect lies low in the septum beside the AV valves, which are abnormal.; B. Coronary sinus ASD — An unroofed coronary sinus communicates with the left atrium away from the fossa ovalis.; D. Sinus venosus ASD — This defect sits at the SVC or IVC junction, outside the fossa ovalis.", "pearl": "The fossa ovalis localizes a secundum ASD.", "srcAnswer": "C"}, {"num": 2, "level": "Basic/Recall", "question": "An interatrial communication lies high near the SVC–right atrial junction. Which associated lesion is especially important to seek?", "options": ["Ebstein anomaly with apical tricuspid displacement", "Subaortic ventricular septal defect", "Cleft left atrioventricular valve", "Right upper pulmonary vein draining to the SVC/RA"], "answer": 3, "explanation": "Sinus venosus defects commonly coexist with partial anomalous pulmonary venous connection. Why not the others: A. Ebstein anomaly with apical tricuspid displacement — Not the typical association of a high caval-junction defect.; B. Subaortic ventricular septal defect — A ventricular lesion with no link to a high atrial defect.; C. Cleft left atrioventricular valve — Accompanies a primum defect low in the septum, not a high defect.", "pearl": "Sinus venosus ASD requires assessment of pulmonary venous connections.", "srcAnswer": "D"}, {"num": 3, "level": "Basic/Recall", "question": "A child has a low atrial septal defect next to the AV valves and a cleft left AV valve. Best classification?", "options": ["Secundum ASD at the fossa ovalis", "Ostium primum ASD / partial AVSD", "Sinus venosus ASD at the SVC junction", "Patent foramen ovale with flap valve"], "answer": 1, "explanation": "The AV junction and cleft valve identify the endocardial cushion spectrum. Why not the others: A. Secundum ASD at the fossa ovalis — Secundum defects lie at the fossa ovalis and the AV valves are normal.; C. Sinus venosus ASD at the SVC junction — This defect sits at the caval junction, far from the AV valves.; D. Patent foramen ovale with flap valve — A PFO is a flap at the fossa ovalis and does not cause a cleft AV valve.", "pearl": "Primum ASD belongs to the AVSD spectrum.", "srcAnswer": "B"}, {"num": 4, "level": "Basic/Recall", "question": "Echocardiography shows a flap-like interatrial channel in a healthy newborn without right-heart enlargement. Most accurate label?", "options": ["Patent foramen ovale", "Sinus venosus ASD", "Partial AVSD", "Large secundum ASD"], "answer": 0, "explanation": "A flap valve without right-sided volume overload is commonly physiologic in newborns. Why not the others: B. Sinus venosus ASD — A caval-junction defect, not a flap-like channel.; C. Partial AVSD — Would show a low defect with a cleft AV valve and usually right-heart volume load.; D. Large secundum ASD — A true tissue deficiency, with RA/RV enlargement.", "pearl": "A PFO is not synonymous with a hemodynamically important ASD.", "srcAnswer": "A"}, {"num": 5, "level": "Basic/Recall", "question": "Which type of ventricular septal defect most often closes spontaneously in infancy and early childhood?", "options": ["Inlet VSD of the AV canal type", "Outlet (subarterial) VSD", "Small muscular VSD", "Large perimembranous VSD with high PA pressure"], "answer": 2, "explanation": "Small muscular defects close most often, and some small perimembranous defects also close. Why not the others: A. Inlet VSD of the AV canal type — Belongs to the AV canal spectrum and does not close spontaneously.; B. Outlet (subarterial) VSD — Rarely closes, and cusp prolapse can cause aortic regurgitation.; D. Large perimembranous VSD with high PA pressure — Large defects seldom close enough to avoid intervention.", "pearl": "Small muscular VSDs have the best chance of spontaneous closure; outlet and inlet defects rarely close.", "srcAnswer": "C"}, {"num": 6, "level": "Basic/Recall", "question": "A thriving 5-year-old has a systolic ejection murmur at the left upper sternal border and fixed splitting of S2. Primary murmur mechanism?", "options": ["Increased flow across pulmonary valve", "Aortic stenosis", "Mitral regurgitation from a cleft valve", "High-velocity jet directly across the ASD"], "answer": 0, "explanation": "The systolic flow murmur is usually from augmented RV outflow, not flow through the ASD. Why not the others: B. Aortic stenosis — Gives an ejection murmur radiating to the neck and does not explain fixed splitting of S2.; C. Mitral regurgitation from a cleft valve — Would give an apical pansystolic murmur and suggests primum ASD.; D. High-velocity jet directly across the ASD — The atrial pressure difference is too small to produce a loud jet murmur.", "pearl": "The classic ASD systolic murmur is pulmonary flow, not septal turbulence.", "srcAnswer": "A"}, {"num": 7, "level": "Basic/Recall", "question": "Why is the second heart sound often fixed-split in a significant secundum ASD?", "options": ["Reduced respiratory variation in RV stroke volume", "Premature aortic valve closure on inspiration", "Intermittent complete heart block", "Severe pulmonary valve stenosis"], "answer": 0, "explanation": "Persistent RV volume load blunts normal respiratory changes in pulmonary valve closure timing. Why not the others: B. Premature aortic valve closure on inspiration — The aortic component does not behave this way; the pulmonary component is affected.; C. Intermittent complete heart block — An arrhythmia; it cannot produce a persistent fixed split.; D. Severe pulmonary valve stenosis — Gives a delayed, soft P2 with an ejection click; it is not the ASD mechanism.", "pearl": "Fixed S2 splitting reflects altered RV filling dynamics.", "srcAnswer": "A"}, {"num": 8, "level": "Conceptual", "question": "A 6-year-old with an ASD has RA and RV enlargement but normal LV size. Which chamber-loading pattern best fits?", "options": ["Left-heart volume overload", "Isolated RV pressure overload", "Right-heart volume overload", "Isolated LV pressure overload"], "answer": 2, "explanation": "Atrial-level left-to-right shunting loads RA and RV. Why not the others: A. Left-heart volume overload — Typical of VSD or PDA, not an isolated ASD.; B. Isolated RV pressure overload — Seen with pulmonary stenosis or PH; the ASD pattern is volume overload with a normal LV.; D. Isolated LV pressure overload — Seen with LV outflow obstruction or hypertension; the LV here is normal.", "pearl": "ASD enlarges RA/RV; VSD and PDA often enlarge LA/LV.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "ECG shows rsR′ in V1, right-axis deviation, and an ASD on echo. Which lesion is most consistent?", "options": ["Primum ASD", "Tiny silent PDA", "Secundum ASD", "Small restrictive muscular VSD"], "answer": 2, "explanation": "RV volume overload often produces incomplete RBBB and rightward axis. Why not the others: A. Primum ASD — Gives a superior axis rather than right-axis deviation.; B. Tiny silent PDA — No chamber load or characteristic ECG change.; D. Small restrictive muscular VSD — Expect a normal ECG without RV volume load.", "pearl": "QRS axis helps separate secundum ASD from primum AVSD.", "srcAnswer": "C"}, {"num": 10, "level": "Conceptual", "question": "A child with a low atrial septal defect has superior QRS axis and first-degree AV block. Best association?", "options": ["Primum ASD/AVSD", "Isolated small muscular VSD", "Isolated secundum ASD", "Small restrictive PDA"], "answer": 0, "explanation": "Altered AV septal anatomy commonly produces superior axis and PR prolongation. Why not the others: B. Isolated small muscular VSD — No conduction displacement, so the axis is normal.; C. Isolated secundum ASD — Gives right-axis deviation and rsR′, not a superior axis.; D. Small restrictive PDA — Expect a normal axis and PR interval.", "pearl": "Superior axis is an AVSD clue, not an automatic secundum ASD sign.", "srcAnswer": "A"}, {"num": 11, "level": "Conceptual", "question": "A child has suspected secundum ASD. What investigation confirms anatomy, chamber overload and shunt direction?", "options": ["Chest radiograph alone", "Echocardiography with Doppler", "ECG alone", "Pulse oximetry alone"], "answer": 1, "explanation": "Echo assesses defect size, rims, pulmonary venous drainage and RV volume load. Why not the others: A. Chest radiograph alone — Shows plethora or cardiomegaly but not anatomy, defect size or shunt.; C. ECG alone — Suggests RV load or an axis clue but cannot define the defect.; D. Pulse oximetry alone — Saturation is typically normal in L→R shunts, so it cannot define anatomy.", "pearl": "Echo is first-line anatomical and hemodynamic assessment.", "srcAnswer": "B"}, {"num": 12, "level": "Conceptual", "question": "An apparent secundum ASD has unexplained right-heart enlargement and echo suggests anomalous right pulmonary venous return. What next?", "options": ["Treat with a pulmonary vasodilator alone", "Map pulmonary veins by expert echo, CT or MRI", "Label it a PFO and discharge", "Close the fossa ovalis with a device now"], "answer": 1, "explanation": "PAPVC changes the procedural plan and may require surgery. Why not the others: A. Treat with a pulmonary vasodilator alone — No indication; RV volume load comes from a shunt.; C. Label it a PFO and discharge — RV enlargement shows a significant shunt, not a flap.; D. Close the fossa ovalis with a device now — Device closure leaves the PAPVC uncorrected and the load persists.", "pearl": "Do not miss PAPVC before ASD closure.", "srcAnswer": "B"}, {"num": 13, "level": "Conceptual", "question": "A 3-year-old is asymptomatic but has secundum ASD and definite RV dilation with operable pulmonary pressures. Preferred strategy?", "options": ["Plan closure in childhood", "Observe until adulthood because asymptomatic", "Close only if saturation falls below 90%", "Start diuretics as definitive therapy"], "answer": 0, "explanation": "Indian consensus favors closure of significant ASD around 2–4 years when RV volume overload is present. Why not the others: B. Observe until adulthood because asymptomatic — Persistent RV dilation justifies closure even without symptoms.; C. Close only if saturation falls below 90% — Cyanosis would signal a reversed shunt, which is too late for closure.; D. Start diuretics as definitive therapy — Diuretics treat symptoms and do not remove the RV volume load.", "pearl": "ASD closure is guided by RV volume load, not symptoms alone.", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "Which secundum ASD scenario is least appropriate for routine device closure under the 2019 Indian consensus?", "options": ["19 kg child with adequate rims and RV dilation", "12 kg child with deficient septal rims", "17 kg child with adequate rims and uncomplicated volume load", "24 kg child with a central secundum defect and good rims"], "answer": 1, "explanation": "The consensus cautions against device closure at <15 kg and with deficient rims. Why not the others: A. 19 kg child with adequate rims and RV dilation — Suitable weight and rims, with an indication.; C. 17 kg child with adequate rims and uncomplicated volume load — Above the 15 kg caution threshold with adequate rims.; D. 24 kg child with a central secundum defect and good rims — Weight and rims fit the usual device criteria.", "pearl": "Anatomic rims and body weight influence device suitability.", "srcAnswer": "B"}, {"num": 15, "level": "Conceptual", "question": "A 4-year-old has a sinus venosus ASD and anomalous right upper pulmonary vein entering the SVC. Preferred definitive approach?", "options": ["Balloon pulmonary valvotomy", "Surgical repair with vein redirection", "Standard secundum occluder alone", "Observation until adolescence"], "answer": 1, "explanation": "The defect and anomalous vein must both be corrected. Why not the others: A. Balloon pulmonary valvotomy — No valvar pulmonary stenosis is described.; C. Standard secundum occluder alone — A device leaves the anomalous vein draining to the SVC and does not fit a caval-junction defect.; D. Observation until adolescence — Established RV volume overload makes definitive repair indicated.", "pearl": "Sinus venosus ASD is generally a surgical lesion.", "srcAnswer": "B"}, {"num": 16, "level": "Conceptual", "question": "A child with longstanding ASD has severe pulmonary vascular disease and right-to-left shunt; specialist evaluation confirms irreversible high PVR. What is the safest principle?", "options": ["Do not close the defect", "Treat as a routine asymptomatic secundum ASD", "Band the pulmonary artery", "Close the defect urgently to abolish cyanosis"], "answer": 0, "explanation": "Irreversible pulmonary vascular disease makes closure harmful. Why not the others: B. Treat as a routine asymptomatic secundum ASD — Reversed shunting means disease beyond the routine case.; C. Band the pulmonary artery — Banding is for overcirculating shunts and would add to RV load.; D. Close the defect urgently to abolish cyanosis — Closure removes the RV pop-off and can precipitate right heart failure.", "pearl": "Irreversible PVR is a contraindication to ASD closure.", "srcAnswer": "A"}, {"num": 17, "level": "Conceptual", "question": "A child three weeks after secundum ASD device closure has sudden chest pain, pallor and hypotension. Which complication is most urgent to exclude?", "options": ["Paradoxical embolism through a residual shunt", "Device erosion with pericardial effusion", "Benign atrial ectopy", "Late device endocarditis"], "answer": 1, "explanation": "Erosion presents with chest pain, hypotension or effusion and needs urgent echo. Why not the others: A. Paradoxical embolism through a residual shunt — Typically presents with neurological signs.; C. Benign atrial ectopy — Does not explain hypotension.; D. Late device endocarditis — Subacute with fever, not abrupt hypotension.", "pearl": "Device erosion: chest pain, hypotension or effusion; urgent echo.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day17',label:'Day 17',set:'Quiz 1',href:'Day17/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day17_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 17 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 17 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 17'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 17');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day17:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
