<script>
const quiz=[{"num": 51, "level": "High Difficulty", "question": "A preterm infant has labile ventilation, widened pulse pressure and a murmur. What confirms hemodynamic significance?", "options": ["A single blood pressure reading", "Murmur grade at the infraclavicular area", "Targeted echo of ductal flow and effects", "Chest radiograph cardiothoracic ratio"], "answer": 2, "explanation": "Clinical signs alone cannot grade hsPDA reliably. Why not the others: A. A single blood pressure reading — Poor specificity.; B. Murmur grade at the infraclavicular area — Correlates poorly with shunt size.; D. Chest radiograph cardiothoracic ratio — Nonspecific.", "pearl": "Echo—not murmur intensity—establishes hsPDA.", "srcAnswer": "C"}, {"num": 52, "level": "Clinical/Application", "question": "A stable 26-week preterm infant on day 3 has a PDA on echo but no significant compromise. Which strategy best matches AAP 2025?", "options": ["Expectant management with monitoring", "Surgical ligation by day 5", "Ductal stent to preserve the shunt", "Prophylactic ibuprofen for every infant"], "answer": 0, "explanation": "Routine closure before 2 weeks has not shown improved major outcomes. Why not the others: B. Surgical ligation by day 5 — Ligation is a late option with recognised harms.; C. Ductal stent to preserve the shunt — Not duct-dependent; no indication.; D. Prophylactic ibuprofen for every infant — AAP 2025 does not recommend routine early treatment.", "pearl": "AAP 2025 discourages prophylactic and routine early PDA closure.", "srcAnswer": "A"}, {"num": 53, "level": "High Difficulty", "question": "A 24-day-old extremely preterm infant has persistent hsPDA with respiratory compromise after individualized evaluation. What does AAP 2025 state?", "options": ["Every hsPDA must be ligated at once", "Echo is unnecessary when a murmur is present", "Individualized choice, as evidence is insufficient", "Medical closure is contraindicated after two weeks"], "answer": 2, "explanation": "Medical or procedural closure may be considered but superiority is not established. Why not the others: A. Every hsPDA must be ligated at once — No such mandate exists.; B. Echo is unnecessary when a murmur is present — Echo is needed to judge hemodynamic effect.; D. Medical closure is contraindicated after two weeks — It remains an option in selected infants.", "pearl": "Preterm hsPDA after two weeks requires individualized decisions.", "srcAnswer": "C"}, {"num": 54, "level": "Clinical/Application", "question": "A 6-week-old with a large VSD has tachypnea, hepatomegaly and poor feeding. Which medical treatment is the usual first-line bridge while repair is planned?", "options": ["Prostaglandin E1 infusion for patency", "Loop diuretic, adjuncts per protocol", "Indomethacin for ductal closure", "A beta-blocker for rate control"], "answer": 1, "explanation": "A loop diuretic is first line; spironolactone, ACE inhibitors or digoxin are added per local protocol, with calorie-dense feeds. Why not the others: A. Prostaglandin E1 infusion for patency — Keeps the duct open and is used for duct-dependent lesions.; C. Indomethacin for ductal closure — A COX inhibitor for ductal closure in preterm infants.; D. A beta-blocker for rate control — Negative inotropy can worsen failure.", "pearl": "Shunt failure: diuretic first, adjuncts by protocol, optimise nutrition, plan repair.", "srcAnswer": "B"}, {"num": 55, "level": "High Difficulty", "question": "A 25-week infant with hsPDA has thrombocytopenia and renal impairment. Which principle is best?", "options": ["Surgical ligation within 24 hours", "Give ibuprofen automatically", "Treat the murmur grade rather than the echo", "Review contraindications; individualize closure"], "answer": 3, "explanation": "NSAID adverse effects and comorbidity affect choice. Why not the others: A. Surgical ligation within 24 hours — Not a default; options are weighed first.; B. Give ibuprofen automatically — Thrombocytopenia and renal impairment make NSAIDs hazardous.; C. Treat the murmur grade rather than the echo — Murmur grade correlates poorly with shunt burden.", "pearl": "Drug safety and hemodynamics must both guide preterm PDA treatment.", "srcAnswer": "D"}, {"num": 56, "level": "Conceptual", "question": "An AVSD echo shows an elongated, narrowed LV outflow tract (gooseneck deformity). What does this reflect?", "options": ["Aortic coarctation at the isthmus", "SVC override of the atrial septum", "Unwedged aorta; elongated narrowed LVOT", "Subpulmonary obstruction by the VSD"], "answer": 2, "explanation": "The aortic valve is displaced anteriorly and not wedged between the AV valves. Why not the others: A. Aortic coarctation at the isthmus — A different lesion in the arch.; B. SVC override of the atrial septum — Describes a sinus venosus feature.; D. Subpulmonary obstruction by the VSD — Affects the right ventricular outflow.", "pearl": "Gooseneck deformity: elongated narrowed LVOT in AVSD.", "srcAnswer": "C"}, {"num": 57, "level": "Conceptual", "question": "A child has primum ASD and two separate AV valves with a cleft left AV valve, but no VSD. Type?", "options": ["Complete AVSD", "Unbalanced complete AVSD", "Partial AVSD", "Isolated sinus venosus ASD"], "answer": 2, "explanation": "Primum atrial defect with separate AV valves is the partial form. Why not the others: A. Complete AVSD — Needs an inlet VSD and a common AV valve.; B. Unbalanced complete AVSD — Requires a common valve and a VSD.; D. Isolated sinus venosus ASD — A caval-junction defect with normal AV valves.", "pearl": "Partial AVSD has separate AV valves.", "srcAnswer": "C"}, {"num": 58, "level": "Conceptual", "question": "An AVSD has primum ASD and a small restrictive inlet VSD with two separate AV valves. Which form?", "options": ["Partial AVSD", "Complete AVSD", "Perimembranous VSD", "Intermediate AVSD"], "answer": 3, "explanation": "Intermediate form combines primum defect, restrictive inlet VSD and separate valves. Why not the others: A. Partial AVSD — Has no VSD component.; B. Complete AVSD — Has a large inlet VSD and common valve.; C. Perimembranous VSD — Has normal AV valves and no primum ASD.", "pearl": "Intermediate AVSD differs from complete by separate AV valves.", "srcAnswer": "D"}, {"num": 59, "level": "Conceptual", "question": "An AVSD patient has marked RV dominance and hypoplastic LV. Which descriptor is most accurate?", "options": ["Unbalanced AVSD", "Balanced complete AVSD", "Isolated restrictive VSD", "Simple secundum ASD"], "answer": 0, "explanation": "One ventricle is underdeveloped, altering repair feasibility. Why not the others: B. Balanced complete AVSD — Balanced forms have comparable ventricles.; C. Isolated restrictive VSD — Does not involve AV valve commitment.; D. Simple secundum ASD — Normal AV valves and no ventricular imbalance.", "pearl": "Ventricular balance determines AVSD surgical pathway.", "srcAnswer": "A"}, {"num": 60, "level": "Clinical/Application", "question": "A 2-month-old with trisomy 21 has feeding difficulty, tachypnea and superior QRS axis. Which structural lesion is especially likely?", "options": ["Complete AVSD", "Silent PDA", "Isolated valvar pulmonary stenosis", "Tiny isolated PFO"], "answer": 0, "explanation": "Down syndrome and early HF with superior axis are classic AVSD clues. Why not the others: B. Silent PDA — No symptoms.; C. Isolated valvar pulmonary stenosis — Normal axis and no early heart failure.; D. Tiny isolated PFO — Rarely symptomatic.", "pearl": "Trisomy 21 plus superior axis suggests AVSD.", "srcAnswer": "A"}, {"num": 61, "level": "Conceptual", "question": "Which ECG feature is classically associated with AVSD due to conduction-system displacement?", "options": ["Isolated right-axis deviation", "Superior/leftward frontal QRS axis", "A normal axis, as in most shunts", "A delta wave in every patient"], "answer": 1, "explanation": "The altered AV junction often yields superior QRS axis. Why not the others: A. Isolated right-axis deviation — Typical of secundum ASD or PH.; C. A normal axis, as in most shunts — The superior axis is the classic AVSD feature.; D. A delta wave in every patient — A delta wave means pre-excitation.", "pearl": "Superior axis is a strong AVSD clue.", "srcAnswer": "B"}, {"num": 62, "level": "High Difficulty", "question": "A 7-week-old with complete AVSD has tachypnea, recurrent chest infections and poor weight gain. Main pathophysiology?", "options": ["Primary LV outflow stenosis", "A small atrial shunt with normal pulmonary flow", "Reduced pulmonary flow from severe PS", "Large L→R shunt plus AV-valve leak"], "answer": 3, "explanation": "Both shunt and valve leak can drive HF. Why not the others: A. Primary LV outflow stenosis — Not the primary problem here.; B. A small atrial shunt with normal pulmonary flow — Does not explain infections or poor growth.; C. Reduced pulmonary flow from severe PS — The opposite of overcirculation.", "pearl": "Complete AVSD causes early HF as PVR falls.", "srcAnswer": "D"}, {"num": 63, "level": "High Difficulty", "question": "In complete AVSD, which additional finding can worsen heart failure beyond the septal shunt?", "options": ["Common AV-valve regurgitation", "Absent pulmonary valve murmur", "An isolated patent foramen ovale", "Normal AV valve competence"], "answer": 0, "explanation": "Valve leak increases volume burden and worsens symptoms. Why not the others: B. Absent pulmonary valve murmur — Does not worsen failure.; C. An isolated patent foramen ovale — A small shunt.; D. Normal AV valve competence — Would lessen, not worsen, the load.", "pearl": "AV valve regurgitation matters in AVSD severity.", "srcAnswer": "A"}, {"num": 64, "level": "High Difficulty", "question": "Which echocardiographic feature is essential before deciding whether a biventricular AVSD repair is feasible?", "options": ["Resting oxygen saturation level", "Cardiothoracic ratio on chest radiograph", "Relative ventricular size and valve commitment", "Frontal QRS axis and PR interval"], "answer": 2, "explanation": "Unbalanced ventricles may require alternate pathways. Why not the others: A. Resting oxygen saturation level — Does not define anatomy.; B. Cardiothoracic ratio on chest radiograph — Nonspecific.; D. Frontal QRS axis and PR interval — Insufficient to plan repair.", "pearl": "Balanced versus unbalanced AVSD changes repair strategy.", "srcAnswer": "C"}, {"num": 65, "level": "High Difficulty", "question": "A child has AVSD and heterotaxy. Which additional concern most affects comprehensive preoperative planning?", "options": ["Treat as an isolated small secundum ASD", "Complex venous and ventricular anatomy", "Assume pulmonary veins connect normally", "Plan device closure without mapping the valves"], "answer": 1, "explanation": "Heterotaxy may involve systemic/pulmonary venous and atrial isomerism variants. Why not the others: A. Treat as an isolated small secundum ASD — Wrong lesion.; C. Assume pulmonary veins connect normally — Heterotaxy often has anomalous venous return.; D. Plan device closure without mapping the valves — AVSD requires surgical repair and valve assessment.", "pearl": "Heterotaxy demands full segmental anatomical evaluation.", "srcAnswer": "B"}, {"num": 66, "level": "Clinical/Application", "question": "A 10-week-old with complete AVSD has HF controlled on medication. What timing does Indian consensus recommend?", "options": ["Elective repair at 5 years", "Complete repair by about 3 months", "Device closure of the primum ASD only", "No repair unless cyanotic"], "answer": 1, "explanation": "Controlled complete AVSD is recommended for repair by 3 months. Why not the others: A. Elective repair at 5 years — Complete AVSD repair is early.; C. Device closure of the primum ASD only — Leaves the VSD and valve defect.; D. No repair unless cyanotic — Heart failure and overcirculation are indications.", "pearl": "Complete AVSD is repaired earlier than uncomplicated secundum ASD.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day17',label:'Day 17',set:'Quiz 4',href:'Day17/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day17_QuizSet4_Q51-66_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 17 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 51–66</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 17 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 17'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 17');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day17:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
