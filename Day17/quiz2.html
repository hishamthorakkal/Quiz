<script>
const quiz=[{"num": 18, "level": "Conceptual", "question": "After device closure of a secundum ASD, which follow-up pattern is consistent with Indian consensus?", "options": ["No echocardiography after discharge", "Annual cardiac catheterization after closure", "Daily antibiotic prophylaxis for life", "Echo at discharge, 1, 6, 12 months, then 3–5-yearly"], "answer": 3, "explanation": "The device group needs longer surveillance than uncomplicated surgical closure. Why not the others: A. No echocardiography after discharge — Residual shunt, device position and erosion need surveillance.; B. Annual cardiac catheterization after closure — Invasive follow-up is not routine after uncomplicated device closure.; C. Daily antibiotic prophylaxis for life — Prophylaxis covers the first 6 months and high-risk procedures, not daily use.", "pearl": "Device ASD closure has a structured echo surveillance schedule.", "srcAnswer": "D"}, {"num": 19, "level": "Conceptual", "question": "A child with ASD device closure five weeks ago requires a dental procedure involving gingival manipulation. Which statement best matches the Indian consensus?", "options": ["Prophylaxis for every respiratory infection", "No prophylaxis because the ASD was acyanotic", "Aspirin to prevent dental bacteremia", "IE prophylaxis for six months after closure"], "answer": 3, "explanation": "Prosthetic endothelialization period warrants prophylaxis for qualifying dental procedures. Why not the others: A. Prophylaxis for every respiratory infection — Prophylaxis is for qualifying dental procedures, not respiratory illness.; B. No prophylaxis because the ASD was acyanotic — Prosthetic material changes the risk for the first months regardless of the original lesion.; C. Aspirin to prevent dental bacteremia — Antiplatelet drugs do not prevent bacteremia-related endocarditis.", "pearl": "Prosthetic CHD repair has a six-month dental IE prophylaxis window.", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "A late-presenting adult with unrepaired ASD develops atrial flutter. Most plausible substrate?", "options": ["Chronic right atrial stretch", "LV outflow obstruction", "Acute ductal constriction", "Primary coronary vasculitis"], "answer": 0, "explanation": "Longstanding right-sided volume overload promotes atrial arrhythmias. Why not the others: B. LV outflow obstruction — Not part of ASD physiology; flutter arises from the dilated right atrium.; C. Acute ductal constriction — A neonatal event, unrelated to adult atrial arrhythmia.; D. Primary coronary vasculitis — No link to unrepaired ASD.", "pearl": "Delayed ASD closure increases risk of atrial arrhythmias.", "srcAnswer": "A"}, {"num": 21, "level": "Clinical/Application", "question": "A ventricular defect immediately beneath the aortic valve has aortic cusp prolapse. Which VSD type particularly predisposes?", "options": ["Inlet VSD", "Mid-muscular VSD", "Apical muscular VSD", "Outlet/subpulmonary VSD"], "answer": 3, "explanation": "Lack of subarterial support permits aortic cusp prolapse and AR. Why not the others: A. Inlet VSD — Lies beneath the AV valves, not the aortic valve.; B. Mid-muscular VSD — Lies away from the aortic valve.; C. Apical muscular VSD — Lies far from the aortic root.", "pearl": "Outlet VSD + aortic cusp prolapse demands close AR surveillance.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical/Application", "question": "Which isolated VSD location is most frequent in the Indian consensus classification?", "options": ["Outlet VSD", "Perimembranous VSD", "Apical muscular VSD", "Inlet VSD"], "answer": 1, "explanation": "It accounts for the largest proportion, approximately 80%. Why not the others: A. Outlet VSD — Commoner in East Asia than the West, but still less frequent than perimembranous.; C. Apical muscular VSD — Muscular defects are less frequent than perimembranous ones.; D. Inlet VSD — Less frequent and often linked with AV canal defects.", "pearl": "Perimembranous is the commonest VSD location.", "srcAnswer": "B"}, {"num": 23, "level": "Clinical/Application", "question": "A newborn has multiple small muscular septal defects with color Doppler jets. Which description is appropriate?", "options": ["Sinus venosus ASD with PAPVC", "Common AV junction and valve", "Isolated primum ASD with cleft valve", "Multiple muscular (Swiss-cheese) VSDs"], "answer": 3, "explanation": "Several muscular communications can form this pattern. Why not the others: A. Sinus venosus ASD with PAPVC — An atrial defect, not a ventricular one.; B. Common AV junction and valve — Describes the AVSD spectrum, not multiple muscular jets.; C. Isolated primum ASD with cleft valve — An atrial defect at the AV junction.", "pearl": "Multiple muscular VSDs can complicate complete repair planning.", "srcAnswer": "D"}, {"num": 24, "level": "Clinical/Application", "question": "A large nonrestrictive VSD has near-systemic RV pressure. Which factor mainly determines magnitude of left-to-right flow?", "options": ["Length of the PR interval on ECG", "Pulmonary versus systemic resistance", "Loudness of the murmur", "Right atrial oxygen saturation"], "answer": 1, "explanation": "When ventricular pressures equalize, relative vascular resistances govern flow. Why not the others: A. Length of the PR interval on ECG — Conduction is unrelated to shunt size.; C. Loudness of the murmur — A nonrestrictive defect may be quiet; loudness does not set shunt size.; D. Right atrial oxygen saturation — A consequence of the shunt, not a determinant of it.", "pearl": "Large VSD shunt magnitude depends strongly on PVR/SVR.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical/Application", "question": "A 6-week-old with large VSD develops tachypnea and sweating with feeds after initially appearing well. Why now?", "options": ["Fall in PVR, increasing overcirculation", "PVR rises steeply at six weeks", "The ductus reopens at six weeks", "The VSD enlarges spontaneously at this age"], "answer": 0, "explanation": "The shunt becomes more substantial as neonatal PVR declines. Why not the others: B. PVR rises steeply at six weeks — PVR falls over the first weeks.; C. The ductus reopens at six weeks — Ductal reopening is not a normal event.; D. The VSD enlarges spontaneously at this age — Defect size is stable or shrinks; the change is in resistance.", "pearl": "VSD heart failure often becomes apparent as PVR falls.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "Which chamber pattern is expected with a hemodynamically important left-to-right VSD without severe PVR?", "options": ["RV hypertrophy without left enlargement", "Small LA and LV from reduced pulmonary flow", "LA and LV volume enlargement", "Isolated RA enlargement"], "answer": 2, "explanation": "Increased pulmonary venous return loads left-sided chambers. Why not the others: A. RV hypertrophy without left enlargement — Seen with RV outflow obstruction or PH.; B. Small LA and LV from reduced pulmonary flow — Pulmonary flow is increased, which enlarges the left heart.; D. Isolated RA enlargement — Suggests an atrial or caval problem.", "pearl": "VSD and PDA cause left-sided volume overload.", "srcAnswer": "C"}, {"num": 27, "level": "Clinical/Application", "question": "A child with a tiny restrictive VSD has a very loud murmur but normal growth and chamber sizes. Best explanation?", "options": ["A loud murmur shows systemic-level PA pressure", "Atrial-level shunting explains the murmur", "High-velocity jet across a restrictive VSD", "Restrictive VSDs need emergency repair"], "answer": 2, "explanation": "Loud murmur may coexist with a small hemodynamic burden. Why not the others: A. A loud murmur shows systemic-level PA pressure — A loud murmur reflects a high gradient, which means a low PA pressure.; B. Atrial-level shunting explains the murmur — Atrial shunts give flow murmurs, not a loud pansystolic murmur.; D. Restrictive VSDs need emergency repair — Small defects with normal chambers are observed.", "pearl": "Loud VSD is not automatically large VSD.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical/Application", "question": "A child with small restrictive VSD has a harsh pansystolic murmur at left lower sternal border. Why is it often long and high-pitched?", "options": ["Sustained LV-to-RV systolic gradient", "Increased flow across a normal pulmonary valve", "Atrial systolic shunting", "Diastolic aortic-to-PA flow"], "answer": 0, "explanation": "The restrictive jet persists through systole. Why not the others: B. Increased flow across a normal pulmonary valve — Describes the ASD flow murmur.; C. Atrial systolic shunting — An atrial defect does not give a high-pitched pansystolic murmur.; D. Diastolic aortic-to-PA flow — Describes the continuous PDA murmur, not a systolic VSD murmur.", "pearl": "Restrictive VSD produces a high-gradient pansystolic jet.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical/Application", "question": "A 2-month-old with a large VSD and heart failure has a chest radiograph. Which pattern is expected?", "options": ["Egg-shaped silhouette with a narrow pedicle", "Cardiomegaly with increased pulmonary vascularity", "Oligemic lung fields with a boot-shaped heart", "Normal heart size with clear lung fields"], "answer": 1, "explanation": "A large left-to-right shunt gives cardiomegaly with plethora. Why not the others: A. Egg-shaped silhouette with a narrow pedicle — The classic d-TGA pattern.; C. Oligemic lung fields with a boot-shaped heart — The pattern of tetralogy of Fallot.; D. Normal heart size with clear lung fields — Fits a small restrictive defect.", "pearl": "Large L→R shunt: cardiomegaly with plethora.", "srcAnswer": "B"}, {"num": 30, "level": "Clinical/Application", "question": "A 4-month-old has a large VSD and heart failure controlled on therapy. Under the Indian consensus, when should closure be completed?", "options": ["By about six months of age", "After adolescence", "At 2–4 years without reassessment", "After Eisenmenger physiology appears"], "answer": 0, "explanation": "Controlled large VSD with HF is recommended for closure by six months. Why not the others: B. After adolescence — Delay risks pulmonary vascular disease and growth failure.; C. At 2–4 years without reassessment — That is the ASD timing; large VSDs need earlier closure.; D. After Eisenmenger physiology appears — Eisenmenger physiology is a contraindication to closure.", "pearl": "Large VSD with controlled HF should not be delayed beyond infancy.", "srcAnswer": "A"}, {"num": 31, "level": "Clinical/Application", "question": "A 3-month-old has large VSD, failure to thrive and persistent heart failure despite medication. Best next step?", "options": ["Defer closure and add a pulmonary vasodilator", "Defer until pulmonary vascular disease develops", "Expedited closure after specialist stabilization", "Wait until school age for spontaneous closure"], "answer": 2, "explanation": "Uncontrolled HF is an indication for repair as soon as possible. Why not the others: A. Defer closure and add a pulmonary vasodilator — Vasodilators do not treat the shunt and delay needed repair.; B. Defer until pulmonary vascular disease develops — Closure after irreversible disease is contraindicated.; D. Wait until school age for spontaneous closure — Large VSDs seldom close enough, and delay risks irreversible PVR.", "pearl": "Uncontrolled VSD heart failure requires urgent repair planning.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical/Application", "question": "A 3-year-old has moderate VSD, left-heart dilation but no symptoms or pulmonary hypertension. Indian timing recommendation?", "options": ["No closure if asymptomatic", "Wait for cyanosis before closing", "Closure in the first 24 hours", "Closure by approximately 2–5 years"], "answer": 3, "explanation": "Asymptomatic moderate VSD with left dilation merits childhood closure. Why not the others: A. No closure if asymptomatic — LV dilation is an indication even without symptoms.; B. Wait for cyanosis before closing — Cyanosis means a reversed shunt, which is too late.; C. Closure in the first 24 hours — Moderate defects are not neonatal emergencies.", "pearl": "Moderate VSD with LV dilation needs closure even without symptoms.", "srcAnswer": "D"}, {"num": 33, "level": "Clinical/Application", "question": "A 6-year-old has a small VSD with normal chambers and PA pressure; new echo shows aortic cusp prolapse with more-than-trivial AR. Best action?", "options": ["Continue routine follow-up despite the AR", "Device-close it without anatomical assessment", "Start a ductal prostaglandin infusion", "Refer for surgical closure"], "answer": 3, "explanation": "Cusp prolapse with significant related AR warrants intervention even if VSD is small. Why not the others: A. Continue routine follow-up despite the AR — AR from cusp prolapse progresses and is an indication to operate.; B. Device-close it without anatomical assessment — Outlet defects with cusp prolapse need surgical assessment; a device near the aortic valve is unsuitable.; C. Start a ductal prostaglandin infusion — PGE1 opens the duct and has no role here.", "pearl": "Aortic regurgitation changes small VSD management.", "srcAnswer": "D"}, {"num": 34, "level": "Clinical/Application", "question": "A 5-year-old has a small VSD and a documented episode of infective endocarditis. Next management principle?", "options": ["Evaluate for closure despite the small shunt", "Give prophylactic antibiotics indefinitely without assessment", "Wait for pulmonary hypertension", "Ignore the event because LV size is normal"], "answer": 0, "explanation": "Previous IE is a specific closure indication in Indian guidance. Why not the others: B. Give prophylactic antibiotics indefinitely without assessment — Prophylaxis alone does not remove the endocarditis risk.; C. Wait for pulmonary hypertension — Prior endocarditis is itself an indication.; D. Ignore the event because LV size is normal — Prior endocarditis is an accepted closure indication regardless of size.", "pearl": "Prior IE is a closure trigger for an otherwise small VSD.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day17',label:'Day 17',set:'Quiz 2',href:'Day17/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day17_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 17 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 17 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 17'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 17');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day17:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
