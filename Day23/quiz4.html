<script>
const quiz=[{"num": 49, "level": "High", "question": "A 30-kg child is prescribed IV phenytoin 20 mg/kg at 1 mg/kg/min per the IAP 2022 pathway. Minimum infusion time at this rate?", "options": ["20 minutes", "10 minutes", "60 minutes", "30 minutes"], "answer": 0, "explanation": "600 mg total / (30 mg/min) = 20 minutes. Why not the others: B. 10 minutes — Would require 2 mg/kg/min, faster than stated.; C. 60 minutes — Would correspond to 0.33 mg/kg/min.; D. 30 minutes — Would correspond to 0.67 mg/kg/min.", "pearl": "600 mg total / (30 mg/min) = 20 minutes.", "srcAnswer": "A"}, {"num": 50, "level": "High", "question": "A 25-kg child receives levetiracetam 60 mg/kg; vial concentration is 100 mg/mL. What undiluted drug volume is required?", "options": ["60 mL", "25 mL", "15 mL", "1.5 mL"], "answer": 2, "explanation": "Dose 1500 mg / 100 mg/mL = 15 mL; dilution per protocol. Why not the others: A. 60 mL — Confuses mg/kg with millilitres.; B. 25 mL — Corresponds to 2500 mg.; D. 1.5 mL — This is one-tenth of the correct volume after concentration conversion.", "pearl": "Dose 1500 mg / 100 mg/mL = 15 mL; dilution per protocol.", "srcAnswer": "C"}, {"num": 51, "level": "High", "question": "A 6-year-old on valproate has elevated ammonia, normal AST/ALT and new encephalopathy. Which is the most accurate interpretation?", "options": ["A normal total valproate level rules out hyperammonaemia", "Only structural brain lesions can explain altered consciousness", "Valproate-associated hyperammonaemic encephalopathy remains possible", "Normal transaminases rule out any valproate-related encephalopathy"], "answer": 2, "explanation": "Normal transaminases do not exclude this complication. Why not the others: A. A normal total valproate level rules out hyperammonaemia — Toxicity can occur at therapeutic levels.; B. Only structural brain lesions can explain altered consciousness — Drug and metabolic causes remain important.; D. Normal transaminases rule out any valproate-related encephalopathy — Hyperammonaemia can occur without marked hepatocellular injury.", "pearl": "Normal transaminases do not exclude this complication.", "srcAnswer": "C"}, {"num": 52, "level": "High", "question": "A child with hypoalbuminaemia has a total phenytoin level of 12 micrograms/mL but nystagmus and ataxia. Which next step best avoids a common pitfall?", "options": ["Increase phenytoin to achieve total level 20", "Assume nystagmus excludes drug toxicity", "Treat total level as definitive regardless of albumin", "Measure free phenytoin concentration where available and assess toxicity clinically"], "answer": 3, "explanation": "Total concentration may understate active unbound exposure. Why not the others: A. Increase phenytoin to achieve total level 20 — May worsen free-drug toxicity.; B. Assume nystagmus excludes drug toxicity — Nystagmus is a classic phenytoin toxicity sign.; C. Treat total level as definitive regardless of albumin — Ignores protein binding.", "pearl": "Total concentration may understate active unbound exposure.", "srcAnswer": "D"}, {"num": 53, "level": "High", "question": "A child with generalized epilepsy receives lamotrigine plus valproate and develops rash soon after titration. What pharmacokinetic interaction most likely contributed?", "options": ["Lamotrigine induces valproate glucuronidation fivefold", "Valproate increases lamotrigine renal clearance", "Valproate inhibition of lamotrigine metabolism", "The combination has no interaction relevant to rash"], "answer": 2, "explanation": "Valproate reduces lamotrigine clearance, raising exposure. Why not the others: A. Lamotrigine induces valproate glucuronidation fivefold — Not the dominant interaction.; B. Valproate increases lamotrigine renal clearance — Opposite to increased exposure.; D. The combination has no interaction relevant to rash — The interaction is clinically important.", "pearl": "Valproate reduces lamotrigine clearance, raising exposure.", "srcAnswer": "C"}, {"num": 54, "level": "High", "question": "A child in refractory SE receives continuous midazolam infusion. The clinical convulsions disappear, but EEG shows frequent evolving ictal patterns. What does this mean?", "options": ["All EEG activity should be suppressed in every sedated child", "Infusion can be stopped immediately because motor activity ceased", "The EEG patterns must be movement artifact because jerking stopped", "Electrographic seizures persist and treatment requires EEG-guided reassessment"], "answer": 3, "explanation": "Clinical quietness alone does not establish seizure control. Why not the others: A. All EEG activity should be suppressed in every sedated child — Sedation does not automatically abolish all EEG activity.; B. Infusion can be stopped immediately because motor activity ceased — Risk of ongoing status.; C. The EEG patterns must be movement artifact because jerking stopped — Evolving electrographic patterns can be genuine seizures.", "pearl": "Clinical quietness alone does not establish seizure control.", "srcAnswer": "D"}, {"num": 55, "level": "High", "question": "A child with convulsive SE has received one intranasal rescue benzodiazepine prehospital and an adequate IV benzodiazepine in ED, yet remains convulsing. What should be recognized?", "options": ["The prehospital dose never counts toward the treatment sequence", "Oral lamotrigine should replace IV therapy", "A third benzodiazepine is obligatory before any second-line drug", "Two effective benzodiazepine attempts may already have occurred; escalate promptly"], "answer": 3, "explanation": "Count adequate rescue doses across settings to avoid repetitive benzodiazepines. Why not the others: A. The prehospital dose never counts toward the treatment sequence — It must be documented and considered.; B. Oral lamotrigine should replace IV therapy — Not an acute status option.; C. A third benzodiazepine is obligatory before any second-line drug — Not a universal rule; risks accumulating sedation.", "pearl": "Count adequate rescue doses across settings to avoid repetitive benzodiazepines.", "srcAnswer": "D"}, {"num": 56, "level": "High", "question": "A child with benzodiazepine-refractory SE has severe hypotension and conduction disease. Which second-line selection issue is most important?", "options": ["Valproate has no contraindications in any child", "Levetiracetam must be avoided because it invariably prolongs PR", "Phenytoin/fosphenytoin infusion requires special cardiovascular caution", "Fosphenytoin is guaranteed to improve all arrhythmias"], "answer": 2, "explanation": "Hypotension/arrhythmia risks may affect drug choice. Why not the others: A. Valproate has no contraindications in any child — Hepatic/metabolic/reproductive risks still matter.; B. Levetiracetam must be avoided because it invariably prolongs PR — Not its characteristic acute concern.; D. Fosphenytoin is guaranteed to improve all arrhythmias — It can still have cardiovascular effects.", "pearl": "Hypotension/arrhythmia risks may affect drug choice.", "srcAnswer": "C"}, {"num": 57, "level": "High", "question": "A child with focal seizures and known significant renal failure needs a chronic ASM. Which drug property should be considered most carefully when choosing levetiracetam?", "options": ["Predominant renal elimination with dose adjustment", "Routine sodium depletion as primary effect", "High-grade irreversible CYP induction", "Dose independence from glomerular filtration"], "answer": 0, "explanation": "Maintenance doses must account for reduced clearance. Why not the others: B. Routine sodium depletion as primary effect — Not a defining levetiracetam toxicity.; C. High-grade irreversible CYP induction — Levetiracetam has few CYP interactions.; D. Dose independence from glomerular filtration — Contradicts renal elimination.", "pearl": "Maintenance doses must account for reduced clearance.", "srcAnswer": "A"}, {"num": 58, "level": "High", "question": "A 12-year-old on valproate has high fever, jaundice, vomiting and coagulopathy. Which urgent drug-related concern is most relevant?", "options": ["Isolated benign dose-related tremor", "Ethosuximide-induced gingival hyperplasia", "Carbamazepine-induced hyponatraemia", "Severe valproate-associated hepatotoxicity"], "answer": 3, "explanation": "Potentially life-threatening liver injury warrants immediate specialist evaluation. Why not the others: A. Isolated benign dose-related tremor — Cannot explain coagulopathy and jaundice.; B. Ethosuximide-induced gingival hyperplasia — Gingival hyperplasia is characteristic of phenytoin rather than ethosuximide.; C. Carbamazepine-induced hyponatraemia — Different medication and biochemical pattern.", "pearl": "Potentially life-threatening liver injury warrants immediate specialist evaluation.", "srcAnswer": "D"}, {"num": 59, "level": "High", "question": "An infant has refractory SE and a history suggesting a mitochondrial DNA maintenance disorder. Which antiseizure drug should be especially avoided pending specialist assessment?", "options": ["Midazolam for immediate rescue", "Fosphenytoin under monitoring", "Levetiracetam", "Valproate"], "answer": 3, "explanation": "POLG-related disease has high risk of severe valproate hepatotoxicity. Why not the others: A. Midazolam for immediate rescue — Rescue benzodiazepine remains appropriate.; B. Fosphenytoin under monitoring — Has its own risks but not the specific POLG-valproate hazard.; C. Levetiracetam — Often favoured when liver disease or IEM suspected.", "pearl": "POLG-related disease has high risk of severe valproate hepatotoxicity.", "srcAnswer": "D"}, {"num": 60, "level": "High", "question": "A child with severe hyponatraemic seizures receives 3% saline and improves. Which ongoing safety principle is essential?", "options": ["Frequent sodium checks and avoidance of excessive total correction", "Continue unrestricted hypotonic fluids", "Ignore urine output after convulsions stop", "Normalize serum sodium to 140 within one hour in every child"], "answer": 0, "explanation": "After urgent partial correction, overcorrection can cause osmotic injury. Why not the others: B. Continue unrestricted hypotonic fluids — May worsen hyponatraemia.; C. Ignore urine output after convulsions stop — Water diuresis can alter sodium correction.; D. Normalize serum sodium to 140 within one hour in every child — Overly rapid correction can be harmful.", "pearl": "After urgent partial correction, overcorrection can cause osmotic injury.", "srcAnswer": "A"}, {"num": 61, "level": "High", "question": "A child with persistent impaired consciousness after convulsive SE is sedated and mechanically ventilated. What is the best test to distinguish nonconvulsive status from medication sedation?", "options": ["Fundoscopy alone", "Normal chest radiograph", "Continuous or urgent EEG", "Serum sodium alone"], "answer": 2, "explanation": "Electrographic seizures may persist without motor manifestations. Why not the others: A. Fundoscopy alone — Cannot establish ongoing ictal activity.; B. Normal chest radiograph — Does not evaluate cerebral ictal activity.; D. Serum sodium alone — Metabolic assessment is important but not diagnostic of NCSE.", "pearl": "Electrographic seizures may persist without motor manifestations.", "srcAnswer": "C"}, {"num": 62, "level": "High", "question": "A child with suspected autoimmune NORSE has negative initial MRI but persistent refractory seizures. What is the best diagnostic reasoning?", "options": ["FIRES is defined by a prior known drug-resistant epilepsy", "NORSE remains a clinical presentation requiring broad infectious, autoimmune and metabolic evaluation", "All NORSE cases are caused by a single identifiable antibody", "Normal MRI rules out NORSE and FIRES"], "answer": 1, "explanation": "Normal early MRI does not exclude serious causes; treatment is multidisciplinary. Why not the others: A. FIRES is defined by a prior known drug-resistant epilepsy — FIRES typically occurs without prior active epilepsy and follows febrile infection.; C. All NORSE cases are caused by a single identifiable antibody — Aetiology is heterogeneous and may remain cryptogenic.; D. Normal MRI rules out NORSE and FIRES — These syndromes can have initially unrevealing imaging.", "pearl": "Normal early MRI does not exclude serious causes; treatment is multidisciplinary.", "srcAnswer": "B"}, {"num": 63, "level": "High", "question": "A child with acute convulsive SE receives a full second-line drug load, remains convulsing and develops respiratory failure. Which intervention has the highest priority?", "options": ["Intubation/ventilation as needed and expert-directed refractory-SE therapy in PICU", "Obtain routine sleep-deprived outpatient EEG first", "Repeat oral maintenance medication until the next day", "Avoid continuous EEG because sedation masks movements"], "answer": 0, "explanation": "Ongoing seizures plus respiratory failure requires critical-care escalation. Why not the others: B. Obtain routine sleep-deprived outpatient EEG first — Not appropriate in active refractory SE.; C. Repeat oral maintenance medication until the next day — Inadequate and delayed.; D. Avoid continuous EEG because sedation masks movements — EEG becomes especially useful.", "pearl": "Ongoing seizures plus respiratory failure requires critical-care escalation.", "srcAnswer": "A"}, {"num": 64, "level": "High", "question": "A child has a focal impaired-awareness seizure lasting 12 minutes without bilateral convulsions. Which ILAE timing distinction is relevant?", "options": ["All seizure types use a universal t1 of 30 minutes", "Focal seizures have no potential long-term consequences", "Focal impaired-awareness status has a t1 around 10 minutes, unlike convulsive t1 of 5", "Focal status cannot occur without generalized convulsions"], "answer": 2, "explanation": "Different seizure types have different operational thresholds. Why not the others: A. All seizure types use a universal t1 of 30 minutes — Convulsive status uses 5 min.; B. Focal seizures have no potential long-term consequences — Prolonged focal status can be harmful.; D. Focal status cannot occur without generalized convulsions — Focal status is recognized.", "pearl": "Different seizure types have different operational thresholds.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day23',label:'Day 23',set:'Quiz 4',href:'Day23/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day23_QuizSet4_Q49-64_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 23 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–64</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 23 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 23'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 23');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day23:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
