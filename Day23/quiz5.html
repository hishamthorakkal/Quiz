@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 65, "level": "High", "question": "A child receives fosphenytoin and the prescription reads “500 mg” without PE notation. Why is clarification necessary?", "options": ["PE means plasma exchange rather than dose unit", "Dose units are irrelevant when infusion pumps are used", "Fosphenytoin is dosed only in millilitres without mass", "Fosphenytoin doses should be specified in phenytoin equivalents (mg PE)"], "answer": 3, "explanation": "Confusing salt mass and PE can cause dosing errors. Why not the others: A. PE means plasma exchange rather than dose unit — Here PE means phenytoin equivalents.; B. Dose units are irrelevant when infusion pumps are used — Unit clarity is a medication-safety requirement.; C. Fosphenytoin is dosed only in millilitres without mass — Concentration and dose must be specified.", "pearl": "Confusing salt mass and PE can cause dosing errors.", "srcAnswer": "D"}, {"num": 66, "level": "High", "question": "A child with repeated focal seizures is placed on carbamazepine and develops sodium 124 mmol/L. Which interpretation is most defensible?", "options": ["Hyponatraemia proves drug-resistant epilepsy", "The safest response is unsupervised abrupt withdrawal of all medication", "ASM-associated hyponatraemia may itself lower seizure threshold", "Sodium decline excludes an ASM adverse effect"], "answer": 2, "explanation": "Drug-induced hyponatraemia can aggravate seizures and needs management. Why not the others: A. Hyponatraemia proves drug-resistant epilepsy — Metabolic triggers must be addressed first.; B. The safest response is unsupervised abrupt withdrawal of all medication — Requires supervised adjustment and sodium management.; D. Sodium decline excludes an ASM adverse effect — Carbamazepine can contribute.", "pearl": "Drug-induced hyponatraemia can aggravate seizures and needs management.", "srcAnswer": "C"}, {"num": 67, "level": "High", "question": "An adolescent on chronic phenytoin develops poor seizure control after another medication is added. What general principle best explains why a careful interaction review is necessary?", "options": ["Any interacting medication always increases phenytoin concentration", "Phenytoin has complex enzyme induction and nonlinear concentration-response", "Phenytoin is not protein bound and has no interactions", "Serum concentrations have no clinical relevance"], "answer": 1, "explanation": "Co-medications can alter concentrations and efficacy/toxicity. Why not the others: A. Any interacting medication always increases phenytoin concentration — Direction varies with the interaction.; C. Phenytoin is not protein bound and has no interactions — Incorrect pharmacology.; D. Serum concentrations have no clinical relevance — They may guide assessment with context.", "pearl": "Co-medications can alter concentrations and efficacy/toxicity.", "srcAnswer": "B"}, {"num": 68, "level": "Integrated", "question": "A 9-year-old with JME is prescribed carbamazepine and has worsening morning myoclonus; she may later become pregnant. Best long-term reassessment?", "options": ["Increase carbamazepine and add phenytoin", "Reclassify generalized epilepsy and consider levetiracetam with reproductive-risk counselling", "Start valproate without counselling because seizure control is the only issue", "Use ethosuximide alone for generalized tonic-clonic seizures"], "answer": 1, "explanation": "Avoid seizure-aggravating sodium-channel drugs and account for valproate risk. Why not the others: A. Increase carbamazepine and add phenytoin — Both may worsen myoclonic seizures.; C. Start valproate without counselling because seizure control is the only issue — Reproductive risk must be considered.; D. Use ethosuximide alone for generalized tonic-clonic seizures — Does not cover tonic-clonic seizures.", "pearl": "Avoid seizure-aggravating sodium-channel drugs and account for valproate risk.", "srcAnswer": "B"}, {"num": 69, "level": "Integrated", "question": "A 17-kg child convulses for 8 min, has no IV access, and glucose 38 mg/dL. Which combined action is most appropriate?", "options": ["Treat glucose only and ignore ongoing convulsions", "Wait for IV access before any antiseizure rescue", "Non-IV benzodiazepine, ABC support and urgent glucose correction", "Administer oral phenytoin and delay dextrose"], "answer": 2, "explanation": "Treat the seizure and reversible hypoglycaemia concurrently. Why not the others: A. Treat glucose only and ignore ongoing convulsions — Both require immediate treatment.; B. Wait for IV access before any antiseizure rescue — Non-IV benzodiazepine routes exist.; D. Administer oral phenytoin and delay dextrose — Neither addresses the emergency promptly.", "pearl": "Treat the seizure and reversible hypoglycaemia concurrently.", "srcAnswer": "C"}, {"num": 70, "level": "Integrated", "question": "A 22-kg child has received two appropriate benzodiazepines and still convulses. ESETT-style levetiracetam 60 mg/kg is selected. What is the dose and sequencing?", "options": ["1320 mg IV as second-line while supporting airway and circulation", "1320 mg orally with outpatient observation", "4400 mg IV without dose calculation", "220 mg IV before any benzodiazepine"], "answer": 0, "explanation": "22 × 60 = 1320 mg; escalate after adequate benzodiazepines. Why not the others: B. 1320 mg orally with outpatient observation — Wrong route/setting during SE.; C. 4400 mg IV without dose calculation — Excessive for this weight.; D. 220 mg IV before any benzodiazepine — 10 mg/kg and wrong sequence.", "pearl": "22 × 60 = 1320 mg; escalate after adequate benzodiazepines.", "srcAnswer": "A"}, {"num": 71, "level": "Integrated", "question": "A child on valproate with suspected POLG disease has persistent convulsive SE after two benzodiazepines. Which next-line decision is most appropriate?", "options": ["Prefer levetiracetam or another suitable agent over valproate, with critical-care assessment", "Load valproate because it is always equivalent to levetiracetam in every patient", "Use only further benzodiazepines indefinitely", "Delay all treatment until molecular confirmation"], "answer": 0, "explanation": "Metabolic/hepatic contraindications affect selection. Why not the others: B. Load valproate because it is always equivalent to levetiracetam in every patient — Efficacy similarity does not remove contraindications.; C. Use only further benzodiazepines indefinitely — Repeated rescue without escalation increases risk.; D. Delay all treatment until molecular confirmation — Status requires urgent treatment.", "pearl": "Metabolic/hepatic contraindications affect selection.", "srcAnswer": "A"}, {"num": 72, "level": "Integrated", "question": "A child on phenytoin has albumin 2 g/dL, ataxia and total phenytoin 14 micrograms/mL. What is the best combined interpretation and action?", "options": ["Phenytoin-induced hyperammonaemia as the only possible explanation", "Subtherapeutic phenytoin requiring automatic loading", "Normal total level proves a non-drug neurological cause", "Potentially elevated free phenytoin; assess toxicity and obtain free level if possible"], "answer": 3, "explanation": "Hypoalbuminaemia makes total level less reliable. Why not the others: A. Phenytoin-induced hyperammonaemia as the only possible explanation — The described pattern is classic free-drug toxicity.; B. Subtherapeutic phenytoin requiring automatic loading — Clinical toxicity argues against blind loading.; C. Normal total level proves a non-drug neurological cause — Total may be misleading.", "pearl": "Hypoalbuminaemia makes total level less reliable.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated", "question": "A child with status receives IV levetiracetam; jerking stops but GCS remains low and EEG shows electrographic seizures. What is the next best principle?", "options": ["Stop monitoring because the motor seizure ended", "Assume all EEG abnormalities are medication artefact", "Discharge once respiratory rate normalizes", "Treat ongoing electrographic status with specialist/PICU input rather than equating motor cessation with cure"], "answer": 3, "explanation": "NCSE can persist after convulsive cessation. Why not the others: A. Stop monitoring because the motor seizure ended — Electrographic seizures are still present.; B. Assume all EEG abnormalities are medication artefact — Evolving ictal patterns require interpretation.; C. Discharge once respiratory rate normalizes — Ongoing EEG seizures need treatment.", "pearl": "NCSE can persist after convulsive cessation.", "srcAnswer": "D"}, {"num": 74, "level": "Integrated", "question": "A 6-year-old with isolated absence epilepsy is started on ethosuximide, then develops generalized tonic-clonic seizures. Which strategy best follows seizure-type coverage?", "options": ["Discontinue all therapy without assessment", "Add carbamazepine because it treats absence and myoclonus", "Reassess syndrome and switch/add a broad-spectrum ASM with age/sex-specific safety counselling", "Continue ethosuximide alone because it covers all generalized seizure types"], "answer": 2, "explanation": "Ethosuximide alone does not cover tonic-clonic seizures. Why not the others: A. Discontinue all therapy without assessment — Abrupt withdrawal risks recurrence.; B. Add carbamazepine because it treats absence and myoclonus — Can aggravate generalized seizure types.; D. Continue ethosuximide alone because it covers all generalized seizure types — Coverage is absence-specific.", "pearl": "Ethosuximide alone does not cover tonic-clonic seizures.", "srcAnswer": "C"}, {"num": 75, "level": "Integrated", "question": "A 28-kg child has continuous convulsions, receives IV lorazepam 0.1 mg/kg, then a second adequate dose and remains seizing. Which statement is correct?", "options": ["Each dose is 4 mg because all children receive the maximum", "Each lorazepam dose is 28 mg and further lorazepam is the only option", "Each dose is 0.28 mg and EEG must precede escalation", "Each calculated lorazepam dose is 2.8 mg; second-line IV therapy is now indicated"], "answer": 3, "explanation": "28 × 0.1 = 2.8 mg, below 4 mg max; failure of two doses prompts escalation. Why not the others: A. Each dose is 4 mg because all children receive the maximum — Weight-based calculation is below the cap.; B. Each lorazepam dose is 28 mg and further lorazepam is the only option — Tenfold dosing error and wrong escalation.; C. Each dose is 0.28 mg and EEG must precede escalation — Tenfold underdose and treatment delay.", "pearl": "28 × 0.1 = 2.8 mg, below 4 mg max; failure of two doses prompts escalation.", "srcAnswer": "D"}, {"num": 76, "level": "", "question": "An asymptomatic 8-year-old has S2 splitting that widens during inspiration and becomes narrower during expiration. Which interpretation best fits?", "options": ["Persistently wide splitting from pulmonary stenosis", "Paradoxical splitting due to LBBB", "Fixed splitting due to ASD", "Normal physiological S2 splitting"], "answer": 3, "explanation": "Respiratory variation is characteristic of physiological splitting. Why not the others: A. Persistently wide splitting from pulmonary stenosis — Pulmonary stenosis can widen split but normal inspiratory variation is the stem clue.; B. Paradoxical splitting due to LBBB — Paradoxical split tends to widen on expiration.; C. Fixed splitting due to ASD — Fixed split varies little with respiration.", "pearl": "Respiratory variation is characteristic of physiological splitting.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 16 Q41 — Physiological versus fixed S2 split"}}, {"num": 77, "level": "", "question": "A cyanotic neonate has severe pulmonary oedema and echocardiographic obstructed infracardiac total anomalous pulmonary venous connection. Which definitive priority is correct?", "options": ["Elective outpatient reassessment after diuretics alone", "Balloon atrial septostomy as definitive relief of infracardiac venous obstruction", "Routine PGE1 as definitive treatment for pulmonary venous obstruction", "Urgent surgical relief of obstructed pulmonary venous drainage"], "answer": 3, "explanation": "Ductal patency cannot relieve the obstructed venous pathway; urgent repair is needed. Why not the others: A. Elective outpatient reassessment after diuretics alone — Obstructed TAPVC is a surgical emergency.; B. Balloon atrial septostomy as definitive relief of infracardiac venous obstruction — Septostomy does not correct the obstructed vertical venous pathway.; C. Routine PGE1 as definitive treatment for pulmonary venous obstruction — PGE1 may increase pulmonary flow and worsen oedema in obstructed TAPVC.", "pearl": "Ductal patency cannot relieve the obstructed venous pathway; urgent repair is needed.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 16 Q74 — Obstructed infracardiac TAPVC"}}, {"num": 78, "level": "", "question": "A 9-kg child in the stabilization phase of complicated severe acute malnutrition has an ordered F-75 daily volume of 130 mL/kg/day. What is the total prescribed daily volume?", "options": ["130 mL/day", "1500 mL/day", "900 mL/day", "1170 mL/day"], "answer": 3, "explanation": "9 × 130 = 1170 mL/day; preserve the /kg/day unit until multiplied by body weight. Why not the others: A. 130 mL/day — Confuses weight-normalized mL/kg/day with total daily volume.; B. 1500 mL/day — Would correspond to approximately 167 mL/kg/day.; C. 900 mL/day — Corresponds to 100 mL/kg/day, not the order.", "pearl": "9 × 130 = 1170 mL/day; preserve the /kg/day unit until multiplied by body weight.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 volume calculation"}}, {"num": 79, "level": "", "question": "A thriving infant develops bilateral cataracts after milk feeding but has no significant liver dysfunction, coagulopathy or sepsis. Which galactose pathway defect is most consistent?", "options": ["Classic GALT galactosaemia", "Galactokinase deficiency (GALK1)", "Hereditary fructose intolerance", "UDP-galactose 4-epimerase generalized deficiency"], "answer": 1, "explanation": "Galactitol-associated cataracts with little systemic illness distinguish GALK1 deficiency. Why not the others: A. Classic GALT galactosaemia — Classic GALT deficiency more often causes severe systemic liver dysfunction and infection.; C. Hereditary fructose intolerance — Typically manifests after fructose, sucrose or sorbitol exposure.; D. UDP-galactose 4-epimerase generalized deficiency — Generalized GALE deficiency may cause multisystem disease, unlike isolated cataracts.", "pearl": "Galactitol-associated cataracts with little systemic illness distinguish GALK1 deficiency.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 15 Q61 — GALK1 versus GALT"}}, {"num": 80, "level": "", "question": "A 15-month-old has lethargy after overnight fasting, hypoketotic hypoglycaemia and acylcarnitine profile dominated by C8 elevation. Which disorder is most likely?", "options": ["MCAD deficiency (ACADM)", "Maple syrup urine disease", "VLCAD deficiency (ACADVL)", "Propionic acidemia"], "answer": 0, "explanation": "C8 octanoylcarnitine elevation with fasting hypoketotic hypoglycaemia strongly supports MCAD. Why not the others: B. Maple syrup urine disease — Alloisoleucine and branched-chain amino-acid elevation are more characteristic.; C. VLCAD deficiency (ACADVL) — VLCAD is associated with elevated C14:1 species.; D. Propionic acidemia — C3 propionylcarnitine with metabolic acidosis is more characteristic.", "pearl": "C8 octanoylcarnitine elevation with fasting hypoketotic hypoglycaemia strongly supports MCAD.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD C8 versus VLCAD C14:1"}}];
const NB_CTX={srcId:'Day23',label:'Day 23',set:'Quiz 5',href:'Day23/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day23_QuizSet5_Q65-80_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 23 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 65–80</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 23 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 23'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 23');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day23:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
