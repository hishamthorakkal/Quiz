@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 17, "level": "Conceptual", "question": "What does the ESETT trial support for benzodiazepine-refractory established convulsive SE?", "options": ["Levetiracetam, fosphenytoin and valproate had broadly similar effectiveness", "Fosphenytoin abolished the need for cardiorespiratory monitoring", "Levetiracetam was definitively superior in every age group", "Valproate was ineffective compared with placebo"], "answer": 0, "explanation": "No clear winner; choice depends on contraindications, availability and monitoring. Why not the others: B. Fosphenytoin abolished the need for cardiorespiratory monitoring — Cardiac and BP monitoring remain important.; C. Levetiracetam was definitively superior in every age group — The trial did not establish superiority.; D. Valproate was ineffective compared with placebo — ESETT compared active treatments, not placebo.", "pearl": "No clear winner; choice depends on contraindications, availability and monitoring.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "A child is no longer visibly convulsing but remains unresponsive with intermittent subtle eyelid movements. What is the most important next diagnostic step?", "options": ["Assume postictal state and postpone EEG for several days", "Urgent EEG assessment for ongoing electrographic/nonconvulsive seizures", "Use a single normal finger-stick glucose to exclude all neurological causes", "Stop all antiseizure therapy because motor activity ended"], "answer": 1, "explanation": "Clinical cessation of convulsions does not exclude nonconvulsive status. Why not the others: A. Assume postictal state and postpone EEG for several days — Prolonged impaired consciousness requires consideration of ongoing seizures.; C. Use a single normal finger-stick glucose to exclude all neurological causes — Glucose is necessary but cannot rule out nonconvulsive SE.; D. Stop all antiseizure therapy because motor activity ended — EEG and clinical context should guide ongoing therapy.", "pearl": "Clinical cessation of convulsions does not exclude nonconvulsive status.", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "What is the key reason for continuous EEG during anaesthetic treatment of refractory status epilepticus?", "options": ["EEG replaces airway and blood pressure monitoring", "EEG can reliably identify every metabolic trigger without laboratory tests", "Clinical motor silence may conceal electrographic seizures", "EEG measures serum drug concentrations directly"], "answer": 2, "explanation": "EEG guides titration and assesses seizure suppression. Why not the others: A. EEG replaces airway and blood pressure monitoring — Both physiologic and EEG monitoring are required.; B. EEG can reliably identify every metabolic trigger without laboratory tests — Laboratory evaluation remains necessary.; D. EEG measures serum drug concentrations directly — Serum assays, not EEG, measure concentrations.", "pearl": "EEG guides titration and assesses seizure suppression.", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "What distinguishes refractory convulsive SE from simply prolonged initial SE in practical treatment terms?", "options": ["Any recurrence after a week of seizure freedom", "Failure to stop after an adequate benzodiazepine and an appropriate second-line antiseizure drug", "Any seizure lasting 3 minutes despite no treatment", "Only seizures caused by structural brain lesions"], "answer": 1, "explanation": "Refractory SE is defined by treatment failure, not only a fixed clock duration. Why not the others: A. Any recurrence after a week of seizure freedom — Recurrence is not the definition of refractory SE.; C. Any seizure lasting 3 minutes despite no treatment — Three minutes alone does not meet operational convulsive SE threshold.; D. Only seizures caused by structural brain lesions — Aetiology does not define refractory status.", "pearl": "Refractory SE is defined by treatment failure, not only a fixed clock duration.", "srcAnswer": "B"}, {"num": 21, "level": "Clinical", "question": "A 4-year-old is convulsing for 7 minutes in a rural clinic; no IV access or individualized rescue plan is available. Best immediate medication?", "options": ["Oral ethosuximide syrup", "IV fosphenytoin while waiting to obtain access", "Buccal/intranasal midazolam at an appropriate rescue dose", "Oral carbamazepine tablet"], "answer": 2, "explanation": "Non-IV benzodiazepine is appropriate without IV access; transfer and ABC support follow. Why not the others: A. Oral ethosuximide syrup — Not a convulsive-status rescue agent.; B. IV fosphenytoin while waiting to obtain access — Do not delay first-line rescue for IV placement.; D. Oral carbamazepine tablet — Slow absorption and narrow-spectrum action make it unsuitable for active SE.", "pearl": "Non-IV benzodiazepine is appropriate without IV access; transfer and ABC support follow.", "srcAnswer": "C"}, {"num": 22, "level": "Clinical", "question": "A 7-year-old in hospital has convulsed for 6 minutes with IV access and resuscitation available. What is the most appropriate first medication?", "options": ["IV phenytoin before airway evaluation", "IV levetiracetam as the only initial drug", "Oral clonazepam", "IV lorazepam at an appropriate weight-based dose"], "answer": 3, "explanation": "IV lorazepam is a first-line benzodiazepine when IV access is established. Why not the others: A. IV phenytoin before airway evaluation — Airway and first-line benzodiazepine take priority.; B. IV levetiracetam as the only initial drug — Levetiracetam is a second-line option after benzodiazepines.; C. Oral clonazepam — Oral therapy is inappropriate during convulsive status.", "pearl": "IV lorazepam is a first-line benzodiazepine when IV access is established.", "srcAnswer": "D"}, {"num": 23, "level": "Clinical", "question": "A child continues to convulse 7 minutes after one full benzodiazepine dose; airway support is ready. What is the usual next step?", "options": ["Repeat benzodiazepine every 2 minutes without a ceiling", "Delay further medication until MRI confirms the cause", "Give the protocol-directed second benzodiazepine dose and prepare second-line therapy", "Discharge because one dose has already been tried"], "answer": 2, "explanation": "NICE permits a second dose after 5–10 min if first fails, while preparing escalation. Why not the others: A. Repeat benzodiazepine every 2 minutes without a ceiling — Repeated dosing increases respiratory depression.; B. Delay further medication until MRI confirms the cause — Investigation should not delay treatment.; D. Discharge because one dose has already been tried — Ongoing convulsions are an emergency.", "pearl": "NICE permits a second dose after 5–10 min if first fails, while preparing escalation.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical", "question": "A 6-year-old remains in convulsive SE despite two appropriately dosed benzodiazepines. Which treatment is a supported next-line option?", "options": ["Repeated small oral carbamazepine doses", "IV levetiracetam loading under protocol", "Intranasal ethosuximide", "Oral lamotrigine rapid titration"], "answer": 1, "explanation": "Levetiracetam is one of the guideline-supported second-line agents. Why not the others: A. Repeated small oral carbamazepine doses — Not an acute status strategy.; C. Intranasal ethosuximide — Ethosuximide is not used for convulsive status.; D. Oral lamotrigine rapid titration — Slow titration and oral route are inappropriate in ongoing SE.", "pearl": "Levetiracetam is one of the guideline-supported second-line agents.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical", "question": "A child with suspected mitochondrial POLG disorder and liver dysfunction requires an IV second-line ASM for SE. Which option is generally preferable?", "options": ["Levetiracetam", "Valproate", "High-dose carbamazepine by mouth", "Phenobarbital without airway backup"], "answer": 0, "explanation": "IAP warns against valproate in suspected metabolic disease or hepatic dysfunction. Why not the others: B. Valproate — Risk of hepatotoxicity/hyperammonaemia is heightened in relevant metabolic disorders.; C. High-dose carbamazepine by mouth — Not an appropriate IV second-line rescue strategy.; D. Phenobarbital without airway backup — Can depress respiration and requires close airway planning.", "pearl": "IAP warns against valproate in suspected metabolic disease or hepatic dysfunction.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical", "question": "A 9-year-old with status epilepticus is given IV phenytoin. Which bedside monitoring is especially important during loading?", "options": ["ECG and blood pressure", "Serial serum uric acid every 2 minutes", "Daily hearing threshold only", "Continuous pulse oximetry without haemodynamic assessment"], "answer": 0, "explanation": "Rapid IV phenytoin may cause hypotension and arrhythmias. Why not the others: B. Serial serum uric acid every 2 minutes — Not the priority toxicity monitor.; C. Daily hearing threshold only — Ototoxicity is not the acute loading concern.; D. Continuous pulse oximetry without haemodynamic assessment — Respiratory monitoring is needed but does not replace ECG/BP.", "pearl": "Rapid IV phenytoin may cause hypotension and arrhythmias.", "srcAnswer": "A"}, {"num": 27, "level": "Clinical", "question": "A child has persistent generalized convulsions after benzodiazepines and levetiracetam, with progressive hypoxaemia. Best escalation setting?", "options": ["Home rescue kit and discharge", "PICU with airway support, expert-directed anaesthetic infusion and continuous EEG", "Outpatient MRI before further treatment", "Observation ward with oral dose adjustment next morning"], "answer": 1, "explanation": "Refractory status requires neurocritical care and EEG-guided management. Why not the others: A. Home rescue kit and discharge — Ongoing status needs inpatient critical care.; C. Outpatient MRI before further treatment — Imaging must not delay stabilization.; D. Observation ward with oral dose adjustment next morning — Unsafe delay in refractory SE.", "pearl": "Refractory status requires neurocritical care and EEG-guided management.", "srcAnswer": "B"}, {"num": 28, "level": "Clinical", "question": "A 2-year-old treated for prolonged seizures becomes apnoeic after repeated benzodiazepines. What is the immediate priority?", "options": ["Give another unsupervised benzodiazepine bolus", "Obtain lumbar puncture before oxygenation", "Support ventilation and airway while continuing seizure management", "Wait for drug levels to normalize spontaneously"], "answer": 2, "explanation": "Respiratory depression is a known risk; ABC management is urgent. Why not the others: A. Give another unsupervised benzodiazepine bolus — May worsen respiratory compromise.; B. Obtain lumbar puncture before oxygenation — LP does not precede airway rescue.; D. Wait for drug levels to normalize spontaneously — Apnoea requires active support.", "pearl": "Respiratory depression is a known risk; ABC management is urgent.", "srcAnswer": "C"}, {"num": 29, "level": "Clinical", "question": "A 10-year-old taking carbamazepine develops new morning myoclonic jerks and generalized seizures. Which medication change principle is most appropriate?", "options": ["Reassess syndrome and replace the potentially aggravating narrow-spectrum ASM", "Add ethosuximide as the only drug for tonic-clonic seizures", "Stop every ASM abruptly without supervision", "Escalate carbamazepine solely because seizure count increased"], "answer": 0, "explanation": "Carbamazepine can worsen generalized myoclonic epilepsies. Why not the others: B. Add ethosuximide as the only drug for tonic-clonic seizures — Ethosuximide does not cover tonic-clonic seizures.; C. Stop every ASM abruptly without supervision — Abrupt withdrawal risks seizure recurrence/status.; D. Escalate carbamazepine solely because seizure count increased — Could worsen a misclassified generalized epilepsy.", "pearl": "Carbamazepine can worsen generalized myoclonic epilepsies.", "srcAnswer": "A"}, {"num": 30, "level": "Clinical", "question": "A 13-year-old girl with generalized epilepsy is being started on long-term therapy. Which first-line principle best follows WHO guidance?", "options": ["Prefer phenytoin because it is universally safer in pregnancy", "Use carbamazepine for all generalized seizure types", "Start valproate without reproductive-risk discussion", "Prefer lamotrigine or levetiracetam while considering syndrome and counselling"], "answer": 3, "explanation": "WHO recommends these for girls/women of childbearing potential. Why not the others: A. Prefer phenytoin because it is universally safer in pregnancy — Phenytoin is not a universal safer default.; B. Use carbamazepine for all generalized seizure types — May aggravate myoclonus/absence.; C. Start valproate without reproductive-risk discussion — Valproate has major fetal risks and needs strict safeguards.", "pearl": "WHO recommends these for girls/women of childbearing potential.", "srcAnswer": "D"}, {"num": 31, "level": "Clinical", "question": "A child on lamotrigine develops fever, mucosal erosions and widespread painful rash after a recent dose increase. Best response?", "options": ["Stop suspected drug urgently and assess for severe cutaneous adverse reaction", "Double dose to prevent breakthrough seizures", "Treat as harmless isolated acne without assessment", "Continue at same dose until rash fully blisters"], "answer": 0, "explanation": "Possible SJS/TEN is an emergency requiring specialist evaluation. Why not the others: B. Double dose to prevent breakthrough seizures — Would increase exposure and risk.; C. Treat as harmless isolated acne without assessment — Mucosal lesions and systemic symptoms are red flags.; D. Continue at same dose until rash fully blisters — Potentially life-threatening reaction.", "pearl": "Possible SJS/TEN is an emergency requiring specialist evaluation.", "srcAnswer": "A"}, {"num": 32, "level": "Clinical", "question": "A 5-year-old has focal seizures with no generalized myoclonus. Which is a NICE first-line monotherapy choice?", "options": ["Acetazolamide as routine first-line monotherapy", "Ethosuximide", "Vigabatrin as default first-line for all focal epilepsies", "Levetiracetam"], "answer": 3, "explanation": "NICE supports levetiracetam or lamotrigine for focal seizures. Why not the others: A. Acetazolamide as routine first-line monotherapy — Not NICE first-line focal therapy.; B. Ethosuximide — Selective for typical absence, not focal seizures.; C. Vigabatrin as default first-line for all focal epilepsies — Reserved for particular settings due to visual-field toxicity.", "pearl": "NICE supports levetiracetam or lamotrigine for focal seizures.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day23',label:'Day 23',set:'Quiz 2',href:'Day23/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day23_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 23 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 23 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 23'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 23');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day23:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
