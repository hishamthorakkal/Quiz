<script>
const quiz=[{"num": 33, "level": "Clinical", "question": "A child receiving vigabatrin requires specific long-term toxicity surveillance. What is the principal concern?", "options": ["Peripheral visual-field loss", "Hyponatraemia from SIADH", "Severe acne and hirsutism as the principal irreversible toxicity", "Gingival hypertrophy"], "answer": 0, "explanation": "Vigabatrin can cause irreversible concentric visual-field defects. Why not the others: B. Hyponatraemia from SIADH — Not its signature long-term toxicity.; C. Severe acne and hirsutism as the principal irreversible toxicity — Not its defining toxicity.; D. Gingival hypertrophy — Associated with phenytoin.", "pearl": "Vigabatrin can cause irreversible concentric visual-field defects.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical", "question": "A child receiving topiramate develops weight loss, paresthesias and low bicarbonate. Which mechanism links these findings?", "options": ["Isolated increased insulin secretion", "Pure aldosterone excess", "Carbonic anhydrase inhibition causing metabolic acidosis", "Irreversible NMDA agonism"], "answer": 2, "explanation": "Topiramate can cause bicarbonate loss, stones and acidosis. Why not the others: A. Isolated increased insulin secretion — Not the principal explanation.; B. Pure aldosterone excess — Does not explain the ASM-linked pattern.; D. Irreversible NMDA agonism — Not the mechanism of metabolic acidosis.", "pearl": "Topiramate can cause bicarbonate loss, stones and acidosis.", "srcAnswer": "C"}, {"num": 35, "level": "Clinical", "question": "A 12-year-old with epilepsy and new severe renal impairment is taking levetiracetam. Which adjustment is most appropriate?", "options": ["Recalculate maintenance dosing based on renal function", "Change to valproate without reviewing hepatic or reproductive risks", "Increase maintenance dose to compensate for impaired filtration", "Assume renal failure has no effect on levetiracetam pharmacokinetics"], "answer": 0, "explanation": "Levetiracetam is predominantly renally cleared. Why not the others: B. Change to valproate without reviewing hepatic or reproductive risks — Switching is not automatic and has other safety issues.; C. Increase maintenance dose to compensate for impaired filtration — Reduced clearance usually increases exposure.; D. Assume renal failure has no effect on levetiracetam pharmacokinetics — Renal impairment reduces levetiracetam clearance and increases exposure.", "pearl": "Levetiracetam is predominantly renally cleared.", "srcAnswer": "A"}, {"num": 36, "level": "Clinical", "question": "A 7-year-old has recurrent convulsions with measured glucose 32 mg/dL. What should occur in parallel with seizure rescue?", "options": ["Give insulin to stabilize metabolism", "Delay glucose correction until MRI", "Treat only with maintenance oral ASM and no glucose", "Prompt IV dextrose correction according to emergency protocol"], "answer": 3, "explanation": "Hypoglycaemia is a treatable precipitant and requires immediate correction. Why not the others: A. Give insulin to stabilize metabolism — Would worsen hypoglycaemia.; B. Delay glucose correction until MRI — Risks further neurologic injury.; C. Treat only with maintenance oral ASM and no glucose — Does not correct the cause.", "pearl": "Hypoglycaemia is a treatable precipitant and requires immediate correction.", "srcAnswer": "D"}, {"num": 37, "level": "Clinical", "question": "A child has convulsions, serum sodium 116 mmol/L and signs of acute encephalopathy. Which adjunct is most appropriate?", "options": ["Fluid restriction alone while seizures continue", "Urgent controlled hypertonic saline under critical-care protocol", "Oral sodium tablets as sole acute rescue", "Rapid infusion of hypotonic maintenance fluid"], "answer": 1, "explanation": "Symptomatic severe hyponatraemia requires rapid initial partial correction, then close monitoring. Why not the others: A. Fluid restriction alone while seizures continue — Too slow for life-threatening symptomatic hyponatraemia.; C. Oral sodium tablets as sole acute rescue — Not sufficient during severe symptomatic seizures.; D. Rapid infusion of hypotonic maintenance fluid — Can worsen cerebral oedema.", "pearl": "Symptomatic severe hyponatraemia requires rapid initial partial correction, then close monitoring.", "srcAnswer": "B"}, {"num": 38, "level": "Clinical", "question": "A 3-year-old with refractory convulsions and suspected pyridoxine-dependent epilepsy is under monitored resuscitation. What diagnostic-therapeutic step is reasonable?", "options": ["Avoid monitoring because pyridoxine cannot affect respiration", "Empiric high-dose oral carbamazepine only", "Supervised pyridoxine trial with airway/EEG monitoring", "Defer vitamin therapy until genetic testing returns in weeks"], "answer": 2, "explanation": "Pyridoxine-responsive seizures warrant a monitored trial; apnoea can occur. Why not the others: A. Avoid monitoring because pyridoxine cannot affect respiration — Apnoea has been described after IV pyridoxine.; B. Empiric high-dose oral carbamazepine only — Not targeted to pyridoxine-dependent epilepsy.; D. Defer vitamin therapy until genetic testing returns in weeks — Time-sensitive treatable epilepsy should be considered earlier.", "pearl": "Pyridoxine-responsive seizures warrant a monitored trial; apnoea can occur.", "srcAnswer": "C"}, {"num": 39, "level": "Clinical", "question": "After convulsions stop, a child remains obtunded for 45 minutes. Which combination is most defensible?", "options": ["Discontinue observation once jerking ends", "Diagnose psychogenic seizures from lack of motor activity", "Repeat anaesthetic boluses without clinical or EEG reassessment", "Reassess ABC/glucose/medication effect and obtain urgent EEG if ongoing seizures are possible"], "answer": 3, "explanation": "Postictal state, drug sedation and nonconvulsive status must be differentiated. Why not the others: A. Discontinue observation once jerking ends — Complications and electrographic seizures may persist.; B. Diagnose psychogenic seizures from lack of motor activity — Clinical silence does not prove a functional event.; C. Repeat anaesthetic boluses without clinical or EEG reassessment — May worsen sedation without confirming ongoing seizures.", "pearl": "Postictal state, drug sedation and nonconvulsive status must be differentiated.", "srcAnswer": "D"}, {"num": 40, "level": "Clinical", "question": "An infant with severe seizures is hypotensive after rapid IV phenytoin. Which drug-related mechanism should be considered?", "options": ["Isolated renal tubular obstruction", "Irreversible hypocalcaemia caused by phenytoin infusion in every infant", "Ethosuximide-mediated vagal stimulation", "Infusion-associated cardiovascular toxicity"], "answer": 3, "explanation": "IV phenytoin can provoke hypotension and rhythm disturbances. Why not the others: A. Isolated renal tubular obstruction — Not a characteristic immediate infusion effect.; B. Irreversible hypocalcaemia caused by phenytoin infusion in every infant — Not the usual acute mechanism.; C. Ethosuximide-mediated vagal stimulation — Ethosuximide was not administered.", "pearl": "IV phenytoin can provoke hypotension and rhythm disturbances.", "srcAnswer": "D"}, {"num": 41, "level": "Clinical", "question": "A child on valproate develops new drowsiness and tremor after a dose increase. Which laboratory assessment is particularly useful if encephalopathy is suspected?", "options": ["Serum ammonia with liver tests and clinical review", "Antistreptolysin O titre", "Serum calcium alone as the definitive toxicity marker", "Urinary ketones alone"], "answer": 0, "explanation": "Valproate-associated hyperammonaemia may occur with normal liver enzymes. Why not the others: B. Antistreptolysin O titre — Unrelated to drug-related encephalopathy.; C. Serum calcium alone as the definitive toxicity marker — Calcium does not evaluate hyperammonaemia.; D. Urinary ketones alone — Not sufficient for valproate encephalopathy.", "pearl": "Valproate-associated hyperammonaemia may occur with normal liver enzymes.", "srcAnswer": "A"}, {"num": 42, "level": "Clinical", "question": "A child with active SE has suspected bacterial meningitis. What is the correct sequencing principle?", "options": ["Wait for EEG before starting any antimicrobial", "Ignore the infection once a benzodiazepine stops convulsions", "Stabilize/treat seizures immediately while arranging time-sensitive antimicrobials and safe investigation", "Perform LP during uncontrolled convulsions before all medication"], "answer": 2, "explanation": "Neither seizure control nor infection treatment should be delayed for LP. Why not the others: A. Wait for EEG before starting any antimicrobial — May delay treatment of CNS infection.; B. Ignore the infection once a benzodiazepine stops convulsions — Underlying cause still requires treatment.; D. Perform LP during uncontrolled convulsions before all medication — Unsafe and delays resuscitation.", "pearl": "Neither seizure control nor infection treatment should be delayed for LP.", "srcAnswer": "C"}, {"num": 43, "level": "Clinical", "question": "A child receiving phenobarbital develops hypoventilation after IV loading. What is the most appropriate monitoring priority?", "options": ["Immediate discharge if convulsions cease", "Avoid oxygen or assisted ventilation because it masks seizures", "Only weekly liver ultrasonography", "Respiratory and haemodynamic support with close monitoring"], "answer": 3, "explanation": "Barbiturates can depress respiration and consciousness. Why not the others: A. Immediate discharge if convulsions cease — Respiratory compromise needs care.; B. Avoid oxygen or assisted ventilation because it masks seizures — Airway support is essential.; C. Only weekly liver ultrasonography — Not the acute toxicity priority.", "pearl": "Barbiturates can depress respiration and consciousness.", "srcAnswer": "D"}, {"num": 44, "level": "Clinical", "question": "A child with focal epilepsy develops diplopia, ataxia and nystagmus after a modest phenytoin dose increase. Most likely explanation?", "options": ["A predictable increase in serum sodium from phenytoin", "Concentration-dependent phenytoin neurotoxicity due to saturable elimination", "Ethosuximide withdrawal", "Acute peripheral nerve demyelination as the typical dose effect"], "answer": 1, "explanation": "Small dose changes may cause large concentration changes. Why not the others: A. A predictable increase in serum sodium from phenytoin — Does not explain the classic cerebellar toxicity.; C. Ethosuximide withdrawal — No ethosuximide exposure is described.; D. Acute peripheral nerve demyelination as the typical dose effect — The acute pattern is central drug toxicity.", "pearl": "Small dose changes may cause large concentration changes.", "srcAnswer": "B"}, {"num": 45, "level": "Clinical", "question": "A 24-kg child with established SE is to receive levetiracetam 60 mg/kg IV per an ESETT-style protocol. What is the calculated load?", "options": ["2400 mg", "1200 mg", "1440 mg", "960 mg"], "answer": 2, "explanation": "24 × 60 = 1440 mg, below the trial maximum. Why not the others: A. 2400 mg — Represents 100 mg/kg and is not the prescribed load.; B. 1200 mg — This corresponds to 50 mg/kg rather than the prescribed 60 mg/kg.; D. 960 mg — Represents 40 mg/kg, not 60 mg/kg.", "pearl": "24 × 60 = 1440 mg, below the trial maximum.", "srcAnswer": "C"}, {"num": 46, "level": "Clinical", "question": "A 15-kg child requires IV lorazepam 0.1 mg/kg (maximum 4 mg). What dose is indicated?", "options": ["4 mg", "1.5 mg", "0.15 mg", "15 mg"], "answer": 1, "explanation": "15 × 0.1 = 1.5 mg; below 4-mg cap. Why not the others: A. 4 mg — Maximum does not replace weight-based dose in smaller children.; C. 0.15 mg — This is a tenfold underdose from a misplaced decimal point.; D. 15 mg — This is a tenfold overdose from a misplaced decimal point.", "pearl": "15 × 0.1 = 1.5 mg; below 4-mg cap.", "srcAnswer": "B"}, {"num": 47, "level": "Clinical", "question": "A 48-kg adolescent is ordered IV lorazepam 0.1 mg/kg with a maximum single dose of 4 mg. What dose follows the stated cap?", "options": ["0.48 mg", "4.8 mg", "2.4 mg", "4 mg"], "answer": 3, "explanation": "Calculated 4.8 mg exceeds 4-mg maximum. Why not the others: A. 0.48 mg — This is a tenfold underdose from a misplaced decimal point.; B. 4.8 mg — Exceeds the specified single-dose cap.; C. 2.4 mg — This corresponds to 0.05 mg/kg, not the ordered 0.1 mg/kg.", "pearl": "Calculated 4.8 mg exceeds 4-mg maximum.", "srcAnswer": "D"}, {"num": 48, "level": "High", "question": "A 20-kg child receives fosphenytoin 20 mg PE/kg. What amount should the prescription state?", "options": ["800 mg PE", "400 mg phenytoin equivalents (PE)", "20 mg PE total", "400 mg of fosphenytoin base with no PE notation"], "answer": 1, "explanation": "20 × 20 = 400 mg PE; label PE units explicitly. Why not the others: A. 800 mg PE — Corresponds to 40 mg PE/kg.; C. 20 mg PE total — Confuses mg/kg with total mg.; D. 400 mg of fosphenytoin base with no PE notation — Ambiguous and potentially unsafe unit expression.", "pearl": "20 × 20 = 400 mg PE; label PE units explicitly.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day23',label:'Day 23',set:'Quiz 3',href:'Day23/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day23_QuizSet3_Q33-48_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 23 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–48</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 23 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 23'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 23');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day23:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
