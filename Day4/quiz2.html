<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 4 Quiz 2 — Q16–Q30</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 4 — Quiz 2</h1>
<div class="sub">Questions 16–30 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 16, "level": "Conceptual", "question": "Routine serum caffeine levels are generally unnecessary at standard dosing because:", "options": ["Levels are never measurable", "Caffeine is not systemically absorbed enterally", "Clinical response and toxicity are usually adequate guides given the wide therapeutic window", "Caffeine has no pharmacologic variability"], "answer": 2, "explanation": "At standard dosing, response/toxicity usually guide therapy; routine levels are not necessary.", "pearl": "Know the exact definition/physiology because higher-order questions build on it.", "why": "Tests a foundational discriminator used repeatedly in neonatal decision questions."}, {"num": 17, "level": "Conceptual", "question": "A shorter respiratory pause with bradycardia and desaturation can still qualify as clinically significant apnea because:", "options": ["Physiologic consequence matters, not duration alone", "Only monitor duration matters", "Bradycardia proves seizure", "Desaturation excludes apnea"], "answer": 0, "explanation": "Physiologic consequences can make shorter pauses clinically significant.", "pearl": "Know the exact definition/physiology because higher-order questions build on it.", "why": "Tests a foundational discriminator used repeatedly in neonatal decision questions."}, {"num": 18, "level": "Conceptual", "question": "Why does prematurity predispose to IVH?", "options": ["Excessively mature vascular smooth muscle", "Low cerebral blood flow variability", "Increased skull thickness", "Fragile germinal-matrix vasculature plus immature cerebral autoregulation"], "answer": 3, "explanation": "Germinal matrix fragility and immature autoregulation predispose very preterm infants to IVH.", "pearl": "Know the exact definition/physiology because higher-order questions build on it.", "why": "Tests a foundational discriminator used repeatedly in neonatal decision questions."}, {"num": 19, "level": "Conceptual", "question": "The neutral thermal environment is defined by:", "options": ["Any environment where axillary temperature exceeds 37.5°C", "Room temperature of exactly 25°C for every infant", "Maintenance of normal body temperature with minimal metabolic/oxygen expenditure", "Maximum incubator temperature tolerable"], "answer": 2, "explanation": "Neutral thermal environment minimizes metabolic expenditure while maintaining normal body temperature.", "pearl": "Know the exact definition/physiology because higher-order questions build on it.", "why": "Tests a foundational discriminator used repeatedly in neonatal decision questions."}, {"num": 20, "level": "Conceptual", "question": "Why is a universal 2-kg discharge threshold conceptually weak?", "options": ["All infants >2 kg can safely feed orally", "Physiologic maturity in breathing, feeding, temperature control and growth is more relevant than one weight cutoff", "Weight is unrelated to neonatal outcomes", "All infants <2 kg must remain on caffeine"], "answer": 1, "explanation": "Discharge depends on respiratory, feeding, thermal and growth maturity plus safe home support—not one weight number.", "pearl": "Know the exact definition/physiology because higher-order questions build on it.", "why": "Tests a foundational discriminator used repeatedly in neonatal decision questions."}, {"num": 21, "level": "Clinical", "question": "A 27-week, 890-g infant arrives in NICU at 35.3°C after delivery. SpO2 is 94% on CPAP, glucose 58 mg/dL, perfusion is acceptable. What is the best immediate priority?", "options": ["Increase FiO2 solely because temperature is low", "Give a caffeine mini-bolus before correcting temperature", "Delay thermal intervention until a sepsis screen is complete", "Controlled rewarming and correction of the thermal-care bundle while continuing respiratory support"], "answer": 3, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 22, "level": "Clinical", "question": "A 30-week infant has a 14-second pause with HR falling to 78/min and SpO2 to 68%. Which interpretation is best?", "options": ["Definite seizure until proven otherwise", "Isolated bradycardia unrelated to breathing", "Clinically significant apnea despite duration <20 s", "Not apnea because it is <20 s"], "answer": 2, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 23, "level": "Clinical", "question": "A 29-week infant on caffeine has recurrent events with visible chest effort but absent nasal airflow; events improve when the neck is repositioned. Which mechanism is most likely?", "options": ["Metabolic apnea from hypoglycemia", "Obstructive apnea", "Pure central apnea", "Seizure-related apnea"], "answer": 1, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 24, "level": "Clinical", "question": "A previously stable 28-week infant on day 10 develops new apnea, abdominal distension, gastric residuals and platelets fall from 190,000 to 105,000/µL. What is the best next step?", "options": ["Evaluate urgently for NEC/sepsis while providing cardiorespiratory stabilization", "Increase caffeine maintenance dose and observe for 12 h before further testing", "Diagnose worsening AOP because gestation is <30 weeks", "Stop feeds only and defer systemic evaluation unless pneumatosis appears"], "answer": 0, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 25, "level": "Clinical", "question": "A 31-week infant on standard caffeine continues to have apnea. Temperature is 36.8°C, glucose 76 mg/dL, CRP is low, but Hb is 7.2 g/dL and oxygen requirement has increased. What is the best reasoning?", "options": ["Increase caffeine without considering anemia", "Stop caffeine because anemia causes methylxanthine toxicity", "Anemia may contribute, but transfusion should be considered using symptoms, respiratory support and unit thresholds rather than Hb alone", "The hemoglobin alone proves anemia is the only cause and mandates transfusion"], "answer": 2, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 26, "level": "Clinical", "question": "A 29-week infant receives caffeine citrate 20 mg/kg at 10:00. At 18:00, two self-resolving events occur; exam, glucose and temperature are normal. Which is the best approach?", "options": ["Stop caffeine because any post-load apnea is an adverse drug effect", "Continue close monitoring; maintenance is generally started about 24 h after loading and support is escalated only if clinically needed", "Repeat the full 20 mg/kg load automatically at 8 h", "Diagnose caffeine failure immediately and intubate"], "answer": 1, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 27, "level": "Clinical", "question": "A 26-week infant on caffeine has recurrent brady-desaturation with pH 7.23, PaCO2 65 mmHg, increasing work of breathing and no sepsis signs. Which is the best next step?", "options": ["Optimize non-invasive ventilatory support such as NIPPV/CPAP and reassess ventilation", "Increase oxygen alone without addressing ventilation", "Give an antacid because reflux is the usual cause", "Stop caffeine and observe"], "answer": 0, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 28, "level": "Clinical", "question": "A 32-week corrected infant has been event-free for 36 h after stopping caffeine and feeds well. Parents request discharge. Which is the strongest reason to defer discharge?", "options": ["Every preterm infant must remain hospitalized until 2.5 kg", "Caffeine must be continued until term in all infants", "Temperature cannot be assessed outside an incubator", "The long caffeine half-life means a longer observation, commonly 5–7 days, is recommended"], "answer": 3, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 29, "level": "Clinical", "question": "A 1.38-kg preterm infant at 36 weeks corrected age maintains 36.7–37.0°C in an open cot, takes all feeds orally, gains weight and has no apnea for a week. Which statement is best?", "options": ["Return the infant to an incubator to accelerate weight gain", "Low weight alone need not prevent discharge if physiologic and social criteria are satisfied", "Discharge is prohibited below 1.5 kg in all settings", "Restart caffeine until weight exceeds 2 kg"], "answer": 1, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 30, "level": "Clinical", "question": "An ELBW infant has axillary temperature 37.9°C under servo control, HR 188/min and irritability. What is the best first response?", "options": ["Reassess environmental/servo settings and probe placement while evaluating for illness; avoid assuming more warmth is beneficial", "Increase incubator temperature because ELBW infants should be warmer than term infants", "Add a second external heat source before checking the probe", "Ignore the temperature because hyperthermia is protective against apnea"], "answer": 0, "explanation": "The stem contains a reversible or secondary contributor; management should target the immediate physiology and underlying cause rather than reflexively escalating caffeine or using arbitrary thresholds.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}];
let idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 const q=quiz[idx];
 document.getElementById('progress').style.width=`${(idx/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button><button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('mainBtn').textContent=idx===quiz.length-1?'Finish Quiz':'Next Question';
}
function next(){if(idx<quiz.length-1){idx++;render();}else showSummary(false);}
function finishEarly(){if(confirm(`Finish now? You have attempted ${answers.length} question(s).`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day4_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 4 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of 15 questions.</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
