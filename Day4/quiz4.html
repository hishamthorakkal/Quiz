<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 4 Quiz 4 — Q46–Q60</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 4 — Quiz 4</h1>
<div class="sub">Questions 46–60 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>

</div>
<script>
const quiz=[{"num": 46, "level": "High", "question": "A 27-week infant has recurrent apnea despite caffeine 5 mg/kg/day. The infant gained 18% body weight since the maintenance dose was last adjusted; glucose/temp are normal and sepsis evaluation is negative. Which is the best next step?", "options": ["Recalculate caffeine dose using current weight and assess whether dose optimization plus respiratory support is needed", "Give a second full loading dose without checking current mg/kg exposure", "Discontinue caffeine because growth makes AOP unlikely", "Intubate before correcting a likely under-dosed regimen"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 47, "level": "High", "question": "A 29-week infant has recurrent apnea with ongoing chest effort. CPAP prongs are partially out, mouth leak is large, and events resolve after interface correction. Which is the best explanation?", "options": ["Pure central AOP requiring higher caffeine regardless of interface", "Sepsis proven by recurrent desaturation", "Caffeine toxicity causing upper-airway collapse", "Apparent caffeine-resistant mixed/obstructive apnea due to inadequate distending pressure"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 48, "level": "High", "question": "A 31-week infant, day 9, has new apnea. Temp 36.6°C, glucose 82, Hb 11.2, CRP low; abdominal exam shows subtle distension and stool is occult-blood positive. What is the best next step?", "options": ["Continue feeds unchanged until pneumatosis is seen", "Diagnose reflux and start acid suppression", "Investigate early NEC and reassess feeds rather than assuming primary AOP", "Increase caffeine because all screening labs are normal"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 49, "level": "High", "question": "A 26-week infant has repeated severe apnea requiring PPV. Caffeine level is within therapeutic range, sepsis work-up is negative, cranial ultrasound is stable, and PaCO2 is 70 mmHg on CPAP. What is the best next management?", "options": ["Escalate ventilatory support because the infant has inadequate ventilation despite optimized medical therapy", "Increase caffeine indefinitely until PaCO2 normalizes", "Give oxygen alone and accept hypercapnia without assessing work of breathing", "Stop CPAP to reduce airway obstruction"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 50, "level": "High", "question": "A 28-week infant on caffeine is event-free for 6 days. Caffeine is stopped at 34 weeks PMA. On day 4 off caffeine, a 22-second apnea with bradycardia occurs during sleep. Best next step?", "options": ["Discharge because the prior 6 event-free days are sufficient", "Ignore because recurrence after 72 h cannot be related to immature control", "Diagnose seizure without further assessment", "Reassess for secondary causes and reconsider caffeine/observation; discharge clock should reset"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 51, "level": "High", "question": "A 900-g infant has delivery-room temperature 36.0°C despite plastic wrap and radiant warmer. Room temperature was 21°C and the infant remained wet under the wrap. Which prevention failure is most important?", "options": ["Lack of early enteral iron", "Failure to obtain a cranial ultrasound", "Inadequate thermal environment plus persistent evaporative heat loss; optimize room warmth and wrap technique", "Absence of caffeine loading"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 52, "level": "High", "question": "A 27-week infant has recurrent apnea and HR 190/min on caffeine. Maintenance is 10 mg/kg/day, but dose was calculated as caffeine base rather than caffeine citrate. What is the concern?", "options": ["Heart rate excludes caffeine toxicity", "The infant may have received approximately double the intended citrate-equivalent exposure", "The infant is underdosed by half", "Caffeine base and citrate are numerically interchangeable"], "answer": 1, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 53, "level": "High", "question": "A 30-week infant has frequent apnea, but each event is preceded by milk in the mouth and coughing. Sepsis screen is negative. Which management is best?", "options": ["Double caffeine because cough indicates central apnea", "Add acid suppression as first-line because reflux causes most apnea", "Continue full oral feeds and ignore events", "Assess feeding readiness/aspiration and modify feeding strategy before escalating caffeine"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 54, "level": "High", "question": "A 28-week infant has new apnea, mottling, cap refill 5 s and temperature 36.4°C, but CRP drawn 1 h earlier is normal. Which is most appropriate?", "options": ["Increase caffeine only", "Wait 24 h for CRP to rise before cultures", "Treat the clinical deterioration seriously and evaluate/empirically manage sepsis as indicated; an early normal CRP does not exclude it", "Rule out infection because CRP is normal"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 55, "level": "High", "question": "A 32-week infant has brief self-resolving apnea with no bradycardia/desaturation after caffeine discontinuation. Which feature most strongly argues against restarting caffeine immediately?", "options": ["Caffeine cannot be restarted once stopped", "Events are brief, physiologically insignificant and may represent periodic breathing rather than recurrent clinically important AOP", "Any respiratory pause after caffeine cessation requires treatment", "Corrected gestation is irrelevant"], "answer": 1, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 56, "level": "High", "question": "A 25-week infant is hypothermic at 35.5°C and hyperglycemic at 210 mg/dL on day 4. Which is the best reasoning?", "options": ["Hyperglycemia does not exclude cold stress or sepsis; both physiology and illness should be assessed rather than using glucose as a single discriminator", "Cold stress always causes hypoglycemia, so hypothermia must be artifactual", "Hyperglycemia proves caffeine toxicity", "Hyperglycemia makes sepsis impossible"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 57, "level": "High", "question": "A 29-week infant with AOP is stable on caffeine. The infant develops renal dysfunction. Which statement is best?", "options": ["Caffeine should be automatically doubled", "Serum levels are mandatory daily in all preterm infants", "Caffeine clearance may be altered in significant organ dysfunction, so clinical toxicity and dosing should be reassessed even though routine levels are not usually required", "Renal dysfunction never affects caffeine pharmacokinetics"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 58, "level": "High", "question": "A 26-week infant is receiving KMC while on low CPAP and cardiorespiratory monitoring. A trainee says KMC should be stopped because the infant still needs respiratory support. Best response?", "options": ["Incubator care and KMC cannot be alternated", "KMC can be integrated with ongoing neonatal care when clinically feasible; respiratory support alone is not an automatic contraindication", "KMC is allowed only in room air", "KMC is solely a post-discharge intervention"], "answer": 1, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 59, "level": "High", "question": "A 30-week infant in an open cot has temperatures 36.4–36.6°C, feeds well and otherwise appears stable. Before discharge, what is the best approach?", "options": ["Ensure reliable maintenance within the normal range, review environmental/dressing factors and assess for illness if instability persists", "Discharge because 36.4°C is always normal for preterm infants", "Restart caffeine solely for borderline temperature", "Set a discharge weight threshold instead of addressing temperature"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 60, "level": "High", "question": "A 28-week infant on day 18 has recurrent apnea, Hb 8 g/dL, reticulocytes low, no sepsis, stable respiratory support. Which statement is most defensible?", "options": ["Any apnea with Hb <9 mandates transfusion regardless of support", "Caffeine must be stopped before considering anemia", "Anemia cannot influence respiratory control", "Anemia may contribute, but transfusion should follow neonatal transfusion thresholds plus symptoms/support rather than apnea alone"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day4_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 4 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
