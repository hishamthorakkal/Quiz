@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
const quiz=[{"num": 69, "level": "", "question": "A child has headache, seizures and a single small parenchymal enhancing lesion in an endemic area; neurocysticercosis is considered. Which statement is safest?", "options": ["All enhancing lesions must receive albendazole without assessment", "LP is mandatory before brain imaging in every seizure case", "Diagnosis and therapy depend on lesion stage, number, location and seizure status", "Calcified lesions contain viable cysts requiring routine antiparasitic treatment"], "answer": 2, "explanation": "NCC management varies with viable, degenerating or calcified lesions and inflammatory response. Why not the others: A. All enhancing lesions must receive albendazole without assessment — Antiparasitic therapy is not automatic for every lesion type.; B. LP is mandatory before brain imaging in every seizure case — Imaging may be crucial, and LP can be unsafe with mass effect.; D. Calcified lesions contain viable cysts requiring routine antiparasitic treatment — Calcified lesions are generally nonviable and management differs.", "pearl": "", "srcAnswer": "C"}, {"num": 70, "level": "", "question": "A child with a brain abscess has Streptococcus anginosus isolated from drainage. Which principle best guides management?", "options": ["Use corticosteroids as the only definitive treatment", "Targeted antimicrobial therapy plus source control when indicated", "Treat with antiseizure medication alone", "Stop antibiotics after one normal temperature reading"], "answer": 1, "explanation": "Drainage/culture and pathogen-directed therapy are key components of abscess management. Why not the others: A. Use corticosteroids as the only definitive treatment — Steroids do not eradicate a pyogenic abscess.; C. Treat with antiseizure medication alone — Seizure control is supportive, not abscess source control.; D. Stop antibiotics after one normal temperature reading — Treatment duration is guided by clinical and imaging response.", "pearl": "", "srcAnswer": "B"}, {"num": 71, "level": "", "question": "A child with febrile encephalopathy has severe hypoglycaemia on bedside testing. Which immediate action is appropriate?", "options": ["Assume glucose cannot influence seizure activity", "Correct glucose urgently while evaluating the CNS syndrome", "Defer glucose until MRI excludes ADEM", "Give maintenance glucose-containing fluids and recheck after MRI"], "answer": 1, "explanation": "Hypoglycaemia is a reversible cause of neurological deterioration and requires immediate correction. Why not the others: A. Assume glucose cannot influence seizure activity — Neuroglycopenia can precipitate seizures and coma.; C. Defer glucose until MRI excludes ADEM — Imaging should not delay correction of severe hypoglycaemia.; D. Give maintenance glucose-containing fluids and recheck after MRI — Severe neuroglycopenia needs immediate correction, not delayed maintenance infusion.", "pearl": "", "srcAnswer": "B"}, {"num": 72, "level": "", "question": "A child with bacterial meningitis has repeated focal seizures, hyponatraemia and reduced consciousness. Which integrated approach is most appropriate?", "options": ["Treat seizures and sodium disorder while continuing urgent infection therapy and evaluating intracranial complications", "Treat only seizures and ignore the underlying infection", "Attribute all deterioration to sedation without reassessment", "Treat only the sodium abnormality and defer antimicrobials"], "answer": 0, "explanation": "Multiple concurrent neurologic and metabolic emergencies require parallel management. Why not the others: B. Treat only seizures and ignore the underlying infection — Antiseizure treatment alone does not address meningitis.; C. Attribute all deterioration to sedation without reassessment — New deterioration needs evaluation for infection complications and metabolic causes.; D. Treat only the sodium abnormality and defer antimicrobials — Hyponatraemia does not remove the infection emergency.", "pearl": "", "srcAnswer": "A"}, {"num": 73, "level": "", "question": "A child with fever and meningeal signs is haemodynamically unstable. Which sequence best balances LP and treatment?", "options": ["Defer antibiotics until all diagnostic tests are complete", "Stabilize and start empiric antimicrobials promptly; perform LP later if and when safe", "Wait for brain MRI before blood cultures and antibiotics", "Attempt LP repeatedly before any resuscitation"], "answer": 1, "explanation": "Resuscitation and time-critical treatment take priority when immediate LP is unsafe. Why not the others: A. Defer antibiotics until all diagnostic tests are complete — Microbiologic yield concerns do not outweigh treatment urgency.; C. Wait for brain MRI before blood cultures and antibiotics — Imaging delay may harm a critically ill child.; D. Attempt LP repeatedly before any resuscitation — Unstable physiology and potential ICP risk make this unsafe.", "pearl": "", "srcAnswer": "B"}, {"num": 74, "level": "", "question": "A child with suspected encephalitis has normal CT but persistent focal signs and seizures. What does a normal CT imply?", "options": ["It excludes HSV encephalitis definitively", "It rules out all demyelinating syndromes", "It does not exclude encephalitis; MRI and CSF evaluation may still be needed", "It establishes functional neurological symptoms"], "answer": 2, "explanation": "CT can be insensitive early; MRI is more informative for parenchymal inflammation. Why not the others: A. It excludes HSV encephalitis definitively — HSV may have normal early CT despite significant disease.; B. It rules out all demyelinating syndromes — MRI may reveal demyelination despite normal CT.; D. It establishes functional neurological symptoms — Normal CT cannot prove a nonorganic cause.", "pearl": "", "srcAnswer": "C"}, {"num": 75, "level": "", "question": "A child has acute encephalopathy, bilateral optic neuritis, spinal cord lesions and a positive MOG-IgG assay. Which integrated interpretation is most defensible?", "options": ["Treat as bacterial meningitis alone despite optic-spinal demyelination", "Consider MOG-antibody-associated disease, while excluding infectious mimics and planning longitudinal reassessment", "Label monophasic ADEM permanently without follow-up", "Label definite HSV encephalitis without PCR or compatible imaging"], "answer": 1, "explanation": "MOGAD may produce encephalitic, optic and spinal phenotypes; infection exclusion and follow-up remain important. Why not the others: A. Treat as bacterial meningitis alone despite optic-spinal demyelination — Infectious coverage may be initially needed but cannot explain all demyelinating findings by itself.; C. Label monophasic ADEM permanently without follow-up — Later events may alter classification and management.; D. Label definite HSV encephalitis without PCR or compatible imaging — MOG-IgG and optic-spinal disease are not diagnostic of HSV.", "pearl": "", "srcAnswer": "B"}, {"num": 76, "level": "", "question": "A well child has a split S2 that becomes more audible during inspiration and nearly merges during expiration. Which classification fits best?", "options": ["Physiological respiratory splitting", "Fixed splitting typical of secundum ASD", "Wide splitting due to pulmonary stenosis", "Paradoxical splitting from left bundle-branch block"], "answer": 0, "explanation": "Normal inspiration delays P2 and widens S2 splitting. Why not the others: B. Fixed splitting typical of secundum ASD — ASD splitting remains relatively constant across respiration.; C. Wide splitting due to pulmonary stenosis — Pulmonary stenosis causes persistent wide splitting with delayed P2.; D. Paradoxical splitting from left bundle-branch block — Paradoxical splitting is wider on expiration and narrows on inspiration.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 16 Q41 — Normal respiratory S2 splitting"}}, {"num": 77, "level": "", "question": "A neonate has severe cyanosis, pulmonary oedema and echocardiographic obstructed infracardiac total anomalous pulmonary venous connection. Which strategy addresses the lesion?", "options": ["Elective repair at one year after diuretics", "Prostaglandin E1 as definitive pulmonary venous decompression", "Urgent surgical relief of pulmonary venous obstruction", "Balloon pulmonary valvotomy as definitive therapy"], "answer": 2, "explanation": "Anatomic obstruction requires urgent surgical correction. Why not the others: A. Elective repair at one year after diuretics — Obstructed TAPVC is an emergency, not a lesion for elective delay.; B. Prostaglandin E1 as definitive pulmonary venous decompression — PGE1 does not remove the venous obstruction and may worsen pulmonary congestion.; D. Balloon pulmonary valvotomy as definitive therapy — Pulmonary valve opening does not correct anomalous venous drainage.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 16 Q74 — Obstructed infracardiac TAPVC"}}, {"num": 78, "level": "", "question": "A child several weeks after ASD device closure develops sudden chest pain, hypotension and a new pericardial effusion. What is the best immediate response?", "options": ["Urgent echocardiography and specialist evaluation for device erosion", "Treat as postpericardiotomy syndrome without urgent imaging", "Reassure that transient chest pain is expected after device closure", "Continue routine antiplatelet therapy and arrange scheduled outpatient review"], "answer": 0, "explanation": "Device erosion can cause tamponade and requires urgent recognition. Why not the others: B. Treat as postpericardiotomy syndrome without urgent imaging — A device patient with shock and effusion needs immediate assessment for erosion/tamponade.; C. Reassure that transient chest pain is expected after device closure — Haemodynamic compromise and effusion are warning signs.; D. Continue routine antiplatelet therapy and arrange scheduled outpatient review — Possible tamponade requires urgent evaluation rather than routine post-device follow-up.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 17 Q17 — ASD device erosion"}}, {"num": 79, "level": "", "question": "During echocardiography teaching, a trainee asks which anatomical VSD type is the most frequent overall. Which is the best answer?", "options": ["Outlet subarterial VSD", "Inlet VSD associated with AV canal", "Perimembranous VSD", "Apical muscular VSD"], "answer": 2, "explanation": "Perimembranous defects are the most common anatomical type. Why not the others: A. Outlet subarterial VSD — Outlet defects are less common in most populations.; B. Inlet VSD associated with AV canal — Inlet defects are less frequent than perimembranous defects.; D. Apical muscular VSD — Muscular VSDs are common but not the largest overall subtype.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 17 Q22 — Perimembranous VSD frequency"}}, {"num": 80, "level": "", "question": "Angiography shows a conical ductus with a broad aortic ampulla tapering towards its pulmonary end. Which Krichenko type is described?", "options": ["Type C tubular", "Type E elongated", "Type B window", "Type A conical"], "answer": 3, "explanation": "Type A describes the common conical PDA morphology. Why not the others: A. Type C tubular — Type C is a tubular ductus with less tapering.; B. Type E elongated — Type E is elongated and tortuous with a remote constriction.; C. Type B window — Type B has a short window-like configuration.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 17 Q44 — Krichenko PDA morphology"}}, {"num": 81, "level": "", "question": "An echo in AVSD shows elongated narrowed LV outflow and aortic root not wedged between AV valves. What explains the classic gooseneck configuration?", "options": ["Pulmonary venous obstruction due to TAPVC", "Unwedged aorta and abnormal AV junction elongating the LVOT", "A fixed subpulmonary membrane below the pulmonary valve", "Severe isolated mitral stenosis with normal AV junction"], "answer": 1, "explanation": "AVSD morphology can produce an elongated narrowed LV outflow tract. Why not the others: A. Pulmonary venous obstruction due to TAPVC — TAPVC affects pulmonary venous return rather than LVOT geometry.; C. A fixed subpulmonary membrane below the pulmonary valve — This is a right-sided obstruction and not the gooseneck LVOT mechanism.; D. Severe isolated mitral stenosis with normal AV junction — Isolated mitral stenosis does not define AVSD gooseneck anatomy.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 17 Q56 — AVSD gooseneck LVOT"}}, {"num": 82, "level": "", "question": "An echo shows primum ASD, a small restrictive inlet VSD and two separate atrioventricular valve orifices. What is the best classification?", "options": ["Complete AVSD", "Isolated secundum ASD", "Partial AVSD", "Intermediate or transitional AVSD"], "answer": 3, "explanation": "Small inlet VSD plus separate AV orifices fits intermediate AVSD. Why not the others: A. Complete AVSD — Complete AVSD has a common AV valve orifice.; B. Isolated secundum ASD — A secundum defect does not explain primum ASD and inlet VSD.; C. Partial AVSD — Partial AVSD generally lacks interventricular communication.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 17 Q58 — Intermediate AVSD classification"}}, {"num": 83, "level": "", "question": "An infant with severe TOF-associated RVOT obstruction has repeated desaturation but is not currently suitable for complete repair. Which catheter option may be considered after anatomical assessment?", "options": ["Balloon mitral valvotomy", "RVOT stenting as selected temporary palliation", "Atrial septostomy as universal definitive TOF treatment", "Coarctation balloon angioplasty"], "answer": 1, "explanation": "Stenting may improve pulmonary blood flow in selected infants with suitable anatomy. Why not the others: A. Balloon mitral valvotomy — This addresses mitral stenosis, not TOF RVOT obstruction.; C. Atrial septostomy as universal definitive TOF treatment — Atrial septostomy does not relieve severe RVOT obstruction.; D. Coarctation balloon angioplasty — Aortic coarctation intervention does not treat TOF RVOT obstruction.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 18 Q33 — TOF RVOT palliation"}}, {"num": 84, "level": "", "question": "A fasting-intolerant child has hypoketotic hypoglycaemia and suspected medium-chain acyl-CoA dehydrogenase deficiency. Which acylcarnitine elevation is most characteristic?", "options": ["C8 octanoylcarnitine", "C3 propionylcarnitine", "C5 isovalerylcarnitine", "C14:1 tetradecenoylcarnitine"], "answer": 0, "explanation": "Elevated C8 is a characteristic marker of MCAD deficiency. Why not the others: B. C3 propionylcarnitine — C3 is elevated in propionic or methylmalonic acid metabolism disorders.; C. C5 isovalerylcarnitine — C5 is associated with isovaleric acidemia and related disorders.; D. C14:1 tetradecenoylcarnitine — C14:1 more strongly points toward VLCAD deficiency.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD acylcarnitine marker"}}];
const NB_CTX={srcId:'Day26',label:'Day 26',set:'Quiz 5',href:'Day26/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day26_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 26 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 26 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 26'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 26');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day26:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
