<script>
const quiz=[{"num": 1, "level": "", "question": "A febrile 4-year-old is drowsy with neck stiffness and purpura. Blood culture is being obtained. Which action should not await CT or lumbar puncture?", "options": ["Repeat CRP after six hours", "Cranial CT before any antimicrobial", "Routine EEG before antimicrobial", "Immediate parenteral empiric antibiotics"], "answer": 3, "explanation": "Suspected bacterial meningitis is time-critical; treatment must not wait for imaging or CSF. Why not the others: A. Repeat CRP after six hours — Serial inflammation markers do not justify postponing emergency treatment.; B. Cranial CT before any antimicrobial — CT may be indicated for selected neurologic red flags but must not delay antibiotics.; C. Routine EEG before antimicrobial — EEG can assess seizures but does not treat the infection.", "pearl": "Treat first when LP is unsafe or delayed.", "srcAnswer": "D"}, {"num": 2, "level": "", "question": "A child with suspected meningitis has rapidly worsening consciousness, anisocoria and bradycardia. Which immediate diagnostic decision is safest?", "options": ["Wait for fundus photography before resuscitation", "Perform LP to measure opening pressure now", "Use a smaller LP needle without stabilization", "Defer lumbar puncture and stabilize possible intracranial hypertension"], "answer": 3, "explanation": "Herniation-risk signs make immediate LP unsafe; resuscitation and urgent evaluation take priority. Why not the others: A. Wait for fundus photography before resuscitation — Fundoscopy is not a substitute for immediate stabilization.; B. Perform LP to measure opening pressure now — Pressure measurement does not outweigh potential herniation risk.; C. Use a smaller LP needle without stabilization — Needle size does not remove intracranial mass-effect risk.", "pearl": "", "srcAnswer": "D"}, {"num": 3, "level": "", "question": "A child with suspected bacterial meningitis has CSF neutrophilic pleocytosis, high protein and low CSF-to-blood glucose ratio. Which mechanism best explains the low glucose?", "options": ["Glucose consumption and impaired blood–CSF glucose transport during inflammation", "Bacterial toxins cause obligatory systemic hyperglycaemia", "CSF glucose normally exceeds simultaneous plasma glucose", "Selective leakage of glucose into brain parenchyma only"], "answer": 0, "explanation": "Inflammatory cells and pathogens consume glucose while meningeal inflammation impairs transport. Why not the others: B. Bacterial toxins cause obligatory systemic hyperglycaemia — Systemic glycaemia alone does not explain a reduced CSF/plasma ratio.; C. CSF glucose normally exceeds simultaneous plasma glucose — CSF glucose is normally lower than plasma glucose.; D. Selective leakage of glucose into brain parenchyma only — This is not the principal mechanism of hypoglycorrhachia.", "pearl": "", "srcAnswer": "A"}, {"num": 4, "level": "", "question": "An ill child has CSF glucose 30 mg/dL and simultaneous plasma glucose 100 mg/dL. What is the CSF:plasma glucose ratio?", "options": ["30", "3.33", "0.70", "0.30"], "answer": 3, "explanation": "Divide 30 by 100; a low ratio strengthens concern for bacterial, TB or fungal meningitis. Why not the others: A. 30 — This omits the dimensionless ratio conversion.; B. 3.33 — This reverses the CSF and blood glucose numerator.; C. 0.70 — This incorrectly subtracts the two values from unity.", "pearl": "Ratio is unitless.", "srcAnswer": "D"}, {"num": 5, "level": "", "question": "A child receives ceftriaxone before LP because the procedure is delayed. Which statement about subsequent CSF testing is most accurate?", "options": ["CSF PCR is guaranteed to become negative after one dose", "CSF culture yield may fall, but CSF cell counts and molecular tests may remain useful", "CSF glucose immediately normalizes after antibiotics", "An LP after antibiotics is diagnostically worthless"], "answer": 1, "explanation": "Antibiotics can rapidly reduce culture sensitivity; a later LP may still provide diagnostic information. Why not the others: A. CSF PCR is guaranteed to become negative after one dose — Molecular material may remain detectable after antimicrobial exposure.; C. CSF glucose immediately normalizes after antibiotics — Inflammatory CSF chemistry does not normalize immediately.; D. An LP after antibiotics is diagnostically worthless — Reduced culture yield is not equivalent to zero diagnostic value.", "pearl": "", "srcAnswer": "B"}, {"num": 6, "level": "", "question": "A child with pneumococcal meningitis develops new focal seizures and persistent fever despite therapy. Which complication requires directed imaging?", "options": ["Expected postictal sleepiness without new intracranial pathology", "Benign febrile seizure recurrence only", "Subdural empyema or focal intracranial complication", "Isolated drug-induced peripheral neuropathy"], "answer": 2, "explanation": "Persistent focal signs or fever warrant evaluation for empyema, infarct, abscess or venous thrombosis. Why not the others: A. Expected postictal sleepiness without new intracranial pathology — Persistent fever with focal seizures warrants evaluation beyond postictal observation.; B. Benign febrile seizure recurrence only — New focal seizures during meningitis are not safely dismissed as benign.; D. Isolated drug-induced peripheral neuropathy — Peripheral neuropathy does not explain the new intracranial focal signs.", "pearl": "", "srcAnswer": "C"}, {"num": 7, "level": "", "question": "A 7-year-old has meningococcal meningitis and shock. Which early physiological target is most appropriate?", "options": ["Delay antibiotics until blood pressure is normal", "Restrict all fluid irrespective of perfusion", "Normalize CSF protein before treating shock", "Restore perfusion and treat infection concurrently"], "answer": 3, "explanation": "Shock management and timely antibiotics must proceed together. Why not the others: A. Delay antibiotics until blood pressure is normal — Antimicrobials should not await complete hemodynamic normalization.; B. Restrict all fluid irrespective of perfusion — Fluid decisions require careful perfusion assessment, not an absolute prohibition.; C. Normalize CSF protein before treating shock — CSF protein is not a resuscitation target.", "pearl": "", "srcAnswer": "D"}, {"num": 8, "level": "", "question": "A child with acute bacterial meningitis recovers neurologically. Which follow-up assessment is especially important?", "options": ["Routine repeat contrast MRI in every clinically recovered child", "Formal age-appropriate hearing assessment", "Routine screening EEG for every asymptomatic survivor", "Scheduled repeat lumbar puncture solely to document protein normalization"], "answer": 1, "explanation": "Sensorineural hearing impairment is a recognized post-meningitis sequela. Why not the others: A. Routine repeat contrast MRI in every clinically recovered child — MRI is targeted to complications, whereas hearing evaluation addresses a common sequela.; C. Routine screening EEG for every asymptomatic survivor — EEG is appropriate for seizures or neurological concerns, not a universal sequela screen.; D. Scheduled repeat lumbar puncture solely to document protein normalization — Routine serial LPs are not required after uncomplicated clinical recovery.", "pearl": "", "srcAnswer": "B"}, {"num": 9, "level": "", "question": "A 6-week-old with suspected meningitis has a negative Kernig sign. What is the most defensible interpretation?", "options": ["Infant meningitis requires a bulging fontanelle", "Absence of classical meningeal signs does not exclude meningitis in infants", "Normal tone alone excludes CNS infection", "Negative Kernig sign rules out bacterial meningitis"], "answer": 1, "explanation": "Infants often have nonspecific signs including poor feeding, irritability and altered activity. Why not the others: A. Infant meningitis requires a bulging fontanelle — Fontanelle bulging may be absent, particularly early.; C. Normal tone alone excludes CNS infection — A normal single neurologic observation does not rule out evolving infection.; D. Negative Kernig sign rules out bacterial meningitis — Meningeal signs are insensitive in young infants.", "pearl": "", "srcAnswer": "B"}, {"num": 10, "level": "", "question": "A child with meningitis has Gram-positive lancet-shaped diplococci in CSF. Which organism is most likely?", "options": ["Listeria monocytogenes", "Haemophilus influenzae", "Neisseria meningitidis", "Streptococcus pneumoniae"], "answer": 3, "explanation": "Lancet-shaped Gram-positive diplococci are characteristic of pneumococcus. Why not the others: A. Listeria monocytogenes — Listeria is a Gram-positive short rod rather than a diplococcus.; B. Haemophilus influenzae — H influenzae is a small Gram-negative coccobacillus.; C. Neisseria meningitidis — Meningococcus is typically a Gram-negative diplococcus.", "pearl": "", "srcAnswer": "D"}, {"num": 11, "level": "", "question": "A toddler with acute meningitis has Gram-negative intracellular diplococci on CSF Gram stain. What is the likely pathogen?", "options": ["Escherichia coli", "Streptococcus pneumoniae", "Neisseria meningitidis", "Streptococcus agalactiae"], "answer": 2, "explanation": "Intracellular Gram-negative diplococci support meningococcal infection. Why not the others: A. Escherichia coli — E coli is a Gram-negative rod.; B. Streptococcus pneumoniae — Pneumococcus is Gram-positive and lancet-shaped.; D. Streptococcus agalactiae — Group B streptococcus appears as Gram-positive cocci in chains.", "pearl": "", "srcAnswer": "C"}, {"num": 12, "level": "", "question": "A child with meningitis has an immediate severe beta-lactam allergy. What principle should govern antibiotic selection?", "options": ["Withhold all antimicrobials until culture results", "Give an oral macrolide alone as standard meningitis therapy", "Urgently select an effective alternative with infectious-disease guidance and local susceptibility data", "Treat with corticosteroid alone until allergy testing"], "answer": 2, "explanation": "Choice depends on likely pathogen, allergy phenotype, resistance and CNS penetration. Why not the others: A. Withhold all antimicrobials until culture results — A severe allergy requires an alternative, not untreated meningitis.; B. Give an oral macrolide alone as standard meningitis therapy — Routine oral macrolide monotherapy is inadequate for bacterial meningitis.; D. Treat with corticosteroid alone until allergy testing — Steroids do not replace antibacterial therapy.", "pearl": "", "srcAnswer": "C"}, {"num": 13, "level": "", "question": "A stable child with suspected bacterial meningitis has no focal signs, seizures, papilloedema or severe consciousness impairment. Which diagnostic step is generally appropriate?", "options": ["Routine CT before every LP", "Use blood culture as a complete substitute for CSF", "Delay LP until CRP falls", "Prompt LP with paired blood glucose, provided no other contraindication exists"], "answer": 3, "explanation": "CSF assessment is central when clinically safe and should not be delayed for routine imaging. Why not the others: A. Routine CT before every LP — Routine CT is not necessary in all uncomplicated presentations.; B. Use blood culture as a complete substitute for CSF — Blood culture helps but does not replace safe CSF evaluation.; C. Delay LP until CRP falls — Inflammatory marker trends do not determine LP timing.", "pearl": "", "srcAnswer": "D"}, {"num": 14, "level": "", "question": "A child with presumed pneumococcal meningitis is started on dexamethasone. Which timing principle is most defensible?", "options": ["Start dexamethasone after several days of antibiotics", "Give adjunctive steroid with or immediately before the first antibiotic dose when indicated", "Use steroid instead of antibiotics if CSF is neutrophilic", "Reserve steroid for a normal CSF profile"], "answer": 1, "explanation": "Potential benefit depends on early suppression of inflammatory response; local protocol matters. Why not the others: A. Start dexamethasone after several days of antibiotics — Delayed introduction does not follow the usual evidence-based timing.; C. Use steroid instead of antibiotics if CSF is neutrophilic — Steroids are adjuncts, not antimicrobial substitutes.; D. Reserve steroid for a normal CSF profile — A normal CSF profile does not create the indication.", "pearl": "", "srcAnswer": "B"}, {"num": 15, "level": "", "question": "A child with meningococcal sepsis develops non-blanching purpura and rapidly worsening shock. Which systemic complication is particularly concerning?", "options": ["Chronic congenital platelet dysfunction", "Henoch–Schönlein purpura with normal perfusion", "Isolated immune thrombocytopenia without sepsis", "Disseminated intravascular coagulation with purpura fulminans"], "answer": 3, "explanation": "Severe meningococcaemia can cause consumptive coagulopathy and skin necrosis. Why not the others: A. Chronic congenital platelet dysfunction — An inherited disorder does not explain sudden febrile shock.; B. Henoch–Schönlein purpura with normal perfusion — IgA vasculitis generally lacks this rapid septic-shock trajectory.; C. Isolated immune thrombocytopenia without sepsis — The fulminant shock picture suggests invasive infection and coagulopathy.", "pearl": "", "srcAnswer": "D"}, {"num": 16, "level": "", "question": "An adolescent develops fever, altered behaviour, focal seizures and temporal-lobe MRI hyperintensity. What empiric therapy is time-critical?", "options": ["Intravenous acyclovir for suspected HSV encephalitis", "Intravenous immunoglobulin alone for viral encephalitis", "High-dose steroids alone for presumed ADEM", "Oral oseltamivir as sole encephalitis therapy"], "answer": 0, "explanation": "HSV encephalitis is treatable and therapy should start before confirmatory PCR. Why not the others: B. Intravenous immunoglobulin alone for viral encephalitis — IVIG is not the primary specific treatment for suspected HSV.; C. High-dose steroids alone for presumed ADEM — Infection must be addressed before immunosuppression is relied upon.; D. Oral oseltamivir as sole encephalitis therapy — Oseltamivir does not treat HSV encephalitis.", "pearl": "", "srcAnswer": "A"}, {"num": 17, "level": "", "question": "HSV encephalitis is strongly suspected, but CSF HSV PCR is negative on the first day of symptoms. What is the best next step?", "options": ["Continue acyclovir and repeat CSF HSV PCR if suspicion remains high", "Stop acyclovir immediately because PCR is perfectly sensitive at onset", "Treat as functional neurologic disorder because PCR is negative", "Switch to anti-tubercular therapy based only on negative HSV PCR"], "answer": 0, "explanation": "Early sampling can be falsely negative; treatment should not stop solely on an early negative result. Why not the others: B. Stop acyclovir immediately because PCR is perfectly sensitive at onset — An early negative PCR does not fully exclude HSV encephalitis.; C. Treat as functional neurologic disorder because PCR is negative — Clinical and MRI features demand continued organic evaluation.; D. Switch to anti-tubercular therapy based only on negative HSV PCR — The result does not establish TB meningitis.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day26',label:'Day 26',set:'Quiz 1',href:'Day26/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day26_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 26 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 26 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 26'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 26');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day26:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
