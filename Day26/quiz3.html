<script>
const quiz=[{"num": 35, "level": "", "question": "A child with TB meningitis develops sudden hemiparesis. Which vascular mechanism is most plausible?", "options": ["Inflammatory vasculopathy causing basal ganglia or internal-capsule infarction", "Retinal artery spasm as the primary explanation", "Pure spinal root demyelination", "Isolated peripheral nerve entrapment"], "answer": 0, "explanation": "Basal exudates can affect perforating vessels and produce ischemic strokes. Why not the others: B. Retinal artery spasm as the primary explanation — Retinal ischemia does not explain a unilateral limb motor deficit.; C. Pure spinal root demyelination — Root demyelination does not explain a cerebral hemiparesis.; D. Isolated peripheral nerve entrapment — Peripheral entrapment would not produce an acute central hemiparesis.", "pearl": "", "srcAnswer": "A"}, {"num": 36, "level": "", "question": "Which complication of TB meningitis most directly results from obstruction of CSF pathways by basal exudates?", "options": ["Isolated sensorineural deafness from ototoxic medication", "Pulmonary air leak", "Cerebral venous sinus thrombosis", "Hydrocephalus"], "answer": 3, "explanation": "Basal inflammation can impair CSF flow and resorption. Why not the others: A. Isolated sensorineural deafness from ototoxic medication — Drug toxicity is a separate mechanism.; B. Pulmonary air leak — Air leak is unrelated to CSF pathway obstruction.; C. Cerebral venous sinus thrombosis — Venous thrombosis is a separate vascular process, not obstruction of CSF flow by basal exudates.", "pearl": "", "srcAnswer": "D"}, {"num": 37, "level": "", "question": "WHO 2022 guidance offers a shorter intensive TB meningitis regimen for selected children. Which statement is accurate?", "options": ["Every child with TBM must receive exactly 2 months of treatment", "All paediatric TBM requires 24 months of antibiotics", "A 6-month intensive regimen may be an alternative to a 12-month regimen in eligible drug-susceptible paediatric TBM", "The shorter WHO option is automatically appropriate for HIV-associated TBM"], "answer": 2, "explanation": "WHO provides a conditional 6HRZEto alternative in selected children, with exclusions and local policy caveats. Why not the others: A. Every child with TBM must receive exactly 2 months of treatment — Two months is inadequate for TBM.; B. All paediatric TBM requires 24 months of antibiotics — Routine treatment is not uniformly two years.; D. The shorter WHO option is automatically appropriate for HIV-associated TBM — WHO advises against applying this shorter option to children living with HIV due to insufficient data.", "pearl": "Indian NTEP programme regimen must be checked separately; do not silently substitute WHO.", "srcAnswer": "C"}, {"num": 38, "level": "", "question": "What is the recommended general role of adjunctive corticosteroids in tuberculous meningitis?", "options": ["Use steroids instead of anti-tubercular drugs", "Never use steroids because they worsen every case", "Use adjunctive dexamethasone or prednisolone with taper as recommended", "Reserve steroids only for a negative MRI"], "answer": 2, "explanation": "WHO recommends initial adjunctive steroids tapered over roughly 6–8 weeks for TBM. Why not the others: A. Use steroids instead of anti-tubercular drugs — Immunomodulation does not eradicate MTB.; B. Never use steroids because they worsen every case — Steroids have an evidence-supported role in TBM.; D. Reserve steroids only for a negative MRI — MRI negativity is not the treatment criterion.", "pearl": "", "srcAnswer": "C"}, {"num": 39, "level": "", "question": "A child on TBM therapy develops worsening intracranial lesions despite documented drug susceptibility and adherence. Which phenomenon must be considered alongside failure?", "options": ["Paradoxical inflammatory response", "Obligatory primary CNS malignancy", "Definitive cure because lesions enlarge", "Immediate proof of multidrug resistance"], "answer": 0, "explanation": "Paradoxical enlargement or new tuberculomas can occur during effective TB therapy. Why not the others: B. Obligatory primary CNS malignancy — Tumour is a differential but worsening does not prove malignancy.; C. Definitive cure because lesions enlarge — Lesion progression is not evidence of cure.; D. Immediate proof of multidrug resistance — Resistance requires microbiologic and clinical evaluation.", "pearl": "", "srcAnswer": "A"}, {"num": 40, "level": "", "question": "A child with TBM and hyponatraemia has high urine sodium and clinical hypovolaemia. Which mechanism is particularly important to distinguish from SIADH?", "options": ["Cerebral salt wasting", "Pseudohyponatraemia from hyperlipidaemia", "Diabetes insipidus", "Primary hyperaldosteronism"], "answer": 0, "explanation": "Renal salt loss with hypovolaemia requires different fluid management from euvolaemic SIADH. Why not the others: B. Pseudohyponatraemia from hyperlipidaemia — This does not explain hypovolaemia with urinary sodium loss.; C. Diabetes insipidus — DI usually causes hypernatraemia with dilute polyuria.; D. Primary hyperaldosteronism — Hyperaldosteronism usually retains sodium and promotes potassium loss.", "pearl": "", "srcAnswer": "A"}, {"num": 41, "level": "", "question": "An adolescent has chronic headache, raised opening pressure, lymphocytic CSF and cryptococcal antigen positivity. Which issue requires active management beyond antifungal therapy?", "options": ["Immediate routine high-dose corticosteroids in all patients", "Treating opening pressure as irrelevant to prognosis", "Raised intracranial pressure with repeated therapeutic CSF drainage when indicated", "Stopping antifungals when CSF glucose normalizes"], "answer": 2, "explanation": "Cryptococcal meningitis can require directed pressure management in addition to antifungals. Why not the others: A. Immediate routine high-dose corticosteroids in all patients — Routine steroids are not generally indicated for cryptococcal meningitis.; B. Treating opening pressure as irrelevant to prognosis — Raised pressure contributes to morbidity and must be assessed.; D. Stopping antifungals when CSF glucose normalizes — Glucose normalization is not a stopping rule.", "pearl": "", "srcAnswer": "C"}, {"num": 42, "level": "", "question": "A child has prolonged fever, meningism and MRI basal enhancement; CSF protein is high but TB microbiology is negative. Which decision is most defensible?", "options": ["Exclude TBM solely because one CSF PCR is negative", "Classify all basal enhancement as autoimmune disease", "Integrate clinical, CSF, imaging and epidemiology; do not rule out TBM on one negative test", "Use a positive Mantoux as the only required confirmation"], "answer": 2, "explanation": "Paucibacillary TBM requires composite assessment and sometimes empiric treatment. Why not the others: A. Exclude TBM solely because one CSF PCR is negative — Negative molecular testing does not have perfect sensitivity.; B. Classify all basal enhancement as autoimmune disease — Basal enhancement has infectious and noninfectious causes.; D. Use a positive Mantoux as the only required confirmation — Skin testing does not establish active CNS infection.", "pearl": "", "srcAnswer": "C"}, {"num": 43, "level": "", "question": "A child with chronic meningitis has new sixth nerve palsy. Which pathophysiological explanation fits the setting?", "options": ["Raised intracranial pressure or basal meningeal inflammation", "Postviral isolated facial neuritis", "Benign decompensated phoria unrelated to intracranial disease", "Pure neuromuscular-junction transmission failure"], "answer": 0, "explanation": "CN VI is vulnerable to stretch from raised ICP and can be involved in basal meningitis. Why not the others: B. Postviral isolated facial neuritis — Facial neuritis affects CN VII rather than causing a new abducens palsy in basal meningitis.; C. Benign decompensated phoria unrelated to intracranial disease — An acute new CN VI palsy during meningitis should not be dismissed as benign phoria.; D. Pure neuromuscular-junction transmission failure — NMJ disease does not explain meningeal inflammation.", "pearl": "", "srcAnswer": "A"}, {"num": 44, "level": "", "question": "A child with suspected TBM has severe hydrocephalus and declining consciousness. Which parallel management is essential?", "options": ["Use only acetazolamide as definitive treatment", "Wait for CSF culture positivity before treating hydrocephalus", "Repeat LP every hour without specialist assessment", "Urgent neurosurgical assessment while anti-TB treatment and supportive care continue"], "answer": 3, "explanation": "Threatening hydrocephalus may require CSF diversion alongside infection treatment. Why not the others: A. Use only acetazolamide as definitive treatment — Medical ICP measures alone may be insufficient for obstructive hydrocephalus.; B. Wait for CSF culture positivity before treating hydrocephalus — Progressive raised ICP is an emergency regardless of culture turnaround.; C. Repeat LP every hour without specialist assessment — Repeated LP is not a safe universal alternative to neurosurgical management.", "pearl": "", "srcAnswer": "D"}, {"num": 45, "level": "", "question": "A child with subacute meningitis has ring-enhancing intracranial lesions and exposure to pulmonary TB. Which lesion mechanism is plausible?", "options": ["Pure congenital cortical dysplasia", "Calcified neurocysticercosis without active inflammation", "Only viral cytopathic temporal encephalitis", "Intracranial tuberculomas"], "answer": 3, "explanation": "TB can form granulomatous mass lesions with ring or nodular enhancement. Why not the others: A. Pure congenital cortical dysplasia — Cortical dysplasia is developmental and not caused by TB exposure.; B. Calcified neurocysticercosis without active inflammation — Calcified lesions are not the typical active ring-enhancing granulomas linked to this TB presentation.; C. Only viral cytopathic temporal encephalitis — Viral encephalitis does not uniquely explain granulomatous ring lesions.", "pearl": "", "srcAnswer": "D"}, {"num": 46, "level": "", "question": "A 7-year-old develops encephalopathy, ataxia and multifocal weakness two weeks after a respiratory illness. MRI shows large poorly demarcated bilateral white-matter lesions. Which syndrome is most likely?", "options": ["Typical paediatric clinically isolated syndrome without encephalopathy", "Acute disseminated encephalomyelitis", "Isolated peripheral neuropathy", "Pure focal epilepsy without encephalopathy"], "answer": 1, "explanation": "First polyfocal inflammatory CNS event with unexplained encephalopathy and characteristic MRI supports ADEM. Why not the others: A. Typical paediatric clinically isolated syndrome without encephalopathy — CIS does not have unexplained encephalopathy as a defining feature.; C. Isolated peripheral neuropathy — Peripheral nerve disease does not produce multifocal brain white-matter lesions.; D. Pure focal epilepsy without encephalopathy — Epilepsy alone does not explain widespread demyelinating lesions.", "pearl": "", "srcAnswer": "B"}, {"num": 47, "level": "", "question": "Which feature is required for the 2013 IPMSSG paediatric ADEM syndrome definition?", "options": ["Encephalopathy not explained by fever, systemic illness or postictal state", "A prior nonencephalopathic demyelinating relapse", "A positive serum MOG-IgG in every case", "A CSF oligoclonal-band pattern identical to MS"], "answer": 0, "explanation": "Unexplained encephalopathy is central to ADEM classification. Why not the others: B. A prior nonencephalopathic demyelinating relapse — A first polyfocal event is part of ADEM definition.; C. A positive serum MOG-IgG in every case — MOG antibodies occur in a subset and are not mandatory.; D. A CSF oligoclonal-band pattern identical to MS — CSF OCBs are not required and are often absent in ADEM.", "pearl": "", "srcAnswer": "A"}, {"num": 48, "level": "", "question": "Which MRI pattern is more typical of ADEM than classical paediatric MS?", "options": ["Persistent T1 black holes as a required feature", "Large, bilateral, poorly marginated T2 lesions with possible deep-grey involvement", "Multiple sharply marginated periventricular Dawson-finger lesions", "Normal MRI throughout the acute three-month phase"], "answer": 1, "explanation": "ADEM commonly has extensive ill-defined lesions; thalamic or basal ganglia involvement may occur. Why not the others: A. Persistent T1 black holes as a required feature — Persistent T1 hypointensity is relatively uncommon in monophasic ADEM.; C. Multiple sharply marginated periventricular Dawson-finger lesions — Periventricular ovoid lesions more strongly suggest MS.; D. Normal MRI throughout the acute three-month phase — An abnormal brain MRI during the acute phase is part of IPMSSG ADEM criteria.", "pearl": "", "srcAnswer": "B"}, {"num": 49, "level": "", "question": "A child is diagnosed provisionally with ADEM at presentation. Why is follow-up beyond three months important?", "options": ["To ensure all MRI lesions must vanish by day 90", "To establish whether new clinical or MRI events emerge, changing the diagnosis", "To prove ADEM solely by normalization of CSF glucose", "To require persistent encephalopathy for the diagnosis"], "answer": 1, "explanation": "Monophasic ADEM requires no new findings after three months; relapse can suggest another demyelinating disorder. Why not the others: A. To ensure all MRI lesions must vanish by day 90 — Complete radiologic resolution at exactly three months is not required.; C. To prove ADEM solely by normalization of CSF glucose — CSF glucose is not the defining follow-up criterion.; D. To require persistent encephalopathy for the diagnosis — Persistent encephalopathy is not a necessary follow-up goal.", "pearl": "", "srcAnswer": "B"}, {"num": 50, "level": "", "question": "A child with suspected ADEM has fever and meningism. Which priority must precede assuming an autoimmune process?", "options": ["Exclude and treat potentially serious CNS infection", "Avoid lumbar puncture in every ADEM case", "Give high-dose steroids without any infection assessment", "Declare bacterial meningitis impossible if MRI shows white-matter lesions"], "answer": 0, "explanation": "ADEM is a diagnosis of exclusion; infectious mimics can be life-threatening. Why not the others: B. Avoid lumbar puncture in every ADEM case — LP may be useful when safe to assess infectious or inflammatory alternatives.; C. Give high-dose steroids without any infection assessment — Unrecognized infection may worsen with immunosuppression.; D. Declare bacterial meningitis impossible if MRI shows white-matter lesions — Infection and demyelination can overlap clinically and radiologically.", "pearl": "", "srcAnswer": "A"}, {"num": 51, "level": "", "question": "A child with severe ADEM remains substantially impaired despite an adequate first-line corticosteroid course. Which rescue option is commonly considered by specialists?", "options": ["Immediate withdrawal of all supportive care", "Intravenous immunoglobulin or plasma exchange after reassessment", "Long-term anticoagulation without thrombosis evidence", "Routine oral antibiotics as the only rescue therapy"], "answer": 1, "explanation": "IVIG or plasma exchange may be used for severe steroid-refractory inflammatory demyelination. Why not the others: A. Immediate withdrawal of all supportive care — Supportive neurologic and rehabilitation care remain essential.; C. Long-term anticoagulation without thrombosis evidence — Anticoagulation is not standard rescue therapy for ADEM.; D. Routine oral antibiotics as the only rescue therapy — Antibiotics do not treat established noninfectious demyelination.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day26',label:'Day 26',set:'Quiz 3',href:'Day26/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day26_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 26 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 26 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 26'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 26');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day26:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
