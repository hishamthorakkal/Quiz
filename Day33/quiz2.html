<script>
const quiz=[{"num": 18, "level": "Conceptual", "question": "Which is the correct recommendation for a prepared ORS solution stored in a clean covered container at home?", "options": ["Boil the mixed solution repeatedly for reuse", "Keep it for 72 hours if it smells normal", "Add fresh powder each day to the same liquid", "Discard the remaining solution after 24 hours"], "answer": 3, "explanation": "NHM F-IMNCI advises fresh preparation daily and discarding after 24 h. Why not the others: A. Boil the mixed solution repeatedly for reuse — Repeated boiling changes volume/concentration and is not the recommended practice.; B. Keep it for 72 hours if it smells normal — Appearance does not guarantee microbiological safety.; C. Add fresh powder each day to the same liquid — Adding powder produces an incorrect concentration.", "pearl": "", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "A breastfed 5-month-old has mild watery diarrhoea without dehydration. What feeding advice is appropriate?", "options": ["Start a low-protein fasting regimen", "Replace breast milk with fruit juice", "Stop breastfeeding until stools normalize", "Continue breastfeeding frequently"], "answer": 3, "explanation": "Continue breastfeeding throughout diarrhoea. Why not the others: A. Start a low-protein fasting regimen — Fasting worsens nutritional recovery.; B. Replace breast milk with fruit juice — Juice is not nutritionally or osmotically equivalent.; C. Stop breastfeeding until stools normalize — Stopping feeds risks dehydration and malnutrition.", "pearl": "", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "After initial rehydration, a toddler with gastroenteritis wants regular food. Which advice is most appropriate?", "options": ["Avoid all solids for three days", "Use only clear sugary liquids for 48 hours", "Dilute every usual feed to half strength for a week", "Resume age-appropriate feeding while continuing ORS for losses"], "answer": 3, "explanation": "Early normal feeding prevents nutritional deterioration. Why not the others: A. Avoid all solids for three days — Prolonged fasting is unnecessary.; B. Use only clear sugary liquids for 48 hours — Sugary drinks can worsen osmotic stool losses.; C. Dilute every usual feed to half strength for a week — Routine prolonged dilution of feeds is not recommended.", "pearl": "", "srcAnswer": "D"}, {"num": 21, "level": "Clinical", "question": "Under India NHM 2025 STOP Diarrhoea guidance, what zinc regimen applies to a 4-month-old with acute diarrhoea?", "options": ["5 mg IV daily for 7 days", "10 mg orally once daily for 14 days", "20 mg orally once daily for 14 days", "No zinc at any age under 6 months"], "answer": 1, "explanation": "India NHM specifies 10 mg/day for age 2 to <6 months. Why not the others: A. 5 mg IV daily for 7 days — Zinc is oral, not routine IV therapy.; C. 20 mg orally once daily for 14 days — 20 mg/day is the ≥6-month Indian regimen.; D. No zinc at any age under 6 months — NHM does recommend zinc from 2 months.", "pearl": "", "srcAnswer": "A"}, {"num": 22, "level": "Clinical", "question": "Under India NHM 2025 guidance, what zinc regimen applies to a 20-month-old with diarrhoea?", "options": ["10 mg orally daily for 14 days", "5 mg orally daily for 3 days", "20 mg orally daily for 14 days", "20 mg IV once daily for 5 days"], "answer": 2, "explanation": "NHM specifies 20 mg daily for 6 months–5 years for 14 days. Why not the others: A. 10 mg orally daily for 14 days — 10 mg is for age 2–<6 months in the NHM scheme.; B. 5 mg orally daily for 3 days — 5 mg for 3 days is not the Indian protocol.; D. 20 mg IV once daily for 5 days — IV zinc is not the NHM regimen.", "pearl": "", "srcAnswer": "B"}, {"num": 23, "level": "Clinical", "question": "A question explicitly cites the WHO 2024/2025 global diarrhoea guideline for children up to 10 years. Which zinc dose is conditionally suggested?", "options": ["20 mg orally daily for 14 days", "No zinc at all for persistent diarrhoea", "5 mg orally daily for up to 14 days", "10 mg orally daily for 14 days"], "answer": 2, "explanation": "WHO 2024 update conditionally suggests 5 mg/day up to 14 days (low certainty). Why not the others: A. 20 mg orally daily for 14 days — 20 mg is older WHO/Indian programme guidance.; B. No zinc at all for persistent diarrhoea — WHO recommends adjunctive zinc for persistent diarrhoea.; D. 10 mg orally daily for 14 days — 10 mg is the older infant dose, not the new global suggestion.", "pearl": "", "srcAnswer": "C"}, {"num": 24, "level": "Clinical", "question": "Which statement accurately reconciles zinc recommendations in an Indian 2026 examination?", "options": ["India NHM discontinued zinc after WHO 2024", "State the guideline and date: NHM 10/20 mg versus WHO 2024 conditional 5 mg", "WHO 2024 recommends 20 mg for all children aged 0–10 years", "All guidelines now mandate 5 mg without exceptions"], "answer": 1, "explanation": "Explicit guideline provenance prevents conflicting answer keys. Why not the others: A. India NHM discontinued zinc after WHO 2024 — NHM continues distributing and recommending zinc.; C. WHO 2024 recommends 20 mg for all children aged 0–10 years — WHO 2024 does not use universal 20 mg.; D. All guidelines now mandate 5 mg without exceptions — The new WHO dose is conditional and India retains its programme schedule.", "pearl": "", "srcAnswer": "D"}, {"num": 25, "level": "Clinical", "question": "Which WHO 2024/2025 recommendation about probiotics in acute watery diarrhoea is most accurate?", "options": ["WHO mandates every probiotic strain with ORS", "WHO suggests against routine probiotic use", "WHO recommends replacing ORS with probiotics", "WHO recommends probiotic use only if zinc is omitted"], "answer": 1, "explanation": "The updated WHO guideline suggests against probiotics for acute watery diarrhoea. Why not the others: A. WHO mandates every probiotic strain with ORS — There is no universal strain mandate.; C. WHO recommends replacing ORS with probiotics — Probiotics cannot replace rehydration.; D. WHO recommends probiotic use only if zinc is omitted — The recommendation is not conditional on omitting zinc.", "pearl": "", "srcAnswer": "A"}, {"num": 26, "level": "Clinical", "question": "Which interpretation of the 2023 ESPGHAN probiotic position paper is accurate when compared with WHO 2024?", "options": ["ESPGHAN allows selected strains as weak optional adjuncts; WHO suggests against routine probiotics", "ESPGHAN replaces oral rehydration with Lactobacillus", "ESPGHAN mandates all commercial probiotic products", "Both organizations give a strong recommendation for every strain"], "answer": 0, "explanation": "ESPGHAN gives strain-specific weak options, unlike the WHO 2024 suggestion against routine use. Why not the others: B. ESPGHAN replaces oral rehydration with Lactobacillus — ORS remains first-line in both frameworks.; C. ESPGHAN mandates all commercial probiotic products — Efficacy is strain-specific and evidence is limited.; D. Both organizations give a strong recommendation for every strain — Neither gives strong support to every formulation.", "pearl": "", "srcAnswer": "B"}, {"num": 27, "level": "Clinical", "question": "A 2-year-old has uncomplicated nonbloody watery diarrhoea and mild dehydration. Which antibiotic strategy is appropriate?", "options": ["Start azithromycin for any stool frequency above five", "Use metronidazole as first-line treatment for all viral gastroenteritis", "No routine antibiotic; prioritize rehydration and reassessment", "Start ceftriaxone for all diarrhoeal episodes"], "answer": 2, "explanation": "Most acute watery cases do not require antibiotics. Why not the others: A. Start azithromycin for any stool frequency above five — Frequency alone is not an indication for azithromycin.; B. Use metronidazole as first-line treatment for all viral gastroenteritis — Metronidazole does not treat viral gastroenteritis.; D. Start ceftriaxone for all diarrhoeal episodes — Ceftriaxone is not routine for uncomplicated watery diarrhoea.", "pearl": "", "srcAnswer": "C"}, {"num": 28, "level": "Clinical", "question": "A child has bloody diarrhoea after eating undercooked beef and is afebrile, with severe cramping. STEC is suspected. Which approach is safest while testing proceeds?", "options": ["Give corticosteroids to suppress toxin injury", "Give ciprofloxacin routinely to prevent HUS", "Supportive rehydration and avoid empiric antibiotics until STEC is assessed", "Give loperamide to reduce stool losses"], "answer": 2, "explanation": "STEC suspicion warrants careful hydration and avoidance of antibiotics because HUS risk may increase. Why not the others: A. Give corticosteroids to suppress toxin injury — Steroids are not standard STEC therapy.; B. Give ciprofloxacin routinely to prevent HUS — Antibiotics may increase HUS risk in STEC.; D. Give loperamide to reduce stool losses — Antimotility agents can increase complications in STEC.", "pearl": "", "srcAnswer": "D"}, {"num": 29, "level": "Clinical", "question": "After a week of bloody diarrhoea, a 4-year-old develops pallor, bruising and oliguria. Which complication should be urgently evaluated?", "options": ["Uncomplicated rotavirus infection", "Shiga toxin-associated hemolytic uremic syndrome", "Isolated iron deficiency without renal injury", "Transient physiological oliguria from age"], "answer": 1, "explanation": "Hemolysis, thrombocytopenia and AKI after diarrhoea suggest HUS. Why not the others: A. Uncomplicated rotavirus infection — Rotavirus does not characteristically cause this triad.; C. Isolated iron deficiency without renal injury — Iron deficiency does not explain acute oliguria and thrombocytopenia.; D. Transient physiological oliguria from age — Oliguria with bruising is not physiological.", "pearl": "", "srcAnswer": "A"}, {"num": 30, "level": "Clinical", "question": "During a cholera outbreak, a child presents with profuse rice-water stools and circulatory collapse. Which first priority is correct?", "options": ["Immediate aggressive rehydration with isotonic fluid and reassessment", "Use antidiarrhoeal medication before IV access", "Delay fluids until stool culture confirms cholera", "Provide oral zinc as the only immediate intervention"], "answer": 0, "explanation": "Restoring circulation is the lifesaving priority. Why not the others: B. Use antidiarrhoeal medication before IV access — Antimotility drugs do not reverse shock.; C. Delay fluids until stool culture confirms cholera — Do not wait for culture to treat severe dehydration.; D. Provide oral zinc as the only immediate intervention — Zinc is adjunctive, not resuscitation.", "pearl": "", "srcAnswer": "B"}, {"num": 31, "level": "Clinical", "question": "Which scenario is a reasonable exception to the rule against routine antibiotics in watery diarrhoea?", "options": ["Mild rotavirus diarrhoea with preserved oral intake", "Severe suspected cholera with major fluid losses after rehydration is initiated", "A well child with two loose stools and no fever", "Brief postprandial loose stool after a sweet beverage"], "answer": 1, "explanation": "Antibiotics may be used in severe cholera as adjuncts to rehydration. Why not the others: A. Mild rotavirus diarrhoea with preserved oral intake — Rotavirus is viral and usually supportive.; C. A well child with two loose stools and no fever — Two stools without systemic illness do not justify antibiotics.; D. Brief postprandial loose stool after a sweet beverage — An isolated dietary stool change does not justify antibiotics.", "pearl": "", "srcAnswer": "C"}, {"num": 32, "level": "Clinical", "question": "A 3-year-old has bloody diarrhoea with fever and tenesmus; a local Shigella outbreak is documented. What is the best framework?", "options": ["Delay all fluid replacement until stool culture is final", "Prescribe loperamide as definitive therapy", "Treat as STEC without considering fever or outbreak context", "Assess dehydration and use locally recommended anti-Shigella therapy when indicated"], "answer": 3, "explanation": "Dysentery needs fluid assessment and pathogen/context-guided antibiotic decisions. Why not the others: A. Delay all fluid replacement until stool culture is final — Rehydration cannot wait for culture.; B. Prescribe loperamide as definitive therapy — Antimotility drugs are unsafe in inflammatory bloody diarrhoea.; C. Treat as STEC without considering fever or outbreak context — STEC remains a differential but outbreak features warrant Shigella assessment.", "pearl": "", "srcAnswer": "D"}, {"num": 33, "level": "Clinical", "question": "A child has diarrhoea for 17 days and is now dehydrated. Under IMCI, which additional concern changes disposition?", "options": ["Acute uncomplicated diarrhoea suitable for home care only", "A normal illness duration without any red flags", "Functional toddler diarrhoea by duration alone", "Severe persistent diarrhoea requiring facility assessment"], "answer": 3, "explanation": "Persistent diarrhoea with dehydration requires hospital assessment. Why not the others: A. Acute uncomplicated diarrhoea suitable for home care only — The ≥14-day duration and dehydration preclude uncomplicated acute classification.; B. A normal illness duration without any red flags — Dehydration is a significant danger sign.; C. Functional toddler diarrhoea by duration alone — Functional diarrhoea is not diagnosed in a dehydrated child.", "pearl": "", "srcAnswer": "A"}, {"num": 34, "level": "Clinical", "question": "A toddler has watery diarrhoea for 18 days, weight loss and reduced intake. Which initial clinical priority is most important?", "options": ["Assess hydration, nutrition, feeding history and growth trend", "Prescribe antimotility therapy as the sole intervention", "Begin a lifelong gluten-free diet without evaluation", "Defer nutritional assessment until the stools stop"], "answer": 0, "explanation": "Persistent diarrhoea requires nutritional and hydration assessment before cause-specific workup. Why not the others: B. Prescribe antimotility therapy as the sole intervention — Antimotility monotherapy is inappropriate.; C. Begin a lifelong gluten-free diet without evaluation — Specific exclusion diets need an indication.; D. Defer nutritional assessment until the stools stop — Malnutrition can worsen prolonged diarrhoea.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day33',label:'Day 33',set:'Quiz 2',href:'Day33/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day33_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 33 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 33 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 33'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 33');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day33:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
