<script>
const quiz=[{"num": 35, "level": "Clinical", "question": "Which stool feature most strongly favors inflammatory diarrhoea rather than noninflammatory osmotic diarrhoea?", "options": ["Symptoms after excess fruit juice", "Loose stools without pain or systemic signs", "Visible blood with fever and tenesmus", "Stools decreasing during fasting"], "answer": 2, "explanation": "Blood, fever and tenesmus suggest mucosal invasion/inflammation. Why not the others: A. Symptoms after excess fruit juice — Fruit juice can cause osmotic stool losses.; B. Loose stools without pain or systemic signs — Absence of systemic signs is less inflammatory.; D. Stools decreasing during fasting — Improvement with fasting favors osmotic physiology.", "pearl": "", "srcAnswer": "C"}, {"num": 36, "level": "Clinical", "question": "A child has profuse watery stools even while fasting. Which mechanism best explains persistence?", "options": ["Excess dietary sorbitol alone", "Only unabsorbed dietary lactose", "Exclusive fructose malabsorption", "Active intestinal electrolyte secretion"], "answer": 3, "explanation": "Secretory diarrhoea continues despite fasting. Why not the others: A. Excess dietary sorbitol alone — Sorbitol-associated osmotic losses decrease when removed.; B. Only unabsorbed dietary lactose — Osmotic lactose diarrhoea typically improves with fasting.; C. Exclusive fructose malabsorption — Fructose-related osmotic losses decrease without intake.", "pearl": "", "srcAnswer": "D"}, {"num": 37, "level": "Clinical", "question": "A toddler has watery stools after apple juice; stools stop overnight and after juice restriction. Which physiology is most likely?", "options": ["Osmotic diarrhoea from poorly absorbed carbohydrates", "Invasive colitis causing tenesmus", "Toxin-mediated cholera with severe dehydration", "Persistent chloride secretion independent of intake"], "answer": 0, "explanation": "Fasting response and juice trigger favor carbohydrate osmotic diarrhoea. Why not the others: B. Invasive colitis causing tenesmus — Colitis generally adds blood, pain or fever.; C. Toxin-mediated cholera with severe dehydration — Cholera typically causes profuse fasting-independent losses.; D. Persistent chloride secretion independent of intake — Secretory loss persists during fasting.", "pearl": "", "srcAnswer": "A"}, {"num": 38, "level": "Clinical", "question": "A stool electrolyte sample has Na 30 mmol/L and K 20 mmol/L. Assuming stool osmolality 290 mOsm/kg, what is the osmotic gap?", "options": ["50 mOsm/kg", "190 mOsm/kg", "100 mOsm/kg", "240 mOsm/kg"], "answer": 1, "explanation": "Gap = 290 − 2×(30+20) = 190, favoring an osmotic mechanism. Why not the others: A. 50 mOsm/kg — 50 is not the calculated gap.; C. 100 mOsm/kg — 100 results from a different electrolyte sum.; D. 240 mOsm/kg — 240 incorrectly omits most ionic osmoles.", "pearl": "", "srcAnswer": "B"}, {"num": 39, "level": "Clinical", "question": "Which stool osmotic gap pattern is more consistent with secretory diarrhoea?", "options": ["A low gap, often <50 mOsm/kg", "A gap that can only be measured in serum", "A gap around 190 mOsm/kg", "A very high gap from unmeasured carbohydrate"], "answer": 0, "explanation": "Secretory stool has abundant measured electrolytes and low gap. Why not the others: B. A gap that can only be measured in serum — The calculation uses stool Na and K.; C. A gap around 190 mOsm/kg — 190 is more compatible with osmotic loss.; D. A very high gap from unmeasured carbohydrate — Unmeasured carbohydrate raises the osmotic gap.", "pearl": "", "srcAnswer": "C"}, {"num": 40, "level": "Clinical", "question": "A child with diarrhoea has a metabolic acidosis and normal serum anion gap. Which mechanism is most typical?", "options": ["Lactic acid accumulation as the only cause", "Primary ketoacid overproduction", "Isolated respiratory alkalosis", "Gastrointestinal bicarbonate loss"], "answer": 3, "explanation": "Diarrhoeal bicarbonate loss causes hyperchloremic normal-gap acidosis. Why not the others: A. Lactic acid accumulation as the only cause — Lactate accumulation usually raises the gap.; B. Primary ketoacid overproduction — Ketoacids generally raise the anion gap.; C. Isolated respiratory alkalosis — Respiratory alkalosis is a separate disorder.", "pearl": "", "srcAnswer": "D"}, {"num": 41, "level": "Clinical", "question": "A severely dehydrated child has serum Na 159 mmol/L. Which principle is most important after initial circulation stabilization?", "options": ["Avoid checking sodium after treatment begins", "Normalize sodium immediately using unrestricted hypotonic boluses", "Correct the water deficit carefully with serial sodium and neurological monitoring", "Give diuretics to accelerate sodium reduction"], "answer": 2, "explanation": "Hypernatremia needs cautious correction after resuscitation to avoid cerebral edema. Why not the others: A. Avoid checking sodium after treatment begins — Serial electrolyte monitoring is essential.; B. Normalize sodium immediately using unrestricted hypotonic boluses — Rapid correction increases neurological risk.; D. Give diuretics to accelerate sodium reduction — Diuresis is not a routine correction strategy.", "pearl": "", "srcAnswer": "A"}, {"num": 42, "level": "Clinical", "question": "A child with severe diarrhoea is hypotensive, cold and has delayed capillary refill. What should precede detailed maintenance-fluid calculations?", "options": ["Immediate ABC assessment and isotonic shock resuscitation per protocol", "Defer treatment until precise pre-illness weight is available", "Give only oral juice while awaiting laboratory results", "Begin routine 24-hour maintenance fluids alone"], "answer": 0, "explanation": "Shock is an emergency and requires prompt circulation support. Why not the others: B. Defer treatment until precise pre-illness weight is available — Treatment must not wait for a baseline weight.; C. Give only oral juice while awaiting laboratory results — Juice is not resuscitation.; D. Begin routine 24-hour maintenance fluids alone — Maintenance fluids alone do not treat shock.", "pearl": "", "srcAnswer": "B"}, {"num": 43, "level": "Clinical", "question": "A child with mild dehydration has ongoing stool losses while receiving Plan B ORS. Which approach is correct?", "options": ["Replace continuing stool losses in addition to planned initial rehydration", "Use fruit juice for all additional losses", "Stop rehydration whenever another stool occurs", "Count all ongoing stools as already included in the initial 75 mL/kg"], "answer": 0, "explanation": "The initial deficit and ongoing losses are separate components. Why not the others: B. Use fruit juice for all additional losses — Juice is not a suitable replacement for ORS.; C. Stop rehydration whenever another stool occurs — Continued stools require replacement, not cessation.; D. Count all ongoing stools as already included in the initial 75 mL/kg — Plan B deficit volume does not automatically cover new stool losses.", "pearl": "", "srcAnswer": "C"}, {"num": 44, "level": "Clinical", "question": "During a Plan B trial, a child becomes increasingly lethargic and unable to drink. What is the correct response?", "options": ["Reassess immediately and escalate to severe dehydration management", "Continue the unchanged oral plan for four hours regardless", "Send home because Plan B was already started", "Add antimotility therapy and observe overnight"], "answer": 0, "explanation": "Clinical deterioration requires immediate reclassification and escalation. Why not the others: B. Continue the unchanged oral plan for four hours regardless — Four-hour reassessment is not a reason to ignore danger signs.; C. Send home because Plan B was already started — Discharge is unsafe with lethargy and poor intake.; D. Add antimotility therapy and observe overnight — Antimotility treatment does not treat severe dehydration.", "pearl": "", "srcAnswer": "D"}, {"num": 45, "level": "Clinical", "question": "A 2-year-old has recurrent diarrhoea and growth faltering but no current dehydration. Which finding most strongly argues for structured chronic-disease evaluation?", "options": ["One isolated soft stool after a high-fibre meal", "Brief stool increase during a viral outbreak", "Normal weight gain and normal examination", "Documented downward crossing of weight centiles"], "answer": 3, "explanation": "Growth faltering indicates nutritional impact and possible organic disease. Why not the others: A. One isolated soft stool after a high-fibre meal — A single soft stool is not a chronic syndrome.; B. Brief stool increase during a viral outbreak — An acute outbreak is not chronic by itself.; C. Normal weight gain and normal examination — Normal growth makes severe organic pathology less likely.", "pearl": "", "srcAnswer": "A"}, {"num": 46, "level": "Clinical", "question": "A child has diarrhoea with bilious vomiting and abdominal distension. Which immediate diagnostic stance is safest?", "options": ["Treat only with zinc and review after one week", "Prescribe loperamide to reduce intestinal transit", "Consider intestinal obstruction or volvulus and obtain urgent surgical assessment", "Assume routine viral gastroenteritis and discharge"], "answer": 2, "explanation": "Bilious emesis with distension is a surgical danger sign. Why not the others: A. Treat only with zinc and review after one week — Zinc cannot address obstruction.; B. Prescribe loperamide to reduce intestinal transit — Antimotility drugs can worsen obstruction.; D. Assume routine viral gastroenteritis and discharge — Viral gastroenteritis should not be assumed with bilious vomiting.", "pearl": "", "srcAnswer": "B"}, {"num": 47, "level": "Clinical", "question": "A 9-month-old has episodic severe crying, drawing up of legs, pallor and later lethargy. Which condition must be excluded promptly?", "options": ["Physiological infant dyschezia", "Intussusception", "Uncomplicated toddler diarrhoea", "Isolated lactose intolerance"], "answer": 1, "explanation": "Paroxysmal colicky episodes and lethargy are classic intussusception clues. Why not the others: A. Physiological infant dyschezia — Dyschezia affects stool passage in otherwise well infants.; C. Uncomplicated toddler diarrhoea — Routine diarrhoea does not explain episodic severe colic.; D. Isolated lactose intolerance — Lactose intolerance lacks characteristic episodic obstructive pain.", "pearl": "", "srcAnswer": "C"}, {"num": 48, "level": "High-difficulty", "question": "An infant has suspected intussusception but no peritonitis or shock. Which investigation is most appropriate first?", "options": ["Upper gastrointestinal endoscopy", "Noncontrast head CT", "Routine stool ova-and-parasite examination", "Abdominal ultrasonography"], "answer": 3, "explanation": "Ultrasound can identify the target/doughnut appearance. Why not the others: A. Upper gastrointestinal endoscopy — Endoscopy is not the first diagnostic test.; B. Noncontrast head CT — Head CT is unrelated to abdominal obstruction.; C. Routine stool ova-and-parasite examination — Stool testing does not evaluate bowel telescoping.", "pearl": "", "srcAnswer": "D"}, {"num": 49, "level": "High-difficulty", "question": "A 5-week-old has progressive nonbilious projectile vomiting, persistent hunger and weight loss. Which diagnosis is most likely?", "options": ["Hypertrophic pyloric stenosis", "Malrotation with midgut volvulus", "Shigella dysentery", "Acute rotavirus enteritis"], "answer": 0, "explanation": "Typical age, projectile nonbilious vomiting and hunger favor pyloric stenosis. Why not the others: B. Malrotation with midgut volvulus — Volvulus often causes bilious vomiting.; C. Shigella dysentery — Shigella causes inflammatory stools rather than isolated vomiting.; D. Acute rotavirus enteritis — Rotavirus generally causes watery diarrhoea with vomiting.", "pearl": "", "srcAnswer": "A"}, {"num": 50, "level": "High-difficulty", "question": "An infant with prolonged pyloric stenosis vomiting is most likely to have which acid-base pattern?", "options": ["Hypochloremic metabolic alkalosis", "Hyperchloremic metabolic acidosis", "Primary respiratory acidosis", "High-anion-gap ketoacidosis as the defining pattern"], "answer": 0, "explanation": "Loss of gastric HCl causes hypochloremic metabolic alkalosis. Why not the others: B. Hyperchloremic metabolic acidosis — Diarrhoeal bicarbonate loss causes normal-gap acidosis.; C. Primary respiratory acidosis — Respiratory acidosis is not the primary vomiting effect.; D. High-anion-gap ketoacidosis as the defining pattern — Ketoacidosis is not the classic pyloric pattern.", "pearl": "", "srcAnswer": "B"}, {"num": 51, "level": "High-difficulty", "question": "A neonate with bilious vomiting has a concerning upper GI contrast study for malrotation with volvulus. What is the priority?", "options": ["Routine discharge after one ORS sachet", "Empiric probiotic therapy without reassessment", "Emergency surgical evaluation and resuscitation", "A 14-day zinc course before imaging review"], "answer": 2, "explanation": "Midgut volvulus threatens intestinal ischemia and requires urgent surgery. Why not the others: A. Routine discharge after one ORS sachet — Discharge is unsafe with suspected ischemic obstruction.; B. Empiric probiotic therapy without reassessment — Probiotics do not address mechanical obstruction.; D. A 14-day zinc course before imaging review — Zinc does not treat volvulus.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day33',label:'Day 33',set:'Quiz 3',href:'Day33/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day33_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 33 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 33 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 33'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 33');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day33:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
