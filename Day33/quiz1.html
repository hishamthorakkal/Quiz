<script>
const quiz=[{"num": 1, "level": "Basic", "question": "A 20-month-old has five watery stools in 24 hours, with no blood or vomiting. Which definition is fulfilled?", "options": ["Persistent diarrhoea based on >3 days of symptoms", "Chronic diarrhoea based on the child’s age", "Dysentery based on frequency alone", "Diarrhoea based on ≥3 loose stools per 24 hours"], "answer": 3, "explanation": "Three or more loose stools in 24 h meets the syndromic definition. Why not the others: A. Persistent diarrhoea based on >3 days of symptoms — Persistence requires at least 14 days, not three days.; B. Chronic diarrhoea based on the child’s age — Chronicity cannot be inferred from age.; C. Dysentery based on frequency alone — Dysentery requires visible blood in stool.", "pearl": "", "srcAnswer": "A"}, {"num": 2, "level": "Basic", "question": "A child has watery stools for 16 consecutive days, with no blood. Under WHO syndrome classification, what is the correct label?", "options": ["Post-infectious constipation syndrome", "Acute bloody diarrhoea (dysentery)", "Acute watery diarrhoea (<14 days)", "Persistent diarrhoea (≥14 days)"], "answer": 3, "explanation": "Duration ≥14 days defines persistent diarrhoea. Why not the others: A. Post-infectious constipation syndrome — Constipation does not explain ongoing watery stools.; B. Acute bloody diarrhoea (dysentery) — Dysentery is defined by visible blood.; C. Acute watery diarrhoea (<14 days) — Acute watery diarrhoea is shorter than 14 days.", "pearl": "", "srcAnswer": "B"}, {"num": 3, "level": "Basic", "question": "A child develops fever, tenesmus and visibly bloody loose stools. Which syndrome is present?", "options": ["Persistent diarrhoea without visible blood", "Functional diarrhoea without inflammation", "Acute bloody diarrhoea (dysentery)", "Uncomplicated nonbloody watery diarrhoea"], "answer": 2, "explanation": "Visible blood in diarrhoeal stool defines dysentery. Why not the others: A. Persistent diarrhoea without visible blood — Persistence depends on duration, not tenesmus.; B. Functional diarrhoea without inflammation — Fever and blood argue against a functional label.; D. Uncomplicated nonbloody watery diarrhoea — Watery diarrhoea classification excludes blood.", "pearl": "", "srcAnswer": "C"}, {"num": 4, "level": "Basic", "question": "Which electrolyte concentration is present in standard WHO reduced-osmolarity ORS?", "options": ["Sodium 120 mmol/L", "Sodium 90 mmol/L", "Sodium 75 mmol/L", "Sodium 45 mmol/L"], "answer": 2, "explanation": "WHO reduced-osmolarity ORS contains 75 mmol/L sodium. Why not the others: A. Sodium 120 mmol/L — 120 mmol/L is not the standard WHO formula.; B. Sodium 90 mmol/L — 90 mmol/L characterizes older standard formulations.; D. Sodium 45 mmol/L — 45 mmol/L is below standard WHO ORS sodium.", "pearl": "", "srcAnswer": "D"}, {"num": 5, "level": "Basic", "question": "Which value represents the total osmolarity of standard WHO reduced-osmolarity ORS?", "options": ["311 mOsm/L", "350 mOsm/L", "245 mOsm/L", "180 mOsm/L"], "answer": 2, "explanation": "Reduced-osmolarity WHO ORS totals 245 mOsm/L. Why not the others: A. 311 mOsm/L — 311 mOsm/L is the older formula.; B. 350 mOsm/L — 350 mOsm/L is excessively concentrated for WHO ORS.; D. 180 mOsm/L — 180 mOsm/L is not the specified formula.", "pearl": "", "srcAnswer": "A"}, {"num": 6, "level": "Basic", "question": "Which transporter underlies glucose-facilitated sodium absorption during oral rehydration?", "options": ["ENaC in distal colonic epithelium", "SGLT1 on the intestinal brush border", "NKCC2 in the thick ascending limb", "CFTR on the apical membrane"], "answer": 1, "explanation": "SGLT1 cotransports sodium with glucose across enterocytes. Why not the others: A. ENaC in distal colonic epithelium — ENaC is not the main glucose-coupled ORS mechanism.; C. NKCC2 in the thick ascending limb — NKCC2 is a renal transporter.; D. CFTR on the apical membrane — CFTR secretes chloride; it is not glucose-sodium uptake.", "pearl": "", "srcAnswer": "B"}, {"num": 7, "level": "Basic", "question": "A child with acute watery diarrhoea has normal mental status, drinks normally, normal eyes and immediate skin-pinch recoil. Which approach is appropriate?", "options": ["Plan B 75 mL/kg over 4 hours regardless of signs", "Immediate antimicrobial therapy for all watery stools", "Plan A with home ORS, feeding and return precautions", "Plan C 100 mL/kg IV without reassessment"], "answer": 2, "explanation": "No dehydration signs supports Plan A. Why not the others: A. Plan B 75 mL/kg over 4 hours regardless of signs — Plan B is for some dehydration.; B. Immediate antimicrobial therapy for all watery stools — Routine antibiotics do not treat most watery diarrhoea.; D. Plan C 100 mL/kg IV without reassessment — Plan C is for severe dehydration.", "pearl": "", "srcAnswer": "C"}, {"num": 8, "level": "Conceptual", "question": "A 2-year-old with diarrhoea is restless, has sunken eyes, drinks eagerly and skin pinch returns slowly. Which IMCI category fits best?", "options": ["Septic shock by definition", "Some dehydration", "Severe dehydration", "No dehydration"], "answer": 1, "explanation": "Two or more relevant signs including thirst and slow pinch indicate some dehydration. Why not the others: A. Septic shock by definition — These signs alone do not establish shock.; C. Severe dehydration — Severe category requires severe signs such as lethargy, poor drinking or very slow pinch.; D. No dehydration — Multiple dehydration signs exclude no dehydration.", "pearl": "", "srcAnswer": "D"}, {"num": 9, "level": "Conceptual", "question": "A lethargic 10-month-old with diarrhoea drinks poorly and has a very slow skin pinch (>2 s). What is the priority category?", "options": ["Functional gastrointestinal disorder", "Severe dehydration requiring urgent facility treatment", "Some dehydration managed solely at home", "No dehydration because stool frequency is unknown"], "answer": 1, "explanation": "Lethargy, poor drinking and very slow pinch indicate severe dehydration. Why not the others: A. Functional gastrointestinal disorder — Acute systemic danger signs exclude a functional diagnosis.; C. Some dehydration managed solely at home — Some dehydration is too mild for these signs.; D. No dehydration because stool frequency is unknown — Stool count does not override severe signs.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "Conceptual", "question": "For a 10-kg child with some dehydration, what is the approximate initial WHO Plan B ORS volume?", "options": ["1500 mL over 4 hours", "1000 mL IV over 1 hour", "750 mL over 4 hours", "500 mL over 4 hours"], "answer": 2, "explanation": "Plan B uses 75 mL/kg × 10 kg = 750 mL over four hours. Why not the others: A. 1500 mL over 4 hours — 150 mL/kg doubles the recommended Plan B estimate.; B. 1000 mL IV over 1 hour — IV Plan C and rapid infusion are not indicated for some dehydration.; D. 500 mL over 4 hours — 50 mL/kg is below the Plan B calculation.", "pearl": "", "srcAnswer": "B"}, {"num": 11, "level": "Conceptual", "question": "A 7-month-old with severe dehydration and no shock receives WHO Plan C at a facility. Which initial IV volume is given first?", "options": ["20 mL/kg dextrose bolus, then no reassessment", "30 mL/kg, followed by 70 mL/kg", "75 mL/kg orally, without IV treatment", "70 mL/kg, followed by 30 mL/kg"], "answer": 1, "explanation": "WHO Plan C sequence is 30 then 70 mL/kg, with age-specific timing. Why not the others: A. 20 mL/kg dextrose bolus, then no reassessment — Dextrose bolus is not standard primary dehydration replacement.; C. 75 mL/kg orally, without IV treatment — Plan B oral regimen is inappropriate for severe dehydration.; D. 70 mL/kg, followed by 30 mL/kg — 70 then 30 reverses the sequence.", "pearl": "", "srcAnswer": "C"}, {"num": 12, "level": "Conceptual", "question": "In WHO Plan C, a 9-month-old without shock should receive the 30 mL/kg first phase over approximately:", "options": ["1 hour", "5 hours", "30 minutes", "3 hours"], "answer": 0, "explanation": "For infants <12 months, the first 30 mL/kg is over 1 h. Why not the others: B. 5 hours — Five hours is the infant second phase.; C. 30 minutes — 30 minutes is the first-phase timing for older children.; D. 3 hours — Three hours is the total older-child regimen.", "pearl": "", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "In WHO Plan C, a 3-year-old without shock should receive the 70 mL/kg second phase over approximately:", "options": ["2.5 hours", "6 hours", "30 minutes", "5 hours"], "answer": 0, "explanation": "Children ≥12 months receive the second 70 mL/kg over 2.5 h. Why not the others: B. 6 hours — Six hours is the overall infant regimen.; C. 30 minutes — Thirty minutes is the older-child first phase.; D. 5 hours — Five hours applies to infants <12 months.", "pearl": "", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "For an 8-month-old with no dehydration who passes a loose stool at home, which WHO Plan A ORS range is appropriate after each stool?", "options": ["500–600 mL", "250–350 mL", "100–200 mL", "50–100 mL"], "answer": 3, "explanation": "For age <2 years, offer approximately 50–100 mL after each loose stool. Why not the others: A. 500–600 mL — 500–600 mL is not a routine single-stool replacement target.; B. 250–350 mL — 250–350 mL exceeds routine age-based Plan A advice.; C. 100–200 mL — 100–200 mL is the older-child range.", "pearl": "", "srcAnswer": "B"}, {"num": 15, "level": "Conceptual", "question": "For a 3-year-old managed at home with Plan A, which additional ORS volume is advised after each loose stool?", "options": ["10–20 mL", "50–100 mL", "100–200 mL", "400–500 mL"], "answer": 2, "explanation": "Age ≥2 years: approximately 100–200 mL after each stool. Why not the others: A. 10–20 mL — 10–20 mL under-replaces typical losses.; B. 50–100 mL — 50–100 mL is the younger-child range.; D. 400–500 mL — 400–500 mL is not the routine Plan A range.", "pearl": "", "srcAnswer": "C"}, {"num": 16, "level": "Conceptual", "question": "An infant vomits during supervised oral rehydration but remains alert and able to drink. What is the best immediate adjustment?", "options": ["Stop ORS permanently and start antidiarrhoeal medication", "Withhold all liquids until the next day", "Pause about 10 minutes and resume ORS more slowly", "Give a full four-hour ORS volume as a rapid bolus"], "answer": 2, "explanation": "Brief pause and slower small sips improve tolerance. Why not the others: A. Stop ORS permanently and start antidiarrhoeal medication — Vomiting alone does not mandate abandoning ORS.; B. Withhold all liquids until the next day — Fluid withholding increases dehydration risk.; D. Give a full four-hour ORS volume as a rapid bolus — Rapid large-volume administration worsens vomiting.", "pearl": "", "srcAnswer": "D"}, {"num": 17, "level": "Conceptual", "question": "Which preparation instruction best prevents an ORS concentration error?", "options": ["Concentrate the solution when stool output is high", "Dissolve the full sachet in exactly the water volume printed on it", "Add table sugar until the solution tastes sweet", "Mix one sachet into any convenient cup volume"], "answer": 1, "explanation": "sachet-specific dilution is essential. Why not the others: A. Concentrate the solution when stool output is high — Concentrating ORS increases osmotic and sodium risk.; C. Add table sugar until the solution tastes sweet — Added sugar distorts the formulation.; D. Mix one sachet into any convenient cup volume — Arbitrary volumes alter electrolyte concentrations.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day33',label:'Day 33',set:'Quiz 1',href:'Day33/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day33_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 33 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 33 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 33'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 33');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day33:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
