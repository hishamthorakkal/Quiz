<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 4 Quiz 5 — Q61–Q75</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 4 — Quiz 5</h1>
<div class="sub">Questions 61–75 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 61, "level": "High", "question": "A preterm infant is event-free after caffeine discontinuation but fails oral feeds due to recurrent desaturation and bradycardia with immature coordination. Which is the best discharge decision?", "options": ["Use body weight alone to decide", "Delay discharge until feeding-related cardiorespiratory stability is achieved; absence of spontaneous apnea alone is insufficient", "Discharge because AOP has resolved", "Restart caffeine as the sole treatment for feeding discoordination"], "answer": 1, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 62, "level": "High", "question": "A 29-week infant has recurrent apnea and a new need for 30% oxygen. CXR shows increased diffuse haziness, and PaCO2 has risen. Which is the best interpretation?", "options": ["Respiratory disease/atelectasis may be worsening and contributing; optimize lung support rather than treating apnea as an isolated neurologic problem", "Caffeine resistance is proven", "Oxygen requirement excludes apnea", "No further respiratory evaluation is required"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 63, "level": "High", "question": "A 31-week infant has recurrent apnea after caffeine was inadvertently omitted for 48 h. The infant is stable, infection screen negative. Which is the best approach?", "options": ["Diagnose sepsis despite negative evaluation", "Intubate immediately because missed caffeine causes irreversible apnea", "Permanently discontinue caffeine", "Re-establish appropriate caffeine therapy based on timing/clinical status and observe response rather than assuming disease progression"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 64, "level": "High", "question": "A 26-week infant in a humidified incubator develops sodium 152 mmol/L with weight loss exceeding target and high urine output. Which issue should be reviewed first?", "options": ["Sodium should be rapidly corrected with a large free-water bolus", "KMC is contraindicated permanently", "Total fluid balance and ongoing insensible/renal water losses, including adequacy of humidification", "Caffeine should be stopped because it is always the sole cause"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 65, "level": "High", "question": "A 33-week corrected infant has no spontaneous apnea but remains on caffeine purely because discharge is planned next week. Which principle is best?", "options": ["Caffeine should be discontinued based on maturity/event history and followed by adequate observation; it need not be continued solely to reach a calendar date", "Caffeine must continue until 40 weeks in all infants", "Stopping caffeine is unsafe before weight 2.5 kg", "Caffeine should continue until all oxygen is stopped"], "answer": 0, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 66, "level": "High", "question": "A 28-week infant has apnea with rhythmic eye deviation and subtle limb jerks; HR and SpO2 changes occur afterward. Which is the best next step?", "options": ["Increase caffeine immediately and defer neurologic evaluation", "Diagnose obstructive apnea because SpO2 falls", "Ignore movements because preterm infants commonly twitch", "Evaluate for seizures/CNS pathology with appropriate neurologic assessment rather than assuming AOP"], "answer": 3, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 67, "level": "High", "question": "A 27-week infant develops frequent apnea during hypothermia. After rewarming, events markedly decrease without caffeine adjustment. What is the strongest inference?", "options": ["Hypothermia is unrelated to respiratory control", "Rewarming directly treats central nervous system infection", "Thermal instability was an important reversible contributor to apnea burden", "Caffeine was ineffective"], "answer": 2, "explanation": "This question tests advanced distinction between primary AOP and secondary apnea, dose/monitoring nuances, respiratory-support mechanics, or discharge physiology. The correct choice integrates the full clinical trajectory and avoids a single-variable decision.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 68, "level": "Integrated", "question": "A 26-week infant on day 8 has apnea, abdominal distension, temperature 36.1°C, glucose 54 mg/dL, platelets 88,000/µL, CRP 4 mg/L and caffeine maintenance 5 mg/kg/day. Which is the best next step?", "options": ["Correct glucose only; thrombocytopenia is expected in ELBW infants", "Stabilize and evaluate for NEC/sepsis; do not let low CRP or prematurity anchor the diagnosis to AOP", "Increase caffeine to 10 mg/kg/day first and reassess abdomen later", "Diagnose uncomplicated AOP because the infant is <28 weeks"], "answer": 1, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 69, "level": "Integrated", "question": "A 28-week infant receiving KMC on CPAP has temperature 36.8°C, stable gases and good perfusion. A nurse proposes stopping KMC because the infant is <1 kg. Which is best?", "options": ["Stop KMC until 1500 g because VLBW infants require incubator-only care", "Stop KMC until caffeine is discontinued", "Continue KMC only if CPAP is removed", "Continue KMC as clinically feasible; weight <1 kg alone is not a contraindication in current WHO guidance"], "answer": 3, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 70, "level": "Integrated", "question": "A 29-week infant on caffeine has recurrent apnea. ABG: pH 7.28, PaCO2 60, HCO3 27; Hb 10.5, glucose 80, temp 36.9°C. CPAP prongs are leaking and CXR shows mild atelectasis. Which intervention is most likely to address the immediate physiology?", "options": ["Increase caffeine solely because PaCO2 is high", "Begin antibiotics because atelectasis proves pneumonia", "Correct CPAP interface and optimize distending pressure/ventilation before escalating caffeine", "Transfuse because Hb 10.5 explains hypercapnia"], "answer": 2, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 71, "level": "Integrated", "question": "A 30-week infant is ready for discharge: 1.55 kg, full oral feeds, open-cot temp 36.7°C, no significant apnea for 6 days after caffeine stopped, parents trained, follow-up arranged. Which factor is least useful as a reason to delay discharge?", "options": ["Unsafe feeding-related desaturation", "Weight below an arbitrary 2-kg cutoff", "Recurrent stimulation-requiring apnea", "Inability to maintain temperature"], "answer": 1, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 72, "level": "Integrated", "question": "A 27-week infant has caffeine load documented as “20 mg/kg caffeine” rather than “caffeine citrate.” The vial is caffeine citrate. The infant develops marked tachycardia. Which is the key safety issue?", "options": ["Dose-expression confusion may have produced a two-fold citrate-equivalent dosing error", "Caffeine-base and citrate labels are interchangeable", "Tachycardia indicates underdosing", "The dose distinction matters only in term infants"], "answer": 0, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 73, "level": "Integrated", "question": "A 25-week infant with recurrent apnea has glucose 68, temp 36.7°C, normal abdominal exam, negative cultures, Hb 11, but cranial ultrasound shows new grade III IVH. What is the best interpretation?", "options": ["Caffeine should be stopped because it causes IVH", "Negative cultures prove primary AOP", "CNS injury may be contributing to apnea; management must address the neurologic complication and respiratory stability, not simply escalate caffeine", "IVH is unrelated to apnea"], "answer": 2, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 74, "level": "Integrated", "question": "A 31-week infant, corrected 35 weeks, has no spontaneous apnea for 7 days after caffeine cessation but has two brady-desaturations during bottle feeds. Temperature/growth are stable. Best next step?", "options": ["Ignore the events because spontaneous apnea is absent", "Assess feeding coordination/aspiration risk; do not equate feeding-associated events automatically with recurrent AOP", "Restart caffeine and discharge the same day", "Diagnose recurrent central apnea because bradycardia occurred"], "answer": 1, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}, {"num": 75, "level": "Integrated", "question": "A 27-week infant has recurrent apnea, temperature 35.8°C, Na 150 mmol/L, weight loss 12% in 24 h and high insensible losses under low incubator humidity. Which management best integrates the findings?", "options": ["Correct thermal/environmental care and carefully replace water deficit while reassessing apnea and other secondary causes", "Increase caffeine only because apnea is the main symptom", "Rapidly normalize sodium within 2 h with hypotonic bolus", "Stop all enteral feeds and use no humidification"], "answer": 0, "explanation": "This integrated question requires combining prematurity physiology, apnea mechanisms, thermal/metabolic data and management sequencing; the correct option addresses the dominant immediate risk without anchoring on AOP alone.", "pearl": "New or changing apnea in a preterm infant is secondary until reversible causes are considered.", "why": "Tests close-option clinical sequencing and avoids anchoring bias."}];
let idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 const q=quiz[idx];
 document.getElementById('progress').style.width=`${(idx/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Home</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button><button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('mainBtn').textContent=idx===quiz.length-1?'Finish Quiz':'Next Question';
}
function next(){if(idx<quiz.length-1){idx++;render();}else showSummary(false);}
function finishEarly(){if(confirm(`Finish now? You have attempted ${answers.length} question(s).`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day4_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 4 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of 15 questions.</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Menu</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
