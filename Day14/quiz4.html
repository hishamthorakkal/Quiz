@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
const quiz=[{"num": 50, "level": "Clinical/Application", "question": "An 8-kg SAM child with gross nutritional edema needs initial starter feed volume under IAP 2026 example 100 mL/kg/day. Total daily volume:", "options": ["700 mL/day", "760 mL/day", "1040 mL/day", "800 mL/day"], "answer": 3, "explanation": "Gross edema calls for cautious starter volume to avoid fluid overload. Closest distractor: Do not blindly apply 130 mL/kg/day to gross-edema cases. Why not the others: C. 1040 mL/day — This uses the 130 mL/kg/day non-gross-edema starter anchor.", "pearl": "Calculation: 8 kg × 100 mL/kg/day = 800 mL/day.", "srcAnswer": "D"}, {"num": 51, "level": "High-Difficulty", "question": "A 19-month-old has MUAC 109 mm, no edema, normal capillary refill, mild cough, temperature 36.5°C, alert state, and fails a supervised appetite test. Best management:", "options": ["Community care because capillary refill is normal", "Repeat MUAC after two weeks before acting", "Inpatient referral after failed appetite test", "Community care because there is no edema"], "answer": 2, "explanation": "SAM triage uses complications AND appetite, not vital signs alone. Closest distractor: A normal capillary refill is not equivalent to successful oral nutritional rehabilitation. Why not the others: A. Community care because capillary refill is normal — Normal perfusion does not prove capacity for outpatient nutritional treatment.; B. Repeat MUAC after two weeks before acting — Severe MUAC and failed appetite test already warrant action.; D. Community care because there is no edema — Absence of edema does not override appetite failure.", "pearl": "India 2023 CMAM uses appetite test to determine community eligibility.", "srcAnswer": "C"}, {"num": 52, "level": "Clinical/Application", "question": "A 32-week preterm infant loses 7% birth weight over three days with rising urine output, normal perfusion and stable sodium. What physiological process best explains this trend?", "options": ["Complete inability to excrete sodium", "Obligatory persistent fluid retention", "Postnatal diuresis and natriuresis", "Definite acute kidney injury"], "answer": 2, "explanation": "Early neonatal water and sodium balance changes are physiologic and gestation-dependent. Closest distractor: Normal postnatal weight loss must be distinguished from dehydration by clinical data. Why not the others: A. Complete inability to excrete sodium — Neonates can excrete sodium, although renal handling is immature.; B. Obligatory persistent fluid retention — The observed weight loss and diuresis contradict retention.; D. Definite acute kidney injury — Normal perfusion and rising output do not establish AKI.", "pearl": "Use serial weight, sodium, urine output and fluid intake rather than fixed assumptions.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q15"}}, {"num": 53, "level": "High-Difficulty", "question": "A 2-year-old with edematous SAM and diarrhea develops tachypnea and new crackles during rehydration, while stool losses are decreasing. Most appropriate interpretation:", "options": ["Expected normal effect of F-75", "Stop fluids and assess possible overload", "Hypoglycemia is proven by tachypnea alone", "Persistent dehydration mandates faster boluses"], "answer": 1, "explanation": "In SAM, rehydration must be continuously reassessed for overhydration. Closest distractor: Diarrhoea alone does not justify escalating fluids in the face of pulmonary signs. Why not the others: A. Expected normal effect of F-75 — New respiratory findings are not a benign feeding response.; C. Hypoglycemia is proven by tachypnea alone — Blood glucose is needed; respiratory findings suggest fluid issue.; D. Persistent dehydration mandates faster boluses — Crackles and tachypnea during therapy argue against blind escalation.", "pearl": "Monitor respiratory rate, pulse, hepatomegaly, edema and urine output.", "srcAnswer": "B"}, {"num": 54, "level": "High-Difficulty", "question": "A child with SAM completes rehabilitation, has MUAC 126 mm, WHZ −2.3, no edema for three weeks, eats well and is clinically stable. According to IAP 2026 stated discharge criteria, best assessment:", "options": ["Should stop all nutrition support permanently", "MUAC-based recovery with follow-up", "Cannot ever exit until WHZ exceeds +1", "Is still SAM solely because WHZ is −2.3"], "answer": 1, "explanation": "Recovery can be defined by the specified MUAC or WHZ pathway plus clinical criteria. Closest distractor: Do not require both WHZ and MUAC when the named IAP text uses OR. Why not the others: A. Should stop all nutrition support permanently — Recovery requires ongoing prevention and monitoring.; C. Cannot ever exit until WHZ exceeds +1 — This is not the recovery threshold.; D. Is still SAM solely because WHZ is −2.3 — WHZ −2.3 is MAM range and MUAC exceeds recovery criterion.", "pearl": "Confirm no edema for at least two weeks and adequate feeding.", "srcAnswer": "B"}, {"num": 55, "level": "High-Difficulty", "question": "An 8-kg SAM child has just begun F-75 at 130 mL/kg/day. F-75 contains ~75 kcal/100 mL. Approximate daily energy intake is:", "options": ["Approximately 585 kcal/day", "Approximately 680 kcal/day", "780 kcal/day, or 97.5 kcal/kg/day", "Approximately 900 kcal/day"], "answer": 2, "explanation": "Multiply feed volume by formulation energy density before interpreting kcal/kg. Closest distractor: mL/kg/day is not interchangeable with kcal/kg/day.", "pearl": "1040 mL ×75/100=780 kcal/day; ÷8=97.5 kcal/kg/day.", "srcAnswer": "C"}, {"num": 56, "level": "High-Difficulty", "question": "A 20-month-old with complicated SAM has Hb 5.2 g/dL, severe pneumonia and cardiopulmonary compromise. Which action best reflects the IAP 2026 inpatient SAM guidance?", "options": ["No transfusion assessment until Hb falls below 4 regardless of symptoms", "Routine high-dose oral iron as the immediate rescue", "Urgent transfusion assessment and stabilization", "Only repeat Hb after discharge"], "answer": 2, "explanation": "SAM transfusion thresholds are modified by cardiopulmonary compromise. Closest distractor: A single Hb cutoff is insufficient without clinical context. Why not the others: A. No transfusion assessment until Hb falls below 4 regardless of symptoms — The <4 threshold applies to those without cardiopulmonary compromise.; B. Routine high-dose oral iron as the immediate rescue — Iron is delayed and cannot rapidly correct critical oxygen delivery.; D. Only repeat Hb after discharge — Severe anemia plus respiratory compromise requires urgent inpatient care.", "pearl": "Use cautious volume and facility transfusion protocols due to overload risk.", "srcAnswer": "C"}, {"num": 57, "level": "High-Difficulty", "question": "A child with complicated SAM is on day 2 of F-75, afebrile after antibiotics but still edematous and anorexic. Which micronutrient decision is best?", "options": ["Begin iron immediately because fever resolved", "Give non-iron nutrients; defer iron", "Withhold all vitamins until discharge", "Give only vitamin D and omit folate"], "answer": 1, "explanation": "Clinical phase, not one improving vital sign, controls iron initiation. Closest distractor: Fever resolution alone does not equal rehabilitation readiness. Why not the others: A. Begin iron immediately because fever resolved — Appetite and metabolic recovery, not fever alone, govern phase transition.; C. Withhold all vitamins until discharge — Early non-iron micronutrients are part of stabilization.; D. Give only vitamin D and omit folate — This ignores the SAM stabilization micronutrient package.", "pearl": "IAP 2026 mentions folic acid 5 mg day 1 then 1 mg/day for two weeks.", "srcAnswer": "B"}, {"num": 58, "level": "High-Difficulty", "question": "A 30-week infant is now 6 months chronological age (3.5 months corrected) with poor head control. Family asks to start solids because chronological age is six months. Best advice:", "options": ["Individualize preterm solids by feeding readiness", "Wait until exactly 12 months chronological age", "Stop expressed breast milk now", "Start solids immediately regardless of head control"], "answer": 0, "explanation": "Preterm complementary-feeding timing is readiness-sensitive and less certain than term guidance. Closest distractor: Neither corrected age nor chronological age should be used without developmental assessment. Why not the others: B. Wait until exactly 12 months chronological age — This may unnecessarily delay nutrient-rich feeding.; C. Stop expressed breast milk now — Human milk remains valuable during transition.; D. Start solids immediately regardless of head control — Poor head control increases feeding safety concerns.", "pearl": "IAP 2026 labels the precise preterm timing evidence as still evolving.", "srcAnswer": "A"}, {"num": 59, "level": "High-Difficulty", "question": "A late-preterm infant has good observed latch but only 1–2 audible swallows per minute, rising sodium, weight loss and poor urine output. Most defensible conclusion:", "options": ["Normal breastfeeding because the infant attaches to nipple", "Inadequate transfer; assisted milk feeding", "Exclusive water supplementation to correct sodium", "Formula must replace human milk permanently"], "answer": 1, "explanation": "Transfer assessment and weight trend matter more than a binary latch label. Closest distractor: Hypernatremia and poor output signal clinically important intake failure. Why not the others: A. Normal breastfeeding because the infant attaches to nipple — Attachment without transfer can be insufficient.; C. Exclusive water supplementation to correct sodium — Water alone does not solve caloric deficit and risks unsafe electrolyte shifts.; D. Formula must replace human milk permanently — Expressed maternal/donor milk and lactation support are preferred when feasible.", "pearl": "Late-preterm coordination immaturity increases risk of silent underfeeding.", "srcAnswer": "B"}, {"num": 60, "level": "High-Difficulty", "question": "A 4-year-old has Hb 9.5 g/dL, MCV 60 fL, RBC 5.9 million/µL, RDW 12%, normal CRP and no response to confirmed iron intake. Most likely:", "options": ["Thalassemia trait", "Iron deficiency with falsely normal RDW due to inflammation", "Anaemia of chronic disease despite normal inflammatory markers", "Combined iron and folate deficiency with elevated RBC count"], "answer": 0, "explanation": "Mentzer index = MCV/RBC ≈60/5.9≈10.2, supportive of thalassemia trait (not definitive). Closest distractor: Mentzer index is a screening aid, not confirmatory genetic testing.", "pearl": "Confirm with appropriate hemoglobin analysis and clinical context.", "srcAnswer": "A"}, {"num": 61, "level": "High-Difficulty", "question": "A febrile 3-year-old has Hb 9.6 g/dL, MCV 68 fL, ferritin 48 ng/mL and CRP 60 mg/L. Most defensible interpretation:", "options": ["Iron deficiency is excluded because ferritin exceeds 30", "Only B12 deficiency can explain microcytosis", "Ferritin proves iron overload", "Iron deficiency remains possible"], "answer": 3, "explanation": "Ferritin needs inflammatory interpretation; add transferrin saturation/reticulocyte Hb if available. Closest distractor: A reference-range ferritin is not a definitive rule-out during infection. Why not the others: A. Iron deficiency is excluded because ferritin exceeds 30 — An acute-phase response can conceal depleted stores.; B. Only B12 deficiency can explain microcytosis — B12 deficiency usually produces macrocytosis.; C. Ferritin proves iron overload — 48 ng/mL during inflammation is not iron overload.", "pearl": "Treat infection and reassess anemia with appropriate indices.", "srcAnswer": "D"}, {"num": 62, "level": "High-Difficulty", "question": "An infant has macrocytosis, developmental regression and maternal vegan diet. Folate alone improves hemoglobin but regression persists. Best next step:", "options": ["Assume cerebral palsy because regression persists", "Stop all vitamins because macrocytosis improved", "Continue folate alone because Hb improved", "Evaluate and promptly treat vitamin B12 deficiency"], "answer": 3, "explanation": "Never use folate response to exclude B12 deficiency. Closest distractor: B12 neurotoxicity may be dissociated from the CBC. Why not the others: A. Assume cerebral palsy because regression persists — Regression and nutritional risk demand reversible-cause assessment.; B. Stop all vitamins because macrocytosis improved — This risks ongoing neurologic damage.; C. Continue folate alone because Hb improved — Hematologic response does not exclude untreated B12 deficiency.", "pearl": "Prompt treatment is important to reduce irreversible injury.", "srcAnswer": "D"}, {"num": 63, "level": "High-Difficulty", "question": "A 5-year-old has genu varum, low phosphate, high ALP, normal 25-OH D, normal calcium, no secondary hyperparathyroidism and low renal phosphate reabsorption. Best mechanism:", "options": ["Renal phosphate wasting (e.g. XLH)", "Simple vitamin-D deficiency", "Vitamin-A deficiency", "Primary hypoparathyroidism"], "answer": 0, "explanation": "Phosphopenic and calcipenic rickets require different diagnostic and therapeutic pathways. Closest distractor: Low phosphate alone is not enough; inappropriate renal loss is decisive. Why not the others: B. Simple vitamin-D deficiency — 25-OH D is normal and renal phosphate wasting is the dominant clue.; C. Vitamin-A deficiency — This causes ocular/epithelial disease rather than isolated renal phosphate wasting.; D. Primary hypoparathyroidism — This usually lowers calcium and raises phosphate.", "pearl": "Check tubular phosphate handling and refer for targeted therapy.", "srcAnswer": "A"}, {"num": 64, "level": "High-Difficulty", "question": "A 3-year-old with presumed nutritional rickets receives documented adequate vitamin D and calcium for 12 weeks, but ALP remains high and metaphyseal abnormalities persist. Best next step:", "options": ["Investigate nonresponse and phosphate handling", "Double cholecalciferol repeatedly without investigations", "Stop all calcium and vitamin D permanently", "Diagnose nutritional rickets cured solely because symptoms improved"], "answer": 0, "explanation": "Failure of expected biochemical improvement is an exam clue for resistant/alternative rickets. Closest distractor: Vitamin-D-resistant does not automatically mean one genetic disease. Why not the others: B. Double cholecalciferol repeatedly without investigations — This increases toxicity risk and misses alternate disease.; C. Stop all calcium and vitamin D permanently — The cause must be clarified and deficiencies corrected safely.; D. Diagnose nutritional rickets cured solely because symptoms improved — Biochemical/radiographic nonresponse is important.", "pearl": "Check phosphate, PTH, renal function, urine phosphate and 25-OH D.", "srcAnswer": "A"}, {"num": 65, "level": "High-Difficulty", "question": "A severely undernourished 3-year-old has a foamy conjunctival plaque and photophobia, then develops corneal haze. Best interpretation:", "options": ["Routine refractive error", "Xerophthalmia with urgent corneal risk", "Only uncomplicated conjunctivitis", "Isolated vitamin-D deficiency"], "answer": 1, "explanation": "Corneal involvement is a vision-threatening emergency in vitamin-A deficiency. Closest distractor: Bitot spots alone and keratomalacia are not equivalent severity stages. Why not the others: A. Routine refractive error — Refractive error does not cause Bitot-like plaques.; C. Only uncomplicated conjunctivitis — Corneal haze and nutritional risk are not explained by mild conjunctivitis.; D. Isolated vitamin-D deficiency — Rickets does not explain xerophthalmia.", "pearl": "Systemic vitamin A and urgent ocular assessment are required.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day14',label:'Day 14',set:'Quiz 4',href:'Day14/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day14_QuizSet4_Q50-65_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 14 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 50–65</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 14 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 14'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 14');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day14:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c71ce328"></script></body></html>
