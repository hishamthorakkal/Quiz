<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "For a healthy term infant, the recommended age to begin complementary feeding under IAP 2026 is:", "options": ["At the beginning of the sixth month for every term infant", "At completion of 5 months if the infant can sit with support", "At completion of 6 months", "At completion of 7 months if breastfeeding is adequate"], "answer": 2, "explanation": "Breast milk alone ceases to cover increasing nutrient needs around six months. Closest distractor: Six completed months is not the same as beginning the sixth month.", "pearl": "Developmental readiness modifies texture; it does not justify routine late complementary feeding.", "srcAnswer": "C"}, {"num": 2, "level": "Basic/Recall", "question": "Which MUAC threshold identifies severe acute malnutrition in a child aged 6–59 months?", "options": ["Below 125 mm, regardless of weight-for-height", "<115 mm", "At or below 115 mm, including exactly 115 mm", "Below 110 mm in all children aged 6–59 months"], "answer": 1, "explanation": "MUAC <11.5 cm is an independent SAM criterion. Closest distractor: 115 mm belongs to the MAM boundary, not the SAM lower threshold.", "pearl": "Bilateral nutritional edema independently establishes SAM even with MUAC ≥115 mm.", "srcAnswer": "B"}, {"num": 3, "level": "Basic/Recall", "question": "The IAP revised vitamin-D guidance recommends which routine supplementation dose in infancy?", "options": ["400 IU cholecalciferol daily", "200 IU cholecalciferol daily during infancy", "600 IU cholecalciferol daily during infancy", "800 IU cholecalciferol daily during infancy"], "answer": 0, "explanation": "Prophylaxis 400 IU/day differs from treatment of established deficiency. Closest distractor: 2000 IU/day is a therapeutic anchor in infants, not a preventive dose.", "pearl": "Prescribe the purpose before recalling the dose: prevention versus treatment.", "srcAnswer": "A"}, {"num": 4, "level": "Basic/Recall", "question": "Under the Indian National Vitamin A programme, the first routine dose at 9 months is:", "options": ["50,000 IU orally at 9 months", "100,000 IU orally", "150,000 IU orally at 9 months", "200,000 IU orally at 9 months"], "answer": 1, "explanation": "Nine-month vitamin A prophylaxis is 1 lakh IU; subsequent programme doses are 2 lakh IU. Closest distractor: Do not interchange vitamin-A IU with vitamin-D IU.", "pearl": "There are nine scheduled prophylactic vitamin-A doses by five years.", "srcAnswer": "B"}, {"num": 5, "level": "Basic/Recall", "question": "Under Anemia Mukt Bharat, the 6–59-month prophylactic IFA syrup schedule is:", "options": ["1 mL IFA syrup once weekly", "1 mL IFA syrup on alternate days", "1 mL twice weekly", "1 mL IFA syrup three times weekly"], "answer": 2, "explanation": "AMB prophylaxis is 1 mL twice weekly, not treatment of diagnosed anemia. Closest distractor: Therapeutic iron is generally calculated per kg per day; AMB prevention is fixed programme dosing.", "pearl": "Always read elemental iron on the label.", "srcAnswer": "C"}, {"num": 6, "level": "Basic/Recall", "question": "Weight-for-length or weight-for-height z score primarily measures:", "options": ["Height-for-age z score reflecting chronic linear growth deficit", "Wasting", "Weight-for-age z score reflecting combined linear and ponderal deficit", "MUAC-for-age reflecting acute nutritional risk"], "answer": 1, "explanation": "WFL/WHZ = wasting; HAZ = stunting; WAZ = underweight. Closest distractor: A child can be both wasted and stunted, but the indices answer different questions.", "pearl": "Do not infer chronicity from weight-for-age alone.", "srcAnswer": "B"}, {"num": 7, "level": "Basic/Recall", "question": "For a 2-year-old with acute watery diarrhoea, the current Indian NHM 2025 zinc programme dose is:", "options": ["20 mg elemental zinc daily for 14 days", "10 mg elemental zinc daily for 14 days", "20 mg elemental zinc daily for 10 days", "10 mg elemental zinc twice daily for 14 days"], "answer": 0, "explanation": "State the guideline: Indian NHM 2025 is 20 mg for ≥6 months; WHO 2024 conditionally suggests 5 mg. Closest distractor: An international update does not silently replace the Indian programme dose.", "pearl": "Indian and WHO zinc guidance now differ—name the framework in every question.", "srcAnswer": "A"}, {"num": 8, "level": "Conceptual", "question": "A 3-day-old baby latches but transfers little milk; mother has nipple pain and the infant clicks repeatedly. Which assessment is most informative first?", "options": ["Observe a full feed and milk transfer", "Measure pre-feed and post-feed weight across one observed feeding", "Assess maternal milk expression without directly observing infant suck–swallow coordination", "Evaluate for restricted tongue movement before checking feeding technique"], "answer": 0, "explanation": "Milk transfer is a clinical process, not synonymous with time at the breast. Closest distractor: A latch that looks present can still be shallow and ineffective.", "pearl": "IAP describes wide mouth, everted lips, chin-to-breast and audible/observable swallowing.", "srcAnswer": "A"}, {"num": 9, "level": "Conceptual", "question": "Why is the volume of mature human milk alone insufficient to meet all nutritional needs beyond about six months?", "options": ["Milk iron concentration rises, but complementary foods are needed chiefly for zinc", "Iron and energy needs rise relative to milk-only supply", "Milk volume falls abruptly at six months despite unchanged infant requirements", "Milk remains nutritionally sufficient if feeds are increased to twelve per day"], "answer": 1, "explanation": "Complementary feeding adds nutrients; it does not replace breastfeeding. Closest distractor: Iron density matters even when a child seems to obtain enough liquid calories.", "pearl": "Start iron-rich foods promptly at six months.", "srcAnswer": "B"}, {"num": 10, "level": "Conceptual", "question": "Why is thin watery porridge a poor main complementary food for an undernourished 8-month-old?", "options": ["Low energy density limits calories per stomach volume", "Low protein density is the only nutritional limitation of diluted cereal feeds", "Poor micronutrient bioavailability is the only reason watery porridge fails", "Dilution raises osmolarity and therefore limits tolerated feed volume"], "answer": 0, "explanation": "Infants have small gastric capacity; thick nutrient-dense feeds are preferred. Closest distractor: Feeding frequency cannot fully rescue very dilute energy density.", "pearl": "IAP 2026 describes ≥0.8–1.0 kcal/g as a useful complementary-feed density target.", "srcAnswer": "A"}, {"num": 11, "level": "Clinical/Application", "question": "A ventilated preterm infant suddenly desaturates. The chest moves normally with manual bagging after disconnecting the ventilator, and the ventilator circuit has a visibly loose Y-connector. What is the leading DOPE category?", "options": ["Obstructed endotracheal tube", "Displaced endotracheal tube", "Pneumothorax", "Equipment failure"], "answer": 3, "explanation": "A visible circuit leak is the equipment component of DOPE. Closest distractor: Do not infer pneumothorax solely from desaturation. Why not the others: A. Obstructed endotracheal tube — Adequate ventilation by manual bagging argues against fixed obstruction.; B. Displaced endotracheal tube — Normal chest rise with bagging and a loose circuit point elsewhere.; C. Pneumothorax — The circuit defect explains sudden deterioration without unilateral chest signs.", "pearl": "Check D–O–P–E while providing immediate effective ventilation.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 5 Q34"}}, {"num": 12, "level": "Conceptual", "question": "A child has HAZ −3.4, WHZ −0.7 and MUAC 134 mm. The best classification is:", "options": ["Severe wasting with preserved linear growth", "Moderate acute malnutrition with no stunting", "Severe stunting without current wasting", "Normal nutrition because WHZ is normal"], "answer": 2, "explanation": "Different anthropometric indices can diverge. Closest distractor: Normal WHZ cannot exclude chronic malnutrition. Why not the others: D. Normal nutrition because WHZ is normal — Severe stunting remains a major nutritional concern.", "pearl": "Use both height-for-age and weight-for-height in longitudinal assessment.", "srcAnswer": "C"}, {"num": 13, "level": "Conceptual", "question": "Why may weight-for-height appear deceptively acceptable in kwashiorkor?", "options": ["The child always has normal muscle mass", "MUAC rises because edema never affects arms", "Weight-for-height is calculated without body weight", "Fluid retention increases measured weight"], "answer": 3, "explanation": "Edema is an independent SAM diagnostic criterion. Closest distractor: A seemingly normal WHZ cannot overrule bilateral nutritional pitting edema. Why not the others: A. The child always has normal muscle mass — Edematous malnutrition can coexist with severe wasting.; B. MUAC rises because edema never affects arms — Edema can distort several anthropometric measures.; C. Weight-for-height is calculated without body weight — Weight is essential to the index.", "pearl": "Check both feet for symmetrical pitting edema.", "srcAnswer": "D"}, {"num": 14, "level": "Conceptual", "question": "Why is iron usually deferred during the stabilization phase of complicated SAM?", "options": ["Iron is contraindicated until complete weight recovery", "Defer iron until rehabilitation after stabilization", "Iron is withheld only because F-75 already supplies therapeutic iron doses", "Iron is started immediately with antibiotics to correct infection-associated anaemia"], "answer": 1, "explanation": "The phase of SAM treatment determines nutrient strategy. Closest distractor: Iron is not permanently contraindicated; timing changes.", "pearl": "F-75 first, catch-up feeding and iron later.", "srcAnswer": "B"}, {"num": 15, "level": "Conceptual", "question": "What is the main reason dehydration is difficult to assess and treat in severe acute malnutrition?", "options": ["All SAM patients are hypernatremic", "Standard rapid fluid boluses are safe for all", "IV fluids are always required", "Unreliable dehydration signs and overload risk"], "answer": 3, "explanation": "In SAM, dehydration treatment requires cautious clinical reassessment. Closest distractor: Shock and simple dehydration are not interchangeable. Why not the others: A. All SAM patients are hypernatremic — Sodium concentration varies and is not uniformly elevated.; B. Standard rapid fluid boluses are safe for all — Uncritical boluses risk heart failure and overhydration.; C. IV fluids are always required — Stable children can often be rehydrated orally under close observation.", "pearl": "Use the locally specified SAM rehydration pathway; monitor pulse, breathing, edema and urine.", "srcAnswer": "D"}, {"num": 16, "level": "Conceptual", "question": "Which mechanism best explains night blindness in vitamin A deficiency?", "options": ["Impaired conversion of retinal to retinoic acid is the direct cause of rod dysfunction", "Impaired retinal rhodopsin regeneration", "Reduced cone photopigment regeneration primarily impairs scotopic vision", "Retinal vascular ischemia precedes defective rhodopsin regeneration"], "answer": 1, "explanation": "Vitamin A deficiency initially impairs dark adaptation before destructive corneal disease. Closest distractor: Night blindness precedes xerophthalmic corneal ulceration in many cases.", "pearl": "Corneal xerosis/keratomalacia requires urgent treatment, not routine prophylaxis.", "srcAnswer": "B"}, {"num": 17, "level": "Conceptual", "question": "A child with raised ALP, high PTH and low 25-OH vitamin D has normal serum calcium. Why can this still be nutritional rickets?", "options": ["High ALP proves primary liver disease", "Compensatory secondary hyperparathyroidism", "Normal calcium excludes rickets", "PTH must be suppressed in vitamin D deficiency"], "answer": 1, "explanation": "Calcipenic rickets may show hypophosphatemia through PTH-driven phosphaturia. Closest distractor: Do not use isolated serum calcium to rule out rickets. Why not the others: A. High ALP proves primary liver disease — Bone-derived ALP can rise markedly in active rickets.; C. Normal calcium excludes rickets — Serum calcium can be normal despite severe mineralization disease.; D. PTH must be suppressed in vitamin D deficiency — PTH is commonly elevated in calcipenic rickets.", "pearl": "Interpret Ca, P, ALP, PTH and 25-OH D together.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day14',label:'Day 14',set:'Quiz 1',href:'Day14/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day14_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 14 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 14 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 14'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 14');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day14:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9225e42b"></script></body></html>
