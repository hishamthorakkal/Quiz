<script>
const quiz=[{"num": 66, "level": "High-Difficulty", "question": "A neonate has a markedly elevated TSH on screening despite maternal use of adequately iodized salt. Most appropriate action:", "options": ["Give only extra iodine and skip confirmation", "Dismiss result because iodized salt was used", "Wait for clinical cretinism before testing", "Confirm serum TSH/free T4 urgently"], "answer": 3, "explanation": "Population iodine sufficiency and individual newborn screening answer different questions. Closest distractor: Iodization does not replace congenital hypothyroidism screening. Why not the others: A. Give only extra iodine and skip confirmation — Primary thyroid defects require specific evaluation and levothyroxine when confirmed.; B. Dismiss result because iodized salt was used — Iodine prophylaxis cannot rule out congenital thyroid disease.; C. Wait for clinical cretinism before testing — Neurodevelopmental injury can precede obvious signs.", "pearl": "Early treatment protects neurodevelopment.", "srcAnswer": "D"}, {"num": 67, "level": "Clinical/Application", "question": "A 1.8-kg preterm infant is limited to 100 mL/kg/day total glucose-containing fluid but requires GIR 8 mg/kg/min. What dextrose concentration is required approximately?", "options": ["5.6% dextrose", "8% dextrose", "11.5% dextrose", "20% dextrose"], "answer": 2, "explanation": "The 144 factor converts minutes/day and mg/g in the GIR relationship. Closest distractor: Do not multiply by weight when both GIR and fluid are already per kg. Why not the others: A. 5.6% dextrose — This underestimates glucose concentration for restricted volume.; B. 8% dextrose — This confuses GIR with percent dextrose.; D. 20% dextrose — This greatly exceeds the computed concentration.", "pearl": "8×144/100=11.52%; verify access and local infusion safety for concentration.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q47"}}, {"num": 68, "level": "High-Difficulty", "question": "An examiner explicitly asks for WHO 2024 guideline (not Indian NHM) dosing in a 3-year-old with acute watery diarrhea. Which answer matches that framework?", "options": ["5 mg oral zinc daily for up to 14 days (conditional recommendation)", "20 mg daily for 14 days as the WHO 2024 conditional dose", "10 mg daily for 14 days as WHO 2024", "Zinc is not recommended at any dose"], "answer": 0, "explanation": "WHO 2024 conditional 5 mg differs from Indian NHM 2025 20 mg for ≥6 months. Closest distractor: The named guideline determines the correct answer. Why not the others: B. 20 mg daily for 14 days as the WHO 2024 conditional dose — That is the current Indian NHM 2025 programme dose for this age, not WHO 2024 update.; C. 10 mg daily for 14 days as WHO 2024 — Ten milligrams is an older/Indian age-specific dose in younger infants.; D. Zinc is not recommended at any dose — WHO still recommends zinc as adjunct in diarrhoea.", "pearl": "Document the framework; do not silently harmonize conflicting sources.", "srcAnswer": "A"}, {"num": 69, "level": "High-Difficulty", "question": "A 23-month-old has WHZ −2.2, MUAC 118 mm, bilateral nutritional pitting edema of both feet, no fever, good appetite and mild pedal edema. What is the best classification and next step?", "options": ["Edematous SAM; assess severity and complications", "Severe stunting because edema indicates chronic height loss", "MAM eligible for routine follow-up solely from MUAC", "Normal because appetite is preserved"], "answer": 0, "explanation": "Edema diagnoses SAM; appetite and edema grade determine care pathway. Closest distractor: Mild edema with good appetite is not automatically equivalent to generalized +++ edema. Why not the others: B. Severe stunting because edema indicates chronic height loss — Stunting is not diagnosed by edema.; C. MAM eligible for routine follow-up solely from MUAC — Bilateral nutritional edema overrides MUAC.; D. Normal because appetite is preserved — Appetite determines disposition, not the diagnosis.", "pearl": "WHO 2023 explicitly admits +++ edema even if appetite is good.", "srcAnswer": "A"}, {"num": 70, "level": "High-Difficulty", "question": "A 7-kg child with complicated SAM is symptomatic and has glucose 42 mg/dL. IAP 2026 recommends 10% dextrose 5 mL/kg IV in symptomatic hypoglycemia. Initial IV volume:", "options": ["25 mL of 10% dextrose IV", "30 mL of 10% dextrose IV", "40 mL of 10% dextrose IV", "35 mL of 10% dextrose"], "answer": 3, "explanation": "The symptomatic SAM glucose rescue differs from asymptomatic oral pathway. Closest distractor: Route and volume are linked to clinical state.", "pearl": "7 kg ×5 mL/kg=35 mL IV; recheck glucose in 30 minutes per IAP.", "srcAnswer": "D"}, {"num": 71, "level": "High-Difficulty", "question": "An 18-month-old with uncomplicated MAM weighs 9 kg. IAP 2026 cites ~130 kcal/kg/day total. A reliable 24-h recall estimates 280 kcal from breast milk and 490 kcal from foods. What additional daily energy is needed to reach the target?", "options": ["Approximately 280 kcal/day", "Approximately 1170 kcal/day", "Approximately 680 kcal/day", "Approximately 400 kcal/day"], "answer": 3, "explanation": "Compute total energy target, add existing sources, then subtract; 1170−(280+490)=400 kcal/day. Closest distractor: The 680-kcal distractor arises from excluding breast-milk calories from the current intake. Why not the others: A. Approximately 280 kcal/day — This confuses breast-milk contribution with the remaining deficit.; B. Approximately 1170 kcal/day — This is the total target, not the shortfall after existing intake.; C. Approximately 680 kcal/day — This subtracts only the food calories and ignores 280 kcal breast milk.", "pearl": "Total kcal/kg/day goals include breastfeeding and other intake; avoid double counting.", "srcAnswer": "D"}, {"num": 72, "level": "High-Difficulty", "question": "A 10-month-old consumes five meals/day but all are rice starch and tea; weight gain stalls and Hb falls. Which assessment best explains the failure?", "options": ["Excess animal-source iron intake", "Poor diversity and iron bioavailability", "Low meal frequency alone", "Exclusive vitamin-D deficiency"], "answer": 1, "explanation": "Meal frequency and dietary diversity are independent IYCF quality dimensions. Closest distractor: Meeting one feeding indicator does not imply minimum acceptable diet. Why not the others: A. Excess animal-source iron intake — No animal-source foods are described.; C. Low meal frequency alone — Five meals is not the primary deficit.; D. Exclusive vitamin-D deficiency — This does not explain iron-poor diet and anemia alone.", "pearl": "Pair iron sources with vitamin C; avoid tea as infant beverage.", "srcAnswer": "B"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "A 15-month-old with 3 weeks of diarrhea has WHZ −3.4, MUAC 117 mm, edema ++, poor appetite, temperature 35.0°C and glucose 48 mg/dL. Most appropriate sequence:", "options": ["Inpatient stabilization, F-75, then rehabilitation", "Community high-calorie home feeding because MUAC is above 115 mm", "Full F-100 plus iron immediately on arrival", "Wait for stool culture before any feeding or glucose treatment"], "answer": 0, "explanation": "Multiple independent SAM criteria plus complications establish both diagnosis and disposition. Closest distractor: A single less-severe index cannot neutralize other SAM criteria. Why not the others: B. Community high-calorie home feeding because MUAC is above 115 mm — WHZ/edema and danger signs override MUAC.; C. Full F-100 plus iron immediately on arrival — Catch-up feeding and iron belong after stabilization.; D. Wait for stool culture before any feeding or glucose treatment — Life-threatening metabolic complications require immediate action.", "pearl": "Stabilization: glucose → warmth → cautious fluid/infection care → F-75 → transition → rehabilitation.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "A 20-month-old has HAZ −3.1, WHZ −2.5, MUAC 123 mm, no edema, good appetite and recurrent low-diversity diet. Best integrated interpretation:", "options": ["Endocrine short stature without nutritional concern", "SAM solely because HAZ is below −3", "Normal nutrition because MUAC exceeds 115 mm", "Severe stunting plus MAM; community care if stable"], "answer": 3, "explanation": "A child can have concurrent chronic and acute malnutrition. Closest distractor: Severity must be assigned separately to stunting and wasting. Why not the others: A. Endocrine short stature without nutritional concern — Low WHZ/MUAC and diet indicate current wasting.; B. SAM solely because HAZ is below −3 — Stunting alone is not SAM.; C. Normal nutrition because MUAC exceeds 115 mm — MUAC 123 mm is MAM range.", "pearl": "Longitudinal growth, infection and diet review are needed.", "srcAnswer": "D"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "A 10-month-old exclusively breastfed infant of a vegan mother has regression, Hb 8.9 g/dL, MCV 82 fL (near normal), high RDW and low ferritin. Which next step best avoids an exam trap?", "options": ["Diagnose autism without medical evaluation", "Exclude B12 deficiency because MCV is not elevated", "Treat only iron because ferritin is low", "Assess and treat B12 plus iron deficiency"], "answer": 3, "explanation": "Combined micronutrient deficits can normalize MCV by opposing red-cell size effects. Closest distractor: Normal MCV does not exclude neurologically important B12 deficiency. Why not the others: A. Diagnose autism without medical evaluation — Acquired regression warrants reversible-cause assessment.; B. Exclude B12 deficiency because MCV is not elevated — Concurrent microcytosis can mask macrocytosis.; C. Treat only iron because ferritin is low — Low ferritin does not explain regression and maternal vegan risk.", "pearl": "Check maternal/infant B12 and institute timely treatment.", "srcAnswer": "D"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "A 3-year-old with poor calcium intake and vitamin-D deficiency has Ca 8.6 mg/dL, P 2.6 mg/dL, high ALP and high PTH. Which pathophysiology is most coherent?", "options": ["Vitamin-A deficiency with rod dysfunction", "Primary renal phosphate wasting without PTH involvement", "Calcipenic rickets with secondary PTH-mediated phosphaturia", "Hypoparathyroidism with phosphate retention"], "answer": 2, "explanation": "Calcipenic rickets can show low phosphate because of secondary hyperparathyroidism. Closest distractor: Hypophosphatemia does not automatically mean XLH. Why not the others: A. Vitamin-A deficiency with rod dysfunction — Ocular vitamin-A disease does not explain the bone biochemical profile.; B. Primary renal phosphate wasting without PTH involvement — High PTH and dietary deficiency support calcipenic rather than isolated phosphopenic mechanism.; D. Hypoparathyroidism with phosphate retention — PTH is high, not low.", "pearl": "Treat vitamin D and ensure calcium adequacy; follow ALP/PTH and growth.", "srcAnswer": "C"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "An Indian clinic manages a 3-year-old with watery diarrhoea. A trainee cites WHO 2024 5 mg zinc; the clinic follows NHM 2025 programme. Best documented plan:", "options": ["Stop zinc because sources differ", "Automatically replace Indian protocol with 5 mg without documenting the change", "Give both 5 mg and 20 mg together", "NHM 20 mg ×14 days with ORS"], "answer": 3, "explanation": "Current guideline discordance should be named rather than hidden. Closest distractor: A conditional international recommendation is not identical to national implementation. Why not the others: A. Stop zinc because sources differ — Both frameworks recommend zinc as adjunct.; B. Automatically replace Indian protocol with 5 mg without documenting the change — This silently mixes guideline frameworks.; C. Give both 5 mg and 20 mg together — Combining doses is not a recommended reconciliation.", "pearl": "WHO 2024 lower dose is evidence-based; Indian NHM 2025 remains the operational local anchor.", "srcAnswer": "D"}, {"num": 78, "level": "Integrated/Rank-Differentiating", "question": "A 7-month-old born at 28 weeks is now 4 months corrected, has poor head control, and has been gaining poorly on expressed breast milk. Most appropriate combined approach:", "options": ["Optimize milk nutrition; reassess solids readiness", "Start solids solely because chronological age exceeds six months", "Ignore weight faltering until corrected age reaches six months", "Replace all human milk with water-thinned porridge"], "answer": 0, "explanation": "Growth intervention and readiness for oral solids are separate decisions. Closest distractor: Chronological-age eligibility does not override swallow/motor safety. Why not the others: B. Start solids solely because chronological age exceeds six months — Poor head control creates safety concerns and preterm timing is individualized.; C. Ignore weight faltering until corrected age reaches six months — Nutrition intervention should not wait for solids.; D. Replace all human milk with water-thinned porridge — This reduces nutrient density and increases feeding risk.", "pearl": "IAP 2026 explicitly notes uncertainty in preterm complementary-feeding timing.", "srcAnswer": "A"}, {"num": 79, "level": "Clinical/Application", "question": "During plasma glucose 38 mg/dL, an infant has suppressed β-hydroxybutyrate and free fatty acids. Plasma glucose rises by 36 mg/dL after glucagon. What mechanism is most supported?", "options": ["Fatty-acid oxidation defect", "Excess insulin action/hyperinsulinism", "Growth-hormone deficiency alone", "Isolated ketotic fasting hypoglycemia"], "answer": 1, "explanation": "Critical samples and glucagon response can diagnose excess insulin action even if insulin level is low. Closest distractor: Hypoketosis alone is insufficient; suppressed FFA adds specificity. Why not the others: A. Fatty-acid oxidation defect — FAOD generally shows high free fatty acids with low ketones.; C. Growth-hormone deficiency alone — This pattern is more specifically characteristic of insulin-mediated suppression.; D. Isolated ketotic fasting hypoglycemia — Ketones would typically be elevated.", "pearl": "Obtain critical sample during true hypoglycemia before correcting when feasible and safe.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q50"}}, {"num": 80, "level": "Integrated/Rank-Differentiating", "question": "A 4-year-old has chronic microcytosis, Hb 10 g/dL, RBC 6.0 million/µL, RDW 12%, ferritin 45 ng/mL and CRP normal. The child previously received adequate iron without Hb rise. Best next diagnostic move:", "options": ["Transfuse because any Hb below 11 requires blood", "Evaluate for thalassemia/hemoglobinopathy", "Treat presumed B12 deficiency because RBC is high", "Indefinitely double elemental iron dose"], "answer": 1, "explanation": "Use RBC count, RDW, Mentzer index and response to iron together. Closest distractor: Mentzer is not diagnostic by itself; confirmation is still needed. Why not the others: A. Transfuse because any Hb below 11 requires blood — Stable Hb 10 g/dL does not mandate transfusion.; C. Treat presumed B12 deficiency because RBC is high — B12 deficiency is typically macrocytic.; D. Indefinitely double elemental iron dose — This misses hemoglobinopathy and increases unnecessary exposure.", "pearl": "Hemoglobin electrophoresis/HPLC timing and recent transfusion history matter.", "srcAnswer": "B"}, {"num": 81, "level": "Integrated/Rank-Differentiating", "question": "A 2-year-old with prior SAM now has MUAC 126 mm, no edema for 3 weeks, good appetite and weight gain. However, household food insecurity and repeated infections persist. Best next step:", "options": ["Discharge with no growth checks because MUAC exceeds 125 mm", "Give high-dose vitamin A every week", "Restart F-75 for every recovered child", "Community follow-up and relapse prevention"], "answer": 3, "explanation": "SAM recovery is a transition to relapse prevention, not the end of care. Closest distractor: Anthropometric discharge criteria do not measure household food security. Why not the others: A. Discharge with no growth checks because MUAC exceeds 125 mm — Post-recovery follow-up is necessary.; B. Give high-dose vitamin A every week — This is not the national prophylaxis schedule and risks toxicity.; C. Restart F-75 for every recovered child — F-75 is for stabilization, not routine post-exit care.", "pearl": "Link to CMAM/Anganwadi, diet support, immunization and follow-up.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day14',label:'Day 14',set:'Quiz 5',href:'Day14/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day14_QuizSet5_Q66-81_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 14 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 66–81</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 14 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 14'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 14');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day14:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
