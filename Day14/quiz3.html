<script>
const quiz=[{"num": 34, "level": "Clinical/Application", "question": "A 10-month-old has missed the scheduled first vitamin-A dose. Under NHM routine prophylaxis, give:", "options": ["Give 200,000 IU now because the child is older than 9 months", "100,000 IU orally at the next eligible contact", "400 IU daily for a month", "Give 50,000 IU now and 200,000 IU six months later"], "answer": 1, "explanation": "Catch up the missed first vitamin-A prophylaxis dose using the correct age/programme context. Closest distractor: Do not apply later-dose strength to a delayed first encounter without programme rules. Why not the others: C. 400 IU daily for a month — That is neither the vitamin-A programme dose nor schedule.", "pearl": "Record prior dosing to avoid accidental duplication.", "srcAnswer": "B"}, {"num": 35, "level": "Clinical/Application", "question": "A preschool child presents with night blindness and dry conjunctiva. What is the priority?", "options": ["Treat as isolated refractive error", "Use topical antibiotic alone as definitive therapy", "Urgent therapeutic vitamin A and eye assessment", "Only schedule routine vitamin A six months later"], "answer": 2, "explanation": "Therapeutic xerophthalmia management is separate from routine national prophylaxis. Closest distractor: Conjunctival xerosis can precede corneal ulceration. Why not the others: A. Treat as isolated refractive error — Night blindness plus xerosis is a nutritional red flag.; B. Use topical antibiotic alone as definitive therapy — Topical care cannot replace systemic vitamin-A treatment.; D. Only schedule routine vitamin A six months later — Routine prophylaxis is inadequate for symptomatic deficiency.", "pearl": "Assess corneal involvement urgently and check nutritional risk.", "srcAnswer": "C"}, {"num": 36, "level": "Clinical/Application", "question": "A 10-month-old with bowed legs, wrist widening and radiographic cupping has low 25-OH vitamin D. IAP therapeutic daily cholecalciferol anchor is:", "options": ["2000 IU/day for 12 weeks", "50,000 IU every day", "400 IU/day as sole therapy", "3000 IU/day because every child receives the older-child dose"], "answer": 0, "explanation": "Treatment and prophylaxis must not be conflated. Closest distractor: Infant <1 year has a lower therapeutic daily dose than older children in IAP guidance. Why not the others: B. 50,000 IU every day — This is an excessive regimen with toxicity risk.; C. 400 IU/day as sole therapy — That is the routine prophylaxis dose, not the treatment regimen.; D. 3000 IU/day because every child receives the older-child dose — IAP separates under-one-year from older-child treatment doses.", "pearl": "Ensure adequate calcium intake and reassess clinical/biochemical response.", "srcAnswer": "A"}, {"num": 37, "level": "Clinical/Application", "question": "A 4-year-old has nutritional rickets with low 25-OH vitamin D. Which IAP 2021 daily treatment is most appropriate?", "options": ["2000 IU/day because all ages share the infant dose", "100,000 IU daily", "3000 IU/day for 12 weeks", "400 IU/day as treatment"], "answer": 2, "explanation": "IAP therapeutic vitamin D is age-stratified. Closest distractor: A 4-year-old is not in the <1-year treatment group. Why not the others: A. 2000 IU/day because all ages share the infant dose — The IAP therapeutic older-child anchor is 3000 IU/day.; B. 100,000 IU daily — This is far above recommended daily therapy.; D. 400 IU/day as treatment — This is infant prevention dosing.", "pearl": "Evaluate calcium adequacy and alternate etiologies if response is poor.", "srcAnswer": "C"}, {"num": 38, "level": "Clinical/Application", "question": "An infant at 60 hours has recurrent plasma glucose 48 mg/dL. A paper asks specifically for the Pediatric Endocrine Society timing for investigating persistent hypoglycemia, rather than the CPS transitional period. Which statement is accurate?", "options": ["Both PES and CPS use only 72 hours", "The 48-hour threshold is a glucose concentration in mg/dL", "PES persistent disorders begin only after 7 days", "PES persistent evaluation after 48 hours"], "answer": 3, "explanation": "PES and CPS are international named frameworks; India-specific clinical management remains separately specified. Closest distractor: Do not swap 48 h and 72 h between sources. Why not the others: A. Both PES and CPS use only 72 hours — PES and CPS differ in timing scope.; B. The 48-hour threshold is a glucose concentration in mg/dL — It is a time boundary, not a glucose value.; C. PES persistent disorders begin only after 7 days — This delays appropriate evaluation.", "pearl": "Use the source named in the stem; evaluate recurrent symptomatic low glucose urgently regardless.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 10 Q8"}}, {"num": 39, "level": "Clinical/Application", "question": "A 16-month-old with poor dietary iron has Hb 9.2 g/dL, MCV 66 fL and high RDW. Best initial approach:", "options": ["Start transfusion solely because Hb is 9.2 g/dL", "Therapeutic elemental iron plus diet review", "Give AMB twice-weekly prophylaxis as the only treatment", "Give folate alone"], "answer": 1, "explanation": "Therapeutic iron often uses ~3 mg/kg/day elemental iron in Indian programmatic algorithms. Closest distractor: A prevention schedule is not adequate therapy for established anemia. Why not the others: A. Start transfusion solely because Hb is 9.2 g/dL — No instability or severe anemia indication is given.; C. Give AMB twice-weekly prophylaxis as the only treatment — Programme prophylaxis is not the therapeutic regimen for diagnosed anemia.; D. Give folate alone — Folate deficiency generally causes macrocytosis.", "pearl": "Recheck response and adherence; consider thalassemia if response is inadequate.", "srcAnswer": "B"}, {"num": 40, "level": "Clinical/Application", "question": "A 2-year-old receives 3 mg/kg/day elemental iron and weighs 12 kg. Daily elemental iron is:", "options": ["36 mg elemental iron/day", "30 mg elemental iron/day", "3 mg/day", "48 mg elemental iron/day"], "answer": 0, "explanation": "Iron dose is expressed as elemental iron, not total salt mass. Closest distractor: A ferrous-salt tablet mass is not interchangeable with elemental-iron milligrams. Why not the others: C. 3 mg/day — This omits multiplication by weight.", "pearl": "Calculation: 12 × 3 = 36 mg/day elemental iron.", "srcAnswer": "A"}, {"num": 41, "level": "Clinical/Application", "question": "A child with microcytosis has normal/high RBC count, normal RDW and minimal Hb response after verified iron treatment. Consider:", "options": ["Isolated vitamin-B12 deficiency", "Acute hemolytic crisis as sole explanation", "Thalassemia trait with hemoglobin analysis when appropriate", "Continue indefinite escalating iron without reassessment"], "answer": 2, "explanation": "Iron deficiency and thalassemia trait both cause microcytosis but differ in RBC/RDW patterns. Closest distractor: A trial of iron without response should not become endless treatment. Why not the others: A. Isolated vitamin-B12 deficiency — B12 deficiency usually gives macrocytic/megaloblastic patterns.; B. Acute hemolytic crisis as sole explanation — The chronic stable microcytosis pattern is not typical of acute hemolysis.; D. Continue indefinite escalating iron without reassessment — Lack of response requires diagnostic reconsideration.", "pearl": "Check adherence, inflammation, lead exposure and hemoglobinopathy.", "srcAnswer": "C"}, {"num": 42, "level": "Clinical/Application", "question": "An 11-month-old has developmental regression, hypotonia, macrocytosis and a mother with strict vegan diet without supplementation. Most likely deficiency:", "options": ["Vitamin A deficiency", "Iodine excess", "Isolated iron deficiency", "Vitamin B12 deficiency"], "answer": 3, "explanation": "B12 deficiency can cause potentially irreversible neurologic damage if delayed. Closest distractor: Regression is not a benign developmental variant. Why not the others: A. Vitamin A deficiency — Vitamin A primarily causes ocular epithelial and visual symptoms.; B. Iodine excess — This history and macrocytosis do not point to iodine excess.; C. Isolated iron deficiency — Iron deficiency typically produces microcytosis and not this characteristic regression.", "pearl": "Assess infant and maternal status and initiate indicated treatment promptly.", "srcAnswer": "D"}, {"num": 43, "level": "Clinical/Application", "question": "A village has high goitre prevalence despite families reporting use of salt stored open near a stove. Most appropriate preventive response:", "options": ["Give all children lifelong thyroxine without tests", "Stop newborn thyroid screening", "Check household salt iodine and storage", "Assume goitre must be autoimmune"], "answer": 2, "explanation": "Universal salt iodization requires both production and household-level quality. Closest distractor: Self-reported salt use is not equivalent to adequate iodine content. Why not the others: A. Give all children lifelong thyroxine without tests — Universal thyroid hormone treatment is not appropriate.; B. Stop newborn thyroid screening — Salt prevention cannot detect all congenital thyroid disease.; D. Assume goitre must be autoimmune — Population clustering suggests environmental iodine insufficiency.", "pearl": "Indian iodine target is ≥15 ppm at consumer level.", "srcAnswer": "C"}, {"num": 44, "level": "Clinical/Application", "question": "A 4-month-old with diarrhoea is treated under NHM STOP Diarrhoea 2025. Correct zinc schedule:", "options": ["No zinc because age is below six months", "5 mg daily because all international and Indian guidelines agree", "10 mg elemental zinc daily for 14 days", "20 mg daily for 14 days"], "answer": 2, "explanation": "For 2–<6 months, Indian 2025 programme uses 10 mg daily ×14 days. Closest distractor: WHO 2024 conditional 5 mg is a different source framework. Why not the others: A. No zinc because age is below six months — India recommends zinc from two months onward.; B. 5 mg daily because all international and Indian guidelines agree — WHO 2024 has a lower conditional suggestion, but India 2025 retains 10 mg here.; D. 20 mg daily for 14 days — This is the Indian dose for ages six months to five years.", "pearl": "Always continue breastfeeding and oral rehydration as appropriate.", "srcAnswer": "C"}, {"num": 45, "level": "Clinical/Application", "question": "An 18-month-old has WHZ −3.2 and MUAC 126 mm, no edema. Classification:", "options": ["SAM based on WHZ", "MAM because MUAC is above 125 mm", "SAM only when WHZ is below −3 and MUAC below 115 mm", "No acute malnutrition because oedema is absent"], "answer": 0, "explanation": "MUAC and WHZ may disagree; either SAM threshold suffices. Closest distractor: Do not average conflicting anthropometric criteria.", "pearl": "Assess medical complications and appetite to choose care level.", "srcAnswer": "A"}, {"num": 46, "level": "Clinical/Application", "question": "A child has weight-for-age z −3.1 but WHZ −1.1 and HAZ −3.2. Best interpretation:", "options": ["Severe underweight and stunting, not wasting", "MAM because HAZ is below −3", "Normal because WHZ is normal", "SAM because WAZ is below −3"], "answer": 0, "explanation": "WAZ cannot distinguish wasting from stunting. Closest distractor: Severe underweight does not automatically equal SAM. Why not the others: B. MAM because HAZ is below −3 — MAM is defined by WHZ/MUAC, not HAZ.; C. Normal because WHZ is normal — Severe stunting and underweight are important abnormalities.; D. SAM because WAZ is below −3 — Weight-for-age alone does not diagnose SAM.", "pearl": "Interpret the full growth profile, not a single number.", "srcAnswer": "A"}, {"num": 47, "level": "Clinical/Application", "question": "A stable 7-kg child with uncomplicated SAM has passed the appetite test and no danger signs. Indian IAP 2026 pathway favors:", "options": ["Immediate IV antibiotics and saline in all cases", "Mandatory prolonged inpatient admission for every SAM child", "No follow-up until a year has passed", "Supervised community rehabilitation and follow-up"], "answer": 3, "explanation": "Disposition follows risk assessment, not the SAM label alone. Closest distractor: Good appetite is meaningful only after a full medical assessment. Why not the others: A. Immediate IV antibiotics and saline in all cases — Uncomplicated SAM does not automatically need inpatient IV therapy.; B. Mandatory prolonged inpatient admission for every SAM child — IAP stratifies by complications and appetite.; C. No follow-up until a year has passed — Regular weight and clinical monitoring are essential.", "pearl": "Escalate for weight loss, new edema, poor intake or medical complications.", "srcAnswer": "D"}, {"num": 48, "level": "Clinical/Application", "question": "A malnourished child on prolonged high-dose zinc has anemia, neutropenia and impaired gait. Which additional test is most informative?", "options": ["Only serum vitamin A", "Only thyroid antibodies", "Serum copper and ceruloplasmin with clinical context", "Only fasting insulin"], "answer": 2, "explanation": "Copper deficiency is a recognized iatrogenic complication of excess zinc. Closest distractor: Low copper is not simply another marker of iron deficiency. Why not the others: A. Only serum vitamin A — Vitamin A deficiency does not explain the zinc-copper interaction.; B. Only thyroid antibodies — The exposure pattern does not primarily suggest autoimmune thyroiditis.; D. Only fasting insulin — Insulin physiology is unrelated to this presentation.", "pearl": "Avoid indiscriminate high-dose micronutrient therapy.", "srcAnswer": "C"}, {"num": 49, "level": "Clinical/Application", "question": "A 14-month-old drops weight-for-age z score from −0.4 to −1.7 over four months, but current weight is above −2. Best action:", "options": ["Reassure solely because current z score exceeds −2", "Begin growth hormone without evaluation", "Evaluate serial growth faltering and feeding", "Diagnose SAM from WAZ alone"], "answer": 2, "explanation": "Serial growth trajectory can be abnormal before crossing −2 SD. Closest distractor: Single-visit thresholds and growth velocity answer different questions. Why not the others: A. Reassure solely because current z score exceeds −2 — A falling trajectory can signal early disease.; B. Begin growth hormone without evaluation — Weight faltering needs nutritional and medical assessment first.; D. Diagnose SAM from WAZ alone — SAM requires WHZ, MUAC or edema criteria.", "pearl": "Review intake, illness, feeding behavior and family factors.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day14',label:'Day 14',set:'Quiz 3',href:'Day14/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day14_QuizSet3_Q34-49_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 14 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 34–49</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 14 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 14'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 14');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day14:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
