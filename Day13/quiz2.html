@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<h1>Day 13 — Quiz 2</h1>
<div class="sub">Questions 17–32 · 16 MCQs · +4 correct / −1 wrong</div>

<script>
const quiz=[{"num": 17, "level": "Conceptual", "question": "Which finding best supports a specific learning disorder rather than intellectual disability?", "options": ["Deficits across conceptual, social and practical adaptive domains", "Generalized delay from infancy across multiple domains", "Progressive loss of acquired cognitive abilities", "Persistent reading difficulty with otherwise age-appropriate adaptive skills"], "answer": 3, "explanation": "Academic achievement and adaptive functioning must be assessed separately. Closest distractor: SLD versus ID is not simply an IQ score cutoff. Why not the others: A. Deficits across conceptual, social and practical adaptive domains — Broad adaptive deficits are central to intellectual disability.; B. Generalized delay from infancy across multiple domains — Multiple early delays suggest GDD/ID.; C. Progressive loss of acquired cognitive abilities — Progressive loss suggests neuroregression.", "pearl": "Document reading, writing and mathematics individually.", "srcAnswer": "D"}, {"num": 18, "level": "Conceptual", "question": "Which sleep-history feature favours NREM sleep terror over nightmare?", "options": ["Vivid remembered dream late in night", "Fully alert child immediately describing dream", "Consistent late-night REM-associated awakening", "Confusion, autonomic activation and poor recall early in night"], "answer": 3, "explanation": "Time of night, arousability and recall separate parasomnias. Closest distractor: Sleep terror versus nightmare is an exam classic. Why not the others: A. Vivid remembered dream late in night — Nightmares are typically remembered and REM-related.; B. Fully alert child immediately describing dream — Clear dream recall favours nightmare.; C. Consistent late-night REM-associated awakening — Late REM timing favours nightmare.", "pearl": "Recurrent stereotyped episodes may instead indicate nocturnal epilepsy.", "srcAnswer": "D"}, {"num": 19, "level": "Conceptual", "question": "Why is actigraphy insufficient to establish obstructive sleep apnoea?", "options": ["It is the definitive test for nocturnal hypoventilation", "It estimates rest/activity, not respiratory events and sleep physiology reliably", "It directly measures obstructive apnoea–hypopnoea index", "It replaces airflow and respiratory effort sensors"], "answer": 1, "explanation": "Actigraphy is an adjunct for sleep patterns, not PSG replacement. Closest distractor: Actigraphy versus PSG is an instrumentation discriminator. Why not the others: A. It is the definitive test for nocturnal hypoventilation — CO2/ventilation assessment needs other monitoring.; C. It directly measures obstructive apnoea–hypopnoea index — AHI requires respiratory scoring, usually polysomnography.; D. It replaces airflow and respiratory effort sensors — Respiratory sensors are absent in standard actigraphy.", "pearl": "Match a test to the physiological variable it actually measures.", "srcAnswer": "B"}, {"num": 20, "level": "Conceptual", "question": "A 9-year-old has height 130 cm, weight 42 kg and progressive crossing downward of height centiles. Which is the most useful next concept?", "options": ["Assume tall final height because weight is high", "Wait until age 18 for adult-height assessment", "Serial height velocity and pubertal/target-height context", "Single BMI measurement as a complete explanation"], "answer": 2, "explanation": "Interpret relative weight and linear trajectory jointly. Closest distractor: Short stature with rising adiposity is a red flag, not reassurance. Why not the others: A. Assume tall final height because weight is high — High weight does not guarantee linear growth.; B. Wait until age 18 for adult-height assessment — Delayed assessment can miss treatable endocrine disease.; D. Single BMI measurement as a complete explanation — BMI alone cannot explain falling height centiles.", "pearl": "Crossing centiles is often more informative than absolute centile.", "srcAnswer": "C"}, {"num": 21, "level": "Conceptual", "question": "A child with new developmental regression has abnormal language and motor skills. What is the priority distinction?", "options": ["Loss of attained skills warrants etiologic workup rather than watchful waiting", "Regression is normal if the child was premature", "Speech regression is always autism without alternatives", "A normal early neonatal scan excludes neurologic causes"], "answer": 0, "explanation": "Regression is different from failure to acquire. Closest distractor: Static developmental delay versus regression changes urgency and testing. Why not the others: B. Regression is normal if the child was premature — Prematurity correction does not explain true loss.; C. Speech regression is always autism without alternatives — ASD is one possibility, not the only one.; D. A normal early neonatal scan excludes neurologic causes — Earlier imaging cannot exclude evolving pathology.", "pearl": "Document exactly what was lost and when.", "srcAnswer": "A"}, {"num": 22, "level": "Clinical/Application", "question": "An 18-month-old has weight-for-age SDS −2.5, height SDS −0.4 and 3 months of poor weight gain after frequent diluted milk feeds. No chronic diarrhoea or systemic signs. Best initial action?", "options": ["Verify intake and feeding technique; provide targeted nutrition with close remeasurement", "Order GH stimulation test before feeding review", "Start empirical long-term antibiotics", "Label familial short stature"], "answer": 0, "explanation": "Growth faltering is a trajectory diagnosis, often from inadequate intake. Closest distractor: Weight-first versus height-first faltering guides initial workup. Why not the others: B. Order GH stimulation test before feeding review — GH testing is inappropriate when height is preserved.; C. Start empirical long-term antibiotics — No infection evidence supports antibiotics.; D. Label familial short stature — Height is not short and familial stature is unrelated.", "pearl": "IAP suggests monitoring response after focused intervention, often 4–8 weeks.", "srcAnswer": "A"}, {"num": 23, "level": "Clinical/Application", "question": "A 6-year-old boy measures 109 cm, then 112 cm 12 months later. His BMI rose from 70th to 90th centile. Best next step?", "options": ["Assure parents because BMI increased", "Diagnose isolated malnutrition", "Use an adult BMI cutoff to classify his obesity", "Evaluate endocrine causes of reduced height velocity"], "answer": 3, "explanation": "Growth velocity of 3 cm/year after age 4 is concerning. Closest distractor: Endocrine growth failure may coexist with adiposity. Why not the others: A. Assure parents because BMI increased — Weight gain does not normalize poor height velocity.; B. Diagnose isolated malnutrition — Isolated caloric deficit usually reduces weight.; C. Use an adult BMI cutoff to classify his obesity — Adult BMI cutoffs are not used directly in a child.", "pearl": "Investigate thyroid and other causes guided by exam and growth records.", "srcAnswer": "D"}, {"num": 24, "level": "Clinical/Application", "question": "A 10-year-old girl has height SDS −2.7, normal growth velocity 5.6 cm/year, maternal height 148 cm and paternal height 160 cm. Bone age equals age. Most likely?", "options": ["Active celiac disease", "Untreated GH deficiency", "Familial short stature", "Constitutional delay"], "answer": 2, "explanation": "Assess growth pattern and target height together. Closest distractor: Normal velocity and bone age argue against active endocrine failure. Why not the others: A. Active celiac disease — Celiac often impairs weight/velocity, though screening may still be considered.; B. Untreated GH deficiency — GH deficiency more often reduces velocity.; D. Constitutional delay — Constitutional delay generally delays bone age.", "pearl": "Height <−2 SDS still merits context and red-flag review.", "srcAnswer": "C"}, {"num": 25, "level": "Clinical/Application", "question": "A 12-year-old boy is below the 3rd height centile, has bone age 9 years, velocity 5.4 cm/year, no puberty and a father who entered puberty late. Most likely?", "options": ["Constitutional delay of growth and puberty", "Familial short stature", "Acquired hypothyroidism", "Skeletal dysplasia"], "answer": 0, "explanation": "Delayed bone age alone is not proof of pathology. Closest distractor: Familial vs constitutional variants differ chiefly in skeletal maturity and pubertal timing. Why not the others: B. Familial short stature — Familial short stature usually has bone age near age.; C. Acquired hypothyroidism — Hypothyroidism generally causes reduced velocity and symptoms.; D. Skeletal dysplasia — Skeletal dysplasia usually alters proportions.", "pearl": "Follow velocity and predicted height over time.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "A 3-year-old with chronic diarrhoea and poor appetite has weight SDS −3.0 and height SDS −2.2. What is the strongest explanation of pattern?", "options": ["Physiologic pubertal delay", "Chronic systemic/nutritional disease affecting both weight and linear growth", "Isolated growth hormone deficiency", "Simple familial short stature"], "answer": 1, "explanation": "Combined faltering suggests chronic disease or prolonged undernutrition. Closest distractor: Endocrine isolated height fall versus systemic weight-and-height fall. Why not the others: A. Physiologic pubertal delay — Pubertal delay is irrelevant at age 3.; C. Isolated growth hormone deficiency — GH deficiency typically preserves relative weight.; D. Simple familial short stature — Familial stature does not cause marked weight loss/diarrhoea.", "pearl": "Investigate celiac and chronic gastrointestinal causes as indicated.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical/Application", "question": "A 5-year-old has height −2.5 SDS, obesity and delayed bone age. Examination shows dry skin and bradycardia. Best screening laboratory test?", "options": ["Stool reducing substances alone", "Serum GH at a random time", "Urine ketones alone", "Serum TSH and free T4"], "answer": 3, "explanation": "Endocrine phenotype plus low velocity requires targeted thyroid testing. Closest distractor: Random GH concentration is not a GH-deficiency screen. Why not the others: A. Stool reducing substances alone — Stool testing does not address bradycardia and slowed height.; B. Serum GH at a random time — Random GH is pulsatile and non-diagnostic.; C. Urine ketones alone — Urine ketones do not evaluate thyroid function.", "pearl": "Look for hypothyroidism when weight rises but height stalls.", "srcAnswer": "D"}, {"num": 28, "level": "Clinical/Application", "question": "An 8-year-old with short stature has arm span far below height and short proximal limbs. Which first diagnostic direction is most appropriate?", "options": ["Diagnose constitutional delay without bone age", "Evaluate disproportionate skeletal dysplasia", "Assume familial short stature from low height alone", "Start dietary calorie supplementation as sole therapy"], "answer": 1, "explanation": "Body proportions alter the diagnostic branch. Closest distractor: Disproportion versus proportionate short stature is a high-value discriminator. Why not the others: A. Diagnose constitutional delay without bone age — Constitutional delay needs bone age/puberty context.; C. Assume familial short stature from low height alone — Familial short stature is generally proportionate.; D. Start dietary calorie supplementation as sole therapy — Calories do not explain limb disproportion.", "pearl": "Record sitting-height/height ratio and limb segment lengths.", "srcAnswer": "B"}, {"num": 29, "level": "Clinical/Application", "question": "A 30-week infant has 8% physiological weight loss by day 3, adequate urine output and serum sodium 142 mmol/L. Which principle is best?", "options": ["Early extracellular fluid contraction and natriuresis are expected; individualize sodium to trend", "Give routine large sodium boluses to prevent all weight loss", "Assume all early weight loss is dehydration", "Newborn kidneys cannot excrete sodium"], "answer": 0, "explanation": "Interpret weight, urine output and sodium together. Closest distractor: Physiological natriuresis versus pathological sodium depletion differs by clinical trajectory. Why not the others: B. Give routine large sodium boluses to prevent all weight loss — Sodium boluses without indication risk harm.; C. Assume all early weight loss is dehydration — Physiologic weight loss is not automatically dehydration.; D. Newborn kidneys cannot excrete sodium — Neonatal kidneys can excrete sodium, though regulation is immature.", "pearl": "Do not treat a percentage alone without assessing the infant.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 10 Q15"}}, {"num": 30, "level": "Clinical/Application", "question": "An infant born at 32 weeks is seen at chronological age 10 months. Gross-motor milestones correspond to 8 months. What is the best interpretation?", "options": ["Corrected age is about 8 months, so assess against that age", "Motor delay is confirmed at chronological 10 months", "Corrected age is 12 months", "Age correction is used only for feeding"], "answer": 0, "explanation": "10 months − 8 weeks ≈ 8 months. Closest distractor: Use corrected age, but still assess qualitative neurologic signs. Why not the others: B. Motor delay is confirmed at chronological 10 months — Chronological-only comparison overestimates delay.; C. Corrected age is 12 months — Prematurity correction subtracts, not adds.; D. Age correction is used only for feeding — Corrected age is used for growth and developmental assessment.", "pearl": "True regression or asymmetry remains abnormal even with age correction.", "srcAnswer": "A"}, {"num": 31, "level": "Clinical/Application", "question": "A 9-month-old cannot sit independently, has scissoring, persistent primitive reflexes and asymmetric hand use. Next best step?", "options": ["Diagnose isolated expressive-language delay", "Use only a hearing test and discharge", "Early developmental-neurologic assessment and intervention referral", "Wait until 18 months because sitting is variable"], "answer": 2, "explanation": "Qualitative neurologic abnormalities outweigh one milestone age. Closest distractor: Delay plus spasticity differs from benign late sitting. Why not the others: A. Diagnose isolated expressive-language delay — The principal deficits are motor/tone, not language.; B. Use only a hearing test and discharge — Hearing is useful but insufficient.; D. Wait until 18 months because sitting is variable — Waiting ignores qualitative neurological red flags.", "pearl": "Early intervention should not await a final CP label.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical/Application", "question": "A 15-month-old has no pointing to share interest, no response to name, lines up toys and says no meaningful words. Best next step?", "options": ["Reassure until school age", "Diagnose isolated speech sound disorder", "Treat with stimulant for hyperactivity", "Autism-focused screening plus hearing and developmental referral"], "answer": 3, "explanation": "Poor joint attention plus restricted behaviour increases ASD concern. Closest distractor: Hearing evaluation remains necessary even when ASD is suspected. Why not the others: A. Reassure until school age — Delaying intervention is inappropriate.; B. Diagnose isolated speech sound disorder — Isolated speech sound disorder does not explain joint-attention deficits.; C. Treat with stimulant for hyperactivity — Stimulants do not address this toddler phenotype.", "pearl": "Screening supports but does not replace specialist diagnosis.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day13',label:'Day 13',set:'Quiz 2',href:'Day13/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day13_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 13 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 13 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 13'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 13');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day13:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9225e42b"></script></body></html>
