@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<h1>Day 13 — Quiz 5</h1>
<div class="sub">Questions 65–79 · 15 MCQs · +4 correct / −1 wrong</div>

<script>
const quiz=[{"num": 65, "level": "High-Difficulty", "question": "A 2-year-old has height −2.5 SDS and weight-for-height z score +1.8 with delayed milestones and coarse facies. Which next step is most rational?", "options": ["Evaluate syndromic/metabolic and endocrine causes, not simple calorie deficiency", "Start empiric nutritional rehabilitation and defer genetic workup until weight falls", "Use a familial short-stature diagnosis unless height velocity falls further", "Investigate only hypothyroidism because it explains all dysmorphic findings"], "answer": 0, "explanation": "Developmental phenotype changes the short-stature differential. Closest distractor: Short stature plus developmental delay differs from isolated low height. Why not the others: B. Start empiric nutritional rehabilitation and defer genetic workup until weight falls — Relative weight is not low; dysmorphism and developmental delay are independent red flags.; C. Use a familial short-stature diagnosis unless height velocity falls further — Familial stature does not explain coarse facies and delay even with stable velocity.; D. Investigate only hypothyroidism because it explains all dysmorphic findings — Thyroid evaluation may be useful but cannot alone explain the full syndromic phenotype.", "pearl": "Examine organomegaly, joints and family history.", "srcAnswer": "A"}, {"num": 66, "level": "High-Difficulty", "question": "An 8-year-old with school difficulties has IQ testing in normal range, impaired reading fluency and poor classroom behaviour. What is the best next plan?", "options": ["Provide generic tutoring alone without assessing phonological decoding or sleep", "Assess SLD plus attention, sleep and psychosocial factors, then tailor supports", "Treat presumed ADHD first and defer reading-specific assessment until medication response", "Interpret the normal cognitive score as excluding a specific learning disorder"], "answer": 1, "explanation": "Academic assessment must separate learning process from attention and environment. Closest distractor: SLD versus ADHD is not either/or. Why not the others: A. Provide generic tutoring alone without assessing phonological decoding or sleep — Unstructured tutoring does not replace targeted assessment and evidence-based remediation.; C. Treat presumed ADHD first and defer reading-specific assessment until medication response — ADHD may coexist with SLD; delaying reading evaluation risks missed remediation.; D. Interpret the normal cognitive score as excluding a specific learning disorder — Normal IQ is compatible with domain-specific SLD.", "pearl": "Use structured reading intervention with classroom accommodations.", "srcAnswer": "B"}, {"num": 67, "level": "High-Difficulty", "question": "A former preterm child has delayed independent walking at corrected age 17 months, normal tone, no asymmetry and progressive acquisition of skills. What is best?", "options": ["Reassure indefinitely without examining the child", "Ignore corrected age entirely", "Perform focused developmental evaluation and follow-up without presuming cerebral palsy", "Diagnose spastic diplegia from delayed walking alone"], "answer": 2, "explanation": "A milestone delay is a sign, not an etiologic diagnosis. Closest distractor: Delayed walking with normal examination differs from spastic motor phenotype. Why not the others: A. Reassure indefinitely without examining the child — No evaluation misses treatable causes.; B. Ignore corrected age entirely — Corrected age is relevant in the first 2 years.; D. Diagnose spastic diplegia from delayed walking alone — CP diagnosis requires characteristic neurologic signs.", "pearl": "Check hip stability, muscle strength and global development.", "srcAnswer": "C"}, {"num": 68, "level": "High-Difficulty", "question": "A 4-year-old has obesity and low height velocity; GH-axis tests were drawn during severe malnutrition recovery and IGF-1 is low. Which statement is most accurate?", "options": ["IGF-1 is nutrition-sensitive and should not alone establish GH deficiency", "Low IGF-1 proves pituitary GH deficiency", "Normal BMI excludes malnutrition history", "Bone age is irrelevant to evaluation"], "answer": 0, "explanation": "Biochemical markers require physiologic context. Closest distractor: Low IGF-1 in malnutrition versus true GHD needs careful interpretation. Why not the others: B. Low IGF-1 proves pituitary GH deficiency — IGF-1 alone is insufficient to diagnose GHD.; C. Normal BMI excludes malnutrition history — BMI now does not erase recent undernutrition.; D. Bone age is irrelevant to evaluation — Bone age provides maturation context.", "pearl": "Correct systemic/nutritional confounders before specialized testing.", "srcAnswer": "A"}, {"num": 69, "level": "High-Difficulty", "question": "A 9-year-old has obesity, snoring and academic decline; PSG confirms OSA. After adenotonsillectomy, symptoms improve but daytime inattention persists in two settings. Next best approach?", "options": ["Reassess residual OSA and independent ADHD/learning comorbidity", "Conclude ADHD is impossible because OSA existed", "Prescribe stimulant without reassessing sleep", "Assume all OSA is cured by surgery"], "answer": 0, "explanation": "Treating one contributor may unmask another. Closest distractor: OSA resolution versus residual neurobehavioural impairment requires reassessment. Why not the others: B. Conclude ADHD is impossible because OSA existed — One diagnosis does not exclude another.; C. Prescribe stimulant without reassessing sleep — Residual sleep problems should be reviewed.; D. Assume all OSA is cured by surgery — Residual OSA is more likely with obesity and other risk factors.", "pearl": "Follow-up PSG may be appropriate in high-risk children.", "srcAnswer": "A"}, {"num": 70, "level": "High-Difficulty", "question": "A 5-year-old has height at 1st centile and normal velocity 5.7 cm/year; parental target is much higher and she has dysmorphic features. What is best?", "options": ["Start GH without diagnosis", "Investigate despite normal velocity because genetic target and phenotype are discordant", "Label familial short stature solely from normal velocity", "Wait until puberty for all evaluation"], "answer": 1, "explanation": "Height must be interpreted relative to genetics and phenotype. Closest distractor: Normal velocity is reassuring only when the whole picture is concordant. Why not the others: A. Start GH without diagnosis — GH needs indication and workup.; C. Label familial short stature solely from normal velocity — Family target is not consistent with familial shortness.; D. Wait until puberty for all evaluation — Delay risks missing Turner or other syndromes.", "pearl": "Consider karyotype in girls with unexplained short stature.", "srcAnswer": "B"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "A 6-year-old girl has height 107 cm, up from 105 cm 12 months earlier, weight rose from 23 to 27 kg, target height 162 cm, bone age 4.5 years, and TSH 62 mIU/L with low free T4. Which sequence is best?", "options": ["Start GH first because bone age is delayed", "Treat obesity only and remeasure after 2 years", "Treat primary hypothyroidism and monitor catch-up growth; reassess remaining shortness later", "Diagnose constitutional delay and defer therapy"], "answer": 2, "explanation": "Biochemical specificity outweighs nonspecific delayed bone age. Calculation worked:  Height velocity = (107 − 105) cm × 12/12 months = 2 cm/year; this is well below expected prepubertal ~5–6 cm/year. Trap: rising weight is not evidence of normal linear growth. Closest distractor: Primary thyroid disease must be corrected before interpreting persistent GH-axis concerns. Why not the others: A. Start GH first because bone age is delayed — GH is not first-line in untreated hypothyroidism.; B. Treat obesity only and remeasure after 2 years — Obesity counselling alone leaves endocrine disease untreated.; D. Diagnose constitutional delay and defer therapy — Constitutional delay cannot explain severe thyroid dysfunction.", "pearl": "Recheck thyroid function and serial velocity after levothyroxine.", "srcAnswer": "C"}, {"num": 72, "level": "Clinical/Application", "question": "A neonate with plasma glucose 32 mg/dL has BOHB 0.2 mmol/L, suppressed free fatty acids and glucose rises by 38 mg/dL after glucagon. Insulin is below assay detection. Best inference?", "options": ["The undetectable insulin excludes hyperinsulinism", "Excess insulin action is still strongly supported", "Fatty-acid oxidation defect is most likely because FFA are suppressed", "Ketotic hypoglycaemia is established"], "answer": 1, "explanation": "Assess metabolic effect of insulin, not only the immunoassay concentration. Closest distractor: Hypoketotic low-FFA versus hypoketotic high-FFA separates HI from FAOD. Why not the others: A. The undetectable insulin excludes hyperinsulinism — Insulin may be undetectable despite biologic excess action.; C. Fatty-acid oxidation defect is most likely because FFA are suppressed — FAOD generally shows elevated FFA despite low ketones.; D. Ketotic hypoglycaemia is established — Ketotic hypoglycemia should have increased ketones.", "pearl": "A ≥30 mg/dL glucagon rise supports insulin-mediated hypoglycemia.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q50"}}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "A 24-month-old ex-29-week infant has poor expressive language, reduced response to name, no pointing, repetitive spinning and a history of neonatal IVH. Which assessment is most defensible?", "options": ["Correct age where relevant, obtain hearing test, autism/developmental evaluation and neurologic assessment", "Attribute all deficits to prematurity and wait", "Diagnose ASD solely from IVH history", "Treat as isolated speech delay because walking is normal"], "answer": 0, "explanation": "Avoid single-cause attribution in high-risk follow-up. Closest distractor: Prematurity, hearing impairment and ASD may coexist. Why not the others: B. Attribute all deficits to prematurity and wait — Prematurity does not explain away social-communication signs.; C. Diagnose ASD solely from IVH history — IVH is a risk factor, not an ASD diagnosis.; D. Treat as isolated speech delay because walking is normal — Normal walking does not exclude social/communication disorders.", "pearl": "Start early supports before final diagnostic labels.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "A 9-year-old with learning decline, obesity, snoring and inattention has PSG obstructive AHI 12/hour, normal cognition and impaired phonological decoding. Which combined plan is best?", "options": ["Address OSA and provide specific reading intervention; reassess attention after sleep treatment", "Treat OSA first, then defer reading remediation until repeat PSG shows complete resolution", "Treat dyslexia first because phonological deficits fully explain sleep fragmentation", "Start ADHD medication alone and observe whether both reading and OSA resolve"], "answer": 0, "explanation": "Multiple verified contributors require parallel management. Closest distractor: OSA can exacerbate attention, but does not explain phonological decoding deficit completely. Why not the others: B. Treat OSA first, then defer reading remediation until repeat PSG shows complete resolution — Parallel reading remediation is needed; waiting for repeat PSG delays academic care.; C. Treat dyslexia first because phonological deficits fully explain sleep fragmentation — Dyslexia cannot explain PSG-confirmed OSA or daytime respiratory symptoms.; D. Start ADHD medication alone and observe whether both reading and OSA resolve — Stimulants do not correct obstructive breathing or reading decoding deficits.", "pearl": "Track school function after airway treatment and remediation.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "A 13-year-old boy is 138 cm, gained 4.8 cm over 12 months, has bone age 10 years, no pubertal development, father had puberty at 16, but ESR is 68 and chronic diarrhoea is present. Best interpretation?", "options": ["Short stature is always genetic when father was late", "Investigate inflammatory/malabsorptive disease before attributing to constitutional delay", "Constitutional delay is confirmed by family history", "GH deficiency is proven by bone age"], "answer": 1, "explanation": "Red flags trump a plausible benign growth variant. Closest distractor: Constitutional delay versus chronic inflammatory disease share delayed bone age. Why not the others: A. Short stature is always genetic when father was late — Genetics does not eliminate acquired disease.; C. Constitutional delay is confirmed by family history — Late-puberty history does not explain ESR and diarrhoea.; D. GH deficiency is proven by bone age — Delayed bone age is nonspecific.", "pearl": "Evaluate GI/inflammatory causes and growth consequences.", "srcAnswer": "B"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "A 4-year-old born SGA remains height SDS −2.8, has not shown catch-up, normal thyroid studies and no chronic disease; BMI is normal. What is the best next step?", "options": ["Refer for specialist assessment of persistent SGA short stature and possible GH eligibility", "Observe until age 6 because normal thyroid results predict eventual catch-up", "Initiate GH treatment without specialist evaluation because height is below −2 SDS", "Increase calories aggressively because weight-for-height is normal and linear growth will follow"], "answer": 0, "explanation": "Timing of catch-up is central to SGA follow-up. Closest distractor: Most SGA catch up by 2 years; persistent deficit at 3–4 years is different. Why not the others: B. Observe until age 6 because normal thyroid results predict eventual catch-up — Catch-up is expected in most by age 2, so age 4 persistence deserves evaluation.; C. Initiate GH treatment without specialist evaluation because height is below −2 SDS — GH is not automatic: assess criteria, alternative causes and family context.; D. Increase calories aggressively because weight-for-height is normal and linear growth will follow — Overfeeding may increase metabolic risk and does not reliably correct linear deficit.", "pearl": "GH consideration is specialist- and eligibility-dependent.", "srcAnswer": "A"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "An 8-year-old boy has short stature, obesity, academic difficulty, daytime sleepiness, and severe snoring. His height velocity is 3 cm/year and PSG confirms OSA. What should not be missed?", "options": ["OSA alone explains the reduced height velocity, so defer endocrine evaluation", "Prioritize a diagnosis of ADHD and postpone the confirmed respiratory disorder", "Apply adult BMI cutoffs before deciding whether linear growth needs investigation", "Concurrent endocrine growth disorder while treating OSA and learning issues"], "answer": 3, "explanation": "Avoid diagnostic overshadowing when several real disorders coexist. Closest distractor: A PSG-confirmed disorder does not close the short-stature differential. Why not the others: A. OSA alone explains the reduced height velocity, so defer endocrine evaluation — OSA can affect growth, but 3 cm/year with adiposity warrants parallel endocrine review.; B. Prioritize a diagnosis of ADHD and postpone the confirmed respiratory disorder — Confirmed OSA needs care; ADHD alone cannot explain poor linear growth.; C. Apply adult BMI cutoffs before deciding whether linear growth needs investigation — IAP requires age-specific BMI curves; direct adult BMI thresholds are inappropriate.", "pearl": "Coordinate endocrine, sleep and educational care.", "srcAnswer": "D"}, {"num": 78, "level": "Integrated/Rank-Differentiating", "question": "A 20-month-old has weight-for-age −2.4 SDS, height-for-age −1.0 SDS, poor intake, delayed speech and recurrent otitis media. Social play is good. Best initial coordinated plan?", "options": ["Complete nutritional rehabilitation first and defer hearing evaluation until weight normalizes", "Treat recurrent otitis alone and postpone language assessment because social play is preserved", "Investigate endocrine short stature first despite near-normal height-for-age SDS", "Nutritional rehabilitation, hearing assessment and language intervention with serial growth monitoring"], "answer": 3, "explanation": "Separate but related deficits may need parallel targeted management. Closest distractor: Weight-first growth failure plus hearing-risk language delay differs from ASD. Why not the others: A. Complete nutritional rehabilitation first and defer hearing evaluation until weight normalizes — Weight gain and language-hearing needs can be addressed in parallel.; B. Treat recurrent otitis alone and postpone language assessment because social play is preserved — Good social reciprocity lowers ASD concern but does not eliminate hearing/language problems.; C. Investigate endocrine short stature first despite near-normal height-for-age SDS — Height-for-age −1 SDS is not short stature; weight-first faltering is the immediate issue.", "pearl": "Measure response in both weight SDS and language skills.", "srcAnswer": "D"}, {"num": 79, "level": "Integrated/Rank-Differentiating", "question": "A 5-year-old ex-preterm infant with prior IVH now has mild spastic diplegia, normal cognition but difficulty with motor planning and emerging reading readiness. What is best?", "options": ["Individualized multidisciplinary follow-up across motor, vision, hearing and school readiness", "Focus exclusively on motor physiotherapy because normal IQ excludes educational needs", "Use ADHD medication as the main treatment because school readiness is affected", "Defer school supports until formal IQ declines below the normal range"], "answer": 0, "explanation": "Functional outcome spans motor, adaptive and educational domains. Closest distractor: Normal IQ versus normal participation are not equivalent. Why not the others: B. Focus exclusively on motor physiotherapy because normal IQ excludes educational needs — Normal cognition does not exclude fine motor, executive and school participation needs.; C. Use ADHD medication as the main treatment because school readiness is affected — ADHD medication is not a substitute for rehabilitation and educational assessment.; D. Defer school supports until formal IQ declines below the normal range — Supports are based on function, not only IQ thresholds.", "pearl": "Early OT/PT and school supports can be targeted.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day13',label:'Day 13',set:'Quiz 5',href:'Day13/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day13_QuizSet5_Q65-79_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 13 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 65–79</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 13 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 13'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 13');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day13:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
