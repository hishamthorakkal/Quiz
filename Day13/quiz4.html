<script>
const quiz=[{"num": 49, "level": "Clinical/Application", "question": "A 9-year-old has height at 4th centile but crosses downward from the 40th over 3 years. Best interpretation?", "options": ["No concern because current height is above the 3rd centile", "Immediate GH treatment without assessment", "The centile change is explained by age alone", "Serial centile crossing warrants evaluation despite current height above −2 SDS"], "answer": 3, "explanation": "Growth velocity and centile trajectory can predate absolute short stature. Closest distractor: Position versus slope is the central discriminator. Why not the others: A. No concern because current height is above the 3rd centile — A single centile misses longitudinal growth failure.; B. Immediate GH treatment without assessment — GH treatment requires diagnosis and eligibility.; C. The centile change is explained by age alone — Normal age-related slowing does not explain persistent centile crossing automatically.", "pearl": "Recheck measurement technique and intervals.", "srcAnswer": "D"}, {"num": 50, "level": "High-Difficulty", "question": "A 10-year-old girl is 126 cm tall (height SDS −2.3), father 176 cm, mother 160 cm; she grew 3.0 cm over 12 months, has BMI 88th centile and bone age 8 years. Which action best integrates the data?", "options": ["Classify familial short stature based on the height SDS and parental heights", "Prioritize BMI reduction before investigating the falling linear growth velocity", "Endocrine evaluation for pathologic growth failure despite delayed bone age", "Repeat growth measurements after 18 months because delayed bone age is reassuring"], "answer": 2, "explanation": "Her girl target height = (176+160−13)/2 = 161.5 cm; velocity 3 cm/year is abnormal. Calculation worked:  Girl MPH = (father + mother − 13)/2 = (176 + 160 − 13)/2 = 323/2 = 161.5 cm. Growth velocity = 3.0 cm / 12 months × 12 = 3.0 cm/year. Trap: use the −13 sex correction for a girl and do not let delayed bone age override low velocity. Closest distractor: Constitutional delay retains roughly normal prepubertal velocity. Why not the others: A. Classify familial short stature based on the height SDS and parental heights — Parents predict a target around 161.5 cm; familial stature does not fit this trajectory.; B. Prioritize BMI reduction before investigating the falling linear growth velocity — Weight management is reasonable but cannot substitute for endocrine assessment.; D. Repeat growth measurements after 18 months because delayed bone age is reassuring — The 3 cm/year velocity and genetic mismatch make long observation unsafe.", "pearl": "Do not let one delayed bone-age result override the trajectory.", "srcAnswer": "C"}, {"num": 51, "level": "High-Difficulty", "question": "A 6-year-old boy had height 106.0 cm 8 months ago and 109.2 cm now; he is otherwise well, has BMI 60th centile and height near target. Which interpretation is best?", "options": ["Velocity 6.4 cm/year and confirmed normal", "Height velocity cannot be calculated from an 8-month interval", "Annualized velocity 4.8 cm/year; repeat standardized measurements before broad testing", "Velocity 3.2 cm/year and urgent GH stimulation"], "answer": 2, "explanation": "Short intervals magnify anthropometric error; 6–12-month trend is preferable. Calculation worked:  Height gain = 109.2 − 106.0 = 3.2 cm; interval = 8 months = 8/12 year; annualized velocity = 3.2 × 12/8 = 4.8 cm/year. Trap: using 3.2 cm as cm/year. Closest distractor: Absolute gain versus annualized velocity is the arithmetic trap. Why not the others: A. Velocity 6.4 cm/year and confirmed normal — 6.4 overstates the annualized rate.; B. Height velocity cannot be calculated from an 8-month interval — An interval can be annualized, with measurement error considered.; D. Velocity 3.2 cm/year and urgent GH stimulation — 3.2 is interval gain, not annual velocity; GH test is premature.", "pearl": "Use reliable stadiometer technique before labeling growth failure.", "srcAnswer": "C"}, {"num": 52, "level": "Clinical/Application", "question": "A 1.5-kg neonate requires GIR 7.5 mg/kg/min while total fluid is 90 mL/kg/day. What dextrose concentration is needed approximately?", "options": ["D7.5%", "D9%", "D15%", "D12%"], "answer": 3, "explanation": "Dextrose (%) = GIR×144/fluid (mL/kg/day). Calculation worked:  Formula: dextrose (%) = GIR (mg/kg/min) × 144 / fluid (mL/kg/day). Substitute: 7.5 × 144 / 90 = 12 g/100 mL = D12%. Trap: GIR numeric value is NOT the percentage; check route/osmolality. Closest distractor: GIR units mg/kg/min versus percent g/100 mL must be converted. Why not the others: A. D7.5% — 7.5 is the GIR value, not concentration.; B. D9% — Nine percent would provide only 5.625 mg/kg/min.; C. D15% — Fifteen percent would deliver 9.375 mg/kg/min.", "pearl": "Check peripheral-line concentration/osmolality limits before prescribing.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 10 Q47"}}, {"num": 53, "level": "High-Difficulty", "question": "An 11-year-old with short stature has bone age 8 years, poor height velocity, low free T4 and markedly elevated TSH. Father had late puberty. Which conclusion is most defensible?", "options": ["Constitutional delay alone explains all findings", "Familial short stature with normal bone age", "Growth hormone deficiency is proven by delayed bone age", "Hypothyroidism is established; family pubertal history does not explain laboratory abnormality"], "answer": 3, "explanation": "Use specific pathologic evidence before invoking normal variants. Closest distractor: Bone age delay is shared by constitutional and endocrine causes. Why not the others: A. Constitutional delay alone explains all findings — Constitutional delay does not cause low T4/high TSH.; B. Familial short stature with normal bone age — Bone age is delayed, not normal.; C. Growth hormone deficiency is proven by delayed bone age — Delayed bone age is not diagnostic of GH deficiency.", "pearl": "Treat thyroid disease and monitor catch-up growth.", "srcAnswer": "D"}, {"num": 54, "level": "High-Difficulty", "question": "A 4-year-old has height SDS −2.6, normal weight-for-height, asymmetric limb lengths and a history of breech birth. Which next step best avoids a false endocrine label?", "options": ["Use BMI alone to classify growth", "Reassure because weight-for-height is normal", "Assess skeletal proportions and orthopaedic pathology first", "Interpret all shortness as GH deficiency"], "answer": 2, "explanation": "Structural disproportion changes the workup. Closest distractor: Endocrine short stature is generally proportionate; dysplasia/asymmetry is not. Why not the others: A. Use BMI alone to classify growth — BMI does not assess limb length discrepancy.; B. Reassure because weight-for-height is normal — Normal relative weight does not remove asymmetry.; D. Interpret all shortness as GH deficiency — GH deficiency is usually proportionate.", "pearl": "Measure sitting height and limb segments.", "srcAnswer": "C"}, {"num": 55, "level": "High-Difficulty", "question": "A 13-year-old boy has delayed puberty and height below 3rd centile, velocity 5.8 cm/year, bone age 10 years and normal screening labs. What best predicts a normal variant?", "options": ["BMI above median alone", "Height below 3rd centile alone", "Stable prepubertal velocity plus delayed bone age and familial late maturation", "Any bone-age delay regardless of trajectory"], "answer": 2, "explanation": "Constitutional delay is a diagnosis supported by pattern and exclusion. Closest distractor: Delayed puberty with low velocity would require additional investigation. Why not the others: A. BMI above median alone — BMI does not determine puberty diagnosis.; B. Height below 3rd centile alone — Low centile alone cannot distinguish variants.; D. Any bone-age delay regardless of trajectory — Bone age delay alone is nonspecific.", "pearl": "Track puberty, height velocity and psychosocial impact.", "srcAnswer": "C"}, {"num": 56, "level": "High-Difficulty", "question": "A 7-year-old with poor weight gain has a negative tTG-IgA but profound IgA deficiency. What is the correct interpretation?", "options": ["Diagnosis is familial short stature", "IgA-based celiac screen may be falsely negative; use IgG-based testing", "Celiac disease is excluded", "Start GH therapy without further evaluation"], "answer": 1, "explanation": "Test validity depends on immunoglobulin context. Closest distractor: Negative tTG-IgA versus adequate total IgA is the key distinction. Why not the others: A. Diagnosis is familial short stature — Family height does not explain serology issue.; C. Celiac disease is excluded — A negative IgA test in IgA deficiency is unreliable.; D. Start GH therapy without further evaluation — GH is not indicated from this result.", "pearl": "Use tTG-IgG or deamidated gliadin IgG per local pathway.", "srcAnswer": "B"}, {"num": 57, "level": "High-Difficulty", "question": "A 21-month-old shows absent pointing and repetitive spinning, but normal hearing and 25 spoken words. Which finding most strengthens ASD concern over isolated language delay?", "options": ["Age below 2 years alone", "Lack of shared attention with restricted repetitive interests", "Vocabulary of 25 words alone", "Normal hearing alone"], "answer": 1, "explanation": "ASD is not defined by word count. Closest distractor: Social reciprocity and repetitive patterns outweigh isolated vocabulary counts. Why not the others: A. Age below 2 years alone — Age alone is not a diagnostic feature.; C. Vocabulary of 25 words alone — Word count alone is nonspecific.; D. Normal hearing alone — Normal hearing excludes one mimic but not confirm ASD.", "pearl": "Assess pretend play and response to name.", "srcAnswer": "B"}, {"num": 58, "level": "High-Difficulty", "question": "A 20-month-old screens M-CHAT-R/F medium risk; after follow-up interview several flagged items resolve and developmental observation is reassuring. Best conclusion?", "options": ["All future developmental surveillance is unnecessary", "Positive screen mandates antipsychotic medication", "Interpret final follow-up result and clinical concerns; screening does not diagnose ASD", "Initial questionnaire alone establishes ASD"], "answer": 2, "explanation": "M-CHAT-R/F is a two-stage screen for medium-risk scores. Closest distractor: Initial score versus follow-up result should not be conflated. Why not the others: A. All future developmental surveillance is unnecessary — Normal screen never eliminates future surveillance.; B. Positive screen mandates antipsychotic medication — No indication for antipsychotic medication.; D. Initial questionnaire alone establishes ASD — Screen alone does not confirm diagnosis.", "pearl": "Refer if clinical red flags persist despite screen changes.", "srcAnswer": "C"}, {"num": 59, "level": "High-Difficulty", "question": "A 2-year-old with language regression has repeated nocturnal episodes of staring and new receptive-language loss. What additional diagnosis deserves targeted assessment?", "options": ["Isolated speech articulation disorder", "Constitutional growth delay", "Epileptic encephalopathy with language regression", "Simple bilingual language delay"], "answer": 2, "explanation": "Regression with paroxysms requires EEG-oriented neurologic assessment. Closest distractor: Autism-associated regression versus epileptic language regression can overlap. Why not the others: A. Isolated speech articulation disorder — Articulation problems do not explain regression.; B. Constitutional growth delay — Growth variant is unrelated.; D. Simple bilingual language delay — Bilingualism does not cause loss of comprehension.", "pearl": "Sleep EEG may be important when clinical suspicion is high.", "srcAnswer": "C"}, {"num": 60, "level": "High-Difficulty", "question": "A 7-year-old with reading difficulties also has inattention at school and home; psychoeducational testing shows impaired phonological decoding. Which is best?", "options": ["Exclude ADHD because dyslexia is present", "Consider coexisting ADHD and specific reading disorder", "Choose either ADHD or SLD, never both", "Label intellectual disability without adaptive assessment"], "answer": 1, "explanation": "Comorbidity is common; one diagnosis need not explain every symptom. Closest distractor: Domain-specific testing distinguishes reading disorder from attention-related underperformance. Why not the others: A. Exclude ADHD because dyslexia is present — SLD does not exclude ADHD.; C. Choose either ADHD or SLD, never both — The disorders are not mutually exclusive.; D. Label intellectual disability without adaptive assessment — Adaptive deficits are not established.", "pearl": "Combine educational accommodations with ADHD care when indicated.", "srcAnswer": "B"}, {"num": 61, "level": "High-Difficulty", "question": "A 6-year-old is impulsive in class but not at home; teacher notes sleepiness after loud snoring and parents report nightly pauses. Which initial sequence is strongest?", "options": ["Diagnose ADHD from classroom observation and begin medication", "Exclude OSA because the child is not obese", "Use actigraphy as definitive respiratory test", "Evaluate OSA and obtain cross-setting behavioural history before ADHD labeling"], "answer": 3, "explanation": "Sleep and environment can generate apparent attention deficits. Closest distractor: Obesity is a risk factor, not a prerequisite for OSA. Why not the others: A. Diagnose ADHD from classroom observation and begin medication — Cross-setting impairment is unproven.; B. Exclude OSA because the child is not obese — Adenotonsillar hypertrophy causes OSA without obesity.; C. Use actigraphy as definitive respiratory test — Actigraphy does not diagnose obstruction.", "pearl": "PSG is reference standard when needed.", "srcAnswer": "D"}, {"num": 62, "level": "High-Difficulty", "question": "An 8-year-old has nightly events at 1 AM with screaming and walking, but on video episodes are 15 seconds, highly stereotyped, with unilateral dystonia. Most appropriate?", "options": ["Diagnose nightmare because screaming occurs", "Ignore events if morning recall is absent", "Investigate sleep-related focal epilepsy despite apparent parasomnia timing", "Diagnose night terror solely from first-third timing"], "answer": 2, "explanation": "Video semiology outweighs one temporal feature. Closest distractor: NREM parasomnia versus nocturnal frontal epilepsy requires pattern scrutiny. Why not the others: A. Diagnose nightmare because screaming occurs — Nightmares typically have recall and later-night occurrence.; B. Ignore events if morning recall is absent — Amnesia is shared and nondiscriminating.; D. Diagnose night terror solely from first-third timing — NREM timing does not exclude epilepsy.", "pearl": "Specialist video-EEG may be needed.", "srcAnswer": "C"}, {"num": 63, "level": "High-Difficulty", "question": "A 9-year-old with enlarged tonsils has PSG obstructive AHI 8/hour and intermittent desaturation. Which statement is best?", "options": ["Tonsillar hypertrophy alone mandates surgery without reviewing clinical severity", "The AHI is near normal for adults, so use adult scoring and avoid treatment", "This is clinically significant paediatric OSA; discuss airway treatment and comorbidity assessment", "This is mild paediatric OSA and needs only a sleep diary before any intervention"], "answer": 2, "explanation": "Paediatric AHI cutoffs differ from adult OSA thresholds. Closest distractor: Obstructive AHI versus tonsil size is the key discriminator. Why not the others: A. Tonsillar hypertrophy alone mandates surgery without reviewing clinical severity — Tonsil size alone does not determine treatment; PSG and symptoms matter.; B. The AHI is near normal for adults, so use adult scoring and avoid treatment — Adult AHI criteria cannot be substituted for paediatric criteria.; D. This is mild paediatric OSA and needs only a sleep diary before any intervention — Common paediatric grading places 8/hour in moderate, not mild, range.", "pearl": "Consider adenotonsillectomy when appropriate; follow residual risk.", "srcAnswer": "C"}, {"num": 64, "level": "High-Difficulty", "question": "A 5-year-old has failure to thrive, height −2.8 SDS and developmental delay, but an initial neonatal screen was normal. Which inference is safest?", "options": ["Newborn screening can be used instead of an updated genetic and metabolic evaluation", "A normal newborn screen does not exclude later-onset genetic/metabolic or systemic disease", "An unrevealing newborn screen makes a primary endocrine cause more likely than systemic illness", "Neonatal screening excludes disorders detectable only after developmental delay appears"], "answer": 1, "explanation": "Screening scope and test timing matter. Closest distractor: Normal screening result versus definitive exclusion is a recurrent exam trap. Why not the others: A. Newborn screening can be used instead of an updated genetic and metabolic evaluation — Current phenotype may justify tests not included in the original screening panel.; C. An unrevealing newborn screen makes a primary endocrine cause more likely than systemic illness — The screen does not meaningfully rank all later endocrine and systemic diagnoses.; D. Neonatal screening excludes disorders detectable only after developmental delay appears — Late-onset or unscreened disorders remain possible after a normal neonatal panel.", "pearl": "Reassess history, exam and targeted genetic/metabolic clues.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day13',label:'Day 13',set:'Quiz 4',href:'Day13/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day13_QuizSet4_Q49-64_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 13 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–64</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 13 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 13'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 13');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day13:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
