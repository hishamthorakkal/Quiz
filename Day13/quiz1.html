<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "For routine growth assessment of a healthy Indian child aged 3 years, which chart is preferred by IAP?", "options": ["IAP 2015 school-age reference", "CDC 2000 reference", "Adult-equivalent BMI chart", "WHO 2006 child growth standards"], "answer": 3, "explanation": "Choose the reference by age before interpreting any centile. Closest distractor: WHO under 5 versus IAP 5–18 is the key boundary. Why not the others: A. IAP 2015 school-age reference — IAP 2015 is for 5–18 years, not age 3.; B. CDC 2000 reference — CDC is not the Indian first-choice reference.; C. Adult-equivalent BMI chart — Adult-equivalent BMI lines belong to IAP 5–18 years.", "pearl": "A correct measurement on the wrong chart is a wrong interpretation.", "srcAnswer": "D"}, {"num": 2, "level": "Basic/Recall", "question": "What defines short stature in a standard population growth assessment?", "options": ["Height-for-age below −2 SDS", "Weight-for-age below −2 SDS", "BMI-for-age below −2 SDS", "Weight-for-height below −2 SDS"], "answer": 0, "explanation": "Linear growth is defined with height/length-for-age, not weight indices. Closest distractor: Stunting/short stature versus wasting are different anthropometric constructs. Why not the others: B. Weight-for-age below −2 SDS — Weight-for-age detects underweight, not short stature.; C. BMI-for-age below −2 SDS — BMI-for-age characterizes relative mass.; D. Weight-for-height below −2 SDS — Weight-for-height identifies wasting.", "pearl": "A z-score is dimension-specific.", "srcAnswer": "A"}, {"num": 3, "level": "Basic/Recall", "question": "What is the approximate normal height gain in the first year of life?", "options": ["25 cm", "12 cm", "7 cm", "5 cm"], "answer": 0, "explanation": "Growth decelerates steeply after infancy. Closest distractor: The 25/12/7–8/5–6 sequence is the memory anchor. Why not the others: B. 12 cm — About 12 cm is typical in year two.; C. 7 cm — Seven centimetres is closer to ages 2–4.; D. 5 cm — Five centimetres is typical later in childhood.", "pearl": "First-year length gain is much faster than prepubertal velocity.", "srcAnswer": "A"}, {"num": 4, "level": "Basic/Recall", "question": "Which instrument is a parent-report autism SCREENING tool for toddlers approximately 16–30 months old?", "options": ["Bayley developmental scales", "M-CHAT-R/F", "ADOS-2", "HINE"], "answer": 1, "explanation": "A screen identifies children needing assessment; it is not diagnostic. Closest distractor: M-CHAT-R/F versus ADOS is screen versus diagnostic evaluation. Why not the others: A. Bayley developmental scales — Bayley measures developmental domains rather than autism risk alone.; C. ADOS-2 — ADOS-2 contributes to specialist diagnostic assessment.; D. HINE — HINE is a neurological examination for infants.", "pearl": "A positive screen requires clinical follow-up.", "srcAnswer": "B"}, {"num": 5, "level": "Basic/Recall", "question": "What does BEARS assess in paediatric sleep history?", "options": ["Breathing, EEG, arousal index, REM, seizures", "Bedtime, excessive sleepiness, awakenings, regularity, snoring", "Behaviour, eating, activity, regression, speech", "Bone age, endocrine status, adiposity, renal disease, stature"], "answer": 1, "explanation": "BEARS is a rapid clinical screen for sleep concerns. Closest distractor: A screening history is distinct from polysomnography. Why not the others: A. Breathing, EEG, arousal index, REM, seizures — These belong to formal sleep investigations, not BEARS.; C. Behaviour, eating, activity, regression, speech — These items are not the BEARS mnemonic.; D. Bone age, endocrine status, adiposity, renal disease, stature — These are growth/medical assessment constructs.", "pearl": "Ask about snoring even when the referral is behavioural.", "srcAnswer": "B"}, {"num": 6, "level": "Basic/Recall", "question": "What is the formula for a boy’s mid-parental target height (cm)?", "options": ["(Father + Mother + 13)/2", "(Father + Mother − 13)/2", "(Father + Mother)/2 + 13", "(Father − Mother + 13)/2"], "answer": 0, "explanation": "The sex correction is inside the division by 2. Closest distractor: Boy +13; girl −13, both divided by 2. Why not the others: B. (Father + Mother − 13)/2 — The minus-13 formula is for girls.; C. (Father + Mother)/2 + 13 — Adding 13 after averaging doubles the sex adjustment.; D. (Father − Mother + 13)/2 — Subtracting maternal height is not a parental midpoint.", "pearl": "Mid-parental height is a target estimate, not a predicted exact adult height.", "srcAnswer": "A"}, {"num": 7, "level": "Basic/Recall", "question": "At approximately what age does IAP 2026 list independent sitting as an expected gross-motor milestone?", "options": ["18 months", "9 months", "3 months", "6 weeks"], "answer": 1, "explanation": "A delayed milestone should be interpreted with age and corrected age where relevant. Closest distractor: Sitting with support at 5–6 months is not independent sitting. Why not the others: A. 18 months — Eighteen months is far beyond the expected window.; C. 3 months — At 3 months neck control is emerging.; D. 6 weeks — Six weeks is much too early for sitting.", "pearl": "Developmental milestones are approximate ages, not absolute diagnostic cutoffs.", "srcAnswer": "B"}, {"num": 8, "level": "Conceptual", "question": "A 7-year-old has height at the 2nd centile, velocity 5.5 cm/year, normal proportions, bone age matching chronological age and short parents. Best interpretation?", "options": ["Constitutional delay", "Untreated hypothyroidism", "Growth hormone deficiency", "Familial short stature"], "answer": 3, "explanation": "A low centile alone does not establish disease. Closest distractor: Bone age normal versus delayed distinguishes familial and constitutional patterns. Why not the others: A. Constitutional delay — Constitutional delay usually has delayed bone age and later puberty.; B. Untreated hypothyroidism — Hypothyroidism typically slows velocity and delays bone maturation.; C. Growth hormone deficiency — GH deficiency often shows falling velocity and relative weight preservation.", "pearl": "Use target height and longitudinal velocity together.", "srcAnswer": "D"}, {"num": 9, "level": "Conceptual", "question": "Which pattern most strongly suggests an endocrine cause of poor linear growth?", "options": ["Proportionate low weight and low height with chronic diarrhoea", "Low BMI after prolonged inadequate intake", "Falling height velocity with preserved or rising BMI", "Weight faltering before height faltering"], "answer": 2, "explanation": "Height deceleration despite adequate relative weight needs endocrine assessment. Closest distractor: Endocrine versus nutritional: direction of weight/BMI separates them. Why not the others: A. Proportionate low weight and low height with chronic diarrhoea — Chronic malabsorption reduces both weight and height.; B. Low BMI after prolonged inadequate intake — Reduced intake primarily depresses weight gain.; D. Weight faltering before height faltering — Nutrition generally affects weight first.", "pearl": "Obesity does not exclude pathological short stature.", "srcAnswer": "C"}, {"num": 10, "level": "Clinical/Application", "question": "A term infant at 60 hours has recurrent plasma glucose 43 mg/dL. Which framework statement is most accurate?", "options": ["PES excludes persistent disorders until day 7", "Both frameworks use identical age boundaries", "CPS transitional operational threshold is used before 72 h; PES persistent-risk evaluation can start after 48 h", "CPS transitional threshold begins only after 72 h"], "answer": 2, "explanation": "Distinguish a treatment operational threshold from persistent-disorder evaluation timing. Closest distractor: 48 h PES versus 72 h CPS is a framework boundary, not a contradiction. Why not the others: A. PES excludes persistent disorders until day 7 — PES does not require waiting a week.; B. Both frameworks use identical age boundaries — Different organizations address different clinical scopes.; D. CPS transitional threshold begins only after 72 h — This reverses CPS temporal scope.", "pearl": "When an Indian protocol is named, use its own threshold rather than importing CPS/PES.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q8"}}, {"num": 11, "level": "Conceptual", "question": "In a preterm child aged 14 months chronological age born at 30 weeks, which age is generally used to interpret early developmental milestones?", "options": ["Postmenstrual age 14 months", "Birth gestation 30 weeks only", "Corrected age about 11.5 months", "Chronological age 14 months only"], "answer": 2, "explanation": "Corrected age = chronological age − weeks preterm. Calculation worked:  Born 30 weeks: 40 − 30 = 10 weeks early ≈ 2.3 months. Corrected age ≈ 14 − 2.3 = 11.7 months. Trap: adding rather than subtracting prematurity. Closest distractor: Corrected versus chronological age matters especially before age 2 years. Why not the others: A. Postmenstrual age 14 months — Postmenstrual age is not interchangeable with months after birth.; B. Birth gestation 30 weeks only — Gestational age alone cannot locate the child on a milestone timeline.; D. Chronological age 14 months only — Chronological age alone overcalls delay in preterm infants.", "pearl": "Correct for prematurity when interpreting early milestones and growth.", "srcAnswer": "C"}, {"num": 12, "level": "Conceptual", "question": "A toddler has normal eye contact and joint attention but limited expressive words; which evaluation remains mandatory?", "options": ["Autism diagnosis from speech delay alone", "Reassurance without reassessment", "Brain MRI for every child", "Formal hearing assessment"], "answer": 3, "explanation": "Hearing evaluation is part of the first-line language-delay workup. Closest distractor: Language delay without social-communication deficits differs from ASD. Why not the others: A. Autism diagnosis from speech delay alone — Speech delay alone is not sufficient for ASD diagnosis.; B. Reassurance without reassessment — Delaying assessment misses treatable causes.; C. Brain MRI for every child — Routine MRI is not first-line for isolated speech delay.", "pearl": "A normal newborn hearing screen does not exclude later hearing loss.", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "Which statement best distinguishes global developmental delay (GDD) from specific learning disorder?", "options": ["GDD affects at least two developmental domains before age 5; SLD is a circumscribed academic skill deficit", "Both require IQ <70", "SLD is diagnosed from delayed walking alone", "GDD requires isolated speech delay"], "answer": 0, "explanation": "Count affected domains and assess adaptive function. Closest distractor: GDD versus SLD differs by age and breadth of impairment. Why not the others: B. Both require IQ <70 — SLD can occur with normal intellectual ability.; C. SLD is diagnosed from delayed walking alone — Motor delay alone does not define SLD.; D. GDD requires isolated speech delay — Isolated language delay is not GDD.", "pearl": "Avoid equating scholastic difficulty with intellectual disability.", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "What is the decisive DSM-5-style core requirement for autism spectrum disorder?", "options": ["Social communication deficits plus restricted/repetitive patterns", "Language delay without repetitive behaviour", "Hyperactivity in two settings", "Poor school reading with normal social reciprocity"], "answer": 0, "explanation": "ASD diagnosis integrates both social and behavioural domains. Closest distractor: ASD versus developmental language disorder hinges on joint attention and restricted patterns. Why not the others: B. Language delay without repetitive behaviour — Language delay can occur without ASD.; C. Hyperactivity in two settings — Cross-setting hyperactivity points toward ADHD.; D. Poor school reading with normal social reciprocity — Isolated reading difficulty suggests SLD.", "pearl": "No single behaviour is pathognomonic for ASD.", "srcAnswer": "A"}, {"num": 15, "level": "Conceptual", "question": "A 7-year-old is inattentive only during maths lessons, but attentive at home and in other subjects. Which statement is best?", "options": ["ADHD is confirmed by classroom inattention alone", "Start stimulant without collateral history", "Diagnose autism because of poor maths", "Evaluate learning difficulty and context before diagnosing ADHD"], "answer": 3, "explanation": "Cross-setting impairment is crucial for ADHD assessment. Closest distractor: ADHD versus dyscalculia may overlap but are not synonymous. Why not the others: A. ADHD is confirmed by classroom inattention alone — ADHD requires impairment in more than one setting.; B. Start stimulant without collateral history — Medication follows diagnostic and functional evaluation.; C. Diagnose autism because of poor maths — Maths difficulty alone is not an ASD criterion.", "pearl": "Teacher and parent reports can reveal context dependence.", "srcAnswer": "D"}, {"num": 16, "level": "Conceptual", "question": "What is the best first-line strategy for ADHD-like behaviour in a 5-year-old with confirmed impairment?", "options": ["Routine EEG without seizure features", "Structured parent-training behavioural intervention", "Automatic methylphenidate monotherapy", "Sedative antihistamine at bedtime"], "answer": 1, "explanation": "Age and functional severity determine the treatment tier. Closest distractor: Preschool behavioural intervention differs from school-age combined treatment. Why not the others: A. Routine EEG without seizure features — EEG is not a routine ADHD diagnostic test.; C. Automatic methylphenidate monotherapy — Medication is not automatic first choice at this age.; D. Sedative antihistamine at bedtime — Sedation does not treat ADHD.", "pearl": "Treat sleep, hearing and psychosocial mimics alongside behaviour.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day13',label:'Day 13',set:'Quiz 1',href:'Day13/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day13_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 13 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 13 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 13'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 13');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day13:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
