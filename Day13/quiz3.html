<script>
const quiz=[{"num": 33, "level": "Clinical/Application", "question": "A 2-year-old has 15 words, intact pointing/showing, rich reciprocal play and follows two-step commands. Best assessment plan?", "options": ["Hearing and language assessment with developmental surveillance", "Confirm autism from vocabulary alone", "Start antipsychotic therapy", "Diagnose intellectual disability from expressive delay"], "answer": 0, "explanation": "Social communication separates language delay from ASD. Closest distractor: Intact joint attention is reassuring but does not remove need to assess speech delay. Why not the others: B. Confirm autism from vocabulary alone — ASD requires broader social/repetitive phenotype.; C. Start antipsychotic therapy — No indication for antipsychotics.; D. Diagnose intellectual disability from expressive delay — ID requires adaptive/cognitive deficits, not a word count alone.", "pearl": "Investigate speech-language disorder and hearing loss.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical/Application", "question": "A 20-month-old loses 10 previously used words and no longer points; parents note reduced social engagement. Best approach?", "options": ["Reassure as normal toddler fluctuation", "Give only speech worksheets for 6 months", "Attribute the loss to bilingual upbringing", "Urgent developmental evaluation including hearing and neurologic review"], "answer": 3, "explanation": "Regression requires a broader differential than isolated ASD. Closest distractor: Language plateau differs from documented loss of words. Why not the others: A. Reassure as normal toddler fluctuation — True regression is not normal variation.; B. Give only speech worksheets for 6 months — Intervention may begin but medical evaluation cannot be delayed.; C. Attribute the loss to bilingual upbringing — Bilingualism does not cause loss of skills.", "pearl": "Consider ASD, epileptic aphasia, hearing loss and neurodegenerative causes.", "srcAnswer": "D"}, {"num": 35, "level": "Clinical/Application", "question": "A 3-year-old has delayed speech, poor eye contact and stereotyped hand flapping; M-CHAT-R/F is positive. What does the result establish?", "options": ["Normal development because screening is parent-reported", "Need for comprehensive developmental/ASD assessment, not a diagnosis", "Definitive ASD diagnosis without clinical evaluation", "Need for immediate GH stimulation testing"], "answer": 1, "explanation": "Differentiate screen, clinical diagnosis and functional planning. Closest distractor: A positive M-CHAT is risk identification, not diagnostic certainty. Why not the others: A. Normal development because screening is parent-reported — Parent report is useful but not a reason to dismiss concern.; C. Definitive ASD diagnosis without clinical evaluation — Screening does not itself confirm DSM-5 criteria.; D. Need for immediate GH stimulation testing — GH testing is unrelated to this presentation.", "pearl": "Early intervention can begin while diagnostic assessment proceeds.", "srcAnswer": "B"}, {"num": 36, "level": "Clinical/Application", "question": "A 7-year-old has reading decoding difficulty despite adequate instruction, normal hearing and age-appropriate daily living skills. Most likely?", "options": ["Autism spectrum disorder", "Childhood absence epilepsy", "Specific learning disorder with impairment in reading", "Intellectual disability"], "answer": 2, "explanation": "Reading difficulty must be evaluated in context of teaching and cognition. Closest distractor: SLD versus ID differs by general adaptive functioning. Why not the others: A. Autism spectrum disorder — No social/repetitive ASD features are described.; B. Childhood absence epilepsy — No staring spells or EEG evidence for absence seizures.; D. Intellectual disability — ID requires broad adaptive/intellectual impairment.", "pearl": "Assess phonological decoding and reading fluency.", "srcAnswer": "C"}, {"num": 37, "level": "Clinical/Application", "question": "A 6-year-old has distractibility at home and school for 10 months, with impairment, but snores loudly and has witnessed pauses in sleep. First additional assessment?", "options": ["Use a routine EEG as the first test", "Diagnose autism from hyperactivity", "Assess sleep-disordered breathing before finalizing ADHD management", "Assume sleep symptoms are incidental"], "answer": 2, "explanation": "Sleep-disordered breathing is a treatable ADHD mimic/comorbidity. Closest distractor: Cross-setting ADHD symptoms do not eliminate medical contributors. Why not the others: A. Use a routine EEG as the first test — EEG is not a routine OSA or ADHD test.; B. Diagnose autism from hyperactivity — No ASD core features are supplied.; D. Assume sleep symptoms are incidental — Snoring with witnessed pauses is a significant red flag.", "pearl": "Obtain ENT/sleep history and consider polysomnography.", "srcAnswer": "C"}, {"num": 38, "level": "Clinical/Application", "question": "A 5-year-old has frequent temper outbursts, hyperactivity and poor routines in two settings; developmental evaluation supports ADHD. Most appropriate initial plan?", "options": ["Routine brain MRI", "Parent-training behavioural management and school structure", "Immediate stimulant-only treatment without behavioural support", "Chronic benzodiazepine therapy"], "answer": 1, "explanation": "Age-specific management matters. Closest distractor: Preschool versus school-age treatment algorithms differ. Why not the others: A. Routine brain MRI — MRI is not routine in uncomplicated ADHD.; C. Immediate stimulant-only treatment without behavioural support — Medication alone is not the default first step under age 6.; D. Chronic benzodiazepine therapy — Benzodiazepines do not treat ADHD.", "pearl": "Set measurable goals and evaluate comorbidities.", "srcAnswer": "B"}, {"num": 39, "level": "Clinical/Application", "question": "An 11-year-old with confirmed ADHD continues to have marked academic and social impairment despite optimized school and parent interventions. Best next step?", "options": ["Discontinue educational support once medicine starts", "Use antibiotics for presumed neuroinflammation", "Assume no benefit from medication after age 10", "Discuss specialist-supervised medication combined with ongoing supports"], "answer": 3, "explanation": "Treatment escalation depends on functional impairment and response. Closest distractor: Medication complements rather than replaces classroom adjustments. Why not the others: A. Discontinue educational support once medicine starts — Combined treatment is often superior to medication alone.; B. Use antibiotics for presumed neuroinflammation — No infection suggests antibiotics.; C. Assume no benefit from medication after age 10 — Age 11 is within typical medication-eligible range.", "pearl": "Monitor appetite, sleep, growth and cardiovascular history if stimulants used.", "srcAnswer": "D"}, {"num": 40, "level": "Clinical/Application", "question": "A child awakens screaming 70 minutes after sleep onset, is difficult to console, sweats and remembers nothing next morning. Most likely?", "options": ["Narcolepsy with cataplexy", "Behavioural insomnia of sleep onset", "NREM sleep terror", "REM nightmare"], "answer": 2, "explanation": "Sleep-stage timing and recall are decisive. Closest distractor: NREM terror versus nightmare needs three clues, not one. Why not the others: A. Narcolepsy with cataplexy — Narcolepsy causes daytime sleep attacks, not this episode.; B. Behavioural insomnia of sleep onset — Insomnia is difficulty initiating/maintaining sleep, not a terror episode.; D. REM nightmare — Nightmares often occur later and are recalled.", "pearl": "Protect safety and avoid unnecessary awakening.", "srcAnswer": "C"}, {"num": 41, "level": "Clinical/Application", "question": "An 8-year-old has repetitive nocturnal episodes lasting 30 seconds, nearly identical each night, with dystonic posturing and no dream recall. Best next investigation?", "options": ["Empirical melatonin as diagnostic test", "Video-EEG evaluation for nocturnal seizures", "Reassurance as typical sleep terror", "Only a daytime hearing screen"], "answer": 1, "explanation": "Stereotypy and focal motor signs favour epilepsy. Closest distractor: Sleep terror can resemble seizures, but exact repetitive motor patterns matter. Why not the others: A. Empirical melatonin as diagnostic test — Melatonin response cannot diagnose epilepsy.; C. Reassurance as typical sleep terror — Parasomnias tend to be less stereotyped and often longer.; D. Only a daytime hearing screen — Hearing is not relevant to the paroxysms.", "pearl": "Capture home video and consider specialist video-EEG.", "srcAnswer": "B"}, {"num": 42, "level": "Clinical/Application", "question": "A 10-year-old snores nightly, has morning headaches and witnessed gasping; tonsils are enlarged. Which test is reference standard for severity?", "options": ["Overnight polysomnography", "Wrist actigraphy alone", "Routine chest radiograph", "Epworth score alone"], "answer": 0, "explanation": "Adenotonsillar hypertrophy plus witnessed apnoea suggests OSA. Closest distractor: PSG is gold standard; oximetry can triage but does not fully exclude OSA. Why not the others: B. Wrist actigraphy alone — Actigraphy cannot score respiratory events.; C. Routine chest radiograph — CXR does not grade OSA.; D. Epworth score alone — A questionnaire is screening, not definitive severity testing.", "pearl": "Evaluate obesity and craniofacial factors as modifiers.", "srcAnswer": "A"}, {"num": 43, "level": "Clinical/Application", "question": "A 14-year-old sleeps 5 hours on school nights and is sleepy and inattentive during class. Weekend sleep extends to 11 hours. Best initial approach?", "options": ["Order GH stimulation test", "Address insufficient sleep and delayed schedule before labeling ADHD", "Diagnose ADHD solely from daytime inattention", "Begin stimulant without sleep history"], "answer": 1, "explanation": "Sleep duration and weekday/weekend discrepancy matter. Closest distractor: Insufficient sleep versus primary ADHD is a common clinical trap. Why not the others: A. Order GH stimulation test — GH testing is irrelevant.; C. Diagnose ADHD solely from daytime inattention — ADHD requires broader developmental and setting assessment.; D. Begin stimulant without sleep history — Stimulants without sleep evaluation may worsen insomnia.", "pearl": "Use sleep diary and consistent schedules.", "srcAnswer": "B"}, {"num": 44, "level": "Clinical/Application", "question": "A 3-year-old has no independent walking, persistent primitive reflexes and a history of severe IVH. Which is the best referral strategy?", "options": ["Multidisciplinary developmental-neurologic rehabilitation now", "Defer all therapy until MRI at age 5", "Treat as isolated learning disorder", "Use only nutritional supplements"], "answer": 0, "explanation": "Previous neonatal brain injury modifies developmental risk. Closest distractor: Neonatal IVH risk plus current tone abnormalities indicates possible CP. Why not the others: B. Defer all therapy until MRI at age 5 — Waiting loses developmental opportunity.; C. Treat as isolated learning disorder — SLD is a school-age academic diagnosis.; D. Use only nutritional supplements — Nutrition alone does not address spasticity.", "pearl": "Assess feeding, hearing, vision and caregiver goals as well.", "srcAnswer": "A"}, {"num": 45, "level": "Clinical/Application", "question": "A former 28-week preterm infant at corrected age 4 months has absent fidgety movements and asymmetric posture. Best next step?", "options": ["Ignore corrected age and call this normal", "Formal neurological assessment including HINE and early intervention", "Reassure until walking age", "Use a school learning test now"], "answer": 1, "explanation": "Absent fidgety GMs at 3–5 months corrected age are a major red flag. Closest distractor: High-risk screening is predictive, not by itself a final diagnosis. Why not the others: A. Ignore corrected age and call this normal — Corrected age remains relevant.; C. Reassure until walking age — Waiting until walking is inappropriate.; D. Use a school learning test now — Academic testing is not age appropriate.", "pearl": "Early targeted therapy should begin promptly.", "srcAnswer": "B"}, {"num": 46, "level": "Clinical/Application", "question": "A 2-year-old has weight-for-height z score −2.4 but height-for-age z score −0.2. Which anthropometric diagnosis is most accurate?", "options": ["Stunting without wasting", "Short stature with obesity", "Normal anthropometry", "Wasting without established stunting"], "answer": 3, "explanation": "Different z-score indices measure different deficits. Closest distractor: Acute wasting versus chronic stunting can dissociate. Why not the others: A. Stunting without wasting — Height-for-age is not <−2.; B. Short stature with obesity — Neither height nor weight suggests obesity.; C. Normal anthropometry — Weight-for-height is outside normal.", "pearl": "Day 14 will expand treatment; Day 13 focuses on classification.", "srcAnswer": "D"}, {"num": 47, "level": "Clinical/Application", "question": "A 7-year-old has height SDS −2.4, poor weight gain, abdominal distension and iron-deficiency anaemia. Which screening test is most appropriate?", "options": ["Random serum GH", "Sleep actigraphy", "Routine EEG", "Tissue transglutaminase IgA with total IgA"], "answer": 3, "explanation": "Targeted tests follow the pattern and associated symptoms. Closest distractor: Celiac versus GH deficiency: anaemia and GI symptoms shift probability. Why not the others: A. Random serum GH — Random GH is non-diagnostic and misses malabsorption.; B. Sleep actigraphy — Actigraphy addresses sleep patterns, not malabsorption.; C. Routine EEG — No seizure phenotype supports EEG.", "pearl": "Assess total IgA to interpret tTG-IgA.", "srcAnswer": "D"}, {"num": 48, "level": "Clinical/Application", "question": "An 8-year-old with obesity has declining height velocity and moon facies, violaceous striae and hypertension. Most concerning diagnosis?", "options": ["Familial short stature", "Constitutional delay", "Cushing syndrome", "Simple exogenous obesity"], "answer": 2, "explanation": "Obesity plus height deceleration is pathological until evaluated. Closest distractor: Cushing versus common obesity: linear growth separates them. Why not the others: A. Familial short stature — Familial short stature does not cause new striae/hypertension.; B. Constitutional delay — Constitutional delay does not cause this endocrine phenotype.; D. Simple exogenous obesity — Simple obesity usually has normal or increased linear growth.", "pearl": "Review exogenous glucocorticoid exposure before testing.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day13',label:'Day 13',set:'Quiz 3',href:'Day13/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day13_QuizSet3_Q33-48_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 13 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–48</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 13 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 13'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 13');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day13:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
