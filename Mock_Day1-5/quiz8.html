<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Mock Quiz 8 — Q106–Q120</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Cumulative Mock — Quiz 8</h1>
<div class="sub">Questions 106–120 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 106, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss from a naked infant to cooler surrounding air is primarily:", "options": ["Radiation only", "Conduction", "Convection", "Evaporation only"], "answer": 2, "explanation": "Air currents carry heat away by convection.", "pearl": "Air movement = convection.", "srcAnswer": "A"}, {"num": 107, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss from a warm infant to a nearby cold window without direct contact is:", "options": ["Metabolic heat loss", "Convection only", "Radiation", "Conduction"], "answer": 2, "explanation": "Radiant heat transfer occurs between surfaces without direct contact.", "pearl": "Cold wall/window = radiation.", "srcAnswer": "A"}, {"num": 108, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss as amniotic fluid evaporates from the skin is:", "options": ["Conduction", "Convection", "Evaporation", "Radiation"], "answer": 2, "explanation": "Evaporation of fluid from skin removes heat.", "pearl": "Wet skin = evaporation.", "srcAnswer": "A"}, {"num": 109, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 900-g infant has temperature 35.4 C, glucose 38 mg/dL and increased oxygen need. Which relationship is most plausible?", "options": ["Low temperature reduces oxygen consumption", "Cold stress has increased metabolic demand, contributing to hypoglycemia and respiratory instability", "Hypothermia protects against hypoglycemia", "The findings are unrelated by definition"], "answer": 1, "explanation": "Cold stress increases glucose and oxygen consumption and can worsen respiratory instability.", "pearl": "Treat temperature as part of metabolic stabilization.", "srcAnswer": "A"}, {"num": 110, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 30-week infant in an incubator is persistently cool despite adequate air temperature. Skin is exposed and humidity is low. What should be optimized?", "options": ["Servo-controlled thermal environment and humidity appropriate to gestation", "Removal of hat and wrap", "Cold humidification", "Frequent opening of incubator doors"], "answer": 0, "explanation": "Very preterm infants benefit from controlled thermal care and humidity to reduce transepidermal water/heat loss.", "pearl": "Humidity is especially important with immature skin.", "srcAnswer": "A"}, {"num": 111, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Why are ELBW infants at high risk of transepidermal water loss?", "options": ["Excess subcutaneous fat", "Low surface area", "Immature stratum corneum", "Mature renal concentrating ability"], "answer": 2, "explanation": "Immature skin permits substantial evaporative water loss.", "pearl": "Skin immaturity affects both temperature and fluid balance.", "srcAnswer": "A"}, {"num": 112, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 26-week infant loses 12% body weight in 48 hours, sodium rises to 154 mmol/L, urine output is adequate and humidity is low. Most likely contributor?", "options": ["SIADH", "Excess insensible water loss", "Excess free-water administration", "Renal failure with water retention"], "answer": 1, "explanation": "High transepidermal/insensible losses in extremely preterm infants can cause hypernatremic dehydration.", "pearl": "Weight, sodium and environmental humidity must be interpreted together.", "srcAnswer": "A"}, {"num": 113, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "A preterm infant has apnea with HR 70/min and SpO2 72% that does not respond to stimulation. Best next action?", "options": ["Provide positive-pressure ventilation", "Wait 60 seconds", "Start chest compressions immediately", "Give epinephrine first"], "answer": 0, "explanation": "Persistent apnea with significant bradycardia/desaturation after stimulation requires ventilatory support; compressions depend on HR response after effective ventilation.", "pearl": "Apnea management merges into the neonatal resuscitation sequence when severe.", "srcAnswer": "A"}, {"num": 114, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 32-week infant has intermittent apnea only during oral feeding, with coughing and milk at the mouth. Best next step?", "options": ["Stop all enteral nutrition permanently", "Assess suck-swallow-breathe coordination and aspiration risk", "Increase caffeine automatically", "Diagnose apnea of prematurity without further evaluation"], "answer": 1, "explanation": "Feeding-associated events suggest discoordination or aspiration rather than pure central apnea.", "pearl": "Context of events is diagnostic.", "srcAnswer": "A"}, {"num": 115, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "A 28-week infant has apnea, pallor and abdominal distension. CBC shows falling platelets. Which diagnosis should be prioritized?", "options": ["Benign reflux", "Uncomplicated apnea of prematurity", "Physiologic anemia only", "NEC/sepsis spectrum"], "answer": 3, "explanation": "Systemic signs, abdominal findings and thrombocytopenia are concerning for NEC/sepsis and should not be attributed to developmental apnea.", "pearl": "Apnea may be an early sign of serious neonatal disease.", "srcAnswer": "A"}, {"num": 116, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Which statement about developmental care in ELBW infants is most appropriate?", "options": ["Cluster care and minimize unnecessary handling while supporting family involvement", "Avoid skin-to-skin contact categorically", "Expose to bright light continuously", "Wake the infant frequently for stimulation"], "answer": 0, "explanation": "Developmental care reduces stress and supports physiologic stability while promoting appropriate parental involvement.", "pearl": "Less unnecessary stimulation, not less family-centered care.", "srcAnswer": "A"}, {"num": 117, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A stable 1200-g infant has temperature instability whenever removed from the incubator for prolonged procedures. Best preventive strategy?", "options": ["Withhold feeds before every handling episode", "Plan and cluster procedures while maintaining a thermoneutral environment", "Use room-temperature surfaces", "Increase procedure duration to improve tolerance"], "answer": 1, "explanation": "Minimizing exposure and maintaining thermal support during procedures reduces heat loss.", "pearl": "Thermal planning is part of procedural planning.", "srcAnswer": "A"}, {"num": 118, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Which physiologic limitation contributes to apnea of prematurity?", "options": ["Excessively mature chemoreceptor function", "Immature central respiratory response to CO2 and hypoxia", "Surfactant excess", "Fixed airway stenosis in all cases"], "answer": 1, "explanation": "Immaturity of respiratory control and chemosensitivity contributes to unstable breathing.", "pearl": "Apnea improves with maturation because respiratory control matures.", "srcAnswer": "A"}, {"num": 119, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A preterm infant receiving caffeine becomes persistently tachycardic and jittery after a dosing error. Best next step?", "options": ["Hold/reassess caffeine exposure and evaluate for toxicity while checking other causes", "Give another loading dose", "Ignore because caffeine cannot cause tachycardia", "Start epinephrine"], "answer": 0, "explanation": "Caffeine toxicity can cause tachycardia and CNS irritability; dosing and clinical status should be reassessed.", "pearl": "Even familiar NICU drugs require dose discipline.", "srcAnswer": "A"}, {"num": 120, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "An ELBW infant has recurrent apnea, anemia with Hb 7.2 g/dL, tachycardia and increasing oxygen requirement. Which principle is best?", "options": ["Caffeine alone must solve the problem", "Anemia cannot affect apnea", "Stop monitoring until Hb falls below 5 g/dL", "Assess whether symptomatic anemia is contributing rather than attributing all events to prematurity"], "answer": 3, "explanation": "Anemia may worsen cardiorespiratory instability; the full clinical context should guide evaluation and transfusion decisions.", "pearl": "Apnea is multifactorial in preterm infants.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Mock_Day1-5_QuizSet8_Q106-120_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Cumulative Mock Quiz 8 — Wrong Answer Report</h1><p><b>Questions:</b> 106–120</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 8 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
