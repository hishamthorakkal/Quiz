<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Mock Quiz 6 — Q76–Q90</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Cumulative Mock — Quiz 6</h1>
<div class="sub">Questions 76–90 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 76, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated neonate has acute desaturation. The ventilator shows high peak pressure and poor delivered tidal volume. Suction catheter cannot pass through the ETT. Most likely cause?", "options": ["Excessive sedation only", "Pneumothorax", "Circuit disconnection", "ETT obstruction"], "answer": 3, "explanation": "High pressure plus inability to pass a suction catheter strongly suggests tube obstruction.", "pearl": "Troubleshoot the airway before turning up pressures.", "srcAnswer": "A"}, {"num": 77, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated neonate suddenly desaturates. Peak pressure falls, exhaled tidal volume is near zero, and the circuit is visibly disconnected. Best immediate action?", "options": ["Reconnect circuit and provide manual ventilation if needed", "Start phototherapy", "Give surfactant", "Needle thoracentesis"], "answer": 0, "explanation": "Low pressure/volume with visible disconnection indicates equipment failure. Restore ventilation immediately.", "pearl": "High-pressure alarms suggest obstruction; low-pressure alarms suggest leak/disconnection.", "srcAnswer": "A"}, {"num": 78, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A neonate with tension pneumothorax is profoundly unstable. What is the priority?", "options": ["Wait for chest X-ray confirmation", "Give diuretics", "Immediate decompression without waiting for formal radiography", "Increase PEEP"], "answer": 2, "explanation": "In an unstable infant with a convincing tension pneumothorax, emergent decompression should not be delayed for imaging.", "pearl": "Treat tension physiology first; confirm later.", "srcAnswer": "A"}, {"num": 79, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Pulmonary interstitial emphysema results from:", "options": ["Pulmonary venous thrombosis", "Isolated surfactant excess", "Pleural fluid accumulation", "Air dissecting from overdistended alveoli into pulmonary interstitium"], "answer": 3, "explanation": "Air leak from ruptured alveoli can track into the interstitium, especially in ventilated very preterm infants.", "pearl": "Air-leak syndromes share a pressure/fragility mechanism.", "srcAnswer": "A"}, {"num": 80, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has persistent asymmetric pulmonary interstitial emphysema predominantly in the right lung. Which strategy may be considered in severe unilateral disease?", "options": ["Positioning with affected side dependent and individualized ventilator adjustments", "Routine increase in tidal volume", "Exchange transfusion", "Stop all PEEP immediately"], "answer": 0, "explanation": "Management aims to reduce further overdistension; positioning and selective strategies may be used depending on severity.", "pearl": "Air leak management is about minimizing pressure while maintaining gas exchange.", "srcAnswer": "A"}, {"num": 81, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.08, PaCO2 38 mmHg, HCO3 11 mmol/L. Lactate is 7 mmol/L. Best interpretation?", "options": ["Compensated metabolic alkalosis", "Respiratory alkalosis", "Severe metabolic acidosis", "Acute respiratory acidosis"], "answer": 2, "explanation": "Markedly low bicarbonate and acidemia with high lactate indicate metabolic acidosis from tissue hypoperfusion or another metabolic cause.", "pearl": "Lactate helps identify perfusion-related metabolic acidosis.", "srcAnswer": "A"}, {"num": 82, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.36, PaCO2 58 mmHg, HCO3 32 mmol/L. Best interpretation?", "options": ["Pure metabolic alkalosis only", "Acute metabolic acidosis", "Chronic/compensated respiratory acidosis", "Uncompensated respiratory alkalosis"], "answer": 2, "explanation": "Near-normal pH with elevated PaCO2 and elevated bicarbonate suggests renal compensation for chronic respiratory acidosis.", "pearl": "BPD patients may develop chronic CO2 retention with compensation.", "srcAnswer": "A"}, {"num": 83, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A BPD infant has chronic PaCO2 58-62 mmHg with normal pH and good growth. Which approach is best?", "options": ["Accept compensated hypercapnia if clinically appropriate rather than escalating injurious ventilation", "Aggressively normalize PaCO2 regardless of ventilator injury", "Give bicarbonate to normalize PaCO2", "Increase FiO2 to lower PaCO2"], "answer": 0, "explanation": "In chronic lung disease, forcing normal PaCO2 may require injurious ventilation; management should consider pH, work of breathing and growth.", "pearl": "Treat physiology and patient goals, not a single normal range.", "srcAnswer": "B"}, {"num": 84, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Which parameter most closely reflects oxygen delivery to tissues?", "options": ["FiO2 alone", "PaO2 alone", "Respiratory rate alone", "Cardiac output × arterial oxygen content"], "answer": 3, "explanation": "Oxygen delivery depends on blood flow and arterial oxygen content, which is strongly influenced by hemoglobin saturation/concentration.", "pearl": "A normal PaO2 does not guarantee adequate oxygen delivery in severe anemia or low output.", "srcAnswer": "A"}, {"num": 85, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has SpO2 95%, PaO2 80 mmHg, PaCO2 75 mmHg and pH 7.17. Which adjustment is most directly needed?", "options": ["Lower tidal volume further without reassessment", "Decrease respiratory rate", "Increase alveolar ventilation", "Increase FiO2"], "answer": 2, "explanation": "Oxygenation is adequate but ventilation is insufficient, causing hypercapnic acidemia.", "pearl": "Do not treat hypercapnia with oxygen.", "srcAnswer": "A"}, {"num": 86, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated infant has SpO2 82%, PaO2 42 mmHg, PaCO2 44 mmHg and pH 7.34 with diffuse atelectasis. Best primary target?", "options": ["Increase minute ventilation solely to lower PaCO2", "Reduce FiO2", "Give bicarbonate", "Improve oxygenation/recruitment"], "answer": 3, "explanation": "CO2 and pH are acceptable; the major problem is oxygenation and likely recruitment.", "pearl": "Read the entire ABG before changing the ventilator.", "srcAnswer": "A"}, {"num": 87, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A preterm infant on pressure-limited ventilation has highly variable tidal volumes as compliance improves after surfactant. Which mode feature can reduce inadvertent volutrauma?", "options": ["100% oxygen", "Fixed high pressure without volume monitoring", "Volume-targeted ventilation", "No PEEP"], "answer": 2, "explanation": "Volume-targeted ventilation adjusts pressure to achieve a target tidal volume and can reduce excessive volume exposure as compliance changes.", "pearl": "Compliance can improve rapidly after surfactant; fixed pressure may suddenly deliver too much volume.", "srcAnswer": "A"}, {"num": 88, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Why can excessive mean airway pressure cause hypotension?", "options": ["It always causes systemic vasodilation only", "It increases preload", "It directly causes hemolysis", "It may reduce venous return and cardiac output"], "answer": 3, "explanation": "High intrathoracic pressure can impede venous return and reduce cardiac output.", "pearl": "Ventilator settings have cardiovascular consequences.", "srcAnswer": "A"}, {"num": 89, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A preterm infant with air leak is on high pressures. Which general ventilator strategy is most appropriate?", "options": ["Eliminate all expiratory time", "Target severe hypocapnia", "Increase tidal volume to reopen the leak", "Use the lowest effective pressures/volumes while maintaining adequate gas exchange"], "answer": 3, "explanation": "Air-leak management emphasizes reducing further barotrauma/volutrauma while maintaining adequate gas exchange.", "pearl": "Gentler ventilation is treatment for many air-leak syndromes.", "srcAnswer": "A"}, {"num": 90, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A ventilated infant with severe RDS develops hypotension after PEEP is increased from 6 to 10 cm H2O; oxygenation improves only minimally. Best next step?", "options": ["Reassess lung recruitment and reduce excessive PEEP if overdistension/hemodynamic compromise is suspected", "Give bicarbonate only", "Ignore blood pressure because oxygenation improved", "Increase PEEP further automatically"], "answer": 0, "explanation": "PEEP should be individualized; minimal oxygenation gain plus hypotension suggests excessive intrathoracic pressure/overdistension.", "pearl": "Every ventilator change needs respiratory and hemodynamic reassessment.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Mock_Day1-5_QuizSet6_Q76-90_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Cumulative Mock Quiz 6 — Wrong Answer Report</h1><p><b>Questions:</b> 76–90</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 6 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
