<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Mock Quiz 1 — Q1–Q15</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Cumulative Mock — Quiz 1</h1>
<div class="sub">Questions 1–15 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 1, "level": "Neonatal Resuscitation · Clinical", "question": "A term infant is apneic after warming, positioning, drying and stimulation. Heart rate is 82/min. What is the best next action?", "options": ["Start 3:1 chest compressions", "Begin positive-pressure ventilation", "Continue stimulation for another minute", "Give IV epinephrine"], "answer": 1, "explanation": "Apnea with HR below 100/min after initial steps requires effective PPV. Compressions are reserved for HR below 60/min after adequate ventilation.", "pearl": "In neonatal resuscitation, ventilation is the pivotal intervention.", "srcAnswer": "B"}, {"num": 2, "level": "Neonatal Resuscitation · High", "question": "After 30 seconds of PPV, the heart rate remains 55/min. The chest is not visibly moving. What should be done before starting compressions?", "options": ["Perform ventilation corrective steps to achieve chest movement", "Give epinephrine through the ETT", "Start compressions immediately", "Increase compression ratio to 15:2"], "answer": 0, "explanation": "Chest compressions should follow at least 30 seconds of effective ventilation. Absent chest movement means ventilation has not yet been shown to be effective.", "pearl": "Do not count ineffective PPV as the 30 seconds required before compressions.", "srcAnswer": "B"}, {"num": 3, "level": "Neonatal Resuscitation · Conceptual", "question": "Which change most strongly indicates that PPV is effective in a depressed newborn?", "options": ["Increase in blood pressure", "Improved skin color", "Appearance of spontaneous limb movement", "Rise in heart rate"], "answer": 3, "explanation": "The most important clinical indicator of effective ventilation is an increasing heart rate.", "pearl": "Heart-rate response is the fastest bedside feedback on lung inflation.", "srcAnswer": "B"}, {"num": 4, "level": "Neonatal Resuscitation · Clinical", "question": "A 39-week infant is born through meconium-stained fluid. The infant cries vigorously and has good tone. What is the best airway approach?", "options": ["Gastric lavage before skin-to-skin contact", "Routine initial newborn care without tracheal suctioning", "Routine tracheal suctioning before drying", "Immediate laryngoscopy and suction under direct vision"], "answer": 1, "explanation": "Routine tracheal suctioning is not indicated solely for meconium when the infant is vigorous.", "pearl": "Meconium changes preparedness, not the need for routine intubation.", "srcAnswer": "B"}, {"num": 5, "level": "Neonatal Resuscitation · High", "question": "A newborn has HR 48/min despite 30 seconds of effective PPV with visible chest movement. What is the next best step?", "options": ["Begin chest compressions coordinated 3:1 with ventilation", "Give sodium bicarbonate before compressions", "Continue PPV alone for 60 seconds", "Stop ventilation and reassess in 1 minute"], "answer": 0, "explanation": "HR below 60/min despite effective ventilation is the threshold for coordinated chest compressions.", "pearl": "The neonatal 3:1 ratio reflects the predominantly asphyxial mechanism of arrest.", "srcAnswer": "B"}, {"num": 6, "level": "Neonatal Resuscitation · Conceptual", "question": "During coordinated neonatal chest compressions, which target best describes the event rate?", "options": ["20 ventilations and 100 compressions per minute", "60 ventilations and 60 compressions per minute", "30 ventilations and 90 compressions per minute", "15 ventilations and 30 compressions per minute"], "answer": 2, "explanation": "A 3:1 compression-to-ventilation ratio produces approximately 90 compressions and 30 breaths each minute.", "pearl": "Think “one-and-two-and-three-and-breathe.”", "srcAnswer": "A"}, {"num": 7, "level": "Neonatal Resuscitation · Clinical", "question": "A 28-week infant needs PPV at birth. After mask repositioning and airway adjustment there is still no chest movement. What is the most appropriate next corrective maneuver?", "options": ["Suction mouth/nose if obstruction is suspected and reopen the airway", "Reduce inflation pressure", "Give IV epinephrine", "Immediately start compressions"], "answer": 0, "explanation": "Ventilation corrective steps address mask seal, airway position, obstruction and pressure before escalation to compressions.", "pearl": "No chest movement = fix ventilation first.", "srcAnswer": "B"}, {"num": 8, "level": "Neonatal Resuscitation · High", "question": "A newborn remains at HR 45/min despite effective ventilation and 60 seconds of coordinated compressions. Which medication/route is preferred?", "options": ["IV epinephrine via umbilical venous access", "Endotracheal atropine", "Subcutaneous epinephrine", "IM epinephrine"], "answer": 0, "explanation": "Epinephrine is indicated for persistent HR below 60/min after effective ventilation and compressions; intravascular administration is preferred.", "pearl": "Umbilical venous access is the usual emergency vascular route in the delivery room.", "srcAnswer": "B"}, {"num": 9, "level": "Neonatal Resuscitation · Clinical", "question": "Following placental abruption, a pale newborn has HR 50/min despite effective ventilation and compressions. Pulses are weak. Which additional intervention should be considered?", "options": ["Routine bicarbonate before vascular access", "Diuretic therapy", "Therapeutic hypothermia during active resuscitation", "Volume expansion for suspected blood loss"], "answer": 3, "explanation": "Acute blood loss/hypovolemia should be considered with pallor, weak pulses and poor response to resuscitation after abruption.", "pearl": "Refractory bradycardia plus pallor should trigger a volume-loss differential.", "srcAnswer": "A"}, {"num": 10, "level": "Neonatal Resuscitation · Basic", "question": "Which heart-rate threshold after initial steps generally indicates the need for PPV?", "options": ["<60/min only", "<80/min only", "<120/min", "<100/min"], "answer": 3, "explanation": "PPV is indicated for apnea/gasping or HR below 100/min after initial steps.", "pearl": "100/min is the ventilation threshold; 60/min is the compression threshold.", "srcAnswer": "C"}, {"num": 11, "level": "Neonatal Resuscitation · Clinical", "question": "A term infant is breathing but centrally cyanosed at 3 minutes. HR is 145/min. Preductal SpO2 is below the expected target. What is the best next step?", "options": ["Chest compressions", "Supplemental oxygen titrated to preductal saturation target", "Epinephrine", "Intubation solely for cyanosis"], "answer": 1, "explanation": "With adequate breathing and HR, oxygen can be titrated using preductal pulse oximetry rather than proceeding to compressions or medications.", "pearl": "Use the right hand/wrist for preductal saturation.", "srcAnswer": "B"}, {"num": 12, "level": "Neonatal Resuscitation · Conceptual", "question": "Why is preductal pulse oximetry preferred during early neonatal transition?", "options": ["It reflects lower-body saturation only", "It directly measures PaCO2", "It samples blood before ductal mixing to the descending aorta", "It is unaffected by perfusion"], "answer": 2, "explanation": "The right upper extremity reflects preductal arterial oxygenation and is used to guide oxygen titration.", "pearl": "Right hand = preductal.", "srcAnswer": "B"}, {"num": 13, "level": "Neonatal Resuscitation · High", "question": "A 30-week infant requires assisted ventilation. According to 2025 AHA/AAP guidance, which initial ventilation rate is reasonable?", "options": ["30-60/min", "10-20/min", "20-30/min", "80-100/min"], "answer": 0, "explanation": "The 2025 neonatal resuscitation guidance considers 30-60 inflations/min reasonable.", "pearl": "Updated range: 30-60 inflations/min.", "srcAnswer": "C"}, {"num": 14, "level": "Neonatal Resuscitation · High", "question": "For a newborn needing PPV, which initial peak inflation pressure range is considered reasonable in 2025 guidance, with subsequent adjustment to effective ventilation?", "options": ["40-50 cm H2O", "10-15 cm H2O", "20-30 cm H2O", "5-10 cm H2O"], "answer": 2, "explanation": "Initial peak inflation pressures of about 20-30 cm H2O are reasonable, then adjusted to achieve effective ventilation.", "pearl": "Use the lowest pressure that achieves effective chest movement and HR response.", "srcAnswer": "C"}, {"num": 15, "level": "Neonatal Resuscitation · Clinical", "question": "A 40-week infant is apneic with HR 70/min. PPV produces good chest movement and HR rises to 125/min, but spontaneous breathing has not started. What is best next?", "options": ["Continue ventilatory support until effective spontaneous breathing", "Stop PPV because HR is >100", "Give epinephrine", "Start chest compressions"], "answer": 0, "explanation": "A heart-rate rise confirms effective ventilation, but persistent apnea still requires ventilatory support.", "pearl": "HR recovery does not equal respiratory recovery.", "srcAnswer": "B"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Mock_Day1-5_QuizSet1_Q1-15_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Cumulative Mock Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–15</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
