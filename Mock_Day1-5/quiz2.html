nt / Non-invasive Support · Clinical", "question": "A 38-week infant born by elective cesarean has tachypnea at 1 hour. CXR shows hyperinflation, perihilar streaking and fluid in the fissures. Best diagnosis?", "options": ["TTN", "Pulmonary hypoplasia", "BPD", "RDS"], "answer": 0, "explanation": "Delayed fetal lung-fluid clearance produces TTN, especially after cesarean delivery without labor.", "pearl": "TTN tends to have hyperinflation; RDS tends to have low lung volume.", "srcAnswer": "B"}, {"num": 34, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A 30-week infant on CPAP 6 cm H2O has worsening RDS and needs FiO2 0.34 to maintain target saturation. According to 2025 European consensus guidance, what is the best next step?", "options": ["Continue CPAP until FiO2 exceeds 0.60", "Intubate solely to deliver 100% oxygen", "Give early rescue surfactant, preferably by thin catheter if spontaneously breathing", "Start systemic steroids immediately"], "answer": 2, "explanation": "The 2025 European consensus suggests surfactant for worsening RDS on non-invasive support when MAP is at least 6 cm H2O and FiO2 is at least 0.30, or based on lung ultrasound evidence. Thin-catheter administration is preferred in spontaneously breathing preterm infants.", "pearl": "FiO2 around 0.30 on adequate NRS is an important surfactant trigger in worsening RDS.", "srcAnswer": "B"}, {"num": 35, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A spontaneously breathing 29-week infant on CPAP requires surfactant. Which delivery method is preferred when expertise is available?", "options": ["Nebulized bronchodilator before surfactant", "Routine INSURE for every infant", "Thin-catheter/LISA administration", "Intramuscular surfactant"], "answer": 2, "explanation": "Current European guidance favors thin-catheter surfactant for spontaneously breathing preterm infants on non-invasive support.", "pearl": "LISA aims to preserve spontaneous breathing and  const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
