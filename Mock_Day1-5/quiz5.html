l disease?", "options": ["Positioning with affected side dependent and individualized ventilator adjustments", "Routine increase in tidal volume", "Exchange transfusion", "Stop all PEEP immediately"], "answer": 0, "explanation": "Management aims to reduce further overdistension; positioning and selective strategies may be used depending on severity.", "pearl": "Air leak management is about minimizing pressure while maintaining gas exchange.", "srcAnswer": "A"}, {"num": 81, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.08, PaCO2 38 mmHg, HCO3 11 mmol/L. Lactate is 7 mmol/L. Best interpretation?", "options": ["Compensated metabolic alkalosis", "Respiratory alkalosis", "Severe metabolic acidosis", "Acute respiratory acidosis"], "answer": 2, "explanation": "Markedly low bicarbonate and acidemia with high lactate indicate metabolic acidosis from tissue hypoperfusion or another metabolic cause.", "pearl": "Lactate helps identify perfusion-related metabolic acidosis.", "srcAnswer": "A"}, {"num": 82, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.36, PaCO2 58 mmHg, HCO3 32 mmol/L. Best interpretation?", "options": ["Pure metabolic alkalosis only", "Acute metabolic acidosis", "Chronic/compensated respiratory acidosis", "Uncompensated respiratory alkalosis"], "answer": 2, "explanation": "Near-normal pH with elevated PaCO2 and elevated bicarbonate suggests renal compensation for chronic respiratory acidosis.", "pearl": "BPD patients may develop chronic CO2 retention with compensation.", "srcAnswer": "A"}, {"num": 83, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A BPD infant has chronic PaCO2 58-62 mmHg with normal pH and good growth. Which approach is best?", "options": ["Accept compensated hypercapnia if clinically appropriate rather than escalating injurious ventilation", "Aggressively normalize PaCO2 regardless of ventilator injury", "Give bicarbonate to normalize PaCO2", "Increase FiO2 to lower PaCO2"], "answer": 0, "explanation": "In chronic lung disease, forcing normal PaCO2 may require injurious ventilation; management should consider pH, work of breathing and growth.", "pearl": "Treat physiology and patient goals, not a single normal range.", "srcAnswer": "B"}, {"num": 84, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Which parameter most closely reflects oxygen delivery to tissues?", "options": ["FiO2 alone", "PaO2 alone", "Respiratory rate alone", "Cardiac output × arterial oxygen content"], "answer": 3, "explanation": "Oxygen delivery depends on blood flow and arterial oxygen content, which is strongly influenced by hemoglobin saturation/concentration.", "pearl": "A normal PaO2 does not guarantee adequate oxygen delivery in severe anemia or low output.", "srcAnswer": "A"}, {"num": 85, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has SpO2 95%, PaO2 80 mmHg, PaCO2 75 mmHg and pH 7.17. Which adjustment is most directly needed?", "options": ["Lower tidal volume further without reassessment", "Decrease respiratory rate", "Increase alveolar ventilation", "Increase FiO2"], "answer": 2, "explanation": "Oxygenation is adequate but ventilation is insufficient, causing hypercapnic acidemia.", "pearl": "Do not treat hypercapnia with oxygen.", "srcAnswer": "A"}, {"num": 86, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated infant has SpO2 82%, PaO2 42 mmHg, PaCO2 44 mmHg and pH 7.34 with diffuse atelectasis. Best primary target?", "options": ["Increase minute ventilation solely to lower PaCO2", "Reduce FiO2", "Give bicarbonate", "Improve oxygenation/recruitment"], "answer": 3, "explanation": "CO2 and pH are acceptable; the major problem is oxygenation and likely recruitment.", "pearl": "Read the entire ABG before changing the ventilator.", "srcAnswer": "A"}, {"num": 87, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A preterm infant on pressure-limited ventilation has highly variable tidal volumes as compliance improves after surfactant. Which mode feature can reduce inadvertent volutrauma?", "options": ["100% oxygen", "Fixed high pressure without volume monitoring", "Volume-targeted ventilation", "No PEEP"], "answer": 2, "explanation": "Volume-targeted ventilation adjusts pressure to achieve a target tidal volume and can reduce excessive volume exposure as compliance changes.", "pearl": "Compliance can improve rapidly after surfactant; fixed pressure may suddenly deliver too much volume.", "srcAnswer": "A"}, {"num": 88, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Why can excessive mean airway pressure cause hypotension?", "options": ["It always causes systemic vasodilation only", "It increases preload", "It directly causes hemolysis", "It may reduce venous return and cardiac output"], "answer": 3, "explanation": "High intrathoracic pressure can impede venous return and reduce cardiac output.", "pearl": "Ventilator settings have cardiovascular consequences.", "srcAnswer": "A"}, {"num": 89, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A preterm infant with air leak is on high pressures. Which general ventilator strategy is most appropriate?", "options": ["Eliminate all expiratory time", "Target severe hypocapnia", "Increase tidal volume to reopen the leak", "Use the lowest effective pressures/volumes while maintaining adequate gas exchange"], "answer": 3, "explanation": "Air-leak management emphasizes reducing further barotrauma/volutrauma while maintaining adequate gas exchange.", "pearl": "Gentler ventilation is treatment for many air-leak syndromes.", "srcAnswer": "A"}, {"num": 90, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A ventilated infant with severe RDS develops hypotension after PEEP is increased from 6 to 10 cm H2O; oxygenation improves only minimally. Best next step?", "options": ["Reassess lung recruitment and reduce excessive PEEP if overdistension/hemodynamic compromise is suspected", "Give bicarbonate only", "Ignore blood pressure because oxygenation improved", "Increase PEEP further automatically"], "answer": 0, "explanation": "PEEP should be individualized; minimal oxygenation gain plus hypotension suggests excessive intrathoracic pressure/overdistension.", "pearl": "Every ventilator change needs respiratory and hemodynamic reassessment.", "srcAnswer": "A"}, {"num": 91, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Basic", "question": "Very low birth weight (VLBW) is defined as birth weight:", "options": ["<1000 g", "<2000 g", "<2500 g", "<1500 g"], "answer": 3, "explanation": "VLBW is birth weight below 1500 g.", "pearl": "VLBW <1500 g; ELBW <1000 g.", "srcAnswer": "C"}, {"num": 92, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Basic", "question": "Extremely low birth weight (ELBW) is defined as birth weight:", "options": ["<750 g", "<1500 g", "<1000 g", "<1250 g"], "answer": 2, "explanation": "ELBW is birth weight below 1000 g.", "pearl": "Keep the 1500/1000 g distinction clear.", "srcAnswer": "C"}, {"num": 93, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Why are extremely preterm infants especially prone to hypothermia?", "options": ["Low evaporative loss", "Excess brown fat and thick skin", "High glycogen stores", "Large surface-area-to-mass ratio, thin skin and low fat stores"], "answer": 3, "explanation": "Large surface area, immature skin barrier, low subcutaneous fat and limited thermal reserves increase heat loss.", "pearl": "Preterm infants lose heat by evaporation, convection, conduction and radiation.", "srcAnswer": "A"}, {"num": 94, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 26-week infant is delivered in a cold room. Which immediate intervention most effectively reduces evaporative heat loss?", "options": ["Delay thermal care until after weighing", "Place in polyethylene wrap/bag under radiant heat with appropriate thermal measures", "Dry completely and leave uncovered", "Cold saline wipe"], "answer": 1, "explanation": "Plastic wrapping/bagging without drying the very preterm skin, combined with radiant heat and other measures, reduces evaporative loss.", "pearl": "Thermal protection begins before NICU admission.", "srcAnswer": "B"}, {"num": 95, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Cold stress increases neonatal risk of:", "options": ["Reduced metabolic demand", "Hyperglycemia only", "Improved surfactant function", "Higher oxygen and glucose consumption"], "answer": 3, "explanation": "Non-shivering thermogenesis consumes oxygen and glucose, increasing risk of hypoxemia, hypoglycemia and metabolic acidosis.", "pearl": "Hypothermia is a metabolic emergency in a tiny preterm infant.", "srcAnswer": "A"}];

 <div class="q">Q${q.num}. ${esc(q.question)}</div>

 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}

 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
