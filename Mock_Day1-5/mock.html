d has good tone. What is the best airway approach?", "options": ["Gastric lavage before skin-to-skin contact", "Routine initial newborn care without tracheal suctioning", "Routine tracheal suctioning before drying", "Immediate laryngoscopy and suction under direct vision"], "answer": 1, "explanation": "Routine tracheal suctioning is not indicated solely for meconium when the infant is vigorous.", "pearl": "Meconium changes preparedness, not the need for routine intubation.", "srcAnswer": "B"}, {"num": 5, "level": "Neonatal Resuscitation · High", "question": "A newborn has HR 48/min despite 30 seconds of effective PPV with visible chest movement. What is the next best step?", "options": ["Begin chest compressions coordinated 3:1 with ventilation", "Give sodium bicarbonate before compressions", "Continue PPV alone for 60 seconds", "Stop ventilation and reassess in 1 minute"], "answer": 0, "explanation": "HR below 60/min despite effective ventilation is the threshold for coordinated chest compressions.", "pearl": "The neonatal 3:1 ratio reflects the predominantly asphyxial mechanism of arrest.", "srcAnswer": "B"}, {"num": 6, "level": "Neonatal Resuscitation · Conceptual", "question": "During coordinated neonatal chest compressions, which target best describes the event rate?", "options": ["20 ventilations and 100 compressions per minute", "60 ventilations and 60 compressions per minute", "30 ventilations and 90 compressions per minute", "15 ventilations and 30 compressions per minute"], "answer": 2, "explanation": "A 3:1 compression-to-ventilation ratio produces approximately 90 compressions and 30 breaths each minute.", "pearl": "Think “one-and-two-and-three-and-breathe.”", "srcAnswer": "A"}, {"num": 7, "level": "Neonatal Resuscitation · Clinical", "question": "A 28-week infant needs PPV at birth. After mask repositioning and airway adjustment there is still no chest movement. What is the most appropriate next corrective maneuver?", "options": ["Suction mouth/nose if after initial steps.", "pearl": "100/min is the ventilation threshold; 60/min is the compression threshold.", "srcAnswer": "C"}, {"num": 11, "level": "Neonatal Resuscitation · Clinical", "question": "A term infant is breathing but centrally cyanosed at 3 minutes. HR is 145/min. Preductal SpO2 is below the expected target. What is the best next step?", "options": ["Chest compressions", "Supplemental oxygen titrated to preductal saturation target", "Epinephrine", "Intubation solely for cyanosis"], "answer": 1, "explanation": "With adequate breathing and HR, oxygen can be titrated using preductal pulse oximetry rather than proceeding to compressions or medications.", "pearl": "Use the right hand/wrist for preductal saturation.", "srcAnswer": "B"}, {"num": 12, "level": "Neonatal Resuscitation · Conceptual", "question": "Why is preductal pulse oximetry preferred during early neonatal transition?", "options": ["It reflects lower-body saturation only", "It directly measures PaCO2", "It samples blood before ductal mixing to the descending aorta", "It is unaffected by perfusion"], "answer": 2, "explanation": "The right upper extremity reflects preductal arterial oxygenation and is used to guide oxygen titration.", "pearl": "Right hand = preductal.", "srcAnswer": "B"}, {"num": 13, "level": "Neonatal Resuscitation · High", "question": "A 30-week infant requires assisted ventilation. According to 2025 AHA/AAP guidance, which initial ventilation rate is reasonable?", "options": ["30-60/min", "10-20/min", "20-30/min", "80-100/min"], "answer": 0, "explanation": "The 2025 neonatal resuscitation guidance considers 30-60 inflations/min reasonable.", "pearl": "Updated range: 30-60 inflations/min.", "srcAnswer": "C"}, {"num": 14, "level": "Neonatal Resuscitation · High", "question": "For a newborn needing PPV, which initial peak inflation pressure range is considered reasonable in 2025 guidance, with subsequent adjustment to effective ventilation?", "options": ["40-50 cm H2O", "10-15 cm H2O", "20-30 cm H2O", "5-10 cm H2O"], "answer": 2, "explanation": "Initial peak inflation pressures of about 20-30 cm H2O are reasonable, then adjusted to achieve effective ventilation.", "pearl": "Use the lowest pressure that achieves effective chest movement and HR response.", "srcAnswer": "C"}, {"num": 15, "level": "Neonatal Resuscitation · Clinical", "question": "A 40-week infant is apneic with HR 70/min. PPV produces good chest movement and HR rises to 125/min, but spontaneous breathing has not started. What is best next?", "options": ["Continue ventilatory support until effective spontaneous breathing", "Stop PPV because HR is >100", "Give epinephrine", "Start chest compressions"], "answer": 0, "explanation": "A heart-rate rise confirms effective ventilation, but persistent apnea still requires ventilatory support.", "pearl": "HR recovery does not equal respiratory recovery.", "srcAnswer": "B"}, {"num": 16, "level": "Neonatal Resuscitation · Clinical", "question": "A newborn with diaphragmatic hernia is severely distressed at birth. Which airway strategy is most appropriate?", "options": ["Early endotracheal intubation and gastric decompression", "Bag-mask ventilation with high pressures", "Routine CPAP only", "Chest compressions before ventilation"], "answer": 0, "explanation": "Bag-mask ventilation may worsen bowel distension in congenital diaphragmatic hernia; intubation and gastric decompression are preferred.", "pearl": "Avoid inflating bowel in suspected CDH.", "srcAnswer": "B"}, {"num": 17, "level": "Neonatal Resuscitation · Conceptual", "question": "Which statement best explains why chest compressions are delayed until ventilation is effective?", "options": ["Most neonatal bradycardia is caused by primary cardiac disease", "Epinephrine is always more effective than ventilation", "Compressions prevent oxygen delivery to the brain", "Most neonatal bradycardia is secondary to inadequate lung inflation/hypoxia"], "answer": 3, "explanation": "Neonatal bradycardia usually reflects hypoxia, so effective lung ventilation often reverses it.", "pearl": "Ventilation before circulation is especially important in newborn resuscitation.", "srcAnswer": "B"}, {"num": 18, "level": "Neonatal Resuscitation · Clinical", "question": "During PPV the mask seal is adequate, the head is positioned, and suction has cleared secretions, but there is still no chest movement. What is the next logical step?", "options": ["Give caffeine", "Increase inflation pressure cautiously", "Start phototherapy", "Reduce PEEP to zero regardless of device"], "answer": 1, "explanation": "If mask/airway problems are corrected and chest movement remains absent, cautiously increasing pressure may be required to achieve lung inflation.", "pearl": "Escalate pressure only after correcting seal and airway problems.", "srcAnswer": "A"}, {"num": 19, "level": "Neonatal Resuscitation · High", "question": "A nonvigorous infant born through meconium remains apneic after initial steps. What should take priority?", "options": ["Chest compressions immediately", "Routine tracheal suctioning before any ventilation", "Gastric lavage", "Initiation of PPV; intubation/suction only if airway obstruction prevents ventilation"], "answer": 3, "explanation": "Current resuscitation emphasizes establishing ventilation rather than routine tracheal suctioning for nonvigorous meconium-exposed infants.", "pearl": "Do not delay ventilation for routine suctioning.", "srcAnswer": "B"}, {"num": 20, "level": "Neonatal Resuscitation · Basic", "question": "Which is the preferred method for rapidly obtaining continuous heart-rate information during advanced resuscitation when available?", "options": ["ECG electrodes", "Oscillometric BP every minute", "Capillary refill", "Palpation of femoral pulse"], "answer": 0, "explanation": "ECG provides rapid continuous heart-rate assessment during resuscitation.", "pearl": "ECG is fast and accurate for HR; pulse oximetry is essential for oxygenation.", "srcAnswer": "A"}, {"num": 21, "level": "Neonatal Resuscitation · Clinical", "question": "A newborn is breathing spontaneously with HR 130/min but has labored breathing and persistent cyanosis. What is the most appropriate support category?", "options": ["No intervention because HR is normal", "Epinephrine", "Chest compressions", "CPAP and/or supplemental oxygen as indicated"], "answer": 3, "explanation": "Spontaneously breathing infants with respiratory distress may need CPAP and oxygen titrated to saturation.", "pearl": "Normal HR does not exclude respiratory support needs.", "srcAnswer": "A"}, {"num": 22, "level": "Neonatal Resuscitation · High", "question": "A newborn receiving compressions has HR 70/min on reassessment. What should be done?", "options": ["Give epinephrine immediately", "Stop compressions and continue ventilation as needed", "Switch to 15:2 compressions", "Continue compressions until HR >100"], "answer": 1, "explanation": "Compressions are stopped when HR rises to 60/min or more; ventilation continues until HR and breathing recover.", "pearl": "60/min is the stop-compressions threshold.", "srcAnswer": "B"}, {"num": 23, "level": "Neonatal Resuscitation · Conceptual", "question": "Which situation most strongly supports delayed cord clamping rather than immediate clamping?", "options": ["Major placental abruption with maternal hemorrhage", "Cord avulsion", "Infant needing immediate chest compressions away from the mother", "Vigorous term infant not requiring immediate resuscitation"], "answer": 3, "explanation": "Deferred cord clamping is appropriate for many infants not requiring immediate resuscitation, with current guidance often supporting 60 seconds or more.", "pearl": "Cord management depends on whether immediate resuscitative access is required.", "srcAnswer": "A"}, {"num": 24, "level": "Neonatal Resuscitation · Clinical", "question": "At 1 minute, a newborn has HR 120/min, irregular respirations, some flexion, grimace with stimulation and acrocyanosis. What is the most important next management determinant?", "options": ["Apgar score alone", "Maternal age", "Birth weight alone", "Current respiratory effort, heart rate and oxygenation"], "answer": 3, "explanation": "Resuscitation decisions are based on physiologic status, not the Apgar score alone.", "pearl": "Apgar describes condition; it does not drive the resuscitation algorithm.", "srcAnswer": "B"}, {"num": 25, "level": "Neonatal Resuscitation · High", "question": "A 31-week infant requires PPV. Which statement best reflects current oxygen strategy?", "options": ["Room air is mandatory for all gestations", "Initial oxygen should be selected by gestational age and titrated to preductal SpO2", "All preterm infants must start at FiO2 1.0", "Oxygen concentration should not be changed for 10 minutes"], "answer": 1, "explanation": "Current guidance stratifies initial oxygen by gestational age and emphasizes titration using preductal saturation.", "pearl": "Avoid both reflexive 100% oxygen and rigid room-air-only thinking in very preterm infants.", "srcAnswer": "B"}, {"num": 26, "level": "Neonatal Resuscitation · Clinical", "question": "A newborn has HR 55/min after 30 seconds of PPV, but auscultation shows bilateral air entry and visible chest rise. What is the next step?", "options": ["Give naloxone", "Begin coordinated compressions", "Repeat initial drying and stimulation", "Stop PPV"], "answer": 1, "explanation": "With confirmed effective ventilation and HR <60/min, compressions are indicated.", "pearl": "The decision hinges on whether ventilation was effective.", "srcAnswer": "A"}, {"num": 27, "level": "Neonatal Resuscitation · Conceptual", "question": "Why is a two-thumb encircling technique preferred for neonatal chest compressions when feasible?", "options": ["It generally provides more effective and consistent compressions with less rescuer fatigue", "It allows deeper uncontrolled compression", "It is used only in infants >4 kg", "It eliminates the need for ventilation"], "answer": 0, "explanation": "The two-thumb technique provides effective sternal compression and is generally preferred.", "pearl": "Technique matters, but ventilation remains coordinated at 3:1.", "srcAnswer": "B"}, {"num": 28, "level": "Neonatal Resuscitation · Clinical", "question": "A newborn is intubated during resuscitation. Which finding is the best immediate evidence that the tube is ventilating the lungs?", "options": ["Fogging in the tube only", "Rapid rise in heart rate with bilateral chest movement", "Persistent bradycardia", "Gastric distension"], "answer": 1, "explanation": "A heart-rate rise with chest movement is strong evidence of effective ventilation; exhaled CO2 detection is also useful when circulation is adequate.", "pearl": "Clinical response is critical even when devices are used.", "srcAnswer": "A"}, {"num": 29, "level": "Neonatal Resuscitation · High", "question": "A newborn with persistent bradycardia receives epinephrine but remains at HR 50/min. What is the best next principle?", "options": ["Give repeated bicarbonate as sole therapy", "Abandon vascular access", "Stop ventilation while waiting for the drug", "Continue effective ventilation and compressions while reassessing reversible causes and medication timing"], "answer": 3, "explanation": "Epinephrine does not replace ventilation/compressions; ongoing effective cardiopulmonary support and correction of causes remain essential.", "pearl": "Medication is an adjunct, not the core of neonatal resuscitation.", "srcAnswer": "B"}, {"num": 30, "level": "Neonatal Resuscitation · Conceptual", "question": "Which error is most likely to cause failure of neonatal resuscitation despite apparently correct timing?", "options": ["Applying a preductal oximeter", "Reassessing heart rate", "Using a radiant warmer", "Failure to establish effective ventilation"], "answer": 3, "explanation": "Failure to ventilate the lungs effectively is the most important remediable problem in neonatal resuscitation.", "pearl": "When HR does not rise, first ask: is ventilation truly effective?", "srcAnswer": "A"}, {"num": 31, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 28-week infant develops grunting and retractions within minutes of birth. CXR shows low lung volumes, diffuse reticulogranular opacities and air bronchograms. Most likely diagnosis?", "options": ["Meconium aspiration syndrome", "Respiratory distress syndrome", "Transient tachypnea of newborn", "Congenital pneumonia with hyperinflation"], "answer": 1, "explanation": "The combination of prematurity, immediate distress, low volumes and diffuse granular opacities is classic for surfactant-deficient RDS.", "pearl": "RDS: low volume + ground-glass/reticulogranular pattern + air bronchograms.", "srcAnswer": "B"}, {"num": 32, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "The dominant mechanical consequence of surfactant deficiency is:", "options": ["Increased compliance and reduced work of breathing", "Pulmonary venous hypertension", "Increased surface tension causing alveolar instability and reduced compliance", "Fixed upper-airway obstruction"], "answer": 2, "explanation": "Surfactant lowers alveolar surface tension. Deficiency promotes end-expiratory collapse, low FRC and poor compliance.", "pearl": "Think Laplace: without surfactant, small alveoli are unstable.", "srcAnswer": "B"}, {"num": 33, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 38-week infant born by elective cesarean has tachypnea at 1 hour. CXR shows hyperinflation, perihilar streaking and fluid in the fissures. Best diagnosis?", "options": ["TTN", "Pulmonary hypoplasia", "BPD", "RDS"], "answer": 0, "explanation": "Delayed fetal lung-fluid clearance produces TTN, especially after cesarean delivery without labor.", "pearl": "TTN tends to have hyperinflation; RDS tends to have low lung volume.", "srcAnswer": "B"}, {"num": 34, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A 30-week infant on CPAP 6 cm H2O has worsening RDS and needs FiO2 0.34 to maintain target saturation. According to 2025 European consensus guidance, what is the best next step?", "options": ["Continue CPAP until FiO2 exceeds 0.60", "Intubate solely to deliver 100% oxygen", "Give early rescue surfactant, preferably by thin catheter if spontaneously breathing", "Start systemic steroids immediately"], "answer": 2, "explanation": "The 2025 European consensus suggests surfactant for worsening RDS on non-invasive support when MAP is at least 6 cm H2O and FiO2 is at least 0.30, or based on lung ultrasound evidence. Thin-catheter administration is preferred in spontaneously breathing preterm infants.", "pearl": "FiO2 around 0.30 on adequate NRS is an important surfactant trigger in worsening RDS.", "srcAnswer": "B"}, {"num": 35, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A spontaneously breathing 29-week infant on CPAP requires surfactant. Which delivery method is preferred when expertise is available?", "options": ["Nebulized bronchodilator before surfactant", "Routine INSURE for every infant", "Thin-catheter/LISA administration", "Intramuscular surfactant"], "answer": 2, "explanation": "Current European guidance favors thin-catheter surfactant for spontaneously breathing preterm infants on non-invasive support.", "pearl": "LISA aims to preserve spontaneous breathing and avoid mechanical ventilation.", "srcAnswer": "B"}, {"num": 36, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "For rescue therapy with poractant alfa, which initial dose is favored by European consensus guidance?", "options": ["50 mg/kg", "200 mg/kg", "100 mg/kg", "400 mg/kg"], "answer": 1, "explanation": "An initial 200 mg/kg dose of poractant alfa is favored over 100 mg/kg for rescue treatment.", "pearl": "Know the drug-specific dose, not just “give surfactant.”", "srcAnswer": "C"}, {"num": 37, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 27-week infant is intubated for stabilization shortly after birth and has clinical RDS. What is the best surfactant strategy?", "options": ["Wait for a chest radiograph before any surfactant", "Delay surfactant for 12 hours", "Give surfactant promptly", "Use only inhaled nitric oxide"], "answer": 2, "explanation": "Very preterm infants requiring intubation for stabilization should receive surfactant early when RDS is present.", "pearl": "If a very preterm infant is already intubated for stabilization, do not unnecessarily delay surfactant.", "srcAnswer": "B"}, {"num": 38, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "CPAP improves oxygenation in RDS primarily by:", "options": ["Reducing end-expiratory lung volume", "Suppressing spontaneous breathing", "Maintaining alveolar recruitment and functional residual capacity", "Increasing pulmonary edema"], "answer": 2, "explanation": "Positive distending pressure prevents end-expiratory alveolar collapse and improves FRC.", "pearl": "CPAP is a recruitment strategy, not merely an oxygen-delivery device.", "srcAnswer": "B"}, {"num": 39, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 34-week infant has respiratory distress. CXR shows coarse patchy infiltrates, areas of hyperinflation and a history of meconium-stained liquor. Which diagnosis is most likely?", "options": ["Meconium aspiration syndrome", "RDS", "TTN", "BPD"], "answer": 0, "explanation": "Patchy disease with hyperinflation and meconium exposure favors MAS rather than uniform low-volume RDS.", "pearl": "MAS is heterogeneous and can create ball-valve air trapping.", "srcAnswer": "C"}, {"num": 40, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A preterm infant with RDS on CPAP suddenly deteriorates with marked desaturation and asymmetric chest movement. What should be excluded immediately?", "options": ["ROP", "Physiologic anemia", "Pneumothorax", "Apnea of prematurity"], "answer": 2, "explanation": "Sudden deterioration and asymmetry in RDS should prompt urgent assessment for air leak, especially pneumothorax.", "pearl": "Abrupt deterioration is not “just worsening RDS.”", "srcAnswer": "A"}, {"num": 41, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Antenatal corticosteroids reduce RDS mainly by:", "options": ["Preventing all neonatal infections", "Increasing fetal hemoglobin concentration", "Closing the ductus arteriosus before birth", "Accelerating fetal lung maturation and surfactant-related function"], "answer": 3, "explanation": "Antenatal corticosteroids accelerate structural and biochemical lung maturation and reduce respiratory morbidity.", "pearl": "Antenatal steroids improve lung readiness; postnatal surfactant treats established deficiency.", "srcAnswer": "B"}, {"num": 42, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 32-week infant on CPAP has FiO2 0.24, mild retractions and improving blood gases. What is the best approach?", "options": ["Start inhaled nitric oxide", "Continue non-invasive support and close reassessment", "Electively intubate to prevent fatigue", "Give surfactant solely because gestation is <34 weeks"], "answer": 1, "explanation": "Surfactant should be targeted to worsening RDS rather than given automatically to every stable preterm infant on low oxygen needs.", "pearl": "Treat trajectory and severity, not gestational age alone.", "srcAnswer": "B"}, {"num": 43, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A 29-week infant receives surfactant but remains on FiO2 0.55 with radiographic RDS after other causes are excluded. Best next principle?", "options": ["Stop all distending pressure", "Never repeat surfactant", "Consider a second dose of surfactant", "Immediately diagnose BPD"], "answer": 2, "explanation": "A second and occasionally third dose may be appropriate when ongoing RDS with high oxygen need persists after excluding other causes.", "pearl": "Persistent oxygen need after surfactant requires reassessment before redosing.", "srcAnswer": "B"}, {"num": 44, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "Which finding would favor congenital pneumonia over uncomplicated RDS in a preterm infant?", "options": ["Low lung volume alone", "Maternal infection risk, hemodynamic instability and inflammatory signs", "Improvement with CPAP", "Need for oxygen at birth alone"], "answer": 1, "explanation": "Pneumonia can mimic RDS, but infectious risk, systemic instability and inflammatory evidence shift probability toward infection.", "pearl": "RDS and pneumonia can coexist; context matters.", "srcAnswer": "A"}, {"num": 45, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Which statement about oxygen in preterm RDS is most appropriate?", "options": ["FiO2 should never exceed 0.21", "Oxygen should be titrated to target saturation while minimizing hyperoxia", "Pulse oximetry is unnecessary on CPAP", "Higher FiO2 is harmless if saturation is normal"], "answer": 1, "explanation": "Both hypoxemia and hyperoxia are harmful; oxygen should be titrated to saturation targets.", "pearl": "Oxygen is a drug with a dose and toxicity.", "srcAnswer": "B"}, {"num": 46, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 30-week infant on nasal CPAP develops frequent desaturations due to mouth leak and poor prong fit. Before declaring CPAP failure, what should be done?", "options": ["Proceed directly to tracheostomy", "Stop respiratory support", "Give surfactant regardless of clinical picture", "Optimize interface, seal, positioning and airway patency"], "answer": 3, "explanation": "Non-invasive support failure may reflect interface problems; technical optimization should precede unnecessary escalation when the infant is otherwise stable.", "pearl": "Always troubleshoot the interface before labeling NRS failure.", "srcAnswer": "A"}, {"num": 47, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A preterm infant has increasing oxygen requirement on CPAP, but lung ultrasound shows a focal consolidation with air bronchograms rather than diffuse RDS pattern. Best next step?", "options": ["Discontinue all support", "Reassess for pneumonia/atelectasis and treat the underlying process", "Assume surfactant deficiency is the only cause", "Give repeated surfactant without reassessment"], "answer": 1, "explanation": "Worsening oxygen need is not specific for surfactant deficiency; focal consolidation should prompt evaluation for alternative pathology.", "pearl": "Surfactant thresholds apply after considering competing causes.", "srcAnswer": "B"}, {"num": 48, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 36-week infant has tachypnea but normal oxygen saturation, minimal retractions and rapid improvement over 12 hours. Which diagnosis is most consistent?", "options": ["TTN", "Severe RDS", "BPD", "PPHN with right-to-left shunt"], "answer": 0, "explanation": "A mild, rapidly improving course in a near-term infant favors TTN.", "pearl": "Trajectory is a diagnostic test in neonatal respiratory disease.", "srcAnswer": "A"}, {"num": 49, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Why can excessive CPAP pressure be harmful?", "options": ["It always causes surfactant deficiency", "It can overdistend lungs and impair venous return", "It prevents oxygen delivery", "It eliminates all spontaneous breathing"], "answer": 1, "explanation": "Excess distending pressure can cause overinflation, air leak and hemodynamic compromise.", "pearl": "Recruit without overdistending.", "srcAnswer": "A"}, {"num": 50, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A preterm infant on non-invasive support has recurrent apnea despite adequate distending pressure. Which addition may reduce need for intubation when apnea of prematurity is contributing?", "options": ["Routine morphine", "Loop diuretic", "Caffeine", "Phenobarbital in all cases"], "answer": 2, "explanation": "Caffeine improves respiratory drive and is commonly used in apnea of prematurity, complementing non-invasive support.", "pearl": "Respiratory support and respiratory drive are separate therapeutic targets.", "srcAnswer": "A"}, {"num": 51, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A 31-week infant on CPAP 7 cm H2O requires FiO2 0.32. Work of breathing is increasing. Which factor most strongly favors surfactant now rather than watchful waiting?", "options": ["FiO2 has crossed a guideline-supported threshold on adequate distending pressure with worsening clinical RDS", "The infant weighs >1 kg", "Birth was at night", "The infant is male"], "answer": 0, "explanation": "Worsening RDS plus FiO2 around/above 0.30 on adequate NRS supports early rescue surfactant.", "pearl": "Use combined oxygen requirement + pressure + clinical trajectory.", "srcAnswer": "A"}, {"num": 52, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A preterm infant has diffuse RDS and receives surfactant. Minutes later oxygenation improves markedly. What ventilator/CPAP adjustment principle is important?", "options": ["Increase FiO2 to 1.0", "Stop monitoring saturation", "Rapidly reassess and reduce excessive oxygen/pressure as tolerated", "Keep all settings unchanged for 12 hours"], "answer": 2, "explanation": "Surfactant can rapidly improve compliance and oxygenation, so support must be reassessed to avoid volutrauma and hyperoxia.", "pearl": "After surfactant, the lung can change quickly.", "srcAnswer": "A"}, {"num": 53, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Which radiographic feature most strongly differentiates TTN from classic RDS?", "options": ["Low lung volume", "Diffuse granular opacity", "Hyperinflation with fissural fluid", "Air bronchograms"], "answer": 2, "explanation": "TTN classically shows hyperinflation, prominent vascular/interstitial markings and fluid in fissures.", "pearl": "Volume pattern is a useful discriminator.", "srcAnswer": "A"}, {"num": 54, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A term infant with severe hypoxemia has relatively clear lungs and a marked preductal-postductal saturation difference. Which diagnosis should be considered?", "options": ["BPD", "Apnea of prematurity", "Uncomplicated TTN only", "PPHN"], "answer": 3, "explanation": "A pre/postductal difference with severe hypoxemia suggests right-to-left shunting through the ductus in PPHN.", "pearl": "Not every hypoxemic newborn has primary parenchymal lung disease.", "srcAnswer": "A"}, {"num": 55, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "Which infant is the best candidate for continued CPAP rather than immediate intubation?", "options": ["Infant with shock and severe respiratory acidosis despite support", "Spontaneously breathing 29-week infant with moderate RDS and stable gas exchange", "Infant with recurrent severe apnea and HR 50/min despite PPV", "Infant with airway obstruction not relieved by positioning"], "answer": 1, "explanation": "Stable spontaneously breathing preterm infants with RDS are appropriate candidates for non-invasive support.", "pearl": "Choose the least invasive support that safely achieves gas exchange.", "srcAnswer": "A"}, {"num": 56, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "The major advantage of non-invasive respiratory support in preterm infants is reduction of:", "options": ["Exposure to invasive mechanical ventilation and associated lung injury", "Risk of all infections to zero", "Need for thermoregulation", "Need for any monitoring"], "answer": 0, "explanation": "Avoiding intubation and invasive ventilation can reduce ventilator-associated lung injury when gas exchange is adequate.", "pearl": "NRS is lung-protective when used in the right patient.", "srcAnswer": "B"}, {"num": 57, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 30-week infant with RDS has pH 7.31, PaCO2 48 mmHg and acceptable oxygenation on CPAP. Which is the best interpretation?", "options": ["Gas exchange is acceptable; continue close non-invasive management", "The infant requires bicarbonate", "Severe respiratory acidosis is present", "Immediate intubation is mandatory"], "answer": 0, "explanation": "These values do not show severe respiratory acidosis; management should be guided by overall work of breathing and trend.", "pearl": "Treat the infant and trend, not a mildly abnormal number in isolation.", "srcAnswer": "B"}, {"num": 58, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A preterm infant has worsening RDS but is spontaneously breathing. Which strategy best aligns with lung-protective care?", "options": ["High tidal-volume ventilation first", "Delay surfactant until severe acidosis develops", "Early surfactant by thin catheter while maintaining spontaneous breathing when appropriate", "Routine prolonged bag-mask ventilation"], "answer": 2, "explanation": "Early selective surfactant by thin catheter can reduce exposure to invasive ventilation.", "pearl": "Early rescue is preferable to waiting for avoidable deterioration.", "srcAnswer": "A"}, {"num": 59, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A newborn with respiratory distress has scaphoid abdomen and bowel sounds in the chest. What is the best respiratory action?", "options": ["Aggressive mask ventilation", "CPAP 10 cm H2O by mask", "Intubate and decompress the stomach", "Observe without support"], "answer": 2, "explanation": "Suspected congenital diaphragmatic hernia requires avoidance of bag-mask inflation and gastric decompression with controlled ventilation.", "pearl": "Respiratory distress plus scaphoid abdomen changes the algorithm.", "srcAnswer": "B"}, {"num": 60, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Which feature most strongly suggests CPAP failure rather than simple interface leak?", "options": ["Occasional bubbling in the circuit", "Brief desaturation during handling", "Progressive respiratory acidosis and recurrent apnea despite optimized interface and pressure", "Mild nasal blanching"], "answer": 2, "explanation": "Persistent physiologic deterioration despite optimized NRS indicates true support failure and need for escalation.", "pearl": "Failure is physiologic, not merely technical.", "srcAnswer": "A"}, {"num": 61, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.20, PaCO2 68 mmHg, HCO3 25 mmol/L. What is the primary disorder?", "options": ["Metabolic acidosis", "Acute respiratory acidosis", "Respiratory alkalosis", "Metabolic alkalosis"], "answer": 1, "explanation": "Acidemia with elevated PaCO2 and near-normal bicarbonate indicates acute respiratory acidosis.", "pearl": "First identify pH direction, then the variable moving in the acidifying direction.", "srcAnswer": "A"}, {"num": 62, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.25, PaCO2 30 mmHg, HCO3 13 mmol/L. Best interpretation?", "options": ["Metabolic alkalosis", "Metabolic acidosis with respiratory compensation", "Primary respiratory alkalosis only", "Respiratory acidosis with renal compensation"], "answer": 1, "explanation": "Low bicarbonate explains the acidemia; low PaCO2 represents compensatory hyperventilation.", "pearl": "Do not label every low PaCO2 as primary respiratory alkalosis.", "srcAnswer": "A"}, {"num": 63, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.50, PaCO2 27 mmHg, HCO3 21 mmol/L. Primary disorder?", "options": ["Respiratory alkalosis", "Metabolic alkalosis", "Metabolic acidosis", "Respiratory acidosis"], "answer": 0, "explanation": "Alkalemia with a low PaCO2 is a primary respiratory alkalosis.", "pearl": "Excess minute ventilation can cause hypocapnia.", "srcAnswer": "A"}, {"num": 64, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Which ventilator change most directly increases CO2 clearance when all else is unchanged?", "options": ["Decrease tidal volume and rate", "Increase dead space", "Increase effective alveolar minute ventilation", "Increase FiO2 only"], "answer": 2, "explanation": "PaCO2 is inversely related to effective alveolar ventilation.", "pearl": "CO2 is primarily a ventilation problem; oxygenation is a different axis.", "srcAnswer": "A"}, {"num": 65, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has PaCO2 25 mmHg repeatedly. Why should this be corrected?", "options": ["Hypocapnia prevents air leak", "Hypocapnia can reduce cerebral blood flow", "Hypocapnia always improves neurodevelopment", "Low PaCO2 means inadequate ventilation"], "answer": 1, "explanation": "Marked hypocapnia causes cerebral vasoconstriction and is associated with neurologic injury risk.", "pearl": "Avoid both severe hypercapnia and hypocapnia.", "srcAnswer": "A"}, {"num": 66, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated 27-week infant suddenly desaturates and becomes bradycardic. Right-sided breath sounds are markedly reduced. Most urgent diagnosis?", "options": ["BPD", "PDA", "NEC", "Right pneumothorax"], "answer": 3, "explanation": "Acute unilateral loss of breath sounds with deterioration strongly suggests pneumothorax.", "pearl": "Sudden change = think tube, obstruction, pneumothorax, equipment.", "srcAnswer": "A"}, {"num": 67, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated infant suddenly deteriorates. Breath sounds are equal but the ETT marking is now 2 cm deeper than previously and left chest movement is reduced. Best explanation?", "options": ["Right mainstem intubation", "Left tension pneumothorax", "BPD exacerbation", "Pulmonary hemorrhage"], "answer": 0, "explanation": "An overly deep ETT commonly enters the right main bronchus, reducing left ventilation.", "pearl": "Check tube depth before escalating ventilator settings.", "srcAnswer": "A"}, {"num": 68, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "The central goal of lung-protective ventilation in preterm infants is to minimize:", "options": ["Physiologic anemia", "Enteral feeding intolerance", "Volutrauma, barotrauma and atelectrauma", "Hyperbilirubinemia"], "answer": 2, "explanation": "Excessive tidal volume/pressure and repeated collapse-reopening contribute to ventilator-induced lung injury.", "pearl": "Gentle ventilation is about avoiding both overdistension and derecruitment.", "srcAnswer": "A"}, {"num": 69, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A 26-week infant is ventilated with tidal volume 8-9 mL/kg and develops hypocapnia. Which change best reflects lung-protective strategy?", "options": ["Increase FiO2 only", "Increase tidal volume further", "Reduce delivered tidal volume/minute ventilation while maintaining adequate recruitment", "Add bicarbonate"], "answer": 2, "explanation": "Excessive tidal volume can cause volutrauma and hypocapnia; reduce ventilation while preserving oxygenation/recruitment.", "pearl": "Volume matters even when pressure looks acceptable.", "srcAnswer": "A"}, {"num": 70, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A preterm infant has acceptable PaCO2 but requires high FiO2 with diffuse atelectasis. Which ventilator domain should be optimized first?", "options": ["Caffeine dose only", "Respiratory rate only", "Dead space", "Mean airway pressure/recruitment strategy"], "answer": 3, "explanation": "Oxygenation is strongly influenced by lung recruitment and mean airway pressure, whereas CO2 clearance is more dependent on minute ventilation.", "pearl": "Oxygenation and ventilation are related but not interchangeable.", "srcAnswer": "A"}, {"num": 71, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Increasing PEEP in a recruitable lung primarily tends to:", "options": ["Directly lower bilirubin", "Decrease FRC", "Increase end-expiratory lung volume", "Reduce venous return only without lung effect"], "answer": 2, "explanation": "PEEP prevents end-expiratory collapse and increases FRC, though excessive PEEP can impair hemodynamics.", "pearl": "PEEP is a recruitment tool with a hemodynamic cost if excessive.", "srcAnswer": "A"}, {"num": 72, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A 25-week infant remains oxygen dependent with chronic respiratory support at 36 weeks postmenstrual age after prolonged ventilation. Which diagnosis is most likely?", "options": ["Bronchopulmonary dysplasia", "TTN", "Acute RDS only", "Meconium aspiration"], "answer": 0, "explanation": "Persistent respiratory support/oxygen requirement in a very preterm infant at later postmenstrual age is characteristic of BPD.", "pearl": "BPD reflects disrupted lung development plus injury.", "srcAnswer": "A"}, {"num": 73, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Which exposure is most directly modifiable to reduce BPD risk?", "options": ["Use large tidal volumes to prevent atelectasis", "Avoid unnecessary invasive ventilation and excessive oxygen", "Delay caffeine in all infants", "Increase oxygen saturation to 100%"], "answer": 1, "explanation": "Reducing invasive ventilation, oxygen toxicity and ventilator-induced injury are core preventive principles.", "pearl": "BPD prevention begins in the delivery room.", "srcAnswer": "A"}, {"num": 74, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated infant has pH 7.18, PaCO2 72 mmHg, worsening retractions and frequent apnea despite support. Best interpretation?", "options": ["Primary respiratory alkalosis", "Isolated metabolic acidosis", "Acceptable gas that requires no action", "Clinically important ventilatory failure requiring reassessment/escalation"], "answer": 3, "explanation": "Severe hypercapnic acidemia with clinical deterioration indicates inadequate ventilation or another acute problem.", "pearl": "Permissive hypercapnia is not permissive severe acidemia.", "srcAnswer": "A"}, {"num": 75, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A preterm infant with BPD has sudden increased oxygen need. CXR shows a new focal opacity and ETT secretions are purulent. Best next step?", "options": ["Evaluate for superimposed infection/atelectasis and treat accordingly", "Assume BPD progression only", "Increase oxygen indefinitely without investigation", "Give surfactant routinely"], "answer": 0, "explanation": "Acute deterioration in chronic lung disease should trigger evaluation for superimposed pathology rather than attribution to BPD alone.", "pearl": "Chronic diagnosis does not explain every acute change.", "srcAnswer": "B"}, {"num": 76, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated neonate has acute desaturation. The ventilator shows high peak pressure and poor delivered tidal volume. Suction catheter cannot pass through the ETT. Most likely cause?", "options": ["Excessive sedation only", "Pneumothorax", "Circuit disconnection", "ETT obstruction"], "answer": 3, "explanation": "High pressure plus inability to pass a suction catheter strongly suggests tube obstruction.", "pearl": "Troubleshoot the airway before turning up pressures.", "srcAnswer": "A"}, {"num": 77, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated neonate suddenly desaturates. Peak pressure falls, exhaled tidal volume is near zero, and the circuit is visibly disconnected. Best immediate action?", "options": ["Reconnect circuit and provide manual ventilation if needed", "Start phototherapy", "Give surfactant", "Needle thoracentesis"], "answer": 0, "explanation": "Low pressure/volume with visible disconnection indicates equipment failure. Restore ventilation immediately.", "pearl": "High-pressure alarms suggest obstruction; low-pressure alarms suggest leak/disconnection.", "srcAnswer": "A"}, {"num": 78, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A neonate with tension pneumothorax is profoundly unstable. What is the priority?", "options": ["Wait for chest X-ray confirmation", "Give diuretics", "Immediate decompression without waiting for formal radiography", "Increase PEEP"], "answer": 2, "explanation": "In an unstable infant with a convincing tension pneumothorax, emergent decompression should not be delayed for imaging.", "pearl": "Treat tension physiology first; confirm later.", "srcAnswer": "A"}, {"num": 79, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Pulmonary interstitial emphysema results from:", "options": ["Pulmonary venous thrombosis", "Isolated surfactant excess", "Pleural fluid accumulation", "Air dissecting from overdistended alveoli into pulmonary interstitium"], "answer": 3, "explanation": "Air leak from ruptured alveoli can track into the interstitium, especially in ventilated very preterm infants.", "pearl": "Air-leak syndromes share a pressure/fragility mechanism.", "srcAnswer": "A"}, {"num": 80, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has persistent asymmetric pulmonary interstitial emphysema predominantly in the right lung. Which strategy may be considered in severe unilateral disease?", "options": ["Positioning with affected side dependent and individualized ventilator adjustments", "Routine increase in tidal volume", "Exchange transfusion", "Stop all PEEP immediately"], "answer": 0, "explanation": "Management aims to reduce further overdistension; positioning and selective strategies may be used depending on severity.", "pearl": "Air leak management is about minimizing pressure while maintaining gas exchange.", "srcAnswer": "A"}, {"num": 81, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.08, PaCO2 38 mmHg, HCO3 11 mmol/L. Lactate is 7 mmol/L. Best interpretation?", "options": ["Compensated metabolic alkalosis", "Respiratory alkalosis", "Severe metabolic acidosis", "Acute respiratory acidosis"], "answer": 2, "explanation": "Markedly low bicarbonate and acidemia with high lactate indicate metabolic acidosis from tissue hypoperfusion or another metabolic cause.", "pearl": "Lactate helps identify perfusion-related metabolic acidosis.", "srcAnswer": "A"}, {"num": 82, "level": "Ventilation / ABG / BPD / Air Leak · ABG", "question": "ABG: pH 7.36, PaCO2 58 mmHg, HCO3 32 mmol/L. Best interpretation?", "options": ["Pure metabolic alkalosis only", "Acute metabolic acidosis", "Chronic/compensated respiratory acidosis", "Uncompensated respiratory alkalosis"], "answer": 2, "explanation": "Near-normal pH with elevated PaCO2 and elevated bicarbonate suggests renal compensation for chronic respiratory acidosis.", "pearl": "BPD patients may develop chronic CO2 retention with compensation.", "srcAnswer": "A"}, {"num": 83, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A BPD infant has chronic PaCO2 58-62 mmHg with normal pH and good growth. Which approach is best?", "options": ["Accept compensated hypercapnia if clinically appropriate rather than escalating injurious ventilation", "Aggressively normalize PaCO2 regardless of ventilator injury", "Give bicarbonate to normalize PaCO2", "Increase FiO2 to lower PaCO2"], "answer": 0, "explanation": "In chronic lung disease, forcing normal PaCO2 may require injurious ventilation; management should consider pH, work of breathing and growth.", "pearl": "Treat physiology and patient goals, not a single normal range.", "srcAnswer": "B"}, {"num": 84, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Which parameter most closely reflects oxygen delivery to tissues?", "options": ["FiO2 alone", "PaO2 alone", "Respiratory rate alone", "Cardiac output × arterial oxygen content"], "answer": 3, "explanation": "Oxygen delivery depends on blood flow and arterial oxygen content, which is strongly influenced by hemoglobin saturation/concentration.", "pearl": "A normal PaO2 does not guarantee adequate oxygen delivery in severe anemia or low output.", "srcAnswer": "A"}, {"num": 85, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated preterm infant has SpO2 95%, PaO2 80 mmHg, PaCO2 75 mmHg and pH 7.17. Which adjustment is most directly needed?", "options": ["Lower tidal volume further without reassessment", "Decrease respiratory rate", "Increase alveolar ventilation", "Increase FiO2"], "answer": 2, "explanation": "Oxygenation is adequate but ventilation is insufficient, causing hypercapnic acidemia.", "pearl": "Do not treat hypercapnia with oxygen.", "srcAnswer": "A"}, {"num": 86, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A ventilated infant has SpO2 82%, PaO2 42 mmHg, PaCO2 44 mmHg and pH 7.34 with diffuse atelectasis. Best primary target?", "options": ["Increase minute ventilation solely to lower PaCO2", "Reduce FiO2", "Give bicarbonate", "Improve oxygenation/recruitment"], "answer": 3, "explanation": "CO2 and pH are acceptable; the major problem is oxygenation and likely recruitment.", "pearl": "Read the entire ABG before changing the ventilator.", "srcAnswer": "A"}, {"num": 87, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A preterm infant on pressure-limited ventilation has highly variable tidal volumes as compliance improves after surfactant. Which mode feature can reduce inadvertent volutrauma?", "options": ["100% oxygen", "Fixed high pressure without volume monitoring", "Volume-targeted ventilation", "No PEEP"], "answer": 2, "explanation": "Volume-targeted ventilation adjusts pressure to achieve a target tidal volume and can reduce excessive volume exposure as compliance changes.", "pearl": "Compliance can improve rapidly after surfactant; fixed pressure may suddenly deliver too much volume.", "srcAnswer": "A"}, {"num": 88, "level": "Ventilation / ABG / BPD / Air Leak · Conceptual", "question": "Why can excessive mean airway pressure cause hypotension?", "options": ["It always causes systemic vasodilation only", "It increases preload", "It directly causes hemolysis", "It may reduce venous return and cardiac output"], "answer": 3, "explanation": "High intrathoracic pressure can impede venous return and reduce cardiac output.", "pearl": "Ventilator settings have cardiovascular consequences.", "srcAnswer": "A"}, {"num": 89, "level": "Ventilation / ABG / BPD / Air Leak · Clinical", "question": "A preterm infant with air leak is on high pressures. Which general ventilator strategy is most appropriate?", "options": ["Eliminate all expiratory time", "Target severe hypocapnia", "Increase tidal volume to reopen the leak", "Use the lowest effective pressures/volumes while maintaining adequate gas exchange"], "answer": 3, "explanation": "Air-leak management emphasizes reducing further barotrauma/volutrauma while maintaining adequate gas exchange.", "pearl": "Gentler ventilation is treatment for many air-leak syndromes.", "srcAnswer": "A"}, {"num": 90, "level": "Ventilation / ABG / BPD / Air Leak · High", "question": "A ventilated infant with severe RDS develops hypotension after PEEP is increased from 6 to 10 cm H2O; oxygenation improves only minimally. Best next step?", "options": ["Reassess lung recruitment and reduce excessive PEEP if overdistension/hemodynamic compromise is suspected", "Give bicarbonate only", "Ignore blood pressure because oxygenation improved", "Increase PEEP further automatically"], "answer": 0, "explanation": "PEEP should be individualized; minimal oxygenation gain plus hypotension suggests excessive intrathoracic pressure/overdistension.", "pearl": "Every ventilator change needs respiratory and hemodynamic reassessment.", "srcAnswer": "A"}, {"num": 91, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Basic", "question": "Very low birth weight (VLBW) is defined as birth weight:", "options": ["<1000 g", "<2000 g", "<2500 g", "<1500 g"], "answer": 3, "explanation": "VLBW is birth weight below 1500 g.", "pearl": "VLBW <1500 g; ELBW <1000 g.", "srcAnswer": "C"}, {"num": 92, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Basic", "question": "Extremely low birth weight (ELBW) is defined as birth weight:", "options": ["<750 g", "<1500 g", "<1000 g", "<1250 g"], "answer": 2, "explanation": "ELBW is birth weight below 1000 g.", "pearl": "Keep the 1500/1000 g distinction clear.", "srcAnswer": "C"}, {"num": 93, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Why are extremely preterm infants especially prone to hypothermia?", "options": ["Low evaporative loss", "Excess brown fat and thick skin", "High glycogen stores", "Large surface-area-to-mass ratio, thin skin and low fat stores"], "answer": 3, "explanation": "Large surface area, immature skin barrier, low subcutaneous fat and limited thermal reserves increase heat loss.", "pearl": "Preterm infants lose heat by evaporation, convection, conduction and radiation.", "srcAnswer": "A"}, {"num": 94, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 26-week infant is delivered in a cold room. Which immediate intervention most effectively reduces evaporative heat loss?", "options": ["Delay thermal care until after weighing", "Place in polyethylene wrap/bag under radiant heat with appropriate thermal measures", "Dry completely and leave uncovered", "Cold saline wipe"], "answer": 1, "explanation": "Plastic wrapping/bagging without drying the very preterm skin, combined with radiant heat and other measures, reduces t apnea of prematurity?", "options": ["Phenobarbital", "Caffeine citrate", "Furosemide", "Indomethacin"], "answer": 1, "explanation": "Caffeine is preferred for apnea of prematurity because it stimulates respiratory drive and has a favorable therapeutic profile.", "pearl": "Caffeine treats respiratory-control immaturity, not every cause of apnea.", "srcAnswer": "A"}, {"num": 99, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "A 28-week infant on caffeine develops a sudden increase in apnea frequency, abdominal distension and temperature instability. Best next step?", "options": ["Increase caffeine and assume maturation issue", "Evaluate urgently for secondary illness such as sepsis or NEC", "Stop monitoring", "Start oral feeds rapidly"], "answer": 1, "explanation": "A change in apnea pattern with systemic signs suggests an acquired illness rather than uncomplicated apnea of prematurity.", "pearl": "New apnea is often a symptom, not a diagnosis.", "srcAnswer": "B"}, {"num": 100, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Caffeine improves apnea of prematurity mainly by:", "options": ["Closing the ductus arteriosus", "Causing neuromuscular paralysis", "Blocking surfactant secretion", "Antagonizing adenosine receptors and increasing respiratory drive"], "answer": 3, "explanation": "Methylxanthines antagonize adenosine receptors and stimulate central respiratory activity.", "pearl": "Know why caffeine works, not just that it works.", "srcAnswer": "A"}, {"num": 101, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A preterm infant has recurrent desaturation with neck flexion and poor positioning. Best first intervention?", "options": ["Optimize airway position before escalating medication", "Give antibiotics solely for positioning-related events", "Double caffeine immediately", "Intubate without assessment"], "answer": 0, "explanation": "Upper-airway obstruction from positioning can mimic/worsen apnea and should be corrected first.", "pearl": "Not all monitor alarms are central apnea.", "srcAnswer": "A"}, {"num": 102, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Which feature is more typical of mixed apnea than pure central apnea?", "options": ["Continuous airflow with no effort", "Normal breathing throughout", "Only tachypnea", "Central pause followed or preceded by obstructive respiratory effort"], "answer": 3, "explanation": "Mixed apnea contains both central and obstructive components and is common in preterm infants.", "pearl": "Look at airflow and respiratory effort together.", "srcAnswer": "A"}, {"num": 103, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 27-week infant has frequent apnea despite caffeine and optimized non-invasive support. Blood gas shows rising PaCO2 and repeated PPV is required. Best next principle?", "options": ["Stop caffeine and all support", "Give diuretics as sole treatment", "Continue observation regardless of severity", "Escalate respiratory support after reassessing secondary causes"], "answer": 3, "explanation": "Recurrent severe events with ventilatory failure despite therapy may require escalation after excluding secondary causes.", "pearl": "Apnea treatment is a ladder: cause -> stimulation -> caffeine/NRS -> escalation if failing.", "srcAnswer": "A"}, {"num": 104, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "A preterm infant is being considered for caffeine discontinuation. Which factor is most important?", "options": ["Whether the infant is formula fed", "Serum bilirubin only", "Maturity and sustained absence of clinically significant apnea rather than chronological age alone", "Birth weight alone"], "answer": 2, "explanation": "Caffeine is generally stopped when respiratory control has matured and significant events have resolved, with unit-specific observation.", "pearl": "Clinical stability matters more than a single calendar cutoff.", "srcAnswer": "A"}, {"num": 105, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Which mode of heat loss occurs when an infant lies on a cold weighing scale?", "options": ["Convection", "Radiation", "Conduction", "Evaporation"], "answer": 2, "explanation": "Direct contact with a colder surface causes conductive heat loss.", "pearl": "Contact = conduction.", "srcAnswer": "A"}, {"num": 106, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss from a naked infant to cooler surrounding air is primarily:", "options": ["Radiation only", "Conduction", "Convection", "Evaporation only"], "answer": 2, "explanation": "Air currents carry heat away by convection.", "pearl": "Air movement = convection.", "srcAnswer": "A"}, {"num": 107, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss from a warm infant to a nearby cold window without direct contact is:", "options": ["Metabolic heat loss", "Convection only", "Radiation", "Conduction"], "answer": 2, "explanation": "Radiant heat transfer occurs between surfaces without direct contact.", "pearl": "Cold wall/window = radiation.", "srcAnswer": "A"}, {"num": 108, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Heat loss as amniotic fluid evaporates from the skin is:", "options": ["Conduction", "Convection", "Evaporation", "Radiation"], "answer": 2, "explanation": "Evaporation of fluid from skin removes heat.", "pearl": "Wet skin = evaporation.", "srcAnswer": "A"}, {"num": 109, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 900-g infant has temperature 35.4 C, glucose 38 mg/dL and increased oxygen need. Which relationship is most plausible?", "options": ["Low temperature reduces oxygen consumption", "Cold stress has increased metabolic demand, contributing to hypoglycemia and respiratory instability", "Hypothermia protects against hypoglycemia", "The findings are unrelated by definition"], "answer": 1, "explanation": "Cold stress increases glucose and oxygen consumption and can worsen respiratory instability.", "pearl": "Treat temperature as part of metabolic stabilization.", "srcAnswer": "A"}, {"num": 110, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 30-week infant in an incubator is persistently cool despite adequate air temperature. Skin is exposed and humidity is low. What should be optimized?", "options": ["Servo-controlled thermal environment and humidity appropriate to gestation", "Removal of hat and wrap", "Cold humidification", "Frequent opening of incubator doors"], "answer": 0, "explanation": "Very preterm infants benefit from controlled thermal care and humidity to reduce transepidermal water/heat loss.", "pearl": "Humidity is especially important with immature skin.", "srcAnswer": "A"}, {"num": 111, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Conceptual", "question": "Why are ELBW infants at high risk of transepidermal water loss?", "options": ["Excess subcutaneous fat", "Low surface area", "Immature stratum corneum", "Mature renal concentrating ability"], "answer": 2, "explanation": "Immature skin permits substantial evaporative water loss.", "pearl": "Skin immaturity affects both temperature and fluid balance.", "srcAnswer": "A"}, {"num": 112, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · Clinical", "question": "A 26-week infant loses 12% body weight in 48 hours, sodium rises to 154 mmol/L, urine output is adequate and humidity is low. Most likely contributor?", "options": ["SIADH", "Excess insensible water loss", "Excess free-water administration", "Renal failure with water retention"], "answer": 1, "explanation": "High transepidermal/insensible losses in extremely preterm infants can cause hypernatremic nfant receiving caffeine becomes persistently tachycardic and jittery after a dosing error. Best next step?", "options": ["Hold/reassess caffeine exposure and evaluate for toxicity while checking other causes", "Give another loading dose", "Ignore because caffeine cannot cause tachycardia", "Start epinephrine"], "answer": 0, "explanation": "Caffeine toxicity can cause tachycardia and CNS irritability; dosing and clinical status should be reassessed.", "pearl": "Even familiar NICU drugs require dose discipline.", "srcAnswer": "A"}, {"num": 120, "level": "Prematurity / ELBW-VLBW / Thermoregulation / Apnea · High", "question": "An ELBW infant has recurrent apnea, anemia with Hb 7.2 g/dL, tachycardia and increasing oxygen requirement. Which principle is best?", "options": ["Caffeine alone must solve the problem", "Anemia cannot affect apnea", "Stop monitoring until Hb falls below 5 g/dL", "Assess whether symptomatic anemia is contributing rather than attributing all events to prematurity"], "answer": 3, "explanation": "Anemia may worsen cardiorespiratory instability; the full clinical context should guide evaluation and transfusion decisions.", "pearl": "Apnea is multifactorial in preterm infants.", "srcAnswer": "A"}, {"num": 121, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A 2-day-old preterm infant develops temperature instability, poor perfusion and increasing apnea. What must be urgently considered?", "options": ["Physiologic jaundice only", "Early-onset neonatal sepsis", "Infantile colic", "Normal transition"], "answer": 1, "explanation": "Neonatal sepsis often presents nonspecifically with temperature instability, apnea, feeding intolerance and perfusion abnormalities.", "pearl": "In neonates, subtle deterioration can be sepsis.", "srcAnswer": "A"}, {"num": 122, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Conceptual", "question": "Which statement about neonatal sepsis is most accurate?", "options":  CRP not be used to exclude neonatal sepsis?", "options": ["CRP is always elevated in healthy neonates", "CRP becomes positive before infection begins", "Its sensitivity and specificity are insufficient in isolation and timing matters", "CRP identifies the pathogen"], "answer": 2, "explanation": "A single inflammatory marker is imperfect; serial trends can support but do not replace clinical assessment and cultures.", "pearl": "Biomarkers modify probability; they do not replace microbiology.", "srcAnswer": "A"}, {"num": 129, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A neonate with sepsis develops prolonged capillary refill, weak pulses and hypotension. What is the immediate management principle?", "options": ["Phototherapy only", "Discharge if temperature is normal", "Simultaneous stabilization of airway/breathing/circulation and prompt antimicrobial therapy", "Wait for culture identification before supporting circulation"], "answer": 2, "explanation": "Septic shock requires immediate physiologic stabilization alongside prompt antimicrobial treatment.", "pearl": "Resuscitation and antibiotics happen in parallel.", "srcAnswer": "A"}, {"num": 130, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "Blood culture grows an organism susceptible to a narrower agent than the empiric regimen. The infant is improving. Best stewardship step?", "options": ["De-escalate to targeted therapy when appropriate", "Continue all broad-spectrum agents indefinitely", "Stop all therapy immediately", "Add another antibiotic regardless of susceptibility"], "answer": 0, "explanation": "Culture-directed narrowing reduces unnecessary broad-spectrum exposure while maintaining effective therapy.", "pearl": "Start broad enough; finish as narrow as safely possible.", "srcAnswer": "A"}, {"num": 131, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "Which finding should heighten co  const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}

 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}

 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
