<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Mock Quiz 10 — Q136–Q150</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
</style></head>
<body><div class="wrap">
<h1>Cumulative Mock — Quiz 10</h1>
<div class="sub">Questions 136–150 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 136, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "A neonate in a neonatal unit has suspected meningitis and the pathogen is unknown. Which regimen is recommended by NICE?", "options": ["Oral amoxicillin alone", "IV amoxicillin plus cefotaxime", "Ceftriaxone plus calcium-containing infusion", "Gentamicin alone"], "answer": 1, "explanation": "NICE recommends IV amoxicillin plus cefotaxime for suspected meningitis in a neonatal unit when the pathogen is unknown.", "pearl": "Meningitis therapy differs from uncomplicated empiric early-onset sepsis therapy.", "srcAnswer": "A"}, {"num": 137, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "CSF culture confirms group B streptococcal meningitis. Which treatment principle is most appropriate?", "options": ["Treat for 3 days only", "Stop antibiotics after 48 hours if CRP falls", "Use topical antibiotics", "Use pathogen-directed beta-lactam therapy for an adequate meningitis duration, with expert/local guidance"], "answer": 3, "explanation": "Confirmed GBS meningitis requires targeted parenteral therapy for a meningitis-appropriate duration; NICE specifies benzylpenicillin normally for at least 14 days with short-course gentamicin in its regimen.", "pearl": "Meningitis duration is longer than uncomplicated bacteremia.", "srcAnswer": "A"}, {"num": 138, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A preterm infant with a central line develops new apnea, glucose instability and thrombocytopenia on day 18. Which category is most likely?", "options": ["Late-onset neonatal sepsis", "Physiologic transition", "Isolated RDS", "Early-onset sepsis by definition"], "answer": 0, "explanation": "Infection arising later in hospitalization, especially with central-line exposure, is consistent with late-onset sepsis.", "pearl": "Timing and device exposure change the pathogen spectrum.", "srcAnswer": "A"}, {"num": 139, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Conceptual", "question": "Why is unnecessary broad-spectrum antibiotic exposure particularly undesirable in NICU patients?", "options": ["It eliminates fungal risk", "It improves culture sensitivity", "It promotes resistance, alters microbiota and can add drug toxicity", "It guarantees prevention of NEC"], "answer": 2, "explanation": "Excessive antimicrobial exposure selects resistant organisms, disrupts microbiota and can cause toxicity.", "pearl": "Antibiotic stewardship is a neonatal safety intervention.", "srcAnswer": "A"}, {"num": 140, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A blood culture grows coagulase-negative staphylococcus from a preterm infant with a central line. The infant is clinically stable and a repeat culture is negative. Best next step?", "options": ["Assume every isolate mandates 21 days of vancomycin", "Interpret the result in clinical context and assess contamination versus true line-associated infection before prolonged therapy", "Remove every central line regardless of indication", "Ignore all cultures"], "answer": 1, "explanation": "Coagulase-negative staphylococci can be pathogens or contaminants; diagnosis depends on clinical signs, repeat cultures, line context and laboratory data.", "pearl": "Not every positive culture equals true bacteremia.", "srcAnswer": "A"}, {"num": 141, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "A septic neonate has platelets 42,000/mm3, prolonged PT/aPTT, low fibrinogen and elevated D-dimer. Best interpretation?", "options": ["Disseminated intravascular coagulation", "Physiologic thrombocytopenia", "Isolated vitamin K deficiency only", "Hemophilia A"], "answer": 0, "explanation": "Thrombocytopenia with consumption of coagulation factors and high fibrin degradation products suggests DIC in severe sepsis.", "pearl": "Sepsis can become a coagulation disorder.", "srcAnswer": "A"}, {"num": 142, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A neonate with suspected sepsis has lactate 6.5 mmol/L, capillary refill 5 seconds and oliguria. What do these findings indicate?", "options": ["Impaired tissue perfusion and shock physiology", "Isolated respiratory alkalosis", "Adequate circulation", "Normal neonatal transition"], "answer": 0, "explanation": "High lactate, delayed refill and oliguria indicate poor perfusion and organ dysfunction.", "pearl": "Trend perfusion markers alongside blood pressure.", "srcAnswer": "A"}, {"num": 143, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "A neonate has persistent sepsis signs despite 48 hours of apparently appropriate antibiotics. What is the best next step?", "options": ["Automatically double every antibiotic dose", "Reassess source control, organism susceptibility, meningitis, line infection, fungal infection and noninfectious mimics", "Assume treatment failure is impossible", "Stop all cultures"], "answer": 1, "explanation": "Failure to improve requires systematic reassessment of diagnosis, source, pathogen, drug exposure and complications.", "pearl": "Treatment failure is a diagnostic problem before it is a “stronger antibiotic” problem.", "srcAnswer": "A"}, {"num": 144, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A baby with suspected infection has respiratory compromise requiring escalation. LP has not yet been done. What is the best sequence?", "options": ["Withhold antibiotics for 12 hours", "Stabilize respiratory status, obtain feasible cultures and start antibiotics; perform LP when safe", "Perform LP during severe hypoxemia before support", "Wait for LP before giving oxygen"], "answer": 1, "explanation": "Respiratory compromise is a reason to stabilize before LP; antibiotics should not be dangerously delayed.", "pearl": "Safety overrides ideal diagnostic sequence.", "srcAnswer": "A"}, {"num": 145, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Conceptual", "question": "Which statement best describes blood culture in neonatal sepsis?", "options": ["It is the microbiologic reference standard but may be negative in true infection", "It is unnecessary if CRP is elevated", "It cannot identify antimicrobial susceptibility", "It is always positive before symptoms"], "answer": 0, "explanation": "Blood culture is central to pathogen identification and susceptibility testing but has imperfect sensitivity.", "pearl": "Negative culture lowers probability; it does not erase the clinical picture.", "srcAnswer": "A"}, {"num": 146, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A clinically well infant has negative cultures and reassuring serial assessment after empiric antibiotics. Which approach is best?", "options": ["Reassess the need for continued antibiotics rather than defaulting to a prolonged course", "Stop clinical monitoring", "Continue broad-spectrum therapy for 21 days in all cases", "Add antifungal therapy routinely"], "answer": 0, "explanation": "Stewardship requires active review of ongoing need when cultures and clinical trajectory are reassuring.", "pearl": "Every antibiotic course needs a stop/review decision.", "srcAnswer": "A"}, {"num": 147, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "A 3-day-old infant with sepsis has CSF Gram-negative rods. Which management principle is most appropriate?", "options": ["Use oral therapy only", "Use a meningitis-active antibiotic directed at Gram-negative organisms and tailor to culture/susceptibility", "Use gentamicin monotherapy regardless of CSF penetration", "Stop therapy when blood culture is negative"], "answer": 1, "explanation": "Gram-negative meningitis requires effective CNS-penetrating parenteral therapy tailored to organism and susceptibility; NICE uses cefotaxime when Gram-negative infection is demonstrated.", "pearl": "CSF infection requires CNS-active drug exposure.", "srcAnswer": "A"}, {"num": 148, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Clinical", "question": "A neonate has temperature instability and poor feeding but normal WBC count. Which conclusion is safest?", "options": ["Antibiotics are contraindicated", "Sepsis is excluded", "A normal WBC count does not exclude sepsis", "Blood culture is unnecessary"], "answer": 2, "explanation": "No single hematologic parameter is sufficiently sensitive to rule out neonatal infection.", "pearl": "Normal labs do not overrule a concerning clinical trajectory.", "srcAnswer": "A"}, {"num": 149, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · High", "question": "A 36-week infant treated for possible early-onset infection is well at 36 hours with negative culture and reassuring CRP, but the initial clinical suspicion was strong because of significant cardiorespiratory instability. Best next step?", "options": ["Do not apply the stop rule mechanically; reassess and continue treatment if strong suspicion remains", "Switch to no monitoring", "Add three broad-spectrum agents", "Stop antibiotics automatically because culture is negative"], "answer": 0, "explanation": "The 36-hour stop recommendation applies when initial suspicion was not strong and the infant is reassuring; strong initial suspicion requires individualized review.", "pearl": "Stopping rules have eligibility criteria.", "srcAnswer": "A"}, {"num": 150, "level": "Neonatal Sepsis / Meningitis / Antibiotic Principles · Conceptual", "question": "Which error most undermines antimicrobial stewardship?", "options": ["Obtaining cultures before treatment", "Failing to review indication, cultures and duration daily", "Narrowing therapy when susceptibilities permit", "Using local antibiograms"], "answer": 1, "explanation": "Daily review prevents unnecessary continuation and supports de-escalation.", "pearl": "Stewardship is a repeated decision, not a one-time choice.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Mock_Day1-5_QuizSet10_Q136-150_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Cumulative Mock Quiz 10 — Wrong Answer Report</h1><p><b>Questions:</b> 136–150</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines){if(!list.length)return;const L=i=>String.fromCharCode(65+i),cut=(s,n=70)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};lines.push('',`Wrong answers (${list.length}):`);for(let i=0;i<list.length;i++){const w=list[i],l=`Q${w.num}: chose ${L(w.chosen)}. ${cut(w.options[w.chosen])} → correct ${L(w.answer)}. ${cut(w.options[w.answer])}`;if(new Blob([lines.join('\n')+'\n'+l]).size>3800){lines.push(`…and ${list.length-i} more — see the wrong-answer report`);break}lines.push(l)}}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const lines=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`];
 wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines);
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 10 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
