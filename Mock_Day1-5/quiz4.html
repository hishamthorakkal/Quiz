<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumulative Mock Quiz 4 — Q46–Q60</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
</style></head>
<body><div class="wrap">
<h1>Cumulative Mock — Quiz 4</h1>
<div class="sub">Questions 46–60 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script src="../assets/notebook.js"></script>
<script>
const quiz=[{"num": 46, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 30-week infant on nasal CPAP develops frequent desaturations due to mouth leak and poor prong fit. Before declaring CPAP failure, what should be done?", "options": ["Proceed directly to tracheostomy", "Stop respiratory support", "Give surfactant regardless of clinical picture", "Optimize interface, seal, positioning and airway patency"], "answer": 3, "explanation": "Non-invasive support failure may reflect interface problems; technical optimization should precede unnecessary escalation when the infant is otherwise stable.", "pearl": "Always troubleshoot the interface before labeling NRS failure.", "srcAnswer": "A"}, {"num": 47, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A preterm infant has increasing oxygen requirement on CPAP, but lung ultrasound shows a focal consolidation with air bronchograms rather than diffuse RDS pattern. Best next step?", "options": ["Discontinue all support", "Reassess for pneumonia/atelectasis and treat the underlying process", "Assume surfactant deficiency is the only cause", "Give repeated surfactant without reassessment"], "answer": 1, "explanation": "Worsening oxygen need is not specific for surfactant deficiency; focal consolidation should prompt evaluation for alternative pathology.", "pearl": "Surfactant thresholds apply after considering competing causes.", "srcAnswer": "B"}, {"num": 48, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 36-week infant has tachypnea but normal oxygen saturation, minimal retractions and rapid improvement over 12 hours. Which diagnosis is most consistent?", "options": ["TTN", "Severe RDS", "BPD", "PPHN with right-to-left shunt"], "answer": 0, "explanation": "A mild, rapidly improving course in a near-term infant favors TTN.", "pearl": "Trajectory is a diagnostic test in neonatal respiratory disease.", "srcAnswer": "A"}, {"num": 49, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Why can excessive CPAP pressure be harmful?", "options": ["It always causes surfactant deficiency", "It can overdistend lungs and impair venous return", "It prevents oxygen delivery", "It eliminates all spontaneous breathing"], "answer": 1, "explanation": "Excess distending pressure can cause overinflation, air leak and hemodynamic compromise.", "pearl": "Recruit without overdistending.", "srcAnswer": "A"}, {"num": 50, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A preterm infant on non-invasive support has recurrent apnea despite adequate distending pressure. Which addition may reduce need for intubation when apnea of prematurity is contributing?", "options": ["Routine morphine", "Loop diuretic", "Caffeine", "Phenobarbital in all cases"], "answer": 2, "explanation": "Caffeine improves respiratory drive and is commonly used in apnea of prematurity, complementing non-invasive support.", "pearl": "Respiratory support and respiratory drive are separate therapeutic targets.", "srcAnswer": "A"}, {"num": 51, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A 31-week infant on CPAP 7 cm H2O requires FiO2 0.32. Work of breathing is increasing. Which factor most strongly favors surfactant now rather than watchful waiting?", "options": ["FiO2 has crossed a guideline-supported threshold on adequate distending pressure with worsening clinical RDS", "The infant weighs >1 kg", "Birth was at night", "The infant is male"], "answer": 0, "explanation": "Worsening RDS plus FiO2 around/above 0.30 on adequate NRS supports early rescue surfactant.", "pearl": "Use combined oxygen requirement + pressure + clinical trajectory.", "srcAnswer": "A"}, {"num": 52, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A preterm infant has diffuse RDS and receives surfactant. Minutes later oxygenation improves markedly. What ventilator/CPAP adjustment principle is important?", "options": ["Increase FiO2 to 1.0", "Stop monitoring saturation", "Rapidly reassess and reduce excessive oxygen/pressure as tolerated", "Keep all settings unchanged for 12 hours"], "answer": 2, "explanation": "Surfactant can rapidly improve compliance and oxygenation, so support must be reassessed to avoid volutrauma and hyperoxia.", "pearl": "After surfactant, the lung can change quickly.", "srcAnswer": "A"}, {"num": 53, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Which radiographic feature most strongly differentiates TTN from classic RDS?", "options": ["Low lung volume", "Diffuse granular opacity", "Hyperinflation with fissural fluid", "Air bronchograms"], "answer": 2, "explanation": "TTN classically shows hyperinflation, prominent vascular/interstitial markings and fluid in fissures.", "pearl": "Volume pattern is a useful discriminator.", "srcAnswer": "A"}, {"num": 54, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A term infant with severe hypoxemia has relatively clear lungs and a marked preductal-postductal saturation difference. Which diagnosis should be considered?", "options": ["BPD", "Apnea of prematurity", "Uncomplicated TTN only", "PPHN"], "answer": 3, "explanation": "A pre/postductal difference with severe hypoxemia suggests right-to-left shunting through the ductus in PPHN.", "pearl": "Not every hypoxemic newborn has primary parenchymal lung disease.", "srcAnswer": "A"}, {"num": 55, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "Which infant is the best candidate for continued CPAP rather than immediate intubation?", "options": ["Infant with shock and severe respiratory acidosis despite support", "Spontaneously breathing 29-week infant with moderate RDS and stable gas exchange", "Infant with recurrent severe apnea and HR 50/min despite PPV", "Infant with airway obstruction not relieved by positioning"], "answer": 1, "explanation": "Stable spontaneously breathing preterm infants with RDS are appropriate candidates for non-invasive support.", "pearl": "Choose the least invasive support that safely achieves gas exchange.", "srcAnswer": "A"}, {"num": 56, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "The major advantage of non-invasive respiratory support in preterm infants is reduction of:", "options": ["Exposure to invasive mechanical ventilation and associated lung injury", "Risk of all infections to zero", "Need for thermoregulation", "Need for any monitoring"], "answer": 0, "explanation": "Avoiding intubation and invasive ventilation can reduce ventilator-associated lung injury when gas exchange is adequate.", "pearl": "NRS is lung-protective when used in the right patient.", "srcAnswer": "B"}, {"num": 57, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A 30-week infant with RDS has pH 7.31, PaCO2 48 mmHg and acceptable oxygenation on CPAP. Which is the best interpretation?", "options": ["Gas exchange is acceptable; continue close non-invasive management", "The infant requires bicarbonate", "Severe respiratory acidosis is present", "Immediate intubation is mandatory"], "answer": 0, "explanation": "These values do not show severe respiratory acidosis; management should be guided by overall work of breathing and trend.", "pearl": "Treat the infant and trend, not a mildly abnormal number in isolation.", "srcAnswer": "B"}, {"num": 58, "level": "RDS / Surfactant / Non-invasive Support · High", "question": "A preterm infant has worsening RDS but is spontaneously breathing. Which strategy best aligns with lung-protective care?", "options": ["High tidal-volume ventilation first", "Delay surfactant until severe acidosis develops", "Early surfactant by thin catheter while maintaining spontaneous breathing when appropriate", "Routine prolonged bag-mask ventilation"], "answer": 2, "explanation": "Early selective surfactant by thin catheter can reduce exposure to invasive ventilation.", "pearl": "Early rescue is preferable to waiting for avoidable deterioration.", "srcAnswer": "A"}, {"num": 59, "level": "RDS / Surfactant / Non-invasive Support · Clinical", "question": "A newborn with respiratory distress has scaphoid abdomen and bowel sounds in the chest. What is the best respiratory action?", "options": ["Aggressive mask ventilation", "CPAP 10 cm H2O by mask", "Intubate and decompress the stomach", "Observe without support"], "answer": 2, "explanation": "Suspected congenital diaphragmatic hernia requires avoidance of bag-mask inflation and gastric decompression with controlled ventilation.", "pearl": "Respiratory distress plus scaphoid abdomen changes the algorithm.", "srcAnswer": "B"}, {"num": 60, "level": "RDS / Surfactant / Non-invasive Support · Conceptual", "question": "Which feature most strongly suggests CPAP failure rather than simple interface leak?", "options": ["Occasional bubbling in the circuit", "Brief desaturation during handling", "Progressive respiratory acidosis and recurrent apnea despite optimized interface and pressure", "Mild nasal blanching"], "answer": 2, "explanation": "Persistent physiologic deterioration despite optimized NRS indicates true support failure and need for escalation.", "pearl": "Failure is physiologic, not merely technical.", "srcAnswer": "A"}];
const NB_CTX={srcId:'MockDay1-5',label:'Mock Day 1–5',set:'Quiz 4',href:'Mock_Day1-5/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Mock_Day1-5_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Cumulative Mock Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Mock Day 1–5');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers automatically, then let the learner tag them (K/C/R/G/S) and send error notes.
 if(window.Notebook){const ids=Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct})));
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,ids,`${NB_CTX.label} ${NB_CTX.set} — Error notes`);}
}
render();
</script></body></html>
