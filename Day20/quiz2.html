@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "High", "question": "A child with new DCM has no clear structural defect. Which baseline evaluation best screens for potentially reversible systemic contributors?", "options": ["Exercise treadmill test during decompensation", "Serial chest radiographs without biochemical tests", "Electrolytes, renal/thyroid studies, blood count and targeted metabolic review", "Genetic sequencing without history or basic tests"], "answer": 2, "explanation": "Treatable systemic triggers include thyroid disease, anemia, electrolyte and metabolic abnormalities. Why not the others: A. Exercise treadmill test during decompensation — Unsafe and low yield in acute decompensation.; B. Serial chest radiographs without biochemical tests — Radiographs cannot detect many metabolic or endocrine contributors.; D. Genetic sequencing without history or basic tests — Genetics can be valuable but does not replace immediate reversible-cause screening.", "pearl": "Treatable systemic triggers include thyroid disease, anemia, electrolyte and metabolic abnormalities.", "srcAnswer": "C"}, {"num": 19, "level": "High", "question": "A child has persistent low output and recurrent admissions despite optimized therapy for severe DCM. What is the appropriate next planning step?", "options": ["Discontinue etiologic assessment because EF is low", "Increase oral diuretics and reassess advanced referral after several admissions", "Early advanced HF team evaluation for VAD/transplant suitability", "Defer specialist review until multi-organ failure develops"], "answer": 2, "explanation": "Timely referral permits candidacy assessment before irreversible end-organ injury. Why not the others: A. Discontinue etiologic assessment because EF is low — Cause and reversible factors remain relevant.; B. Increase oral diuretics and reassess advanced referral after several admissions — Persistent low output is not solved by diuresis alone.; D. Defer specialist review until multi-organ failure develops — Late referral may preclude advanced therapy.", "pearl": "Timely referral permits candidacy assessment before irreversible end-organ injury.", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "Echo in DCM shows annular dilation, leaflet tethering and a central MR jet without primary leaflet disease. What best explains the MR?", "options": ["Primary rheumatic leaflet destruction", "Congenital mitral cleft", "Infective endocarditis perforation", "Secondary functional regurgitation from LV remodeling"], "answer": 3, "explanation": "Geometry changes impair coaptation despite structurally normal leaflets. Why not the others: A. Primary rheumatic leaflet destruction — No intrinsic leaflet pathology is described.; B. Congenital mitral cleft — A cleft is a structural leaflet defect, absent here.; C. Infective endocarditis perforation — Leaflet perforation or vegetation is not described.", "pearl": "Geometry changes impair coaptation despite structurally normal leaflets.", "srcAnswer": "D"}, {"num": 21, "level": "Clinical", "question": "A congested child receiving ACE inhibitor and diuretics develops rising creatinine and hypotension. What is the best next response?", "options": ["Repeat creatinine after a week without changing monitoring", "Maintain ACE inhibitor and diuretic doses while checking only daily weights", "Reassess volume status, perfusion and medication doses urgently", "Give unrestricted fluids without examining congestion"], "answer": 2, "explanation": "Renal dysfunction may reflect low output, overdiuresis or RAAS blockade. Why not the others: A. Repeat creatinine after a week without changing monitoring — Requires clinical assessment and repeat testing.; B. Maintain ACE inhibitor and diuretic doses while checking only daily weights — May worsen hypotension and kidney injury.; D. Give unrestricted fluids without examining congestion — May worsen HF if congestion persists.", "pearl": "Renal dysfunction may reflect low output, overdiuresis or RAAS blockade.", "srcAnswer": "C"}, {"num": 22, "level": "Clinical", "question": "A child taking digoxin develops nausea and new ectopy after several days of loop diuretic therapy. What is the most useful immediate check?", "options": ["Serum phosphate alone", "Serum potassium, renal function and digoxin exposure", "C-reactive protein alone", "Serum albumin alone"], "answer": 1, "explanation": "Hypokalaemia and impaired clearance increase digoxin toxicity risk. Why not the others: A. Serum phosphate alone — Not the key interaction in this setting.; C. C-reactive protein alone — Inflammation does not directly evaluate digoxin toxicity.; D. Serum albumin alone — Does not address digoxin clearance and potassium sensitization.", "pearl": "Hypokalaemia and impaired clearance increase digoxin toxicity risk.", "srcAnswer": "B"}, {"num": 23, "level": "Conceptual", "question": "A child with severe DCM is clinically cold with low cardiac output but has no fixed outflow obstruction. What is a central management goal?", "options": ["Maximize preload regardless of lung edema", "Maximize SVR to increase LV afterload", "Reduce cardiac output to lower myocardial demand", "Restore forward flow while limiting excess filling pressure"], "answer": 3, "explanation": "Support perfusion and avoid congestion simultaneously. Why not the others: A. Maximize preload regardless of lung edema — Excess preload can worsen congestion.; B. Maximize SVR to increase LV afterload — High afterload can further impair LV ejection.; C. Reduce cardiac output to lower myocardial demand — Further lowering output worsens perfusion.", "pearl": "Support perfusion and avoid congestion simultaneously.", "srcAnswer": "D"}, {"num": 24, "level": "Basic", "question": "A 10-year-old has LV end-diastolic dimension z-score +4 and EF 25%, with global hypokinesia. What phenotype is present?", "options": ["Restrictive cardiomyopathy phenotype", "Isolated hypertrophic cardiomyopathy phenotype", "Arrhythmogenic right ventricular cardiomyopathy phenotype", "Dilated cardiomyopathy phenotype"], "answer": 3, "explanation": "LV enlargement plus reduced systolic function defines DCM morphology. Why not the others: A. Restrictive cardiomyopathy phenotype — RCM typically has severe diastolic dysfunction with nondilated ventricles and enlarged atria.; B. Isolated hypertrophic cardiomyopathy phenotype — HCM features unexplained hypertrophy rather than dominant LV dilation.; C. Arrhythmogenic right ventricular cardiomyopathy phenotype — ARVC predominates in the RV rather than isolated global LV dilation.", "pearl": "LV enlargement plus reduced systolic function defines DCM morphology.", "srcAnswer": "D"}, {"num": 25, "level": "High", "question": "A teenager has unexplained asymmetric septal hypertrophy and exertional presyncope. What hemodynamic mechanism best explains dynamic LVOTO?", "options": ["Primary restrictive atrial septal communication", "Pulmonary vascular obstruction", "Systolic anterior mitral motion with septal contact", "Fixed valvar commissural fusion"], "answer": 2, "explanation": "SAM can narrow the outflow tract dynamically and generate MR. Why not the others: A. Primary restrictive atrial septal communication — Does not create SAM-mediated LVOTO.; B. Pulmonary vascular obstruction — This affects RV afterload rather than LV outflow.; D. Fixed valvar commissural fusion — Aortic valve fusion causes fixed valvar AS, not dynamic SAM-mediated obstruction.", "pearl": "SAM can narrow the outflow tract dynamically and generate MR.", "srcAnswer": "C"}, {"num": 26, "level": "Basic", "question": "A child with obstructive HCM becomes dizzy after dehydration. Which change most plausibly worsens the gradient?", "options": ["Reduced LV cavity size increases SAM and dynamic obstruction", "Increased LV end-diastolic size reduces SAM", "Reduced heart rate increases diastolic filling time", "An increase in arterial afterload intensifies the dynamic gradient"], "answer": 0, "explanation": "Lower preload can intensify LVOTO in obstructive HCM. Why not the others: B. Increased LV end-diastolic size reduces SAM — Larger cavity generally reduces obstruction, not worsens it.; C. Reduced heart rate increases diastolic filling time — Slower rate may improve filling and obstruction.; D. An increase in arterial afterload intensifies the dynamic gradient — Higher afterload often lessens dynamic LVOTO.", "pearl": "Lower preload can intensify LVOTO in obstructive HCM.", "srcAnswer": "A"}, {"num": 27, "level": "Conceptual", "question": "A stable child with symptomatic obstructive HCM and no contraindication requires first-line symptom therapy. Which class is generally preferred?", "options": ["Potent arterial vasodilator monotherapy", "Positive inotrope to increase contractility", "Nonvasodilating beta blocker", "High-dose loop diuretic without congestion"], "answer": 2, "explanation": "Beta blockade slows rate, improves filling and can reduce dynamic obstruction. Why not the others: A. Potent arterial vasodilator monotherapy — Afterload reduction may worsen dynamic LVOTO.; B. Positive inotrope to increase contractility — Increased contractility can increase dynamic LVOTO.; D. High-dose loop diuretic without congestion — Excess preload reduction can worsen obstruction.", "pearl": "Beta blockade slows rate, improves filling and can reduce dynamic obstruction.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical", "question": "A child has severe exertional intolerance, markedly enlarged atria, normal ventricular cavity dimensions and preserved EF. What is the leading cardiomyopathy phenotype?", "options": ["Obstructive hypertrophic cardiomyopathy", "Restrictive cardiomyopathy", "Isolated noncompaction with systolic dysfunction", "Dilated cardiomyopathy"], "answer": 1, "explanation": "Elevated filling pressure and atrial enlargement with relatively preserved ventricular size are characteristic. Why not the others: A. Obstructive hypertrophic cardiomyopathy — Obstructive HCM usually has ventricular hypertrophy and a dynamic gradient.; C. Isolated noncompaction with systolic dysfunction — Would require trabecular phenotype and often systolic impairment.; D. Dilated cardiomyopathy — DCM usually shows dilated ventricular cavity and systolic impairment.", "pearl": "Elevated filling pressure and atrial enlargement with relatively preserved ventricular size are characteristic.", "srcAnswer": "B"}, {"num": 29, "level": "High", "question": "A child with restrictive cardiomyopathy develops pulmonary hypertension. Which pathway is most likely?", "options": ["Chronic pulmonary thromboembolic obstruction", "Isolated high-output pulmonary flow with normal LA pressure", "Primary pulmonary arteriolar disease with normal wedge pressure", "Elevated left atrial pressure transmitted to pulmonary veins"], "answer": 3, "explanation": "RCM causes post-capillary PH via high LV filling pressures. Why not the others: A. Chronic pulmonary thromboembolic obstruction — Requires separate thromboembolic evidence.; B. Isolated high-output pulmonary flow with normal LA pressure — RCM is a filling-pressure disorder.; C. Primary pulmonary arteriolar disease with normal wedge pressure — Not the expected initial mechanism in LV restrictive physiology.", "pearl": "RCM causes post-capillary PH via high LV filling pressures.", "srcAnswer": "D"}, {"num": 30, "level": "High", "question": "Echo shows prominent apical trabeculations, deep recesses and an increased noncompacted-to-compacted ratio. What diagnosis is suggested?", "options": ["Endocardial fibroelastosis phenotype", "Left ventricular noncompaction phenotype", "Apical hypertrophic cardiomyopathy", "Arrhythmogenic RV cardiomyopathy"], "answer": 1, "explanation": "Excess trabeculation with deep recesses suggests LVNC; apply criteria and context. Why not the others: A. Endocardial fibroelastosis phenotype — Endocardial thickening is different from trabecular recesses.; C. Apical hypertrophic cardiomyopathy — Apical HCM has thick compact myocardium rather than deep recesses.; D. Arrhythmogenic RV cardiomyopathy — RV fibro-fatty involvement is a distinct phenotype.", "pearl": "Excess trabeculation with deep recesses suggests LVNC; apply criteria and context.", "srcAnswer": "B"}, {"num": 31, "level": "Integrated", "question": "A 13-year-old boy with Duchenne muscular dystrophy is asymptomatic. What cardiac surveillance principle is most appropriate?", "options": ["Defer imaging until exercise intolerance or edema develops", "Use skeletal muscle CK and ECG without ventricular imaging", "Use annual chest radiograph as sole cardiac test", "Scheduled ECG and cardiac imaging despite absent symptoms"], "answer": 3, "explanation": "Cardiac involvement may precede overt symptoms in neuromuscular disease. Why not the others: A. Defer imaging until exercise intolerance or edema develops — Symptoms can emerge late after myocardial damage.; B. Use skeletal muscle CK and ECG without ventricular imaging — Skeletal muscle CK does not quantify cardiac performance.; C. Use annual chest radiograph as sole cardiac test — CXR is not sufficient to detect early myocardial dysfunction.", "pearl": "Cardiac involvement may precede overt symptoms in neuromuscular disease.", "srcAnswer": "D"}, {"num": 32, "level": "High", "question": "An infant boy has DCM/noncompaction, neutropenia and growth delay. Which gene is most suggestive?", "options": ["LMNA", "TAZ", "RYR2", "MYBPC3"], "answer": 1, "explanation": "TAZ mutations cause Barth syndrome with cardiomyopathy and neutropenia. Why not the others: A. LMNA — Can cause DCM/conduction disease, not classic Barth syndrome.; C. RYR2 — Associated with catecholaminergic ventricular arrhythmia, not classic Barth triad.; D. MYBPC3 — Sarcomeric HCM gene; does not typically explain neutropenia.", "pearl": "TAZ mutations cause Barth syndrome with cardiomyopathy and neutropenia.", "srcAnswer": "B"}, {"num": 33, "level": "Clinical", "question": "An adolescent boy has massive LV hypertrophy, skeletal myopathy and learning difficulty. Which disorder should be prioritized?", "options": ["Friedreich ataxia", "Fabry disease", "Pompe disease", "Danon disease (LAMP2 deficiency)"], "answer": 3, "explanation": "LAMP2 disease can cause severe early HCM with skeletal and cognitive features. Why not the others: A. Friedreich ataxia — Cardiomyopathy may occur but progressive ataxia is a defining clue.; B. Fabry disease — Can cause LVH but typically has neuropathic pain, angiokeratomas and renal disease.; C. Pompe disease — Infantile Pompe has profound hypotonia and glycogen storage with HCM, not typical adolescent Danon pattern.", "pearl": "LAMP2 disease can cause severe early HCM with skeletal and cognitive features.", "srcAnswer": "D"}, {"num": 34, "level": "Conceptual", "question": "An infant has hypotonia, macroglossia and marked ventricular hypertrophy. Which ECG feature strengthens Pompe disease suspicion?", "options": ["Low QRS voltage with electrical alternans", "Prolonged QT with torsades pattern", "Short PR interval with high QRS voltage", "Right bundle branch block with RV dilation"], "answer": 2, "explanation": "Glycogen storage cardiomyopathy may produce short PR and high voltage. Why not the others: A. Low QRS voltage with electrical alternans — Suggests large pericardial effusion rather than glycogen-storage hypertrophy.; B. Prolonged QT with torsades pattern — Not a hallmark of infantile Pompe.; D. Right bundle branch block with RV dilation — Not the signature pattern of Pompe hypertrophic cardiomyopathy.", "pearl": "Glycogen storage cardiomyopathy may produce short PR and high voltage.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day20',label:'Day 20',set:'Quiz 2',href:'Day20/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day20_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 20 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 20 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 20'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 20');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day20:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=947c0af6"></script></body></html>
