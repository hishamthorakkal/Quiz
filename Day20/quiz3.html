@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 35, "level": "High", "question": "A 14-year-old with idiopathic DCM has a father who required transplantation at 34. What is the best next step?", "options": ["Three-generation pedigree and family cardiac screening with genetic counselling", "Offer testing to symptomatic relatives before evaluating asymptomatic first-degree kin", "Stop evaluation if a viral prodrome occurred", "Assume acquired myocarditis because presentation is adolescent"], "answer": 0, "explanation": "Familial disease warrants cascade evaluation and possible molecular testing. Why not the others: B. Offer testing to symptomatic relatives before evaluating asymptomatic first-degree kin — Asymptomatic relatives may have early disease.; C. Stop evaluation if a viral prodrome occurred — Prodrome does not exclude genetic susceptibility.; D. Assume acquired myocarditis because presentation is adolescent — Family history raises heritable risk.", "pearl": "Familial disease warrants cascade evaluation and possible molecular testing.", "srcAnswer": "A"}, {"num": 36, "level": "Integrated", "question": "A family has DCM with early conduction-system disease in several relatives. Which gene is particularly relevant?", "options": ["MYH7", "GAA", "LMNA", "TAZ"], "answer": 2, "explanation": "Lamin A/C variants can cause DCM with early conduction abnormalities. Why not the others: A. MYH7 — Can cause DCM/HCM but early conduction disease particularly raises LMNA.; B. GAA — Pompe disease causes glycogen-storage phenotype.; D. TAZ — Classically Barth syndrome in boys with neutropenia.", "pearl": "Lamin A/C variants can cause DCM with early conduction abnormalities.", "srcAnswer": "C"}, {"num": 37, "level": "High", "question": "An adolescent has sarcomeric HCM and a pathogenic variant. Which family approach is most appropriate?", "options": ["Use a single normal childhood ECG to exclude future disease", "Variant-informed cascade testing plus clinical screening", "Use preventive beta blockers for relatives regardless of phenotype or variant status", "Screen relatives after onset of exertional symptoms"], "answer": 1, "explanation": "First-degree relatives require risk assessment, not symptom-based waiting. Why not the others: A. Use a single normal childhood ECG to exclude future disease — Age-dependent penetrance makes one normal ECG insufficient.; C. Use preventive beta blockers for relatives regardless of phenotype or variant status — Genotype-negative relatives do not automatically need treatment.; D. Screen relatives after onset of exertional symptoms — Disease may be silent.", "pearl": "First-degree relatives require risk assessment, not symptom-based waiting.", "srcAnswer": "B"}, {"num": 38, "level": "Clinical", "question": "A child with HCM has unexplained syncope and nonsustained ventricular tachycardia on ambulatory monitoring. What is the appropriate interpretation?", "options": ["These are risk markers prompting specialist sudden-death risk assessment", "These findings individually mandate device placement without further risk assessment", "They rule out LVOTO as clinically relevant", "They are irrelevant when EF is preserved"], "answer": 0, "explanation": "Risk stratification integrates clinical history, arrhythmia, anatomy and family factors. Why not the others: B. These findings individually mandate device placement without further risk assessment — Risk decisions are individualized; no single feature automatically determines device placement.; C. They rule out LVOTO as clinically relevant — Risk markers do not negate hemodynamic obstruction.; D. They are irrelevant when EF is preserved — Sudden death risk in HCM can exist despite preserved EF.", "pearl": "Risk stratification integrates clinical history, arrhythmia, anatomy and family factors.", "srcAnswer": "A"}, {"num": 39, "level": "Conceptual", "question": "An HCM patient has SAM and a posteriorly directed MR jet. What best explains the MR?", "options": ["Rheumatic mitral commissural fusion", "Mitral leaflet perforation", "Dynamic malcoaptation from systolic anterior motion", "Primary papillary muscle rupture"], "answer": 2, "explanation": "SAM pulls the anterior leaflet toward the septum and alters coaptation. Why not the others: A. Rheumatic mitral commissural fusion — No evidence of rheumatic stenosis is given.; B. Mitral leaflet perforation — No destructive lesion is described.; D. Primary papillary muscle rupture — Usually an acute severe MR presentation after ischemia or trauma.", "pearl": "SAM pulls the anterior leaflet toward the septum and alters coaptation.", "srcAnswer": "C"}, {"num": 40, "level": "Clinical", "question": "A teenager with EF 18% has an apical LV thrombus on echo. What complication is most directly increased?", "options": ["Pulmonary hypertensive crisis from PVR rise", "Pulmonary thromboembolism from RV thrombus", "Systemic arterial embolism", "Dynamic LVOT obstruction from SAM"], "answer": 2, "explanation": "LV thrombus can embolize to brain and systemic organs. Why not the others: A. Pulmonary hypertensive crisis from PVR rise — Not the direct consequence of an LV apical thrombus.; B. Pulmonary thromboembolism from RV thrombus — A left-sided thrombus typically embolizes systemically.; D. Dynamic LVOT obstruction from SAM — Thrombus is not a mechanism for dynamic LVOTO.", "pearl": "LV thrombus can embolize to brain and systemic organs.", "srcAnswer": "C"}, {"num": 41, "level": "Clinical", "question": "A childhood cancer survivor develops reduced global longitudinal strain before overt EF decline. What is the most appropriate interpretation?", "options": ["Evidence that ventricular function is normal because EF is preserved", "Proof of active viral myocarditis", "Definitive isolated valvar aortic stenosis", "Possible early cancer therapy-related myocardial dysfunction"], "answer": 3, "explanation": "Strain abnormalities can precede a measurable fall in EF. Why not the others: A. Evidence that ventricular function is normal because EF is preserved — Subclinical dysfunction can precede EF decline.; B. Proof of active viral myocarditis — Strain is not etiologically specific.; C. Definitive isolated valvar aortic stenosis — Strain change does not establish aortic valve obstruction.", "pearl": "Strain abnormalities can precede a measurable fall in EF.", "srcAnswer": "D"}, {"num": 42, "level": "Clinical", "question": "A child with LV dysfunction has persistent tachycardia at rest, thyroid symptoms and no structural lesion. Which reversible mechanism should be evaluated?", "options": ["Coronary artery anomaly should replace endocrine assessment as the first step", "Primary isolated restrictive fibrosis without systemic trigger", "Pulmonary venous obstruction as the leading diagnosis", "Thyroid-related high-output/tachycardia-associated dysfunction"], "answer": 3, "explanation": "Thyrotoxicosis can cause reversible cardiac dysfunction. Why not the others: A. Coronary artery anomaly should replace endocrine assessment as the first step — Coronary anomalies matter but systemic endocrine clues are strong.; B. Primary isolated restrictive fibrosis without systemic trigger — Would not explain thyroid symptoms and tachycardia.; C. Pulmonary venous obstruction as the leading diagnosis — No pulmonary venous anatomy clues are given.", "pearl": "Thyrotoxicosis can cause reversible cardiac dysfunction.", "srcAnswer": "D"}, {"num": 43, "level": "High", "question": "A child has suspected myocarditis versus ischemic injury. Which CMR late enhancement pattern more strongly favors nonischemic inflammation?", "options": ["Subepicardial or mid-wall enhancement not following a coronary territory", "Subendocardial enhancement matching a coronary distribution", "Perfusion defect restricted to one coronary territory", "Transmural enhancement restricted to one arterial territory"], "answer": 0, "explanation": "Nonischemic LGE patterns support myocardial inflammation in context. Why not the others: B. Subendocardial enhancement matching a coronary distribution — This pattern suggests ischemic injury.; C. Perfusion defect restricted to one coronary territory — More consistent with ischemic perfusion abnormality.; D. Transmural enhancement restricted to one arterial territory — Often ischemic scar pattern.", "pearl": "Nonischemic LGE patterns support myocardial inflammation in context.", "srcAnswer": "A"}, {"num": 44, "level": "Integrated", "question": "A previously well 9-year-old develops abdominal pain, vomiting, disproportionate tachycardia and poor perfusion after a viral illness. What must be urgently considered?", "options": ["Stable vasovagal episode", "Uncomplicated viral gastroenteritis alone", "Primary isolated asthma exacerbation", "Acute myocarditis with low-output failure"], "answer": 3, "explanation": "Children may present with GI symptoms and disproportionate tachycardia before overt chest pain. Why not the others: A. Stable vasovagal episode — Persistent low perfusion and tachycardia are not a simple vasovagal event.; B. Uncomplicated viral gastroenteritis alone — Shock signs and disproportionate tachycardia require cardiac evaluation.; C. Primary isolated asthma exacerbation — No wheeze or airway obstruction is described.", "pearl": "Children may present with GI symptoms and disproportionate tachycardia before overt chest pain.", "srcAnswer": "D"}, {"num": 45, "level": "Conceptual", "question": "A child has high clinical suspicion of myocarditis, abnormal echo and normal initial troponin. What is the best interpretation?", "options": ["The normal value establishes restrictive cardiomyopathy", "Normal troponin does not exclude myocarditis", "Normal troponin confirms no myocardial dysfunction", "Myocarditis is excluded by a single normal value"], "answer": 1, "explanation": "Troponin sensitivity is imperfect and must be integrated with imaging and clinical findings. Why not the others: A. The normal value establishes restrictive cardiomyopathy — Troponin cannot classify cardiomyopathy.; C. Normal troponin confirms no myocardial dysfunction — Echo can show dysfunction despite a normal troponin.; D. Myocarditis is excluded by a single normal value — Biomarkers may be normal despite myocarditis.", "pearl": "Troponin sensitivity is imperfect and must be integrated with imaging and clinical findings.", "srcAnswer": "B"}, {"num": 46, "level": "Basic", "question": "In a stable patient with suspected myocarditis, which CMR combination best supports updated Lake Louise tissue criteria?", "options": ["Isolated pericardial effusion without myocardial markers", "Two T1-based markers without T2 evidence", "Two T2-based markers without T1 evidence", "At least one T2-based edema marker and one T1-based injury marker"], "answer": 3, "explanation": "The revised criteria combine edema-sensitive and injury-sensitive markers. Why not the others: A. Isolated pericardial effusion without myocardial markers — Pericardial fluid alone does not meet myocarditis tissue criteria.; B. Two T1-based markers without T2 evidence — T1-only evidence lacks the complementary T2 criterion.; C. Two T2-based markers without T1 evidence — T2-only evidence lacks the complementary T1 injury criterion.", "pearl": "The revised criteria combine edema-sensitive and injury-sensitive markers.", "srcAnswer": "D"}, {"num": 47, "level": "Integrated", "question": "A child with fulminant myocarditis is hypotensive and on escalating vasoactives. Which imaging sequence is safest?", "options": ["Routine exercise stress imaging as the first test", "Bedside echo first; defer CMR until transport is safe", "Serial chest X-rays alone until discharge", "Immediate prolonged CMR before hemodynamic stabilization"], "answer": 1, "explanation": "Unstable patients need rapid bedside assessment and stabilization. Why not the others: A. Routine exercise stress imaging as the first test — Stress testing is inappropriate during shock.; C. Serial chest X-rays alone until discharge — CXR cannot adequately assess myocardial dysfunction.; D. Immediate prolonged CMR before hemodynamic stabilization — Transport and scan time may be unsafe.", "pearl": "Unstable patients need rapid bedside assessment and stabilization.", "srcAnswer": "B"}, {"num": 48, "level": "High", "question": "A child has fulminant HF refractory to standard support, with suspicion of a treatable inflammatory subtype. When should EMB be considered?", "options": ["In stable children with a viral prodrome but no cardiac dysfunction", "After EF recovery to document past inflammation rather than guide acute care", "At an expert center when histology could change management", "Never because CMR has replaced histology"], "answer": 2, "explanation": "Biopsy can identify specific etiologies in high-risk or refractory cases. Why not the others: A. In stable children with a viral prodrome but no cardiac dysfunction — Routine biopsy is not justified in low-risk cases.; B. After EF recovery to document past inflammation rather than guide acute care — The indication is strongest when diagnosis can alter current treatment.; D. Never because CMR has replaced histology — CMR complements but does not eliminate biopsy in selected cases.", "pearl": "Biopsy can identify specific etiologies in high-risk or refractory cases.", "srcAnswer": "C"}, {"num": 49, "level": "Clinical", "question": "A child has suspected myocarditis. Which statement about routine broad viral IgM/IgG panels is most accurate?", "options": ["A positive respiratory IgG proves myocardial infection", "Routine viral serology rarely establishes myocardial causation", "A negative broad panel excludes viral myocarditis", "Positive blood serology can substitute for tissue-specific etiologic assessment"], "answer": 1, "explanation": "Serology often does not correlate with myocardial infection and is not routinely recommended. Why not the others: A. A positive respiratory IgG proves myocardial infection — Past exposure does not prove tissue infection.; C. A negative broad panel excludes viral myocarditis — Testing is insensitive and limited.; D. Positive blood serology can substitute for tissue-specific etiologic assessment — Tissue diagnosis is a separate decision in selected cases.", "pearl": "Serology often does not correlate with myocardial infection and is not routinely recommended.", "srcAnswer": "B"}, {"num": 50, "level": "High", "question": "A child with new myocarditis has shock, EF 15% and rising lactate despite inotropes. What is the most appropriate escalation concept?", "options": ["Early consultation for mechanical circulatory support at a capable center", "Escalate crystalloid without limits", "Initiate treadmill exercise to test reserve", "Wait for multiorgan failure before contacting MCS team"], "answer": 0, "explanation": "Refractory cardiogenic shock may require ECMO/VAD as bridge to recovery or decision. Why not the others: B. Escalate crystalloid without limits — May worsen pulmonary edema and cardiac congestion.; C. Initiate treadmill exercise to test reserve — Contraindicated during acute shock.; D. Wait for multiorgan failure before contacting MCS team — Delays can worsen outcomes.", "pearl": "Refractory cardiogenic shock may require ECMO/VAD as bridge to recovery or decision.", "srcAnswer": "A"}, {"num": 51, "level": "High", "question": "An otherwise typical presumed viral myocarditis case has no biopsy-defined immune subtype. What is the best general statement on corticosteroids?", "options": ["Early high-dose steroids for presumed viral cases regardless of etiology", "Equivalent to antiviral therapy against enteroviruses", "Not routine for every presumed viral case; reserve for selected indications", "Always contraindicated even in giant-cell myocarditis"], "answer": 2, "explanation": "Immunosuppression is etiology- and severity-dependent, not universally indicated. Why not the others: A. Early high-dose steroids for presumed viral cases regardless of etiology — Evidence and indications are not universal.; B. Equivalent to antiviral therapy against enteroviruses — Steroids are immunomodulatory, not direct antivirals.; D. Always contraindicated even in giant-cell myocarditis — Specific immune-mediated subtypes may benefit from immunosuppression.", "pearl": "Immunosuppression is etiology- and severity-dependent, not universally indicated.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day20',label:'Day 20',set:'Quiz 3',href:'Day20/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day20_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 20 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 20 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 20'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 20');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day20:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
