@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 69, "level": "Conceptual", "question": "A child with idiopathic PAH undergoes catheterization. Why perform acute vasoreactivity testing at an expert center?", "options": ["Determine whether a diuretic will reduce pulmonary edema", "Establish whether a ventricular septal defect is present", "Select calcium-channel blocker therapy before defining acute responder status", "Identify a small subset suitable for long-term calcium-channel blocker therapy"], "answer": 3, "explanation": "Only appropriately defined responders may benefit from high-dose CCB strategies. Why not the others: A. Determine whether a diuretic will reduce pulmonary edema — AVT does not primarily select diuretic therapy.; B. Establish whether a ventricular septal defect is present — Anatomic shunt evaluation uses imaging and catheter anatomy.; C. Select calcium-channel blocker therapy before defining acute responder status — Nonresponders may deteriorate with inappropriate CCB use.", "pearl": "Only appropriately defined responders may benefit from high-dose CCB strategies.", "srcAnswer": "D"}, {"num": 70, "level": "Basic", "question": "A child with PAH receives sildenafil. Which molecular action is correct?", "options": ["PDE5 inhibition increases cGMP signaling in pulmonary vascular smooth muscle", "Prostacyclin receptor agonism", "Direct soluble guanylate cyclase inhibition", "Endothelin receptor blockade"], "answer": 0, "explanation": "Sildenafil preserves cGMP and promotes pulmonary vasodilation. Why not the others: B. Prostacyclin receptor agonism — Selexipag and prostacyclin therapies use this pathway.; C. Direct soluble guanylate cyclase inhibition — This would reduce rather than augment cGMP signaling.; D. Endothelin receptor blockade — Bosentan and related agents target endothelin receptors.", "pearl": "Sildenafil preserves cGMP and promotes pulmonary vasodilation.", "srcAnswer": "A"}, {"num": 71, "level": "Clinical", "question": "A child with PAH starts bosentan. Which toxicity monitoring is particularly important?", "options": ["Reticulocyte count alone", "Liver enzymes", "Serum digoxin level alone", "Creatine kinase alone"], "answer": 1, "explanation": "Endothelin receptor antagonists can cause hepatotoxicity. Why not the others: A. Reticulocyte count alone — Does not monitor key hepatic toxicity.; C. Serum digoxin level alone — Not the central class toxicity.; D. Creatine kinase alone — CK is not the principal bosentan safety monitoring test.", "pearl": "Endothelin receptor antagonists can cause hepatotoxicity.", "srcAnswer": "B"}, {"num": 72, "level": "Clinical", "question": "A child with severe PAH develops progressive RV dilatation and septal flattening. What is the main physiologic implication?", "options": ["Isolated left atrial volume overload", "Normal biventricular pressure relationship", "Primary isolated LV hypertrophic obstruction", "RV pressure overload with impaired LV filling through ventricular interdependence"], "answer": 3, "explanation": "RV pressure elevation flattens septum and can compromise LV preload. Why not the others: A. Isolated left atrial volume overload — Not the described mechanism.; B. Normal biventricular pressure relationship — Septal flattening implies abnormal RV pressure/volume load.; C. Primary isolated LV hypertrophic obstruction — Septal flattening with RV dilation points to RV load.", "pearl": "RV pressure elevation flattens septum and can compromise LV preload.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated", "question": "An adolescent with long-standing large VSD has cyanosis, reversed shunt and severe irreversible pulmonary vascular disease. What is the management principle?", "options": ["Treat solely with pulmonary diuretics and no specialist review", "Avoid routine defect closure; refer to specialized PH/CHD care", "Close the VSD immediately without hemodynamic assessment", "Assume PVR is normal because VSD is large"], "answer": 1, "explanation": "Closing a shunt with irreversible high PVR can precipitate RV failure. Why not the others: A. Treat solely with pulmonary diuretics and no specialist review — Complex PH needs specialist assessment.; C. Close the VSD immediately without hemodynamic assessment — May be dangerous in Eisenmenger physiology.; D. Assume PVR is normal because VSD is large — Reversed shunting indicates advanced pulmonary vascular disease.", "pearl": "Closing a shunt with irreversible high PVR can precipitate RV failure.", "srcAnswer": "B"}, {"num": 74, "level": "Clinical", "question": "An ex-preterm infant with BPD and PH has frequent desaturation during feeds. What is a foundational management step?", "options": ["Permit chronic hypoxemia to minimize oxygen exposure", "Stop nutritional support to reduce cardiac workload", "Give routine high-dose vasodilator without assessing lung/heart physiology", "Optimize oxygenation, ventilation and underlying lung disease before escalating targeted PAH therapy"], "answer": 3, "explanation": "Treating hypoxia and lung disease reduces pulmonary vasoconstrictive stimuli. Why not the others: A. Permit chronic hypoxemia to minimize oxygen exposure — Hypoxia can worsen PH.; B. Stop nutritional support to reduce cardiac workload — Poor nutrition can worsen growth and cardiopulmonary reserve.; C. Give routine high-dose vasodilator without assessing lung/heart physiology — Therapy should follow comprehensive phenotype assessment.", "pearl": "Treating hypoxia and lung disease reduces pulmonary vasoconstrictive stimuli.", "srcAnswer": "D"}, {"num": 75, "level": "Clinical", "question": "A child with severe PAH progresses to syncope and RV failure despite combination therapy. What is the appropriate next step?", "options": ["Urgent expert-center assessment for advanced options including transplant pathways", "Wait for cardiopulmonary arrest before referral", "Escalate oral diuresis while postponing advanced PH review", "Assume syncope is benign because oxygen saturation is unchanged"], "answer": 0, "explanation": "High-risk refractory PAH needs specialized escalation, not delayed review. Why not the others: B. Wait for cardiopulmonary arrest before referral — Advanced referral should be proactive.; C. Escalate oral diuresis while postponing advanced PH review — Diuretics alone do not address severe progressive PAH.; D. Assume syncope is benign because oxygen saturation is unchanged — Syncope in PAH is a high-risk sign.", "pearl": "High-risk refractory PAH needs specialized escalation, not delayed review.", "srcAnswer": "A"}, {"num": 76, "level": "", "question": "A thriving 6-week-old has bilateral cataracts after milk feeds, galactosuria and no hepatomegaly, coagulopathy or E. coli sepsis. Which defect best fits?", "options": ["UDP-galactose 4-epimerase generalized deficiency", "Galactokinase deficiency (GALK1)", "Classic GALT deficiency", "Hereditary fructose intolerance"], "answer": 1, "explanation": "GALK1 deficiency causes galactitol-related cataracts with relatively limited systemic illness. Why not the others: A. UDP-galactose 4-epimerase generalized deficiency — Generalized GALE deficiency can have significant systemic illness.; C. Classic GALT deficiency — Usually produces prominent hepatic and systemic toxicity.; D. Hereditary fructose intolerance — Symptoms follow fructose/sucrose/sorbitol exposure rather than milk galactose.", "pearl": "GALK1 deficiency causes galactitol-related cataracts with relatively limited systemic illness.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase versus GALT versus hereditary fructose intolerance"}}, {"num": 77, "level": "", "question": "A toddler becomes lethargic after prolonged fasting, with glucose 32 mg/dL, absent ketonuria and high C8 acylcarnitine. Which disorder is most likely?", "options": ["MCAD deficiency", "MSUD", "Propionic acidemia", "VLCAD deficiency"], "answer": 0, "explanation": "Fasting hypoketotic hypoglycaemia with C8 elevation is characteristic of ACADM deficiency. Why not the others: B. MSUD — Typically has elevated branched-chain amino acids/alloisoleucine.; C. Propionic acidemia — Typically shows C3 elevation with organic acidosis.; D. VLCAD deficiency — Typically shows C14:1 elevation.", "pearl": "Fasting hypoketotic hypoglycaemia with C8 elevation is characteristic of ACADM deficiency.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD deficiency versus MSUD/VLCAD/propionic acidemia"}}, {"num": 78, "level": "", "question": "A 7.5-kg child in SAM stabilization is prescribed F-75 at 130 mL/kg/day. What is the prescribed total volume per day?", "options": ["975 mL/day", "1,050 mL/day", "1,125 mL/day", "862.5 mL/day"], "answer": 0, "explanation": "7.5 × 130 = 975 mL/day; this is a given-order arithmetic exercise, not universal feeding prescription. Why not the others: B. 1,050 mL/day — Equivalent to 140 mL/kg/day.; C. 1,125 mL/day — Equivalent to 150 mL/kg/day.; D. 862.5 mL/day — Equivalent to 115 mL/kg/day, not the stated order.", "pearl": "7.5 × 130 = 975 mL/day; this is a given-order arithmetic exercise, not universal feeding prescription.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 14 Q30 — Complicated SAM — F-75 starter-feed weight × daily volume"}}, {"num": 79, "level": "", "question": "In an 8-year-old with sleep difficulty, which expansion correctly describes the BEARS sleep-history screen?", "options": ["Bedtime, Excessive sleepiness, Anxiety, Respiratory events, Sleep latency", "Breathing, Excessive sleepiness, Apnea index, Restlessness, Snoring", "Bedtime, Excessive daytime sleepiness, Awakenings, Regularity/duration, Snoring", "Bedtime, EEG, Arousal index, REM, Snoring"], "answer": 2, "explanation": "These are the five clinical history domains of BEARS. Why not the others: A. Bedtime, Excessive sleepiness, Anxiety, Respiratory events, Sleep latency — Anxiety and sleep latency are not the named A/R domains.; B. Breathing, Excessive sleepiness, Apnea index, Restlessness, Snoring — Apnea index is a measured sleep-study variable.; D. Bedtime, EEG, Arousal index, REM, Snoring — EEG and REM are polysomnographic constructs, not BEARS history domains.", "pearl": "These are the five clinical history domains of BEARS.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 13 Q5 — BEARS sleep-history mnemonic"}}, {"num": 80, "level": "", "question": "A 65-hour-old infant with recurrent hypoglycemia is discussed using two named standards. Which distinction is correct?", "options": ["Both CPS and PES use exactly 24 h", "CPS transitional period is first 72 h; PES flags persistent disorders beyond 48 h", "CPS uses 48 h; PES uses 72 h", "Both CPS and PES use exactly 72 h"], "answer": 1, "explanation": "CPS 2025 uses 72 hours, whereas PES evaluation framing uses >48 hours. Why not the others: A. Both CPS and PES use exactly 24 h — Neither uses 24 h as its sole transition boundary.; C. CPS uses 48 h; PES uses 72 h — The guideline time windows are reversed.; D. Both CPS and PES use exactly 72 h — PES explicitly considers >48 h at risk for persistent disease.", "pearl": "CPS 2025 uses 72 hours, whereas PES evaluation framing uses >48 hours.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q8 — Neonatal hypoglycemia — CPS 72 h versus PES 48 h"}}, {"num": 81, "level": "", "question": "A preterm infant has zone II, stage 2 ROP with definite plus disease. Which ETROP-based management category is correct?", "options": ["Immature retina without ROP — routine follow-up", "Stage 4 ROP — retinal detachment surgery", "Type 2 ROP — observation with close follow-up", "Type 1 ROP — prompt treatment assessment"], "answer": 3, "explanation": "Zone II stage 2 with plus disease meets Type 1 ROP criteria. Why not the others: A. Immature retina without ROP — routine follow-up — A stage 2 ridge with plus is established disease.; B. Stage 4 ROP — retinal detachment surgery — No retinal detachment is described.; C. Type 2 ROP — observation with close follow-up — Zone II stage 3 without plus is a Type 2 example; plus changes urgency.", "pearl": "Zone II stage 2 with plus disease meets Type 1 ROP criteria.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q25 — ROP — ETROP Type 1 zone II stage 2 plus"}}, {"num": 82, "level": "", "question": "A baby born at 28 weeks gestation is now 18 weeks old chronologically. What is corrected age?", "options": ["46 weeks", "18 weeks", "12 weeks", "6 weeks"], "answer": 3, "explanation": "Corrected age = 18 − (40 − 28) = 6 weeks; PMA = 46 weeks. Why not the others: A. 46 weeks — This is PMA, not corrected age.; B. 18 weeks — This is chronological age, not corrected age.; C. 12 weeks — This is the prematurity correction, not corrected age.", "pearl": "Corrected age = 18 − (40 − 28) = 6 weeks; PMA = 46 weeks.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q46 — Corrected age versus postmenstrual age"}}, {"num": 83, "level": "", "question": "Under the explicitly named AAP 2018 ROP screening schedule, when is the first exam for an infant born at 24 weeks GA?", "options": ["28 weeks PMA (4 weeks chronological)", "32 weeks PMA (8 weeks chronological)", "31 weeks PMA (7 weeks chronological age)", "30 weeks PMA (6 weeks chronological)"], "answer": 2, "explanation": "AAP 2018 table specifies 31 weeks PMA, which is 7 weeks after birth for GA 24 weeks. Why not the others: A. 28 weeks PMA (4 weeks chronological) — This is earlier than the AAP 2018 schedule for GA 24 weeks.; B. 32 weeks PMA (8 weeks chronological) — Later than the AAP 2018 table entry.; D. 30 weeks PMA (6 weeks chronological) — Still earlier than the table entry.", "pearl": "AAP 2018 table specifies 31 weeks PMA, which is 7 weeks after birth for GA 24 weeks.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 11 Q55 — ROP initial screening — AAP 2018 GA 24-week timing"}}, {"num": 84, "level": "", "question": "At 36 weeks PMA, a very preterm infant remains on noninvasive CPAP without invasive ventilation. Under Jensen 2019 support-based classification, what BPD grade applies?", "options": ["Grade 3", "No BPD", "Grade 1", "Grade 2"], "answer": 3, "explanation": "NCPAP/NIPPV or nasal cannula >2 L/min at 36 weeks PMA = Grade 2. Why not the others: A. Grade 3 — Grade 3 requires invasive mechanical ventilation.; B. No BPD — Ongoing noninvasive support at 36 weeks meets Grade 2 criteria.; C. Grade 1 — Grade 1 is nasal cannula ≤2 L/min.", "pearl": "NCPAP/NIPPV or nasal cannula >2 L/min at 36 weeks PMA = Grade 2.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 5 Q53 — Jensen 2019 BPD grade at 36 weeks PMA"}}];
const NB_CTX={srcId:'Day20',label:'Day 20',set:'Quiz 5',href:'Day20/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day20_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 20 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 20 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 20'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 20');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day20:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
