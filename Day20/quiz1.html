@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "Clinical", "question": "An 8-month-old with a large VSD has prolonged feeds, sweating, tachypnoea and weight faltering, but no symptoms while resting. Which modified Ross class fits best?", "options": ["Class III", "Class I", "Class IV", "Class II"], "answer": 0, "explanation": "Class III includes marked feeding difficulty with growth failure without necessarily having symptoms at rest. Why not the others: B. Class I — Class I denotes no functional limitation.; C. Class IV — Class IV has symptoms even at rest.; D. Class II — Class II has mild feeding symptoms without growth failure.", "pearl": "Class III includes marked feeding difficulty with growth failure without necessarily having symptoms at rest.", "srcAnswer": "A"}, {"num": 2, "level": "Conceptual", "question": "A 3-month-old with a large nonrestrictive VSD develops tachypnoea as pulmonary vascular resistance falls. What most directly drives the new pulmonary congestion?", "options": ["Increasing left-to-right shunt and pulmonary venous return", "Isolated pulmonary venous obstruction with reduced Qp", "Increasing right-to-left shunt and systemic desaturation", "Increasing RV outflow obstruction and falling Qp"], "answer": 0, "explanation": "Postnatal fall in PVR increases Qp and left-sided volume loading. Why not the others: B. Isolated pulmonary venous obstruction with reduced Qp — Obstructed pulmonary venous return is not implied by this VSD scenario.; C. Increasing right-to-left shunt and systemic desaturation — This is not the usual physiology of an uncomplicated VSD with falling PVR.; D. Increasing RV outflow obstruction and falling Qp — RVOTO is a different lesion and would not explain high pulmonary flow.", "pearl": "Postnatal fall in PVR increases Qp and left-sided volume loading.", "srcAnswer": "A"}, {"num": 3, "level": "Basic", "question": "A 5-month-old has persistent tachypnoea, diaphoresis while feeding and poor weight gain without wheeze. Which additional finding most supports heart failure?", "options": ["Prolonged expiratory phase with diffuse wheeze", "Hepatomegaly with a gallop rhythm", "Focal crackles with bronchial breathing", "Inspiratory stridor with suprasternal recession"], "answer": 1, "explanation": "Systemic venous congestion and a gallop support cardiac failure in infants. Why not the others: A. Prolonged expiratory phase with diffuse wheeze — Suggests lower-airway obstruction rather than specifically HF.; C. Focal crackles with bronchial breathing — Suggests focal parenchymal infection.; D. Inspiratory stridor with suprasternal recession — Suggests upper-airway obstruction.", "pearl": "Systemic venous congestion and a gallop support cardiac failure in infants.", "srcAnswer": "B"}, {"num": 4, "level": "Basic", "question": "An infant has suspected decompensated HF and no established structural diagnosis. Which study most directly defines anatomy and ventricular performance?", "options": ["Comprehensive transthoracic echocardiography", "Serial BNP measurement alone", "Twelve-lead ECG alone", "Chest radiograph alone"], "answer": 0, "explanation": "Echo evaluates chamber size, systolic/diastolic function, valves and shunts. Why not the others: B. Serial BNP measurement alone — BNP is supportive but cannot establish anatomy or lesion physiology.; C. Twelve-lead ECG alone — ECG helps identify rhythm and ischemic patterns but does not quantify ventricular function.; D. Chest radiograph alone — CXR gives size and flow clues but cannot define function or intracardiac anatomy.", "pearl": "Echo evaluates chamber size, systolic/diastolic function, valves and shunts.", "srcAnswer": "A"}, {"num": 5, "level": "Conceptual", "question": "A neonate has respiratory distress and an elevated NT-proBNP. Which interpretation is most defensible?", "options": ["Interpret against age and clinical/echo findings", "Exclude cardiac disease if troponin is normal", "Diagnose myocarditis solely from the value", "Classify systolic EF directly from the concentration"], "answer": 0, "explanation": "Neonatal natriuretic peptide concentrations are age dependent and not diagnostic in isolation. Why not the others: B. Exclude cardiac disease if troponin is normal — Troponin and natriuretic peptides assess different processes; normal troponin cannot exclude HF.; C. Diagnose myocarditis solely from the value — Natriuretic peptides reflect wall stress, not myocarditis-specific inflammation.; D. Classify systolic EF directly from the concentration — No single NT-proBNP value directly determines ejection fraction.", "pearl": "Neonatal natriuretic peptide concentrations are age dependent and not diagnostic in isolation.", "srcAnswer": "A"}, {"num": 6, "level": "High", "question": "A child with DCM has cool extremities, oliguria, elevated lactate, pulmonary edema and hypotension. Which phenotype guides urgent management?", "options": ["Cold and dry isolated preload depletion", "Cold and wet cardiogenic shock", "Warm and wet isolated volume overload", "Warm and dry compensated failure"], "answer": 1, "explanation": "Both low output and congestion are present, requiring specialist vasoactive and decongestive strategy. Why not the others: A. Cold and dry isolated preload depletion — Pulmonary edema demonstrates congestion.; C. Warm and wet isolated volume overload — Cold extremities, oliguria and lactate imply hypoperfusion.; D. Warm and dry compensated failure — Neither good perfusion nor absence of congestion is present.", "pearl": "Both low output and congestion are present, requiring specialist vasoactive and decongestive strategy.", "srcAnswer": "B"}, {"num": 7, "level": "Integrated", "question": "A 6-year-old with myocarditis has severe LV dysfunction, crackles, hypotension and hepatomegaly. Which initial fluid strategy is safest?", "options": ["Use repeated 10 mL/kg aliquots before reassessing lung congestion", "Give 20 mL/kg repeatedly until hepatomegaly resolves", "Give fixed 40 mL/kg before assessing cardiac function", "Avoid routine large boluses; individualize small reassessed volumes if needed"], "answer": 3, "explanation": "Congested cardiogenic shock can worsen with indiscriminate crystalloid boluses. Why not the others: A. Use repeated 10 mL/kg aliquots before reassessing lung congestion — Unrestricted fluids are inappropriate with evident congestion.; B. Give 20 mL/kg repeatedly until hepatomegaly resolves — Hepatomegaly and crackles indicate congestion; repeated boluses risk pulmonary edema.; C. Give fixed 40 mL/kg before assessing cardiac function — Large fixed boluses may exacerbate pump failure.", "pearl": "Congested cardiogenic shock can worsen with indiscriminate crystalloid boluses.", "srcAnswer": "D"}, {"num": 8, "level": "Basic", "question": "A child with LV dysfunction and pulmonary edema improves after furosemide. Which immediate therapeutic effect best explains improvement?", "options": ["Restoration of myocardial contractility independent of preload", "Selective pulmonary arteriolar vasodilation", "Reduction of venous congestion through natriuresis/diuresis", "Direct reversal of myocardial fibrosis"], "answer": 2, "explanation": "Loop diuresis lowers filling pressures and pulmonary congestion. Why not the others: A. Restoration of myocardial contractility independent of preload — Loop diuretics do not function as primary inotropes.; B. Selective pulmonary arteriolar vasodilation — Furosemide is not a selective pulmonary vasodilator.; D. Direct reversal of myocardial fibrosis — Diuretics do not directly reverse fibrosis.", "pearl": "Loop diuresis lowers filling pressures and pulmonary congestion.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "A child on high-dose loop diuretics develops muscle weakness and frequent ventricular ectopics. Which laboratory abnormality is especially important to assess?", "options": ["Isolated high bicarbonate with normal potassium", "Hypokalaemia with possible hypomagnesaemia", "Hyperphosphataemia with normal electrolytes", "Isolated hypercalcaemia"], "answer": 1, "explanation": "Loop diuretics may cause potassium and magnesium losses that predispose to arrhythmia. Why not the others: A. Isolated high bicarbonate with normal potassium — Alkalosis may coexist but electrolyte loss is central to ectopy risk.; C. Hyperphosphataemia with normal electrolytes — Phosphate is not the principal loop-related arrhythmogenic deficit.; D. Isolated hypercalcaemia — Loop diuretics increase urinary calcium excretion rather than commonly causing hypercalcemia.", "pearl": "Loop diuretics may cause potassium and magnesium losses that predispose to arrhythmia.", "srcAnswer": "B"}, {"num": 10, "level": "High", "question": "A stable child with DCM is being considered for enalapril. Which finding most strongly argues for deferring initiation today?", "options": ["Symptomatic hypotension with acute kidney injury", "Stable compensated LV systolic dysfunction", "Mild functional mitral regurgitation", "Mildly elevated BNP with preserved blood pressure"], "answer": 0, "explanation": "Afterload reduction may worsen hypotension and renal perfusion during instability. Why not the others: B. Stable compensated LV systolic dysfunction — This is a common context for carefully introduced HF therapy.; C. Mild functional mitral regurgitation — Functional regurgitation may improve with appropriate afterload reduction.; D. Mildly elevated BNP with preserved blood pressure — BNP elevation alone is not a contraindication.", "pearl": "Afterload reduction may worsen hypotension and renal perfusion during instability.", "srcAnswer": "A"}, {"num": 11, "level": "High", "question": "A child with DCM is hypotensive, cold and receiving escalating inotropic support. When is carvedilol most appropriate?", "options": ["After a substantial EF improvement but while still receiving inotropes", "Immediately before restoring perfusion", "After stabilization and restoration of adequate perfusion", "At the same time as rapid inotrope escalation"], "answer": 2, "explanation": "Beta-blockers are generally introduced in stable chronic systolic HF, not during low-output shock. Why not the others: A. After a substantial EF improvement but while still receiving inotropes — Stable children may benefit despite persistent dilatation.; B. Immediately before restoring perfusion — Negative inotropy may worsen active shock.; D. At the same time as rapid inotrope escalation — This conflicts with the unstable hemodynamic state.", "pearl": "Beta-blockers are generally introduced in stable chronic systolic HF, not during low-output shock.", "srcAnswer": "C"}, {"num": 12, "level": "High", "question": "A child with decompensated LV failure has marginal arterial pressure. Which property of milrinone requires particular vigilance?", "options": ["Systemic vasodilation may aggravate hypotension", "It directly increases afterload through alpha-agonism", "It produces obligatory marked pulmonary vasoconstriction", "It causes profound bradycardia through AV-nodal blockade"], "answer": 0, "explanation": "PDE3 inhibition combines inotropy and vasodilation; pressure may fall. Why not the others: B. It directly increases afterload through alpha-agonism — It is not an alpha agonist.; C. It produces obligatory marked pulmonary vasoconstriction — Milrinone has pulmonary vasodilatory effects.; D. It causes profound bradycardia through AV-nodal blockade — That is not its defining pharmacology.", "pearl": "PDE3 inhibition combines inotropy and vasodilation; pressure may fall.", "srcAnswer": "A"}, {"num": 13, "level": "Integrated", "question": "A 4-month-old develops severe LV dysfunction and mitral regurgitation after a period of apparent wellbeing; ECG shows anterolateral infarction pattern. What diagnosis must be actively excluded?", "options": ["Idiopathic restrictive cardiomyopathy", "Isolated secundum ASD", "Isolated valvar pulmonary stenosis", "Anomalous left coronary artery from the pulmonary artery"], "answer": 3, "explanation": "ALCAPA can cause ischemic cardiomyopathy and papillary muscle dysfunction after PVR falls. Why not the others: A. Idiopathic restrictive cardiomyopathy — RCM usually causes diastolic failure with relatively preserved cavity size and early EF.; B. Isolated secundum ASD — ASD seldom causes infantile LV infarction-pattern cardiomyopathy.; C. Isolated valvar pulmonary stenosis — PS causes right-sided pressure overload, not LV ischemia pattern.", "pearl": "ALCAPA can cause ischemic cardiomyopathy and papillary muscle dysfunction after PVR falls.", "srcAnswer": "D"}, {"num": 14, "level": "High", "question": "An infant with severe aortic stenosis has pulmonary edema and reduced output. Which therapy needs particular caution because excessive afterload reduction can impair perfusion?", "options": ["Carefully monitored respiratory support", "Systemic vasodilator titration before relieving fixed LV outflow obstruction", "Serial lactate and urine-output monitoring", "Prompt assessment for valvar intervention"], "answer": 1, "explanation": "Marked vasodilation may compromise coronary/systemic perfusion with fixed obstruction. Why not the others: A. Carefully monitored respiratory support — Respiratory support may be necessary and is not inherently the fixed-obstruction problem.; C. Serial lactate and urine-output monitoring — These assess perfusion rather than worsening fixed obstruction.; D. Prompt assessment for valvar intervention — Addressing obstruction is central.", "pearl": "Marked vasodilation may compromise coronary/systemic perfusion with fixed obstruction.", "srcAnswer": "B"}, {"num": 15, "level": "Clinical", "question": "A child with advanced HF has warm hands, bounding pulses, hepatomegaly and pulmonary crackles but normal lactate. What is the primary physiologic problem?", "options": ["Primary isolated right-to-left cyanotic shunting", "Isolated hypovolaemia with low filling pressures", "Congestion with currently preserved systemic perfusion", "Pure low-output failure without congestion"], "answer": 2, "explanation": "Wet findings without low-output markers support warm-wet physiology. Why not the others: A. Primary isolated right-to-left cyanotic shunting — The described phenotype concerns congestion and perfusion.; B. Isolated hypovolaemia with low filling pressures — Hepatomegaly and crackles are inconsistent with isolated depletion.; D. Pure low-output failure without congestion — Multiple congestion signs are present.", "pearl": "Wet findings without low-output markers support warm-wet physiology.", "srcAnswer": "C"}, {"num": 16, "level": "Conceptual", "question": "A 6-kg infant with chronic HF fatigues after short feeds and fails to gain weight. What is the best nutrition principle?", "options": ["Protein restriction as first-line nutritional therapy", "Energy-dense feeds with individualized fluid volume and feeding support", "Larger low-calorie feed volumes with unchanged caloric density", "Temporary low-volume feeds without nutritional fortification"], "answer": 1, "explanation": "Higher energy density can improve intake without excessive volume; consider NG support. Why not the others: A. Protein restriction as first-line nutritional therapy — Protein restriction is not a general HF strategy.; C. Larger low-calorie feed volumes with unchanged caloric density — Dilution can reduce caloric density and worsen fluid burden.; D. Temporary low-volume feeds without nutritional fortification — Prolonged withholding of nutrition worsens growth.", "pearl": "Higher energy density can improve intake without excessive volume; consider NG support.", "srcAnswer": "B"}, {"num": 17, "level": "Clinical", "question": "In a child with cardiogenic shock, lactate falls from 5.2 to 2.1 mmol/L after therapy. What does the trend most reasonably suggest?", "options": ["Improving global tissue perfusion, interpreted with clinical findings", "Improvement of ventricular systolic function without repeat imaging", "Definitive resolution of myocardial inflammation", "Normalization of pulmonary vascular resistance"], "answer": 0, "explanation": "Falling lactate can support improved perfusion but is not specific. Why not the others: B. Improvement of ventricular systolic function without repeat imaging — EF requires cardiac imaging.; C. Definitive resolution of myocardial inflammation — Lactate does not establish myocarditis remission.; D. Normalization of pulmonary vascular resistance — Lactate is not a direct PVR measure.", "pearl": "Falling lactate can support improved perfusion but is not specific.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day20',label:'Day 20',set:'Quiz 1',href:'Day20/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day20_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 20 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 20 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 20'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 20');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day20:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
