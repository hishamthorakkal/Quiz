@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 52, "level": "Conceptual", "question": "A stable child with suspected viral myocarditis is being discussed for IVIG. Which statement best reflects evidence?", "options": ["IVIG has no role in selected immune-mediated pediatric cardiac syndromes", "Benefit is uncertain; do not describe IVIG as universally proven standard", "IVIG substitutes for shock support when EF is very low", "IVIG should routinely precede hemodynamic stabilization"], "answer": 1, "explanation": "Use varies and evidence does not support a universal mandate. Why not the others: A. IVIG has no role in selected immune-mediated pediatric cardiac syndromes — Selected contexts may justify use.; C. IVIG substitutes for shock support when EF is very low — Supportive hemodynamic management remains essential.; D. IVIG should routinely precede hemodynamic stabilization — No universal high-certainty recommendation supports that.", "pearl": "Use varies and evidence does not support a universal mandate.", "srcAnswer": "B"}, {"num": 53, "level": "Clinical", "question": "A 15-year-old is clinically improving after myocarditis and requests immediate competitive sport. What is the best recommendation?", "options": ["Long-term sport restriction without reassessing cardiac recovery", "Restrict strenuous sport until documented clinical recovery and specialist reassessment", "Return once fever stops regardless of cardiac findings", "Return if EF normalizes on one scan despite ongoing arrhythmia"], "answer": 1, "explanation": "Return requires resolution of inflammation/arrhythmia risk and individualized reassessment. Why not the others: A. Long-term sport restriction without reassessing cardiac recovery — Permanent prohibition is not universally indicated.; C. Return once fever stops regardless of cardiac findings — Fever resolution does not establish myocardial recovery.; D. Return if EF normalizes on one scan despite ongoing arrhythmia — Rhythm and tissue recovery matter.", "pearl": "Return requires resolution of inflammation/arrhythmia risk and individualized reassessment.", "srcAnswer": "B"}, {"num": 54, "level": "Clinical", "question": "A child with myocarditis has diffuse ST-T changes and low voltage but preserved blood pressure. Which conclusion is best?", "options": ["A normal tracing on repeat excludes myocarditis", "ST-T changes alone prove coronary infarction", "ECG supports suspicion but is neither diagnostic nor exclusionary", "Low voltage alone proves pericardial tamponade"], "answer": 2, "explanation": "ECG findings vary and require imaging/clinical integration. Why not the others: A. A normal tracing on repeat excludes myocarditis — Normal ECG does not reliably exclude disease.; B. ST-T changes alone prove coronary infarction — Myocarditis and other disorders can produce changes.; D. Low voltage alone proves pericardial tamponade — Low voltage is nonspecific without hemodynamic/echo evidence.", "pearl": "ECG findings vary and require imaging/clinical integration.", "srcAnswer": "C"}, {"num": 55, "level": "Clinical", "question": "A child presents with severe LV dysfunction, recent febrile illness, elevated troponin and CMR edema. Which diagnosis is most supported?", "options": ["Isolated mitral valve disease", "Primary familial DCM without inflammation", "Pure restrictive cardiomyopathy", "Active inflammatory myocarditis causing a DCM phenotype"], "answer": 3, "explanation": "Inflammation markers and edema favor active myocarditis over isolated chronic DCM. Why not the others: A. Isolated mitral valve disease — Does not explain troponin and myocardial edema alone.; B. Primary familial DCM without inflammation — Could coexist but does not explain active tissue edema as well.; C. Pure restrictive cardiomyopathy — Would show restrictive filling with nondilated ventricles rather than active edema.", "pearl": "Inflammation markers and edema favor active myocarditis over isolated chronic DCM.", "srcAnswer": "D"}, {"num": 56, "level": "Clinical", "question": "A child recovering from acute myocarditis has normalized EF but intermittent palpitations. Which follow-up assessment is most useful?", "options": ["Ambulatory rhythm monitoring alongside clinical/imaging review", "Repeat echocardiography without evaluating intermittent rhythm symptoms", "No follow-up because EF is normal", "Chest radiograph alone"], "answer": 0, "explanation": "Arrhythmic risk can persist after EF improves. Why not the others: B. Repeat echocardiography without evaluating intermittent rhythm symptoms — Does not evaluate cardiac rhythm.; C. No follow-up because EF is normal — EF recovery does not guarantee absence of arrhythmia.; D. Chest radiograph alone — Cannot detect intermittent arrhythmias.", "pearl": "Arrhythmic risk can persist after EF improves.", "srcAnswer": "A"}, {"num": 57, "level": "Clinical", "question": "A rapidly progressive inflammatory cardiomyopathy has refractory ventricular arrhythmias and high-grade conduction disease. What diagnostic approach is most defensible?", "options": ["Continue conventional HF treatment without etiology-directed reassessment", "Exclude myocarditis because symptoms include arrhythmias", "Urgent specialist evaluation for EMB and targeted therapy", "Assume benign viral illness and defer work-up"], "answer": 2, "explanation": "Specific inflammatory subtypes may be histologically identifiable and treatment altering. Why not the others: A. Continue conventional HF treatment without etiology-directed reassessment — Does not address potentially treatable inflammatory etiology.; B. Exclude myocarditis because symptoms include arrhythmias — Arrhythmias are recognized presentations.; D. Assume benign viral illness and defer work-up — Severe refractory disease is high risk.", "pearl": "Specific inflammatory subtypes may be histologically identifiable and treatment altering.", "srcAnswer": "C"}, {"num": 58, "level": "High", "question": "A school-age child has fever, shock, elevated inflammatory markers and LV dysfunction weeks after SARS-CoV-2 exposure. What is the best diagnostic framing?", "options": ["Diagnose isolated idiopathic HCM", "Evaluate MIS-C with myocardial involvement while excluding other causes", "Assume uncomplicated myocarditis without assessing systemic criteria", "Prioritize bacterial pneumonia without systemic inflammatory evaluation"], "answer": 1, "explanation": "Postinfectious systemic inflammation can include myocardial dysfunction. Why not the others: A. Diagnose isolated idiopathic HCM — Acute fever/shock/inflammation do not fit idiopathic HCM.; C. Assume uncomplicated myocarditis without assessing systemic criteria — MIS-C has systemic criteria and differential diagnoses.; D. Prioritize bacterial pneumonia without systemic inflammatory evaluation — Cardiac dysfunction and systemic inflammatory context warrant MIS-C evaluation.", "pearl": "Postinfectious systemic inflammation can include myocardial dysfunction.", "srcAnswer": "B"}, {"num": 59, "level": "Clinical", "question": "A child with myocarditis has severe low-output hypotension. Which treatment principle is appropriate?", "options": ["Use high-dose vasodilator without pressure monitoring", "Transition to oral decongestion despite persistent shock", "Choose titratable vasoactive support based on perfusion and blood pressure", "Start chronic beta blocker during escalating shock"], "answer": 2, "explanation": "Inotropes/vasopressors are individualized; monitor response closely. Why not the others: A. Use high-dose vasodilator without pressure monitoring — May precipitate hypotension.; B. Transition to oral decongestion despite persistent shock — Diuresis alone cannot restore shock perfusion.; D. Start chronic beta blocker during escalating shock — Negative inotropy may worsen instability.", "pearl": "Inotropes/vasopressors are individualized; monitor response closely.", "srcAnswer": "C"}, {"num": 60, "level": "Conceptual", "question": "A stable 8-year-old has catheter mPAP 23 mmHg. Under the 2022 ESC/ERS framework, which statement is most accurate?", "options": ["This is normal because PH requires mPAP ≥30 mmHg", "This alone proves pulmonary arterial hypertension", "This exceeds the >20 mmHg PH threshold; etiology needs full hemodynamic context", "This alone proves postcapillary PH"], "answer": 2, "explanation": "The updated definition applies to children, while implications of 21–24 mmHg remain uncertain. Why not the others: A. This is normal because PH requires mPAP ≥30 mmHg — Threshold is lower than 30.; B. This alone proves pulmonary arterial hypertension — PAH additionally requires precapillary features and indexed PVR assessment.; D. This alone proves postcapillary PH — Wedge pressure is required to classify.", "pearl": "The updated definition applies to children, while implications of 21–24 mmHg remain uncertain.", "srcAnswer": "C"}, {"num": 61, "level": "Clinical", "question": "A 7-year-old has mPAP 35, wedge 9 mmHg and PVRI 5 WU·m². What hemodynamic phenotype is supported?", "options": ["Pure high-flow PH with normal indexed resistance", "Normal pulmonary circulation", "Isolated postcapillary PH", "Precapillary pulmonary hypertensive vascular disease"], "answer": 3, "explanation": "Elevated mPAP, normal wedge and elevated PVRI support precapillary disease. Why not the others: A. Pure high-flow PH with normal indexed resistance — PVRI is elevated.; B. Normal pulmonary circulation — Both mPAP and PVRI are abnormal.; C. Isolated postcapillary PH — Wedge is not elevated.", "pearl": "Elevated mPAP, normal wedge and elevated PVRI support precapillary disease.", "srcAnswer": "D"}, {"num": 62, "level": "Integrated", "question": "At catheterization, mPAP is 38 mmHg, wedge 10 mmHg and pulmonary flow 4 L/min. What is nonindexed PVR?", "options": ["7 Wood units", "5 Wood units", "9.5 Wood units", "12 Wood units"], "answer": 0, "explanation": "PVR = (38 − 10)/4 = 7 WU. Why not the others: B. 5 Wood units — Would require an incorrect pressure gradient or denominator.; C. 9.5 Wood units — Dividing 38 by 4 ignores wedge pressure.; D. 12 Wood units — Does not follow the measured transpulmonary gradient and flow.", "pearl": "PVR = (38 − 10)/4 = 7 WU.", "srcAnswer": "A"}, {"num": 63, "level": "High", "question": "A child has PVR 4 WU and BSA 0.8 m². What is PVRI?", "options": ["0.2 WU·m²", "3.2 WU·m²", "5.0 WU·m²", "4.8 WU·m²"], "answer": 1, "explanation": "PVRI = PVR × BSA = 4 × 0.8 = 3.2 WU·m². Why not the others: A. 0.2 WU·m² — This subtracts or mis-scales BSA.; C. 5.0 WU·m² — This divides by BSA instead of multiplying.; D. 4.8 WU·m² — This adds BSA to resistance, which is dimensionally invalid.", "pearl": "PVRI = PVR × BSA = 4 × 0.8 = 3.2 WU·m².", "srcAnswer": "B"}, {"num": 64, "level": "Clinical", "question": "Two children have mPAP 36 mmHg. Child A has PAWP 9; child B PAWP 22. What is the key distinction?", "options": ["Child B has an elevated left-sided filling pressure suggesting postcapillary contribution", "Child B has isolated precapillary disease by definition", "Both have the same PAH subtype because mPAP is identical", "Child A necessarily has left heart disease"], "answer": 0, "explanation": "Wedge >15 mmHg supports postcapillary physiology. Why not the others: B. Child B has isolated precapillary disease by definition — High wedge implies postcapillary contribution.; C. Both have the same PAH subtype because mPAP is identical — PAH cannot be diagnosed from mPAP alone.; D. Child A necessarily has left heart disease — A normal wedge does not support elevated LA pressure.", "pearl": "Wedge >15 mmHg supports postcapillary physiology.", "srcAnswer": "A"}, {"num": 65, "level": "Clinical", "question": "A child with severe bronchopulmonary dysplasia develops PH with chronic hypoxemia. Which WHO group is most relevant?", "options": ["Group 1: idiopathic PAH", "Group 4: chronic thromboembolic PH", "Group 3: lung disease/hypoxia-associated PH", "Group 2: left heart disease PH"], "answer": 2, "explanation": "Chronic lung disease and hypoxia contribute to PH. Why not the others: A. Group 1: idiopathic PAH — BPD provides a recognized lung-disease association.; B. Group 4: chronic thromboembolic PH — No thromboembolic disease is described.; D. Group 2: left heart disease PH — No primary left heart disease is given.", "pearl": "Chronic lung disease and hypoxia contribute to PH.", "srcAnswer": "C"}, {"num": 66, "level": "Clinical", "question": "A child has elevated TR velocity on echocardiography. What is the most defensible interpretation?", "options": ["Echo estimates PH probability; catheterization defines hemodynamics when indicated", "Echo alone measures indexed PVR with definitive accuracy", "A low-quality TR estimate excludes clinically relevant PH", "High TR velocity establishes idiopathic PAH etiology"], "answer": 0, "explanation": "TR-based estimates have limitations and cannot fully classify PVR/wedge. Why not the others: B. Echo alone measures indexed PVR with definitive accuracy — Indexed PVR requires flow and pressure assessment.; C. A low-quality TR estimate excludes clinically relevant PH — Poor jet quality or absent TR may limit sensitivity.; D. High TR velocity establishes idiopathic PAH etiology — Etiology requires further assessment.", "pearl": "TR-based estimates have limitations and cannot fully classify PVR/wedge.", "srcAnswer": "A"}, {"num": 67, "level": "Clinical", "question": "An intubated child with PAH becomes hypoxemic, acidotic and hypotensive during suctioning. What should be addressed immediately?", "options": ["Correct hypoxia/acidosis, optimize sedation and initiate rapid pulmonary vasodilator support", "Allow ongoing hypoxia to avoid oxygen toxicity", "Give rapid large fluid boluses irrespective of RV status", "Withhold analgesia to preserve spontaneous drive"], "answer": 0, "explanation": "Hypoxia, acidosis and agitation raise PVR; inhaled vasodilators may be lifesaving. Why not the others: B. Allow ongoing hypoxia to avoid oxygen toxicity — Hypoxemia is a major PH crisis trigger.; C. Give rapid large fluid boluses irrespective of RV status — Both overload and depletion can destabilize RV output.; D. Withhold analgesia to preserve spontaneous drive — Agitation/pain worsen PVR.", "pearl": "Hypoxia, acidosis and agitation raise PVR; inhaled vasodilators may be lifesaving.", "srcAnswer": "A"}, {"num": 68, "level": "High", "question": "An ICU child has a pulmonary hypertensive crisis with acute RV failure. Which immediate targeted therapy has guideline support?", "options": ["Intravenous furosemide as the primary targeted pulmonary vasodilator", "Oral sildenafil loading instead of inhaled crisis therapy", "Rapid initiation of oral bosentan before inhaled rescue therapy", "Inhaled nitric oxide or inhaled prostacyclin"], "answer": 3, "explanation": "2025 pediatric resuscitation guidance recommends inhaled pulmonary vasodilators as initial targeted therapy. Why not the others: A. Intravenous furosemide as the primary targeted pulmonary vasodilator — Diuresis may address congestion but is not targeted pulmonary vasodilation.; B. Oral sildenafil loading instead of inhaled crisis therapy — Onset/route is not a substitute for inhaled emergency vasodilators.; C. Rapid initiation of oral bosentan before inhaled rescue therapy — Oral endothelin blockade is not rapid crisis rescue.", "pearl": "2025 pediatric resuscitation guidance recommends inhaled pulmonary vasodilators as initial targeted therapy.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day20',label:'Day 20',set:'Quiz 4',href:'Day20/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day20_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 20 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 20 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 20'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 20');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day20:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
