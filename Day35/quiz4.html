<script>
const quiz=[{"num": 52, "level": "Clinical", "question": "Which clinical finding most strongly suggests portal hypertension in a child with chronic liver disease?", "options": ["Splenomegaly with abdominal collaterals", "Isolated mildly raised ALT", "A single episode of constipation", "Normal growth with no stigmata"], "answer": 0, "explanation": "Splenomegaly and portosystemic collaterals indicate elevated portal pressure. Why not the others (added — not from source): B. Isolated mildly raised ALT — A mildly raised ALT reflects hepatocyte injury, not raised portal pressure.; C. A single episode of constipation — A single episode of constipation is nonspecific and unrelated to portal hypertension.; D. Normal growth with no stigmata — Absence of stigmata argues against, rather than for, portal hypertension.", "pearl": "", "srcAnswer": "A"}, {"num": 53, "level": "Clinical", "question": "A child with portal hypertension presents with haematemesis and shock. Which action is first?", "options": ["Give prophylactic iron and discharge", "Start unrestricted oral fluids only", "Immediate resuscitation and urgent specialist management of variceal bleeding", "Schedule elective outpatient endoscopy in 4 weeks"], "answer": 2, "explanation": "Bleeding varices are a life-threatening emergency; stabilisation precedes definitive endoscopic therapy. Why not the others (added — not from source): A. Give prophylactic iron and discharge — Haematemesis with shock is a life-threatening variceal bleed; discharge on iron ignores the need for resuscitation.; B. Start unrestricted oral fluids only — Oral fluids are inappropriate in active upper GI bleeding with shock; IV access, cautious volume and blood resuscitation are needed.; D. Schedule elective outpatient endoscopy in 4 weeks — Endoscopy is needed urgently after stabilisation, typically within 12–24 hours, not electively weeks later.", "pearl": "", "srcAnswer": "C"}, {"num": 54, "level": "High", "question": "Which test most directly assesses suspected oesophageal varices?", "options": ["Routine EEG", "Upper gastrointestinal endoscopy", "Sweat chloride alone", "Plain abdominal radiograph"], "answer": 1, "explanation": "Endoscopy visualises varices and permits therapy where indicated. Why not the others (added — not from source): A. Routine EEG — EEG assesses encephalopathy, not the oesophagus.; C. Sweat chloride alone — Sweat chloride tests for cystic fibrosis, a possible cause of liver disease, but cannot detect varices.; D. Plain abdominal radiograph — A plain radiograph cannot visualise oesophageal varices.", "pearl": "", "srcAnswer": "B"}, {"num": 55, "level": "Clinical", "question": "A child has portal hypertension with relatively preserved liver synthetic function and extrahepatic portal vein obstruction. Which statement is true?", "options": ["All portal hypertension requires advanced cirrhosis", "Hepatic encephalopathy is inevitable at presentation", "INR must be above 2.5", "Portal hypertension can occur without cirrhosis"], "answer": 3, "explanation": "Extrahepatic portal venous obstruction is a noncirrhotic cause. Why not the others (added — not from source): A. All portal hypertension requires advanced cirrhosis — EHPVO is a classic noncirrhotic cause of portal hypertension with normal liver parenchyma.; B. Hepatic encephalopathy is inevitable at presentation — With preserved liver function, encephalopathy is uncommon in EHPVO; presentation is usually variceal bleeding or splenomegaly.; C. INR must be above 2.5 — Synthetic function is preserved in EHPVO, so INR is typically normal; no INR threshold defines portal hypertension.", "pearl": "", "srcAnswer": "D"}, {"num": 56, "level": "Clinical", "question": "After TAPVC repair a child develops pulmonary venous congestion and recurrent pulmonary hypertension. Which lesion is most concerning?", "options": ["Isolated peripheral pulmonary artery stenosis", "Aortic coarctation", "Pulmonary venous anastomotic stenosis", "Pulmonary valve regurgitation alone"], "answer": 2, "explanation": "Pulmonary venous obstruction directly causes pulmonary venous congestion after TAPVC repair. Why not the others (added — not from source): A. Isolated peripheral pulmonary artery stenosis — Peripheral pulmonary artery stenosis raises RV pressure but does not cause pulmonary venous congestion.; B. Aortic coarctation — Coarctation causes upper-limb hypertension and LV pressure load, not post-capillary pulmonary venous obstruction after TAPVC repair.; D. Pulmonary valve regurgitation alone — Isolated pulmonary regurgitation causes RV volume load, not pulmonary venous congestion or recurrent pulmonary hypertension.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 19 Q28 — TAPVC — post-repair pulmonary venous stenosis"}}, {"num": 57, "level": "Clinical", "question": "A child with chronic cholestatic liver disease develops pruritus. Which mechanism is implicated?", "options": ["A single high AST result without cholestasis", "Cholestatic retention of pruritogenic mediators", "Isolated hypercalcaemia in all patients", "Uncomplicated haemolysis alone"], "answer": 1, "explanation": "Pruritus in cholestasis has complex mediator pathways; assess severity and specialist therapy. Why not the others (added — not from source): A. A single high AST result without cholestasis — A single high AST reflects hepatocellular injury, not cholestasis, and does not explain pruritus.; C. Isolated hypercalcaemia in all patients — Hypercalcaemia is not a feature of cholestatic liver disease and is not the mechanism of cholestatic pruritus.; D. Uncomplicated haemolysis alone — Uncomplicated haemolysis causes unconjugated hyperbilirubinaemia without bile-acid retention, so it does not cause pruritus.", "pearl": "", "srcAnswer": "B"}, {"num": 58, "level": "Clinical", "question": "A child with chronic liver disease has a prolonged INR and low albumin. These findings primarily reflect:", "options": ["Isolated splenic enlargement only", "Exclusively hepatocyte necrosis without synthetic effect", "Guaranteed adequate liver reserve", "Impaired hepatic synthetic function, with other causes considered"], "answer": 3, "explanation": "INR and albumin are synthesis-related markers but albumin is also influenced by nutrition/inflammation. Why not the others (added — not from source): A. Isolated splenic enlargement only — Splenomegaly reflects portal hypertension and hypersplenism; it does not explain a prolonged INR or low albumin, which are hepatic synthetic markers.; B. Exclusively hepatocyte necrosis without synthetic effect — Hepatocyte necrosis is shown by transaminase rise; INR and albumin specifically reflect synthetic capacity, so 'without synthetic effect' contradicts these findings.; C. Guaranteed adequate liver reserve — A prolonged INR with hypoalbuminaemia signals reduced hepatic reserve, the opposite of guaranteed adequate reserve.", "pearl": "", "srcAnswer": "D"}, {"num": 59, "level": "Clinical", "question": "A child with chronic liver disease has progressive growth failure. Which approach is best?", "options": ["Routine severe protein restriction for all", "Rely only on appetite as a growth measure", "Structured nutritional assessment and adequate energy/protein with specialist guidance", "Withhold all fat-soluble vitamins"], "answer": 2, "explanation": "Malnutrition is common and worsens outcomes; unnecessary protein restriction is harmful. Why not the others (added — not from source): A. Routine severe protein restriction for all — Routine protein restriction worsens malnutrition and growth in chronic liver disease; adequate protein is needed, with restriction reserved only for specific situations under specialist advice.; B. Rely only on appetite as a growth measure — Appetite is unreliable in chronic liver disease; growth needs objective anthropometry, and weight can be falsely reassuring with organomegaly or ascites.; D. Withhold all fat-soluble vitamins — Cholestatic liver disease causes fat-soluble vitamin malabsorption, so A, D, E and K need monitoring and supplementation, not withholding.", "pearl": "", "srcAnswer": "C"}, {"num": 60, "level": "Clinical", "question": "A child with portal hypertension and ascites develops fever and abdominal pain. Which complication must be considered?", "options": ["Spontaneous bacterial peritonitis", "Physiologic infant colic", "Isolated gastro-oesophageal reflux", "Simple lactose intolerance only"], "answer": 0, "explanation": "Infected ascitic fluid is a serious possibility needing urgent evaluation. Why not the others (added — not from source): B. Physiologic infant colic — Infant colic is a benign crying pattern in well infants; it does not explain fever and abdominal pain in a child with ascites.; C. Isolated gastro-oesophageal reflux — Reflux does not cause fever; fever with abdominal pain in a child with ascites must prompt diagnostic paracentesis for SBP.; D. Simple lactose intolerance only — Lactose intolerance causes bloating and diarrhoea without fever; it ignores the high-risk setting of ascites where SBP must be excluded.", "pearl": "", "srcAnswer": "A"}, {"num": 61, "level": "Clinical", "question": "Which complication of chronic cholestasis is related to impaired intestinal absorption?", "options": ["Fat-soluble vitamin deficiency", "Isolated folate overproduction", "Universal vitamin B12 excess", "Primary vitamin C intoxication"], "answer": 0, "explanation": "Reduced bile delivery compromises absorption of vitamins A, D, E and K. Why not the others (added — not from source): B. Isolated folate overproduction — Folate is not overproduced in cholestasis; reduced bile flow impairs fat and fat-soluble vitamin absorption, not water-soluble vitamin excess.; C. Universal vitamin B12 excess — B12 absorption depends on intrinsic factor and the terminal ileum, not bile; cholestasis does not cause universal B12 excess.; D. Primary vitamin C intoxication — Vitamin C is water-soluble and its absorption is not bile-dependent; cholestasis causes deficiency of fat-soluble vitamins, not vitamin C toxicity.", "pearl": "", "srcAnswer": "A"}, {"num": 62, "level": "Clinical", "question": "A child with chronic liver disease develops encephalopathy. Which precipitant should be actively sought?", "options": ["Gastrointestinal bleeding or infection", "Isolated mild eczema", "Normal age-appropriate sleep", "Physiological growth spurt"], "answer": 0, "explanation": "Bleeding, infection, constipation, electrolyte disorders and medications can precipitate encephalopathy. Why not the others (added — not from source): B. Isolated mild eczema — Mild eczema is not a recognised precipitant of hepatic encephalopathy; bleeding, infection, constipation, electrolyte upset and sedatives are.; C. Normal age-appropriate sleep — Normal sleep is not a precipitant; an altered sleep-wake cycle can itself be an early sign of encephalopathy rather than a cause.; D. Physiological growth spurt — A growth spurt does not precipitate encephalopathy; an increased nitrogen load from GI bleeding or catabolism from infection does.", "pearl": "", "srcAnswer": "A"}, {"num": 63, "level": "High", "question": "Which ultrasound Doppler finding is useful when evaluating portal hypertension?", "options": ["Only renal length", "Only cerebral ventricular width", "Only gallbladder wall thickness without Doppler", "Portal venous flow direction and patency"], "answer": 3, "explanation": "Doppler assesses portal circulation and possible obstruction/collaterals. Why not the others (added — not from source): A. Only renal length — Renal length gives no information about the portal circulation; Doppler of portal venous flow and patency is what assesses portal hypertension.; B. Only cerebral ventricular width — Cranial ventricular width is unrelated to portal hypertension and does not evaluate portal vein patency or flow.; C. Only gallbladder wall thickness without Doppler — Gallbladder wall thickness without Doppler cannot show portal venous flow direction, thrombosis (e.g. EHPVO) or collaterals.", "pearl": "", "srcAnswer": "D"}, {"num": 64, "level": "Clinical", "question": "A 24-kg child has SVT and a local protocol specifies second-dose adenosine 0.2 mg/kg rapid IV/IO (maximum 12 mg). What is the calculated dose?", "options": ["4.8 mg", "2.4 mg", "24 mg", "12 mg"], "answer": 0, "explanation": "0.2 × 24 = 4.8 mg; maximum 12 mg is a ceiling, not the default dose. Confirm local protocol. Why not the others (added — not from source): B. 2.4 mg — 2.4 mg is 0.1 mg/kg, the usual first dose; the stem specifies the second dose of 0.2 mg/kg, giving 4.8 mg.; C. 24 mg — 24 mg is a tenfold decimal error (1 mg/kg) and exceeds the 12 mg maximum.; D. 12 mg — 12 mg is the ceiling, not the calculated dose; 0.2 mg/kg x 24 kg is 4.8 mg, below the maximum.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 21 C6 — second-dose adenosine 0.2 mg/kg (max 12 mg) calculation"}}, {"num": 65, "level": "Clinical", "question": "A child with cirrhosis has sudden worsening ascites and renal function. Which response is best?", "options": ["Stop monitoring electrolytes", "Give empiric nephrotoxic drugs", "Evaluate for infection, haemodynamic compromise and acute kidney injury", "Assume the changes are normal puberty"], "answer": 2, "explanation": "Decompensation warrants urgent cause-directed assessment. Why not the others (added — not from source): A. Stop monitoring electrolytes — Worsening ascites and renal function demand closer electrolyte monitoring, as hyponatraemia and AKI/hepatorenal physiology are likely.; B. Give empiric nephrotoxic drugs — Nephrotoxic drugs (e.g. NSAIDs, aminoglycosides) worsen AKI in cirrhosis and should be avoided; the cause of decompensation must be sought.; D. Assume the changes are normal puberty — Puberty does not cause ascites or renal impairment; sudden decompensation suggests infection such as SBP, bleeding, hypovolaemia or AKI.", "pearl": "", "srcAnswer": "C"}, {"num": 66, "level": "Clinical", "question": "Which finding differentiates a compensated from a decompensated chronic liver disease presentation?", "options": ["A normal abdominal examination", "Isolated stable mild transaminase elevation", "Normal coagulation studies", "New ascites or variceal bleeding"], "answer": 3, "explanation": "Ascites and variceal bleeding are decompensating events. Why not the others (added — not from source): A. A normal abdominal examination — A normal abdominal examination is consistent with compensated disease; decompensation is defined by events such as ascites or variceal bleeding.; B. Isolated stable mild transaminase elevation — Stable mild transaminase elevation can occur in compensated disease and does not mark decompensation.; C. Normal coagulation studies — Normal coagulation indicates preserved synthetic function, which favours compensated rather than decompensated disease.", "pearl": "", "srcAnswer": "D"}, {"num": 67, "level": "Basic", "question": "Which gene is implicated in Wilson disease?", "options": ["ABCB11", "ATP8B1", "ATP7B", "UGT1A1"], "answer": 2, "explanation": "ATP7B encodes a copper-transporting ATPase needed for biliary copper excretion. Why not the others (added — not from source): A. ABCB11 — ABCB11 encodes the bile salt export pump; mutations cause PFIC2, not Wilson disease.; B. ATP8B1 — ATP8B1 encodes FIC1; mutations cause PFIC1/BRIC, not copper accumulation.; D. UGT1A1 — UGT1A1 encodes bilirubin glucuronyltransferase; variants cause Gilbert and Crigler-Najjar syndromes, not Wilson disease.", "pearl": "", "srcAnswer": "C"}, {"num": 68, "level": "Clinical", "question": "An adolescent has liver disease, dysarthria and Kayser–Fleischer rings. Which diagnosis best integrates these findings?", "options": ["Alagille syndrome", "Wilson disease", "Primary lactase deficiency", "Isolated Gilbert syndrome"], "answer": 1, "explanation": "Hepatic and neurologic features with KF rings suggest copper accumulation. Why not the others (added — not from source): A. Alagille syndrome — Alagille syndrome causes cholestasis with bile duct paucity, cardiac, vertebral and ocular (posterior embryotoxon) features, not KF rings with dysarthria.; C. Primary lactase deficiency — Lactase deficiency causes carbohydrate malabsorption only; it has no hepatic, neurological or corneal copper features.; D. Isolated Gilbert syndrome — Gilbert syndrome causes benign unconjugated hyperbilirubinaemia without liver disease, neurological signs or KF rings.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day35',label:'Day 35',set:'Quiz 4',href:'Day35/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day35_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 35 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 35 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 35'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 35');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day35:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
