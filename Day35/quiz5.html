<script>
const quiz=[{"num": 69, "level": "High", "question": "A child with suspected Wilson disease has ceruloplasmin 18 mg/dL. Which interpretation is correct?", "options": ["It proves autoimmune hepatitis", "Sufficient by itself for definite Wilson diagnosis", "Normal ceruloplasmin excludes Wilson disease", "Supportive but neither diagnostic nor exclusionary alone"], "answer": 3, "explanation": "Ceruloplasmin is imperfect; combine clinical, urine copper, ocular and genetic evidence. Why not the others (added — not from source): A. It proves autoimmune hepatitis — Low ceruloplasmin does not indicate autoimmune hepatitis; it raises possible Wilson disease, though AIH can mimic it and is assessed separately.; B. Sufficient by itself for definite Wilson diagnosis — Ceruloplasmin is imperfect: it can be low in heterozygotes, protein-losing states or liver failure, so it is not diagnostic alone.; C. Normal ceruloplasmin excludes Wilson disease — Normal ceruloplasmin does not exclude Wilson disease, as it is an acute-phase reactant; also 18 mg/dL is below the usual normal range, not normal.", "pearl": "", "srcAnswer": "D"}, {"num": 70, "level": "Clinical", "question": "Which basal 24-hour urinary copper value in a child may warrant further Wilson evaluation even if below the classic symptomatic threshold?", "options": ["Only above 500 micrograms per 24 hours", "Only exactly 0 micrograms per 24 hours", "Above 1 microgram per 24 hours only", "Above approximately 40 micrograms per 24 hours"], "answer": 3, "explanation": "AASLD 2022 notes >40 μg/day may be informative in children/asymptomatic individuals; not diagnostic alone. Why not the others (added — not from source): A. Only above 500 micrograms per 24 hours — 500 μg/24h is far above even the classic >100 μg/24h symptomatic threshold; using it would miss many children with Wilson disease.; B. Only exactly 0 micrograms per 24 hours — Zero urinary copper is not a physiological finding or a Wilson threshold; normal children excrete small measurable amounts.; C. Above 1 microgram per 24 hours only — Almost all children excrete more than 1 μg/24h, so this cutoff has no discriminating value; >40 μg/24h is the informative paediatric level.", "pearl": "", "srcAnswer": "D"}, {"num": 71, "level": "Clinical", "question": "Which Leipzig diagnostic score generally supports Wilson disease strongly?", "options": ["A score of 4 or more", "Any score below 0", "Only a score above 12", "A score of exactly 1"], "answer": 0, "explanation": "Leipzig ≥4 supports diagnosis, interpreted with the component tests. Why not the others (added — not from source): B. Any score below 0 — A negative score does not support Wilson disease; scores of 0-1 make the diagnosis unlikely.; C. Only a score above 12 — Requiring a score above 12 is far stricter than the Leipzig scale; a total of 4 or more already makes the diagnosis highly likely.; D. A score of exactly 1 — A score of 1 makes Wilson disease unlikely; 2-3 is probable and needs more tests, and 4 or more is supportive.", "pearl": "", "srcAnswer": "A"}, {"num": 72, "level": "Clinical", "question": "A fasting child has hypoketotic hypoglycaemia and raised C8 acylcarnitine. Which diagnosis fits best?", "options": ["Propionic acidaemia with C3", "MCAD deficiency", "VLCAD deficiency with C14:1", "Maple syrup urine disease"], "answer": 1, "explanation": "C8 is a characteristic MCAD screening marker; VLCAD typically C14:1. Why not the others (added — not from source): A. Propionic acidaemia with C3 — Propionic acidaemia raises C3, typically with ketoacidosis and hyperammonaemia, not hypoketotic hypoglycaemia with raised C8.; C. VLCAD deficiency with C14:1 — VLCAD deficiency is a fatty acid oxidation defect but its marker is C14:1, often with cardiomyopathy or rhabdomyolysis, not raised C8.; D. Maple syrup urine disease — MSUD shows raised branched-chain amino acids and alloisoleucine with encephalopathy and maple odour, not hypoketotic hypoglycaemia with C8.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 15 Q77 — MCAD deficiency — C8 acylcarnitine"}}, {"num": 73, "level": "Clinical", "question": "A child has Wilson disease with symptomatic hepatic involvement. Which treatment category is generally used initially under AASLD guidance?", "options": ["Copper chelation with specialist supervision", "Phototherapy alone", "Routine antibiotics without copper therapy", "Dietary copper restriction alone"], "answer": 0, "explanation": "Symptomatic Wilson disease is treated with chelators such as penicillamine or trientine; monitor adverse effects. Why not the others (added — not from source): B. Phototherapy alone — Phototherapy treats unconjugated neonatal hyperbilirubinaemia; it has no role in removing copper in Wilson disease.; C. Routine antibiotics without copper therapy — Antibiotics do not address copper overload; symptomatic Wilson disease needs chelation such as penicillamine or trientine.; D. Dietary copper restriction alone — Dietary copper restriction alone is insufficient for symptomatic disease; it is only an adjunct to chelation, which is the initial treatment.", "pearl": "", "srcAnswer": "A"}, {"num": 74, "level": "Clinical", "question": "A clinically well sibling of a patient with genetically confirmed Wilson disease should undergo:", "options": ["Routine liver biopsy for every family member", "Targeted family screening with appropriate biochemical/genetic evaluation", "Only a vision chart", "No screening until neurologic symptoms occur"], "answer": 1, "explanation": "First-degree relatives require evaluation before clinical disease emerges. Why not the others (added — not from source): A. Routine liver biopsy for every family member — Routine biopsy for every relative is unnecessarily invasive; biochemical tests and targeted ATP7B testing for the known variants usually suffice.; C. Only a vision chart — A vision chart cannot detect KF rings (slit-lamp needed) or presymptomatic liver disease; siblings need biochemical and genetic evaluation.; D. No screening until neurologic symptoms occur — Waiting for neurological symptoms forfeits the benefit of presymptomatic treatment; siblings have a 25% risk and should be screened now.", "pearl": "", "srcAnswer": "B"}, {"num": 75, "level": "High", "question": "Which statement about Kayser–Fleischer rings in children is most accurate?", "options": ["They diagnose Wilson disease without any other assessment", "They are universally present in all paediatric hepatic cases", "Their absence does not exclude hepatic Wilson disease", "They are specific to neonatal biliary atresia"], "answer": 2, "explanation": "KF rings may be absent in liver-predominant childhood disease. Why not the others (added — not from source): A. They diagnose Wilson disease without any other assessment — KF rings are strongly suggestive but not absolute; they also occur in some chronic cholestatic diseases, and diagnosis integrates copper studies, ceruloplasmin and genetics.; B. They are universally present in all paediatric hepatic cases — KF rings are frequently absent in children with liver-predominant Wilson disease; they are present in most neurological cases.; D. They are specific to neonatal biliary atresia — KF rings reflect corneal copper deposition in Wilson disease; they are not a feature of neonatal biliary atresia.", "pearl": "", "srcAnswer": "C"}, {"num": 76, "level": "Clinical", "question": "A child with Wilson disease develops acute liver failure and severe haemolysis. Which pathway is important?", "options": ["Use dietary restriction as the only emergency treatment", "Delay referral until chelation alone has been tried for years", "Urgent transplant-centre assessment alongside stabilisation", "Assume spontaneous recovery is certain"], "answer": 2, "explanation": "Wilson-related ALF is high risk and may require liver transplantation. Why not the others (added — not from source): A. Use dietary restriction as the only emergency treatment — Dietary copper restriction does nothing in acute fulminant Wilson disease with haemolysis, which carries high mortality without transplantation.; B. Delay referral until chelation alone has been tried for years — Fulminant Wilson disease rarely responds to chelation alone; delaying transplant referral is dangerous.; D. Assume spontaneous recovery is certain — Spontaneous recovery is unlikely in Wilsonian ALF with haemolysis; prognosis is poor without transplantation, so urgent referral is needed.", "pearl": "", "srcAnswer": "C"}, {"num": 77, "level": "Integrated", "question": "Which monitoring concern is relevant during D-penicillamine treatment?", "options": ["No laboratory monitoring is needed", "Cytopenias and proteinuria", "Universal hyperthyroidism", "Routine irreversible hearing loss in every patient"], "answer": 1, "explanation": "Chelator adverse effects include haematologic and renal toxicity; monitor CBC and urine. Why not the others (added — not from source): A. No laboratory monitoring is needed — Penicillamine has significant toxicity, so blood counts, urinalysis and copper indices need regular monitoring.; C. Universal hyperthyroidism — Hyperthyroidism is not a recognised universal adverse effect of penicillamine; marrow suppression and proteinuria are.; D. Routine irreversible hearing loss in every patient — Irreversible hearing loss is not a characteristic penicillamine toxicity (it fits aminoglycosides or cisplatin); cytopenias and proteinuria are.", "pearl": "", "srcAnswer": "B"}, {"num": 78, "level": "Clinical", "question": "Which newer guideline was published in 2025 and updates European Wilson disease management?", "options": ["The 2013 IAP ALF consensus", "The 2025 AAP biliary atresia screening report", "EASL–ERN clinical practice guideline", "The 2017 NASPGHAN cholestasis guideline"], "answer": 2, "explanation": "The EASL–ERN 2025 Wilson guideline is distinct from neonatal cholestasis/BA reports. Why not the others (added — not from source): A. The 2013 IAP ALF consensus — An IAP ALF consensus addresses acute liver failure, not European Wilson disease management, and is not a 2025 guideline.; B. The 2025 AAP biliary atresia screening report — The 2025 AAP report concerns biliary atresia detection at 2-4 weeks, not Wilson disease.; D. The 2017 NASPGHAN cholestasis guideline — The 2017 NASPGHAN/ESPGHAN guideline covers neonatal cholestasis evaluation, not Wilson disease, and predates 2025.", "pearl": "", "srcAnswer": "C"}, {"num": 79, "level": "Clinical", "question": "A neonate develops liver failure, hypoglycaemia and E. coli sepsis after milk feeds. Which enzyme deficiency is most likely?", "options": ["Aldolase B deficiency after fructose exposure", "Galactose-1-phosphate uridyltransferase deficiency", "Glucose-6-phosphatase deficiency with isolated fasting symptoms", "Galactokinase deficiency causing isolated cataracts"], "answer": 1, "explanation": "Classic galactosaemia (GALT) causes severe multisystem neonatal illness. Why not the others (added — not from source): A. Aldolase B deficiency after fructose exposure — HFI (aldolase B) presents after fructose or sucrose exposure at weaning, not after lactose-containing milk in the neonate.; C. Glucose-6-phosphatase deficiency with isolated fasting symptoms — GSD I causes fasting hypoglycaemia, hepatomegaly and lactic acidosis without feed-triggered liver failure or E. coli sepsis.; D. Galactokinase deficiency causing isolated cataracts — Galactokinase deficiency causes isolated cataracts without liver failure or sepsis; the multisystem picture fits GALT deficiency.", "pearl": "", "srcAnswer": "B"}, {"num": 80, "level": "Clinical", "question": "A ventilated neonate suddenly desaturates; the breathing circuit is visibly disconnected. In DOPE, which category identifies the immediate problem?", "options": ["Pneumothorax", "Obstructed tube by mucus", "Equipment failure", "Displacement of the tube into right bronchus"], "answer": 2, "explanation": "A disconnected circuit is equipment failure; reconnect and reassess ABCs. Why not the others (added — not from source): A. Pneumothorax — Pneumothorax is possible in sudden desaturation, but a visibly disconnected circuit identifies equipment failure as the immediate cause.; B. Obstructed tube by mucus — Tube obstruction is considered when the circuit is intact; here the visible disconnection is the obvious equipment problem.; D. Displacement of the tube into right bronchus — Displacement causes unilateral breath sounds or loss of chest rise, but the immediate visible problem here is circuit disconnection (equipment).", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R3", "from": "Day 5 Q34 — DOPE equipment disconnection"}}, {"num": 81, "level": "Basic", "question": "A toddler develops vomiting, hypoglycaemia and hepatic dysfunction only after fruit juice introduction. Which defect is likely?", "options": ["ATP7B deficiency in the neonatal period", "Galactokinase deficiency", "GALT deficiency first triggered by fructose", "Aldolase B deficiency (hereditary fructose intolerance)"], "answer": 3, "explanation": "HFI is triggered by fructose, sucrose or sorbitol exposure. Why not the others (added — not from source): A. ATP7B deficiency in the neonatal period — ATP7B (Wilson disease) causes copper accumulation, rarely presenting before 3-5 years, and is not triggered by fruit juice.; B. Galactokinase deficiency — Galactokinase deficiency causes cataracts after galactose exposure, not hypoglycaemia or liver dysfunction after fruit juice.; C. GALT deficiency first triggered by fructose — GALT deficiency is triggered by galactose from milk in the neonatal period, not by fructose from fruit juice.", "pearl": "", "srcAnswer": "D"}, {"num": 82, "level": "Clinical", "question": "An infant has cholestasis and markedly elevated succinylacetone. Which diagnosis is indicated?", "options": ["Tyrosinaemia type I", "Methylmalonic acidaemia only", "Maple syrup urine disease", "Phenylketonuria"], "answer": 0, "explanation": "Succinylacetone is a key marker of fumarylacetoacetate hydrolase deficiency. Why not the others (added — not from source): B. Methylmalonic acidaemia only — Methylmalonic acidaemia presents with metabolic acidosis and hyperammonaemia; its markers are methylmalonic acid and C3, not succinylacetone.; C. Maple syrup urine disease — MSUD shows raised leucine and alloisoleucine with encephalopathy, not cholestasis with succinylacetone.; D. Phenylketonuria — PKU raises phenylalanine causing neurodevelopmental impairment; it does not cause liver disease or succinylacetone.", "pearl": "", "srcAnswer": "A"}, {"num": 83, "level": "Clinical", "question": "A neonate with liver dysfunction has very high ferritin and extrahepatic siderosis. Which condition should be considered?", "options": ["Isolated G6PD carrier status", "Classic Wilson disease in every case", "Gestational alloimmune liver disease (neonatal haemochromatosis phenotype)", "Physiological neonatal jaundice"], "answer": 2, "explanation": "GALD can present as neonatal liver failure with extrahepatic siderosis. Why not the others (added — not from source): A. Isolated G6PD carrier status — G6PD carrier status may cause haemolysis but not neonatal liver failure with extrahepatic siderosis.; B. Classic Wilson disease in every case — Wilson disease does not present in neonates, and it causes copper, not iron, accumulation.; D. Physiological neonatal jaundice — Physiological jaundice is mild unconjugated hyperbilirubinaemia without liver dysfunction, hyperferritinaemia or extrahepatic iron deposition.", "pearl": "", "srcAnswer": "C"}, {"num": 84, "level": "Clinical", "question": "An infant has hepatomegaly, hypoglycaemia and lactic acidosis after fasting. Which metabolic group merits evaluation?", "options": ["Isolated hereditary spherocytosis", "Primary isolated vitamin D deficiency", "Glycogen storage disorders", "Pure Gilbert syndrome"], "answer": 2, "explanation": "Hepatic glycogen storage disorders can cause fasting intolerance and hepatomegaly. Why not the others (added — not from source): A. Isolated hereditary spherocytosis — Hereditary spherocytosis causes haemolysis, splenomegaly and jaundice, not fasting hypoglycaemia with lactic acidosis.; B. Primary isolated vitamin D deficiency — Vitamin D deficiency causes rickets and hypocalcaemia, not fasting hypoglycaemia, lactic acidosis and hepatomegaly.; D. Pure Gilbert syndrome — Gilbert syndrome causes mild unconjugated hyperbilirubinaemia only, without hepatomegaly, hypoglycaemia or lactic acidosis.", "pearl": "", "srcAnswer": "C"}, {"num": 85, "level": "Integrated", "question": "A neonate with cholestasis and renal Fanconi syndrome has a mitochondrial depletion disorder in the differential. Which approach is appropriate?", "options": ["Delay work-up until school age", "Urgent metabolic/genetic evaluation with organ-support assessment", "Treat with phototherapy alone", "Assume all cases are obstructive biliary atresia"], "answer": 1, "explanation": "Multisystem liver–renal disease raises inherited metabolic/mitochondrial causes. Why not the others (added — not from source): A. Delay work-up until school age — Mitochondrial hepatopathies can progress rapidly to liver failure; delaying evaluation risks death and misses transplant-candidacy decisions.; C. Treat with phototherapy alone — Phototherapy treats unconjugated hyperbilirubinaemia; it does not address cholestasis, tubulopathy or the underlying metabolic disorder.; D. Assume all cases are obstructive biliary atresia — Biliary atresia does not cause renal Fanconi syndrome; multisystem liver-renal disease points to metabolic or mitochondrial causes, though BA still needs exclusion.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day35',label:'Day 35',set:'Quiz 5',href:'Day35/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day35_QuizSet5_Q69-85_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 35 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–85</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 35 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 35'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 35');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day35:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
