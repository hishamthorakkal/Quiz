<script>
const quiz=[{"num": 18, "level": "Conceptual", "question": "At a 2–4-week visit, an infant has normal-appearing skin but reported pale stools. Which AAP 2025 principle applies?", "options": ["Only total bilirubin should be ordered at 6 months", "Direct bilirubin is useful only after ascites appears", "Stool colour concern alone warrants consideration of direct bilirubin testing", "Normal skin colour excludes biliary atresia"], "answer": 2, "explanation": "AAP recommends checking jaundice, stool colour and prior direct bilirubin results, not relying on skin appearance alone. Why not the others (added — not from source): A. Only total bilirubin should be ordered at 6 months — AAP 2025 targets detection at 2-4 weeks with direct bilirubin; total bilirubin at 6 months is far too late and the wrong test.; B. Direct bilirubin is useful only after ascites appears — Ascites is a late sign of cirrhosis; direct bilirubin is meant to find biliary atresia early, well before decompensation.; D. Normal skin colour excludes biliary atresia — Jaundice can be hard to see, and normal-looking skin does not exclude biliary atresia; pale stools alone justify direct bilirubin testing.", "pearl": "", "srcAnswer": "C"}, {"num": 19, "level": "Basic", "question": "In suspected biliary atresia, which investigation most directly establishes duct patency when performed by the specialist surgical team?", "options": ["A normal serum ALT", "Intraoperative cholangiography", "Routine chest CT", "Isolated abdominal radiograph"], "answer": 1, "explanation": "Operative cholangiography defines the biliary anatomy when BA is suspected. Why not the others (added — not from source): A. A normal serum ALT — A normal ALT says nothing about biliary patency; transaminases are often only mildly raised in biliary atresia.; C. Routine chest CT — Chest CT does not show the biliary tree and has no role in confirming biliary atresia.; D. Isolated abdominal radiograph — A plain abdominal X-ray cannot show bile duct anatomy or patency.", "pearl": "", "srcAnswer": "B"}, {"num": 20, "level": "High", "question": "A 5-week-old with acholic stools has a small or absent gallbladder on fasting ultrasound. Which interpretation is correct?", "options": ["Definitively rules out biliary atresia", "Supportive of biliary atresia but not independently diagnostic", "Proves physiological jaundice", "Confirms congenital CMV infection"], "answer": 1, "explanation": "Ultrasound signs are supportive; normal imaging also does not exclude BA. Why not the others (added — not from source): A. Definitively rules out biliary atresia — A small or absent gallbladder supports biliary atresia rather than excluding it.; C. Proves physiological jaundice — An abnormal gallbladder with acholic stools is the opposite of physiological jaundice, which is unconjugated.; D. Confirms congenital CMV infection — Gallbladder findings do not confirm CMV; congenital CMV needs virological testing such as urine CMV PCR.", "pearl": "", "srcAnswer": "B"}, {"num": 21, "level": "Conceptual", "question": "A 40-day-old infant has confirmed biliary atresia. Which treatment is typically considered promptly?", "options": ["Routine phototherapy as definitive treatment", "Kasai portoenterostomy after specialist staging", "Endoscopic sphincterotomy as first-line cure", "Observation until 1 year"], "answer": 1, "explanation": "Early Kasai surgery is time-sensitive and aims to restore bile drainage. Why not the others (added — not from source): A. Routine phototherapy as definitive treatment — Phototherapy does not lower conjugated bilirubin and does not relieve biliary obstruction.; C. Endoscopic sphincterotomy as first-line cure — Biliary atresia obliterates the extrahepatic ducts, so endoscopic sphincterotomy cannot restore drainage.; D. Observation until 1 year — Waiting until 1 year allows progression to biliary cirrhosis; Kasai works best when done early.", "pearl": "", "srcAnswer": "B"}, {"num": 22, "level": "Conceptual", "question": "Why does delayed recognition of biliary atresia worsen prognosis?", "options": ["It causes an inevitable isolated unconjugated bilirubin rise", "It is usually spontaneously reversible after 3 months", "It prevents any need for transplantation", "Progressive fibro-obliteration and fibrosis reduce chances of native-liver survival"], "answer": 3, "explanation": "Longer untreated obstruction increases liver damage and worsens outcomes. Why not the others (added — not from source): A. It causes an inevitable isolated unconjugated bilirubin rise — Biliary atresia causes conjugated, not isolated unconjugated, hyperbilirubinaemia.; B. It is usually spontaneously reversible after 3 months — Biliary atresia is progressive and does not resolve on its own; untreated it leads to cirrhosis.; C. It prevents any need for transplantation — Delay increases the need for transplantation rather than preventing it.", "pearl": "", "srcAnswer": "D"}, {"num": 23, "level": "High", "question": "Which histological pattern may support extrahepatic biliary obstruction in an infant?", "options": ["Ductular proliferation with portal fibrosis and bile plugs", "Isolated macrovesicular steatosis with no portal changes", "Only granulomatous inflammation", "Pure centrilobular necrosis after shock"], "answer": 0, "explanation": "Biliary obstruction produces portal/ductular changes; biopsy is supportive, not standalone proof. Why not the others (added — not from source): B. Isolated macrovesicular steatosis with no portal changes — Isolated macrovesicular steatosis suggests metabolic or fatty liver disease, not biliary obstruction, which mainly affects the portal tracts.; C. Only granulomatous inflammation — Granulomatous inflammation suggests infection or other granulomatous disease, not extrahepatic obstruction.; D. Pure centrilobular necrosis after shock — Centrilobular necrosis after shock is ischaemic hepatitis and lacks the portal ductular reaction of obstruction.", "pearl": "", "srcAnswer": "A"}, {"num": 24, "level": "Clinical", "question": "Which threshold for persistent neonatal hypoglycaemia evaluation is emphasised by PES in at-risk infants?", "options": ["Any isolated glucose value during first hour", "Persistence beyond approximately 48 hours", "Only persistence after 6 months", "Persistence only after 14 days"], "answer": 1, "explanation": "PES recommends evaluation after transitional period around 48 h; CPS uses a different 72 h operational transition. Why not the others (added — not from source): A. Any isolated glucose value during first hour — A single low glucose in the first hour is usually part of normal transition and is not the trigger for a persistent-hypoglycaemia work-up.; C. Only persistence after 6 months — Waiting until 6 months would leave hyperinsulinism or hypopituitarism untreated and risk brain injury.; D. Persistence only after 14 days — PES advises evaluation once hypoglycaemia persists past the roughly 48-hour transition, not after 14 days.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}, {"num": 25, "level": "Conceptual", "question": "After Kasai, fever, recurrent jaundice and pale stools should prompt evaluation for:", "options": ["Intussusception as the default diagnosis", "Ascending cholangitis", "Isolated physiological jaundice", "Simple dietary lactose intolerance"], "answer": 1, "explanation": "Cholangitis is a serious post-Kasai complication needing urgent assessment. Why not the others (added — not from source): A. Intussusception as the default diagnosis — Intussusception does not usually cause recurrent jaundice and pale stools; fever with cholestasis after Kasai suggests cholangitis.; C. Isolated physiological jaundice — Recurrent jaundice with fever after Kasai is pathological and should not be called physiological.; D. Simple dietary lactose intolerance — Lactose intolerance causes loose stools and bloating, not fever with returning cholestasis.", "pearl": "", "srcAnswer": "B"}, {"num": 26, "level": "High", "question": "Which is a realistic long-term outcome after successful early Kasai surgery?", "options": ["Native-liver survival is possible, but ongoing surveillance remains essential", "No follow-up is required after the first month", "Kasai eliminates all future portal hypertension risk", "Biliary atresia never requires transplant if stools turn yellow"], "answer": 0, "explanation": "Progressive fibrosis and complications may occur despite bile drainage. Why not the others (added — not from source): B. No follow-up is required after the first month — Lifelong surveillance is needed after Kasai because cholangitis, portal hypertension and progressive fibrosis can develop.; C. Kasai eliminates all future portal hypertension risk — Portal hypertension commonly develops even after a successful Kasai because fibrosis continues.; D. Biliary atresia never requires transplant if stools turn yellow — Even with good bile drainage, many children eventually need a transplant because the liver disease progresses.", "pearl": "", "srcAnswer": "A"}, {"num": 27, "level": "High", "question": "A baby has conjugated jaundice and a normal gallbladder on ultrasound. What should the team conclude?", "options": ["Only hemolysis remains possible", "A liver biopsy is always contraindicated", "Biliary atresia is impossible", "Biliary atresia cannot be excluded by a normal ultrasound"], "answer": 3, "explanation": "Ultrasound sensitivity is imperfect; clinical urgency persists. Why not the others (added — not from source): A. Only hemolysis remains possible — Conjugated jaundice is not caused by haemolysis, and a normal ultrasound does not narrow the cause to haemolysis.; B. A liver biopsy is always contraindicated — Liver biopsy is a standard part of evaluating infant cholestasis and is not contraindicated by a normal ultrasound.; C. Biliary atresia is impossible — A normal gallbladder can be seen in biliary atresia, so ultrasound cannot exclude it.", "pearl": "", "srcAnswer": "D"}, {"num": 28, "level": "High", "question": "What is the most useful bedside screening adjunct for early BA in community care?", "options": ["Parent education and stool-colour assessment", "Routine pulse oximetry alone", "Serial head circumference only", "Screening ECG at 1 month"], "answer": 0, "explanation": "Stool-colour monitoring helps detect acholic stools early. Why not the others (added — not from source): B. Routine pulse oximetry alone — Pulse oximetry screens for critical congenital heart disease, not biliary atresia.; C. Serial head circumference only — Head circumference monitors brain growth and has no role in detecting acholic stools.; D. Screening ECG at 1 month — An ECG has no role in screening for biliary atresia.", "pearl": "", "srcAnswer": "A"}, {"num": 29, "level": "Conceptual", "question": "An infant has BA with decompensated cirrhosis despite prior Kasai. Which pathway should be considered?", "options": ["Liver-transplant evaluation", "Stop all nutritional support", "Treat solely with oral iron", "Repeat phototherapy as definitive management"], "answer": 0, "explanation": "Progressive decompensation may require transplantation. Why not the others (added — not from source): B. Stop all nutritional support — Stopping nutritional support would worsen malnutrition, which is already common in decompensated cirrhosis and affects transplant outcomes.; C. Treat solely with oral iron — Oral iron does not treat decompensated cirrhosis; at most it corrects a deficiency.; D. Repeat phototherapy as definitive management — Phototherapy does not affect conjugated hyperbilirubinaemia or the course of cirrhosis.", "pearl": "", "srcAnswer": "A"}, {"num": 30, "level": "High", "question": "Which statement about the timing of BA screening is best aligned with AAP 2025?", "options": ["Screen only infants with high unconjugated bilirubin", "Evaluate suspicious features at the 2–4-week visit rather than waiting for 2 months", "Screen only infants with failure to thrive", "Routine evaluation should first occur after 6 months"], "answer": 1, "explanation": "The 2025 AAP approach targets recognition at 2–4 weeks. Why not the others (added — not from source): A. Screen only infants with high unconjugated bilirubin — Biliary atresia causes conjugated, not unconjugated, hyperbilirubinaemia; screening by unconjugated levels would miss it entirely.; C. Screen only infants with failure to thrive — Infants with biliary atresia often thrive initially; restricting evaluation to failure to thrive delays diagnosis past the window for a timely Kasai.; D. Routine evaluation should first occur after 6 months — Waiting until 6 months is far too late; Kasai outcomes fall sharply after about 60 days, which is why AAP 2025 targets 2–4 weeks.", "pearl": "", "srcAnswer": "B"}, {"num": 31, "level": "Clinical", "question": "A child has acute hepatitis, INR 2.3 after vitamin K and no encephalopathy. Which classification is most appropriate?", "options": ["Does not meet PALF criteria without encephalopathy", "Has isolated compensated chronic liver disease", "Has only vitamin K deficiency by definition", "Meets a paediatric acute liver failure coagulopathy criterion"], "answer": 3, "explanation": "PALF can be defined by uncorrectable INR around/above 2 without encephalopathy. Why not the others (added — not from source): A. Does not meet PALF criteria without encephalopathy — Encephalopathy is not mandatory: PALF accepts a vitamin-K-unresponsive INR of about ≥2.0 without encephalopathy, and 2.3 meets this.; B. Has isolated compensated chronic liver disease — The stem describes acute hepatitis, not established chronic disease; a vitamin-K-refractory INR of 2.3 indicates acute synthetic failure, not compensated disease.; C. Has only vitamin K deficiency by definition — Vitamin K deficiency would correct after vitamin K; persistence of INR 2.3 after vitamin K points to hepatic synthetic failure.", "pearl": "", "srcAnswer": "D"}, {"num": 32, "level": "Clinical", "question": "A neonate has hyperammonaemia, low citrulline and high urinary orotic acid. Which urea-cycle defect is suggested?", "options": ["Ornithine transcarbamylase deficiency", "CPS1 deficiency", "NAGS deficiency", "Arginase deficiency"], "answer": 0, "explanation": "OTC deficiency diverts excess carbamoyl phosphate to pyrimidine/orotic acid. Why not the others (added — not from source): B. CPS1 deficiency — CPS1 deficiency also gives low citrulline, but orotic acid is low/normal because carbamoyl phosphate is not formed to spill into pyrimidine synthesis.; C. NAGS deficiency — NAGS deficiency mimics CPS1 deficiency (no carbamoyl phosphate formed), so urinary orotic acid is not raised.; D. Arginase deficiency — Arginase deficiency usually presents later with progressive spastic diplegia, high plasma arginine and only mild hyperammonaemia, not a neonatal crisis with low citrulline.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R3", "from": "Day 10 Q65 — OTC versus CPS1/NAGS — urinary orotic acid"}}, {"num": 33, "level": "High", "question": "A child with acute liver injury has INR 1.7 despite vitamin K and definite hepatic encephalopathy. Which statement is best?", "options": ["The presence of encephalopathy excludes liver failure", "The coagulopathy plus encephalopathy meets a PALF threshold", "INR must exceed 3 in all children", "Only serum bilirubin determines PALF"], "answer": 1, "explanation": "PALF criteria allow INR ≥1.5 with encephalopathy after vitamin K correction fails. Why not the others (added — not from source): A. The presence of encephalopathy excludes liver failure — Hepatic encephalopathy is a defining feature of liver failure, not an exclusion; with a vitamin-K-unresponsive INR ≥1.5 it fulfils PALF criteria.; C. INR must exceed 3 in all children — No PALF criterion requires INR >3; the thresholds are ≥1.5 with encephalopathy and about ≥2.0 without.; D. Only serum bilirubin determines PALF — PALF is defined by vitamin-K-unresponsive coagulopathy with or without encephalopathy; bilirubin is not part of the definition.", "pearl": "", "srcAnswer": "B"}, {"num": 34, "level": "Basic", "question": "Which laboratory test best reflects hepatic synthetic dysfunction in acute liver failure?", "options": ["Isolated alkaline phosphatase", "Prothrombin time/INR", "Isolated ALT magnitude", "Urine bilirubin alone"], "answer": 1, "explanation": "INR assesses clotting factor synthesis and is central to PALF severity; ALT alone is not synthetic function. Why not the others (added — not from source): A. Isolated alkaline phosphatase — Alkaline phosphatase reflects cholestasis and bone turnover (high in growing children), not hepatic synthetic capacity.; C. Isolated ALT magnitude — ALT reflects hepatocyte injury, not synthesis; it can fall as viable liver mass is lost, so magnitude alone misleads.; D. Urine bilirubin alone — Urine bilirubin indicates conjugated hyperbilirubinaemia only and gives no measure of clotting-factor synthesis.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day35',label:'Day 35',set:'Quiz 2',href:'Day35/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day35_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 35 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 35 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 35'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 35');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day35:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=84eb225a"></script></body></html>
