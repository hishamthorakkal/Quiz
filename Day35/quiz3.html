<script>
const quiz=[{"num": 35, "level": "Integrated", "question": "A child with severe acute hepatitis becomes drowsy and hypoglycaemic. Which response is safest?", "options": ["Urgent intensive monitoring, glucose correction and transplant-centre discussion", "Delay assessment until ALT normalises", "Prescribe sedatives to facilitate examination", "Use oral iron as the only intervention"], "answer": 0, "explanation": "Encephalopathy and hypoglycaemia signal potentially rapidly progressive PALF. Why not the others (added — not from source): B. Delay assessment until ALT normalises — ALT does not track severity; drowsiness and hypoglycaemia signal evolving PALF needing immediate care, not waiting.; C. Prescribe sedatives to facilitate examination — Sedatives mask and worsen hepatic encephalopathy, impair neurological assessment and may be poorly metabolised by the failing liver.; D. Use oral iron as the only intervention — Oral iron has no role here; hypoglycaemia and encephalopathy require urgent glucose correction, monitoring and transplant-centre referral.", "pearl": "", "srcAnswer": "A"}, {"num": 36, "level": "Conceptual", "question": "A child with paracetamol overdose presents early with suspected hepatotoxicity. Which antidote is indicated?", "options": ["D-penicillamine as the antidote", "N-acetylcysteine using a verified local protocol", "Ursodeoxycholic acid as the antidote", "Lactulose as the sole antidote"], "answer": 1, "explanation": "N-acetylcysteine replenishes glutathione and is indicated for acetaminophen toxicity; dose/route must follow poison-centre protocol. Why not the others (added — not from source): A. D-penicillamine as the antidote — D-penicillamine is a copper chelator for Wilson disease; it does not replenish glutathione or treat paracetamol toxicity.; C. Ursodeoxycholic acid as the antidote — Ursodeoxycholic acid is used for cholestasis; it is not an antidote and does not neutralise NAPQI.; D. Lactulose as the sole antidote — Lactulose lowers ammonia in hepatic encephalopathy but does not prevent paracetamol hepatotoxicity; NAC is the antidote.", "pearl": "", "srcAnswer": "B"}, {"num": 37, "level": "Clinical", "question": "In PALF, an extremely high ALT with an improving INR versus a falling ALT with worsening INR illustrates what principle?", "options": ["Bilirubin fraction alone predicts transplant need", "Falling ALT always proves hepatic recovery", "INR and clinical trajectory matter more than transaminase height alone", "ALT determines encephalopathy grade"], "answer": 2, "explanation": "Enzyme decline can reflect loss of viable hepatocytes; follow synthetic function and status. Why not the others (added — not from source): A. Bilirubin fraction alone predicts transplant need — The scenario contrasts ALT with INR; bilirubin fraction alone is not a validated sole predictor of transplant need.; B. Falling ALT always proves hepatic recovery — A falling ALT with worsening INR can reflect massive hepatocyte loss, an ominous sign rather than recovery.; D. ALT determines encephalopathy grade — Encephalopathy grade is a clinical assessment; ALT level does not determine it.", "pearl": "", "srcAnswer": "C"}, {"num": 38, "level": "Conceptual", "question": "A child with acute liver injury has INR 2.5 that corrects promptly after parenteral vitamin K. Which inference is most appropriate?", "options": ["The INR should not be rechecked", "Irreversible PALF is established solely by initial INR", "A corrected INR excludes all hepatobiliary disease", "Vitamin K deficiency may contribute; reassess for persistent synthetic failure"], "answer": 3, "explanation": "PALF definition specifies coagulopathy not corrected by vitamin K. Why not the others (added — not from source): A. The INR should not be rechecked — The INR must be rechecked serially, since synthetic failure can evolve even after initial vitamin K correction.; B. Irreversible PALF is established solely by initial INR — PALF requires coagulopathy not corrected by vitamin K; an INR that corrects cannot establish PALF from the initial value.; C. A corrected INR excludes all hepatobiliary disease — Correction only shows the coagulopathy was vitamin-K-responsive; cholestatic malabsorption or other hepatobiliary disease may still be present.", "pearl": "", "srcAnswer": "D"}, {"num": 39, "level": "High", "question": "Which neurological complication must be anticipated in advanced paediatric acute liver failure?", "options": ["Cerebral oedema and intracranial hypertension", "Isolated peripheral neuropathy only", "Benign positional vertigo as the primary danger", "Routine febrile seizure only"], "answer": 0, "explanation": "Severe encephalopathy can progress to cerebral oedema; early specialist critical care is essential. Why not the others (added — not from source): B. Isolated peripheral neuropathy only — Peripheral neuropathy is not the characteristic threat; cerebral oedema with raised ICP is the leading neurological cause of death in ALF.; C. Benign positional vertigo as the primary danger — Positional vertigo is irrelevant; the life-threatening concern is cerebral oedema and herniation.; D. Routine febrile seizure only — Seizures in ALF are not simple febrile seizures; they may signal cerebral oedema or metabolic derangement needing urgent evaluation.", "pearl": "", "srcAnswer": "A"}, {"num": 40, "level": "Clinical", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. How is it classified for ETROP management?", "options": ["Type 1 ROP needing prompt treatment assessment", "Always stage 4A detachment", "No ROP because stage 3 is absent", "Type 2 ROP requiring only delayed follow-up"], "answer": 0, "explanation": "Zone II stage 2 with plus meets Type 1 treatment criteria. Why not the others (added — not from source): B. Always stage 4A detachment — Stage 4A is partial extrafoveal retinal detachment; the stem describes stage 2, so detachment is not implied.; C. No ROP because stage 3 is absent — ROP is present at stage 2; stage 3 is not required, and ETROP Type 1 includes zone II stage 2 with plus disease.; D. Type 2 ROP requiring only delayed follow-up — Type 2 ROP lacks plus disease (zone I stage 1–2 or zone II stage 3 without plus); definite plus makes this Type 1.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R3", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 41, "level": "Conceptual", "question": "A child with acute liver failure has a new seizure and sodium disturbance. Which initial priority is most appropriate?", "options": ["Assume the event is benign breath-holding", "Wait for routine outpatient EEG", "Administer unmonitored hypotonic fluids", "Stabilise airway, breathing and circulation while urgently evaluating metabolic triggers"], "answer": 3, "explanation": "PALF neurodeterioration is an emergency requiring critical-care assessment. Why not the others (added — not from source): A. Assume the event is benign breath-holding — Breath-holding spells occur in toddlers with a provoking trigger; a new seizure in ALF suggests cerebral oedema or metabolic derangement.; B. Wait for routine outpatient EEG — Waiting for an outpatient EEG delays care; neurological deterioration in ALF is an emergency needing immediate ABC stabilisation.; C. Administer unmonitored hypotonic fluids — Hypotonic fluids worsen hyponatraemia and cerebral oedema; fluids and sodium must be closely monitored in ALF.", "pearl": "", "srcAnswer": "D"}, {"num": 42, "level": "High", "question": "Which infectious cause is especially important in an Indian child with acute hepatitis and potential ALF?", "options": ["Only asymptomatic CMV shedding", "Only chronic hepatitis C", "Hepatitis A or E, interpreted with local epidemiology", "Only latent EBV seropositivity"], "answer": 2, "explanation": "IAP consensus identifies viral hepatitis A/E as major Indian ALF considerations. Why not the others (added — not from source): A. Only asymptomatic CMV shedding — Asymptomatic CMV shedding is common and not a usual cause of ALF in an immunocompetent child.; B. Only chronic hepatitis C — Hepatitis C causes chronic, not acute fulminant, hepatitis in children and is not a major Indian ALF cause.; D. Only latent EBV seropositivity — Latent EBV seropositivity indicates past infection and cannot explain acute hepatitis; hepatitis A/E dominate in India.", "pearl": "", "srcAnswer": "C"}, {"num": 43, "level": "Clinical", "question": "A 3-month-old with PALF has hypoglycaemia and lactic acidosis. Which approach is best?", "options": ["Wait for neurologic signs before metabolic testing", "Exclude inherited disease because of young age", "Assume every infant has hepatitis E", "Investigate metabolic/mitochondrial disorders alongside infection and other causes"], "answer": 3, "explanation": "Metabolic causes are particularly important in infantile PALF. Why not the others (added — not from source): A. Wait for neurologic signs before metabolic testing — Metabolic testing must be done early, ideally on a critical sample; waiting for neurological signs loses diagnostic and therapeutic time.; B. Exclude inherited disease because of young age — Young age makes inherited metabolic and mitochondrial disease more, not less, likely as a cause of PALF.; C. Assume every infant has hepatitis E — Hepatitis E is not a typical cause in a 3-month-old; hypoglycaemia with lactic acidosis points to metabolic/mitochondrial disease.", "pearl": "", "srcAnswer": "D"}, {"num": 44, "level": "High", "question": "A child with acute liver failure develops renal dysfunction. Which statement is safest?", "options": ["All children should receive unrestricted fluid boluses", "Renal impairment excludes hepatic encephalopathy", "Renal injury can complicate PALF and requires close fluid/electrolyte monitoring", "Creatinine is irrelevant to ALF severity"], "answer": 2, "explanation": "PALF can involve multi-organ failure; management must be individualised. Why not the others (added — not from source): A. All children should receive unrestricted fluid boluses — Unrestricted boluses risk fluid overload and worsened cerebral oedema; fluids must be individualised and monitored.; B. Renal impairment excludes hepatic encephalopathy — Renal impairment and encephalopathy commonly coexist as multi-organ failure; one does not exclude the other.; D. Creatinine is irrelevant to ALF severity — Renal dysfunction is a marker of severity and poorer prognosis in ALF; creatinine is clinically important.", "pearl": "", "srcAnswer": "C"}, {"num": 45, "level": "Integrated", "question": "What is the best interpretation of isolated high serum ammonia in a child with encephalopathy?", "options": ["Proof of bacterial meningitis", "A clue requiring urgent evaluation of liver failure and metabolic causes", "Evidence that INR is normal", "A definitive diagnosis of Wilson disease"], "answer": 1, "explanation": "Hyperammonaemia is clinically urgent but is not specific for a single aetiology. Why not the others (added — not from source): A. Proof of bacterial meningitis — Ammonia is not a marker of bacterial meningitis; it points to liver failure or urea-cycle/metabolic disease.; C. Evidence that INR is normal — Ammonia says nothing about INR; coagulation must be measured separately.; D. A definitive diagnosis of Wilson disease — Hyperammonaemia is nonspecific; Wilson disease is one possible cause but needs specific tests (ceruloplasmin, urine copper, ATP7B).", "pearl": "", "srcAnswer": "B"}, {"num": 46, "level": "High", "question": "Which statement about routine prophylactic plasma transfusion in PALF is most appropriate?", "options": ["INR has no monitoring value after plasma", "Avoid reflexive correction of INR without a clinical indication, because it can obscure trends", "Give plasma to every child solely to normalise the laboratory INR", "Plasma always prevents cerebral oedema"], "answer": 1, "explanation": "Transfusion decisions require bleeding/procedural context and specialist input; unnecessary correction masks prognostic INR. Why not the others (added — not from source): A. INR has no monitoring value after plasma — INR remains a key prognostic marker; it should still be monitored, but plasma temporarily distorts its interpretation.; C. Give plasma to every child solely to normalise the laboratory INR — Correcting INR purely for the number is unnecessary without bleeding or a procedure and obscures the prognostic trend.; D. Plasma always prevents cerebral oedema — Plasma has no proven effect on cerebral oedema and the added volume may worsen it.", "pearl": "", "srcAnswer": "B"}, {"num": 47, "level": "High", "question": "An adolescent with ALF has Coombs-negative haemolysis and disproportionate bilirubin elevation. Which inherited disorder is important?", "options": ["Classic isolated Gilbert syndrome", "Lactase deficiency", "Wilson disease", "G6PD trait as the sole cause without evaluation"], "answer": 2, "explanation": "Fulminant Wilson disease may present with Coombs-negative haemolysis. Why not the others (added — not from source): A. Classic isolated Gilbert syndrome — Gilbert syndrome causes mild unconjugated hyperbilirubinaemia without liver failure or haemolysis.; B. Lactase deficiency — Lactase deficiency is an intestinal disaccharidase disorder with no hepatic or haemolytic features.; D. G6PD trait as the sole cause without evaluation — G6PD haemolysis does not cause acute liver failure; ALF with Coombs-negative haemolysis demands evaluation for fulminant Wilson disease.", "pearl": "", "srcAnswer": "C"}, {"num": 48, "level": "Clinical", "question": "A post-Fontan child has oedema, hypoalbuminaemia and raised stool alpha-1 antitrypsin clearance. Which complication is most likely?", "options": ["Chylothorax without pleural effusion", "Isolated neoaortic regurgitation", "Plastic bronchitis without casts", "Protein-losing enteropathy"], "answer": 3, "explanation": "Stool protein loss distinguishes PLE from pleural chyle and airway casts. Why not the others (added — not from source): A. Chylothorax without pleural effusion — Chylothorax is defined by chylous pleural effusion and would not raise stool alpha-1 antitrypsin clearance.; B. Isolated neoaortic regurgitation — Neoaortic regurgitation causes volume load and a murmur, not protein loss with raised stool alpha-1 antitrypsin.; C. Plastic bronchitis without casts — Plastic bronchitis presents with expectorated airway casts and respiratory distress, not enteric protein loss.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 19 Q35 — Single ventricle — Fontan protein-losing enteropathy"}}, {"num": 49, "level": "Integrated", "question": "A child with suspected PALF is being managed in a district hospital. Which referral principle is safest?", "options": ["Refer only after ascites becomes refractory", "Refer only after prolonged coma develops", "Refer only when bilirubin exceeds 30 mg/dL", "Early discussion with paediatric liver-transplant-capable centre"], "answer": 3, "explanation": "Early referral allows evaluation before irreversible multi-organ complications. Why not the others (added — not from source): A. Refer only after ascites becomes refractory — Waiting for refractory ascites delays referral until complications are established; transplant evaluation should start early.; B. Refer only after prolonged coma develops — Prolonged coma signals advanced disease with risk of irreversible cerebral injury that may preclude transplant; referral must precede this.; C. Refer only when bilirubin exceeds 30 mg/dL — There is no bilirubin cut-off for referral; INR, encephalopathy and trajectory drive early discussion.", "pearl": "", "srcAnswer": "D"}, {"num": 50, "level": "Clinical", "question": "Which measure is most important when interpreting an INR after vitamin K in suspected PALF?", "options": ["Use a single INR without clinical context", "Ignore vitamin K administration completely", "Document timing, route and response before applying coagulopathy thresholds", "Classify ALF using serum albumin alone"], "answer": 2, "explanation": "The definition requires vitamin-K-unresponsive coagulopathy; timing matters. Why not the others (added — not from source): A. Use a single INR without clinical context — A single INR without context cannot distinguish vitamin K deficiency from synthetic failure or show the trajectory.; B. Ignore vitamin K administration completely — The PALF definition depends on failure to correct after vitamin K, so its administration must be documented, not ignored.; D. Classify ALF using serum albumin alone — Albumin has a long half-life and does not define ALF; vitamin-K-unresponsive INR is the criterion.", "pearl": "", "srcAnswer": "C"}, {"num": 51, "level": "Conceptual", "question": "A child with chronic liver disease develops ascites, splenomegaly and thrombocytopenia. Which process links the latter two?", "options": ["Portal hypertension with hypersplenism", "Isolated vitamin B12 deficiency", "Acute isolated haemolysis", "Primary renal sodium wasting"], "answer": 0, "explanation": "Portal hypertension can cause splenic sequestration and cytopenias. Why not the others (added — not from source): B. Isolated vitamin B12 deficiency — B12 deficiency causes megaloblastic cytopenias but not splenomegaly with ascites in chronic liver disease.; C. Acute isolated haemolysis — Acute haemolysis causes anaemia and jaundice, not thrombocytopenia with ascites; it does not explain the portal hypertensive picture.; D. Primary renal sodium wasting — Renal sodium wasting causes hyponatraemia and volume depletion, not splenomegaly or thrombocytopenia.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day35',label:'Day 35',set:'Quiz 3',href:'Day35/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day35_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 35 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 35 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 35'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 35');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day35:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=84eb225a"></script></body></html>
