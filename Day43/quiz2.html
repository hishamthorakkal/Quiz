@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 16, "level": "Conceptual", "question": "Which screening approach is preferred when Cushing syndrome is suspected?", "options": ["Serum sodium alone", "Random single daytime cortisol alone", "Validated cortisol screening tests with specialist interpretation", "Single ACTH measurement alone"], "answer": 2, "explanation": "Diurnal cortisol abnormalities or dexamethasone suppression tests require context-specific interpretation. Why not the others (added — not from source): A. Serum sodium alone — Sodium is neither sensitive nor specific for hypercortisolism and cannot screen for Cushing syndrome.; B. Random single daytime cortisol alone — A random daytime cortisol is unreliable because of diurnal variation and stress; screening uses late-night salivary cortisol, urinary free cortisol or dexamethasone suppression.; D. Single ACTH measurement alone — ACTH is used after hypercortisolism is confirmed to distinguish ACTH-dependent from independent causes, not as a screening test.", "pearl": "", "srcAnswer": "C"}, {"num": 17, "level": "Conceptual", "question": "Growth deceleration with weight gain in a child is especially suggestive of", "options": ["Uncomplicated obesity alone", "Familial short stature", "Hypercortisolism", "Constitutional tall stature"], "answer": 2, "explanation": "Cushing syndrome commonly impairs linear growth while weight increases. Why not the others (added — not from source): A. Uncomplicated obesity alone — Exogenous obesity usually accompanies normal or increased height velocity and often advanced bone age; deceleration with weight gain points to cortisol excess.; B. Familial short stature — Familial short stature shows short but normal-velocity growth parallel to centiles, without disproportionate weight gain.; D. Constitutional tall stature — Constitutional tall stature involves normal or high height velocity, not growth deceleration.", "pearl": "", "srcAnswer": "B"}, {"num": 18, "level": "Conceptual", "question": "A child with exogenous steroid-related Cushingoid appearance may have", "options": ["Markedly elevated ACTH", "Primary aldosterone excess", "High endogenous cortisol in all cases", "Suppressed endogenous ACTH"], "answer": 3, "explanation": "External glucocorticoid exposure suppresses the HPA axis. Why not the others (added — not from source): A. Markedly elevated ACTH — Exogenous glucocorticoids feed back to suppress ACTH; markedly elevated ACTH suggests ACTH-dependent Cushing disease or ectopic ACTH.; B. Primary aldosterone excess — Primary aldosterone excess is a separate mineralocorticoid disorder and is not caused by exogenous glucocorticoids.; C. High endogenous cortisol in all cases — Endogenous cortisol is usually suppressed in iatrogenic Cushing syndrome, because the HPA axis is inhibited.", "pearl": "", "srcAnswer": "A"}, {"num": 19, "level": "Conceptual", "question": "What is the main chronic glucocorticoid replacement for classic CAH in growing children?", "options": ["No glucocorticoid", "Hydrocortisone", "Dexamethasone as universal first-line", "Prednisone as universal first-line"], "answer": 1, "explanation": "Shorter-acting hydrocortisone is generally preferred to minimise growth effects. Why not the others: A. No glucocorticoid — Omitting replacement risks crisis and chronic androgen excess.; C. Dexamethasone as universal first-line — Dexamethasone is generally unsuitable for routine growing-child maintenance due to growth suppression and potency.; D. Prednisone as universal first-line — Prednisone is not the preferred first-line pediatric maintenance agent.", "pearl": "", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "Which medicine replaces mineralocorticoid in salt-wasting CAH?", "options": ["Somatropin", "Desmopressin", "Levothyroxine", "Fludrocortisone"], "answer": 3, "explanation": "Fludrocortisone supplies mineralocorticoid action. Why not the others (added — not from source): A. Somatropin — Somatropin is recombinant growth hormone and has no role in mineralocorticoid replacement.; B. Desmopressin — Desmopressin is a vasopressin analogue for central diabetes insipidus; it does not promote renal sodium retention or potassium excretion.; C. Levothyroxine — Levothyroxine treats hypothyroidism and has no mineralocorticoid activity.", "pearl": "", "srcAnswer": "C"}, {"num": 21, "level": "Clinical", "question": "A salt-wasting CAH infant may additionally require", "options": ["Sodium supplementation under specialist guidance", "Routine potassium supplementation", "Routine potassium-sparing diuretic", "No electrolyte monitoring"], "answer": 0, "explanation": "Sodium replacement may be needed early in life, guided by electrolytes and renin. Why not the others (added — not from source): B. Routine potassium supplementation — Salt-wasting CAH tends to cause hyperkalaemia, so routine potassium supplementation is inappropriate.; C. Routine potassium-sparing diuretic — Potassium-sparing diuretics worsen sodium loss and hyperkalaemia, the very problem in aldosterone deficiency.; D. No electrolyte monitoring — Electrolytes, with renin, are needed to titrate fludrocortisone and salt supplements; omitting monitoring is unsafe.", "pearl": "", "srcAnswer": "B"}, {"num": 22, "level": "Clinical", "question": "Which measurement helps monitor mineralocorticoid replacement in CAH?", "options": ["Blood pressure, electrolytes and renin", "HbA1c alone", "IGF-1 alone", "Serum TSH alone"], "answer": 0, "explanation": "Mineralocorticoid titration considers renin, BP, sodium and potassium. Why not the others (added — not from source): B. HbA1c alone — HbA1c reflects glycaemic control and does not gauge mineralocorticoid adequacy.; C. IGF-1 alone — IGF-1 reflects growth hormone status, not mineralocorticoid replacement.; D. Serum TSH alone — TSH assesses thyroid function and is unrelated to fludrocortisone dosing.", "pearl": "", "srcAnswer": "A"}, {"num": 23, "level": "Clinical", "question": "Which complication can result from excessive glucocorticoid replacement in CAH?", "options": ["Permanent cure of CAH", "Accelerated height velocity indefinitely", "High ACTH without exception", "Poor linear growth"], "answer": 3, "explanation": "Over-replacement may cause iatrogenic Cushing features and growth suppression. Why not the others (added — not from source): A. Permanent cure of CAH — CAH is a lifelong genetic enzyme defect; no glucocorticoid dose cures it, and excess only adds iatrogenic harm.; B. Accelerated height velocity indefinitely — Glucocorticoid excess suppresses growth; accelerated height velocity suggests under-treatment with androgen excess.; C. High ACTH without exception — Excess glucocorticoid suppresses ACTH; high ACTH indicates under-replacement.", "pearl": "", "srcAnswer": "D"}, {"num": 24, "level": "Clinical", "question": "Which finding suggests under-treatment of adrenal androgen excess in CAH?", "options": ["Low blood pressure only", "Accelerated bone age and growth velocity", "Reduced ACTH with Cushingoid features", "Persistent hypoglycaemia only"], "answer": 1, "explanation": "Excess adrenal androgens advance skeletal maturation. Why not the others (added — not from source): A. Low blood pressure only — Low blood pressure points to mineralocorticoid or salt deficiency, not to inadequate suppression of adrenal androgens.; C. Reduced ACTH with Cushingoid features — Suppressed ACTH with Cushingoid features indicates glucocorticoid over-treatment, the opposite of under-treatment.; D. Persistent hypoglycaemia only — Hypoglycaemia reflects cortisol deficiency or intercurrent stress and is not a marker of androgen excess.", "pearl": "", "srcAnswer": "C"}, {"num": 25, "level": "Clinical", "question": "In classic 21-hydroxylase deficiency, virilisation reflects excess", "options": ["Adrenal androgens", "Pituitary prolactin", "Ovarian oestrogen alone", "Thyroid hormone"], "answer": 0, "explanation": "Steroid precursors are shunted toward androgen synthesis. Why not the others (added — not from source): B. Pituitary prolactin — Prolactin excess causes galactorrhoea and hypogonadism, not virilisation; it plays no role in the steroidogenic block of 21-hydroxylase deficiency.; C. Ovarian oestrogen alone — Ovarian oestrogen feminises rather than virilises, and the androgen excess in 21-hydroxylase deficiency arises in the adrenal cortex, present even in 46,XY infants.; D. Thyroid hormone — Thyroid hormone is not part of adrenal steroidogenesis and its excess causes thyrotoxicosis, not genital virilisation.", "pearl": "", "srcAnswer": "B"}, {"num": 26, "level": "Clinical", "question": "An infant with atypical genitalia should first undergo", "options": ["Immediate irreversible surgery", "Assignment solely by external appearance", "Urgent multidisciplinary assessment including electrolytes and glucose", "Discharge without evaluation"], "answer": 2, "explanation": "Potential salt-wasting crisis and complex diagnosis require prompt sensitive evaluation. Why not the others: A. Immediate irreversible surgery — Irreversible surgery is not an initial diagnostic response.; B. Assignment solely by external appearance — External appearance alone cannot establish etiology or a family-centred decision.; D. Discharge without evaluation — Untreated salt-wasting CAH may be life-threatening.", "pearl": "", "srcAnswer": "A"}, {"num": 27, "level": "Clinical", "question": "In a 46,XY infant, Sertoli-cell AMH normally causes", "options": ["Ovarian follicle development", "Wolffian duct regression", "Adrenal cortex regression", "Müllerian duct regression"], "answer": 3, "explanation": "AMH suppresses development of uterus and fallopian tubes. Why not the others (added — not from source): A. Ovarian follicle development — AMH is a testicular product in 46,XY development and causes Müllerian regression; it does not drive ovarian follicle development.; B. Wolffian duct regression — Wolffian ducts are maintained by testosterone in 46,XY fetuses; they regress in the absence of testosterone, not because of AMH.; C. Adrenal cortex regression — AMH has no role in adrenal cortex development; the fetal adrenal zone involutes postnatally independent of AMH.", "pearl": "", "srcAnswer": "D"}, {"num": 28, "level": "Clinical", "question": "In a 46,XY fetus, testosterone supports development of", "options": ["Müllerian duct derivatives", "Ovarian follicles", "Adrenal medulla", "Wolffian duct derivatives"], "answer": 3, "explanation": "Testosterone maintains internal male duct structures. Why not the others (added — not from source): A. Müllerian duct derivatives — Müllerian derivatives (uterus, tubes, upper vagina) regress under Sertoli-cell AMH; testosterone does not support them.; B. Ovarian follicles — A 46,XY fetus with testes has no ovarian follicles; follicle development is unrelated to fetal testosterone.; C. Adrenal medulla — The adrenal medulla derives from neural crest and develops independently of fetal testosterone.", "pearl": "", "srcAnswer": "C"}, {"num": 29, "level": "Clinical", "question": "Dihydrotestosterone is particularly important for", "options": ["Thyroid development", "Müllerian duct regression", "External genital virilisation", "Adrenal aldosterone synthesis"], "answer": 2, "explanation": "5-alpha-reductase converts testosterone to DHT in target tissues. Why not the others (added — not from source): A. Thyroid development — Thyroid development depends on transcription factors such as PAX8, NKX2-1 and FOXE1, not on dihydrotestosterone.; B. Müllerian duct regression — Müllerian duct regression is mediated by AMH from Sertoli cells, not by DHT.; D. Adrenal aldosterone synthesis — Aldosterone synthesis is regulated by the renin-angiotensin system and potassium via aldosterone synthase (CYP11B2), not by DHT.", "pearl": "", "srcAnswer": "B"}, {"num": 30, "level": "Clinical", "question": "A 46,XY adolescent with undervirilisation at birth and virilisation at puberty may have", "options": ["Classic 21-hydroxylase CAH in 46,XX", "Turner syndrome", "5-alpha-reductase type 2 deficiency", "Complete androgen insensitivity"], "answer": 2, "explanation": "Pubertal testosterone rise can produce virilisation despite low DHT synthesis. Why not the others (added — not from source): A. Classic 21-hydroxylase CAH in 46,XX — Classic 21-hydroxylase CAH in 46,XX causes virilisation of a 46,XX infant at birth; the stem describes a 46,XY individual undervirilised at birth.; B. Turner syndrome — Turner syndrome is 45,X (or variants) with female phenotype and gonadal failure, so neither 46,XY karyotype nor pubertal virilisation fits.; D. Complete androgen insensitivity — Complete androgen insensitivity causes a female phenotype at birth and breast development, not virilisation, at puberty because androgen receptors are non-functional.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day43',label:'Day 43',set:'Quiz 2',href:'Day43/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day43_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 43 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 43 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 43'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 43');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day43:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
