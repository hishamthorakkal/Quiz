<script>
const quiz=[{"num": 46, "level": "Clinical", "question": "The standard medical approach to progressive central precocious puberty when indicated is", "options": ["Androgen replacement", "Levothyroxine", "GnRH agonist therapy", "Daily fludrocortisone"], "answer": 2, "explanation": "Continuous GnRH agonist exposure suppresses pituitary gonadotropin release. Why not the others (added — not from source): A. Androgen replacement — Androgen replacement is used to induce puberty in hypogonadal boys and would worsen, not treat, precocious puberty.; B. Levothyroxine — Levothyroxine treats hypothyroidism; it does not suppress gonadotropin-driven central puberty.; D. Daily fludrocortisone — Fludrocortisone is a mineralocorticoid for salt-wasting adrenal insufficiency and does not suppress the hypothalamic-pituitary-gonadal axis.", "pearl": "", "srcAnswer": "A"}, {"num": 47, "level": "Clinical", "question": "A girl with ovarian cyst-related oestrogen excess and suppressed gonadotropins has", "options": ["Primary ovarian insufficiency", "Peripheral precocious puberty", "Constitutional delay", "Central precocious puberty"], "answer": 1, "explanation": "Autonomous sex steroid production bypasses hypothalamic-pituitary activation. Why not the others (added — not from source): A. Primary ovarian insufficiency — Primary ovarian insufficiency causes low oestrogen with elevated gonadotropins, the reverse of this picture.; C. Constitutional delay — Constitutional delay causes late, not early, puberty and does not involve oestrogen excess.; D. Central precocious puberty — Central precocious puberty is gonadotropin-dependent with pubertal LH levels; suppressed gonadotropins indicate a peripheral source.", "pearl": "", "srcAnswer": "D"}, {"num": 48, "level": "High", "question": "McCune-Albright syndrome can cause", "options": ["Always hypogonadotropic delayed puberty", "Complete androgen insensitivity", "Gonadotropin-independent precocious puberty", "Salt-wasting CAH"], "answer": 2, "explanation": "Autonomous ovarian steroid production may cause episodic bleeding and breast development. Why not the others (added — not from source): A. Always hypogonadotropic delayed puberty — McCune-Albright syndrome typically causes early, gonadotropin-independent puberty, not hypogonadotropic delayed puberty.; B. Complete androgen insensitivity — Complete androgen insensitivity results from androgen-receptor mutations, whereas McCune-Albright is due to activating GNAS mosaic mutations.; D. Salt-wasting CAH — Salt-wasting CAH is caused by 21-hydroxylase deficiency (CYP21A2), not by GNAS mutations; McCune-Albright may cause Cushing syndrome but not salt-wasting.", "pearl": "", "srcAnswer": "C"}, {"num": 49, "level": "High", "question": "Which triad is classically associated with McCune-Albright syndrome?", "options": ["Hypoglycaemia, hyperkalaemia, acholic stools", "Aniridia, nephroblastoma, hemihypertrophy", "Short stature, webbed neck, coarctation", "Café-au-lait macules, fibrous dysplasia, endocrine hyperfunction"], "answer": 3, "explanation": "Somatic activating GNAS variants produce mosaic findings. Why not the others (added — not from source): A. Hypoglycaemia, hyperkalaemia, acholic stools — Hypoglycaemia, hyperkalaemia and acholic stools are not a recognised triad; hyperkalaemia points to adrenal/mineralocorticoid failure and acholic stools to cholestasis, neither a feature of McCune-Albright syndrome.; B. Aniridia, nephroblastoma, hemihypertrophy — Aniridia with Wilms tumour (nephroblastoma) belongs to WAGR (11p13 deletion), and hemihypertrophy to Beckwith-Wiedemann; these are tumour-predisposition syndromes, not GNAS mosaicism.; C. Short stature, webbed neck, coarctation — Short stature, webbed neck and coarctation of the aorta describe Turner syndrome (or Noonan), which causes gonadal failure rather than autonomous endocrine hyperfunction.", "pearl": "", "srcAnswer": "B"}, {"num": 50, "level": "High", "question": "A 13-year-old girl has no palpable breast development, is otherwise well, and has normal childhood growth until the last year. Which finding specifically satisfies an age-based threshold for evaluating delayed puberty?", "options": ["Prepubertal bone age at 10 years", "Pubic hair without breast development at 11 years", "No breast development at 13 years", "Menarche at 12 years"], "answer": 2, "explanation": "No thelarche at age 13 warrants evaluation, but the cause requires history, auxology, Tanner examination and targeted investigations. | Individual clinical source verification: pending. Why not the others: A. Prepubertal bone age at 10 years — Bone age at 10 is not a 13-year delayed-thelarche threshold.; B. Pubic hair without breast development at 11 years — Isolated pubic hair alone can be adrenarche.; D. Menarche at 12 years — Menarche at 12 confirms progression rather than delayed onset.", "pearl": "", "srcAnswer": "A"}, {"num": 51, "level": "High", "question": "A 14-year-old boy has testicular volume 3 mL bilaterally, isolated pubic hair and a family history of late puberty. Which observation meets the age-based criterion for delayed gonadarche evaluation?", "options": ["A testicular volume of 4 mL at 12 years", "Pubic hair beginning at 11 years", "Axillary odour at 12 years", "Persistent testicular volume below 4 mL at 14 years"], "answer": 3, "explanation": "Testicular enlargement has not begun by 14 years; pubic hair can reflect adrenarche and does not establish gonadarche. | Individual clinical source verification: pending. Why not the others: A. A testicular volume of 4 mL at 12 years — 4 mL is consistent with onset of gonadarche.; B. Pubic hair beginning at 11 years — Pubic hair alone does not establish the onset.; C. Axillary odour at 12 years — Axillary odour is adrenarche.", "pearl": "", "srcAnswer": "D"}, {"num": 52, "level": "High", "question": "A common cause of delayed puberty in otherwise healthy adolescent boys is", "options": ["Constitutional delay of growth and puberty", "Complete androgen insensitivity", "Classic salt-wasting CAH", "Congenital hyperthyroidism"], "answer": 0, "explanation": "Constitutional delay is common, but diagnosis requires exclusion of disease. Why not the others (added — not from source): B. Complete androgen insensitivity — Complete androgen insensitivity occurs in 46,XY individuals with a female phenotype who present with primary amenorrhoea, not as delayed puberty in a phenotypic boy.; C. Classic salt-wasting CAH — Classic salt-wasting CAH presents with neonatal adrenal crisis and, if undertreated, causes androgen excess with early virilisation rather than delayed puberty in a healthy adolescent.; D. Congenital hyperthyroidism — Congenital hyperthyroidism is a rare, transient neonatal condition from maternal TRAb; it is not a common cause of pubertal delay, and it is hypothyroidism that classically delays puberty.", "pearl": "", "srcAnswer": "C"}, {"num": 53, "level": "High", "question": "Delayed puberty with high LH and FSH suggests", "options": ["Constitutional delay alone", "Hypothalamic suppression", "Primary gonadal failure", "Prolactin deficiency"], "answer": 2, "explanation": "Loss of gonadal feedback raises gonadotropins. Why not the others (added — not from source): A. Constitutional delay alone — Constitutional delay is a temporary central (hypogonadotropic) state with prepubertal-range, low LH and FSH; raised gonadotropins exclude it and indicate gonadal failure.; B. Hypothalamic suppression — Hypothalamic suppression reduces GnRH drive, giving low or inappropriately normal LH and FSH, the opposite of the raised gonadotropins in this stem.; D. Prolactin deficiency — Prolactin deficiency does not delay puberty or raise gonadotropins; it is hyperprolactinaemia that suppresses GnRH and lowers LH/FSH.", "pearl": "", "srcAnswer": "B"}, {"num": 54, "level": "High", "question": "Delayed puberty with low/inappropriately normal LH and FSH suggests", "options": ["Hyperaldosteronism", "Hypogonadotropic hypogonadism or functional suppression", "Primary gonadal failure in every case", "Androgen excess"], "answer": 1, "explanation": "Central or functional causes have insufficient gonadotropin drive. Why not the others (added — not from source): A. Hyperaldosteronism — Hyperaldosteronism causes hypertension and hypokalaemia and has no role in the hypothalamic-pituitary-gonadal axis or delayed puberty.; C. Primary gonadal failure in every case — Primary gonadal failure removes negative feedback and raises LH and FSH; low or inappropriately normal gonadotropins argue against it, so 'in every case' is wrong.; D. Androgen excess — Androgen excess (e.g. CAH, tumours) causes early virilisation or precocity, not delayed puberty; any gonadotropin suppression it causes is secondary, not a cause of pubertal delay.", "pearl": "", "srcAnswer": "A"}, {"num": 55, "level": "High", "question": "Anosmia with congenital hypogonadotropic hypogonadism suggests", "options": ["Cushing syndrome", "Kallmann syndrome", "McCune-Albright syndrome", "Turner syndrome"], "answer": 1, "explanation": "Olfactory and GnRH neuron migration defects may coexist. Why not the others (added — not from source): A. Cushing syndrome — Cushing syndrome may suppress gonadotropins and delay puberty, but it presents with weight gain, growth failure and cushingoid features, not congenital anosmia.; C. McCune-Albright syndrome — McCune-Albright syndrome causes gonadotropin-independent precocious puberty from GNAS activation, the opposite of congenital hypogonadotropic hypogonadism, and is unrelated to anosmia.; D. Turner syndrome — Turner syndrome causes hypergonadotropic hypogonadism from gonadal dysgenesis with high FSH, and anosmia is not a feature.", "pearl": "", "srcAnswer": "D"}, {"num": 56, "level": "High", "question": "A girl with short stature, delayed puberty and high FSH should be assessed for", "options": ["Androgen insensitivity", "21-hydroxylase CAH", "5-alpha-reductase deficiency", "Turner syndrome"], "answer": 3, "explanation": "Gonadal dysgenesis in Turner syndrome causes hypergonadotropic hypogonadism. Why not the others (added — not from source): A. Androgen insensitivity — Complete androgen insensitivity presents with primary amenorrhoea in a girl of normal or tall stature with breast development from aromatised testosterone, not short stature with high FSH.; B. 21-hydroxylase CAH — 21-hydroxylase CAH causes androgen excess with advanced bone age and early virilisation; gonadotropins are not raised from gonadal failure.; C. 5-alpha-reductase deficiency — 5-alpha-reductase deficiency affects 46,XY individuals with atypical genitalia who virilise at puberty; it does not explain short stature and ovarian failure in a girl.", "pearl": "", "srcAnswer": "C"}, {"num": 57, "level": "High", "question": "A boy with small firm testes, tall stature and high FSH/LH may have", "options": ["Klinefelter syndrome", "Complete gonadal dysgenesis in 46,XX", "Central precocious puberty", "Salt-wasting CAH"], "answer": 0, "explanation": "47,XXY can cause primary testicular dysfunction. Why not the others (added — not from source): B. Complete gonadal dysgenesis in 46,XX — 46,XX complete gonadal dysgenesis gives a female phenotype with streak gonads and primary amenorrhoea, not a boy with testes.; C. Central precocious puberty — Central precocious puberty causes early pubertal testicular enlargement with pubertal LH, not small firm testes from primary testicular failure.; D. Salt-wasting CAH — Salt-wasting CAH in boys presents with neonatal adrenal crisis or later androgen excess with suppressed gonadotropins, not small testes with high FSH/LH.", "pearl": "", "srcAnswer": "B"}, {"num": 58, "level": "High", "question": "A 14-year-old boy has testicular volume 2 mL and lower growth velocity. Before considering dynamic tests or treatment, which assessment most appropriately determines the direction of investigation?", "options": ["Empirical lifelong testosterone immediately", "Only brain MRI in every case", "Growth chart, Tanner stage, history and examination", "Only random cortisol"], "answer": 2, "explanation": "Auxology, Tanner staging, family and systemic history, nutrition and examination establish whether delay may be constitutional or pathological; initial tests follow the phenotype. | Individual clinical source verification: pending. Why not the others: A. Empirical lifelong testosterone immediately — Lifelong therapy without evaluation is inappropriate.; B. Only brain MRI in every case — MRI should be selective according to clinical and endocrine evidence.; D. Only random cortisol — Random cortisol alone cannot classify puberty.", "pearl": "", "srcAnswer": "A"}, {"num": 59, "level": "High", "question": "A delayed-puberty adolescent with weight loss and intensive training may have", "options": ["Complete androgen insensitivity", "Isolated premature adrenarche", "Functional hypothalamic suppression", "Primary hyperaldosteronism"], "answer": 2, "explanation": "Energy deficit can suppress GnRH pulsatility. Why not the others (added — not from source): A. Complete androgen insensitivity — Complete androgen insensitivity is a congenital 46,XY condition presenting with primary amenorrhoea; it is unrelated to weight loss or training.; B. Isolated premature adrenarche — Isolated premature adrenarche is early adrenal androgen production in young children and does not cause delayed puberty.; D. Primary hyperaldosteronism — Primary hyperaldosteronism causes hypertension and hypokalaemia and does not explain pubertal delay linked to low energy availability.", "pearl": "", "srcAnswer": "D"}, {"num": 60, "level": "High", "question": "Bone age in constitutional delay is commonly", "options": ["Always advanced", "Always equal to chronological age", "Not useful", "Delayed relative to chronological age"], "answer": 3, "explanation": "Delayed skeletal maturation supports but does not prove constitutional delay. Why not the others (added — not from source): A. Always advanced — Advanced bone age suggests sex-steroid or androgen excess (precocity, CAH, obesity), not constitutional delay, and 'always' is incorrect.; B. Always equal to chronological age — In constitutional delay bone age typically lags chronological age by about 2 years; equality with chronological age argues against it.; C. Not useful — Bone age is useful: a delayed bone age supports constitutional delay and helps predict remaining growth potential, though it is not diagnostic alone.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day43',label:'Day 43',set:'Quiz 4',href:'Day43/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day43_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 43 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 43 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 43'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 43');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day43:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
