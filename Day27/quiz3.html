const quiz=[{"num": 37, "level": "Conceptual", "question": "An infant with progressive neurologic signs has MRI abnormalities that remain persistently under-myelinated rather than showing myelin loss. What category is most appropriate?", "options": ["Hypomyelinating leukodystrophy", "Acute cerebellitis", "Obstructive hydrocephalus", "Inflammatory demyelination"], "answer": 0, "explanation": "Persistently deficient myelin formation differs from acquired demyelination. Why not the others: B. Acute cerebellitis — Usually acute inflammatory ataxia, not persistent hypomyelination.; C. Obstructive hydrocephalus — Enlarged ventricles are not the defining MRI finding.; D. Inflammatory demyelination — This implies loss of previously formed myelin.", "pearl": "Persistently deficient myelin formation differs from acquired demyelination.", "srcAnswer": "A"}, {"num": 38, "level": "High-difficulty", "question": "A child with suspected cerebral ALD has normal cortisol today. Which conclusion is safest?", "options": ["Continue longitudinal adrenal surveillance", "Adrenal disease is permanently excluded", "Stop all brain MRI monitoring", "Use cortisol alone to confirm ABCD1 genotype"], "answer": 0, "explanation": "Adrenal insufficiency may emerge later despite current normal results. Why not the others: B. Adrenal disease is permanently excluded — Endocrine involvement can evolve over time.; C. Stop all brain MRI monitoring — Normal cortisol does not exclude cerebral demyelination.; D. Use cortisol alone to confirm ABCD1 genotype — Genetic/biochemical confirmation is separate.", "pearl": "Adrenal insufficiency may emerge later despite current normal results.", "srcAnswer": "A"}, {"num": 39, "level": "High-difficulty", "question": "A 7-year-old has symmetric leukodystrophy and very-long-chain fatty acids elevated; family asks if diet alone prevents cerebral disease. Best counseling?", "options": ["No treatment exists at any stage", "Dietary modification is not established as reliable prevention of cerebral ALD", "Adrenal replacement halts cerebral demyelination", "Lorenzo's oil reverses advanced cerebral lesions"], "answer": 1, "explanation": "MRI surveillance and timely specialist disease-modifying evaluation remain essential. Why not the others: A. No treatment exists at any stage — Early cerebral disease may benefit from specialist HSCT.; C. Adrenal replacement halts cerebral demyelination — It treats adrenal insufficiency, not brain disease.; D. Lorenzo's oil reverses advanced cerebral lesions — Established inflammatory lesions are not reversed by diet alone.", "pearl": "MRI surveillance and timely specialist disease-modifying evaluation remain essential.", "srcAnswer": "B"}, {"num": 40, "level": "Clinical", "question": "A 16-month-old with developmental regression and exaggerated startle has a cherry-red spot but no hepatosplenomegaly. Which disorder?", "options": ["Krabbe disease", "Tay–Sachs disease", "Gaucher type 1", "Niemann–Pick type A"], "answer": 1, "explanation": "Hexosaminidase A deficiency causes GM2 gangliosidosis without prominent organomegaly. Why not the others: A. Krabbe disease — Peripheral neuropathy and leukodystrophy are more characteristic.; C. Gaucher type 1 — Splenomegaly and cytopenias predominate, without this infantile neurodegenerative pattern.; D. Niemann–Pick type A — Often has hepatosplenomegaly and acid sphingomyelinase deficiency.", "pearl": "Hexosaminidase A deficiency causes GM2 gangliosidosis without prominent organomegaly.", "srcAnswer": "B"}, {"num": 41, "level": "Clinical", "question": "An infant with neurodegeneration, cherry-red macula and marked hepatosplenomegaly has acid sphingomyelinase deficiency. Which disease?", "options": ["Canavan disease", "Tay–Sachs disease", "Niemann–Pick disease type A", "Metachromatic leukodystrophy"], "answer": 2, "explanation": "SMPD1-related acid sphingomyelinase deficiency causes visceral and neurologic storage. Why not the others: A. Canavan disease — White-matter NAA accumulation, not sphingomyelinase deficiency.; B. Tay–Sachs disease — Typically lacks hepatosplenomegaly.; D. Metachromatic leukodystrophy — Sulfatide storage rather than sphingomyelin.", "pearl": "SMPD1-related acid sphingomyelinase deficiency causes visceral and neurologic storage.", "srcAnswer": "C"}, {"num": 42, "level": "High-difficulty", "question": "A school-aged child has vertical supranuclear gaze palsy, ataxia and splenomegaly. Which disorder?", "options": ["Niemann–Pick type C", "Tay–Sachs disease", "Ataxia–telangiectasia", "NF1"], "answer": 0, "explanation": "NPC disease classically impairs vertical saccades and causes neurovisceral disease. Why not the others: B. Tay–Sachs disease — Infantile GM2 disease with cherry-red spot.; C. Ataxia–telangiectasia — Ocular telangiectasia and elevated AFP are more typical.; D. NF1 — Pigmentary lesions and neurofibromas predominate.", "pearl": "NPC disease classically impairs vertical saccades and causes neurovisceral disease.", "srcAnswer": "A"}, {"num": 43, "level": "Clinical", "question": "A toddler has progressive coarse facies, developmental regression, hepatosplenomegaly and dysostosis multiplex. Which disease group is most likely?", "options": ["Pure Pelizaeus–Merzbacher disease", "Mucopolysaccharidoses", "Classic NF1", "Idiopathic intracranial hypertension"], "answer": 1, "explanation": "Glycosaminoglycan storage causes skeletal and visceral disease with variable CNS involvement. Why not the others: A. Pure Pelizaeus–Merzbacher disease — Hypomyelination does not produce coarse facies and dysostosis.; C. Classic NF1 — Neurofibromas and café-au-lait lesions are distinct.; D. Idiopathic intracranial hypertension — Does not cause multisystem storage features.", "pearl": "Glycosaminoglycan storage causes skeletal and visceral disease with variable CNS involvement.", "srcAnswer": "B"}, {"num": 44, "level": "High-difficulty", "question": "A 5-year-old has developmental regression, epilepsy, behavioral decline and macular cherry-red spot; hexosaminidase A and B both low. Which diagnosis?", "options": ["Niemann–Pick type C", "Tay–Sachs disease", "Sandhoff disease", "MLD"], "answer": 2, "explanation": "HEXB deficiency lowers both hexosaminidase A and B activities. Why not the others: A. Niemann–Pick type C — Cholesterol trafficking disorder with gaze palsy.; B. Tay–Sachs disease — HEXA deficiency primarily lowers hexosaminidase A.; D. MLD — ARSA deficiency, not hexosaminidase pattern.", "pearl": "HEXB deficiency lowers both hexosaminidase A and B activities.", "srcAnswer": "C"}, {"num": 45, "level": "Clinical", "question": "A child with epilepsy and neurodegeneration has angiokeratomas and renal dysfunction in a family with affected males. Which biochemical disease is likely?", "options": ["TSC", "Gaucher disease", "Fabry disease", "Krabbe disease"], "answer": 2, "explanation": "Alpha-galactosidase A deficiency is X-linked and causes angiokeratomas, neuropathic pain and renal disease. Why not the others: A. TSC — Angiofibromas and renal angiomyolipomas, not angiokeratomas, are typical.; B. Gaucher disease — Glucocerebrosidase deficiency causes organomegaly and bone crises.; D. Krabbe disease — GALC deficiency causes leukodystrophy.", "pearl": "Alpha-galactosidase A deficiency is X-linked and causes angiokeratomas, neuropathic pain and renal disease.", "srcAnswer": "C"}, {"num": 46, "level": "Basic", "question": "A child with developmental regression has characteristic hand-wringing stereotypies after apparently normal early development. Which gene is strongly associated?", "options": ["NF1", "ABCD1", "SMN1", "MECP2"], "answer": 3, "explanation": "Rett syndrome commonly affects girls with regression and hand stereotypies. Why not the others: A. NF1 — Causes pigmentary/neurofibromatous features.; B. ABCD1 — Causes X-ALD with white-matter/adrenal disease.; C. SMN1 — Causes motor neuron degeneration without classic hand stereotypies.", "pearl": "Rett syndrome commonly affects girls with regression and hand stereotypies.", "srcAnswer": "D"}, {"num": 47, "level": "Clinical", "question": "A child has progressive dystonia, parkinsonism and eye-of-the-tiger MRI sign. Which condition is classic?", "options": ["Pantothenate kinase-associated neurodegeneration", "Canavan disease", "Niemann–Pick type A", "TSC"], "answer": 0, "explanation": "PKAN (PANK2) is a neurodegeneration-with-brain-iron-accumulation disorder. Why not the others: B. Canavan disease — High NAA and spongiform leukodystrophy.; C. Niemann–Pick type A — Visceral storage with infantile neurodegeneration.; D. TSC — Cortical tubers and subependymal lesions.", "pearl": "PKAN (PANK2) is a neurodegeneration-with-brain-iron-accumulation disorder.", "srcAnswer": "A"}, {"num": 48, "level": "High-difficulty", "question": "A child with early developmental regression has intermittent lactic acidosis and bilateral basal ganglia lesions. What broad disease category deserves priority?", "options": ["Uncomplicated tension headache", "Mitochondrial energy-metabolism disease such as Leigh syndrome", "Isolated NF1 optic pathway disease", "Benign external hydrocephalus"], "answer": 1, "explanation": "Symmetric deep-gray lesions and lactate suggest mitochondrial dysfunction. Why not the others: A. Uncomplicated tension headache — Not a progressive encephalopathy.; C. Isolated NF1 optic pathway disease — Does not explain systemic lactate and symmetric basal ganglia lesions.; D. Benign external hydrocephalus — Does not produce this metabolic pattern.", "pearl": "Symmetric deep-gray lesions and lactate suggest mitochondrial dysfunction.", "srcAnswer": "B"}, {"num": 49, "level": "Clinical", "question": "A 10-year-old has recurrent unilateral throbbing headache with photophobia and nausea, normal neurologic examination between attacks. Most likely diagnosis?", "options": ["Acute bacterial meningitis", "Obstructive hydrocephalus", "Tension-type headache", "Migraine without aura"], "answer": 3, "explanation": "Recurrent disabling headache with nausea and sensory sensitivity is characteristic. Why not the others: A. Acute bacterial meningitis — Usually acute febrile illness with meningeal signs.; B. Obstructive hydrocephalus — Would raise concern with progressive morning vomiting or focal signs.; C. Tension-type headache — Typically pressing bilateral pain without prominent nausea.", "pearl": "Recurrent disabling headache with nausea and sensory sensitivity is characteristic.", "srcAnswer": "D"}, {"num": 50, "level": "Conceptual", "question": "An 11-year-old has recurrent bilateral pressing headaches without nausea and can continue activities. What is most consistent?", "options": ["Tension-type headache", "Cluster headache", "Intracranial mass", "Migraine with brainstem aura"], "answer": 0, "explanation": "Nonpulsating, mild-to-moderate pain without migraine features is typical. Why not the others: B. Cluster headache — Typically severe unilateral orbital pain with autonomic features.; C. Intracranial mass — No red flags are described.; D. Migraine with brainstem aura — Requires transient brainstem aura symptoms.", "pearl": "Nonpulsating, mild-to-moderate pain without migraine features is typical.", "srcAnswer": "A"}, {"num": 51, "level": "Clinical", "question": "A child under 12 has headache waking them from sleep and morning vomiting. Best disposition?", "options": ["Same-day urgent assessment for intracranial pathology", "Order routine outpatient EEG first", "Reassure as simple migraine without examination", "Trial only dietary trigger avoidance for a month"], "answer": 0, "explanation": "NICE NG127 lists these as red flags requiring same-day assessment. Why not the others: B. Order routine outpatient EEG first — EEG is not first-line for headache red flags.; C. Reassure as simple migraine without examination — Red flags mandate evaluation.; D. Trial only dietary trigger avoidance for a month — Delays assessment of possible raised ICP.", "pearl": "NICE NG127 lists these as red flags requiring same-day assessment.", "srcAnswer": "A"}, {"num": 52, "level": "Clinical", "question": "A 13-year-old has a typical migraine without red flags and can tolerate oral medication. Which acute treatment is evidence-supported?", "options": ["Long-term opioids", "Daily prophylactic corticosteroids", "Immediate lumbar puncture", "Early age-appropriate ibuprofen and hydration"], "answer": 3, "explanation": "NSAIDs are commonly effective first-line acute migraine therapy in children. Why not the others: A. Long-term opioids — Risk of medication overuse and harm outweighs benefit.; B. Daily prophylactic corticosteroids — Not standard for an isolated migraine attack.; C. Immediate lumbar puncture — Not indicated for uncomplicated typical migraine.", "pearl": "NSAIDs are commonly effective first-line acute migraine therapy in children.", "srcAnswer": "D"}, {"num": 53, "level": "High-difficulty", "question": "A teenager with frequent migraine and marked disability asks about preventive medication. Which counseling is most evidence-aligned?", "options": ["Promise amitriptyline alone will prevent all attacks", "Prescribe valproate to every adolescent girl", "Shared decision-making, lifestyle measures and realistic discussion of placebo response", "Ignore sleep and stress"], "answer": 2, "explanation": "Pediatric preventive trials often show substantial placebo response and limited drug superiority. Why not the others: A. Promise amitriptyline alone will prevent all attacks — Evidence for monotherapy is limited.; B. Prescribe valproate to every adolescent girl — Teratogenic and other risks require careful consideration.; D. Ignore sleep and stress — Behavioral factors affect headache burden.", "pearl": "Pediatric preventive trials often show substantial placebo response and limited drug superiority.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day27',label:'Day 27',set:'Quiz 3',href:'Day27/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;

 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);

 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;

 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}

function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day27_QuizSet3_Q37-53_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 27 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 37–53</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 27 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 27'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 27');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day27:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
