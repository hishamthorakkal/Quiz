@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "Clinical", "question": "A 6-year-old has seven bilateral café-au-lait macules >5 mm and axillary freckling. Which interpretation follows the revised 2021 criteria?", "options": ["The phenotype should be monitored without a working diagnosis until an NF1 variant is found", "A pigmentary-only phenotype establishes Legius syndrome rather than NF1", "A third non-pigmentary feature is needed before applying the NF1 criteria", "NF1 diagnostic criteria are met"], "answer": 3, "explanation": "Two distinct pigmentary criteria suffice when bilateral findings are present. Why not the others: A. The phenotype should be monitored without a working diagnosis until an NF1 variant is found — molecular confirmation is useful for uncertain pigmentary phenotypes, but the child already meets the clinical threshold.; B. A pigmentary-only phenotype establishes Legius syndrome rather than NF1 — Legius remains a differential, not an automatic diagnosis; clinical and molecular assessment may distinguish it.; C. A third non-pigmentary feature is needed before applying the NF1 criteria — two separate criteria suffice under revised NF1 criteria, with the pigmentary-only Legius caveat.", "pearl": "Two distinct pigmentary criteria suffice when bilateral findings are present.", "srcAnswer": "D"}, {"num": 2, "level": "Conceptual", "question": "An 8-year-old has a parent meeting NF1 criteria and six typical café-au-lait macules. What is the diagnostic threshold in this family context?", "options": ["A confirmed optic glioma", "Two independent clinical criteria must be present even when a parent meets NF1 criteria", "An optic pathway MRI abnormality must accompany pigmentary findings", "One NF1 criterion in the child is sufficient"], "answer": 3, "explanation": "A child of an affected parent needs one listed criterion under 2021 criteria. Why not the others: A. A confirmed optic glioma — No specific tumor is obligatory.; B. Two independent clinical criteria must be present even when a parent meets NF1 criteria — 2021 consensus permits diagnosis with one criterion in a child of a parent meeting NF1 criteria.; C. An optic pathway MRI abnormality must accompany pigmentary findings — imaging is not mandatory to reach the clinical criterion in this family context.", "pearl": "A child of an affected parent needs one listed criterion under 2021 criteria.", "srcAnswer": "D"}, {"num": 3, "level": "Integrated", "question": "A 4-year-old has only café-au-lait macules and axillary freckling, with normal eye and skeletal examination. Which alternative is especially important?", "options": ["Tuberous sclerosis complex", "Legius syndrome due to SPRED1", "Sturge-Weber syndrome", "Ataxia-telangiectasia"], "answer": 1, "explanation": "Pigmentary-only presentations can overlap with Legius syndrome. Why not the others: A. Tuberous sclerosis complex — Hypomelanotic macules, not multiple café-au-lait lesions, are characteristic.; C. Sturge-Weber syndrome — Its defining lesion is a capillary malformation rather than NF1-type pigmentary signs.; D. Ataxia-telangiectasia — Oculocutaneous telangiectasia with ataxia is a different phenotype.", "pearl": "Pigmentary-only presentations can overlap with Legius syndrome.", "srcAnswer": "B"}, {"num": 4, "level": "High-difficulty", "question": "A child with NF1 has progressive proptosis, reduced visual acuity and an orbital plexiform mass. Which immediate concern is most relevant?", "options": ["Diffuse intrinsic pontine glioma", "A subependymal giant cell astrocytoma", "A fourth-ventricular ependymoma", "Threat to vision from an orbital plexiform neurofibroma"], "answer": 3, "explanation": "Orbital involvement can distort ocular structures and compromise vision. Why not the others: A. Diffuse intrinsic pontine glioma — The orbital signs localize outside the pons.; B. A subependymal giant cell astrocytoma — SEGA is linked to TSC, not this orbital lesion.; C. A fourth-ventricular ependymoma — It would usually cause posterior fossa or hydrocephalus signs.", "pearl": "Orbital involvement can distort ocular structures and compromise vision.", "srcAnswer": "D"}, {"num": 5, "level": "Basic", "question": "Which ocular feature is now an alternative to two Lisch nodules within the revised NF1 diagnostic criteria?", "options": ["Retinal cherry-red spot", "Congenital cataracts", "Two or more choroidal abnormalities on OCT/NIR", "Bilateral lens subluxation"], "answer": 2, "explanation": "The 2021 criteria include characteristic choroidal abnormalities. Why not the others: A. Retinal cherry-red spot — This suggests a lysosomal storage disorder.; B. Congenital cataracts — Cataracts are not an NF1 criterion.; D. Bilateral lens subluxation — This suggests a connective-tissue or metabolic syndrome.", "pearl": "The 2021 criteria include characteristic choroidal abnormalities.", "srcAnswer": "C"}, {"num": 6, "level": "High-difficulty", "question": "A child with NF1 has painful rapidly enlarging deep neurofibroma and new weakness. What is the best next step?", "options": ["Urgent specialist assessment for malignant transformation", "Treat empirically for optic neuritis", "Assume benign growth because of age", "Routine annual observation only"], "answer": 0, "explanation": "Pain, rapid growth and neurologic deficit raise concern for malignant peripheral nerve sheath tumor. Why not the others: B. Treat empirically for optic neuritis — The problem is a peripheral mass with focal deficits.; C. Assume benign growth because of age — Age does not exclude malignant transformation.; D. Routine annual observation only — New progressive warning signs require expedited evaluation.", "pearl": "Pain, rapid growth and neurologic deficit raise concern for malignant peripheral nerve sheath tumor.", "srcAnswer": "A"}, {"num": 7, "level": "Conceptual", "question": "An infant has anterolateral tibial bowing and several café-au-lait macules. Which syndrome-associated complication is most relevant?", "options": ["Renal angiomyolipoma in TSC", "Long-bone pseudarthrosis associated with NF1", "Posterior fossa hemangioblastoma", "Glaucoma due to Sturge-Weber"], "answer": 1, "explanation": "Anterolateral tibial bowing/pseudarthrosis is a distinctive osseous criterion. Why not the others: A. Renal angiomyolipoma in TSC — This is renal and does not explain tibial bowing.; C. Posterior fossa hemangioblastoma — This is a VHL lesion unrelated to tibial bowing.; D. Glaucoma due to Sturge-Weber — This does not account for the bone phenotype.", "pearl": "Anterolateral tibial bowing/pseudarthrosis is a distinctive osseous criterion.", "srcAnswer": "B"}, {"num": 8, "level": "High-difficulty", "question": "A teenager with NF1 develops persistent hypertension. Which evaluation should not be overlooked?", "options": ["Treat as essential hypertension without assessment", "Secondary causes including renal artery disease or catecholamine tumor", "Assume it is due to SEGA", "Measure only CSF opening pressure"], "answer": 1, "explanation": "NF1 can be associated with renovascular hypertension and pheochromocytoma. Why not the others: A. Treat as essential hypertension without assessment — A syndromic patient warrants evaluation of secondary causes.; C. Assume it is due to SEGA — SEGA is not an NF1 lesion.; D. Measure only CSF opening pressure — Intracranial pressure is not the default explanation for sustained systemic hypertension.", "pearl": "NF1 can be associated with renovascular hypertension and pheochromocytoma.", "srcAnswer": "B"}, {"num": 9, "level": "Conceptual", "question": "A child has a solitary optic pathway glioma but no other findings. Which statement is most accurate?", "options": ["It establishes NF1 in every patient", "It is diagnostic of Legius syndrome", "It is one NF1 criterion, not by itself sufficient in a child without affected parent", "It excludes NF1 if visual acuity is normal"], "answer": 2, "explanation": "The revised criteria require at least two criteria absent affected-parent status. Why not the others: A. It establishes NF1 in every patient — An isolated optic glioma does not meet the full threshold.; B. It is diagnostic of Legius syndrome — Legius syndrome does not characteristically produce optic pathway glioma.; D. It excludes NF1 if visual acuity is normal — Asymptomatic optic pathway glioma can occur.", "pearl": "The revised criteria require at least two criteria absent affected-parent status.", "srcAnswer": "C"}, {"num": 10, "level": "Integrated", "question": "A child with NF1 has stable optic pathway glioma without visual decline. What principle guides treatment?", "options": ["All asymptomatic tumors need urgent resection", "Observation can ignore ophthalmologic assessment", "Visual function and progression drive specialist treatment decisions", "All NF1 optic gliomas require immediate radiotherapy"], "answer": 2, "explanation": "Imaging alone does not mandate treatment of every stable lesion. Why not the others: A. All asymptomatic tumors need urgent resection — Surgery can jeopardize vision and is not routine.; B. Observation can ignore ophthalmologic assessment — Serial functional eye assessment remains important.; D. All NF1 optic gliomas require immediate radiotherapy — Routine radiation is avoided due to toxicity and vascular risks.", "pearl": "Imaging alone does not mandate treatment of every stable lesion.", "srcAnswer": "C"}, {"num": 11, "level": "Basic", "question": "An infant with multiple hypomelanotic macules and focal seizures has cortical tubers on MRI. Which pathway is implicated?", "options": ["NF1–RAS pathway loss alone", "SMN1 survival motor neuron deficiency", "TSC1/TSC2–mTOR pathway dysregulation", "ABCD1 peroxisomal transport failure"], "answer": 2, "explanation": "Hamartin/tuberin normally restrain mTORC1 activity. Why not the others: A. NF1–RAS pathway loss alone — NF1 involves neurofibromin and RAS regulation.; B. SMN1 survival motor neuron deficiency — That causes spinal muscular atrophy.; D. ABCD1 peroxisomal transport failure — That causes X-linked adrenoleukodystrophy.", "pearl": "Hamartin/tuberin normally restrain mTORC1 activity.", "srcAnswer": "C"}, {"num": 12, "level": "Clinical", "question": "A 4-month-old with TSC develops clusters of epileptic spasms. What is the preferred initial disease-specific therapy?", "options": ["Carbamazepine", "Acetazolamide", "Vigabatrin", "Ethosuximide"], "answer": 2, "explanation": "Consensus guidance supports vigabatrin as first-line for TSC-associated infantile spasms. Why not the others: A. Carbamazepine — Not the preferred treatment for infantile spasms.; B. Acetazolamide — Not first-line for TSC-associated spasms.; D. Ethosuximide — Primarily used for typical absence seizures.", "pearl": "Consensus guidance supports vigabatrin as first-line for TSC-associated infantile spasms.", "srcAnswer": "C"}, {"num": 13, "level": "High-difficulty", "question": "A 12-year-old with TSC has a growing lesion near the foramen of Monro and ventricular enlargement. Which lesion is most likely?", "options": ["Choroid plexus papilloma", "Optic pathway glioma", "Cortical tuber", "Subependymal giant cell astrocytoma"], "answer": 3, "explanation": "SEGA typically arises near the foramen of Monro and can obstruct CSF flow. Why not the others: A. Choroid plexus papilloma — Possible ventricular tumor but less linked to TSC and Monro location.; B. Optic pathway glioma — More characteristic of NF1 and optic pathway location.; C. Cortical tuber — A cortical tuber is intraparenchymal rather than a growing intraventricular mass.", "pearl": "SEGA typically arises near the foramen of Monro and can obstruct CSF flow.", "srcAnswer": "D"}, {"num": 14, "level": "Conceptual", "question": "For an asymptomatic 16-year-old with confirmed TSC, what is the consensus brain imaging interval for SEGA surveillance?", "options": ["MRI every 1–3 years until age 25", "Routine CT every month", "MRI every week", "Only one MRI at diagnosis"], "answer": 0, "explanation": "Consensus TSC surveillance advises serial MRI in asymptomatic patients under 25. Why not the others: B. Routine CT every month — Unnecessary radiation and not consensus surveillance.; C. MRI every week — No evidence supports this intensive routine interval.; D. Only one MRI at diagnosis — New or growing SEGA can develop later.", "pearl": "Consensus TSC surveillance advises serial MRI in asymptomatic patients under 25.", "srcAnswer": "A"}, {"num": 15, "level": "High-difficulty", "question": "A child with TSC has an enlarging asymptomatic SEGA. Which nonoperative targeted therapy may be appropriate after multidisciplinary review?", "options": ["A BRAF inhibitor as default", "An mTOR inhibitor such as everolimus", "High-dose levodopa", "Chronic acetazolamide alone"], "answer": 1, "explanation": "mTOR inhibition can shrink selected growing SEGAs. Why not the others: A. A BRAF inhibitor as default — BRAF-directed therapy is not standard for TSC-associated SEGA.; C. High-dose levodopa — It does not address mTOR-driven tumor growth.; D. Chronic acetazolamide alone — It does not control tumor biology or definitive obstruction.", "pearl": "mTOR inhibition can shrink selected growing SEGAs.", "srcAnswer": "B"}, {"num": 16, "level": "Conceptual", "question": "A toddler with TSC has facial angiofibromas and shagreen patch. Which extracranial surveillance is important?", "options": ["Renal imaging and blood-pressure monitoring", "No surveillance outside the brain", "Annual skeletal survey for tibial pseudarthrosis", "Routine adrenal VLCFA monitoring"], "answer": 0, "explanation": "TSC-associated angiomyolipomas/cysts and hypertension require monitoring. Why not the others: B. No surveillance outside the brain — TSC is multisystemic.; C. Annual skeletal survey for tibial pseudarthrosis — That skeletal phenotype is associated with NF1.; D. Routine adrenal VLCFA monitoring — VLCFA testing is relevant to peroxisomal disease.", "pearl": "TSC-associated angiomyolipomas/cysts and hypertension require monitoring.", "srcAnswer": "A"}, {"num": 17, "level": "Basic", "question": "Which cardiac lesion commonly presents in a neonate with TSC and may regress with age?", "options": ["Cardiac rhabdomyoma", "Atrial myxoma", "Endocardial fibroelastosis", "Tetralogy of Fallot"], "answer": 0, "explanation": "Rhabdomyomas are characteristic and often involute. Why not the others: B. Atrial myxoma — Not the characteristic neonatal TSC cardiac tumor.; C. Endocardial fibroelastosis — Not the classic TSC tumor.; D. Tetralogy of Fallot — Congenital structural lesion not specific to TSC.", "pearl": "Rhabdomyomas are characteristic and often involute.", "srcAnswer": "A"}, {"num": 18, "level": "High-difficulty", "question": "A preschool child with TSC has normal intelligence but new anxiety, attention difficulties and sleep problems. What assessment is appropriate?", "options": ["Structured TAND screening", "Screen only for glaucoma", "Assume normal intellect excludes TAND", "Wait until adulthood"], "answer": 0, "explanation": "TSC-associated neuropsychiatric disorders include behavioral, psychiatric, cognitive and learning problems. Why not the others: B. Screen only for glaucoma — Ocular disease is not the presenting problem.; C. Assume normal intellect excludes TAND — Neuropsychiatric issues occur across intellectual abilities.; D. Wait until adulthood — Early identification and support are recommended.", "pearl": "TSC-associated neuropsychiatric disorders include behavioral, psychiatric, cognitive and learning problems.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day27',label:'Day 27',set:'Quiz 1',href:'Day27/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day27_QuizSet1_Q1-18_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 27 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–18</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 27 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 27'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 27');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day27:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
