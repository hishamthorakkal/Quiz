const quiz=[{"num": 71, "level": "Clinical", "question": "A 9-year-old has growth failure, bitemporal visual field loss and calcified cystic suprasellar mass. Which diagnosis?", "options": ["Medulloblastoma", "Adamantinomatous craniopharyngioma", "Cerebellar pilocytic astrocytoma", "Pineoblastoma"], "answer": 1, "explanation": "Calcified cystic suprasellar mass with endocrine/visual signs is characteristic. Why not the others: A. Medulloblastoma — Typically posterior fossa.; C. Cerebellar pilocytic astrocytoma — Cerebellar cyst/mural nodule pattern rather than suprasellar calcified lesion.; D. Pineoblastoma — Pineal region with vertical gaze dysfunction.", "pearl": "Calcified cystic suprasellar mass with endocrine/visual signs is characteristic.", "srcAnswer": "B"}, {"num": 72, "level": "Clinical", "question": "A child has a cystic cerebellar lesion with enhancing mural nodule and relatively indolent course. Which tumor is most likely?", "options": ["Suprasellar germinoma", "Diffuse midline glioma H3 K27-altered", "Medulloblastoma", "Pilocytic astrocytoma"], "answer": 3, "explanation": "Circumscribed low-grade astrocytoma often shows cyst with mural nodule. Why not the others: A. Suprasellar germinoma — Different location and imaging pattern.; B. Diffuse midline glioma H3 K27-altered — Infiltrative midline aggressive tumor.; C. Medulloblastoma — Usually solid hypercellular embryonal tumor.", "pearl": "Circumscribed low-grade astrocytoma often shows cyst with mural nodule.", "srcAnswer": "D"}, {"num": 73, "level": "Clinical", "question": "A child has progressive cranial neuropathies and long-tract signs; MRI shows diffusely expanded pons. Which tumor category is most concerning?", "options": ["Diffuse midline glioma, H3 K27-altered (where molecularly confirmed)", "Choroid plexus papilloma", "Craniopharyngioma", "Pilocytic astrocytoma of cerebellar hemisphere"], "answer": 0, "explanation": "Diffuse infiltrative pontine phenotype is high-risk; molecular classification requires testing. Why not the others: B. Choroid plexus papilloma — Ventricular tumor with CSF overproduction.; C. Craniopharyngioma — Suprasellar mass.; D. Pilocytic astrocytoma of cerebellar hemisphere — Circumscribed cerebellar tumor has different location.", "pearl": "Diffuse infiltrative pontine phenotype is high-risk; molecular classification requires testing.", "srcAnswer": "A"}, {"num": 74, "level": "Clinical", "question": "A 10-year-old has a pineal region mass, hydrocephalus and impaired upward gaze. Which named sign is suggested?", "options": ["Wallenberg syndrome", "Internuclear ophthalmoplegia", "Horner syndrome", "Parinaud dorsal midbrain syndrome"], "answer": 3, "explanation": "Vertical gaze palsy with pineal compression is classic. Why not the others: A. Wallenberg syndrome — Lateral medullary deficits.; B. Internuclear ophthalmoplegia — Horizontal gaze disconjugacy from MLF lesion.; C. Horner syndrome — Ptosis/miosis/anhidrosis due to sympathetic pathway injury.", "pearl": "Vertical gaze palsy with pineal compression is classic.", "srcAnswer": "D"}, {"num": 75, "level": "High-difficulty", "question": "A child with suspected medulloblastoma has undergone initial stabilization. Why is neuraxis staging important?", "options": ["Risk of CSF dissemination to spinal leptomeninges", "It diagnoses NF1 simultaneously", "It eliminates need for brain MRI", "It replaces histopathology and molecular typing"], "answer": 0, "explanation": "Medulloblastoma can seed through CSF and staging guides risk and treatment. Why not the others: B. It diagnoses NF1 simultaneously — No relationship to NF1 diagnostic criteria.; C. It eliminates need for brain MRI — Primary-site imaging remains essential.; D. It replaces histopathology and molecular typing — Staging complements, not substitutes, tumor classification.", "pearl": "Medulloblastoma can seed through CSF and staging guides risk and treatment.", "srcAnswer": "A"}, {"num": 76, "level": "", "question": "A term infant has low plasma glucose at 60 hours and another at 80 hours. Which statement correctly distinguishes the two guidance frameworks?", "options": ["Both societies use 48 hours as the end of transition", "PES 48 means a plasma glucose threshold of 48 mg/dL", "CPS transitional threshold is defined through 72 hours; PES considers persistent-disorder evaluation after 48 hours", "CPS 72 means the required glucose is 72 mmol/L"], "answer": 2, "explanation": "The time boundaries serve different purposes and are not glucose values. Why not the others: A. Both societies use 48 hours as the end of transition — CPS uses a 72-hour transitional period.; B. PES 48 means a plasma glucose threshold of 48 mg/dL — The cited 48 is a time boundary, not concentration.; D. CPS 72 means the required glucose is 72 mmol/L — The number refers to hours of life, not glucose units.", "pearl": "The time boundaries serve different purposes and are not glucose values.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q8 — Neonatal hypoglycaemia — CPS 72 h versus PES 48 h"}}, {"num": 77, "level": "", "question": "A 9.5-kg child with complicated SAM is prescribed F-75 at 120 mL/kg/day in 12 equal feeds. What total daily volume is prescribed?", "options": ["120 mL/day", "95 mL/day", "1440 mL/day", "1140 mL/day"], "answer": 3, "explanation": "9.5 × 120 = 1140 mL/day; divide by 12 only to obtain per-feed volume. Why not the others: A. 120 mL/day — Confuses weight-adjusted volume with unit rate.; B. 95 mL/day — This is the volume per feed, not per day.; C. 1440 mL/day — Incorrectly multiplies feed count into total prescription.", "pearl": "9.5 × 120 = 1140 mL/day; divide by 12 only to obtain per-feed volume.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 14 Q30 — Complicated SAM — F-75 daily feed volume"}}, {"num": 78, "level": "", "question": "A neonate develops cataracts but minimal hepatic disease; galactose exposure is present. Which enzyme defect best fits?", "options": ["Fructokinase deficiency", "GALT deficiency", "Galactokinase (GALK1) deficiency", "Aldolase B deficiency"], "answer": 2, "explanation": "Galactitol-associated cataracts with limited systemic illness favor GALK1 deficiency. Why not the others: A. Fructokinase deficiency — Essential fructosuria is usually benign without infantile cataracts.; B. GALT deficiency — Classic galactosemia often causes severe hepatic/systemic disease.; D. Aldolase B deficiency — Hereditary fructose intolerance follows fructose/sucrose exposure.", "pearl": "Galactitol-associated cataracts with limited systemic illness favor GALK1 deficiency.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase versus GALT versus hereditary fructose intolerance"}}, {"num": 79, "level": "", "question": "A fasting 2-year-old has hypoketotic hypoglycemia and elevated C8 acylcarnitine. Which defect?", "options": ["MSUD", "VLCAD deficiency", "Propionic acidemia", "MCAD deficiency"], "answer": 3, "explanation": "C8 octanoylcarnitine is a hallmark of ACADM-related MCAD deficiency. Why not the others: A. MSUD — Alloisoleucine and branched-chain amino acids are key.; B. VLCAD deficiency — Often shows C14:1 elevation.; C. Propionic acidemia — Typically C3 propionylcarnitine elevation with metabolic acidosis.", "pearl": "C8 octanoylcarnitine is a hallmark of ACADM-related MCAD deficiency.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD deficiency — C8 acylcarnitine"}}, {"num": 80, "level": "", "question": "During inspiration a healthy schoolchild's A2–P2 interval widens; during expiration it narrows. What is this?", "options": ["Paradoxical splitting", "Physiological respiratory splitting of S2", "Single S2 due to severe pulmonary hypertension", "Fixed splitting due to ASD"], "answer": 1, "explanation": "Inspiration delays P2 relative to A2. Why not the others: A. Paradoxical splitting — Wider in expiration, not inspiration.; C. Single S2 due to severe pulmonary hypertension — No split would be appreciable.; D. Fixed splitting due to ASD — Little respiratory variation is the discriminator.", "pearl": "Inspiration delays P2 relative to A2.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 16 Q41 — Physiological versus fixed S2 splitting"}}, {"num": 81, "level": "", "question": "A cyanotic neonate has obstructed infracardiac TAPVC and severe pulmonary edema. What is the priority?", "options": ["Routine PGE1 as definitive treatment", "Urgent specialist surgical relief of pulmonary venous obstruction", "Wait for spontaneous improvement of pulmonary veins", "Elective balloon mitral valvotomy"], "answer": 1, "explanation": "Ductal patency does not relieve obstructed venous drainage. Why not the others: A. Routine PGE1 as definitive treatment — May worsen pulmonary congestion and does not correct obstruction.; C. Wait for spontaneous improvement of pulmonary veins — Obstructed TAPVC is a surgical emergency.; D. Elective balloon mitral valvotomy — Mitral valve is not the obstructed structure.", "pearl": "Ductal patency does not relieve obstructed venous drainage.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 16 Q74 — Obstructed infracardiac TAPVC"}}, {"num": 82, "level": "", "question": "A child develops acute chest pain and pericardial effusion weeks after ASD device closure. Which complication requires urgent exclusion?", "options": ["Device erosion", "Isolated residual trivial shunt", "Benign postprocedure murmur", "Physiologic S2 splitting"], "answer": 0, "explanation": "Rare erosion can cause pericardial effusion/tamponade and requires urgent echo and specialist assessment. Why not the others: B. Isolated residual trivial shunt — Does not typically explain acute hemopericardium.; C. Benign postprocedure murmur — Does not explain chest pain with effusion.; D. Physiologic S2 splitting — Unrelated to acute pericardial fluid.", "pearl": "Rare erosion can cause pericardial effusion/tamponade and requires urgent echo and specialist assessment.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 17 Q17 — ASD device erosion"}}, {"num": 83, "level": "", "question": "Which ventricular septal defect anatomical subtype is most common overall, despite many muscular defects closing spontaneously?", "options": ["Perimembranous VSD", "Subarterial outlet VSD", "Apical muscular VSD", "Inlet VSD"], "answer": 0, "explanation": "Most commonly encountered anatomical category in typical series. Why not the others: B. Subarterial outlet VSD — Less frequent and has specific aortic cusp risk.; C. Apical muscular VSD — Can close but is not the most prevalent overall.; D. Inlet VSD — Often associated with AV canal anatomy but less common overall.", "pearl": "Most commonly encountered anatomical category in typical series.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 17 Q22 — Common VSD anatomy"}}, {"num": 84, "level": "", "question": "On angiography a PDA has a conical shape with narrow pulmonary end. What Krichenko type?", "options": ["Type A", "Type D", "Type C", "Type B"], "answer": 0, "explanation": "Type A denotes conical ductus, commonly encountered. Why not the others: B. Type D — Complex duct with multiple constrictions.; C. Type C — Tubular morphology rather than conical.; D. Type B — Window-like morphology rather than conical.", "pearl": "Type A denotes conical ductus, commonly encountered.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 17 Q44 — Krichenko PDA classification"}}, {"num": 85, "level": "", "question": "An AVSD has an elongated narrowed LVOT and anteriorly positioned unwedged aorta. What produces the classic gooseneck appearance?", "options": ["Subpulmonary VSD alone", "Primary mitral rheumatic stenosis", "Isolated valvar pulmonary stenosis", "Abnormal AV junction and unwedged aorta elongating LVOT"], "answer": 3, "explanation": "The AVSD architecture reshapes the LV outflow tract. Why not the others: A. Subpulmonary VSD alone — Does not explain the elongated LVOT anatomy.; B. Primary mitral rheumatic stenosis — Not the congenital AVSD mechanism.; C. Isolated valvar pulmonary stenosis — RV outflow obstruction does not create gooseneck LVOT.", "pearl": "The AVSD architecture reshapes the LV outflow tract.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 17 Q56 — AVSD gooseneck LVOT"}}, {"num": 86, "level": "", "question": "Echo shows primum ASD, a small restrictive inlet VSD and two separate AV valve orifices. Classify the lesion.", "options": ["Partial AVSD", "Complete AVSD", "Intermediate/transitional AVSD", "Isolated secundum ASD"], "answer": 2, "explanation": "Two separate AV orifices plus small inlet VSD define transitional anatomy. Why not the others: A. Partial AVSD — Partial AVSD lacks an interventricular communication.; B. Complete AVSD — Complete AVSD has a common AV valve orifice.; D. Isolated secundum ASD — Does not involve primum septum and inlet VSD.", "pearl": "Two separate AV orifices plus small inlet VSD define transitional anatomy.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 17 Q58 — Transitional AVSD"}}, {"num": 87, "level": "", "question": "A small infant with severe TOF-associated RVOTO has recurrent cyanotic spells and is unsuitable for immediate complete repair. Which catheter option may palliate after anatomical review?", "options": ["ASD device closure", "RVOT stenting", "Pulmonary vein stenting", "Balloon mitral valvotomy"], "answer": 1, "explanation": "Selected infants can receive RVOT stents to augment pulmonary blood flow. Why not the others: A. ASD device closure — Could worsen mixing and does not address RVOTO.; C. Pulmonary vein stenting — Does not relieve the RV outflow obstruction.; D. Balloon mitral valvotomy — Treats mitral stenosis, not RVOTO.", "pearl": "Selected infants can receive RVOT stents to augment pulmonary blood flow.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 18 Q33 — TOF RVOT palliation"}}];
const NB_CTX={srcId:'Day27',label:'Day 27',set:'Quiz 5',href:'Day27/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day27_QuizSet5_Q71-87_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 27 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 71–87</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 27 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 27'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 27');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day27:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
