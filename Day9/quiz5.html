<script>
const quiz=[{"num": 65, "level": "High-Difficulty", "question": "[High-Difficulty] A PPHN infant has PaO₂ 50 mmHg, FiO₂ 0.8 and MAP 15 cmH₂O. What is the OI, and what does it imply?", "options": ["OI = 30: refer for ECMO now", "OI = 12: mild disease, so wean support", "OI = 6: no escalation needed", "OI = 24: severe disease; consider iNO in an eligible infant after lung optimisation"], "answer": 3, "explanation": "OI = 0.8 × 15 × 100 / 50 = 24; this falls in the range where iNO is considered after optimisation. Closest distractor: Always use FiO₂ as a fraction and keep units consistent. Why not the others: A. OI = 30: refer for ECMO now — Overstates the calculated value; ECMO consideration is generally later.; B. OI = 12: mild disease, so wean support — Results from using a PaO₂ twice the stated value; it understates severity.; C. OI = 6: no escalation needed — Results from a decimal slip; it understates severity.", "pearl": "OI 24 = severe; consider iNO.", "srcAnswer": "D"}, {"num": 66, "level": "High-Difficulty", "question": "[High-Difficulty] Which echo combination most strongly supports high pulmonary artery pressure in PPHN?", "options": ["TR-derived RV pressure estimate + septal flattening + R→L/bidirectional fetal shunts", "A small L→R PDA only", "Normal septal shape with a low TR velocity", "LA:Ao 1.7 alone"], "answer": 0, "explanation": "Convergent clues — TR-derived RV pressure, septal flattening and R→L/bidirectional fetal shunts — most strongly support high pulmonary pressure. Closest distractor: Combine independent echo clues rather than relying on a single marker. Why not the others: B. A small L→R PDA only — Implies lower pulmonary than systemic pressure.; C. Normal septal shape with a low TR velocity — Suggests low RV pressure.; D. LA:Ao 1.7 alone — A left-heart volume-load marker, not a pulmonary pressure marker.", "pearl": "TR + septum + shunt direction.", "srcAnswer": "A"}, {"num": 67, "level": "High-Difficulty", "question": "[High-Difficulty] A 28-week infant has hsPDA and is on hydrocortisone. Which historical drug-interaction concern is important when considering indomethacin?", "options": ["Steroids prevent NSAID-related GI bleeding", "Hydrocortisone makes indomethacin ineffective", "Higher intestinal perforation risk with concomitant early steroids/indomethacin in very preterm infants", "Steroids reduce NSAID renal toxicity"], "answer": 2, "explanation": "Concomitant early corticosteroids with indomethacin have been associated with a higher risk of spontaneous intestinal perforation in very preterm infants. Closest distractor: Weigh timing of steroids and NSAIDs in extremely preterm infants. Why not the others: A. Steroids prevent NSAID-related GI bleeding — They do not; the combination is a perforation risk.; B. Hydrocortisone makes indomethacin ineffective — The key concern is safety, not efficacy.; D. Steroids reduce NSAID renal toxicity — They do not; the combination raises GI risk.", "pearl": "Early steroids + indomethacin → perforation risk.", "srcAnswer": "C"}, {"num": 68, "level": "High-Difficulty", "question": "[High-Difficulty] A PPHN infant is ventilated with very high pressures despite relatively recruitable lung. Which hemodynamic consequence can perpetuate hypoxemia?", "options": ["Alveolar overdistension compresses pulmonary vessels and raises PVR", "High pressure always lowers PVR by opening vessels", "Excess pressure forces L→R ductal flow", "It reduces RV afterload by compressing the RV"], "answer": 0, "explanation": "Excess airway pressure overdistends alveoli, compresses pulmonary vessels and raises PVR, perpetuating hypoxemia. Closest distractor: Ventilation strategy is part of PH therapy. Why not the others: B. High pressure always lowers PVR by opening vessels — Only up to optimal volume; overdistension reverses the effect.; C. Excess pressure forces L→R ductal flow — It raises PVR, promoting R→L flow.; D. It reduces RV afterload by compressing the RV — Overinflation raises, not lowers, RV afterload.", "pearl": "Overdistension raises PVR.", "srcAnswer": "A"}, {"num": 69, "level": "High-Difficulty", "question": "[High-Difficulty] A preterm infant has a PDA and falling cerebral regional saturation. Which finding would strengthen a ductal-steal explanation?", "options": ["Improving renal perfusion", "Diastolic flow reversal in systemic arteries", "A small restrictive duct with no chamber loading", "Rising diastolic BP"], "answer": 1, "explanation": "Diastolic flow reversal in systemic arteries confirms ductal steal as a mechanism for falling cerebral oxygenation. Closest distractor: Correlate with Doppler and clinical burden. Why not the others: A. Improving renal perfusion — Steal worsens organ perfusion.; C. A small restrictive duct with no chamber loading — No steal is expected from a restrictive duct.; D. Rising diastolic BP — Steal lowers diastolic pressure.", "pearl": "Diastolic reversal supports steal.", "srcAnswer": "B"}, {"num": 70, "level": "High-Difficulty", "question": "[High-Difficulty] A term infant with HIE on therapeutic hypothermia develops hypoxemia. Echo shows PPHN with R→L ductal flow, RV dysfunction and bradycardia. Which consideration is specific to this setting?", "options": ["Give an NSAID for combined neuroprotection and duct closure", "Close the duct because R→L flow in HIE is harmful", "Cooling can raise PVR and lower heart rate and output, so optimise oxygenation, ventilation and perfusion and treat PH physiologically (iNO if eligible)", "Stop cooling and rewarm immediately in every case"], "answer": 2, "explanation": "Hypothermia increases PVR (via hypoxemia, acidosis and bradycardia) and lowers output; treat PH physiologically and review cooling in discussion with neonatology. Closest distractor: Avoid acidosis, hypoxemia and hyperventilation in cooled infants. Why not the others: A. Give an NSAID for combined neuroprotection and duct closure — NSAIDs do not provide neuroprotection and would be harmful here.; B. Close the duct because R→L flow in HIE is harmful — The duct decompresses the RV; closure would worsen it.; D. Stop cooling and rewarm immediately in every case — Cooling decisions are individualised; routine rewarming is not the answer.", "pearl": "HIE + cooling can precipitate PPHN.", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A neonate with rapidly rising unconjugated bilirubin has suspected G6PD deficiency. DAT is negative. Which interpretation is best?", "options": ["A negative DAT excludes hemolysis", "G6PD hemolysis is nonimmune, so DAT may be negative", "Exchange transfusion is never required in G6PD hemolysis", "G6PD deficiency causes only conjugated hyperbilirubinemia"], "answer": 1, "explanation": "G6PD hemolysis is nonimmune; DAT may be negative despite clinically important hemolysis. Closest distractor: ABO/Rh hemolysis is DAT-positive; G6PD hemolysis is nonimmune and may be DAT-negative. Why not the others: A. A negative DAT excludes hemolysis — Hemolysis can be nonimmune; a negative DAT does not exclude it.; C. Exchange transfusion is never required in G6PD hemolysis — Severe hyperbilirubinemia from G6PD hemolysis can require exchange transfusion.; D. G6PD deficiency causes only conjugated hyperbilirubinemia — It causes unconjugated hyperbilirubinemia from hemolysis.", "pearl": "G6PD hemolysis can be DAT-negative.", "srcAnswer": "B"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] Four preterm infants all have a PDA. Which is the best candidate for targeted pharmacological closure?", "options": ["28 weeks, day 3: 2.2 mm duct, no murmur, stable on CPAP, LA:Ao 1.2, forward diastolic flow", "26 weeks, day 6: 2.0 mm L→R duct, LA:Ao 1.8, descending-aortic diastolic reversal, rising ventilator need, platelets 190,000/µL and stable creatinine", "30 weeks, day 4: 1.6 mm duct, bounding pulses, stable in room air, normal LA", "27 weeks, day 5: large duct with active NEC, platelets 38,000/µL and creatinine 1.9 mg/dL"], "answer": 1, "explanation": "Only this infant has all of a consequential shunt (loading + steal + respiratory burden) and no NSAID contraindication. Closest distractor: Rank by burden and by safety, not by duct size. Why not the others: A. 28 weeks, day 3: 2.2 mm duct, no murmur, stable on CPAP, LA:Ao 1.2, forward diastolic flow — No burden or loading; observe.; C. 30 weeks, day 4: 1.6 mm duct, bounding pulses, stable in room air, normal LA — Clinical sign only, no echo or clinical burden; observe.; D. 27 weeks, day 5: large duct with active NEC, platelets 38,000/µL and creatinine 1.9 mg/dL — Significant physiology but NSAID contraindicated; needs an alternative approach.", "pearl": "Burden + safety → candidate for closure.", "srcAnswer": "B"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A term infant with MAS has preductal 94%, postductal 80%, pH 7.12, PaCO₂ 68, echo-confirmed suprasystemic RV pressure and RV dysfunction. Which sequence is best?", "options": ["Close the PDA first, then correct acidosis", "Start iNO first and delay ventilator adjustment", "Give saline boluses and a systemic vasodilator", "Optimize lung recruitment/ventilation and acidosis, support systemic/RV perfusion, then use selective pulmonary vasodilation as indicated"], "answer": 3, "explanation": "Sequence: optimise recruitment, ventilation and acidosis; support systemic/RV perfusion; then add selective pulmonary vasodilation as indicated. Closest distractor: Order of therapy matters. Why not the others: A. Close the PDA first, then correct acidosis — Closing the RV pop-off first would worsen RV failure.; B. Start iNO first and delay ventilator adjustment — iNO needs recruited lung and corrected acidosis to work.; C. Give saline boluses and a systemic vasodilator — Boluses distend the RV and non-selective vasodilation worsens shunt.", "pearl": "Lung and acid-base first, then iNO.", "srcAnswer": "D"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A cyanotic newborn has no pre/postductal gradient. Echo shows critical pulmonary stenosis with duct-dependent pulmonary blood flow through a L→R duct. Which action best distinguishes management from isolated PPHN?", "options": ["Start prostaglandin E1 to maintain ductal patency while arranging cardiac care", "Start iNO as definitive therapy", "Give indomethacin to promote systemic perfusion", "Surgically close the PDA"], "answer": 0, "explanation": "Pulmonary blood flow depends on the duct; PGE1 keeps it open until definitive intervention. High oxygen (which constricts the duct) is avoided. Closest distractor: Duct-dependent pulmonary flow arrives through a L→R duct, so no pre > post gradient is expected. Why not the others: B. Start iNO as definitive therapy — Pulmonary flow is limited by obstruction, not raised PVR.; C. Give indomethacin to promote systemic perfusion — Would close the duct and remove pulmonary blood flow.; D. Surgically close the PDA — Fatal; the duct is the only pulmonary flow source.", "pearl": "Duct-dependent lesion → PGE1.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A 25-week infant has a large PDA, creatinine 1.6 mg/dL, platelets 55,000/µL and active NEC. Which statement best integrates treatment risk?", "options": ["The physiology may be significant, but pharmacologic closure risk is high; stabilize and individualize timing/route with multidisciplinary reassessment", "Give indomethacin now because the echo is abnormal", "Ligation is automatically the safest option", "No PDA can ever be treated during a NICU stay"], "answer": 0, "explanation": "Physiology may justify treatment, but high drug risk (renal, platelet, NEC) means stabilising and individualising the timing and route through multidisciplinary review. Closest distractor: Alternatives include careful observation or specialist-led options. Why not the others: B. Give indomethacin now because the echo is abnormal — Creatinine 1.6, platelets 55,000 and NEC make NSAID use hazardous.; C. Ligation is automatically the safest option — Ligation carries post-ligation syndrome and surgical risk.; D. No PDA can ever be treated during a NICU stay — Wrong; treatment is selective, not forbidden.", "pearl": "Risk-benefit, not automatic therapy.", "srcAnswer": "A"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A PPHN infant on iNO has worsening pulmonary edema and echo now shows depressed LV function. Which explanation best integrates the change?", "options": ["The edema is iNO toxicity from methemoglobinemia", "Pulmonary edema proves the PDA is purely L→R, so withdraw iNO and start an NSAID", "iNO closed the ductus and redirected flow", "Lowering PVR increased pulmonary blood flow into a poorly accommodating LV; reassess LV support and pulmonary vasodilator strategy"], "answer": 3, "explanation": "Lowering PVR with iNO increased pulmonary blood flow into a poorly accommodating LV, causing pulmonary edema; reassess LV support and the vasodilator strategy. Closest distractor: Always re-echo after a clinical change on iNO. Why not the others: A. The edema is iNO toxicity from methemoglobinemia — Methemoglobinemia causes cyanosis, not pulmonary edema.; B. Pulmonary edema proves the PDA is purely L→R, so withdraw iNO and start an NSAID — Flawed logic and unsafe action.; C. iNO closed the ductus and redirected flow — iNO does not close the duct.", "pearl": "Fix the LV before pushing pulmonary vasodilation.", "srcAnswer": "D"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A preterm infant has hsPDA and later develops NEC. Which statement is most evidence-aware?", "options": ["PDA directly causes every NEC case", "PDA and systemic steal are associated with NEC risk, but association does not prove that routine early closure prevents NEC", "NEC excludes any hemodynamic role for PDA", "Routine early closure is proven to prevent NEC"], "answer": 1, "explanation": "PDA and systemic steal are associated with NEC, but association does not prove that routine early closure prevents NEC. Closest distractor: Evidence-aware statements avoid both extremes. Why not the others: A. PDA directly causes every NEC case — Association is not causation.; C. NEC excludes any hemodynamic role for PDA — Does not follow; a role may exist.; D. Routine early closure is proven to prevent NEC — Not proven.", "pearl": "Association ≠ proven prevention.", "srcAnswer": "B"}, {"num": 78, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A PPHN infant's OI has risen from 25 to 32 over 6 hours despite optimised ventilation, iNO, corrected acidosis and vasoactive support. The unit cannot offer ECMO. What is the best next systems-level action?", "options": ["Stop iNO abruptly to test dependence", "Wait until the OI exceeds 40 before calling", "Contact an ECMO-capable centre now and organise transfer while continuing stabilisation, if gestation, weight and contraindications allow", "Give an NSAID to close the PDA and reduce RV load"], "answer": 2, "explanation": "A rising OI despite full therapy warrants early referral; waiting for catastrophic collapse makes transfer unsafe. Closest distractor: Referral thresholds are centre-specific; many accept calls at OI 25–30. Why not the others: A. Stop iNO abruptly to test dependence — Abrupt withdrawal risks rebound PH.; B. Wait until the OI exceeds 40 before calling — Late referral risks collapse during transfer.; D. Give an NSAID to close the PDA and reduce RV load — The duct decompresses the RV; closure would worsen it.", "pearl": "Refer early, transfer stable.", "srcAnswer": "C"}, {"num": 79, "level": "Integrated/Rank-Differentiating", "question": "[Integrated/Rank-Differentiating] A 27-week infant after PDA closure becomes hypotensive with poor LV output. Which paired explanation and response is best?", "options": ["Recurrent PPHN; start iNO", "Post-closure rise in LV afterload with limited myocardial reserve; reassess echo-guided preload/inotropy/afterload support", "Residual large L→R shunt; repeat the NSAID course", "Hypovolemia from third-spacing; give repeated 20 mL/kg boluses"], "answer": 1, "explanation": "After PDA closure, the LV faces abruptly higher afterload with limited reserve; reassess by echo and tailor preload, inotropy and afterload support. Closest distractor: Milrinone-based afterload reduction is commonly used. Why not the others: A. Recurrent PPHN; start iNO — Post-closure LV failure is not PPHN, and iNO could worsen pulmonary edema.; C. Residual large L→R shunt; repeat the NSAID course — A closed duct has no residual flow.; D. Hypovolemia from third-spacing; give repeated 20 mL/kg boluses — Volume strains an afterload-stressed LV; check echo first.", "pearl": "Post-closure → think LV afterload mismatch.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day9',label:'Day 9',set:'Quiz 5',href:'Day9/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day9_QuizSet5_Q65-79_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 9 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 65–79</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 9'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 9');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day9:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=4041b023"></script></body></html>
