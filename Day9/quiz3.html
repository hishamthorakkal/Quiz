<script>
const quiz=[{"num": 33, "level": "Clinical/Application", "question": "[Clinical/Application] A PPHN infant becomes more hypoxemic during agitation and handling. Best immediate principle?", "options": ["Reduce FiO₂ to avoid oxygen toxicity until the infant settles", "Increase stimulation to improve respiratory drive", "Give a fluid bolus because handling-related desaturation reflects hypovolemia", "Minimize stress, optimize sedation/comfort and correct triggers that raise PVR"], "answer": 3, "explanation": "Handling and agitation raise catecholamines and PVR; minimising stress, with adequate sedation/comfort, and treating triggers helps lower PVR. Closest distractor: Minimal handling, clustered care and analgesia/sedation as needed are standard. Why not the others: A. Reduce FiO₂ to avoid oxygen toxicity until the infant settles — Hypoxemia is a potent pulmonary vasoconstrictor; withdrawing oxygen worsens PPHN.; B. Increase stimulation to improve respiratory drive — Stimulation increases catecholamines and PVR and worsens R→L shunting.; C. Give a fluid bolus because handling-related desaturation reflects hypovolemia — Not the mechanism; volume does not treat PVR-driven shunting.", "pearl": "Calm infant, low PVR.", "srcAnswer": "D"}, {"num": 34, "level": "Clinical/Application", "question": "[Clinical/Application] A term infant with diaphragmatic hernia has severe pulmonary hypertension. Which statement about iNO is most accurate?", "options": ["iNO reliably improves survival and reduces ECMO need in CDH", "iNO should start before ventilatory stabilisation", "Overall iNO response in CDH is variable; a trial is most defensible with suprasystemic PH and adequate LV function after optimal lung recruitment", "CDH-related PH is purely functional, so lung hypoplasia is irrelevant"], "answer": 2, "explanation": "CDH-related PH combines pulmonary hypoplasia, vascular remodelling and often ventricular dysfunction, so iNO response is variable and management depends on lung and ventricular physiology. Closest distractor: Always check LV function and pulmonary venous pressures before escalating pulmonary vasodilation. Why not the others: A. iNO reliably improves survival and reduces ECMO need in CDH — Trials have not shown consistent benefit, and it may harm if LV dysfunction coexists.; B. iNO should start before ventilatory stabilisation — Gentle ventilation and lung/ventricular optimisation come first.; D. CDH-related PH is purely functional, so lung hypoplasia is irrelevant — Structural hypoplasia and vessel remodelling limit response.", "pearl": "CDH: variable iNO response; treat the lung and heart as well.", "srcAnswer": "C"}, {"num": 35, "level": "", "question": "At 36 weeks PMA, which respiratory support defines Jensen Grade 3 BPD?", "options": ["Nasal cannula ≤2 L/min", "Room air with tachypnea", "CPAP or NIPPV", "Invasive mechanical ventilation"], "answer": 3, "explanation": "Jensen Grade 3 BPD is defined by invasive mechanical ventilation at 36 weeks PMA. Closest distractor: Non-invasive support (CPAP/NIPPV) is Grade 2, not Grade 3. Why not the others: A. Nasal cannula ≤2 L/min — Low-flow cannula is Grade 1.; B. Room air with tachypnea — Not a respiratory-support grade; tachypnea in room air does not define BPD severity.; C. CPAP or NIPPV — Non-invasive positive airway pressure is Grade 2, not Grade 3.", "pearl": "Jensen Grade 3 = invasive ventilation at 36 weeks PMA.", "srcAnswer": "D"}, {"num": 36, "level": "Clinical/Application", "question": "[Clinical/Application] A 27-week infant has pulmonary hemorrhage with a large PDA and systemic steal markers. Which relationship is most plausible?", "options": ["High pulmonary blood flow from ductal shunt can contribute", "Pulmonary hemorrhage always reflects coagulopathy, never ductal flow", "Pulmonary hemorrhage is a feature of PDA closure, not of an open duct", "A large L→R PDA reduces pulmonary blood flow and protects against hemorrhage"], "answer": 0, "explanation": "High pulmonary blood flow through a large L→R PDA, with left-heart overload and often low diastolic pressure, contributes to pulmonary hemorrhage in extremely preterm infants. Closest distractor: Association with hsPDA does not mean closure prevents hemorrhage in every infant. Why not the others: B. Pulmonary hemorrhage always reflects coagulopathy, never ductal flow — Coagulopathy may contribute, but excessive pulmonary flow is an independent contributor.; C. Pulmonary hemorrhage is a feature of PDA closure, not of an open duct — Hemorrhage is linked to high pulmonary flow and left-heart load before closure.; D. A large L→R PDA reduces pulmonary blood flow and protects against hemorrhage — The opposite: it increases pulmonary blood flow.", "pearl": "Pulmonary hemorrhage + large PDA → consider overcirculation.", "srcAnswer": "A"}, {"num": 37, "level": "Clinical/Application", "question": "[Clinical/Application] A preterm infant has suspected hsPDA. Which combination best supports a consequential shunt?", "options": ["Raised BNP with a 1.3 mm duct and normal LA", "Respiratory burden + LA/LV volume load + systemic diastolic steal", "A duct ≥1.5 mm with forward diastolic flow and stable respiratory support", "Murmur, bounding pulses and wide pulse pressure"], "answer": 1, "explanation": "A consequential shunt is supported by the triad of respiratory burden, LA/LV volume load and systemic diastolic steal; no single sign is sufficient. Closest distractor: Look for concordance across lung, heart and systemic perfusion. Why not the others: A. Raised BNP with a 1.3 mm duct and normal LA — A biomarker with a small restrictive duct and no chamber loading does not define a consequential shunt.; C. A duct ≥1.5 mm with forward diastolic flow and stable respiratory support — Size alone without loading, steal or clinical burden is insufficient.; D. Murmur, bounding pulses and wide pulse pressure — Supportive clinical signs but poorly correlated with shunt volume; echo and organ effects are needed.", "pearl": "Integrated criteria beat single thresholds.", "srcAnswer": "B"}, {"num": 38, "level": "Clinical/Application", "question": "[Clinical/Application] A PPHN infant has severe parenchymal lung disease and poor response to iNO. What should be reassessed first?", "options": ["Lung recruitment, ventilation, acidosis and ventricular function", "Stop iNO and start a systemic vasodilator", "Escalate iNO to 80 ppm", "Add a NSAID to close the duct and reduce RV load"], "answer": 0, "explanation": "Poor iNO response in severe parenchymal disease first calls for reassessment of lung recruitment, ventilation, acidosis and ventricular function. Closest distractor: iNO works only in ventilated, recruited lung; if the lung is poorly recruited, response fails. Why not the others: B. Stop iNO and start a systemic vasodilator — Non-selective vasodilation worsens V/Q mismatch and shunting.; C. Escalate iNO to 80 ppm — Higher doses add toxicity (methemoglobin, NO₂) without added benefit.; D. Add a NSAID to close the duct and reduce RV load — Closing a decompressing duct without need can worsen RV failure.", "pearl": "Fix the lung and the heart before blaming the drug.", "srcAnswer": "A"}, {"num": 39, "level": "Clinical/Application", "question": "[Clinical/Application] A 26-week infant with a large hsPDA, feed intolerance and abdominal distension has been given repeated 20 mL/kg saline boluses for 'poor perfusion' despite a normal blood pressure. Why is this approach inappropriate?", "options": ["Boluses reduce pulmonary blood flow and so worsen steal", "Boluses are always contraindicated in NEC", "Boluses can directly reopen a closing duct", "Without documented hypovolemia, volume loads the left heart and worsens pulmonary overcirculation without correcting ductal steal"], "answer": 3, "explanation": "Fluid boluses add to left-heart load and pulmonary flow; reserved for true hypovolemia or sepsis, they do not treat steal. Closest distractor: The decision is physiological; reserve boluses for documented hypovolemia or sepsis. Why not the others: A. Boluses reduce pulmonary blood flow and so worsen steal — They increase, not reduce, pulmonary blood flow.; B. Boluses are always contraindicated in NEC — Not true; hypovolemia or septic NEC may need volume guided by physiology.; C. Boluses can directly reopen a closing duct — Volume does not reopen the duct; the issue is increased flow and loading.", "pearl": "Treat the cause of poor perfusion, not the number.", "srcAnswer": "D"}, {"num": 40, "level": "Clinical/Application", "question": "[Clinical/Application] A term infant with PPHN has pH 7.08 and severe hypercarbia. Why is correction important?", "options": ["Acidosis/hypercarbia can increase PVR", "Hypercarbia is a selective pulmonary vasodilator", "Acidosis closes the ductus and lowers RV pressure", "pH affects drug binding but not hemodynamics"], "answer": 0, "explanation": "Acidosis and hypercarbia raise PVR and depress contractility; correction (without hyperventilation or alkali infusion) helps lower PVR. Closest distractor: Target is normalising pH (around 7.30–7.45) by correcting the cause, not by aggressive hyperventilation. Why not the others: B. Hypercarbia is a selective pulmonary vasodilator — It is a pulmonary vasoconstrictor.; C. Acidosis closes the ductus and lowers RV pressure — Acidosis constricts pulmonary vessels, raising RV afterload.; D. pH affects drug binding but not hemodynamics — pH directly alters pulmonary vascular tone and myocardial function.", "pearl": "Correct acidosis and hypercarbia: they raise PVR.", "srcAnswer": "A"}, {"num": 41, "level": "Clinical/Application", "question": "[Clinical/Application] A 24-week infant has persistent symptomatic PDA after medical therapy. Which next step is most appropriate?", "options": ["Repeat NSAID courses indefinitely until closure", "Automatic ligation after any failed medical course", "Multidisciplinary reassessment for continued observation versus transcatheter/surgical closure based on anatomy, size and clinical burden", "Observe regardless of symptoms because later closure is never needed"], "answer": 2, "explanation": "Persistent symptomatic PDA after medical therapy merits a multidisciplinary decision on observation vs transcatheter/surgical closure based on anatomy, size and clinical burden. Closest distractor: Transcatheter closure is increasingly used for suitable infants, with specialised centre expertise. Why not the others: A. Repeat NSAID courses indefinitely until closure — Diminishing returns and cumulative renal/GI toxicity.; B. Automatic ligation after any failed medical course — Ligation should be selective; there is no automatic indication.; D. Observe regardless of symptoms because later closure is never needed — Persistent hsPDA with ongoing burden can warrant closure.", "pearl": "Failed medical therapy → individualised multidisciplinary decision.", "srcAnswer": "C"}, {"num": 42, "level": "Clinical/Application", "question": "[Clinical/Application] A neonate with PPHN has echo evidence of LV dysfunction and pulmonary venous hypertension. Why can pulmonary vasodilation require caution?", "options": ["iNO improves LV function by reducing preload", "Pulmonary vasodilator dose should be doubled to offset the edema", "Lowering PVR always reduces pulmonary venous pressure", "Increasing pulmonary blood flow into a failing LV can worsen pulmonary edema"], "answer": 3, "explanation": "With LV dysfunction and pulmonary venous hypertension, vasodilating the lungs raises pulmonary blood flow into a failing LV and can precipitate pulmonary edema. Closest distractor: Echo should check LV function before and after iNO. Why not the others: A. iNO improves LV function by reducing preload — iNO does not improve LV function; by raising LV preload it may worsen failure.; B. Pulmonary vasodilator dose should be doubled to offset the edema — Escalation worsens flow into the failing LV; support the LV first.; C. Lowering PVR always reduces pulmonary venous pressure — With a failing LV, extra flow raises left atrial and pulmonary venous pressure.", "pearl": "LV failure + PH: caution with pulmonary vasodilators.", "srcAnswer": "D"}, {"num": 43, "level": "Clinical/Application", "question": "[Clinical/Application] A preterm infant receives ibuprofen for PDA. Which monitoring set is most relevant?", "options": ["Serum bilirubin alone", "Thyroid function and serum ammonia", "Renal function, urine output, platelets/bleeding and GI status", "Hepatic transaminases as the principal toxicity"], "answer": 2, "explanation": "COX inhibitors affect renal perfusion, platelets and the gut, so monitor renal function/urine output, platelets/bleeding and GI status. Closest distractor: Check creatinine, urine output, platelets and abdominal signs before and during therapy. Why not the others: A. Serum bilirubin alone — Ibuprofen can displace bilirubin, but renal, bleeding and GI risks are the principal monitoring points.; B. Thyroid function and serum ammonia — Not affected by COX inhibitors.; D. Hepatic transaminases as the principal toxicity — Hepatotoxicity is the main concern with paracetamol, not ibuprofen.", "pearl": "NSAID monitoring = kidney, platelets, gut.", "srcAnswer": "C"}, {"num": 44, "level": "Clinical/Application", "question": "[Clinical/Application] A newborn has differential cyanosis with lower postductal saturation. Which bedside action is correct?", "options": ["Compare two feet", "Measure right-hand and foot saturations simultaneously/closely in time", "Compare right hand with left hand", "Treat the left foot as preductal and the right foot as postductal"], "answer": 1, "explanation": "Preductal saturation is taken at the right hand and postductal at either foot, measured closely in time, to detect ductal R→L shunting. Closest distractor: Simultaneous or near-simultaneous readings avoid false gradients from transient changes. Why not the others: A. Compare two feet — Both are postductal and give no ductal information.; C. Compare right hand with left hand — Both are upper-limb sites with no reliable ductal information.; D. Treat the left foot as preductal and the right foot as postductal — Both feet are postductal.", "pearl": "Right hand versus foot.", "srcAnswer": "B"}, {"num": 45, "level": "Clinical/Application", "question": "[Clinical/Application] A PPHN infant on mechanical ventilation has atelectasis. Which strategy best supports pulmonary vascular transition?", "options": ["Permissive hypercapnia to pH 7.15 to reduce barotrauma", "Early extubation to CPAP to avoid ventilator injury", "Gentle recruitment to adequate lung volume while avoiding overdistension", "Maximal PEEP regardless of compliance"], "answer": 2, "explanation": "Recruit lung to optimal volume while avoiding overdistension; both atelectasis and overinflation raise PVR. Closest distractor: Use chest radiograph, compliance and oxygenation response to judge lung volume. Why not the others: A. Permissive hypercapnia to pH 7.15 to reduce barotrauma — Hypercapnic acidosis raises PVR and is undesirable in PPHN.; B. Early extubation to CPAP to avoid ventilator injury — Premature withdrawal risks atelectasis and hypoxemia, both of which raise PVR.; D. Maximal PEEP regardless of compliance — Overdistension raises PVR and impairs RV filling.", "pearl": "Recruit, do not overdistend.", "srcAnswer": "C"}, {"num": 46, "level": "Clinical/Application", "question": "[Clinical/Application] A preterm infant with PDA has worsening pulmonary edema. Which mechanism is primary?", "options": ["Excess pulmonary blood flow from L→R shunt", "Systemic vasoconstriction raising LV afterload", "RV failure from raised RV afterload", "Obstructed pulmonary venous drainage"], "answer": 0, "explanation": "A large L→R ductal shunt drives excess pulmonary blood flow, raising pulmonary capillary pressure and edema. Closest distractor: Pulmonary edema from PDA has high pulmonary flow; from LV failure it has high left atrial pressure. Why not the others: B. Systemic vasoconstriction raising LV afterload — Does not explain edema from a L→R duct.; C. RV failure from raised RV afterload — This is the mechanism in PPHN/PH, not in L→R PDA.; D. Obstructed pulmonary venous drainage — A structural lesion; not part of PDA physiology.", "pearl": "L→R PDA → pulmonary overcirculation → edema.", "srcAnswer": "A"}, {"num": 47, "level": "Clinical/Application", "question": "[Clinical/Application] A term infant has severe hypoxemia. Echo shows right-to-left ductal flow, suprasystemic RV pressure and structurally normal heart. Which diagnosis is most consistent?", "options": ["Isolated hsPDA with L→R shunt", "PPHN", "Critical coarctation with ductal R→L flow", "Obstructed TAPVC"], "answer": 1, "explanation": "R→L ductal flow with suprasystemic RV pressure in a structurally normal heart defines PPHN. Closest distractor: PPHN is diagnosed after structural disease is excluded. Why not the others: A. Isolated hsPDA with L→R shunt — Flow direction here is R→L, so it is not a L→R shunt.; C. Critical coarctation with ductal R→L flow — Echo has shown a structurally normal heart, so coarctation is excluded.; D. Obstructed TAPVC — A structural lesion; echo shows a normal heart.", "pearl": "R→L duct + suprasystemic RV + normal anatomy = PPHN.", "srcAnswer": "B"}, {"num": 48, "level": "Clinical/Application", "question": "[Clinical/Application] A preterm infant has no murmur but echo shows a large unrestrictive PDA with high pulmonary pressure. Why may the murmur be soft?", "options": ["A soft murmur shows the duct has begun to close", "Murmur intensity is directly proportional to duct diameter", "Large ducts never cause murmurs", "A small pressure gradient across a large duct can generate less turbulence"], "answer": 3, "explanation": "A large unrestrictive duct with high pulmonary pressure equalises aortic and pulmonary pressures, so little turbulence and a soft or absent murmur result. Closest distractor: Do not use murmur loudness to judge shunt size. Why not the others: A. A soft murmur shows the duct has begun to close — Pressure equalisation, not closure, explains it.; B. Murmur intensity is directly proportional to duct diameter — Intensity depends on gradient and turbulence, not diameter alone.; C. Large ducts never cause murmurs — Many do; murmur depends on the pressure gradient across the duct.", "pearl": "Quiet duct ≠ small duct.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day9',label:'Day 9',set:'Quiz 3',href:'Day9/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day9_QuizSet3_Q33-48_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 9 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–48</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 9'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 9');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day9:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=4041b023"></script></body></html>
