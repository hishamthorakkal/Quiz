<script>
const quiz=[{"num": 17, "level": "Conceptual", "question": "Why is PaO₂ often labile in PPHN?", "options": ["Dynamic PVR and extrapulmonary shunting can change rapidly", "Pulse oximeter drift in ventilated infants", "A fixed anatomical shunt that makes PaO₂ track FiO₂ linearly", "Surfactant deficiency causing oscillating atelectasis in every term infant"], "answer": 0, "explanation": "Changes in PVR, SVR, ventilation and agitation alter right-to-left shunting rapidly. Closest distractor: Cyanotic CHD may be less labile, but echo is needed for distinction. Why not the others: B. Pulse oximeter drift in ventilated infants — An artefact explanation; arterial PaO₂ is itself labile in PPHN.; C. A fixed anatomical shunt that makes PaO₂ track FiO₂ linearly — A fixed shunt is relatively unresponsive to FiO₂, not labile; PPHN is a dynamic shunt.; D. Surfactant deficiency causing oscillating atelectasis in every term infant — Not universal and not the mechanism; lability reflects reactive pulmonary vascular tone.", "pearl": "Labile oxygenation reflects a labile shunt.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "What is the oxygenation index (OI) conceptually intended to quantify?", "options": ["Pulmonary vascular resistance directly", "Adequacy of CO₂ clearance", "The fraction of cardiac output shunted right-to-left", "Severity of hypoxemic respiratory failure relative to mean airway pressure and FiO₂"], "answer": 3, "explanation": "OI integrates FiO₂, mean airway pressure and PaO₂ to express severity of oxygenation failure. Closest distractor: SpO₂-based indices are useful when arterial gases are unavailable but are not identical to OI. Why not the others: A. Pulmonary vascular resistance directly — OI is a gas-exchange index. PVR needs echo or catheter estimates.; B. Adequacy of CO₂ clearance — OI contains no PaCO₂ term; ventilation indices address CO₂.; C. The fraction of cardiac output shunted right-to-left — Shunt fraction needs separate measurement; OI correlates with, but does not equal, it.", "pearl": "OI = ventilatory support burden relative to arterial oxygenation.", "srcAnswer": "D"}, {"num": 19, "level": "Conceptual", "question": "Why can excessive mean airway pressure worsen PPHN hemodynamics?", "options": ["Overdistension can raise PVR and impair venous return", "High MAP always recruits atelectatic lung and therefore always lowers PVR", "MAP improves pulmonary artery compliance and lowers RV afterload", "MAP stimulates endogenous nitric oxide synthesis"], "answer": 0, "explanation": "Both atelectasis and overdistension raise PVR; optimal lung recruitment aims for the middle ground. Closest distractor: More pressure is not always more pulmonary vasodilation. Why not the others: B. High MAP always recruits atelectatic lung and therefore always lowers PVR — Only up to optimal lung volume; beyond that, overdistension raises PVR.; C. MAP improves pulmonary artery compliance and lowers RV afterload — Excess MAP does the opposite by compressing alveolar vessels.; D. MAP stimulates endogenous nitric oxide synthesis — No such effect; this is not a mechanism of ventilator-induced pulmonary vasodilation.", "pearl": "Recruit, do not overdistend.", "srcAnswer": "A"}, {"num": 20, "level": "Conceptual", "question": "What is the main reason echocardiography is essential before labeling severe hypoxemia as PPHN?", "options": ["To exclude structural congenital heart disease and define shunt/ventricular function", "To calculate the OI non-invasively", "A pre/postductal gradient is specific for PPHN, so echo adds little", "The TR jet alone is diagnostic, so echo is only for confirming RV pressure"], "answer": 0, "explanation": "Echo distinguishes PPHN physiology from structural lesions and evaluates RV/LV function and shunt direction. Closest distractor: Differential saturation alone cannot exclude CHD. Why not the others: B. To calculate the OI non-invasively — OI needs MAP, FiO₂ and PaO₂; echo does not provide it.; C. A pre/postductal gradient is specific for PPHN, so echo adds little — Cyanotic and duct-dependent CHD also produce differential saturation.; D. The TR jet alone is diagnostic, so echo is only for confirming RV pressure — A TR jet cannot exclude CHD or define shunts and ventricular function.", "pearl": "PPHN is a physiologic diagnosis after structural assessment.", "srcAnswer": "A"}, {"num": 21, "level": "Conceptual", "question": "Why is routine early PDA closure no longer favored for every preterm infant with an open ductus?", "options": ["Because the duct closes spontaneously in every infant by 7 days", "Because COX inhibitors have been shown not to close the duct", "Because surgical ligation is now first-line for all preterm infants", "Randomized trials show no long-term benefit from routine early treatment, and many ducts close spontaneously"], "answer": 3, "explanation": "Current evidence supports a selective, physiology-guided approach rather than treating ductal patency alone. Closest distractor: Drug efficacy for closure does not equal proven improvement in BPD, death or neurodevelopment. Why not the others: A. Because the duct closes spontaneously in every infant by 7 days — Not true in extremely preterm infants; many closures are spontaneous, but not all or on a fixed day.; B. Because COX inhibitors have been shown not to close the duct — They do close ducts in many infants; the concern is that closure has not improved death, BPD or neurodevelopment.; C. Because surgical ligation is now first-line for all preterm infants — Ligation is reserved for selected refractory cases and has recognised harms.", "pearl": "Treat the infant and hemodynamics, not the echo label alone.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical/Application", "question": "A 26-week infant on day 5 has rising oxygen need, bounding pulses, low diastolic BP and pulmonary edema. Echo shows a 2.0-mm PDA, LA:Ao 1.7 and descending-aortic diastolic flow reversal. Best interpretation?", "options": ["PPHN with a predominantly right-to-left shunt", "Incidental PDA without hemodynamic effect", "Hemodynamically important left-to-right ductal shunt", "Critical coarctation already proven by echo"], "answer": 2, "explanation": "Respiratory burden (rising O₂, pulmonary edema), left-heart volume load (LA:Ao 1.7), systemic steal (low diastolic BP, diastolic flow reversal) and bounding pulses form a complete hsPDA phenotype. Closest distractor: Duct size of 2.0 mm alone would not prove significance; it is the combination with chamber loading, steal and clinical burden that does. Why not the others: A. PPHN with a predominantly right-to-left shunt — Pulmonary edema, LA enlargement and L→R flow with diastolic steal are the reverse of PPHN physiology.; B. Incidental PDA without hemodynamic effect — Every domain (lung, left heart, systemic perfusion) is affected, so the duct is clearly consequential.; D. Critical coarctation already proven by echo — Coarctation shows arch obstruction and weak femoral pulses; here the picture is runoff through an open duct.", "pearl": "hsPDA = respiratory burden + left-heart load + systemic steal.", "srcAnswer": "C"}, {"num": 23, "level": "Clinical/Application", "question": "A term infant with meconium aspiration has SpO₂ 97% right hand and 84% foot, labile hypoxemia and TR jet suggesting high RV pressure. Most likely physiology?", "options": ["Small left-to-right PDA", "PPHN with ductal right-to-left shunting", "Preductal coarctation of the aorta with a PDA", "Delayed normal transition"], "answer": 1, "explanation": "Preductal 97% vs postductal 84% with labile hypoxemia, MAS and a TR jet showing high RV pressure is the classic PPHN pattern with ductal right-to-left shunting. Closest distractor: Coarctation and PPHN can both give pre > post saturation; the clinical context and echo decide. Why not the others: A. Small left-to-right PDA — A L→R duct does not lower postductal saturation.; C. Preductal coarctation of the aorta with a PDA — Can also give pre > post gradients, but MAS, labile hypoxemia and high RV pressure favour PPHN; echo separates them.; D. Delayed normal transition — Normal transition gives small, transient differences; a 13-point gradient with labile hypoxemia is pathological.", "pearl": "MAS + pre > post SpO₂ + high TR-derived RV pressure = PPHN until proven otherwise.", "srcAnswer": "B", "img": "img/gen_diffsat_97_84.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 24, "level": "Clinical/Application", "question": "A cyanotic newborn has severe hypoxemia and weak femoral pulses. Before assuming PPHN, the most important next test is:", "options": ["Repeat four-limb blood pressures only", "Sepsis screen and blood gas only", "A hyperoxia test to separate cardiac from pulmonary disease", "Echocardiography"], "answer": 3, "explanation": "Weak femoral pulses with severe hypoxemia raise the possibility of left-sided obstruction or duct-dependent systemic flow, so urgent echo must precede any PPHN-directed therapy. Closest distractor: A PPHN label before echo risks missing duct-dependent CHD, where iNO or oxygen can be harmful. Why not the others: A. Repeat four-limb blood pressures only — A useful bedside clue, but it cannot define anatomy or shunt direction.; B. Sepsis screen and blood gas only — Sepsis may coexist, but nothing here explains weak femorals; structural disease must be excluded.; C. A hyperoxia test to separate cardiac from pulmonary disease — Cannot reliably exclude CHD and delays a definitive test; echo is available and decisive.", "pearl": "Weak femorals + cyanosis → echo before treating as PPHN.", "srcAnswer": "D"}, {"num": 25, "level": "Clinical/Application", "question": "A 25-week infant has an open PDA on echo but stable respiratory support, normal perfusion and no left-heart volume loading. Best immediate strategy?", "options": ["Pharmacological closure with ibuprofen despite stability", "Surgical ligation to prevent future BPD", "Transfer for transcatheter closure because the gestation is <26 weeks", "Expectant/conservative management with reassessment"], "answer": 3, "explanation": "A stable infant with no consequential shunt (no chamber loading, normal perfusion, stable respiratory support) is managed expectantly with serial reassessment. Closest distractor: 'Treat the echo' is the classic trap; the infant, not the duct, is the unit of decision. Why not the others: A. Pharmacological closure with ibuprofen despite stability — Treating a non-consequential duct has not improved outcomes and exposes the infant to renal, GI and platelet effects.; B. Surgical ligation to prevent future BPD — Ligation of a stable infant risks post-ligation syndrome without proven benefit.; C. Transfer for transcatheter closure because the gestation is <26 weeks — Transcatheter closure is for persistent hsPDA after failed medical therapy, not for a stable ELBW infant.", "pearl": "No burden, no closure: observe and reassess.", "srcAnswer": "D"}, {"num": 26, "level": "Clinical/Application", "question": "A preterm infant with hsPDA develops oliguria and rising creatinine. Which treatment consideration becomes especially relevant?", "options": ["Switch to indomethacin because it is less nephrotoxic than ibuprofen", "Give furosemide alone to correct the oliguria", "NSAID renal effects and current perfusion status", "Give a second NSAID course immediately to close the duct faster"], "answer": 2, "explanation": "COX inhibitors reduce renal prostaglandins, so oliguria and rising creatinine make renal risk and current perfusion central to the closure decision. Closest distractor: Oliguria is both a consequence of steal and a reason for caution with NSAIDs. Why not the others: A. Switch to indomethacin because it is less nephrotoxic than ibuprofen — Evidence suggests ibuprofen is generally less renal/mesenteric-constricting, not more; both reduce renal perfusion.; B. Give furosemide alone to correct the oliguria — The oliguria reflects steal/perfusion; loop diuretics can also raise PGE2 and impede ductal closure.; D. Give a second NSAID course immediately to close the duct faster — Rising creatinine signals harm; escalating the nephrotoxic drug worsens AKI.", "pearl": "Renal function and urine output are part of the closure decision, not an afterthought.", "srcAnswer": "C"}, {"num": 27, "level": "Clinical/Application", "question": "A term infant with PPHN remains hypoxemic despite adequate lung recruitment and ventilation. Echo confirms high pulmonary pressure with preserved LV function. Which targeted therapy is most appropriate in an eligible infant?", "options": ["Inhaled nitric oxide", "Intravenous sildenafil as the first-line agent", "Intravenous prostaglandin E1", "Sodium nitroprusside infusion"], "answer": 0, "explanation": "After lung optimisation, persistent hypoxemic respiratory failure with echo-confirmed pulmonary hypertension and preserved LV function is the indication for iNO in an eligible infant. Closest distractor: In settings without iNO, local protocols may use sildenafil or inhaled prostacyclin instead. Why not the others: B. Intravenous sildenafil as the first-line agent — A recognised adjunct or alternative where iNO is unavailable, but systemic vasodilation risks hypotension and iNO is the selective first-line option.; C. Intravenous prostaglandin E1 — PGE1 maintains ductal patency for duct-dependent CHD; it is not targeted PPHN therapy.; D. Sodium nitroprusside infusion — A non-selective vasodilator that lowers SVR and worsens V/Q matching and R→L shunting.", "pearl": "iNO = selective pulmonary vasodilator after lung recruitment.", "srcAnswer": "A"}, {"num": 28, "level": "Clinical/Application", "question": "A newborn with PPHN has systemic hypotension and poor perfusion. Which principle is best?", "options": ["Support systemic perfusion while treating high PVR; choose vasoactive therapy by ventricular physiology", "Raise SVR with a pure vasopressor regardless of ventricular function", "Ignore blood pressure if SpO₂ is acceptable", "Repeated large fluid boluses as sole therapy"], "answer": 0, "explanation": "PPHN with hypotension needs restoration of systemic pressure to reduce R→L shunting while lowering PVR; vasoactive choice depends on RV/LV function. Closest distractor: The goal is a favourable PVR:SVR relationship, not a particular pressure number. Why not the others: B. Raise SVR with a pure vasopressor regardless of ventricular function — Vasoconstriction without regard to RV/LV function can reduce output and raise pulmonary afterload.; C. Ignore blood pressure if SpO₂ is acceptable — Hypotension worsens R→L shunting and organ perfusion even when SpO₂ looks acceptable.; D. Repeated large fluid boluses as sole therapy — Excess volume dilates the RV, shifts the septum and worsens LV filling.", "pearl": "Support perfusion according to ventricular physiology.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical/Application", "question": "A preterm infant after PDA ligation acutely develops hypotension and escalating ventilator need. Most likely syndrome?", "options": ["Recurrent PPHN from loss of the ductal pop-off", "Late-onset sepsis", "Post-ligation cardiac syndrome", "Pulmonary hemorrhage from persistent overcirculation"], "answer": 2, "explanation": "Abrupt loss of low-resistance ductal runoff after ligation raises LV afterload in a poorly reserved myocardium, causing hypotension and rising ventilator need within hours. Closest distractor: Post-ligation syndrome typically appears 6–12 h after closure, and may call for inotropes or milrinone. Why not the others: A. Recurrent PPHN from loss of the ductal pop-off — PPHN is not the typical mechanism; the pattern is LV failure from afterload.; B. Late-onset sepsis — Possible in any NICU infant, but the post-operative timing and LV failure physiology point to the post-ligation syndrome.; D. Pulmonary hemorrhage from persistent overcirculation — Overcirculation falls after ligation, so this mechanism no longer applies.", "pearl": "Post-ligation cardiac syndrome = LV afterload mismatch.", "srcAnswer": "C"}, {"num": 30, "level": "Clinical/Application", "question": "A PPHN infant has marked RV dysfunction on echo. Which drug approach may be chosen to support contractility and systemic output, depending on blood pressure?", "options": ["A beta-blocker to reduce myocardial oxygen demand", "An inotrope or inodilator (such as dobutamine, epinephrine or milrinone), selected by blood pressure and ventricular function", "Prostaglandin E1 as the inotrope of choice", "A loop diuretic to unload the RV"], "answer": 1, "explanation": "RV dysfunction in PPHN reduces output; tailored inotropy/inodilation supports contractility, with the specific agent chosen by BP and LV status. Closest distractor: Dobutamine/epinephrine raise contractility; milrinone adds pulmonary and systemic vasodilation (watch hypotension). Why not the others: A. A beta-blocker to reduce myocardial oxygen demand — Negative inotropy worsens a failing RV and reduces output.; C. Prostaglandin E1 as the inotrope of choice — PGE1 is a ductal vasodilator, not a contractility agent; its use is for duct-dependent lesions.; D. A loop diuretic to unload the RV — Reduces preload and may lower output; it does not support contractility.", "pearl": "Match the drug to ventricular function and blood pressure.", "srcAnswer": "B"}, {"num": 31, "level": "Clinical/Application", "question": "A 30-week infant with PDA has a ductal diameter of 1.6 mm but no respiratory deterioration, normal LA size and forward systemic diastolic flow. What is the best conclusion?", "options": ["The duct is probably right-to-left because the infant is stable", "The diameter exceeds 1.5 mm, so treatment is mandated", "Hemodynamic significance is not established by diameter alone", "Surgical ligation is required because medical therapy will fail at this size"], "answer": 2, "explanation": "A 1.6 mm duct with normal LA, forward diastolic flow and no respiratory deterioration lacks chamber loading, steal and clinical burden, so diameter alone does not prove hemodynamic significance. Closest distractor: Size must be read together with body weight, flow pattern and clinical burden. Why not the others: A. The duct is probably right-to-left because the infant is stable — Stability tells nothing about shunt direction; direction needs Doppler.; B. The diameter exceeds 1.5 mm, so treatment is mandated — The 1.5 mm anchor is one parameter; it is not a stand-alone treatment mandate.; D. Surgical ligation is required because medical therapy will fail at this size — No burden exists to justify any closure, let alone surgery.", "pearl": "Diameter ≠ significance.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical/Application", "question": "A newborn has preductal SpO₂ 88% and postductal 89% with severe hypoxemia. Does the absent gradient exclude PPHN?", "options": ["Yes: if no murmur is heard", "Yes: if the chest radiograph is clear", "Yes: equal saturations prove a normal duct and a normal pulmonary circulation", "No; shunting may be predominantly atrial or mixing may minimize the gradient"], "answer": 3, "explanation": "Equal pre- and postductal SpO₂ show only the absence of ductal R→L mixing; atrial-level or intrapulmonary shunting can cause severe hypoxemia without a gradient. Closest distractor: Severe hypoxemia with equal saturations also demands echo for CHD and atrial shunt assessment. Why not the others: A. Yes: if no murmur is heard — A murmur is not required for PPHN; absence does not exclude it.; B. Yes: if the chest radiograph is clear — Oligemic/clear lung fields are typical of idiopathic PPHN and do not exclude it.; C. Yes: equal saturations prove a normal duct and a normal pulmonary circulation — They prove only that no R→L ductal mixing is present.", "pearl": "No gradient ≠ no PPHN.", "srcAnswer": "D"}];

 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}

// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day9_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 9 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 9 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 9'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 9');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day9:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
