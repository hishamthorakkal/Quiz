<script>
const quiz=[{"num": 49, "level": "Clinical/Application", "question": "A PPHN infant has OI rising despite optimized ventilation and iNO. What does this trend primarily signal?", "options": ["Improving oxygenation, so weaning can begin", "Resolution of PH permitting iNO withdrawal", "An adequate response, so continue unchanged therapy", "Escalating severity of hypoxemic respiratory failure and need for rescue/ECMO-center discussion where appropriate"], "answer": 3, "explanation": "A rising OI despite optimised ventilation and iNO signals escalating severity and the need for rescue/ECMO-centre discussion where appropriate. Closest distractor: Trend matters more than a single value. Why not the others: A. Improving oxygenation, so weaning can begin — A rising OI means worsening, not improving, oxygenation.; B. Resolution of PH permitting iNO withdrawal — OI trend shows persistent or worsening disease.; C. An adequate response, so continue unchanged therapy — A rising trajectory despite optimisation requires escalation planning.", "pearl": "Rising OI on full support → plan escalation early.", "srcAnswer": "D"}, {"num": 50, "level": "High-Difficulty", "question": "A 25-week infant has a 2.8 mm PDA. Doppler shows low-velocity (about 1 m/s), pulsatile left-to-right flow. Which interpretation is best?", "options": ["A pure right-to-left shunt from PPHN", "A duct closing spontaneously", "An unrestrictive duct with a small transductal pressure gradient; shunt volume then depends on duct size and the PVR:SVR relationship", "A restrictive duct with a small shunt"], "answer": 2, "explanation": "Low-velocity pulsatile L→R flow indicates a small transductal pressure gradient and an unrestrictive duct. It can permit a large shunt once PVR is sufficiently low, but velocity alone does not prove shunt volume; restrictive ducts typically show higher-velocity, more continuous flow. Closest distractor: Velocity and pattern reflect the pressure gradient; size without flow pattern is incomplete. Why not the others: A. A pure right-to-left shunt from PPHN — Doppler shows L→R flow, which excludes this.; B. A duct closing spontaneously — Closure shows shrinking size and high-velocity flow, not low-velocity pulsatile flow.; D. A restrictive duct with a small shunt — Restrictive ducts give high-velocity, continuous flow.", "pearl": "Low-velocity pulsatile ductal flow suggests an unrestrictive duct; quantify significance with chamber loading, systemic steal and clinical trajectory.", "srcAnswer": "C", "img": "img/gen_doppler_low_pulsatile.png", "imgCaption": "Generated radiograph-style teaching schematic — not a patient image."}, {"num": 51, "level": "High-Difficulty", "question": "A PPHN infant has preductal 95%, postductal 82%, systemic BP 42/25, severe RV dysfunction and a D-shaped LV. Which intervention principle is most appropriate?", "options": ["Immediate pharmacological closure to reduce pulmonary flow", "Treat PVR and support RV/systemic perfusion; avoid reflexive ductal closure", "Lower systemic BP with a vasodilator to unload the LV", "Aggressive volume loading to 60 mL/kg to raise preload"], "answer": 1, "explanation": "With R→L ductal flow, severe RV dysfunction and a D-shaped LV, the duct is acting as an RV pop-off; treat PVR and support RV/systemic perfusion rather than closing it. Closest distractor: A right-to-left duct in severe PH is neither harmful nor to be closed by reflex. Why not the others: A. Immediate pharmacological closure to reduce pulmonary flow — The duct decompresses the failing RV; closing it worsens RV failure.; C. Lower systemic BP with a vasodilator to unload the LV — Lower SVR increases the R→L shunt and impairs coronary perfusion.; D. Aggressive volume loading to 60 mL/kg to raise preload — Excess volume distends the RV and worsens septal shift and LV filling.", "pearl": "Ductal R→L flow may be protective in severe PH.", "srcAnswer": "B"}, {"num": 52, "level": "High-Difficulty", "question": "A 27-week infant has PDA with bidirectional flow on day 1 while PVR remains high. Which conclusion is safest?", "options": ["Flow direction must be interpreted in transitional pressure context; reassess before closure decisions", "Bidirectional flow means the duct is insignificant and can be ignored", "Bidirectional flow proves a pathological PDA that needs closure", "All bidirectional ducts represent PPHN needing iNO"], "answer": 0, "explanation": "Bidirectional ductal flow is common on day 1 while PVR is still falling; flow must be interpreted in the transitional pressure context and reassessed before decisions. Closest distractor: Direction changes with PVR; one early echo should not decide closure. Why not the others: B. Bidirectional flow means the duct is insignificant and can be ignored — It may be significant if it persists or shifts to a large L→R shunt; reassess.; C. Bidirectional flow proves a pathological PDA that needs closure — Day-1 bidirectional flow is a normal transitional finding in many preterm infants.; D. All bidirectional ducts represent PPHN needing iNO — Not all; PPHN needs high PVR, hypoxemia and RV pressure evidence.", "pearl": "Interpret flow direction in context, then reassess.", "srcAnswer": "A"}, {"num": 53, "level": "High-Difficulty", "question": "A term infant with PPHN has PaO₂ 45 mmHg on FiO₂ 1.0 with mean airway pressure 20 cmH₂O. What is the OI, and what does it imply?", "options": ["OI ≈ 9: mild disease, wean support", "OI ≈ 44: beyond the classic ECMO anchor of about 40, so urgent ECMO-centre discussion if eligible while optimisation continues", "OI ≈ 88: far beyond ECMO criteria, so support is futile", "OI ≈ 22: an iNO-candidate range only, ECMO not relevant"], "answer": 1, "explanation": "OI = FiO₂ × MAP × 100 / PaO₂ = 1.0 × 20 × 100 / 45 = 44.4. Persistent OI around 40 despite optimisation is the classic ECMO-severity anchor, with eligibility judged by the centre. Closest distractor: Calculation errors typically come from a misplaced decimal or from mixing mmHg with kPa. Why not the others: A. OI ≈ 9: mild disease, wean support — Results from dividing by 100 instead of multiplying (decimal slip); it understates severity.; C. OI ≈ 88: far beyond ECMO criteria, so support is futile — Overstates the value (multiplying PaO₂ by 2); a high OI warrants rescue planning, not futility.; D. OI ≈ 22: an iNO-candidate range only, ECMO not relevant — Results from using a PaO₂ twice the stated value; it understates severity.", "pearl": "OI 44 = severe; plan ECMO-centre discussion.", "srcAnswer": "B"}, {"num": 54, "level": "High-Difficulty", "question": "A term infant with PPHN has an OI persistently at or above 25 after lung recruitment, adequate BP and echo-confirmed pulmonary hypertension. Which step is most consistent with escalation logic?", "options": ["Immediate ECMO cannulation without further optimisation", "Close the PDA with a COX inhibitor to reduce RV load", "Start iNO in an eligible infant while continuing treatment of the underlying lung disease", "Stop positive-pressure ventilation to avoid overdistension"], "answer": 2, "explanation": "OI persistently ≥25 after lung optimisation with echo-confirmed PH in an eligible infant is the usual threshold for iNO; many protocols use 15–25 as the consideration range, so local protocol applies. Closest distractor: iNO starts after lung recruitment, not instead of it. Why not the others: A. Immediate ECMO cannulation without further optimisation — ECMO is for refractory disease after optimisation including iNO.; B. Close the PDA with a COX inhibitor to reduce RV load — The duct decompresses the RV; closure would worsen it.; D. Stop positive-pressure ventilation to avoid overdistension — Withdrawing support would worsen hypoxemia; the goal is optimal, not absent, recruitment.", "pearl": "OI ≥25 after optimisation → iNO if eligible.", "srcAnswer": "C"}, {"num": 55, "level": "", "question": "At 36 weeks PMA, Infant X is on nasal cannula 1 L/min, Infant Y on nasal CPAP and Infant Z on invasive ventilation. Which Jensen BPD grading is correct?", "options": ["X Grade 1, Y Grade 2, Z Grade 3", "X Grade 0, Y Grade 2, Z Grade 3", "X Grade 1, Y Grade 1, Z Grade 2", "X Grade 2, Y Grade 3, Z Grade 3"], "answer": 0, "explanation": "Jensen: Grade 1 = nasal cannula ≤2 L/min; Grade 2 = nasal cannula >2 L/min or non-invasive positive airway pressure (CPAP/NIPPV); Grade 3 = invasive mechanical ventilation. Closest distractor: Type of support, not FiO₂ alone, defines the grade. Why not the others: B. X Grade 0, Y Grade 2, Z Grade 3 — Low-flow cannula ≤2 L/min is Grade 1, not Grade 0.; C. X Grade 1, Y Grade 1, Z Grade 2 — Underestimates CPAP (Grade 2) and invasive ventilation (Grade 3).; D. X Grade 2, Y Grade 3, Z Grade 3 — CPAP is Grade 2; only invasive ventilation is Grade 3.", "pearl": "Jensen grades by support mode.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 5"}}, {"num": 56, "level": "High-Difficulty", "question": "A preterm infant has a large PDA but also suspected critical coarctation. Which action is unsafe before defining anatomy?", "options": ["Urgent echocardiography to define arch anatomy", "Empiric pharmacologic ductal closure", "Four-limb blood pressure and pulse assessment", "Assess systemic perfusion, lactate and urine output"], "answer": 1, "explanation": "Empiric ductal closure before anatomy is defined is unsafe when critical coarctation is possible, because the duct may be maintaining systemic flow. Closest distractor: This item asks for the UNSAFE action. Why not the others: A. Urgent echocardiography to define arch anatomy — A safe and essential step that defines the lesion and the duct's role.; C. Four-limb blood pressure and pulse assessment — A safe bedside clue to obstruction.; D. Assess systemic perfusion, lactate and urine output — A safe way to gauge duct-dependent systemic flow.", "pearl": "Define anatomy before closing the duct.", "srcAnswer": "B"}, {"num": 57, "level": "High-Difficulty", "question": "A PPHN infant on iNO improves, then deteriorates abruptly during rapid discontinuation. What is the mechanism and the best immediate action?", "options": ["Recurrent pulmonary hemorrhage; give surfactant", "Ductal closure syndrome; give prostaglandin E1", "Methemoglobinemia; give methylene blue", "Rebound pulmonary hypertension; resume iNO at the previous dose and wean more slowly (adjuncts such as sildenafil may help)"], "answer": 3, "explanation": "Abrupt iNO withdrawal suppresses endogenous NO and causes rebound pulmonary vasoconstriction; restart iNO and wean gradually. Closest distractor: Wean in small steps once FiO₂ and oxygenation are stable. Why not the others: A. Recurrent pulmonary hemorrhage; give surfactant — Not the pattern; the deterioration tracks withdrawal.; B. Ductal closure syndrome; give prostaglandin E1 — No such syndrome explains the timing, and PGE1 is not indicated.; C. Methemoglobinemia; give methylene blue — Methemoglobin rises during continued iNO, not on withdrawal.", "pearl": "Never stop iNO abruptly.", "srcAnswer": "D"}, {"num": 58, "level": "High-Difficulty", "question": "A 26-week infant with hsPDA has platelets 42,000/µL and active GI bleeding. Which closure strategy issue is most relevant?", "options": ["Add a second NSAID to enhance closure once bleeding settles", "Ibuprofen is mandatory because echo shows hsPDA", "Indomethacin is preferred because it spares platelets", "Platelet count and active GI bleeding are contraindication concerns, so closure should not be automatic"], "answer": 3, "explanation": "COX inhibitors impair platelet function and gut/renal perfusion; with thrombocytopenia and GI bleeding, risks must be weighed before treatment. Closest distractor: Alternatives or supportive care and multidisciplinary review may be needed. Why not the others: A. Add a second NSAID to enhance closure once bleeding settles — Combining NSAIDs compounds toxicity.; B. Ibuprofen is mandatory because echo shows hsPDA — No treatment is mandatory; contraindications change the decision.; C. Indomethacin is preferred because it spares platelets — Both NSAIDs affect platelet function and neither spares.", "pearl": "Contraindications can override an abnormal echo.", "srcAnswer": "D"}, {"num": 59, "level": "High-Difficulty", "question": "A newborn has severe hypoxemia, no pre/postductal gradient, and echo shows predominant right-to-left shunt at the PFO with little ductal shunt. Best interpretation?", "options": ["PPHN is excluded because there is no gradient", "PPHN remains possible despite absent saturation gradient", "Only cyanotic CHD can cause atrial R→L shunting", "The PDA must be closed to stop the atrial shunt"], "answer": 1, "explanation": "A predominant atrial-level R→L shunt with little ductal shunt gives no pre/postductal gradient; PPHN remains possible. Closest distractor: Echo is required to decide between PPHN and CHD. Why not the others: A. PPHN is excluded because there is no gradient — The gradient requires ductal R→L flow; atrial shunting avoids it.; C. Only cyanotic CHD can cause atrial R→L shunting — PPHN with raised right atrial pressure also shunts across the PFO.; D. The PDA must be closed to stop the atrial shunt — The duct is not the source here, and closure would not help.", "pearl": "No gradient does not exclude PPHN.", "srcAnswer": "B"}, {"num": 60, "level": "High-Difficulty", "question": "A PPHN infant has RV pressure overload but poor LV filling. Which mechanism can contribute?", "options": ["Septal shift and reduced pulmonary venous return impair LV preload", "Systemic hypertension with concentric LV hypertrophy", "PDA flow increases LV preload in PPHN", "High PVR directly increases pulmonary venous return"], "answer": 0, "explanation": "RV pressure overload shifts the septum leftwards and reduces pulmonary venous return, both limiting LV preload and filling. Closest distractor: Poor LV filling is a ventricular-interdependence and flow problem. Why not the others: B. Systemic hypertension with concentric LV hypertrophy — PPHN does not feature systemic hypertension or hypertrophy.; C. PDA flow increases LV preload in PPHN — In PPHN the duct shunts R→L, so it does not add LV preload.; D. High PVR directly increases pulmonary venous return — High PVR reduces pulmonary blood flow and venous return.", "pearl": "RV pressure load impairs LV filling.", "srcAnswer": "A"}, {"num": 61, "level": "High-Difficulty", "question": "A 24-week infant with PDA has LA:Ao 1.6 but normal descending-aortic diastolic flow and improving respiratory support. Which approach best reflects modern evidence?", "options": ["Use the composite trajectory; do not treat solely because LA:Ao exceeds a historical threshold", "LA:Ao ≥1.5 mandates closure regardless of the clinical course", "Echo is unnecessary; clinical signs should decide", "Immediate ligation because the LA is enlarged"], "answer": 0, "explanation": "Use the composite trajectory (clinical course, flow pattern, loading); a historical LA:Ao threshold alone does not mandate treatment. Closest distractor: Improving trajectory favours observation. Why not the others: B. LA:Ao ≥1.5 mandates closure regardless of the clinical course — Historical thresholds are not stand-alone mandates.; C. Echo is unnecessary; clinical signs should decide — Echo is essential for integrated assessment.; D. Immediate ligation because the LA is enlarged — Not justified when respiratory support is improving.", "pearl": "Trajectory beats threshold.", "srcAnswer": "A"}, {"num": 62, "level": "High-Difficulty", "question": "A term infant with PPHN and sepsis has systemic vasodilation. Which hemodynamic goal is most rational?", "options": ["Close all fetal shunts to prevent R→L flow", "Restore adequate systemic perfusion while reducing PVR and treating infection", "Maximise SVR regardless of cardiac output", "Allow permissive hypotension to reduce LV afterload"], "answer": 1, "explanation": "In PPHN with sepsis and vasodilation, restore adequate systemic perfusion, reduce PVR and treat infection. Closest distractor: Vasopressors (e.g., norepinephrine or vasopressin) help in vasodilatory states; choose by echo. Why not the others: A. Close all fetal shunts to prevent R→L flow — Closing shunts removes RV decompression and is not treatment.; C. Maximise SVR regardless of cardiac output — Excess vasoconstriction can reduce output and raise afterload.; D. Allow permissive hypotension to reduce LV afterload — Hypotension worsens R→L shunting and organ perfusion.", "pearl": "Treat sepsis, support SVR, lower PVR.", "srcAnswer": "B"}, {"num": 63, "level": "High-Difficulty", "question": "A PPHN infant with severe LV dysfunction and BP 40/20 mmHg on epinephrine needs added support. Which agent combines inotropy and pulmonary vasodilation but needs particular caution because systemic vasodilation can worsen hypotension?", "options": ["Vasopressin", "Norepinephrine", "Milrinone, avoiding or limiting the loading dose and ensuring adequate preload and pressure support", "Hydrocortisone"], "answer": 2, "explanation": "Milrinone is an inodilator that lowers PVR and SVR while improving contractility; systemic vasodilation can worsen hypotension, so loading doses are limited and pressors/volume are available. Closest distractor: Milrinone is long-acting with renal clearance; titrate carefully. Why not the others: A. Vasopressin — Raises SVR with little pulmonary effect; it is not an inodilator.; B. Norepinephrine — A vasopressor/inotrope, not a systemic vasodilator.; D. Hydrocortisone — Used for refractory hypotension; not an inodilator.", "pearl": "Milrinone: inotropy + vasodilation → watch BP.", "srcAnswer": "C"}, {"num": 64, "level": "High-Difficulty", "question": "A preterm infant after transcatheter PDA closure develops new LV dysfunction. Best physiologic explanation?", "options": ["A residual L→R shunt overloads the LV", "Contrast nephropathy from the procedure causes LV failure", "Abrupt loss of low-resistance ductal runoff increases LV afterload while pulmonary venous return changes", "Closure raises PVR, overloading the RV and secondarily the LV"], "answer": 2, "explanation": "Abrupt loss of the low-resistance ductal runoff raises LV afterload and changes pulmonary venous return, producing LV dysfunction in a limited-reserve myocardium. Closest distractor: Support with echo-guided afterload reduction and inotropy. Why not the others: A. A residual L→R shunt overloads the LV — After closure there is no residual flow; the problem is a loss of runoff.; B. Contrast nephropathy from the procedure causes LV failure — Not the mechanism of post-closure LV dysfunction.; D. Closure raises PVR, overloading the RV and secondarily the LV — The RV is not the primary issue; the LV afterload mismatch is.", "pearl": "Closure can unmask LV afterload mismatch.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day9',label:'Day 9',set:'Quiz 4',href:'Day9/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day9_QuizSet4_Q49-64_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 9 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–64</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 9 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 9'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 9');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day9:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
