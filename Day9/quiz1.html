<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "In a preterm infant with a large left-to-right PDA, which pulse finding is classically expected?", "options": ["Pulsus alternans", "Weak, equal pulses with a narrow pulse pressure", "Bounding peripheral pulses", "Radiofemoral delay with weak femoral pulses"], "answer": 2, "explanation": "A large ductal runoff lowers diastolic pressure and produces bounding pulses. Closest distractor: Bounding pulses suggest runoff; weak femorals instead raise concern for left-sided obstruction. Why not the others: A. Pulsus alternans — Alternating strong/weak beats reflect severe LV systolic failure; it is not a ductal-runoff sign.; B. Weak, equal pulses with a narrow pulse pressure — Typical of low-output states or severe left-sided obstruction. A large L→R runoff lowers diastolic pressure and WIDENS pulse pressure.; D. Radiofemoral delay with weak femoral pulses — Suggests coarctation/interrupted arch, where flow to the lower body is obstructed. In PDA the problem is runoff, not obstruction.", "pearl": "Bounding pulses + wide pulse pressure suggest ductal runoff.", "srcAnswer": "C"}, {"num": 2, "level": "Basic/Recall", "question": "Which investigation confirms ductal patency and characterizes shunt direction in a preterm infant?", "options": ["Chest radiograph showing cardiomegaly and pulmonary plethora", "Serial BNP/NT-proBNP trend", "Pre/postductal SpO₂ difference", "Color Doppler echocardiography"], "answer": 3, "explanation": "Color Doppler echocardiography directly visualizes the ductus, its size and flow direction. Closest distractor: BNP may support shunt burden but cannot replace echo confirmation. Why not the others: A. Chest radiograph showing cardiomegaly and pulmonary plethora — Supports overcirculation but is nonspecific in RDS/BPD and cannot show duct size, flow direction or systemic effects.; B. Serial BNP/NT-proBNP trend — Reflects volume/pressure load but varies with gestation and renal function; it cannot confirm patency or direction.; C. Pre/postductal SpO₂ difference — Detects only a right-to-left ductal contribution; a L→R PDA gives no gradient.", "pearl": "Echo confirms PDA; clinical signs only suggest it.", "srcAnswer": "D"}, {"num": 3, "level": "Basic/Recall", "question": "The preferred site for PREductal oxygen saturation in a newborn is the:", "options": ["Either foot", "Forehead/ear probe", "Left hand", "Right hand"], "answer": 3, "explanation": "The right hand reflects blood proximal to the ductal insertion into the descending aorta. Closest distractor: The left hand can be variably related to ductal streaming; the right hand is the standard preductal site. Why not the others: A. Either foot — The foot is supplied by the descending aorta beyond the duct (postductal). It is the comparison site, not the preductal one.; B. Forehead/ear probe — Not a validated preductal site in newborns and prone to motion/perfusion artefact.; C. Left hand — The left subclavian can arise close to the ductal insertion, so the left hand is inconsistent as a preductal site.", "pearl": "Right hand = preductal; either foot = postductal.", "srcAnswer": "D"}, {"num": 4, "level": "Basic/Recall", "question": "Persistent pulmonary hypertension of the newborn (PPHN) is fundamentally characterized by:", "options": ["Fixed RV outflow obstruction from pulmonary stenosis", "Failure of pulmonary vascular resistance to fall after birth", "Obstructed pulmonary venous return from a structural lesion", "Persistently high SVR with low pulmonary blood flow"], "answer": 1, "explanation": "PPHN reflects persistently elevated pulmonary vascular resistance with extrapulmonary right-to-left shunting. Closest distractor: PPHN is a physiologic syndrome; structural lesions must still be excluded. Why not the others: A. Fixed RV outflow obstruction from pulmonary stenosis — Anatomic RVOT obstruction is structural CHD; PPHN is a failure of the vascular transition in an anatomically normal heart.; C. Obstructed pulmonary venous return from a structural lesion — Obstructed TAPVC or left-sided lesions can mimic PPHN, but they are structural CHD to be excluded by echo, not PPHN itself.; D. Persistently high SVR with low pulmonary blood flow — In PPHN the primary problem is high pulmonary resistance relative to SVR, not primary systemic hypertension.", "pearl": "PPHN = high PVR after birth.", "srcAnswer": "B"}, {"num": 5, "level": "Basic/Recall", "question": "Which agent is the standard first-line selective pulmonary vasodilator delivered by inhalation in eligible term/near-term infants with PPHN?", "options": ["Inhaled nitric oxide", "Intravenous sildenafil", "Inhaled epoprostenol (prostacyclin)", "Nebulised salbutamol"], "answer": 0, "explanation": "Inhaled nitric oxide selectively lowers pulmonary vascular resistance in ventilated lung units. Closest distractor: Systemic vasodilators can worsen systemic pressure and V/Q matching. Why not the others: B. Intravenous sildenafil — A pulmonary vasodilator but given systemically (enteral/IV) and not inhaled; useful as an adjunct or where iNO is unavailable.; C. Inhaled epoprostenol (prostacyclin) — Also given by inhalation and used where iNO is unavailable, but it is second-line and less evidence-based.; D. Nebulised salbutamol — A bronchodilator with no meaningful effect on pulmonary vascular resistance.", "pearl": "iNO is selective pulmonary vasodilation delivered to ventilated lung.", "srcAnswer": "A"}, {"num": 6, "level": "Basic/Recall", "question": "A PDA with substantial left-to-right shunting most directly causes which cardiac loading pattern?", "options": ["Isolated LV pressure overload with concentric hypertrophy", "Left atrial/left ventricular volume loading", "Reduced LV preload from diminished pulmonary venous return", "Right atrial/right ventricular pressure overload with septal flattening"], "answer": 1, "explanation": "Pulmonary overcirculation returns to the left atrium and ventricle, producing volume loading. Closest distractor: PPHN more often stresses the RV; PDA overcirculation loads the left heart. Why not the others: A. Isolated LV pressure overload with concentric hypertrophy — PDA causes volume load (dilatation), not pressure load; pressure overload is seen with aortic stenosis/coarctation.; C. Reduced LV preload from diminished pulmonary venous return — The opposite: pulmonary venous return to the left heart is increased.; D. Right atrial/right ventricular pressure overload with septal flattening — The pattern of pulmonary hypertension/PPHN, not of L→R PDA overcirculation.", "pearl": "Large L→R PDA loads LA/LV.", "srcAnswer": "B"}, {"num": 7, "level": "Basic/Recall", "question": "A postductal saturation substantially lower than preductal saturation most strongly suggests:", "options": ["Isolated left-to-right ductal shunt", "Methemoglobinemia", "Right-to-left or bidirectional ductal shunting", "Poor perfusion or probe artefact at the foot"], "answer": 2, "explanation": "Deoxygenated pulmonary arterial blood entering the descending aorta through the ductus lowers postductal saturation. Closest distractor: A pure L→R PDA does not produce lower postductal saturation. Why not the others: A. Isolated left-to-right ductal shunt — Postductal blood stays oxygenated, so no pre/post gradient appears.; B. Methemoglobinemia — Lowers SpO₂ equally at every site (pulse oximeter tends to read ~85%), without a pre/postductal difference.; D. Poor perfusion or probe artefact at the foot — A valid alternative explanation, hence repeat measurements; but a consistent substantial gradient with echo support points to ductal shunting.", "pearl": "Pre > post saturation suggests ductal R→L contribution.", "srcAnswer": "C"}, {"num": 8, "level": "Conceptual", "question": "Why can a large PDA worsen systemic organ perfusion despite a normal or high total cardiac output?", "options": ["Pulmonary venous hypertension limiting LV filling", "Obstruction of the aortic isthmus by ductal tissue", "Diastolic runoff into the pulmonary circuit diverts flow away from systemic organs", "Systolic LV failure from volume overload lowering total output"], "answer": 2, "explanation": "Systemic diastolic steal can reduce gut, renal and cerebral perfusion even when total output is preserved. Closest distractor: Arch obstruction reduces systemic flow by obstruction; PDA reduces it by runoff. Why not the others: A. Pulmonary venous hypertension limiting LV filling — Would lower output; in PDA pulmonary venous return and LV preload are increased.; B. Obstruction of the aortic isthmus by ductal tissue — That is coarctation physiology (obstruction). In PDA the arch is open and flow is lost by runoff.; D. Systolic LV failure from volume overload lowering total output — The stem specifies normal or high total output, so this does not explain steal.", "pearl": "Think distribution of flow, not just cardiac output.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "Why is a murmur alone insufficient to define a hemodynamically significant PDA?", "options": ["Clinical findings correlate imperfectly with shunt magnitude and outcomes", "A murmur louder than grade 3/6 reliably defines hsPDA", "Absence of a murmur excludes hsPDA in extremely preterm infants", "A continuous murmur is specific for a large shunt"], "answer": 0, "explanation": "Bedside signs are nonspecific; hemodynamic significance requires integrated clinical and echocardiographic assessment. Closest distractor: A loud murmur can coexist with a small restrictive duct; silence can occur in a large unrestrictive duct. Why not the others: B. A murmur louder than grade 3/6 reliably defines hsPDA — No validated murmur-grade cut-off exists; loudness does not track shunt volume.; C. Absence of a murmur excludes hsPDA in extremely preterm infants — Large unrestrictive ducts in ELBW infants may be silent; absence does not exclude.; D. A continuous murmur is specific for a large shunt — Small restrictive ducts also produce continuous murmurs, so the sign is nonspecific.", "pearl": "hsPDA is an integrated diagnosis.", "srcAnswer": "A"}, {"num": 10, "level": "Conceptual", "question": "Which echo finding best supports systemic steal from a large PDA?", "options": ["Dilated LV with a high mitral E/A ratio", "Raised left pulmonary artery end-diastolic velocity", "LA:Ao ratio of 1.8", "Reversal of diastolic flow in descending aorta"], "answer": 3, "explanation": "Diastolic flow reversal in the descending aorta is a marker of ductal runoff and systemic steal. Closest distractor: LA:Ao reflects pulmonary overcirculation; flow reversal directly reflects systemic runoff. Why not the others: A. Dilated LV with a high mitral E/A ratio — Indicates volume load on the left heart; it does not directly show diastolic runoff in systemic arteries.; B. Raised left pulmonary artery end-diastolic velocity — Another overcirculation marker; it shows excess pulmonary flow rather than systemic steal.; C. LA:Ao ratio of 1.8 — A marker of left-heart volume load (overcirculation), not of systemic diastolic runoff.", "pearl": "Descending-aortic diastolic reversal = steal.", "srcAnswer": "D"}, {"num": 11, "level": "Conceptual", "question": "Why can oxygen improve PPHN physiology?", "options": ["It benefits PPHN mainly by closing the ductus", "It is a potent pulmonary vasodilator and relieves hypoxic pulmonary vasoconstriction", "It acts by increasing mean airway pressure", "It acts only through higher hemoglobin saturation, without altering vascular tone"], "answer": 1, "explanation": "Alveolar oxygenation reduces hypoxic pulmonary vasoconstriction and supports the postnatal fall in PVR. Closest distractor: Oxygen improves vascular tone; it does not replace treatment of parenchymal disease. Why not the others: A. It benefits PPHN mainly by closing the ductus — Closure is not the goal; in PPHN the duct decompresses the RV, and the benefit comes from pulmonary vasodilation.; C. It acts by increasing mean airway pressure — Oxygen has no effect on mean airway pressure; recruitment effects come from the ventilation strategy.; D. It acts only through higher hemoglobin saturation, without altering vascular tone — Alveolar and arterial O₂ directly reduce pulmonary vascular tone, which is the main therapeutic effect.", "pearl": "Correct hypoxemia while avoiding unnecessary hyperoxia.", "srcAnswer": "B"}, {"num": 12, "level": "Conceptual", "question": "Why may systemic hypotension worsen right-to-left shunting in PPHN?", "options": ["Lower systemic pressure increases the pressure advantage of the pulmonary circuit", "Hypotension closes the PFO and traps blood in the right atrium", "Hypotension reflexly lowers PVR, which promotes R→L flow", "Lower SVR increases LV afterload and forces blood back through the duct"], "answer": 0, "explanation": "When pulmonary pressure approaches/exceeds systemic pressure, lower systemic pressure favors right-to-left shunting across PDA/PFO. Closest distractor: Raising SVR indiscriminately is not the goal; restore adequate systemic pressure/perfusion. Why not the others: B. Hypotension closes the PFO and traps blood in the right atrium — Hypotension does not close the PFO; high right-sided pressure favours atrial R→L flow.; C. Hypotension reflexly lowers PVR, which promotes R→L flow — No such reflex exists; lower perfusion pressure tends to worsen RV ischaemia and PVR.; D. Lower SVR increases LV afterload and forces blood back through the duct — Low systemic pressure REDUCES afterload; the shunt direction is set by the pressure difference between the circuits.", "pearl": "PPHN is about the PVR:SVR relationship.", "srcAnswer": "A"}, {"num": 13, "level": "Conceptual", "question": "What is the key physiologic distinction between PDA and PPHN at the ductus?", "options": ["Ductal direction depends on duct diameter, not pressure", "PDA usually concerns L→R runoff; PPHN may produce R→L/bidirectional shunting", "In PPHN the duct always shunts L→R to unload the lungs", "In hsPDA the duct shunts R→L, which causes pulmonary overcirculation"], "answer": 1, "explanation": "PDA in preterm infants usually becomes L→R as PVR falls; PPHN can maintain pulmonary pressure high enough for R→L/bidirectional flow. Closest distractor: A patent ductus can be a pressure pop-off in severe pulmonary hypertension. Why not the others: A. Ductal direction depends on duct diameter, not pressure — Diameter determines restrictiveness and magnitude; the pressure gradient determines direction.; C. In PPHN the duct always shunts L→R to unload the lungs — Direction follows relative pressure; with PVR ≥ SVR the flow is R→L or bidirectional.; D. In hsPDA the duct shunts R→L, which causes pulmonary overcirculation — R→L flow reduces pulmonary flow; overcirculation requires L→R flow.", "pearl": "Always ask: direction, magnitude, pressure context.", "srcAnswer": "B"}, {"num": 14, "level": "Conceptual", "question": "Why can closing a PDA be hazardous when the ductus is supporting systemic flow in duct-dependent CHD?", "options": ["Collateral arteries compensate within hours, so closure is harmless", "Closure always triggers a pulmonary hypertensive crisis", "Closure may remove essential systemic blood flow", "Closure is dangerous only because it lowers SpO₂, not flow"], "answer": 2, "explanation": "In duct-dependent systemic lesions, the PDA is essential for perfusion; closure can precipitate shock. Closest distractor: PPHN and duct-dependent CHD can both present with cyanosis but have opposite ductal-management implications. Why not the others: A. Collateral arteries compensate within hours, so closure is harmless — In critical coarctation, interrupted arch or HLHS, collaterals cannot replace ductal flow; closure causes shock and acidosis.; B. Closure always triggers a pulmonary hypertensive crisis — Not the mechanism; closure of a duct that supplies the systemic or pulmonary circulation causes shock.; D. Closure is dangerous only because it lowers SpO₂, not flow — In systemic duct-dependent lesions the loss is of perfusion (shock, anuria, acidosis), not merely saturation.", "pearl": "Before closing a ductus, know what it is doing.", "srcAnswer": "C"}, {"num": 15, "level": "Conceptual", "question": "What does an LA:Ao ratio ≥1.5 traditionally suggest in PDA assessment?", "options": ["Reduced pulmonary blood flow", "Left-heart volume loading from substantial shunt", "Systemic hypovolemia", "Raised RV systolic pressure"], "answer": 1, "explanation": "An enlarged left atrium relative to the aortic root supports substantial pulmonary overcirculation and left-heart volume load. Closest distractor: Combine chamber loading with duct size, flow pattern and systemic effects. Why not the others: A. Reduced pulmonary blood flow — A dilated left atrium reflects increased, not reduced, pulmonary venous return.; C. Systemic hypovolemia — Hypovolemia shrinks the atria; it does not enlarge the left atrium.; D. Raised RV systolic pressure — LA:Ao is a left atrial size ratio and does not measure RV pressure.", "pearl": "LA:Ao is a shunt-volume clue, not a stand-alone treatment trigger.", "srcAnswer": "B"}, {"num": 16, "level": "", "question": "A ventilated preterm infant suddenly desaturates. The ETT marking is unchanged; the ventilator circuit is visibly disconnected at the humidifier. In the DOPE framework, what is the primary category?", "options": ["Displacement", "Pneumothorax", "Equipment failure", "Obstruction"], "answer": 2, "explanation": "The visible ventilator-circuit disconnection is an Equipment failure in DOPE. Closest distractor: A visible mechanical cause points to Equipment failure rather than the patient-related D, O or P causes. Why not the others: A. Displacement — The ETT depth marking is unchanged, so tube migration is not the primary problem.; B. Pneumothorax — Would give asymmetric chest findings or transillumination; the stem shows an obvious mechanical cause.; D. Obstruction — No secretions or kink; the circuit itself is physically disconnected.", "pearl": "DOPE = Displacement, Obstruction, Pneumothorax, Equipment.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 5 — DOPE"}}];
const NB_CTX={srcId:'Day9',label:'Day 9',set:'Quiz 1',href:'Day9/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day9_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 9 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 9 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 9'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 9');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day9:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
