<script>
const quiz=[{"num": 18, "level": "Conceptual", "question": "Which clinical trajectory most suggests duct-dependent pulmonary flow rather than ordinary stable TOF?", "options": ["Transient desaturation with crying that resolves fully when agitation stops", "Persistently low baseline saturation unchanged during observed ductal closure", "Progressive cyanosis as the duct constricts", "Cyanosis that improves as the duct constricts in an infant with good antegrade RVOT flow"], "answer": 2, "explanation": "A closing PDA unmasks inadequate pulmonary blood supply. Why not the others: A. Transient desaturation with crying that resolves fully when agitation stops — A transient spell suggests dynamic RVOTO but does not by itself prove duct dependency.; B. Persistently low baseline saturation unchanged during observed ductal closure — Stable severe cyanosis can occur with fixed severe RVOTO; the ductal temporal relationship is absent.; D. Cyanosis that improves as the duct constricts in an infant with good antegrade RVOT flow — Improvement with ductal narrowing does not indicate a dependence on ductal pulmonary perfusion.", "pearl": "Duct-dependent TOF: cyanosis as the duct closes.", "srcAnswer": "C"}, {"num": 19, "level": "Conceptual", "question": "After TOF repair with a transannular patch, which chronic lesion is especially important to monitor?", "options": ["Progressive pulmonary regurgitation with RV volume overload", "Progressive pulmonary stenosis from the open transannular patch itself", "Late left-sided volume loading from residual aortic override alone", "Primary tricuspid stenosis caused by surgical RVOT widening"], "answer": 0, "explanation": "Best: transannular patch sacrifices pulmonary valve competence and predisposes to PR. Why not the others: B. Progressive pulmonary stenosis from the open transannular patch itself — Residual RVOTO can occur, but opening the annulus principally increases PR concern.; C. Late left-sided volume loading from residual aortic override alone — Override is addressed in anatomical correction and is not the typical late loading problem.; D. Primary tricuspid stenosis caused by surgical RVOT widening — RVOT patching does not usually induce primary tricuspid stenosis.", "pearl": "After a transannular patch, watch PR and RV dilation.", "srcAnswer": "A"}, {"num": 20, "level": "High Difficulty", "question": "In a cyanotic infant, why is poor response to oxygen alone insufficient to name TOF?", "options": ["It is a physiologic clue shared by several cardiac lesions and PPHN", "It differentiates a fixed RVOTO from all mixing lesions", "It differentiates ductal-dependent pulmonary flow from PPHN", "It establishes the direction of the shunt through a VSD"], "answer": 0, "explanation": "Response alone cannot identify anatomy; targeted echo separates the competing possibilities. Why not the others: B. It differentiates a fixed RVOTO from all mixing lesions — Both fixed RVOTO and admixture lesions may show limited oxygen response.; C. It differentiates ductal-dependent pulmonary flow from PPHN — Both duct-dependent pulmonary obstruction and PPHN can show refractory hypoxemia.; D. It establishes the direction of the shunt through a VSD — A saturation response cannot localize or establish VSD flow direction.", "pearl": "Poor oxygen response is not specific to TOF.", "srcAnswer": "A"}, {"num": 21, "level": "Clinical / Application", "question": "A 4-month-old with TOF cries during venepuncture, becomes deeply cyanosed and hyperpnoeic, and the RVOT murmur fades. What should be recognized immediately?", "options": ["Transient ductal constriction in a child with otherwise adequate antegrade flow", "Hypercyanotic spell with low pulmonary flow", "An acute pulmonary hypertensive crisis with predominant ductal right-to-left shunting", "An acute arrhythmia-associated low-output episode without dynamic RVOTO"], "answer": 1, "explanation": "The triad of agitation, deep cyanosis and softer RVOT murmur is characteristic. Why not the others: A. Transient ductal constriction in a child with otherwise adequate antegrade flow — Duct closure may worsen duct-dependent cyanosis but the acute agitation, hyperpnea and diminishing RVOT murmur favor a dynamic tet spell.; C. An acute pulmonary hypertensive crisis with predominant ductal right-to-left shunting — Pulmonary hypertensive crises may cause severe cyanosis but do not explain the characteristic RVOT murmur attenuation in known TOF.; D. An acute arrhythmia-associated low-output episode without dynamic RVOTO — An arrhythmia can cause collapse but the stimulus-linked hyperpnea, cyanosis and murmur change are typical for a spell.", "pearl": "Cyanosis, hyperpnea and a fading murmur = spell.", "srcAnswer": "B"}, {"num": 22, "level": "Clinical / Application", "question": "A known TOF infant has a brief cyanotic spell while crying but is conscious and breathing spontaneously. After calling for help and ABC assessment, which immediate maneuver is most appropriate?", "options": ["Provide oxygen alone and delay positioning pending echocardiography", "Place supine with legs extended and rapidly deepen sedation first", "Calm and flex knees to chest while maintaining airway support", "Prioritize IV beta blockade before calming and positioning"], "answer": 2, "explanation": "Best: knee-chest and calming are immediate low-risk physiological measures after ABC. Why not the others: A. Provide oxygen alone and delay positioning pending echocardiography — Oxygen is useful but positioning and calming need not await imaging.; B. Place supine with legs extended and rapidly deepen sedation first — Unnecessary procedural escalation may aggravate agitation; sedation is monitored adjunct.; D. Prioritize IV beta blockade before calming and positioning — Beta blockade may be required in persistent spells but not before simple stabilizing measures.", "pearl": "First move: calm and knee-chest.", "srcAnswer": "C"}, {"num": 23, "level": "Clinical / Application", "question": "An infant with a tet spell is dehydrated after gastroenteritis, with cool extremities and poor filling. Which adjunct is physiologically reasonable after assessment?", "options": ["Fluid restriction to reduce RV filling during a dynamic RVOT spell", "Immediate large hypotonic fluid bolus independent of pulmonary flow", "Cautious isotonic volume replacement after reassessment of perfusion", "A diuretic bolus to lower right-sided preload and RV pressure"], "answer": 2, "explanation": "Best: correcting reduced preload may improve RV filling and pulmonary flow. Why not the others: A. Fluid restriction to reduce RV filling during a dynamic RVOT spell — Underfilling worsens dynamic RVOTO in this physiology.; B. Immediate large hypotonic fluid bolus independent of pulmonary flow — Hypotonic rapid bolus poses electrolyte risk and is not appropriate resuscitation.; D. A diuretic bolus to lower right-sided preload and RV pressure — Diuresis can aggravate reduced preload during dehydration and shock.", "pearl": "Spell with dehydration: cautious isotonic fluid.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical / Application", "question": "A tet spell persists despite calming, oxygen and volume correction; BP is low and expert team is present. Which vasoactive strategy directly increases SVR?", "options": ["IV esmolol infusion targeting catecholamine-mediated RVOTO", "Monitored phenylephrine to increase systemic vascular resistance", "Inhaled nitric oxide to preferentially lower pulmonary arterial resistance", "Low-dose vasodilating nitroprusside to reduce LV afterload"], "answer": 1, "explanation": "Best: phenylephrine raises SVR in an expert-monitored refractory spell. Why not the others: A. IV esmolol infusion targeting catecholamine-mediated RVOTO — Esmolol targets RVOTO, not a direct alpha-mediated increase in SVR.; C. Inhaled nitric oxide to preferentially lower pulmonary arterial resistance — iNO lowers PVR but is not the direct SVR-raising treatment asked for.; D. Low-dose vasodilating nitroprusside to reduce LV afterload — Nitroprusside decreases SVR, which can worsen R-to-L flow.", "pearl": "Phenylephrine raises SVR in a refractory spell.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical / Application", "question": "Which medication class may reduce infundibular spasm during a persistent tet spell when supervised by the cardiac team?", "options": ["Phenylephrine to increase SVR rather than directly relax infundibulum", "Morphine to reduce distress and hyperpnea during an ongoing spell", "Isotonic crystalloid to improve ventricular filling and preload", "Esmolol or propranolol to blunt adrenergic RVOT constriction"], "answer": 3, "explanation": "Best: beta blockade can reduce catecholamine-mediated RVOTO under close monitoring. Why not the others: A. Phenylephrine to increase SVR rather than directly relax infundibulum — Phenylephrine can be useful but acts mainly on systemic resistance rather than beta-mediated infundibular tone.; B. Morphine to reduce distress and hyperpnea during an ongoing spell — Sedation may reduce sympathetic drive but is not a beta blocker.; C. Isotonic crystalloid to improve ventricular filling and preload — Fluid may improve preload but is not the specifically requested pharmacologic antispasm class.", "pearl": "Beta-blockers reduce dynamic infundibular spasm.", "srcAnswer": "D"}, {"num": 26, "level": "Clinical / Application", "question": "A child remains extremely distressed during a tet spell. What is the clinical rationale for carefully monitored analgesia/sedation?", "options": ["Raise SVR primarily via direct systemic alpha-receptor stimulation", "Reduce sympathetic agitation and hyperpnea with monitored sedation", "Increase preload by pharmacologically expanding plasma volume", "Create a sustained reduction in PVR through selective pulmonary vasodilation"], "answer": 1, "explanation": "Best: reducing distress disrupts catecholamine-amplified hyperpnea and dynamic obstruction. Why not the others: A. Raise SVR primarily via direct systemic alpha-receptor stimulation — Some anesthetics affect SVR but sedation is not principally direct alpha agonism.; C. Increase preload by pharmacologically expanding plasma volume — Sedation cannot itself restore depleted intravascular volume.; D. Create a sustained reduction in PVR through selective pulmonary vasodilation — Oxygen may change PVR, but sedation's principal goal is to reduce adrenergic drive.", "pearl": "Sedation cuts catecholamine drive.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical / Application", "question": "A 5-month-old in a tet spell remains cyanotic despite supplemental oxygen. Which inference is safest?", "options": ["Further increases in oxygen alone will overcome any degree of RVOTO", "Inadequate oxygen response establishes concomitant severe parenchymal disease", "Persistent anatomic R-to-L shunt requires physiology-directed resuscitation", "Normal SpO2 must precede initiation of preload/SVR-directed treatment"], "answer": 2, "explanation": "Best: oxygen alone cannot abolish blood bypassing the lungs through a shunt. Why not the others: A. Further increases in oxygen alone will overcome any degree of RVOTO — Higher FiO2 cannot reliably correct flow diversion through a fixed anatomical circuit.; B. Inadequate oxygen response establishes concomitant severe parenchymal disease — Cardiac shunting itself can explain oxygen-refractory hypoxemia.; D. Normal SpO2 must precede initiation of preload/SVR-directed treatment — Treat hypoperfusion and RVOTO promptly; do not await normalized saturation.", "pearl": "Oxygen cannot reverse an anatomic shunt.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical / Application", "question": "At routine follow-up, a TOF infant becomes more cyanotic and the ejection murmur is softer than previously. What is the most important concern?", "options": ["Worsening RVOTO with less antegrade pulmonary flow", "Reduced turbulence caused by improved pulmonary perfusion despite increasing cyanosis", "An unchanged RVOT gradient with a purely altered acoustic transmission", "Progressive pulmonary regurgitation as the sole explanation for acute resting cyanosis"], "answer": 0, "explanation": "Reduced flow may quiet the murmur despite greater disease severity. Why not the others: B. Reduced turbulence caused by improved pulmonary perfusion despite increasing cyanosis — An isolated increase in cyanosis is not evidence of improved antegrade pulmonary flow.; C. An unchanged RVOT gradient with a purely altered acoustic transmission — Possible technical variation exists, but the concurrent worsening cyanosis raises concern about reduced RVOT flow.; D. Progressive pulmonary regurgitation as the sole explanation for acute resting cyanosis — Pulmonary regurgitation alone does not explain the classic conjunction of worsening cyanosis and fading ejection murmur.", "pearl": "A softer murmur with more cyanosis is a warning.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical / Application", "question": "A term newborn with TOF and near-atretic RVOT has SpO2 85% at 6 hours and 64% at 48 hours as PDA narrows. Most appropriate stabilization?", "options": ["Urgent echo and volume correction alone while withholding ductal therapy", "High inspired oxygen with reassessment in 24 hours before cardiac referral", "Urgent echo and PGE1 for duct-dependent flow", "Inhaled nitric oxide as the sole intervention for suspected fixed RVOT obstruction"], "answer": 2, "explanation": "The falling saturation with ductal closure is a critical duct-dependence clue. Why not the others: A. Urgent echo and volume correction alone while withholding ductal therapy — Volume optimization may support perfusion but does not maintain a closing duct in potentially duct-dependent pulmonary circulation.; B. High inspired oxygen with reassessment in 24 hours before cardiac referral — Oxygen alone may not preserve pulmonary blood flow through an atretic or near-atretic outflow.; D. Inhaled nitric oxide as the sole intervention for suspected fixed RVOT obstruction — Pulmonary vasodilation cannot restore absent antegrade flow; maintain the duct and define anatomy.", "pearl": "Falling saturation as the duct narrows: echo and PGE1.", "srcAnswer": "C"}, {"num": 30, "level": "Clinical / Application", "question": "A neonate started on PGE1 for duct-dependent pulmonary blood flow develops apnea. What is the appropriate interpretation?", "options": ["An isolated marker of pulmonary overcirculation rather than a recognized drug-related respiratory effect", "Recognized PGE1 effect; keep airway ready", "A signal to immediately interrupt ductal patency treatment before assessing pulmonary supply", "Evidence that PGE1 has corrected the obstructive cardiac anatomy"], "answer": 1, "explanation": "Apnea is a known side effect; support ventilation and review infusion. Why not the others: A. An isolated marker of pulmonary overcirculation rather than a recognized drug-related respiratory effect — Apnea is a recognized PGE1 adverse effect and requires respiratory readiness; pulmonary flow must be assessed separately.; C. A signal to immediately interrupt ductal patency treatment before assessing pulmonary supply — Abruptly stopping PGE1 may endanger a duct-dependent infant; reassess with experts and secure the airway.; D. Evidence that PGE1 has corrected the obstructive cardiac anatomy — PGE1 preserves ductal patency but cannot anatomically repair atresia or severe outflow obstruction.", "pearl": "PGE1 can cause apnea; keep the airway ready.", "srcAnswer": "B"}, {"num": 31, "level": "Clinical / Application", "question": "A 7-month-old with classical TOF is stable with minimal cyanosis, suitable anatomy and no spells. Which timing is most consistent with Indian 2019 consensus?", "options": ["Delay repair until dynamic infundibular obstruction becomes symptomatic", "Defer elective repair to 12–24 months for favorable baseline saturation", "Total correction during the recommended 6–12 month window", "Choose staged palliation over primary correction for every asymptomatic infant"], "answer": 2, "explanation": "Best: Indian 2019 consensus supports repair at 6–12 months or earlier where appropriate. Why not the others: A. Delay repair until dynamic infundibular obstruction becomes symptomatic — Waiting for tet spells creates avoidable risk.; B. Defer elective repair to 12–24 months for favorable baseline saturation — A fixed deferral beyond the recommended age is unsupported without specific reasons.; D. Choose staged palliation over primary correction for every asymptomatic infant — Palliation is selected when clinically or anatomically indicated, not automatically.", "pearl": "Stable TOF: repair in the 6–12 month window.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical / Application", "question": "A 2-month-old with TOF has repeated spells despite treatment and small pulmonary arteries. Which decision is appropriate?", "options": ["Routine PDA closure without assessment", "Early repair or palliation chosen by anatomy and centre", "Permanent medical treatment without cardiac referral", "Wait until 12 months before any decision"], "answer": 1, "explanation": "Indian guidance allows either route in symptomatic infants <6 months. Why not the others: A. Routine PDA closure without assessment — May worsen pulmonary flow if duct-dependent.; C. Permanent medical treatment without cardiac referral — Fails to address high-risk anatomy.; D. Wait until 12 months before any decision — Refractory spells require earlier action.", "pearl": "Early spells: repair or palliate early.", "srcAnswer": "B"}, {"num": 33, "level": "Clinical / Application", "question": "A small infant with classical TOF has severe muscular RVOT obstruction, recurrent desaturation, usable antegrade pulmonary outflow, and no ductal route suitable for stenting. The team judges the child unsuitable for immediate full repair. Which catheter-based palliation directly treats this documented outflow lesion?", "options": ["RVOT stenting after anatomical assessment", "Patent ductus arteriosus stenting after mapping whether ductal supply is necessary", "Balloon pulmonary valvotomy if a substantial valvar component is present", "Modified systemic-to-pulmonary surgical shunt after multidisciplinary assessment"], "answer": 0, "explanation": "RVOT stent can improve pulmonary flow in selected infants. Why not the others: B. Patent ductus arteriosus stenting after mapping whether ductal supply is necessary — Ductal stenting is useful in selected duct-dependent anatomy, but the stem explicitly describes no suitable ductal route and a muscular RVOT target.; C. Balloon pulmonary valvotomy if a substantial valvar component is present — Balloon valvotomy is anatomy-dependent and is not equivalent to relieving substantial infundibular RVOTO.; D. Modified systemic-to-pulmonary surgical shunt after multidisciplinary assessment — A surgical shunt is a valid palliation but the question asks specifically for a catheter-based option.", "pearl": "RVOT stenting is a palliation option.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical / Application", "question": "A child with cyanotic TOF undergoes a modified systemic-to-pulmonary shunt. What is its principal aim?", "options": ["Increase pulmonary flow by relieving the native infundibular obstruction", "Increase pulmonary blood flow pending definitive repair", "Lower RV pressure by permanently closing the malalignment VSD", "Redistribute blood away from pulmonary circulation to reduce volume loading"], "answer": 1, "explanation": "Shunt provides a systemic source of pulmonary perfusion. Why not the others: A. Increase pulmonary flow by relieving the native infundibular obstruction — An RVOT intervention can increase antegrade flow; a systemic-pulmonary shunt creates a separate pulmonary supply route.; C. Lower RV pressure by permanently closing the malalignment VSD — A palliative shunt does not repair the VSD; systemic-pulmonary flow is its immediate objective.; D. Redistribute blood away from pulmonary circulation to reduce volume loading — This would be the opposite of the shunt objective in reduced pulmonary-flow cyanotic lesions.", "pearl": "A BT shunt raises pulmonary blood flow.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 2',href:'Day18/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
