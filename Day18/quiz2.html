@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "Conceptual", "question": "Which clinical trajectory most suggests duct-dependent pulmonary flow rather than ordinary stable TOF?", "options": ["Fixed split S2 and isolated RV volume loading", "New isolated left atrial enlargement without cyanosis", "Progressive cyanosis as the duct constricts", "A thriving toddler with isolated mild RVOTO and normal saturation"], "answer": 2, "explanation": "A closing PDA unmasks inadequate pulmonary blood supply. Why not the others: A. Fixed split S2 and isolated RV volume loading — Suggests ASD rather than duct-dependent TOF.; B. New isolated left atrial enlargement without cyanosis — More compatible with pulmonary overcirculation lesions.; D. A thriving toddler with isolated mild RVOTO and normal saturation — Does not suggest duct dependence.", "pearl": "Duct-dependent TOF: cyanosis as the duct closes.", "srcAnswer": "C"}, {"num": 19, "level": "Conceptual", "question": "After TOF repair with a transannular patch, which chronic lesion is especially important to monitor?", "options": ["PR with progressive RV volume loading", "Pulmonary venous atresia from the repair", "Progressive closure of the aortic valve", "Progressive mitral stenosis from the patch"], "answer": 0, "explanation": "Loss of pulmonary valve competence can cause long-term RV dilation. Why not the others: B. Pulmonary venous atresia from the repair — Not a typical repair consequence.; C. Progressive closure of the aortic valve — Aortic valve closure is unrelated to the patch.; D. Progressive mitral stenosis from the patch — Not a typical direct result of RVOT patching.", "pearl": "After a transannular patch, watch PR and RV dilation.", "srcAnswer": "A"}, {"num": 20, "level": "High Difficulty", "question": "In a cyanotic infant, why is poor response to oxygen alone insufficient to name TOF?", "options": ["Other cardiac lesions and PPHN also respond poorly", "It establishes RVOT gradient quantitatively", "It rules out duct-dependent pulmonary flow", "It specifically confirms a malalignment VSD"], "answer": 0, "explanation": "Echo and physiology are required for lesion-specific diagnosis. Why not the others: B. It establishes RVOT gradient quantitatively — Only imaging/hemodynamics define gradient and anatomy.; C. It rules out duct-dependent pulmonary flow — Such lesions can have severe refractory cyanosis.; D. It specifically confirms a malalignment VSD — Oxygen response cannot define septal anatomy.", "pearl": "Poor oxygen response is not specific to TOF.", "srcAnswer": "A"}, {"num": 21, "level": "Clinical / Application", "question": "A 4-month-old with TOF cries during venepuncture, becomes deeply cyanosed and hyperpnoeic, and the RVOT murmur fades. What should be recognized immediately?", "options": ["Acute pulmonary venous obstruction", "Hypercyanotic spell with low pulmonary flow", "Acute isolated bacterial pneumonia", "Primary supraventricular tachycardia"], "answer": 1, "explanation": "The triad of agitation, deep cyanosis and softer RVOT murmur is characteristic. Why not the others: A. Acute pulmonary venous obstruction — Would not classically produce this trigger/murmur pattern.; C. Acute isolated bacterial pneumonia — Pneumonia does not typically cause sudden loss of RVOT murmur with crying.; D. Primary supraventricular tachycardia — No tachyarrhythmia is described; murmur change suggests RVOTO.", "pearl": "Cyanosis, hyperpnea and a fading murmur = spell.", "srcAnswer": "B"}, {"num": 22, "level": "Clinical / Application", "question": "A known TOF infant has a brief cyanotic spell while crying but is conscious and breathing spontaneously. After calling for help and ABC assessment, which immediate maneuver is most appropriate?", "options": ["Withhold oxygen until echocardiography", "Place the infant upright with legs fully extended", "Calm the infant and position knees to chest", "Start vigorous chest physiotherapy"], "answer": 2, "explanation": "This raises SVR while avoiding further agitation. Why not the others: A. Withhold oxygen until echocardiography — Oxygen may be provided while stabilizing; echo should not delay care.; B. Place the infant upright with legs fully extended — Does not provide the same SVR advantage.; D. Start vigorous chest physiotherapy — Agitation may exacerbate dynamic obstruction.", "pearl": "First move: calm and knee-chest.", "srcAnswer": "C"}, {"num": 23, "level": "Clinical / Application", "question": "An infant with a tet spell is dehydrated after gastroenteritis, with cool extremities and poor filling. Which adjunct is physiologically reasonable after assessment?", "options": ["Unmonitored fluid restriction", "Large rapid hypotonic fluid bolus", "Cautious isotonic crystalloid to improve preload", "Routine aggressive diuresis"], "answer": 2, "explanation": "Volume depletion reduces RV filling and can worsen dynamic RVOTO. Why not the others: A. Unmonitored fluid restriction — May worsen the low-preload trigger.; B. Large rapid hypotonic fluid bolus — Hypotonic fluid is not preferred for circulatory resuscitation.; D. Routine aggressive diuresis — Further preload reduction can worsen the spell.", "pearl": "Spell with dehydration: cautious isotonic fluid.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical / Application", "question": "A tet spell persists despite calming, oxygen and volume correction; BP is low and expert team is present. Which vasoactive strategy directly increases SVR?", "options": ["Nitroprusside to lower afterload", "Phenylephrine titrated under monitored specialist care", "High-dose inhaled bronchodilator for RVOTO", "Isoproterenol to increase contractility and heart rate"], "answer": 1, "explanation": "Alpha-agonism raises SVR and may reduce R-to-L flow. Why not the others: A. Nitroprusside to lower afterload — Afterload reduction can worsen R-to-L shunting.; C. High-dose inhaled bronchodilator for RVOTO — Airway beta-agonism does not correct the shunt mechanism.; D. Isoproterenol to increase contractility and heart rate — Beta-agonism may aggravate dynamic RVOTO.", "pearl": "Phenylephrine raises SVR in a refractory spell.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical / Application", "question": "Which medication class may reduce infundibular spasm during a persistent tet spell when supervised by the cardiac team?", "options": ["Prostaglandin inhibitor", "Loop diuretic as primary anti-spasm treatment", "Calcium-channel blocker as routine first-line rescue", "Beta-blocker such as propranolol or esmolol"], "answer": 3, "explanation": "Slowing and reducing dynamic infundibular contraction can help. Why not the others: A. Prostaglandin inhibitor — Ductal constriction is not a remedy for TOF spells.; B. Loop diuretic as primary anti-spasm treatment — Diuresis is not a direct treatment for dynamic RVOTO.; C. Calcium-channel blocker as routine first-line rescue — Not the established primary approach to tet spells.", "pearl": "Beta-blockers reduce dynamic infundibular spasm.", "srcAnswer": "D"}, {"num": 26, "level": "Clinical / Application", "question": "A child remains extremely distressed during a tet spell. What is the clinical rationale for carefully monitored analgesia/sedation?", "options": ["Increase cardiac output by accelerating heart rate", "Reduce catecholamine-driven hyperpnea", "Eliminate the need for ABC assessment", "Cause deliberate systemic vasodilation"], "answer": 1, "explanation": "Sedation interrupts agitation-spasm cycle; airway monitoring is essential. Why not the others: A. Increase cardiac output by accelerating heart rate — Tachycardia may worsen RVOTO.; C. Eliminate the need for ABC assessment — Sedation demands even closer respiratory monitoring.; D. Cause deliberate systemic vasodilation — Reduced SVR can worsen shunting.", "pearl": "Sedation cuts catecholamine drive.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical / Application", "question": "A 5-month-old in a tet spell remains cyanotic despite supplemental oxygen. Which inference is safest?", "options": ["Rely on higher oxygen as the sole treatment", "Rule out cardiac cyanosis because oxygen was given", "Keep stabilizing; oxygen cannot fix R-to-L flow", "Stop respiratory monitoring once oxygen is on"], "answer": 2, "explanation": "Treat RVOTO/SVR/preload and seek urgent specialist help. Why not the others: A. Rely on higher oxygen as the sole treatment — Oxygen cannot by itself relieve severe obstruction.; B. Rule out cardiac cyanosis because oxygen was given — Poor response supports shunt physiology but is not diagnostic.; D. Stop respiratory monitoring once oxygen is on — Oxygenation and ventilation remain essential monitoring targets.", "pearl": "Oxygen cannot reverse an anatomic shunt.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical / Application", "question": "At routine follow-up, a TOF infant becomes more cyanotic and the ejection murmur is softer than previously. What is the most important concern?", "options": ["Worsening RVOTO with less antegrade pulmonary flow", "Complete spontaneous correction of TOF", "Improved RVOT flow because murmur is softer", "New isolated mitral stenosis"], "answer": 0, "explanation": "Reduced flow may quiet the murmur despite greater disease severity. Why not the others: B. Complete spontaneous correction of TOF — Anatomical tetrad cannot resolve in this fashion.; C. Improved RVOT flow because murmur is softer — This inference is unsafe without echo.; D. New isolated mitral stenosis — Does not explain the RVOT murmur change.", "pearl": "A softer murmur with more cyanosis is a warning.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical / Application", "question": "A term newborn with TOF and near-atretic RVOT has SpO2 85% at 6 hours and 64% at 48 hours as PDA narrows. Most appropriate stabilization?", "options": ["Observe without vascular access until discharge", "Diuretic therapy for presumed heart failure", "Urgent echo and PGE1 for duct-dependent flow", "Pulmonary vasodilator therapy with iNO"], "answer": 2, "explanation": "The falling saturation with ductal closure is a critical duct-dependence clue. Why not the others: A. Observe without vascular access until discharge — Delay risks cardiovascular collapse.; B. Diuretic therapy for presumed heart failure — Does not restore ductal blood supply.; D. Pulmonary vasodilator therapy with iNO — Pulmonary flow is limited by outflow obstruction, not raised PVR, so vasodilation does not help.", "pearl": "Falling saturation as the duct narrows: echo and PGE1.", "srcAnswer": "C"}, {"num": 30, "level": "Clinical / Application", "question": "A neonate started on PGE1 for duct-dependent pulmonary blood flow develops apnea. What is the appropriate interpretation?", "options": ["A harmless effect requiring no monitoring", "Recognized PGE1 effect; keep airway ready", "Indication to immediately close the PDA", "Proof that pulmonary circulation is now normal"], "answer": 1, "explanation": "Apnea is a known side effect; support ventilation and review infusion. Why not the others: A. A harmless effect requiring no monitoring — Respiratory depression can be clinically serious.; C. Indication to immediately close the PDA — Ductal patency may remain essential.; D. Proof that pulmonary circulation is now normal — Apnea is not evidence of corrected anatomy.", "pearl": "PGE1 can cause apnea; keep the airway ready.", "srcAnswer": "B"}, {"num": 31, "level": "Clinical / Application", "question": "A 7-month-old with classical TOF is stable with minimal cyanosis, suitable anatomy and no spells. Which timing is most consistent with Indian 2019 consensus?", "options": ["Replace repair with indefinite beta-blocker therapy", "Repair only after the first hypercyanotic spell", "Proceed with total repair in the 6–12 month window", "Defer surgery until school age if saturation exceeds 85%"], "answer": 2, "explanation": "Indian consensus supports repair at 6–12 months or earlier by center policy. Why not the others: A. Replace repair with indefinite beta-blocker therapy — Medication is not definitive correction.; B. Repair only after the first hypercyanotic spell — Spells are not a prerequisite for intervention.; D. Defer surgery until school age if saturation exceeds 85% — Untreated TOF requires repair; late delay is not standard.", "pearl": "Stable TOF: repair in the 6–12 month window.", "srcAnswer": "C"}, {"num": 32, "level": "Clinical / Application", "question": "A 2-month-old with TOF has repeated spells despite treatment and small pulmonary arteries. Which decision is appropriate?", "options": ["Routine PDA closure without assessment", "Early repair or palliation chosen by anatomy and centre", "Permanent medical treatment without cardiac referral", "Wait until 12 months before any decision"], "answer": 1, "explanation": "Indian guidance allows either route in symptomatic infants <6 months. Why not the others: A. Routine PDA closure without assessment — May worsen pulmonary flow if duct-dependent.; C. Permanent medical treatment without cardiac referral — Fails to address high-risk anatomy.; D. Wait until 12 months before any decision — Refractory spells require earlier action.", "pearl": "Early spells: repair or palliate early.", "srcAnswer": "B"}, {"num": 33, "level": "Clinical / Application", "question": "A small infant with TOF has severe RVOTO, frequent desaturation and is unsuitable for immediate full repair. What is a possible catheter palliation?", "options": ["RVOT stenting after anatomical assessment", "Aortic coarctation stenting", "Balloon mitral valvotomy", "Secundum ASD occluder in the atrial septum"], "answer": 0, "explanation": "RVOT stent can improve pulmonary flow in selected infants. Why not the others: B. Aortic coarctation stenting — Does not address RVOT narrowing.; C. Balloon mitral valvotomy — Targets an unrelated valve.; D. Secundum ASD occluder in the atrial septum — Does not relieve RVOTO.", "pearl": "RVOT stenting is a palliation option.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical / Application", "question": "A child with cyanotic TOF undergoes a modified systemic-to-pulmonary shunt. What is its principal aim?", "options": ["Correct overriding aorta without cardiopulmonary bypass", "Increase pulmonary blood flow pending definitive repair", "Close the malalignment VSD definitively", "Reduce pulmonary blood flow to limit cyanosis"], "answer": 1, "explanation": "Shunt provides a systemic source of pulmonary perfusion. Why not the others: A. Correct overriding aorta without cardiopulmonary bypass — Not achieved by palliation.; C. Close the malalignment VSD definitively — The VSD remains until repair.; D. Reduce pulmonary blood flow to limit cyanosis — Would worsen desaturation.", "pearl": "A BT shunt raises pulmonary blood flow.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 2',href:'Day18/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
