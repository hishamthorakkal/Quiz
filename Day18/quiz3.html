<script>
const quiz=[{"num": 35, "level": "Clinical / Application", "question": "CT shows TOF with pulmonary atresia, diminutive central pulmonary arteries and multiple MAPCAs. Which planning question is most relevant?", "options": ["Measure mitral leaflet area for balloon valvotomy", "Assume a single ductal supply to both lungs", "Map collateral supply and PA confluence", "Decide whether to close a normal atrial septum"], "answer": 2, "explanation": "Anatomy determines staged versus combined reconstruction. Why not the others: A. Measure mitral leaflet area for balloon valvotomy — Does not address pulmonary blood supply.; B. Assume a single ductal supply to both lungs — MAPCAs may provide substantial alternative flow.; D. Decide whether to close a normal atrial septum — Atrial closure is not the central surgical issue.", "pearl": "Map collaterals before unifocalization.", "srcAnswer": "C"}, {"num": 36, "level": "Clinical / Application", "question": "A 1-month-old with TOF variant has wheeze, respiratory distress and hugely dilated branch pulmonary arteries. Which mechanism should be prioritized?", "options": ["Primary pulmonary vein stenosis", "Bronchial compression from dilated pulmonary arteries", "Isolated pulmonary vascular oligemia without airway effects", "Recurrent aspiration caused solely by VSD flow"], "answer": 1, "explanation": "Airway compression is a hallmark of absent pulmonary valve syndrome. Why not the others: A. Primary pulmonary vein stenosis — Not the defining abnormality in this TOF variant.; C. Isolated pulmonary vascular oligemia without airway effects — Severe airway symptoms suggest mechanical compression.; D. Recurrent aspiration caused solely by VSD flow — Cannot explain striking PA aneurysmal dilation.", "pearl": "Dilated PAs can compress airways.", "srcAnswer": "B"}, {"num": 37, "level": "Clinical / Application", "question": "CXR in a cyanotic 8-month-old shows concave pulmonary artery segment, upturned apex and sparse peripheral lung vessels. What is the most likely physiological group?", "options": ["Unobstructed high-flow admixture lesion", "Large isolated left-to-right VSD", "TOF-type reduced pulmonary blood flow", "Obstructed pulmonary venous return"], "answer": 2, "explanation": "Boot-shaped heart and oligemia suggest RVOTO with R-to-L shunt. Why not the others: A. Unobstructed high-flow admixture lesion — Typically causes pulmonary plethora rather than oligemia.; B. Large isolated left-to-right VSD — Usually shows increased pulmonary vascularity.; D. Obstructed pulmonary venous return — Usually produces pulmonary edema, not clean oligemia.", "pearl": "Boot heart, oligemia, concave PA: TOF-type.", "srcAnswer": "C"}, {"num": 38, "level": "Clinical / Application", "question": "A cyanotic child has oligemic lungs, left-axis deviation and LVH rather than RVH. Which alternate lesion should be actively considered?", "options": ["Ebstein anomaly with massive RA", "Severe isolated pulmonary stenosis with RVH", "Tricuspid atresia", "Classical TOF with RVH"], "answer": 2, "explanation": "Hypoplastic RV and LV dominance can produce left axis and LVH. Why not the others: A. Ebstein anomaly with massive RA — Often has marked RA enlargement and variable ECG rather than classic LVH pattern.; B. Severe isolated pulmonary stenosis with RVH — Would more commonly produce RV dominance.; D. Classical TOF with RVH — TOF usually shows right axis and RVH.", "pearl": "Oligemia with LVH and left axis: tricuspid atresia.", "srcAnswer": "C"}, {"num": 39, "level": "Clinical / Application", "question": "A 6-month-old with TOF is being evaluated for repair. Which echo element directly influences need for a transannular patch?", "options": ["Normal coronary sinus flow velocity", "Pulmonary valve annulus size relative to body size", "Presence of a trivial PFO on echo", "Diameter of the left atrial appendage"], "answer": 1, "explanation": "Hypoplastic annulus may necessitate transannular RVOT enlargement. Why not the others: A. Normal coronary sinus flow velocity — Not the main factor in patch planning.; C. Presence of a trivial PFO on echo — Not decisive for RVOT reconstruction.; D. Diameter of the left atrial appendage — Not the primary determinant of patch strategy.", "pearl": "Annulus size drives the patch decision.", "srcAnswer": "B"}, {"num": 40, "level": "Clinical / Application", "question": "Preoperative CT reveals LAD arising from RCA and crossing anterior RVOT. Which operative concern is most important?", "options": ["Close the PDA as the sole definitive intervention", "Abandon corrective surgery in infancy", "Treat as primary coronary vasculitis", "Avoid injuring the anomalous coronary at RVOT repair"], "answer": 3, "explanation": "Crossing LAD can alter incision and conduit choices. Why not the others: A. Close the PDA as the sole definitive intervention — Does not correct TOF anatomy.; B. Abandon corrective surgery in infancy — Alternative approaches are available.; C. Treat as primary coronary vasculitis — Anomalous origin is congenital anatomy, not inflammation.", "pearl": "Map the coronary before the RVOT incision.", "srcAnswer": "D"}, {"num": 41, "level": "Clinical / Application", "question": "An infant with TOF has hypocalcemia, palatal anomaly and recurrent infections. Which additional assessment is most appropriate?", "options": ["Test for trisomy 18 before anything else", "Skip genetic counselling since TOF is sporadic", "Attribute findings to isolated RVH", "Evaluate for 22q11.2 deletion and immune/calcium issues"], "answer": 3, "explanation": "Conotruncal lesion plus extracardiac features suggests this syndrome. Why not the others: A. Test for trisomy 18 before anything else — Does not best match this constellation.; B. Skip genetic counselling since TOF is sporadic — Genetic assessment can affect care and family counselling.; C. Attribute findings to isolated RVH — RVH does not explain immune/palatal findings.", "pearl": "TOF with hypocalcemia and palate: test 22q11.2.", "srcAnswer": "D"}, {"num": 42, "level": "Clinical / Application", "question": "A teenager years after transannular TOF repair has exercise intolerance and RV dilation. Which residual lesion is a common explanation?", "options": ["Acute mitral valve atresia", "Chronic pulmonary regurgitation", "Primary pulmonary venous obstruction from the patch", "New failure of the VSD patch in most patients"], "answer": 1, "explanation": "Regurgitant pulmonary flow chronically enlarges RV. Why not the others: A. Acute mitral valve atresia — Not a typical delayed TOF repair lesion.; C. Primary pulmonary venous obstruction from the patch — Not a routine consequence of RVOT repair.; D. New failure of the VSD patch in most patients — Residual VSD is possible but not inevitable and less fitting.", "pearl": "Late teenage decline: think chronic PR.", "srcAnswer": "B"}, {"num": 43, "level": "Clinical / Application", "question": "An adult with repaired TOF has palpitations and presyncope. What follow-up concern deserves priority?", "options": ["Treat as isolated pulmonary infection without ECG", "Assume the symptoms are benign sinus arrhythmia", "Conclude there can be no arrhythmia after repair", "Postoperative atrial or ventricular arrhythmia"], "answer": 3, "explanation": "Scar and RV loading create arrhythmic risk. Why not the others: A. Treat as isolated pulmonary infection without ECG — Cardiac symptoms require ECG/rhythm assessment.; B. Assume the symptoms are benign sinus arrhythmia — Repaired TOF carries clinically important arrhythmic risk.; C. Conclude there can be no arrhythmia after repair — Incorrect; lifelong rhythm surveillance is important.", "pearl": "Late repaired TOF: arrhythmia risk.", "srcAnswer": "D"}, {"num": 44, "level": "Clinical / Application", "question": "A child with repaired TOF and prosthetic material underwent complete repair 3 months ago. Which principle applies to an indicated high-risk dental procedure?", "options": ["Prophylaxis at each febrile illness for life", "Prophylaxis may apply for 6 months after repair", "Prophylaxis is needed if saturation is below 70%", "No dental hygiene advice after repair"], "answer": 1, "explanation": "Guidance recognizes an early endothelialization window; residual defects change eligibility. Why not the others: A. Prophylaxis at each febrile illness for life — IE prophylaxis is procedure- and risk-specific.; C. Prophylaxis is needed if saturation is below 70% — Prosthetic material timing matters, not only current saturation.; D. No dental hygiene advice after repair — Oral hygiene remains important.", "pearl": "IE prophylaxis in the first 6 months after prosthetic repair.", "srcAnswer": "B"}, {"num": 45, "level": "High Difficulty", "question": "A chronically cyanotic older child with TOF has elevated hemoglobin and microcytosis. What is the most useful next clinical distinction?", "options": ["Secondary erythrocytosis with iron deficiency possible", "Primary polycythemia vera is the likely cause", "Therapeutic phlebotomy for a high hematocrit", "Normal red-cell physiology rules out iron deficiency"], "answer": 0, "explanation": "Cyanosis raises erythropoietic drive; microcytosis may indicate iron deficiency. Why not the others: B. Primary polycythemia vera is the likely cause — Secondary hypoxemia is a more immediate explanation.; C. Therapeutic phlebotomy for a high hematocrit — Routine venesection can worsen iron deficiency and viscosity symptoms.; D. Normal red-cell physiology rules out iron deficiency — Iron deficiency can coexist with high Hb.", "pearl": "Cyanotic secondary erythrocytosis: check iron.", "srcAnswer": "A"}, {"num": 46, "level": "High Difficulty", "question": "A neonate with cyanosis has echo-confirmed malalignment VSD and severe RVOTO. Why should this be called structural TOF rather than PPHN alone?", "options": ["The structural lesion explains fixed obstruction and shunt", "Poor oxygen response is what defines PPHN", "Right-to-left shunting is not seen in PPHN", "Pulmonary artery pressure is normal in TOF"], "answer": 0, "explanation": "PPHN alone does not create TOF morphology. Why not the others: B. Poor oxygen response is what defines PPHN — Echo anatomy is decisive.; C. Right-to-left shunting is not seen in PPHN — PPHN may shunt across PDA/PFO.; D. Pulmonary artery pressure is normal in TOF — RV pressure can be systemic due to RVOTO.", "pearl": "A structural lesion explains TOF cyanosis, not PPHN.", "srcAnswer": "A"}, {"num": 47, "level": "Clinical / Application", "question": "A child with suspected TOF has a first hypercyanotic spell that resolves with knee-chest positioning. What follow-up action is essential?", "options": ["Wait for clubbing before referral", "Prescribe home oxygen as definitive correction", "Urgent cardiology review and repair planning", "Reassure and avoid further investigation"], "answer": 2, "explanation": "A spell signals unstable physiology even if it terminates. Why not the others: A. Wait for clubbing before referral — Clubbing is a late consequence and not a trigger to wait for.; B. Prescribe home oxygen as definitive correction — Oxygen does not correct the anatomical lesion.; D. Reassure and avoid further investigation — Resolution does not remove risk of recurrence.", "pearl": "Any spell needs cardiology review.", "srcAnswer": "C"}, {"num": 48, "level": "High Difficulty", "question": "Two TOF infants have similar large VSDs. Infant A has moderate fixed RVOTO; infant B has severe dynamic infundibular narrowing during agitation. Which variable best explains B’s acute fall in SpO2?", "options": ["A transient rise in the VSD pressure gradient", "A fall in systemic venous oxygen extraction", "Relative rise in RVOT versus systemic resistance", "Acute reduction in aortic override fraction"], "answer": 2, "explanation": "Shunt fraction depends on relative resistances and dynamic obstruction. Why not the others: A. A transient rise in the VSD pressure gradient — Large nonrestrictive VSD does not create the key gradient.; B. A fall in systemic venous oxygen extraction — Would not explain obstruction-triggered worsening.; D. Acute reduction in aortic override fraction — Anatomic override does not change minute to minute.", "pearl": "Dynamic obstruction raises RVOT resistance against SVR.", "srcAnswer": "C"}, {"num": 49, "level": "High Difficulty", "question": "During a tet spell, an inotrope with strong beta-agonist activity is started and cyanosis worsens. What mechanism is most plausible?", "options": ["Enhanced infundibular contractility worsens dynamic RVOTO", "It directly increases pulmonary annulus diameter", "It causes ductal reopening independent of PGE1", "It selectively lowers pulmonary vascular resistance without RV effects"], "answer": 0, "explanation": "Beta-adrenergic stimulation can intensify infundibular spasm. Why not the others: B. It directly increases pulmonary annulus diameter — It cannot mechanically enlarge the annulus.; C. It causes ductal reopening independent of PGE1 — Ductal reopening is not the expected primary effect.; D. It selectively lowers pulmonary vascular resistance without RV effects — The relevant adverse effect is increased dynamic obstruction.", "pearl": "Beta agonists can worsen a spell.", "srcAnswer": "A"}, {"num": 50, "level": "High Difficulty", "question": "An 8-kg child with known TOF is obtunded, SpO2 48%, shallow breathing and weak perfusion during a prolonged spell. Which is the safest next priority?", "options": ["Resuscitation-team ABC support with spell-directed therapy", "Prolong the knee-chest position until recovery", "Delay intervention until outpatient CT is arranged", "Administer an oral beta-blocker then discharge"], "answer": 0, "explanation": "Severe neurologic/respiratory compromise requires ABC stabilization and escalation. Why not the others: B. Prolong the knee-chest position until recovery — Positioning alone is inadequate for impending collapse.; C. Delay intervention until outpatient CT is arranged — Imaging must not delay emergency care.; D. Administer an oral beta-blocker then discharge — Unsafe with altered consciousness and poor perfusion.", "pearl": "A collapsing child needs resuscitation first.", "srcAnswer": "A"}, {"num": 51, "level": "High Difficulty", "question": "A 3-month-old with TOF has severe cyanosis, small annulus, limited branch PA growth and an anomalous LAD crossing RVOT. What is the most defensible strategy?", "options": ["Delay intervention until the age of 2 years", "Routine transannular RVOT incision without coronary mapping", "Palliation or modified repair by team after mapping", "Close the VSD and leave severe RVOTO untreated"], "answer": 2, "explanation": "Coronary and PA anatomy constrain safe repair; no single automatic procedure. Why not the others: A. Delay intervention until the age of 2 years — Severe cyanosis requires action.; B. Routine transannular RVOT incision without coronary mapping — Risks injuring anomalous LAD.; D. Close the VSD and leave severe RVOTO untreated — Would leave RV without adequate pulmonary outflow.", "pearl": "Coronary anomaly plus small annulus: team decision.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 3',href:'Day18/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
