<script>
const quiz=[{"num": 52, "level": "High Difficulty", "question": "A surgeon considers valve-sparing repair versus transannular patch in a stable TOF infant with borderline annulus. Which long-term trade-off matters most?", "options": ["Residual RVOTO versus chronic PR and RV dilation", "Avoiding the need for lifelong follow-up", "Presence or absence of isolated ASD", "Risk of immediate aortic coarctation"], "answer": 0, "explanation": "Valve preservation may leave gradient; patch may sacrifice competence. Why not the others: B. Avoiding the need for lifelong follow-up — Both repair strategies need surveillance.; C. Presence or absence of isolated ASD — Not the principal RVOT trade-off.; D. Risk of immediate aortic coarctation — Not the specific choice between RVOT techniques.", "pearl": "Patch choice trades RVOTO against PR.", "srcAnswer": "A"}, {"num": 53, "level": "High Difficulty", "question": "An adolescent after TOF repair has RV systolic pressure 80 mmHg and systemic pressure 100 mmHg, with rising exercise intolerance. Which interpretation is most appropriate?", "options": ["Residual VSD with left-to-right flow is established by RV/systemic systolic ratio 0.8", "Predominant severe pulmonary regurgitation must be assumed without outflow imaging", "The ratio alone establishes the need for immediate valve replacement", "High RV pressure warrants assessment of residual RVOT or PA obstruction and RV function"], "answer": 3, "explanation": "Best: pressure burden and symptoms require echo/possibly further imaging to localize obstruction. Why not the others: A. Residual VSD with left-to-right flow is established by RV/systemic systolic ratio 0.8 — A restrictive residual VSD is possible but cannot be diagnosed from pressure ratio alone.; B. Predominant severe pulmonary regurgitation must be assumed without outflow imaging — PR can coexist, but severe high RV systolic pressure specifically requires interrogation of outflow and distal PA resistance.; C. The ratio alone establishes the need for immediate valve replacement — A ratio is not itself a standalone indication for valve replacement.", "pearl": "RV/systemic ratio near 0.8 suggests residual obstruction.", "srcAnswer": "D"}, {"num": 54, "level": "High Difficulty", "question": "A 4-year-old with unrepaired TOF has 5 days of fever, headache, vomiting and new right-sided weakness. What is the best next step?", "options": ["Treat as presumed cerebral thrombosis without excluding focal infection", "Empirical CNS antibiotics immediately, omitting urgent focal-lesion imaging", "Lumbar puncture after checking fundoscopy, before cross-sectional imaging", "Urgent contrast brain imaging and neuroinfectious/neurosurgical assessment"], "answer": 3, "explanation": "Best: fever and focal deficit in cyanotic CHD raise brain abscess; imaging before LP is essential. Why not the others: A. Treat as presumed cerebral thrombosis without excluding focal infection — Thrombosis is a differential but fever with headache and progression makes abscess important to exclude.; B. Empirical CNS antibiotics immediately, omitting urgent focal-lesion imaging — Antibiotics are important if infection is suspected but do not replace urgent imaging and source control evaluation.; C. Lumbar puncture after checking fundoscopy, before cross-sectional imaging — Focal neurology is a contraindication to blind LP until mass effect assessed.", "pearl": "Cyanotic CHD + fever + focal deficit: image for brain abscess before lumbar puncture.", "srcAnswer": "D"}, {"num": 55, "level": "Clinical / Application", "question": "A prolonged tet spell persists despite active airway, oxygenation, perfusion and trigger correction. Blood-gas testing confirms severe metabolic acidosis and the cardiac resuscitation team is present. Which additional intervention may be considered under protocol while definitive spell care continues?", "options": ["Continue hyperoxia alone because bicarbonate always worsens right-to-left shunting", "Give bicarbonate routinely before correcting poor perfusion or ventilation", "Sodium bicarbonate for significant acidosis", "Use bicarbonate only to treat a low saturation with normal acid-base status"], "answer": 2, "explanation": "Bicarbonate is listed as an adjunct in the identified 2019 Indian consensus. Correct ventilation, perfusion and precipitating causes first; bicarbonate is not routine for every spell. Why not the others: A. Continue hyperoxia alone because bicarbonate always worsens right-to-left shunting — Oxygen should continue as needed, but severe persistent acidosis requires full reassessment and protocol-driven correction.; B. Give bicarbonate routinely before correcting poor perfusion or ventilation — The first priority is restoring oxygenation, perfusion and ventilation; bicarbonate is not a substitute.; D. Use bicarbonate only to treat a low saturation with normal acid-base status — Bicarbonate is an acid-base adjunct in selected significant acidosis, not an antidote to cyanosis itself.", "pearl": "Spell algorithm is monitored and severity-dependent; the 2019 Indian consensus includes bicarbonate among adjuncts, not as routine treatment for every child.", "srcAnswer": "C"}, {"num": 56, "level": "High Difficulty", "question": "In TOF with pulmonary atresia, one lung segment is supplied by a MAPCA and another by tiny central PAs. Which preoperative principle is critical?", "options": ["Treat as uncomplicated valvar PS", "Map every pulmonary flow source before choosing repair", "Close the collaterals before defining native supply", "Assume the collaterals are expendable"], "answer": 1, "explanation": "Collateral and native PA distribution define feasibility and sequencing. Why not the others: A. Treat as uncomplicated valvar PS — Pulmonary atresia/MAPCAs are more complex.; C. Close the collaterals before defining native supply — May deprive lung tissue of perfusion.; D. Assume the collaterals are expendable — Some collaterals supply essential lung segments.", "pearl": "Map every pulmonary flow source in TOF-PA.", "srcAnswer": "B"}, {"num": 57, "level": "High Difficulty", "question": "A cyanotic infant has an oligemic CXR, superior/leftward QRS axis and dominant LV on echo. Which diagnosis is more likely than classic TOF?", "options": ["Classical TOF with marked RVH", "Large VSD with unrestricted pulmonary flow", "d-TGA with intact septum and plethora", "Tricuspid atresia with restricted pulmonary flow"], "answer": 3, "explanation": "LV dominance and superior axis point toward tricuspid atresia. Why not the others: A. Classical TOF with marked RVH — Usually has RV dominance and rightward axis.; B. Large VSD with unrestricted pulmonary flow — Typically causes pulmonary plethora and left loading.; C. d-TGA with intact septum and plethora — Parallel-circulation lesion often has increased PBF and different ECG.", "pearl": "Oligemia with LVH and superior axis: tricuspid atresia.", "srcAnswer": "D"}, {"num": 58, "level": "High Difficulty", "question": "A 2-day-old has severe TOF with near pulmonary atresia. SpO2 falls and ductal Doppler flow is diminishing. What is the immediate physiological target?", "options": ["Raise pulmonary vascular resistance to redirect blood toward the lungs", "Initiate systemic vasoconstriction alone, regardless of ductal constriction", "Proceed to ductal stenting without stabilization or defining pulmonary supply", "Preserve/re-establish ductal flow with monitored PGE1 and urgent anatomical assessment"], "answer": 3, "explanation": "Best: duct-dependent pulmonary supply should be maintained immediately during assessment. Why not the others: A. Raise pulmonary vascular resistance to redirect blood toward the lungs — Increased PVR would not improve absent pulmonary arterial access.; B. Initiate systemic vasoconstriction alone, regardless of ductal constriction — SVR optimization may help perfusion but cannot restore duct-derived pulmonary flow.; C. Proceed to ductal stenting without stabilization or defining pulmonary supply — Stenting may ultimately be selected but first stabilize and define PA/MAPCA anatomy.", "pearl": "Restore ductal flow in duct-dependent TOF.", "srcAnswer": "D"}, {"num": 59, "level": "High Difficulty", "question": "A TOF infant has right aortic arch and suspected anomalous coronary. What is the best imaging planning statement?", "options": ["Right arch makes coronary anomalies unlikely", "Echo first; CT/MRI for arch, coronary and PA anatomy", "Catheterization is needed in uncomplicated TOF", "Chest X-ray can map the coronary course"], "answer": 1, "explanation": "Complex extracardiac anatomy may need cross-sectional mapping. Why not the others: A. Right arch makes coronary anomalies unlikely — The findings can coexist.; C. Catheterization is needed in uncomplicated TOF — Echo often suffices; extra imaging is individualized.; D. Chest X-ray can map the coronary course — CXR cannot define coronary origin/course.", "pearl": "Echo first; CT/MRI for coronary and arch.", "srcAnswer": "B"}, {"num": 60, "level": "High Difficulty", "question": "A 7-month-old with TOF has a crying-associated collapse with cyanosis, hyperpnea and brief stiffening. Which immediate approach is safest?", "options": ["Label benign breath-holding without assessment", "Treat as a spell; stabilize ABC; consider seizure", "Perform lumbar puncture before oxygenation", "Assume primary epilepsy and ignore saturation"], "answer": 1, "explanation": "Cerebral hypoxemia can cause convulsive activity; emergency physiology takes priority. Why not the others: A. Label benign breath-holding without assessment — Known TOF plus profound cyanosis requires urgent care.; C. Perform lumbar puncture before oxygenation — Delays resuscitation.; D. Assume primary epilepsy and ignore saturation — Profound cyanosis and spell triggers demand circulatory assessment.", "pearl": "Treat spell first; consider seizure mimics.", "srcAnswer": "B"}, {"num": 61, "level": "High Difficulty", "question": "Before an urgent noncardiac procedure, a child with unrepaired TOF becomes hypovolemic and receives a vasodilating induction agent. What combination increases spell risk?", "options": ["Lower preload and SVR with increased R-to-L shunt", "Increased SVR and improved RV filling", "Reduced catecholamines with stable preload", "Raised PVR with high SVR and good filling"], "answer": 0, "explanation": "Both factors reduce pulmonary flow relative to systemic output. Why not the others: B. Increased SVR and improved RV filling — Usually protective rather than provoking.; C. Reduced catecholamines with stable preload — Does not explain the provocation described.; D. Raised PVR with high SVR and good filling — PVR may contribute, but specified combined risk is preload/SVR reduction.", "pearl": "Vasodilating induction invites a spell.", "srcAnswer": "A"}, {"num": 62, "level": "High Difficulty", "question": "A child with marked TOF cyanosis has a single second heart sound. Which component is typically poorly audible?", "options": ["P2 is delayed and unusually loud because RV ejection is markedly prolonged", "P2 is faint/absent acoustically because valve narrowing and low pulmonary flow diminish its sound", "A2 is delayed enough to merge with a normally audible P2", "Both A2 and P2 are preserved, but respiratory splitting becomes fixed"], "answer": 1, "explanation": "Best: severely reduced pulmonic component explains the single S2. Why not the others: A. P2 is delayed and unusually loud because RV ejection is markedly prolonged — Severe TOF classically gives soft/inaudible rather than loud P2.; C. A2 is delayed enough to merge with a normally audible P2 — Aortic closure remains prominent; the absent pulmonic component is the usual explanation.; D. Both A2 and P2 are preserved, but respiratory splitting becomes fixed — Fixed splitting suggests other physiology rather than severe RVOTO with faint P2.", "pearl": "A single S2 comes from a soft P2.", "srcAnswer": "B"}, {"num": 63, "level": "High Difficulty", "question": "An 18-month-old with unrepaired TOF and iron-deficiency anemia (Hb 8 g/dL) develops acute left hemiparesis after a diarrheal illness. What is the most likely mechanism?", "options": ["Hypoglycemic seizure with Todd paralysis", "Brain abscess from a bacterial focus", "Hypocalcemic tetany", "Cerebral thrombosis with dehydration and iron deficiency"], "answer": 3, "explanation": "Dehydration and iron deficiency raise the risk of cerebral arterial or venous thrombosis in cyanotic children. Why not the others: A. Hypoglycemic seizure with Todd paralysis — No seizure or hypoglycemia is described.; B. Brain abscess from a bacterial focus — Fever and a subacute course would be expected, and the setting here is dehydration.; C. Hypocalcemic tetany — Does not cause hemiparesis.", "pearl": "Cyanotic CHD + dehydration + iron deficiency: think cerebral thrombosis.", "srcAnswer": "D"}, {"num": 64, "level": "Conceptual", "question": "Which association describes the pentalogy of Fallot?", "options": ["TOF with pulmonary atresia and MAPCAs", "TOF with absent pulmonary valve", "TOF with an AV canal defect", "TOF with an atrial septal defect"], "answer": 3, "explanation": "Pentalogy of Fallot is TOF with an atrial septal defect. Why not the others: A. TOF with pulmonary atresia and MAPCAs — A variant of TOF, not the pentalogy.; B. TOF with absent pulmonary valve — A variant with airway compression, not the pentalogy.; C. TOF with an AV canal defect — That is TOF with AVSD, a distinct entity.", "pearl": "Pentalogy of Fallot = TOF + ASD; right aortic arch occurs in about a quarter of TOF.", "srcAnswer": "D"}, {"num": 65, "level": "Clinical / Application", "question": "A postrepair TOF patient has severe pulmonary regurgitation and new ventricular ectopy. Which assessment combination is most useful?", "options": ["ECG/Holter plus echo or CMR of the RV and residual lesions", "Exercise testing alone to quantify symptoms without imaging or rhythm monitoring", "Cardiac MRI alone without evaluating the arrhythmia burden", "ECG monitoring alone while postponing quantification of residual valve lesions"], "answer": 0, "explanation": "Electrical and structural surveillance both influence risk assessment. Why not the others: B. Exercise testing alone to quantify symptoms without imaging or rhythm monitoring — Functional data may help but severe PR and ventricular ectopy require RV imaging and ECG/rhythm assessment.; C. Cardiac MRI alone without evaluating the arrhythmia burden — CMR helps quantify RV volume/function, but new ectopy requires ECG/Holter assessment.; D. ECG monitoring alone while postponing quantification of residual valve lesions — Rhythm evaluation is needed but cannot replace examination of severe PR and RV remodeling.", "pearl": "Late arrhythmia: rhythm monitoring plus imaging.", "srcAnswer": "A"}, {"num": 66, "level": "High Difficulty", "question": "After a systemic-to-pulmonary shunt for TOF, the infant develops pulmonary overcirculation and systemic diastolic runoff. Which conceptual risk is most relevant?", "options": ["Big shunt may overload lungs, starve systemic flow", "Excessive pulmonary runoff produces isolated pulmonary hypertension without effect on systemic perfusion", "Excessive shunt flow leading to rising pulmonary venous return and LV volume load without systemic runoff", "Fixed reduction of native RVOT obstruction after placement of the shunt"], "answer": 0, "explanation": "Palliation requires balanced Qp and Qs; too much flow has consequences. Why not the others: B. Excessive pulmonary runoff produces isolated pulmonary hypertension without effect on systemic perfusion — Pulmonary flow overload can raise downstream pressures, but an important danger in this described shunt is systemic diastolic steal.; C. Excessive shunt flow leading to rising pulmonary venous return and LV volume load without systemic runoff — Pulmonary overload can occur, but the described diastolic runoff additionally threatens systemic perfusion.; D. Fixed reduction of native RVOT obstruction after placement of the shunt — The shunt bypasses restricted RVOT flow but need not modify the native obstruction.", "pearl": "A big shunt can steal systemic flow.", "srcAnswer": "A"}, {"num": 67, "level": "High Difficulty", "question": "A repaired TOF adult has progressive RV enlargement, severe PR and QRS widening. What is the best principle?", "options": ["Pulmonary valve intervention using RV volume alone without electrophysiology risk assessment", "Electrophysiology testing alone without review of PR and RV geometry", "Integrated evaluation for valve timing and arrhythmia risk", "Serial oxygen saturation measurement alone because normal resting saturation excludes ventricular dysfunction"], "answer": 2, "explanation": "Volume loading, electrical remodeling and symptoms should be considered together. Why not the others: A. Pulmonary valve intervention using RV volume alone without electrophysiology risk assessment — Severe PR and RV enlargement warrant evaluation, but QRS widening and arrhythmia risk need integrated assessment.; B. Electrophysiology testing alone without review of PR and RV geometry — Rhythm risk is relevant but structural RV loading and valve timing also need consideration.; D. Serial oxygen saturation measurement alone because normal resting saturation excludes ventricular dysfunction — Normal SpO2 after repair does not rule out progressive RV loading or arrhythmia.", "pearl": "Late TOF needs integrated review.", "srcAnswer": "C"}, {"num": 68, "level": "Integrated / Rank Differentiating", "question": "A 5-month-old with TOF develops fever, poor intake, agitation, SpO2 52%, softer RVOT murmur and low BP. Which management bundle best addresses the immediate physiology?", "options": ["ABC, calm position, oxygen and fluid reassessment; delay vasoactive escalation until repeat echo", "ABC, knee-chest and oxygen; preferentially reduce SVR if BP remains low", "ABC, oxygen and crystalloid; treat tachycardia with unmonitored beta agonist", "ABC, knee-chest, oxygen, indicated isotonic fluid and monitored specialist beta-blockade/SVR support"], "answer": 3, "explanation": "Best: integrated rescue addresses preload, relative resistance and dynamic RVOTO while arranging specialist care. Why not the others: A. ABC, calm position, oxygen and fluid reassessment; delay vasoactive escalation until repeat echo — Early steps are appropriate, but severe hypotensive spell needs prompt monitored escalation.; B. ABC, knee-chest and oxygen; preferentially reduce SVR if BP remains low — SVR reduction worsens right-to-left shunting and is especially unsafe with hypotension.; C. ABC, oxygen and crystalloid; treat tachycardia with unmonitored beta agonist — Beta agonism can aggravate infundibular obstruction; unmonitored use is inappropriate.", "pearl": "Fever spell: ABC, fluid and SVR/beta-blockade.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 4',href:'Day18/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
