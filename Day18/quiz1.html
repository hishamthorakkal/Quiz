<script>
const quiz=[{"num": 1, "level": "Basic / Recall", "question": "A newborn echo shows a malalignment VSD, overriding aorta, right ventricular outflow obstruction and RV hypertrophy. Which named lesion fits the full tetrad?", "options": ["Double-outlet right ventricle with pulmonary stenosis", "Tricuspid atresia with VSD and pulmonary stenosis", "Isolated valvar pulmonary stenosis with RV hypertrophy", "Classic tetralogy of Fallot"], "answer": 3, "explanation": "All four defining features are present. Why not the others: A. Double-outlet right ventricle with pulmonary stenosis — Can mimic TOF physiology but both great arteries arise predominantly from RV.; B. Tricuspid atresia with VSD and pulmonary stenosis — Involves absent direct RA-to-RV connection and hypoplastic RV.; C. Isolated valvar pulmonary stenosis with RV hypertrophy — Does not explain the malalignment VSD and overriding aorta.", "pearl": "The tetrad: malalignment VSD, overriding aorta, RVOTO, RVH.", "srcAnswer": "D"}, {"num": 2, "level": "Basic / Recall", "question": "The outlet septum is displaced anterosuperiorly, producing a malalignment VSD and subpulmonary narrowing. What is the primary developmental event?", "options": ["Posteroinferior displacement of the conal septum", "Excessive growth of the membranous interventricular septum", "Failure of rotation of the truncal outflow tract alone", "Anterosuperior infundibular septal deviation"], "answer": 3, "explanation": "This unifies VSD, overriding aorta and RVOTO. Why not the others: A. Posteroinferior displacement of the conal septum — Wrong direction of malalignment for classical TOF; the characteristic displacement is anterosuperior.; B. Excessive growth of the membranous interventricular septum — This does not explain the combined malalignment VSD, aortic override and subpulmonary obstruction.; C. Failure of rotation of the truncal outflow tract alone — Outflow rotation defects contribute to other conotruncal patterns; isolated rotation failure does not account for the TOF quartet.", "pearl": "Anterosuperior infundibular septum deviation explains the tetrad.", "srcAnswer": "D"}, {"num": 3, "level": "Basic / Recall", "question": "Which TOF component most strongly determines the degree of resting cyanosis in typical anatomy?", "options": ["Degree of RVOT obstruction relative to systemic resistance", "Degree of aortic override independent of RVOTO", "Magnitude of RV hypertrophy independent of flow", "Diameter of a coexisting atrial-level shunt"], "answer": 0, "explanation": "Best: balance of effective pulmonary and systemic outflow drives R-to-L diversion. Why not the others: B. Degree of aortic override independent of RVOTO — Override matters structurally but is not the primary variable behind cyanosis severity.; C. Magnitude of RV hypertrophy independent of flow — RVH reflects chronic pressure loading rather than directly measuring shunt fraction.; D. Diameter of a coexisting atrial-level shunt — An atrial shunt can alter mixing but usually does not dominate classical TOF cyanosis.", "pearl": "RVOTO severity sets the shunt balance and cyanosis.", "srcAnswer": "A"}, {"num": 4, "level": "Basic / Recall", "question": "In an uncomplicated child with TOF, the usual systolic ejection murmur arises predominantly from which structure?", "options": ["Turbulence across the large malalignment VSD", "Turbulence across the narrowed RVOT", "Flow acceleration across an overriding aortic root", "Regurgitant flow from the tricuspid valve"], "answer": 1, "explanation": "Best: the systolic ejection murmur generally reflects RVOT obstruction. Why not the others: A. Turbulence across the large malalignment VSD — Large nonrestrictive VSD typically has little interventricular gradient.; C. Flow acceleration across an overriding aortic root — Aortic override by itself does not produce the classical ejection murmur.; D. Regurgitant flow from the tricuspid valve — Tricuspid regurgitation produces a different auscultatory pattern.", "pearl": "The TOF murmur is flow across the RVOT, not the VSD.", "srcAnswer": "B"}, {"num": 5, "level": "Basic / Recall", "question": "Which conventional chest radiograph pairing most strongly supports classical TOF?", "options": ["Upturned cardiac apex and pulmonary oligemia", "Globular cardiac contour with increased central pulmonary vascularity", "Straight left heart border with preserved peripheral pulmonary markings", "Right-sided cardiac prominence with pulmonary venous congestion"], "answer": 0, "explanation": "RVH gives an upturned apex; RVOTO reduces lung vascular markings. Why not the others: B. Globular cardiac contour with increased central pulmonary vascularity — A globular, plethoric pattern suggests another physiology and does not match the oligemic TOF pattern.; C. Straight left heart border with preserved peripheral pulmonary markings — A straight left border without oligemia lacks the characteristic elevated apex and reduced peripheral markings.; D. Right-sided cardiac prominence with pulmonary venous congestion — Pulmonary venous congestion does not support the reduced-flow physiology of classical TOF.", "pearl": "Oligemia with an upturned apex favours TOF.", "srcAnswer": "A"}, {"num": 6, "level": "Basic / Recall", "question": "Which ECG pattern is classically expected in a child with unrepaired TOF?", "options": ["Right-axis deviation with predominantly left ventricular hypertrophy", "Normal frontal axis with right ventricular hypertrophy", "Superior frontal axis with right ventricular hypertrophy", "Right-axis deviation with RVH"], "answer": 3, "explanation": "Chronic RV pressure loading produces RV dominance. Why not the others: A. Right-axis deviation with predominantly left ventricular hypertrophy — An isolated LV-dominant pattern does not fit typical RV pressure overload.; B. Normal frontal axis with right ventricular hypertrophy — RVH may be present, but classical TOF more often has a rightward axis.; C. Superior frontal axis with right ventricular hypertrophy — A superior axis prompts consideration of associated AV septal morphology or other lesions, not typical isolated TOF.", "pearl": "TOF: right axis and RVH.", "srcAnswer": "D"}, {"num": 7, "level": "Basic / Recall", "question": "Which chromosomal microdeletion is an important association in conotruncal defects including TOF?", "options": ["1p36 terminal deletion", "8p23.1 deletion involving GATA4", "7q11.23 deletion involving elastin", "22q11.2 deletion"], "answer": 3, "explanation": "A recognised conotruncal association; screen when phenotype indicates. Why not the others: A. 1p36 terminal deletion — Other genetic syndromes can have cardiac disease, but this is not the signature conotruncal deletion tested here.; B. 8p23.1 deletion involving GATA4 — May be associated with structural CHD but is not the prototypical TOF conotruncal microdeletion.; C. 7q11.23 deletion involving elastin — Associated with Williams syndrome and supravalvar aortic stenosis rather than the classic TOF association.", "pearl": "Conotruncal defects: think 22q11.2.", "srcAnswer": "D"}, {"num": 8, "level": "Conceptual", "question": "A child with TOF has a nonrestrictive VSD and fixed anatomy. Why can an abrupt fall in systemic vascular resistance worsen cyanosis?", "options": ["Reduced systemic afterload decreases R-to-L flow through the VSD", "A fall in PVR always follows the fall in SVR and dominates flow", "Lower systemic resistance favors R-to-L flow across the large VSD", "Lower afterload reduces infundibular constriction enough to restore flow"], "answer": 2, "explanation": "Best: diversion toward the systemic circuit increases as relative resistance shifts. Why not the others: A. Reduced systemic afterload decreases R-to-L flow through the VSD — Reduced SVR usually increases rather than decreases relative right-to-left streaming.; B. A fall in PVR always follows the fall in SVR and dominates flow — PVR may vary but cannot be assumed to fall proportionally or dominate the acute response.; D. Lower afterload reduces infundibular constriction enough to restore flow — No reliable immediate relief of RVOTO follows systemic vasodilation.", "pearl": "Low SVR favours right-to-left flow in TOF.", "srcAnswer": "C"}, {"num": 9, "level": "Conceptual", "question": "Why does knee-chest positioning often improve a hypercyanotic spell?", "options": ["Increasing systemic vascular resistance relative to pulmonary outflow resistance", "Increasing pulmonary vascular resistance to limit right-to-left streaming", "Reducing venous return so that dynamic RVOTO lessens", "Increasing infundibular contractility to propel blood across the obstruction"], "answer": 0, "explanation": "Best: increased SVR reduces the proportion of flow shunting into the aorta. Why not the others: B. Increasing pulmonary vascular resistance to limit right-to-left streaming — Increasing PVR generally opposes pulmonary blood flow.; C. Reducing venous return so that dynamic RVOTO lessens — Diminished preload can increase dynamic obstruction and worsen the spell.; D. Increasing infundibular contractility to propel blood across the obstruction — Increased infundibular contractility may aggravate rather than relieve dynamic RVOTO.", "pearl": "Knee-chest raises SVR and cuts R-to-L flow.", "srcAnswer": "A"}, {"num": 10, "level": "Conceptual", "question": "During a severe hypercyanotic spell, the pre-existing RVOT murmur becomes much softer. What is the best explanation?", "options": ["Loss of the RVOT murmur due to a new restrictive VSD", "Sudden fall in RV pressure despite persistent obstruction", "Improvement in pulmonary flow without changing the RVOT gradient", "Markedly reduced flow across a more obstructed RVOT"], "answer": 3, "explanation": "Best: when flow through the outflow tract collapses the ejection murmur may soften. Why not the others: A. Loss of the RVOT murmur due to a new restrictive VSD — The large VSD does not acutely become restrictive during crying.; B. Sudden fall in RV pressure despite persistent obstruction — RV pressure remains high in severe TOF; murmur intensity alone cannot establish normalization.; C. Improvement in pulmonary flow without changing the RVOT gradient — Improved flow does not explain sudden deepening cyanosis in the presented spell.", "pearl": "A softer murmur in a spell means less flow, not relief.", "srcAnswer": "D"}, {"num": 11, "level": "Conceptual", "question": "A child with TOF anatomy is initially well saturated. Which feature most plausibly explains this pink presentation?", "options": ["Relatively preserved antegrade pulmonary flow across mild RVOTO", "Compensatory opening of an atrial-level right-to-left shunt", "Severe infundibular narrowing balanced by reduced systemic resistance", "Near-complete pulmonary atresia with no duct or collaterals"], "answer": 0, "explanation": "Best: less RVOTO preserves pulmonary blood flow and can minimize early cyanosis. Why not the others: B. Compensatory opening of an atrial-level right-to-left shunt — Additional right-to-left atrial shunting would tend to reduce rather than improve saturation.; C. Severe infundibular narrowing balanced by reduced systemic resistance — Lower SVR generally worsens right-to-left flow in an obstructed RVOT setting.; D. Near-complete pulmonary atresia with no duct or collaterals — Severe absence of pulmonary flow does not explain a well-saturated infant.", "pearl": "Pink TOF has mild RVOTO and good pulmonary flow.", "srcAnswer": "A"}, {"num": 12, "level": "Conceptual", "question": "Why can TOF cyanosis become more obvious during the first months after an initially pink neonatal period?", "options": ["Falling postnatal PVR unmasks mild RVOT obstruction without any RVOT progression", "Increasing LV pressure converts the large VSD into a restrictive defect", "Progressive RVOT obstruction alters pulmonary flow", "Physiological postnatal duct closure in all classical TOF converts pulmonary flow to zero"], "answer": 2, "explanation": "Increasing relative RVOTO promotes R-to-L shunting. Why not the others: A. Falling postnatal PVR unmasks mild RVOT obstruction without any RVOT progression — The fall in PVR does not itself explain progression when the RVOT obstruction remains mild and pulmonary flow is preserved.; B. Increasing LV pressure converts the large VSD into a restrictive defect — A large malalignment VSD generally remains nonrestrictive; a restrictive VSD is not the usual explanation.; D. Physiological postnatal duct closure in all classical TOF converts pulmonary flow to zero — Stable classical TOF usually retains antegrade pulmonary flow and is not universally duct dependent.", "pearl": "Rising RVOTO turns pink TOF blue.", "srcAnswer": "C"}, {"num": 13, "level": "Conceptual", "question": "Which feedback loop best describes a tet spell after prolonged crying?", "options": ["Pulmonary venous obstruction triggers reflex RVOT spasm", "Hyperventilation closes the VSD, causing isolated LV failure", "Adrenergic RVOTO ↑ R-to-L shunt ↑ hypoxemia ↑ hyperpnea", "Crying raises SVR enough to abolish the shunt entirely"], "answer": 2, "explanation": "A self-amplifying obstruction and hypoxemia cycle develops. Why not the others: A. Pulmonary venous obstruction triggers reflex RVOT spasm — Pulmonary venous obstruction is not the primary TOF mechanism.; B. Hyperventilation closes the VSD, causing isolated LV failure — There is no acute VSD closure.; D. Crying raises SVR enough to abolish the shunt entirely — The observed spell involves worsening, not abolition, of R-to-L shunt.", "pearl": "Spell loop: catecholamines, RVOTO, shunt, hypoxemia, hyperpnea.", "srcAnswer": "C"}, {"num": 14, "level": "Conceptual", "question": "Why might prostaglandin E1 be lifesaving in a neonate with TOF and pulmonary atresia?", "options": ["It improves RV myocardial contractility enough to cross an atretic outflow", "It maintains the arterial duct when pulmonary perfusion is duct-dependent", "It relaxes a fixed pulmonary atretic membrane to restore RV outflow", "It reduces pulmonary vascular resistance without requiring ductal patency"], "answer": 1, "explanation": "Best: PGE1 keeps the PDA patent when it supplies the lungs. Why not the others: A. It improves RV myocardial contractility enough to cross an atretic outflow — Myocardial contractility does not overcome an anatomically atretic RV outflow.; C. It relaxes a fixed pulmonary atretic membrane to restore RV outflow — PGE1 does not anatomically open the atretic pulmonary valve.; D. It reduces pulmonary vascular resistance without requiring ductal patency — PGE1's lifesaving effect in duct-dependent pulmonary flow is maintaining ductal patency.", "pearl": "In TOF-PA the duct may be the only lung supply.", "srcAnswer": "B"}, {"num": 15, "level": "Conceptual", "question": "In TOF with absent pulmonary valve syndrome, which pathophysiology can dominate the presentation?", "options": ["Marked pulmonary regurgitation causing isolated left-ventricular dilation", "Airway compression by dilated pulmonary arteries", "Pulmonary arterial hypoplasia with no significant bronchial interaction", "Pulmonary venous hypertension due to primary mitral obstruction"], "answer": 1, "explanation": "Aneurysmal PAs can compress bronchi, causing respiratory symptoms. Why not the others: A. Marked pulmonary regurgitation causing isolated left-ventricular dilation — Absent pulmonary valve physiology predominantly affects the pulmonary arteries, airways and RV rather than causing isolated LV dilation.; C. Pulmonary arterial hypoplasia with no significant bronchial interaction — The classic absent-valve variant may cause aneurysmal pulmonary-artery dilation, not simple hypoplasia without airway effects.; D. Pulmonary venous hypertension due to primary mitral obstruction — This is a different mechanism and does not explain compression from aneurysmal pulmonary arteries.", "pearl": "Absent pulmonary valve: airway compression.", "srcAnswer": "B"}, {"num": 16, "level": "Conceptual", "question": "Why must a coronary artery crossing the anterior RVOT be mapped before TOF repair?", "options": ["It establishes that a transannular patch is always mandatory", "It predicts a restrictive VSD that requires patch enlargement", "It necessarily rules out all valve-sparing TOF repair", "A crossing LAD can be transected by a routine RVOT incision"], "answer": 3, "explanation": "Best: coronary anatomy directly determines safe surgical approach. Why not the others: A. It establishes that a transannular patch is always mandatory — Patch need also depends on pulmonary valve/annulus and coronary anatomy.; B. It predicts a restrictive VSD that requires patch enlargement — Coronary course does not establish VSD restrictiveness.; C. It necessarily rules out all valve-sparing TOF repair — Some anatomy permits adapted valve-sparing procedures; no universal prohibition exists.", "pearl": "A crossing coronary changes the RVOT incision.", "srcAnswer": "D"}, {"num": 17, "level": "Conceptual", "question": "What is the principal value of echo when TOF is suspected clinically?", "options": ["Establish the RVOT gradient alone without documenting branch pulmonary arteries", "Infer VSD restriction from the degree of RV hypertrophy alone", "Define VSD, override, RVOTO, PAs and other anomalies", "Measure pulmonary annulus only and defer coronary assessment even when abnormality is suspected"], "answer": 2, "explanation": "Echo establishes morphology and surgical planning. Why not the others: A. Establish the RVOT gradient alone without documenting branch pulmonary arteries — RVOTO is important, but a complete anatomical echo must also assess branch PAs, VSD and associated lesions.; B. Infer VSD restriction from the degree of RV hypertrophy alone — RV hypertrophy is not a substitute for direct assessment of VSD morphology and hemodynamics.; D. Measure pulmonary annulus only and defer coronary assessment even when abnormality is suspected — Annulus sizing matters, but the anatomical survey must address other important associated abnormalities.", "pearl": "Echo defines anatomy; it does not replace clinical care.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 1',href:'Day18/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
