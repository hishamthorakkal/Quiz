@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 69, "level": "Integrated / Rank Differentiating", "question": "A cyanotic child has boot-shaped heart, oligemia, RVH and echo showing malalignment VSD. A crossing coronary artery is also seen. What is the next decisive step?", "options": ["Map RVOT, annulus and coronary course before repair", "Perform routine transannular incision immediately", "Classify as tricuspid atresia because of cyanosis", "Treat as pulmonary venous obstruction"], "answer": 0, "explanation": "Correct lesion identified; crossing artery affects safe surgical route. Why not the others: B. Perform routine transannular incision immediately — Risk of coronary injury.; C. Classify as tricuspid atresia because of cyanosis — Echo anatomy and RVH fit TOF.; D. Treat as pulmonary venous obstruction — Imaging pattern and VSD/RVOTO do not support this.", "pearl": "Map coronary and annulus before repair.", "srcAnswer": "A"}, {"num": 70, "level": "Integrated / Rank Differentiating", "question": "A child with TOF, palatal insufficiency, lymphopenia and hypocalcemia is being planned for surgery. Which approach best integrates diagnosis and perioperative safety?", "options": ["Ignore noncardiac findings until after repair", "Test 22q11.2, immune status and calcium before surgery", "Assume isolated TOF with no genetic counselling", "Screen for hemoglobinopathy before surgery"], "answer": 1, "explanation": "Syndromic findings have perioperative infection and electrolyte implications. Why not the others: A. Ignore noncardiac findings until after repair — They may change perioperative management.; C. Assume isolated TOF with no genetic counselling — Phenotype warrants evaluation.; D. Screen for hemoglobinopathy before surgery — Does not explain conotruncal and immune features.", "pearl": "Syndromic TOF: assess immunity and calcium.", "srcAnswer": "B"}, {"num": 71, "level": "Integrated / Rank Differentiating", "question": "A cyanotic neonate has pulmonary atresia with VSD, scant central PAs and possible MAPCAs. Saturation falls as the duct closes. Which plan is best?", "options": ["Treat with an inhaled pulmonary vasodilator", "Wait for spontaneous duct closure before imaging", "Close VSD without providing pulmonary outflow", "PGE1, echo and mapping, then tailored palliation"], "answer": 3, "explanation": "Maintains perfusion while defining complex blood supply. Why not the others: A. Treat with an inhaled pulmonary vasodilator — Does not restore absent antegrade pulmonary outflow.; B. Wait for spontaneous duct closure before imaging — Risk of fatal loss of pulmonary flow.; C. Close VSD without providing pulmonary outflow — Would be unsafe without alternative lung supply.", "pearl": "Duct-dependent TOF-PA: PGE1 and mapping.", "srcAnswer": "D"}, {"num": 72, "level": "Integrated / Rank Differentiating", "question": "A 16-year-old repaired TOF patient has RVEDVi 168 mL/m2, severe PR, palpitations and falling exercise capacity. What is the most defensible next step?", "options": ["Specialist valve and rhythm assessment", "Treat with oral iron without cardiac review", "Observe because resting saturation is 98%", "Give PGE1 to improve ductal patency"], "answer": 0, "explanation": "CMR volume, symptoms and arrhythmia concern together support escalation. Why not the others: B. Treat with oral iron without cardiac review — Does not address severe PR or arrhythmia.; C. Observe because resting saturation is 98% — Saturation does not exclude severe RV loading.; D. Give PGE1 to improve ductal patency — No role for ductal therapy after repair.", "pearl": "Teen with PR and symptoms: valve and rhythm review.", "srcAnswer": "A"}, {"num": 73, "level": "Integrated / Rank Differentiating", "question": "A clinically stable child with unrepaired TOF has 10 days of fever, a new splenic tip and petechiae. Which first diagnostic step is correct?", "options": ["Repeat resting pulse oximetry and review in a week", "Start empirical antibiotics, then send one culture later", "Multiple blood cultures before antibiotics", "Treat as a hypercyanotic spell"], "answer": 2, "explanation": "Suspected endocarditis needs several blood cultures before any antibiotic, then echo. Why not the others: A. Repeat resting pulse oximetry and review in a week — A febrile child with possible embolic signs needs prompt evaluation.; B. Start empirical antibiotics, then send one culture later — Starting antibiotics first can sterilise cultures and hide the organism.; D. Treat as a hypercyanotic spell — No spell features are described.", "pearl": "Suspected IE: cultures before antibiotics, then echo.", "srcAnswer": "C"}, {"num": 74, "level": "Integrated / Rank Differentiating", "question": "A TOF infant has recurrent spells, poor hydration, anemia and planned noncardiac anesthesia. Which preprocedure action best minimizes risk?", "options": ["Optimize hydration and Hb; SVR-preserving induction", "Restrict fluids to limit RV filling pressure", "Postpone the anemia work-up until after the procedure", "Use a vasodilating induction without cardiac planning"], "answer": 0, "explanation": "Avoiding low preload, low SVR and adrenergic surges is central. Why not the others: B. Restrict fluids to limit RV filling pressure — May increase dynamic RVOTO.; C. Postpone the anemia work-up until after the procedure — Misses modifiable risks.; D. Use a vasodilating induction without cardiac planning — Can provoke worsening R-to-L shunting.", "pearl": "Optimize preload and induction in unrepaired TOF.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated / Rank Differentiating", "question": "An adult repaired TOF patient has severe PR, RV dysfunction, sustained ventricular tachycardia and residual RVOT gradient. Which management principle is most appropriate?", "options": ["PGE1 infusion as long-term therapy", "Multidisciplinary ACHD plan for valve and arrhythmia", "Treat the RVOT gradient and observe the tachycardia", "Routine reassurance if SpO2 is normal"], "answer": 1, "explanation": "Multiple interacting residual lesions require integrated care. Why not the others: A. PGE1 infusion as long-term therapy — Ductal patency is not relevant.; C. Treat the RVOT gradient and observe the tachycardia — Sustained VT requires urgent rhythm evaluation.; D. Routine reassurance if SpO2 is normal — Electrical and RV risks persist despite saturation.", "pearl": "Adult with VT and PR: ACHD team.", "srcAnswer": "B"}, {"num": 76, "level": "", "question": "A term infant is 60 hours old with recurrent low plasma glucose. Which statement correctly separates the two cited international frameworks?", "options": ["CPS threshold is 72 mg/dL in every infant", "Both frameworks define 48 h as the end of transition", "CPS transitional period extends to 72 h; PES suggests persistent-disorder evaluation after 48 h", "PES recommends evaluation only after 72 days"], "answer": 2, "explanation": "These refer to different purposes and must not be treated as the same cutoff. Why not the others: A. CPS threshold is 72 mg/dL in every infant — 72 here is an age boundary in hours, not a glucose concentration.; B. Both frameworks define 48 h as the end of transition — CPS uses 72 h for its transitional framework.; D. PES recommends evaluation only after 72 days — The relevant PES time unit is hours, not days.", "pearl": "Frameworks differ on when transition ends.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q8"}}, {"num": 77, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. Under ETROP, how should the lesion be categorized?", "options": ["Aggressive ROP only if zone I stage 3 is present", "Type 2 ROP needing only routine weekly observation", "Immature retina without ROP", "Type 1 ROP requiring prompt treatment evaluation"], "answer": 3, "explanation": "Zone II stage 2 with plus is Type 1. Why not the others: A. Aggressive ROP only if zone I stage 3 is present — Aggressive ROP has separate vascular morphology and is not required for Type 1.; B. Type 2 ROP needing only routine weekly observation — Plus disease changes zone II stage 2 to Type 1.; C. Immature retina without ROP — Stage 2 is an established ridge lesion.", "pearl": "Zone II stage 2 + plus = Type 1 ROP.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q25"}}, {"num": 78, "level": "", "question": "An infant born at 28 weeks gestation is seen at 18 weeks chronological age. What is corrected age?", "options": ["6 weeks", "12 weeks", "18 weeks", "46 weeks"], "answer": 0, "explanation": "18 - (40-28) = 6 weeks. Why not the others: B. 12 weeks — 12 weeks is prematurity duration, not corrected age.; C. 18 weeks — Chronological age is not corrected for prematurity.; D. 46 weeks — 46 weeks is postmenstrual age, not corrected age.", "pearl": "Corrected age = chronological age − weeks premature.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q46"}}, {"num": 79, "level": "", "question": "A question explicitly requests AAP 2018 initial ROP examination timing for an infant born at 24 weeks GA. Which answer is correct?", "options": ["At 26 weeks PMA, 2 weeks after birth", "31 weeks PMA, approximately 7 weeks after birth", "At 28 weeks PMA, 4 weeks after birth", "At 34 weeks PMA, 10 weeks after birth"], "answer": 1, "explanation": "AAP 2018 schedule for 24-week infant starts at 31 weeks PMA. Why not the others: A. At 26 weeks PMA, 2 weeks after birth — This applies neither to the named AAP timing nor 24-week infant.; C. At 28 weeks PMA, 4 weeks after birth — Earlier than the named AAP 2018 schedule.; D. At 34 weeks PMA, 10 weeks after birth — Later than the named schedule.", "pearl": "AAP 2018: first exam at 31 weeks PMA at 24 weeks GA.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 11 Q55"}}, {"num": 80, "level": "", "question": "A 7-year-old with school inattention and fragmented sleep needs a brief structured sleep-history screen. Which five domains form BEARS?", "options": ["Breathing, EEG, Apnea index, REM, Seizures", "Bedtime, Enuresis, Appetite, Restlessness, Sleepwalking", "Behavior, Epilepsy, Anxiety, Restlessness, Sleep duration", "Bedtime, Excessive daytime sleepiness, Awakenings, Regularity/duration, Snoring"], "answer": 3, "explanation": "BEARS is a clinical sleep history mnemonic. Why not the others: A. Breathing, EEG, Apnea index, REM, Seizures — These are sleep-study or neurologic terms, not BEARS.; B. Bedtime, Enuresis, Appetite, Restlessness, Sleepwalking — Mixes other symptoms without the mnemonic domains.; C. Behavior, Epilepsy, Anxiety, Restlessness, Sleep duration — Does not match the standard mnemonic.", "pearl": "BEARS is a five-domain sleep screen.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 13 Q5"}}, {"num": 81, "level": "", "question": "A 7.5-kg child with complicated SAM is prescribed a hypothetical starter-feed volume of 120 mL/kg/day divided into 12 feeds. What total daily volume follows from this prescription?", "options": ["750 mL/day", "1440 mL/day", "900 mL/day", "120 mL/day"], "answer": 2, "explanation": "7.5 x 120 = 900 mL/day; each feed 75 mL. Why not the others: A. 750 mL/day — Confuses a 100 mL/kg/day order with 120.; B. 1440 mL/day — Multiplies 120 by the number of feeds rather than by weight.; D. 120 mL/day — Mistakes mL/kg/day for mL/day.", "pearl": "Daily volume = weight × mL/kg/day.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 14 Q30"}}, {"num": 82, "level": "", "question": "At 36 weeks PMA, a preterm infant requires noninvasive positive-pressure ventilation but no invasive ventilation. What Jensen BPD grade corresponds?", "options": ["Grade 2", "Grade 1", "No BPD by support-based grading", "Grade 3"], "answer": 0, "explanation": "Grade 2 includes noninvasive positive pressure. Why not the others: B. Grade 1 — Grade 1 is low-flow nasal cannula <=2 L/min.; C. No BPD by support-based grading — Respiratory support meets grade 2 definition.; D. Grade 3 — Grade 3 requires invasive mechanical ventilation.", "pearl": "Jensen: NIPPV = Grade 2.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 5 Q53"}}, {"num": 83, "level": "", "question": "A neonate has a saw-tooth rise on aEEG accompanied by evolving rhythmic activity on raw EEG. Which interpretation is best?", "options": ["Normal sleep cycling alone", "Electrographic seizure", "Electrode disconnection artifact", "Motion artifact with no evolving ictal pattern"], "answer": 1, "explanation": "Concordant evolving raw EEG activity distinguishes seizure from many artifacts. Why not the others: A. Normal sleep cycling alone — Sleep cycling does not produce the described ictal evolution.; C. Electrode disconnection artifact — Would not typically show an organized evolving ictal rhythm.; D. Motion artifact with no evolving ictal pattern — True evolving raw EEG argues against simple motion artifact.", "pearl": "Confirm aEEG seizures on raw EEG.", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 7 Q34"}}, {"num": 84, "level": "", "question": "A clinically stable growing preterm infant receives 128 kcal/kg/day and 3.9 g/kg/day enteral protein. What is the best interpretation?", "options": ["Both are within commonly used individualized preterm intake ranges", "Both prove feeding intolerance regardless of growth", "Protein is universally excessive at 3.9 g/kg/day", "Energy must be below 100 kcal/kg/day in all preterm infants"], "answer": 0, "explanation": "The figures are commonly acceptable depending on clinical context. Why not the others: B. Both prove feeding intolerance regardless of growth — Intake values alone do not diagnose intolerance.; C. Protein is universally excessive at 3.9 g/kg/day — This can be an appropriate preterm protein intake.; D. Energy must be below 100 kcal/kg/day in all preterm infants — Underestimates typical energy needs.", "pearl": "Judge preterm nutrition by ranges and growth.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 8 Q41"}}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 5',href:'Day18/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
