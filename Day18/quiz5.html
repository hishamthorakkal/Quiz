<script>
const quiz=[{"num": 69, "level": "Integrated / Rank Differentiating", "question": "A cyanotic child has boot-shaped heart, oligemia, RVH and echo showing malalignment VSD. A crossing coronary artery is also seen. What is the next decisive step?", "options": ["Define pulmonary annulus/branch PAs and coronary route before choosing valve-sparing versus conduit-based repair", "Select valve-sparing repair solely from resting SpO2 without coronary imaging", "Select a transannular patch solely from the CXR silhouette before RVOT mapping", "Choose RVOT stenting as definitive therapy independent of coronary and annular anatomy"], "answer": 0, "explanation": "Best: both coronary course and valvar/outflow/branch PA anatomy determine safe intervention. Why not the others: B. Select valve-sparing repair solely from resting SpO2 without coronary imaging — Saturation cannot define whether safe valve-sparing reconstruction is possible.; C. Select a transannular patch solely from the CXR silhouette before RVOT mapping — A CXR does not determine annular dimensions or whether the coronary crosses an incision site.; D. Choose RVOT stenting as definitive therapy independent of coronary and annular anatomy — RVOT stenting may be useful as palliation but is not a definitive default, especially with coronary anomaly.", "pearl": "Map coronary and annulus before repair.", "srcAnswer": "A"}, {"num": 70, "level": "Integrated / Rank Differentiating", "question": "A child with TOF, palatal insufficiency, lymphopenia and hypocalcemia is being planned for surgery. Which approach best integrates diagnosis and perioperative safety?", "options": ["Order 22q11.2 testing alone and defer calcium/immune work-up until postoperative follow-up", "Coordinate 22q11.2 testing with perioperative immune, calcium and transfusion planning", "Order routine broad genetic testing but defer assessment of lymphopenia as unrelated", "Give empiric calcium without evaluating the syndromic immune defect"], "answer": 1, "explanation": "Best: the combined conotruncal, palatal, immune and calcium phenotype is strongly suggestive and affects surgical safety. Why not the others: A. Order 22q11.2 testing alone and defer calcium/immune work-up until postoperative follow-up — Genetic clarification is useful but does not replace perioperative management of immune/electrolyte risk.; C. Order routine broad genetic testing but defer assessment of lymphopenia as unrelated — Lymphopenia may reflect thymic dysfunction and is relevant before intervention.; D. Give empiric calcium without evaluating the syndromic immune defect — Calcium replacement may be necessary but does not address coexisting immunologic and perioperative risks.", "pearl": "Syndromic TOF: assess immunity and calcium.", "srcAnswer": "B"}, {"num": 71, "level": "Integrated / Rank Differentiating", "question": "A cyanotic neonate has pulmonary atresia with VSD, scant central PAs and possible MAPCAs. Saturation falls as the duct closes. Which plan is best?", "options": ["Start PGE1 and proceed directly to unifocalization without mapping central PAs or MAPCAs", "Urgent echo and cross-sectional mapping, but withhold PGE1 despite falling duct-dependent saturation", "Start PGE1 and plan isolated VSD closure before establishing pulmonary blood supply", "Start monitored PGE1, urgent echo and detailed pulmonary blood-supply mapping for tailored palliation"], "answer": 3, "explanation": "Best: stabilize duct-dependent supply before an anatomy-specific surgical/catheter plan. Why not the others: A. Start PGE1 and proceed directly to unifocalization without mapping central PAs or MAPCAs — Preserving flow is vital, but bypassing mapping risks losing segmental pulmonary perfusion.; B. Urgent echo and cross-sectional mapping, but withhold PGE1 despite falling duct-dependent saturation — Imaging is appropriate; failure to maintain an essential duct can precipitate critical hypoxemia.; C. Start PGE1 and plan isolated VSD closure before establishing pulmonary blood supply — VSD closure without adequate pulmonary circulation is physiologically unsafe.", "pearl": "Duct-dependent TOF-PA: PGE1 and mapping.", "srcAnswer": "D"}, {"num": 72, "level": "Integrated / Rank Differentiating", "question": "A 16-year-old repaired TOF patient has RVEDVi 168 mL/m2, severe PR, palpitations and falling exercise capacity. What is the most defensible next step?", "options": ["Evaluate for pulmonary valve intervention together with electrophysiology/rhythm risk and serial RV functional assessment", "Use RVEDVi alone to mandate immediate replacement without assessing rhythm or surgical risk", "Prioritize antiarrhythmic treatment and postpone assessment of severe pulmonary regurgitation", "Repeat CMR in several years because preserved resting oxygenation excludes urgency"], "answer": 0, "explanation": "Best: symptoms, severe PR, ventricular enlargement and arrhythmia concern require integrated assessment. Why not the others: B. Use RVEDVi alone to mandate immediate replacement without assessing rhythm or surgical risk — A volume threshold is supportive but not a stand-alone automatic intervention order.; C. Prioritize antiarrhythmic treatment and postpone assessment of severe pulmonary regurgitation — Treating rhythm in isolation misses important potentially reversible structural loading.; D. Repeat CMR in several years because preserved resting oxygenation excludes urgency — Normal saturation does not make evolving PR/RV dysfunction benign.", "pearl": "Teen with PR and symptoms: valve and rhythm review.", "srcAnswer": "A"}, {"num": 73, "level": "Integrated / Rank Differentiating", "question": "A clinically stable child with unrepaired TOF has 10 days of fever, a new splenic tip and petechiae. Which first diagnostic step is correct?", "options": ["Take one culture now and await final susceptibility before echocardiography", "Draw multiple cultures after the first empiric antibiotic dose to improve diagnostic yield", "Obtain appropriately spaced blood cultures before antibiotics, followed by prompt echo and therapy", "Arrange echo first and defer blood cultures until a vegetation is seen"], "answer": 2, "explanation": "Best: in a clinically stable suspected IE patient, culture before antibiotics and pursue prompt evaluation. Why not the others: A. Take one culture now and await final susceptibility before echocardiography — One culture is less sensitive and does not adequately establish persistent bacteremia.; B. Draw multiple cultures after the first empiric antibiotic dose to improve diagnostic yield — Antibiotics can sterilize cultures and decrease diagnostic yield in a stable patient.; D. Arrange echo first and defer blood cultures until a vegetation is seen — Echocardiography is important, but a negative initial echo does not obviate cultures.", "pearl": "Suspected IE: cultures before antibiotics, then echo.", "srcAnswer": "C"}, {"num": 74, "level": "Integrated / Rank Differentiating", "question": "A TOF infant has recurrent spells, poor hydration, anemia and planned noncardiac anesthesia. Which preprocedure action best minimizes risk?", "options": ["Correct hypovolemia/clinically important anemia and plan induction that preserves SVR with cardiac-anesthesia input", "Maintain fasting-related hypovolemia but add high inspired oxygen to prevent spells", "Prefer a controlled fall in SVR to reduce ventricular pressure during induction", "Begin propranolol alone and postpone optimization of volume status and hemoglobin"], "answer": 0, "explanation": "Best: targeted correction of triggers and an anesthesia plan limiting RVOTO/shunting. Why not the others: B. Maintain fasting-related hypovolemia but add high inspired oxygen to prevent spells — Oxygen cannot overcome severe anatomy-driven shunt if the child becomes hypovolemic.; C. Prefer a controlled fall in SVR to reduce ventricular pressure during induction — Fall in SVR can exacerbate right-to-left shunting.; D. Begin propranolol alone and postpone optimization of volume status and hemoglobin — Beta-blockade may be appropriate in selected cases but not a substitute for comprehensive pre-op optimization.", "pearl": "Optimize preload and induction in unrepaired TOF.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated / Rank Differentiating", "question": "An adult repaired TOF patient has severe PR, RV dysfunction, sustained ventricular tachycardia and residual RVOT gradient. Which management principle is most appropriate?", "options": ["Replace pulmonary valve without evaluation of sustained ventricular tachycardia", "Urgent adult-congenital-heart-disease and electrophysiology evaluation integrating valve, RVOTO and VT treatment", "Treat ventricular tachycardia first and defer structural RV loading evaluation indefinitely", "Focus solely on residual RVOT gradient because severe PR is usually benign if saturation is normal"], "answer": 1, "explanation": "Best: treat potentially dangerous arrhythmia and interacting hemodynamic lesions as an integrated ACHD problem. Why not the others: A. Replace pulmonary valve without evaluation of sustained ventricular tachycardia — Structural treatment alone is insufficient when sustained VT has occurred.; C. Treat ventricular tachycardia first and defer structural RV loading evaluation indefinitely — Arrhythmia stabilization is urgent but a long-term plan must include severe PR and residual RVOTO.; D. Focus solely on residual RVOT gradient because severe PR is usually benign if saturation is normal — Severe PR and RV dysfunction increase late morbidity regardless of resting saturation.", "pearl": "Adult with VT and PR: ACHD team.", "srcAnswer": "B"}, {"num": 76, "level": "", "question": "A term infant is 60 hours old with recurrent low plasma glucose. Which statement correctly separates the two cited international frameworks?", "options": ["CPS defines persistent hypoglycemia after 48 hours while PES uses 72 hours", "Both frameworks recommend evaluating suspected persistent neonatal hypoglycemia only beyond 72 hours", "CPS transitional period extends to 72 h; PES suggests persistent-disorder evaluation after 48 h", "CPS and PES use the same postnatal transition boundary but different measurement units"], "answer": 2, "explanation": "These refer to different purposes and must not be treated as the same cutoff. Why not the others: A. CPS defines persistent hypoglycemia after 48 hours while PES uses 72 hours — The boundaries are reversed: CPS distinguishes the first 72 hours, while PES considers persistent disorder evaluation after 48 hours.; B. Both frameworks recommend evaluating suspected persistent neonatal hypoglycemia only beyond 72 hours — PES specifically advocates evaluating high-risk neonates at or after 48 hours.; D. CPS and PES use the same postnatal transition boundary but different measurement units — Their temporal definitions differ, not just glucose units.", "pearl": "Frameworks differ on when transition ends.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 10 Q8 — Neonatal hypoglycemia — CPS versus PES transition windows"}}, {"num": 77, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. Under ETROP, how should the lesion be categorized?", "options": ["Zone II stage 2 with plus disease is ETROP Type 2 because stage 3 is absent", "Zone II stage 2 with plus disease is Type 1 only if accompanied by pre-plus in zone I", "Zone II stage 2 with plus disease is Type 2 if posterior pole vessels are borderline", "Type 1 ROP requiring prompt treatment evaluation"], "answer": 3, "explanation": "Zone II stage 2 with plus is Type 1. Why not the others: A. Zone II stage 2 with plus disease is ETROP Type 2 because stage 3 is absent — The presence of plus disease makes zone II stage 2 Type 1, even without stage 3.; B. Zone II stage 2 with plus disease is Type 1 only if accompanied by pre-plus in zone I — Pre-plus elsewhere is not required for the Type 1 zone II stage 2 plus classification.; C. Zone II stage 2 with plus disease is Type 2 if posterior pole vessels are borderline — Definite plus disease is specified; this satisfies Type 1 criteria.", "pearl": "Zone II stage 2 + plus = Type 1 ROP.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 11 Q25 — ROP — ETROP Type 1 criteria"}}, {"num": 78, "level": "", "question": "An infant born at 28 weeks gestation is seen at 18 weeks chronological age. What is corrected age?", "options": ["6 weeks", "8 weeks", "12 weeks", "30 weeks postmenstrual age"], "answer": 0, "explanation": "18 - (40-28) = 6 weeks. Why not the others: B. 8 weeks — This would incorrectly subtract only ten weeks rather than twelve weeks of prematurity.; C. 12 weeks — This subtracts six weeks rather than the 12-week difference from term-equivalent age.; D. 30 weeks postmenstrual age — This confuses corrected age with postmenstrual age; PMA is 46 weeks.", "pearl": "Corrected age = chronological age − weeks premature.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 11 Q46 — Corrected age versus postmenstrual age"}}, {"num": 79, "level": "", "question": "A question explicitly requests AAP 2018 initial ROP examination timing for an infant born at 24 weeks GA. Which answer is correct?", "options": ["30 weeks PMA, around 6 weeks after birth", "31 weeks PMA, approximately 7 weeks after birth", "32 weeks PMA, around 8 weeks after birth", "34 weeks PMA, around 10 weeks after birth"], "answer": 1, "explanation": "AAP 2018 schedule for 24-week infant starts at 31 weeks PMA. Why not the others: A. 30 weeks PMA, around 6 weeks after birth — The specified AAP 2018 timing for 24 weeks at birth is 31 weeks PMA.; C. 32 weeks PMA, around 8 weeks after birth — A later PMA applies to some more mature gestational ages but not 24 weeks in the table.; D. 34 weeks PMA, around 10 weeks after birth — Too late compared with the cited 31-week PMA screening recommendation.", "pearl": "AAP 2018: first exam at 31 weeks PMA at 24 weeks GA.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 11 Q55 — ROP — AAP 2018 first screening timing"}}, {"num": 80, "level": "", "question": "A 7-year-old with school inattention and fragmented sleep needs a brief structured sleep-history screen. Which five domains form BEARS?", "options": ["Bedtime, Excessive sleepiness, Arousals, Respiratory events, Sleep timing", "Bedtime, Exercise, Awakenings, Rhythm, Somnolence", "Behavior, Excessive sleepiness, Awakenings, Regularity, Sleep apnea", "Bedtime, Excessive daytime sleepiness, Awakenings, Regularity/duration, Snoring"], "answer": 3, "explanation": "BEARS is a clinical sleep history mnemonic. Why not the others: A. Bedtime, Excessive sleepiness, Arousals, Respiratory events, Sleep timing — Arousal/respiratory-event terminology is clinically relevant but BEARS uses Awakenings, Regularity/duration and Snoring.; B. Bedtime, Exercise, Awakenings, Rhythm, Somnolence — These terms overlap sleep history concepts but are not the validated BEARS expansions.; C. Behavior, Excessive sleepiness, Awakenings, Regularity, Sleep apnea — Behavior and sleep apnea do not correctly replace the Bedtime and Snoring domains in the acronym.", "pearl": "BEARS is a five-domain sleep screen.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 13 Q5 — BEARS paediatric sleep history"}}, {"num": 81, "level": "", "question": "A 7.5-kg child with complicated SAM is prescribed a hypothetical starter-feed volume of 120 mL/kg/day divided into 12 feeds. What total daily volume follows from this prescription?", "options": ["780 mL/day", "840 mL/day", "900 mL/day", "960 mL/day"], "answer": 2, "explanation": "7.5 x 120 = 900 mL/day; each feed 75 mL. Why not the others: A. 780 mL/day — This corresponds to 104 mL/kg/day, not the prescribed 120 mL/kg/day.; B. 840 mL/day — This is 112 mL/kg/day, reflecting an under-multiplication.; D. 960 mL/day — This is 128 mL/kg/day, an over-multiplication; the prescribed order is exactly 900 mL/day.", "pearl": "Daily volume = weight × mL/kg/day.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 14 Q30 — Complicated SAM — F-75 daily feed-volume calculation"}}, {"num": 82, "level": "", "question": "At 36 weeks PMA, a preterm infant requires noninvasive positive-pressure ventilation but no invasive ventilation. What Jensen BPD grade corresponds?", "options": ["Grade 2", "Grade 1, because the child avoids invasive ventilation", "Grade 3, because any positive pressure counts as mechanical ventilation", "Unclassified, because oxygen concentration rather than support mode is decisive"], "answer": 0, "explanation": "Grade 2 includes noninvasive positive pressure. Why not the others: B. Grade 1, because the child avoids invasive ventilation — Grade 1 covers low-flow nasal cannula, not noninvasive positive-pressure support.; C. Grade 3, because any positive pressure counts as mechanical ventilation — Grade 3 specifically requires invasive mechanical ventilation at 36 weeks PMA.; D. Unclassified, because oxygen concentration rather than support mode is decisive — Jensen 2019 support-based grading uses support mode at 36 weeks PMA.", "pearl": "Jensen: NIPPV = Grade 2.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 5 Q53 — BPD — Jensen support-based grading"}}, {"num": 83, "level": "", "question": "A neonate has a saw-tooth rise on aEEG accompanied by evolving rhythmic activity on raw EEG. Which interpretation is best?", "options": ["Sleep-wake cycling without concomitant evolving raw EEG activity", "Electrographic seizure", "A movement artifact that lacks a consistent rhythmic EEG correlate", "A normal discontinuous trace of prematurity without electrographic evolution"], "answer": 1, "explanation": "Concordant evolving raw EEG activity distinguishes seizure from many artifacts. Why not the others: A. Sleep-wake cycling without concomitant evolving raw EEG activity — Sleep cycling does not explain evolving rhythmic ictal patterns in the raw trace.; C. A movement artifact that lacks a consistent rhythmic EEG correlate — An evolving rhythmic EEG pattern supports electrographic seizure rather than nonspecific movement artifact.; D. A normal discontinuous trace of prematurity without electrographic evolution — Discontinuity in preterm EEG is not itself an evolving rhythmic seizure signature.", "pearl": "Confirm aEEG seizures on raw EEG.", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 7 Q34 — Neonatal aEEG — seizure interpretation"}}, {"num": 84, "level": "", "question": "A clinically stable growing preterm infant receives 128 kcal/kg/day and 3.9 g/kg/day enteral protein. What is the best interpretation?", "options": ["Both are within commonly used individualized preterm intake ranges", "The caloric intake is plausible, but all preterm infants must receive less than 3 g/kg/day protein", "The protein intake is plausible, but all growing preterm infants should receive fewer than 100 kcal/kg/day", "Both intakes must be reduced because they exceed universal enteral maximums"], "answer": 0, "explanation": "The figures are commonly acceptable depending on clinical context. Why not the others: B. The caloric intake is plausible, but all preterm infants must receive less than 3 g/kg/day protein — Protein requirements vary by gestation and clinical condition; 3.9 g/kg/day can be within individualized targets.; C. The protein intake is plausible, but all growing preterm infants should receive fewer than 100 kcal/kg/day — A blanket caloric upper bound is inappropriate; 128 kcal/kg/day can be reasonable.; D. Both intakes must be reduced because they exceed universal enteral maximums — There are no such universal maxima independent of weight, age, growth and tolerance.", "pearl": "Judge preterm nutrition by ranges and growth.", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 8 Q41 — Preterm nutrition — enteral calories and protein"}}];
const NB_CTX={srcId:'Day18',label:'Day 18',set:'Quiz 5',href:'Day18/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day18_QuizSet5_Q69-84_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 18 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–84</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 18 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 18'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 18');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day18:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
