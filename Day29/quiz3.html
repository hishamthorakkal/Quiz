<script>
const quiz=[{"num": 35, "level": "Clinical", "question": "A child with polyuria, serum Na 154 and urine osmolality 90 mOsm/kg despite hyperosmolar plasma most likely has what mechanism?", "options": ["Urinary concentrating defect such as diabetes insipidus", "Inappropriate ADH excess", "Excess renal sodium reabsorption with concentrated urine", "Low water intake with maximally concentrated urine"], "answer": 0, "explanation": "Inappropriately dilute urine in hypernatraemia suggests DI or concentrating defect. Why not the others: B. Inappropriate ADH excess — SIADH usually causes water retention and concentrated urine.; C. Excess renal sodium reabsorption with concentrated urine — This would not explain very dilute urine.; D. Low water intake with maximally concentrated urine — Intact concentration would raise urine osmolality.", "pearl": "", "srcAnswer": "A"}, {"num": 36, "level": "Clinical", "question": "A stable child has K 6.4 mmol/L without ECG changes. What is the most appropriate initial approach?", "options": ["Give calcium only and discharge", "Begin unrestricted potassium-containing feeds", "Repeat a nonhaemolysed sample promptly, monitor ECG and treat according to severity", "Ignore because ECG is normal"], "answer": 2, "explanation": "Confirm artefact, assess risk and institute monitored treatment as needed. Why not the others: A. Give calcium only and discharge — Calcium alone neither removes K nor addresses all causes.; B. Begin unrestricted potassium-containing feeds — Additional K may worsen the problem.; D. Ignore because ECG is normal — ECG may be normal despite significant hyperkalaemia.", "pearl": "", "srcAnswer": "C"}, {"num": 37, "level": "Clinical", "question": "A heel-prick sample shows K 6.7 mmol/L but the child is well with normal ECG; laboratory notes haemolysis. What is the key next diagnostic step?", "options": ["Prompt repeat venous/plasma potassium using nonhaemolysed sample", "Use serum sodium as a substitute for K", "Assume true severe hyperkalaemia without recheck", "Conclude hypokalaemia because ECG is normal"], "answer": 0, "explanation": "A repeat properly collected sample clarifies pseudohyperkalaemia. Why not the others: B. Use serum sodium as a substitute for K — Sodium cannot substitute for potassium measurement.; C. Assume true severe hyperkalaemia without recheck — Haemolysis can falsely elevate potassium.; D. Conclude hypokalaemia because ECG is normal — Normal ECG does not prove low potassium.", "pearl": "", "srcAnswer": "A"}, {"num": 38, "level": "Clinical", "question": "A child on diuretics has K 2.6 mmol/L and prominent U waves. Which abnormality is most consistent?", "options": ["Hypokalaemia", "Hypernatraemia", "Hypermagnesaemia", "Hyperkalaemia"], "answer": 0, "explanation": "Low K and U waves are characteristic of hypokalaemia. Why not the others: B. Hypernatraemia — High Na does not characteristically cause U waves.; C. Hypermagnesaemia — Magnesium excess causes different conduction findings.; D. Hyperkalaemia — Hyperkalaemia causes peaked T and QRS changes.", "pearl": "", "srcAnswer": "A"}, {"num": 39, "level": "Clinical", "question": "A child with refractory hypokalaemia has low magnesium. What is the key corrective principle?", "options": ["Increase potassium only; ignore magnesium", "Give calcium gluconate as the only treatment", "Treat as pseudohypokalaemia without rechecking", "Correct magnesium deficit alongside potassium replacement"], "answer": 3, "explanation": "Mg repletion facilitates sustained K correction. Why not the others: A. Increase potassium only; ignore magnesium — Uncorrected Mg depletion promotes renal K loss.; B. Give calcium gluconate as the only treatment — Calcium does not correct the Mg-related K wasting mechanism.; C. Treat as pseudohypokalaemia without rechecking — True deficits are documented and require treatment.", "pearl": "", "srcAnswer": "D"}, {"num": 40, "level": "Clinical", "question": "A child with tetany has low ionized calcium and prolonged QT. Which electrolyte abnormality best explains the ECG?", "options": ["Hyperkalaemia", "Hyperphosphataemia alone", "Hypocalcaemia", "Hypercalcaemia"], "answer": 2, "explanation": "Hypocalcaemia can prolong QT and cause tetany. Why not the others: A. Hyperkalaemia — Hyperkalaemia causes peaked T/QRS changes.; B. Hyperphosphataemia alone — Phosphate can contribute to low Ca but does not itself define the QT finding.; D. Hypercalcaemia — Hypercalcaemia tends to shorten QT.", "pearl": "", "srcAnswer": "C"}, {"num": 41, "level": "Clinical", "question": "A child with tumour lysis syndrome has high phosphate, low calcium and AKI. Which principle is safest?", "options": ["Give calcium routinely for asymptomatic laboratory hypocalcaemia", "Avoid unnecessary calcium loading; treat symptomatic hypocalcaemia with specialist guidance", "Assume phosphate is low in tumour lysis", "Replace phosphate aggressively"], "answer": 1, "explanation": "Treat symptomatic hypocalcaemia carefully while controlling phosphate and TLS. Why not the others: A. Give calcium routinely for asymptomatic laboratory hypocalcaemia — Calcium may increase calcium-phosphate deposition when phosphate is high.; C. Assume phosphate is low in tumour lysis — TLS often causes hyperphosphataemia.; D. Replace phosphate aggressively — Additional phosphate worsens hyperphosphataemia.", "pearl": "", "srcAnswer": "B"}, {"num": 42, "level": "Clinical", "question": "A stable 16-kg child needs routine IV maintenance. What is the 24-hour Holliday–Segar volume before clinical adjustment?", "options": ["1200 mL", "1100 mL", "1300 mL", "1600 mL"], "answer": 2, "explanation": "1000+6×50=1300 mL/day. Why not the others: A. 1200 mL — 1200 mL is below the 1000+6×50 calculation.; B. 1100 mL — 1100 mL omits part of the second 10 kg.; D. 1600 mL — 1600 mL is not the 100/50/20 result.", "pearl": "", "srcAnswer": "C"}, {"num": 43, "level": "Clinical", "question": "A child with AKI and suspected septic shock is cold, tachycardic and hypotensive. Which fluid strategy is safest?", "options": ["Carefully titrated isotonic boluses with frequent reassessment and early vasoactive support if indicated", "Routine 24-hour maintenance only", "Hypotonic resuscitation boluses", "Unmonitored repeated large boluses"], "answer": 0, "explanation": "Small reassessed isotonic boluses plus hemodynamic support address shock and safety. Why not the others: B. Routine 24-hour maintenance only — Maintenance is insufficient for shock.; C. Hypotonic resuscitation boluses — Hypotonic boluses are inappropriate for shock resuscitation.; D. Unmonitored repeated large boluses — Unrestricted boluses risk overload, particularly in AKI.", "pearl": "", "srcAnswer": "A"}, {"num": 44, "level": "Clinical", "question": "An adolescent has small echogenic kidneys and longstanding anaemia, then creatinine rises after gastroenteritis. What is the best interpretation?", "options": ["Pure AKI with no chronic component", "Normal adolescent renal physiology", "Obstructive AKI proved by echogenicity", "AKI superimposed on chronic kidney disease"], "answer": 3, "explanation": "A superimposed acute rise may occur on CKD. Why not the others: A. Pure AKI with no chronic component — Chronic features argue against isolated AKI.; B. Normal adolescent renal physiology — Chronic anaemia/small kidneys are not normal.; C. Obstructive AKI proved by echogenicity — Echogenicity alone does not prove obstruction.", "pearl": "", "srcAnswer": "D"}, {"num": 45, "level": "Clinical", "question": "A child with AKI has low urine sodium but recent radiocontrast exposure and sepsis. Which interpretation is most defensible?", "options": ["Low urine sodium proves ureteric obstruction", "Urine indices overlap in sepsis and early tubular injury", "Low urine sodium rules out intrinsic AKI", "FeNa is diagnostic without clinical context"], "answer": 1, "explanation": "Urine indices are adjuncts, not definitive classifiers. Why not the others: A. Low urine sodium proves ureteric obstruction — Obstruction is not identified by urine sodium.; C. Low urine sodium rules out intrinsic AKI — Intrinsic AKI may show low FeNa in early sepsis/contrast injury.; D. FeNa is diagnostic without clinical context — Clinical course and sediment are essential.", "pearl": "", "srcAnswer": "B"}, {"num": 46, "level": "Clinical", "question": "A 20-kg child receives 1.4 L fluids and excretes 0.4 L urine plus 0.2 L stool over 24 h. What is the recorded balance (ignoring insensible losses)?", "options": ["+1.0 L", "+0.6 L", "+0.4 L", "+0.8 L"], "answer": 3, "explanation": "1.4−0.4−0.2=+0.8 L. Why not the others: A. +1.0 L — +1.0 ignores stool loss.; B. +0.6 L — +0.6 ignores one loss component.; C. +0.4 L — +0.4 undercounts net retention.", "pearl": "", "srcAnswer": "D"}, {"num": 47, "level": "Clinical", "question": "A child weighing 10 kg before illness now weighs 11.2 kg, with no major growth interval. What is estimated fluid overload percentage relative to baseline?", "options": ["20%", "10%", "8%", "12%"], "answer": 3, "explanation": "1.2/10×100=12%. Why not the others: A. 20% — 20% would require 2.0 kg gain.; B. 10% — 10% would require 1.0 kg gain.; C. 8% — 8% underestimates 1.2/10.", "pearl": "", "srcAnswer": "D"}, {"num": 48, "level": "High-Difficulty", "question": "A 10-kg child with serum Na 124 mmol/L has no seizures and appears euvolaemic. Which statement about calculating sodium deficit is safest?", "options": ["Management depends on symptoms, chronicity and cause, not the deficit formula alone", "All sodium must be corrected to 140 within 2 h", "Sodium deficit is irrelevant to any management planning", "A calculated deficit alone dictates an immediate hypertonic bolus"], "answer": 0, "explanation": "Clinical severity and chronicity govern safe correction. Why not the others: B. All sodium must be corrected to 140 within 2 h — Rapid normalization risks osmotic injury.; C. Sodium deficit is irrelevant to any management planning — Deficit estimates can aid selected plans but are not sole drivers.; D. A calculated deficit alone dictates an immediate hypertonic bolus — A formula does not determine urgent therapy in asymptomatic hyponatraemia.", "pearl": "", "srcAnswer": "A"}, {"num": 49, "level": "High-Difficulty", "question": "An adolescent with glucose 500 mg/dL has measured Na 128 mmol/L. Which principle is correct?", "options": ["A low Na proves SIADH regardless of glucose", "Glucose raises measured Na in every case", "Measured Na always equals tonicity-adjusted Na", "Hyperglycaemia lowers measured Na by transcellular water shift; interpret corrected Na"], "answer": 3, "explanation": "Corrected Na contextualizes water balance; correction factors vary. Why not the others: A. A low Na proves SIADH regardless of glucose — SIADH cannot be diagnosed without accounting for glucose.; B. Glucose raises measured Na in every case — Glucose does not always raise measured Na.; C. Measured Na always equals tonicity-adjusted Na — Hyperglycaemia can dilute measured sodium.", "pearl": "", "srcAnswer": "D"}, {"num": 50, "level": "High-Difficulty", "question": "A 4-year-old with chronic hypernatraemia is being rehydrated. Which planned sodium trajectory is safest?", "options": ["Ignore serial sodium once fluids begin", "Normalize within 4 h", "Fall 3 mmol/L each hour", "Fall no faster than about 0.5 mmol/L/h with serial checks"], "answer": 3, "explanation": "RCH advises ≤0.5 mmol/L/h after restoring circulation. Why not the others: A. Ignore serial sodium once fluids begin — Serial electrolytes are essential.; B. Normalize within 4 h — Rapid normalization risks cerebral oedema.; C. Fall 3 mmol/L each hour — 3 mmol/L/h is excessively rapid for chronic hypernatraemia.", "pearl": "", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day29',label:'Day 29',set:'Quiz 3',href:'Day29/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day29_QuizSet3_Q35-50_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 29 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–50</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 29 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 29'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 29');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day29:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
