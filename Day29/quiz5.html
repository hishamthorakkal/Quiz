<script>
const quiz=[{"num": 67, "level": "High-Difficulty", "question": "After cardiopulmonary bypass, a child develops AKI with positive fluid balance and low cardiac output. What combined mechanism is most plausible?", "options": ["Renal hypoperfusion plus inflammatory tubular injury", "Primary bilateral ureteric obstruction in all cases", "Pure nephrogenic diabetes insipidus", "Isolated chronic nephrotic syndrome"], "answer": 0, "explanation": "Low output and inflammatory insults may coexist. Why not the others: B. Primary bilateral ureteric obstruction in all cases — Obstruction is not universal after bypass.; C. Pure nephrogenic diabetes insipidus — DI produces polyuria, not classic oliguric post-bypass AKI.; D. Isolated chronic nephrotic syndrome — Nephrotic syndrome is not the typical immediate mechanism.", "pearl": "", "srcAnswer": "A"}, {"num": 68, "level": "Integrated", "question": "A child with septic shock has AKI, K 6.8, peaked T waves and worsening hypotension. Which integrated action is best?", "options": ["Give oral binder and discharge if ECG improves", "Give IV calcium with monitoring, address K shift/removal, and support perfusion simultaneously", "Treat hypotension only and defer K therapy until tomorrow", "Withhold all resuscitation because AKI is present"], "answer": 1, "explanation": "Cardiac stabilization and perfusion support are concurrent priorities. Why not the others: A. Give oral binder and discharge if ECG improves — Binder and discharge are unsafe in instability.; C. Treat hypotension only and defer K therapy until tomorrow — Dangerous K cannot be deferred.; D. Withhold all resuscitation because AKI is present — Shock requires resuscitation with careful monitoring.", "pearl": "", "srcAnswer": "B"}, {"num": 69, "level": "Integrated", "question": "A child with meningitis on hypotonic IV fluid develops seizures and Na 117. What is the most important immediate decision?", "options": ["Treat acute hyponatraemic encephalopathy with hypertonic saline and ICU-level monitoring", "Diagnose epilepsy and ignore serum sodium", "Give routine maintenance isotonic fluid only", "Restrict fluid only and wait for spontaneous correction"], "answer": 0, "explanation": "Emergency hypertonic sodium is indicated with monitoring. Why not the others: B. Diagnose epilepsy and ignore serum sodium — The electrolyte disturbance is an urgent reversible seizure cause.; C. Give routine maintenance isotonic fluid only — Maintenance alone is inadequate for symptomatic severe hyponatraemia.; D. Restrict fluid only and wait for spontaneous correction — Restriction alone does not treat cerebral oedema during seizures.", "pearl": "", "srcAnswer": "A"}, {"num": 70, "level": "Integrated", "question": "A child with bloody diarrhoea, schistocytes, platelets 42,000, oliguria and pulmonary oedema is admitted. What is the best integrated plan?", "options": ["Wait for spontaneous diuresis despite respiratory distress", "High-volume maintenance plus prophylactic platelets", "Supportive HUS care, fluid/electrolyte surveillance and urgent KRT assessment for pulmonary oedema", "Routine high-dose steroids as sole treatment"], "answer": 2, "explanation": "HUS with refractory overload may need KRT while underlying cause is evaluated. Why not the others: A. Wait for spontaneous diuresis despite respiratory distress — Respiratory distress demands prompt intervention.; B. High-volume maintenance plus prophylactic platelets — Fluid loading and routine platelets can worsen complications.; D. Routine high-dose steroids as sole treatment — Steroids alone are not standard therapy for typical STEC-HUS.", "pearl": "", "srcAnswer": "C"}, {"num": 71, "level": "Integrated", "question": "A child with recurrent vomiting has K 2.7, metabolic alkalosis and low urine chloride. Which physiology best fits?", "options": ["Primary hyperkalaemic type 4 RTA", "Acute tumour lysis syndrome", "Renal tubular acidosis with hyperchloraemic acidosis", "Extrarenal chloride loss with volume contraction"], "answer": 3, "explanation": "Gastric HCl loss causes hypochloraemic metabolic alkalosis and secondary K depletion. Why not the others: A. Primary hyperkalaemic type 4 RTA — Type 4 RTA produces hyperkalaemic acidosis.; B. Acute tumour lysis syndrome — TLS causes hyperkalaemia and hyperphosphataemia.; C. Renal tubular acidosis with hyperchloraemic acidosis — RTA causes acidosis rather than alkalosis.", "pearl": "", "srcAnswer": "D"}, {"num": 72, "level": "Integrated", "question": "A child with postoperative cerebral pathology has Na 121 and urine Na 90; BP is low and weight has fallen. Which management premise is best?", "options": ["Assume SIADH and fluid-restrict without assessing volume", "Consider renal/cerebral salt wasting and restore volume while investigating", "Use urine Na alone to prove SIADH", "Treat with oral free water"], "answer": 1, "explanation": "Salt wasting can produce high urine Na with hypovolaemia. Why not the others: A. Assume SIADH and fluid-restrict without assessing volume — Hypovolaemia makes indiscriminate restriction unsafe.; C. Use urine Na alone to prove SIADH — High urine Na occurs in multiple conditions.; D. Treat with oral free water — Free water worsens hyponatraemia.", "pearl": "", "srcAnswer": "B"}, {"num": 73, "level": "Integrated", "question": "A child with Na 165, polyuria and urine osmolality 100 has no shock. What is the best integrated approach?", "options": ["Evaluate diabetes insipidus, replace water deficit cautiously and monitor sodium", "Start potassium infusion as definitive therapy", "Rapidly normalize Na using hypotonic IV boluses", "Diagnose SIADH and restrict all fluid"], "answer": 0, "explanation": "DI is plausible; controlled correction and cause-specific management are required. Why not the others: B. Start potassium infusion as definitive therapy — Potassium is not treatment for DI-related water loss.; C. Rapidly normalize Na using hypotonic IV boluses — Rapid Na correction risks cerebral oedema.; D. Diagnose SIADH and restrict all fluid — SIADH causes concentrated urine and low sodium.", "pearl": "", "srcAnswer": "A"}, {"num": 74, "level": "Integrated", "question": "A child with severe AKI has +16% fluid overload, escalating oxygen need and rising K despite medical therapy. What is the best decision?", "options": ["KRT referral because complications are refractory", "Treat fluid overload only with dietary salt", "Continue unrestricted fluids to improve GFR", "Wait until urine output reaches zero for 24 hours"], "answer": 0, "explanation": "Refractory overload and hyperkalaemia justify urgent KRT assessment. Why not the others: B. Treat fluid overload only with dietary salt — Dietary salt restriction is inadequate in critical overload.; C. Continue unrestricted fluids to improve GFR — Additional fluid can worsen pulmonary oedema.; D. Wait until urine output reaches zero for 24 hours — KRT is not contingent on anuria duration alone.", "pearl": "", "srcAnswer": "A"}, {"num": 75, "level": "Integrated", "question": "An 8-year-old with ECG-threatening hyperkalaemia is treated in a unit following RCH guidance. Which statement avoids a common dosing error?", "options": ["Calcium chloride and calcium gluconate are interchangeable mL-for-mL", "Use the institution’s verified calcium preparation/concentration and guideline-specific dose; RCH and IAP volumes differ", "All guidelines specify identical 10% calcium gluconate mL/kg doses", "A calcium dose removes potassium from the body"], "answer": 1, "explanation": "RCH lists 0.68 mL/kg 10% calcium gluconate while IAP 2022 lists 1 mL/kg; verify local protocol. Why not the others: A. Calcium chloride and calcium gluconate are interchangeable mL-for-mL — Different calcium salts contain different elemental calcium concentrations.; C. All guidelines specify identical 10% calcium gluconate mL/kg doses — Published protocols vary, so a single universal volume is unsafe.; D. A calcium dose removes potassium from the body — Calcium stabilizes myocardium; K lowering needs other therapies.", "pearl": "", "srcAnswer": "B"}, {"num": 76, "level": "", "question": "A child with a bicuspid valve has a high Doppler gradient beginning at the aortic valve leaflets. Where is the obstruction?", "options": ["Subvalvular membrane", "Valvular aortic stenosis", "Supravalvular stenosis", "Aortic isthmic coarctation"], "answer": 1, "explanation": "A valve-level gradient and doming leaflets indicate valvular stenosis. Why not the others: A. Subvalvular membrane — A subaortic membrane lies below valve cusps.; C. Supravalvular stenosis — Supravalvular stenosis is above the sinotubular junction.; D. Aortic isthmic coarctation — Coarctation occurs in the aortic arch/isthmus.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 19 Q6 — valvular LVOT obstruction"}}, {"num": 77, "level": "", "question": "A neonate has severe cyanosis, diffuse pulmonary oedema and obstructed infracardiac pulmonary venous drainage. What is definitive management?", "options": ["Urgent repair of obstructed pulmonary venous connection", "Observe until pulmonary oedema resolves", "Ductal patency with PGE1 alone", "Balloon atrial septostomy alone"], "answer": 0, "explanation": "Surgery relieves the obstructed pulmonary venous return. Why not the others: B. Observe until pulmonary oedema resolves — Oedema is caused by obstruction and waiting is unsafe.; C. Ductal patency with PGE1 alone — PGE1 does not relieve pulmonary venous obstruction.; D. Balloon atrial septostomy alone — Septostomy does not remove infradiaphragmatic obstruction.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 19 Q11 — obstructed infracardiac TAPVC"}}, {"num": 78, "level": "", "question": "A 28-week, 1100-g infant is stable at 3 weeks postnatal age. Which principle should govern the first ROP screening appointment?", "options": ["Screen based only on the current weight", "Apply the gestational-age/postnatal-age screening schedule, ensuring timely first examination", "Wait until discharge regardless of age", "Screen only after oxygen has been discontinued"], "answer": 1, "explanation": "Gestational and postnatal age determine timing in a local guideline; first examination must not be missed. Why not the others: A. Screen based only on the current weight — Weight alone does not determine first-screen timing.; C. Wait until discharge regardless of age — Discharge may occur too late.; D. Screen only after oxygen has been discontinued — Oxygen cessation is not the screening trigger.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 11 Q55 — ROP screening timing"}}, {"num": 79, "level": "", "question": "A schoolchild with ADHD symptoms has poor sleep and daytime sleepiness. Which structured sleep-screening framework covers bedtime, excessive sleepiness, awakenings, regularity and snoring?", "options": ["BEARS", "STOP-BANG", "GCS", "Wells score"], "answer": 0, "explanation": "BEARS targets five common paediatric sleep domains. Why not the others: B. STOP-BANG — STOP-BANG is an adult OSA risk instrument.; C. GCS — GCS measures consciousness.; D. Wells score — Wells is for thromboembolism probability.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 13 Q5 — BEARS sleep screen"}}, {"num": 80, "level": "", "question": "A term newborn loses physiological extracellular fluid during the first days after birth. Which mechanism contributes?", "options": ["Postnatal diuresis and natriuresis", "Obligate complete sodium retention", "Immediate complete cessation of glomerular filtration", "Exclusive insensible water loss without renal contribution"], "answer": 0, "explanation": "Diuresis/natriuresis contribute to extracellular contraction. Why not the others: B. Obligate complete sodium retention — Complete retention would oppose the typical early contraction.; C. Immediate complete cessation of glomerular filtration — Neonatal kidneys filter; function is immature, not absent.; D. Exclusive insensible water loss without renal contribution — Renal losses are important alongside insensible loss.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 10 Q15 — neonatal postnatal natriuresis"}}, {"num": 81, "level": "", "question": "At 100 mL/kg/day IV fluid, a GIR of 8 mg/kg/min requires approximately which dextrose concentration?", "options": ["D7.5", "D10", "D11.5", "D15"], "answer": 2, "explanation": "8×144/100=11.52% dextrose. Why not the others: A. D7.5 — D7.5 yields only about 5.2 mg/kg/min.; B. D10 — D10 yields about 6.9 mg/kg/min.; D. D15 — D15 yields about 10.4 mg/kg/min.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R2", "from": "Day 10 Q47 — GIR to dextrose concentration"}}, {"num": 82, "level": "", "question": "A premature infant has zone II, stage 2 ROP with definite plus disease. What is the appropriate classification?", "options": ["Type 2 ROP requiring routine observation", "Type 1 ROP requiring prompt treatment assessment", "Aggressive ROP solely because zone II is involved", "Stage 3 ROP because plus disease is present"], "answer": 1, "explanation": "This is ETROP Type 1 treatment-requiring disease. Why not the others: A. Type 2 ROP requiring routine observation — Zone II stage 2 with plus is Type 1, not Type 2.; C. Aggressive ROP solely because zone II is involved — Aggressive ROP has distinct severe posterior features, not specified here.; D. Stage 3 ROP because plus disease is present — Plus disease is not the same as stage 3 neovascularization.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}];
const NB_CTX={srcId:'Day29',label:'Day 29',set:'Quiz 5',href:'Day29/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day29_QuizSet5_Q67-82_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 29 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 67–82</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 29 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 29'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 29');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day29:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
