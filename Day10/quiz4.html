<script>
const quiz=[{"num": 48, "level": "Clinical/Application", "question": "A 10-day-old with Na 162 mmol/L is rehydrated and the sodium is 156 mmol/L after 10 hours. The correct assessment is:", "options": ["Too fast: 0.6 mmol/L/h projects a >12 mmol/L fall per day; slow and recheck in 4 hours", "Acceptable, as 6 mmol/L in 10 hours is within the daily limit", "Acceptable, as the sodium remains above 150 mmol/L", "Too slow: add free-water boluses to reach 140 within 24 hours, rechecking sodium at 12 hours"], "answer": 0, "explanation": "Limit is about ≤0.5 mmol/L/h and ≤10–12 mmol/L/day. Calculation: Formula: Rate of Na fall = change in Na ÷ hours. Substitution: (162 − 156) ÷ 10. Final answer: 0.6 mmol/L/h. Common trap: Project over 24 h; this exceeds the routine chronic correction ceiling. Closest distractor: One laboratory number cannot judge correction safety. Why not the others: B. Acceptable, as 6 mmol/L in 10 hours is within the daily limit — This numerical option conflicts with Rate of Na fall = change in Na ÷ hours. Substitution (162 − 156) ÷ 10 gives 0.6 mmol/L/h; the likely trap is: Project over 24 h; this exceeds the routine chronic correction ceiling.; C. Acceptable, as the sodium remains above 150 mmol/L — This numerical option conflicts with Rate of Na fall = change in Na ÷ hours. Substitution (162 − 156) ÷ 10 gives 0.6 mmol/L/h; the likely trap is: Project over 24 h; this exceeds the routine chronic correction ceiling.; D. Too slow: add free-water boluses to reach 140 within 24 hours, rechecking sodium at 12 hours — This numerical option conflicts with Rate of Na fall = change in Na ÷ hours. Substitution (162 − 156) ÷ 10 gives 0.6 mmol/L/h; the likely trap is: Project over 24 h; this exceeds the routine chronic correction ceiling.", "pearl": "Sodium trend = change ÷ elapsed hours; compare with ≤0.5 mmol/L/h.", "srcAnswer": "A"}, {"num": 49, "level": "High-Difficulty", "question": "A well IDM at 6 hours has a glucose of 43 mg/dL (2.4 mmol/L). A colleague cites the PES target of >50 mg/dL as proof that IV dextrose is mandatory. The most defensible reply is:", "options": ["Name the framework: under CPS, a well at-risk infant is managed with feeding ± gel and a 30-minute recheck", "Because the infant is well, glucose need not be remeasured until discharge", "The PES target makes an IV D10 bolus mandatory for every value below 50 mg/dL", "A single reading of 43 mg/dL establishes congenital hyperinsulinism and needs a critical sample"], "answer": 0, "explanation": "PES values are treatment goals, not universal IV triggers; CPS gives an operational pathway. Closest distractor: A number without age, symptoms and named guideline is not a complete management decision.", "pearl": "Threshold, target and diagnostic trigger are different terms.", "srcAnswer": "A"}, {"num": 50, "level": "High-Difficulty", "question": "A 5-day-old with glucose 39 mg/dL has undetectable insulin, BOHB 0.1, FFA 0.2, and a glucose rise of 42 mg/dL after glucagon. The best interpretation is:", "options": ["Fatty-acid oxidation defect, because ketones are low and a glucagon response occurs in this disorder", "Normal adaptation, because glucose rose after glucagon", "Hyperinsulinism is excluded because insulin was not detected, and no further testing is needed", "Hyperinsulinism despite undetectable insulin, since fuels and glucagon response show insulin action"], "answer": 3, "explanation": "Suppressed BOHB/FFA and a glucagon response of ≥30 mg/dL define insulin action. Closest distractor: Glucagon response and suppressed fuels can trump a nondetectable insulin result. Why not the others: A. Fatty-acid oxidation defect, because ketones are low and a glucagon response occurs in this disorder — FAOD is generally hypoketotic with relatively high FFA; the suppressed FFA pattern here reflects excess insulin action.", "pearl": "Insulin action matters more than one insulin value; BOHB <1.8, FFA <1.7 and glucagon rise ≥30 mg/dL support HI.", "srcAnswer": "D"}, {"num": 51, "level": "High-Difficulty", "question": "A 3.4-kg infant on D12.5 at 10 mL/h still has low glucose. The GIR delivered is:", "options": ["3.7 mg/kg/min", "6.1 mg/kg/min", "8.5 mg/kg/min", "12.5 mg/kg/min"], "answer": 1, "explanation": "12.5 × 10 × 10 ÷ (3.4 × 60) = 6.13 mg/kg/min. Calculation: Formula: GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution: 12.5 × 10 × 10 ÷ (3.4 × 60). Final answer: 6.13 mg/kg/min. Common trap: Do not treat dextrose percentage as GIR. Closest distractor: An apparently high dextrose percentage may deliver only modest GIR at low fluid rates. Why not the others: A. 3.7 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 10 ÷ (3.4 × 60) gives 6.13 mg/kg/min; the likely trap is: Do not treat dextrose percentage as GIR.; C. 8.5 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 10 ÷ (3.4 × 60) gives 6.13 mg/kg/min; the likely trap is: Do not treat dextrose percentage as GIR.; D. 12.5 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 10 ÷ (3.4 × 60) gives 6.13 mg/kg/min; the likely trap is: Do not treat dextrose percentage as GIR.", "pearl": "D12.5 contains 125 mg/mL; calculate before changing concentration.", "srcAnswer": "B"}, {"num": 52, "level": "High-Difficulty", "question": "A 2.6-kg infant receives D12.5 at 70 mL/kg/day plus D25 at 10 mL/kg/day. The total GIR is:", "options": ["5.4 mg/kg/min", "7.8 mg/kg/min", "9.5 mg/kg/min", "12.5 mg/kg/min"], "answer": 1, "explanation": "(12.5 × 70 + 25 × 10) ÷ 144 = 1125 ÷ 144 = 7.81 mg/kg/min. Calculation: Formula: Total GIR = Σ(D% × mL/kg/day) ÷ 144. Substitution: (12.5 × 70 + 25 × 10) ÷ 144. Final answer: 7.81 mg/kg/min. Common trap: Weight each concentration by its own volume. Closest distractor: Do not average concentrations without weighting by volume. Why not the others: A. 5.4 mg/kg/min — This numerical option conflicts with Total GIR = Σ(D% × mL/kg/day) ÷ 144. Substitution (12.5 × 70 + 25 × 10) ÷ 144 gives 7.81 mg/kg/min; the likely trap is: Weight each concentration by its own volume.; C. 9.5 mg/kg/min — This numerical option conflicts with Total GIR = Σ(D% × mL/kg/day) ÷ 144. Substitution (12.5 × 70 + 25 × 10) ÷ 144 gives 7.81 mg/kg/min; the likely trap is: Weight each concentration by its own volume.; D. 12.5 mg/kg/min — This numerical option conflicts with Total GIR = Σ(D% × mL/kg/day) ÷ 144. Substitution (12.5 × 70 + 25 × 10) ÷ 144 gives 7.81 mg/kg/min; the likely trap is: Weight each concentration by its own volume.", "pearl": "For parallel fluids, add each D%×mL/kg/day numerator before dividing by 144.", "srcAnswer": "B"}, {"num": 53, "level": "High-Difficulty", "question": "A macrosomic 4-day-old needs a GIR of 13 mg/kg/min with BOHB 0.1 and FFA 0.2. What is essential before and during diazoxide?", "options": ["Hydrocortisone for five days, without which diazoxide is ineffective in the newborn period, then repeat samples", "Stopping all IV glucose for 24 hours to test the response", "Chlorothiazide for five days before diazoxide is started", "Echocardiography for pulmonary hypertension and ductal shunt, with fluid and platelet monitoring"], "answer": 3, "explanation": "Diazoxide causes fluid retention and rarely pulmonary hypertension; chlorothiazide is combined with it to counter fluid retention and enhance effect. Closest distractor: The indication may be correct while the timing and safety process are wrong.", "pearl": "Diazoxide is not a harmless routine first step; screen/monitor for PH and fluid retention.", "srcAnswer": "D"}, {"num": 54, "level": "", "question": "A stable 29-week infant on fortified feeds receives 125 kcal/kg/day and 3.8 g/kg/day of protein with improving growth. The most accurate interpretation is:", "options": ["Both intakes fall within commonly used preterm enteral target ranges", "Protein is excessive solely because it exceeds 3 g/kg/day", "Fortification must stop, since both exceed recommended targets", "Energy is excessive, since infants should receive no more than 100 kcal/kg/day"], "answer": 0, "explanation": "Typical enteral targets: energy about 110–135 kcal/kg/day, protein about 3.5–4.5 g/kg/day in preterm infants. Closest distractor: 125 kcal/kg/day and 3.8 g/kg/day are not intrinsically excessive.", "pearl": "Preterm energy/protein targets are ranges interpreted with growth and tolerance.", "srcAnswer": "A", "retest": {"stage": "R1", "from": "Day 8 Q41 — preterm enteral nutrition targets"}}, {"num": 55, "level": "High-Difficulty", "question": "After 5 days of diazoxide 15 mg/kg/day with chlorothiazide, an infant's GIR is still 16 mg/kg/min. The best next step is:", "options": ["Increase diazoxide to 40 mg/kg/day, since the dose is too low", "Start high-dose steroids, since diazoxide failure implies an adrenal rather than a pancreatic cause", "Rapid genetic testing (ABCC8/KCNJ11), start octreotide or glucagon, and refer for focal-lesion imaging (¹⁸F-DOPA PET-CT)", "Declare it transient and observe for four weeks on the same regimen"], "answer": 2, "explanation": "Diazoxide-unresponsive HI suggests KATP-channel disease, which may be focal (surgical cure) or diffuse. Closest distractor: Maximum diazoxide dose is about 15–20 mg/kg/day.", "pearl": "Diazoxide-unresponsive HI suggests KATP-channel disease, which may be focal (surgical cure) or diffuse.", "srcAnswer": "C"}, {"num": 56, "level": "High-Difficulty", "question": "A neonate has hyperinsulinemic hypoglycemia with persistently raised ammonia (about 150 µmol/L), normal blood gas and no acidosis. The best interpretation is:", "options": ["A urea-cycle disorder: start sodium benzoate and arrange dialysis", "Glycogen storage disease type I, which also causes lactic acidosis and fasting ketosis in the newborn", "An organic acidemia, which causes a high-anion-gap acidosis", "GLUD1 hyperinsulinism–hyperammonemia: diazoxide-responsive, no scavenger therapy needed"], "answer": 3, "explanation": "Gain-of-function GLUD1 mutations cause both HI and mild asymptomatic hyperammonemia. Closest distractor: Mild raised ammonia with normal gas does not signal UCD. Why not the others: A. A urea-cycle disorder: start sodium benzoate and arrange dialysis — UCD is favored by respiratory alkalosis with marked hyperammonemia and little ketosis; this option does not match the stem’s paired acid-base/fuel pattern. Mild raised ammonia with normal gas does not signal UCD.; C. An organic acidemia, which causes a high-anion-gap acidosis — Organic acidemia is expected to produce high-anion-gap ketoacidosis; the stem’s gas/anion-gap pattern points to another mechanism. Mild raised ammonia with normal gas does not signal UCD.", "pearl": "Gain-of-function GLUD1 mutations cause both HI and mild asymptomatic hyperammonemia.", "srcAnswer": "D"}, {"num": 57, "level": "High-Difficulty", "question": "A 6-day-old with jaundice, hypoglycemia, poor feeding and E. coli sepsis has cataracts and positive urinary reducing substances. The first management step is:", "options": ["Give a protein-restricted diet and sodium benzoate", "Start phototherapy and continue the same feeds, since the jaundice is physiologic", "Start hydrocortisone and continue breast milk", "Stop lactose feeds, start a lactose-free formula and send GALT activity"], "answer": 3, "explanation": "Classic galactosemia (GALT deficiency); non-glucose reducing substance in urine suggests it. Closest distractor: Treat sepsis in parallel; dietary change is life-saving.", "pearl": "Classic galactosemia (GALT deficiency); non-glucose reducing substance in urine suggests it.", "srcAnswer": "D"}, {"num": 58, "level": "High-Difficulty", "question": "A 2-day-old has fasting hypoglycemia, lactate 9 mmol/L, hepatomegaly, hyperuricemia and hypertriglyceridemia. The most likely diagnosis is:", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Glycogen storage disease type I", "Congenital hypopituitarism", "Congenital hyperinsulinism"], "answer": 1, "explanation": "Failure of glycogenolysis and gluconeogenesis causes hypoglycemia, lactic acidosis and organomegaly. Closest distractor: HI has suppressed ketones with no lactic acidosis.", "pearl": "Failure of glycogenolysis and gluconeogenesis causes hypoglycemia, lactic acidosis and organomegaly.", "srcAnswer": "B"}, {"num": 59, "level": "High-Difficulty", "question": "A 3-day-old with a conotruncal heart defect has hypocalcemic seizures, low PTH and a hypoplastic thymus on imaging. The next investigation is:", "options": ["Chromosome 22q11.2 deletion testing (FISH/microarray)", "Serum ammonia and plasma amino acids with urine organic acids", "Karyotype for trisomy 21", "Urine reducing substances"], "answer": 0, "explanation": "DiGeorge syndrome causes hypoparathyroid hypocalcemia with cardiac and thymic anomalies. Closest distractor: An emergency bolus is not the complete etiologic treatment. Why not the others: B. Serum ammonia and plasma amino acids with urine organic acids — Organic acidemia is expected to produce high-anion-gap ketoacidosis; the stem’s gas/anion-gap pattern points to another mechanism. Hypocalcemia with low PTH is not nutritional.", "pearl": "Correct ionized Ca urgently; then fix Mg/phosphate/PTH mechanism.", "srcAnswer": "A"}, {"num": 60, "level": "High-Difficulty", "question": "A 6-day-old has lethargy, Na 121 mmol/L, K⁺ 6.9 mmol/L, glucose 38 mg/dL, hyperpigmented genitalia and urine Na 70 mmol/L. The best immediate plan is:", "options": ["Treat the hyperkalemia with insulin–dextrose, observe the sodium and recheck the electrolytes in 6 hours", "Draw cortisol and 17-OHP, then give saline, dextrose and stress-dose hydrocortisone without waiting", "Treat as SIADH with fluid restriction and a 3% saline bolus, then monitor the sodium", "Give oral fludrocortisone alone and review after 24 hours"], "answer": 1, "explanation": "Salt-wasting 21-hydroxylase deficiency causes hyponatremia, hyperkalemia and hypoglycemia (cortisol deficiency). Closest distractor: The correct long-term fix includes safe milk transfer, not only IV fluids. Why not the others: C. Treat as SIADH with fluid restriction and a 3% saline bolus, then monitor the sodium — SIADH is typically euvolaemic water retention and does not explain the stem’s volume-depletion or mineralocorticoid-deficiency clues. Hyperkalemia with hyponatremia suggests adrenal disease, not SIADH.", "pearl": "Hypernatremic feeding failure needs fluid therapy plus feeding-system repair.", "srcAnswer": "B"}, {"num": 61, "level": "High-Difficulty", "question": "A 12-day-old breastfed infant with Na 166 mmol/L is shocked. The safest sequence is:", "options": ["Large free-water boluses to normalise sodium immediately", "Withhold isotonic fluid because the serum sodium is high", "Isotonic bolus to restore perfusion, then gradual correction of the remaining deficit", "Fluid restriction alone until the sodium falls spontaneously over the next day or two"], "answer": 2, "explanation": "Perfusion comes first; the total deficit is replaced slowly with serial sodium checks. Closest distractor: Do not let hypernatremia prevent indicated shock resuscitation. Why not the others: A. Large free-water boluses to normalise sodium immediately — Rapid free-water delivery would accelerate sodium decline and increase cerebral-edema risk; the deficit needs controlled correction.; D. Fluid restriction alone until the sodium falls spontaneously over the next day or two — Fluid restriction cannot restore perfusion in true volume depletion or shock; resuscitation and controlled deficit replacement are required.", "pearl": "First restore circulation; then manage the osmotic deficit slowly.", "srcAnswer": "C"}, {"num": 62, "level": "High-Difficulty", "question": "A 25-week infant on day 5 has Na 156 mmol/L, oedema and weight gain while receiving about 5 mmol/kg/day of sodium from bicarbonate, flushes and drug diluents. The best management is:", "options": ["Insensible loss alone: increase humidity and give 3% saline promptly to correct the sodium", "Diabetes insipidus: start desmopressin", "Dehydration: give 0.9% saline boluses to restore volume", "Sodium overload: cut sodium from all sources, modest free water, consider a diuretic"], "answer": 3, "explanation": "Hypernatremia with weight gain implies sodium excess rather than water deficit. Closest distractor: Count hidden sodium (flushes, drug diluents, bicarbonate). Why not the others: B. Diabetes insipidus: start desmopressin — DI requires inappropriately dilute urine during hypertonicity; the paired urine/volume data in this stem point elsewhere. Count hidden sodium (flushes, drug diluents, bicarbonate).", "pearl": "Hypernatremia with weight gain implies sodium excess rather than water deficit.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day10',label:'Day 10',set:'Quiz 4',href:'Day10/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day10_QuizSet4_Q48-62_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 10 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 48–62</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 10 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 10'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 10');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day10:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
