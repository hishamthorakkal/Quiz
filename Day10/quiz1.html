<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "A bedside meter shows a low glucose in a neonate. The reference test to confirm the value is:", "options": ["A fasting glucose repeated after a supervised six-hour break in feeding", "A repeat reading on the same meter after warming the heel, with treatment withheld until confirmed", "Plasma glucose on a laboratory analyser, sent without delaying treatment if symptomatic", "A urine glucose and ketone dipstick from the next void, used to judge glucose handling"], "answer": 2, "explanation": "Point-of-care meters are inaccurate at low values; the laboratory plasma value confirms diagnosis, but a symptomatic infant is treated first. Closest distractor: Never withhold rescue glucose while waiting for confirmation.", "pearl": "Point-of-care meters are inaccurate at low values; the laboratory plasma value confirms diagnosis, but a symptomatic infant is treated first.", "srcAnswer": "C"}, {"num": 2, "level": "Basic/Recall", "question": "Which buccal dose of 40% dextrose gel is used for an eligible, asymptomatic at-risk newborn?", "options": ["0.05 mL/kg (20 mg/kg), massaged into the cheek and followed by a feed", "5 mL/kg (2 g/kg), massaged into the cheek and repeated every hour", "2 mL/kg (800 mg/kg), massaged into the cheek and given without a feed afterwards", "0.5 mL/kg (200 mg/kg), massaged into the cheek and followed by a feed"], "answer": 3, "explanation": "40% gel contains 400 mg/mL, so 0.5 mL/kg delivers 200 mg/kg, the same glucose mass as D10 2 mL/kg IV. Closest distractor: Gel concentration is 400 mg/mL; IV D10 is only 100 mg/mL.", "pearl": "40% gel 0.5 mL/kg accompanies feeding; it does not replace IV therapy for a sick neonate.", "srcAnswer": "D"}, {"num": 3, "level": "Basic/Recall", "question": "Which calcium fraction is responsible for neuromuscular and cardiac effects?", "options": ["Albumin-bound calcium, which falls in parallel with the ionised fraction and drives symptoms", "Ionised (free) calcium, roughly half of total calcium in a healthy neonate", "The calcium–phosphate product calculated from the same serum sample", "Complexed calcium bound to citrate, lactate and phosphate anions"], "answer": 1, "explanation": "Only ionised calcium is biologically active; total calcium also contains albumin-bound and complexed fractions. Closest distractor: Total calcium is influenced by albumin; ionized calcium is the active component.", "pearl": "Check ionized calcium when symptoms and total calcium do not agree.", "srcAnswer": "B"}, {"num": 4, "level": "Basic/Recall", "question": "Which feature best favours jitteriness over a neonatal seizure?", "options": ["Tonic posturing with apnoea and desaturation that does not change with stimulation", "Asymmetric movements that are accompanied by tachycardia and a fixed gaze", "Rhythmic clonic jerks that continue when the limb is held and are accompanied by eye deviation", "Symmetric fine tremor that is provoked by stimulation and stops when the limb is gently held"], "answer": 3, "explanation": "Jitteriness is stimulus-sensitive, lacks eye and autonomic signs and is suppressed by holding; seizures are not suppressible. Closest distractor: Subtle events still need electrographic confirmation (aEEG with raw EEG).", "pearl": "Jitteriness is stimulus-sensitive, lacks eye and autonomic signs and is suppressed by holding; seizures are not suppressible.", "srcAnswer": "D"}, {"num": 5, "level": "Basic/Recall", "question": "D10 is running at 80 mL/kg/day. What is the glucose infusion rate (GIR)?", "options": ["3.5 mg/kg/min", "5.6 mg/kg/min", "8.0 mg/kg/min", "11.1 mg/kg/min"], "answer": 1, "explanation": "GIR = D% × mL/kg/day ÷ 144 = 10 × 80 ÷ 144 = 5.56 mg/kg/min. Calculation: Formula: GIR = D% × mL/kg/day ÷ 144. Substitution: 10 × 80 ÷ 144. Final answer: 5.56 mg/kg/min. Common trap: Do not report fluid volume as GIR. Closest distractor: The factor 144 already accounts for percent concentration and 1440 min/day. Why not the others: A. 3.5 mg/kg/min — This numerical option conflicts with GIR = D% × mL/kg/day ÷ 144. Substitution 10 × 80 ÷ 144 gives 5.56 mg/kg/min; the likely trap is: Do not report fluid volume as GIR.; C. 8.0 mg/kg/min — This numerical option conflicts with GIR = D% × mL/kg/day ÷ 144. Substitution 10 × 80 ÷ 144 gives 5.56 mg/kg/min; the likely trap is: Do not report fluid volume as GIR.; D. 11.1 mg/kg/min — This numerical option conflicts with GIR = D% × mL/kg/day ÷ 144. Substitution 10 × 80 ÷ 144 gives 5.56 mg/kg/min; the likely trap is: Do not report fluid volume as GIR.", "pearl": "GIR (mg/kg/min) = D% × mL/kg/day / 144.", "srcAnswer": "B"}, {"num": 6, "level": "Basic/Recall", "question": "A neonate has metabolic acidosis with HCO₃⁻ 10 mmol/L. Winter's formula predicts a PaCO₂ of about:", "options": ["15 mmHg (±2)", "23 mmHg (±2)", "30 mmHg (±2)", "38 mmHg (±2)"], "answer": 1, "explanation": "Expected PaCO₂ = 1.5 × HCO₃⁻ + 8 = 1.5 × 10 + 8 = 23 ± 2 mmHg. Calculation: Formula: Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution: 1.5 × 10 + 8. Final answer: 23 ± 2 mmHg. Common trap: Winter's formula estimates compensation; it is not the measured PaCO₂. Closest distractor: A low PaCO2 can be compensatory, not a second disease. Why not the others: A. 15 mmHg (±2) — This numerical option conflicts with Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 10 + 8 gives 23 ± 2 mmHg; the likely trap is: Winter's formula estimates compensation; it is not the measured PaCO₂.; C. 30 mmHg (±2) — This numerical option conflicts with Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 10 + 8 gives 23 ± 2 mmHg; the likely trap is: Winter's formula estimates compensation; it is not the measured PaCO₂.; D. 38 mmHg (±2) — This numerical option conflicts with Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 10 + 8 gives 23 ± 2 mmHg; the likely trap is: Winter's formula estimates compensation; it is not the measured PaCO₂.", "pearl": "Winter's formula is a heuristic: expected PaCO2 ≈ 1.5×HCO3+8 ±2.", "srcAnswer": "B"}, {"num": 7, "level": "Basic/Recall", "question": "A neonate has unexplained encephalopathy with respiratory alkalosis. The most urgent investigation is:", "options": ["Urinary organic acids, with treatment withheld until the report returns", "Serum bile acids and conjugated bilirubin on a routine morning draw", "Plasma ammonia, from a free-flowing sample sent on ice and analysed immediately", "Cranial ultrasound alone as the initial investigation, with ammonia sent only if it is abnormal"], "answer": 2, "explanation": "Respiratory alkalosis with encephalopathy suggests a urea-cycle disorder; ammonia is fragile and delayed or haemolysed samples mislead. Closest distractor: Organic acidemias more often cause high-anion-gap metabolic acidosis.", "pearl": "Respiratory alkalosis + unexplained neonatal encephalopathy: check ammonia urgently.", "srcAnswer": "C"}, {"num": 8, "level": "Conceptual", "question": "Why do CPS 2025 and PES 2015 quote different ages (72 h versus 48 h)?", "options": ["They are separate consensus documents with different aims: CPS defines transitional hypoglycemia, PES screens for persistent disorders", "PES adopted 72 h in 2015 and CPS shortened it to 48 h in its 2025 update", "CPS covers only preterm infants whereas PES covers only term infants, reflecting their different physiology and feeding patterns", "The ages reflect different glucose-meter calibration standards in Canada and the United States"], "answer": 0, "explanation": "CPS separates transitional (<72 h) from persistent (≥72 h) hypoglycemia; PES uses 48 h to begin evaluating suspected persistent disorders. Closest distractor: CPS 72 h is not interchangeable with PES 48 h.", "pearl": "Always name the framework and infant age before quoting a threshold.", "srcAnswer": "A"}, {"num": 9, "level": "Conceptual", "question": "Why does a GIR above 8 mg/kg/min point towards hyperinsulinism?", "options": ["Insulin excess causes renal glucose wasting, so most infused glucose is lost in the urine", "Insulin excess drives ketone production, so extra glucose is needed to buffer the resulting metabolic acidosis in the newborn", "Insulin excess shuts off hepatic glucose output, lipolysis and ketogenesis, so the brain depends entirely on infused glucose", "Insulin excess increases cortisol clearance, so counter-regulatory glucose production falls"], "answer": 2, "explanation": "Insulin suppresses glycogenolysis, gluconeogenesis, lipolysis and ketogenesis, so alternative fuels are unavailable. Closest distractor: Look for suppressed ketones and FFAs during low glucose.", "pearl": "GIR >8 mg/kg/min in a neonate is a strong clue, not a standalone diagnosis, for HI.", "srcAnswer": "C"}, {"num": 10, "level": "Conceptual", "question": "Why should a critical sample be drawn before corrective glucose when this does not delay care?", "options": ["Glucose therapy raises cortisol and growth hormone above range for several hours", "Glucose rapidly raises insulin and suppresses lipolysis and ketones, erasing the diagnostic pattern", "A critical sample is valid only after twelve hours of documented fasting", "Glucose therapy permanently destroys circulating insulin, so later assays cannot be interpreted reliably"], "answer": 1, "explanation": "The fuel pattern (BOHB, FFA, lactate, insulin) is only diagnostic at the moment of low glucose. Closest distractor: Critical samples are time-state dependent.", "pearl": "Draw the sample if immediately feasible; never delay lifesaving glucose in a symptomatic infant.", "srcAnswer": "B"}, {"num": 11, "level": "Conceptual", "question": "Why can hypomagnesemia make hypocalcemia refractory to calcium replacement?", "options": ["Low magnesium converts ionised calcium to the bound form, which IV calcium cannot reverse", "Low magnesium blocks intestinal calcium absorption, so oral rather than IV calcium is needed", "Low magnesium increases renal calcium reabsorption, which masks the deficit and delays the response to therapy", "Low magnesium impairs PTH secretion and end-organ response, so calcium alone fails until magnesium is corrected"], "answer": 3, "explanation": "Magnesium is required for PTH release and action. Closest distractor: A calcium-only approach can fail when Mg is very low.", "pearl": "Refractory neonatal hypocalcemia: check and correct magnesium.", "srcAnswer": "D"}, {"num": 12, "level": "Conceptual", "question": "Why is late-onset hypocalcemia (after 72 h) classically linked to a high-phosphate feed?", "options": ["Phosphate raises PTH excessively, which drives calcium into bone and out of the circulation", "A phosphate load lowers ionised calcium, and the immature kidney and parathyroid response cannot compensate", "Phosphate binds albumin and raises total calcium while ionised calcium stays unchanged", "High-phosphate feeds cause vitamin D toxicity, which produces hypocalcemia within the first day of life"], "answer": 1, "explanation": "Cow's-milk formula has a higher phosphate load than breast milk; neonatal phosphaturia and PTH response are limited. Closest distractor: The timing after 72 hours helps narrow etiology.", "pearl": "Late hypocalcemia: review feeds/phosphate, vitamin D, Mg and PTH context.", "srcAnswer": "B"}, {"num": 13, "level": "Conceptual", "question": "Which statement correctly links the rate of sodium correction to its main brain complication?", "options": ["Too-fast fall in chronic hypernatremia causes osmotic demyelination; too-fast rise in hyponatremia causes cerebral oedema", "Only a too-fast sodium rise matters; brain cells adapt completely to a fast fall in hypernatremia", "Too-fast fall in chronic hypernatremia causes cerebral oedema; too-fast rise in chronic hyponatremia causes osmotic demyelination", "Both complications depend on the absolute sodium value rather than on its rate of change"], "answer": 2, "explanation": "Brain cells accumulate idiogenic osmoles in hypernatremia (rapid fall draws water in) and lose osmolytes in hyponatremia (rapid rise causes demyelination). Closest distractor: Rate matters more than the end value.", "pearl": "Brain cells accumulate idiogenic osmoles in hypernatremia (rapid fall draws water in) and lose osmolytes in hyponatremia (rapid rise causes…", "srcAnswer": "C"}, {"num": 14, "level": "Conceptual", "question": "SIADH and cerebral salt wasting both give low serum sodium with high urine sodium. What best separates them?", "options": ["Urine osmolality: it is dilute in SIADH and concentrated in cerebral salt wasting, which separates the two", "Plasma osmolality: it is high in SIADH and low in cerebral salt wasting", "Extracellular volume: SIADH is euvolaemic or mildly overloaded, whereas cerebral salt wasting is volume-depleted", "Serum potassium: it is always raised in SIADH and always low in salt wasting"], "answer": 2, "explanation": "Volume status drives therapy: fluid restriction for SIADH, sodium and volume replacement for salt wasting. Closest distractor: High urine sodium alone proves neither.", "pearl": "Volume status drives therapy: fluid restriction for SIADH, sodium and volume replacement for salt wasting.", "srcAnswer": "C"}, {"num": 15, "level": "Conceptual", "question": "Why is routine maintenance sodium often withheld in the first days of life in many neonates?", "options": ["Early adaptation includes physiologic contraction of the extracellular fluid with natriuresis until postnatal diuresis", "Neonatal sodium losses are fixed, so a fixed isotonic regimen is needed from birth", "Newborn kidneys cannot excrete sodium, so any sodium given in week one is retained and harmful to the infant", "Term and preterm renal handling is identical, so one regimen suits every gestation"], "answer": 0, "explanation": "Individualise fluids by gestation, weight trend, urine output and serum sodium. Closest distractor: NICE NG29 distinguishes early term-neonate adaptation from later maintenance.", "pearl": "First days: assess weight, urine, sodium and postnatal diuresis before adding routine sodium.", "srcAnswer": "A"}, {"num": 16, "level": "Conceptual", "question": "Why does diarrhoea or renal bicarbonate loss produce a normal-anion-gap acidosis?", "options": ["Lost bicarbonate is replaced by lactate, which is an unmeasured anion that widens the gap", "Lost bicarbonate is replaced by retained chloride, so unmeasured anions do not change", "Chloride is lost together with bicarbonate, so sodium alone determines the gap", "Retained ketoacids replace bicarbonate, widening the gap, but hypoalbuminemia masks it"], "answer": 1, "explanation": "AG = Na − (Cl + HCO₃); HCO₃ falls while Cl rises equally, leaving the gap unchanged. Closest distractor: Acid-base phenotype directs urgent metabolic testing.", "pearl": "High ammonia + respiratory alkalosis → prioritize UCD until proven otherwise.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day10',label:'Day 10',set:'Quiz 1',href:'Day10/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day10_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 10 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 → Correct + understood → R1 → Improving" for each notebook retest in this set.
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  if(!a)return`Day 10 Q${q.num} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`Day 10 Q${q.num} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`Day 10 Q${q.num} → Correct + understood → ${st} → Improving`;
  return`Day 10 Q${q.num} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 10'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 10');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day10:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
