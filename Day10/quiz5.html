<script>
const quiz=[{"num": 63, "level": "High-Difficulty", "question": "A day-4 neonate has glucose 700 mg/dL and a measured sodium of 128 mmol/L. The corrected sodium (1.6 mmol/L per 100 mg/dL above 100) is about:", "options": ["121 mmol/L", "128 mmol/L", "138 mmol/L", "150 mmol/L"], "answer": 2, "explanation": "128 + 1.6 × (600 ÷ 100) = 137.6; hyperglycemia dilutes sodium by drawing water out of cells. Calculation: Formula: Corrected Na = measured Na + 1.6 × [(glucose −100)/100]. Substitution: 128 + 1.6 × 6. Final answer: 137.6 mmol/L ≈ 138. Common trap: Use the correction factor explicitly given in the question. Closest distractor: Measured sodium alone may underestimate underlying hypertonicity. Why not the others: A. 121 mmol/L — This numerical option conflicts with Corrected Na = measured Na + 1.6 × [(glucose −100)/100]. Substitution 128 + 1.6 × 6 gives 137.6 mmol/L ≈ 138; the likely trap is: Use the correction factor explicitly given in the question.; B. 128 mmol/L — This numerical option conflicts with Corrected Na = measured Na + 1.6 × [(glucose −100)/100]. Substitution 128 + 1.6 × 6 gives 137.6 mmol/L ≈ 138; the likely trap is: Use the correction factor explicitly given in the question.; D. 150 mmol/L — This numerical option conflicts with Corrected Na = measured Na + 1.6 × [(glucose −100)/100]. Substitution 128 + 1.6 × 6 gives 137.6 mmol/L ≈ 138; the likely trap is: Use the correction factor explicitly given in the question.", "pearl": "Corrected sodium helps interpret marked hyperglycemia, but formulas are approximations.", "srcAnswer": "C"}, {"num": 64, "level": "High-Difficulty", "question": "A septic, tiring infant has pH 7.10, PaCO₂ 30 mmHg and HCO₃⁻ 9 mmol/L. The best interpretation and action are:", "options": ["Metabolic acidosis with inadequate compensation (concurrent respiratory acidosis); give ventilatory support", "Metabolic acidosis with appropriate compensation; treat the cause only", "Pure respiratory acidosis; increase ventilation without addressing the metabolic component of the disorder", "Metabolic acidosis with concurrent respiratory alkalosis; reduce ventilation"], "answer": 0, "explanation": "Expected PaCO₂ = 1.5 × 9 + 8 = 21.5 ± 2; a PaCO₂ of 30 is too high, signalling ventilatory failure. Calculation: Formula: Winter's expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution: 1.5 × 9 + 8 = 21.5 ± 2. Final answer: expected ~19.5–23.5; measured 30 is high. Common trap: PaCO₂ above the expected band = added respiratory acidosis. Closest distractor: A low PaCO2 can be compensatory, not a second disease. Why not the others: B. Metabolic acidosis with appropriate compensation; treat the cause only — This numerical option conflicts with Winter's expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 9 + 8 = 21.5 ± 2 gives expected ~19.5–23.5; measured 30 is high; the likely trap is: PaCO₂ above the expected band = added respiratory acidosis.; C. Pure respiratory acidosis; increase ventilation without addressing the metabolic component of the disorder — This numerical option conflicts with Winter's expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 9 + 8 = 21.5 ± 2 gives expected ~19.5–23.5; measured 30 is high; the likely trap is: PaCO₂ above the expected band = added respiratory acidosis.; D. Metabolic acidosis with concurrent respiratory alkalosis; reduce ventilation — This numerical option conflicts with Winter's expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Substitution 1.5 × 9 + 8 = 21.5 ± 2 gives expected ~19.5–23.5; measured 30 is high; the likely trap is: PaCO₂ above the expected band = added respiratory acidosis.", "pearl": "Winter's formula is a heuristic: expected PaCO2 ≈ 1.5×HCO3+8 ±2.", "srcAnswer": "A"}, {"num": 65, "level": "High-Difficulty", "question": "A 4-day-old has ammonia 780 µmol/L, a normal anion gap, low plasma citrulline and markedly raised urinary orotic acid. The diagnosis is:", "options": ["Carbamoyl phosphate synthetase 1 deficiency, in which orotic acid is low", "Argininosuccinate synthetase deficiency, in which citrulline is very high", "Propionic acidemia, in which a high-anion-gap ketoacidosis is expected", "Ornithine transcarbamylase (OTC) deficiency"], "answer": 3, "explanation": "Carbamoyl phosphate accumulates in OTC deficiency and is shunted to orotic acid; citrulline is low. Closest distractor: Organic acidemia can also elevate ammonia but usually has acid accumulation.", "pearl": "Hyperammonemia without significant acidosis/ketosis is a UCD clue.", "srcAnswer": "D"}, {"num": 66, "level": "High-Difficulty", "question": "An infant with a urea-cycle disorder has ammonia 900 µmol/L four hours after a loading dose of sodium benzoate–phenylacetate and arginine, and it is rising. The best next step is:", "options": ["Peritoneal dialysis as the preferred and fastest option, with scavengers stopped meanwhile", "Resuming protein feeds, since they promote nitrogen clearance", "Doubling the sodium benzoate dose and observing for 12 hours", "Urgent haemodialysis (CVVHDF if unavailable), continuing scavengers and calories"], "answer": 3, "explanation": "Ammonia above about 400 µmol/L, or failure to respond, triggers extracorporeal clearance; haemodialysis is the most efficient. Closest distractor: Typical load: sodium benzoate and phenylacetate 250 mg/kg each over 90–120 minutes in D10. Why not the others: B. Resuming protein feeds, since they promote nitrogen clearance — Ongoing protein adds nitrogen during hyperammonemia; protein is stopped only briefly while anti-catabolic calories and ammonia-lowering treatment begin.", "pearl": "Ammonia above about 400 µmol/L, or failure to respond, triggers extracorporeal clearance; haemodialysis is the most efficient.", "srcAnswer": "D"}, {"num": 67, "level": "High-Difficulty", "question": "A newborn screen shows raised C8 and C10 acylcarnitines. During a febrile illness the infant is vomiting with glucose 40 mg/dL. The best management is:", "options": ["Avoid fasting; give IV 10% dextrose promptly and treat the intercurrent illness", "Restrict carbohydrate and give a high-fat diet to promote ketone formation during the illness", "Wait for a confirmatory enzyme assay before giving glucose", "Give IV lipid emulsion as the main calorie source"], "answer": 0, "explanation": "MCAD deficiency: raised octanoylcarnitine; hypoglycemia is hypoketotic and avoidable with glucose. Closest distractor: Never fast a suspected FAOD infant.", "pearl": "MCAD deficiency: raised octanoylcarnitine; hypoglycemia is hypoketotic and avoidable with glucose.", "srcAnswer": "A"}, {"num": 68, "level": "High-Difficulty", "question": "An IUGR 26-week infant on aggressive early parenteral nutrition has phosphate 0.7 mmol/L, K⁺ 2.9 and low Mg on day 3. The best explanation and response are:", "options": ["Primary renal tubular loss: start a thiazide", "SIADH: restrict fluid, add 3% saline and recheck electrolytes in four hours", "Refeeding-type shift: add phosphate (with K⁺ and Mg as needed) to the PN", "Hypercalcemia: reduce calcium to zero and stop PN"], "answer": 2, "explanation": "Early amino acid and glucose provision drives phosphate, K⁺ and Mg into cells. Closest distractor: A normal serum calcium is not a nutritional all-clear.", "pearl": "Preterm bone disease: phosphate/ALP/growth may be more informative than calcium alone.", "srcAnswer": "C"}, {"num": 69, "level": "High-Difficulty", "question": "After insulin 0.1 U/kg and D10 2 mL/kg for hyperkalemia in a 28-week infant, glucose is 30 mg/dL 45 minutes later. The key lesson is:", "options": ["Dextrose bolus raises potassium, so avoid dextrose whenever insulin is given in preterm infants", "Insulin should be given without dextrose in preterm infants", "Insulin action outlasts the dextrose bolus: run a dextrose infusion, check glucose every 30–60 min", "This represents congenital hyperinsulinism, so start diazoxide"], "answer": 2, "explanation": "The hypoglycemia is iatrogenic; insulin–dextrose therapy needs a sustained glucose source. Closest distractor: Insulin–dextrose is a monitored, infusion-based regimen.", "pearl": "The hypoglycemia is iatrogenic; insulin–dextrose therapy needs a sustained glucose source.", "srcAnswer": "C"}, {"num": 70, "level": "Integrated/Rank-Differentiating", "question": "A 35-week IDM has glucose 34 mg/dL at 2 hours, is jittery and apnoeic, and is not feeding. The best sequence is:", "options": ["Confirm glucose without delay, IV D10 2 mL/kg then infusion, recheck at 30 minutes, check calcium and sepsis, investigate if recurrent", "Wait for insulin, cortisol and ketones before giving any glucose", "Give 40% gel with a feed and discharge once the jitteriness settles", "Observe for six hours since transitional glucose usually recovers spontaneously, and feed on demand with meter checks before each feed"], "answer": 0, "explanation": "Symptomatic hypoglycemia is treated IV immediately; jitteriness and apnoea also prompt a check of calcium and infection. Closest distractor: A correct diagnostic plan is unsafe if it delays neuroprotection.", "pearl": "Symptomatic hypoglycemia: treatment first; investigate persistent recurrence.", "srcAnswer": "A"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "A 3-day-old has glucose below 45 mg/dL on GIR 12, BOHB 0.2, FFA 0.3, insulin below the assay limit and a 35 mg/dL glucagon rise. The best integrated diagnosis and step are:", "options": ["Biochemical hyperinsulinism: maintain glucose and arrange specialist work-up despite undetectable insulin", "Physiologic transition: stop monitoring", "Fatty-acid oxidation defect: stop glucose to promote ketones and watch for hypoketotic hypoglycemia over 24 hours", "Primary calcium deficiency: give calcium alone"], "answer": 0, "explanation": "High GIR, suppressed fuels and ≥30 mg/dL glucagon rise establish insulin action. Closest distractor: A normal/low insulin result cannot erase abnormal fuel physiology. Why not the others: C. Fatty-acid oxidation defect: stop glucose to promote ketones and watch for hypoketotic hypoglycemia over 24 hours — FAOD is generally hypoketotic with relatively high FFA; the suppressed FFA pattern here reflects excess insulin action.", "pearl": "HI can be diagnosed from insulin action even if plasma insulin is low.", "srcAnswer": "A"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "A 2.9-kg infant with HIE has glucose 31 mg/dL, Na 124 mmol/L, oliguria and seizures. The safest strategy is:", "options": ["Normalise sodium rapidly to 140 mmol/L while ignoring the glucose, since seizures are caused by sodium alone and will stop", "Delay glucose until MRI has excluded HIE", "Give a large hypotonic maintenance bolus to correct both problems, then recheck electrolytes and glucose in six hours and reassess clinically", "Treat hypoglycemia promptly, stabilise ABCs and seizures, assess hyponatremic encephalopathy, set fluids with close glucose and sodium checks"], "answer": 3, "explanation": "Hypoglycemia with seizures is treated at once; hyponatremia in HIE is commonly SIADH-like and fluids are limited. Closest distractor: Treat immediately reversible metabolic threats while investigating others.", "pearl": "Seizures may be multifactorial: glucose, sodium, calcium, HIE and infection.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "A 9-day-old breastfed infant has 14% weight loss, Na 167, glucose 51 mg/dL, concentrated urine and poor perfusion. The best plan is:", "options": ["Restrict fluids because the sodium is high", "Stabilise shock, calculate gradual deficit replacement, monitor sodium and glucose frequently and support lactation", "Correct the sodium to 140 within 6 hours using free water", "Diagnose diabetes insipidus and give desmopressin before checking volume status, urine osmolality or feeding history"], "answer": 1, "explanation": "Concentrated urine excludes DI; slow correction protects the brain. Closest distractor: The correct long-term fix includes safe milk transfer, not only IV fluids. Why not the others: C. Correct the sodium to 140 within 6 hours using free water — Rapid free-water delivery would accelerate sodium decline and increase cerebral-edema risk; the deficit needs controlled correction.; D. Diagnose diabetes insipidus and give desmopressin before checking volume status, urine osmolality or feeding history — DI requires inappropriately dilute urine during hypertonicity; the paired urine/volume data in this stem point elsewhere. Hypernatremic dehydration hides volume depletion.", "pearl": "Hypernatremic feeding failure needs fluid therapy plus feeding-system repair.", "srcAnswer": "B"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "A 4-day-old has ammonia 720 µmol/L, pH 7.53, PaCO₂ 22 mmHg, a normal anion gap and minimal ketosis. The best first-hour plan is:", "options": ["Stop protein briefly, give dextrose and lipid calories, load scavengers with arginine, arrange urgent dialysis", "Perform an unsupervised fasting test and repeat the ammonia in 12 hours while awaiting genetic and enzyme results", "Continue protein feeds and await gene sequencing", "Give bicarbonate as the principal ammonia treatment"], "answer": 0, "explanation": "Hyperammonemic emergency: reduce production, provide anti-catabolic calories, give alternative pathways, clear ammonia. Closest distractor: Do not let a sepsis-like presentation obscure a metabolic crisis. Why not the others: D. Give bicarbonate as the principal ammonia treatment — Bicarbonate does not remove ammonia and is not the primary therapy for this hyperammonemic physiology.", "pearl": "UCD rescue is anti-catabolic and ammonia-lowering; protein cessation is temporary.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "A 26-week infant on D10 120 mL/kg/day has glucose 35 mg/dL, Na 128 mmol/L and oliguria, with increasing respiratory support. The best plan is:", "options": ["Stop glucose to reduce fluid volume and recheck in four hours", "Give rapid 3% saline because the sodium is 128 and the infant has increasing respiratory support", "Double the D10 volume to 240 mL/kg/day immediately", "Give D10 2 mL/kg now, then raise GIR by concentration, assess volume and ADH, monitor Na and K"], "answer": 3, "explanation": "Glucose 35 needs immediate correction; increase glucose by concentration, not water, in a patient with water retention. Closest distractor: The right glucose solution is not always more total fluid.", "pearl": "Treat GIR and water balance as separate variables.", "srcAnswer": "D"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "A 5-day-old with hypocalcemic seizures has low Mg, high phosphate and normal glucose. After stabilisation, the best approach is:", "options": ["Monitored IV calcium, correct magnesium, investigate phosphate, PTH, vitamin D and feed source", "Give calcium once and ignore magnesium and phosphate", "Give a high-phosphate formula to correct the low calcium, and check ionised calcium again in 24 hours", "Give vitamin D alone and wait 48 hours"], "answer": 0, "explanation": "Refractory late hypocalcemia is a three-part problem: calcium, magnesium and phosphate. Closest distractor: An emergency bolus is not the complete etiologic treatment.", "pearl": "Correct ionized Ca urgently; then fix Mg/phosphate/PTH mechanism.", "srcAnswer": "A"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "A preterm infant has glucose 41 mg/dL, GIR 9, low BOHB, high FFA and high CK; a sibling died during a febrile illness. The best plan is:", "options": ["Stop glucose and perform a prolonged fast to confirm", "Attribute all findings to transitional hypoglycemia", "Suspect FAOD: avoid fasting, maintain glucose, request urgent acylcarnitine assessment", "Diagnose hyperinsulinism from low BOHB alone and begin diazoxide at 10 mg/kg/day without a critical sample"], "answer": 2, "explanation": "High FFA with low ketones, muscle involvement and family history indicate FAOD. Closest distractor: Hypoketosis is not synonymous with hyperinsulinism. Why not the others: D. Diagnose hyperinsulinism from low BOHB alone and begin diazoxide at 10 mg/kg/day without a critical sample — Hyperinsulinism suppresses both ketones and free fatty acids; the stem retains lipolysis with elevated FFA, favoring FAOD.", "pearl": "FFA direction and muscle/liver clues are key HI-vs-FAOD discriminators.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day10',label:'Day 10',set:'Quiz 5',href:'Day10/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day10_QuizSet5_Q63-77_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 10 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 63–77</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 → Correct + understood → R1 → Improving" for each notebook retest in this set.
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  if(!a)return`Day 10 Q${q.num} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`Day 10 Q${q.num} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`Day 10 Q${q.num} → Correct + understood → ${st} → Improving`;
  return`Day 10 Q${q.num} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 10'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 10');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day10:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
