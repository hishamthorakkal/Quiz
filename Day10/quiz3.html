<script>
const quiz=[{"num": 33, "level": "Clinical/Application", "question": "A 5-day-old formula-fed infant has seizures, a prolonged QTc and ionised calcium 0.65 mmol/L. The priority is:", "options": ["Oral vitamin D alone with review after one week", "IV sodium bicarbonate to correct the associated acidosis", "IV calcium gluconate given slowly with ECG monitoring and a secure line", "IV calcium chloride given as a rapid push through a peripheral cannula to correct the level"], "answer": 2, "explanation": "Symptomatic hypocalcemia needs monitored IV calcium; extravasation and bradycardia are the hazards. Closest distractor: Calcium extravasation and bradycardia are avoidable treatment harms.", "pearl": "Symptomatic low ionized calcium: slow monitored IV calcium, inspect IV site.", "srcAnswer": "C"}, {"num": 34, "level": "Clinical/Application", "question": "A preterm infant has persistent hypocalcemia despite adequate calcium replacement; Mg is 0.42 mmol/L. The missing step is:", "options": ["Increase calcium indefinitely until the ionised level normalises, whatever the magnesium result", "Stop calcium and give a high-phosphate formula to stimulate PTH", "Add furosemide to raise ionised calcium through calciuresis", "Correct magnesium with monitored IV magnesium sulfate while continuing calcium"], "answer": 3, "explanation": "Mg deficiency causes PTH failure and refractory hypocalcemia. Closest distractor: Treat the upstream PTH dysfunction, not just the serum calcium.", "pearl": "Always check Mg when hypocalcemia fails to correct.", "srcAnswer": "D"}, {"num": 35, "level": "Clinical/Application", "question": "A 6-day-old on a high-phosphate formula has jitteriness, low ionised calcium and high phosphate. After stabilisation, the best long-term measure is:", "options": ["Switch to breast milk or a low-phosphate formula and check Mg, PTH and vitamin D", "Continue the formula and add an oral phosphate binder alone", "Give a single large vitamin D bolus and leave feeds unchanged", "Restrict to dextrose-only fluids for 48 hours and then restart the same formula feeds"], "answer": 0, "explanation": "Late hypocalcemia from phosphate load is corrected by reducing phosphate intake. Closest distractor: Check Mg and PTH to exclude hypoparathyroidism.", "pearl": "Late hypocalcemia from phosphate load is corrected by reducing phosphate intake.", "srcAnswer": "A"}, {"num": 36, "level": "Clinical/Application", "question": "An asymptomatic infant has total calcium 1.7 mmol/L, ionised calcium 1.15 mmol/L and albumin 2.0 g/dL. The interpretation is:", "options": ["Primary hypoparathyroidism, so start IV calcium and calcitriol and send a PTH level at once", "Hypomagnesemia, so give IV magnesium immediately", "Early-onset hypocalcemia of prematurity, so give a calcium bolus", "Low total calcium from low albumin binding with normal ionised calcium; IV calcium not needed"], "answer": 3, "explanation": "Treat the ionised calcium and the clinical picture, not the total. Closest distractor: Hypoalbuminemia is a reason to measure ionized calcium.", "pearl": "Treat clinical/ionized calcium context, not total calcium in isolation.", "srcAnswer": "D"}, {"num": 37, "level": "Clinical/Application", "question": "A term infant of a mother treated with magnesium sulfate for eclampsia is hypotonic with weak respiratory effort; Mg is 3.8 mmol/L. The best management is:", "options": ["Respiratory support, and IV calcium gluconate if cardiorespiratory compromise", "IV magnesium to restore normal tone and reflexes", "Immediate exchange transfusion for every level above 2.5 mmol/L, whatever the clinical state", "Phenobarbitone for presumed seizure-related hypotonia"], "answer": 0, "explanation": "Hypermagnesemia causes hypotonia, apnoea and ileus; calcium antagonises its cardiorespiratory effects. Closest distractor: Most infants need only support; levels fall as the drug is cleared.", "pearl": "Hypermagnesemia causes hypotonia, apnoea and ileus; calcium antagonises its cardiorespiratory effects.", "srcAnswer": "A"}, {"num": 38, "level": "Clinical/Application", "question": "A breastfed 9-day-old has 13% weight loss, poor milk transfer, Na 161 mmol/L and oliguria. After treating any shock, the fluid principle is:", "options": ["Give free-water boluses to normalise sodium within 6 hours", "Restrict all fluids because the sodium is high and add a diuretic to promote sodium loss", "Start sodium bicarbonate to bring the sodium down", "Calculate the deficit, replace over 48 hours or more, and check sodium every 4–6 hours"], "answer": 3, "explanation": "Slow replacement avoids cerebral oedema; support lactation in parallel. Closest distractor: Weight loss and feeding history may reveal dehydration despite subtle exam. Why not the others: A. Give free-water boluses to normalise sodium within 6 hours — Rapid free-water delivery would accelerate sodium decline and increase cerebral-edema risk; the deficit needs controlled correction.", "pearl": "Assess shock first, then plan a gradual sodium fall with frequent checks.", "srcAnswer": "D"}, {"num": 39, "level": "Clinical/Application", "question": "A 10-day-old with Na 158 mmol/L, poor feeding and urine osmolality 700 mOsm/kg most likely has:", "options": ["Central diabetes insipidus, which causes failure of ADH secretion and polyuria", "Nephrogenic diabetes insipidus, with renal resistance to ADH and dilute urine", "Inadequate intake with intact renal concentrating ability", "Adrenal salt wasting"], "answer": 2, "explanation": "Concentrated urine shows intact ADH axis and renal response. Closest distractor: The paired urine result is more discriminating than sodium alone. Why not the others: A. Central diabetes insipidus, which causes failure of ADH secretion and polyuria — DI requires inappropriately dilute urine during hypertonicity; the paired urine/volume data in this stem point elsewhere. DI produces inappropriately dilute urine.; B. Nephrogenic diabetes insipidus, with renal resistance to ADH and dilute urine — DI requires inappropriately dilute urine during hypertonicity; the paired urine/volume data in this stem point elsewhere. DI produces inappropriately dilute urine.", "pearl": "Hypernatremia + concentrated urine directs attention to intake/losses.", "srcAnswer": "C"}, {"num": 40, "level": "Clinical/Application", "question": "A 7-day-old with hypernatremia has polyuria and urine osmolality 90 mOsm/kg despite plasma hyperosmolality. This indicates:", "options": ["Diabetes insipidus, central or nephrogenic, with failure to concentrate", "Insensible losses from phototherapy with intact renal concentrating ability", "SIADH with dilutional hypernatremia", "An appropriate renal response to dehydration"], "answer": 0, "explanation": "Dilute urine with high plasma osmolality means ADH deficiency or resistance. Closest distractor: Urine osmolality often decides the differential.", "pearl": "Hypernatremia + inappropriately dilute urine = investigate DI.", "srcAnswer": "A"}, {"num": 41, "level": "Clinical/Application", "question": "A neonate with meningitis has seizures, Na 117 mmol/L and low plasma osmolality. The immediate priority is:", "options": ["A free-water bolus to dilute the cerebral oedema", "Normal saline 20 mL/kg to restore sodium to 140 mmol/L within one hour of presentation", "Fluid restriction alone while anticonvulsants are escalated", "3% saline about 2–3 mL/kg over 10–20 min to abort seizures, then slower correction"], "answer": 3, "explanation": "Aim for a 4–6 mmol/L rise to stop seizures, then limit the total rise (about ≤8–10 mmol/L per 24 h). Closest distractor: Initial lifesaving correction is not permission for full rapid normalization. Why not the others: A. A free-water bolus to dilute the cerebral oedema — Rapid free-water delivery would accelerate sodium decline and increase cerebral-edema risk; the deficit needs controlled correction.", "pearl": "Hyponatremic seizure: urgent small controlled rise, then slow cause-directed correction.", "srcAnswer": "D"}, {"num": 42, "level": "Clinical/Application", "question": "A ventilated infant with CNS disease has Na 125 mmol/L, low plasma osmolality, urine osmolality 450 mOsm/kg and is euvolaemic. The best mechanism and management are:", "options": ["Hypernatremic dehydration: free-water replacement", "SIADH: fluid restriction, avoid hypotonic fluids, treat the cause", "Cerebral salt wasting: salt supplements and increased fluid volume", "Physiologic natriuresis: no intervention is required"], "answer": 1, "explanation": "Euvolaemic hypotonic hyponatremia with inappropriately concentrated urine is SIADH. Closest distractor: Differentiate SIADH from cerebral salt wasting by volume and sodium balance. Why not the others: A. Hypernatremic dehydration: free-water replacement — Rapid free-water delivery would accelerate sodium decline and increase cerebral-edema risk; the deficit needs controlled correction.", "pearl": "SIADH = water excess; urine is not appropriately dilute.", "srcAnswer": "B"}, {"num": 43, "level": "Clinical/Application", "question": "A septic neonate has pH 7.27, PaCO₂ 27 mmHg, HCO₃⁻ 12 mmol/L, Na 138, Cl 100 and lactate 7 mmol/L. The correct interpretation is:", "options": ["High-anion-gap metabolic acidosis (gap 26) with appropriate respiratory compensation", "Mixed metabolic acidosis and primary respiratory alkalosis", "Normal-anion-gap metabolic acidosis with respiratory compensation", "High-anion-gap metabolic acidosis with an additional respiratory acidosis from poor ventilation"], "answer": 0, "explanation": "AG = 138 − (100 + 12) = 26; Winter's gives 1.5 × 12 + 8 = 26 ± 2, and measured PaCO₂ 27 fits. Closest distractor: Do not mistake compensatory low CO2 for the primary disorder.", "pearl": "Lactate-associated low HCO3 with low PaCO2 = metabolic acidosis plus compensation.", "srcAnswer": "A"}, {"num": 44, "level": "Clinical/Application", "question": "A 3-day-old is lethargic after feeds; pH 7.10, HCO₃⁻ 9 mmol/L, anion gap 25, ketonuria and neutropenia. The favoured group is:", "options": ["Congenital hyperinsulinism", "Urea-cycle disorder, with respiratory alkalosis and hyperammonemia", "Organic acidemia (propionic or methylmalonic)", "SIADH"], "answer": 2, "explanation": "High-gap ketoacidosis with neutropenia and thrombocytopenia suggests an organic acidemia; ammonia may be secondarily raised. Closest distractor: UCD may be hyperammonemic but often lacks severe ketoacidosis. Why not the others: B. Urea-cycle disorder, with respiratory alkalosis and hyperammonemia — UCD is favored by respiratory alkalosis with marked hyperammonemia and little ketosis; this option does not match the stem’s paired acid-base/fuel pattern. UCD has respiratory alkalosis with little ketosis.", "pearl": "High-gap acidosis + ketosis ± ammonia elevation = consider organic acidemia.", "srcAnswer": "C"}, {"num": 45, "level": "Clinical/Application", "question": "A 4-day-old has vomiting, tachypnoea and encephalopathy: pH 7.51, PaCO₂ 23 mmHg, HCO₃⁻ 18, normal anion gap, ammonia 680 µmol/L, no ketonuria. The most likely diagnosis is:", "options": ["Urea-cycle disorder", "Propionic acidemia", "Pyloric stenosis", "Diabetic ketoacidosis"], "answer": 0, "explanation": "Marked hyperammonemia with respiratory alkalosis and no ketoacidosis suggests a UCD. Closest distractor: Do not wait for genetic confirmation before anti-catabolic treatment.", "pearl": "Newborn encephalopathy + respiratory alkalosis + high ammonia = metabolic emergency.", "srcAnswer": "A"}, {"num": 46, "level": "Clinical/Application", "question": "A neonate has ammonia 320 µmol/L on a difficult, delayed sample. The safest approach is:", "options": ["Disregard the result since delayed samples are always falsely high and unrelated to disease", "Repeat promptly with correct handling while starting treatment and urgent metabolic referral", "Give a protein load to confirm the diagnosis, then repeat the ammonia after two hours", "Wait for urine organic acids before stabilising the infant"], "answer": 1, "explanation": "Pre-analytic error can raise ammonia, but a sick infant is treated while the value is repeated. Closest distractor: A questionable sample is a reason to repeat, not to ignore severe symptoms. Why not the others: C. Give a protein load to confirm the diagnosis, then repeat the ammonia after two hours — Ongoing protein adds nitrogen during hyperammonemia; protein is stopped only briefly while anti-catabolic calories and ammonia-lowering treatment begin.", "pearl": "Ammonia: prompt chilled/rapid processing and clinical urgency both matter.", "srcAnswer": "B"}, {"num": 47, "level": "Clinical/Application", "question": "A fluid-restricted infant on 100 mL/kg/day needs a GIR of 8 mg/kg/min. The required dextrose concentration is about:", "options": ["D8", "D10", "D11.5", "D15"], "answer": 2, "explanation": "D% = GIR × 144 ÷ mL/kg/day = 8 × 144 ÷ 100 = 11.5%. Calculation: Formula: Required D% = GIR × 144 ÷ mL/kg/day. Substitution: 8 × 144 ÷ 100. Final answer: 11.52%, approximately D11.5. Common trap: Increase concentration rather than free-water volume when fluid-restricted. Closest distractor: Increasing fluid volume is not the only way to raise GIR. Why not the others: A. D8 — This numerical option conflicts with Required D% = GIR × 144 ÷ mL/kg/day. Substitution 8 × 144 ÷ 100 gives 11.52%, approximately D11.5; the likely trap is: Increase concentration rather than free-water volume when fluid-restricted.; B. D10 — This numerical option conflicts with Required D% = GIR × 144 ÷ mL/kg/day. Substitution 8 × 144 ÷ 100 gives 11.52%, approximately D11.5; the likely trap is: Increase concentration rather than free-water volume when fluid-restricted.; D. D15 — This numerical option conflicts with Required D% = GIR × 144 ÷ mL/kg/day. Substitution 8 × 144 ÷ 100 gives 11.52%, approximately D11.5; the likely trap is: Increase concentration rather than free-water volume when fluid-restricted.", "pearl": "D% = GIR ×144 /(mL/kg/day).", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day10',label:'Day 10',set:'Quiz 3',href:'Day10/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day10_QuizSet3_Q33-47_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 10 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–47</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 → Correct + understood → R1 → Improving" for each notebook retest in this set.
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  if(!a)return`Day 10 Q${q.num} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`Day 10 Q${q.num} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`Day 10 Q${q.num} → Correct + understood → ${st} → Improving`;
  return`Day 10 Q${q.num} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 10'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 10');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day10:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
