const quiz=[{"num": 17, "level": "Conceptual", "question": "Why does a urea-cycle defect often cause respiratory alkalosis before metabolic acidosis?", "options": ["Ammonia causes renal bicarbonate retention, which raises pH before any ventilatory change occurs", "Urea-cycle defects begin with normal gases, and alkalosis follows only after dialysis", "Ketoacids drive early hyperventilation, and lactic acid accumulates only later", "Ammonia and glutamine stimulate central ventilatory drive, so hyperventilation appears first"], "answer": 3, "explanation": "Hyperammonemia acts on the respiratory centre; organic acidemias instead cause high-gap ketoacidosis. Closest distractor: Acid-base phenotype directs urgent metabolic testing. Why not the others: B. Urea-cycle defects begin with normal gases, and alkalosis follows only after dialysis — UCD is favored by respiratory alkalosis with marked hyperammonemia and little ketosis; this option does not match the stem’s paired acid-base/fuel pattern. Ammonia alone does not separate UCD from organic acidemia.", "pearl": "High ammonia + respiratory alkalosis → prioritize UCD until proven otherwise.", "srcAnswer": "D"}, {"num": 18, "level": "Conceptual", "question": "Why does a fatty-acid oxidation disorder cause hypoketotic hypoglycemia in fasting?", "options": ["Blocked beta-oxidation removes fat-derived energy and acetyl-CoA for ketogenesis, while free fatty acids accumulate", "Insulin excess blocks lipolysis, so free fatty acids and ketones are both low", "Excess ketone production causes a ketoacidosis that suppresses hepatic glucose output and raises lactate", "Intestinal glucose absorption is blocked, so ketones are never required"], "answer": 0, "explanation": "FFA are high but cannot be converted to ketones; in hyperinsulinism both are low. Closest distractor: Ketone suppression alone does not distinguish HI from FAOD.", "pearl": "FAOD: hypoglycemia with low ketones, often high FFA; HI suppresses both ketones and FFA.", "srcAnswer": "A"}, {"num": 19, "level": "", "question": "A cooled term neonate has repeated aEEG amplitude rises lasting 70–90 seconds. Simultaneous raw EEG shows rhythmic discharges evolving in frequency and distribution; impedance is stable. The best interpretation is:", "options": ["Electrographic seizure, supported by evolving discharges on the raw trace", "Normal trace alternant, which shows symmetric quiet-sleep bursts", "Electrode artefact, which would show abrupt non-evolving interference", "Burst suppression, which shows a discontinuous background without evolving discharges"], "answer": 0, "explanation": "Evolution in frequency and distribution on raw EEG is the decisive finding. Closest distractor: Raw EEG evolution and stable impedance distinguish ictal activity from artifact.", "pearl": "AEEG trend alone is insufficient; review raw EEG for evolution.", "srcAnswer": "A", "img": "img/image7_q19.png", "imgCaption": "Question-linked aEEG/raw EEG teaching visual — purpose-built, not patient data.", "retest": {"stage": "R1", "from": "Day 7 Q34 — aEEG/raw EEG seizure discriminator"}}, {"num": 20, "level": "Conceptual", "question": "Why does hyperkalemia first produce peaked T waves and later a wide QRS?", "options": ["Raised extracellular K⁺ hyperpolarises the membrane, slowing repolarisation and prolonging the QT interval", "Raised extracellular K⁺ depolarises the resting membrane, speeding repolarisation, then inactivates Na⁺ channels and slows conduction", "Raised extracellular K⁺ lowers the threshold potential, producing tall P waves with a narrow QRS only", "Raised extracellular K⁺ blocks calcium channels, producing a short PR and ST depression first"], "answer": 1, "explanation": "Progression: peaked T → flat P → wide QRS → sine wave → VF. Closest distractor: ECG change, not the number alone, decides urgency.", "pearl": "Progression: peaked T → flat P → wide QRS → sine wave → VF.", "srcAnswer": "B"}, {"num": 21, "level": "Conceptual", "question": "What is the main mechanism of non-oliguric hyperkalemia of prematurity?", "options": ["Excess potassium delivered in the first parenteral nutrition bag", "Oliguric renal failure after asphyxia, which spares urine volume in the first 72 hours", "Adrenal haemorrhage causing hypoaldosteronism with salt wasting and hyponatremia", "Potassium shifts out of cells because of immature Na⁺/K⁺-ATPase, despite good urine output"], "answer": 3, "explanation": "Seen in infants below about 30 weeks in the first 72 h; ECF contraction and acidosis contribute. Closest distractor: Haemolysed heel-prick samples cause spurious values; repeat from free-flowing blood.", "pearl": "Seen in infants below about 30 weeks in the first 72 h; ECF contraction and acidosis contribute.", "srcAnswer": "D"}, {"num": 22, "level": "Clinical/Application", "question": "A 38-week infant of a diabetic mother, 3 h old, is well and rooting. Pre-feed glucose is 2.2 mmol/L. Under the CPS transitional approach, the first step is:", "options": ["Start a glucagon infusion and arrange transfer to a tertiary centre", "Feed promptly with 40% dextrose gel 0.5 mL/kg buccally and recheck glucose in about 30 minutes", "Insert an IV line and give D10 2 mL/kg, then start a maintenance infusion immediately and transfer to the NICU", "Reassure, and recheck glucose at the next scheduled feed three hours later"], "answer": 1, "explanation": "Well infant, transitional period, value below 2.6 mmol/L: feed ± gel, recheck. Closest distractor: The same number has different urgency when symptoms are present.", "pearl": "CPS transitional at-risk: <2.6 mmol/L merits action; 1.8–2.5 often feed/gel then recheck.", "srcAnswer": "B"}, {"num": 23, "level": "Clinical/Application", "question": "A 2-day-old SGA infant is lethargic; meter glucose is 1.4 mmol/L. The safest next step is:", "options": ["Wait for the laboratory value to return, then decide whether treatment is needed", "Send a laboratory glucose if no delay, and give IV D10 2 mL/kg then a continuous infusion", "Give 40% gel and a feed, then repeat the meter reading in 30 minutes if the infant remains symptomatic", "Start oral hydrocortisone and review the glucose at the next scheduled feed"], "answer": 1, "explanation": "Symptomatic hypoglycemia is an emergency; gel is not adequate. Closest distractor: The sample is valuable but the brain cannot wait.", "pearl": "Symptomatic neonate: treat now; critical sampling only if it does not delay rescue.", "srcAnswer": "B"}, {"num": 24, "level": "Clinical/Application", "question": "A 3.2-kg term infant with symptomatic hypoglycemia needs a D10 bolus of 2 mL/kg. The volume to give is:", "options": ["0.64 mL", "3.2 mL", "6.4 mL", "12.8 mL"], "answer": 2, "explanation": "3.2 kg × 2 mL/kg = 6.4 mL of D10 (640 mg of glucose). Calculation: Formula: D10 rescue volume = 2 mL/kg × weight. Substitution: 2 × 3.2. Final answer: 6.4 mL D10. Common trap: Do not confuse 40% gel volume with IV D10 volume. Closest distractor: Do not confuse 40% gel volume with D10 IV volume. Why not the others: A. 0.64 mL — This numerical option conflicts with D10 rescue volume = 2 mL/kg × weight. Substitution 2 × 3.2 gives 6.4 mL D10; the likely trap is: Do not confuse 40% gel volume with IV D10 volume.; B. 3.2 mL — This numerical option conflicts with D10 rescue volume = 2 mL/kg × weight. Substitution 2 × 3.2 gives 6.4 mL D10; the likely trap is: Do not confuse 40% gel volume with IV D10 volume.; D. 12.8 mL — This numerical option conflicts with D10 rescue volume = 2 mL/kg × weight. Substitution 2 × 3.2 gives 6.4 mL D10; the likely trap is: Do not confuse 40% gel volume with IV D10 volume.", "pearl": "D10 bolus 2 mL/kg = 200 mg/kg glucose; check local protocol.", "srcAnswer": "C"}, {"num": 25, "level": "Clinical/Application", "question": "A 3.1-kg infant receives D12.5 at 7 mL/h. The GIR is:", "options": ["2.8 mg/kg/min", "4.7 mg/kg/min", "6.0 mg/kg/min", "8.4 mg/kg/min"], "answer": 1, "explanation": "GIR = D% × 10 × mL/h ÷ (kg × 60) = 12.5 × 10 × 7 ÷ (3.1 × 60) = 4.70 mg/kg/min. Calculation: Formula: GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution: 12.5 × 10 × 7 ÷ (3.1 × 60). Final answer: 4.70 mg/kg/min. Common trap: The ×10 converts dextrose % to mg/mL. Closest distractor: Divide by 60 minutes and by actual body weight. Why not the others: A. 2.8 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 7 ÷ (3.1 × 60) gives 4.70 mg/kg/min; the likely trap is: The ×10 converts dextrose % to mg/mL.; C. 6.0 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 7 ÷ (3.1 × 60) gives 4.70 mg/kg/min; the likely trap is: The ×10 converts dextrose % to mg/mL.; D. 8.4 mg/kg/min — This numerical option conflicts with GIR = D% × 10 × mL/h ÷ (kg × 60). Substitution 12.5 × 10 × 7 ÷ (3.1 × 60) gives 4.70 mg/kg/min; the likely trap is: The ×10 converts dextrose % to mg/mL.", "pearl": "GIR = (D% × mL/h × 10)/(kg × 60).", "srcAnswer": "B"}, {"num": 26, "level": "Clinical/Application", "question": "A well at-risk infant has glucose 1.9 mmol/L 30 minutes after gel and a feed, and now refuses to feed. The best next step is:", "options": ["Give cup supplementation and recheck at the next scheduled feed", "Give intramuscular glucagon and observe without IV access", "Repeat gel and wait another 30 minutes before any IV treatment is considered for this infant", "Obtain IV access, give D10 2 mL/kg, then start a continuous glucose infusion"], "answer": 3, "explanation": "Failure of enteral therapy or feed refusal moves the infant to IV treatment. Closest distractor: A correct diagnostic plan is unsafe if it delays neuroprotection.", "pearl": "Symptomatic hypoglycemia: treatment first; investigate persistent recurrence.", "srcAnswer": "D"}, {"num": 27, "level": "Clinical/Application", "question": "At 60 hours an infant is still hypoglycemic (38 mg/dL) on a GIR of 11 mg/kg/min. What should happen?", "options": ["Take a critical sample at the next low glucose and begin evaluation for hyperinsulinism", "Start empirical diazoxide before any samples to avoid delay", "Raise fluids to 200 mL/kg/day using the same D10 concentration and review again in 12 hours", "Treat as a physiologic transition and stop glucose to provoke ketone production"], "answer": 0, "explanation": "Persistent hypoglycemia past 48–72 h with high GIR needs diagnostic sampling. Closest distractor: Do not wait until day 7 if severe persistent disease is suspected.", "pearl": "High GIR >8 mg/kg/min is a hyperinsulinism clue; seek specialist evaluation.", "srcAnswer": "A"}, {"num": 28, "level": "Clinical/Application", "question": "A 4-day-old has glucose 42 mg/dL, BOHB 0.2 mmol/L, FFA 0.3 mmol/L and detectable insulin. The best interpretation is:", "options": ["Inappropriate insulin action, since ketones and FFA are suppressed at a low glucose", "Cortisol deficiency, because ketones and FFA would be expected to be high", "Normal fasting response, because insulin is detectable at low glucose", "Fatty-acid oxidation defect, because low ketones prove blocked beta-oxidation of fat stores"], "answer": 0, "explanation": "During hypoglycemia insulin should be suppressed and fuels high; here fuels are low, which indicates insulin action. Closest distractor: Compare HI (low FFA) with FAOD (often high FFA). Why not the others: D. Fatty-acid oxidation defect, because low ketones prove blocked beta-oxidation of fat stores — FAOD is generally hypoketotic with relatively high FFA; the suppressed FFA pattern here reflects excess insulin action.", "pearl": "Low glucose + suppressed BOHB and FFA is a hallmark of excess insulin action.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical/Application", "question": "A 5-day-old with fasting hypoglycemia has low BOHB, high FFA and high CK. A sibling died suddenly at 4 months. The priority is:", "options": ["Hypopituitarism: prescribe hydrocortisone and wait for the thyroid profile", "Transient hypoglycemia: observe on feeds with repeated meter readings", "Congenital hyperinsulinism: start diazoxide and lengthen the feeding intervals to reduce insulin load", "Fatty-acid oxidation disorder: avoid fasting, maintain glucose and send an acylcarnitine profile"], "answer": 3, "explanation": "Low ketones with high FFA, muscle/liver involvement and family history point to FAOD. Closest distractor: Hypoketosis is not synonymous with hyperinsulinism. Why not the others: C. Congenital hyperinsulinism: start diazoxide and lengthen the feeding intervals to reduce insulin load — Hyperinsulinism suppresses both ketones and free fatty acids; the stem retains lipolysis with elevated FFA, favoring FAOD.", "pearl": "FFA direction and muscle/liver clues are key HI-vs-FAOD discriminators.", "srcAnswer": "D"}, {"num": 30, "level": "Clinical/Application", "question": "A neonate with recurrent hypoglycemia has a midline cleft palate, micropenis and conjugated jaundice. The most important concern is:", "options": ["Congenital hypothyroidism alone, which fully explains every feature including the micropenis", "Galactosemia, which explains the micropenis and midline defect", "Congenital hypopituitarism: send critical sample with cortisol, TSH and fT4, consider MRI", "Transient hyperinsulinism of an infant of a diabetic mother"], "answer": 2, "explanation": "Midline defects, micropenis and cholestasis suggest combined pituitary hormone deficiency (cortisol, GH, TSH). Closest distractor: Cortisol/GH deficiencies can coexist; coordinate endocrine evaluation.", "pearl": "Midline anomaly + micropenis + hypoglycemia → assess pituitary axes.", "srcAnswer": "C"}, {"num": 31, "level": "Clinical/Application", "question": "A 27-week infant on day 2, urine output 3 mL/kg/h, has a non-haemolysed K⁺ of 7.4 mmol/L with peaked T waves. The first step is:", "options": ["A sodium bicarbonate bolus, since acidosis is the usual cause in preterms", "IV 10% calcium gluconate ~1 mL/kg over 5–10 minutes on ECG monitor, then shift potassium", "Rectal polystyrene resin and recheck the potassium after six hours, reserving shifts for later", "Furosemide 1 mg/kg and observation for a diuretic response first"], "answer": 1, "explanation": "Membrane stabilisation first, then insulin–dextrose or salbutamol to shift potassium, then removal. Closest distractor: Calcium does not lower K⁺; it protects the heart while K⁺ is shifted.", "pearl": "Membrane stabilisation first, then insulin–dextrose or salbutamol to shift potassium, then removal.", "srcAnswer": "B"}, {"num": 32, "level": "Clinical/Application", "question": "A ventilated preterm on furosemide has K⁺ 2.4 mmol/L with flat T waves and U waves. The best approach is:", "options": ["Give a rapid IV potassium bolus of 1 mmol/kg to correct it quickly", "Give calcium gluconate to stabilise the myocardium, then recheck the potassium level in 12 hours and review", "Controlled IV potassium replacement on a cardiac monitor, with magnesium check and diuretic review", "Wait for the next 24-hour electrolyte result before adding potassium"], "answer": 2, "explanation": "Hypokalemia is often accompanied by hypomagnesemia, which makes it refractory. Closest distractor: Differentiate SIADH from cerebral salt wasting by volume and sodium balance.", "pearl": "SIADH = water excess; urine is not appropriately dilute.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day10',label:'Day 10',set:'Quiz 2',href:'Day10/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}

const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day10_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 10 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 10 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 10'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 10');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day10:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
