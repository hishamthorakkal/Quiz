<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../../favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png?v=3"><meta name="theme-color" content="#1e3a8a"><meta name="color-scheme" content="only light">
<title>__TITLE__ — Exam</title><style>:root{color-scheme:only light}
:root{--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7;--purple:#6d28d9;--purplebg:#ede9fe;--orange:#c2410c;--orangebg:#ffedd5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.bar .name{font-weight:700}.bar .sec{color:#cbd5e1;font-size:14px}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;background:#1e293b;border-radius:10px;padding:6px 12px}.timer.low{background:#b91c1c}
.wrap{max-width:1100px;margin:auto;padding:18px 16px 48px}.layout{display:grid;grid-template-columns:1fr 290px;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:10px}.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.q{font-size:19px;font-weight:700;line-height:1.5;margin:6px 0 16px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:9px 0;cursor:pointer;background:#fff;line-height:1.45}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.sel{border-color:var(--blue);background:#eff6ff}.option input{margin-right:10px;transform:scale(1.15)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}.mark{background:var(--purplebg);color:var(--purple)}.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}.spacer{flex:1}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.pal button{padding:9px 0;font-size:13px;border:1.5px solid transparent}
.s-nv{background:#f1f5f9;color:#475569}.s-na{background:var(--orangebg);color:var(--orange)}.s-a{background:#dbeafe;color:#1e40af}.s-m{background:var(--purplebg);color:var(--purple)}.s-am{background:var(--purplebg);color:var(--purple);box-shadow:inset 0 -4px 0 #2563eb}
.pal button.cur{border-color:#0f172a}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.counts{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}.small{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}th:first-child,td:first-child{text-align:left}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filters button.on{background:#0f172a;color:#fff}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;line-height:1.5}.rv.correct{border-color:#86efac;background:#f0fdf4}.rv.wrong{border-color:#fca5a5;background:#fff7f7}.rv.un{border-color:#e2e8f0;background:#f8fafc}
.st{font-weight:800;font-size:13px}.st.correct{color:var(--green)}.st.wrong{color:var(--red)}.st.un{color:var(--muted)}
.explain{margin-top:8px;background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;border-radius:7px}.pearl{margin-top:8px;background:var(--amberbg);color:var(--amber);padding:10px;border-radius:8px}.note{margin-top:8px;background:#fff1f2;color:#9f1239;padding:10px;border-radius:8px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.overlay.show{display:flex}.dialog{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%}
.palbtn{display:none}.palscrim{display:none}.palhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.palclose{display:none;padding:6px 12px}.barr{display:flex;gap:8px;align-items:center}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.q{font-size:17px}.wrap{padding:12px 10px 24px}.bar{padding:8px 10px}.bar .name{font-size:14px}.timer{font-size:19px;padding:5px 10px}.palbtn{display:inline-flex;align-items:center;background:#1e293b;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px}.palcard{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:78vh;overflow:auto;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .2s;box-shadow:0 -12px 30px rgba(15,23,42,.25);padding-bottom:calc(20px + env(safe-area-inset-bottom))}body.pal-open .palcard{transform:none}body.pal-open .palscrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:14}.palclose{display:inline-block}.pal{grid-template-columns:repeat(6,1fr)}.pal button{padding:11px 0}.layout>.card:first-child{padding:14px}.layout>.card:first-child .actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 16px 16px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:1fr 1fr;gap:8px}.layout>.card:first-child .actions .spacer{display:none}.layout>.card:first-child .actions button{min-height:46px}.option{padding:12px}.option input{transform:scale(1.3)}table{font-size:13px}th,td{padding:7px 4px}}
</style></head>
<body>
<div class="bar"><div><div class="name">__TITLE__</div><div class="sec" id="secLabel"></div></div><div class="barr"><button class="palbtn" id="palBtn" onclick="document.body.classList.toggle('pal-open')">▦ Palette</button><div class="timer" id="timer">--:--</div></div></div><div class="palscrim" onclick="document.body.classList.remove('pal-open')"></div>
<div class="wrap" id="app"></div>
<div class="overlay" id="ov"><div class="dialog" id="dlg"></div></div>
<script src="../../assets/notify.js"></script><script src="../../assets/notebook.js"></script>
<script>
const EXAM=__EXAM__;
const Q=__Q__;
const KEY='gm:'+EXAM.id+':v2', SEC_MS=EXAM.sectionMinutes*60000, NS=EXAM.sections.length;
let S=null, cur=0, tick=null, reviewFilter='wrong';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const L=i=>String.fromCharCode(65+i);
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function secQs(s){return Q.filter(q=>q.section===s)}
function fmt(ms){ms=Math.max(0,ms);const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function dur(ms){const t=Math.round(ms/1000);return `${Math.floor(t/3600)?Math.floor(t/3600)+'h ':''}${Math.floor(t%3600/60)}m ${t%60}s`}
// Advance through any sections whose absolute deadline has passed (handles reloads after time ran out).
function catchUp(){
 let changed=false;
 while(!S.finished && Date.now()>=S.sectionEnd){
  lockSection(S.section,'timeout');changed=true;
  if(S.section>=NS-1){finish(S.sectionEnd);break}
  S.section++;S.sectionEnd+=SEC_MS;S.sectionStart[S.section]=S.sectionEnd-SEC_MS;
 }
 if(changed){cur=0;save()}
 return changed;
}
function lockSection(s,how){if(!S.locked.includes(s)){S.locked.push(s);S.lockedHow[s]=how;S.lockedAt[s]=Date.now()}}
function finish(at){S.finished=true;S.finishedAt=at||Date.now();save();nbRecord();notify()}
// Error notebook: record wrong answers once, when the exam ends (numbers = exam positions; ids = source numbers).
const NB_CTX={srcId:EXAM.id,label:EXAM.title.split(' — ')[0],set:'Full Test',href:'Mock/'+EXAM.id+'/index.html'};
function nbRecord(){if(S.nbRecorded||!window.Notebook)return;Notebook.record(NB_CTX,Q.filter(q=>S.answers[q.num]!=null).map(q=>({num:q.pos,srcNum:q.num,question:q.question,options:q.options,chosen:S.answers[q.num],answer:q.answer,explanation:q.explanation,pearl:q.pearl,correct:S.answers[q.num]===q.answer})));S.nbRecorded=true;save()}
function editable(q){return !S.finished&&q.section===S.section&&!S.locked.includes(q.section)}
function status(n){const a=S.answers[n]!=null,m=!!S.marked[n],v=!!S.visited[n];return a&&m?'am':m?'m':a?'a':v?'na':'nv'}
function start(){
 S=load();
 if(!S){location.replace('index.html');return}
 catchUp();
 if(S.finished){renderResult();return}
 cur=Math.min(S.cur&&S.cur.section===S.section?S.cur.i:0,secQs(S.section).length-1);
 renderExam();clearInterval(tick);tick=setInterval(onTick,500);onTick();
}
function onTick(){
 if(S.finished){clearInterval(tick);return}
 if(catchUp()){if(S.finished){clearInterval(tick);closeDlg();renderResult();return}closeDlg();renderExam();return}
 const rem=S.sectionEnd-Date.now(),t=document.getElementById('timer');t.textContent=fmt(rem);t.classList.toggle('low',rem<5*60000);
}
function renderExam(){
 const qs=secQs(S.section),q=qs[cur];S.visited[q.num]=true;S.cur={section:S.section,i:cur};save();
 document.getElementById('secLabel').textContent=`${EXAM.sections[S.section].name} · Question ${cur+1} of ${qs.length}`;{const a=qs.filter(x=>S.answers[x.num]!=null).length;document.getElementById('palBtn').textContent=`▦ ${a}/${qs.length}`;}
 const sel=S.answers[q.num];
 const cnt={a:0,na:0,nv:0,m:0,am:0};qs.forEach(x=>cnt[status(x.num)]++);
 document.getElementById('app').innerHTML=`<div class="layout"><div class="card">
  <div class="qhead"><span>Q${q.pos} · ${esc(EXAM.sections[S.section].name)}</span><span class="badge">${esc(q.topic)}</span></div>
  <div class="q">${esc(q.question)}</div>
  ${q.options.map((o,i)=>`<label class="option ${sel===i?'sel':''}"><input type="radio" name="opt" value="${i}" ${sel===i?'checked':''} onchange="pick(${i})"><b>${L(i)}.</b> ${esc(o)}</label>`).join('')}
  <div class="actions"><button class="secondary" onclick="go(${cur-1})" ${cur===0?'disabled':''}>← Previous</button><button class="secondary" onclick="clearResp()">Clear Response</button>
  <span class="spacer"></span><button class="mark" onclick="markNext()">Mark for Review &amp; Next</button><button class="primary" onclick="saveNext()">Save &amp; Next →</button></div>
 </div><div class="card palcard"><div class="palhead"><b>${esc(EXAM.sections[S.section].name)} — Question Palette</b><button class="secondary palclose" onclick="document.body.classList.remove('pal-open')">✕</button></div>
  <div class="pal">${qs.map((x,i)=>`<button class="s-${status(x.num)} ${i===cur?'cur':''}" onclick="go(${i})" title="Q${x.pos}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div>
  <div class="legend"><span><i class="s-a"></i>Answered (${cnt.a})</span><span><i class="s-na"></i>Not answered (${cnt.na})</span><span><i class="s-nv"></i>Not visited (${cnt.nv})</span><span><i class="s-m"></i>Marked (${cnt.m})</span><span><i class="s-am"></i>Answered &amp; marked (${cnt.am})</span></div>
  <div class="counts">Sections: ${EXAM.sections.map((s,i)=>`${esc(s.name)} ${S.locked.includes(i)?'🔒 locked':i===S.section?'▶ active':'⏳ upcoming'}`).join('<br>')}</div>
  <div class="actions"><button class="danger" style="width:100%" onclick="askSubmit()">Submit ${esc(EXAM.sections[S.section].name)}</button></div>
  <p class="small">Answers in this section can be changed until its time ends or you submit it. Locked sections cannot be reopened.</p>
 </div></div>`;
}
function guard(){if(catchUp()||S.finished){start();return false}return true}
function pick(i){if(!guard())return;const q=secQs(S.section)[cur];if(!editable(q))return;S.answers[q.num]=i;save();renderExam()}
function clearResp(){if(!guard())return;const q=secQs(S.section)[cur];if(!editable(q))return;delete S.answers[q.num];save();renderExam()}
function go(i){document.body.classList.remove('pal-open');if(!guard())return;const n=secQs(S.section).length;cur=Math.max(0,Math.min(n-1,i));renderExam()}
function markNext(){if(!guard())return;const q=secQs(S.section)[cur];S.marked[q.num]=true;save();go(cur+1)}
function saveNext(){if(!guard())return;const q=secQs(S.section)[cur];delete S.marked[q.num];save();go(cur+1)}
function closeDlg(){document.getElementById('ov').classList.remove('show')}
function askSubmit(){
 if(!guard())return;
 const qs=secQs(S.section),un=qs.filter(q=>S.answers[q.num]==null).length,mk=qs.filter(q=>S.marked[q.num]).length,last=S.section===NS-1;
 document.getElementById('dlg').innerHTML=`<h3 style="margin-top:0">Submit ${esc(EXAM.sections[S.section].name)}?</h3>
  <p>You still have <b>${fmt(S.sectionEnd-Date.now())}</b> remaining.<br>Unanswered: <b>${un}</b> · Marked for review: <b>${mk}</b></p>
  <p>Once submitted, answers in this section <b>cannot be changed</b>.${last?' This is the last section — the exam will end and be scored.':` ${esc(EXAM.sections[S.section+1].name)} starts immediately with a fresh ${EXAM.sectionMinutes}-minute timer.`}</p>
  <div class="actions"><button class="secondary" onclick="closeDlg()">Cancel</button><span class="spacer"></span><button class="danger" onclick="doSubmit()">Submit Section</button></div>`;
 document.getElementById('ov').classList.add('show');
}
function doSubmit(){
 closeDlg();if(!guard())return;
 lockSection(S.section,'submitted');
 if(S.section>=NS-1){finish();clearInterval(tick);renderResult();return}
 S.section++;S.sectionStart[S.section]=Date.now();S.sectionEnd=Date.now()+SEC_MS;cur=0;save();renderExam();onTick();
}
// ---------- results ----------
function score(qs){let c=0,w=0,u=0;qs.forEach(q=>{const a=S.answers[q.num];if(a==null)u++;else if(a===q.answer)c++;else w++});return{c,w,u,a:c+w,s:c*4-w,max:qs.length*4}}
function st(q){const a=S.answers[q.num];return a==null?'un':a===q.answer?'correct':'wrong'}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function pct(x){return x.max?Math.round(x.s/x.max*10000)/100:0}
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notify(){
 if(S.notified)return;S.notified=true;save();
 const o=score(Q),lines=[`Total questions: ${Q.length}`,`Attempted: ${o.a}`,`Unattempted: ${o.u}`,`Correct: ${o.c}`,`Wrong: ${o.w}`,`Score: ${o.s} / ${o.max}`,`Percentage: ${pct(o)}%`,`Time: ${dur(S.finishedAt-S.startedAt)}`];
 EXAM.sections.forEach((s,i)=>{const x=score(secQs(i));lines.push(`${s.name}: ${x.s}/${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`)});
 wrongLines(Q.filter(q=>st(q)==='wrong').map(q=>({num:q.pos,options:q.options,chosen:S.answers[q.num],answer:q.answer})),lines,EXAM.title.split(' — ')[0]);
 Notify.send(EXAM.title+' — Mock finished','trophy',lines.join('\n'));
}
function renderResult(){
 clearInterval(tick);document.getElementById('timer').textContent='Done';document.getElementById('timer').classList.remove('low');
 document.getElementById('secLabel').textContent='Exam completed — result & review';
 const o=score(Q);
 const secRows=EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<tr><td>${esc(s.name)} (Q${secQs(i)[0].pos}–${secQs(i).at(-1).pos})</td><td>${x.c}</td><td>${x.w}</td><td>${x.u}</td><td><b>${x.s}</b> / ${x.max}</td><td>${S.lockedHow[i]==='submitted'?'Submitted':'Time up'}</td></tr>`}).join('');
 const topics=[...new Set(Q.map(q=>q.topic))];
 const topRows=topics.map(t=>{const x=score(Q.filter(q=>q.topic===t));return `<tr><td>${esc(t)}</td><td>${x.c}</td><td>${x.w}</td><td>${x.u}</td><td>${x.s} / ${x.max}</td><td>${x.a?Math.round(x.c/x.a*100):0}%</td></tr>`}).join('');
 document.getElementById('app').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(EXAM.title)} — Result</h2>
  <div class="stats"><div class="stat"><strong>${o.s}</strong>Score / ${o.max}</div><div class="stat"><strong>${pct(o)}%</strong>Percentage</div><div class="stat"><strong>${o.c}</strong>Correct</div><div class="stat"><strong>${o.w}</strong>Wrong</div>
  <div class="stat"><strong>${o.a}</strong>Attempted</div><div class="stat"><strong>${o.u}</strong>Unattempted</div><div class="stat"><strong>${Q.length}</strong>Total questions</div><div class="stat"><strong>${dur(S.finishedAt-S.startedAt)}</strong>Total time</div></div>
  <h3>Section-wise performance</h3><table><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Score</th><th>Ended by</th></tr>${secRows}<tr><td><b>Overall</b></td><td>${o.c}</td><td>${o.w}</td><td>${o.u}</td><td><b>${o.s}</b> / ${o.max}</td><td></td></tr></table>
  <h3>Topic-wise performance</h3><table><tr><th>Topic</th><th>Correct</th><th>Wrong</th><th>Unatt.</th><th>Score</th><th>Accuracy</th></tr>${topRows}</table>
  <div class="actions"><button class="secondary" onclick="downloadWord()">Download Wrong Answers</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button><span class="spacer"></span><a class="btn secondary" href="index.html">Mock home</a></div>
 </div>
 <div id="nbBox"></div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Answer review</h3>
  <div class="filters">${[['all','All'],['wrong','Wrong'],['correct','Correct'],['un','Unattempted'],['marked','Marked for Review']].map(([k,l])=>`<button class="secondary ${reviewFilter===k?'on':''}" onclick="setFilter('${k}')">${l} (${filt(k).length})</button>`).join('')}</div>
  <div id="rvList">${filt(reviewFilter).map(rvItem).join('')||'<p class="small">No questions in this filter.</p>'}</div></div>`;
 if(window.Notebook){nbRecord();Notebook.panel(document.getElementById('nbBox'),Q.filter(q=>st(q)==='wrong').map(q=>NB_CTX.srcId+':'+q.num),`${NB_CTX.label} — Error notes`);}
}
function filt(k){return Q.filter(q=>k==='all'||(k==='marked'?!!S.marked[q.num]:st(q)===k))}
function setFilter(k){reviewFilter=k;renderResult()}
function rvItem(q){
 const a=S.answers[q.num],s=st(q);
 return `<div class="rv ${s}"><div class="small">${esc(q.topic)} · ${esc(EXAM.sections[q.section].name)}${S.marked[q.num]?' · marked for review':''}</div>
 <b>Q${q.pos}. ${esc(q.question)}</b>${q.pos!==q.num?` <small style="color:var(--muted);font-weight:500">(source Q${q.num})</small>`:''}<br><span class="st ${s}">${s==='correct'?'✓ Correct (+4)':s==='wrong'?'✗ Wrong (−1)':'— Unattempted (0)'}</span><br>
 <b>Your response:</b> ${a==null?'Not answered':`${L(a)}. ${esc(q.options[a])}`}<br><b>Correct response:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}
 ${q.note?`<div class="note"><b>Note:</b> ${esc(q.note)}</div>`:''}
 <div class="explain"><b>Explanation${q.explanationSource==='added'?' <small>(added — not from source)</small>':''}:</b> ${esc(q.explanation)}</div>
 ${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}</div>`;
}
function reportBody(){
 const o=score(Q),wrong=Q.filter(q=>st(q)==='wrong'),un=Q.filter(q=>st(q)==='un');
 let h=`<h1>${esc(EXAM.title)} — Wrong Answer Report</h1><p><b>Overall score:</b> ${o.s} / ${o.max} (${pct(o)}%) · Correct ${o.c} · Wrong ${o.w} · Unattempted ${o.u} · Time ${dur(S.finishedAt-S.startedAt)}</p><p>`+
  EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<b>${esc(s.name)}:</b> ${x.s} / ${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`}).join('<br>')+'</p><h2>Wrong answers</h2>';
 if(!wrong.length)h+='<p>No wrong answers.</p>';
 wrong.forEach((q,i)=>{h+=`<hr><h3>${i+1}. Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}. ${esc(q.question)}</h3><p><b>Your answer:</b> ${L(S.answers[q.num])}. ${esc(q.options[S.answers[q.num]])}</p><p><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>${q.note?`<p><b>Note:</b> ${esc(q.note)}</p>`:''}<p><b>Explanation${q.explanationSource==='added'?' (added — not from source)':''}:</b> ${esc(q.explanation)}</p>${q.pearl?`<p><b>Exam pearl:</b> ${esc(q.pearl)}</p>`:''}`});
 if(un.length){h+='<h2>Unattempted questions</h2>';un.forEach(q=>{h+=`<p><b>Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}.</b> ${esc(q.question)}<br><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>`})}
 return h;
}
function baseName(){return `${EXAM.id}_${stamp()}_Wrong_Answers`}
function downloadWord(){const b=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=baseName()+'.doc';a.click();URL.revokeObjectURL(u)}
function printPDF(){const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${baseName()}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}
window.addEventListener('storage',e=>{if(e.key===KEY)start()});
start();
</script></body></html>
