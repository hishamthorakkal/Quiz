igh-difficulty"}, {"num": 63, "pos": 63, "section": 1, "topic": "Neonatology", "question": "A 4-day-old newborn has marked unconjugated jaundice with modest anemia, negative DAT and family history of jaundice after fava-bean exposure. A normal G6PD activity measured during brisk reticulocytosis is reported. What is a key caution?", "options": ["Interpret it as evidence of direct hyperbilirubinemia", "Give oxidant medication to confirm diagnosis", "Exclude G6PD deficiency permanently", "Retest later if suspicion remains because reticulocytosis can mask deficiency"], "answer": 3, "explanation": "Reticulocytes have higher enzyme activity and can produce a falsely reassuring result during/after hemolysis. Why not the others (added — not from source): A. Interpret it as evidence of direct hyperbilirubinemia — G6PD deficiency causes unconjugated hyperbilirubinaemia, and a normal enzyme level says nothing about conjugated bilirubin.; B. Give oxidant medication to confirm diagnosis — Deliberate oxidant exposure would provoke dangerous haemolysis and is never used as a diagnostic test.; C. Exclude G6PD deficiency permanently — Young red cells and reticulocytes have higher G6PD activity, so a normal result during haemolysis can be falsely reassuring and cannot exclude deficiency.", "pearl": "Reticulocytes have higher enzyme activity and can produce a falsely reassuring result during/after hemolysis.", "note": "From Day 6 · Clinical/Application"}, {"num": 64, "pos": 64, "section": 1, "topic": "Neurology", "question": "A child with prolonged convulsive status has already received two appropriately dosed benzodiazepines and an adequate second-line antiseizure load; convulsions persist. Which monitoring is particularly important when continuous anesthetic therapy is used?", "options": ["Single serum calcium without EEG", "Daily fundoscopy alone", "Home pulse oximetry after discharge", "Continuous EEG with cardiorespiratory monitoring"], "answer": 3, "explanation": "Continuous EEG guides suppression of electrographic seizures and identifies nonconvulsive recurrence during sedation. Why not the others (added — not from source): A. Single serum calcium without EEG — Calcium should be checked, but a single value without EEG cannot detect ongoing electrographic seizures under anaesthetic agents.; B. Daily fundoscopy alone — Fundoscopy has no role in titrating anaesthetic infusions or detecting nonconvulsive seizures during refractory status.; C. Home pulse oximetry after discharge — Home oximetry is irrelevant to inpatient refractory status, where continuous EEG and haemodynamic monitoring are required.", "pearl": "Continuous EEG guides suppression of electrographic seizures and identifies nonconvulsive recurrence during sedation.", "note": "From Day 23 · Basic-but-easily-confused"}, {"num": 65, "pos": 65, "section": 1, "topic": "Growth/Genetics", "question": "A 12-year-old boy has height at the 2nd centile, delayed bone age, normal growth velocity and family history of late puberty. What observation would most strongly challenge this benign diagnosis?", "options": ["Normal prepubertal velocity", "Delayed bone age", "Progressive downward crossing of height centiles", "Family history of late puberty"], "answer": 2, "explanation": "Growth deceleration or centile crossing demands evaluation for pathology despite apparent constitutional delay. Why not the others (added — not from source): A. Normal prepubertal velocity — Normal prepubertal growth velocity is expected in constitutional delay and supports rather than challenges the benign diagnosis.; B. Delayed bone age — Delayed bone age is typical of constitutional delay of growth and puberty and indicates remaining growth potential.; D. Family history of late puberty — A family history of late puberty is a characteristic supporting feature of constitutional delay.", "pearl": "Growth deceleration or centile crossing demands evaluation for pathology despite apparent constitutional delay.", "note": "From Day 13 · Clinical/Application"}, {"num": 66, "pos": 66, "section": 1, "topic": "Neurology", "question": "A child remains unresponsive after visible convulsions stop; there are subtle eyelid movements and fluctuating tachycardia. Which management error is most important to avoid?", "options": ["Reviewing medication doses", "Assessing glucose and electrolytes", "Assuming motor cessation always means seizure termination", "Securing airway as needed"], "answer": 2, "explanation": "Electrographic seizures can continue after motor manifestations cease. Why not the others (added — not from source): A. Reviewing medication doses — Reviewing medication doses is appropriate good practice, not an error to avoid.; B. Assessing glucose and electrolytes — Checking glucose and electrolytes is part of standard status epilepticus evaluation and should be done.; D. Securing airway as needed — Airway protection is a correct priority in a child with impaired consciousness after seizures.", "pearl": "Electrographic seizures can continue after motor manifestations cease.", "note": "From Day 23 · Conceptual"}, {"num": 67, "pos": 67, "section": 1, "topic": "Cardiology", "question": "A child has suspected pulmonary arterial hypertension on echocardiography with elevated RV pressure and septal flattening. Which echo feature can suggest significant right ventricular pressure loading?", "options": ["Interventricular septal flattening and RV enlargement", "Isolated left atrial enlargement with normal RV", "Normal septal contour with normal RV", "Aortic arch sidedness alone"], "answer": 0, "explanation": "Septal flattening and RV enlargement are signs of pressure overload. Why not the others (added — not from source): B. Isolated left atrial enlargement with normal RV — Isolated left atrial enlargement suggests left-sided volume or pressure load, and a normal RV argues against significant pulmonary hypertension.; C. Normal septal contour with normal RV — A normal septal contour and RV size do not suggest RV pressure overload.; D. Aortic arch sidedness alone — Aortic arch sidedness is an anatomical detail unrelated to RV pressure loading.", "pearl": "Septal flattening and RV enlargement are signs of pressure overload.", "note": "From Day 20 · Integrated/Rank-differentiating"}, {"num": 68, "pos": 68, "section": 1, "topic": "Cardiology", "question": "A child with a large secundum ASD undergoes transcatheter closure and returns with chest pain, tachycardia and a new pericardial effusion. Which immediate test is most useful for the suspected complication?", "options": ["Exercise treadmill test", "Urgent echocardiography and hemodynamic assessment", "Routine outpatient chest radiograph in a month", "Pulmonary function testing"], "answer": 1, "explanation": "Urgent echocardiography evaluates pericardial fluid and device position in suspected erosion. Why not the others (added — not from source): A. Exercise treadmill test — Exercise testing is unsafe and irrelevant when acute device erosion or tamponade is suspected.; C. Routine outpatient chest radiograph in a month — Delaying imaging for a month risks death from tamponade; suspected erosion needs urgent assessment.; D. Pulmonary function testing — Pulmonary function testing does not evaluate pericardial effusion, device position or haemodynamic compromise.", "pearl": "Urgent echocardiography evaluates pericardial fluid and device position in suspected erosion.", "note": "From Day 21 · Conceptual"}, {"num": 69, "pos": 69, "section": 1, "topic": "Cardiology", "question": "A neonate has severe cyanosis, pulmonary edema and echocardiographic obstructed infracardiac total anomalous pulmonary venous connection. Why might routine PGE1 be unhelpful or potentially worsen this physiology?", "options": ["Increased pulmonary flow may aggravate edema without relieving venous obstruction", "It reliably creates a normal pulmonary venous pathway", "It directly removes the venous obstruction", "It permanently closes the pulmonary arteries"], "answer": 0, "explanation": "The decisive problem is blocked pulmonary venous return, not insufficient ductal patency. Why not the others (added — not from source): B. It reliably creates a normal pulmonary venous pathway — Prostaglandin only maintains ductal patency and cannot create or open an obstructed pulmonary venous pathway.; C. It directly removes the venous obstruction — The obstruction is anatomical in the descending vertical vein and requires urgent surgical repair, not ductal dilation.; D. It permanently closes the pulmonary arteries — PGE1 dilates the ductus arteriosus and does not close the pulmonary arteries.", "pearl": "The decisive problem is blocked pulmonary venous return, not insufficient ductal patency.", "note": "From Day 19 · Integrated/Rank-differentiating"}, {"num": 70, "pos": 70, "section": 1, "topic": "Neonatology", "question": "At 36 weeks postmenstrual age, a preterm infant with established BPD requires nasal cannula oxygen at 3 L/min but no invasive ventilation. Which support at 36 weeks PMA would define Jensen Grade 3?", "options": ["Oxygen by nasal cannula 1.5 L/min", "Room air with intermittent desaturation", "Invasive mechanical ventilation", "Low-flow nasal cannula 0.5 L/min"], "answer": 2, "explanation": "Grade 3 is defined by invasive mechanical ventilation at 36 weeks PMA. Why not the others (added — not from source): A. Oxygen by nasal cannula 1.5 L/min — Nasal cannula at 2 L/min or less corresponds to Jensen Grade 1; only invasive mechanical ventilation at 36 weeks PMA defines Grade 3.; B. Room air with intermittent desaturation — Breathing room air at 36 weeks PMA does not meet the Jensen definition of BPD at all.; D. Low-flow nasal cannula 0.5 L/min — Low-flow nasal cannula at 2 L/min or less defines Jensen Grade 1, not Grade 3.", "pearl": "Grade 3 is defined by invasive mechanical ventilation at 36 weeks PMA.", "note": "From Day 3 · High-difficulty"}, {"num": 71, "pos": 71, "section": 1, "topic": "Neonatology", "question": "A spontaneously breathing 27-week infant has clinical RDS; the unit can deliver poractant alfa by thin catheter. Which initial poractant alfa dose is favored by 2025 European consensus?", "options": ["100 mg/kg", "300 mg/kg", "200 mg/kg", "50 mg/kg"], "answer": 2, "explanation": "The consensus favors an initial poractant alfa dose of 200 mg/kg rather than 100 mg/kg. Why not the others (added — not from source): A. 100 mg/kg — Poractant 100 mg/kg is acceptable for repeat doses, but European consensus favours 200 mg/kg for the first rescue dose because outcomes are better.; B. 300 mg/kg — A 300 mg/kg initial dose is not a recommended standard and exceeds the evidence-supported first dose.; D. 50 mg/kg — Poractant 50 mg/kg is a subtherapeutic initial dose for established RDS.", "pearl": "The consensus favors an initial poractant alfa dose of 200 mg/kg rather than 100 mg/kg.", "note": "From Day 2 · Clinical/Application"}, {"num": 72, "pos": 72, "section": 1, "topic": "Cardiology", "question": "A newborn has critical valvar aortic stenosis with poor systemic perfusion and left ventricular dysfunction. What is an important definitive catheter option when anatomy is suitable?", "options": ["Transcatheter VSD closure", "Balloon aortic valvuloplasty", "Pulmonary artery banding", "Balloon mitral valvotomy"], "answer": 1, "explanation": "Balloon valvuloplasty can relieve suitable critical valvar aortic stenosis. Why not the others (added — not from source): A. Transcatheter VSD closure — Transcatheter VSD closure does not address left ventricular outflow obstruction from a stenotic aortic valve.; C. Pulmonary artery banding — Pulmonary artery banding limits pulmonary blood flow in shunt lesions and would not relieve aortic valve obstruction.; D. Balloon mitral valvotomy — Balloon mitral valvotomy treats mitral stenosis, not the aortic valve lesion causing LV failure here.", "pearl": "Balloon valvuloplasty can relieve suitable critical valvar aortic stenosis.", "note": "From Day 19 · Clinical/Application"}, {"num": 73, "pos": 73, "section": 1, "topic": "Neonatology", "question": "A term newborn is apneic after drying and positioning; auscultated heart rate is 74/min. After 30 seconds of mask ventilation the heart rate is unchanged and no chest rise is seen. What is the priority?", "options": ["Increase oxygen without correcting ventilation", "Administer volume expansion", "Recheck airway and mask seal using ventilation corrective steps", "Begin compressions despite absent chest rise"], "answer": 2, "explanation": "Ventilation must move the chest before persistent bradycardia can be interpreted as failure of adequate PPV. Why not the others (added — not from source): A. Increase oxygen without correcting ventilation — Increasing oxygen does not help if no air reaches the lungs; ventilation must first be made effective.; B. Administer volume expansion — Volume expansion is reserved for suspected hypovolaemia after effective ventilation and compressions fail, not for ineffective PPV.; D. Begin compressions despite absent chest rise — Compressions are started only after at least 30 seconds of effective, chest-moving ventilation; without chest rise the priority is MR SOPA.", "pearl": "Ventilation must move the chest before persistent bradycardia can be interpreted as failure of adequate PPV.", "note": "From Day 1 · Clinical/Application"}, {"num": 74, "pos": 74, "section": 1, "topic": "Neonatology", "question": "A 2-day-old preterm infant develops temperature instability, lethargy, delayed capillary refill and recurrent apnea. What is the safest management principle while cultures are pending?", "options": ["Prescribe a fixed prolonged broad-spectrum course regardless of results", "Wait for CRP to become positive", "Begin appropriate empiric therapy promptly and reassess against cultures and course", "Use antibiotics only if temperature exceeds 39 C"], "answer": 2, "explanation": "Clinical instability mandates prompt treatment and later stewardship-based reassessment. Why not the others (added — not from source): A. Prescribe a fixed prolonged broad-spectrum course regardless of results — Fixed prolonged courses irrespective of cultures promote resistance and harms such as NEC; antibiotics should be reviewed at about 36-48 hours.; B. Wait for CRP to become positive — CRP rises late and has poor early sensitivity, so waiting for it delays treatment in a clinically unstable neonate.; D. Use antibiotics only if temperature exceeds 39 C — Neonatal sepsis often presents with hypothermia or temperature instability rather than high fever, so a fever threshold would miss most cases.", "pearl": "Clinical instability mandates prompt treatment and later stewardship-based reassessment.", "note": "From Day 5 · Basic-but-easily-confused"}, {"num": 75, "pos": 75, "section": 1, "topic": "Growth/Genetics", "question": "A newborn with hypotonia, upslanting palpebral fissures and a complete atrioventricular septal defect has suspected aneuploidy. Which chromosomal disorder is most likely?", "options": ["Trisomy 21", "Trisomy 13", "Monosomy X", "47,XXY"], "answer": 0, "explanation": "Complete AVSD and the characteristic phenotype strongly suggest Down syndrome. Why not the others (added — not from source): B. Trisomy 13 — Trisomy 13 typically shows holoprosencephaly, cleft lip/palate, polydactyly and microphthalmia rather than the classic AVSD-hypotonia-upslanting phenotype.; C. Monosomy X — Monosomy X is associated with lymphoedema, coarctation and bicuspid aortic valve rather than complete AVSD.; D. 47,XXY — 47,XXY is usually phenotypically subtle in infancy and not associated with complete AVSD.", "pearl": "Complete AVSD and the characteristic phenotype strongly suggest Down syndrome.", "note": "From Day 15 · Clinical/Application"}, {"num": 76, "pos": 76, "section": 1, "topic": "Cardiology", "question": "A 4-month-old with large VSD has pulmonary edema, hepatomegaly and feeding difficulty but adequate systemic perfusion. What indicates that medical therapy alone is not an adequate long-term solution?", "options": ["Persistent growth failure and hemodynamically important shunt", "Spontaneous VSD closure", "Softening of an innocent murmur", "Normal growth with tiny restrictive VSD"], "answer": 0, "explanation": "Persistent heart failure/growth failure with a significant defect prompts timely repair assessment. Why not the others (added — not from source): B. Spontaneous VSD closure — Spontaneous VSD closure would remove the need for intervention rather than indicate failure of medical therapy.; C. Softening of an innocent murmur — Softening of an innocent murmur has no bearing on a large haemodynamically significant VSD.; D. Normal growth with tiny restrictive VSD — Normal growth with a tiny restrictive VSD indicates a benign course managed by observation, not surgery.", "pearl": "Persistent heart failure/growth failure with a significant defect prompts timely repair assessment.", "note": "From Day 20 · Clinical/Application"}, {"num": 77, "pos": 77, "section": 1, "topic": "Cardiology", "question": "A premature infant has a large PDA and pulmonary overcirculation; the murmur is continuous with bounding pulses. Which mechanism produces wide pulse pressure?", "options": ["Pulmonary venous stenosis", "Diastolic runoff from aorta into pulmonary artery", "Pure right-to-left atrial shunt", "Aortic valve closure failure due to rheumatic disease"], "answer": 1, "explanation": "Aortic diastolic runoff through PDA lowers diastolic pressure and widens pulse pressure. Why not the others (added — not from source): A. Pulmonary venous stenosis — Pulmonary venous stenosis causes pulmonary venous hypertension and oedema, not systemic diastolic runoff with bounding pulses.; C. Pure right-to-left atrial shunt — A right-to-left atrial shunt causes cyanosis and does not lower aortic diastolic pressure.; D. Aortic valve closure failure due to rheumatic disease — Rheumatic aortic regurgitation can widen pulse pressure but is not relevant to a premature infant with a large PDA.", "pearl": "Aortic diastolic runoff through PDA lowers diastolic pressure and widens pulse pressure.", "note": "From Day 17 · High-difficulty"}, {"num": 78, "pos": 78, "section": 1, "topic": "Neurology", "question": "A 9-year-old has nocturnal focal facial twitching, speech arrest, drooling and centrotemporal spikes on EEG with normal development. Which feature would instead raise concern for an atypical developmental epileptic encephalopathy?", "options": ["Spontaneous remission by adolescence", "Language regression with sleep-activated near-continuous spike-wave", "Normal cognition and infrequent sleep-related seizures", "Typical centrotemporal spikes with preserved school function"], "answer": 1, "explanation": "Regression with prominent sleep-potentiated discharges warrants evaluation beyond a self-limited syndrome. Why not the others (added — not from source): A. Spontaneous remission by adolescence — Spontaneous remission by adolescence is the expected benign course of self-limited epilepsy with centrotemporal spikes.; C. Normal cognition and infrequent sleep-related seizures — Normal cognition with infrequent nocturnal seizures is typical of the benign syndrome.; D. Typical centrotemporal spikes with preserved school function — Typical centrotemporal spikes with preserved schooling support the self-limited diagnosis rather than an encephalopathy.", "pearl": "Regression with prominent sleep-potentiated discharges warrants evaluation beyond a self-limited syndrome.", "note": "From Day 22 · Clinical/Application"}, {"num": 79, "pos": 79, "section": 1, "topic": "Neonatology", "question": "A 29-week infant is advancing feeds and mother's milk supply is insufficient; donor human milk is available. Which alternative is preferred to reduce NEC risk in many NICU protocols?", "options": ["Pasteurized donor human milk", "Unmodified cow milk", "Diluted adult enteral formula", "Routine hyperosmolar fruit juice"], "answer": 0, "explanation": "Donor human milk is favored over formula when maternal milk is unavailable for vulnerable preterm infants. Why not the others (added — not from source): B. Unmodified cow milk — Unmodified cow milk is unsuitable for preterm infants, with inappropriate protein and electrolytes and higher NEC risk.; C. Diluted adult enteral formula — Adult enteral formulas are not designed for preterm nutritional needs and may be hyperosmolar.; D. Routine hyperosmolar fruit juice — Hyperosmolar juices can injure immature bowel and provide no adequate nutrition for preterm infants.", "pearl": "Donor human milk is favored over formula when maternal milk is unavailable for vulnerable preterm infants.", "note": "From Day 8 · High-difficulty"}, {"num": 80, "pos": 80, "section": 1, "topic": "Neonatology", "question": "A vigorous 39-week newborn is delivered through thick meconium-stained amniotic fluid, cries immediately and has normal tone. What is the most appropriate airway approach?", "options": ["Routine tracheal suction", "Normal initial newborn care with observation", "Routine direct laryngoscopy", "Elective intubation before skin-to-skin"], "answer": 1, "explanation": "Vigorous infants with meconium-stained fluid do not need routine tracheal suctioning. Why not the others (added — not from source): A. Routine tracheal suction — Routine tracheal suction in vigorous meconium-exposed newborns does not reduce meconium aspiration syndrome and can cause harm.; C. Routine direct laryngoscopy — Direct laryngoscopy is unnecessary in a vigorous baby and risks bradycardia and trauma.; D. Elective intubation before skin-to-skin — Elective intubation is not indicated for a vigorous infant and delays skin-to-skin contact.", "pearl": "Vigorous infants with meconium-stained fluid do not need routine tracheal suctioning.", "note": "From Day 1 · Conceptual"}, {"num": 81, "pos": 81, "section": 1, "topic": "Neonatology", "question": "A ventilated 28-week infant has pH 7.20, PaCO2 68 mmHg, bicarbonate 25 mmol/L and acceptable PaO2. What is the dominant acid-base disorder?", "options": ["Chronic metabolic alkalosis", "Respiratory alkalosis", "Primary metabolic acidosis", "Acute respiratory acidosis"], "answer": 3, "explanation": "Acidemia with high CO2 and near-normal bicarbonate indicates primary respiratory acidosis. Why not the others (added — not from source): A. Chronic metabolic alkalosis — Metabolic alkalosis would cause alkalaemia with high bicarbonate, whereas this gas shows acidaemia with normal bicarbonate.; B. Respiratory alkalosis — Respiratory alkalosis requires low PaCO2 and high pH, the opposite of these values.; C. Primary metabolic acidosis — Primary metabolic acidosis needs low bicarbonate; here bicarbonate is normal and the raised PaCO2 explains the acidaemia.", "pearl": "Acidemia with high CO2 and near-normal bicarbonate indicates primary respiratory acidosis.", "note": "From Day 3 · Conceptual"}, {"num": 82, "pos": 82, "section": 1, "topic": "Neonatology", "question": "A 12-day-old neonate has fever, seizures and bulging fontanelle; blood culture is collected and IV antimicrobials are being arranged. Which additional diagnostic study is important once the infant is stable enough?", "options": ["Serial bilirubin as the only test", "Isolated urine dipstick without culture", "CSF cell count, glucose, protein and culture", "Chest radiograph in place of CSF assessment"], "answer": 2, "explanation": "Suspected neonatal meningitis requires CSF evaluation when clinically safe, without delaying urgent therapy. Why not the others (added — not from source): A. Serial bilirubin as the only test — Bilirubin measurement does not establish or exclude meningitis, nor guide antibiotic choice or duration.; B. Isolated urine dipstick without culture — A urine dipstick without culture is inadequate for diagnosing neonatal infection and cannot replace CSF analysis.; D. Chest radiograph in place of CSF assessment — A chest radiograph cannot diagnose meningitis; CSF analysis determines the diagnosis, organism and treatment duration.", "pearl": "Suspected neonatal meningitis requires CSF evaluation when clinically safe, without delaying urgent therapy.", "note": "From Day 5 · Clinical/Application"}, {"num": 83, "pos": 83, "section": 1, "topic": "Neonatology", "question": "A jaundiced 38-week newborn has bilirubin approaching the exchange-transfusion threshold despite intensive phototherapy. Which neurological feature is concerning for acute bilirubin encephalopathy?", "options": ["Benign sleep myoclonus with normal EEG", "Retrocollis/opisthotonus with abnormal tone", "Normal Moro reflex", "Isolated physiological acrocyanosis"], "answer": 1, "explanation": "Abnormal tone, retrocollis and opisthotonus are red flags for bilirubin neurotoxicity. Why not the others (added — not from source): A. Benign sleep myoclonus with normal EEG — Benign sleep myoclonus occurs only during sleep with normal EEG and is not a sign of bilirubin neurotoxicity.; C. Normal Moro reflex — A normal Moro reflex indicates intact neurological function rather than acute bilirubin encephalopathy.; D. Isolated physiological acrocyanosis — Acrocyanosis is a benign peripheral circulatory finding unrelated to bilirubin encephalopathy.", "pearl": "Abnormal tone, retrocollis and opisthotonus are red flags for bilirubin neurotoxicity.", "note": "From Day 6 · Clinical/Application"}, {"num": 84, "pos": 84, "section": 1, "topic": "Cardiology", "question": "A 5-day-old newborn becomes shocked as the ductus constricts; femoral pulses are weak and upper limb blood pressure exceeds lower limb pressure. Most likely critical lesion?", "options": ["Large uncomplicated ASD", "Coarctation of the aorta", "Mild valvar pulmonary stenosis", "Small restrictive VSD"], "answer": 1, "explanation": "Duct-dependent systemic flow and upper-lower pulse/BP discrepancy suggest critical coarctation. Why not the others (added — not from source): A. Large uncomplicated ASD — An uncomplicated ASD causes no duct-dependent circulation and does not produce femoral pulse or upper-lower BP discrepancy.; C. Mild valvar pulmonary stenosis — Mild pulmonary stenosis is usually asymptomatic and does not cause systemic shock on duct closure.; D. Small restrictive VSD — A small restrictive VSD causes a loud murmur but no shock or differential limb pressures.", "pearl": "Duct-dependent systemic flow and upper-lower pulse/BP discrepancy suggest critical coarctation.", "note": "From Day 19 · Basic-but-easily-confused"}, {"num": 85, "pos": 85, "section": 1, "topic": "Neurology", "question": "A former 27-week infant develops increased lower-limb tone, scissoring and delayed walking; MRI shows periventricular white-matter injury. Which clinical finding helps distinguish spastic CP from peripheral neuropathy?", "options": ["Hyperreflexia and velocity-dependent increased tone", "Fasciculations with hypotonia", "Progressive loss of previously acquired strength", "Absent reflexes and distal wasting"], "answer": 0, "explanation": "Upper motor neuron signs are characteristic of spastic CP; peripheral neuropathy gives lower motor neuron signs. Why not the others (added — not from source): B. Fasciculations with hypotonia — Fasciculations with hypotonia indicate lower motor neuron disease, such as SMA, rather than spastic CP.; C. Progressive loss of previously acquired strength — Progressive loss of acquired strength suggests a progressive neuromuscular or neurodegenerative disease, whereas CP is non-progressive.; D. Absent reflexes and distal wasting — Absent reflexes and distal wasting are lower motor neuron signs typical of peripheral neuropathy.", "pearl": "Upper motor neuron signs are characteristic of spastic CP; peripheral neuropathy gives lower motor neuron signs.", "note": "From Day 24 · High-difficulty"}, {"num": 86, "pos": 86, "section": 1, "topic": "Neonatology", "question": "A cooled infant has repeated subtle automatisms and autonomic events; bedside aEEG shows a rising saw-tooth band. What is a key treatment principle for neonatal seizures?", "options": ["Ignore EEG-only seizures because movements are absent", "Use anticonvulsants only after the cooling course ends", "Treat confirmed electrographic seizures while evaluating the cause", "Treat every artifact as seizure"], "answer": 2, "explanation": "Electrographic-only seizures may occur in encephalopathic neonates and warrant specialist-directed treatment. Why not the others (added — not from source): A. Ignore EEG-only seizures because movements are absent — Electrographic-only seizures are common in encephalopathic neonates and contribute to brain injury, so they should not be ignored.; B. Use anticonvulsants only after the cooling course ends — Seizures during cooling should be treated promptly; delaying treatment until rewarming risks further neuronal injury.; D. Treat every artifact as seizure — Movement or electrode artefacts must be distinguished from true seizures to avoid unnecessary antiseizure exposure.", "pearl": "Electrographic-only seizures may occur in encephalopathic neonates and warrant specialist-directed treatment.", "note": "From Day 7 · Integrated/Rank-differentiating"}, {"num": 87, "pos": 87, "section": 1, "topic": "Neonatology", "question": "A newborn has HR 48/min despite 30 seconds of demonstrably effective PPV through an alternative airway. Which intervention follows?", "options": ["Start coordinated 3:1 chest compressions", "Administer caffeine", "Obtain arterial blood gas first", "Continue PPV alone for another 2 minutes"], "answer": 0, "explanation": "HR below 60/min despite effective ventilation warrants coordinated compressions at 3:1. Why not the others (added — not from source): B. Administer caffeine — Caffeine treats apnoea of prematurity and has no role in neonatal resuscitation for bradycardia.; C. Obtain arterial blood gas first — Obtaining a blood gas delays life-saving compressions when the heart rate stays below 60/min.; D. Continue PPV alone for another 2 minutes — Persistent HR below 60/min despite 30 seconds of effective ventilation mandates compressions, not prolonged ventilation alone.", "pearl": "HR below 60/min despite effective ventilation warrants coordinated compressions at 3:1.", "note": "From Day 1 · Basic-but-easily-confused"}, {"num": 88, "pos": 88, "section": 1, "topic": "Neonatology", "question": "A term infant with meconium aspiration has severe hypoxemia, differential pre/postductal saturations and echo showing elevated pulmonary pressures. Before starting selective pulmonary vasodilator treatment, which structural issue should echo assess?", "options": ["Congenital heart disease and pulmonary venous obstruction", "Femoral venous patency alone", "Only physiologic PDA size", "Isolated renal size"], "answer": 0, "explanation": "Echo helps distinguish PPHN from cyanotic CHD and pulmonary venous obstruction where vasodilators may be harmful. Why not the others (added — not from source): B. Femoral venous patency alone — Femoral venous patency does not affect the decision to start inhaled nitric oxide.; C. Only physiologic PDA size — PDA size is relevant to shunt direction but does not exclude duct-dependent CHD or pulmonary venous obstruction.; D. Isolated renal size — Renal size is irrelevant to the decision to use pulmonary vasodilators.", "pearl": "Echo helps distinguish PPHN from cyanotic CHD and pulmonary venous obstruction where vasodilators may be harmful.", "note": "From Day 9 · Clinical/Application"}, {"num": 89, "pos": 89, "section": 1, "topic": "Neonatology", "question": "A preterm infant with known NEC develops free intraperitoneal air and worsening shock. What does the free air imply?", "options": ["Normal pneumatosis without perforation", "Bowel perforation requiring urgent surgical evaluation", "Resolving intestinal inflammation", "Only portal venous gas without complication"], "answer": 1, "explanation": "Pneumoperitoneum is a major surgical indication in NEC. Why not the others (added — not from source): A. Normal pneumatosis without perforation — Pneumatosis is intramural gas; free peritoneal air indicates perforation through the bowel wall.; C. Resolving intestinal inflammation — Free air signifies progression to perforation, not resolution of inflammation.; D. Only portal venous gas without complication — Portal venous gas is a separate radiological sign of severe NEC, while free peritoneal air indicates perforation.", "pearl": "Pneumoperitoneum is a major surgical indication in NEC.", "note": "From Day 8 · High-difficulty"}, {"num": 90, "pos": 90, "section": 1, "topic": "Neurology", "question": "A 7-month-old has clusters of brief flexor spasms on awakening, developmental plateau and chaotic high-amplitude EEG background. Which syndrome is most likely?", "options": ["Infantile epileptic spasms syndrome", "Benign neonatal sleep myoclonus", "Juvenile myoclonic epilepsy", "Typical childhood absence epilepsy"], "answer": 0, "explanation": "Clusters of spasms with developmental impact and hypsarrhythmia-like EEG are characteristic. Why not the others (added — not from source): B. Benign neonatal sleep myoclonus — Benign neonatal sleep myoclonus occurs in neonates, only during sleep, with normal EEG and development.; C. Juvenile myoclonic epilepsy — Juvenile myoclonic epilepsy presents in adolescence with morning myoclonic jerks and normal development.; D. Typical childhood absence epilepsy — Childhood absence epilepsy starts at school age with brief staring and 3-Hz spike-wave, not infantile spasms.", "pearl": "Clusters of spasms with developmental impact and hypsarrhythmia-like EEG are characteristic.", "note": "From Day 22 · Basic-but-easily-confused"}, {"num": 91, "pos": 91, "section": 1, "topic": "Neurology", "question": "A 10-year-old has brief repetitive shoulder shrugs and throat-clearing that are suppressible briefly, preceded by an urge and fluctuate with stress. Most likely movement disorder?", "options": ["Athetosis due to kernicterus", "Chorea from Sydenham disease", "Motor and vocal tics", "Fixed dystonia"], "answer": 2, "explanation": "Premonitory urge, brief suppressibility and waxing-waning motor/vocal events suggest tics. Why not the others (added — not from source): A. Athetosis due to kernicterus — Athetosis consists of slow writhing movements without premonitory urge or voluntary suppressibility.; B. Chorea from Sydenham disease — Sydenham chorea is random, flowing and not suppressible, and is not preceded by a premonitory urge.; D. Fixed dystonia — Fixed dystonia causes sustained abnormal postures rather than brief suppressible movements and sounds.", "pearl": "Premonitory urge, brief suppressibility and waxing-waning motor/vocal events suggest tics.", "note": "From Day 24 · High-difficulty"}, {"num": 92, "pos": 92, "section": 1, "topic": "Neonatology", "question": "A 29-week infant is advancing feeds and mother's milk supply is insufficient; donor human milk is available. Why might fortification be required once substantial human-milk feeds are established?", "options": ["Fortification is needed only to replace water", "Unfortified milk may not meet very-preterm protein/mineral needs", "Fortification cures NEC", "Human milk contains no immunological factors"], "answer": 1, "explanation": "Human milk often needs fortification to meet growth and mineral requirements of VLBW infants. Why not the others (added — not from source): A. Fortification is needed only to replace water — Fortification provides protein, energy, calcium and phosphate rather than water.; C. Fortification cures NEC — Fortification supports growth and bone mineralisation but does not treat or cure NEC.; D. Human milk contains no immunological factors — Human milk contains immunological factors such as IgA and lactoferrin; fortification addresses nutrient adequacy instead.", "pearl": "Human milk often needs fortification to meet growth and mineral requirements of VLBW infants.", "note": "From Day 8 · Conceptual"}, {"num": 93, "pos": 93, "section": 1, "topic": "Neonatology", "question": "A 4-day-old newborn has marked unconjugated jaundice with modest anemia, negative DAT and family history of jaundice after fava-bean exposure. Which condition should be considered strongly?", "options": ["Biliary atresia", "ABO isoimmunization with positive DAT", "Congenital hypothyroidism as the sole cause", "G6PD deficiency"], "answer": 3, "explanation": "G6PD deficiency may cause severe DAT-negative unconjugated jaundice with relatively little anemia. Why not the others (added — not from source): A. Biliary atresia — Biliary atresia causes conjugated hyperbilirubinaemia with pale stools, usually after the first week, not DAT-negative unconjugated jaundice.; B. ABO isoimmunization with positive DAT — ABO isoimmunisation usually has a positive DAT, whereas this baby's DAT is negative.; C. Congenital hypothyroidism as the sole cause — Congenital hypothyroidism causes prolonged mild jaundice but not the fava-bean family history or haemolytic pattern.", "pearl": "G6PD deficiency may cause severe DAT-negative unconjugated jaundice with relatively little anemia.", "note": "From Day 6 · Clinical/Application"}, {"num": 94, "pos": 94, "section": 1, "topic": "Cardiology", "question": "A premature infant has a large PDA and pulmonary overcirculation; the murmur is continuous with bounding pulses. Which echo observation best supports significant ductal steal?", "options": ["Small duct without chamber enlargement", "No left-heart volume loading", "Normal antegrade systemic diastolic flow", "Retrograde diastolic flow in descending aorta"], "answer": 3, "explanation": "Reversed systemic diastolic flow supports important ductal runoff. Why not the others (added — not from source): A. Small duct without chamber enlargement — A small duct without chamber enlargement indicates a haemodynamically insignificant PDA.; B. No left-heart volume loading — Absence of left-heart volume load argues against a large left-to-right ductal shunt.; C. Normal antegrade systemic diastolic flow — Normal antegrade diastolic flow suggests no significant ductal runoff.", "pearl": "Reversed systemic diastolic flow supports important ductal runoff.", "note": "From Day 17 · Clinical/Application"}, {"num": 95, "pos": 95, "section": 1, "topic": "Growth/Genetics", "question": "A neonate develops cataracts after milk feeds but has little liver dysfunction, no coagulopathy and normal clinical stability. Which defect best matches this relatively isolated cataract phenotype?", "options": ["Hereditary fructose intolerance", "Classic GALT deficiency", "Galactokinase deficiency", "Tyrosinemia type I"], "answer": 2, "explanation": "Galactokinase deficiency produces galactitol cataracts with less systemic toxicity than classic galactosemia. Why not the others (added — not from source): A. Hereditary fructose intolerance — Hereditary fructose intolerance presents with hypoglycaemia and liver dysfunction after fructose exposure and does not cause cataracts.; B. Classic GALT deficiency — Classic GALT deficiency causes severe liver dysfunction, sepsis risk and coagulopathy rather than an isolated cataract phenotype.; D. Tyrosinemia type I — Tyrosinaemia type I causes liver failure, coagulopathy and renal tubulopathy rather than isolated cataracts.", "pearl": "Galactokinase deficiency produces galactitol cataracts with less systemic toxicity than classic galactosemia.", "note": "From Day 15 · Conceptual"}, {"num": 96, "pos": 96, "section": 1, "topic": "Cardiology", "question": "An adolescent athlete has exertional syncope, asymmetric septal hypertrophy and dynamic LV outflow obstruction on echocardiography. Which diagnosis best fits?", "options": ["Arrhythmogenic right ventricular cardiomyopathy alone", "Restrictive cardiomyopathy", "Dilated cardiomyopathy", "Hypertrophic cardiomyopathy"], "answer": 3, "explanation": "Asymmetric hypertrophy and dynamic LVOT obstruction are classic HCM features. Why not the others (added — not from source): A. Arrhythmogenic right ventricular cardiomyopathy alone — ARVC mainly affects the right ventricle with ventricular arrhythmias and does not cause asymmetric septal hypertrophy or LVOT obstruction.; B. Restrictive cardiomyopathy — Restrictive cardiomyopathy has non-dilated, non-hypertrophied ventricles with marked atrial enlargement and diastolic dysfunction, not LVOT obstruction.; C. Dilated cardiomyopathy — Dilated cardiomyopathy has thin dilated ventricles with systolic failure rather than hypertrophy and outflow obstruction.", "pearl": "Asymmetric hypertrophy and dynamic LVOT obstruction are classic HCM features.", "note": "From Day 20 · High-difficulty"}, {"num": 97, "pos": 97, "section": 1, "topic": "Growth/Genetics", "question": "A 5-day-old neonate has ammonia 650 umol/L, respiratory alkalosis, very low citrulline and high urinary orotic acid. Which biochemical result would instead favor CPS1/NAGS deficiency?", "options": ["Markedly elevated citrulline", "Low or normal urinary orotic acid with low citrulline", "Markedly elevated urinary orotic acid", "High succinylacetone"], "answer": 1, "explanation": "CPS1/NAGS defects impair mitochondrial carbamoyl phosphate formation and do not generate the OTC orotic-acid pattern. Why not the others (added — not from source): A. Markedly elevated citrulline — Markedly elevated citrulline suggests citrullinaemia or argininosuccinic aciduria, which are distal urea-cycle defects.; C. Markedly elevated urinary orotic acid — High orotic acid with low citrulline indicates OTC deficiency, which is the pattern already described in the stem.; D. High succinylacetone — Succinylacetone is diagnostic of tyrosinaemia type I, not a proximal urea-cycle defect.", "pearl": "CPS1/NAGS defects impair mitochondrial carbamoyl phosphate formation and do not generate the OTC orotic-acid pattern.", "note": "From Day 15 · High-difficulty"}, {"num": 98, "pos": 98, "section": 1, "topic": "Neurology", "question": "A 10-year-old has brief repetitive shoulder shrugs and throat-clearing that are suppressible briefly, preceded by an urge and fluctuate with stress. Which feature would instead favor dystonia?", "options": ["Sustained patterned twisting posture without typical premonitory urge", "Brief suppressible repetitive vocalization", "Symptoms disappear completely during concentration", "Transient eye blinking with urge"], "answer": 0, "explanation": "Dystonia produces sustained or intermittent patterned muscle contractions and posturing rather than simple suppressible tics. Why not the others (added — not from source): B. Brief suppressible repetitive vocalization — Brief suppressible vocalisations are typical of tics, not dystonia.; C. Symptoms disappear completely during concentration — Reduction during concentration is a recognised feature of tics.; D. Transient eye blinking with urge — Transient eye blinking preceded by an urge is a typical simple motor tic.", "pearl": "Dystonia produces sustained or intermittent patterned muscle contractions and posturing rather than simple suppressible tics.", "note": "From Day 24 · Conceptual"}, {"num": 99, "pos": 99, "section": 1, "topic": "Cardiology", "question": "An 8-month-old with unrepaired TOF becomes profoundly cyanotic after crying; examination shows a softer RVOT murmur. Why can the RVOT murmur become softer during a severe spell?", "options": ["The pulmonary valve obstruction has resolved", "Aortic stenosis has developed suddenly", "Pulmonary blood flow has increased dramatically", "Less forward flow crosses the obstructed outflow tract"], "answer": 3, "explanation": "Severe dynamic RVOT obstruction reduces forward flow and murmur intensity. Why not the others (added — not from source): A. The pulmonary valve obstruction has resolved — RVOT obstruction worsens during a hypercyanotic spell because of infundibular spasm; it does not resolve.; B. Aortic stenosis has developed suddenly — Sudden aortic stenosis is not part of TOF spell physiology and would not explain the softer RVOT murmur.; C. Pulmonary blood flow has increased dramatically — Pulmonary blood flow falls during a spell, which causes the cyanosis; increased flow would intensify the murmur.", "pearl": "Severe dynamic RVOT obstruction reduces forward flow and murmur intensity.", "note": "From Day 18 · Clinical/Application"}, {"num": 100, "pos": 100, "section": 1, "topic": "Cardiology", "question": "A 7-year-old has a systolic ejection murmur at the left upper sternal border and a split S2 that changes little with respiration. Most likely structural lesion?", "options": ["Small restrictive VSD", "Secundum atrial septal defect", "Mitral valve prolapse", "Aortic coarctation"], "answer": 1, "explanation": "Fixed splitting of S2 and pulmonary flow murmur are characteristic of an ASD. Why not the others (added — not from source): A. Small restrictive VSD — A small VSD produces a harsh holosystolic murmur at the lower left sternal border with normal S2 splitting.; C. Mitral valve prolapse — Mitral valve prolapse gives a mid-systolic click and late systolic murmur at the apex, not fixed splitting.; D. Aortic coarctation — Coarctation causes upper-limb hypertension, weak femoral pulses and an interscapular murmur, not fixed splitting of S2.", "pearl": "Fixed splitting of S2 and pulmonary flow murmur are characteristic of an ASD.", "note": "From Day 16 · High-difficulty"}, {"num": 101, "pos": 101, "section": 2, "topic": "Neurology", "question": "A child remains unresponsive after visible convulsions stop; there are subtle eyelid movements and fluctuating tachycardia. Which test best identifies ongoing nonconvulsive status?", "options": ["Urgent EEG monitoring", "Routine serum calcium alone", "Head circumference alone", "Plain skull radiograph"], "answer": 0, "explanation": "Persistent encephalopathy after convulsive seizures can represent electrographic status requiring EEG. Why not the others (added — not from source): B. Routine serum calcium alone — Hypocalcaemia is one possible precipitant worth checking, but a calcium level cannot show whether electrographic seizure activity is continuing in the brain.; C. Head circumference alone — Head size reflects chronic brain growth or hydrocephalus and gives no information about current cortical seizure activity in an encephalopathic child.; D. Plain skull radiograph — Skull radiographs show bony injury at best and have no role in detecting nonconvulsive status; only EEG demonstrates ongoing electrographic seizures.", "pearl": "Persistent encephalopathy after convulsive seizures can represent electrographic status requiring EEG.", "note": "From Day 23 · Conceptual"}, {"num": 102, "pos": 102, "section": 2, "topic": "Cardiology", "question": "A cyanotic newborn has d-TGA, a restrictive interatrial communication, severe hypoxemia and inadequate mixing despite PGE1. What urgent catheter intervention is indicated?", "options": ["Balloon mitral valvotomy", "Balloon atrial septostomy", "Transcatheter VSD closure", "Pulmonary artery banding as first rescue"], "answer": 1, "explanation": "Restrictive atrial mixing in d-TGA can require urgent balloon atrial septostomy. Why not the others (added — not from source): A. Balloon mitral valvotomy — Mitral valvotomy treats congenital mitral stenosis; the problem in d-TGA is inadequate intercirculatory mixing at atrial level, not left-sided inflow obstruction.; C. Transcatheter VSD closure — Closing a VSD would remove a potential mixing site and worsen hypoxaemia in parallel TGA circulation; it is never an emergency rescue here.; D. Pulmonary artery banding as first rescue — Banding restricts pulmonary blood flow for overcirculation; it does not improve atrial mixing and would worsen hypoxaemia in a cyanosed TGA neonate.", "pearl": "Restrictive atrial mixing in d-TGA can require urgent balloon atrial septostomy.", "note": "From Day 19 · Clinical/Application"}, {"num": 103, "pos": 103, "section": 2, "topic": "Neurology", "question": "A child with a history of severe neonatal unconjugated hyperbilirubinemia develops involuntary twisting movements and auditory neuropathy. Which CP phenotype is most characteristic?", "options": ["Spastic diplegia from PVL", "Ataxic CP from posterior fossa tumor", "Dyskinetic cerebral palsy", "Pure hemiplegic CP from MCA infarct"], "answer": 2, "explanation": "Kernicterus damages basal ganglia and auditory pathways, leading to dyskinetic movement and hearing abnormalities. Why not the others (added — not from source): A. Spastic diplegia from PVL — Periventricular leukomalacia is a white-matter injury of preterm infants producing lower-limb spasticity, not the basal ganglia and auditory pattern of kernicterus.; B. Ataxic CP from posterior fossa tumor — A posterior fossa tumour causes acquired progressive ataxia, not a static cerebral palsy, and bilirubin toxicity does not produce cerebellar tumours.; D. Pure hemiplegic CP from MCA infarct — Arterial ischaemic stroke causes unilateral spasticity; bilirubin targets the globus pallidus, subthalamic nucleus and auditory nuclei, causing dyskinesia and hearing loss.", "pearl": "Kernicterus damages basal ganglia and auditory pathways, leading to dyskinetic movement and hearing abnormalities.", "note": "From Day 24 · Integrated/Rank-differentiating"}, {"num": 104, "pos": 104, "section": 2, "topic": "Cardiology", "question": "Echocardiography shows primum ASD, a small restrictive inlet VSD and two distinct atrioventricular valve orifices. What echo feature would instead define complete AVSD?", "options": ["Two separate AV valve orifices with no inlet VSD", "Isolated muscular VSD", "Intact atrial septum", "Common AV valve orifice spanning both ventricles"], "answer": 3, "explanation": "A common AV junction/valve orifice with substantial inlet VSD defines complete AVSD. Why not the others (added — not from source): A. Two separate AV valve orifices with no inlet VSD — Two separate AV valve orifices without an inlet VSD describes partial (primum) AVSD, which is the opposite of the complete form.; B. Isolated muscular VSD — A muscular VSD lies in the trabecular septum and is unrelated to the atrioventricular junction; it does not define any AVSD subtype.; C. Intact atrial septum — An intact atrial septum excludes the primum component; complete AVSD characteristically has a primum ASD with a large inlet VSD and common valve.", "pearl": "A common AV junction/valve orifice with substantial inlet VSD defines complete AVSD.", "note": "From Day 17 · Clinical/Application"}, {"num": 105, "pos": 105, "section": 2, "topic": "Cardiology", "question": "A 2-week-old with truncus arteriosus has tachypnea, bounding pulses and a single arterial trunk supplying systemic and pulmonary circulations. Which anatomical finding distinguishes truncus from pulmonary atresia with VSD?", "options": ["Aorta and pulmonary artery have fully separate roots", "Pulmonary arteries arise from a common arterial trunk with a single truncal valve", "Two normal semilunar valves are present", "Pulmonary arteries arise only from ductus in all cases"], "answer": 1, "explanation": "Truncus has a single arterial outlet/truncal valve from which pulmonary arteries arise. Why not the others (added — not from source): A. Aorta and pulmonary artery have fully separate roots — Fully separate aortic and pulmonary roots exclude truncus, which by definition has one arterial trunk from which both circulations arise.; C. Two normal semilunar valves are present — Truncus has a single, often dysplastic truncal valve; two normal semilunar valves imply separate great arteries and a different diagnosis.; D. Pulmonary arteries arise only from ductus in all cases — Duct-supplied or collateral pulmonary arteries characterise pulmonary atresia with VSD; in truncus the pulmonary arteries arise from the trunk itself.", "pearl": "Truncus has a single arterial outlet/truncal valve from which pulmonary arteries arise.", "note": "From Day 19 · Basic-but-easily-confused"}, {"num": 106, "pos": 106, "section": 2, "topic": "Cardiology", "question": "A newborn with complex single-ventricle physiology has pulmonary overcirculation and low systemic output as pulmonary vascular resistance falls. Why can indiscriminate high FiO2 worsen systemic perfusion in this setting?", "options": ["Oxygen closes the atrial septum", "Lower PVR can increase Qp at expense of Qs", "Oxygen always raises PVR markedly", "Oxygen blocks ductal flow directly"], "answer": 1, "explanation": "High oxygen may reduce PVR and exaggerate pulmonary overcirculation in parallel circulation physiology. Why not the others (added — not from source): A. Oxygen closes the atrial septum — Oxygen does not close the foramen ovale or atrial septum; atrial restriction is anatomical, not an oxygen-mediated effect.; C. Oxygen always raises PVR markedly — Oxygen is a pulmonary vasodilator and lowers rather than raises PVR, which is exactly why it promotes pulmonary overcirculation.; D. Oxygen blocks ductal flow directly — Although high oxygen tension promotes ductal constriction over time, the main problem here is PVR fall increasing Qp, not a direct block of ductal flow.", "pearl": "High oxygen may reduce PVR and exaggerate pulmonary overcirculation in parallel circulation physiology.", "note": "From Day 19 · Clinical/Application"}, {"num": 107, "pos": 107, "section": 2, "topic": "Neonatology", "question": "A 39-week infant has moderate-to-severe HIE after resuscitation, is 3 hours old and has no major contraindication to cooling. What is the best neuroprotective intervention?", "options": ["Give prophylactic corticosteroids as sole treatment", "Delay until 24 hours for MRI confirmation", "Start cooling for isolated mild encephalopathy in every case", "Initiate controlled therapeutic hypothermia within the accepted window"], "answer": 3, "explanation": "Eligible term/near-term infants with moderate-severe HIE benefit from timely controlled cooling, ideally within 6 hours. Why not the others (added — not from source): A. Give prophylactic corticosteroids as sole treatment — Corticosteroids have no proven neuroprotective benefit in HIE and are not an accepted substitute for therapeutic hypothermia.; B. Delay until 24 hours for MRI confirmation — Benefit of cooling depends on starting within the first 6 hours; waiting for MRI would lose the therapeutic window.; C. Start cooling for isolated mild encephalopathy in every case — Evidence for cooling is for moderate-to-severe encephalopathy; routine cooling of all mild HIE is not established, and this infant already qualifies.", "pearl": "Eligible term/near-term infants with moderate-severe HIE benefit from timely controlled cooling, ideally within 6 hours.", "note": "From Day 7 · Clinical/Application"}, {"num": 108, "pos": 108, "section": 2, "topic": "Neonatology", "question": "A cooled infant has repeated subtle automatisms and autonomic events; bedside aEEG shows a rising saw-tooth band. What confirms an electrographic seizure most reliably?", "options": ["Evolving ictal pattern on raw EEG", "AEEG amplitude change without raw trace correlation", "Intermittent electrode movement artifact", "Normal sleep-wake cycling"], "answer": 0, "explanation": "Raw EEG with evolving ictal morphology is the discriminator between seizure and artifact. Why not the others (added — not from source): B. AEEG amplitude change without raw trace correlation — aEEG is compressed and filtered, so amplitude changes can reflect artefact or state change; they must be confirmed on the raw EEG trace.; C. Intermittent electrode movement artifact — Electrode movement artefact mimics a rise in the aEEG band and is a classic false positive, not evidence of seizure.; D. Normal sleep-wake cycling — Sleep-wake cycling is a sign of a reassuring background and does not indicate seizure activity.", "pearl": "Raw EEG with evolving ictal morphology is the discriminator between seizure and artifact.", "note": "From Day 7 · Clinical/Application"}, {"num": 109, "pos": 109, "section": 2, "topic": "Cardiology", "question": "A young infant with TOF has severe RVOT obstruction and recurrent desaturation; anatomy is suitable for transcatheter palliation, but complete repair is deferred. Which alternative palliation may be preferred if pulmonary blood flow is primarily duct-dependent and duct anatomy is suitable?", "options": ["Mitral valve replacement", "Ductal stenting", "Pulmonary venous stenting", "Atrial septal occlusion"], "answer": 1, "explanation": "Ductal stenting and RVOT stenting address different sources of pulmonary flow; anatomy guides choice. Why not the others (added — not from source): A. Mitral valve replacement — Mitral valve replacement addresses left AV valve disease and has no role in augmenting pulmonary blood flow in TOF.; C. Pulmonary venous stenting — Pulmonary vein stenting treats pulmonary venous stenosis, which is not the lesion in TOF with RVOT obstruction.; D. Atrial septal occlusion — Closing the atrial septum does not increase pulmonary blood flow and is irrelevant to RVOT-obstructed TOF palliation.", "pearl": "Ductal stenting and RVOT stenting address different sources of pulmonary flow; anatomy guides choice.", "note": "From Day 18 · Clinical/Application"}, {"num": 110, "pos": 110, "section": 2, "topic": "Neonatology", "question": "A newborn has HR 48/min despite 30 seconds of demonstrably effective PPV through an alternative airway. After coordinated compressions and ventilation the HR remains 45/min. Preferred medication route?", "options": ["Intramuscular thigh", "Oral gastric tube", "Subcutaneous injection", "Umbilical venous or other intravascular access"], "answer": 3, "explanation": "Intravascular epinephrine via umbilical venous access is preferred for neonatal resuscitation medication. Why not the others (added — not from source): A. Intramuscular thigh — Intramuscular absorption is unreliable and slow in a poorly perfused newborn and is not a recommended route for resuscitation epinephrine.; B. Oral gastric tube — The gastric route delivers no reliable systemic absorption; epinephrine must be given intravascularly (or endotracheally only while access is obtained).; C. Subcutaneous injection — Subcutaneous absorption is negligible during circulatory collapse and is not used for neonatal resuscitation drugs.", "pearl": "Intravascular epinephrine via umbilical venous access is preferred for neonatal resuscitation medication.", "note": "From Day 1 · Clinical/Application"}, {"num": 111, "pos": 111, "section": 2, "topic": "Growth/Genetics", "question": "An infant has truncus arteriosus, hypocalcemic seizures, absent thymic shadow and recurrent infections. Which syndrome is most likely?", "options": ["Prader-Willi syndrome", "Williams syndrome", "22q11.2 deletion syndrome", "Turner syndrome"], "answer": 2, "explanation": "Conotruncal defect, hypocalcemia and thymic hypoplasia are characteristic of 22q11.2 deletion. Why not the others (added — not from source): A. Prader-Willi syndrome — Prader-Willi presents with neonatal hypotonia and feeding difficulty, later hyperphagia, and is not associated with conotruncal defects or thymic aplasia.; B. Williams syndrome — Williams syndrome is linked to supravalvar aortic stenosis and hypercalcaemia, not truncus, hypocalcaemia or thymic hypoplasia.; D. Turner syndrome — Turner syndrome is associated with coarctation and bicuspid aortic valve in girls, without hypocalcaemia or T-cell deficiency.", "pearl": "Conotruncal defect, hypocalcemia and thymic hypoplasia are characteristic of 22q11.2 deletion.", "note": "From Day 15 · Clinical/Application"}, {"num": 112, "pos": 112, "section": 2, "topic": "Neurology", "question": "An infant develops prolonged fever-triggered hemiclonic seizures in the first year and later multiple seizure types; SCN1A-related Dravet syndrome is suspected. Which antiseizure drug may worsen seizures and should generally be avoided?", "options": ["Carbamazepine", "Stiripentol in appropriate combinations", "Clobazam", "Valproate"], "answer": 0, "explanation": "Sodium-channel blockers such as carbamazepine can exacerbate seizures in Dravet syndrome. Why not the others (added — not from source): B. Stiripentol in appropriate combinations — Stiripentol, usually added to valproate and clobazam, is specifically approved and beneficial in Dravet syndrome.; C. Clobazam — Clobazam is a recommended first- or second-line agent for Dravet syndrome and is commonly combined with valproate and stiripentol.; D. Valproate — Valproate is a first-line drug for Dravet syndrome and does not aggravate seizures as sodium-channel blockers do.", "pearl": "Sodium-channel blockers such as carbamazepine can exacerbate seizures in Dravet syndrome.", "note": "From Day 22 · Clinical/Application"}, {"num": 113, "pos": 113, "section": 2, "topic": "Neonatology", "question": "A 27-week infant has bounding pulses, wide pulse pressure, increasing ventilatory need and a large duct with left-to-right shunt on echo. What explains systemic diastolic flow reversal?", "options": ["Hemodynamically significant PDA with ductal steal", "Pure PPHN with exclusive right-to-left ductal flow", "Aortic coarctation without ductal flow", "Pulmonary venous obstruction"], "answer": 0, "explanation": "A large left-to-right PDA can divert systemic diastolic flow into pulmonary circulation. Why not the others (added — not from source): B. Pure PPHN with exclusive right-to-left ductal flow — Exclusive right-to-left ductal flow in PPHN causes cyanosis and differential saturations, not systemic diastolic steal or bounding pulses.; C. Aortic coarctation without ductal flow — Coarctation reduces lower-body pulses and pressure; it does not produce bounding pulses with diastolic flow reversal into the lungs.; D. Pulmonary venous obstruction — Pulmonary venous obstruction causes pulmonary oedema and cyanosis with poor output, not a wide pulse pressure from a left-to-right duct.", "pearl": "A large left-to-right PDA can divert systemic diastolic flow into pulmonary circulation.", "note": "From Day 9 · High-difficulty"}, {"num": 114, "pos": 114, "section": 2, "topic": "Neurology", "question": "A 4-year-old has generalized convulsive activity continuing for 7 minutes in the emergency department; bedside glucose is checked. If seizures continue after an adequate first-line benzodiazepine regimen, what follows?", "options": ["Wait for MRI before escalation", "Timely second-line IV antiseizure medication such as levetiracetam/fosphenytoin/valproate per protocol", "Discharge if oxygen saturation recovers", "Repeat endless benzodiazepines without airway assessment"], "answer": 1, "explanation": "Established status requires timely second-line loading and airway/hemodynamic monitoring. Why not the others (added — not from source): A. Wait for MRI before escalation — Imaging never precedes seizure control; delaying second-line therapy increases benzodiazepine-refractory status and neuronal injury.; C. Discharge if oxygen saturation recovers — Recovery of saturation does not mean seizures have stopped; ongoing status needs escalation and observation, not discharge.; D. Repeat endless benzodiazepines without airway assessment — Beyond two benzodiazepine doses efficacy falls and respiratory depression rises, so guidelines move to a second-line agent with airway support.", "pearl": "Established status requires timely second-line loading and airway/hemodynamic monitoring.", "note": "From Day 23 · Conceptual"}, {"num": 115, "pos": 115, "section": 2, "topic": "Neonatology", "question": "At 60 hours of age an infant has recurrent plasma glucose 40 mg/dL despite adequate feeds; hyperinsulinism is suspected. Which finding supports excessive insulin action even if measured insulin is low?", "options": ["Suppressed ketones/free fatty acids with a substantial glucose rise after glucagon", "High ketones and high free fatty acids", "Marked ketonemia with no glucagon response", "Isolated elevated urinary orotic acid"], "answer": 0, "explanation": "Insulin suppresses lipolysis and ketogenesis; a glucagon response of about 30 mg/dL supports insulin excess. Why not the others (added — not from source): B. High ketones and high free fatty acids — High ketones and free fatty acids indicate appropriate lipolysis and ketogenesis, which argues against insulin excess.; C. Marked ketonemia with no glucagon response — Ketotic hypoglycaemia with no glucagon response suggests depleted glycogen or a glycogenolysis defect, not hyperinsulinism.; D. Isolated elevated urinary orotic acid — Urinary orotic acid points to a urea cycle disorder such as OTC deficiency and has no relation to insulin action.", "pearl": "Insulin suppresses lipolysis and ketogenesis; a glucagon response of about 30 mg/dL supports insulin excess.", "note": "From Day 10 · Clinical/Application"}, {"num": 116, "pos": 116, "section": 2, "topic": "Cardiology", "question": "A 5-day-old newborn becomes shocked as the ductus constricts; femoral pulses are weak and upper limb blood pressure exceeds lower limb pressure. Which temporizing drug should be started while definitive evaluation is arranged?", "options": ["Adenosine bolus", "Prostaglandin E1 infusion", "Ibuprofen to close the ductus", "Routine high-dose furosemide alone"], "answer": 1, "explanation": "PGE1 maintains/reopens ductal flow in critical duct-dependent systemic obstruction. Why not the others (added — not from source): A. Adenosine bolus — Adenosine treats re-entrant SVT; this infant has duct-dependent systemic obstruction such as coarctation, not a tachyarrhythmia.; C. Ibuprofen to close the ductus — Ibuprofen closes the duct and would further reduce lower-body perfusion in a duct-dependent systemic circulation.; D. Routine high-dose furosemide alone — Diuretics may help congestion but do not restore ductal flow; shock from duct closure needs PGE1 to reopen the duct.", "pearl": "PGE1 maintains/reopens ductal flow in critical duct-dependent systemic obstruction.", "note": "From Day 19 · Clinical/Application"}, {"num": 117, "pos": 117, "section": 2, "topic": "Cardiology", "question": "A 9-year-old has viral prodrome, chest pain, tachycardia out of proportion to fever, raised troponin and new LV dysfunction. Which investigation best helps assess ventricular function and hemodynamic impact urgently?", "options": ["Echocardiography", "Routine treadmill test during acute illness", "Only lipid profile", "Barium swallow"], "answer": 0, "explanation": "Echocardiography rapidly assesses systolic function, effusion and hemodynamic status. Why not the others (added — not from source): B. Routine treadmill test during acute illness — Exercise testing is contraindicated during acute myocarditis because exertion may provoke arrhythmia and worsen myocardial injury.; C. Only lipid profile — A lipid profile has no role in assessing acute ventricular dysfunction from viral myocarditis.; D. Barium swallow — Barium swallow evaluates the oesophagus and does not assess cardiac function or haemodynamics.", "pearl": "Echocardiography rapidly assesses systolic function, effusion and hemodynamic status.", "note": "From Day 20 · Clinical/Application"}, {"num": 118, "pos": 118, "section": 2, "topic": "Neonatology", "question": "A 39-week infant has moderate-to-severe HIE after resuscitation, is 3 hours old and has no major contraindication to cooling. Which target core temperature is typically used for whole-body therapeutic hypothermia?", "options": ["About 33.5 C", "About 36.8 C", "About 30 C", "About 39 C"], "answer": 0, "explanation": "Standard whole-body protocols target approximately 33.5 C with controlled rewarming. Why not the others (added — not from source): B. About 36.8 C — Around 36.5-37 C is normothermia, used for rewarming and avoiding hyperthermia, not therapeutic cooling.; C. About 30 C — Temperatures near 30 C are excessively low and risk arrhythmia, coagulopathy and death; deeper cooling trials showed no added benefit.; D. About 39 C — Hyperthermia increases cerebral metabolic demand and worsens hypoxic-ischaemic injury, so fever must be actively avoided rather than induced in HIE.", "pearl": "Standard whole-body protocols target approximately 33.5 C with controlled rewarming.", "note": "From Day 7 · High-difficulty"}, {"num": 119, "pos": 119, "section": 2, "topic": "Neurology", "question": "A former 27-week infant develops increased lower-limb tone, scissoring and delayed walking; MRI shows periventricular white-matter injury. Most likely motor phenotype?", "options": ["Ataxic CP from cerebellar disease", "Isolated peripheral neuropathy", "Spastic diplegic cerebral palsy", "Dyskinetic CP from basal ganglia injury"], "answer": 2, "explanation": "PVL preferentially affects descending corticospinal fibers to lower limbs, producing spastic diplegia. Why not the others (added — not from source): A. Ataxic CP from cerebellar disease — Ataxic CP results from cerebellar involvement, whereas periventricular white-matter injury affects corticospinal tracts causing spasticity.; B. Isolated peripheral neuropathy — Peripheral neuropathy produces hypotonia and reduced reflexes, not increased tone and scissoring with MRI white-matter injury.; D. Dyskinetic CP from basal ganglia injury — Dyskinetic CP follows basal ganglia or thalamic injury, typically term HIE or kernicterus, not preterm PVL.", "pearl": "PVL preferentially affects descending corticospinal fibers to lower limbs, producing spastic diplegia.", "note": "From Day 24 · Conceptual"}, {"num": 120, "pos": 120, "section": 2, "topic": "Growth/Genetics", "question": "An infant has truncus arteriosus, hypocalcemic seizures, absent thymic shadow and recurrent infections. Which immune issue should be assessed before live-vaccine decisions?", "options": ["Isolated IgE level only", "Platelet aggregation only", "T-cell number and function", "Neutrophil oxidative burst alone"], "answer": 2, "explanation": "Variable T-cell immunodeficiency in 22q11.2 deletion affects live-vaccine safety decisions. Why not the others (added — not from source): A. Isolated IgE level only — IgE measurement does not assess the thymic T-cell defect that determines live-vaccine safety in 22q11.2 deletion.; B. Platelet aggregation only — Platelet function is not the relevant immune issue; live-vaccine risk relates to T-cell deficiency.; D. Neutrophil oxidative burst alone — Oxidative burst testing screens for chronic granulomatous disease, which is not the immune defect of 22q11.2 deletion.", "pearl": "Variable T-cell immunodeficiency in 22q11.2 deletion affects live-vaccine safety decisions.", "note": "From Day 15 · Clinical/Application"}, {"num": 121, "pos": 121, "section": 2, "topic": "Neonatology", "question": "A jaundiced 38-week newborn has bilirubin approaching the exchange-transfusion threshold despite intensive phototherapy. What is the best next care level?", "options": ["Routine discharge with next-week review", "Switch to sunlight alone", "Discontinue phototherapy while awaiting repeat bilirubin", "Escalation of care with urgent bilirubin monitoring, intensive phototherapy and exchange preparation"], "answer": 3, "explanation": "Near-exchange bilirubin is a medical escalation requiring intensified monitoring and exchange readiness. Why not the others (added — not from source): A. Routine discharge with next-week review — Discharge with bilirubin near exchange threshold risks acute bilirubin encephalopathy and kernicterus.; B. Switch to sunlight alone — Sunlight is uncontrolled, irradiance-variable and unsafe; it is not a substitute for intensive phototherapy.; C. Discontinue phototherapy while awaiting repeat bilirubin — Stopping phototherapy at near-exchange levels removes the main bilirubin-lowering therapy and can allow a dangerous rise.", "pearl": "Near-exchange bilirubin is a medical escalation requiring intensified monitoring and exchange readiness.", "note": "From Day 6 · Clinical/Application"}, {"num": 122, "pos": 122, "section": 2, "topic": "Neurology", "question": "A 7-month-old has clusters of brief flexor spasms on awakening, developmental plateau and chaotic high-amplitude EEG background. In an infant with tuberous sclerosis complex and spasms, which treatment is particularly favored?", "options": ["Vigabatrin", "Chronic benzodiazepine alone", "Carbamazepine monotherapy", "Ethosuximide"], "answer": 0, "explanation": "Vigabatrin is particularly effective for spasms associated with tuberous sclerosis. Why not the others (added — not from source): B. Chronic benzodiazepine alone — Benzodiazepines are not first-line for infantile spasms and do not reliably achieve spasm cessation or EEG resolution.; C. Carbamazepine monotherapy — Carbamazepine is ineffective for infantile spasms and may aggravate generalised seizure types.; D. Ethosuximide — Ethosuximide is used for absence seizures and has no established efficacy for infantile spasms.", "pearl": "Vigabatrin is particularly effective for spasms associated with tuberous sclerosis.", "note": "From Day 22 · High-difficulty"}, {"num": 123, "pos": 123, "section": 2, "topic": "Neonatology", "question": "A 29-week infant on CPAP 6 cm H2O has rising FiO2 requirement to 0.35 and a diffuse low-volume reticulogranular radiograph. Which treatment should be considered early?", "options": ["Prophylactic chest tube insertion", "Routine diuretics as sole treatment", "Thin-catheter surfactant during spontaneous breathing", "Stop CPAP and observe"], "answer": 2, "explanation": "Worsening RDS on noninvasive support with FiO2 around 0.30 or greater is a common trigger for early surfactant consideration. Why not the others (added — not from source): A. Prophylactic chest tube insertion — No pneumothorax is present; prophylactic chest drains are not indicated in RDS and add harm.; B. Routine diuretics as sole treatment — RDS is due to surfactant deficiency, not fluid overload, so diuretics do not address the cause.; D. Stop CPAP and observe — Removing CPAP in worsening RDS removes end-expiratory pressure, promoting alveolar collapse, rising oxygen need and respiratory failure.", "pearl": "Worsening RDS on noninvasive support with FiO2 around 0.30 or greater is a common trigger for early surfactant consideration.", "note": "From Day 2 · High-difficulty"}, {"num": 124, "pos": 124, "section": 2, "topic": "Cardiology", "question": "A 3-day-old with cyanosis has a single loud S2, poor response to oxygen and echo is pending. Which diagnostic method is most decisive for identifying cyanotic congenital heart disease?", "options": ["Pulse oximetry alone", "Urgent echocardiography", "Hyperoxia test as definitive structural imaging", "ECG alone"], "answer": 1, "explanation": "Echocardiography establishes structural diagnosis; hyperoxia testing cannot define anatomy. Why not the others (added — not from source): A. Pulse oximetry alone — Pulse oximetry detects hypoxaemia and is a useful screen but cannot identify the cardiac anatomy responsible.; C. Hyperoxia test as definitive structural imaging — The hyperoxia test helps separate cardiac from pulmonary cyanosis but provides no structural diagnosis.; D. ECG alone — ECG gives axis and chamber clues but cannot define structural cyanotic heart lesions.", "pearl": "Echocardiography establishes structural diagnosis; hyperoxia testing cannot define anatomy.", "note": "From Day 21 · Conceptual"}, {"num": 125, "pos": 125, "section": 2, "topic": "Cardiology", "question": "A neonate has severe cyanosis, pulmonary edema and echocardiographic obstructed infracardiac total anomalous pulmonary venous connection. Which definitive management is needed?", "options": ["PGE1 alone as definitive therapy", "Observe until pulmonary vascular resistance falls", "Routine transcatheter ASD closure", "Urgent surgical relief of pulmonary venous obstruction"], "answer": 3, "explanation": "Obstructed TAPVC is a surgical emergency; ductal manipulation does not relieve pulmonary venous obstruction. Why not the others (added — not from source): A. PGE1 alone as definitive therapy — PGE1 does not relieve pulmonary venous obstruction and increasing pulmonary flow can worsen pulmonary oedema in obstructed TAPVC.; B. Observe until pulmonary vascular resistance falls — Obstructed TAPVC causes progressive hypoxaemia and pulmonary oedema; waiting is fatal and surgery is an emergency.; C. Routine transcatheter ASD closure — The interatrial communication is the only route for pulmonary venous blood to reach the systemic circulation; closing it would be lethal.", "pearl": "Obstructed TAPVC is a surgical emergency; ductal manipulation does not relieve pulmonary venous obstruction.", "note": "From Day 19 · Conceptual"}, {"num": 126, "pos": 126, "section": 2, "topic": "Neonatology", "question": "A 27-week infant on enteral feeds develops abdominal distension, bloody stool and pneumatosis intestinalis on radiography. Best initial treatment package?", "options": ["Perform contrast enema before stabilization", "Give only oral probiotics and discharge", "Stop feeds, decompress stomach, obtain cultures, give IV fluids and antibiotics with surgical surveillance", "Increase feeds to clear the bowel"], "answer": 2, "explanation": "Medical NEC requires bowel rest, decompression, systemic support and antimicrobial coverage. Why not the others (added — not from source): A. Perform contrast enema before stabilization — Contrast enema is contraindicated in suspected NEC because of perforation risk and does not help initial management.; B. Give only oral probiotics and discharge — Probiotics are a preventive strategy in some units, not treatment of established NEC, and discharge is dangerous.; D. Increase feeds to clear the bowel — Feeding an inflamed, ischaemic bowel worsens injury and risks perforation; bowel rest with gastric decompression is the cornerstone of NEC care.", "pearl": "Medical NEC requires bowel rest, decompression, systemic support and antimicrobial coverage.", "note": "From Day 8 · Conceptual"}, {"num": 127, "pos": 127, "section": 2, "topic": "Neonatology", "question": "A 26-week, 850-g infant is delivered into a cool room and is at high risk of evaporative heat loss. Which initial thermal intervention is most appropriate?", "options": ["Occlusive plastic wrap/bag with radiant warmer and temperature monitoring", "Removing head covering to prevent overheating", "Cold saline cleansing before resuscitation", "Immediate uncovered weighing and prolonged drying"], "answer": 0, "explanation": "Extremely preterm infants benefit from occlusive wrapping and controlled warming to prevent evaporative loss. Why not the others (added — not from source): B. Removing head covering to prevent overheating — Most heat is lost from the large head surface; head covering should be kept, not removed.; C. Cold saline cleansing before resuscitation — Cold fluids accelerate evaporative and conductive heat loss and are inappropriate in an extremely preterm baby.; D. Immediate uncovered weighing and prolonged drying — Exposing and drying extremely preterm infants delays wrapping and increases heat loss; they are placed wet into plastic.", "pearl": "Extremely preterm infants benefit from occlusive wrapping and controlled warming to prevent evaporative loss.", "note": "From Day 4 · Clinical/Application"}, {"num": 128, "pos": 128, "section": 2, "topic": "Cardiology", "question": "A 2-week-old with truncus arteriosus has tachypnea, bounding pulses and a single arterial trunk supplying systemic and pulmonary circulations. Why does heart failure worsen after birth?", "options": ["The ductus must close for all pulmonary flow", "The pulmonary arteries become completely atretic", "Atrial septal closure blocks all mixing", "Falling pulmonary vascular resistance increases pulmonary flow"], "answer": 3, "explanation": "As PVR falls, excessive pulmonary fl
