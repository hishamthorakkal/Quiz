<script>
const EXAM={"id": "Cumulative_Day25", "title": "Cumulative Mock — Day 25 Checkpoint (Days 1–24)", "source": "source/NEET_SS_ICP_Cumulative_Mock_Day25_Comprehensive_Reviewed_REVIEW_EDITION_2026-10-23.docx", "sectionMinutes": 50, "sections": [{"name": "Section A"}, {"name": "Section B"}, {"name": "Section C"}], "marking": {"correct": 4, "wrong": -1, "unattempted": 0}, "pattern": "NEET-SS pattern — 3 time-bound sections of 50 questions / 50 minutes, +4/−1/0"};
const Q=[{"num": 1, "pos": 1, "section": 0, "topic": "Cardiology", "question": "An adolescent athlete has exertional syncope, asymmetric septal hypertrophy and dynamic LV outflow obstruction on echocardiography. Which hemodynamic change may worsen dynamic LVOT obstruction?", "options": ["Slower heart rate with beta blockade", "Increased preload from cautious hydration", "Increased afterload", "Reduced preload from dehydration"], "answer": 3, "explanation": "Reduced ventricular cavity size can increase dynamic obstruction; avoid dehydration and excessive vasodilation. Why not the others (added — not from source): A. Slower heart rate with beta blockade — Slowing the heart rate prolongs diastolic filling and enlarges LV cavity size, so beta blockade reduces dynamic obstruction and is a mainstay of HCM therapy.; B. Increased preload from cautious hydration — Greater preload distends the LV cavity and separates the septum from the anterior mitral leaflet, lessening rather than worsening the outflow gradient.; C. Increased afterload — Raised afterload increases LV cavity size and reduces the outflow gradient, which is why phenylephrine is used in acute obstructive crises.", "pearl": "Reduced ventricular cavity size can increase dynamic obstruction; avoid dehydration and excessive vasodilation.", "note": "From Day 20 · Basic-but-easily-confused"}, {"num": 2, "pos": 2, "section": 0, "topic": "Cardiology", "question": "A child with AVSD has an elongated narrowed left ventricular outflow tract on angiography, described as a gooseneck deformity. What anatomic relationship explains the appearance?", "options": ["Isolated coronary sinus dilation", "Only aortic coarctation without AV junction abnormality", "Primary subpulmonary narrowing alone", "An unwedged aorta and elongated LV outflow tract related to AV junction anatomy"], "answer": 3, "explanation": "The AVSD gooseneck appearance reflects unwedged aortic position and elongated narrowed LVOT. Why not the others (added — not from source): A. Isolated coronary sinus dilation — A dilated coronary sinus is seen with a persistent left SVC or unroofed sinus and does not distort the LV outflow tract into a gooseneck shape.; B. Only aortic coarctation without AV junction abnormality — Coarctation narrows the aortic isthmus distal to the LVOT; the gooseneck sign arises from the abnormal AV junction itself, not from arch obstruction.; C. Primary subpulmonary narrowing alone — The gooseneck deformity is a left ventricular outflow appearance on LV angiography, not a feature of right-sided subpulmonary narrowing.", "pearl": "The AVSD gooseneck appearance reflects unwedged aortic position and elongated narrowed LVOT.", "note": "From Day 17 · Clinical/Application"}, {"num": 3, "pos": 3, "section": 0, "topic": "Neonatology", "question": "A 27-week infant has bounding pulses, wide pulse pressure, increasing ventilatory need and a large duct with left-to-right shunt on echo. Which assessment best determines whether PDA is clinically significant?", "options": ["Presence of murmur alone", "Integrated echocardiography plus clinical signs and systemic/pulmonary effects", "Duct diameter alone without physiology", "One BNP value regardless of context"], "answer": 1, "explanation": "Hemodynamic significance requires physiologic and clinical integration rather than duct size alone. Why not the others (added — not from source): A. Presence of murmur alone — A murmur may be absent with a large unrestrictive duct and present with a small insignificant one, so it cannot by itself establish haemodynamic significance.; C. Duct diameter alone without physiology — Duct diameter ignores shunt direction, pulmonary overcirculation and systemic steal; size must be interpreted alongside echo physiology and clinical effects.; D. One BNP value regardless of context — BNP or NT-proBNP is only a supportive marker influenced by age and other conditions; a single value cannot replace integrated clinical and echo assessment.", "pearl": "Hemodynamic significance requires physiologic and clinical integration rather than duct size alone.", "note": "From Day 9 · Conceptual"}, {"num": 4, "pos": 4, "section": 0, "topic": "Neonatology", "question": "A stable 32-week infant has repeated apnea with bradycardia during sleep; sepsis, hypoglycemia and electrolyte abnormalities have been assessed. The same infant later develops new abdominal distension and hypothermia with increasing apnea frequency. Best interpretation?", "options": ["Attribute all changes to feeding maturation", "Double caffeine and ignore systemic changes", "Stop monitoring because apnea is expected", "Investigate an intercurrent illness rather than assuming benign apnea"], "answer": 3, "explanation": "A changed apnea pattern with systemic signs can herald sepsis or NEC. Why not the others (added — not from source): A. Attribute all changes to feeding maturation — Feeding maturation does not explain new abdominal distension, hypothermia and worsening apnoea, which are warning signs of sepsis or NEC.; B. Double caffeine and ignore systemic changes — Escalating caffeine treats the symptom while missing a potentially life-threatening cause such as sepsis or NEC that needs urgent evaluation.; C. Stop monitoring because apnea is expected — A changing apnoea pattern with new systemic signs demands closer monitoring and investigation, not withdrawal of cardiorespiratory surveillance.", "pearl": "A changed apnea pattern with systemic signs can herald sepsis or NEC.", "note": "From Day 4 · Clinical/Application"}, {"num": 5, "pos": 5, "section": 0, "topic": "Neonatology", "question": "A preterm infant receives D12.5 at 96 mL/kg/day through a suitable IV line. What is the approximate glucose infusion rate?", "options": ["3.6 mg/kg/min", "8.3 mg/kg/min", "12.5 mg/kg/min", "5.8 mg/kg/min"], "answer": 1, "explanation": "GIR = dextrose percent times fluid mL/kg/day divided by 144; 12.5 times 96 /144 = 8.33. Why not the others (added — not from source): A. 3.6 mg/kg/min — This underestimates the rate; it would correspond to roughly D5 at the given volume, not D12.5 at 96 mL/kg/day.; C. 12.5 mg/kg/min — This simply equates the dextrose percentage with the GIR and omits the fluid-volume conversion factor of 144.; D. 5.8 mg/kg/min — This figure does not follow from the formula; 12.5 x 96 / 144 gives about 8.3 mg/kg/min.", "pearl": "GIR = dextrose percent times fluid mL/kg/day divided by 144; 12.5 times 96 /144 = 8.33.", "note": "From Day 10 · Conceptual"}, {"num": 6, "pos": 6, "section": 0, "topic": "Cardiology", "question": "A neonate has persistent complete AV block; mother has anti-Ro/SSA antibodies and no major structural defect is found. Most likely mechanism?", "options": ["Accessory pathway reentry", "Isolated hypocalcemia as the only cause", "Immune-mediated injury to fetal AV conduction tissue", "Normal transient sinus bradycardia"], "answer": 2, "explanation": "Maternal anti-Ro/SSA antibodies can cause congenital AV block through immune-mediated conduction-system injury. Why not the others (added — not from source): A. Accessory pathway reentry — Accessory pathway re-entry produces tachyarrhythmias such as SVT, not persistent bradycardia from complete AV block.; B. Isolated hypocalcemia as the only cause — Hypocalcaemia may prolong QTc but does not cause persistent complete heart block; the maternal anti-Ro history points to immune injury.; D. Normal transient sinus bradycardia — Sinus bradycardia preserves 1:1 AV conduction, whereas complete AV block shows AV dissociation that persists rather than resolving.", "pearl": "Maternal anti-Ro/SSA antibodies can cause congenital AV block through immune-mediated conduction-system injury.", "note": "From Day 21 · Conceptual"}, {"num": 7, "pos": 7, "section": 0, "topic": "Cardiology", "question": "An adolescent with known WPW has irregular wide-complex tachycardia consistent with pre-excited atrial fibrillation. Which drug class should be avoided?", "options": ["Expert electrophysiology consultation", "Synchronized cardioversion when unstable", "Appropriate procainamide in stable patient per specialist protocol", "AV nodal blockers such as verapamil or adenosine"], "answer": 3, "explanation": "AV nodal blockade can favor conduction through accessory pathway in pre-excited AF and precipitate VF. Why not the others (added — not from source): A. Expert electrophysiology consultation — Electrophysiology input is appropriate for pre-excited AF and later ablation planning; it is not a drug class to be avoided.; B. Synchronized cardioversion when unstable — Synchronised cardioversion is the recommended treatment when pre-excited AF causes haemodynamic instability.; C. Appropriate procainamide in stable patient per specialist protocol — Procainamide slows accessory pathway conduction and is an accepted option for stable pre-excited AF under specialist guidance.", "pearl": "AV nodal blockade can favor conduction through accessory pathway in pre-excited AF and precipitate VF.", "note": "From Day 21 · High-difficulty"}, {"num": 8, "pos": 8, "section": 0, "topic": "Neonatology", "question": "A 2-day-old preterm infant develops temperature instability, lethargy, delayed capillary refill and recurrent apnea. What is the priority diagnostic specimen before empiric antibiotics if this does not delay treatment?", "options": ["Single CRP as a definitive test", "Routine stool culture only", "Adequate-volume blood culture", "Blood film for malaria alone"], "answer": 2, "explanation": "Blood culture is the principal microbiological test; obtain promptly without delaying treatment of an unstable infant. Why not the others (added — not from source): A. Single CRP as a definitive test — CRP is nonspecific and rises late; it supports decisions about duration of therapy but cannot confirm or exclude neonatal sepsis.; B. Routine stool culture only — Stool culture has no role in the initial evaluation of suspected early-onset neonatal sepsis.; D. Blood film for malaria alone — Congenital malaria is rare and a blood film alone does not address the far more likely bacterial sepsis requiring blood culture.", "pearl": "Blood culture is the principal microbiological test; obtain promptly without delaying treatment of an unstable infant.", "note": "From Day 5 · Clinical/Application"}, {"num": 9, "pos": 9, "section": 0, "topic": "Cardiology", "question": "An adolescent with known WPW has irregular wide-complex tachycardia consistent with pre-excited atrial fibrillation. What is preferred if the patient becomes hypotensive and confused?", "options": ["Repeated adenosine boluses", "Observation until rhythm regularizes", "Immediate synchronized cardioversion", "High-dose digoxin"], "answer": 2, "explanation": "Unstable pre-excited AF requires prompt electrical cardioversion. Why not the others (added — not from source): A. Repeated adenosine boluses — Adenosine is ineffective for AF and AV nodal blockade can accelerate accessory pathway conduction, risking ventricular fibrillation.; B. Observation until rhythm regularizes — Haemodynamic instability with hypotension and confusion requires immediate cardioversion; waiting risks degeneration to VF and arrest.; D. High-dose digoxin — Digoxin shortens accessory pathway refractoriness and blocks the AV node, which can precipitate VF in pre-excited AF.", "pearl": "Unstable pre-excited AF requires prompt electrical cardioversion.", "note": "From Day 21 · Basic-but-easily-confused"}, {"num": 10, "pos": 10, "section": 0, "topic": "Cardiology", "question": "A 3-day-old with cyanosis has a single loud S2, poor response to oxygen and echo is pending. Which bedside observation raises concern for duct-dependent pulmonary flow?", "options": ["Stable normal saturation after duct closure", "Normal pulses and saturation in all limbs", "Isolated feeding regurgitation", "Worsening cyanosis as the ductus constricts"], "answer": 3, "explanation": "Ductal closure can critically reduce pulmonary flow in selected cyanotic lesions. Why not the others (added — not from source): A. Stable normal saturation after duct closure — Stable normal saturation after ductal closure argues against duct-dependent pulmonary flow rather than raising concern for it.; B. Normal pulses and saturation in all limbs — Normal and equal saturations and pulses are reassuring and do not suggest dependence on the ductus for pulmonary blood flow.; C. Isolated feeding regurgitation — Isolated regurgitation is a common nonspecific finding and does not reflect reduced pulmonary blood flow with ductal constriction.", "pearl": "Ductal closure can critically reduce pulmonary flow in selected cyanotic lesions.", "note": "From Day 21 · Clinical/Application"}, {"num": 11, "pos": 11, "section": 0, "topic": "Neurology", "question": "A 6-year-old has multiple seizure types, cognitive impairment and EEG with generalized slow spike-wave under 2.5 Hz. Which feature helps distinguish LGS from typical absence epilepsy?", "options": ["Normal cognition with 3-Hz spike-wave", "Onset only in adolescence with myoclonic jerks", "Brief isolated staring without falls", "Tonic/drop attacks with developmental impairment"], "answer": 3, "explanation": "Tonic and atonic seizures plus cognitive impairment favor LGS over typical absence. Why not the others (added — not from source): A. Normal cognition with 3-Hz spike-wave — Normal cognition with 3-Hz spike-wave characterises typical childhood absence epilepsy, not Lennox-Gastaut syndrome.; B. Onset only in adolescence with myoclonic jerks — Adolescent-onset myoclonic jerks suggest juvenile myoclonic epilepsy; LGS typically begins between about 3 and 5 years.; C. Brief isolated staring without falls — Brief isolated staring without falls fits typical absences, whereas LGS is defined by tonic and atonic seizures with drop attacks.", "pearl": "Tonic and atonic seizures plus cognitive impairment favor LGS over typical absence.", "note": "From Day 22 · Clinical/Application"}, {"num": 12, "pos": 12, "section": 0, "topic": "Neonatology", "question": "A term newborn is apneic after drying and positioning; auscultated heart rate is 74/min. Which action should start without delay?", "options": ["Umbilical venous epinephrine", "Chest compressions", "Positive-pressure ventilation", "Observation for another minute"], "answer": 2, "explanation": "Apnea and HR below 100/min after initial steps require effective ventilation, not compressions or medication first. Why not the others (added — not from source): A. Umbilical venous epinephrine — Epinephrine is indicated only if heart rate stays below 60/min despite 30 seconds of compressions with effective ventilation.; B. Chest compressions — Compressions start only when heart rate remains below 60/min after 30 seconds of effective ventilation, and here it is 74/min.; D. Observation for another minute — Apnoea with heart rate below 100/min after initial steps mandates PPV within the first minute; delay worsens hypoxia.", "pearl": "Apnea and HR below 100/min after initial steps require effective ventilation, not compressions or medication first.", "note": "From Day 1 · Clinical/Application"}, {"num": 13, "pos": 13, "section": 0, "topic": "Neonatology", "question": "A 38-week newborn after elective cesarean has tachypnea at 2 hours, mild oxygen need, hyperinflation and fissural fluid on chest radiograph. What diagnosis best explains the pattern?", "options": ["Congenital lobar overinflation", "Pulmonary interstitial emphysema", "Transient tachypnea of newborn", "Surfactant-deficient RDS"], "answer": 2, "explanation": "Elective cesarean, hyperinflation and fissural fluid favor delayed fetal lung-fluid clearance. Why not the others (added — not from source): A. Congenital lobar overinflation — Congenital lobar overinflation causes focal hyperlucency of one lobe with mediastinal shift, not bilateral hyperinflation with fissural fluid.; B. Pulmonary interstitial emphysema — Pulmonary interstitial emphysema is a complication of ventilated, usually preterm, lungs and is not expected in a term infant with mild oxygen need.; D. Surfactant-deficient RDS — Surfactant-deficient RDS shows low lung volumes with ground-glass and air bronchograms, not hyperinflation, and is uncommon at 38 weeks.", "pearl": "Elective cesarean, hyperinflation and fissural fluid favor delayed fetal lung-fluid clearance.", "note": "From Day 2 · Integrated/Rank-differentiating"}, {"num": 14, "pos": 14, "section": 0, "topic": "Growth/Genetics", "question": "A 5-year-old has impulsivity and inattention at home and school with academic and social impairment. Which feature is necessary for an ADHD diagnosis?", "options": ["Inattention during a single classroom test", "Normal behavior at home as proof of ADHD", "A positive teacher scale without clinical assessment", "Symptoms and impairment in more than one setting with appropriate evaluation"], "answer": 3, "explanation": "ADHD requires persistent symptoms with functional impairment across settings and differential assessment. Why not the others (added — not from source): A. Inattention during a single classroom test — Inattention in a single situation does not meet DSM-5 criteria, which require persistent symptoms for at least six months across settings.; B. Normal behavior at home as proof of ADHD — Normal behaviour at home argues against ADHD, because symptoms must be present in two or more settings.; C. A positive teacher scale without clinical assessment — Rating scales support but do not establish the diagnosis; clinical assessment and exclusion of differentials are required.", "pearl": "ADHD requires persistent symptoms with functional impairment across settings and differential assessment.", "note": "From Day 13 · Conceptual"}, {"num": 15, "pos": 15, "section": 0, "topic": "Neonatology", "question": "A preterm infant receives D12.5 at 96 mL/kg/day through a suitable IV line. If target GIR is 8 mg/kg/min at 96 mL/kg/day, what dextrose concentration is needed?", "options": ["D12", "D5", "D15", "D8"], "answer": 0, "explanation": "Dextrose % = GIR times 144 divided by fluid rate = 8 times 144/96 = 12%. Why not the others (added — not from source): B. D5 — D5 at 96 mL/kg/day gives only about 3.3 mg/kg/min, far below the target GIR of 8.; C. D15 — D15 at 96 mL/kg/day gives about 10 mg/kg/min, overshooting the target and risking hyperglycaemia.; D. D8 — This confuses the GIR value with the dextrose concentration; D8 at this volume yields only about 5.3 mg/kg/min.", "pearl": "Dextrose % = GIR times 144 divided by fluid rate = 8 times 144/96 = 12%.", "note": "From Day 10 · Clinical/Application"}, {"num": 16, "pos": 16, "section": 0, "topic": "Neonatology", "question": "A preterm infant with known NEC develops free intraperitoneal air and worsening shock. Which approach best handles the unstable infant while surgery is organized?", "options": ["Delay all intervention until cultures finalize", "Give laxatives to reduce distension", "Immediate full-volume enteral feeds", "Resuscitation, broad-spectrum antimicrobial coverage and urgent surgical coordination"], "answer": 3, "explanation": "Resuscitation and infection control accompany urgent surgical management. Why not the others (added — not from source): A. Delay all intervention until cultures finalize — Free air with shock is an indication for urgent surgery; waiting for culture results delays resuscitation, antibiotics and source control.; B. Give laxatives to reduce distension — Laxatives are contraindicated in NEC; management requires bowel rest with gastric decompression, not stimulation of the gut.; C. Immediate full-volume enteral feeds — Perforated NEC requires nil by mouth with gastric decompression; enteral feeds would worsen ischaemic bowel injury.", "pearl": "Resuscitation and infection control accompany urgent surgical management.", "note": "From Day 8 · Integrated/Rank-differentiating"}, {"num": 17, "pos": 17, "section": 0, "topic": "Growth/Genetics", "question": "A 12-year-old boy has height at the 2nd centile, delayed bone age, normal growth velocity and family history of late puberty. Which pattern is most likely?", "options": ["Constitutional delay of growth and puberty", "Severe primary hypothyroidism", "Chronic renal disease with growth deceleration", "Growth hormone deficiency with falling velocity"], "answer": 0, "explanation": "Normal growth velocity with delayed bone age and delayed family pubertal pattern favors constitutional delay. Why not the others (added — not from source): B. Severe primary hypothyroidism — Severe hypothyroidism usually causes declining growth velocity, with markedly delayed bone age and other hypothyroid features.; C. Chronic renal disease with growth deceleration — Chronic kidney disease causes growth deceleration with falling velocity, unlike the normal velocity described here.; D. Growth hormone deficiency with falling velocity — GH deficiency is characterised by subnormal growth velocity crossing centiles downward, which this boy does not show.", "pearl": "Normal growth velocity with delayed bone age and delayed family pubertal pattern favors constitutional delay.", "note": "From Day 13 · Integrated/Rank-differentiating"}, {"num": 18, "pos": 18, "section": 0, "topic": "Neonatology", "question": "A ventilated 28-week infant has pH 7.20, PaCO2 68 mmHg, bicarbonate 25 mmol/L and acceptable PaO2. Which ventilator adjustment most directly increases CO2 elimination if mechanics permit?", "options": ["Decrease tidal volume without changing rate", "Increase effective alveolar minute ventilation", "Increase FiO2 alone", "Lower alveolar ventilation"], "answer": 1, "explanation": "CO2 elimination tracks effective alveolar ventilation; oxygen fraction chiefly affects oxygenation. Why not the others (added — not from source): A. Decrease tidal volume without changing rate — Reducing tidal volume lowers alveolar ventilation, because dead space is fixed, and would further increase PaCO2.; C. Increase FiO2 alone — FiO2 influences oxygenation, which is already acceptable, and has no direct effect on CO2 clearance.; D. Lower alveolar ventilation — Lowering alveolar ventilation would raise PaCO2 further and worsen the respiratory acidosis.", "pearl": "CO2 elimination tracks effective alveolar ventilation; oxygen fraction chiefly affects oxygenation.", "note": "From Day 3 · Basic-but-easily-confused"}, {"num": 19, "pos": 19, "section": 0, "topic": "Neonatology", "question": "A 36-hour-old term infant has rapidly rising unconjugated bilirubin, maternal-infant ABO incompatibility, positive DAT and reticulocytosis. What is the most likely mechanism?", "options": ["Breast-milk jaundice beginning after week 2", "Obstructive cholestasis", "Physiological jaundice alone", "Immune hemolysis"], "answer": 3, "explanation": "DAT positivity with reticulocytosis and early rapid rise supports isoimmune hemolysis. Why not the others (added — not from source): A. Breast-milk jaundice beginning after week 2 — Breast-milk jaundice appears after the first week, is DAT-negative and does not cause reticulocytosis or a rapid rise at 36 hours.; B. Obstructive cholestasis — Obstructive cholestasis produces conjugated hyperbilirubinaemia, not a rapidly rising unconjugated level with a positive DAT.; C. Physiological jaundice alone — Physiological jaundice is not DAT-positive, rarely rises rapidly in the first 36 hours and is not associated with reticulocytosis.", "pearl": "DAT positivity with reticulocytosis and early rapid rise supports isoimmune hemolysis.", "note": "From Day 6 · Clinical/Application"}, {"num": 20, "pos": 20, "section": 0, "topic": "Growth/Genetics", "question": "A 5-day-old neonate has ammonia 650 umol/L, respiratory alkalosis, very low citrulline and high urinary orotic acid. Which enzyme deficiency is most likely?", "options": ["Carbamoyl phosphate synthetase 1 deficiency", "Argininosuccinate synthetase deficiency", "Ornithine transcarbamylase deficiency", "NAGS deficiency"], "answer": 2, "explanation": "OTC deficiency produces low citrulline and increased urinary orotic acid from diverted carbamoyl phosphate. Why not the others (added — not from source): A. Carbamoyl phosphate synthetase 1 deficiency — CPS1 deficiency also gives low citrulline, but urinary orotic acid is low or normal because carbamoyl phosphate is not formed.; B. Argininosuccinate synthetase deficiency — Argininosuccinate synthetase deficiency (citrullinaemia type 1) produces markedly elevated, not low, citrulline.; D. NAGS deficiency — NAGS deficiency mimics CPS1 deficiency, with low citrulline and normal or low orotic acid, unlike the high orotic acid here.", "pearl": "OTC deficiency produces low citrulline and increased urinary orotic acid from diverted carbamoyl phosphate.", "note": "From Day 15 · Basic-but-easily-confused"}, {"num": 21, "pos": 21, "section": 0, "topic": "Cardiology", "question": "A neonate has persistent complete AV block; mother has anti-Ro/SSA antibodies and no major structural defect is found. Which fetal finding may be detected prenatally in this condition?", "options": ["Sustained fetal bradycardia with AV dissociation", "Persistent fetal tachycardia from AVNRT", "Normal AV conduction with 1:1 atrial ventricular rate in all cases", "Transient hiccups only"], "answer": 0, "explanation": "Congenital complete heart block causes atrial-ventricular dissociation and fetal bradycardia. Why not the others (added — not from source): B. Persistent fetal tachycardia from AVNRT — AVNRT-type tachycardia is the opposite of the heart block caused by maternal anti-Ro antibodies, which produces fetal bradycardia.; C. Normal AV conduction with 1:1 atrial ventricular rate in all cases — Complete heart block by definition disrupts 1:1 AV conduction, producing independent atrial and ventricular rates.; D. Transient hiccups only — Fetal hiccups are a normal finding and are not a marker of immune-mediated conduction disease.", "pearl": "Congenital complete heart block causes atrial-ventricular dissociation and fetal bradycardia.", "note": "From Day 21 · Conceptual"}, {"num": 22, "pos": 22, "section": 0, "topic": "Growth/Genetics", "question": "A girl previously used two-word phrases and social gestures at 18 months but loses purposeful hand skills and develops hand-wringing at 30 months. Which diagnosis is particularly suggested?", "options": ["Isolated expressive language delay", "Rett syndrome", "Typical variation in toddler development", "Specific learning disorder"], "answer": 1, "explanation": "Regression with stereotyped hand-wringing in a girl suggests Rett syndrome. Why not the others (added — not from source): A. Isolated expressive language delay — Isolated expressive language delay does not involve regression of acquired skills or loss of purposeful hand use.; C. Typical variation in toddler development — Loss of previously acquired language and hand skills is never typical development and always needs evaluation.; D. Specific learning disorder — Specific learning disorder is diagnosed at school age and does not cause early regression or hand stereotypies.", "pearl": "Regression with stereotyped hand-wringing in a girl suggests Rett syndrome.", "note": "From Day 14 · Integrated/Rank-differentiating"}, {"num": 23, "pos": 23, "section": 0, "topic": "Growth/Genetics", "question": "A 20-month-old has bilateral pitting pedal edema, visible wasting, poor appetite and recurrent infections. Which care principle is most appropriate if this child is clinically complicated?", "options": ["Aggressive high-sodium IV fluids without shock", "Immediate high-protein catch-up feeding without stabilization", "Initial stabilization with careful feeds, temperature and infection assessment before catch-up rehabilitation", "Routine diuretics for nutritional edema"], "answer": 2, "explanation": "Complicated SAM requires stabilization first; rapid catch-up feeding belongs to rehabilitation. Why not the others (added — not from source): A. Aggressive high-sodium IV fluids without shock — Children with SAM have sodium retention and impaired cardiac reserve; IV fluids are reserved for shock and given cautiously.; B. Immediate high-protein catch-up feeding without stabilization — Aggressive early feeding before stabilisation risks refeeding syndrome, heart failure and death in complicated SAM.; D. Routine diuretics for nutritional edema — Nutritional oedema resolves with dietary treatment; diuretics are contraindicated as they worsen electrolyte depletion.", "pearl": "Complicated SAM requires stabilization first; rapid catch-up feeding belongs to rehabilitation.", "note": "From Day 13 · Integrated/Rank-differentiating"}, {"num": 24, "pos": 24, "section": 0, "topic": "Growth/Genetics", "question": "A 20-month-old has bilateral pitting pedal edema, visible wasting, poor appetite and recurrent infections. Which nutritional diagnosis is supported?", "options": ["Normal toddler body composition", "Obesity with hypoalbuminemia from overeating", "Moderate acute malnutrition without complication", "Severe acute malnutrition with nutritional edema"], "answer": 3, "explanation": "Bilateral nutritional edema qualifies as SAM irrespective of weight-for-height measurement. Why not the others (added — not from source): A. Normal toddler body composition — Bilateral pitting pedal oedema with wasting is always pathological and never part of normal toddler body composition.; B. Obesity with hypoalbuminemia from overeating — Visible wasting, poor appetite and recurrent infections indicate undernutrition, not obesity from overeating.; C. Moderate acute malnutrition without complication — Any bilateral pitting oedema of nutritional origin classifies the child as SAM, not moderate acute malnutrition.", "pearl": "Bilateral nutritional edema qualifies as SAM irrespective of weight-for-height measurement.", "note": "From Day 13 · High-difficulty"}, {"num": 25, "pos": 25, "section": 0, "topic": "Growth/Genetics", "question": "A toddler has lethargy and hypoketotic hypoglycemia after overnight fasting; acylcarnitine profile shows predominant C8 elevation. Most likely disorder?", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Very-long-chain acyl-CoA dehydrogenase deficiency", "Propionic acidemia", "Maple syrup urine disease"], "answer": 0, "explanation": "C8 octanoylcarnitine elevation with fasting hypoketotic hypoglycemia is classic for MCAD deficiency. Why not the others (added — not from source): B. Very-long-chain acyl-CoA dehydrogenase deficiency — VLCAD deficiency elevates long-chain species such as C14:1 and often causes cardiomyopathy and rhabdomyolysis, not predominant C8.; C. Propionic acidemia — Propionic acidaemia raises propionylcarnitine (C3) with metabolic acidosis, ketosis and hyperammonaemia rather than hypoketotic hypoglycaemia.; D. Maple syrup urine disease — MSUD shows raised branched-chain amino acids and alloisoleucine with a characteristic odour, not a C8 acylcarnitine elevation.", "pearl": "C8 octanoylcarnitine elevation with fasting hypoketotic hypoglycemia is classic for MCAD deficiency.", "note": "From Day 15 · Conceptual"}, {"num": 26, "pos": 26, "section": 0, "topic": "Cardiology", "question": "A child has suspected pulmonary arterial hypertension on echocardiography with elevated RV pressure and septal flattening. Which study definitively characterizes pulmonary vascular hemodynamics when indicated?", "options": ["Cardiac catheterization with hemodynamic assessment", "Serum BNP alone", "Pulse oximetry alone", "Chest radiograph alone"], "answer": 0, "explanation": "Catheterization provides direct pressure, resistance and vasoreactivity information when appropriate. Why not the others (added — not from source): B. Serum BNP alone — BNP reflects ventricular strain and helps follow trends but cannot measure pulmonary pressures, resistance or vasoreactivity.; C. Pulse oximetry alone — Pulse oximetry only measures saturation and cannot quantify pulmonary artery pressure or vascular resistance.; D. Chest radiograph alone — A chest radiograph may show cardiomegaly or prominent pulmonary arteries but gives no haemodynamic measurement.", "pearl": "Catheterization provides direct pressure, resistance and vasoreactivity information when appropriate.", "note": "From Day 20 · High-difficulty"}, {"num": 27, "pos": 27, "section": 0, "topic": "Cardiology", "question": "A 6-year-old has regular narrow-complex tachycardia at 220/min, is alert, well perfused and has no pre-excitation on the tachycardia tracing. What is a suitable initial treatment?", "options": ["Routine IV amiodarone before vagal maneuvers", "Vagal maneuver followed by rapid IV adenosine if needed", "Immediate unsynchronized defibrillation", "Oral digoxin for acute conversion"], "answer": 1, "explanation": "Stable regular narrow-complex SVT is managed with vagal maneuvers and adenosine when appropriate. Why not the others (added — not from source): A. Routine IV amiodarone before vagal maneuvers — Amiodarone is reserved for refractory SVT under expert guidance; it is not used before vagal manoeuvres and adenosine in a stable child.; C. Immediate unsynchronized defibrillation — Unsynchronised defibrillation is for pulseless VT or VF; a stable child with SVT does not need electrical therapy first.; D. Oral digoxin for acute conversion — Oral digoxin acts slowly, is unsuitable for acute conversion and is avoided when pre-excitation has not been excluded.", "pearl": "Stable regular narrow-complex SVT is managed with vagal maneuvers and adenosine when appropriate.", "note": "From Day 21 · Clinical/Application"}, {"num": 28, "pos": 28, "section": 0, "topic": "Growth/Genetics", "question": "A 2-year-old has bowing, widened wrists, elevated alkaline phosphatase, low phosphate and elevated PTH. Which laboratory finding would favor X-linked hypophosphatemia instead?", "options": ["Markedly raised PTH with severe low vitamin D", "Acute hypercalcemia after trauma", "Persistent renal phosphate wasting with normal calcium and no secondary hyperparathyroid pattern", "Very high 25-OH vitamin D"], "answer": 2, "explanation": "XLH is driven by FGF23-mediated renal phosphate loss rather than nutritional calcium deprivation. Why not the others (added — not from source): A. Markedly raised PTH with severe low vitamin D — Marked hyperparathyroidism with low 25-OH vitamin D indicates nutritional rickets, which is the pattern XLH lacks.; B. Acute hypercalcemia after trauma — Acute hypercalcaemia after trauma reflects immobilisation or other causes and is not a feature of any form of rickets.; D. Very high 25-OH vitamin D — Very high 25-OH vitamin D suggests excess supplementation and does not distinguish XLH, where 25-OH D is usually normal.", "pearl": "XLH is driven by FGF23-mediated renal phosphate loss rather than nutritional calcium deprivation.", "note": "From Day 14 · Clinical/Application"}, {"num": 29, "pos": 29, "section": 0, "topic": "Cardiology", "question": "Echocardiography shows primum ASD, a small restrictive inlet VSD and two distinct atrioventricular valve orifices. What AVSD type is present?", "options": ["Partial AVSD without VSD", "Intermediate/transitional AVSD", "Complete AVSD with a common AV valve", "Isolated secundum ASD"], "answer": 1, "explanation": "Intermediate AVSD has a small inlet VSD with separate AV valve orifices. Why not the others (added — not from source): A. Partial AVSD without VSD — A partial AVSD has a primum ASD with two AV valve orifices but no ventricular-level shunt, whereas a small inlet VSD is present here.; C. Complete AVSD with a common AV valve — A complete AVSD has a single common AV valve orifice and usually a large unrestrictive inlet VSD.; D. Isolated secundum ASD — A secundum ASD lies in the fossa ovalis region and lacks the AV junction abnormality and inlet VSD described.", "pearl": "Intermediate AVSD has a small inlet VSD with separate AV valve orifices.", "note": "From Day 17 · Clinical/Application"}, {"num": 30, "pos": 30, "section": 0, "topic": "Neonatology", "question": "An intubated neonate suddenly desaturates, becomes hypotensive and has absent breath sounds on the right with asymmetric chest expansion. What should be suspected immediately?", "options": ["Tension pneumothorax", "Evolving BPD", "Physiological ductal shunting", "Uncomplicated TTN"], "answer": 0, "explanation": "Sudden collapse with unilateral loss of air entry on ventilation suggests tension pneumothorax. Why not the others (added — not from source): B. Evolving BPD — BPD evolves gradually over weeks and does not cause sudden collapse with unilateral absent breath sounds.; C. Physiological ductal shunting — Physiological ductal shunting does not cause sudden desaturation, hypotension or unilateral loss of air entry.; D. Uncomplicated TTN — TTN is a mild self-limiting condition of the first hours and does not produce acute unilateral signs or haemodynamic collapse.", "pearl": "Sudden collapse with unilateral loss of air entry on ventilation suggests tension pneumothorax.", "note": "From Day 3 · Clinical/Application"}, {"num": 31, "pos": 31, "section": 0, "topic": "Neonatology", "question": "A 3-day-old term infant loses 9% of birth weight and has serum sodium 158 mmol/L after poor milk transfer. Which monitoring is essential during correction?", "options": ["Bilirubin without electrolytes", "Only urine color once daily", "Serial sodium, fluid balance, weight and neurologic status", "No repeat sodium until discharge"], "answer": 2, "explanation": "Controlled correction and close sodium monitoring reduce risk of cerebral edema and seizures. Why not the others (added — not from source): A. Bilirubin without electrolytes — Bilirubin may matter for a poorly fed infant, but omitting serial sodium misses the key risk of too-rapid correction.; B. Only urine color once daily — Urine colour is a crude hydration marker and cannot guide safe sodium correction or detect neurological complications.; D. No repeat sodium until discharge — Hypernatraemic dehydration needs frequent sodium checks during correction, typically aiming for a fall of no more than about 10-12 mmol/L per day.", "pearl": "Controlled correction and close sodium monitoring reduce risk of cerebral edema and seizures.", "note": "From Day 10 · High-difficulty"}, {"num": 32, "pos": 32, "section": 0, "topic": "Neonatology", "question": "At 60 hours of age an infant has recurrent plasma glucose 40 mg/dL despite adequate feeds; hyperinsulinism is suspected. What should be obtained during a documented low plasma glucose episode when feasible?", "options": ["Critical sample including ketones, free fatty acids, insulin and counter-regulatory measures", "Random urine glucose after correction", "A fasting insulin sample days later when euglycemic", "Only HbA1c"], "answer": 0, "explanation": "A critical sample at hypoglycemia is essential to identify hyperinsulinism and metabolic/endocrine causes. Why not the others (added — not from source): B. Random urine glucose after correction — Urine glucose after correction gives no information about the hormonal or metabolic state at the moment of hypoglycaemia.; C. A fasting insulin sample days later when euglycemic — Insulin measured during euglycaemia is uninterpretable, because hyperinsulinism is defined by inappropriate insulin when glucose is low.; D. Only HbA1c — HbA1c reflects average glycaemia and is unreliable in neonates with high fetal haemoglobin; it cannot diagnose hyperinsulinism.", "pearl": "A critical sample at hypoglycemia is essential to identify hyperinsulinism and metabolic/endocrine causes.", "note": "From Day 10 · Clinical/Application"}, {"num": 33, "pos": 33, "section": 0, "topic": "Neurology", "question": "An infant develops prolonged fever-triggered hemiclonic seizures in the first year and later multiple seizure types; SCN1A-related Dravet syndrome is suspected. What clinical history supports Dravet over uncomplicated simple febrile seizures?", "options": ["Single 2-minute generalized febrile seizure at age 4 years", "Normal EEG after one simple febrile seizure", "Prolonged focal/hemiclonic fever-triggered seizures beginning in infancy with evolving epilepsy", "No seizures outside a single febrile illness"], "answer": 2, "explanation": "Early prolonged hemiclonic febrile events followed by multiple seizure types suggest Dravet. Why not the others (added — not from source): A. Single 2-minute generalized febrile seizure at age 4 years — A single brief generalised febrile seizure at 4 years with no sequelae is a simple febrile seizure, not Dravet syndrome.; B. Normal EEG after one simple febrile seizure — A normal EEG after a single simple febrile seizure is expected and does not point towards Dravet syndrome.; D. No seizures outside a single febrile illness — Dravet syndrome is defined by recurrent seizures that later occur without fever, so a single febrile event argues against it.", "pearl": "Early prolonged hemiclonic febrile events followed by multiple seizure types suggest Dravet.", "note": "From Day 22 · Integrated/Rank-differentiating"}, {"num": 34, "pos": 34, "section": 0, "topic": "Neonatology", "question": "Cranial ultrasound of a very preterm infant shows intraventricular hemorrhage with ventricular dilatation but no parenchymal lesion. Weeks later MRI shows bilateral periventricular white-matter injury with cyst formation. Most likely sequela?", "options": ["Spastic diplegic cerebral palsy", "Pure isolated conductive hearing loss", "Biliary atresia", "Hypertrophic cardiomyopathy"], "answer": 0, "explanation": "Periventricular leukomalacia injures descending motor tracts to lower limbs, predisposing to spastic diplegia. Why not the others (added — not from source): B. Pure isolated conductive hearing loss — Periventricular white-matter injury affects motor tracts, not the middle ear; conductive hearing loss is unrelated.; C. Biliary atresia — Biliary atresia is a hepatobiliary condition with no link to preterm white-matter injury.; D. Hypertrophic cardiomyopathy — Hypertrophic cardiomyopathy is a cardiac disorder and not a sequela of periventricular leukomalacia.", "pearl": "Periventricular leukomalacia injures descending motor tracts to lower limbs, predisposing to spastic diplegia.", "note": "From Day 11 · Clinical/Application"}, {"num": 35, "pos": 35, "section": 0, "topic": "Neurology", "question": "A 7-year-old has brief morning staring spells, abrupt behavioral arrest, eyelid flutter and immediate recovery; EEG shows generalized 3-Hz spike-wave. Most likely syndrome?", "options": ["Childhood absence epilepsy", "Benign sleep myoclonus", "Focal impaired-awareness epilepsy", "Lennox-Gastaut syndrome"], "answer": 0, "explanation": "Typical absence seizures cause brief abrupt impairment with 3-Hz generalized spike-wave and rapid recovery. Why not the others (added — not from source): B. Benign sleep myoclonus — Benign neonatal sleep myoclonus occurs in neonates during sleep with a normal EEG, not as daytime staring in a 7-year-old.; C. Focal impaired-awareness epilepsy — Focal impaired-awareness seizures last longer, may have automatisms and postictal confusion, and show focal rather than 3-Hz generalised discharges.; D. Lennox-Gastaut syndrome — LGS shows slow spike-wave below 2.5 Hz with tonic and atonic seizures and cognitive impairment, unlike this presentation.", "pearl": "Typical absence seizures cause brief abrupt impairment with 3-Hz generalized spike-wave and rapid recovery.", "note": "From Day 22 · Conceptual"}, {"num": 36, "pos": 36, "section": 0, "topic": "Neurology", "question": "A child with prolonged convulsive status has already received two appropriately dosed benzodiazepines and an adequate second-line antiseizure load; convulsions persist. How should the episode now be approached?", "options": ["Simple febrile seizure needing discharge", "Refractory status epilepticus requiring ICU-level airway and anesthetic planning", "Benign sleep myoclonus", "Typical absence epilepsy requiring ethosuximide only"], "answer": 1, "explanation": "Ongoing seizures after first- and second-line therapy indicate refractory status requiring intensive monitoring and further escalation. Why not the others (added — not from source): A. Simple febrile seizure needing discharge — Prolonged convulsions persisting after benzodiazepines and a second-line agent are an emergency, not a simple febrile seizure.; C. Benign sleep myoclonus — Benign sleep myoclonus is a non-epileptic neonatal phenomenon and does not cause refractory convulsive status.; D. Typical absence epilepsy requiring ethosuximide only — Typical absence epilepsy causes brief non-convulsive spells; ethosuximide has no role in convulsive status epilepticus.", "pearl": "Ongoing seizures after first- and second-line therapy indicate refractory status requiring intensive monitoring and further escalation.", "note": "From Day 23 · Conceptual"}, {"num": 37, "pos": 37, "section": 0, "topic": "Neonatology", "question": "A term infant with meconium aspiration has severe hypoxemia, differential pre/postductal saturations and echo showing elevated pulmonary pressures. What is the dominant physiology?", "options": ["Uncomplicated TTN", "Isolated ductal left-to-right steal", "Pure left-sided obstructive heart failure", "Persistent pulmonary hypertension with right-to-left shunting"], "answer": 3, "explanation": "High PVR with extrapulmonary right-to-left shunting causes hypoxemia and differential saturations. Why not the others (added — not from source): A. Uncomplicated TTN — TTN causes mild transient tachypnoea and does not produce severe hypoxaemia or differential pre- and postductal saturations.; B. Isolated ductal left-to-right steal — Left-to-right ductal shunting does not cause cyanosis or a lower postductal saturation, which requires right-to-left flow.; C. Pure left-sided obstructive heart failure — Left-sided obstruction typically causes poor systemic perfusion, and the echo here shows raised pulmonary pressures in a meconium setting.", "pearl": "High PVR with extrapulmonary right-to-left shunting causes hypoxemia and differential saturations.", "note": "From Day 9 · Clinical/Application"}, {"num": 38, "pos": 38, "section": 0, "topic": "Neurology", "question": "A 9-year-old has nocturnal focal facial twitching, speech arrest, drooling and centrotemporal spikes on EEG with normal development. Most likely epilepsy syndrome?", "options": ["Infantile epileptic spasms syndrome", "Self-limited epilepsy with centrotemporal spikes", "Childhood absence epilepsy", "Progressive myoclonic epilepsy"], "answer": 1, "explanation": "Nocturnal orofacial seizures and centrotemporal spikes suggest self-limited epilepsy with centrotemporal spikes. Why not the others (added — not from source): A. Infantile epileptic spasms syndrome — Infantile epileptic spasms occur in infancy with hypsarrhythmia and developmental regression, not in a developmentally normal 9-year-old.; C. Childhood absence epilepsy — Absence epilepsy causes brief daytime staring with generalised 3-Hz spike-wave, not nocturnal orofacial focal seizures.; D. Progressive myoclonic epilepsy — Progressive myoclonic epilepsies feature myoclonus with neurological and cognitive decline, unlike this normally developing child.", "pearl": "Nocturnal orofacial seizures and centrotemporal spikes suggest self-limited epilepsy with centrotemporal spikes.", "note": "From Day 22 · Clinical/Application"}, {"num": 39, "pos": 39, "section": 0, "topic": "Neonatology", "question": "An intubated neonate suddenly desaturates, becomes hypotensive and has absent breath sounds on the right with asymmetric chest expansion. The infant is unstable and bedside assessment supports tension pneumothorax. Best immediate action?", "options": ["Wait for an AP radiograph before treatment", "Administer surfactant before decompression", "Increase PEEP markedly", "Emergency pleural decompression without delaying for formal radiography"], "answer": 3, "explanation": "Hemodynamically compromising tension pneumothorax requires immediate decompression. Why not the others (added — not from source): A. Wait for an AP radiograph before treatment — Waiting for a radiograph in an unstable infant with clinical tension pneumothorax risks cardiac arrest; decompress first.; B. Administer surfactant before decompression — Surfactant does not relieve trapped pleural air and delays the decompression that is immediately needed.; C. Increase PEEP markedly — Increasing PEEP raises intrathoracic pressure and can enlarge the air leak, worsening venous return and hypotension.", "pearl": "Hemodynamically compromising tension pneumothorax requires immediate decompression.", "note": "From Day 3 · Clinical/Application"}, {"num": 40, "pos": 40, "section": 0, "topic": "Neurology", "question": "A child with a history of severe neonatal unconjugated hyperbilirubinemia develops involuntary twisting movements and auditory neuropathy. Which MRI distribution would be most consistent with kernicterus sequelae?", "options": ["Unilateral cortical infarct", "Periventricular cystic lesions only", "Globus pallidus/subthalamic nuclei signal abnormalities", "Diffuse cerebellar vermis atrophy only"], "answer": 2, "explanation": "Basal ganglia involvement, particularly globus pallidus, is typical of bilirubin neurotoxicity. Why not the others (added — not from source): A. Unilateral cortical infarct — A unilateral cortical infarct suggests perinatal arterial ischaemic stroke and hemiplegia, not bilirubin neurotoxicity.; B. Periventricular cystic lesions only — Periventricular cystic lesions indicate periventricular leukomalacia in preterm infants, not kernicterus.; D. Diffuse cerebellar vermis atrophy only — Kernicterus classically involves the globus pallidus and subthalamic nuclei; isolated vermis atrophy is not its typical pattern.", "pearl": "Basal ganglia involvement, particularly globus pallidus, is typical of bilirubin neurotoxicity.", "note": "From Day 24 · Clinical/Application"}, {"num": 41, "pos": 41, "section": 0, "topic": "Growth/Genetics", "question": "A newborn with hypotonia, upslanting palpebral fissures and a complete atrioventricular septal defect has suspected aneuploidy. Which cytogenetic study establishes the underlying chromosomal mechanism?", "options": ["Urinary organic acids alone", "Electroencephalography", "Serum TSH alone", "Chromosome analysis with karyotype and targeted studies when needed"], "answer": 3, "explanation": "Karyotyping distinguishes free trisomy from translocation or mosaicism and informs recurrence counseling. Why not the others (added — not from source): A. Urinary organic acids alone — Urinary organic acids screen for inborn errors of metabolism and cannot detect a chromosomal aneuploidy.; B. Electroencephalography — EEG assesses cortical electrical activity and has no role in identifying a chromosomal abnormality.; C. Serum TSH alone — TSH screens for congenital hypothyroidism, which is commoner in Down syndrome, but cannot establish the chromosomal mechanism.", "pearl": "Karyotyping distinguishes free trisomy from translocation or mosaicism and informs recurrence counseling.", "note": "From Day 15 · Integrated/Rank-differentiating"}, {"num": 42, "pos": 42, "section": 0, "topic": "Cardiology", "question": "A newborn has critical valvar aortic stenosis with poor systemic perfusion and left ventricular dysfunction. Which intervention preserves systemic circulation during stabilization?", "options": ["Give indomethacin to close the ductus", "Elective ASD device closure", "Routine inhaled nitric oxide alone", "Maintain ductal patency with PGE1"], "answer": 3, "explanation": "Critical left outflow obstruction may be duct-dependent for systemic flow. Why not the others (added — not from source): A. Give indomethacin to close the ductus — Closing the duct in duct-dependent systemic circulation removes the only route for systemic flow and precipitates shock.; B. Elective ASD device closure — Elective ASD closure would remove left atrial decompression and has no role in acute stabilisation of critical aortic stenosis.; C. Routine inhaled nitric oxide alone — Inhaled nitric oxide lowers pulmonary vascular resistance and can steal flow from the systemic circulation, without addressing the obstruction.", "pearl": "Critical left outflow obstruction may be duct-dependent for systemic flow.", "note": "From Day 19 · Integrated/Rank-differentiating"}, {"num": 43, "pos": 43, "section": 0, "topic": "Neonatology", "question": "A 29-week infant on CPAP 6 cm H2O has rising FiO2 requirement to 0.35 and a diffuse low-volume reticulogranular radiograph. Why is a thin-catheter technique attractive in this infant?", "options": ["It can deliver surfactant while avoiding routine invasive ventilation", "It eliminates all need for respiratory monitoring", "It is preferred only when the infant is apneic", "It treats pulmonary hypertension directly"], "answer": 0, "explanation": "Thin-catheter surfactant is preferred for spontaneously breathing preterm infants when expertise is available. Why not the others (added — not from source): B. It eliminates all need for respiratory monitoring — Thin-catheter administration still needs close monitoring for desaturation, bradycardia and reflux during and after the procedure.; C. It is preferred only when the infant is apneic — The technique is designed for spontaneously breathing infants on CPAP; apnoeic infants need intubation and ventilation.; D. It treats pulmonary hypertension directly — Surfactant treats surfactant deficiency; it is not a direct pulmonary vasodilator therapy for pulmonary hypertension.", "pearl": "Thin-catheter surfactant is preferred for spontaneously breathing preterm infants when expertise is available.", "note": "From Day 2 · Conceptual"}, {"num": 44, "pos": 44, "section": 0, "topic": "Growth/Genetics", "question": "A 5-year-old has impulsivity and inattention at home and school with academic and social impairment. For a child under 6 years with significant ADHD symptoms, what is a usual first-line approach?", "options": ["Long-term benzodiazepine treatment", "Parent-training behavioral management and environmental support", "Routine immediate stimulant therapy for all children", "Antiepileptic medication without seizures"], "answer": 1, "explanation": "Behavioral parent training and structured supports are emphasized first in preschool-aged children. Why not the others (added — not from source): A. Long-term benzodiazepine treatment — Benzodiazepines have no role in ADHD and can worsen disinhibition and attention, with dependence risk.; C. Routine immediate stimulant therapy for all children — In preschool children, stimulants are second-line, used only if behavioural therapy is insufficient and impairment is significant.; D. Antiepileptic medication without seizures — Antiepileptic drugs are not treatments for ADHD in the absence of seizures and carry cognitive and behavioural adverse effects.", "pearl": "Behavioral parent training and structured supports are emphasized first in preschool-aged children.", "note": "From Day 13 · Clinical/Application"}, {"num": 45, "pos": 45, "section": 0, "topic": "Cardiology", "question": "A 4-month-old with large VSD has pulmonary edema, hepatomegaly and feeding difficulty but adequate systemic perfusion. Which initial symptom-relief therapy is commonly used?", "options": ["Loop diuretic with nutritional support while planning definitive care", "Ductal closure with indomethacin as sole therapy", "Routine adenosine infusion", "Immediate high-dose beta agonist to increase shunt"], "answer": 0, "explanation": "Diuretics can reduce congestion while addressing nutrition and the underlying lesion. Why not the others (added — not from source): B. Ductal closure with indomethacin as sole therapy — Indomethacin closes the ductus arteriosus and has no effect on a VSD shunt in a 4-month-old.; C. Routine adenosine infusion — Adenosine is a short-acting antiarrhythmic for SVT and has no role in treating heart failure from a VSD.; D. Immediate high-dose beta agonist to increase shunt — Beta agonists do not treat left-to-right shunt failure, and increasing the shunt would worsen pulmonary overcirculation.", "pearl": "Diuretics can reduce congestion while addressing nutrition and the underlying lesion.", "note": "From Day 20 · Basic-but-easily-confused"}, {"num": 46, "pos": 46, "section": 0, "topic": "Neonatology", "question": "An infant at ROP screening has zone II stage 2 disease with definite plus disease. What is the ETROP classification?", "options": ["Stage 5 retinal detachment", "Type 1 ROP requiring prompt treatment evaluation", "Mature vascularization", "Type 2 ROP for routine long-interval review"], "answer": 1, "explanation": "Zone II stage 2 with plus disease meets Type 1 criteria. Why not the others (added — not from source): A. Stage 5 retinal detachment — Stage 5 denotes total retinal detachment, whereas this infant has stage 2 ridge disease.; C. Mature vascularization — Mature vascularisation means retinal vessels have reached the ora serrata with no active ROP, which is not the case here.; D. Type 2 ROP for routine long-interval review — Type 2 ROP is disease without plus (for example zone II stage 3); the presence of plus disease upgrades this to Type 1.", "pearl": "Zone II stage 2 with plus disease meets Type 1 criteria.", "note": "From Day 11 · Clinical/Application"}, {"num": 47, "pos": 47, "section": 0, "topic": "Cardiology", "question": "A 3-month-old has a large VSD, tachypnea, poor feeding and increased pulmonary vascular markings on chest radiograph. Which clinical finding suggests a small restrictive rather than large nonrestrictive VSD?", "options": ["Severe failure to thrive and pulmonary edema", "Near-equal ventricular systolic pressures", "Loud harsh holosystolic murmur with normal growth", "Early Eisenmenger physiology"], "answer": 2, "explanation": "Small restrictive VSDs can generate loud murmurs despite little hemodynamic burden. Why not the others (added — not from source): A. Severe failure to thrive and pulmonary edema — Severe failure to thrive and pulmonary oedema reflect a large left-to-right shunt typical of a nonrestrictive VSD.; B. Near-equal ventricular systolic pressures — Near-equal ventricular pressures indicate a large nonrestrictive defect with no pressure gradient across it.; D. Early Eisenmenger physiology — Eisenmenger physiology develops after prolonged pulmonary overcirculation from a large VSD, not a small restrictive one.", "pearl": "Small restrictive VSDs can generate loud murmurs despite little hemodynamic burden.", "note": "From Day 17 · Conceptual"}, {"num": 48, "pos": 48, "section": 0, "topic": "Cardiology", "question": "A 4-year-old has SVT at 240/min, altered sensorium, weak pulses and hypotension. If IV access is present while cardioversion is prepared, what should not delay the shock?", "options": ["Sedation when feasible without delaying treatment", "Attempts at repeated medication dosing", "ECG monitoring", "Airway support"], "answer": 1, "explanation": "Hemodynamic instability prioritizes electrical conversion; medication trials must not delay it. Why not the others (added — not from source): A. Sedation when feasible without delaying treatment — Sedation is appropriate when feasible, provided it is brief and does not postpone cardioversion.; C. ECG monitoring — ECG monitoring is required to synchronise the shock and does not delay it.; D. Airway support — Airway support is part of resuscitating an obtunded hypotensive child and proceeds alongside cardioversion.", "pearl": "Hemodynamic instability prioritizes electrical conversion; medication trials must not delay it.", "note": "From Day 21 · Clinical/Application"}, {"num": 49, "pos": 49, "section": 0, "topic": "Neonatology", "question": "A 36-hour-old term infant has rapidly rising unconjugated bilirubin, maternal-infant ABO incompatibility, positive DAT and reticulocytosis. Which factor changes the AAP phototherapy/exchange thresholds for a 35+ week infant?", "options": ["Total bilirubin alone regardless of age", "Direct bilirubin alone", "Gestational age, postnatal age and neurotoxicity risk factors", "Birth weight alone regardless of gestation"], "answer": 2, "explanation": "AAP 2022 thresholds are hour-specific and depend on gestational age and neurotoxicity risk factors. Why not the others (added — not from source): A. Total bilirubin alone regardless of age — AAP 2022 thresholds are hour-specific, so the same total bilirubin carries different significance at different postnatal ages.; B. Direct bilirubin alone — Phototherapy and exchange thresholds use total serum bilirubin; direct bilirubin is not subtracted or used to set them.; D. Birth weight alone regardless of gestation — AAP 2022 nomograms are stratified by gestational age and neurotoxicity risk factors, not by birth weight.", "pearl": "AAP 2022 thresholds are hour-specific and depend on gestational age and neurotoxicity risk factors.", "note": "From Day 6 · Basic-but-easily-confused"}, {"num": 50, "pos": 50, "section": 0, "topic": "Neonatology", "question": "At 36 weeks postmenstrual age, a preterm infant with established BPD requires nasal cannula oxygen at 3 L/min but no invasive ventilation. Under Jensen 2019 severity classification, which grade fits best?", "options": ["Grade 3", "Grade 1", "Grade 2", "No BPD by definition"], "answer": 2, "explanation": "Jensen Grade 2 includes nasal cannula above 2 L/min or noninvasive positive-pressure support. Why not the others (added — not from source): A. Grade 3 — Jensen Grade 3 requires invasive mechanical ventilation at 36 weeks PMA, which this infant does not need.; B. Grade 1 — Jensen Grade 1 is nasal cannula flow of 2 L/min or less; 3 L/min exceeds that threshold.; D. No BPD by definition — An infant needing respiratory support at 36 weeks PMA meets the Jensen definition of BPD.", "pearl": "Jensen Grade 2 includes nasal cannula above 2 L/min or noninvasive positive-pressure support.", "note": "From Day 3 · Basic-but-easily-confused"}, {"num": 51, "pos": 51, "section": 1, "topic": "Cardiology", "question": "A 3-month-old has a large VSD, tachypnea, poor feeding and increased pulmonary vascular markings on chest radiograph. What primarily explains onset of symptoms after several weeks?", "options": ["Postnatal fall in pulmonary vascular resistance increases left-to-right shunting", "Abrupt rise in pulmonary vascular resistance causes no pulmonary flow", "Closure of foramen ovale eliminates all shunting", "Decreased systemic venous return causes cyanosis"], "answer": 0, "explanation": "As PVR falls, left-to-right VSD flow rises and causes pulmonary overcirculation and heart failure. Why not the others (added — not from source): B. Abrupt rise in pulmonary vascular resistance causes no pulmonary flow — Pulmonary vascular resistance normally falls after birth; a rise would reduce left-to-right shunting and is a late Eisenmenger change, not the cause of early heart failure.; C. Closure of foramen ovale eliminates all shunting — Functional foramen ovale closure does not affect ventricular-level shunting, and a large VSD continues to shunt according to the PVR-SVR gradient.; D. Decreased systemic venous return causes cyanosis — A large VSD causes left-to-right shunting with acyanotic overcirculation; cyanosis from reduced systemic venous return does not explain tachypnoea and plethoric lung fields.", "pearl": "As PVR falls, left-to-right VSD flow rises and causes pulmonary overcirculation and heart failure.", "note": "From Day 17 · Clinical/Application"}, {"num": 52, "pos": 52, "section": 1, "topic": "Cardiology", "question": "A 6-year-old has regular narrow-complex tachycardia at 220/min, is alert, well perfused and has no pre-excitation on the tachycardia tracing. What ECG response to adenosine may help reveal atrial flutter rather than AVNRT?", "options": ["Permanent ventricular fibrillation in every case", "Transient AV block unmasks flutter waves without terminating atrial activity", "QT interval disappears permanently", "No change in AV conduction"], "answer": 1, "explanation": "Adenosine can transiently block AV conduction and expose atrial activity in flutter. Why not the others (added — not from source): A. Permanent ventricular fibrillation in every case — Adenosine has an ultrashort half-life and only rarely precipitates ventricular fibrillation, mainly with pre-excited atrial fibrillation; it is not an expected or diagnostic response.; C. QT interval disappears permanently — Adenosine acts on AV nodal conduction and does not abolish the QT interval; any ECG effect is transient, lasting seconds.; D. No change in AV conduction — Adenosine reliably causes transient AV nodal block; failure to alter conduction suggests inadequate dose or delivery rather than helping identify flutter.", "pearl": "Adenosine can transiently block AV conduction and expose atrial activity in flutter.", "note": "From Day 21 · High-difficulty"}, {"num": 53, "pos": 53, "section": 1, "topic": "Neonatology", "question": "A 38-week newborn after elective cesarean has tachypnea at 2 hours, mild oxygen need, hyperinflation and fissural fluid on chest radiograph. Which expected trajectory most supports this diagnosis?", "options": ["Chronic oxygen requirement beyond 36 weeks PMA", "Abrupt unilateral hyperresonance and shock", "Progressive severe low-volume atelectasis", "Improvement over 24-72 hours with supportive care"], "answer": 3, "explanation": "TTN usually improves over 1-3 days; worsening or persistent disease requires reconsideration. Why not the others (added — not from source): A. Chronic oxygen requirement beyond 36 weeks PMA — Oxygen need at 36 weeks PMA defines bronchopulmonary dysplasia in preterm infants, not transient tachypnoea in a term baby, which resolves within days.; B. Abrupt unilateral hyperresonance and shock — Sudden unilateral hyperresonance with shock indicates tension pneumothorax, a complication requiring urgent drainage, not the expected benign course of TTN.; C. Progressive severe low-volume atelectasis — Progressive low-volume atelectasis with ground-glass lungs suggests surfactant deficiency, whereas TTN shows hyperinflation and fissural fluid that clear spontaneously.", "pearl": "TTN usually improves over 1-3 days; worsening or persistent disease requires reconsideration.", "note": "From Day 2 · High-difficulty"}, {"num": 54, "pos": 54, "section": 1, "topic": "Neonatology", "question": "A stable 32-week infant has repeated apnea with bradycardia during sleep; sepsis, hypoglycemia and electrolyte abnormalities have been assessed. Which medication is most commonly used for clinically significant apnea of prematurity?", "options": ["Routine prophylactic antibiotics", "Phenobarbital", "Caffeine citrate", "Furosemide"], "answer": 2, "explanation": "Caffeine stimulates respiratory drive and is standard pharmacologic therapy for apnea of prematurity. Why not the others (added — not from source): A. Routine prophylactic antibiotics — Antibiotics are indicated only when sepsis is suspected; sepsis has been assessed here and prophylactic antibiotics do not treat apnoea of prematurity.; B. Phenobarbital — Phenobarbital is a respiratory depressant used for seizures and may worsen central apnoea; it has no role in apnoea of prematurity.; D. Furosemide — Furosemide is a loop diuretic used for fluid overload or BPD and does not stimulate respiratory drive or reduce apnoea frequency.", "pearl": "Caffeine stimulates respiratory drive and is standard pharmacologic therapy for apnea of prematurity.", "note": "From Day 4 · Clinical/Application"}, {"num": 55, "pos": 55, "section": 1, "topic": "Growth/Genetics", "question": "A 2-year-old has bowing, widened wrists, elevated alkaline phosphatase, low phosphate and elevated PTH. What pathophysiology most fits nutritional vitamin D deficiency rickets?", "options": ["Pure osteogenesis imperfecta", "Primary PTH deficiency", "Reduced calcium absorption causing secondary hyperparathyroidism and phosphaturia", "Isolated renal phosphate wasting with normal PTH"], "answer": 2, "explanation": "Vitamin D deficiency impairs calcium absorption and drives secondary hyperparathyroidism and phosphate loss. Why not the others (added — not from source): A. Pure osteogenesis imperfecta — Osteogenesis imperfecta causes fragile bones from collagen defects with normal mineral biochemistry, not widened metaphyses with raised ALP and PTH.; B. Primary PTH deficiency — PTH deficiency causes hypocalcaemia with hyperphosphataemia and low PTH, the opposite of the elevated PTH and low phosphate seen here.; D. Isolated renal phosphate wasting with normal PTH — Isolated renal phosphate wasting, as in X-linked hypophosphataemia, typically has normal or only mildly raised PTH, whereas this child has clear secondary hyperparathyroidism.", "pearl": "Vitamin D deficiency impairs calcium absorption and drives secondary hyperparathyroidism and phosphate loss.", "note": "From Day 14 · Clinical/Application"}, {"num": 56, "pos": 56, "section": 1, "topic": "Neurology", "question": "A 4-year-old has generalized convulsive activity continuing for 7 minutes in the emergency department; bedside glucose is checked. What is the immediate antiseizure treatment class?", "options": ["Benzodiazepine by an appropriate rapid route", "Observation until 30 minutes have elapsed", "Oral ethosuximide", "Daily prophylactic levetiracetam only"], "answer": 0, "explanation": "Generalized convulsive status is treated urgently once seizure duration reaches about 5 minutes. Why not the others (added — not from source): B. Observation until 30 minutes have elapsed — Convulsive status should be treated once seizures last about 5 minutes; waiting to 30 minutes increases neuronal injury and drug resistance.; C. Oral ethosuximide — Ethosuximide is an oral absence-seizure drug with no role in aborting convulsive status, and the oral route is unsuitable in an actively seizing child.; D. Daily prophylactic levetiracetam only — Maintenance prophylaxis does not stop an ongoing seizure; levetiracetam is used intravenously as a second-line agent only after benzodiazepines fail.", "pearl": "Generalized convulsive status is treated urgently once seizure duration reaches about 5 minutes.", "note": "From Day 23 · High-difficulty"}, {"num": 57, "pos": 57, "section": 1, "topic": "Neonatology", "question": "A 3-day-old term infant loses 9% of birth weight and has serum sodium 158 mmol/L after poor milk transfer. What is the primary immediate clinical concern?", "options": ["Congenital nephrogenic salt wasting as the only cause", "SIADH with free-water excess", "Physiological postnatal weight loss with no risk", "Hypernatremic dehydration requiring carefully planned rehydration"], "answer": 3, "explanation": "Poor intake plus high sodium indicates hypernatremic dehydration; fluid replacement must avoid overly rapid sodium fall. Why not the others (added — not from source): A. Congenital nephrogenic salt wasting as the only cause — Salt-wasting disorders cause hyponatraemia, not hypernatraemia, and the history of poor milk transfer points to inadequate intake as the cause.; B. SIADH with free-water excess — SIADH causes free-water retention and hyponatraemia, which is incompatible with a serum sodium of 158 mmol/L and significant weight loss.; C. Physiological postnatal weight loss with no risk — A sodium of 158 mmol/L is pathological; hypernatraemic dehydration risks seizures, cerebral injury and thrombosis and needs active management.", "pearl": "Poor intake plus high sodium indicates hypernatremic dehydration; fluid replacement must avoid overly rapid sodium fall.", "note": "From Day 10 · Clinical/Application"}, {"num": 58, "pos": 58, "section": 1, "topic": "Neurology", "question": "A 7-year-old has brief morning staring spells, abrupt behavioral arrest, eyelid flutter and immediate recovery; EEG shows generalized 3-Hz spike-wave. Which drug is often preferred for pure absence seizures without generalized tonic-clonic events?", "options": ["Phenytoin", "Phenobarbital", "Carbamazepine", "Ethosuximide"], "answer": 3, "explanation": "Ethosuximide is effective for isolated typical absence seizures; sodium-channel drugs may worsen generalized absence. Why not the others (added — not from source): A. Phenytoin — Phenytoin is a sodium-channel blocker that is ineffective for absence seizures and may aggravate generalised spike-wave discharges.; B. Phenobarbital — Phenobarbital is not effective against typical absence seizures and causes sedation and behavioural adverse effects in school-age children.; C. Carbamazepine — Carbamazepine can worsen absence seizures and may precipitate absence status, so it is contraindicated in childhood absence epilepsy.", "pearl": "Ethosuximide is effective for isolated typical absence seizures; sodium-channel drugs may worsen generalized absence.", "note": "From Day 22 · Conceptual"}, {"num": 59, "pos": 59, "section": 1, "topic": "Growth/Genetics", "question": "A 7-month-old exclusively breastfed infant has no complementary feeding and declining iron indices. Which nutrient is especially at risk if complementary feeding remains poor through late infancy?", "options": ["Vitamin K exclusively", "Fluoride exclusively", "Iron", "Sodium chloride only"], "answer": 2, "explanation": "Infant iron stores decline and iron-rich complementary foods help prevent deficiency. Why not the others (added — not from source): A. Vitamin K exclusively — Vitamin K deficiency is mainly a neonatal risk prevented by birth prophylaxis; it is not the classic nutrient depleted by delayed complementary feeding.; B. Fluoride exclusively — Fluoride supplementation relates to dental caries prevention and is not the key deficiency driving declining iron indices in late infancy.; D. Sodium chloride only — Breast milk provides adequate sodium for infants, and added salt is discouraged in infancy; sodium is not the at-risk nutrient here.", "pearl": "Infant iron stores decline and iron-rich complementary foods help prevent deficiency.", "note": "From Day 15 · Conceptual"}, {"num": 60, "pos": 60, "section": 1, "topic": "Cardiology", "question": "A 7-year-old has a systolic ejection murmur at the left upper sternal border and a split S2 that changes little with respiration. What feature would instead suggest physiological splitting?", "options": ["Single loud S2", "Identical split during inspiration and expiration", "Inspiratory widening with expiratory narrowing of S2", "Paradoxical widening during expiration"], "answer": 2, "explanation": "Normal splitting varies with respiration, unlike the fixed split of ASD. Why not the others (added — not from source): A. Single loud S2 — A single loud S2 suggests pulmonary hypertension or a single semilunar valve, not normal physiological splitting.; B. Identical split during inspiration and expiration — An unchanging split in both phases describes fixed splitting, the hallmark of ASD, rather than normal physiology.; D. Paradoxical widening during expiration — Paradoxical splitting, widening in expiration, reflects delayed aortic closure such as LBBB or severe LV outflow obstruction, which is pathological.", "pearl": "Normal splitting varies with respiration, unlike the fixed split of ASD.", "note": "From Day 16 · Clinical/Application"}, {"num": 61, "pos": 61, "section": 1, "topic": "Cardiology", "question": "A 9-year-old has viral prodrome, chest pain, tachycardia out of proportion to fever, raised troponin and new LV dysfunction. Which diagnosis is most likely?", "options": ["Acute myocarditis", "Isolated innocent murmur", "Stable idiopathic DCM without inflammation", "Pure pericardial cyst"], "answer": 0, "explanation": "Recent infection, myocardial injury marker and acute ventricular dysfunction suggest myocarditis. Why not the others (added — not from source): B. Isolated innocent murmur — An innocent murmur does not cause chest pain, troponin elevation or ventricular dysfunction.; C. Stable idiopathic DCM without inflammation — Stable idiopathic DCM would not explain an acute viral prodrome with rising troponin; the acute inflammatory picture favours myocarditis.; D. Pure pericardial cyst — A pericardial cyst is usually asymptomatic and incidental and does not cause troponin rise or new LV dysfunction.", "pearl": "Recent infection, myocardial injury marker and acute ventricular dysfunction suggest myocarditis.", "note": "From Day 20 · Conceptual"}, {"num": 62, "pos": 62, "section": 1, "topic": "Neonatology", "question": "A 12-day-old neonate has fever, seizures and bulging fontanelle; blood culture is collected and IV antimicrobials are being arranged. CSF has 1500 leukocytes/uL predominantly neutrophils, low CSF-to-serum glucose ratio and high protein. What is most likely?", "options": ["Pure bilirubin encephalopathy", "Bacterial meningitis", "Isolated congenital hypothyroidism", "Uncomplicated physiological CSF findings"], "answer": 1, "explanation": "Neutrophilic pleocytosis, low glucose and high protein strongly support bacterial meningitis. Why not the others (added — not from source): A. Pure bilirubin encephalopathy — Bilirubin encephalopathy occurs in the first week with severe jaundice and does not cause neutrophilic CSF pleocytosis or fever.; C. Isolated congenital hypothyroidism — Congenital hypothyroidism causes lethargy and prolonged jaundice, not fever, bulging fontanelle or inflammatory CSF changes.; D. Uncomplicated physiological CSF findings — Neonatal CSF may have mildly raised cells and protein, but 1500 neutrophil-predominant cells with low glucose ratio is clearly abnormal.", "pearl": "Neutrophilic pleocytosis, low glucose and high protein strongly support bacterial meningitis.", "note": "From Day 5 · H
