ow develops through the common trunk. Why not the others (added — not from source): A. The ductus must close for all pulmonary flow — Pulmonary arteries in truncus arise from the trunk, so pulmonary flow does not depend on the duct.; B. The pulmonary arteries become completely atretic — Pulmonary arteries remain patent in truncus; the problem is excessive, not absent, pulmonary flow.; C. Atrial septal closure blocks all mixing — Mixing in truncus occurs at the large VSD and common trunk, not at the atrial septum.", "pearl": "As PVR falls, excessive pulmonary flow develops through the common trunk.", "note": "From Day 19 · Clinical/Application"}, {"num": 129, "pos": 129, "section": 2, "topic": "Cardiology", "question": "A 4-year-old has SVT at 240/min, altered sensorium, weak pulses and hypotension. Best immediate rhythm-directed intervention?", "options": ["Synchronized cardioversion", "Vagal maneuvers for 30 minutes despite shock", "Unsynchronized shock for a pulse-present regular SVT", "Observe after oral beta blocker"], "answer": 0, "explanation": "Unstable SVT with a pulse requires synchronized cardioversion without prolonged delay. Why not the others (added — not from source): B. Vagal maneuvers for 30 minutes despite shock — Vagal manoeuvres are appropriate only in stable SVT; prolonged attempts in shock delay definitive therapy.; C. Unsynchronized shock for a pulse-present regular SVT — Unsynchronised shocks are for pulseless VF or VT; synchronisation avoids delivering energy on the T wave in a perfusing rhythm.; D. Observe after oral beta blocker — Oral beta-blockers act too slowly and may worsen hypotension in an unstable child needing immediate cardioversion.", "pearl": "Unstable SVT with a pulse requires synchronized cardioversion without prolonged delay.", "note": "From Day 21 · Basic-but-easily-confused"}, {"num": 130, "pos": 130, "section": 2, "topic": "Neonatology", "question": "A 27-week infant on enteral feeds develops abdominal distension, bloody stool and pneumatosis intestinalis on radiography. Most likely diagnosis?", "options": ["Pyloric stenosis", "Simple milk intolerance without injury", "Definite necrotizing enterocolitis", "Hirschsprung-associated enterocolitis without NEC features"], "answer": 2, "explanation": "Pneumatosis in a symptomatic preterm infant is characteristic of NEC. Why not the others (added — not from source): A. Pyloric stenosis — Pyloric stenosis presents at 2-8 weeks with projectile non-bilious vomiting, not pneumatosis or bloody stool.; B. Simple milk intolerance without injury — Milk intolerance does not produce pneumatosis intestinalis, which signifies intramural gas from bowel injury.; D. Hirschsprung-associated enterocolitis without NEC features — Hirschsprung enterocolitis is rare in extremely preterm infants and pneumatosis with bloody stool fits Bell stage II NEC.", "pearl": "Pneumatosis in a symptomatic preterm infant is characteristic of NEC.", "note": "From Day 8 · Integrated/Rank-differentiating"}, {"num": 131, "pos": 131, "section": 2, "topic": "Cardiology", "question": "A child with a large secundum ASD undergoes transcatheter closure and returns with chest pain, tachycardia and a new pericardial effusion. Which rare device complication must be excluded urgently?", "options": ["Pulmonary valve dysplasia", "Benign physiological splitting", "Routine residual shunt without hemodynamic consequence", "Device erosion into adjacent atrial/aortic tissue"], "answer": 3, "explanation": "Chest pain with new effusion after ASD device closure raises concern for erosion or perforation. Why not the others (added — not from source): A. Pulmonary valve dysplasia — Pulmonary valve dysplasia is a congenital lesion and not a device complication presenting with new effusion and pain.; B. Benign physiological splitting — Physiological splitting of S2 is benign and cannot explain chest pain and a new pericardial effusion.; C. Routine residual shunt without hemodynamic consequence — A haemodynamically insignificant residual shunt does not cause pericardial effusion or pain.", "pearl": "Chest pain with new effusion after ASD device closure raises concern for erosion or perforation.", "note": "From Day 21 · High-difficulty"}, {"num": 132, "pos": 132, "section": 2, "topic": "Cardiology", "question": "A neonate with pulmonary atresia and intact ventricular septum has profound cyanosis and a duct-dependent pulmonary circulation. What diagnostic issue determines whether catheter valve perforation is safe?", "options": ["Maternal blood group", "Right ventricular size, coronary anatomy and right-ventricle-dependent coronary circulation", "Only bilirubin concentration", "Only the left atrial appendage size"], "answer": 1, "explanation": "RV-dependent coronary circulation can make RV decompression hazardous. Why not the others (added — not from source): A. Maternal blood group — Maternal blood group concerns haemolytic disease and does not influence RV decompression safety.; C. Only bilirubin concentration — Bilirubin concentration has no bearing on whether decompressing the right ventricle will compromise coronary perfusion via sinusoids or fistulae.; D. Only the left atrial appendage size — Left atrial appendage size is irrelevant; RV size, tricuspid annulus and RV-dependent coronary circulation decide strategy.", "pearl": "RV-dependent coronary circulation can make RV decompression hazardous.", "note": "From Day 19 · High-difficulty"}, {"num": 133, "pos": 133, "section": 2, "topic": "Neonatology", "question": "A spontaneously breathing 27-week infant has clinical RDS; the unit can deliver poractant alfa by thin catheter. After surfactant, FiO2 remains high and lung ultrasound still suggests RDS, with pneumothorax excluded. What is reasonable?", "options": ["Withdraw all respiratory support", "Give diuretics without evaluating respiratory causes", "Start routine inhaled nitric oxide for every RDS infant", "Consider a repeat surfactant dose after reassessment"], "answer": 3, "explanation": "Persistent RDS with high oxygen requirement after other problems are excluded can warrant further surfactant dosing. Why not the others (added — not from source): A. Withdraw all respiratory support — Withdrawing support in persistent RDS with high FiO2 risks collapse and respiratory failure.; B. Give diuretics without evaluating respiratory causes — Diuretics do not treat surfactant deficiency and other causes must be evaluated first.; C. Start routine inhaled nitric oxide for every RDS infant — iNO is not routinely recommended for preterm RDS; it is reserved for selected pulmonary hypertension.", "pearl": "Persistent RDS with high oxygen requirement after other problems are excluded can warrant further surfactant dosing.", "note": "From Day 2 · High-difficulty"}, {"num": 134, "pos": 134, "section": 2, "topic": "Cardiology", "question": "A child with AVSD has an elongated narrowed left ventricular outflow tract on angiography, described as a gooseneck deformity. Which associated lesion should be assessed on echo because it can affect surgical planning?", "options": ["Isolated pulmonary venous varix", "Left atrioventricular valve regurgitation and LVOT obstruction", "Acquired coronary aneurysm alone", "Normal variant of mitral leaflet motion only"], "answer": 1, "explanation": "AV valve function and LVOT geometry influence AVSD repair strategy and outcomes. Why not the others (added — not from source): A. Isolated pulmonary venous varix — A pulmonary venous varix is a rare incidental finding that is unrelated to the left-sided valve and outflow anatomy relevant to AVSD repair.; C. Acquired coronary aneurysm alone — Coronary aneurysms are characteristic of Kawasaki disease and are not part of the gooseneck LVOT anatomy of atrioventricular septal defect.; D. Normal variant of mitral leaflet motion only — The gooseneck deformity is a pathological feature of AVSD, not a normal variant.", "pearl": "AV valve function and LVOT geometry influence AVSD repair strategy and outcomes.", "note": "From Day 17 · Conceptual"}, {"num": 135, "pos": 135, "section": 2, "topic": "Growth/Genetics", "question": "A 9-kg child with complicated SAM is prescribed a starter-feed volume of 130 mL/kg/day divided into 12 equal feeds. What is the daily prescribed volume?", "options": ["1170 mL/day", "1560 mL/day", "130 mL/day", "900 mL/day"], "answer": 0, "explanation": "Multiply 9 kg by 130 mL/kg/day to obtain 1170 mL/day; never omit weight. Why not the others (added — not from source): B. 1560 mL/day — This corresponds to about 173 mL/kg/day for 9 kg, exceeding the prescribed 130 mL/kg/day.; C. 130 mL/day — 130 mL is only the per-kilogram daily figure; omitting multiplication by the 9-kg weight underfeeds the child about ninefold.; D. 900 mL/day — 900 mL/day equals 100 mL/kg/day for a 9-kg child, which underestimates the prescribed 130 mL/kg/day starter volume.", "pearl": "Multiply 9 kg by 130 mL/kg/day to obtain 1170 mL/day; never omit weight.", "note": "From Day 14 · Clinical/Application"}, {"num": 136, "pos": 136, "section": 2, "topic": "Growth/Genetics", "question": "A neonate develops cataracts after milk feeds but has little liver dysfunction, no coagulopathy and normal clinical stability. Which feature would more strongly favor classic GALT galactosemia?", "options": ["Hypoketotic fasting hypoglycemia with C8 elevation", "Isolated lens opacity with normal liver tests", "Symptoms only after fructose introduction", "Hepatic dysfunction and E. coli sepsis after milk exposure"], "answer": 3, "explanation": "Classic galactosemia can cause severe hepatic disease and E. coli sepsis early after galactose exposure. Why not the others (added — not from source): A. Hypoketotic fasting hypoglycemia with C8 elevation — Hypoketotic fasting hypoglycaemia with raised C8 acylcarnitine points to MCAD deficiency, a fatty acid oxidation defect unrelated to galactose exposure.; B. Isolated lens opacity with normal liver tests — Isolated lens opacity with normal liver tests suggests galactokinase deficiency rather than classic GALT galactosemia.; C. Symptoms only after fructose introduction — Symptoms appearing only after fructose or sucrose introduction suggest hereditary fructose intolerance rather than galactosemia, which presents with milk feeds.", "pearl": "Classic galactosemia can cause severe hepatic disease and E. coli sepsis early after galactose exposure.", "note": "From Day 15 · High-difficulty"}, {"num": 137, "pos": 137, "section": 2, "topic": "Cardiology", "question": "An 8-month-old with unrepaired TOF becomes profoundly cyanotic after crying; examination shows a softer RVOT murmur. What immediate bedside maneuver helps abort the spell?", "options": ["Rapid diuresis to reduce preload", "Knee-chest positioning with calming and oxygen", "Immediate exercise to increase systemic demand", "Supine leg elevation only without calming"], "answer": 1, "explanation": "Knee-chest raises systemic vascular resistance and helps reduce right-to-left shunting during a hypercyanotic spell. Why not the others (added — not from source): A. Rapid diuresis to reduce preload — Diuresis reduces preload and RV filling, which can worsen RVOT obstruction during a spell.; C. Immediate exercise to increase systemic demand — Exercise lowers systemic vascular resistance and increases oxygen demand, worsening right-to-left shunting.; D. Supine leg elevation only without calming — Leg elevation alone without calming is less effective than knee-chest positioning with comfort and oxygen.", "pearl": "Knee-chest raises systemic vascular resistance and helps reduce right-to-left shunting during a hypercyanotic spell.", "note": "From Day 18 · Integrated/Rank-differentiating"}, {"num": 138, "pos": 138, "section": 2, "topic": "Growth/Genetics", "question": "A toddler has lethargy and hypoketotic hypoglycemia after overnight fasting; acylcarnitine profile shows predominant C8 elevation. Which marker would instead support VLCAD deficiency?", "options": ["C3 elevation alone", "Alloisoleucine elevation", "Succinylacetone elevation", "C14:1 elevation"], "answer": 3, "explanation": "VLCAD is associated with long-chain C14:1 acylcarnitine elevation. Why not the others (added — not from source): A. C3 elevation alone — Isolated C3 (propionylcarnitine) elevation suggests propionic or methylmalonic acidaemia, an organic acidaemia rather than a long-chain oxidation defect.; B. Alloisoleucine elevation — Alloisoleucine is the pathognomonic marker of maple syrup urine disease, a branched-chain amino acid disorder, not a fatty acid oxidation defect.; C. Succinylacetone elevation — Succinylacetone is the diagnostic marker of tyrosinaemia type 1, which presents with liver failure and renal tubulopathy, not VLCAD deficiency.", "pearl": "VLCAD is associated with long-chain C14:1 acylcarnitine elevation.", "note": "From Day 15 · Clinical/Application"}, {"num": 139, "pos": 139, "section": 2, "topic": "Neonatology", "question": "Cranial ultrasound of a very preterm infant shows intraventricular hemorrhage with ventricular dilatation but no parenchymal lesion. Which Papile grade best fits?", "options": ["Grade III IVH", "Periventricular hemorrhagic infarction", "Grade II IVH without dilation", "Grade I germinal-matrix hemorrhage"], "answer": 0, "explanation": "Grade III includes IVH with ventricular enlargement; parenchymal hemorrhagic infarction is distinct. Why not the others (added — not from source): B. Periventricular hemorrhagic infarction — Periventricular haemorrhagic infarction involves the parenchyma and is distinct from IVH with dilatation alone.; C. Grade II IVH without dilation — Papile grade II describes intraventricular blood without ventricular dilatation, whereas this scan clearly shows ventricular enlargement.; D. Grade I germinal-matrix hemorrhage — Grade I is confined to the germinal matrix without intraventricular extension or dilatation.", "pearl": "Grade III includes IVH with ventricular enlargement; parenchymal hemorrhagic infarction is distinct.", "note": "From Day 11 · Conceptual"}, {"num": 140, "pos": 140, "section": 2, "topic": "Cardiology", "question": "A neonate with pulmonary atresia and intact ventricular septum has profound cyanosis and a duct-dependent pulmonary circulation. Which medication is an immediate bridge?", "options": ["ACE inhibitor as sole treatment", "Ibuprofen to close ductus", "Routine IV adenosine", "PGE1 to maintain pulmonary blood flow"], "answer": 3, "explanation": "Ductal patency can be essential for pulmonary perfusion in pulmonary atresia. Why not the others (added — not from source): A. ACE inhibitor as sole treatment — ACE inhibitors are afterload reducers for heart failure and do nothing to maintain duct-dependent pulmonary blood flow.; B. Ibuprofen to close ductus — Closing the duct would cut off pulmonary blood flow in a duct-dependent lesion and be lethal.; C. Routine IV adenosine — Adenosine treats re-entrant SVT; it has no role in maintaining ductal patency.", "pearl": "Ductal patency can be essential for pulmonary perfusion in pulmonary atresia.", "note": "From Day 19 · High-difficulty"}, {"num": 141, "pos": 141, "section": 2, "topic": "Neonatology", "question": "A 26-week, 850-g infant is delivered into a cool room and is at high risk of evaporative heat loss. What is a key metabolic consequence of cold stress?", "options": ["Immediate reduction in pulmonary vascular resistance", "Increased oxygen and glucose consumption", "Increased endogenous surfactant production", "Suppressed oxygen use and lower glucose requirement"], "answer": 1, "explanation": "Cold stress increases nonshivering thermogenesis and oxygen/glucose demand. Why not the others (added — not from source): A. Immediate reduction in pulmonary vascular resistance — Cold stress and hypoxaemia raise pulmonary vascular resistance rather than lowering it.; C. Increased endogenous surfactant production — Cold stress, with associated hypoxaemia and l"}, {"num": 150, "pos": 150, "section": 2, "topic": "Growth/Genetics", "question": "A 7-month-old exclusively breastfed infant has no complementary feeding and declining iron indices. Which nutrition intervention is most appropriate?", "options": ["Replace breast milk with diluted cow milk only", "Give fruit juice as the main iron source", "Introduce iron-rich age-appropriate complementary foods while continuing breastfeeding", "Avoid all solids until 12 months"], "answer": 2, "explanation": "After about 6 months, complementary iron-rich foods are essential while breastfeeding continues. Why not the others (added — not from source): A. Replace breast milk with diluted cow milk only — Diluted cow milk is inappropriate before 12 months; it is iron-poor and causes occult GI blood loss.; B. Give fruit juice as the main iron source — Fruit juice contains negligible iron and is not recommended as a main food in infancy.; D. Avoid all solids until 12 months — Delaying solids beyond about 6 months, when breast-milk iron no longer meets needs, worsens iron deficiency and growth faltering.", "pearl": "After about 6 months, complementary iron-rich foods are essential while breastfeeding continues.", "note": "From Day 15 · High-difficulty"}];

// Advance through any sections whose absolute deadline has passed (handles reloads after time ran out).
function catchUp(){
 let changed=false;
 while(!S.finished && Date.now()>=S.sectionEnd){

  if(S.section>=NS-1){finish(S.sectionEnd);break}
  S.section++;S.sectionEnd+=SEC_MS;S.sectionStart[S.section]=S.sectionEnd-SEC_MS;
 }
 if(changed){cur=0;save()}
 return changed;
}

function status(n){const a=S.answers[n]!=null,m=!!S.marked[n],v=!!S.visited[n];return a&&m?'am':m?'m':a?'a':v?'na':'nv'}
function start(){
 S=load();
 if(!S){location.replace('index.html');return}
 catchUp();
 if(S.finished){renderResult();return}
 cur=Math.min(S.cur&&S.cur.section===S.section?S.cur.i:0,secQs(S.section).length-1);

}

 const qs=secQs(S.section),q=qs[cur];S.visited[q.num]=true;S.cur={section:S.section,i:cur};save();

 </div><div class="card palcard"><div class="palhead"><b>${esc(EXAM.sections[S.section].name)} — Question Palette</b><button class="secondary palclose" onclick="document.body.classList.remove('pal-open')">✕</button></div>

function guard(){if(catchUp()||S.finished){start();return false}return true}

function score(qs){let c=0,w=0,u=0;qs.forEach(q=>{const a=S.answers[q.num];if(a==null)u++;else if(a===q.answer)c++;else w++});return{c,w,u,a:c+w,s:c*4-w,max:qs.length*4}}
function st(q){const a=S.answers[q.num];return a==null?'un':a===q.answer?'correct':'wrong'}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}

function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}

 wrongLines(Q.filter(q=>st(q)==='wrong').map(q=>({num:q.pos,options:q.options,chosen:S.answers[q.num],answer:q.answer})),lines,EXAM.title.split(' — ')[0]);
 Notify.send(EXAM.title+' — Mock finished','trophy',lines.join('\n'));

function setFilter(k){reviewFilter=k;renderResult()}
function rvItem(q){
 const a=S.answers[q.num],s=st(q);
 return `<div class="rv ${s}"><div class="small">${esc(q.topic)} · ${esc(EXAM.sections[q.section].name)}${S.marked[q.num]?' · marked for review':''}</div>
 <b>Q${q.pos}. ${esc(q.question)}</b>${q.pos!==q.num?` <small style="color:var(--muted);font-weight:500">(source Q${q.num})</small>`:''}<br><span class="st ${s}">${s==='correct'?'✓ Correct (+4)':s==='wrong'?'✗ Wrong (−1)':'— Unattempted (0)'}</span><br>
 <b>Your response:</b> ${a==null?'Not answered':`${L(a)}. ${esc(q.options[a])}`}<br><b>Correct response:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}
 ${q.note?`<div class="note"><b>Note:</b> ${esc(q.note)}</div>`:''}
 <div class="explain"><b>Explanation${q.explanationSource==='added'?' <small>(added — not from source)</small>':''}:</b> ${esc(q.explanation)}</div>
 ${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}</div>`;
}
function reportBody(){
 const o=score(Q),wrong=Q.filter(q=>st(q)==='wrong'),un=Q.filter(q=>st(q)==='un');
 let h=`<h1>${esc(EXAM.title)} — Wrong Answer Report</h1><p><b>Overall score:</b> ${o.s} / ${o.max} (${pct(o)}%) · Correct ${o.c} · Wrong ${o.w} · Unattempted ${o.u} · Time ${dur(S.finishedAt-S.startedAt)}</p><p>`+
  EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<b>${esc(s.name)}:</b> ${x.s} / ${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`}).join('<br>')+'</p><h2>Wrong answers</h2>';
 if(!wrong.length)h+='<p>No wrong answers.</p>';
 wrong.forEach((q,i)=>{h+=`<hr><h3>${i+1}. Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}. ${esc(q.question)}</h3><p><b>Your answer:</b> ${L(S.answers[q.num])}. ${esc(q.options[S.answers[q.num]])}</p><p><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>${q.note?`<p><b>Note:</b> ${esc(q.note)}</p>`:''}<p><b>Explanation${q.explanationSource==='added'?' (added — not from source)':''}:</b> ${esc(q.explanation)}</p>${q.pearl?`<p><b>Exam pearl:</b> ${esc(q.pearl)}</p>`:''}`});
 if(un.length){h+='<h2>Unattempted questions</h2>';un.forEach(q=>{h+=`<p><b>Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}.</b> ${esc(q.question)}<br><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>`})}
 return h;
}
function baseName(){return `${EXAM.id}_${stamp()}_Wrong_Answers`}
function downloadWord(){const b=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=baseName()+'.doc';a.click();URL.revokeObjectURL(u)}
function printPDF(){const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${baseName()}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}
window.addEventListener('storage',e=>{if(e.key===KEY)start()});
start();
</script></body></html>
