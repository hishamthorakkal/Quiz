ed onset — PSGN follows infection after a 1–3 week latent period, causes transient low C3 and rarely recurs; concurrent haematuria with normal complement favours IgA nephropathy.", "pearl": "Synpharyngitic hematuria with normal C3 favors IgA nephropathy.", "note": "From Day 30 · High difficulty"}, {"num": 121, "pos": 121, "section": 2, "topic": "Nephrology", "question": "A 2-year-old develops pallor, thrombocytopenia, AKI and schistocytes after bloody diarrhea. Which syndrome is most likely?", "options": ["Thrombotic thrombocytopenic purpura from severe ADAMTS13 deficiency", "Shiga-toxin-associated hemolytic uremic syndrome", "Complement-mediated atypical HUS", "Disseminated intravascular coagulation from invasive sepsis"], "answer": 1, "explanation": "Microangiopathic hemolysis, low platelets and AKI define HUS; diarrheal prodrome suggests STEC-HUS. Why not the others (added — not from source): A. Thrombotic thrombocytopenic purpura from severe ADAMTS13 deficiency — TTP from ADAMTS13 deficiency is rare in toddlers and typically lacks a bloody diarrhoeal prodrome; this triad after bloody diarrhoea is classic STEC-HUS.; C. Complement-mediated atypical HUS — Atypical HUS usually has no diarrhoeal prodrome, may recur and often runs in families; bloody diarrhoea before the TMA points to Shiga toxin.; D. Disseminated intravascular coagulation from invasive sepsis — DIC would show prolonged PT/aPTT and low fibrinogen in a septic child; HUS typically has normal coagulation, and the bloody diarrhoea prodrome favours STEC.", "pearl": "Microangiopathic hemolysis, low platelets and AKI define HUS.", "note": "From Day 31 · Clinical / application"}, {"num": 122, "pos": 122, "section": 2, "topic": "Nephrology", "question": "A child has recurrent TMA without diarrheal prodrome, persistently low C3 and family history of renal failure. Which mechanism deserves evaluation?", "options": ["Primary ITP", "Minimal-change nephrosis", "Complement-mediated atypical HUS", "Isolated vitamin K deficiency"], "answer": 2, "explanation": "Recurrent TMA and complement abnormalities suggest alternative pathway dysregulation. Why not the others (added — not from source): A. Primary ITP — ITP causes isolated thrombocytopenia without haemolysis, schistocytes, renal failure or low C3.; B. Minimal-change nephrosis — Minimal change disease causes nephrotic syndrome without thrombotic microangiopathy or hypocomplementaemia.; D. Isolated vitamin K deficiency — Vitamin K deficiency causes bleeding with prolonged PT; it does not cause microangiopathic haemolysis, renal TMA or low C3.", "pearl": "Recurrent TMA and complement abnormalities suggest alternative pathway dysregulation.", "note": "From Day 31 · Clinical / application"}, {"num": 123, "pos": 123, "section": 2, "topic": "Nephrology", "question": "A child has normal anion gap metabolic acidosis, hypokalemia, urine pH 6.5 despite systemic acidosis and nephrocalcinosis. Which disorder fits?", "options": ["Proximal type 2 RTA with fully recovered bicarbonate threshold", "Type 4 RTA", "Distal (type 1) renal tubular acidosis", "Lactic acidosis"], "answer": 2, "explanation": "Inability to acidify urine despite acidosis with stones and hypokalemia suggests distal RTA. Why not the others (added — not from source): A. Proximal type 2 RTA with fully recovered bicarbonate threshold — Proximal RTA can acidify urine (pH below 5.5) once bicarbonate falls below the reduced threshold, and nephrocalcinosis is uncommon; urine pH 6.5 during acidosis indicates distal RTA.; B. Type 4 RTA — Type 4 RTA causes hyperkalaemia from hypoaldosteronism or aldosterone resistance, not hypokalaemia, and is not associated with nephrocalcinosis.; D. Lactic acidosis — Lactic acidosis causes a high anion gap acidosis; this child has a normal anion gap with alkaline urine and nephrocalcinosis.", "pearl": "Inability to acidify urine despite acidosis with stones and hypokalemia suggests distal RTA.", "note": "From Day 31 · Conceptual"}, {"num": 124, "pos": 124, "section": 2, "topic": "Nephrology", "question": "An infant has failure to thrive, glucosuria with normal serum glucose, phosphaturia and bicarbonate wasting. Which tubular defect is most likely?", "options": ["SIADH", "Generalized proximal tubular dysfunction (Fanconi syndrome)", "Isolated distal RTA", "Pure glomerular proteinuria"], "answer": 1, "explanation": "Fanconi syndrome causes multi-solute proximal wasting, not only impaired distal acidification. Why not the others (added — not from source): A. SIADH — SIADH causes euvolaemic hyponatraemia with concentrated urine; it does not cause glucosuria, phosphaturia or bicarbonate wasting.; C. Isolated distal RTA — Isolated distal RTA impairs acid excretion only; glucosuria with normal blood glucose and phosphaturia indicate generalised proximal tubular dysfunction.; D. Pure glomerular proteinuria — Glomerular proteinuria involves loss of albumin across the filter; it does not cause tubular loss of glucose, phosphate and bicarbonate.", "pearl": "Fanconi syndrome causes multi-solute proximal wasting, not only impaired distal acidification.", "note": "From Day 31 · Integrated / rank-differentiating"}, {"num": 125, "pos": 125, "section": 2, "topic": "Nephrology", "question": "A child has Na 140, Cl 112 and HCO3 16 mmol/L. What is the calculated anion gap (without potassium)?", "options": ["12 mmol/L", "4 mmol/L", "28 mmol/L", "20 mmol/L"], "answer": 0, "explanation": "Anion gap = Na − (Cl + HCO3) = 140 − (112 + 16) = 12 mmol/L, a normal-gap pattern. Why not the others (added — not from source): B. 4 mmol/L — This figure does not follow from the values; 140 − (112 + 16) = 12 mmol/L.; C. 28 mmol/L — This results from subtracting only chloride (140 − 112) and omitting bicarbonate; the correct gap is 140 − (112 + 16) = 12 mmol/L.; D. 20 mmol/L — This value would indicate a high anion gap; with Cl 112 and HCO3 16 the gap is 12, a normal-gap (hyperchloraemic) acidosis.", "pearl": "Anion gap = Na − (Cl + HCO3) = 140 − (112 + 16) = 12 mmol/L, a normal-gap pattern.", "note": "From Day 31 · High difficulty"}, {"num": 126, "pos": 126, "section": 2, "topic": "Nephrology", "question": "A 12-year-old with CKD has anemia, elevated phosphate and secondary hyperparathyroidism. Which pathophysiologic combination is most relevant?", "options": ["Iron deficiency with appropriate EPO production and normal phosphate handling", "Reduced EPO production with increased renal phosphate excretion", "Primary hyperparathyroidism with intact renal phosphate excretion", "Reduced EPO production and impaired phosphate excretion"], "answer": 3, "explanation": "CKD affects erythropoiesis and mineral metabolism; anemia and CKD-MBD require separate assessment. Why not the others (added — not from source): A. Iron deficiency with appropriate EPO production and normal phosphate handling — In CKD, EPO production is inappropriately low for the degree of anaemia and phosphate excretion falls; both abnormalities are central here.; B. Reduced EPO production with increased renal phosphate excretion — EPO deficiency is correct, but CKD reduces renal phosphate excretion, causing the hyperphosphataemia that drives secondary hyperparathyroidism.; C. Primary hyperparathyroidism with intact renal phosphate excretion — Hyperparathyroidism in CKD is secondary to phosphate retention, low calcitriol and hypocalcaemia; primary hyperparathyroidism would cause low, not high, phosphate.", "pearl": "CKD affects erythropoiesis and mineral metabolism.", "note": "From Day 32 · High difficulty"}, {"num": 127, "pos": 127, "section": 2, "topic": "Nephrology", "question": "A child has recurrent febrile UTIs and renal ultrasound shows hydronephrosis. Which diagnostic concern deserves evaluation?", "options": ["Vesicoureteral reflux or obstructive CAKUT depending on age/imaging findings", "Bladder-bowel dysfunction without an anatomic urinary-tract abnormality", "Nephrolithiasis as the most likely explanation for hydronephrosis and recurrent febrile UTI", "Glomerular disease causing sterile pyuria and hydronephrosis"], "answer": 0, "explanation": "Recurrent febrile infection with abnormal ultrasound warrants evaluation for structural risk factors. Why not the others (added — not from source): B. Bladder-bowel dysfunction without an anatomic urinary-tract abnormality — Bladder-bowel dysfunction is a common UTI risk factor, but hydronephrosis on ultrasound points to a structural problem that must be investigated first.; C. Nephrolithiasis as the most likely explanation for hydronephrosis and recurrent febrile UTI — Stones are an uncommon cause of paediatric febrile UTI; recurrent febrile UTI with hydronephrosis most often reflects VUR or obstructive CAKUT.; D. Glomerular disease causing sterile pyuria and hydronephrosis — Glomerular disease causes haematuria and proteinuria, not febrile UTI or hydronephrosis; this picture suggests a urinary tract anomaly.", "pearl": "Recurrent febrile infection with abnormal ultrasound warrants evaluation for structural risk factors.", "note": "From Day 32 · Conceptual"}, {"num": 128, "pos": 128, "section": 2, "topic": "Nephrology", "question": "A toilet-trained girl has dysuria and fever; urine specimen is needed before antibiotics. Which sample best minimizes contamination?", "options": ["Adhesive urine bag specimen for culture", "Catheterized urine specimen despite reliable toilet training and ability to provide clean catch", "Use suprapubic aspiration as the first-choice specimen in a cooperative toilet-trained child", "Clean-catch midstream urine with appropriate technique"], "answer": 3, "explanation": "Proper collection reduces false-positive cultures; bag positives are unreliable for diagnosis. Why not the others (added — not from source): A. Adhesive urine bag specimen for culture — Bag specimens have high contamination rates; a positive bag culture cannot confirm UTI and should not be used for culture before antibiotics.; B. Catheterized urine specimen despite reliable toilet training and ability to provide clean catch — Catheterisation is invasive and reserved for children who cannot void on request; a toilet-trained girl can give a clean-catch midstream sample.; C. Use suprapubic aspiration as the first-choice specimen in a cooperative toilet-trained child — Suprapubic aspiration is the least contaminated but invasive and mainly used in infants; it is not first choice in a cooperative toilet-trained child.", "pearl": "Proper collection reduces false-positive cultures.", "note": "From Day 32 · Clinical / application"}, {"num": 129, "pos": 129, "section": 2, "topic": "Nephrology", "question": "A 7-year-old has persistent hypertension on repeated properly obtained measurements. Which interpretation is most appropriate?", "options": ["Use the adult 130/80 mmHg threshold without pediatric percentile interpretation", "Diagnose hypertension from one oscillometric reading without auscultatory confirmation", "Use home blood-pressure readings alone to establish the diagnosis", "Use age, sex and height-based pediatric BP thresholds and confirm measurement technique"], "answer": 3, "explanation": "Pediatric BP interpretation is age/height dependent and requires reliable repeated measurements. Why not the others (added — not from source): A. Use the adult 130/80 mmHg threshold without pediatric percentile interpretation — The static 130/80 threshold applies from age 13; at 7 years hypertension is defined by percentiles for age, sex and height.; B. Diagnose hypertension from one oscillometric reading without auscultatory confirmation — An elevated oscillometric reading should be confirmed by auscultation, and the diagnosis needs persistent elevation on repeated visits, not a single reading.; C. Use home blood-pressure readings alone to establish the diagnosis — Home readings are supportive only; diagnosis rests on repeated properly obtained office readings with percentile interpretation, often with ambulatory monitoring.", "pearl": "Pediatric BP interpretation is age/height dependent and requires reliable repeated measurements.", "note": "From Day 32 · Basic / easily confused"}, {"num": 130, "pos": 130, "section": 2, "topic": "Nephrology", "question": "A 7-year-old with CKD has reduced eGFR and poor linear growth despite adequate nutrition. Which approach is most appropriate?", "options": ["Start recombinant growth hormone before correcting metabolic acidosis or CKD-MBD", "Increase protein intake substantially despite CKD without nutritional monitoring", "Evaluate metabolic acidosis, CKD-MBD and endocrine contributors before considering growth treatment", "Defer evaluation of growth failure until dialysis or transplantation is required"], "answer": 2, "explanation": "Growth impairment in CKD is multifactorial and needs correction of modifiable factors. Why not the others (added — not from source): A. Start recombinant growth hormone before correcting metabolic acidosis or CKD-MBD — Growth hormone works best, and is recommended, only after acidosis, CKD-MBD and nutritional deficits are corrected; starting it first ignores reversible causes.; B. Increase protein intake substantially despite CKD without nutritional monitoring — Excess protein increases the acid and phosphate load and may hasten CKD progression; intake should meet recommended requirements with dietitian monitoring.; D. Defer evaluation of growth failure until dialysis or transplantation is required — Growth lost in CKD is hard to recover; deferring evaluation until dialysis or transplant misses the period when correcting modifiable factors helps.", "pearl": "Growth impairment in CKD is multifactorial and needs correction of modifiable factors.", "note": "From Day 32 · Conceptual"}, {"num": 131, "pos": 131, "section": 2, "topic": "Gastroenterology", "question": "A 14-month-old has watery diarrhea, sunken eyes, thirst and reduced skin turgor but is alert and drinking. Which initial treatment is most appropriate?", "options": ["Give an IV isotonic bolus despite absence of shock or severe dehydration", "Low-osmolarity oral rehydration with reassessment", "Use half-strength ORS to reduce sodium exposure", "Withhold oral intake and reassess hydration after four hours"], "answer": 1, "explanation": "Most children with some dehydration can receive oral rehydration; reassess and escalate if unsuccessful. Why not the others (added — not from source): A. Give an IV isotonic bolus despite absence of shock or severe dehydration — IV fluids are for severe dehydration, shock or failed oral rehydration; an alert child who is drinking with some dehydration is treated with ORS.; C. Use half-strength ORS to reduce sodium exposure — Diluting ORS alters its glucose-sodium balance and reduces sodium replacement; low-osmolarity ORS is already optimised and is used undiluted.; D. Withhold oral intake and reassess hydration after four hours — Withholding fluids worsens dehydration; WHO Plan B gives ORS over 4 hours with reassessment, plus continued feeding.", "pearl": "Most children with some dehydration can receive oral rehydration.", "note": "From Day 33 · Clinical / application"}, {"num": 132, "pos": 132, "section": 2, "topic": "Gastroenterology", "question": "A 9-kg infant with some dehydration is prescribed 75 mL/kg ORS over four hours. What total volume is planned?", "options": ["750 mL", "450 mL", "900 mL", "675 mL"], "answer": 3, "explanation": "75 × 9 = 675 mL over four hours, with ongoing losses and reassessment handled separately. Why not the others (added — not from source): A. 750 mL — 750 mL corresponds to about 83 mL/kg or a 10-kg child; the plan is 75 × 9 = 675 mL.; B. 450 mL — 450 mL equals 50 mL/kg, which underestimates the prescribed volume; 75 × 9 = 675 mL.; C. 900 mL — 900 mL equals 100 mL/kg, more than prescribed; 75 × 9 = 675 mL over 4 hours.", "pearl": "75 × 9 = 675 mL over four hours, with ongoing losses and reassessment handled separately.", "note": "From Day 33 · Basic / easily confused"}, {"num": 133, "pos": 133, "section": 2, "topic": "Gastroenterology", "question": "An 8-month-old has acute diarrhea without shock. Which zinc regimen matches WHO guidance?", "options": ["20 mg elemental zinc daily for 10–14 days", "10 mg elemental zinc daily for 10-14 days", "20 mg elemental zinc daily for 5 days", "40 mg elemental zinc daily for 10-14 days"], "answer": 0, "explanation": "WHO recommends 20 mg/day from six months of age for 10–14 days during acute diarrhea. Why not the others (added — not from source): B. 10 mg elemental zinc daily for 10-14 days — 10 mg daily is the WHO dose for infants under 6 months; an 8-month-old should receive 20 mg.; C. 20 mg elemental zinc daily for 5 days — The dose is correct but the duration is too short; WHO recommends 10–14 days to restore zinc and reduce recurrence.; D. 40 mg elemental zinc daily for 10-14 days — 40 mg is twice the WHO dose, increases vomiting and offers no extra benefit.", "pearl": "WHO recommends 20 mg/day from six months of age for 10–14 days during acute diarrhea.", "note": "From Day 33 · High difficulty"}, {"num": 134, "pos": 134, "section": 2, "topic": "Gastroenterology", "question": "A 4-month-old has acute diarrhea and can feed. What daily zinc dose is recommended by WHO?", "options": ["5 mg once weekly", "40 mg elemental zinc", "20 mg elemental zinc", "10 mg elemental zinc"], "answer": 3, "explanation": "WHO recommends 10 mg/day for infants under six months for 10–14 days. Why not the others (added — not from source): A. 5 mg once weekly — Zinc for diarrhoea is given daily for 10–14 days; a weekly dose is not part of WHO guidance.; B. 40 mg elemental zinc — 40 mg is four times the recommended dose for an infant under 6 months and increases vomiting.; C. 20 mg elemental zinc — 20 mg is the dose for children 6 months and older; under 6 months WHO recommends 10 mg daily.", "pearl": "WHO recommends 10 mg/day for infants under six months for 10–14 days.", "note": "From Day 33 · Conceptual"}, {"num": 135, "pos": 135, "section": 2, "topic": "Gastroenterology", "question": "A child with diarrhea has lethargy, very weak pulse and prolonged capillary refill. What takes priority over routine oral rehydration?", "options": ["Begin oral rehydration at 75 mL/kg over four hours before treating the shock", "Use nasogastric ORS as the initial resuscitation despite poor perfusion", "Begin maintenance IV fluids without an initial shock-resuscitation strategy", "Immediate shock resuscitation and close monitoring"], "answer": 3, "explanation": "Circulatory shock requires prompt resuscitation; ORS alone is insufficient initially. Why not the others (added — not from source): A. Begin oral rehydration at 75 mL/kg over four hours before treating the shock — Plan B ORS is for some dehydration without shock; lethargy, weak pulse and prolonged capillary refill indicate shock, needing IV or IO resuscitation first.; B. Use nasogastric ORS as the initial resuscitation despite poor perfusion — Nasogastric ORS is an option for severe dehydration when IV access fails, but it cannot restore circulating volume fast enough to treat shock.; C. Begin maintenance IV fluids without an initial shock-resuscitation strategy — Maintenance fluids do not correct the circulating volume deficit in shock; isotonic boluses with frequent reassessment are needed first.", "pearl": "Circulatory shock requires prompt resuscitation.", "note": "From Day 33 · High difficulty"}, {"num": 136, "pos": 136, "section": 2, "topic": "Gastroenterology", "question": "A child with acute watery diarrhea has no blood, high fever or travel risk. What is the appropriate antibiotic principle?", "options": ["Avoid routine empiric antibiotics and focus on rehydration", "Empiric azithromycin for all uncomplicated watery diarrhea", "Empiric cefixime because the child has frequent stools", "Metronidazole because watery diarrhea is presumed protozoal"], "answer": 0, "explanation": "Most acute watery childhood diarrhea is self-limited; antibiotics are reserved for defined indications. Why not the others (added — not from source): B. Empiric azithromycin for all uncomplicated watery diarrhea — Uncomplicated watery diarrhoea is mostly viral; routine azithromycin adds no benefit and promotes resistance, with antibiotics reserved for dysentery, suspected cholera or other defined indications.; C. Empiric cefixime because the child has frequent stools — Stool frequency is not an antibiotic indication; without blood, systemic toxicity or other defined criteria, rehydration and zinc are the treatment.; D. Metronidazole because watery diarrhea is presumed protozoal — Metronidazole is used only for confirmed giardiasis or amoebiasis; acute watery diarrhoea should not be presumed protozoal.", "pearl": "Most acute watery childhood diarrhea is self-limited.", "note": "From Day 33 · Basic / easily confused"}, {"num": 137, "pos": 137, "section": 2, "topic": "Gastroenterology", "question": "A 5-year-old has persistent diarrhea for 17 days with weight loss. Which classification applies?", "options": ["Acute diarrhea because stool frequency remains elevated", "Chronic diarrhea because symptoms have exceeded 7 days", "Dysentery because the illness has lasted more than 14 days", "Persistent diarrhea"], "answer": 3, "explanation": "Diarrhea lasting 14 days or longer is persistent and warrants nutritional and etiologic review. Why not the others (added — not from source): A. Acute diarrhea because stool frequency remains elevated — Acute diarrhoea lasts less than 14 days; classification depends on duration, not stool frequency.; B. Chronic diarrhea because symptoms have exceeded 7 days — Chronic diarrhoea usually means 4 weeks or more (often 30 days); 17 days falls in the WHO persistent category of 14 days or more.; C. Dysentery because the illness has lasted more than 14 days — Dysentery is defined by visible blood in stool, not duration; this child has no reported blood.", "pearl": "Diarrhea lasting 14 days or longer is persistent and warrants nutritional and etiologic review.", "note": "From Day 33 · Clinical / application"}, {"num": 138, "pos": 138, "section": 2, "topic": "Gastroenterology", "question": "A toddler has chronic diarrhea, abdominal distension and growth faltering after introduction of wheat. Which initial serology is most appropriate while eating gluten?", "options": ["Use deamidated gliadin peptide IgG as the initial serologic test before clarifying IgA status", "EMA-IgA alone without measuring total IgA or tTG-IgA", "Total IgA and tissue transglutaminase IgA", "HLA-DQ2/DQ8 testing as the primary screening test"], "answer": 2, "explanation": "ESPGHAN recommends total IgA plus tTG-IgA for initial screening while on gluten. Why not the others (added — not from source): A. Use deamidated gliadin peptide IgG as the initial serologic test before clarifying IgA status — DGP-IgG is the second-line test in IgA deficiency; when IgA is normal, tTG-IgA is more accurate, so total IgA must be known first.; B. EMA-IgA alone without measuring total IgA or tTG-IgA — EMA-IgA is observer-dependent and used for confirmation; without total IgA, a false negative from IgA deficiency cannot be recognised.; D. HLA-DQ2/DQ8 testing as the primary screening test — HLA-DQ2/DQ8 is common in the general population; its value is a high negative predictive value, not positive diagnosis, so it is not a screening test.", "pearl": "ESPGHAN recommends total IgA plus tTG-IgA for initial screening while on gluten.", "note": "From Day 33 · High difficulty"}, {"num": 139, "pos": 139, "section": 2, "topic": "Gastroenterology", "question": "A child has chronic diarrhea, tTG-IgA 12 times ULN and normal total IgA. Which additional step supports a no-biopsy diagnosis under ESPGHAN 2020?", "options": ["HLA-DQ2 positivity in a single sample", "Typical symptoms plus the high tTG-IgA titer without a confirmatory second sample", "Repeat tTG-IgA in the same sample instead of a confirmatory EMA-IgA sample", "Positive EMA-IgA in a second blood sample with specialist agreement"], "answer": 3, "explanation": "No-biopsy diagnosis requires tTG-IgA ≥10× ULN and EMA-IgA confirmation in a second sample. Why not the others (added — not from source): A. HLA-DQ2 positivity in a single sample — ESPGHAN 2020 removed HLA testing from the no-biopsy criteria; HLA positivity is common and does not confirm coeliac disease.; B. Typical symptoms plus the high tTG-IgA titer without a confirmatory second sample — Even with typical symptoms and tTG-IgA ≥10× ULN, ESPGHAN requires a positive EMA-IgA in a second sample to protect against lab or sample error.; C. Repeat tTG-IgA in the same sample instead of a confirmatory EMA-IgA sample — Repeating tTG-IgA on the same sample does not guard against sample mix-up or provide independent confirmation; EMA-IgA on a separate sample is required.", "pearl": "No-biopsy diagnosis requires tTG-IgA ≥10× ULN and EMA-IgA confirmation in a second sample.", "note": "From Day 33 · High difficulty"}, {"num": 140, "pos": 140, "section": 2, "topic": "Gastroenterology", "question": "A child has tTG-IgA 4 times ULN with normal total IgA. Which next step is generally recommended by ESPGHAN?", "options": ["Start a gluten-free diet and repeat tTG-IgA after serologic improvement", "Use HLA-DQ2 positivity to establish the diagnosis without histology", "Specialist-directed duodenal biopsies while on gluten", "Use a second-sample EMA-IgA result alone to qualify for the no-biopsy pathway at this titer"], "answer": 2, "explanation": "tTG-IgA below 10× ULN does not meet the no-biopsy threshold; histology is generally required. Why not the others (added — not from source): A. Start a gluten-free diet and repeat tTG-IgA after serologic improvement — Starting a gluten-free diet before confirmation can normalise serology and histology and prevent a firm diagnosis; biopsy should be done while eating gluten.; B. Use HLA-DQ2 positivity to establish the diagnosis without histology — HLA typing cannot confirm coeliac disease; it only helps exclude it when negative, and does not replace histology.; D. Use a second-sample EMA-IgA result alone to qualify for the no-biopsy pathway at this titer — The no-biopsy route needs tTG-IgA ≥10× ULN; a positive EMA at 4× ULN does not qualify, so biopsy is still needed.", "pearl": "tTG-IgA below 10× ULN does not meet the no-biopsy threshold.", "note": "From Day 33 · Conceptual"}, {"num": 141, "pos": 141, "section": 2, "topic": "Gastroenterology", "question": "A child with selective IgA deficiency has chronic diarrhea and negative tTG-IgA. What testing adjustment is most appropriate?", "options": ["Use an IgG-based celiac serologic test", "Repeat tTG-IgA because selective IgA deficiency does not affect this assay", "Use HLA-DQ2/DQ8 testing as the diagnostic serologic replacement", "Proceed directly to biopsy without obtaining an appropriate IgG-based serologic test"], "answer": 0, "explanation": "IgA deficiency makes IgA-based serology unreliable; IgG-based testing is indicated. Why not the others (added — not from source): B. Repeat tTG-IgA because selective IgA deficiency does not affect this assay — IgA deficiency makes all IgA-based tests unreliable; a negative tTG-IgA is expected and does not exclude coeliac disease.; C. Use HLA-DQ2/DQ8 testing as the diagnostic serologic replacement — HLA-DQ2/DQ8 has only negative predictive value; a positive result cannot replace serology or diagnose coeliac disease.; D. Proceed directly to biopsy without obtaining an appropriate IgG-based serologic test — Biopsy is guided by a positive IgG-based test (DGP-IgG, tTG-IgG or EMA-IgG); skipping serology loses an important pre-biopsy step.", "pearl": "IgA deficiency makes IgA-based serology unreliable.", "note": "From Day 34 · Basic / easily confused"}, {"num": 142, "pos": 142, "section": 2, "topic": "Gastroenterology", "question": "A 7-year-old with recurrent abdominal pain has normal growth, no bleeding, no nocturnal symptoms and normal examination. What is the best initial approach?", "options": ["Positive clinical diagnosis of functional abdominal pain with targeted evaluation and follow-up", "Order colonoscopy before making a positive functional diagnosis despite absence of alarm features", "Obtain cross-sectional abdominal imaging as the first investigation", "Start empiric acid suppression as the diagnostic test for all recurrent abdominal pain"], "answer": 0, "explanation": "Absence of alarm features supports a functional disorder with focused, not indiscriminate, testing. Why not the others (added — not from source): B. Order colonoscopy before making a positive functional diagnosis despite absence of alarm features — Without alarm features, colonoscopy has very low yield and exposes the child to an invasive procedure; Rome IV supports a positive clinical diagnosis.; C. Obtain cross-sectional abdominal imaging as the first investigation — Routine CT or MRI is not indicated without alarm features; it is low-yield, costly and CT adds radiation.; D. Start empiric acid suppression as the diagnostic test for all recurrent abdominal pain — Acid suppression is not a diagnostic test for functional abdominal pain and has risks; it may be tried only for dyspeptic symptoms.", "pearl": "Absence of alarm features supports a functional disorder with focused, not indiscriminate, testing.", "note": "From Day 34 · Integrated / rank-differentiating"}, {"num": 143, "pos": 143, "section": 2, "topic": "Gastroenterology", "question": "A 12-year-old has nocturnal diarrhea, weight loss, growth deceleration and elevated fecal calprotectin. Which diagnosis requires exclusion?", "options": ["Prioritize celiac disease despite the inflammatory stool marker and nocturnal diarrhea", "Inflammatory bowel disease", "Irritable bowel syndrome despite weight loss and growth deceleration", "Functional abdominal pain disorder despite multiple alarm features"], "answer": 1, "explanation": "Alarm features and inflammatory stool markers raise concern for IBD. Why not the others (added — not from source): A. Prioritize celiac disease despite the inflammatory stool marker and nocturnal diarrhea — Coeliac disease should be screened for, but nocturnal diarrhoea with raised faecal calprotectin indicates intestinal inflammation and points to IBD as the main diagnosis to exclude.; C. Irritable bowel syndrome despite weight loss and growth deceleration — IBS is a functional diagnosis excluded by alarm features such as nocturnal symptoms, weight loss, growth deceleration and raised calprotectin.; D. Functional abdominal pain disorder despite multiple alarm features — Functional abdominal pain requires absence of alarm features; this child has several plus raised calprotectin, so organic disease must be excluded.", "pearl": "Alarm features and inflammatory stool markers raise concern for IBD.", "note": "From Day 34 · Conceptual"}, {"num": 144, "pos": 144, "section": 2, "topic": "Gastroenterology", "question": "A teenager has chronic bloody diarrhea, urgency and continuous colonic inflammation extending proximally from the rectum. Which IBD phenotype is most likely?", "options": ["Celiac disease", "Ulcerative colitis", "Irritable bowel syndrome", "Crohn disease with skip lesions"], "answer": 1, "explanation": "Continuous mucosal colitis beginning in the rectum is characteristic of UC. Why not the others (added — not from source): A. Celiac disease — Coeliac disease affects the small-bowel mucosa and does not cause continuous colitis or bloody diarrhoea with urgency.; C. Irritable bowel syndrome — IBS is functional with normal mucosa and no rectal bleeding; endoscopic continuous colitis excludes it.; D. Crohn disease with skip lesions — Crohn disease shows skip lesions and may spare the rectum; continuous inflammation extending proximally from the rectum is typical of UC.", "pearl": "Continuous mucosal colitis beginning in the rectum is characteristic of UC.", "note": "From Day 34 · Conceptual"}, {"num": 145, "pos": 145, "section": 2, "topic": "Gastroenterology", "question": "A teenager has perianal fistulae, weight loss and segmental ileocolonic ulceration. Which diagnosis is most likely?", "options": ["Microscopic colitis as the default pediatric diagnosis", "Functional constipation", "Ulcerative colitis confined to rectal mucosa", "Crohn disease"], "answer": 3, "explanation": "Transmural skip disease with perianal involvement supports Crohn disease. Why not the others (added — not from source): A. Microscopic colitis as the default pediatric diagnosis — Microscopic colitis is rare in children, causes watery diarrhoea with normal-looking mucosa and does not cause perianal fistulae or segmental ulceration.; B. Functional constipation — Functional constipation does not cause weight loss, fistulae or ulceration on endoscopy.; C. Ulcerative colitis confined to rectal mucosa — UC involves continuous mucosal inflammation from the rectum; perianal fistulae, segmental lesions and ileal involvement point to Crohn disease.", "pearl": "Transmural skip disease with perianal involvement supports Crohn disease.", "note": "From Day 34 · Basic / easily confused"}, {"num": 146, "pos": 146, "section": 2, "topic": "Gastroenterology", "question": "A child with suspected IBD has a normal colonoscopy appearance but persistent weight loss and inflammatory markers. Which diagnostic principle is best?", "options": ["Exclude IBD because gross colonic mucosa appears normal", "Include terminal ileal assessment, biopsies and small-bowel imaging as indicated", "Repeat fecal calprotectin alone and defer tissue sampling or small-bowel assessment", "Diagnose a functional disorder once the colon looks normal endoscopically"], "answer": 1, "explanation": "Pediatric IBD assessment integrates endoscopy, histology and small-bowel evaluation. Why not the others (added — not from source): A. Exclude IBD because gross colonic mucosa appears normal — Crohn disease can involve the terminal ileum or proximal small bowel while the colon looks normal, and microscopic inflammation can be present without visible changes.; C. Repeat fecal calprotectin alone and defer tissue sampling or small-bowel assessment — Calprotectin is non-specific and cannot localise or confirm IBD; persistent weight loss and raised inflammatory markers need tissue diagnosis and small-bowel evaluation.; D. Diagnose a functional disorder once the colon looks normal endoscopically — Weight loss and raised inflammatory markers are alarm features against a functional disorder; a normal colon does not exclude small-bowel Crohn disease.", "pearl": "Pediatric IBD assessment integrates endoscopy, histology and small-bowel evaluation.", "note": "From Day 34 · Integrated / rank-differentiating"}, {"num": 147, "pos": 147, "section": 2, "topic": "Gastroenterology", "question": "An infant develops delayed repetitive vomiting, pallor and lethargy 2 hours after a specific food, without urticaria or wheeze. Which diagnosis fits?", "options": ["Food protein-induced enterocolitis syndrome", "IgE-mediated food allergy with an atypically absent immediate skin or respiratory reaction", "Cyclic vomiting syndrome triggered by repeated exposure to a single food", "Hereditary fructose intolerance before introduction of fructose- or sucrose-containing foods"], "answer": 0, "explanation": "FPIES causes delayed gastrointestinal/systemic symptoms without typical immediate IgE features. Why not the others (added — not from source): B. IgE-mediated food allergy with an atypically absent immediate skin or respiratory reaction — IgE-mediated reactions usually occur within minutes to an hour with urticaria, angioedema or wheeze; isolated delayed repetitive vomiting with pallor fits FPIES.; C. Cyclic vomiting syndrome triggered by repeated exposure to a single food — Cyclic vomiting syndrome causes stereotyped episodes not tied to a specific food; reproducible vomiting 1–4 hours after one food is typical of FPIES.; D. Hereditary fructose intolerance before introduction of fructose- or sucrose-containing foods — Hereditary fructose intolerance only causes symptoms after fructose or sucrose exposure, with hypoglycaemia and liver dysfunction; it cannot occur before such foods are introduced.", "pearl": "FPIES causes delayed gastrointestinal/systemic symptoms without typical immediate IgE features.", "note": "From Day 34 · Integrated / rank-differentiating"}, {"num": 148, "pos": 148, "section": 2, "topic": "Gastroenterology", "question": "A child with suspected lactose malabsorption has bloating and watery stool after milk but tolerates yogurt better. What mechanism explains symptoms?", "options": ["Cow-milk protein allergy causing immune-mediated mucosal inflammation", "Pancreatic exocrine insufficiency causing fat malabsorption", "Unabsorbed lactose undergoes colonic fermentation and osmotic water retention", "Celiac disease causing diffuse small-bowel mucosal injury"], "answer": 2, "explanation": "Lactase deficiency produces osmotic diarrhea and gas from carbohydrate fermentation. Why not the others (added — not from source): A. Cow-milk protein allergy causing immune-mediated mucosal inflammation — Cow's milk protein allergy is immune-mediated and would be triggered by yogurt too, as it contains the same proteins; better yogurt tolerance indicates a lactose problem.; B. Pancreatic exocrine insufficiency causing fat malabsorption — Pancreatic insufficiency causes steatorrhoea with fat malabsorption regardless of dairy type, not bloating and watery stools linked to milk.; D. Celiac disease causing diffuse small-bowel mucosal injury — Coeliac disease is triggered by gluten, not milk, and would not explain improved tolerance of yogurt, which contains less lactose and bacterial lactase.", "pearl": "Lactase deficiency produces osmotic diarrhea and gas from carbohydrate fermentation.", "note": "From Day 34 · Clinical / application"}, {"num": 149, "pos": 149, "section": 2, "topic": "Gastroenterology", "question": "A child with chronic constipation has fecal soiling, large stools and palpable fecal mass. Which management sequence is most appropriate?", "options": ["Begin maintenance polyethylene glycol without first clearing the fecal impaction", "Use repeated rectal enemas as long-term maintenance without an oral maintenance plan", "Disimpaction followed by maintenance laxative and behavioral plan", "Refer directly for surgery before an adequate medical disimpaction and maintenance program"], "answer": 2, "explanation": "Overflow soiling reflects fecal retention; disimpaction precedes maintenance treatment. Why not the others (added — not from source): A. Begin maintenance polyethylene glycol without first clearing the fecal impaction — Maintenance laxatives alone with a large faecal mass can increase overflow soiling and pain; NASPGHAN/ESPGHAN advise disimpaction first.; B. Use repeated rectal enemas as long-term maintenance without an oral maintenance plan — Long-term enemas are invasive and distressing; after disimpaction, maintenance should be oral PEG with toilet training and behavioural measures.; D. Refer directly for surgery before an adequate medical disimpaction and maintenance program — Most childhood constipation is functional and responds to medical therapy; surgery is only for refractory cases after full evaluation.", "pearl": "Overflow soiling reflects fecal retention.", "note": "From Day 34 · Clinical / application"}, {"num": 150, "pos": 150, "section": 2, "topic": "Gastroenterology", "question": "A child has chronic diarrhea, iron deficiency, growth failure and positive celiac serology. Which dietary instruction is correct before diagnostic confirmation?", "options": ["Reduce gluten intake substantially while repeat serology and biopsy are being arranged", "Continue gluten until specialist-directed diagnostic testing is complete", "Start a strict gluten-free diet immediately and rely on clinical response to confirm the diagnosis", "Eliminate dairy while continuing the usual gluten intake as the diagnostic intervention"], "answer": 1, "explanation": "Gluten withdrawal before confirmation can normalize serology and histology, complicating diagnosis. Why not the others (added — not from source): A. Reduce gluten intake substantially while repeat serology and biopsy are being arranged — Even partial gluten reduction can lower antibody titres and improve histology, causing false-negative tests; normal gluten intake should continue.; C. Start a strict gluten-free diet immediately and rely on clinical response to confirm the diagnosis — A gluten-free diet before confirmation can mask the diagnosis, and clinical response is not diagnostic; it commits the child to lifelong restriction without proof.; D. Eliminate dairy while continuing the usual gluten intake as the diagnostic intervention — Dairy elimination does not help diagnose coeliac disease; diagnosis is by serology and, where needed, biopsy while eating gluten.", "pearl": "Gluten withdrawal before confirmation can normalize serology and histology, complicating diagnosis.", "note": "From Day 34 · High difficulty"}];
const KEY='gm:'+EXAM.id+':v2', SEC_MS=EXAM.sectionMinutes*60000, NS=EXAM.sections.length;

 let changed=false;

 return changed;

function editable(q){return !S.finished&&q.section===S.section&&!S.locked.includes(q.section)}
function status(n){const a=S.answers[n]!=null,m=!!S.marked[n],v=!!S.visited[n];return a&&m?'am':m?'m':a?'a':v?'na':'nv'}
function start(){

  <div class="counts">Sections: ${EXAM.sections.map((s,i)=>`${esc(s.name)} ${S.locked.includes(i)?'🔒 locked':i===S.section?'▶ active':'⏳ upcoming'}`).join('<br>')}</div>
  <div class="actions"><button class="danger" style="width:100%" onclick="askSubmit()">Submit ${esc(EXAM.sections[S.section].name)}</button></div>
  <p class="small">Answers in this section can be changed until its time ends or you submit it. Locked sections cannot be reopened.</p>
 </div></div>`;
}
function guard(){if(catchUp()||S.finished){start();return false}return true}
function pick(i){if(!guard())return;const q=secQs(S.section)[cur];if(!editable(q))return;S.answers[q.num]=i;save();renderExam()}
function clearResp(){if(!guard())return;const q=secQs(S.section)[cur];if(!editable(q))return;delete S.answers[q.num];save();renderExam()}
function go(i){document.body.classList.remove('pal-open');if(!guard())return;const n=secQs(S.section).length;cur=Math.max(0,Math.min(n-1,i));renderExam()}
function markNext(){if(!guard())return;const q=secQs(S.section)[cur];S.marked[q.num]=true;save();go(cur+1)}
function saveNext(){if(!guard())return;const q=secQs(S.section)[cur];delete S.marked[q.num];save();go(cur+1)}
function closeDlg(){document.getElementById('ov').classList.remove('show')}
function askSubmit(){
 if(!guard())return;
 const qs=secQs(S.section),un=qs.filter(q=>S.answers[q.num]==null).length,mk=qs.filter(q=>S.marked[q.num]).length,last=S.section===NS-1;
 document.getElementById('dlg').innerHTML=`<h3 style="margin-top:0">Submit ${esc(EXAM.sections[S.section].name)}?</h3>
  <p>You still have <b>${fmt(S.sectionEnd-Date.now())}</b> remaining.<br>Unanswered: <b>${un}</b> · Marked for review: <b>${mk}</b></p>
  <p>Once submitted, answers in this section <b>cannot be changed</b>.${last?' This is the last section — the exam will end and be scored.':` ${esc(EXAM.sections[S.section+1].name)} starts immediately with a fresh ${EXAM.sectionMinutes}-minute timer.`}</p>
  <div class="actions"><button class="secondary" onclick="closeDlg()">Cancel</button><span class="spacer"></span><button class="danger" onclick="doSubmit()">Submit Section</button></div>`;
 document.getElementById('ov').classList.add('show');
}
function doSubmit(){
 closeDlg();if(!guard())return;
 lockSection(S.section,'submitted');
 if(S.section>=NS-1){finish();clearInterval(tick);renderResult();return}
 S.section++;S.sectionStart[S.section]=Date.now();S.sectionEnd=Date.now()+SEC_MS;cur=0;save();renderExam();onTick();
}
// ---------- results ----------
function score(qs){let c=0,w=0,u=0;qs.forEach(q=>{const a=S.answers[q.num];if(a==null)u++;else if(a===q.answer)c++;else w++});return{c,w,u,a:c+w,s:c*4-w,max:qs.length*4}}
function st(q){const a=S.answers[q.num];return a==null?'un':a===q.answer?'correct':'wrong'}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function pct(x){return x.max?Math.round(x.s/x.max*10000)/100:0}
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notify(){
 if(S.notified)return;S.notified=true;save();
 const o=score(Q),lines=[`Total questions: ${Q.length}`,`Attempted: ${o.a}`,`Unattempted: ${o.u}`,`Correct: ${o.c}`,`Wrong: ${o.w}`,`Score: ${o.s} / ${o.max}`,`Percentage: ${pct(o)}%`,`Time: ${dur(S.finishedAt-S.startedAt)}`];
 EXAM.sections.forEach((s,i)=>{const x=score(secQs(i));lines.push(`${s.name}: ${x.s}/${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`)});
 wrongLines(Q.filter(q=>st(q)==='wrong').map(q=>({num:q.pos,options:q.options,chosen:S.answers[q.num],answer:q.answer})),lines,EXAM.title.split(' — ')[0]);
 Notify.send(EXAM.title+' — Mock finished','trophy',lines.join('\n'));
}
function renderResult(){
 clearInterval(tick);document.getElementById('timer').textContent='Done';document.getElementById('timer').classList.remove('low');
 document.getElementById('secLabel').textContent='Exam completed — result & review';
 const o=score(Q);
 const secRows=EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<tr><td>${esc(s.name)} (Q${secQs(i)[0].pos}–${secQs(i).at(-1).pos})</td><td>${x.c}</td><td>${x.w}</td><td>${x.u}</td><td><b>${x.s}</b> / ${x.max}</td><td>${S.lockedHow[i]==='submitted'?'Submitted':'Time up'}</td></tr>`}).join('');
 const topics=[...new Set(Q.map(q=>q.topic))];
 const topRows=topics.map(t=>{const x=score(Q.filter(q=>q.topic===t));return `<tr><td>${esc(t)}</td><td>${x.c}</td><td>${x.w}</td><td>${x.u}</td><td>${x.s} / ${x.max}</td><td>${x.a?Math.round(x.c/x.a*100):0}%</td></tr>`}).join('');
 document.getElementById('app').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(EXAM.title)} — Result</h2>
  <div class="stats"><div class="stat"><strong>${o.s}</strong>Score / ${o.max}</div><div class="stat"><strong>${pct(o)}%</strong>Percentage</div><div class="stat"><strong>${o.c}</strong>Correct</div><div class="stat"><strong>${o.w}</strong>Wrong</div>
  <div class="stat"><strong>${o.a}</strong>Attempted</div><div class="stat"><strong>${o.u}</strong>Unattempted</div><div class="stat"><strong>${Q.length}</strong>Total questions</div><div class="stat"><strong>${dur(S.finishedAt-S.startedAt)}</strong>Total time</div></div>
  <h3>Section-wise performance</h3><table><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Score</th><th>Ended by</th></tr>${secRows}<tr><td><b>Overall</b></td><td>${o.c}</td><td>${o.w}</td><td>${o.u}</td><td><b>${o.s}</b> / ${o.max}</td><td></td></tr></table>
  <h3>Topic-wise performance</h3><table><tr><th>Topic</th><th>Correct</th><th>Wrong</th><th>Unatt.</th><th>Score</th><th>Accuracy</th></tr>${topRows}</table>
  <div class="actions"><button class="secondary" onclick="downloadWord()">Download Wrong Answers</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button><span class="spacer"></span><a class="btn secondary" href="index.html">Mock home</a></div>
 </div>
 <div id="nbBox"></div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Answer review</h3>
  <div class="filters">${[['all','All'],['wrong','Wrong'],['correct','Correct'],['un','Unattempted'],['marked','Marked for Review']].map(([k,l])=>`<button class="secondary ${reviewFilter===k?'on':''}" onclick="setFilter('${k}')">${l} (${filt(k).length})</button>`).join('')}</div>
  <div id="rvList">${filt(reviewFilter).map(rvItem).join('')||'<p class="small">No questions in this filter.</p>'}</div></div>`;
 if(window.Notebook){nbRecord();Notebook.panel(document.getElementById('nbBox'),Q.filter(q=>st(q)==='wrong').map(q=>NB_CTX.srcId+':'+q.num),`${NB_CTX.label} — Error notes`);}
}
function filt(k){return Q.filter(q=>k==='all'||(k==='marked'?!!S.marked[q.num]:st(q)===k))}
function setFilter(k){reviewFilter=k;renderResult()}
function rvItem(q){
 const a=S.answers[q.num],s=st(q);
 return `<div class="rv ${s}"><div class="small">${esc(q.topic)} · ${esc(EXAM.sections[q.section].name)}${S.marked[q.num]?' · marked for review':''}</div>
 <b>Q${q.pos}. ${esc(q.question)}</b>${q.pos!==q.num?` <small style="color:var(--muted);font-weight:500">(source Q${q.num})</small>`:''}<br><span class="st ${s}">${s==='correct'?'✓ Correct (+4)':s==='wrong'?'✗ Wrong (−1)':'— Unattempted (0)'}</span><br>
 <b>Your response:</b> ${a==null?'Not answered':`${L(a)}. ${esc(q.options[a])}`}<br><b>Correct response:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}
 ${q.note?`<div class="note"><b>Note:</b> ${esc(q.note)}</div>`:''}
 <div class="explain"><b>Explanation${q.explanationSource==='added'?' <small>(added — not from source)</small>':''}:</b> ${esc(q.explanation)}</div>
 ${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}</div>`;
}
function reportBody(){
 const o=score(Q),wrong=Q.filter(q=>st(q)==='wrong'),un=Q.filter(q=>st(q)==='un');
 let h=`<h1>${esc(EXAM.title)} — Wrong Answer Report</h1><p><b>Overall score:</b> ${o.s} / ${o.max} (${pct(o)}%) · Correct ${o.c} · Wrong ${o.w} · Unattempted ${o.u} · Time ${dur(S.finishedAt-S.startedAt)}</p><p>`+
  EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<b>${esc(s.name)}:</b> ${x.s} / ${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`}).join('<br>')+'</p><h2>Wrong answers</h2>';
 if(!wrong.length)h+='<p>No wrong answers.</p>';
 wrong.forEach((q,i)=>{h+=`<hr><h3>${i+1}. Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}. ${esc(q.question)}</h3><p><b>Your answer:</b> ${L(S.answers[q.num])}. ${esc(q.options[S.answers[q.num]])}</p><p><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>${q.note?`<p><b>Note:</b> ${esc(q.note)}</p>`:''}<p><b>Explanation${q.explanationSource==='added'?' (added — not from source)':''}:</b> ${esc(q.explanation)}</p>${q.pearl?`<p><b>Exam pearl:</b> ${esc(q.pearl)}</p>`:''}`});
 if(un.length){h+='<h2>Unattempted questions</h2>';un.forEach(q=>{h+=`<p><b>Q${q.pos}${q.pos!==q.num?` (source Q${q.num})`:''}.</b> ${esc(q.question)}<br><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>`})}
 return h;
}
function baseName(){return `${EXAM.id}_${stamp()}_Wrong_Answers`}
function downloadWord(){const b=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=baseName()+'.doc';a.click();URL.revokeObjectURL(u)}
function printPDF(){const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${baseName()}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}
window.addEventListener('storage',e=>{if(e.key===KEY)start()});
start();
</script></body></html>
