<script>
const EXAM={"id": "Cumulative_Day35", "title": "Cumulative Mock — Day 35 Checkpoint", "source": "source/NEET_SS_ICP_Day35_Cumulative_Mock_COMPREHENSIVE_REVIEW_EDITION_2026-11-02.docx", "sectionMinutes": 50, "sections": [{"name": "Section A"}, {"name": "Section B"}, {"name": "Section C"}], "marking": {"correct": 4, "wrong": -1, "unattempted": 0}, "pattern": "NEET-SS pattern — 3 time-bound sections of 50 questions / 50 minutes, +4/−1/0"};
const Q=[{"num": 1, "pos": 1, "section": 0, "topic": "Neonatology", "question": "A term infant remains apneic after drying and positioning; HR is 85/min. Which action should immediately take priority?", "options": ["Give epinephrine through a peripheral vein", "Begin effective positive-pressure ventilation and assess chest movement", "Observe for another minute with blow-by oxygen", "Start chest compressions before ventilation"], "answer": 1, "explanation": "Ventilation is the first lifesaving intervention for apnea with HR below 100; compressions follow only if HR remains below 60 after effective ventilation. Why not the others (added — not from source): A. Give epinephrine through a peripheral vein — Epinephrine is indicated only if HR stays below 60/min despite effective ventilation and 60 seconds of compressions; here HR is 85 and no ventilation has been given, and the umbilical vein, not a peripheral vein, is the preferred route.; C. Observe for another minute with blow-by oxygen — Apnoea with HR below 100/min after initial steps mandates PPV within the first minute; blow-by oxygen cannot ventilate an apnoeic baby and further observation wastes critical time.; D. Start chest compressions before ventilation — Compressions start only when HR remains below 60/min after at least 30 seconds of ventilation that moves the chest; HR 85 with no ventilation yet does not qualify.", "pearl": "Ventilation is the first lifesaving intervention for apnea with HR below 100.", "note": "From Day 1 · Basic / easily confused"}, {"num": 2, "pos": 2, "section": 0, "topic": "Neonatology", "question": "After 30 seconds of PPV with visible chest rise, a newborn's HR is 48/min. Which next intervention is indicated?", "options": ["Begin synchronized cardioversion because the heart rate is below 60/min", "Begin coordinated 3:1 compressions with ventilation and increase oxygen as recommended", "Continue effective PPV alone for another 30 seconds before reassessing", "Administer intravascular epinephrine before starting compressions"], "answer": 1, "explanation": "Persistently <60 after effective ventilation warrants coordinated compressions; neonatal bradycardia is usually hypoxic, not shockable. Why not the others (added — not from source): A. Begin synchronized cardioversion because the heart rate is below 60/min — Neonatal bradycardia is almost always hypoxic sinus bradycardia, not a shockable rhythm, and cardioversion has no place in the NRP algorithm.; C. Continue effective PPV alone for another 30 seconds before reassessing — Thirty seconds of effective PPV with chest rise has already been given; persistent HR below 60/min is the defined trigger to add compressions, so more PPV alone delays circulatory support.; D. Administer intravascular epinephrine before starting compressions — Compressions come first; epinephrine is given only if HR stays below 60/min after 60 seconds of coordinated compressions with effective ventilation.", "pearl": "Persistently <60 after effective ventilation warrants coordinated compressions.", "note": "From Day 1 · Clinical / application"}, {"num": 3, "pos": 3, "section": 0, "topic": "Neonatology", "question": "A newborn on mask PPV has no chest rise and HR remains 75/min. The mask seal is poor. What is the most appropriate immediate correction?", "options": ["Increase peak inflation pressure before correcting the mask seal", "Insert an oropharyngeal airway before repeating mask ventilation", "Move directly to an alternative airway without first correcting mask position", "Reapply the mask and optimize airway positioning before escalating"], "answer": 3, "explanation": "Correcting ineffective ventilation takes precedence; no chest movement makes HR-based escalation unreliable. Why not the others (added — not from source): A. Increase peak inflation pressure before correcting the mask seal — With a poor seal, raising pressure mainly increases leak; MR SOPA corrects mask seal and head position before pressure is increased.; B. Insert an oropharyngeal airway before repeating mask ventilation — An oral airway is an occasional adjunct, not the first correction; a leaking mask is fixed by reapplying it and repositioning the head.; C. Move directly to an alternative airway without first correcting mask position — An alternative airway is indicated only after the simple corrective steps (mask, reposition, suction, open mouth, pressure) fail; a fixable mask leak should be corrected first.", "pearl": "Correcting ineffective ventilation takes precedence.", "note": "From Day 1 · High difficulty"}, {"num": 4, "pos": 4, "section": 0, "topic": "Neonatology", "question": "A 39-week newborn needs PPV after delivery. Which initial oxygen strategy is most consistent with contemporary neonatal guidance?", "options": ["Start with 21% oxygen but titrate according to clinical appearance rather than preductal oximetry", "Start with room air and titrate using preductal saturation", "Start with 30% oxygen and titrate using preductal saturation", "Start with 100% oxygen and reduce after initial stabilization"], "answer": 1, "explanation": "For term infants, air is a reasonable starting concentration; titration avoids unnecessary hyperoxia. Why not the others (added — not from source): A. Start with 21% oxygen but titrate according to clinical appearance rather than preductal oximetry — Starting in air is right, but skin colour is an unreliable guide to oxygenation; NRP titrates oxygen to target preductal SpO2 from a right-hand oximeter.; C. Start with 30% oxygen and titrate using preductal saturation — 21-30% oxygen is the starting range for infants below 35 weeks; a 39-week baby should start in room air (21%) to avoid unnecessary hyperoxia.; D. Start with 100% oxygen and reduce after initial stabilization — Resuscitating term infants with 100% oxygen is associated with higher mortality and oxidative injury than air; 100% is reserved for when chest compressions begin.", "pearl": "For term infants, air is a reasonable starting concentration.", "note": "From Day 1 · High difficulty"}, {"num": 5, "pos": 5, "section": 0, "topic": "Neonatology", "question": "A baby requires emergency vascular access during ongoing neonatal resuscitation. Which access is generally preferred when readily feasible?", "options": ["Umbilical arterial catheter", "Intraosseous access in preference to umbilical vein", "Femoral arterial catheter", "Umbilical venous catheter"], "answer": 3, "explanation": "Umbilical venous access is preferred for neonatal resuscitation drugs; IO is an alternative when IV access is not feasible. Why not the others (added — not from source): A. Umbilical arterial catheter — The umbilical artery is used for blood pressure monitoring and sampling, not for resuscitation drugs or volume, and it is harder to place quickly.; B. Intraosseous access in preference to umbilical vein — IO access is an acceptable alternative when a UVC cannot be placed, but it is not preferred over the umbilical vein in the delivery room.; C. Femoral arterial catheter — Femoral arterial access is technically difficult, risks limb ischaemia and is not a route for neonatal resuscitation drugs.", "pearl": "Umbilical venous access is preferred for neonatal resuscitation drugs.", "note": "From Day 1 · High difficulty"}, {"num": 6, "pos": 6, "section": 0, "topic": "Neonatology", "question": "A 29-week infant on CPAP 6 cm H2O develops rising FiO2 need to 0.38 with worsening RDS and remains spontaneously breathing. Which intervention best matches current RDS consensus?", "options": ["Continue CPAP and defer surfactant until FiO2 reaches 0.50", "Intubate solely to administer surfactant despite stable spontaneous breathing", "Consider early surfactant via a thin catheter with ongoing noninvasive support", "Increase CPAP to 8 cm H2O and defer surfactant despite the rising oxygen need"], "answer": 2, "explanation": "Early rescue surfactant on significant noninvasive support reduces prolonged ventilation; thin-catheter delivery is preferred when suitable. Why not the others (added — not from source): A. Continue CPAP and defer surfactant until FiO2 reaches 0.50 — Waiting for FiO2 0.50 delays rescue surfactant; European consensus advises treatment when FiO2 exceeds about 0.30 on CPAP of at least 6 cm H2O with worsening RDS.; B. Intubate solely to administer surfactant despite stable spontaneous breathing — A spontaneously breathing infant on CPAP does not need intubation and ventilation for surfactant; LISA/MIST avoids positive-pressure ventilation and reduces BPD or death.; D. Increase CPAP to 8 cm H2O and defer surfactant despite the rising oxygen need — Raising CPAP may aid recruitment, but FiO2 0.38 on 6 cm H2O with worsening RDS already meets rescue surfactant criteria; deferring it increases CPAP failure and intubation.", "pearl": "Early rescue surfactant on significant noninvasive support reduces prolonged ventilation.", "note": "From Day 2 · Conceptual"}, {"num": 7, "pos": 7, "section": 0, "topic": "Neonatology", "question": "A 26-week infant is intubated for stabilization and has classic surfactant-deficient RDS. Which approach is most appropriate?", "options": ["Administer surfactant promptly while optimizing respiratory support", "Extubate to CPAP immediately without surfactant and reassess oxygen need", "Continue ventilation and defer surfactant until FiO2 exceeds 0.50", "Use caffeine as the primary treatment for the surfactant deficiency"], "answer": 0, "explanation": "Very preterm infants intubated for stabilization with RDS should receive surfactant early. Why not the others (added — not from source): B. Extubate to CPAP immediately without surfactant and reassess oxygen need — A 26-week infant already intubated with classic RDS gains most from surfactant; extubating without it risks rapid CPAP failure and reintubation.; C. Continue ventilation and defer surfactant until FiO2 exceeds 0.50 — Once intubated with RDS, surfactant should be given early; waiting for FiO2 above 0.50 increases air leak, ventilator days and BPD.; D. Use caffeine as the primary treatment for the surfactant deficiency — Caffeine treats apnoea of prematurity and aids extubation but does nothing for alveolar surface tension; it cannot replace surfactant.", "pearl": "Very preterm infants intubated for stabilization with RDS should receive surfactant early.", "note": "From Day 2 · Clinical / application"}, {"num": 8, "pos": 8, "section": 0, "topic": "Neonatology", "question": "A 30-week infant has diffuse fine granular lung opacities, low volumes and air bronchograms. Which mechanism best explains the film?", "options": ["Surfactant excess causing hyperinflation", "Pulmonary vascular congestion from ductal closure", "Surfactant deficiency causing widespread alveolar collapse", "Focal aspiration with unilateral air trapping"], "answer": 2, "explanation": "Low-volume reticulogranular lungs and air bronchograms indicate RDS from surfactant deficiency. Why not the others (added — not from source): A. Surfactant excess causing hyperinflation — Surfactant excess is not a disease mechanism, and the film shows low lung volumes, not hyperinflation.; B. Pulmonary vascular congestion from ductal closure — Ductal closure reduces pulmonary blood flow; congestion comes from a patent duct shunting left to right and does not give low-volume reticulogranular lungs with air bronchograms.; D. Focal aspiration with unilateral air trapping — Aspiration gives patchy, often asymmetric infiltrates with air trapping; this film is diffuse, symmetrical and low-volume.", "pearl": "Low-volume reticulogranular lungs and air bronchograms indicate RDS from surfactant deficiency.", "note": "From Day 2 · Conceptual"}, {"num": 9, "pos": 9, "section": 0, "topic": "Neonatology", "question": "A 35-week infant born by elective cesarean develops tachypnea shortly after birth; radiograph shows prominent fissural fluid and hyperinflation. What is the most likely diagnosis?", "options": ["Meconium aspiration with coarse patchy infiltrates", "Transient tachypnea of the newborn", "Congenital diaphragmatic hernia", "Classic surfactant-deficiency RDS"], "answer": 1, "explanation": "Retained fetal lung fluid causes TTN, typically with fissural fluid and increased lung volumes. Why not the others (added — not from source): A. Meconium aspiration with coarse patchy infiltrates — Meconium aspiration needs meconium-stained liquor, usually in term or post-term babies, and gives coarse patchy opacities rather than fissural fluid.; C. Congenital diaphragmatic hernia — Diaphragmatic hernia shows bowel loops in a hemithorax with mediastinal shift and a scaphoid abdomen, not bilateral fissural fluid.; D. Classic surfactant-deficiency RDS — Surfactant-deficiency RDS gives low lung volumes with ground-glass opacity and air bronchograms; hyperinflation with fissural fluid after elective caesarean favours retained lung fluid.", "pearl": "Retained fetal lung fluid causes TTN, typically with fissural fluid and increased lung volumes.", "note": "From Day 2 · Integrated / rank-differentiating"}, {"num": 10, "pos": 10, "section": 0, "topic": "Neonatology", "question": "A preterm baby on CPAP develops increasing retractions and FiO2 requirement. Which combination is most useful for deciding escalation?", "options": ["Trend of work of breathing, oxygen need, gas exchange and lung imaging", "Use the FiO2 requirement alone as the escalation criterion", "Use the respiratory rate alone as the escalation criterion", "Use a single blood-gas value without incorporating the clinical trajectory"], "answer": 0, "explanation": "Escalation integrates trajectory and gas exchange; no isolated number replaces assessment. Why not the others (added — not from source): B. Use the FiO2 requirement alone as the escalation criterion — FiO2 is a key marker but depends on CPAP level and recruitment; escalation decisions combine it with work of breathing, gas exchange and imaging.; C. Use the respiratory rate alone as the escalation criterion — Respiratory rate is non-specific and varies with state, temperature and handling; it cannot alone define CPAP failure.; D. Use a single blood-gas value without incorporating the clinical trajectory — A single gas can mislead through sampling error or transient fluctuation; the trend together with clinical signs guides escalation.", "pearl": "Escalation integrates trajectory and gas exchange.", "note": "From Day 2 · Clinical / application"}, {"num": 11, "pos": 11, "section": 0, "topic": "Neonatology", "question": "A ventilated preterm infant acutely desaturates; breath sounds are unilateral and transillumination is asymmetric. What must be considered urgently?", "options": ["Endotracheal tube obstruction or displacement", "Tension pneumothorax requiring immediate assessment and decompression if unstable", "Acute pulmonary hemorrhage", "Severe atelectasis from mucus plugging"], "answer": 1, "explanation": "Abrupt unilateral signs with compromise suggest air leak; do not wait for imaging in an unstable infant. Why not the others (added — not from source): A. Endotracheal tube obstruction or displacement — Tube displacement or blockage is part of DOPE and must be checked, but asymmetric transillumination indicates intrapleural air, pointing to pneumothorax.; C. Acute pulmonary hemorrhage — Pulmonary haemorrhage presents with pink frothy secretions from the tube and diffuse opacification, not asymmetric transillumination.; D. Severe atelectasis from mucus plugging — Atelectasis may reduce breath sounds but does not increase transillumination on one side and rarely causes such abrupt collapse.", "pearl": "Abrupt unilateral signs with compromise suggest air leak.", "note": "From Day 3 · Integrated / rank-differentiating"}, {"num": 12, "pos": 12, "section": 0, "topic": "Neonatology", "question": "A ventilated neonate abruptly loses end-tidal CO2 and airway pressure; the ventilator alarm indicates disconnection. Which DOPE category best fits?", "options": ["Tube displacement into right main bronchus", "Tube obstruction", "Pneumothorax", "Equipment failure"], "answer": 3, "explanation": "A disconnected circuit is equipment failure; tube problems and air leak require different bedside checks. Why not the others (added — not from source): A. Tube displacement into right main bronchus — Right main bronchus intubation reduces left-sided air entry with preserved airway pressure; it does not cause loss of circuit pressure with a disconnection alarm.; B. Tube obstruction — Tube obstruction loses ETCO2 but typically triggers high-pressure or low-volume alarms with rising pressure, not loss of airway pressure and a disconnection alarm.; C. Pneumothorax — Pneumothorax causes desaturation, asymmetry and haemodynamic compromise; it does not drop circuit pressure or trigger a disconnection alarm.", "pearl": "A disconnected circuit is equipment failure.", "note": "From Day 3 · Integrated / rank-differentiating"}, {"num": 13, "pos": 13, "section": 0, "topic": "Neonatology", "question": "An infant has pH 7.24, PaCO2 65 mmHg, HCO3 27 mmol/L on ventilation. What is the predominant primary disorder?", "options": ["Respiratory acidosis", "Metabolic alkalosis with compensation", "Respiratory alkalosis", "Metabolic acidosis with compensation"], "answer": 0, "explanation": "High CO2 with acidemia and near-normal bicarbonate indicates primary respiratory acidosis. Why not the others (added — not from source): B. Metabolic alkalosis with compensation — Metabolic alkalosis raises pH; this infant is acidaemic and a bicarbonate of 27 reflects acute renal buffering of the raised CO2.; C. Respiratory alkalosis — Respiratory alkalosis requires low PaCO2 with alkalaemia; here PaCO2 is 65 mmHg and pH 7.24.; D. Metabolic acidosis with compensation — Metabolic acidosis needs a low bicarbonate with compensatory hypocapnia; here bicarbonate is high-normal and PaCO2 is raised.", "pearl": "High CO2 with acidemia and near-normal bicarbonate indicates primary respiratory acidosis.", "note": "From Day 3 · Conceptual"}, {"num": 14, "pos": 14, "section": 0, "topic": "Neonatology", "question": "An infant with evolving BPD at 36 weeks PMA needs low-flow nasal oxygen but no positive-pressure support. Which Jensen 2019 grade is most appropriate?", "options": ["Grade 3 BPD", "Grade 2 BPD", "Grade 1 BPD", "No BPD because oxygen flow is low"], "answer": 2, "explanation": "Jensen grade 1 uses nasal cannula ≤2 L/min at 36 weeks PMA; higher support categories define grades 2 and 3. Why not the others (added — not from source): A. Grade 3 BPD — Jensen grade 3 requires invasive mechanical ventilation at 36 weeks PMA.; B. Grade 2 BPD — Jensen grade 2 requires nasal cannula above 2 L/min or non-invasive positive pressure such as CPAP or NIPPV; low-flow cannula alone does not meet it.; D. No BPD because oxygen flow is low — Under Jensen 2019 any nasal cannula support at 36 weeks PMA defines BPD; low flow sets the grade, it does not exclude the diagnosis.", "pearl": "Jensen grade 1 uses nasal cannula ≤2 L/min at 36 weeks PMA.", "note": "From Day 3 · High difficulty"}, {"num": 15, "pos": 15, "section": 0, "topic": "Neonatology", "question": "A neonate on volume-targeted ventilation has rapidly improving lung compliance after surfactant. What ventilator response best helps prevent volutrauma?", "options": ["Increase the target tidal volume as compliance improves", "Reassess delivered tidal volume and pressure as compliance changes", "Maintain the same peak inspiratory pressure despite the higher delivered tidal volume", "Increase PEEP primarily to compensate for the increased compliance"], "answer": 1, "explanation": "Rapid compliance changes alter delivered volumes; volume monitoring prevents overdistension. Why not the others (added — not from source): A. Increase the target tidal volume as compliance improves — As compliance improves the same pressure delivers larger volumes; raising the volume target would directly worsen volutrauma.; C. Maintain the same peak inspiratory pressure despite the higher delivered tidal volume — Holding the same PIP while delivered volume rises is exactly how volutrauma happens; pressure must fall as compliance improves.; D. Increase PEEP primarily to compensate for the increased compliance — PEEP is set for recruitment and oxygenation; raising it after surfactant, when lungs are more compliant, risks overdistension and impaired venous return.", "pearl": "Rapid compliance changes alter delivered volumes.", "note": "From Day 3 · Integrated / rank-differentiating"}, {"num": 16, "pos": 16, "section": 0, "topic": "Neonatology", "question": "A 28-week infant has apnea with bradycardia but is otherwise well; infection and metabolic triggers have been excluded. Which maintenance therapy has the strongest routine role?", "options": ["Low-flow supplemental oxygen as the primary maintenance therapy", "Use nasal CPAP as maintenance therapy despite absence of upper-airway obstruction", "Caffeine citrate", "Doxapram as preferred first-line long-term therapy"], "answer": 2, "explanation": "Caffeine stimulates respiratory drive in apnea of prematurity; other treatments target different diagnoses. Why not the others (added — not from source): A. Low-flow supplemental oxygen as the primary maintenance therapy — Oxygen may reduce hypoxic episodes but does not treat the immature respiratory drive that causes apnoea of prematurity.; B. Use nasal CPAP as maintenance therapy despite absence of upper-airway obstruction — CPAP helps mainly obstructive and mixed apnoea and is an adjunct when caffeine fails, not routine maintenance therapy for central apnoea.; D. Doxapram as preferred first-line long-term therapy — Doxapram has limited evidence and concerning adverse effects such as hypertension and GI and neurological effects; it is not first-line or long-term therapy.", "pearl": "Caffeine stimulates respiratory drive in apnea of prematurity.", "note": "From Day 4 · Clinical / application"}, {"num": 17, "pos": 17, "section": 0, "topic": "Neonatology", "question": "An ELBW infant develops hypothermia during admission despite normal room temperature. Which intervention best reduces evaporative heat loss?", "options": ["Increase incubator humidity without using an occlusive wrap during stabilization", "Use polyethylene wrap/bag with radiant warming in very preterm stabilization", "Use prewarmed blankets and a cap without an occlusive wrap", "Delay radiant warming and begin skin-to-skin care before cardiorespiratory stabilization"], "answer": 1, "explanation": "Occlusive wrapping reduces evaporative loss in very preterm infants while thermal care is monitored. Why not the others (added — not from source): A. Increase incubator humidity without using an occlusive wrap during stabilization — Humidity helps after admission, but during stabilisation an occlusive polyethylene wrap under radiant warming is the proven measure for very preterm infants.; C. Use prewarmed blankets and a cap without an occlusive wrap — Blankets and a cap reduce conductive and radiant loss but are far less effective than an occlusive wrap against evaporative loss through immature ELBW skin.; D. Delay radiant warming and begin skin-to-skin care before cardiorespiratory stabilization — Skin-to-skin care suits stable infants; delaying radiant warmth in an unstable ELBW infant worsens hypothermia and its morbidity.", "pearl": "Occlusive wrapping reduces evaporative loss in very preterm infants while thermal care is monitored.", "note": "From Day 4 · Clinical / application"}, {"num": 18, "pos": 18, "section": 0, "topic": "Neonatology", "question": "A preterm infant develops new apnea, lethargy and temperature instability after previously improving. What is the best interpretation?", "options": ["Increase the caffeine dose initially and investigate secondary causes if events continue", "Attribute the change to apnea of prematurity because of gestational age", "Evaluate for sepsis or another acute trigger before attributing it to prematurity", "Treat presumed gastroesophageal reflux before evaluating for systemic illness"], "answer": 2, "explanation": "New systemic signs demand evaluation for secondary apnea, especially infection. Why not the others (added — not from source): A. Increase the caffeine dose initially and investigate secondary causes if events continue — Raising caffeine without evaluating the infant risks missing sepsis or NEC; new apnoea with lethargy and temperature instability needs prompt workup first.; B. Attribute the change to apnea of prematurity because of gestational age — Apnoea of prematurity is a diagnosis of exclusion; new events with systemic signs after a period of improvement suggest a secondary cause.; D. Treat presumed gastroesophageal reflux before evaluating for systemic illness — Reflux is rarely a proven cause of apnoea, and lethargy with temperature instability point to systemic illness such as sepsis.", "pearl": "New systemic signs demand evaluation for secondary apnea, especially infection.", "note": "From Day 4 · Basic / easily confused"}, {"num": 19, "pos": 19, "section": 0, "topic": "Neonatology", "question": "At 33 weeks PMA a baby born at 29 weeks has gained weight appropriately. Which age is used when discussing retinal screening timing?", "options": ["Chronological age alone from the date of birth", "Postmenstrual age alone without considering postnatal age", "Postmenstrual age and chronological age according to screening protocol", "Corrected age after term-equivalent age"], "answer": 2, "explanation": "ROP screening schedules depend on birth gestation and postnatal/postmenstrual age, not a single corrected-age number. Why not the others (added — not from source): A. Chronological age alone from the date of birth — Chronological age alone ignores birth gestation; ROP screening timing combines postnatal age with postmenstrual age.; B. Postmenstrual age alone without considering postnatal age — PMA alone is insufficient; protocols use a postnatal-age criterion (for example 4 weeks, earlier in Indian guidance) together with a PMA threshold such as 31 weeks.; D. Corrected age after term-equivalent age — Corrected age after term is used for growth and developmental follow-up, not for ROP screening, which begins well before term.", "pearl": "ROP screening schedules depend on birth gestation and postnatal/postmenstrual age, not a single corrected-age number.", "note": "From Day 4 · Clinical / application"}, {"num": 20, "pos": 20, "section": 0, "topic": "Neonatology", "question": "A preterm infant has recurrent bradycardia with feeding but no desaturation during sleep. Which approach is most appropriate?", "options": ["Increase caffeine because feeding-associated bradycardia represents central apnea", "Start acid suppression for presumed reflux-associated bradycardia", "Continue cardiorespiratory monitoring without evaluating the feeding event", "Correlate events with swallowing/airway protection and evaluate feeding safety"], "answer": 3, "explanation": "Feed-related events require evaluation for discoordination and aspiration, distinct from central apnea. Why not the others (added — not from source): A. Increase caffeine because feeding-associated bradycardia represents central apnea — Bradycardia confined to feeds suggests vagal or suck-swallow-breathe incoordination rather than central apnoea; extra caffeine does not address it.; B. Start acid suppression for presumed reflux-associated bradycardia — Evidence does not support acid suppression for presumed reflux bradycardia, and it carries risks such as infection and NEC; feeding assessment comes first.; C. Continue cardiorespiratory monitoring without evaluating the feeding event — Monitoring alone misses a treatable feeding problem and ongoing aspiration risk; feed-related events need direct evaluation.", "pearl": "Feed-related events require evaluation for discoordination and aspiration, distinct from central apnea.", "note": "From Day 4 · Clinical / application"}, {"num": 21, "pos": 21, "section": 0, "topic": "Neonatology", "question": "A febrile 5-day-old infant is ill-appearing and blood culture is being collected. What is the best immediate treatment principle?", "options": ["Complete lumbar puncture and all imaging before giving the first antibiotic dose", "Begin oral amoxicillin while awaiting the blood culture", "Obtain the blood culture and wait for serial CRP results before starting therapy", "Start empiric IV antibiotics promptly after cultures without waiting for results"], "answer": 3, "explanation": "A sick neonate with suspected bacterial infection requires timely empiric parenteral treatment. Why not the others (added — not from source): A. Complete lumbar puncture and all imaging before giving the first antibiotic dose — LP and imaging must not delay antibiotics in an ill neonate; give the first dose once blood culture is drawn and do LP when stable.; B. Begin oral amoxicillin while awaiting the blood culture — Oral antibiotics give unreliable levels in a sick neonate; suspected sepsis needs IV therapy such as ampicillin with gentamicin, adding cefotaxime if meningitis is suspected.; C. Obtain the blood culture and wait for serial CRP results before starting therapy — CRP is non-specific and lags behind infection; waiting for serial results delays treatment in an ill-appearing febrile neonate.", "pearl": "A sick neonate with suspected bacterial infection requires timely empiric parenteral treatment.", "note": "From Day 5 · Clinical / application"}, {"num": 22, "pos": 22, "section": 0, "topic": "Neonatology", "question": "A newborn with culture-proven group B streptococcal bacteremia develops seizures and a bulging fontanelle. What additional evaluation is crucial when stable?", "options": ["Repeat the blood culture and omit CSF evaluation if the repeat becomes sterile", "Lumbar puncture for CSF assessment if not contraindicated", "Obtain brain MRI before deciding whether CSF examination is needed", "Treat as uncomplicated bacteremia for a longer course without assessing CSF"], "answer": 1, "explanation": "Suspected meningitis requires CSF evaluation and prolonged targeted therapy; LP timing depends on stability. Why not the others (added — not from source): A. Repeat the blood culture and omit CSF evaluation if the repeat becomes sterile — A sterile repeat blood culture does not exclude meningitis; seizures and a bulging fontanelle demand CSF analysis to set drug dosing and duration.; C. Obtain brain MRI before deciding whether CSF examination is needed — MRI may later define complications, but meningitis is diagnosed on CSF; imaging should not substitute for LP.; D. Treat as uncomplicated bacteremia for a longer course without assessing CSF — Meningitis needs meningitic dosing, a longer course (typically 14 days or more for GBS) and follow-up; treating as bacteraemia risks undertreatment.", "pearl": "Suspected meningitis requires CSF evaluation and prolonged targeted therapy.", "note": "From Day 5 · High difficulty"}, {"num": 23, "pos": 23, "section": 0, "topic": "Neonatology", "question": "An asymptomatic term infant has a maternal intrapartum fever history but remains clinically well. What is the most appropriate principle?", "options": ["Use a validated risk assessment with serial clinical examinations rather than automatic identical treatment for every exposure", "Use a categorical culture-and-antibiotic pathway for maternal fever exposure", "Use a single normal CRP as the main basis for ending observation", "Observe for a fixed 48 hours without incorporating the infant examination or quantified risk"], "answer": 0, "explanation": "EOS management incorporates gestational age, risk factors and ongoing examination; protocols vary. Why not the others (added — not from source): B. Use a categorical culture-and-antibiotic pathway for maternal fever exposure — Treating every maternal-fever exposure categorically gives many well infants unnecessary antibiotics; AAP supports risk calculators or enhanced serial observation instead.; C. Use a single normal CRP as the main basis for ending observation — A single CRP has poor negative predictive value early in sepsis and should not be the main basis for ending observation.; D. Observe for a fixed 48 hours without incorporating the infant examination or quantified risk — Fixed observation without quantified risk and structured examinations misses the evolving clinical picture that should drive decisions.", "pearl": "EOS management incorporates gestational age, risk factors and ongoing examination.", "note": "From Day 5 · Clinical / application"}, {"num": 24, "pos": 24, "section": 0, "topic": "Neonatology", "question": "A newborn with suspected bacterial meningitis has a traumatic LP. Which interpretation is safest?", "options": ["Apply an RBC-to-WBC correction formula and base the meningitis decision on the corrected WBC alone", "Use the CSF leukocyte count alone because culture sensitivity is unaffected by prior antibiotics", "Integrate CSF culture, cell counts, glucose, protein and clinical context rather than relying on one correction formula", "Discard the CSF interpretation entirely because the tap was traumatic"], "answer": 2, "explanation": "Traumatic taps complicate interpretation; clinical context and cultures remain important. Why not the others (added — not from source): A. Apply an RBC-to-WBC correction formula and base the meningitis decision on the corrected WBC alone — RBC-to-WBC correction formulas are unreliable in neonates and can misclassify meningitis; the corrected count alone should not decide management.; B. Use the CSF leukocyte count alone because culture sensitivity is unaffected by prior antibiotics — Prior antibiotics do reduce CSF culture yield, and a traumatic tap distorts the cell count; neither should be relied on alone.; D. Discard the CSF interpretation entirely because the tap was traumatic — Traumatic CSF still yields useful culture, glucose and protein data; it should be interpreted cautiously, not discarded.", "pearl": "Traumatic taps complicate interpretation.", "note": "From Day 5 · Conceptual"}, {"num": 25, "pos": 25, "section": 0, "topic": "Neonatology", "question": "A neonate improves after antibiotics but blood culture grows a likely contaminant in only one sample. Which step best supports stewardship?", "options": ["Continue the full empiric regimen until a repeat culture is negative, irrespective of organism identity", "Stop antibiotics immediately once contamination is suspected, without reassessing the infant", "Reassess organism identity, collection quality, infant condition and repeat cultures as indicated", "Broaden to vancomycin for any single culture growing skin flora"], "answer": 2, "explanation": "Culture interpretation requires organism-level and clinical correlation, balancing undertreatment against overuse. Why not the others (added — not from source): A. Continue the full empiric regimen until a repeat culture is negative, irrespective of organism identity — Continuing full therapy regardless of organism ignores stewardship; a single skin commensal in an improving infant often represents contamination.; B. Stop antibiotics immediately once contamination is suspected, without reassessing the infant — Stopping without reassessment could miss true infection, such as CoNS in a line-dependent preterm; clinical review and repeat cultures guide the decision.; D. Broaden to vancomycin for any single culture growing skin flora — Reflexively adding vancomycin for any single skin-flora isolate promotes resistance and toxicity; it is justified only when true infection is likely.", "pearl": "Culture interpretation requires organism-level and clinical correlation, balancing undertreatment against overuse.", "note": "From Day 5 · High difficulty"}, {"num": 26, "pos": 26, "section": 0, "topic": "Neonatology", "question": "A 36-week infant has TSB approaching the exchange threshold despite intensive phototherapy. At what relative level does the 2022 AAP guideline define escalation of care?", "options": ["2 mg/dL below the exchange threshold", "1 mg/dL below the exchange transfusion threshold", "At the exchange transfusion threshold", "2 mg/dL above the phototherapy threshold"], "answer": 0, "explanation": "Escalation begins 2 mg/dL below the age/risk-specific exchange threshold and requires emergency monitoring. Why not the others (added — not from source): B. 1 mg/dL below the exchange transfusion threshold — AAP 2022 defines escalation of care at 2 mg/dL below the exchange threshold, not 1 mg/dL; waiting longer shortens time to prepare for exchange.; C. At the exchange transfusion threshold — At the exchange threshold, exchange transfusion itself is indicated; escalation starts earlier, at 2 mg/dL below it.; D. 2 mg/dL above the phototherapy threshold — Escalation is defined relative to the exchange threshold, not the phototherapy threshold.", "pearl": "Escalation begins 2 mg/dL below the age/risk-specific exchange threshold and requires emergency monitoring.", "note": "From Day 6 · Clinical / application"}, {"num": 27, "pos": 27, "section": 0, "topic": "Neonatology", "question": "A jaundiced newborn has a total bilirubin of 18 mg/dL with direct fraction 2 mg/dL. Which value should be used to compare with AAP phototherapy thresholds?", "options": ["Direct bilirubin 2 mg/dL", "Mean of total and indirect bilirubin", "Indirect bilirubin 16 mg/dL", "Total bilirubin 18 mg/dL"], "answer": 3, "explanation": "AAP thresholds use total serum bilirubin; do not subtract the direct fraction. Why not the others (added — not from source): A. Direct bilirubin 2 mg/dL — Direct bilirubin is not plotted against phototherapy thresholds; it is used to detect cholestasis.; B. Mean of total and indirect bilirubin — There is no role for averaging values; AAP thresholds are applied to total serum bilirubin.; C. Indirect bilirubin 16 mg/dL — AAP 2022 advises not subtracting the direct fraction; using indirect bilirubin would under-treat.", "pearl": "AAP thresholds use total serum bilirubin.", "note": "From Day 6 · Clinical / application"}, {"num": 28, "pos": 28, "section": 0, "topic": "Neonatology", "question": "A DAT-negative newborn has significant hemolysis, reticulocytosis and family history of oxidant-triggered jaundice. Which disorder merits testing?", "options": ["Hereditary spherocytosis", "Pyruvate kinase deficiency", "G6PD deficiency", "Hereditary elliptocytosis"], "answer": 2, "explanation": "DAT-negative hemolysis can occur with G6PD deficiency; a negative DAT does not rule out nonimmune hemolysis. Why not the others (added — not from source): A. Hereditary spherocytosis — Spherocytosis is also DAT-negative, but jaundice precipitated by oxidant exposure is the hallmark of G6PD deficiency.; B. Pyruvate kinase deficiency — Pyruvate kinase deficiency causes non-immune haemolysis but is not precipitated by oxidant exposure.; D. Hereditary elliptocytosis — Elliptocytosis is usually mild and is not linked to oxidant-triggered haemolysis.", "pearl": "DAT-negative hemolysis can occur with G6PD deficiency.", "note": "From Day 6 · Clinical / application"}, {"num": 29, "pos": 29, "section": 0, "topic": "Neonatology", "question": "A 38-week baby has a bilirubin rise of 0.35 mg/dL/h at 18 hours of age. What is the most important implication?", "options": ["Repeat bilirubin in 24 hours because the rate of rise is compatible with physiologic jaundice", "Investigate hemolysis and assess urgent treatment against hour-specific thresholds", "Start exchange transfusion based on rate of rise alone without plotting the TSB", "Continue transcutaneous measurements alone even if treatment is being considered"], "answer": 1, "explanation": "Rapid rise in the first day suggests hemolysis and demands early evaluation and treatment planning. Why not the others (added — not from source): A. Repeat bilirubin in 24 hours because the rate of rise is compatible with physiologic jaundice — A rise above about 0.2 mg/dL/h in the first 24 hours suggests haemolysis; it is not physiological, and waiting 24 hours is unsafe.; C. Start exchange transfusion based on rate of rise alone without plotting the TSB — Exchange decisions need TSB plotted against hour-specific, risk-adjusted thresholds; rate of rise alone does not justify exchange.; D. Continue transcutaneous measurements alone even if treatment is being considered — When treatment is being considered, TSB must be measured; transcutaneous values are unreliable near treatment thresholds and during phototherapy.", "pearl": "Rapid rise in the first day suggests hemolysis and demands early evaluation and treatment planning.", "note": "From Day 6 · Clinical / application"}, {"num": 30, "pos": 30, "section": 0, "topic": "Neonatology", "question": "An infant on intensive phototherapy has falling bilirubin but poor intake and weight loss. Which adjunctive management is most appropriate?", "options": ["Add IV maintenance fluids despite adequate perfusion and no clinical dehydration", "Interrupt phototherapy for prolonged feeding periods to improve intake", "Give formula supplementation irrespective of breastfeeding assessment or hydration status", "Assess hydration and feeding while continuing threshold-based bilirubin care"], "answer": 3, "explanation": "Adequate feeding supports bilirubin clearance; phototherapy does not replace fluid/nutrition assessment. Why not the others (added — not from source): A. Add IV maintenance fluids despite adequate perfusion and no clinical dehydration — IV fluids are not routinely needed when the infant is not dehydrated; improving enteral intake is preferred.; B. Interrupt phototherapy for prolonged feeding periods to improve intake — Prolonged interruptions reduce intensive phototherapy effectiveness; brief breaks for feeds are fine, but extended stops slow bilirubin decline.; C. Give formula supplementation irrespective of breastfeeding assessment or hydration status — Supplementation may help, but only after assessing breastfeeding and hydration; routine formula irrespective of assessment is not recommended.", "pearl": "Adequate feeding supports bilirubin clearance.", "note": "From Day 6 · Clinical / application"}, {"num": 31, "pos": 31, "section": 0, "topic": "Neonatology", "question": "A 38-week infant with moderate HIE is 3 hours old and meets physiologic criteria for cooling. What is the key time-sensitive intervention?", "options": ["Delay cooling until aEEG or MRI independently confirms HIE", "Use passive cooling alone without protocolized core-temperature monitoring", "Plan active cooling after 6 hours if neurologic abnormalities persist", "Initiate protocolized therapeutic hypothermia within 6 hours after stabilization"], "answer": 3, "explanation": "Eligible moderate/severe HIE infants benefit from timely controlled cooling, not delayed imaging-led initiation. Why not the others (added — not from source): A. Delay cooling until aEEG or MRI independently confirms HIE — Cooling benefit is time-critical; waiting for aEEG or MRI confirmation risks missing the 6-hour window.; B. Use passive cooling alone without protocolized core-temperature monitoring — Passive cooling without core temperature monitoring risks overcooling; therapeutic hypothermia must be servo-controlled and protocolised.; C. Plan active cooling after 6 hours if neurologic abnormalities persist — Benefit of cooling started after 6 hours is uncertain; an eligible infant at 3 hours should start now.", "pearl": "Eligible moderate/severe HIE infants benefit from timely controlled cooling, not delayed imaging-led initiation.", "note": "From Day 7 · Clinical / application"}, {"num": 32, "pos": 32, "section": 0, "topic": "Neonatology", "question": "A newborn with suspected HIE has repetitive limb jerks, but simultaneous EEG shows no electrographic correlate. What is the best conclusion?", "options": ["Reassess whether events are epileptic and review raw EEG/video rather than assuming seizures", "Treat the movements with phenobarbital despite repeated absence of an EEG correlate", "Replace continuous EEG with aEEG because aEEG excludes all electrographic seizures", "Stop neuromonitoring once one typical event lacks an electrographic correlate"], "answer": 0, "explanation": "Clinical movements can be nonepileptic; EEG correlation is essential for seizure diagnosis. Why not the others (added — not from source): B. Treat the movements with phenobarbital despite repeated absence of an EEG correlate — Treating non-epileptic movements exposes the infant to sedating, potentially neurotoxic drugs without benefit.; C. Replace continuous EEG with aEEG because aEEG excludes all electrographic seizures — aEEG can miss brief, focal or low-amplitude seizures; it cannot replace continuous EEG for seizure exclusion.; D. Stop neuromonitoring once one typical event lacks an electrographic correlate — HIE infants have high seizure risk over the first days; one non-epileptic event does not justify stopping monitoring.", "pearl": "Clinical movements can be nonepileptic.", "note": "From Day 7 · Clinical / application"}, {"num": 33, "pos": 33, "section": 0, "topic": "Neonatology", "question": "A cooled newborn has electrographic-only seizures despite no visible convulsions. What does this imply?", "options": ["Observe because treatment is reserved for seizures with visible motor manifestations", "Treat electrographic seizures after a longer duration threshold rather than when they are detected", "Obtain MRI before starting antiseizure treatment", "Treat and monitor electrographic seizures under neonatal seizure protocol"], "answer": 3, "explanation": "Electrographic-only seizures are clinically relevant and require EEG-guided management. Why not the others (added — not from source): A. Observe because treatment is reserved for seizures with visible motor manifestations — Many neonatal seizures are electrographic-only, especially during cooling; they add to brain injury and need treatment.; B. Treat electrographic seizures after a longer duration threshold rather than when they are detected — Higher seizure burden is associated with worse outcome; electrographic seizures should be treated promptly, not after an arbitrary duration.; C. Obtain MRI before starting antiseizure treatment — Treatment should not wait for MRI; seizures are treated immediately while imaging is planned.", "pearl": "Electrographic-only seizures are clinically relevant and require EEG-guided management.", "note": "From Day 7 · Conceptual"}, {"num": 34, "pos": 34, "section": 0, "topic": "Neonatology", "question": "A term neonate with HIE has early diffusion restriction in basal ganglia and thalami. Which insult pattern is suggested?", "options": ["Predominantly parasagittal watershed injury from a prolonged partial insult", "Acute profound hypoxic-ischemic injury", "Bilirubin encephalopathy as the leading explanation for this HIE pattern", "Posterior-predominant injury from isolated neonatal hypoglycemia"], "answer": 1, "explanation": "Basal ganglia-thalamic predominant injury is associated with acute profound hypoxic-ischemic events. Why not the others (added — not from source): A. Predominantly parasagittal watershed injury from a prolonged partial insult — Watershed injury affects parasagittal cortex and white matter after prolonged partial asphyxia, typically sparing the deep grey nuclei.; C. Bilirubin encephalopathy as the leading explanation for this HIE pattern — Kernicterus targets the globus pallidus and subthalamic nuclei, usually without thalamic diffusion restriction; it does not explain this HIE pattern.; D. Posterior-predominant injury from isolated neonatal hypoglycemia — Hypoglycaemic injury typically involves parieto-occipital cortex and white matter, not the basal ganglia and thalami.", "pearl": "Basal ganglia-thalamic predominant injury is associated with acute profound hypoxic-ischemic events.", "note": "From Day 7 · Conceptual"}, {"num": 35, "pos": 35, "section": 0, "topic": "Neonatology", "question": "During cooling a newborn develops marked bradycardia but adequate perfusion. What is the best approach?", "options": ["Interpret HR in context of target temperature, perfusion and protocol monitoring", "Give atropine whenever the heart rate falls below 100/min during cooling", "Stop cooling solely because the heart rate is below the pre-cooling baseline", "Rapidly rewarm to normothermia despite preserved perfusion"], "answer": 0, "explanation": "Cooling lowers HR; assess perfusion and protocol thresholds rather than treating an isolated rate. Why not the others (added — not from source): B. Give atropine whenever the heart rate falls below 100/min during cooling — Sinus bradycardia is expected during hypothermia; atropine is not indicated when perfusion is preserved.; C. Stop cooling solely because the heart rate is below the pre-cooling baseline — A lower heart rate during cooling is physiological; stopping treatment would forfeit neuroprotection.; D. Rapidly rewarm to normothermia despite preserved perfusion — Rapid rewarming can provoke seizures and hypotension; with preserved perfusion, cooling should continue with controlled rewarming at the protocol time.", "pearl": "Cooling lowers HR.", "note": "From Day 7 · Clinical / application"}, {"num": 36, "pos": 36, "section": 0, "topic": "Neonatology", "question": "A 29-week infant develops abdominal distension, bloody stool and pneumatosis intestinalis on radiograph. Which diagnosis is most likely?", "options": ["Pyloric stenosis", "Necrotizing enterocolitis", "Isolated lactose intolerance", "Uncomplicated reflux"], "answer": 1, "explanation": "Pneumatosis with systemic signs in a preterm infant is characteristic of NEC. Why not the others (added — not from source): A. Pyloric stenosis — Pyloric stenosis presents at 2-8 weeks with projectile non-bilious vomiting, not bloody stool or pneumatosis.; C. Isolated lactose intolerance — Lactose intolerance does not cause bloody stool, distension or pneumatosis intestinalis.; D. Uncomplicated reflux — Reflux does not produce pneumatosis, bloody stool or abdominal distension.", "pearl": "Pneumatosis with systemic signs in a preterm infant is characteristic of NEC.", "note": "From Day 8 · Clinical / application"}, {"num": 37, "pos": 37, "section": 0, "topic": "Neonatology", "question": "A preterm baby with NEC develops free intraperitoneal air. What is the key implication?", "options": ["Continue medical NEC treatment alone while observing the free intraperitoneal air", "Perform needle decompression of the abdomen as definitive treatment", "Urgent surgical evaluation for intestinal perforation", "Restart trophic feeds once the abdominal distension improves"], "answer": 2, "explanation": "Pneumoperitoneum signals perforation and changes management urgency. Why not the others (added — not from source): A. Continue medical NEC treatment alone while observing the free intraperitoneal air — Free air indicates perforation, which needs surgical management; medical treatment alone is insufficient.; B. Perform needle decompression of the abdomen as definitive treatment — Needle decompression may temporarily relieve tense pneumoperitoneum, but it is not definitive treatment.; D. Restart trophic feeds once the abdominal distension improves — Feeds are withheld in perforated NEC; restarting enteral feeds would be dangerous.", "pearl": "Pneumoperitoneum signals perforation and changes management urgency.", "note": "From Day 8 · Clinical / application"}, {"num": 38, "pos": 38, "section": 0, "topic": "Neonatology", "question": "A VLBW infant is tolerating expressed maternal milk but growth is inadequate. Which intervention best supports nutritional targets?", "options": ["Increase the volume of unfortified human milk without reassessing nutrient density", "Replace maternal milk completely with preterm formula", "Add carbohydrate calories alone without addressing protein and mineral needs", "Assess intake and consider appropriate human milk fortification"], "answer": 3, "explanation": "Preterm growth requires adequate protein/minerals; fortification may be necessary even with maternal milk. Why not the others (added — not from source): A. Increase the volume of unfortified human milk without reassessing nutrient density — Unfortified human milk cannot meet VLBW protein, calcium and phosphate needs even at higher volumes.; B. Replace maternal milk completely with preterm formula — Maternal milk protects against NEC and sepsis; it should be fortified, not replaced by formula.; C. Add carbohydrate calories alone without addressing protein and mineral needs — Carbohydrate alone adds fat mass without lean growth; protein and minerals are the main deficits.", "pearl": "Preterm growth requires adequate protein/minerals.", "note": "From Day 8 · Conceptual"}, {"num": 39, "pos": 39, "section": 0, "topic": "Neonatology", "question": "A 1.1-kg infant receives glucose 10% at 120 mL/kg/day. What is the approximate GIR?", "options": ["6.0 mg/kg/min", "8.3 mg/kg/min", "12.0 mg/kg/min", "4.2 mg/kg/min"], "answer": 1, "explanation": "GIR = dextrose percent × mL/kg/day ÷ 144 = 10 × 120 ÷ 144 = 8.33 mg/kg/min. Why not the others (added — not from source): A. 6.0 mg/kg/min — 6.0 mg/kg/min would require about 86 mL/kg/day of 10% dextrose; it underestimates the GIR.; C. 12.0 mg/kg/min — 12.0 mg/kg/min would require about 173 mL/kg/day of 10% dextrose; it overestimates the GIR.; D. 4.2 mg/kg/min — 4.2 mg/kg/min corresponds to about 60 mL/kg/day of 10% dextrose, half the given rate.", "pearl": "GIR = dextrose percent × mL/kg/day ÷ 144 = 10 × 120 ÷ 144 = 8.33 mg/kg/min.", "note": "From Day 8 · Clinical / application"}, {"num": 40, "pos": 40, "section": 0, "topic": "Neonatology", "question": "A preterm infant on prolonged TPN develops cholestasis. Which strategy addresses a modifiable contributor?", "options": ["Increase the dextrose infusion to promote catch-up growth", "Continue prolonged minimal enteral feeding despite gastrointestinal readiness", "Increase the dose of conventional soybean-oil lipid while leaving the rest of PN unchanged", "Advance safe enteral nutrition and reassess lipid/TPN exposure"], "answer": 3, "explanation": "Parenteral nutrition-associated cholestasis is multifactorial; enteral advancement and TPN optimization matter. Why not the others (added — not from source): A. Increase the dextrose infusion to promote catch-up growth — Excess dextrose promotes hepatic steatosis and worsens liver injury; it does not address cholestasis.; B. Continue prolonged minimal enteral feeding despite gastrointestinal readiness — Prolonged minimal enteral feeding perpetuates PN dependence and cholestasis; feeds should advance when tolerated.; C. Increase the dose of conventional soybean-oil lipid while leaving the rest of PN unchanged — Soybean-oil lipid is linked to PN-associated liver disease; increasing it can worsen cholestasis.", "pearl": "Parenteral nutrition-associated cholestasis is multifactorial.", "note": "From Day 8 · Clinical / application"}, {"num": 41, "pos": 41, "section": 0, "topic": "Neonatology", "question": "A 26-week infant has a large ductal shunt on echo but stable oxygenation and no systemic steal. What is the most appropriate decision principle?", "options": ["Treat based on ductal diameter alone once it exceeds a predefined size", "Treat solely because gestational age is below 28 weeks", "Base treatment on hemodynamic significance and clinical trajectory rather than diameter alone", "Proceed to surgical ligation based on the presence of a murmur"], "answer": 2, "explanation": "PDA intervention requires integrated hemodynamic and clinical assessment. Why not the others (added — not from source): A. Treat based on ductal diameter alone once it exceeds a predefined size — Ductal diameter alone does not define significance; flow pattern, left heart volume loading and clinical status matter.; B. Treat solely because gestational age is below 28 weeks — Prophylactic treatment based on gestation alone has not improved long-term outcomes; treatment should be selective.; D. Proceed to surgical ligation based on the presence of a murmur — A murmur is not an indication for ligation; surgery is reserved for persistent significant PDA after medical treatment fails or is contraindicated.", "pearl": "PDA intervention requires integrated hemodynamic and clinical assessment.", "note": "From Day 9 · Conceptual"}, {"num": 42, "pos": 42, "section": 0, "topic": "Neonatology", "question": "A newborn has severe hypoxemia, pre/postductal saturation difference and right-to-left ductal flow. Which physiology is most likely?", "options": ["Persistent pulmonary hypertension of the newborn", "Cyanotic congenital heart disease with parallel circulation and limited mixing", "A large left-to-right ductal shunt with pulmonary overcirculation", "Primary parenchymal lung disease without extrapulmonary right-to-left shunting"], "answer": 0, "explanation": "Elevated PVR with extrapulmonary right-to-left shunting causes differential saturations. Why not the others (added — not from source): B. Cyanotic congenital heart disease with parallel circulation and limited mixing — Parallel circulation such as transposition causes cyanosis that does not depend on right-to-left ductal shunting; a higher preductal saturation with right-to-left ductal flow points to raised pulmonary vascular resistance.; C. A large left-to-right ductal shunt with pulmonary overcirculation — A left-to-right shunt causes pulmonary overcirculation, not hypoxaemia with right-to-left ductal flow.; D. Primary parenchymal lung disease without extrapulmonary right-to-left shunting — Lung disease without extrapulmonary shunting does not produce a pre-postductal saturation difference.", "pearl": "Elevated PVR with extrapulmonary right-to-left shunting causes differential saturations.", "note": "From Day 9 · Clinical / application"}, {"num": 43, "pos": 43, "section": 0, "topic": "Neonatology", "question": "An infant with PPHN deteriorates after aggressive hyperventilation. Which principle is best?", "options": ["Target PaCO2 25-30 mmHg to reduce pulmonary vascular resistance", "Use sodium bicarbonate to create sustained systemic alkalosis", "Optimize lung recruitment and avoid excessive alkalosis/hypocapnia", "Maintain FiO2 at 1.0 irrespective of oxygenation response"], "answer": 2, "explanation": "Modern management avoids injurious hyperventilation and targets underlying lung/cardiac physiology. Why not the others (added — not from source): A. Target PaCO2 25-30 mmHg to reduce pulmonary vascular resistance — Hyperventilation to low PaCO2 reduces cerebral blood flow, risks periventricular leukomalacia and hearing loss, and causes volutrauma; it is no longer recommended.; B. Use sodium bicarbonate to create sustained systemic alkalosis — Sustained alkalosis with bicarbonate has no proven benefit and carries metabolic and neurological risks.; D. Maintain FiO2 at 1.0 irrespective of oxygenation response — Fixed 100% oxygen causes oxidative injury and can worsen pulmonary vasoconstriction; oxygen should be titrated to targets.", "pearl": "Modern management avoids injurious hyperventilation and targets underlying lung/cardiac physiology.", "note": "From Day 9 · Clinical / application"}, {"num": 44, "pos": 44, "section": 0, "topic": "Neonatology", "question": "An echocardiogram in a hypoxemic newborn shows structurally normal heart but severe RV pressure overload. What additional assessment is most important before vasodilator therapy?", "options": ["Evaluate LV function and pulmonary venous disease", "Quantify oxygenation index but defer assessment of ventricular function", "Measure RV systolic pressure but omit evaluation of pulmonary venous drainage", "Assess ductal shunt direction but not left-sided filling or function"], "answer": 0, "explanation": "Vasodilators can worsen pulmonary edema when LV dysfunction or venous obstruction is present. Why not the others (added — not from source): B. Quantify oxygenation index but defer assessment of ventricular function — Oxygenation index grades severity, but LV function and pulmonary venous drainage determine whether vasodilators are safe.; C. Measure RV systolic pressure but omit evaluation of pulmonary venous drainage — RV pressure is important, but excluding pulmonary venous obstruction such as obstructed TAPVR is essential before vasodilator therapy.; D. Assess ductal shunt direction but not left-sided filling or function — Ductal shunt direction helps, but LV dysfunction or venous obstruction would make pulmonary vasodilators harmful.", "pearl": "Vasodilators can worsen pulmonary edema when LV dysfunction or venous obstruction is present.", "note": "From Day 9 · Conceptual"}, {"num": 45, "pos": 45, "section": 0, "topic": "Neonatology", "question": "A preterm infant with PDA has reversed diastolic flow in the descending aorta. What does this suggest?", "options": ["Pure right-to-left ductal shunt", "Normal ductal closure physiology", "Systemic diastolic steal from a significant left-to-right shunt", "Isolated tricuspid regurgitation"], "answer": 2, "explanation": "Diastolic flow reversal supports significant systemic steal from ductal shunting. Why not the others (added — not from source): A. Pure right-to-left ductal shunt — Right-to-left ductal shunting does not cause diastolic flow reversal in the descending aorta.; B. Normal ductal closure physiology — Normal closure abolishes ductal shunting and diastolic reversal.; D. Isolated tricuspid regurgitation — Tricuspid regurgitation does not alter descending aortic diastolic flow.", "pearl": "Diastolic flow reversal supports significant systemic steal from ductal shunting.", "note": "From Day 9 · High difficulty"}, {"num": 46, "pos": 46, "section": 0, "topic": "Neonatology", "question": "A newborn with persistent hypoglycemia has low ketones and suppressed free fatty acids at plasma glucose 32 mg/dL. Which mechanism is most concerning?", "options": ["Growth hormone deficiency", "Cortisol deficiency", "Hyperinsulinism", "Fatty-acid oxidation defect"], "answer": 2, "explanation": "Inappropriately low ketones and fatty acids during hypoglycemia suggest insulin excess. Why not the others (added — not from source): A. Growth hormone deficiency — GH deficiency can cause hypoglycaemia, but ketones and free fatty acids are typically raised, not suppressed.; B. Cortisol deficiency — Cortisol deficiency usually allows lipolysis and ketogenesis; suppressed fatty acids and ketones point to insulin action.; D. Fatty-acid oxidation defect — Fatty-acid oxidation defects give low ketones but with raised free fatty acids, not suppressed ones.", "pearl": "Inappropriately low ketones and fatty acids during hypoglycemia suggest insulin excess.", "note": "From Day 10 · High difficulty"}, {"num": 47, "pos": 47, "section": 0, "topic": "Neonatology", "question": "A newborn with recurrent hypoglycemia requires GIR 13 mg/kg/min to maintain glucose. Which implication is most appropriate?", "options": ["Continue the same glucose infusion and defer etiologic evaluation until discharge", "Reduce the glucose infusion abruptly to test endogenous glucose production", "Start diazoxide before obtaining a critical sample or excluding contraindications", "Investigate a persistent hypoglycemia disorder including hyperinsulinism"], "answer": 3, "explanation": "High glucose requirement raises concern for persistent pathologic hypoglycemia. Why not the others (added — not from source): A. Continue the same glucose infusion and defer etiologic evaluation until discharge — A GIR of 13 mg/kg/min strongly suggests hyperinsulinism; deferring evaluation risks recurrent neuroglycopenia.; B. Reduce the glucose infusion abruptly to test endogenous glucose production — Abruptly cutting glucose provokes dangerous hypoglycaemia; any diagnostic fast must be controlled and supervised.; C. Start diazoxide before obtaining a critical sample or excluding contraindications — A critical sample is needed before treatment to confirm hyperinsulinism, and diazoxide contraindications such as fluid overload or pulmonary hypertension must be considered.", "pearl": "High glucose requirement raises concern for persistent pathologic hypoglycemia.", "note": "From Day 10 · High difficulty"}, {"num": 48, "pos": 48, "section": 0, "topic": "Neonatology", "question": "An infant has pH 7.22, HCO3 12, PaCO2 28 and elevated anion gap. Which primary disturbance is present?", "options": ["Respiratory acidosis with renal compensation", "Metabolic alkalosis", "Metabolic acidosis with respiratory compensation", "Respiratory alkalosis alone"], "answer": 2, "explanation": "Low bicarbonate with acidemia indicates metabolic acidosis; low PaCO2 is compensatory. Why not the others (added — not from source): A. Respiratory acidosis with renal compensation — Respiratory acidosis requires a raised PaCO2; here PaCO2 is low at 28 mmHg.; B. Metabolic alkalosis — Metabolic alkalosis raises pH and bicarbonate; here both are low.; D. Respiratory alkalosis alone — Respiratory alkalosis requires an alkaline pH; this infant is acidaemic with a low bicarbonate.", "pearl": "Low bicarbonate with acidemia indicates metabolic acidosis.", "note": "From Day 10 · High difficulty"}, {"num": 49, "pos": 49, "section": 0, "topic": "Neonatology", "question": "A symptomatic newborn has ionized calcium 0.70 mmol/L and seizures. Which immediate principle is appropriate?", "options": ["Withhold treatment until EEG is repeated", "Give carefully monitored IV calcium while assessing etiology", "Administer sodium bicarbonate as calcium replacement", "Use oral calcium alone despite ongoing seizures"], "answer": 1, "explanation": "Symptomatic severe hypocalcemia requires prompt controlled calcium replacement with cardiac monitoring. Why not the others (added — not from source): A. Withhold treatment until EEG is repeated — Symptomatic hypocalcaemia with seizures needs urgent correction; waiting for a repeat EEG delays treatment.; C. Administer sodium bicarbonate as calcium replacement — Bicarbonate does not replace calcium and can lower ionised calcium further by raising pH.; D. Use oral calcium alone despite ongoing seizures — Oral calcium is too slow for active seizures; IV calcium gluconate with ECG monitoring is needed.", "pearl": "Symptomatic severe hypocalcemia requires prompt controlled calcium replacement with cardiac monitoring.", "note": "From Day 10 · Clinical / application"}, {"num": 50, "pos": 50, "section": 0, "topic": "Neonatology", "question": "A term infant with persistent hypoglycemia is 5 days old. Which framework is most relevant?", "options": ["Continue transitional newborn glucose thresholds through the first week", "Investigate when neurologic symptoms recur rather than because hypoglycemia persists", "Obtain a critical sample after glucose support has been stopped", "Persistent hypoglycemia evaluation beyond transitional period"], "answer": 3, "explanation": "Beyond the early transitional window, recurrent low plasma glucose requires etiologic evaluation and critical samples. Why not the others (added — not from source): A. Continue transitional newborn glucose thresholds through the first week — Transitional thresholds apply to the first 48-72 hours; at day 5 persistent low glucose needs older-infant targets and evaluation.; B. Investigate when neurologic symptoms recur rather than because hypoglycemia persists — Persistent hypoglycaemia needs evaluation regardless of symptoms; neurological injury can occur without obvious signs.; C. Obtain a critical sample after glucose support has been stopped — The critical sample must be drawn while the infant is hypoglycaemic, typically during a supervised fast; samples taken at normal glucose are uninterpretable.", "pearl": "Beyond the early transitional window, recurrent low plasma glucose requires etiologic evaluation and critical samples.", "note": "From Day 10 · Clinical / application"}, {"num": 51, "pos": 51, "section": 1, "topic": "Neonatology", "question": "An infant has zone II stage 2 ROP with plus disease. Which management category applies?", "options": ["Classify as type 2 ROP because stage 2 disease is usually observed", "Classify as type 2 ROP because zone II stage 2 is generally observed in the absence of plus disease", "Classify as aggressive ROP based on plus disease without considering the remaining phenotype", "Type 1 ROP requiring prompt treatment assessment"], "answer": 3, "explanation": "Zone II stage 2 with plus meets ETROP type 1 criteria. Why not the others (added — not from source): A. Classify as type 2 ROP because stage 2 disease is usually observed — Under ETROP, plus disease in zone II upgrades stage 2 to type 1; observation is reserved for type 2 disease without plus.; B. Classify as type 2 ROP because zone II stage 2 is generally observed in the absence of plus disease — The stem states plus disease is present, so the 'absence of plus' condition for type 2 is not met; zone II stage 2 with plus is type 1.; C. Classify as aggressive ROP based on plus disease without considering the remaining phenotype — Aggressive ROP (A-ROP) is a distinct phenotype of rapidly progressive posterior disease with flat neovascularisation; plus alone does not define it, and conventional staging here gives type 1.", "pearl": "Zone II stage 2 with plus meets ETROP type 1 criteria.", "note": "From Day 11 · High difficulty"}, {"num": 52, "pos": 52, "section": 1, "topic": "Neonatology", "question": "A preterm infant has unilateral grade IV germinal matrix hemorrhage with parenchymal involvement. What complication should be monitored closely?", "options": ["Transient tachypnea", "Posthemorrhagic ventricular dilatation", "Isolated congenital cataract", "Hypertrophic pyloric stenosis"], "answer": 1, "explanation": "Severe IVH is associated with ventricular dilatation and adverse neurologic outcomes. Why not the others (added — not from source): A. Transient tachypnea — A self-limiting respiratory condition of term or late-preterm infants caused by delayed lung fluid clearance; it is unrelated to intraventricular haemorrhage.; C. Isolated congenital cataract — Congenital cataract is a developmental lens disorder (infection, genetic, metabolic), not a sequela of germinal matrix haemorrhage.; D. Hypertrophic pyloric stenosis — Pyloric stenosis is a gastric outlet hypertrophy presenting at 2-8 weeks; it has no relationship to IVH and needs no targeted surveillance here.", "pearl": "Severe IVH is associated with ventricular dilatation and adverse neurologic outcomes.", "note": "From Day 11 · Clinical / application"}, {"num": 53, "pos": 53, "section": 1, "topic": "Neonatology", "question": "MRI of a preterm infant shows bilateral periventricular white-matter injury with cystic evolution. Which diagnosis best fits?", "options": ["Diffuse noncystic white-matter signal abnormality without tissue loss", "Porencephalic cyst formation after a unilateral periventricular hemorrhagic infarction", "Basal-ganglia predominant injury typical of acute profound term HIE", "Cystic periventricular leukomalacia"], "answer": 3, "explanation": "Cystic PVL affects periventricular white matter and is linked to motor impairment. Why not the others (added — not from source): A. Diffuse noncystic white-matter signal abnormality without tissue loss — Diffuse noncystic white-matter injury lacks cyst formation and tissue loss by definition; the stem describes cystic evolution.; B. Porencephalic cyst formation after a unilateral periventricular hemorrhagic infarction — Porencephaly follows a unilateral periventricular haemorrhagic infarction communicating with the ventricle; the stem describes bilateral cystic white-matter injury, typical of PVL.; C. Basal-ganglia predominant injury typical of acute profound term HIE — Basal ganglia-thalamic injury follows acute profound asphyxia in term infants; this preterm infant has periventricular white-matter cysts.", "pearl": "Cystic PVL affects periventricular white matter and is linked to motor impairment.", "note": "From Day 11 · High difficulty"}, {"num": 54, "pos": 54, "section": 1, "topic": "Neonatology", "question": "An infant born at 28 weeks is 12 weeks old chronologically. What is corrected age in weeks?", "options": ["12 weeks", "0 weeks", "4 weeks", "8 weeks"], "answer": 1, "explanation": "Corrected age = chronological age − weeks before 40 weeks; 12 − 12 = 0 weeks. Why not the others (added — not from source): A. 12 weeks — This is chronological age; it ignores the 12 weeks of prematurity (40 minus 28) that must be subtracted.; C. 4 weeks — Birth at 28 weeks is 12 weeks early, not 8; 12 minus 12 gives a corrected age of 0 weeks.; D. 8 weeks — Birth at 28 weeks is 12 weeks early, not 4; the infant is now at 40 weeks postmenstrual age, i.e. term-equivalent, corrected age 0.", "pearl": "Corrected age = chronological age − weeks before 40 weeks.", "note": "From Day 11 · High difficulty"}, {"num": 55, "pos": 55, "section": 1, "topic": "Neonatology", "question": "A former 25-week infant is clinically stable at 30 weeks PMA. What determines next ROP assessment?", "options": ["Findings at the prior retinal examination and protocol-defined interval", "A fixed weekly interval independent of retinal findings", "Current postmenstrual age alone, without reference to the prior examination", "Oxygen requirement alone, stopping surveillance once supplemental oxygen is discontinued"], "answer": 0, "explanation": "Follow-up timing is stage/zone/plus dependent, not a single weight or oxygen criterion. Why not the others (added — not from source): B. A fixed weekly interval independent of retinal findings — ROP review intervals range from under a week to 2-3 weeks depending on zone, stage and plus; a fixed weekly schedule ignores this risk stratification.; C. Current postmenstrual age alone, without reference to the prior examination — PMA guides when screening starts and when it can end, but the interval between examinations is set by the findings of the last examination.; D. Oxygen requirement alone, stopping surveillance once supplemental oxygen is discontinued — Stopping oxygen does not end ROP risk; surveillance continues until retinal vascularisation is complete or regression criteria are met.", "pearl": "Follow-up timing is stage/zone/plus dependent, not a single weight or oxygen criterion.", "note": "From Day 11 · Basic / easily confused"}, {"num": 56, "pos": 56, "section": 1, "topic": "Neonatology", "question": "A former preterm infant has a normal neurologic examination at discharge after severe IVH. Which follow-up is best?", "options": ["Structured neurodevelopmental surveillance despite normal early exam", "Arrange developmental follow-up when the discharge neurologic examination is abnormal", "Arrange developmental follow-up when term-equivalent MRI shows a major lesion", "Use standard primary-care surveillance without a structured high-risk follow-up program"], "answer": 0, "explanation": "Early normal exam does not exclude later motor/cognitive deficits after severe neonatal brain injury. Why not the others (added — not from source): B. Arrange developmental follow-up when the discharge neurologic examination is abnormal — A normal discharge examination does not exclude later cerebral palsy or cognitive deficits; severe IVH itself mandates structured follow-up.; C. Arrange developmental follow-up when term-equivalent MRI shows a major lesion — Severe IVH is already a high-risk indication; follow-up should not depend on a further imaging lesion, and imaging does not fully predict outcome.; D. Use standard primary-care surveillance without a structured high-risk follow-up program — Routine primary-care checks lack standardised neurodevelopmental assessments; severe IVH warrants a structured high-risk programme to enable early intervention.", "pearl": "Early normal exam does not exclude later motor/cognitive deficits after severe neonatal brain injury.", "note": "From Day 12 · Conceptual"}, {"num": 57, "pos": 57, "section": 1, "topic": "Neonatology", "question": "A baby with severe HIE and persistent seizures is now clinically quiet on medication. Which monitoring strategy best detects ongoing subclinical events?", "options": ["Single normal cranial ultrasound", "Serum sodium alone", "Intermittent visual inspection alone", "Continuous or prolonged EEG according to availability and clinical need"], "answer": 3, "explanation": "Neonatal electrographic seizures often lack clinical correlate; EEG detects seizure burden. Why not the others (added — not from source): A. Single normal cranial ultrasound — Cranial ultrasound shows structural lesions but provides no information on electrical seizure activity.; B. Serum sodium alone — Hyponatraemia can provoke seizures, but a sodium level cannot detect ongoing electrographic seizures, which are frequent after medication.; C. Intermittent visual inspection alone — After antiseizure drugs many neonatal seizures become electrographic only (electroclinical uncoupling), so observation alone misses most of the seizure burden.", "pearl": "Neonatal electrographic seizures often lack clinical correlate.", "note": "From Day 12 · Clinical / application"}, {"num": 58, "pos": 58, "section": 1, "topic": "Neonatology", "question": "A ventilated preterm baby has sudden desaturation, bradycardia and no chest movement after repositioning. What is the best immediate approach?", "options": ["Increase peak inspiratory pressure and FiO2 before checking the airway or circuit", "Obtain a chest radiograph before restoring effective ventilation", "Assess airway and circuit using DOPE while providing effective ventilation", "Administer sedation and neuromuscular blockade before checkin
