g tube position"], "answer": 2, "explanation": "Sudden deterioration requires airway/circuit troubleshooting and stabilization before delayed testing. Why not the others (added — not from source): A. Increase peak inspiratory pressure and FiO2 before checking the airway or circuit — Raising pressure and oxygen before checking for displacement, obstruction, pneumothorax or equipment failure delays the real fix and risks barotrauma.; B. Obtain a chest radiograph before restoring effective ventilation — A radiograph delays restoring ventilation; sudden loss of chest movement after repositioning suggests tube displacement or obstruction needing immediate bedside correction.; D. Administer sedation and neuromuscular blockade before checking tube position — Paralysing an infant with a possibly displaced or blocked tube removes spontaneous breathing and can be catastrophic; tube position must be confirmed first.", "pearl": "Sudden deterioration requires airway/circuit troubleshooting and stabilization before delayed testing.", "note": "From Day 12 · Clinical / application"}, {"num": 59, "pos": 59, "section": 1, "topic": "Neonatology", "question": "A 30-week infant receiving enteral feeds develops bilious aspirates and abdominal discoloration. Which step is most appropriate?", "options": ["Reduce the feed volume and observe because bilious residuals are common in preterm infants", "Hold feeds, assess urgently for NEC/obstruction and support circulation", "Continue feeds while obtaining a screening abdominal radiograph", "Switch to continuous feeds while monitoring the abdominal discoloration"], "answer": 1, "explanation": "Bilious aspirates plus discoloration are red flags for bowel disease and require urgent assessment. Why not the others (added — not from source): A. Reduce the feed volume and observe because bilious residuals are common in preterm infants — Bilious aspirates with abdominal wall discolouration are not benign residuals; they signal possible NEC or obstruction requiring feeds to be stopped.; C. Continue feeds while obtaining a screening abdominal radiograph — Continuing feeds in suspected NEC worsens bowel injury; feeds should be stopped while imaging and assessment proceed.; D. Switch to continuous feeds while monitoring the abdominal discoloration — Changing the feeding mode does not address possible NEC or obstruction; bilious output with discolouration requires stopping feeds and urgent evaluation.", "pearl": "Bilious aspirates plus discoloration are red flags for bowel disease and require urgent assessment.", "note": "From Day 12 · Basic / easily confused"}, {"num": 60, "pos": 60, "section": 1, "topic": "Neonatology", "question": "A neonate with cyanosis has minimal improvement on oxygen and echo shows severe PPHN. Which competing diagnosis must still be excluded?", "options": ["Structural cyanotic congenital heart disease", "Physiologic neonatal polycythemia alone", "Simple reflux", "Isolated vitamin D deficiency"], "answer": 0, "explanation": "Cyanotic CHD can mimic PPHN; echocardiographic anatomy is essential. Why not the others (added — not from source): B. Physiologic neonatal polycythemia alone — Polycythaemia can contribute to PPHN but is identified on a haematocrit and does not mimic it anatomically; the essential exclusion is structural heart disease on echocardiography.; C. Simple reflux — Reflux does not cause persistent cyanosis unresponsive to oxygen and is not a differential of PPHN.; D. Isolated vitamin D deficiency — Vitamin D deficiency does not produce neonatal cyanosis or pulmonary hypertension physiology.", "pearl": "Cyanotic CHD can mimic PPHN.", "note": "From Day 12 · Clinical / application"}, {"num": 61, "pos": 61, "section": 1, "topic": "Growth/Development", "question": "A 6-year-old has height below −3 SDS, growth velocity 2 cm/year and preserved weight-for-height. Which next evaluation is most appropriate?", "options": ["Classify as familial short stature from midparental height alone", "Investigate pathologic short stature including bone age and endocrine/systemic causes", "Proceed directly to a growth-hormone stimulation test before basic evaluation", "Diagnose constitutional delay solely from a delayed bone age"], "answer": 1, "explanation": "Severely reduced growth velocity and height warrant systematic assessment; family height alone does not exclude disease. Why not the others (added — not from source): A. Classify as familial short stature from midparental height alone — Familial short stature has normal growth velocity and height within the midparental target range; a velocity of 2 cm/year and height below -3 SDS point to pathology.; C. Proceed directly to a growth-hormone stimulation test before basic evaluation — GH stimulation testing comes only after excluding hypothyroidism, systemic disease, malnutrition and Turner syndrome, and after bone age assessment.; D. Diagnose constitutional delay solely from a delayed bone age — Delayed bone age also occurs with GH deficiency, hypothyroidism and chronic disease; constitutional delay requires normal growth velocity, which is absent here.", "pearl": "Severely reduced growth velocity and height warrant systematic assessment.", "note": "From Day 13 · High difficulty"}, {"num": 62, "pos": 62, "section": 1, "topic": "Growth/Development", "question": "An 8-year-old is short but has normal growth velocity, delayed bone age and family history of late puberty. Which diagnosis is most likely?", "options": ["Constitutional delay of growth and puberty", "Growth hormone deficiency with progressive deceleration", "Turner syndrome irrespective of phenotype", "Primary hypothyroidism with falling growth velocity"], "answer": 0, "explanation": "Normal velocity plus delayed maturation and family pattern supports constitutional delay; ongoing follow-up remains needed. Why not the others (added — not from source): B. Growth hormone deficiency with progressive deceleration — GH deficiency shows falling growth velocity with crossing of centiles; here velocity is normal.; C. Turner syndrome irrespective of phenotype — Turner syndrome must be considered in any short girl, but normal velocity with a family history of late puberty fits constitutional delay far better.; D. Primary hypothyroidism with falling growth velocity — Hypothyroidism causes falling growth velocity, often with weight gain; normal velocity argues against it.", "pearl": "Normal velocity plus delayed maturation and family pattern supports constitutional delay.", "note": "From Day 13 · Basic / easily confused"}, {"num": 63, "pos": 63, "section": 1, "topic": "Growth/Development", "question": "A child with short stature has relatively high weight-for-height and slowing linear growth. Which category is especially important to investigate?", "options": ["Constitutional delay of growth and puberty", "Chronic systemic disease or undernutrition", "Skeletal dysplasia with disproportion", "Endocrine causes such as hypothyroidism or cortisol excess"], "answer": 3, "explanation": "Endocrine growth failure often preserves or increases relative weight; systemic illness commonly lowers weight. Why not the others (added — not from source): A. Constitutional delay of growth and puberty — Constitutional delay shows normal growth velocity after early childhood and usually proportionate weight, not slowing growth with relative overweight.; B. Chronic systemic disease or undernutrition — Systemic illness and undernutrition usually reduce weight more than height, giving low weight-for-height, the opposite of this stem.; C. Skeletal dysplasia with disproportion — Skeletal dysplasia presents with disproportionate body segments, which the stem does not describe; preserved weight with slowing growth points to endocrine causes.", "pearl": "Endocrine growth failure often preserves or increases relative weight.", "note": "From Day 13 · Clinical / application"}, {"num": 64, "pos": 64, "section": 1, "topic": "Growth/Development", "question": "A child has normal birth length but progressively falls across height centiles after age 3. What finding best differentiates pathologic growth failure from normal variation?", "options": ["A single midparental height estimate", "A normal appetite history alone", "Serially reduced height velocity", "One normal head circumference"], "answer": 2, "explanation": "Growth velocity captures dynamic failure and is more informative than one isolated percentile. Why not the others (added — not from source): A. A single midparental height estimate — Midparental height estimates the genetic target but cannot by itself show whether the child is currently growing abnormally.; B. A normal appetite history alone — A normal appetite does not exclude endocrine or systemic disease and does not measure growth.; D. One normal head circumference — A single head circumference gives no information about the trend of linear growth.", "pearl": "Growth velocity captures dynamic failure and is more informative than one isolated percentile.", "note": "From Day 13 · Clinical / application"}, {"num": 65, "pos": 65, "section": 1, "topic": "Growth/Development", "question": "A 20-month-old has lost previously acquired words and social engagement. What is the appropriate response?", "options": ["Begin autism-specific behavioral therapy and defer etiologic evaluation", "Arrange hearing testing alone and reassess development later", "Urgent developmental/neurologic assessment for regression", "Schedule follow-up after a short observation period before initiating an etiologic regression work-up"], "answer": 2, "explanation": "Loss of attained skills is a red flag, unlike isolated mild delay. Why not the others (added — not from source): A. Begin autism-specific behavioral therapy and defer etiologic evaluation — Regression requires etiologic assessment (EEG, metabolic and genetic causes, Landau-Kleffner, Rett) alongside therapy; deferring it risks missing treatable disease.; B. Arrange hearing testing alone and reassess development later — Hearing testing is part of the work-up but does not explain loss of social engagement; regression needs a full urgent evaluation.; D. Schedule follow-up after a short observation period before initiating an etiologic regression work-up — Loss of acquired skills is a red flag; watchful waiting is inappropriate and delays diagnosis of progressive or treatable disorders.", "pearl": "Loss of attained skills is a red flag, unlike isolated mild delay.", "note": "From Day 14 · Conceptual"}, {"num": 66, "pos": 66, "section": 1, "topic": "Growth/Development", "question": "A toddler has no meaningful words, reduced joint attention and absent pointing. Which assessment should be prioritized?", "options": ["Comprehensive developmental and hearing assessment including autism screening", "Autism-specific screening without formal developmental or hearing assessment", "Audiology alone because absent pointing is explained by hearing loss", "Speech-language therapy alone before evaluating social communication and hearing"], "answer": 0, "explanation": "Communication/social deficits require hearing and broader developmental evaluation. Why not the others (added — not from source): B. Autism-specific screening without formal developmental or hearing assessment — Autism screening without hearing and global developmental assessment may miss hearing loss or broader delay that can mimic or coexist with autism.; C. Audiology alone because absent pointing is explained by hearing loss — Hearing loss can delay language but does not usually abolish joint attention and pointing; social communication needs assessment too.; D. Speech-language therapy alone before evaluating social communication and hearing — Starting therapy alone delays diagnosis; reduced joint attention requires autism and developmental evaluation along with audiology.", "pearl": "Communication/social deficits require hearing and broader developmental evaluation.", "note": "From Day 14 · Clinical / application"}, {"num": 67, "pos": 67, "section": 1, "topic": "Growth/Development", "question": "A 9-month-old cannot sit unsupported and has persistent fisting and scissoring. What is the most concerning interpretation?", "options": ["Benign isolated motor delay with normal tone evolution", "Peripheral neuromuscular weakness as the leading pattern", "Nutritional rickets as the primary explanation for the scissoring posture", "Central motor disorder requiring early referral"], "answer": 3, "explanation": "Abnormal tone and gross-motor delay together warrant neurologic assessment and early intervention. Why not the others (added — not from source): A. Benign isolated motor delay with normal tone evolution — Persistent fisting and scissoring indicate abnormal increased tone, so this is not a benign isolated delay with normal tone.; B. Peripheral neuromuscular weakness as the leading pattern — Peripheral neuromuscular disease causes hypotonia with reduced reflexes, not scissoring and fisting, which are upper motor neurone signs.; C. Nutritional rickets as the primary explanation for the scissoring posture — Rickets causes bowing, hypotonia and delayed milestones but not spastic scissoring or persistent cortical thumb posture.", "pearl": "Abnormal tone and gross-motor delay together warrant neurologic assessment and early intervention.", "note": "From Day 14 · Conceptual"}, {"num": 68, "pos": 68, "section": 1, "topic": "Growth/Development", "question": "A 4-year-old with attention and sleep concerns is screened using BEARS. Which domain is not directly one of its five letters?", "options": ["Routine iron studies", "Excessive daytime sleepiness", "Snoring", "Bedtime problems"], "answer": 0, "explanation": "BEARS screens Bedtime, Excessive daytime sleepiness, Awakenings, Regularity/duration and Snoring. Why not the others (added — not from source): B. Excessive daytime sleepiness — Excessive daytime sleepiness is the 'E' in BEARS, so it is part of the tool.; C. Snoring — Snoring is the 'S' in BEARS, screening for sleep-disordered breathing.; D. Bedtime problems — Bedtime problems is the 'B' in BEARS, its first domain.", "pearl": "BEARS screens Bedtime, Excessive daytime sleepiness, Awakenings, Regularity/duration and Snoring.", "note": "From Day 14 · High difficulty"}, {"num": 69, "pos": 69, "section": 1, "topic": "Growth/Development", "question": "A 10-kg child with complicated SAM is entering stabilization. Which feeding principle is most appropriate?", "options": ["Small frequent F-75 feeds with cautious fluid/electrolyte management", "Start F-100 immediately at catch-up volumes during initial stabilization", "Use ready-to-use therapeutic food as the initial feed despite medical instability", "Use IV maintenance fluids in place of cautious enteral stabilization feeding"], "answer": 0, "explanation": "Stabilization uses F-75 and cautious management; catch-up feeding follows clinical stabilization. Why not the others (added — not from source): B. Start F-100 immediately at catch-up volumes during initial stabilization — F-100 is the catch-up feed for the rehabilitation phase; high energy and protein during stabilisation risk refeeding syndrome and heart failure.; C. Use ready-to-use therapeutic food as the initial feed despite medical instability — RUTF is used once the child is stable with appetite returning; medically unstable children start on F-75.; D. Use IV maintenance fluids in place of cautious enteral stabilization feeding — Children with SAM tolerate IV fluids poorly and risk overload and heart failure; IV fluids are reserved for shock, with enteral F-75 as the main approach.", "pearl": "Stabilization uses F-75 and cautious management.", "note": "From Day 15 · Clinical / application"}, {"num": 70, "pos": 70, "section": 1, "topic": "Growth/Development", "question": "A 12-kg child receives F-75 at 130 mL/kg/day divided into 8 feeds. What is the volume per feed?", "options": ["156 mL", "130 mL", "195 mL", "240 mL"], "answer": 2, "explanation": "Total 1560 mL/day; divide by eight = 195 mL/feed; verify whether 130 mL/kg/day is appropriate to the case protocol. Why not the others (added — not from source): A. 156 mL — This equals 12 x 130 divided by 10; the daily total of 1560 mL must be divided by 8 feeds, not 10.; B. 130 mL — This is the per-kilogram daily volume, not the per-feed volume for a 12-kg child.; D. 240 mL — This does not match the calculation; 1560 mL divided by 8 feeds is 195 mL.", "pearl": "Total 1560 mL/day.", "note": "From Day 15 · Clinical / application"}, {"num": 71, "pos": 71, "section": 1, "topic": "Growth/Development", "question": "An infant develops vomiting and wheeze minutes after formula, with reproducible urticaria. Which diagnosis best explains the pattern?", "options": ["Celiac disease triggered by milk protein", "Primary lactase deficiency from birth", "IgE-mediated cow-milk allergy", "Non-IgE food protein-induced enterocolitis alone"], "answer": 2, "explanation": "Immediate skin/respiratory symptoms after exposure support IgE-mediated allergy. Why not the others (added — not from source): A. Celiac disease triggered by milk protein — Coeliac disease is triggered by gluten, not milk, and causes chronic enteropathy rather than immediate urticaria and wheeze.; B. Primary lactase deficiency from birth — Lactase deficiency causes osmotic diarrhoea and bloating, not urticaria or wheeze; congenital lactase deficiency is also very rare.; D. Non-IgE food protein-induced enterocolitis alone — FPIES causes delayed repetitive vomiting 1-4 hours after ingestion without urticaria or wheeze; immediate skin and respiratory signs indicate IgE-mediated allergy.", "pearl": "Immediate skin/respiratory symptoms after exposure support IgE-mediated allergy.", "note": "From Day 15 · Integrated / rank-differentiating"}, {"num": 72, "pos": 72, "section": 1, "topic": "Growth/Development", "question": "A breastfed infant is thriving but has a small amount of blood-streaked stool and is otherwise well. Which diagnosis should be considered?", "options": ["Food protein-induced allergic proctocolitis", "Anal fissure despite a normal perianal examination", "Early intussusception without episodic pain or systemic symptoms", "Infectious colitis despite absence of fever, diarrhea, or illness"], "answer": 0, "explanation": "Well-appearing infants with small rectal bleeding may have allergic proctocolitis after excluding concerning causes. Why not the others (added — not from source): B. Anal fissure despite a normal perianal examination — A fissure is diagnosed on perianal inspection; a normal examination makes it unlikely here.; C. Early intussusception without episodic pain or systemic symptoms — Intussusception presents with episodic pain, vomiting, lethargy or a mass; a thriving, well infant with streaks of blood does not fit.; D. Infectious colitis despite absence of fever, diarrhea, or illness — Infectious colitis usually causes fever, diarrhoea and systemic illness, all absent in this well infant.", "pearl": "Well-appearing infants with small rectal bleeding may have allergic proctocolitis after excluding concerning causes.", "note": "From Day 15 · Basic / easily confused"}, {"num": 73, "pos": 73, "section": 1, "topic": "Growth/Development", "question": "A child with night blindness and xerophthalmia is at risk of which nutritional deficiency?", "options": ["Vitamin B12 deficiency", "Vitamin A deficiency", "Vitamin C deficiency", "Vitamin D deficiency"], "answer": 1, "explanation": "Night blindness and xerophthalmia reflect impaired retinoid-dependent visual function. Why not the others (added — not from source): A. Vitamin B12 deficiency — B12 deficiency causes megaloblastic anaemia and neuropathy, not night blindness or conjunctival xerosis.; C. Vitamin C deficiency — Vitamin C deficiency causes scurvy with gum bleeding, perifollicular haemorrhages and bone pain, not xerophthalmia.; D. Vitamin D deficiency — Vitamin D deficiency causes rickets and hypocalcaemia; it does not affect rhodopsin or the conjunctival epithelium.", "pearl": "Night blindness and xerophthalmia reflect impaired retinoid-dependent visual function.", "note": "From Day 16 · High difficulty"}, {"num": 74, "pos": 74, "section": 1, "topic": "Growth/Development", "question": "A child with painful bowed legs has low phosphate, elevated ALP and normal renal function. Which pair best captures leading causes that should be distinguished?", "options": ["Nutritional vitamin D deficiency and hypophosphatasia", "Nutritional rickets and renal phosphate wasting", "Hypophosphatasia and osteogenesis imperfecta", "Scurvy and congenital hypothyroidism"], "answer": 1, "explanation": "Hypophosphatemia with rachitic signs needs evaluation of intake, vitamin D metabolism and renal phosphate handling. Why not the others (added — not from source): A. Nutritional vitamin D deficiency and hypophosphatasia — Hypophosphatasia is defined by low ALP, which contradicts the raised ALP here.; C. Hypophosphatasia and osteogenesis imperfecta — Hypophosphatasia has low ALP and osteogenesis imperfecta usually has normal mineral biochemistry with fractures; neither fits hypophosphataemic rickets with high ALP.; D. Scurvy and congenital hypothyroidism — Scurvy causes subperiosteal bleeding without hypophosphataemia, and hypothyroidism causes growth delay; neither explains rickets with low phosphate.", "pearl": "Hypophosphatemia with rachitic signs needs evaluation of intake, vitamin D metabolism and renal phosphate handling.", "note": "From Day 16 · Conceptual"}, {"num": 75, "pos": 75, "section": 1, "topic": "Growth/Development", "question": "A vegan adolescent has macrocytosis, paresthesia and low serum B12. Which associated biochemical finding is most useful?", "options": ["Elevated methylmalonic acid", "Low homocysteine", "Undetectable urinary orotic acid", "Isolated elevated ferritin"], "answer": 0, "explanation": "B12 deficiency raises methylmalonic acid and homocysteine; folate deficiency does not elevate methylmalonic acid. Why not the others (added — not from source): B. Low homocysteine — B12 is a cofactor for methionine synthase, so deficiency raises homocysteine rather than lowering it.; C. Undetectable urinary orotic acid — Orotic acid relates to urea-cycle defects and hereditary orotic aciduria, not B12 deficiency.; D. Isolated elevated ferritin — Ferritin reflects iron stores and inflammation; an isolated rise does not support B12 deficiency.", "pearl": "B12 deficiency raises methylmalonic acid and homocysteine.", "note": "From Day 16 · Clinical / application"}, {"num": 76, "pos": 76, "section": 1, "topic": "Growth/Development", "question": "A neonate has hypotonia, single palmar crease and congenital AVSD. Which chromosomal disorder is most likely?", "options": ["Monosomy X", "Trisomy 21", "Trisomy 18", "22q11.2 deletion"], "answer": 1, "explanation": "AVSD is strongly associated with trisomy 21; other syndromes have different characteristic patterns. Why not the others (added — not from source): A. Monosomy X — Turner syndrome shows lymphoedema, webbed neck and left-sided lesions such as coarctation or bicuspid valve, not AVSD with marked hypotonia.; C. Trisomy 18 — Trisomy 18 shows clenched overlapping fingers, rocker-bottom feet and VSD or polyvalvular disease; hypotonia, single crease and AVSD are classic for trisomy 21.; D. 22q11.2 deletion — 22q11.2 deletion is linked to conotruncal defects, hypocalcaemia and palatal anomalies rather than AVSD.", "pearl": "AVSD is strongly associated with trisomy 21.", "note": "From Day 17 · High difficulty"}, {"num": 77, "pos": 77, "section": 1, "topic": "Growth/Development", "question": "An infant has severe growth failure, seizures and a 'Greek warrior helmet' facial appearance. Which genetic abnormality is most characteristic?", "options": ["Trisomy 13", "Deletion of 5p (cri-du-chat)", "Deletion of 22q11.2", "Terminal deletion of 4p (Wolf–Hirschhorn syndrome)"], "answer": 3, "explanation": "Wolf–Hirschhorn syndrome is associated with 4p deletion and distinctive craniofacial features. Why not the others (added — not from source): A. Trisomy 13 — Trisomy 13 shows holoprosencephaly, cleft lip/palate, polydactyly and scalp defects; the 'Greek warrior helmet' face is specific to 4p deletion.; B. Deletion of 5p (cri-du-chat) — Cri-du-chat (5p deletion) presents with a high-pitched cat-like cry, microcephaly and round face, not a 'Greek warrior helmet' profile.; C. Deletion of 22q11.2 — 22q11.2 deletion presents with conotruncal heart defects, hypocalcaemia and immunodeficiency, not this facial pattern with severe growth failure.", "pearl": "Wolf–Hirschhorn syndrome is associated with 4p deletion and distinctive craniofacial features.", "note": "From Day 17 · Clinical / application"}, {"num": 78, "pos": 78, "section": 1, "topic": "Growth/Development", "question": "A neonate has cleft palate, conotruncal heart disease and hypocalcemia. Which genetic test target is most relevant?", "options": ["7q11.23 deletion", "22q11.2 microdeletion", "FMR1 expansion", "15q11-q13 imprinting defect"], "answer": 1, "explanation": "DiGeorge spectrum often combines conotruncal defects, hypocalcemia and palatal anomalies. Why not the others (added — not from source): A. 7q11.23 deletion — 7q11.23 deletion is Williams syndrome, with supravalvular aortic stenosis, hypercalcaemia and elfin facies, the opposite calcium disturbance.; C. FMR1 expansion — Fragile X causes intellectual disability, macro-orchidism and a long face, not neonatal cleft palate, conotruncal defects and hypocalcaemia.; D. 15q11-q13 imprinting defect — 15q11-q13 imprinting defects cause Prader-Willi or Angelman syndromes, which do not feature conotruncal heart disease or hypocalcaemia.", "pearl": "DiGeorge spectrum often combines conotruncal defects, hypocalcemia and palatal anomalies.", "note": "From Day 17 · Conceptual"}, {"num": 79, "pos": 79, "section": 1, "topic": "Growth/Development", "question": "A 3-year-old develops lethargy after prolonged fasting with glucose 38 mg/dL, minimal ketones and elevated C8 acylcarnitine. Which disorder is most likely?", "options": ["Medium-chain acyl-CoA dehydrogenase deficiency", "Very-long-chain acyl-CoA dehydrogenase deficiency", "Propionic acidemia", "Maple syrup urine disease"], "answer": 0, "explanation": "MCAD typically gives hypoketotic hypoglycemia and C8 elevation; VLCAD more often C14:1. Why not the others (added — not from source): B. Very-long-chain acyl-CoA dehydrogenase deficiency — VLCAD typically elevates C14:1 and often causes cardiomyopathy or rhabdomyolysis; C8 elevation is characteristic of MCAD.; C. Propionic acidemia — Propionic acidaemia raises C3 and causes ketoacidosis with hyperammonaemia, not hypoketotic hypoglycaemia with high C8.; D. Maple syrup urine disease — MSUD raises branched-chain amino acids with ketoacidosis and maple-syrup odour, not hypoketotic hypoglycaemia with C8 elevation.", "pearl": "MCAD typically gives hypoketotic hypoglycemia and C8 elevation.", "note": "From Day 18 · Conceptual"}, {"num": 80, "pos": 80, "section": 1, "topic": "Growth/Development", "question": "A newborn has severe hyperammonemia, respiratory alkalosis and elevated urinary orotic acid without metabolic acidosis. Which defect is most likely?", "options": ["Methylmalonic acidemia", "Maple syrup urine disease", "Ornithine transcarbamylase deficiency", "Carbamoyl phosphate synthetase I deficiency"], "answer": 2, "explanation": "OTC deficiency shunts carbamoyl phosphate to pyrimidine synthesis, elevating orotic acid. Why not the others (added — not from source): A. Methylmalonic acidemia — MMA causes metabolic acidosis with ketosis and high C3; this stem has respiratory alkalosis and no acidosis.; B. Maple syrup urine disease — MSUD presents with encephalopathy, ketoacidosis and raised leucine, with little hyperammonaemia and no orotic aciduria.; D. Carbamoyl phosphate synthetase I deficiency — CPS1 deficiency gives similar hyperammonaemia but low or normal orotic acid, because carbamoyl phosphate is not produced in excess.", "pearl": "OTC deficiency shunts carbamoyl phosphate to pyrimidine synthesis, elevating orotic acid.", "note": "From Day 18 · Conceptual"}, {"num": 81, "pos": 81, "section": 1, "topic": "Growth/Development", "question": "An infant develops vomiting, jaundice and coagulopathy after milk exposure, with positive urine reducing substances. Which defect is most likely?", "options": ["Hereditary fructose intolerance before fructose exposure", "Medium-chain acyl-CoA dehydrogenase deficiency", "Isolated galactokinase deficiency", "Classic galactosemia due to GALT deficiency"], "answer": 3, "explanation": "Systemic hepatic illness after lactose/galactose points to GALT deficiency; GALK1 more often isolated cataracts. Why not the others (added — not from source): A. Hereditary fructose intolerance before fructose exposure — HFI needs fructose, sucrose or sorbitol exposure; milk lactose does not trigger it, and the option itself specifies no fructose exposure.; B. Medium-chain acyl-CoA dehydrogenase deficiency — MCAD presents with fasting hypoketotic hypoglycaemia, not jaundice, coagulopathy and reducing substances after milk feeds.; C. Isolated galactokinase deficiency — Galactokinase deficiency mainly causes cataracts without vomiting, liver failure or coagulopathy.", "pearl": "Systemic hepatic illness after lactose/galactose points to GALT deficiency.", "note": "From Day 18 · Integrated / rank-differentiating"}, {"num": 82, "pos": 82, "section": 1, "topic": "Growth/Development", "question": "A child has vomiting, hypoglycemia and lactic acidosis after introduction of fruit juice; no symptoms occurred on exclusive milk feeds. Which disorder fits best?", "options": ["Classic galactosemia", "Glycogen storage disease type II", "Galactokinase deficiency", "Hereditary fructose intolerance (aldolase B deficiency)"], "answer": 3, "explanation": "Fructose/sucrose/sorbitol exposure triggers hereditary fructose intolerance, unlike milk-triggered galactose disorders. Why not the others (added — not from source): A. Classic galactosemia — Galactosemia presents after milk (lactose) feeds; this child was well on exclusive milk and became ill only after fruit juice.; B. Glycogen storage disease type II — Pompe disease (GSD II) is a lysosomal disorder with cardiomyopathy and hypotonia; it causes neither hypoglycaemia nor fruit-related symptoms.; C. Galactokinase deficiency — Galactokinase deficiency mainly causes cataracts after galactose exposure, not vomiting, hypoglycaemia or lactic acidosis after fruit.", "pearl": "Fructose/sucrose/sorbitol exposure triggers hereditary fructose intolerance, unlike milk-triggered galactose disorders.", "note": "From Day 18 · Integrated / rank-differentiating"}, {"num": 83, "pos": 83, "section": 1, "topic": "Growth/Development", "question": "An infant with metabolic acidosis, ketosis and elevated C3 acylcarnitine has hyperammonemia. Which disorder is favored over a primary urea-cycle defect?", "options": ["Methylmalonic acidemia", "Ornithine transcarbamylase deficiency", "Propionic acidemia", "Maple syrup urine disease"], "answer": 2, "explanation": "Organic acidemias commonly cause high anion-gap acidosis and ketosis; primary urea-cycle defects usually present with respiratory alkalosis. Why not the others (added — not from source): A. Methylmalonic acidemia — Methylmalonic acidaemia shares raised C3, ketoacidosis and hyperammonaemia; separating it needs urine organic acids showing methylmalonic acid, which the stem does not provide.; B. Ornithine transcarbamylase deficiency — OTC deficiency causes hyperammonaemia with respiratory alkalosis, no ketoacidosis and normal C3.; D. Maple syrup urine disease — MSUD causes ketoacidosis with raised branched-chain amino acids and alloisoleucine, not raised C3 with marked hyperammonaemia.", "pearl": "Organic acidemias commonly cause high anion-gap acidosis and ketosis.", "note": "From Day 18 · Clinical / application"}, {"num": 84, "pos": 84, "section": 1, "topic": "Cardiology", "question": "A 2-day-old becomes shocked as the duct closes; femoral pulses are weak, upper-limb pressure exceeds lower-limb pressure. What is the first stabilizing therapy while arranging definitive care?", "options": ["Adenosine for presumed SVT", "Prostaglandin E1 infusion for suspected duct-dependent systemic flow", "High-dose diuretic alone", "Immediate closure of the duct with ibuprofen"], "answer": 1, "explanation": "Critical coarctation can depend on ductal flow; PGE1 helps restore systemic perfusion. Why not the others (added — not from source): A. Adenosine for presumed SVT — There is no tachyarrhythmia; differential limb pressures and weak femoral pulses as the duct closes point to duct-dependent systemic circulation.; C. High-dose diuretic alone — Diuretics do not restore lower-body perfusion; reopening the duct with PGE1 is the life-saving step.; D. Immediate closure of the duct with ibuprofen — Closing the duct would remove the remaining systemic blood flow in critical coarctation and worsen shock.", "pearl": "Critical coarctation can depend on ductal flow.", "note": "From Day 19 · Clinical / application"}, {"num": 85, "pos": 85, "section": 1, "topic": "Cardiology", "question": "A neonate is deeply cyanosed with d-TGA and restrictive atrial mixing despite PGE1. What intervention most directly improves mixing?", "options": ["Urgent balloon atrial septostomy", "Pulmonary valvotomy", "Coarctation stenting", "PDA device closure"], "answer": 0, "explanation": "Restrictive atrial communication in d-TGA requires atrial-level mixing, often via septostomy. Why not the others (added — not from source): B. Pulmonary valvotomy — Pulmonary valvotomy treats pulmonary valve stenosis; d-TGA cyanosis is due to parallel circulations with inadequate mixing.; C. Coarctation stenting — Coarctation stenting relieves aortic arch obstruction and does not improve atrial mixing.; D. PDA device closure — Closing the duct removes a mixing site and would worsen cyanosis in d-TGA.", "pearl": "Restrictive atrial communication in d-TGA requires atrial-level mixing, often via septostomy.", "note": "From Day 19 · High difficulty"}, {"num": 86, "pos": 86, "section": 1, "topic": "Cardiology", "question": "A newborn has severe cyanosis, diffuse pulmonary edema and obstructed infracardiac TAPVC. What is the definitive priority?", "options": ["Emergency surgical relief of pulmonary venous obstruction", "Prostaglandin E1 infusion as definitive treatment of pulmonary venous obstruction", "Balloon atrial septostomy as definitive relief of the obstructed pulmonary venous pathway", "Inhaled nitric oxide as definitive therapy despite fixed pulmonary venous obstruction"], "answer": 0, "explanation": "Obstructed TAPVC causes venous hypertension; urgent surgery is needed rather than delaying for edema resolution. Why not the others (added — not from source): B. Prostaglandin E1 infusion as definitive treatment of pulmonary venous obstruction — PGE1 does not relieve pulmonary venous obstruction and may worsen pulmonary oedema by increasing pulmonary flow; it is not definitive.; C. Balloon atrial septostomy as definitive relief of the obstructed pulmonary venous pathway — In infracardiac TAPVC the obstruction lies in the descending vertical vein or ductus venosus, so atrial septostomy does not relieve it.; D. Inhaled nitric oxide as definitive therapy despite fixed pulmonary venous obstruction — iNO can increase pulmonary blood flow and worsen oedema against a fixed venous obstruction; only surgical repair addresses the cause.", "pearl": "Obstructed TAPVC causes venous hypertension.", "note": "From Day 19 · High difficulty"}, {"num": 87, "pos": 87, "section": 1, "topic": "Cardiology", "question": "A child after Fontan palliation has edema, low albumin and increased fecal alpha-1 antitrypsin clearance. Which complication is most likely?", "options": ["Plastic bronchitis", "Protein-losing enteropathy", "Fontan-associated liver disease alone", "Chylothorax"], "answer": 1, "explanation": "Intestinal protein loss explains hypoalbuminemia with increased fecal alpha-1 antitrypsin. Why not the others (added — not from source): A. Plastic bronchitis — Plastic bronchitis causes airway casts with cough and respiratory distress, not hypoalbuminaemia with raised faecal alpha-1 antitrypsin.; C. Fontan-associated liver disease alone — Fontan liver disease causes fibrosis and portal hypertension; it does not explain enteric protein loss shown by faecal alpha-1 antitrypsin.; D. Chylothorax — Chylothorax causes a lymphocyte-rich pleural effusion; it does not raise faecal alpha-1 antitrypsin clearance.", "pearl": "Intestinal protein loss explains hypoalbuminemia with increased fecal alpha-1 antitrypsin.", "note": "From Day 19 · Conceptual"}, {"num": 88, "pos": 88, "section": 1, "topic": "Cardiology", "question": "An asymptomatic 8-year-old has fixed wide splitting of S2, right-ventricular volume loading, and echocardiography shows a central interatrial communication at the fossa ovalis. Which lesion is most likely?", "options": ["Secundum atrial septal defect", "Sinus venosus atrial septal defect with partial anomalous pulmonary venous return", "Partial atrioventricular septal defect with a primum atrial communication", "Patent foramen ovale with no significant left-to-right shunt"], "answer": 0, "explanation": "ASD produces RV volume overload and fixed S2 splitting. Why not the others (added — not from source): B. Sinus venosus atrial septal defect with partial anomalous pulmonary venous return — Sinus venosus defects lie at the caval-atrial junction outside the fossa ovalis and are associated with anomalous pulmonary veins.; C. Partial atrioventricular septal defect with a primum atrial communication — Primum defects sit low at AV valve level near the crux, often with a cleft mitral valve, not centrally at the fossa ovalis.; D. Patent foramen ovale with no significant left-to-right shunt — A PFO has no significant shunt, so it would not cause RV volume loading or fixed S2 splitting.", "pearl": "ASD produces RV volume overload and fixed S2 splitting.", "note": "From Day 20 · Clinical / application"}, {"num": 89, "pos": 89, "section": 1, "topic": "Cardiology", "question": "A toddler has a small muscular VSD and normal growth. Which outcome is more likely than for a large perimembranous VSD?", "options": ["Persistence into adulthood is more likely than spontaneous closure", "Progressive aortic regurgitation is more common than with perimembranous defects", "Early pulmonary vascular disease is expected despite the small shunt", "Spontaneous closure"], "answer": 3, "explanation": "Small muscular defects often close spontaneously; management depends on shunt and clinical effect. Why not the others (added — not from source): A. Persistence into adulthood is more likely than spontaneous closure — Small muscular VSDs have high spontaneous closure rates in early childhood; persistence is the less likely outcome.; B. Progressive aortic regurgitation is more common than with perimembranous defects — Aortic cusp prolapse with regurgitation complicates perimembranous and outlet defects, not muscular ones.; C. Early pulmonary vascular disease is expected despite the small shunt — A small restrictive shunt does not raise pulmonary pressures; early pulmonary vascular disease complicates large unrestrictive VSDs.", "pearl": "Small muscular defects often close spontaneously.", "note": "From Day 20 · Clinical / application"}, {"num": 90, "pos": 90, "section": 1, "topic": "Cardiology", "question": "A child has a primum ASD, small restrictive inlet VSD and two separate AV valve orifices. What is the best classification?", "options": ["Partial AVSD with no ventricular component", "Intermediate (transitional) AVSD", "Complete AVSD with a common AV valve orifice and large inlet VSD", "Secundum ASD with an incidental muscular VSD"], "answer": 1, "explanation": "Two valve orifices plus restrictive inlet VSD indicate intermediate AVSD. Why not the others (added — not from source): A. Partial AVSD with no ventricular component — The stem includes a restrictive inlet VSD, so the ventricular component excludes a pure partial (primum-only) AVSD.; C. Complete AVSD with a common AV valve orifice and large inlet VSD — A complete AVSD has a common AV valve orifice and a large non-restrictive inlet VSD; here there are two orifices and a small VSD.; D. Secundum ASD with an incidental muscular VSD — A secundum defect lies at the fossa ovalis; a primum defect with an inlet VSD and AV-valve involvement is an AVSD, not an incidental combination.", "pearl": "Two valve orifices plus restrictive inlet VSD indicate intermediate AVSD.", "note": "From Day 20 · Conceptual"}, {"num": 91, "pos": 91, "section": 1, "topic": "Cardiology", "question": "A patient with prior ASD device closure develops acute chest pain, hypotension and pericardial effusion. What complication requires urgent exclusion?", "options": ["Post-procedural pericarditis without device complication", "Device-associated thrombus with systemic embolization", "Residual interatrial shunt causing acute right-heart volume overload", "Device erosion with tamponade"], "answer": 3, "explanation": "Late device erosion is uncommon but can cause pericardial bleeding and hemodynamic collapse. Why not the others (added — not from source): A. Post-procedural pericarditis without device complication — Uncomplicated pericarditis rarely causes hypotension; chest pain, effusion and shock after device closure require erosion to be excluded first.; B. Device-associated thrombus with systemic embolization — Device thrombus causes stroke or systemic embolism rather than pericardial effusion with hypotension.; C. Residual interatrial shunt causing acute right-heart volume overload — A residual shunt causes gradual volume overload, not acute chest pain, effusion and hypotension.", "pearl": "Late device erosion is uncommon but can cause pericardial bleeding and hemodynamic collapse.", "note": "From Day 20 · High difficulty"}, {"num": 92, "pos": 92, "section": 1, "topic": "Cardiology", "question": "An infant with TOF becomes intensely cyanotic during crying and has reduced murmur intensity. What is the immediate bedside maneuver?", "options": ["Give a rapid IV fluid bolus before changing the infant position", "Knee-chest positioning with calming and oxygen as part of spell management", "Administer IV beta-blocker before any positional or calming maneuver", "Start prostaglandin E1 because a duct-dependent mechanism is being considered"], "answer": 1, "explanation": "Hypercyanotic spells reflect increased right-to-left shunting; knee-chest positioning increases systemic resistance. Why not the others (added — not from source): A. Give a rapid IV fluid bolus before changing the infant position — Fluids help raise preload but come after immediate positioning and calming; delaying the knee-chest manoeuvre loses the quickest way to raise SVR.; C. Administer IV beta-blocker before any positional or calming maneuver — IV beta-blockade is reserved for spells persisting after positioning, calming, oxygen and other first measures.; D. Start prostaglandin E1 because a duct-dependent mechanism is being considered — PGE1 is not spell treatment; hypercyanotic spells result from dynamic infundibular obstruction and falling SVR.", "pearl": "Hypercyanotic spells reflect increased right-to-left shunting.", "note": "From Day 21 · Basic / easily confused"}, {"num": 93, "pos": 93, "section": 1, "topic": "Cardiology", "question": "Duct angiography in a child undergoing transcatheter PDA closure shows a broad aortic ampulla tapering toward the pulmonary insertion. Which Krichenko morphology is this?", "options": ["Type D (complex with multiple constrictions)", "Type B (window)", "Type A (conical)", "Type C (tubular)"], "answer": 2, "explanation": "A conical duct with a broad aortic ampulla and narrow pulmonary end is Krichenko Type A; window, tubular and complex ducts have distinct morphologies. Why not the others (added — not from source): A. Type D (complex with multiple constrictions) — Type D ducts show multiple constrictions along their length; this duct tapers smoothly from a broad aortic ampulla.; B. Type B (window) — Type B (window) ducts are very short with a narrow aortic end; this duct has a broad aortic ampulla.; D. Type C (tubular) — Type C (tubular) ducts have no constriction and a uniform diameter, unlike this tapering conical duct.", "pearl": "A conical duct with a broad aortic ampulla and narrow pulmonary end is Krichenko Type A.", "note": "From Day 20 · Clinical / application"}, {"num": 94, "pos": 94, "section": 1, "topic": "Cardiology", "question": "An infant with TOF and severe RVOT obstruction is not suitable for immediate complete repair. Which option can provide selected catheter-based palliation?", "options": ["Right ventricular outflow tract stenting after anatomy assessment", "Transcatheter ASD closure", "Pulmonary vein stenting for isolated normal veins", "Balloon mitral valvotomy"], "answer": 0, "explanation": "RVOT stenting can augment pulmonary flow in selected anatomy when repair is deferred. Why not the others (added — not from source): B. Transcatheter ASD closure — ASD closure does not increase pulmonary blood flow and has no role in palliating TOF with severe RVOT obstruction.; C. Pulmonary vein stenting for isolated normal veins — Pulmonary vein stenting treats pulmonary vein stenosis and is irrelevant when the veins are normal and the problem is RVOT obstruction.; D. Balloon mitral valvotomy — Mitral valvotomy treats mitral stenosis, which is unrelated to cyanosis from RVOT obstruction in TOF.", "pearl": "RVOT stenting can augment pulmonary flow in selected anatomy when repair is deferred.", "note": "From Day 21 · Conceptual"}, {"num": 95, "pos": 95, "section": 1, "topic": "Cardiology", "question": "A child with repaired TOF develops progressive RV dilation and exercise intolerance years later. Which residual lesion is a common contributor?", "options": ["Residual RVOT obstruction with high RV systolic pressure", "Branch pulmonary artery stenosis with differential lung perfusion", "Severe pulmonary regurgitation", "A small residual VSD without significant left-to-right shunt"], "answer": 2, "explanation": "Chronic pulmonary regurgitation can produce RV volume overload after TOF repair. Why not the others (added — not from source): A. Residual RVOT obstruction with high RV systolic pressure — Residual RVOT obstruction causes pressure overload and RV hypertrophy rather than the progressive volume-driven RV dilation typical after repair.; B. Branch pulmonary artery stenosis with differential lung perfusion — Branch PA stenosis can aggravate pulmonary regurgitation but is a less common primary cause; the dominant driver of late RV dilation is pulmonary regurgitation.; D. A small residual VSD without significant left-to-right shunt — A small haemodynamically insignificant VSD does not produce progressive RV volume overload.", "pearl": "Chronic pulmonary regurgitation can produce RV volume overload after TOF repair.", "note": "From Day 21 · Clinical / application"}, {"num": 96, "pos": 96, "section": 1, "topic": "Neurology", "question": "A 7-year-old has brief staring spells with abrupt onset and termination; EEG shows generalized 3-Hz spike-wave. Which diagnosis is most likely?", "options": ["Focal impaired-awareness seizures", "Lennox–Gastaut syndrome", "Childhood absence epilepsy", "Juvenile myoclonic epilepsy"], "answer": 2, "explanation": "Typical absence seizures have generalized 3-Hz spike-wave with abrupt impaired awareness. Why not the others (added — not from source): A. Focal impaired-awareness seizures — Focal impaired-awareness seizures last longer, with aura, automatisms and postictal confusion, and focal EEG changes rather than generalised 3-Hz spike-wave.; B. Lennox–Gastaut syndrome — Lennox-Gastaut syndrome has slow (under 2.5 Hz) spike-wave, multiple seizure types including tonic seizures, and intellectual disability.; D. Juvenile myoclonic epilepsy — JME begins in adolescence with morning myoclonus and generalised 4-6 Hz polyspike-wave; this 7-year-old fits childhood absence epilepsy.", "pearl": "Typical absence seizures have generalized 3-Hz spike-wave with abrupt impaired awareness.", "note": "From Day 22 · Integrated / rank-differentiating"}, {"num": 97, "pos": 97, "section": 1, "topic": "Neurology", "question": "A 9-month-old has clusters of flexor spasms on waking and developmental regression; EEG shows hypsarrhythmia. What is the best syndrome diagnosis?", "options": ["Self-limited epilepsy with centrotemporal spikes", "Benign sleep myoclonus", "Childhood absence epilepsy", "Infantile epileptic spasms syndrome"], "answer": 3, "explanation": "Spasms with regression and hypsarrhythmia require urgent syndrome-specific treatment. Why not the others (added — not from source): A. Self-limited epilepsy with centrotemporal spikes — Self-limited epilepsy with centrotemporal spikes affects school-age children with nocturnal focal facial seizures and normal development.; B. Benign sleep myoclonus — Benign sleep myoclonus occurs only during sleep in neonates, stops on waking, with normal EEG and development.; C. Childhood absence epilepsy — Childhood absence epilepsy begins at 4-10 years with staring spells and 3-Hz spike-wave, not flexor spasms with hypsarrhythmia.", "pearl": "Spasms with regression and hypsarrhythmia require urgent syndrome-specific treatment.", "note": "From Day 22 · Conceptual"}, {"num": 98, "pos": 98, "section": 1, "topic": "Neurology", "question": "An adolescent has morning myoclonic jerks, generalized tonic-clonic seizures and photosensitivity. Which epilepsy syndrome is most likely?", "options": ["Juvenile myoclonic epilepsy", "Panayiotopoulos syndrome", "Infantile spasms", "Dravet syndrome"], "answer": 0, "explanation": "Morning myoclonus with generalized seizures and photosensitivity suggests JME. Why not the others (added — not from source): B. Panayiotopoulos syndrome — Panayiotopoulos syndrome affects young children with autonomic features and vomiting during sleep, not adolescent morning myoclonus.; C. Infantile spasms — Infantile spasms occur in infancy with hypsarrhythmia, not in adolescents with morning myoclonus.; D. Dravet syndrome — Dravet syndrome begins in infancy with prolonged febrile hemiclonic seizures and developmental decline, not adolescent-onset myoclonus.", "pearl": "Morning myoclonus with generalized seizures and photosensitivity suggests JME.", "note": "From Day 22 · Clinical / application"}, {"num": 99, "pos": 99, "section": 1, "topic": "Neurology", "question": "A child with fever has a 3-minute generalized convulsion, returns to baseline and has no focal signs. Which feature would make it complex rather than simple febrile seizure?", "options": ["Focal semiology or recurrence within 24 hours", "Brief duration under 5 minutes", "Rapid return to baseline", "Age 2 years with one generalized event"], "answer": 0, "explanation": "Complex febrile seizures are prolonged, focal or recurrent in the same febrile illness. Why not the others (added — not from source): B. Brief duration under 5 minutes — A brief duration is a feature of simple febrile seizures; complex seizures are prolonged (15 minutes or more), focal or recurrent within 24 hours.; C. Rapid return to baseline — Rapid return to baseline is consistent with a simple febrile seizure; prolonged postictal deficit or focality suggest complex.; D. Age 2 years with one generalized event — Age 6 months to 5 years with a single generalised event is the textbook simple febrile seizure.", "pearl": "Complex febrile seizures are prolonged, focal or recurrent in the same febrile illness.", "note": "From Day 22 · High difficulty"}, {"num": 100, "pos": 100, "section": 1, "topic": "Neurology", "question": "A child has ongoing convulsive status despite two appropriately dosed benzodiazepine treatments. What is the next treatment principle?", "options": ["Give additional benzodiazepine doses beyond the recommended initial sequence", "Proceed directly to continuous anesthetic infusion without a second-line antiseizure drug", "Prompt second-line antiseizure medication while supporting airway and glucose", "Delay second-line treatment until CT or MRI excludes a structural lesion"], "answer": 2, "explanation": "Established status needs timely escalation beyond benzodiazepines and physiologic stabilization. Why not the others (added — not from source): A. Give additional benzodiazepine doses beyond the recommended initial sequence — After two appropriately dosed benzodiazepines, further doses add respiratory depression without benefit; guidelines move to a second-line agent.; B. Proceed directly to continuous anesthetic infusion without a second-line antiseizure drug — Anaesthetic infusion is for refractory status, after failure of a second-line agent such as levetiracetam, fosphenytoin or valproate.; D. Delay second-line treatment until CT or MRI excludes a structural lesion — Imaging should never delay treatment; status needs urgent seizure control, with neuroimaging once the child is stabilised.", "pearl": "Established status needs timely escalation beyond benzodiazepines and physiologic stabilization.", "note": "From Day 23 · Conceptual"}, {"num": 101, "pos": 101, "section": 2, "topic": "Neurology", "question": "A child with refractory seizures receives valproate but has suspected mitochondrial POLG disease. What is the key safety concern?", "options": ["Hyperammonemia, a known valproate adverse effect but not the defining POLG-specific hazard", "Thrombocytopenia, a general valproate toxicity", "Pancreatitis, a rare valproate complication", "Valproate-associated severe hepatotoxicity"], "answer": 3, "explanation": "POLG-related disease increases risk of fatal valproate hepatotoxicity. Why not the others (added — not from source): A. Hyperammonemia, a known valproate adverse effect but not the defining POLG-specific hazard — Valproate hyperammonaemia occurs in many patients, including urea-cycle defects, and is usually manageable; it is not the catastrophic, POLG-specific risk that makes valproate contraindicated in mitochondrial disease.; B. Thrombocytopenia, a general valproate toxicity — Dose-related thrombocytopenia can occur with any patient on valproate and is monitored routinely; it has no special link to POLG mutations and is rarely fatal.; C. Pancreatitis, a rare valproate complication — Pancreatitis is an idiosyncratic valproate reaction seen irrespective of genotype; POLG disease specifically predisposes to fulminant, often fatal liver failure, not pancreatitis.", "pearl": "POLG-related disease increases risk of fatal valproate hepatotoxicity.", "note": "From Day 23 · Clinical / application"}, {"num": 102, "pos": 102, "section": 2, "topic": "Neurology", "question": "A child in convulsive status has glucose 34 mg/dL. Which intervention must occur immediately alongside seizure care?", "options": ["Continue antiseizure treatment first and correct glucose after initial seizure control", "Give IV calcium before checking whether hypocalcemia is present", "Correct hypoglycemia promptly", "Give hypertonic saline before confirming hyponatremia"], "answer": 2, "explanation": "Hypoglycemia is a reversible cause of seizures and must be treated urgently. Why not the others (added — not from source): A. Continue antiseizure treatment first and correct glucose after initial seizure control — Glucose of 34 mg/dL is itself a cause of the seizure and of ongoing neuronal injury; anticonvulsants will not terminate a hypoglycaemic seizure, so correction cannot be postponed.; B. Give IV calcium before checking whether hypocalcemia is present — Empirical calcium is not indicated without evidence of hypocalcaemia; the documented, immediately reversible abnormality here is hypoglycaemia, which must be treated first.; D. Give hypertonic saline before confirming hyponatremia — Hypertonic saline is reserved for proven symptomatic hyponatraemia; no sodium value is given, whereas the measured glucose of 34 mg/dL demands immediate dextrose.", "pearl": "Hypoglycemia is a reversible cause of seizures and must be treated urgently.", "note": "From Day 23 · Integrated / rank-differentiating"}, {"num": 103, "pos": 103, "section": 2, "topic": "Neurology", "question": "A child has spastic diplegia, brisk reflexes and history of extreme prematurity. Which injury pattern is most associated?", "options": ["Isolated hippocampal sclerosis", "Periventricular white-matter injury", "Pure cerebellar vermis agenesis", "Unilateral cortical dysplasia"], "answer": 1, "explanation": "Prematurity-associated periventricular injury preferentially affects descending leg motor pathways. Why not the others (added — not from source): A. Isolated hippocampal sclerosis — Hippocampal sclerosis is linked to prolonged febrile seizures and temporal lobe epilepsy, not to spastic diplegia of prematurity.; C. Pure cerebellar vermis agenesis — Vermian agenesis produces hypotonia and ataxia (e.g., Joubert, Dandy-Walker), not bilateral leg-predominant spasticity with brisk reflexes.; D. Unilateral cortical dysplasia — Unilateral cortical dysplasia causes focal epilepsy or hemiparesis, not symmetric leg-predominant spasticity; the prematurity history points to periventricular leukomalacia.", "pearl": "Prematurity-associated periventricular injury preferentially affects descending leg motor pathways.", "note": "From Day 24 · Basic / easily confused"}, {"num": 104, "pos": 104, "section": 2, "topic": "Neurology", "question": "A toddler has early hand preference before age 12 months and asymmetric motor function. Which interpretation is best?", "options": ["Interpret the early hand preference as normal handedness and continue observation", "Possible unilateral cerebral palsy requiring assessment", "Residual brachial plexus birth injury as the default explanation", "Isolated orthopedic asymmetry without neurologic assessment"], "answer": 1, "explanation": "Very early fixed hand preference may signal hemiparesis. Why not the others (added — not from source): A. Interpret the early hand preference as normal handedness and continue observation — Stable handedness normally does not emerge until about 18 months to 3 years; a definite hand preference before 12 months is a red flag for weakness of the other hand.; C. Residual brachial plexus birth injury as the default explanation — Brachial plexus palsy is evident from birth with a characteristic limb posture and would not be the default without a birth history; asymmetric motor function first needs evaluation for central hemiparesis.; D. Isolated orthopedic asymmetry without neurologic assessment — Motor asymmetry with early hand preference suggests a central cause; skipping neurological examination risks missing unilateral cerebral palsy and delaying early intervention.", "pearl": "Very early fixed hand preference may signal hemiparesis.", "note": "From Day 24 · Clinical / application"}, {"num": 105, "pos": 105, "section": 2, "topic": "Neurology", "question": "A 4-year-old boy has calf pseudohypertrophy, Gowers sign and markedly elevated CK. Which diagnosis is most likely?", "options": ["Duchenne muscular dystrophy", "Spinal muscular atrophy type 1", "Charcot–Marie–Tooth neuropathy", "Congenital myasthenic syndrome"], "answer": 0, "explanation": "Proximal weakness, calf pseudohypertrophy and high CK suggest dystrophinopathy. Why not the others (added — not from source): B. Spinal muscular atrophy type 1 — SMA type 1 presents in early infancy with severe hypotonia, tongue fasciculations and areflexia; CK is normal or only mildly raised and there is no calf pseudohypertrophy.; C. Charcot–Marie–Tooth neuropathy — CMT is a distal neuropathy with foot deformity, distal wasting and reduced reflexes; CK is normal and Gowers sign from proximal weakness is not typical.; D. Congenital myasthenic syndrome — Congenital myasthenic syndromes cause fatigable ptosis and weakness with normal CK; they do not cause calf pseudohypertrophy.", "pearl": "Proximal weakness, calf pseudohypertrophy and high CK suggest dystrophinopathy.", "note": "From Day 25 · Clinical / application"}, {"num": 106, "pos": 106, "section": 2, "topic": "Neurology", "question": "An infant has tongue fasciculations, profound hypotonia, absent reflexes and preserved eye movements. Which condition should be suspected?", "options": ["Spinal muscular atrophy", "Spastic diplegic cerebral palsy", "Central hypotonia with hyperreflexia", "Duchenne muscular dystrophy at birth"], "answer": 0, "explanation": "Anterior horn cell disease causes lower motor neuron weakness with fasciculations and areflexia. Why not the others (added — not from source): B. Spastic diplegic cerebral palsy — Spastic diplegia is an upper motor neuron disorder with increased tone and brisk reflexes, the opposite of areflexia and fasciculations.; C. Central hypotonia with hyperreflexia — Central hypotonia keeps reflexes preserved or brisk and is often accompanied by poor alertness; areflexia with tongue fasciculations localises to the anterior horn cell.; D. Duchenne muscular dystrophy at birth — Duchenne is rarely symptomatic at birth and does not cause tongue fasciculations or areflexia in infancy; profound neonatal weakness with fasciculations is SMA.", "pearl": "Anterior horn cell disease causes lower motor neuron weakness with fasciculations and areflexia.", "note": "From Day 25 · Clinical / application"}, {"num": 107, "pos": 107, "section": 2, "topic": "Neurology", "question": "A child with fever and altered sensorium develops focal seizures; MRI shows temporal-lobe hyperintensity. What empiric therapy should not await PCR results?", "options": ["Wait for CSF HSV PCR before starting acyclovir in a clinically suspected case", "Use ceftriaxone and vancomycin without antiviral coverage", "Use high-dose corticosteroids as empiric monotherapy", "IV acyclovir for suspected HSV encephalitis"], "answer": 3, "explanation": "Temporal encephalitis requires prompt empiric acyclovir while diagnostic testing proceeds. Why not the others (added — not from source): A. Wait for CSF HSV PCR before starting acyclovir in a clinically suspected case — HSV encephalitis outcome depends on early treatment; acyclovir must start on clinical suspicion, as early CSF PCR can be falsely negative and waiting worsens morbidity and mortality.; B. Use ceftriaxone and vancomycin without antiviral coverage — Antibacterials alone leave HSV untreated; fever, focal seizures and temporal lobe signal require acyclovir, added to bacterial cover if meningitis is still possible.; C. Use high-dose corticosteroids as empiric monotherapy — Steroids are not empirical therapy for presumed viral encephalitis and, without antiviral cover, may worsen HSV replication; acyclovir is the essential treatment.", "pearl": "Temporal encephalitis requires prompt empiric acyclovir while diagnostic testing proceeds.", "note": "From Day 26 · Clinical / application"}, {"num": 108, "pos": 108, "section": 2, "topic": "Neurology", "question": "A child develops ataxia, multifocal deficits and encephalopathy after a viral illness; MRI shows widespread poorly demarcated white-matter lesions. Which diagnosis fits best?", "options": ["Idiopathic intracranial hypertension", "Acute disseminated encephalomyelitis", "Typical absence epilepsy", "Isolated spinal muscular atrophy"], "answer": 1, "explanation": "ADEM combines encephalopathy with multifocal demyelination, often postinfectious. Why not the others (added — not from source): A. Idiopathic intracranial hypertension — IIH causes headache and papilloedema with normal mental state and normal parenchymal imaging; it does not produce encephalopathy or multifocal white-matter lesions.; C. Typical absence epilepsy — Absence epilepsy causes brief staring spells with a normal neurological examination and normal MRI, not ataxia, multifocal deficits or demyelinating lesions.; D. Isolated spinal muscular atrophy — SMA is a lower motor neuron disease without encephalopathy or brain white-matter lesions on MRI.", "pearl": "ADEM combines encephalopathy with multifocal demyelination, often postinfectious.", "note": "From Day 26 · Clinical / application"}, {"num": 109, "pos": 109, "section": 2, "topic": "Neurology", "question": "A school-age child has multiple café-au-lait macules, axillary freckling and an optic pathway glioma. Which syndrome is most likely?", "options": ["Tuberous sclerosis complex", "Neurofibromatosis type 1", "Ataxia-telangiectasia", "Sturge–Weber syndrome"], "answer": 1, "explanation": "NF1 features pigmentary changes and optic pathway tumors; TSC has different skin/brain lesions. Why not the others (added — not from source): A. Tuberous sclerosis complex — TSC skin signs are ash-leaf macules, facial angiofibromas and shagreen patches; its CNS lesions are tubers and SEGAs, not optic pathway gliomas.; C. Ataxia-telangiectasia — Ataxia-telangiectasia presents with progressive ataxia, oculocutaneous telangiectasia and immunodeficiency, not axillary freckling or optic glioma.; D. Sturge–Weber syndrome — Sturge-Weber has a facial port-wine stain with leptomeningeal angioma, seizures and glaucoma; café-au-lait macules and optic glioma are not features.", "pearl": "NF1 features pigmentary changes and optic pathway tumors.", "note": "From Day 27 · Clinical / application"}, {"num": 110, "pos": 110, "section": 2, "topic": "Neurology", "question": "A child has headache, papilledema and a posterior fossa mass with obstructive hydrocephalus. Which action is most appropriate?", "options": ["Treat empirically for migraine and arrange outpatient review", "Perform lumbar puncture to document the opening pressure before imaging", "Start acetazolamide for presumed idiopathic intracranial hypertension without excluding the mass effect", "Urgent neuroimaging and neurosurgical evaluation; avoid routine LP"], "answer": 3, "explanation": "Mass effect and hydrocephalus create herniation risk with LP. Why not the others (added — not from source): A. Treat empirically for migraine and arrange outpatient review — Papilloedema and a posterior fossa mass are red flags for raised intracranial pressure; treating as migraine with delayed review risks herniation or death.; B. Perform lumbar puncture to document the opening pressure before imaging — With obstructive hydrocephalus and a posterior fossa mass, lumbar puncture can trigger tonsillar herniation; imaging and neurosurgery come first and LP is contraindicated.; C. Start acetazolamide for presumed idiopathic intracranial hypertension without excluding the mass effect — IIH is diagnosed only after imaging excludes a mass and hydrocephalus; here a structural cause is present and needs urgent neurosurgical management, not acetazolamide.", "pearl": "Mass effect and hydrocephalus create herniation risk with LP.", "note": "From Day 27 · Conceptual"}, {"num": 111, "pos": 111, "section": 2, "topic": "Nephrology", "question": "A 6-year-old's creatinine rises from 0.40 to 0.75 mg/dL within 48 hours after dehydration. Which classification is supported?", "options": ["KDIGO stage 1 AKI by absolute creatinine rise", "Chronic kidney disease by one measurement", "KDIGO stage 3 solely by absolute value", "No AKI because creatinine is below 1 mg/dL"], "answer": 0, "explanation": "A rise ≥0.3 mg/dL within 48 hours meets AKI criteria even if the absolute value appears modest. Why not the others (added — not from source): B. Chronic kidney disease by one measurement — CKD requires abnormality persisting for more than 3 months; an acute rise within 48 hours after dehydration is AKI.; C. KDIGO stage 3 solely by absolute value — Stage 3 needs creatinine three times baseline, ≥4 mg/dL or initiation of KRT (or eGFR <35 in under-18s); a rise from 0.40 to 0.75 is under twice baseline.; D. No AKI because creatinine is below 1 mg/dL — Paediatric creatinine is low at baseline, so KDIGO uses change from baseline; a rise of 0.35 mg/dL within 48 hours meets AKI criteria regardless of absolute value.", "pearl": "A rise ≥0.3 mg/dL within 48 hours meets AKI criteria even if the absolute value appears modest.", "note": "From Day 29 · Clinical / application"}, {"num": 112, "pos": 112, "section": 2, "topic": "Nephrology", "question": "An 18-kg child has urine output 90 mL over 12 hours. What is the average output?", "options": ["0.21 mL/kg/h", "0.63 mL/kg/h", "0.42 mL/kg/h", "0.83 mL/kg/h"], "answer": 2, "explanation": "Urine output = 90 ÷ (18 × 12) = 0.417 mL/kg/h, below the 0.5 mL/kg/h threshold. Why not the others (added — not from source): A. 0.21 mL/kg/h — This is half the correct figure, as if the volume were divided over 24 hours; 90 ÷ (18 × 12) = 0.42 mL/kg/h.; B. 0.63 mL/kg/h — This overstates output; 90 mL divided by 216 kg·h is 0.42 mL/kg/h, not 0.63.; D. 0.83 mL/kg/h — This is double the correct value, as if calculated over 6 hours; over 12 hours output is 0.42 mL/kg/h.", "pearl": "Urine output = 90 ÷ (18 × 12) = 0.417 mL/kg/h, below the 0.5 mL/kg/h threshold.", "note": "From Day 29 · Clinical / application"}, {"num": 113, "pos": 113, "section": 2, "topic": "Nephrology", "question": "A child with gastroenteritis has tachycardia, delayed capillary refill, high urea/creatinine ratio and concentrated urine. Which mechanism is most likely initially?", "options": ["Primary Fanconi syndrome", "Prerenal hypoperfusion", "Acute glomerulonephritis with RBC casts", "Bilateral ureteric obstruction"], "answer": 1, "explanation": "Volume depletion causes prerenal AKI; persistent injury may progress to intrinsic damage. Why not the others (added — not from source): A. Primary Fanconi syndrome — Fanconi syndrome is a chronic proximal tubulopathy with glucosuria, phosphaturia and polyuria, not an acute prerenal picture with concentrated urine.; C. Acute glomerulonephritis with RBC casts — Glomerulonephritis presents with haematuria, oedema and hypertension; this child is volume-depleted with tachycardia and concentrated urine, indicating hypoperfusion.; D. Bilateral ureteric obstruction — Bilateral ureteric obstruction is rare and causes post-renal AKI with hydronephrosis; gastroenteritis with clinical dehydration and a high urea/creatinine ratio point to prerenal AKI.", "pearl": "Volume depletion causes prerenal AKI.", "note": "From Day 29 · Basic / easily confused"}, {"num": 114, "pos": 114, "section": 2, "topic": "Nephrology", "question": "A 3-year-old with AKI has potassium 7.1 mmol/L and a widening QRS. What is the first immediate intervention?", "options": ["IV insulin with dextrose before stabilizing the myocardium", "IV calcium for cardiac membrane stabilization while arranging potassium-lowering measures", "Nebulized beta-agonist as the first intervention despite ECG toxicity", "Urgent dialysis before giving any membrane-stabilizing treatment"], "answer": 1, "explanation": "ECG changes from hyperkalemia require immediate calcium; calcium does not itself remove potassium. Why not the others (added — not from source): A. IV insulin with dextrose before stabilizing the myocardium — Insulin with dextrose shifts potassium into cells but takes 15–30 minutes; with QRS widening the myocardium must be stabilised with IV calcium first.; C. Nebulized beta-agonist as the first intervention despite ECG toxicity — Salbutamol lowers potassium by intracellular shift but does not protect the myocardium; ECG toxicity needs immediate IV calcium first.; D. Urgent dialysis before giving any membrane-stabilizing treatment — Dialysis takes time to arrange; QRS widening risks imminent arrhythmia, so calcium is given at once while shifting and removal measures, including KRT, are organised.", "pearl": "ECG changes from hyperkalemia require immediate calcium.", "note": "From Day 29 · Clinical / application"}, {"num": 115, "pos": 115, "section": 2, "topic": "Nephrology", "question": "A child with AKI develops pulmonary edema, refractory hyperkalemia and worsening encephalopathy. Which management option is most appropriate?", "options": ["Urgent kidney replacement therapy assessment", "Escalate loop diuretics alone despite refractory hyperkalemia and encephalopathy", "Use bicarbonate alone as definitive management of the hyperkalemia", "Continue conservative therapy until creatinine reaches a predetermined threshold"], "answer": 0, "explanation": "Life-threatening fluid, electrolyte and uremic complications drive dialysis decisions rather than creatinine alone. Why not the others (added — not from source): B. Escalate loop diuretics alone despite refractory hyperkalemia and encephalopathy — Diuretics may help fluid overload in responsive patients, but refractory hyperkalaemia and uraemic encephalopathy are indications for KRT that diuretics cannot address.; C. Use bicarbonate alone as definitive management of the hyperkalemia — Bicarbonate is at most an adjunct for hyperkalaemia, mainly with acidosis, and adds sodium and fluid in a child with pulmonary oedema; it is not definitive.; D. Continue conservative therapy until creatinine reaches a predetermined threshold — KRT decisions are driven by life-threatening complications such as fluid overload, refractory hyperkalaemia and encephalopathy, not by waiting for a creatinine cut-off.", "pearl": "Life-threatening fluid, electrolyte and uremic complications drive dialysis decisions rather than creatinine alone.", "note": "From Day 29 · High difficulty"}, {"num": 116, "pos": 116, "section": 2, "topic": "Nephrology", "question": "A 4-year-old has edema, albumin 1.7 g/dL and urine protein/creatinine 5 mg/mg without hematuria or hypertension. What is the most likely syndrome?", "options": ["Hemolytic uremic syndrome", "Acute nephritic syndrome", "Idiopathic nephrotic syndrome", "Isolated orthostatic proteinuria"], "answer": 2, "explanation": "Heavy proteinuria, hypoalbuminemia and edema define nephrotic syndrome. Why not the others (added — not from source): A. Hemolytic uremic syndrome — HUS presents with microangiopathic anaemia, thrombocytopenia and AKI, usually after diarrhoea, not isolated heavy proteinuria with hypoalbuminaemia.; B. Acute nephritic syndrome — Nephritic syndrome features haematuria, hypertension and reduced GFR; this child has none of these, and the proteinuria is in the nephrotic range.; D. Isolated orthostatic proteinuria — Orthostatic proteinuria is low-grade, absent in early-morning urine and never causes hypoalbuminaemia or oedema.", "pearl": "Heavy proteinuria, hypoalbuminemia and edema define nephrotic syndrome.", "note": "From Day 30 · Conceptual"}, {"num": 117, "pos": 117, "section": 2, "topic": "Nephrology", "question": "A 3-year-old with typical first-episode nephrotic syndrome has normal renal function and no atypical features. Which initial approach aligns with IPNA guidance?", "options": ["Perform kidney biopsy before the first glucocorticoid course", "Obtain genetic testing before initial treatment in an otherwise typical child older than 1 year", "Start standard glucocorticoid treatment without routine initial biopsy", "Start a calcineurin inhibitor as first-line induction therapy"], "answer": 2, "explanation": "Typical onset after age one generally does not need initial biopsy or genetics; response guides subsequent evaluation. Why not the others (added — not from source): A. Perform kidney biopsy before the first glucocorticoid course — IPNA reserves initial biopsy for atypical features (age under 1 year, persistent haematuria, hypertension, low C3, raised creatinine); typical childhood nephrotic syndrome is treated with steroids first.; B. Obtain genetic testing before initial treatment in an otherwise typical child older than 1 year — Genetic testing is indicated for steroid resistance, congenital or infantile onset, or syndromic features, not for a typical 3-year-old before the first steroid course.; D. Start a calcineurin inhibitor as first-line induction therapy — Calcineurin inhibitors are second-line agents for frequently relapsing, steroid-dependent or steroid-resistant disease; first-episode treatment is oral glucocorticoids.", "pearl": "Typical onset after age one generally does not need initial biopsy or genetics.", "note": "From Day 30 · Integrated / rank-differentiating"}, {"num": 118, "pos": 118, "section": 2, "topic": "Nephrology", "question": "A child with nephrotic syndrome fails to achieve complete remission after the standard 4-week daily prednisolone phase. What is the most appropriate next principle?", "options": ["Stop proteinuria monitoring", "Treat as uncomplicated infrequent relapse", "Declare steroid sensitivity because edema decreased", "Evaluate possible steroid resistance and arrange specialist work-up"], "answer": 3, "explanation": "Failure of remission after initial steroid course triggers SRNS assessment, with protocol nuances. Why not the others (added — not from source): A. Stop proteinuria monitoring — Proteinuria monitoring defines remission and steroid response; stopping it would make it impossible to classify the disease or detect resistance.; B. Treat as uncomplicated infrequent relapse — Relapse can only follow a complete remission; failure to reach remission after 4 weeks of daily prednisolone suggests steroid resistance, not relapse.; C. Declare steroid sensitivity because edema decreased — Steroid sensitivity is defined by complete remission of proteinuria (UPCR ≤0.2 g/g or negative dipstick for 3 days), not by reduced oedema.", "pearl": "Failure of remission after initial steroid course triggers SRNS assessment, with protocol nuances.", "note": "From Day 30 · Basic / easily confused"}, {"num": 119, "pos": 119, "section": 2, "topic": "Nephrology", "question": "A 9-year-old develops cola-colored urine, edema, hypertension and low C3 two weeks after impetigo. Which diagnosis is most likely?", "options": ["Poststreptococcal glomerulonephritis", "Alport syndrome alone", "Minimal-change nephrotic syndrome", "IgA nephropathy with synpharyngitic hematuria"], "answer": 0, "explanation": "Latent period after streptococcal infection and transient low C3 support PSGN. Why not the others (added — not from source): B. Alport syndrome alone — Alport syndrome causes persistent haematuria with family history, sensorineural deafness or eye changes and normal complement, not an acute post-infectious nephritis with low C3.; C. Minimal-change nephrotic syndrome — Minimal change disease causes nephrotic syndrome without gross haematuria, hypertension or low complement.; D. IgA nephropathy with synpharyngitic hematuria — IgA nephropathy causes haematuria within 1–2 days of infection with normal C3; a 2-week latent period after impetigo with low C3 indicates PSGN.", "pearl": "Latent period after streptococcal infection and transient low C3 support PSGN.", "note": "From Day 30 · Integrated / rank-differentiating"}, {"num": 120, "pos": 120, "section": 2, "topic": "Nephrology", "question": "A child has gross hematuria during a viral URI, normal complement and recurrent episodes. Which diagnosis is favored?", "options": ["IgA nephropathy", "Membranous nephropathy", "Congenital nephrotic syndrome", "Poststreptococcal GN with delayed onset"], "answer": 0, "explanation": "Synpharyngitic hematuria with normal C3 favors IgA nephropathy. Why not the others (added — not from source): B. Membranous nephropathy — Membranous nephropathy is uncommon in children and presents with nephrotic-range proteinuria, not recurrent synpharyngitic gross haematuria.; C. Congenital nephrotic syndrome — Congenital nephrotic syndrome presents within the first 3 months with massive proteinuria and oedema, not recurrent haematuria with URIs.; D. Poststreptococcal GN with delay
