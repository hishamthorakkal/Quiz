ed–Sternberg cells on biopsy is classical Hodgkin lymphoma (nodular sclerosis is commonest in adolescents).", "explanationSource": "added", "pearl": ""}, {"num": 116, "section": 2, "topic": "Haematology & Oncology", "question": "Tumour lysis syndrome occurs most commonly with which chemotherapy-sensitive tumour?", "options": ["Neuroblastoma", "Burkitt lymphoma", "ALL", "Either B or C"], "answer": 3, "explanation": "Tumour lysis syndrome is most common with highly proliferative, chemosensitive tumours, especially Burkitt lymphoma and ALL with high WBC (T-cell ALL, hyperleucocytosis). Give hyperhydration and allopurinol/rasburicase prophylaxis.", "explanationSource": "added", "pearl": ""}, {"num": 117, "section": 2, "topic": "Haematology & Oncology", "question": "A 2-year-old has a right-sided abdominal mass that does not cross the midline, hypertension, and haematuria. CT confirms a well-encapsulated intrarenal mass. The MOST likely diagnosis is:", "options": ["Neuroblastoma", "Wilms tumour (nephroblastoma)", "Hepatoblastoma", "Rhabdomyosarcoma"], "answer": 1, "explanation": "A well-encapsulated intrarenal flank mass that does not cross the midline, with hypertension and haematuria, in a 2–5-year-old is Wilms tumour. Neuroblastoma is suprarenal, calcified and often crosses the midline.", "explanationSource": "added", "pearl": ""}, {"num": 118, "section": 2, "topic": "Haematology & Oncology", "question": "A 6-week-old neonate has a white pupillary reflex (leukocoria) on examination. Which is the MOST urgent investigation to perform?", "options": ["Refractive error assessment", "CT scan of the orbit", "Dilated fundus examination under anaesthesia", "B-scan ultrasound of the eye"], "answer": 2, "explanation": "Leukocoria in an infant is retinoblastoma until proven otherwise. Urgent dilated fundus examination (under anaesthesia), with ultrasound/MRI, is required. CT is avoided because of radiation, especially in RB1 carriers.", "explanationSource": "added", "pearl": ""}, {"num": 119, "section": 2, "topic": "Endocrinology", "question": "A 10-year-old with type 1 DM presents with vomiting, abdominal pain, Kussmaul breathing, and blood glucose of 480 mg/dL. Venous pH 7.10, bicarbonate 8 mEq/L. What is the CORRECT initial fluid bolus?", "options": ["20 mL/kg normal saline over 1 hour", "10 mL/kg normal saline over 30–60 minutes for shock only; otherwise start deficit replacement", "5% dextrose + 0.45 NaCl at 1.5× maintenance", "Ringer's lactate 20 mL/kg over 20 minutes"], "answer": 1, "explanation": "Per ISPAD 2022 and BSPED 2020 DKA guidelines: Do NOT give routine fluid boluses in DKA unless there is haemodynamic compromise (shock). Boluses increase cerebral oedema risk. Start deficit replacement IV fluids + insulin at 0.1 U/kg/hr after 1 hour of fluid alone.", "explanationSource": "source", "pearl": "Exam Pearl: DKA fluid bolus ONLY for shock. Routine boluses are no longer recommended (ISPAD 2022)."}, {"num": 120, "section": 2, "topic": "Endocrinology", "question": "During DKA management in a child, the blood glucose drops from 400 to 240 mg/dL after 4 hours of insulin infusion. The child is still acidotic (pH 7.18). What change is MOST appropriate?", "options": ["Stop insulin infusion", "Add dextrose to the IV fluid to prevent hypoglycaemia while continuing insulin", "Increase insulin dose", "Switch to subcutaneous insulin"], "answer": 1, "explanation": "In DKA, once glucose falls to about 250–300 mg/dL (14–17 mmol/L) while acidosis persists, add dextrose to the IV fluids and continue insulin at 0.05–0.1 U/kg/h. Insulin is needed to clear ketones; stopping it would worsen ketoacidosis.", "explanationSource": "added", "pearl": ""}, {"num": 121, "section": 2, "topic": "Endocrinology", "question": "A 14-year-old presents with DKA. After 6 hours of treatment he becomes confused and develops bradycardia and a fixed dilated left pupil. What is the MOST likely complication?", "options": ["Hypoglycaemia", "Hypokalaemia", "Cerebral oedema", "Thrombosis"], "answer": 2, "explanation": "Cerebral oedema is the most feared complication of DKA in children (0.3–1%). Risk factors: age <5, high BUN, low PCO2, bicarbonate therapy, rapid fluid infusion. Symptoms: headache, behavioural change, declining GCS, bradycardia, fixed dilated pupil (herniation). Treatment: Mannitol 0.5–1 g/kg IV over 20 min OR 3% NaCl 2.5–5 mL/kg, restrict fluids.", "explanationSource": "source", "pearl": ""}, {"num": 122, "section": 2, "topic": "Endocrinology", "question": "A 5-year-old girl has breast budding (Tanner stage 2), pubic hair, and a bone age of 8 years. GnRH stimulation test shows LH peak >5 IU/L. What is the diagnosis and treatment?", "options": ["Premature thelarche — observation only", "Central precocious puberty — GnRH agonist (leuprolide)", "McCune-Albright syndrome — aromatase inhibitor", "Congenital adrenal hyperplasia — hydrocortisone"], "answer": 1, "explanation": "Thelarche with pubic hair before 8 years, advanced bone age and a pubertal LH response (peak >5 IU/L) to GnRH stimulation is central precocious puberty. GnRH agonists (leuprolide/triptorelin) are the treatment.", "explanationSource": "added", "pearl": ""}, {"num": 123, "section": 2, "topic": "Endocrinology", "question": "A neonate is detected to have TSH of 120 mIU/L (normal <10) on newborn screening. Free T4 is very low. What is the TREATMENT and target TSH at 1 month?", "options": ["Levothyroxine 10–15 µg/kg/day; target TSH 0.5–2 mIU/L", "Levothyroxine 5–8 µg/kg/day; target TSH 1–4 mIU/L", "Levothyroxine 10–15 µg/kg/day; target TSH 0.5–2 mIU/L within 2 weeks", "Observation and repeat TSH at 4 weeks"], "answer": 2, "explanation": "Severe congenital hypothyroidism (very high TSH, low free T4) needs prompt levothyroxine 10–15 µg/kg/day, aiming to normalise free T4 within 2 weeks and TSH within about 4 weeks, keeping TSH 0.5–2 mU/L. Note: two options are nearly identical; the keyed one specifies the time target.", "explanationSource": "added", "pearl": ""}, {"num": 124, "section": 2, "topic": "Endocrinology", "question": "A 12-year-old boy has short stature. IGF-1 is low. GH stimulation test (clonidine) shows peak GH of 3 ng/mL (cut-off >10). MRI shows no pituitary tumour. What is the MOST appropriate treatment?", "options": ["Oral growth hormone", "SC recombinant human growth hormone (rhGH) 0.025–0.05 mg/kg/day", "IGF-1 (mecasermin) injections", "Testosterone"], "answer": 1, "explanation": "Confirmed GH deficiency (low IGF-1, subnormal peaks on stimulation tests, normal MRI) is treated with daily subcutaneous recombinant GH, about 0.025–0.05 mg/kg/day. Oral GH is inactive; mecasermin is for primary IGF-1 deficiency.", "explanationSource": "added", "pearl": ""}, {"num": 125, "section": 2, "topic": "Endocrinology", "question": "A 5-day-old neonate has salt-wasting crisis: vomiting, poor feeding, Na 118, K 7.2, glucose 30 mg/dL. Cortisol is low, 17-OHP is very high. Karyotype 46XX with ambiguous genitalia. What is the treatment?", "options": ["IV 0.9% NaCl + hydrocortisone IV + fludrocortisone oral", "Dexamethasone", "IV NaCl alone", "Testosterone"], "answer": 0, "explanation": "Salt-wasting 21-hydroxylase CAH crisis (hyponatraemia, hyperkalaemia, hypoglycaemia, high 17-OHP, virilised 46,XX) needs IV 0.9% saline, dextrose, stress-dose IV hydrocortisone, and then fludrocortisone for mineralocorticoid replacement.", "explanationSource": "added", "pearl": ""}, {"num": 126, "section": 2, "topic": "Endocrinology", "question": "Adrenal crisis: Which steroid is given IM/IV in an emergency when the child cannot take oral medication?", "options": ["Dexamethasone 0.15 mg/kg", "Hydrocortisone succinate 50–100 mg/m² IV bolus", "Prednisolone 2 mg/kg oral", "Fludrocortisone"], "answer": 1, "explanation": "Adrenal crisis: give IV/IM hydrocortisone sodium succinate 50–100 mg/m² (about 2 mg/kg) immediately, then 50–100 mg/m²/day divided, with fluids and dextrose. Hydrocortisone at high dose also has mineralocorticoid activity.", "explanationSource": "added", "pearl": ""}, {"num": 127, "section": 2, "topic": "Endocrinology", "question": "A 10-year-old girl has features of Cushing syndrome. The MOST common cause in children >7 years is:", "options": ["Adrenal adenoma", "Adrenal carcinoma", "ACTH-secreting pituitary adenoma (Cushing disease)", "Exogenous steroid use"], "answer": 2, "explanation": "Keyed answer: Cushing disease. Among endogenous causes, ACTH-secreting pituitary adenoma predominates after about 7 years, while adrenal tumours are commoner in infants and young children. Note: exogenous glucocorticoids are the commonest cause of Cushing syndrome overall.", "explanationSource": "added", "pearl": ""}, {"num": 128, "section": 2, "topic": "Endocrinology", "question": "A boy has delayed puberty at age 15 — no testicular enlargement, no pubic hair, bone age of 12.5. LH and FSH are very low. Smell is impaired. What is the MOST likely diagnosis?", "options": ["Klinefelter syndrome", "Constitutional delay of puberty", "Kallmann syndrome", "Hypogonadotrophic hypogonadism — functional"], "answer": 2, "explanation": "Delayed puberty with low LH/FSH (hypogonadotropic hypogonadism) and anosmia/hyposmia is Kallmann syndrome (defective GnRH neuron migration, e.g., ANOS1). Klinefelter has high gonadotropins.", "explanationSource": "added", "pearl": ""}, {"num": 129, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 6-month-old has recurrent severe bacterial infections (pneumonia, meningitis). He has no palpable lymph nodes, absent tonsils, very low IgG (<1 g/L), IgA and IgM undetectable, and normal CD3+ T cells but absent CD19+ B cells. What is the MOST likely diagnosis?", "options": ["SCID", "X-linked agammaglobulinaemia (Bruton)", "Common variable immunodeficiency", "DiGeorge syndrome"], "answer": 1, "explanation": "Recurrent bacterial infections after 6 months (when maternal IgG wanes), absent tonsils and nodes, panhypogammaglobulinaemia and absent CD19+ B cells with normal T cells is X-linked agammaglobulinaemia (BTK). Treatment is lifelong immunoglobulin.", "explanationSource": "added", "pearl": ""}, {"num": 130, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 5-year-old girl has swinging fever >2 weeks, arthritis of 5 joints, salmon-pink rash coinciding with fever spikes, and ferritin 12,000 µg/L. ANA and RF are negative. What is the diagnosis?", "options": ["SLE", "Systemic JIA (Still's disease)", "Acute rheumatic fever", "Kawasaki disease"], "answer": 1, "explanation": "Quotidian spiking fever ≥2 weeks with evanescent salmon-pink rash, arthritis, very high ferritin and negative ANA/RF is systemic JIA (Still's disease). Watch for macrophage activation syndrome.", "explanationSource": "added", "pearl": ""}, {"num": 131, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 12-year-old girl has a butterfly rash, oral ulcers, arthritis, pleuritis, and renal involvement. ANA 1:640, anti-dsDNA elevated, C3 and C4 low. Which renal biopsy finding is MOST common in childhood SLE nephritis?", "options": ["Membranous nephropathy (Class V)", "Diffuse proliferative GN (Class IV)", "Focal proliferative GN (Class III)", "Minimal mesangial (Class I)"], "answer": 1, "explanation": "Diffuse proliferative lupus nephritis (ISN/RPS class IV) is the most common and most serious biopsy finding in childhood SLE. It needs induction immunosuppression (steroids plus MMF or cyclophosphamide).", "explanationSource": "added", "pearl": ""}, {"num": 132, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 4-year-old has fever >5 days, conjunctival injection, strawberry tongue, cracked lips, rash, and cervical lymphadenopathy. Echo shows coronary artery Z-score of 2.8 (normal <2.5). What is the TREATMENT?", "options": ["IVIG 2 g/kg + aspirin (high dose)", "Aspirin alone", "Steroids alone", "IVIG + infliximab"], "answer": 0, "explanation": "Kawasaki disease treatment: IVIG 2 g/kg single infusion + high-dose aspirin 30–50 mg/kg/day (anti-inflammatory dose) during acute phase. Z-score 2.8 = coronary artery dilatation (abnormal >2.5). After fever resolves, switch to low-dose aspirin 3–5 mg/kg/day.", "explanationSource": "source", "pearl": ""}, {"num": 133, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A child with dengue develops rapid deterioration: SpO2 drops, BP falls, pulse narrows, and HCT rises from 35 to 47%. What stage has the child entered and what is the management?", "options": ["Dengue with warning signs — oral hydration", "Severe dengue (dengue shock syndrome) — IV crystalloid 10–20 mL/kg over 1 hour", "Dengue fever — observation", "Severe dengue — IV colloid immediately"], "answer": 1, "explanation": "Hypotension, narrow pulse pressure, worsening oxygenation and rising haematocrit indicate plasma leakage with shock — severe dengue (dengue shock syndrome). Give IV isotonic crystalloid 10–20 mL/kg over 15–60 minutes and reassess; colloids are for refractory shock.", "explanationSource": "added", "pearl": ""}, {"num": 134, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "An 8-year-old presents with fever for 10 days, diarrhoea in week 1, relative bradycardia, splenomegaly, and rose spots on abdomen. Blood culture is likely to show:", "options": ["Salmonella typhi", "E. coli", "Shigella dysenteriae", "Brucella species"], "answer": 0, "explanation": "Prolonged fever with relative bradycardia, splenomegaly and rose spots is enteric fever. Blood culture, most sensitive in the first week, grows Salmonella Typhi.", "explanationSource": "added", "pearl": ""}, {"num": 135, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 3-month-old HIV-exposed infant is confirmed HIV positive by HIV DNA PCR. CD4 count is 20%. What is the treatment approach?", "options": ["Start ART only when CD4 falls below 15%", "Start prophylactic cotrimoxazole and initiate ART regardless of CD4 count", "Start ART only if symptomatic", "Start IVIG for prophylaxis"], "answer": 1, "explanation": "WHO/NACO: all HIV-infected children start ART as soon as possible regardless of CD4 count or clinical stage, with cotrimoxazole prophylaxis in infants.", "explanationSource": "added", "pearl": ""}, {"num": 136, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 15-year-old has been exposed to rabies (category III bite — deep wound on face). He has never been vaccinated. What is the management?", "options": ["Wound wash + 4-dose rabies vaccine (days 0, 3, 7, 14)", "Wound wash + rabies immunoglobulin (RIG) at wound site + 4-dose vaccine", "RIG alone", "5-dose vaccine only"], "answer": 1, "explanation": "A category III exposure (transdermal bite, mucosal contamination or bites on head/face) in an unvaccinated person needs thorough wound washing, rabies immunoglobulin infiltrated into and around the wound, and a full post-exposure vaccine course.", "explanationSource": "added", "pearl": ""}, {"num": 137, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A neonate is born to an HBsAg-positive mother. What is the CORRECT prophylaxis?", "options": ["HBV vaccine only within 12 hours", "HBV vaccine + HBIG within 12 hours of birth", "HBIG alone", "HBV vaccine within 24 hours"], "answer": 1, "explanation": "Infants of HBsAg-positive mothers should receive the hepatitis B vaccine birth dose plus HBIG (0.5 mL IM, different site) within 12 hours of birth, then complete the vaccine series and test after completion.", "explanationSource": "added", "pearl": ""}, {"num": 138, "section": 2, "topic": "Immunology, Rheumatology & ID", "question": "A 7-year-old with HIV on ART (CD4 350 cells/µL) is to receive MMR vaccine. What is the APPROPRIATE decision?", "options": ["Contraindicated — live vaccine not allowed", "May be given if CD4 >200 cells/µL and not severely immunocompromised", "May be given only if CD4 >500 cells/µL", "Must wait until CD4 >1000 cells/µL"], "answer": 1, "explanation": "MM  return `<div class="rv ${s}"><div class="small">${esc(q.topic)} · ${esc(EXAM.sections[q.section].name)}${S.marked[q.num]?' · marked for review':''}</div>
 <b>Q${q.num}. ${esc(q.question)}</b><br><span class="st ${s}">${s==='correct'?'✓ Correct (+4)':s==='wrong'?'✗ Wrong (−1)':'— Unattempted (0)'}</span><br>
 <b>Your response:</b> ${a==null?'Not answered':`${L(a)}. ${esc(q.options[a])}`}<br><b>Correct response:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}
 ${q.note?`<div class="note"><b>Note:</b> ${esc(q.note)}</div>`:''}
 <div class="explain"><b>Explanation${q.explanationSource==='added'?' <small>(added — not from source)</small>':''}:</b> ${esc(q.explanation)}</div>
 ${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}</div>`;
}
function reportBody(){
 const o=score(Q),wrong=Q.filter(q=>st(q)==='wrong'),un=Q.filter(q=>st(q)==='un');
 let h=`<h1>${esc(EXAM.title)} — Wrong Answer Report</h1><p><b>Overall score:</b> ${o.s} / ${o.max} (${pct(o)}%) · Correct ${o.c} · Wrong ${o.w} · Unattempted ${o.u} · Time ${dur(S.finishedAt-S.startedAt)}</p><p>`+
  EXAM.sections.map((s,i)=>{const x=score(secQs(i));return `<b>${esc(s.name)}:</b> ${x.s} / ${x.max} (C ${x.c}, W ${x.w}, U ${x.u})`}).join('<br>')+'</p><h2>Wrong answers</h2>';
 if(!wrong.length)h+='<p>No wrong answers.</p>';
 wrong.forEach((q,i)=>{h+=`<hr><h3>${i+1}. Q${q.num}. ${esc(q.question)}</h3><p><b>Your answer:</b> ${L(S.answers[q.num])}. ${esc(q.options[S.answers[q.num]])}</p><p><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>${q.note?`<p><b>Note:</b> ${esc(q.note)}</p>`:''}<p><b>Explanation${q.explanationSource==='added'?' (added — not from source)':''}:</b> ${esc(q.explanation)}</p>${q.pearl?`<p><b>Exam pearl:</b> ${esc(q.pearl)}</p>`:''}`});
 if(un.length){h+='<h2>Unattempted questions</h2>';un.forEach(q=>{h+=`<p><b>Q${q.num}.</b> ${esc(q.question)}<br><b>Correct answer:</b> ${L(q.answer)}. ${esc(q.options[q.answer])}</p>`})}
 return h;
}
function baseName(){return `${EXAM.id}_${stamp()}_Wrong_Answers`}
function downloadWord(){const b=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=baseName()+'.doc';a.click();URL.revokeObjectURL(u)}
function printPDF(){const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${baseName()}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}
window.addEventListener('storage',e=>{if(e.key===KEY)start()});
start();
</script></body></html>
