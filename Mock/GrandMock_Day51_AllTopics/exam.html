<script>
const EXAM={"id": "GrandMock_Day51_AllTopics", "title": "Grand Mock Day 51 — All Topics", "source": "source/GrandMock_Day51_AllTopics.md", "sectionMinutes": 50, "sections": [{"name": "Section A"}, {"name": "Section B"}, {"name": "Section C"}], "marking": {"correct": 4, "wrong": -1, "unattempted": 0}, "pattern": "NEET-SS official pattern — NBEMS NEET-SS 2025 Information Bulletin §4.3, 4.4.6, 4.4.8 (verified 2026-10-04)"};
const Q=[{"num": 1, "section": 0, "topic": "Neonatology", "question": "A term neonate is born with no cry. Heart rate at birth is 40/min. Despite effective PPV for 30 seconds, HR remains 52/min. What is the NEXT most appropriate step?", "options": ["Increase FiO2 to 100%", "Begin chest compressions", "Administer IV epinephrine immediately", "Intubate, then reassess HR"], "answer": 1, "explanation": "After 30 seconds of effective PPV, if HR <60/min, initiate chest compressions at 3:1 ratio (90 compressions:30 breaths per minute). Per NRP 2020, intubation should accompany compressions but is not the \"next step\" if PPV is already working — the threshold for compressions is HR <60 after effective PPV for 30 seconds. Epinephrine (C) is only given if HR remains <60 after adequate compressions + ventilation.", "explanationSource": "source", "pearl": "Exam Pearl: HR <60 after 30 sec effective PPV → Compressions. HR <60 after compressions + ventilation → Epinephrine."}, {"num": 2, "section": 0, "topic": "Neonatology", "question": "During neonatal resuscitation with PPV, the mnemonic MR SOPA is used when there is no chest rise. Which of the following is the FIRST step?", "options": ["Suction mouth and nose", "Open the airway (reposition)", "Increase pressure", "Mask adjustment"], "answer": 3, "explanation": "MR SOPA mnemonic for failed PPV: **M**ask adjustment → **R**eposition airway → **S**uction → **O**pen mouth → **P**ressure increase → **A**irway alternative. Mask adjustment is ALWAYS first.", "explanationSource": "source", "pearl": "Trap: Many choose \"reposition\" first, but mask leak is far more common than airway malposition."}, {"num": 3, "section": 0, "topic": "Neonatology", "question": "A 28-week preterm infant has SpO2 of 88% on CPAP 6 cmH2O, FiO2 0.35 at 20 minutes of life. CXR shows bilateral ground-glass opacification with air bronchograms. What is the MOST appropriate next step?", "options": ["Increase CPAP to 10 cmH2O", "Switch to HFNC at 4 L/min", "Intubate and administer surfactant", "Administer IV caffeine"], "answer": 2, "explanation": "A 28-week infant on CPAP 6 with FiO2 0.35 at 20 minutes with RDS on CXR requires rescue surfactant (INSURE or LISA technique). The SpO2 of 88% is below target (91–95% for <35 weeks). Increasing CPAP alone (A) without surfactant is insufficient for moderate-severe RDS at this gestation.", "explanationSource": "source", "pearl": "Exam Pearl: Surfactant criteria — FiO2 >0.30 on CPAP ≥6 in <30 weeks with RDS = intubate + surfactant."}, {"num": 4, "section": 0, "topic": "Neonatology", "question": "A term neonate develops respiratory distress at 4 hours of life. CXR shows fluid in the horizontal fissure, perihilar streaking, and hyperinflation. He is comfortable on 0.3 FiO2. What is the MOST likely diagnosis?", "options": ["Respiratory Distress Syndrome", "Transient Tachypnea of the Newborn", "Meconium Aspiration Syndrome", "Congenital Pneumonia"], "answer": 1, "explanation": "Onset within hours in a term baby, fluid in the horizontal fissure, perihilar streaking and hyperinflation with only a modest oxygen need is classic transient tachypnoea of the newborn (delayed lung-fluid clearance). RDS gives low-volume ground-glass lungs; MAS gives patchy infiltrates after meconium exposure.", "explanationSource": "added", "pearl": ""}, {"num": 5, "section": 0, "topic": "Neonatology", "question": "An infant born at 30 weeks is on CPAP 6 cmH2O, FiO2 0.28, and SpO2 96%. At 6 hours of life, FiO2 requirement drops to 0.21. Which of the following is the MOST likely reason?", "options": ["Resolution of RDS after surfactant", "Development of a right-to-left shunt through PDA", "Normal course of TTN", "Spontaneous improvement of mild RDS"], "answer": 3, "explanation": "A 30-week infant who weans from FiO2 0.28 to air on CPAP within hours, without surfactant, most likely has mild RDS improving spontaneously. No surfactant was given, PDA right-to-left shunting would worsen oxygenation, and TTN is a term/late-preterm condition.", "explanationSource": "added", "pearl": ""}, {"num": 6, "section": 0, "topic": "Neonatology", "question": "A ventilated 26-week preterm infant on SIMV develops sudden deterioration: SpO2 drops to 75%, BP drops, and breath sounds are absent on the right. CXR shows a hyperlucent right hemithorax with mediastinal shift to the left. What is the IMMEDIATE management?", "options": ["Increase PEEP", "Emergency needle decompression", "Urgent chest tube insertion", "Increase ventilator rate"], "answer": 1, "explanation": "Sudden haemodynamic collapse + absent breath sounds + contralateral mediastinal shift = tension pneumothorax. IMMEDIATE management = needle decompression (2nd ICS, MCL, affected side) before waiting for CXR or chest tube. Chest tube (C) is definitive but takes longer.", "explanationSource": "source", "pearl": "Trap: Do not wait for CXR in tension pneumothorax — it is a clinical diagnosis."}, {"num": 7, "section": 0, "topic": "Neonatology", "question": "A preterm infant on MV has the following ABG: pH 7.20, PaCO2 65 mmHg, PaO2 70 mmHg, HCO3 25 mEq/L. Current settings: Rate 40, PIP 22, PEEP 5, FiO2 0.35. What change is MOST appropriate?", "options": ["Increase PEEP to 7", "Increase PIP to 26", "Increase Rate to 55", "Increase FiO2 to 0.50"], "answer": 2, "explanation": "pH 7.20 with PaCO2 65 and normal HCO3− is acute respiratory acidosis — a ventilation problem. Increase minute ventilation (rate, or tidal volume/PIP). PEEP and FiO2 mainly target oxygenation, and PaO2 70 is already adequate.", "explanationSource": "added", "pearl": ""}, {"num": 8, "section": 0, "topic": "Neonatology", "question": "A 32-week preterm on CPAP receives caffeine citrate. The loading dose is 20 mg/kg IV. What is the correct maintenance dose and frequency?", "options": ["5 mg/kg once daily", "10 mg/kg twice daily", "2.5 mg/kg once daily", "5 mg/kg twice daily"], "answer": 0, "explanation": "Caffeine citrate: loading 20 mg/kg, then maintenance 5–10 mg/kg once daily, started 24 hours after the load. Its long half-life in preterm infants makes once-daily dosing appropriate.", "explanationSource": "added", "pearl": ""}, {"num": 9, "section": 0, "topic": "Neonatology", "question": "A 27-week preterm develops worsening respiratory failure at 72 hours. CXR shows hyperinflation, cystic changes, and streaky infiltrates. Which complication is MOST likely developing?", "options": ["Pulmonary interstitial emphysema", "Bronchopulmonary dysplasia", "Nosocomial pneumonia", "Pulmonary hemorrhage"], "answer": 1, "explanation": "Hyperinflation with cystic changes and streaky infiltrates in a ventilated extremely preterm infant is the radiological picture of evolving BPD (keyed answer). Note: at only 72 hours, pulmonary interstitial emphysema is also a strong consideration, because BPD is formally diagnosed at 36 weeks PMA.", "explanationSource": "added", "pearl": ""}, {"num": 10, "section": 0, "topic": "Neonatology", "question": "A term neonate is born through thick meconium-stained liquor, is not vigorous. Which is the MOST appropriate first step?", "options": ["Routine care and stimulation", "Immediate laryngoscopy and tracheal suctioning", "Begin PPV with room air", "Dry, stimulate, reposition, and reassess"], "answer": 3, "explanation": "Current NRP guidance: a non-vigorous infant born through meconium does not get routine laryngoscopy and tracheal suction. Perform the initial steps (warm, dry, stimulate, position the airway, clear secretions if needed) and start PPV within 60 seconds if apnoeic or HR <100.", "explanationSource": "added", "pearl": ""}, {"num": 11, "section": 0, "topic": "Neonatology", "question": "A 34-week neonate has temperature of 35.2°C on admission. What is the TARGET axillary temperature range for preterm neonates?", "options": ["35.5 – 36.0°C", "36.5 – 37.5°C", "37.0 – 38.0°C", "36.0 – 36.5°C"], "answer": 1, "explanation": "The normal axillary temperature range for newborns, including preterms, is 36.5–37.5°C. 35.2°C is moderate hypothermia (32–35.9°C) and needs active rewarming.", "explanationSource": "added", "pearl": ""}, {"num": 12, "section": 0, "topic": "Neonatology", "question": "A 29-week VLBW neonate develops apnea at day 3. The apnea is preceded by a sigh, lasts 25 seconds, and is associated with bradycardia. What type of apnea is this?", "options": ["Obstructive apnea", "Central apnea", "Mixed apnea", "Reflex apnea"], "answer": 2, "explanation": "Mixed apnoea, the most common type in preterm infants, combines a central pause with an obstructive component. A 25-second pause with bradycardia meets the definition of apnoea of prematurity.", "explanationSource": "added", "pearl": ""}, {"num": 13, "section": 0, "topic": "Neonatology", "question": "A 2-day-old term neonate has a serum bilirubin of 16 mg/dL (predominantly unconjugated). Mother is O+, baby is A+. DAT is positive. What is the MOST likely diagnosis?", "options": ["Physiological jaundice", "ABO incompatibility", "Rh incompatibility", "G6PD deficiency"], "answer": 1, "explanation": "Group O mother, group A baby, positive DAT and early unconjugated jaundice indicate ABO haemolytic disease. The mother is Rh-positive, so Rh disease is excluded; G6PD deficiency is DAT-negative.", "explanationSource": "added", "pearl": ""}, {"num": 14, "section": 0, "topic": "Neonatology", "question": "An exchange transfusion is planned for a term neonate with bilirubin of 28 mg/dL at 60 hours of life. What blood volume should be used for a double-volume exchange in a 3.2 kg neonate?", "options": ["96 mL", "160 mL", "320 mL", "512 mL"], "answer": 3, "explanation": "Double-volume exchange = 2 × 85 mL/kg × weight = 2 × 85 × 3.2 = 544 ≈ nearest option is 512 mL (some centres use 80 mL/kg per body volume). Calculation: 2 × 80 × 3.2 = 512 mL.", "explanationSource": "source", "pearl": "Exam Pearl: Double-volume exchange = 2 × 85 mL/kg (blood volume) = 170 mL/kg."}, {"num": 15, "section": 0, "topic": "Neonatology", "question": "A 38-week neonate presents at 12 hours with seizures, poor tone, absent Moro reflex, and a HIE score suggesting severe encephalopathy. What is the FIRST-LINE treatment?", "options": ["Phenobarbitone 20 mg/kg IV", "Therapeutic hypothermia (33–34°C for 72 hours)", "Levetiracetam 40 mg/kg IV", "MRI brain within 24 hours"], "answer": 1, "explanation": "Therapeutic hypothermia (33–34°C for 72 hours) started within 6 hours is the ONLY proven neuroprotective therapy for moderate-severe HIE in term neonates. Phenobarbitone (A) treats seizures but does not treat HIE itself and is not first-line before hypothermia.", "explanationSource": "source", "pearl": "Exam Pearl: Hypothermia must start within 6 hours of birth and must be in a term/near-term (≥36 weeks) neonate."}, {"num": 16, "section": 0, "topic": "Neonatology", "question": "Which of the following findings on aEEG suggests a POOR prognostic outcome in HIE?", "options": ["Burst suppression pattern", "Sleep-wake cycling", "Continuous normal voltage", "Discontinuous normal voltage"], "answer": 0, "explanation": "On aEEG, a burst-suppression background (and flat trace or low voltage) predicts poor outcome in HIE. Continuous normal voltage with sleep–wake cycling is reassuring; early return of sleep–wake cycling is a good prognostic sign.", "explanationSource": "added", "pearl": ""}, {"num": 17, "section": 0, "topic": "Neonatology", "question": "A 3-day-old preterm neonate (30 weeks) has a sudden drop in Hb from 15 to 9 g/dL, bulging fontanelle, and seizures. Cranial ultrasound shows echogenic material filling the lateral ventricles. What is the MOST likely diagnosis?", "options": ["Periventricular leukomalacia", "Grade IV IVH", "Neonatal meningitis", "Subgaleal hemorrhage"], "answer": 1, "explanation": "A sudden Hb fall, bulging fontanelle and seizures in a 30-week infant on day 3, with echogenic blood filling the ventricles, indicates severe IVH. Grade IV (Papile) or periventricular haemorrhagic infarction involves parenchymal extension.", "explanationSource": "added", "pearl": ""}, {"num": 18, "section": 0, "topic": "Neonatology", "question": "A 32-week neonate develops abdominal distension, bilious aspirates, and bloody stools at day 8. Abdominal X-ray shows pneumatosis intestinalis. What is the IMMEDIATE management?", "options": ["Emergency laparotomy", "NPO, IV antibiotics, NG decompression", "IV fluids and observation", "Rectal enema"], "answer": 1, "explanation": "Pneumatosis intestinalis with bilious aspirates and bloody stools is definite NEC (Bell stage II). Initial management is medical: NPO, gastric decompression, IV fluids/TPN and broad-spectrum antibiotics. Surgery is for perforation (pneumoperitoneum) or clinical deterioration.", "explanationSource": "added", "pearl": ""}, {"num": 19, "section": 0, "topic": "Neonatology", "question": "A term neonate has hypoglycemia with blood glucose of 1.8 mmol/L (32 mg/dL) at 2 hours. He is asymptomatic and feeding well. What is the MOST appropriate first management step?", "options": ["IV 10% dextrose bolus 2 mL/kg", "Encourage breastfeeding and recheck in 30–60 minutes", "Admit to NICU and start IV glucose infusion", "Start oral glucose gel 200 mg/kg buccal"], "answer": 3, "explanation": "For asymptomatic neonatal hypoglycaemia with ability to feed: oral glucose gel 200 mg/kg buccal + breastfeed is the evidence-based first step (Harding 2017 trials). IV bolus (A) is for symptomatic hypoglycaemia or inability to feed. The gel avoids supplementation with formula and supports breastfeeding.", "explanationSource": "source", "pearl": ""}, {"num": 20, "section": 0, "topic": "Neonatology", "question": "A premature neonate at 32 weeks has a loud systolic murmur with bounding pulses and wide pulse pressure at day 3. Echo confirms PDA with left-to-right shunt. Which drug is FIRST-LINE for medical closure?", "options": ["Indomethacin", "Ibuprofen", "Paracetamol", "Furosemide"], "answer": 2, "explanation": "Keyed answer: paracetamol. Ibuprofen, indomethacin and paracetamol close the duct with similar efficacy, and paracetamol is increasingly used because of fewer renal/GI effects. Note: many guidelines still list ibuprofen as the standard first-line drug, so check the framework your exam uses.", "explanationSource": "added", "pearl": ""}, {"num": 21, "section": 0, "topic": "Neonatology", "question": "Serum Na is 118 mEq/L in a term neonate with seizures. He is appropriate for gestational age and born to a mother who received excess IV hypotonic fluids. Which is the MOST likely cause?", "options": ["Syndrome of Inappropriate ADH (SIADH)", "Dilutional hyponatremia (iatrogenic)", "Cerebral salt wasting", "Adrenal insufficiency"], "answer": 1, "explanation": "Severe hyponatraemia in a term AGA newborn whose mother received large volumes of hypotonic IV fluid in labour reflects transplacental free-water transfer — dilutional (iatrogenic) hyponatraemia. SIADH, cerebral salt wasting and adrenal insufficiency need other supporting features.", "explanationSource": "added", "pearl": ""}, {"num": 22, "section": 0, "topic": "Neonatology", "question": "A 28-week neonate has a serum calcium of 1.6 mmol/L (6.4 mg/dL) on day 2 with jitteriness. What is the correct ACUTE treatment?", "options": ["Oral calcium carbonate 50 mg/kg/day", "IV calcium gluconate 10% — 2 mL/kg over 10 minutes", "Magnesium sulfate IV", "Vitamin D supplementation"], "answer": 1, "explanation": "Symptomatic early hypocalcaemia (jitteriness, ionised/total calcium low) needs IV 10% calcium gluconate 1–2 mL/kg slowly over 10 minutes with cardiac monitoring, followed by maintenance calcium. Oral calcium and vitamin D are not acute treatments.", "explanationSource": "added", "pearl": ""}, {"num": 23, "section": 0, "topic": "Neonatology", "question": "A 26-week preterm neonate has a head ultrasound on day 7 showing periventricular bilateral echogenicity that becomes cystic by day 28. This finding is MOST consistent with:", "options": ["Grade III IVH", "Germinal matrix hemorrhage", "Periventricular leukomalacia", "Ventriculomegaly"], "answer": 2, "explanation": "Bilateral periventricular echogenicity evolving into cysts over 2–4 weeks is cystic periventricular leukomalacia — ischaemic white-matter injury of the preterm brain. It predicts spastic diplegia.", "explanationSource": "added", "pearl": ""}, {"num": 24, "section": 0, "topic": "Neonatology", "question": "ROP screening is recommended in which of the following groups?", "options": ["All neonates <37 weeks gestation", "All neonates <32 weeks OR <1500 g birthweight", "All neonates requiring supplemental oxygen", "All neonates <34 weeks OR <2000 g birthweight"], "answer": 1, "explanation": "Keyed answer: <32 weeks or <1500 g, as in UK-type criteria. Note: Indian NNF/RBSK guidance screens infants <34 weeks and/or <1750 g (and sicker infants up to 34–36 weeks), so the expected answer depends on the guideline the question follows.", "explanationSource": "added", "pearl": ""}, {"num": 25, "section": 0, "topic": "Neonatology", "question": "A term neonate with culture-proven GBS sepsis (early-onset) is being treated. What is the MOST appropriate antibiotic regimen?", "options": ["Vancomycin + gentamicin", "Ampicillin + gentamicin", "Meropenem monotherapy", "Cefotaxime monotherapy"], "answer": 1, "explanation": "Culture-proven early-onset GBS sepsis is treated with ampicillin (or penicillin) plus gentamicin initially; therapy can be narrowed to penicillin/ampicillin alone once susceptibility and clinical response are confirmed. Vancomycin and meropenem are not needed.", "explanationSource": "added", "pearl": ""}, {"num": 26, "section": 0, "topic": "Neonatology", "question": "A 31-week neonate develops PPHN at day 2 with pre-ductal SpO2 95% and post-ductal SpO2 82%. The pre-post ductal SpO2 difference is 13%. Which therapy is MOST appropriate to add?", "options": ["IV sildenafil", "Inhaled nitric oxide (iNO)", "HFOV", "Surfactant rescue"], "answer": 1, "explanation": "A pre/post-ductal saturation difference >10% shows right-to-left ductal shunting from PPHN. After optimising lung recruitment and support, inhaled nitric oxide is the selective pulmonary vasodilator of choice. Its use in preterm infants is reserved for documented PPHN, as here.", "explanationSource": "added", "pearl": ""}, {"num": 27, "section": 0, "topic": "Neonatology", "question": "A term neonate born to a mother with poorly controlled Graves' disease has HR 200/min, poor feeding, and exophthalmos. TSH is <0.01. What is the MOST likely mechanism?", "options": ["Congenital hypothyroidism", "Neonatal thyrotoxicosis due to transplacental TSH-receptor antibodies", "Iatrogenic hyperthyroidism from antithyroid drugs", "Central hyperthyroidism"], "answer": 1, "explanation": "Maternal Graves' TSH-receptor-stimulating antibodies (TRAb) cross the placenta and cause transient neonatal thyrotoxicosis: tachycardia, poor feeding, goitre and eye signs with suppressed TSH. It resolves as antibodies clear over weeks to months.", "explanationSource": "added", "pearl": ""}, {"num": 28, "section": 0, "topic": "Neonatology", "question": "A neonate at 34 weeks has unconjugated bilirubin of 19 mg/dL at 48 hours with haemolysis. Exchange transfusion threshold in a 34-week neonate at 48 hours according to Bhutani curve is approximately:", "options": ["15 mg/dL", "17 mg/dL", "19 mg/dL", "22 mg/dL"], "answer": 2, "explanation": "For a 34-week infant with haemolysis (a neurotoxicity risk factor), exchange thresholds at about 48 hours lie around 17–19 mg/dL in preterm/risk-factor charts. A TSB of 19 mg/dL therefore reaches exchange territory and needs urgent escalation.", "explanationSource": "added", "pearl": ""}, {"num": 29, "section": 0, "topic": "Neonatology", "question": "What is the minimum volume of TPN (in mL/kg/day) required to meet the caloric needs of a stable growing preterm neonate?", "options": ["80 mL/kg/day", "120–150 mL/kg/day", "160–180 mL/kg/day", "200 mL/kg/day"], "answer": 1, "explanation": "Stable growing preterm infants need about 120–150 mL/kg/day of parenteral fluid to deliver adequate energy (roughly 90–120 kcal/kg/day parenterally) without excessive fluid load.", "explanationSource": "added", "pearl": ""}, {"num": 30, "section": 0, "topic": "Neonatology", "question": "A 28-week preterm neonate has a head circumference of 24 cm at birth. Neurodevelopmental follow-up should focus on which PRIMARY outcome at 2 years corrected age?", "options": ["Gross motor development only", "Cognitive, language, and motor development", "Social-emotional development only", "Visual acuity testing only"], "answer": 1, "explanation": "Follow-up of extremely preterm infants at 2 years corrected age uses a comprehensive assessment (e.g., Bayley) covering cognitive, language and motor domains, plus vision and hearing screening.", "explanationSource": "added", "pearl": ""}, {"num": 31, "section": 0, "topic": "Neonatology", "question": "A term neonate with HIE is started on therapeutic hypothermia. After 12 hours, the neonate develops seizures. Which drug is FIRST-LINE for neonatal seizures in this setting?", "options": ["Midazolam IV", "Phenobarbitone 20 mg/kg IV", "Levetiracetam 60 mg/kg IV", "Valproate IV"], "answer": 1, "explanation": "Phenobarbitone 20 mg/kg IV (further 10 mg/kg doses as needed) remains the first-line anticonvulsant for neonatal seizures, including during therapeutic hypothermia. Levetiracetam and midazolam are second-line options.", "explanationSource": "added", "pearl": ""}, {"num": 32, "section": 0, "topic": "Neonatology", "question": "A 30-week neonate on day 5 has urine output of 0.4 mL/kg/hr, serum creatinine 1.8 mg/dL (baseline 0.8 mg/dL), and serum K 6.1 mEq/L. What is the KDIGO stage of AKI?", "options": ["Stage 1", "Stage 2", "Stage 3", "Not AKI — within normal range for prematurity"], "answer": 1, "explanation": "Creatinine rose from 0.8 to 1.8 mg/dL (2.25× baseline) and urine output is <0.5 mL/kg/h. Both meet neonatal modified KDIGO stage 2 (creatinine 2.0–2.9× baseline). Stage 3 needs ≥3× baseline, creatinine ≥2.5 mg/dL or dialysis.", "explanationSource": "added", "pearl": ""}, {"num": 33, "section": 0, "topic": "Neonatology", "question": "An extremely preterm neonate (24 weeks) is born in a district hospital. What is the SINGLE MOST important initial action to prevent heat loss immediately after delivery?", "options": ["Warm blanket drying", "Radiant warmer", "Polyethylene wrap without drying", "Skin-to-skin contact"], "answer": 2, "explanation": "For infants <28–30 weeks, place the body immediately in a polyethylene bag/wrap without drying (head dried and capped) under a radiant warmer. This sharply reduces evaporative heat loss and admission hypothermia.", "explanationSource": "added", "pearl": ""}, {"num": 34, "section": 0, "topic": "Neonatology", "question": "A 32-week neonate has BPD (moderate, requiring 30% oxygen at 36 weeks PMA). Which medication has the STRONGEST evidence to reduce BPD severity in preterm neonates?", "options": ["Postnatal dexamethasone", "Vitamin A IM", "CPAP from birth", "Early caffeine"], "answer": 3, "explanation": "Early caffeine therapy (CAP trial) reduced BPD and improved neurodevelopmental outcomes, making it the best-supported routine pharmacological measure. Postnatal dexamethasone reduces BPD but carries neurodevelopmental risk; IM vitamin A has modest benefit.", "explanationSource": "added", "pearl": ""}, {"num": 35, "section": 0, "topic": "Neonatology", "question": "A 3-kg term neonate has blood glucose of 1.4 mmol/L (25 mg/dL), is jittery, and does not respond to feeds. IV access is established. What is the CORRECT IV dextrose bolus?", "options": ["2 mL/kg of 10% dextrose", "4 mL/kg of 25% dextrose", "5 mL/kg of 5% dextrose", "2 mL/kg of 50% dextrose"], "answer": 0, "explanation": "Symptomatic neonatal hypoglycaemia: IV 10% dextrose 2 mL/kg (200 mg/kg) bolus, then a continuous glucose infusion (GIR about 6–8 mg/kg/min). Concentrated (25–50%) dextrose is avoided because of rebound hyperglycaemia and vein damage.", "explanationSource": "added", "pearl": ""}, {"num": 36, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 9-month-old infant cannot sit without support, does not babble, and has no pincer grasp. The MOST concerning developmental red flag here is:", "options": ["No pincer grasp", "Inability to sit", "No babble", "All of the above equally concerning"], "answer": 3, "explanation": "At 9 months, inability to sit without support and absent babbling are clear motor and language red flags, and combined delays suggest global developmental delay, so all findings warrant evaluation (keyed answer). Pincer grasp usually emerges around 9–10 months.", "explanationSource": "added", "pearl": ""}, {"num": 37, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 3-year-old is at the 3rd percentile for height and 25th percentile for weight. Bone age is 1.5 years. Both parents are of normal height. The MOST likely diagnosis is:", "options": ["Familial short stature", "Constitutional delay of growth and puberty", "Growth hormone deficiency", "Hypothyroidism"], "answer": 1, "explanation": "Short stature with normal-height parents, a normal growth velocity pattern and a significantly delayed bone age is constitutional delay of growth. Familial short stature has bone age equal to chronological age and short parents.", "explanationSource": "added", "pearl": ""}, {"num": 38, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 6-month-old has weight-for-height Z-score of −3.5 with bilateral pitting oedema and hair changes. What is the MOST appropriate therapeutic food?", "options": ["F-75 formula initially, then F-100", "Therapeutic milk (F-100) directly", "Ready-to-use therapeutic food (RUTF)", "High-protein standard formula"], "answer": 0, "explanation": "A 6-month-old with oedematous SAM (kwashiorkor) is stabilised with F-75 (low-protein, low-sodium starter) and then transitioned to F-100 in rehabilitation. RUTF is used for children >6 months who are clinically stable with appetite.", "explanationSource": "added", "pearl": ""}, {"num": 39, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 2-year-old presents with night blindness and Bitot's spots. Serum retinol is 0.3 µmol/L. What is the treatment dose of Vitamin A?", "options": ["1,00,000 IU oral single dose", "2,00,000 IU oral on day 1, day 2, and after 2 weeks", "50,000 IU oral single dose", "2,00,000 IU IM single dose"], "answer": 1, "explanation": "WHO xerophthalmia treatment for children >12 months: 200,000 IU oral vitamin A on day 1, day 2 and again after 2 weeks (half dose at 6–12 months, quarter dose <6 months).", "explanationSource": "added", "pearl": ""}, {"num": 40, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 6-month-old exclusively breastfed infant born at term to a vegan mother develops irritability, hypotonia, and macrocytic anaemia. Serum B12 is very low. The MECHANISM of B12 deficiency here is:", "options": ["Pernicious anaemia in infant", "Transplacental depletion from maternal deficiency", "Malabsorption due to ileal disease", "Dietary deficiency (breastmilk low in B12)"], "answer": 1, "explanation": "Keyed answer: inadequate fetal stores from maternal deficiency. Infants of B12-deficient vegan mothers are born with low stores, and the deficiency then becomes clinical at 4–8 months because the breast milk is also B12-poor. Both mechanisms contribute.", "explanationSource": "added", "pearl": ""}, {"num": 41, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A child with Down syndrome (trisomy 21) has characteristic cardiac findings. Which CHD is MOST commonly associated?", "options": ["Ventricular septal defect", "Atrioventricular septal defect (AVSD)", "Tetralogy of Fallot", "Atrial septal defect"], "answer": 1, "explanation": "Complete atrioventricular septal defect (endocardial cushion defect) is the characteristic CHD of Down syndrome, about 40% of cardiac lesions in trisomy 21. VSD is the next most common.", "explanationSource": "added", "pearl": ""}, {"num": 42, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A neonate presents on day 3 with vomiting, lethargy, and seizures. Newborn screen shows elevated phenylalanine. On restriction of phenylalanine, plasma levels normalize. What is the MOST likely diagnosis?", "options": ["Maple syrup urine disease", "Classic phenylketonuria", "Tyrosinemia", "Homocystinuria"], "answer": 1, "explanation": "Elevated phenylalanine on newborn screening that normalises with dietary restriction indicates classic PKU (phenylalanine hydroxylase deficiency). Note: untreated PKU usually causes progressive developmental delay later in infancy, not acute neonatal encephalopathy (which is more typical of MSUD).", "explanationSource": "added", "pearl": ""}, {"num": 43, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A 4-month-old has progressive neurodegeneration, cherry-red spot on fundus, and hyperacusis. Enzyme assay shows absent hexosaminidase A. The MOST likely diagnosis is:", "options": ["Niemann-Pick disease", "Gaucher disease", "Tay-Sachs disease", "GM1 gangliosidosis"], "answer": 2, "explanation": "Hexosaminidase A deficiency causes Tay–Sachs disease (GM2 gangliosidosis): infantile neurodegeneration, exaggerated startle (hyperacusis), cherry-red spot and no hepatosplenomegaly. Niemann–Pick and GM1 usually have organomegaly.", "explanationSource": "added", "pearl": ""}, {"num": 44, "section": 0, "topic": "Growth, Development, Nutrition & Genetics", "question": "A child has features of Marfan syndrome: tall stature, arachnodactyly, lens subluxation (upward), and aortic root dilatation. The gene involved is:", "options": ["FBN1 (Fibrillin-1)", "COL3A1", "NF1", "PTPN11"], "answer": 0, "explanation": "Marfan syndrome is caused by FBN1 (fibrillin-1) mutations: tall stature, arachnodactyly, upward lens subluxation and aortic root dilatation. COL3A1 is vascular Ehlers–Danlos; PTPN11 is Noonan; NF1 is neurofibromatosis.", "explanationSource": "added", "pearl": ""}, {"num": 45, "section": 0, "topic": "Cardiology", "question": "A 6-week-old presents in congestive heart failure. Echo shows a large perimembranous VSD with Qp:Qs of 3:1. On examination, there is a pansystolic murmur at the left lower sternal border. What does the ABSENCE of a thrill suggest?", "options": ["Small VSD", "Severe pulmonary hypertension with equalization of pressures", "Subpulmonic VSD", "Muscular VSD"], "answer": 1, "explanation": "A thrill reflects a high-velocity jet across a pressure gradient. Its absence with a large VSD suggests rising pulmonary pressures equalising ventricular pressures (keyed answer). Note: a very high Qp:Qs of 3:1 implies low pulmonary vascular resistance, so the stem is internally inconsistent.", "explanationSource": "added", "pearl": ""}, {"num": 46, "section": 0, "topic": "Cardiology", "question": "An infant with a large unrepaired ASD develops cyanosis at age 30. Which is the MOST likely explanation?", "options": ["Spontaneous closure with residual defect", "Eisenmenger syndrome with reversal of shunt", "Associated pulmonary stenosis", "Paradoxical embolism"], "answer": 1, "explanation": "A long-standing large left-to-right shunt causes pulmonary vascular disease. When pulmonary resistance exceeds systemic resistance the shunt reverses, giving cyanosis and clubbing — Eisenmenger syndrome.", "explanationSource": "added", "pearl": ""}, {"num": 47, "section": 0, "topic": "Cardiology", "question": "A 4-year-old child with TOF presents with sudden cyanosis, hyperpnoea, and irritability while playing. What is the MOST appropriate immediate management?", "options": ["Oxygen via face mask", "Knee-chest position + morphine + IV propranolol", "IV adenosine", "Immediate surgical repair"], "answer": 1, "explanation": "Hypercyanotic (\"Tet\") spell management: knee-chest position (increases SVR), oxygen, morphine (reduces hyperpnoea, decreases RV outflow obstruction), IV propranolol (reduces infundibular spasm), IV phenylephrine (raises SVR). Adenosine (C) is for SVT, not Tet spells.", "explanationSource": "source", "pearl": ""}, {"num": 48, "section": 0, "topic": "Cardiology", "question": "A neonate is diagnosed with d-TGA. He has SpO2 of 55% despite 100% oxygen (hyperoxia test: PaO2 does not rise above 30 mmHg). Which is the MOST critical immediate intervention?", "options": ["PGE1 infusion", "Balloon atrial septostomy (Rashkind procedure)", "Both A and B simultaneously", "Emergency arterial switch operation"], "answer": 2, "explanation": "d-TGA with an intact or restrictive atrial septum is a mixing problem. Start PGE1 to keep the duct open and perform balloon atrial septostomy urgently to improve atrial mixing. The arterial switch follows once the baby is stabilised.", "explanationSource": "added", "pearl": ""}, {"num": 49, "section": 0, "topic": "Cardiology", "question": "A neonate with TAPVC (infracardiac type) presents with severe cyanosis and pulmonary oedema. What finding on CXR is characteristic of this type?", "options": ["Snowman (figure-of-8) appearance", "Pulmonary venous congestion without cardiomegaly", "Egg-on-side cardiac silhouette", "Boot-shaped heart"], "answer": 1, "explanation": "Infracardiac TAPVC is usually obstructed: severe pulmonary venous congestion ('ground-glass' lungs) with a normal-sized heart. The 'snowman' sign belongs to supracardiac TAPVC; egg-on-side to TGA; boot-shaped heart to TOF.", "explanationSource": "added", "pearl": ""}, {"num": 50, "section": 0, "topic": "Cardiology", "question": "A child has findings consistent with coarctation of the aorta: upper limb hypertension, weak femoral pulses, and rib notching on CXR. The rib notching results from:", "options": ["Dilated aorta compressing ribs", "Collateral flow through enlarged intercostal arteries", "Superior vena cava compression", "Pulmonary hypertension"], "answer": 1, "explanation": "In coarctation, collateral flow through dilated, tortuous intercostal arteries erodes the inferior rib margins (rib notching, usually after 5–8 years). Upper-limb hypertension and weak femoral pulses complete the picture.", "explanationSource": "added", "pearl": ""}, {"num": 51, "section": 1, "topic": "Cardiology", "question": "A 10-year-old child with rheumatic heart disease develops mitral stenosis. Which murmur finding is MOST specific for mitral stenosis?", "options": ["Pansystolic murmur at apex", "Mid-diastolic rumble at apex with opening snap", "Early diastolic murmur at left sternal border", "Systolic click with late systolic murmur"], "answer": 1, "explanation": "Mitral stenosis gives a loud S1, an opening snap and a low-pitched mid-diastolic rumble at the apex with presystolic accentuation. Pansystolic apical murmur is MR; early diastolic murmur at the left sternal edge is AR.", "explanationSource": "added", "pearl": ""}, {"num": 52, "section": 1, "topic": "Cardiology", "question": "A 5-month-old is in heart failure on furosemide and captopril. Echo shows severe dilated cardiomyopathy with EF 18%. He develops worsening respiratory distress. Which therapy has the STRONGEST evidence in paediatric DCM to improve survival?", "options": ["Ivabradine", "Carvedilol", "Digoxin alone", "High-dose furosemide"], "answer": 1, "explanation": "Keyed answer: carvedilol. Beta-blockade is part of anti-remodelling therapy for paediatric DCM along with ACE inhibitors and diuretics. Note: the paediatric carvedilol RCT did not show a significant survival benefit, so evidence in children is weaker than in adults.", "explanationSource": "added", "pearl": ""}, {"num": 53, "section": 1, "topic": "Cardiology", "question": "A 10-year-old presents with sudden palpitations. ECG shows narrow complex tachycardia at 220/min, regular, no visible P waves before QRS. What is the FIRST-LINE treatment?", "options": ["Synchronized DC cardioversion", "Adenosine 0.1 mg/kg rapid IV push", "Verapamil IV", "Propranolol IV"], "answer": 1, "explanation": "Regular narrow-complex tachycardia at 220/min with no visible P waves is SVT. In a stable child, try vagal manoeuvres, then adenosine 0.1 mg/kg rapid IV push with a flush (repeat 0.2 mg/kg). Synchronised cardioversion is for unstable patients; verapamil is avoided in young children.", "explanationSource": "added", "pearl": ""}, {"num": 54, "section": 1, "topic": "Cardiology", "question": "A 2-year-old child has a systolic murmur at left upper sternal border, widely fixed split S2, and ECG shows right axis deviation with rSR' in V1. The MOST likely diagnosis is:", "options": ["Ventricular septal defect", "Atrial septal defect (secundum)", "Pulmonary stenosis", "Patent ductus arteriosus"], "answer": 1, "explanation": "Wide fixed splitting of S2, an ejection systolic murmur at the left upper sternal border (increased pulmonary flow) and RAD with rSR′ in V1 are classic for secundum ASD.", "explanationSource": "added", "pearl": ""}, {"num": 55, "section": 1, "topic": "Cardiology", "question": "A neonate has SpO2 of 70% in all four limbs (pre and post-ductal equal). CXR shows cardiomegaly with pulmonary plethora. ECG shows left axis deviation. Echo confirms single ventricle physiology (tricuspid atresia). What is the IMMEDIATE management?", "options": ["PGE1 infusion", "Oxygen supplementation", "Urgent Glenn procedure", "IV furosemide"], "answer": 0, "explanation": "Tricuspid atresia classically shows left axis deviation. A neonate with significant cyanosis and suspected duct-dependent pulmonary flow is started on PGE1 until anatomy is defined. Note: pulmonary plethora suggests adequate pulmonary blood flow, which weakens the case for ductal dependence.", "explanationSource": "added", "pearl": ""}, {"num": 56, "section": 1, "topic": "Cardiology", "question": "A 3-day-old term neonate presents with weak femoral pulses, grey appearance, and metabolic acidosis. BP in right arm is 85/50, and BP in both lower limbs is unmeasurable. What is the MOST likely diagnosis?", "options": ["Large VSD", "Hypoplastic left heart syndrome", "Critical coarctation of aorta", "Total anomalous pulmonary venous connection"], "answer": 2, "explanation": "A grey, shocked 3-day-old with metabolic acidosis, preserved right-arm BP and absent lower-limb pulses/pressures has a duct-dependent systemic circulation from critical coarctation. Start PGE1 urgently.", "explanationSource": "added", "pearl": ""}, {"num": 57, "section": 1, "topic": "Cardiology", "question": "A 5-year-old child with known Kawasaki disease had inadequate IVIG response. Which additional therapy is indicated?", "options": ["Repeat IVIG 2g/kg", "IV methylprednisolone pulse", "Both A and B", "Aspirin dose escalation only"], "answer": 0, "explanation": "About 10–20% of Kawasaki patients are IVIG-resistant (persistent fever 36 hours after IVIG). A second IVIG 2 g/kg is the commonly recommended next step. Steroids, infliximab or ciclosporin are alternatives or adjuncts in high-risk or resistant cases.", "explanationSource": "added", "pearl": ""}, {"num": 58, "section": 1, "topic": "Cardiology", "question": "A child with a new murmur has an ECG showing prolonged PR interval (0.28 sec), wide QRS, and a Holter showing second-degree AV block (Mobitz I). He had a viral illness 3 weeks ago. What is the MOST likely diagnosis?", "options": ["Congenital complete heart block", "Myocarditis with cardiac conduction disease", "Long QT syndrome", "Wolff-Parkinson-White syndrome"], "answer": 1, "explanation": "New conduction disease (prolonged PR, wide QRS, Mobitz I) weeks after a viral illness suggests viral myocarditis. Look for ventricular dysfunction and arrhythmia, and monitor closely.", "explanationSource": "added", "pearl": ""}, {"num": 59, "section": 1, "topic": "Cardiology", "question": "A 6-month-old has a machinery-like continuous murmur at the left infraclavicular area. Pulse pressure is wide. What is the MOST appropriate initial management?", "options": ["Observation — high rate of spontaneous closure", "Indomethacin IV", "Device closure (catheterization)", "Surgical ligation"], "answer": 2, "explanation": "A continuous machinery murmur with wide pulse pressure beyond infancy is a persistent PDA. In older infants, transcatheter device closure is the treatment of choice. NSAIDs work only in preterm neonates.", "explanationSource": "added", "pearl": ""}, {"num": 60, "section": 1, "topic": "Cardiology", "question": "A 4-year-old presents with recurrent syncope on exertion. ECG shows QTc of 510 ms. Family history reveals a sibling who died suddenly. The MOST appropriate initial therapy is:", "options": ["Digoxin", "Non-selective beta-blocker (propranolol/nadolol)", "Amiodarone", "Flecainide"], "answer": 1, "explanation": "Exertional syncope with QTc >500 ms and a family history of sudden death suggests congenital long QT syndrome (likely LQT1). Non-selective beta-blockers (nadolol/propranolol) are first-line, with an ICD for high-risk patients.", "explanationSource": "added", "pearl": ""}, {"num": 61, "section": 1, "topic": "Cardiology", "question": "In a child with Eisenmenger syndrome and VSD, which intervention is CONTRAINDICATED?", "options": ["Anticoagulation", "Bosentan (endothelin receptor antagonist)", "Surgical VSD closure", "Supplemental oxygen at altitude"], "answer": 2, "explanation": "In Eisenmenger syndrome, closing the VSD removes the 'pop-off' for the right ventricle and causes RV failure, so it is contraindicated. Management is supportive, plus pulmonary vasodilators such as bosentan.", "explanationSource": "added", "pearl": ""}, {"num": 62, "section": 1, "topic": "Cardiology", "question": "A neonate is born with a heart rate of 58/min despite adequate ventilation and good tone. Which is the MOST appropriate management as per NRP 2020?", "options": ["Begin cardiac compressions immediately", "Intubate and ventilate for 30 seconds, then reassess", "Begin PPV and reassess after 30 seconds", "Administer epinephrine"], "answer": 2, "explanation": "Keyed answer: start PPV. Effective ventilation is the most important step for any newborn with HR <100/min. Note: if the baby had already received 30 seconds of effective PPV (including an alternative airway) and HR stayed <60, chest compressions would be next. The stem's 'despite adequate ventilation' is ambiguous.", "explanationSource": "added", "pearl": ""}, {"num": 63, "section": 1, "topic": "Cardiology", "question": "ECG shows delta waves, short PR interval, and wide QRS complex. The child has recurrent SVT. The condition is:", "options": ["Long QT syndrome", "Brugada syndrome", "Wolff-Parkinson-White syndrome", "CPVT"], "answer": 2, "explanation": "Short PR, delta wave (slurred QRS upstroke) and wide QRS in a child with recurrent SVT is Wolff–Parkinson–White syndrome, from an accessory pathway causing pre-excitation and AVRT.", "explanationSource": "added", "pearl": ""}, {"num": 64, "section": 1, "topic": "Cardiology", "question": "A term neonate born to a mother with SLE has complete heart block (HR 48/min). This is caused by:", "options": ["Anti-Ro (SSA) and Anti-La (SSB) antibodies", "Anti-dsDNA antibodies", "Anti-phospholipid antibodies", "Anti-Smith antibodies"], "answer": 0, "explanation": "Congenital complete heart block in infants of mothers with SLE/Sjögren's results from transplacental anti-Ro (SSA) and anti-La (SSB) antibodies damaging the fetal conduction system. It is usually permanent.", "explanationSource": "added", "pearl": ""}, {"num": 65, "section": 1, "topic": "Neurology", "question": "A 7-month-old has flexion spasms in clusters on waking, each lasting 1–3 seconds, occurring 15–20 times. EEG shows hypsarrhythmia. This is MOST consistent with:", "options": ["Myoclonic epilepsy of infancy", "West syndrome (infantile spasms)", "Dravet syndrome", "Lennox-Gastaut syndrome"], "answer": 1, "explanation": "Clusters of flexor spasms on waking with hypsarrhythmia on EEG in a 3–12-month-old is West syndrome (infantile spasms). The triad is spasms, hypsarrhythmia and developmental regression.", "explanationSource": "added", "pearl": ""}, {"num": 66, "section": 1, "topic": "Neurology", "question": "First-line treatment for infantile spasms (West syndrome) in India per current guidelines is:", "options": ["Valproate + clonazepam", "ACTH or vigabatrin (first-line options)", "Pyridoxine trial", "Ketogenic diet"], "answer": 1, "explanation": "First-line therapy for infantile spasms is hormonal (ACTH or high-dose oral prednisolone — widely used in India) or vigabatrin. Vigabatrin is preferred in tuberous sclerosis.", "explanationSource": "added", "pearl": ""}, {"num": 67, "section": 1, "topic": "Neurology", "question": "A child with childhood absence epilepsy has absence seizures. EEG shows 3-Hz generalized spike-and-wave discharges. What is the FIRST-LINE treatment?", "options": ["Carbamazepine", "Ethosuximide", "Phenobarbitone", "Oxcarbazepine"], "answer": 1, "explanation": "Childhood absence epilepsy — first-line is ethosuximide OR valproate. Ethosuximide is preferred when ONLY absence seizures are present (no generalized tonic-clonic seizures) because it avoids valproate's side effects. Carbamazepine (A) and oxcarbazepine (D) can WORSEN absence seizures.", "explanationSource": "source", "pearl": "Trap: Carbamazepine is absolutely contraindicated in absence epilepsy — it worsens seizures."}, {"num": 68, "section": 1, "topic": "Neurology", "question": "A 5-year-old with Dravet syndrome has ongoing seizures despite valproate. Which drug is CONTRAINDICATED in Dravet syndrome and can worsen seizures?", "options": ["Clobazam", "Sodium channel blockers (carbamazepine, lamotrigine)", "Stiripentol", "Fenfluramine"], "answer": 1, "explanation": "Dravet syndrome (SCN1A loss of function) is worsened by sodium-channel blockers such as carbamazepine, oxcarbazepine, lamotrigine and phenytoin. Valproate, clobazam, stiripentol, cannabidiol and fenfluramine are appropriate.", "explanationSource": "added", "pearl": ""}, {"num": 69, "section": 1, "topic": "Neurology", "question": "Status epilepticus is defined as seizures lasting longer than:", "options": ["5 minutes or two seizures without recovery of consciousness", "10 minutes", "30 minutes", "15 minutes"], "answer": 0, "explanation": "Operational definition of SE (ILAE 2015): ≥5 minutes of continuous seizure activity OR ≥2 seizures without return to baseline. The old definition of 30 minutes is outdated.", "explanationSource": "source", "pearl": ""}, {"num": 70, "section": 1, "topic": "Neurology", "question": "A 3-year-old arrives with a generalized tonic-clonic seizure that has been ongoing for 8 minutes. IV access is not yet established. What is the MOST appropriate first-line treatment?", "options": ["IM midazolam or buccal midazolam", "Rectal diazepam", "IV lorazepam when line is established", "IV phenobarbitone"], "answer": 0, "explanation": "A convulsive seizure lasting ≥5 minutes is status epilepticus. Without IV access, give buccal/intranasal or IM midazolam (rectal diazepam is an alternative). Escalate to second-line agents if seizures persist.", "explanationSource": "added", "pearl": ""}, {"num": 71, "section": 1, "topic": "Neurology", "question": "A child is diagnosed with NMDA receptor encephalitis. What is the MOST appropriate FIRST immunotherapy?", "options": ["IV methylprednisolone + IVIG", "Rituximab", "Mycophenolate mofetil", "Azathioprine"], "answer": 0, "explanation": "First-line immunotherapy for anti-NMDAR encephalitis is high-dose IV methylprednisolone plus IVIG (or plasma exchange), with tumour (ovarian teratoma) screening. Rituximab or cyclophosphamide are second-line if there is no response.", "explanationSource": "added", "pearl": ""}, {"num": 72, "section": 1, "topic": "Neurology", "question": "A 2-year-old with cerebral palsy has predominantly spastic diplegia. Which finding is MOST consistent with this type of CP?", "options": ["Lower limb predominance with scissoring gait", "Upper limb hemiparesis", "Generalised hypotonia with ataxia", "Involuntary writhing movements"], "answer": 0, "explanation": "Spastic diplegia, classic in preterm infants with PVL, affects the lower limbs more than the upper. It causes scissoring and toe-walking from adductor and calf spasticity.", "explanationSource": "added", "pearl": ""}, {"num": 73, "section": 1, "topic": "Neurology", "question": "A boy presents with proximal muscle weakness, calf pseudohypertrophy, positive Gowers' sign, and CPK 15,000 IU/L. He is 5 years old and walking. Diagnosis is confirmed as DMD. Which intervention has the BEST evidence for prolonging ambulation?", "options": ["Physiotherapy alone", "Deflazacort or prednisolone", "Exon skipping therapy (eteplirsen)", "ACE inhibitors"], "answer": 1, "explanation": "Corticosteroids (deflazacort or prednisolone) are standard of care in DMD. They prolong ambulation and preserve respiratory and cardiac function. Exon-skipping drugs suit only specific mutations and have limited functional evidence.", "explanationSource": "added", "pearl": ""}, {"num": 74, "section": 1, "topic": "Neurology", "question": "A 9-month-old has severe hypotonia, absent deep tendon reflexes, tongue fasciculations, and bell-shaped chest. He was never able to roll over. Genetic testing confirms homozygous deletion of SMN1. The MOST appropriate treatment is:", "options": ["Supportive care only", "Nusinersen (intrathecal)", "Onasemnogene abeparvovec (gene therapy)", "Either B or C depending on age and weight"], "answer": 3, "explanation": "SMA type 1 is now treated with disease-modifying therapy: intrathecal nusinersen, one-time onasemnogene abeparvovec gene therapy (age/weight-limited) or oral risdiplam. Choice depends on age, weight, availability and antibody status.", "explanationSource": "added", "pearl": ""}, {"num": 75, "section": 1, "topic": "Neurology", "question": "A child is admitted with TB meningitis confirmed by CSF PCR. CSF shows lymphocytic pleocytosis, very low glucose (CSF:serum ratio 0.2), and high protein. What is the recommended duration of anti-TB therapy for TBM?", "options": ["6 months", "9 months", "12 months", "18 months"], "answer": 2, "explanation": "Most guidelines (including Indian RNTCP/NTEP and many paediatric guidelines) recommend about 12 months of anti-TB therapy for tuberculous meningitis (2 months intensive + 10 months continuation), with adjunctive steroids. WHO 2022 also allows a shorter intensive regimen in selected children.", "explanationSource": "added", "pearl": ""}, {"num": 76, "section": 1, "topic": "Neurology", "question": "A child with bacterial meningitis develops syndrome of inappropriate ADH. Which is the HALLMARK biochemical finding?", "options": ["Serum Na <135, urine Na >20 mEq/L, urine osmolality > serum osmolality", "Serum Na <135, urine Na <10 mEq/L, high serum osmolality", "Serum Na >145, urine Na >40, low urine osmolality", "Serum Na <135, urine Na <10, low urine osmolality"], "answer": 0, "explanation": "SIADH: hyponatraemia with low serum osmolality, inappropriately concentrated urine (urine osm > serum osm) and urine Na usually >20–40 mEq/L, in a euvolaemic patient. Treat with fluid restriction.", "explanationSource": "added", "pearl": ""}, {"num": 77, "section": 1, "topic": "Neurology", "question": "A 10-year-old develops acute cerebellar ataxia after varicella infection. MRI shows cerebellar white matter changes. CSF shows mild pleocytosis. What is the MOST likely diagnosis?", "options": ["Varicella cerebellitis", "Acute disseminated encephalomyelitis (ADEM)", "Multiple sclerosis", "Bickerstaff brainstem encephalitis"], "answer": 1, "explanation": "Keyed answer: ADEM, supported by white-matter changes on MRI. Note: isolated acute post-varicella cerebellar ataxia/cerebellitis is the more common cause of ataxia after chickenpox. ADEM is favoured when there is encephalopathy or multifocal demyelination.", "explanationSource": "added", "pearl": ""}, {"num": 78, "section": 1, "topic": "Neurology", "question": "A child has tuberous sclerosis complex with refractory seizures. Genetic testing confirms TSC2 mutation. Which mTOR inhibitor is indicated for subependymal giant cell astrocytoma (SEGA) and epilepsy?", "options": ["Sirolimus", "Everolimus", "Temsirolimus", "Rapamycin"], "answer": 1, "explanation": "Everolimus (an mTOR inhibitor) is approved for SEGA and as adjunctive therapy for refractory TSC-associated seizures (EXIST-1/3 trials). Sirolimus (rapamycin) is not the licensed agent for these indications.", "explanationSource": "added", "pearl": ""}, {"num": 79, "section": 1, "topic": "Neurology", "question": "A 7-year-old presents with morning headache, vomiting, and papilledema. MRI shows a posterior fossa mass with hydrocephalus. The MOST common posterior fossa tumour in children is:", "options": ["Ependymoma", "Medulloblastoma", "Astrocytoma", "DNET"], "answer": 1, "explanation": "Medulloblastoma is the most common malignant posterior fossa tumour in children. It typically arises from the vermis, causing truncal ataxia and hydrocephalus. Pilocytic astrocytoma is the other very common, benign, posterior fossa tumour.", "explanationSource": "added", "pearl": ""}, {"num": 80, "section": 1, "topic": "Neurology", "question": "Guillain-Barré syndrome in children: which CSF finding is CHARACTERISTIC?", "options": ["High protein, high cells (pleocytosis)", "High protein, minimal cells (albuminocytological dissociation)", "Low protein, high cells", "Normal protein, high cells"], "answer": 1, "explanation": "Guillain–Barré syndrome shows albuminocytological dissociation — raised CSF protein with normal or minimal cells — most evident after the first week.", "explanationSource": "added", "pearl": ""}, {"num": 81, "section": 1, "topic": "Neurology", "question": "A child with NF-1 presents with a progressive visual field defect. MRI shows an optic pathway glioma. First-line chemotherapy is:", "options": ["Temozolomide", "Carboplatin + vincristine", "Bevacizumab", "Radiation therapy"], "answer": 1, "explanation": "Symptomatic NF1-associated optic pathway glioma is treated first with carboplatin plus vincristine chemotherapy. Radiotherapy is avoided in NF1 because of second malignancy and vasculopathy risk.", "explanationSource": "added", "pearl": ""}, {"num": 82, "section": 1, "topic": "Neurology", "question": "A 6-year-old presents with rapid onset ascending paralysis, bilateral facial weakness, and areflexia over 5 days. Nerve conduction studies show reduced motor nerve conduction velocities. What is the MOST appropriate treatment?", "options": ["IV methylprednisolone", "IVIG 2 g/kg or plasma exchange", "Pyridostigmine", "Cyclophosphamide"], "answer": 1, "explanation": "Rapidly progressive ascending flaccid weakness with areflexia and demyelinating NCS findings is GBS. Treatment is IVIG 2 g/kg (or plasma exchange) for non-ambulant or progressing children. Steroids are not effective.", "explanationSource": "added", "pearl": ""}, {"num": 83, "section": 1, "topic": "Neurology", "question": "Which epilepsy syndrome is characterised by the triad of: polymorphic seizures (myoclonic, absence, tonic-clonic), intellectual disability, and slow spike-and-wave on EEG?", "options": ["Dravet syndrome", "West syndrome", "Lennox-Gastaut syndrome", "Doose syndrome"], "answer": 2, "explanation": "Lennox–Gastaut syndrome: multiple seizure types (especially tonic, plus atonic and atypical absence), intellectual disability and slow (<2.5 Hz) spike-and-wave with generalised paroxysmal fast activity in sleep.", "explanationSource": "added", "pearl": ""}, {"num": 84, "section": 1, "topic": "Neurology", "question": "A 4-year-old child has acute onset behavioural change, sleep disturbance, choreiform movements, and seizures after a streptococcal throat infection. The MOST likely diagnosis is:", "options": ["Sydenham's chorea", "PANDAS", "Anti-NMDA receptor encephalitis", "Tics and OCD"], "answer": 0, "explanation": "Chorea with emotional lability and behavioural change after streptococcal infection is Sydenham's chorea, a major Jones criterion of rheumatic fever. PANDAS presents mainly with abrupt OCD/tics rather than chorea.", "explanationSource": "added", "pearl": ""}, {"num": 85, "section": 1, "topic": "Nephrology", "question": "A 5-year-old with AKI has serum K of 7.2 mEq/L with peaked T waves on ECG. What is the FIRST and most urgent treatment?", "options": ["Salbutamol nebulisation", "IV sodium bicarbonate", "IV calcium gluconate 10% — 0.5 mL/kg", "Dialysis"], "answer": 2, "explanation": "In hyperkalaemia with ECG changes (peaked T waves), the FIRST and most URGENT treatment is IV calcium gluconate — it stabilizes the cardiac membrane. It does NOT lower potassium but prevents fatal arrhythmia while other measures work. Then give salbutamol (A), NaHCO3 (B), and/or dialysis (D).", "explanationSource": "source", "pearl": "Exam Pearl: ECG changes in hyperkalaemia → Calcium FIRST (membrane stabilizer). Then shift K into cells."}, {"num": 86, "section": 1, "topic": "Nephrology", "question": "A 4-year-old presents with periorbital puffiness, generalized oedema, and frothy urine. Urine protein:creatinine ratio is 8. Serum albumin is 1.5 g/dL. Complement C3 is normal. What is the MOST likely diagnosis?", "options": ["Minimal change nephrotic syndrome", "Membranoproliferative GN", "IgA nephropathy", "Focal segmental glomerulosclerosis"], "answer": 0, "explanation": "Nephrotic syndrome in a 4-year-old with normal complement, no haematuria, hypertension or renal impairment is most likely minimal change disease (steroid-sensitive in about 80–90%). Low C3 would point to MPGN or post-infectious GN.", "explanationSource": "added", "pearl": ""}, {"num": 87, "section": 1, "topic": "Nephrology", "question": "The FIRST-LINE treatment for a new presentation of idiopathic nephrotic syndrome in a 4-year-old child (per ISPN guidelines) is:", "options": ["Prednisolone 60 mg/m²/day for 4 weeks, then 40 mg/m² alternate day for 4 weeks", "Prednisolone 2 mg/kg/day for 6 weeks, then 1.5 mg/kg alternate day for 6 weeks", "Cyclophosphamide pulse", "Tacrolimus"], "answer": 1, "explanation": "ISPN guideline for the initial episode: prednisolone 2 mg/kg/day (60 mg/m²) for 6 weeks, then 1.5 mg/kg (40 mg/m²) on alternate days for 6 weeks. This 12-week course reduces early relapses.", "explanationSource": "added", "pearl": ""}, {"num": 88, "section": 1, "topic": "Nephrology", "question": "A 7-year-old presents 2 weeks after a throat infection with haematuria, hypertension, and periorbital puffiness. Urine shows RBC casts. Serum C3 is low, C4 normal. What is the diagnosis?", "options": ["IgA nephropathy", "Post-streptococcal GN", "Membranoproliferative GN", "HUS"], "answer": 1, "explanation": "Haematuria, hypertension and oedema with RBC casts 1–3 weeks after a sore throat, with low C3 and normal C4, is post-streptococcal GN (C3 normalises in 6–8 weeks). IgA nephropathy has synpharyngitic haematuria and normal C3.", "explanationSource": "added", "pearl": ""}, {"num": 89, "section": 1, "topic": "Nephrology", "question": "A 3-year-old presents with bloody diarrhoea followed by pallor, petechiae, reduced urine output, and serum creatinine of 3.2 mg/dL. Peripheral smear shows fragmented RBCs. What is the MOST appropriate initial treatment?", "options": ["Plasma exchange", "Antibiotics (trimethoprim-sulfamethoxazole)", "Supportive care: fluid management, dialysis if needed", "Eculizumab"], "answer": 2, "explanation": "Diarrhoea-associated (STEC) HUS is managed supportively: careful fluids, electrolytes, transfusion as needed, antihypertensives and dialysis for AKI. Antibiotics may increase toxin release; eculizumab is for atypical HUS.", "explanationSource": "added", "pearl": ""}, {"num": 90, "section": 1, "topic": "Nephrology", "question": "A 6-year-old has hyperchloremic metabolic acidosis with urine pH consistently >5.5 despite systemic acidosis, hypokalemia, and nephrocalcinosis. What is the MOST likely diagnosis?", "options": ["Type 2 (proximal) RTA", "Type 1 (distal) RTA", "Type 4 RTA", "Fanconi syndrome"], "answer": 1, "explanation": "Distal (type 1) RTA: hyperchloraemic acidosis with inability to acidify urine (pH >5.5), hypokalaemia, hypercalciuria, nephrocalcinosis/stones and growth failure. Proximal RTA can acidify urine once bicarbonate falls; type 4 has hyperkalaemia.", "explanationSource": "added", "pearl": ""}, {"num": 91, "section": 1, "topic": "Nephrology", "question": "A 10-year-old girl has CKD stage 3 (GFR 38 mL/min/1.73m²). Her BP is 135/90 mmHg, Hb 8.2 g/dL, and serum phosphate 2.0 mmol/L. Which treatment for anaemia is appropriate?", "options": ["Oral iron only", "IV iron", "Erythropoietin stimulating agent (ESA) + iron", "Blood transfusion"], "answer": 2, "explanation": "Anaemia of CKD (Hb <10–11 g/dL) is treated by correcting iron deficiency and giving an erythropoiesis-stimulating agent, targeting Hb about 10–12 g/dL. Transfusion is reserved for symptomatic or severe cases.", "explanationSource": "added", "pearl": ""}, {"num": 92, "section": 1, "topic": "Nephrology", "question": "A 2-year-old presents with recurrent febrile UTIs. MCU shows bilateral grade IV VUR. What is the MOST appropriate management?", "options": ["Long-term antibiotic prophylaxis alone", "Immediate surgical reimplantation", "Endoscopic treatment (STING procedure)", "Observation without prophylaxis"], "answer": 0, "explanation": "Initial management for high-grade VUR with febrile UTIs in young children is continuous antibiotic prophylaxis (RIVUR evidence), with bladder–bowel dysfunction management. Surgical or endoscopic correction is for breakthrough infections or new scarring despite prophylaxis.", "explanationSource": "added", "pearl": ""}, {"num": 93, "section": 1, "topic": "Nephrology", "question": "A child with nephrotic syndrome on prolonged steroids develops cushingoid features, hypertension, and poor growth. She has frequent relapses (>3/year). Which steroid-sparing agent is FIRST preferred?", "options": ["Cyclophosphamide", "Levamisole", "Tacrolimus", "Rituximab"], "answer": 0, "explanation": "Keyed answer: cyclophosphamide, particularly with steroid toxicity. Note: ISPN 2021 lists levamisole, MMF, cyclophosphamide and calcineurin inhibitors for frequently relapsing nephrotic syndrome, and many centres use levamisole or MMF first. Check the exact framework expected.", "explanationSource": "added", "pearl": ""}, {"num": 94, "section": 1, "topic": "Nephrology", "question": "A term neonate has polyuria (urine output 8 mL/kg/hr), hypernatremia (Na 158 mEq/L), and urine osmolality of 80 mOsm/kg (serum osmolality 310). Fluid deprivation test shows no concentration of urine. DDAVP administration causes no change. The MOST likely diagnosis is:", "options": ["Central diabetes insipidus", "Nephrogenic diabetes insipidus", "Primary polydipsia", "Renal salt wasting"], "answer": 1, "explanation": "Polyuria, hypernatraemia and very dilute urine that fails to concentrate with water deprivation or desmopressin indicates nephrogenic DI (e.g., X-linked AVPR2 defect). Central DI would respond to DDAVP.", "explanationSource": "added", "pearl": ""}, {"num": 95, "section": 1, "topic": "Nephrology", "question": "Which CAKUT (congenital anomaly of kidney and urinary tract) is the MOST COMMON cause of end-stage renal disease in children?", "options": ["VUR", "Renal aplasia", "Posterior urethral valves", "Horseshoe kidney"], "answer": 2, "explanation": "Keyed answer: posterior urethral valves. Obstructive uropathy (especially PUV) and renal hypodysplasia together make CAKUT the leading cause of paediatric CKD/ESRD. In many registries renal hypodysplasia is the single most common, with PUV the most common obstructive cause.", "explanationSource": "added", "pearl": ""}, {"num": 96, "section": 1, "topic": "Nephrology", "question": "A child has Fanconi syndrome with glycosuria, aminoaciduria, phosphaturia, and proximal RTA. The MOST common systemic cause in children is:", "options": ["Wilson disease", "Lowe syndrome", "Cystinosis", "Galactosemia"], "answer": 2, "explanation": "Nephropathic cystinosis is the most common inherited cause of renal Fanconi syndrome in children: polyuria, rickets and failure to thrive from late infancy, with corneal cystine crystals. Treatment is cysteamine.", "explanationSource": "added", "pearl": ""}, {"num": 97, "section": 1, "topic": "Gastroenterology & Hepatology", "question": "A 10-month-old has 12 watery stools/day, sunken eyes, absent skin turgor, lethargic, unable to drink. How is dehydration severity classified and what is the INITIAL fluid treatment?", "options": ["Moderate dehydration — ORS 75 mL/kg over 4 hours", "Severe dehydration — Ringer's lactate 100 mL/kg over 3 hours", "Severe dehydration — 0.9% NaCl 20 mL/kg bolus, then reassess", "Severe dehydration — RL 30 mL/kg over 1 hour, then 70 mL/kg over 5 hours"], "answer": 3, "explanation": "Lethargy, inability to drink, sunken eyes and very slow skin pinch = severe dehydration (WHO Plan C). For an infant under 12 months: Ringer's lactate 30 mL/kg over 1 hour, then 70 mL/kg over 5 hours (children ≥12 months: 30 mL/kg over 30 min, then 70 mL/kg over 2.5 h). A 20 mL/kg 0.9% saline bolus is the PALS approach for shock, not the WHO severe-dehydration protocol.", "explanationSource": "source-corrected", "pearl": "", "note": "Corrected from source: the original option D gave the ≥12-month timing (30 min, then 2.5 h), which is wrong for this 10-month-old. Option D now gives the WHO infant regimen; the keyed answer (D) is unchanged."}, {"num": 98, "section": 1, "topic": "Gastroenterology & Hepatology", "question": "A 3-year-old has anti-tTG IgA >10× ULN. Family history: mother has celiac disease. What is the MOST appropriate next step?", "options": ["Duodenal biopsy (Marsh grading)", "HLA-DQ2/DQ8 typing", "Gluten-free diet trial without biopsy", "Based on ESPGHAN 2020: HLA-DQ2/8, EMA, anti-tTG retest — if all consistent, diagnose without biopsy"], "answer": 3, "explanation": "ESPGHAN 2020 allows a no-biopsy diagnosis when anti-tTG IgA is ≥10× ULN and EMA is positive in a second blood sample (HLA typing is no longer mandatory). Otherwise duodenal biopsy is needed before starting a gluten-free diet.", "explanationSource": "added", "pearl": ""}, {"num": 99, "section": 1, "topic": "Gastroenterology & Hepatology", "question": "A 12-year-old presents with right iliac fossa pain, weight loss, perianal fistula, skip lesions on colonoscopy, and transmural inflammation on biopsy. What is the MOST likely diagnosis?", "options": ["Ulcerative colitis", "Crohn's disease", "Infective colitis", "Intestinal TB"], "answer": 1, "explanation": "Transmural inflammation, skip lesions, perianal fistula, RIF pain and weight loss indicate Crohn's disease. In India, intestinal TB must always be excluded (necrotising granulomas, AFB/GeneXpert, chest imaging).", "explanationSource": "added", "pearl": ""}, {"num": 100, "section": 1, "topic": "Gastroenterology & Hepatology", "question": "A 6-week-old infant presents with jaundice, pale stools, and dark urine. Bilirubin is 80% conjugated. USG shows triangular cord sign and absent gallbladder. What is the MOST appropriate initial management?", "options": ["Kasai hepatoportoenterostomy as soon as possible", "UDCA (ursodeoxycholic acid)", "Phenobarbitone", "Liver transplant"], "answer": 0, "explanation": "Conjugated jaundice with acholic stools at 6 weeks plus the triangular-cord sign and absent gallbladder strongly suggests biliary atresia. Kasai portoenterostomy should be done as early as possible, ideally before 60 days, as outcomes worsen with age.", "explanationSource": "added", "pearl": ""}, {"num": 101, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "A 10-year-old with chronic liver disease presents with acute upper GI bleeding. Endoscopy shows oesophageal varices. What is the MOST appropriate ACUTE management after stabilization?", "options": ["Band ligation of varices", "Terlipressin IV + band ligation", "Balloon tamponade", "TIPS procedure"], "answer": 1, "explanation": "Acute variceal bleeding: resuscitate, then give a vasoactive drug (terlipressin or octreotide) plus antibiotics, followed by endoscopic band ligation (or sclerotherapy in small children). Balloon tamponade and TIPS are rescue options.", "explanationSource": "added", "pearl": ""}, {"num": 102, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "A 14-year-old presents with acute liver failure (INR 3.2, encephalopathy grade II), Kayser-Fleischer rings, Coombs-negative haemolytic anaemia, and serum ceruloplasmin 8 mg/dL. What is the MOST appropriate treatment?", "options": ["N-acetylcysteine IV", "D-penicillamine", "Liver transplant evaluation + penicillamine or trientine", "Zinc acetate"], "answer": 2, "explanation": "Acute liver failure from Wilson disease (KF rings, Coombs-negative haemolysis, low ceruloplasmin) usually needs urgent liver transplant evaluation. A high New Wilson Index predicts death without transplant. Chelation (penicillamine/trientine) is started while assessing.", "explanationSource": "added", "pearl": ""}, {"num": 103, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "A child with IBD (Crohn's disease) has failed steroids and azathioprine. He has growth failure. Which biological agent is FIRST-LINE in paediatric Crohn's disease?", "options": ["Vedolizumab", "Ustekinumab", "Infliximab", "Adalimumab"], "answer": 2, "explanation": "Anti-TNF therapy is the first-line biologic for paediatric Crohn's disease, especially with growth failure or perianal disease. Infliximab is the most established, and adalimumab is an accepted alternative. Vedolizumab and ustekinumab are later-line.", "explanationSource": "added", "pearl": ""}, {"num": 104, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "Which statement about functional abdominal pain (Rome IV) in children is CORRECT?", "options": ["Organic cause is found in majority", "ALARM symptoms must be absent for functional diagnosis", "Colonoscopy is mandatory before diagnosis", "It only occurs in adolescents"], "answer": 1, "explanation": "Rome IV functional abdominal pain disorders are positive diagnoses made after appropriate evaluation, provided alarm features (weight loss, GI bleeding, nocturnal pain, persistent vomiting, family IBD) are absent. Organic causes are found in a minority.", "explanationSource": "added", "pearl": ""}, {"num": 105, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "A 2-month-old has conjugated hyperbilirubinaemia. HIDA scan shows no excretion into intestine. Liver biopsy shows periportal fibrosis, bile duct proliferation, and bile plugs. What is the MOST appropriate next step?", "options": ["Genetic testing for PFIC", "Kasai procedure", "ERCP", "Ultrasound-guided cholangiogram"], "answer": 1, "explanation": "Non-excretion on HIDA and a biopsy showing ductular proliferation, bile plugs and portal fibrosis indicate extrahepatic biliary obstruction — biliary atresia. Proceed to intraoperative cholangiogram and Kasai portoenterostomy.", "explanationSource": "added", "pearl": ""}, {"num": 106, "section": 2, "topic": "Gastroenterology & Hepatology", "question": "A 14-year-old girl presents with fatigue, abdominal pain, and jaundice. AST 900, ALT 780, ALP 180, IgG 3.2 g/L. ANA positive (1:640), anti-smooth muscle antibody positive. What is the MOST likely diagnosis?", "options": ["Viral hepatitis A", "Wilson disease", "Autoimmune hepatitis", "Drug-induced liver injury"], "answer": 2, "explanation": "Marked transaminase rise, high-titre ANA and anti-smooth-muscle antibody in an adolescent girl indicates type 1 autoimmune hepatitis. Note: AIH characteristically has raised IgG (>16 g/L); the stem's 'IgG 3.2 g/L' is almost certainly a typo for 32 g/L.", "explanationSource": "added", "pearl": ""}, {"num": 107, "section": 2, "topic": "Haematology & Oncology", "question": "A 2-year-old has Hb 7.2 g/dL, MCV 62 fL, MCH 18 pg, serum ferritin 4 µg/L. Target-cell, pencil cells on smear. Mentzer index is 12. What is the MOST likely diagnosis?", "options": ["Beta-thalassaemia trait", "Iron deficiency anaemia", "Sideroblastic anaemia", "Anaemia of chronic disease"], "answer": 1, "explanation": "Microcytic hypochromic anaemia with ferritin 4 µg/L and pencil cells confirms iron deficiency anaemia; ferritin is the decisive test. Note: a Mentzer index of 12 (<13) would usually favour thalassaemia trait, so the stem is internally inconsistent.", "explanationSource": "added", "pearl": ""}, {"num": 108, "section": 2, "topic": "Haematology & Oncology", "question": "A child has G6PD deficiency and presents with acute haemolytic crisis with Hb of 5.2 g/dL after eating fava beans. What is the MOST appropriate management?", "options": ["Primaquine", "Blood transfusion if Hb <7 g/dL or symptomatic", "Splenectomy", "Hydroxyurea"], "answer": 1, "explanation": "Acute haemolysis in G6PD deficiency: remove the trigger, hydrate, monitor for haemoglobinuria/AKI, and transfuse packed cells for severe anaemia (Hb <7 g/dL) or symptoms. Primaquine is an oxidant trigger.", "explanationSource": "added", "pearl": ""}, {"num": 109, "section": 2, "topic": "Haematology & Oncology", "question": "A child with beta-thalassaemia major has serum ferritin of 3500 µg/L on regular transfusions. Which chelation agent is PREFERRED for subcutaneous infusion at home?", "options": ["Deferoxamine", "Deferasirox", "Deferiprone", "Combined deferasirox + deferiprone"], "answer": 0, "explanation": "Deferoxamine is the parenteral chelator, given as an 8–12-hour subcutaneous infusion via pump at home. Deferasirox and deferiprone are oral.", "explanationSource": "added", "pearl": ""}, {"num": 110, "section": 2, "topic": "Haematology & Oncology", "question": "A 10-year-old with sickle cell disease presents with acute chest syndrome: new infiltrate on CXR, chest pain, fever, and SpO2 88%. What is the IMMEDIATE treatment priority?", "options": ["IV antibiotics + oxygen", "Simple top-up transfusion", "Exchange transfusion + oxygen + IV antibiotics + analgesia", "IV hydroxyurea"], "answer": 2, "explanation": "Acute chest syndrome with SpO2 <90% in SCD requires EXCHANGE transfusion (not simple top-up) to rapidly reduce HbS% to <30%. Simple transfusion (B) may cause hyperviscosity. Oxygen, IV antibiotics (broad-spectrum including atypicals), analgesia, and bronchodilators are adjuncts.", "explanationSource": "source", "pearl": "Exam Pearl: ACS = medical emergency in SCD → Exchange transfusion target HbS <30%."}, {"num": 111, "section": 2, "topic": "Haematology & Oncology", "question": "A 4-year-old has petechiae and bruising, platelet count 8,000/µL, and no hepatosplenomegaly. CBC shows isolated thrombocytopenia. Bone marrow (if done) would show increased megakaryocytes. What is the DIAGNOSIS and FIRST-LINE treatment?", "options": ["ITP — IVIG 0.8–1 g/kg or prednisolone 2 mg/kg/day", "TTP — plasma exchange", "ITP — platelet transfusion", "Aplastic anaemia — cyclosporine"], "answer": 0, "explanation": "Isolated severe thrombocytopenia with petechiae in a well child without organomegaly is immune thrombocytopenia (megakaryocytes increased). With significant bleeding or very low counts, first-line options are IVIG 0.8–1 g/kg or short-course prednisolone. Platelet transfusion is reserved for life-threatening bleeding.", "explanationSource": "added", "pearl": ""}, {"num": 112, "section": 2, "topic": "Haematology & Oncology", "question": "A child with haemophilia A (severe, factor VIII <1%) has acute haemarthrosis of the knee. What is the APPROPRIATE factor VIII dose to give?", "options": ["15 IU/kg", "25 IU/kg", "50 IU/kg", "100 IU/kg"], "answer": 1, "explanation": "Joint bleeds in haemophilia A need factor VIII levels of about 40–60%. Each 1 IU/kg raises the level by about 2%, so roughly 20–30 IU/kg (25 IU/kg) is appropriate. Life-threatening bleeds need 50 IU/kg (target 80–100%).", "explanationSource": "added", "pearl": ""}, {"num": 113, "section": 2, "topic": "Haematology & Oncology", "question": "A sick neonate has prolonged PT, prolonged PTT, low fibrinogen, low platelets, and elevated D-dimer. The MOST likely diagnosis is:", "options": ["ITP", "Haemophilia A", "Disseminated intravascular coagulation", "Vitamin K deficiency"], "answer": 2, "explanation": "Prolonged PT and aPTT with low fibrinogen, thrombocytopenia and raised D-dimer in a sick neonate is DIC (usually sepsis or asphyxia). Vitamin K deficiency has normal fibrinogen and platelets.", "explanationSource": "added", "pearl": ""}, {"num": 114, "section": 2, "topic": "Haematology & Oncology", "question": "A 5-year-old presents with fever, pallor, petechiae, and hepatosplenomegaly. CBC: WBC 85,000/µL (90% blasts), Hb 6.5 g/dL, Plt 18,000/µL. Blasts are CD19+, CD10+, TdT+. What is the MOST likely diagnosis?", "options": ["AML (M3)", "Pre-B ALL", "T-cell ALL", "Burkitt lymphoma"], "answer": 1, "explanation": "Hyperleucocytosis with blasts expressing CD19, CD10 (CALLA) and TdT is B-precursor (pre-B/common) ALL, the commonest childhood leukaemia. T-ALL is CD3/CD7-positive; Burkitt is TdT-negative with surface Ig.", "explanationSource": "added", "pearl": ""}, {"num": 115, "section": 2, "topic": "Haematology & Oncology", "question": "A 12-year-old presents with painless neck lymphadenopathy (firm, non-tender, >2 cm, persisting >6 weeks), fever, night sweats, and weight loss. Biopsy shows Reed-Sternberg cells. What is the diagnosis?", "options": ["Non-Hodgkin lymphoma", "Hodgkin lymphoma (classical)", "EBV infectious mononucleosis", "Tuberculosis lymphadenopathy"], "answer": 1, "explanation": "Painless persistent cervical lymphadenopathy with B symptoms and Re
