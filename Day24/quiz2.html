<script>
const quiz=[{"num": 18, "level": "", "question": "A child has violent unilateral proximal flinging movements after a deep-brain lesion. What is the most appropriate interpretation or next step?", "options": ["Hemiballismus", "Spasticity during rapid stretch", "Typical essential tremor", "Tics with suppressibility as a defining feature"], "answer": 0, "explanation": "Hemiballismus is large-amplitude proximal flinging hyperkinesia. Why not the others (added — not from source): B. Spasticity during rapid stretch — Spasticity is resistance to passive stretch, not spontaneous violent flinging of a limb.; C. Typical essential tremor — Essential tremor is a rhythmic, usually bilateral postural or action tremor, not large-amplitude proximal flinging.; D. Tics with suppressibility as a defining feature — Tics are brief, stereotyped and suppressible with a premonitory urge; violent unilateral proximal flinging after a subthalamic/deep lesion is hemiballismus.", "pearl": "Hemiballismus is large-amplitude proximal flinging hyperkinesia.", "srcAnswer": "A"}, {"num": 19, "level": "", "question": "A 10-year-old has repetitive eye blinking and shoulder jerks preceded by an urge, briefly suppressible. What is the most appropriate interpretation or next step?", "options": ["Spasticity confined to fast stretch", "Epileptic myoclonus necessarily with loss of consciousness", "Athetosis with no urge", "Tic disorder phenotype"], "answer": 3, "explanation": "Premonitory urge and brief voluntary suppression favour tics. Why not the others (added — not from source): A. Spasticity confined to fast stretch — Spasticity is a tone abnormality found on examination, not spontaneous blinking and jerks with a premonitory urge.; B. Epileptic myoclonus necessarily with loss of consciousness — Myoclonic seizures are brief jerks often with preserved awareness, and have no premonitory urge or voluntary suppressibility; urge plus suppressibility defines tics.; C. Athetosis with no urge — Athetosis is slow, continuous writhing, mainly of the hands, without an urge or suppressibility.", "pearl": "Premonitory urge and brief voluntary suppression favour tics.", "srcAnswer": "D"}, {"num": 20, "level": "", "question": "A child exhibits unpredictable, flowing, dance-like movements moving from body part to part. What is the most appropriate interpretation or next step?", "options": ["Sustained stereotyped torsional dystonia only", "Chorea", "Regular oscillatory postural tremor only", "Atonic weakness"], "answer": 1, "explanation": "Chorea is irregular, nonrhythmic, flowing hyperkinesia. Why not the others (added — not from source): A. Sustained stereotyped torsional dystonia only — Dystonia is sustained, patterned twisting; random flowing movements that migrate between body parts are chorea.; C. Regular oscillatory postural tremor only — Tremor is regular and rhythmic; chorea is irregular and unpredictable.; D. Atonic weakness — Atonia is loss of tone, not excessive flowing involuntary movement.", "pearl": "Chorea is irregular, nonrhythmic, flowing hyperkinesia.", "srcAnswer": "B"}, {"num": 21, "level": "", "question": "A toddler with autism has rhythmic hand flapping when excited, interruptible by engagement, starting early in life. What is the most appropriate interpretation or next step?", "options": ["Progressive cerebellar ataxia", "New epileptic spasms are established by excitement alone", "Paroxysmal kinesigenic dyskinesia", "Motor stereotypies"], "answer": 3, "explanation": "Repetitive patterned movements during excitement can represent stereotypies. Why not the others (added — not from source): A. Progressive cerebellar ataxia — Ataxia causes incoordination and gait instability, not rhythmic flapping that stops with engagement.; B. New epileptic spasms are established by excitement alone — Epileptic spasms are brief axial flexor or extensor contractions, often in clusters on waking, with EEG changes; they are not triggered by excitement or stopped by distraction.; C. Paroxysmal kinesigenic dyskinesia — PKD gives brief dystonic or choreic attacks triggered by sudden movement, usually from later childhood, with preserved awareness.", "pearl": "Repetitive patterned movements during excitement can represent stereotypies.", "srcAnswer": "D"}, {"num": 22, "level": "", "question": "A child with GMFCS V coughs with thin liquids and has recurrent chest infections. What is the most appropriate interpretation or next step?", "options": ["Treat cough as spasticity exclusively", "Assume no dysphagia when weight is normal", "Urgent feeding/swallow assessment and aspiration-risk management", "Increase thin liquids without assessment"], "answer": 2, "explanation": "Oropharyngeal dysphagia and silent aspiration are important CP comorbidities. Why not the others (added — not from source): A. Treat cough as spasticity exclusively — Coughing with thin liquids and recurrent chest infections indicates aspiration from oropharyngeal dysphagia.; B. Assume no dysphagia when weight is normal — Normal weight does not exclude unsafe swallowing; silent and overt aspiration occur at any nutritional status.; D. Increase thin liquids without assessment — Thin liquids are the consistency most often aspirated; a swallow assessment is needed before changing consistency.", "pearl": "Oropharyngeal dysphagia and silent aspiration are important CP comorbidities.", "srcAnswer": "C"}, {"num": 23, "level": "", "question": "A 6-year-old with severe dysarthria has good comprehension and cannot reliably express needs. What is the most appropriate interpretation or next step?", "options": ["Defer communication support until independent ambulation", "Introduce augmentative and alternative communication evaluation", "Conclude intellectual disability from absent speech", "Use muscle relaxant as substitute for speech support"], "answer": 1, "explanation": "Expressive motor limitations do not establish cognitive level; AAC supports participation. Why not the others (added — not from source): A. Defer communication support until independent ambulation — Communication support should not wait for motor milestones; AAC should start early.; C. Conclude intellectual disability from absent speech — Severe dysarthria is a motor speech disorder; comprehension is good, so cognition must not be judged from speech output.; D. Use muscle relaxant as substitute for speech support — Muscle relaxants do not improve communication; augmentative and alternative communication is the intervention.", "pearl": "Expressive motor limitations do not establish cognitive level; AAC supports participation.", "srcAnswer": "B"}, {"num": 24, "level": "", "question": "A nonverbal child with CP develops irritability, disturbed sleep and decreased tolerance of seating. What is the most appropriate interpretation or next step?", "options": ["Systematically assess pain, hip, constipation, reflux and other causes", "Assume behavior is purely psychological", "Ignore symptoms without verbal pain score", "Increase tone medication without examining discomfort"], "answer": 0, "explanation": "Behavioural change can be a pain presentation; assess common musculoskeletal and visceral causes. Why not the others (added — not from source): B. Assume behavior is purely psychological — In nonverbal children with CP, irritability and sleep disturbance often signal pain — hip, constipation, reflux, dental or fracture.; C. Ignore symptoms without verbal pain score — Nonverbal children need observational pain tools (e.g. r-FLACC); absent self-report does not mean absent pain.; D. Increase tone medication without examining discomfort — The cause of discomfort must be found first; raising tone medication may sedate without treating hip pain, constipation or reflux.", "pearl": "Behavioural change can be a pain presentation; assess common musculoskeletal and visceral causes.", "srcAnswer": "A"}, {"num": 25, "level": "", "question": "A 5-month infant has strong CP risk markers, but formal motor subtype remains uncertain. What is the most appropriate interpretation or next step?", "options": ["Wait until genetic test is normal before therapy", "Tell family that MRI alone determines lifelong function", "Start targeted family-centred early intervention and repeat standardized evaluation", "Withhold treatment until GMFCS stable at adolescence"], "answer": 2, "explanation": "Early, goal-directed intervention should not be postponed until subtype certainty. Why not the others (added — not from source): A. Wait until genetic test is normal before therapy — Early intervention should not wait for aetiological tests; genetic testing runs alongside therapy.; B. Tell family that MRI alone determines lifelong function — MRI helps predict topography and risk but does not determine individual functional outcome, which is followed with standardised tools.; D. Withhold treatment until GMFCS stable at adolescence — GMFCS is reasonably stable from about 2–5 years; delaying intervention until adolescence loses the window of neuroplasticity.", "pearl": "Early, goal-directed intervention should not be postponed until subtype certainty.", "srcAnswer": "C"}, {"num": 26, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A 9-month-old consistently reaches only with the right hand, with left thumb-in-palm and brisk left reflexes. Which conclusion is best supported?", "options": ["Reassurance until school age", "Diagnosis of simple handedness without examination", "Electromyography as the first investigation", "Urgent assessment for unilateral cerebral palsy with early intervention"], "answer": 3, "explanation": "Early hand preference before age one with abnormal tone is concerning for unilateral CP. Why not the others (added — not from source): A. Reassurance until school age — Clear hand preference before 12 months with abnormal tone and reflexes is a red flag; waiting loses the window for early intervention.; B. Diagnosis of simple handedness without examination — True handedness is not established before about 18–24 months; a fisted thumb-in-palm and brisk reflexes on one side are pathological.; C. Electromyography as the first investigation — EMG assesses nerve and muscle (lower motor neuron) disease; upper motor neuron signs call for clinical neurological assessment and brain MRI first.", "pearl": "Early hand preference before age one with abnormal tone is concerning for unilateral CP.", "srcAnswer": "D"}, {"num": 27, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A 14-week corrected-age ex-preterm infant has absent fidgety general movements and a motor-pathway MRI lesion. Which conclusion is best supported?", "options": ["High risk of cerebral palsy; initiate early intervention", "Normal developmental variation requiring no follow-up", "Wait for walking age before any disclosure", "Definite spinal muscular atrophy based on movements alone"], "answer": 0, "explanation": "Absent fidgety GMs plus supportive MRI strongly predicts CP in high-risk infants. Why not the others (added — not from source): B. Normal developmental variation requiring no follow-up — Absent fidgety general movements are a strong predictor of CP, not a normal variant, especially with a supportive MRI lesion.; C. Wait for walking age before any disclosure — Current guidance recommends early 'high risk of CP' disclosure so family-centred intervention can start during peak neuroplasticity.; D. Definite spinal muscular atrophy based on movements alone — SMA is a lower motor neuron disease with hypotonia, weakness and areflexia, confirmed genetically; absent fidgety movements with a brain lesion point to CP.", "pearl": "Absent fidgety GMs plus supportive MRI strongly predicts CP in high-risk infants.", "srcAnswer": "A"}, {"num": 28, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A high-risk infant aged 9 months corrected has a HINE of 58 and abnormal motor-area MRI. Which conclusion is best supported?", "options": ["HINE can only be used after age 5 years", "High risk for cerebral palsy requiring coordinated follow-up", "HINE score proves normal development", "A normal EEG excludes cerebral palsy"], "answer": 1, "explanation": "HINE below 73 at 6–12 months supports elevated CP risk with clinical context. Why not the others (added — not from source): A. HINE can only be used after age 5 years — The HINE is designed for infants aged roughly 2–24 months; it is one of the main early-detection tools.; C. HINE score proves normal development — A HINE of 58 at 9 months is below the usual optimal cut-off (about 63–73 for this age), so it raises CP risk rather than proving normality.; D. A normal EEG excludes cerebral palsy — EEG assesses seizures and cortical function; CP is a clinical diagnosis supported by motor assessment and neuroimaging, not by EEG.", "pearl": "HINE below 73 at 6–12 months supports elevated CP risk with clinical context.", "srcAnswer": "B"}, {"num": 29, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A 3-year-old previously diagnosed with CP loses previously acquired words and walking skills. Which conclusion is best supported?", "options": ["Focus exclusively on orthoses without evaluation", "Accept regression as expected evolution of static CP", "Diagnose spastic diplegia from regression alone", "Reassess for progressive neurologic or genetic disorder"], "answer": 3, "explanation": "Regression is inconsistent with a nonprogressive underlying brain disturbance. Why not the others (added — not from source): A. Focus exclusively on orthoses without evaluation — Orthoses manage function but do not address a possible progressive disease behind the regression; reassessment comes first.; B. Accept regression as expected evolution of static CP — CP is non-progressive; loss of acquired skills is a red flag for a progressive neurometabolic, neurodegenerative or genetic disorder.; C. Diagnose spastic diplegia from regression alone — Regression is not a feature of any CP subtype and cannot define the motor topography.", "pearl": "Regression is inconsistent with a nonprogressive underlying brain disturbance.", "srcAnswer": "D"}, {"num": 30, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: An ex-27-week child has bilateral leg-predominant hyperreflexia and periventricular white matter injury. Which conclusion is best supported?", "options": ["Flaccid paralysis from anterior horn cell loss", "Pure dystonia from basal ganglia injury", "Spastic diplegia associated with periventricular white-matter injury", "Isolated ataxia from cerebellar vermian lesion"], "answer": 2, "explanation": "Preterm periventricular white matter injury frequently affects descending leg fibres. Why not the others (added — not from source): A. Flaccid paralysis from anterior horn cell loss — Anterior horn cell disease gives hypotonia and areflexia; hyperreflexia indicates an upper motor neuron lesion.; B. Pure dystonia from basal ganglia injury — Dystonia follows deep grey-matter injury; leg-predominant spasticity with periventricular white-matter injury is spastic diplegia.; D. Isolated ataxia from cerebellar vermian lesion — Vermian lesions cause truncal ataxia without hyperreflexia; periventricular white-matter injury causes spastic diplegia.", "pearl": "Preterm periventricular white matter injury frequently affects descending leg fibres.", "srcAnswer": "C"}, {"num": 31, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A term child following severe neonatal encephalopathy develops fluctuating dystonia; MRI shows deep grey injury. Which conclusion is best supported?", "options": ["Congenital myopathy is proven by dystonia", "Isolated spastic diplegia is mandated by deep-grey injury", "Dystonia rules out cerebral palsy", "Dyskinetic cerebral palsy associated with basal ganglia-thalamic injury"], "answer": 3, "explanation": "Deep grey injury after HIE can produce dystonia and mixed motor phenotypes. Why not the others (added — not from source): A. Congenital myopathy is proven by dystonia — Myopathies cause weakness and hypotonia, not dystonia; dystonia after encephalopathy with deep grey injury indicates dyskinetic CP.; B. Isolated spastic diplegia is mandated by deep-grey injury — Deep grey (basal ganglia–thalamic) injury causes dyskinetic CP; spastic diplegia relates to periventricular white-matter injury.; C. Dystonia rules out cerebral palsy — Dyskinetic (dystonic or choreoathetoid) CP is a recognised CP type, typically after basal ganglia–thalamic injury.", "pearl": "Deep grey injury after HIE can produce dystonia and mixed motor phenotypes.", "srcAnswer": "D"}, {"num": 32, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A schoolchild walks indoors using a handheld mobility device and uses wheeled mobility for longer distances. Which conclusion is best supported?", "options": ["GMFCS level II by definition of unaided running", "GMFCS level I", "GMFCS level V regardless of age", "GMFCS level III"], "answer": 3, "explanation": "GMFCS III typically includes handheld device for walking and wheeled mobility for distances. Why not the others (added — not from source): A. GMFCS level II by definition of unaided running — Level II children walk without a hand-held mobility device in most settings; needing a hand-held device indoors is level III.; B. GMFCS level I — Level I children walk without limitation, including outdoors and on stairs, and run and jump.; C. GMFCS level V regardless of age — Level V means transported in a manual wheelchair with very limited head and trunk control; this child walks indoors with a hand-held device.", "pearl": "GMFCS III typically includes handheld device for walking and wheeled mobility for distances.", "srcAnswer": "D"}, {"num": 33, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A 7-year-old has severely limited head-trunk control and requires full assistance for transportation. Which conclusion is best supported?", "options": ["GMFCS level I", "GMFCS level V", "GMFCS level III with independent walking aid", "GMFCS level II"], "answer": 1, "explanation": "GMFCS V denotes severe self-mobility limitation even with assistive technology. Why not the others (added — not from source): A. GMFCS level I — Level I children walk without limitation, including outdoors and on stairs, and run and jump.; C. GMFCS level III with independent walking aid — Level III children walk indoors with a hand-held mobility device; severely limited head and trunk control with full transport assistance is level V.; D. GMFCS level II — Level II children walk in most settings without a hand-held device, which is not compatible with severely limited head and trunk control.", "pearl": "GMFCS V denotes severe self-mobility limitation even with assistive technology.", "srcAnswer": "B"}, {"num": 34, "level": "", "question": "At a multidisciplinary case conference, the following clinical information is presented: A child with CP can handle most everyday objects but needs help preparing or modifying some activities. Which conclusion is best supported?", "options": ["MACS level II", "EDACS level V", "CFCS level V", "GMFCS level II"], "answer": 0, "explanation": "MACS describes manual handling ability, not mobility, speech or eating. Why not the others (added — not from source): B. EDACS level V — EDACS rates eating and drinking safety; level V means unable to eat or drink safely. It does not classify handling objects.; C. CFCS level V — CFCS rates communication, not hand use; level V means communication is seldom effective even with familiar partners.; D. GMFCS level II — Level II children walk in most settings without a hand-held device, which is not compatible with severely limited head and trunk control.", "pearl": "MACS describes manual handling ability, not mobility, speech or eating.", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day24',label:'Day 24',set:'Quiz 2',href:'Day24/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day24_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 24 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 24 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 24'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 24');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day24:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
