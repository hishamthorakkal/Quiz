<script>
const quiz=[{"num": 1, "level": "", "question": "A 9-month-old consistently reaches only with the right hand, with left thumb-in-palm and brisk left reflexes. What is the most appropriate interpretation or next step?", "options": ["Reassurance until school age", "Electromyography as the first investigation", "Urgent assessment for unilateral cerebral palsy with early intervention", "Diagnosis of simple handedness without examination"], "answer": 2, "explanation": "Early hand preference before age one with abnormal tone is concerning for unilateral CP. Why not the others (added — not from source): A. Reassurance until school age — Clear hand preference before 12 months with abnormal tone and reflexes is a red flag; waiting loses the window for early intervention.; B. Electromyography as the first investigation — EMG assesses nerve and muscle (lower motor neuron) disease; upper motor neuron signs call for clinical neurological assessment and brain MRI first.; D. Diagnosis of simple handedness without examination — True handedness is not established before about 18–24 months; a fisted thumb-in-palm and brisk reflexes on one side are pathological.", "pearl": "Early hand preference before age one with abnormal tone is concerning for unilateral CP.", "srcAnswer": "C"}, {"num": 2, "level": "", "question": "A 14-week corrected-age ex-preterm infant has absent fidgety general movements and a motor-pathway MRI lesion. What is the most appropriate interpretation or next step?", "options": ["High risk of cerebral palsy; initiate early intervention", "Definite spinal muscular atrophy based on movements alone", "Normal developmental variation requiring no follow-up", "Wait for walking age before any disclosure"], "answer": 0, "explanation": "Absent fidgety GMs plus supportive MRI strongly predicts CP in high-risk infants. Why not the others (added — not from source): B. Definite spinal muscular atrophy based on movements alone — SMA is a lower motor neuron disease with hypotonia, weakness and areflexia, confirmed genetically; absent fidgety movements with a brain lesion point to CP.; C. Normal developmental variation requiring no follow-up — Absent fidgety general movements are a strong predictor of CP, not a normal variant, especially with a supportive MRI lesion.; D. Wait for walking age before any disclosure — Current guidance recommends early 'high risk of CP' disclosure so family-centred intervention can start during peak neuroplasticity.", "pearl": "Absent fidgety GMs plus supportive MRI strongly predicts CP in high-risk infants.", "srcAnswer": "A"}, {"num": 3, "level": "", "question": "A high-risk infant aged 9 months corrected has a HINE of 58 and abnormal motor-area MRI. What is the most appropriate interpretation or next step?", "options": ["HINE score proves normal development", "High risk for cerebral palsy requiring coordinated follow-up", "HINE can only be used after age 5 years", "A normal EEG excludes cerebral palsy"], "answer": 1, "explanation": "HINE below 73 at 6–12 months supports elevated CP risk with clinical context. Why not the others (added — not from source): A. HINE score proves normal development — A HINE of 58 at 9 months is below the usual optimal cut-off (about 63–73 for this age), so it raises CP risk rather than proving normality.; C. HINE can only be used after age 5 years — The HINE is designed for infants aged roughly 2–24 months; it is one of the main early-detection tools.; D. A normal EEG excludes cerebral palsy — EEG assesses seizures and cortical function; CP is a clinical diagnosis supported by motor assessment and neuroimaging, not by EEG.", "pearl": "HINE below 73 at 6–12 months supports elevated CP risk with clinical context.", "srcAnswer": "B"}, {"num": 4, "level": "", "question": "A 3-year-old previously diagnosed with CP loses previously acquired words and walking skills. What is the most appropriate interpretation or next step?", "options": ["Accept regression as expected evolution of static CP", "Reassess for progressive neurologic or genetic disorder", "Diagnose spastic diplegia from regression alone", "Focus exclusively on orthoses without evaluation"], "answer": 1, "explanation": "Regression is inconsistent with a nonprogressive underlying brain disturbance. Why not the others (added — not from source): A. Accept regression as expected evolution of static CP — CP is non-progressive; loss of acquired skills is a red flag for a progressive neurometabolic, neurodegenerative or genetic disorder.; C. Diagnose spastic diplegia from regression alone — Regression is not a feature of any CP subtype and cannot define the motor topography.; D. Focus exclusively on orthoses without evaluation — Orthoses manage function but do not address a possible progressive disease behind the regression; reassessment comes first.", "pearl": "Regression is inconsistent with a nonprogressive underlying brain disturbance.", "srcAnswer": "B"}, {"num": 5, "level": "", "question": "An ex-27-week child has bilateral leg-predominant hyperreflexia and periventricular white matter injury. What is the most appropriate interpretation or next step?", "options": ["Pure dystonia from basal ganglia injury", "Spastic diplegia associated with periventricular white-matter injury", "Flaccid paralysis from anterior horn cell loss", "Isolated ataxia from cerebellar vermian lesion"], "answer": 1, "explanation": "Preterm periventricular white matter injury frequently affects descending leg fibres. Why not the others (added — not from source): A. Pure dystonia from basal ganglia injury — Dystonia follows deep grey-matter injury; leg-predominant spasticity with periventricular white-matter injury is spastic diplegia.; C. Flaccid paralysis from anterior horn cell loss — Anterior horn cell disease gives hypotonia and areflexia; hyperreflexia indicates an upper motor neuron lesion.; D. Isolated ataxia from cerebellar vermian lesion — Vermian lesions cause truncal ataxia without hyperreflexia; periventricular white-matter injury causes spastic diplegia.", "pearl": "Preterm periventricular white matter injury frequently affects descending leg fibres.", "srcAnswer": "B"}, {"num": 6, "level": "", "question": "A term child following severe neonatal encephalopathy develops fluctuating dystonia; MRI shows deep grey injury. What is the most appropriate interpretation or next step?", "options": ["Dyskinetic cerebral palsy associated with basal ganglia-thalamic injury", "Dystonia rules out cerebral palsy", "Isolated spastic diplegia is mandated by deep-grey injury", "Congenital myopathy is proven by dystonia"], "answer": 0, "explanation": "Deep grey injury after HIE can produce dystonia and mixed motor phenotypes. Why not the others (added — not from source): B. Dystonia rules out cerebral palsy — Dyskinetic (dystonic or choreoathetoid) CP is a recognised CP type, typically after basal ganglia–thalamic injury.; C. Isolated spastic diplegia is mandated by deep-grey injury — Deep grey (basal ganglia–thalamic) injury causes dyskinetic CP; spastic diplegia relates to periventricular white-matter injury.; D. Congenital myopathy is proven by dystonia — Myopathies cause weakness and hypotonia, not dystonia; dystonia after encephalopathy with deep grey injury indicates dyskinetic CP.", "pearl": "Deep grey injury after HIE can produce dystonia and mixed motor phenotypes.", "srcAnswer": "A"}, {"num": 7, "level": "", "question": "A schoolchild walks indoors using a handheld mobility device and uses wheeled mobility for longer distances. What is the most appropriate interpretation or next step?", "options": ["GMFCS level III", "GMFCS level V regardless of age", "GMFCS level I", "GMFCS level II by definition of unaided running"], "answer": 0, "explanation": "GMFCS III typically includes handheld device for walking and wheeled mobility for distances. Why not the others (added — not from source): B. GMFCS level V regardless of age — Level V means transported in a manual wheelchair with very limited head and trunk control; this child walks indoors with a hand-held device.; C. GMFCS level I — Level I children walk without limitation, including outdoors and on stairs, and run and jump.; D. GMFCS level II by definition of unaided running — Level II children walk without a hand-held mobility device in most settings; needing a hand-held device indoors is level III.", "pearl": "GMFCS III typically includes handheld device for walking and wheeled mobility for distances.", "srcAnswer": "A"}, {"num": 8, "level": "", "question": "A 7-year-old has severely limited head-trunk control and requires full assistance for transportation. What is the most appropriate interpretation or next step?", "options": ["GMFCS level V", "GMFCS level II", "GMFCS level III with independent walking aid", "GMFCS level I"], "answer": 0, "explanation": "GMFCS V denotes severe self-mobility limitation even with assistive technology. Why not the others (added — not from source): B. GMFCS level II — Level II children walk in most settings without a hand-held device, which is not compatible with severely limited head and trunk control.; C. GMFCS level III with independent walking aid — Level III children walk indoors with a hand-held mobility device; severely limited head and trunk control with full transport assistance is level V.; D. GMFCS level I — Level I children walk without limitation, including outdoors and on stairs, and run and jump.", "pearl": "GMFCS V denotes severe self-mobility limitation even with assistive technology.", "srcAnswer": "A"}, {"num": 9, "level": "", "question": "A child with CP can handle most everyday objects but needs help preparing or modifying some activities. What is the most appropriate interpretation or next step?", "options": ["CFCS level V", "EDACS level V", "MACS level II", "GMFCS level II"], "answer": 2, "explanation": "MACS describes manual handling ability, not mobility, speech or eating. Why not the others (added — not from source): A. CFCS level V — CFCS rates communication, not hand use; level V means communication is seldom effective even with familiar partners.; B. EDACS level V — EDACS rates eating and drinking safety; level V means unable to eat or drink safely. It does not classify handling objects.; D. GMFCS level II — Level II children walk in most settings without a hand-held device, which is not compatible with severely limited head and trunk control.", "pearl": "MACS describes manual handling ability, not mobility, speech or eating.", "srcAnswer": "C"}, {"num": 10, "level": "", "question": "A child communicates effectively with familiar partners but inconsistently with unfamiliar partners. What is the most appropriate interpretation or next step?", "options": ["Assess communication using CFCS alongside motor scales", "Assign GMFCS level from conversational fluency", "Use MACS as a language impairment score", "Use hip migration percentage for language assessment"], "answer": 0, "explanation": "CFCS assesses effectiveness of sending/receiving communication with partners. Why not the others (added — not from source): B. Assign GMFCS level from conversational fluency — GMFCS classifies gross motor function and mobility only; it says nothing about communication.; C. Use MACS as a language impairment score — MACS classifies how a child handles objects in daily activities; communication is classified with CFCS.; D. Use hip migration percentage for language assessment — Reimers migration percentage measures lateral hip displacement on X-ray; it has no role in communication.", "pearl": "CFCS assesses effectiveness of sending/receiving communication with partners.", "srcAnswer": "A"}, {"num": 11, "level": "", "question": "A nonambulant child with spastic CP develops decreasing hip abduction, pain and asymmetry. What is the most appropriate interpretation or next step?", "options": ["Arrange pelvic radiographic hip surveillance and specialist review", "Treat hip displacement using antiepileptic medication alone", "Stop routine examination because GMFCS is stable", "Wait for complete dislocation before imaging"], "answer": 0, "explanation": "Hip surveillance depends on risk and clinical findings; pain and limited abduction require assessment. Why not the others (added — not from source): B. Treat hip displacement using antiepileptic medication alone — Hip displacement is a mechanical, progressive problem needing radiographic surveillance and orthopaedic management; antiseizure drugs do not affect it.; C. Stop routine examination because GMFCS is stable — Hip displacement risk rises with GMFCS level and continues through growth; surveillance continues even when motor level is stable.; D. Wait for complete dislocation before imaging — Surveillance aims to detect migration early, while preventive soft-tissue or reconstructive surgery can still avoid painful dislocation.", "pearl": "Hip surveillance depends on risk and clinical findings; pain and limited abduction require assessment.", "srcAnswer": "A"}, {"num": 12, "level": "", "question": "A pelvic image shows lateral femoral-head displacement; surgeon requests standardized risk measurement. What is the most appropriate interpretation or next step?", "options": ["Cobb scoliosis angle", "Tönnis angle as the only CP surveillance metric", "Reimers migration percentage", "Bone age by Greulich–Pyle"], "answer": 2, "explanation": "Migration percentage quantifies the fraction of femoral head lateral to Perkins line. Why not the others (added — not from source): A. Cobb scoliosis angle — The Cobb angle measures spinal curvature, not hip displacement.; B. Tönnis angle as the only CP surveillance metric — The Tönnis (acetabular) angle describes acetabular dysplasia; CP hip surveillance uses Reimers migration percentage.; D. Bone age by Greulich–Pyle — Bone age estimates skeletal maturity from a hand X-ray; it does not quantify hip displacement.", "pearl": "Migration percentage quantifies the fraction of femoral head lateral to Perkins line.", "srcAnswer": "C"}, {"num": 13, "level": "", "question": "An ambulant child has focal gastrocnemius overactivity causing dynamic equinus without fixed contracture. What is the most appropriate interpretation or next step?", "options": ["Use intrathecal baclofen as mandatory first-line focal therapy", "Perform irreversible multilevel surgery immediately in all cases", "Consider targeted botulinum toxin A with goal-focused therapy", "Use levodopa as sole established treatment of spasticity"], "answer": 2, "explanation": "Focal dynamic spasticity can benefit from localized treatment within rehabilitation. Why not the others (added — not from source): A. Use intrathecal baclofen as mandatory first-line focal therapy — Intrathecal baclofen is for severe generalised spasticity or dystonia; focal dynamic overactivity is treated with targeted botulinum toxin.; B. Perform irreversible multilevel surgery immediately in all cases — Without fixed contracture, dynamic equinus is managed with tone reduction and therapy; surgery is for fixed deformity, usually later.; D. Use levodopa as sole established treatment of spasticity — Levodopa is used for dopa-responsive dystonia; it is not an established spasticity treatment.", "pearl": "Focal dynamic spasticity can benefit from localized treatment within rehabilitation.", "srcAnswer": "C"}, {"num": 14, "level": "", "question": "A child has persistent loss of ankle dorsiflexion during slow passive stretch and examination under relaxation. What is the most appropriate interpretation or next step?", "options": ["Escalate only anticholinergic for range restriction", "Treat as chorea without examination", "Assess fixed contracture and orthopaedic/rehabilitation options", "Assume all restriction is dynamic spasticity"], "answer": 2, "explanation": "Structural shortening must be distinguished from velocity-dependent dynamic tone. Why not the others (added — not from source): A. Escalate only anticholinergic for range restriction — Anticholinergics such as trihexyphenidyl treat dystonia; they cannot restore range lost to fixed contracture.; B. Treat as chorea without examination — Chorea is an involuntary hyperkinetic movement; loss of range on slow stretch under relaxation is a contracture and needs examination.; D. Assume all restriction is dynamic spasticity — Restriction persisting on slow stretch and under relaxation is fixed contracture, not velocity-dependent spasticity.", "pearl": "Structural shortening must be distinguished from velocity-dependent dynamic tone.", "srcAnswer": "C"}, {"num": 15, "level": "", "question": "A child has increased resistance to faster passive elbow extension, with clasp-knife phenomenon. What is the most appropriate interpretation or next step?", "options": ["Action-specific dystonic posturing only", "Constant rigidity independent of movement velocity", "Velocity-dependent stretch reflex hyperexcitability", "Pure weakness without reflex change"], "answer": 2, "explanation": "Spasticity is velocity-dependent resistance associated with upper motor neuron syndrome. Why not the others (added — not from source): A. Action-specific dystonic posturing only — Dystonia is patterned posturing triggered by action; velocity-dependent catch with clasp-knife release is spasticity.; B. Constant rigidity independent of movement velocity — Rigidity is velocity-independent (lead-pipe or cogwheel); resistance that increases with speed and gives way is spasticity.; D. Pure weakness without reflex change — Weakness alone does not cause increased resistance; velocity-dependent resistance with clasp-knife reflects stretch-reflex hyperexcitability.", "pearl": "Spasticity is velocity-dependent resistance associated with upper motor neuron syndrome.", "srcAnswer": "C"}, {"num": 16, "level": "", "question": "A child develops twisting posture triggered by voluntary reaching, with fluctuating tone and overflow. What is the most appropriate interpretation or next step?", "options": ["Isolated pyramidal weakness", "Dystonia with patterned involuntary muscle contractions", "Physiological tremor without posturing", "Cerebellar hypotonia without abnormal movement"], "answer": 1, "explanation": "Dystonia produces intermittent or sustained twisting patterned postures, often action-provoked. Why not the others (added — not from source): A. Isolated pyramidal weakness — Pyramidal lesions cause weakness and velocity-dependent spasticity, not twisting postures triggered by voluntary movement.; C. Physiological tremor without posturing — Tremor is a rhythmic oscillation; twisting postures with overflow and fluctuating tone are dystonia.; D. Cerebellar hypotonia without abnormal movement — Cerebellar lesions cause hypotonia and ataxia, not patterned twisting postures with overflow.", "pearl": "Dystonia produces intermittent or sustained twisting patterned postures, often action-provoked.", "srcAnswer": "B"}, {"num": 17, "level": "", "question": "A child has a wide-based gait, dysmetria and intention tremor but no pronounced hyperreflexia. What is the most appropriate interpretation or next step?", "options": ["Pure spastic hemiplegia", "Ataxic motor phenotype with cerebellar-system involvement", "Generalized rigidity", "Isolated lower motor-neuron paralysis"], "answer": 1, "explanation": "Dysmetria and intention tremor suggest cerebellar dysfunction. Why not the others (added — not from source): A. Pure spastic hemiplegia — Hemiplegia gives unilateral weakness and hyperreflexia; dysmetria, intention tremor and a wide-based gait are cerebellar.; C. Generalized rigidity — Rigidity is velocity-independent increased tone (extrapyramidal); this child has cerebellar signs without increased tone.; D. Isolated lower motor-neuron paralysis — Lower motor neuron disease gives weakness, wasting and areflexia, not dysmetria and intention tremor.", "pearl": "Dysmetria and intention tremor suggest cerebellar dysfunction.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day24',label:'Day 24',set:'Quiz 1',href:'Day24/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day24_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 24 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 24 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 24'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 24');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day24:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
