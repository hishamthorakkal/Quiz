@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "", "question": "A girl with short stature, webbed neck and neonatal hand/foot lymphedema later develops hypertension. Which associated cardiovascular lesion is especially important to assess?", "options": ["Coarctation of aorta", "Supravalvar aortic stenosis", "Complete AVSD", "Truncus arteriosus"], "answer": 0, "explanation": "Turner surveillance includes cardiac imaging and blood pressure monitoring. Trap: Short stature plus lymphedema points to a sex-chromosome disorder. Why not the others: B. Supravalvar aortic stenosis — Suggests Williams syndrome.; C. Complete AVSD — More strongly associated with trisomy 21.; D. Truncus arteriosus — Classically associated with 22q11.2 deletion.", "pearl": "", "srcAnswer": "A"}, {"num": 19, "level": "", "question": "A girl with Turner syndrome has Y-chromosomal material detected on molecular testing. What additional clinical risk changes counselling?", "options": ["Retinoblastoma from RB1 loss", "Gonadoblastoma in dysgenetic gonads", "Acute leukemia from GATA1 variants", "Neuroblastoma from MYCN amplification"], "answer": 1, "explanation": "Y material in Turner syndrome warrants individualized multidisciplinary gonadal risk management. Trap: A routine 45,X label may miss clinically relevant mosaicism. Why not the others: A. Retinoblastoma from RB1 loss — Not the characteristic gonadal risk.; C. Acute leukemia from GATA1 variants — A Down syndrome–associated hematologic risk.; D. Neuroblastoma from MYCN amplification — Not specifically driven by Y material in Turner syndrome.", "pearl": "", "srcAnswer": "B"}, {"num": 20, "level": "", "question": "A 3-year-old boy has calf pseudohypertrophy, a Gowers sign and CK 15,000 U/L. Which first genetic test has the highest yield?", "options": ["Dystrophin (DMD) deletion/duplication analysis, then sequencing if negative", "CMA only, since it finds all single-nucleotide variants", "Methylation analysis of the SNRPN locus on 15q11.2-q13", "FMR1 repeat analysis, because a repeat expansion causes this X-linked myopathy"], "answer": 0, "explanation": "Duchenne muscular dystrophy is X-linked recessive. About two thirds of cases are exonic deletions or duplications, detected by MLPA or array, so test these first and sequence if negative. About a third are de novo; counselling must cover the mother’s carrier status. Trap: Normal-looking family history does not exclude X-linked disease; a mother may be a carrier or germline mosaic.", "pearl": "", "srcAnswer": "A"}, {"num": 21, "level": "", "question": "At 36 weeks PMA, a preterm infant meeting the definition of BPD is supported with nasal high-flow oxygen at 3 L/min and no invasive ventilation. Under the Jensen 2019 support-based classification, what grade applies?", "options": ["Grade 3", "Grade 1", "Grade 2", "No BPD"], "answer": 2, "explanation": "Jensen 2019 classification is based on respiratory support at 36 weeks PMA; >2 L/min falls into Grade 2. Trap: Do not confuse flow-based Jensen grading with older oxygen-percentage-based severity. Why not the others: A. Grade 3 — Grade 3 requires invasive mechanical ventilation.; B. Grade 1 — Grade 1 corresponds to nasal cannula flow <=2 L/min.; D. No BPD — The premise states BPD and current respiratory support at 36 weeks PMA.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 8"}}, {"num": 22, "level": "", "question": "An adolescent boy is tall with small firm testes, gynecomastia and elevated FSH/LH. Which finding best supports the likely diagnosis?", "options": ["Low LH/FSH with 45,X, causing delayed puberty and short stature", "Hypergonadotropic hypogonadism with 47,XXY", "Elevated testosterone with 47,XYY and large testes", "Low cortisol with 22q11.2 deletion and a conotruncal defect"], "answer": 1, "explanation": "Klinefelter often presents at puberty with infertility and small testes. Trap: Gonadotropin direction localizes primary versus central hypogonadism. Why not the others: A. Low LH/FSH with 45,X, causing delayed puberty and short stature — Turner has different phenotype and gonadal pattern.; C. Elevated testosterone with 47,XYY and large testes — XYY usually does not cause this typical testicular failure pattern.; D. Low cortisol with 22q11.2 deletion and a conotruncal defect — Not the endocrine signature here.", "pearl": "", "srcAnswer": "B"}, {"num": 23, "level": "", "question": "A neonate with truncus arteriosus, hypocalcemic seizures, absent thymic shadow and palatal dysfunction most likely has which genetic lesion?", "options": ["15q11 paternal deletion", "7q11.23 deletion", "5p deletion", "22q11.2 deletion"], "answer": 3, "explanation": "22q11.2 syndrome spans cardiac, immune, palatal and calcium abnormalities. Trap: Do not equate thymic shadow absence with uniformly complete T-cell aplasia. Why not the others: A. 15q11 paternal deletion — Prader-Willi hypotonia/feeding phenotype.; B. 7q11.23 deletion — Williams syndrome has elastin arteriopathy.; C. 5p deletion — Cri-du-chat phenotype rather than conotruncal-immune-endocrine triad.", "pearl": "", "srcAnswer": "D"}, {"num": 24, "level": "", "question": "An infant with confirmed 22q11.2 deletion has severe T-cell lymphopenia. Which preventive action is most appropriate pending specialist immune evaluation?", "options": ["Give all live vaccines on routine schedule regardless of immune phenotype", "Prescribe lifelong broad-spectrum antibiotics to every child", "Avoid all inactivated vaccines permanently", "Assess T-cell subsets/function before live-vaccine decisions"], "answer": 3, "explanation": "Live-vaccine safety in 22q11.2 depends on actual immune competence. Trap: A microdeletion diagnosis alone does not specify immune severity. Why not the others: A. Give all live vaccines on routine schedule regardless of immune phenotype — Severe T-cell deficiency may contraindicate live vaccines.; B. Prescribe lifelong broad-spectrum antibiotics to every child — Not all patients have severe immunodeficiency or need prophylaxis.; C. Avoid all inactivated vaccines permanently — Inactivated vaccines may be used; response and immune status need assessment.", "pearl": "", "srcAnswer": "D"}, {"num": 25, "level": "", "question": "A preschool child has distinctive facies, marked sociability, poor visuospatial skills, hypercalcemia and a systolic murmur. Which cardiac lesion best fits?", "options": ["Supravalvar aortic stenosis", "Coarctation of aorta", "AV septal defect", "Tetralogy of Fallot"], "answer": 0, "explanation": "Williams syndrome is a 7q11.23 deletion with supravalvar aortic stenosis. Trap: Check blood pressure in multiple limbs and arterial disease beyond the valve. Why not the others: B. Coarctation of aorta — More characteristic of Turner syndrome.; C. AV septal defect — More characteristic of trisomy 21.; D. Tetralogy of Fallot — May occur in 22q11.2 deletion.", "pearl": "", "srcAnswer": "A"}, {"num": 26, "level": "", "question": "A child with Williams syndrome is scheduled for anesthesia. Which associated feature deserves special preoperative attention?", "options": ["Progressive cardiomyopathy from glycogen deposition in myocytes", "Absent thymus and profound T-cell deficiency needing transplantation", "Obligate severe neutropenia needing prophylactic antibiotics", "Coronary and arterial stenosis with vulnerability"], "answer": 3, "explanation": "Williams cardiovascular assessment must consider supravalvar and coronary arterial disease. Trap: Syndrome recognition can change peri-anesthetic risk. Why not the others: A. Progressive cardiomyopathy from glycogen deposition in myocytes — Suggests Pompe disease.; B. Absent thymus and profound T-cell deficiency needing transplantation — More characteristic of complete DiGeorge phenotype.; C. Obligate severe neutropenia needing prophylactic antibiotics — Not a characteristic universal Williams feature.", "pearl": "", "srcAnswer": "D"}, {"num": 27, "level": "", "question": "A floppy neonate has poor suck and genital hypoplasia; at school age hyperphagia and obesity emerge. What molecular mechanism best fits?", "options": ["Loss of paternally expressed 15q11.2-q13 genes", "4p deletion", "7q11.23 deletion", "Maternal UBE3A loss"], "answer": 0, "explanation": "Prader-Willi phenotype evolves from neonatal feeding difficulty to hyperphagia. Trap: Age-dependent phenotype can hide a genetic diagnosis early. Why not the others: B. 4p deletion — Wolf-Hirschhorn syndrome with seizures/growth failure.; C. 7q11.23 deletion — Williams syndrome with elastin arteriopathy.; D. Maternal UBE3A loss — Classically Angelman phenotype.", "pearl": "", "srcAnswer": "A"}, {"num": 28, "level": "", "question": "A 3-year-old has severe language impairment, microcephaly, ataxic gait, frequent laughter and epilepsy. Which pathogenesis is most likely?", "options": ["Maternal UPD of chromosome 15, giving a Prader-Willi pattern", "Trisomy 21 with a mosaic cell line in the brain", "Paternal 15q gene-expression loss in the hypothalamus", "Loss of maternal neuronal UBE3A"], "answer": 3, "explanation": "Angelman often has severe speech impairment disproportionate to social engagement. Trap: Parent of origin distinguishes two chromosome-15 syndromes. Why not the others: A. Maternal UPD of chromosome 15, giving a Prader-Willi pattern — Usually Prader-Willi, not Angelman.; C. Paternal 15q gene-expression loss in the hypothalamus — Leads to Prader-Willi syndrome.", "pearl": "", "srcAnswer": "D"}, {"num": 29, "level": "", "question": "An infant has a high-pitched cat-like cry, microcephaly and growth failure. Which chromosomal lesion is classically implicated?", "options": ["22q11.2 deletion", "5p deletion", "7q11.23 deletion", "4p deletion"], "answer": 1, "explanation": "The distinctive neonatal cry is a classic clue to 5p deletion. Trap: Pair recognizable features with correct deletion region. Why not the others: A. 22q11.2 deletion — DiGeorge/velocardiofacial phenotype.; C. 7q11.23 deletion — Williams syndrome.; D. 4p deletion — Wolf-Hirschhorn syndrome.", "pearl": "", "srcAnswer": "B"}, {"num": 30, "level": "", "question": "A neonate has microcephaly, holoprosencephaly, cleft lip and palate, postaxial polydactyly and scalp skin defects. Which chromosomal diagnosis is most likely?", "options": ["Trisomy 18 (Edwards syndrome)", "Trisomy 13 (Patau syndrome)", "Trisomy 21", "Monosomy X (Turner syndrome)"], "answer": 1, "explanation": "Midline brain and facial defects (holoprosencephaly, cleft lip/palate), postaxial polydactyly, scalp cutis aplasia and microphthalmia point to trisomy 13. Trisomy 18 shows clenched overlapping fingers, rocker-bottom feet and a small jaw. Both carry high early mortality. Trap: Do not confuse the clenched-fist, rocker-bottom phenotype of trisomy 18 with the midline and polydactyly picture of trisomy 13.", "pearl": "", "srcAnswer": "B"}, {"num": 31, "level": "", "question": "A child has profound growth restriction, microcephaly, seizures and a Greek-warrior-helmet facial gestalt. Which deletion is most consistent?", "options": ["5p deletion", "4p deletion", "15q11.2 paternal deletion", "7q11.23 deletion"], "answer": 1, "explanation": "Wolf-Hirschhorn combines severe growth failure, epilepsy and characteristic facial gestalt. Trap: Differentiate 4p from 5p microdeletion patterns. Why not the others: A. 5p deletion — Cri-du-chat syndrome.; C. 15q11.2 paternal deletion — Prader-Willi syndrome.; D. 7q11.23 deletion — Williams syndrome.", "pearl": "", "srcAnswer": "B"}, {"num": 32, "level": "", "question": "An infant has macroglossia, omphalocele, neonatal hypoglycemia and asymmetric overgrowth. Which underlying syndrome warrants tumour surveillance discussion?", "options": ["Turner syndrome", "Angelman syndrome", "Prader-Willi syndrome", "Beckwith-Wiedemann spectrum"], "answer": 3, "explanation": "Beckwith-Wiedemann spectrum involves 11p15 imprinting abnormalities and Wilms/hepatoblastoma risk. Trap: Tumour screening protocols vary by jurisdiction and molecular subtype. Why not the others: A. Turner syndrome — Short stature and gonadal dysgenesis.; B. Angelman syndrome — Ataxia and severe speech impairment, not overgrowth.; C. Prader-Willi syndrome — Neonatal hypotonia and later hyperphagia, not lateralized overgrowth.", "pearl": "", "srcAnswer": "D"}, {"num": 33, "level": "", "question": "A child has hypertelorism, short stature, pectus deformity and dysplastic pulmonary valve stenosis. Which syndrome is most likely?", "options": ["Down syndrome", "Noonan syndrome", "Williams syndrome", "Turner syndrome"], "answer": 1, "explanation": "Noonan syndrome is a RAS/MAPK pathway disorder; cardiac disease may include HCM. Trap: Noonan can occur in either sex; Turner is a sex-chromosome disorder. Why not the others: A. Down syndrome — AVSD and hypotonia are more typical.; C. Williams syndrome — Elastin-related supravalvar aortic stenosis is typical.; D. Turner syndrome — Coarctation/bicuspid aortic valve more typical; phenotype differs.", "pearl": "", "srcAnswer": "B"}, {"num": 34, "level": "", "question": "A child with severe developmental delay, coloboma, choanal atresia and ear anomalies is evaluated. Which diagnosis is most likely?", "options": ["22q11.2 deletion syndrome", "Williams syndrome", "CHARGE syndrome", "Kabuki syndrome"], "answer": 2, "explanation": "CHARGE is often related to CHD7 variants; phenotype guides sequencing. Trap: Do not let one overlapping heart defect obscure the whole anomaly pattern. Why not the others: A. 22q11.2 deletion syndrome — Can involve ear/palatal/cardiac anomalies but choanal atresia plus coloboma suggests another syndrome.; B. Williams syndrome — Elastin arteriopathy and distinctive cognitive profile.; D. Kabuki syndrome — Postnatal growth failure and long palpebral fissures; coloboma/choanal atresia not defining combination.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day15',label:'Day 15',set:'Quiz 2',href:'Day15/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day15_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 15 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 15 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 15'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 15');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day15:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
