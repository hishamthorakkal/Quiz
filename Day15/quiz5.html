<script>
const quiz=[{"num": 69, "level": "", "question": "A child has hepatosplenomegaly, anemia, thrombocytopenia and bone pain but no primary neurodegeneration. Which storage disorder is most likely?", "options": ["Fabry disease", "MPS I", "Gaucher disease type 1", "Niemann-Pick C"], "answer": 2, "explanation": "Gaucher type 1 classically lacks primary neuronopathic disease. Trap: Bone crises and cytopenias can distinguish Gaucher from other storage syndromes. Why not the others: A. Fabry disease — Neuropathic pain and angiokeratomas, usually later.; B. MPS I — Coarse facies, corneal clouding and skeletal dysostosis.; D. Niemann-Pick C — Often vertical supranuclear gaze palsy and neurodegeneration.", "pearl": "", "srcAnswer": "C"}, {"num": 70, "level": "", "question": "A 10-day-old with ambiguous genitalia and 46,XX karyotype has vomiting, Na 120 mmol/L, K 7.0 mmol/L and glucose 40 mg/dL. Which management is correct?", "options": ["Oral salt supplements and observation, with a repeat sodium after 12 hours", "Fludrocortisone alone, with the cortisol level taken the following day", "Immediate IV isotonic saline, dextrose and hydrocortisone; draw 17-OHP first only if this does not delay care", "Immediate exploration to find a gonadal tumour producing androgens"], "answer": 2, "explanation": "Salt-wasting 21-hydroxylase deficiency (CAH) presents at 1–3 weeks with hyponatraemia, hyperkalaemia and hypoglycaemia; XX infants are virilised. Treat the adrenal crisis first (saline, dextrose, hydrocortisone), draw 17-OHP and other diagnostic bloods before steroids only if immediately feasible; never delay resuscitation or hydrocortisone, and confirm later. Newborn screening uses 17-OHP and varies by programme. Trap: Do not delay steroids for confirmatory tests; do not mistake the electrolyte pattern for sepsis alone.", "pearl": "", "srcAnswer": "C"}, {"num": 71, "level": "", "question": "A school-age child has progressive ataxia, splenomegaly and impaired vertical saccades. Which disorder best explains the eye-movement finding?", "options": ["Niemann-Pick disease type C", "Fabry disease", "MPS II", "Gaucher type 1"], "answer": 0, "explanation": "NPC causes defective intracellular cholesterol/lipid trafficking with neurovisceral disease. Trap: Vertical gaze palsy is not a generic finding of all storage disorders. Why not the others: B. Fabry disease — Angiokeratoma, acroparesthesia and renal/cardiac disease dominate.; C. MPS II — Coarse facies and skeletal changes are more characteristic.; D. Gaucher type 1 — No typical vertical supranuclear gaze palsy.", "pearl": "", "srcAnswer": "A"}, {"num": 72, "level": "", "question": "A boy has coarse facies, hepatosplenomegaly, joint contractures and developmental regression, but clear corneas on slit-lamp examination. Which MPS is classically associated?", "options": ["MPS I (Hurler)", "MPS II (Hunter)", "MPS VI (Maroteaux-Lamy)", "MPS IV (Morquio)"], "answer": 1, "explanation": "Absence of prominent clouding supports Hunter but is not an absolute exclusion of other MPS. Trap: The exam discriminator is relative corneal involvement, not an impossible binary. Why not the others: A. MPS I (Hurler) — Prominent corneal clouding is common.; C. MPS VI (Maroteaux-Lamy) — Corneal clouding is frequent.; D. MPS IV (Morquio) — Corneal and skeletal manifestations differ; no typical regression pattern.", "pearl": "", "srcAnswer": "B"}, {"num": 73, "level": "", "question": "A child has coarse facies, developmental decline, hepatosplenomegaly, corneal clouding and dysostosis multiplex. Which enzyme deficiency best fits severe MPS I?", "options": ["Arylsulfatase A", "Iduronate-2-sulfatase", "Beta-glucocerebrosidase", "Alpha-L-iduronidase"], "answer": 3, "explanation": "MPS I severe form can have neurocognitive decline and clouded corneas. Trap: Distinguish lysosomal enzymes by accumulated substrate and phenotype. Why not the others: A. Arylsulfatase A — Metachromatic leukodystrophy, with white matter disease.; B. Iduronate-2-sulfatase — MPS II (Hunter), usually X-linked.; C. Beta-glucocerebrosidase — Gaucher disease.", "pearl": "", "srcAnswer": "D"}, {"num": 74, "level": "", "question": "A neonate has severe hypotonia, liver dysfunction, seizures, sensorineural deficits and elevated very-long-chain fatty acids. Which organelle defect is most likely?", "options": ["Urea-cycle defect", "Peroxisome biogenesis disorder (Zellweger spectrum)", "Mitochondrial pyruvate transport defect", "Lysosomal hydrolase defect"], "answer": 1, "explanation": "Zellweger spectrum affects multiple peroxisomal pathways and causes severe neonatal multisystem disease. Trap: VLCFA elevation directs testing toward peroxisomal disease. Why not the others: A. Urea-cycle defect — Primary hyperammonemia without elevated VLCFA signature.; C. Mitochondrial pyruvate transport defect — May cause lactic acidosis but not the classic VLCFA signature.; D. Lysosomal hydrolase defect — Typically substrate-specific storage patterns.", "pearl": "", "srcAnswer": "B"}, {"num": 75, "level": "", "question": "An 8-year-old boy has declining school performance, adrenal insufficiency and progressive cerebral white-matter disease. Which metabolic disorder is most likely?", "options": ["Gaucher type 1", "MPS I", "X-linked adrenoleukodystrophy", "MCAD deficiency"], "answer": 2, "explanation": "X-ALD may first present with adrenal insufficiency before neurologic decline. Trap: Adrenal signs in a boy with leukodystrophy are a diagnostic red flag. Why not the others: A. Gaucher type 1 — Visceral/bone disease without this adrenal-cerebral pattern.; B. MPS I — Coarse facies and corneal clouding more characteristic.; D. MCAD deficiency — Episodic fasting hypoglycemia rather than progressive demyelination.", "pearl": "", "srcAnswer": "C"}, {"num": 76, "level": "", "question": "An infant has seizures, eczema-like dermatitis, alopecia and metabolic acidosis. Which treatable enzyme defect should be considered promptly?", "options": ["G6PD deficiency", "GALT deficiency", "Ornithine transcarbamylase deficiency", "Biotinidase deficiency"], "answer": 3, "explanation": "Biotinidase deficiency is a high-value treatable metabolic mimic of epilepsy. Trap: Empiric biotin may be urgent under specialist guidance while testing proceeds. Why not the others: A. G6PD deficiency — Hemolysis, not this neurocutaneous metabolic syndrome.; B. GALT deficiency — Galactose-induced liver/sepsis phenotype.; C. Ornithine transcarbamylase deficiency — Causes hyperammonemia rather than classic alopecia/dermatitis.", "pearl": "", "srcAnswer": "D"}, {"num": 77, "level": "", "question": "An 18-month-old develops lethargy and hypoketotic hypoglycemia after fasting. Tandem MS shows dominant octanoylcarnitine C8 elevation. Which disorder is most likely?", "options": ["MSUD", "MCAD deficiency", "VLCAD deficiency", "Propionic acidemia"], "answer": 1, "explanation": "MCAD crisis prevention hinges on avoiding prolonged fasting and providing emergency glucose. Trap: Low ketones are relative to hypoglycemia; they need not be absolutely absent. Why not the others: A. MSUD — Leucine/isoleucine and alloisoleucine elevations, not C8.; C. VLCAD deficiency — C14:1 is a more characteristic screening marker.; D. Propionic acidemia — C3 elevation and ketoacidosis are more characteristic.", "pearl": "", "srcAnswer": "B"}, {"num": 78, "level": "", "question": "A child has cardiomyopathy, rhabdomyolysis and fasting intolerance; screening shows increased C14:1 acylcarnitine. Which FAOD is favored?", "options": ["MCAD deficiency", "CPS1 deficiency", "CPT II deficiency", "VLCAD deficiency"], "answer": 3, "explanation": "VLCAD has hepatic, cardiac and myopathic phenotypes. Trap: A long-chain acylcarnitine pattern differs from the C8-dominant MCAD pattern. Why not the others: A. MCAD deficiency — C8 predominance is more typical.; B. CPS1 deficiency — Urea-cycle defect without characteristic long-chain acylcarnitines.; C. CPT II deficiency — Often long-chain C16/C18:1 patterns and rhabdomyolysis.", "pearl": "", "srcAnswer": "D"}, {"num": 79, "level": "", "question": "A 7-year-old has stroke-like episodes that do not match a vascular territory, sensorineural hearing loss, short stature and raised blood lactate. A maternal aunt has diabetes and deafness. Which diagnosis is most likely?", "options": ["MELAS from a mitochondrial DNA variant (m.3243A>G)", "Leigh syndrome from SURF1 mutation, inherited in an autosomal recessive pattern", "Pompe disease, which causes stroke-like episodes and lactic acidosis", "X-linked adrenoleukodystrophy, in view of white-matter disease and deafness"], "answer": 0, "explanation": "MELAS (mitochondrial encephalopathy, lactic acidosis, stroke-like episodes) is usually due to m.3243A>G; maternal transmission with variable heteroplasmy explains the family pattern of deafness and diabetes. Leigh syndrome presents earlier with basal ganglia and brainstem lesions. Trap: Heteroplasmy explains variable expression in relatives; maternal inheritance is the clue to mtDNA disease.", "pearl": "", "srcAnswer": "A"}, {"num": 80, "level": "", "question": "A toddler with a known FAOD has vomiting and poor intake but currently normal glucose. Which action best prevents a crisis?", "options": ["Emergency carbohydrate orally or IV, with a sick-day plan", "Restrict all carbohydrates during fever, to limit acidosis", "Wait for hypoglycaemia to develop before giving any calories", "Give high-fat ketogenic feeds to provide an alternative fuel"], "answer": 0, "explanation": "Treat the catabolic trigger early in FAOD even if the first glucose value is normal. Trap: A normal glucose does not mean the child is metabolically safe. Why not the others: B. Restrict all carbohydrates during fever, to limit acidosis — Promotes catabolism and hypoglycemia.; C. Wait for hypoglycaemia to develop before giving any calories — FAOD decompensation may progress before glucose falls.; D. Give high-fat ketogenic feeds to provide an alternative fuel — Ketogenic dependence is unsafe when fatty-acid oxidation is impaired.", "pearl": "", "srcAnswer": "A"}, {"num": 81, "level": "", "question": "An asymptomatic neonate has a positive tandem-MS screen for an IEM. Which statement best describes the result?", "options": ["It establishes the disease without any further testing", "It excludes every other inborn error of metabolism", "A screening signal needing timely confirmatory evaluation", "It is safe to delay specialist review until symptoms appear in the infant"], "answer": 2, "explanation": "Act on urgent screen positives while pursuing definitive biochemical/molecular confirmation. Trap: Sensitivity, specificity and coverage depend on the panel and specimen timing. Why not the others: A. It establishes the disease without any further testing — False positives and overlapping biomarkers occur.; B. It excludes every other inborn error of metabolism — A panel covers selected disorders and can miss affected infants.; D. It is safe to delay specialist review until symptoms appear in the infant — Some screen-positive disorders are time critical.", "pearl": "", "srcAnswer": "C"}, {"num": 82, "level": "", "question": "A newborn has elevated C3 on dried blood spot but is clinically well. Which next diagnostic combination is most informative?", "options": ["Acylcarnitines, urine organic acids, MMA/homocysteine and B12", "Serum ammonia alone, since an elevated C3 is only an ammonia marker", "Karyotype and cranial ultrasound, to screen for structural disease", "Only a repeat of the C3 screen in three months, with no further testing"], "answer": 0, "explanation": "C3 elevation has multiple metabolic and maternal nutritional causes. Trap: A screen marker should trigger a pathway, not a premature disease label. Why not the others: B. Serum ammonia alone, since an elevated C3 is only an ammonia marker — May identify severity but cannot determine C3 etiology.; C. Karyotype and cranial ultrasound, to screen for structural disease — Not first-line tests for an elevated propionylcarnitine marker.; D. Only a repeat of the C3 screen in three months, with no further testing — Delay risks missing an early organic-acid crisis.", "pearl": "", "srcAnswer": "A"}, {"num": 83, "level": "", "question": "An infant screened at 60 hours has TSH >40 mIU/L in serum-equivalent units. According to ISPAE 2018, what immediate confirmatory step is required, without postponing appropriate treatment for nonessential imaging?", "options": ["Wait until 6 weeks of age to repeat the screening test, then decide", "Proceed to thyroid imaging before biochemical confirmation is available", "Use serum T3 alone to confirm hypothyroidism, then start treatment", "Urgent venous FT4/T4 and TSH sampling and prompt treatment if CH is confirmed, without waiting for imaging"], "answer": 3, "explanation": "ISPAE 2018: screen TSH >40 triggers immediate venous T4/FT4 and TSH confirmation. Trap: The numerical threshold applies to the cited Indian protocol and assay units. Why not the others: A. Wait until 6 weeks of age to repeat the screening test, then decide — Delay can compromise neurodevelopment.; B. Proceed to thyroid imaging before biochemical confirmation is available — Imaging must not delay biochemical evaluation or treatment.; C. Use serum T3 alone to confirm hypothyroidism, then start treatment — T3 is not the preferred neonatal confirmatory test.", "pearl": "", "srcAnswer": "D"}, {"num": 84, "level": "", "question": "A 3-day-old has a normal metabolic newborn screen but on day 5 develops respiratory alkalosis, seizures and ammonia 580 micromol/L. What is the best next decision?", "options": ["Treat only bacterial sepsis, since IEM was ruled out by the screen", "Treat hyperammonaemia urgently while testing for UCD", "Exclude all inborn errors of metabolism, because the newborn screen was normal", "Wait for the repeat newborn screen before starting any treatment"], "answer": 1, "explanation": "A negative screen never rules out a symptomatic metabolic emergency. Trap: The clinical phenotype has priority over screening status. Why not the others: A. Treat only bacterial sepsis, since IEM was ruled out by the screen — Sepsis and IEM can coexist; ammonia demands direct action.; C. Exclude all inborn errors of metabolism, because the newborn screen was normal — NBS panels are incomplete and can be false negative or too early.; D. Wait for the repeat newborn screen before starting any treatment — Severe hyperammonemia requires immediate treatment.", "pearl": "", "srcAnswer": "B"}, {"num": 85, "level": "", "question": "A 5-day-old with encephalopathy has glucose 40 mg/dL, strong ketonuria, anion-gap acidosis, ammonia 220 micromol/L and C3 elevation. Which diagnostic/management synthesis is strongest?", "options": ["Assume congenital hypothyroidism because the child is lethargic and hypotonic", "Suspect organic acidaemia; start dextrose and urgent metabolic assessment", "Diagnose isolated OTC deficiency from the ammonia level alone", "Diagnose MCAD deficiency from the hypoglycaemia alone and give glucose only"], "answer": 1, "explanation": "Organic acidemias may have both severe ketoacidosis and secondary hyperammonemia. Trap: Use the entire biochemical vector, not a single dramatic abnormality. Station answers Station 1. N1: pH 7.53 with PCO₂ 22 and ammonia 480, no ketones, normal glucose = primary respiratory alkalosis; urea-cycle disorder until proven otherwise; treat the ammonia urgently and send plasma amino acids and urine orotic acid. N2: anion gap = 138 − (102 + 9) = 27, large ketones, neutropenia, C3 raised = organic acidaemia (PA/MMA); stabilise, send urine organic acids, MMA and homocysteine. N3: normal gas, glucose 34 with very low BOHB, hepatomegaly = fatty-acid oxidation disorder; give glucose and send acylcarnitines. Trap: normal glucose does not exclude a UCD; ammonia in N2 is secondary. Station 2. Profile A: raised C3 = propionic or methylmalonic acidaemia (separate with urine organic acids, MMA, homocysteine). Profile B: dominant C8 with raised C6 and C10 = MCAD deficiency; avoid fasting and give glucose. Profile C: raised C14:1 = VLCAD deficiency; watch for cardiomyopathy and rhabdomyolysis. Trap: C3 cannot separate PA from MMA alone. Station 3. A single-copy loss (log2 ratio about −0.5) over about 18.6–21.5 Mb of chromosome 22 = 22q11.2 deletion. Check calcium and PTH, T-cell subsets before live vaccines, palate, hearing and cardiac assessment; parental testing for recurrence. Trap: a normal karyotype does not exclude it. Station 4. P1: Prader-Willi from a paternal 15q11.2-q13 deletion. P2: Prader-Willi from maternal uniparental isodisomy (maternal-only band without deletion). P3: Angelman syndrome from a UBE3A sequence variant despite normal methylation. Trap: normal methylation does not exclude Angelman. Station 5. Low citrulline with high orotic acid = OTC deficiency. Low citrulline with low or normal orotic acid = CPS1/NAGS deficiency. Very high citrulline = ASS1 deficiency. ASL deficiency raises argininosuccinic acid (not plotted) with only a modestly raised citrulline. Trap: low citrulline is shared; orotic acid separates OTC from CPS1/NAGS. Station 6. I1: a screening signal, not a diagnosis; arrange prompt acylcarnitines, urine organic acids, MMA/homocysteine and maternal/infant B12 assessment, and give illness precautions. I2: urgent venous FT4/T4 and TSH confirmation under the ISPAE approach, treat without waiting for imaging if confirmed; check sample timing and units. I3: treat as a hyperammonaemia emergency; a normal screen never overrides the phenotype. Why not the others: A. Assume congenital hypothyroidism because the child is lethargic and hypotonic — Does not explain acute ketotic acidosis/C3/ammonia profile.; C. Diagnose isolated OTC deficiency from the ammonia level alone — OTC typically has little ketosis/acidosis and different amino-acid markers.; D. Diagnose MCAD deficiency from the hypoglycaemia alone and give glucose only — MCAD more typically shows inadequate ketone production and C8 elevation.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day15',label:'Day 15',set:'Quiz 5',href:'Day15/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day15_QuizSet5_Q69-85_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 15 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–85</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 15 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 15'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 15');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day15:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9225e42b"></script></body></html>
