*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}

@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
#mainBtn:disabled{opacity:.6;cursor:not-allowed}.tagbox{margin-top:12px;background:#fff;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 12px;color:#172033}.tagbox .req{font-size:11px;background:#fee2e2;color:#991b1b;border-radius:999px;padding:1px 8px;font-weight:700;margin-left:4px}.tagbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tagbtns button{min-width:46px;min-height:42px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:16px;color:#334155;padding:0 10px}.tagbtns button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.taglegend{font-size:12px;color:#64748b;margin:0 0 8px}.tagnote{width:100%;border:1.5px solid #dbe4f0;border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}.tagbox.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<body><div class="wrap">
<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><a class="btn secondary" href="index.html#/quizzes">← Day 15 portal</a><span data-countdown="chip"></span></div>
<h1>Day 15 — Quiz 1</h1>
<div class="sub">Questions 1–17 · 17 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script src="../assets/notify.js?v=c4a37a70"></script><script src="../assets/notebook.js?v=c4a37a70"></script>
<script>
const quiz=[{"num": 1, "level": "", "question": "A 20-month-old with global developmental delay, microcephaly and two congenital anomalies has no recognizable single-gene syndrome. Which genomic test best surveys pathogenic copy-number gains and losses as an initial genomic investigation?", "options": ["Chromosomal microarray", "Routine karyotype", "Methylation analysis of 15q11", "Single-gene Sanger sequencing"], "answer": 0, "explanation": "CMA is appropriate for genome-wide CNVs; exome/genome sequencing may also be first- or second-tier depending on local resources and phenotype. Trap: Microarray does not reliably detect balanced rearrangements. Why not the others: B. Routine karyotype — May detect large rearrangements but misses many submicroscopic CNVs.; C. Methylation analysis of 15q11 — Addresses a specific imprinting differential, not the broad phenotype.; D. Single-gene Sanger sequencing — Requires a strong candidate gene and cannot survey genome-wide CNVs.", "pearl": "", "srcAnswer": "A"}, {"num": 2, "level": "", "question": "A parent carries a balanced reciprocal translocation and has had two miscarriages. Which assay best demonstrates the rearranged chromosome architecture?", "options": ["Methylation-specific PCR", "Whole-exome sequencing", "Conventional G-banded karyotype", "SNP chromosomal microarray"], "answer": 2, "explanation": "Balanced chromosomal rearrangements may cause reproductive risk without dosage imbalance. Trap: Balanced ≠ harmless for reproduction; segregation can produce unbalanced gametes. Why not the others: A. Methylation-specific PCR — Detects parent-of-origin methylation, not chromosome architecture.; B. Whole-exome sequencing — Primarily interrogates sequence variants and is not a routine structural karyotype replacement.; D. SNP chromosomal microarray — Balanced translocations can be copy-neutral and therefore invisible.", "pearl": "", "srcAnswer": "C"}, {"num": 3, "level": "", "question": "A child with multiple congenital anomalies has normal CMA and a phenotype suggestive of a heterogeneous monogenic disorder. The parents are unaffected. Which next genomic strategy can simultaneously prioritize de novo and recessive variants?", "options": ["Peripheral blood karyotype only", "Repeat identical CMA", "Targeted 15q methylation assay", "Trio exome or genome sequencing"], "answer": 3, "explanation": "Trio sequencing is informative when the differential spans many genes after copy-number testing. Trap: ACMG supports exome/genome as first- or second-tier for CA/DD/ID. Why not the others: A. Peripheral blood karyotype only — May miss monogenic sequence variation despite normal chromosome number.; B. Repeat identical CMA — Unlikely to detect a single-nucleotide or small indel cause missed by the first array.; C. Targeted 15q methylation assay — Useful only for a matching imprinting phenotype.", "pearl": "", "srcAnswer": "D"}, {"num": 4, "level": "", "question": "Two healthy carriers of the same autosomal-recessive pathogenic variant ask the risk for an affected child in each pregnancy. What is the recurrence probability?", "options": ["100%", "75%", "25%", "50%"], "answer": 2, "explanation": "Aa × Aa yields AA 25%, Aa 50%, aa 25% for each independent pregnancy. Trap: Previous unaffected children do not change the next pregnancy’s 25% risk. Why not the others: A. 100% — Carriers do not transmit the pathogenic allele to every child simultaneously.; B. 75% — That is the probability of a child not affected by the recessive disease.; D. 50% — That is the probability of a carrier child, not an affected child.", "pearl": "", "srcAnswer": "C"}, {"num": 5, "level": "", "question": "A clinically normal mother has a mitochondrial DNA pathogenic variant at low heteroplasmy. Her children show variable disease severity. Which explanation is strongest?", "options": ["Mitochondrial bottleneck and tissue heteroplasmy", "Random X-inactivation of the maternal X chromosome in all affected tissues", "Anticipation due to a trinucleotide repeat expansion in the maternal line", "Paternal mitochondrial transmission with variable penetrance across children"], "answer": 0, "explanation": "Maternal inheritance plus heteroplasmy and threshold effects explains many mtDNA disorders. Trap: A normal maternal examination does not exclude transmission of pathogenic mtDNA. Why not the others: B. Random X-inactivation of the maternal X chromosome in all affected tissues — Explains some X-linked phenotypic variation, not mtDNA heteroplasmy.; C. Anticipation due to a trinucleotide repeat expansion in the maternal line — Not the principal mechanism of variable mtDNA burden.; D. Paternal mitochondrial transmission with variable penetrance across children — Typical mtDNA transmission is maternal, not paternal.", "pearl": "", "srcAnswer": "A"}, {"num": 6, "level": "", "question": "A boy has an X-linked recessive disorder; his mother is confirmed heterozygous and father unaffected. What is the probability that the next son is affected?", "options": ["0%", "25%", "100%", "50%"], "answer": 3, "explanation": "Conditioning on the next child being male changes the denominator. Trap: Always identify whether a question asks among sons or among all children. Why not the others: A. 0% — Sons inherit their X chromosome from their mother.; B. 25% — That is the probability among all births if sex is not fixed and assuming equal sexes.; C. 100% — A heterozygous mother also transmits her normal X allele to some sons.", "pearl": "", "srcAnswer": "D"}, {"num": 7, "level": "", "question": "A child has an autosomal-recessive phenotype despite only one parent being a known carrier. SNP-array shows long copy-neutral homozygosity across a chromosome inherited from one parent. What mechanism could explain disease?", "options": ["Uniparental isodisomy", "Somatic mitochondrial mosaicism", "Balanced inversion", "Genomic imprinting alone"], "answer": 0, "explanation": "Isodisomy can unmask an autosomal-recessive variant and can also disturb imprinting. Trap: Normal copy number does not exclude clinically important uniparental inheritance. Why not the others: B. Somatic mitochondrial mosaicism — Not the mechanism for autosomal copy-neutral homozygosity.; C. Balanced inversion — Does not itself produce uniparental homozygosity of a pathogenic allele.; D. Genomic imprinting alone — Parent-of-origin expression may cause other syndromes but does not explain homozygous recessive variant by itself.", "pearl": "", "srcAnswer": "A"}, {"num": 8, "level": "", "question": "A fetus has a high-risk cell-free DNA screen for trisomy 21. Parents ask whether to proceed directly to irreversible pregnancy decisions. What is the appropriate interpretation?", "options": ["Screening result needing diagnostic confirmation", "cfDNA is definitive, because its sensitivity for trisomy 21 is high", "A negative serum screen overrules the cfDNA result and ends further testing", "A normal anomaly ultrasound excludes trisomy 21 and removes the need for testing"], "answer": 0, "explanation": "Cell-free DNA reflects predominantly placental DNA and is not a fetal diagnostic karyotype. Trap: Positive predictive value depends on prevalence and the condition. Why not the others: B. cfDNA is definitive, because its sensitivity for trisomy 21 is high — High sensitivity does not eliminate false positives or placental mosaicism.; C. A negative serum screen overrules the cfDNA result and ends further testing — Conflicting screening tests do not substitute for diagnostic sampling.; D. A normal anomaly ultrasound excludes trisomy 21 and removes the need for testing — Anatomical imaging cannot reliably rule out aneuploidy.", "pearl": "", "srcAnswer": "A"}, {"num": 9, "level": "", "question": "A 4-year-old with developmental delay and characteristic facial appearance has a 22q11.2 deletion suspected. Routine karyotype is normal. What is the most suitable next confirmatory test?", "options": ["Serum phenylalanine", "SNRPN methylation analysis", "Chromosomal microarray", "Urinary glycosaminoglycans"], "answer": 2, "explanation": "A normal banded karyotype does not exclude recurrent microdeletions. Trap: FISH/MLPA may be targeted confirmatory tools when a familial deletion is known. Why not the others: A. Serum phenylalanine — Tests PKU, not chromosomal deletion.; B. SNRPN methylation analysis — Targets chromosome 15 imprinting disorders.; D. Urinary glycosaminoglycans — Supports some lysosomal storage disorders.", "pearl": "", "srcAnswer": "C"}, {"num": 10, "level": "", "question": "A 6-year-old boy has global developmental delay, a long face, large ears and macro-orchidism. Which investigation is most appropriate?", "options": ["Routine karyotype alone, since it detects fragile sites in every case", "Methylation analysis of 15q11.2-q13 for imprinting disorders", "Microarray as the only test, since it detects all repeat expansions", "FMR1 CGG repeat analysis (with methylation testing)"], "answer": 3, "explanation": "Fragile X syndrome is caused by a CGG repeat expansion (>200 repeats with methylation) in FMR1. Repeat-primed PCR/Southern analysis is needed; karyotype and microarray do not detect repeat expansions. Premutation carriers (55–200 repeats) risk FXTAS and primary ovarian insufficiency; anticipation occurs through maternal transmission. Trap: Repeat-expansion disorders need targeted repeat testing, not a broad copy-number assay.", "pearl": "", "srcAnswer": "D"}, {"num": 11, "level": "", "question": "Which term describes multiple abnormalities arising from one primary developmental insult followed by secondary consequences, as in oligohydramnios causing contractures and pulmonary hypoplasia?", "options": ["Sequence", "Association", "Syndrome", "Field defect"], "answer": 0, "explanation": "Sequence = one initiating event with downstream developmental consequences. Trap: Potter sequence is not synonymous with a single genetic syndrome. Why not the others: B. Association — A nonrandom pattern of anomalies without a single established causal mechanism.; C. Syndrome — A recognizable constellation attributable to a common etiology.; D. Field defect — Disturbance of a localized developmental field, not necessarily a cascade.", "pearl": "", "srcAnswer": "A"}, {"num": 12, "level": "", "question": "A newborn has one major cardiac defect and three minor dysmorphic findings. What is the best next assessment approach?", "options": ["Systematic dysmorphology exam, family history and anomaly survey", "Order a single-gene panel for the cardiac defect before any physical examination", "Assign an association diagnosis without searching for an underlying cause", "Disregard the minor findings, because the major defect is enough to guide testing"], "answer": 0, "explanation": "Count and characterize major/minor anomalies; look for hidden cardiac, renal and CNS defects. Trap: Multiple minor anomalies increase suspicion for an underlying major defect. Why not the others: B. Order a single-gene panel for the cardiac defect before any physical examination — Phenotyping and family history guide targeted testing.; C. Assign an association diagnosis without searching for an underlying cause — Association is a descriptive category, not a shortcut around evaluation.; D. Disregard the minor findings, because the major defect is enough to guide testing — Minor anomalies can signal an underlying syndrome or broader malformation pattern.", "pearl": "", "srcAnswer": "A"}, {"num": 13, "level": "", "question": "A child has classic Prader-Willi phenotype. Methylation demonstrates maternal-only 15q11.2-q13 imprinting; SNP array shows no deletion but maternal isodisomy. What is the molecular diagnosis?", "options": ["Maternal uniparental disomy of chromosome 15", "Paternal 15q deletion", "Maternal 15q deletion", "UBE3A sequence variant"], "answer": 0, "explanation": "PWS may arise from paternal deletion, maternal UPD or imprinting defect; methylation establishes abnormal imprint. Trap: Array plus methylation helps assign the molecular mechanism. Why not the others: B. Paternal 15q deletion — Would cause PWS but a deletion was not detected.; C. Maternal 15q deletion — Usually produces Angelman-related maternal UBE3A deficiency, not PWS.; D. UBE3A sequence variant — May cause Angelman syndrome and is not established by maternal-only methylation.", "pearl": "", "srcAnswer": "A"}, {"num": 14, "level": "", "question": "A girl has severe speech impairment, ataxia and epilepsy. 15q methylation is normal, but clinical suspicion for Angelman syndrome remains high. Which mechanism is still plausible?", "options": ["Maternal UPD 15, because methylation is normal in that group of patients", "Paternal 15q11 deletion, which gives an abnormal methylation pattern", "Paternal deletion of SNORD116, as seen in Prader-Willi syndrome", "Maternal UBE3A sequence variant"], "answer": 3, "explanation": "Normal methylation does not exclude UBE3A sequence-variant Angelman syndrome. Trap: Methylation detects most but not all Angelman molecular mechanisms. Why not the others: B. Paternal 15q11 deletion, which gives an abnormal methylation pattern — Typically yields PWS when paternally expressed genes are lost.; C. Paternal deletion of SNORD116, as seen in Prader-Willi syndrome — A PWS-associated mechanism, not isolated maternal UBE3A loss.", "pearl": "", "srcAnswer": "D"}, {"num": 15, "level": "", "question": "What is the expected chromosome complement in classic Klinefelter syndrome?", "options": ["47,XXX", "45,X", "47,XXY", "47,XYY"], "answer": 2, "explanation": "Classic Klinefelter is 47,XXY; mosaic forms also exist. Trap: Small firm testes and hypergonadotropic hypogonadism are clinical clues. Why not the others: A. 47,XXX — Triple-X syndrome.; B. 45,X — Classic Turner syndrome.; D. 47,XYY — A different sex-chromosome aneuploidy.", "pearl": "", "srcAnswer": "C"}, {"num": 16, "level": "", "question": "A term infant has hypotonia, upslanting palpebral fissures, single transverse palmar crease and a complete atrioventricular septal defect. Which syndrome is most likely?", "options": ["Williams syndrome", "Down syndrome", "22q11.2 deletion", "Turner syndrome"], "answer": 1, "explanation": "AVSD is a high-yield congenital cardiac association of Down syndrome. Trap: Anatomical cardiac phenotype helps distinguish dysmorphic syndromes. Why not the others: A. Williams syndrome — Supravalvar aortic stenosis is more characteristic.; C. 22q11.2 deletion — Conotruncal defects, palatal and immune findings are more characteristic.; D. Turner syndrome — Left-sided obstructive heart disease is more characteristic.", "pearl": "", "srcAnswer": "B"}, {"num": 17, "level": "", "question": "A neonate with trisomy 21 develops circulating blasts and hepatomegaly; blasts resolve spontaneously over weeks. Which mutation is classically linked to transient abnormal myelopoiesis?", "options": ["BCR::ABL1", "GATA1", "PML::RARA", "JAK2 V617F"], "answer": 1, "explanation": "Transient abnormal myelopoiesis requires hematology follow-up due to later myeloid leukemia risk. Trap: Spontaneous resolution does not mean zero future hematologic risk. Why not the others: A. BCR::ABL1 — Philadelphia-positive leukemia, not typical TAM.; C. PML::RARA — Acute promyelocytic leukemia, not neonatal TAM.; D. JAK2 V617F — Classically myeloproliferative neoplasms, not Down-related neonatal TAM.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day15',label:'Day 15',set:'Quiz 1',href:'Day15/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day15_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 15 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 15 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 15'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 15');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day15:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=c4a37a70"></script></body></html>
