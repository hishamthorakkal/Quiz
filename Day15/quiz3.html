const quiz=[{"num": 35, "level": "", "question": "A child with Down syndrome has recurrent respiratory infections and snoring. Which sleep-related assessment is important even if caregivers do not report severe daytime sleepiness?", "options": ["Obtain routine brain MRI before sleep assessment", "Evaluate for obstructive sleep apnea", "Assume central apnea from congenital hypothyroidism", "Avoid all sleep studies because hypotonia is expected"], "answer": 1, "explanation": "Children with Down syndrome have increased OSA risk from anatomy and hypotonia. Trap: Absence of obvious sleepiness does not exclude clinically significant OSA. Why not the others: A. Obtain routine brain MRI before sleep assessment — MRI is not the first-line evaluation for habitual snoring.; C. Assume central apnea from congenital hypothyroidism — Hypothyroidism may coexist but does not explain all snoring.; D. Avoid all sleep studies because hypotonia is expected — Hypotonia increases airway risk and is not reassuring.", "pearl": "", "srcAnswer": "B"}, {"num": 36, "level": "", "question": "Why is conventional karyotyping still useful in a child with Down syndrome even when clinical features are obvious?", "options": ["It distinguishes free trisomy, translocation and mosaicism", "It replaces echocardiography as the cardiac screening test in Down syndrome", "It quantifies all future leukaemia risk from the percentage of trisomic cells", "It determines the exact developmental outcome from the karyotype"], "answer": 0, "explanation": "Translocation Down syndrome may require parental karyotyping for recurrence counselling. Trap: A diagnostic label and a cytogenetic mechanism are different outputs. Why not the others: B. It replaces echocardiography as the cardiac screening test in Down syndrome — Chromosome result cannot identify structural heart disease.; C. It quantifies all future leukaemia risk from the percentage of trisomic cells — Karyotype alone cannot predict individual leukemia development.; D. It determines the exact developmental outcome from the karyotype — Genotype does not precisely predict individual cognition.", "pearl": "", "srcAnswer": "A"}, {"num": 37, "level": "", "question": "A child with clinical Turner syndrome has a 45,X/46,XY mosaic result. Which interpretation is best?", "options": ["All 46,XY cells ensure normal gonadal function", "The karyotype is impossible because the child is phenotypically female", "Mosaicism excludes cardiovascular surveillance", "The phenotype and gonadal risk require individualized assessment"], "answer": 3, "explanation": "Peripheral blood mosaic fraction does not fully predict tissue mosaicism. Trap: Avoid deterministic claims from a mosaic karyotype. Why not the others: A. All 46,XY cells ensure normal gonadal function — Gonadal phenotype and tumour risk vary with tissue distribution.; B. The karyotype is impossible because the child is phenotypically female — Sex-chromosome mosaicism can yield a female phenotype.; C. Mosaicism excludes cardiovascular surveillance — Turner-spectrum aortopathy remains clinically relevant.", "pearl": "", "srcAnswer": "D"}, {"num": 38, "level": "", "question": "A 4-day-old initially well neonate becomes lethargic and tachypneic. pH 7.52, PCO2 24 mmHg, ammonia 430 micromol/L, lactate near normal, no ketosis. Which metabolic group is most likely?", "options": ["Primary urea-cycle defect", "Organic acidemia", "Fatty-acid oxidation disorder", "Classic galactosemia"], "answer": 0, "explanation": "Respiratory alkalosis in a sick neonate with high ammonia is a UCD warning pattern. Trap: Do not mistake tachypnea from central ammonia toxicity for metabolic acidosis. Why not the others: B. Organic acidemia — Usually produces high-anion-gap metabolic acidosis and ketosis.; C. Fatty-acid oxidation disorder — Often presents with hypoketotic hypoglycemia during catabolism.; D. Classic galactosemia — Often liver dysfunction, hypoglycemia and E coli sepsis.", "pearl": "", "srcAnswer": "A"}, {"num": 39, "level": "", "question": "A 5-day-old has encephalopathy, anion-gap metabolic acidosis, marked ketosis, hyperammonemia and neutropenia. Which diagnosis class is most likely?", "options": ["Primary mitochondrial cytopathy", "Urea-cycle disorder", "Organic acidemia", "MCAD deficiency"], "answer": 2, "explanation": "Organic acidemias can cause secondary hyperammonemia; ammonia alone does not prove UCD. Trap: Interpret acid-base, ketones and glucose together. Why not the others: A. Primary mitochondrial cytopathy — Can cause lactic acidosis, but marked ketosis/neutropenia favors organic acidemia.; B. Urea-cycle disorder — Usually lacks prominent ketosis and anion-gap acidosis early.; D. MCAD deficiency — Often hypoketotic rather than marked ketotic decompensation.", "pearl": "", "srcAnswer": "C"}, {"num": 40, "level": "", "question": "A child has translocation Down syndrome caused by an unbalanced Robertsonian translocation between chromosomes 14 and 21 (one additional copy of chromosome 21q). The mother has a confirmed balanced rob(14;21) carrier karyotype. What is the approximate empirical risk of a child with Down syndrome in a subsequent pregnancy for a maternal carrier?", "options": ["About 10–15%", "About 1% (similar to the population risk)", "About 50%", "About 100%"], "answer": 0, "explanation": "Maternal carriers of a 14;21 Robertsonian translocation carry an empirical risk of about 10–15% for a liveborn with translocation Down syndrome; paternal carriers about 1–2%. A 21;21 carrier has a risk approaching 100%. Free trisomy 21 recurrence is much lower (about 1% plus age-related risk). Trap: Karyotyping the child changes counselling; the carrier’s sex changes the figure. Estimates vary between textbooks ⚑ verify.", "pearl": "", "srcAnswer": "A"}, {"num": 41, "level": "", "question": "A 14-month-old develops seizures after a viral illness and overnight fasting: glucose 32 mg/dL, beta-hydroxybutyrate very low, hepatomegaly and mildly elevated AST. Which pathway is most suspect?", "options": ["Urea-cycle nitrogen disposal", "Lysosomal glycosaminoglycan degradation", "Branched-chain amino-acid catabolism", "Fatty-acid beta-oxidation"], "answer": 3, "explanation": "FAOD can present during common infections with inadequate intake. Trap: Ketones are often low relative to severity of hypoglycemia, not necessarily absent. Why not the others: A. Urea-cycle nitrogen disposal — Hyperammonemia is primary and fasting hypoketotic hypoglycemia less typical.; B. Lysosomal glycosaminoglycan degradation — Produces chronic storage features rather than fasting crisis.; C. Branched-chain amino-acid catabolism — MSUD more often causes ketoacidosis/encephalopathy.", "pearl": "", "srcAnswer": "D"}, {"num": 42, "level": "", "question": "A neonate with suspected IEM is deteriorating while plasma amino acids and urine organic acids are being arranged. What is the most appropriate first principle?", "options": ["Start prolonged fasting until a diagnosis is made, to rest the metabolism", "Wait for the confirmatory biochemical diagnosis before starting any treatment", "Resuscitate, stop catabolism with IV glucose and call metabolic ICU", "Give high-protein feeds to reduce endogenous protein breakdown in the neonate"], "answer": 2, "explanation": "Collect critical samples early but do not delay dextrose, airway support or specialist escalation. Trap: The correct first action is physiologic stabilization, not a rare diagnostic label. Why not the others: A. Start prolonged fasting until a diagnosis is made, to rest the metabolism — Fasting accelerates catabolism and metabolic decompensation.; B. Wait for the confirmatory biochemical diagnosis before starting any treatment — Dangerous: catabolism and hyperammonemia can worsen rapidly.; D. Give high-protein feeds to reduce endogenous protein breakdown in the neonate — Additional protein can worsen amino-acid/urea-cycle intoxication during crisis.", "pearl": "", "srcAnswer": "C"}, {"num": 43, "level": "", "question": "A 3.5-kg neonate has ammonia 610 micromol/L and worsening encephalopathy despite initial anti-catabolic measures. Which action best matches the CHOP neonatal hyperammonaemia pathway (a US institutional protocol)?", "options": ["Observe for 24 hours after repeating the ammonia, as levels often fall", "Start oral protein supplements to restore nitrogen balance", "Use sodium bicarbonate alone as definitive therapy for the encephalopathy", "Urgently plan extracorporeal ammonia clearance"], "answer": 3, "explanation": "CHOP pathway categorizes ≥500 micromol/L as severe; local extracorporeal thresholds vary. Trap: Do not wait for a fixed number if ammonia rises rapidly or encephalopathy worsens. Why not the others: A. Observe for 24 hours after repeating the ammonia, as levels often fall — Severe hyperammonemia risks cerebral edema and requires urgent escalation.; B. Start oral protein supplements to restore nitrogen balance — Adds nitrogen during acute decompensation.; C. Use sodium bicarbonate alone as definitive therapy for the encephalopathy — Does not remove ammonia and is not definitive management.", "pearl": "", "srcAnswer": "D"}, {"num": 44, "level": "", "question": "A child with suspected OTC deficiency and ammonia 360 micromol/L is being transferred. Which additional intervention is appropriate under metabolic specialist guidance?", "options": ["IV nitrogen scavengers with high-calorie dextrose", "High-protein infusion to preserve nitrogen balance during the transfer", "Stop all IV calories until the infant reaches the referral centre", "Valproate to suppress the encephalopathy and seizures during transfer"], "answer": 0, "explanation": "Scavenger choice/dose and arginine/citrulline depend on disorder and local protocol. Trap: Do not substitute empiric medication dosing for metabolic center guidance. Why not the others: B. High-protein infusion to preserve nitrogen balance during the transfer — May worsen nitrogen load in acute hyperammonemia.; C. Stop all IV calories until the infant reaches the referral centre — Worsens catabolism and endogenous ammonia production.; D. Valproate to suppress the encephalopathy and seizures during transfer — Valproate can exacerbate hyperammonemia.", "pearl": "", "srcAnswer": "A"}, {"num": 45, "level": "", "question": "Which acid-base pattern is a classic early clue to a primary urea-cycle defect in a neonate?", "options": ["Respiratory alkalosis", "High-anion-gap acidosis with ketonuria", "Mixed alkalosis with high serum lactate only", "Normal-anion-gap acidosis with glucosuria"], "answer": 0, "explanation": "Early UCD may show respiratory alkalosis even before severe cerebral edema. Trap: A normal pH does not exclude severe hyperammonemia. Why not the others: B. High-anion-gap acidosis with ketonuria — More characteristic of organic acidemia.; C. Mixed alkalosis with high serum lactate only — Lactate is not the defining biochemical clue.; D. Normal-anion-gap acidosis with glucosuria — Suggests renal tubular dysfunction.", "pearl": "", "srcAnswer": "A"}, {"num": 46, "level": "", "question": "A neonate with hyperammonemia has plasma citrulline very low and urinary orotic acid markedly elevated. Which enzymatic defect is most consistent?", "options": ["Argininosuccinate synthetase deficiency", "Argininosuccinate lyase deficiency", "CPS1 deficiency", "Ornithine transcarbamylase deficiency"], "answer": 3, "explanation": "OTC and CPS1 both may have low citrulline; orotic acid separates them. Trap: An elevated orotic acid is a decisive branch point, not a generic UCD marker. Why not the others: A. Argininosuccinate synthetase deficiency — Produces markedly elevated citrulline.; B. Argininosuccinate lyase deficiency — Produces argininosuccinic acid accumulation.; C. CPS1 deficiency — Low citrulline but typically low/normal urinary orotic acid.", "pearl": "", "srcAnswer": "D"}, {"num": 47, "level": "", "question": "An infant has severe hyperammonemia, very low citrulline and low urinary orotic acid. Which diagnosis is favored over OTC deficiency?", "options": ["CPS1 deficiency", "ASL deficiency", "ASS1 deficiency", "Arginase deficiency"], "answer": 0, "explanation": "CPS1/NAGS defects share low citrulline and low/normal orotic acid; further testing distinguishes them. Trap: Never diagnose OTC from low citrulline alone. Why not the others: B. ASL deficiency — Argininosuccinate accumulation is expected.; C. ASS1 deficiency — Typically high citrulline.; D. Arginase deficiency — Typically hyperargininemia with a later spastic phenotype.", "pearl": "", "srcAnswer": "A"}, {"num": 48, "level": "", "question": "A newborn with hyperammonemia has plasma citrulline 1800 micromol/L. Which urea-cycle defect is most likely?", "options": ["CPS1 deficiency", "OTC deficiency", "Argininosuccinate synthetase deficiency", "NAGS deficiency"], "answer": 2, "explanation": "ASS1 deficiency causes citrulline accumulation upstream of argininosuccinate synthesis. Trap: Magnitude and position of metabolite accumulation identify enzyme blocks. Why not the others: A. CPS1 deficiency — Typically low citrulline.; B. OTC deficiency — Typically low citrulline with high urinary orotic acid.; D. NAGS deficiency — Typically low citrulline.", "pearl": "", "srcAnswer": "C"}, {"num": 49, "level": "", "question": "An infant with hyperammonemia has markedly increased argininosuccinic acid on plasma amino-acid testing. Which enzyme is deficient?", "options": ["Carbamoyl-phosphate synthetase I", "Argininosuccinate lyase", "Argininosuccinate synthetase", "Ornithine transcarbamylase"], "answer": 1, "explanation": "ASL deficiency is also called argininosuccinic aciduria. Trap: Named intermediate in the test often points directly to the enzyme block. Why not the others: A. Carbamoyl-phosphate synthetase I — Causes low citrulline and low/normal orotic acid.; C. Argininosuccinate synthetase — Causes citrulline accumulation rather than argininosuccinic acid.; D. Ornithine transcarbamylase — Causes low citrulline and elevated orotic acid.", "pearl": "", "srcAnswer": "B"}, {"num": 50, "level": "", "question": "What is the mechanism of sodium benzoate in a neonate with hyperammonaemia from a urea-cycle defect?", "options": ["It activates carbamoyl phosphate synthetase I as an NAGS analogue", "It restores ornithine transcarbamylase activity in hepatocytes", "It conjugates with glycine to form hippurate, an alternative route for nitrogen excretion in urine", "It blocks the glutamine synthetase pathway in astrocytes"], "answer": 2, "explanation": "Sodium benzoate conjugates with glycine to hippurate; sodium phenylacetate conjugates with glutamine to phenylacetylglutamine. Both are excreted in urine, removing nitrogen without a working urea cycle. Carglumic acid is the NAGS activator. Arginine is given in most UCDs but not in arginase deficiency. Trap: Scavengers are bridging therapy; severe hyperammonaemia still needs dialysis planning. Doses are protocol-specific ⚑ verify.", "pearl": "", "srcAnswer": "C"}, {"num": 51, "level": "", "question": "A child with recurrent hyperammonemia has elevated plasma arginine and progressive spastic diplegia. Which defect best fits?", "options": ["ASL deficiency", "OTC deficiency", "Arginase 1 deficiency", "CPS1 deficiency"], "answer": 2, "explanation": "Arginase deficiency may present later with progressive spasticity rather than dramatic neonatal coma. Trap: Not all urea-cycle defects have the same age or neurologic phenotype. Why not the others: A. ASL deficiency — Argininosuccinate elevation and liver disease are more typical.; B. OTC deficiency — Typically low citrulline and orotic acid elevation.; D. CPS1 deficiency — Usually severe neonatal hyperammonemia with low citrulline.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day15',label:'Day 15',set:'Quiz 3',href:'Day15/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day15_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 15 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 15 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 15'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 15');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day15:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=e87f25f7"></script></body></html>
