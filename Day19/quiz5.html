@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 63, "level": "", "question": "A patient has a 75-mmHg Doppler gradient across a dysplastic valvar pulmonary valve with annular hypoplasia. What is best interpretation?", "options": ["Balloon may be considered but surgery may be required by anatomy", "Treat dysplastic valve with isolated branch PA angioplasty", "Peak Doppler 75 mmHg suggests moderate stenosis requiring only surveillance", "Primary surgical PA banding reduces RV afterload"], "answer": 0, "explanation": "Noonan-type dysplasia and small annulus can limit balloon success. Why not the others: B. Treat dysplastic valve with isolated branch PA angioplasty — The lesion is valvar and annular, not branch PA.; C. Peak Doppler 75 mmHg suggests moderate stenosis requiring only surveillance — Indian threshold >64 mmHg supports intervention.; D. Primary surgical PA banding reduces RV afterload — Banding worsens RVOT resistance.", "pearl": "Intervention planning integrates valve morphology, annulus and RV function.", "srcAnswer": "A"}, {"num": 64, "level": "", "question": "A centrally cyanosed neonate has right-hand PaO₂ 39 mmHg on room air and 47 mmHg after a historical hyperoxia-test protocol using 100% oxygen; echocardiography is available. Which interpretation is most defensible?", "options": ["A. The small PaO₂ rise proves d-TGA with intact ventricular septum", "B. The small PaO₂ rise excludes significant persistent pulmonary hypertension", "C. Both cyanotic CHD and severe PPHN remain possible; urgent echocardiography, not hyperoxia alone, defines anatomy", "D. The result establishes obstructed TAPVC rather than a duct-dependent lesion"], "answer": 2, "explanation": "Correct: hyperoxia response has limited specificity; echocardiography and stabilization should not be delayed. Why not the others: A. A. The small PaO₂ rise proves d-TGA with intact ventricular septum — A poor response suggests extrapulmonary shunting but does not identify a specific cardiac lesion.; B. B. The small PaO₂ rise excludes significant persistent pulmonary hypertension — Severe PPHN with ductal/atrial right-to-left shunting can also give a poor hyperoxia response.; D. D. The result establishes obstructed TAPVC rather than a duct-dependent lesion — Obstructed TAPVC is a possible differential, not diagnosable from oxygen response alone.", "pearl": "Hyperoxia test is historical and nonspecific: urgent echo supersedes it in suspected critical CHD.", "srcAnswer": "C"}, {"num": 65, "level": "", "question": "An infant with severe coarctation receives PGE1 and improves. Which next step is essential?", "options": ["Stop PGE1 and observe for 24 hours after lactate normalizes", "Perform balloon aortic valvuloplasty because perfusion improved", "Definitive arch repair planning after stabilization", "Perform BAS before any arch assessment"], "answer": 2, "explanation": "PGE1 buys time for definitive lesion-directed management. Why not the others: A. Stop PGE1 and observe for 24 hours after lactate normalizes — PGE1 is a bridge; withdrawal before arch repair may recur shock.; B. Perform balloon aortic valvuloplasty because perfusion improved — Aortic valve is not the coarctation site.; D. Perform BAS before any arch assessment — Atrial mixing procedure is not routine for isolated CoA.", "pearl": "Identify whether duct supports systemic or pulmonary circulation.", "srcAnswer": "C"}, {"num": 66, "level": "", "question": "A neonate has TGA with restrictive atrial septum and persistent low saturation despite patent duct. What does this show?", "options": ["An enlarged duct removes the need for echo assessment of the atrial septum", "Pulmonary venous obstruction is the only remaining explanation", "Ductal patency alone may not provide adequate intercirculatory mixing", "Systemic venous baffle obstruction must be corrected"], "answer": 2, "explanation": "BAS and PGE1 address different parts of TGA physiology. Why not the others: A. An enlarged duct removes the need for echo assessment of the atrial septum — Duct patency does not replace assessment of atrial mixing.; B. Pulmonary venous obstruction is the only remaining explanation — Restrictive atrial septum is already documented.; D. Systemic venous baffle obstruction must be corrected — No prior atrial switch is present.", "pearl": "Inadequate mixing can persist with a widely patent duct.", "srcAnswer": "C"}, {"num": 67, "level": "", "question": "A neonate with suspected duct-dependent CHD develops apnea during PGE1 infusion. Best interpretation?", "options": ["The apnea indicates a new restrictive atrial septum", "The apnea implies an acute ductal constriction", "The apnea establishes that intubation is mandatory in every infant", "Known PGE1 adverse effect requiring airway readiness"], "answer": 3, "explanation": "PGE1 can cause apnea and hypotension; monitor and support airway. Why not the others: A. The apnea indicates a new restrictive atrial septum — Apnea is a known drug adverse effect, not a specific mixing marker.; B. The apnea implies an acute ductal constriction — PGE1 tends to maintain, not constrict, the duct.; C. The apnea establishes that intubation is mandatory in every infant — Airway support is individualized; readiness is essential.", "pearl": "Use lowest effective maintenance dose after duct opens per specialist protocol.", "srcAnswer": "D"}, {"num": 68, "level": "", "question": "A 5-week-old with d-TGA/IVS is stable after BAS but LV is regressed. Which statement best matches Indian 2019 late-presentation guidance?", "options": ["Proceed directly to a routine Senning because LV regression is seen", "Perform ASO only after waiting for spontaneous LV hypertrophy", "Use isolated balloon septostomy as permanent palliation", "ASO may still be considered with center-specific LV/ECMO assessment"], "answer": 3, "explanation": "Late TGA surgery is individualized by LV preparedness and center capability. Why not the others: A. Proceed directly to a routine Senning because LV regression is seen — Late strategies are individualized; ASO may still be possible.; B. Perform ASO only after waiting for spontaneous LV hypertrophy — LV retraining/support may be needed; passive waiting is not a plan.; C. Use isolated balloon septostomy as permanent palliation — BAS is stabilization, not definitive anatomical correction.", "pearl": "The 7-day–3-week ideal window is not an absolute exclusion beyond it.", "srcAnswer": "D"}, {"num": 69, "level": "", "question": "A severely cyanotic neonate has suspected obstructed TAPVC but diagnosis is not yet secure. Which statement best reflects lesion-specific PGE1 decisions?", "options": ["Start PGE1 and delay echo until saturation response is assessed", "Prioritize BAS without confirming venous drainage", "Urgent echo should distinguish TAPVC obstruction before routine ductal therapy", "Give pulmonary vasodilator alone as definitive treatment"], "answer": 2, "explanation": "Obstructed TAPVC is a critical exception to reflex ductal infusion. Why not the others: A. Start PGE1 and delay echo until saturation response is assessed — Potential obstructed TAPVC needs urgent diagnosis and surgical pathway.; B. Prioritize BAS without confirming venous drainage — BAS is not a substitute for diagnosing venous obstruction.; D. Give pulmonary vasodilator alone as definitive treatment — Cannot correct fixed pulmonary venous obstruction.", "pearl": "In undifferentiated shock, resuscitation and expert echo proceed urgently together.", "srcAnswer": "C"}, {"num": 70, "level": "", "question": "A truncus neonate with controlled heart failure is awaiting repair. What timing is favored by Indian 2019 guidance?", "options": ["Repair electively at 2–3 months after nutritional optimization", "Repair at 6–8 weeks if saturations remain above 85%", "Defer surgery until truncal valve regurgitation becomes severe", "Repair by approximately 3–6 weeks of age"], "answer": 3, "explanation": "Controlled truncus heart failure still warrants early repair. Why not the others: A. Repair electively at 2–3 months after nutritional optimization — Earlier repair is recommended even if heart failure is controlled.; B. Repair at 6–8 weeks if saturations remain above 85% — Indian guidance targets 3–6 weeks for controlled failure.; C. Defer surgery until truncal valve regurgitation becomes severe — Pulmonary overcirculation itself warrants early repair.", "pearl": "Uncontrolled failure prompts surgery as soon as possible.", "srcAnswer": "D"}, {"num": 71, "level": "", "question": "A single-ventricle child is planned for Fontan at age 4 years, weight 16 kg, low PVR and good ventricular function. Which timing aligns with Indian 2019 consensus?", "options": ["Fontan completion at 6–12 months if branch PAs are adequate", "Fontan completion at 2 years if systemic ventricle is strong", "Fontan completion at 10–12 years after growth is complete", "Fontan completion at about 4–7 years in suitable patients"], "answer": 3, "explanation": "Indian consensus gives 4–7 years and 15–20 kg for typical completion. Why not the others: A. Fontan completion at 6–12 months if branch PAs are adequate — This is usual Glenn age range, not Fontan completion.; B. Fontan completion at 2 years if systemic ventricle is strong — Indian usual timing is later, though exceptional earlier strategies exist.; C. Fontan completion at 10–12 years after growth is complete — Unnecessary delay when anatomy and hemodynamics permit earlier completion.", "pearl": "Timing varies with anatomy, hemodynamics and institutional practice.", "srcAnswer": "D"}, {"num": 72, "level": "", "question": "A child has coarctation with invasive gradient 15 mmHg, upper-limb hypertension and large collaterals. Which criterion supports intervention despite the gradient?", "options": ["Intervention requires ≥20 mmHg even with hypertension and collaterals", "Intervention requires left ventricular EF below 40%", "Hypertension and collateral formation despite gradient <20 mmHg", "Intervention requires an arm–leg oxygen saturation difference"], "answer": 2, "explanation": "Indian criteria allow intervention with hypertension/collaterals at low gradients. Why not the others: A. Intervention requires ≥20 mmHg even with hypertension and collaterals — Indian guidance also recognizes low-gradient disease with HTN/collaterals.; B. Intervention requires left ventricular EF below 40% — LV dysfunction is an indication but not a mandatory condition.; D. Intervention requires an arm–leg oxygen saturation difference — Oxygen saturation difference is not required for CoA intervention.", "pearl": "Flow, collaterals and LV dysfunction can make gradients misleading.", "srcAnswer": "C"}, {"num": 73, "level": "", "question": "A symptomatic 12-year-old has valvar AS, invasive peak-to-peak gradient 42 mmHg, ischemic ST changes and trivial AR. What is the strongest reason to consider valvotomy?", "options": ["Wait until peak-to-peak gradient reaches 50 mmHg despite ischemic ECG", "Symptoms/ischemic ECG permit intervention at invasive gradient ≥40 mmHg", "Treat only after the mean Doppler gradient reaches 50 mmHg", "Choose balloon only if moderate AR is present"], "answer": 1, "explanation": "Know different Doppler and invasive thresholds for aortic stenosis. Why not the others: A. Wait until peak-to-peak gradient reaches 50 mmHg despite ischemic ECG — Symptomatic/ECG ischemia supports intervention at lower invasive gradient.; C. Treat only after the mean Doppler gradient reaches 50 mmHg — The given invasive gradient and ischemic changes suffice for consideration.; D. Choose balloon only if moderate AR is present — More-than-mild AR argues against balloon valvotomy.", "pearl": "Symptoms/ischemic ECG lower the invasive gradient threshold.", "srcAnswer": "B"}, {"num": 74, "level": "", "question": "An infant with valvar PS has Doppler gradient 38 mmHg but severe RV dysfunction clearly attributable to PS. Which decision is supported?", "options": ["Repeat echo after recovery because Doppler gradient is modest", "Urgent intervention can be indicated regardless of gradient", "Wait for peak Doppler gradient to exceed 64 mmHg despite RV failure", "Treat with pulmonary artery banding while RV function recovers"], "answer": 1, "explanation": "Ventricular dysfunction overrides nominal Doppler thresholds in severe PS. Why not the others: A. Repeat echo after recovery because Doppler gradient is modest — Attributable RV dysfunction is itself an intervention indication.; C. Wait for peak Doppler gradient to exceed 64 mmHg despite RV failure — Indian guidance recognizes RV dysfunction independent of gradient.; D. Treat with pulmonary artery banding while RV function recovers — Banding increases RV afterload.", "pearl": "A low gradient may reflect poor RV output.", "srcAnswer": "B"}, {"num": 75, "level": "", "question": "A 2-day-old has systemic shock, weak femorals and echo shows severe CoA. SpO2 is 94% in both limbs. Which is the safest integrated action?", "options": ["Observe perfusion after crystalloid bolus because SpO2 is reassuring", "Begin inotropic support alone and reassess duct patency later", "Start PGE1 and urgent cardiology/surgical stabilization despite reassuring SpO2", "Perform emergency balloon pulmonary valvuloplasty before arch treatment"], "answer": 2, "explanation": "Shock plus weak femorals is duct-dependent systemic obstruction until excluded. Why not the others: A. Observe perfusion after crystalloid bolus because SpO2 is reassuring — Shock with documented severe CoA requires ductal stabilization.; B. Begin inotropic support alone and reassess duct patency later — Inotropy may be needed but does not preserve ductal systemic flow.; D. Perform emergency balloon pulmonary valvuloplasty before arch treatment — Pulmonary valve is not the cause of systemic shock.", "pearl": "Oxygenation and systemic perfusion are separate axes of neonatal CHD.", "srcAnswer": "C"}, {"num": 76, "level": "", "question": "An infant remains hypoglycemic at 60 hours after birth. Which statement correctly distinguishes the named Canadian and US endocrine frameworks?", "options": ["CPS transitional period ends at 48 h; PES at 72 h", "CPS transitional period extends to 72 h; PES emphasizes persistent-disorder evaluation after 48 h", "Both frameworks define the transition as ending at 60 h", "CPS and PES both use the same 72-h transition definition"], "answer": 1, "explanation": "The frameworks have different scopes and transition windows; do not interpret time as a glucose concentration. Why not the others: A. CPS transitional period ends at 48 h; PES at 72 h — The named time windows are reversed.; C. Both frameworks define the transition as ending at 60 h — Neither defines a universal 60-h transition.; D. CPS and PES both use the same 72-h transition definition — PES uses a different clinical evaluation framework.", "pearl": "Keep thresholds and evaluation timing separate.", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 10 Q8 — Neonatal hypoglycemia: CPS 72-h versus PES 48-h framework"}}, {"num": 77, "level": "", "question": "An 8-kg child in a monitored stabilization protocol is ordered F-75 at 130 mL/kg/day divided into 8 feeds. What is the prescribed volume per feed?", "options": ["104 mL/feed", "120 mL/feed", "140 mL/feed", "130 mL/feed"], "answer": 3, "explanation": "8 × 130 = 1040 mL/day; 1040 ÷ 8 = 130 mL/feed. This is a calculation exercise, not an independent feeding prescription. Why not the others: A. 104 mL/feed — Uses 1040 mL/day but divides by ten instead of eight.; B. 120 mL/feed — Undercalculates daily volume or feed count.; C. 140 mL/feed — Overestimates prescribed daily volume.", "pearl": "Write kg × mL/kg/day first, then divide by number of feeds.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 14 Q30 — Complicated SAM: F-75 daily feed-volume calculation"}}];
const NB_CTX={srcId:'Day19',label:'Day 19',set:'Quiz 5',href:'Day19/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day19_QuizSet5_Q63-77_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 19 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 63–77</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 19 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 19'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 19');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day19:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=3009222b"></script></body></html>
