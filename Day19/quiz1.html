<script>
const quiz=[{"num": 1, "level": "", "question": "Echo shows atrioventricular concordance and ventriculoarterial discordance. Which lesion is described?", "options": ["Congenitally corrected TGA", "Double-outlet right ventricle", "Complete d-transposition of the great arteries", "Taussig–Bing DORV"], "answer": 2, "explanation": "The defining finding is VA discordance with preserved AV concordance. Why not the others: A. Congenitally corrected TGA — Has both atrioventricular and ventriculoarterial discordance.; B. Double-outlet right ventricle — Both great arteries arise predominantly from the RV.; D. Taussig–Bing DORV — A subpulmonary VSD accompanies DORV rather than isolated discordance.", "pearl": "The connection sequence, not the spatial position alone, defines d-TGA.", "srcAnswer": "C"}, {"num": 2, "level": "", "question": "All pulmonary veins join a confluence draining via a vertical vein to the left innominate vein. Which type is this?", "options": ["Cardiac TAPVC", "Infracardiac TAPVC", "Mixed TAPVC", "Supracardiac TAPVC"], "answer": 3, "explanation": "Vertical vein to innominate vein is the classic supracardiac route. Why not the others: A. Cardiac TAPVC — Drainage enters coronary sinus or right atrium.; B. Infracardiac TAPVC — Confluence drains below the diaphragm.; C. Mixed TAPVC — Different veins drain through more than one route.", "pearl": "Trace every pulmonary vein before declaring a normal connection.", "srcAnswer": "D"}, {"num": 3, "level": "", "question": "A neonate has one arterial trunk supplying systemic, coronary and pulmonary arteries. What defines this anatomy?", "options": ["Persistent truncus arteriosus", "Aortopulmonary window", "Pulmonary atresia with VSD", "DORV with subaortic VSD"], "answer": 0, "explanation": "A single common arterial trunk is diagnostic. Why not the others: B. Aortopulmonary window — There are two separate semilunar arterial roots with a communication.; C. Pulmonary atresia with VSD — There is no direct RV–PA connection, with pulmonary supply via collateral/ductal routes.; D. DORV with subaortic VSD — Two distinct great arterial roots predominantly arise from the RV.", "pearl": "Truncus often coexists with a large VSD and truncal-valve abnormalities.", "srcAnswer": "A"}, {"num": 4, "level": "", "question": "A functional single-ventricle pathway diverts superior caval venous blood directly into pulmonary arteries. Which operation is described?", "options": ["Bidirectional Glenn", "Modified Blalock–Taussig shunt", "Fontan completion", "Pulmonary artery band"], "answer": 0, "explanation": "Glenn connects SVC to the pulmonary arterial circulation. Why not the others: B. Modified Blalock–Taussig shunt — Connects a systemic artery to a pulmonary artery.; C. Fontan completion — Routes inferior as well as superior systemic venous return to pulmonary arteries.; D. Pulmonary artery band — Restricts antegrade pulmonary blood flow rather than routing caval return.", "pearl": "Glenn physiology requires suitably low pulmonary vascular resistance.", "srcAnswer": "A"}, {"num": 5, "level": "", "question": "A 6-day-old infant develops poor femoral pulses and acidosis as the ductus constricts. Which circulation is failing?", "options": ["Duct-dependent systemic perfusion", "Duct-dependent pulmonary perfusion", "Atrial-level mixing dependence", "Pulmonary venous return dependence"], "answer": 0, "explanation": "Severe neonatal coarctation may require the duct to supply descending aorta. Why not the others: B. Duct-dependent pulmonary perfusion — Would chiefly cause pulmonary oligemia and cyanosis.; C. Atrial-level mixing dependence — Characteristic of restrictive atrial communication in TGA.; D. Pulmonary venous return dependence — Obstructed TAPVC is a venous drainage problem, not ductal systemic flow.", "pearl": "Weak femoral pulses and shock after ductal closure are red flags.", "srcAnswer": "A"}, {"num": 6, "level": "", "question": "An infant has a doming bicuspid aortic valve and a high transvalvular Doppler gradient. Where is the obstruction?", "options": ["Discrete subaortic membrane", "Valvular left ventricular outflow tract", "Supravalvular narrowing", "Isthmic aortic coarctation"], "answer": 1, "explanation": "Doming valve cusps localize valvular aortic stenosis. Why not the others: A. Discrete subaortic membrane — Produces subvalvar obstruction below the cusps.; C. Supravalvular narrowing — Produces narrowing above the sinotubular junction.; D. Isthmic aortic coarctation — Produces descending aortic obstruction beyond the arch branches.", "pearl": "Site matters because balloon valvuloplasty is not treatment for every LVOT lesion.", "srcAnswer": "B"}, {"num": 7, "level": "", "question": "Echo shows a doming pulmonary valve with poststenotic main pulmonary artery dilation. Where is the obstruction?", "options": ["Infundibular RVOT narrowing", "Valvular right ventricular outflow tract", "Supravalvular pulmonary stenosis", "Branch pulmonary artery stenosis"], "answer": 1, "explanation": "Doming leaflets plus poststenotic dilation localize valvar PS. Why not the others: A. Infundibular RVOT narrowing — Dynamic/subvalvular obstruction below the pulmonary valve.; C. Supravalvular pulmonary stenosis — Narrowing lies above the valve.; D. Branch pulmonary artery stenosis — Narrowing affects branch pulmonary arteries.", "pearl": "A dysplastic valve may lack classic poststenotic dilation.", "srcAnswer": "B"}, {"num": 8, "level": "", "question": "A cyanotic term newborn has d-TGA, intact ventricular septum, a small restrictive PFO and poor response to PGE1. Which bridge most directly improves mixing?", "options": ["Increase PGE1 alone", "Balloon atrial septostomy", "Urgent arterial switch without interim mixing", "Selective pulmonary vasodilation alone"], "answer": 1, "explanation": "A restrictive interatrial septum in d-TGA calls for urgent BAS. Why not the others: A. Increase PGE1 alone — A duct alone may not compensate for severely restrictive atrial mixing.; C. Urgent arterial switch without interim mixing — Definitive surgery is needed but unstable oxygen delivery may require prior stabilization.; D. Selective pulmonary vasodilation alone — This cannot correct inadequate intercirculatory mixing at the atrial septum.", "pearl": "Separate the need for mixing from the need for ductal patency.", "srcAnswer": "B"}, {"num": 9, "level": "", "question": "Which feature distinguishes a Senning operation from an arterial switch for d-TGA?", "options": ["Systemic LV supports the aorta", "Systemic RV remains connected to the aorta", "Pulmonary arteries connect directly to SVC", "Coronary buttons are reimplanted onto neoaorta"], "answer": 1, "explanation": "Atrial switch redirects venous pathways without correcting ventriculoarterial discordance. Why not the others: A. Systemic LV supports the aorta — This is the anatomic result of arterial switch.; C. Pulmonary arteries connect directly to SVC — This is cavopulmonary palliation, not an atrial switch.; D. Coronary buttons are reimplanted onto neoaorta — This is integral to arterial switch, not Senning.", "pearl": "Late systemic RV failure and baffle problems are atrial-switch complications.", "srcAnswer": "B"}, {"num": 10, "level": "", "question": "A d-TGA neonate is being planned for arterial switch. Which preoperative echo detail is especially important for operative strategy?", "options": ["Branch pulmonary artery Z-scores alone", "Coronary artery origins and course", "Interatrial septal thickness alone", "Ductus arteriosus diameter alone"], "answer": 1, "explanation": "ASO requires transfer of coronary arteries to the neoaortic root. Why not the others: A. Branch pulmonary artery Z-scores alone — Useful but do not substitute for coronary mapping.; C. Interatrial septal thickness alone — Relevant to BAS, not the key ASO coronary transfer risk.; D. Ductus arteriosus diameter alone — Affects stabilization but not the coronary transfer plan.", "pearl": "Coronary anatomy must be deliberately documented before switch.", "srcAnswer": "B"}, {"num": 11, "level": "", "question": "A newborn with severe cyanosis, respiratory distress and diffuse pulmonary edema has infracardiac obstructed TAPVC. What is definitive treatment?", "options": ["Balloon atrial septostomy as definitive repair", "PGE1 infusion as definitive treatment", "Emergency surgical relief of venous obstruction", "Elective repair after resolution of pulmonary edema"], "answer": 2, "explanation": "Obstructed TAPVC is a surgical emergency. Why not the others: A. Balloon atrial septostomy as definitive repair — An atrial communication is necessary but does not relieve pulmonary venous obstruction.; B. PGE1 infusion as definitive treatment — PGE1 does not correct obstructed pulmonary venous return and is not definitive therapy (general neonatal practice).; D. Elective repair after resolution of pulmonary edema — The edema is caused by obstruction and will not reliably resolve without repair.", "pearl": "Pulmonary venous obstruction can resemble severe respiratory disease.", "srcAnswer": "C"}, {"num": 12, "level": "", "question": "A 5-month-old with mild cyanosis and pulmonary plethora has a snowman configuration on chest radiograph. Which anatomy best fits?", "options": ["Obstructed infracardiac TAPVC", "Cardiac TAPVC to coronary sinus", "Mixed TAPVC with segmental obstruction", "Unobstructed supracardiac TAPVC"], "answer": 3, "explanation": "The snowman/figure-of-eight silhouette classically reflects supracardiac venous drainage. Why not the others: A. Obstructed infracardiac TAPVC — Usually severe neonatal pulmonary edema without classic snowman silhouette.; B. Cardiac TAPVC to coronary sinus — Produces right-sided dilation but not the classic vertical vein silhouette.; C. Mixed TAPVC with segmental obstruction — Imaging is variable, and classic snowman pattern is less expected.", "pearl": "This sign may not be present in newborns.", "srcAnswer": "D"}, {"num": 13, "level": "", "question": "A truncus arteriosus infant develops tachypnea and hepatomegaly at 3 weeks. Which physiologic change most explains deterioration?", "options": ["Postnatal rise in PVR increases pulmonary runoff", "Ductal constriction causes isolated pulmonary oligemia", "Postnatal fall in PVR increases pulmonary runoff", "Restrictive atrial septum limits systemic oxygen delivery"], "answer": 2, "explanation": "Falling PVR increases pulmonary flow and heart failure in truncus. Why not the others: A. Postnatal rise in PVR increases pulmonary runoff — A higher PVR generally reduces pulmonary flow.; B. Ductal constriction causes isolated pulmonary oligemia — Truncus often supplies pulmonary arteries directly from the trunk.; D. Restrictive atrial septum limits systemic oxygen delivery — Truncus is a common-mixing lesion rather than parallel circuits.", "pearl": "Do not assume cyanotic lesions always have reduced pulmonary blood flow.", "srcAnswer": "C"}, {"num": 14, "level": "", "question": "A 2-day-old with hypoplastic left heart syndrome has aortic atresia, tiny ascending aorta, restrictive systemic outflow and worsening perfusion as the duct narrows. Which initial strategy best preserves systemic output while preparing for stage-I palliation?", "options": ["A. Maintain ductal patency with PGE1 and urgently assess atrial-level mixing before Norwood-type palliation", "B. Perform bidirectional Glenn after immediate ductal closure", "C. Prioritize isolated balloon pulmonary valvotomy to restore systemic outflow", "D. Close the atrial septum to increase LV preload"], "answer": 0, "explanation": "Correct: HLHS with aortic atresia needs ductal systemic flow, expert stabilization and consideration of atrial restriction before stage-I Norwood/hybrid strategy. Why not the others: B. B. Perform bidirectional Glenn after immediate ductal closure — Glenn is later-stage SVC-to-PA palliation; ductal closure threatens systemic perfusion.; C. C. Prioritize isolated balloon pulmonary valvotomy to restore systemic outflow — Pulmonary valve dilation does not create a usable systemic LV outflow in HLHS.; D. D. Close the atrial septum to increase LV preload — A restrictive atrial septum can critically obstruct pulmonary venous egress and must not be deliberately closed.", "pearl": "HLHS: ductal systemic perfusion and atrial communication determine neonatal rescue.", "srcAnswer": "A"}, {"num": 15, "level": "", "question": "Following bidirectional Glenn, which venous territory still returns directly to the heart rather than pulmonary arteries?", "options": ["Superior vena caval circulation", "Inferior vena caval circulation", "Right jugular venous circulation", "Left brachiocephalic venous circulation"], "answer": 1, "explanation": "Glenn diverts SVC blood; IVC flow remains to heart until Fontan. Why not the others: A. Superior vena caval circulation — SVC is connected to the pulmonary arterial pathway.; C. Right jugular venous circulation — Jugular blood enters SVC and Glenn pathway.; D. Left brachiocephalic venous circulation — Usually drains into SVC and hence Glenn pathway.", "pearl": "Oxygen saturation after Glenn is normally below fully saturated levels.", "srcAnswer": "B"}, {"num": 16, "level": "", "question": "A 9-year-old has arm hypertension and delayed femoral pulses. Which echo finding most supports significant coarctation?", "options": ["Normal pulsatile abdominal aortic Doppler", "Isolated mild acceleration across bicuspid aortic valve", "Persistent diastolic forward flow in descending aorta", "Isolated right ventricular hypertrophy"], "answer": 2, "explanation": "Diastolic runoff/continuous forward flow is a key coarctation Doppler clue. Why not the others: A. Normal pulsatile abdominal aortic Doppler — Argues against hemodynamically severe obstruction.; B. Isolated mild acceleration across bicuspid aortic valve — Suggests valvar obstruction rather than coarctation.; D. Isolated right ventricular hypertrophy — Does not establish aortic isthmic obstruction.", "pearl": "Do not rely solely on peak Doppler gradient in low output.", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day19',label:'Day 19',set:'Quiz 1',href:'Day19/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day19_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 19 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 19 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 19'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 19');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day19:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=7b794efe"></script></body></html>
