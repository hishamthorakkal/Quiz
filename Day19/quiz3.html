<script>
const quiz=[{"num": 33, "level": "", "question": "A neonate with tricuspid atresia has low saturations and severe pulmonary stenosis. Which initial measure may preserve pulmonary flow?", "options": ["Immediate pulmonary artery banding", "Stop ductal patency to prevent pulmonary overcirculation", "Proceed directly to Fontan in neonatal period", "PGE1 followed by individualized pulmonary-flow palliation"], "answer": 3, "explanation": "Pulmonary blood-flow restriction dictates ductal support and shunt/stent decisions. Why not the others: A. Immediate pulmonary artery banding — Further reduces already inadequate pulmonary flow.; B. Stop ductal patency to prevent pulmonary overcirculation — This infant is undercirculated.; C. Proceed directly to Fontan in neonatal period — Fontan requires staged preparation and low PVR.", "pearl": "Single ventricle can present with either high or low pulmonary blood flow.", "srcAnswer": "D"}, {"num": 34, "level": "", "question": "A 7-month-old with a prior systemic-to-pulmonary shunt has acceptable PA anatomy and low PVR. What is the typical next stage?", "options": ["Completion Fontan after the current Glenn assessment", "Repeat systemic-to-pulmonary shunt for stable adequate PA anatomy", "Bidirectional Glenn", "Pulmonary artery banding to restrict flow after the shunt"], "answer": 2, "explanation": "Glenn commonly follows neonatal palliation once PVR has fallen. Why not the others: A. Completion Fontan after the current Glenn assessment — Fontan is generally later, after staged Glenn physiology.; B. Repeat systemic-to-pulmonary shunt for stable adequate PA anatomy — Would add shunt flow instead of transitioning to Glenn.; D. Pulmonary artery banding to restrict flow after the shunt — Not the usual next stage when Glenn criteria are met.", "pearl": "Indian 2019 consensus: standard Glenn 6–12 months (Class I), with selected patients considered at 4–6 months.", "srcAnswer": "C"}, {"num": 35, "level": "", "question": "A post-Fontan child has edema, low albumin and increased stool alpha-1 antitrypsin clearance. What is the likely complication?", "options": ["Plastic bronchitis", "Chylothorax", "Fontan-associated liver disease alone", "Protein-losing enteropathy"], "answer": 3, "explanation": "Elevated enteric protein loss after Fontan suggests PLE. Why not the others: A. Plastic bronchitis — Produces bronchial casts and respiratory symptoms.; B. Chylothorax — Produces chylous pleural fluid and respiratory compromise.; C. Fontan-associated liver disease alone — May coexist but does not explain enteric protein loss marker.", "pearl": "Fontan complications span gut, lung, liver and lymphatics.", "srcAnswer": "D"}, {"num": 36, "level": "", "question": "A post-Fontan adolescent expectorates branching rubbery casts with acute hypoxemia. What complication is likely?", "options": ["Plastic bronchitis", "Protein-losing enteropathy", "Pulmonary vein stenosis", "Chronic thromboembolic pulmonary disease"], "answer": 0, "explanation": "Bronchial casts are the hallmark of Fontan-associated plastic bronchitis. Why not the others: B. Protein-losing enteropathy — Causes hypoalbuminemia and edema, not airway casts.; C. Pulmonary vein stenosis — May cause dyspnea but not characteristic branching casts.; D. Chronic thromboembolic pulmonary disease — May cause hypoxemia but not bronchial cast formation.", "pearl": "Investigate lymphatic and Fontan hemodynamics when casts recur.", "srcAnswer": "A"}, {"num": 37, "level": "", "question": "A Fontan patient develops new desaturation and suspected elevated pathway pressure. Which variable most directly determines passive pulmonary blood flow?", "options": ["Systemic LV outflow gradient alone", "Atrial septal defect diameter alone", "Coronary ostial geometry alone", "Transpulmonary pressure gradient and pulmonary vascular resistance"], "answer": 3, "explanation": "Fontan flow depends on low PVR and an unobstructed pathway. Why not the others: A. Systemic LV outflow gradient alone — Relevant to systemic output but not the primary passive pulmonary circuit determinant.; B. Atrial septal defect diameter alone — May affect fenestration shunt but not the central resistance mechanism.; C. Coronary ostial geometry alone — Does not directly determine passive caval-to-PA flow.", "pearl": "A small rise in PVR can severely impair Fontan cardiac output.", "srcAnswer": "D"}, {"num": 38, "level": "", "question": "A 2-week-old has shock, weak femorals, oliguria and LV dysfunction. Echo shows critical juxtaductal narrowing. First stabilization?", "options": ["Fluid resuscitation and inotropy before assessing ductal patency", "Urgent balloon angioplasty before PGE1 in a shocked neonate", "PGE1, hemodynamic support and urgent arch-team assessment", "Mechanical ventilation and diuresis without arch-directed therapy"], "answer": 2, "explanation": "Reopen/maintain ductal systemic flow while preparing definitive treatment. Why not the others: A. Fluid resuscitation and inotropy before assessing ductal patency — Support may be required, but ductal systemic flow should be addressed promptly.; B. Urgent balloon angioplasty before PGE1 in a shocked neonate — Balloon can bridge selected high-risk cases, but PGE1 stabilization is first-line.; D. Mechanical ventilation and diuresis without arch-directed therapy — Support alone does not restore distal systemic perfusion.", "pearl": "Treat perfusion failure before waiting for gradient criteria.", "srcAnswer": "C"}, {"num": 39, "level": "", "question": "An adolescent with repaired coarctation has upper-limb hypertension despite no major resting gradient. Which concern remains relevant?", "options": ["Persistent vascular dysfunction and residual/recurrent obstruction", "Recoarctation is unlikely if resting Doppler is normal", "Exercise hypertension is unlikely if resting BP is normal", "Upper-limb hypertension is mainly due to bicuspid valve alone"], "answer": 0, "explanation": "Lifelong BP and aortic surveillance is required after coarctation repair. Why not the others: B. Recoarctation is unlikely if resting Doppler is normal — Normal gradient does not exclude vascular hypertension or restenosis.; C. Exercise hypertension is unlikely if resting BP is normal — Exercise hypertension can occur despite reassuring resting findings.; D. Upper-limb hypertension is mainly due to bicuspid valve alone — BAV may coexist but does not explain vascular sequelae after CoA repair.", "pearl": "Arm BP, femoral pulses and imaging remain important long term.", "srcAnswer": "A"}, {"num": 40, "level": "", "question": "A 12-year-old girl with Turner syndrome has upper-extremity hypertension, delayed femoral pulses and a focal aortic narrowing distal to the left subclavian artery. Which associated assessment is particularly important before planning intervention?", "options": ["A. Screen for isolated pulmonary venous obstruction as the expected cause of arm hypertension", "B. Define coarctation/arch anatomy and assess aortic dimensions, bicuspid valve and dissection risk", "C. Assume a normal aortic arch if four-extremity oxygen saturations are equal", "D. Choose balloon atrial septostomy because left-sided obstruction causes restricted mixing"], "answer": 1, "explanation": "Correct: assess aortic anatomy and associated bicuspid aortic valve, aortopathy and procedural risk; decisions are individualized. Why not the others: A. A. Screen for isolated pulmonary venous obstruction as the expected cause of arm hypertension — Turner syndrome may have left-sided cardiovascular lesions, but isolated pulmonary venous obstruction does not explain classic arch coarctation findings.; C. C. Assume a normal aortic arch if four-extremity oxygen saturations are equal — Equal limb saturations cannot exclude CoA, and imaging is essential.; D. D. Choose balloon atrial septostomy because left-sided obstruction causes restricted mixing — Atrial septostomy addresses restrictive atrial mixing, not coarctation of the aorta.", "pearl": "Turner plus CoA: assess associated aortopathy and BAV, not only the measured gradient.", "srcAnswer": "B"}, {"num": 41, "level": "", "question": "A 14-year-old has arm BP 150/90, leg BP 112/75 and collateral vessels. Doppler gradient is 16 mmHg. What is most appropriate interpretation?", "options": ["Gradient below 20 excludes intervention", "Collaterals prove no significant obstruction", "Clinically important coarctation remains possible despite gradient <20", "Pressure discrepancy is explained by pulmonary valve disease"], "answer": 2, "explanation": "Indian guidance includes hypertension and collaterals even with low gradient. Why not the others: A. Gradient below 20 excludes intervention — Hypertension/collaterals are additional intervention criteria.; B. Collaterals prove no significant obstruction — Collateral development often reflects longstanding obstruction.; D. Pressure discrepancy is explained by pulmonary valve disease — Pulmonary valve stenosis does not cause arm–leg BP gradient.", "pearl": "Gradients alone understate disease when collateral flow is prominent.", "srcAnswer": "C"}, {"num": 42, "level": "", "question": "A child with Williams–Beuren syndrome has a discrete hourglass narrowing at the sinotubular junction, a normal-appearing mobile aortic valve and systemic hypertension. Which lesion and mechanism best account for the gradient?", "options": ["A. Congenital valvar aortic stenosis caused by fused aortic cusps", "B. Supravalvar aortic stenosis related to elastin haploinsufficiency", "C. Discrete subaortic membrane producing fixed LVOT obstruction below the valve", "D. Hypertrophic obstructive cardiomyopathy with dynamic septal contact"], "answer": 1, "explanation": "Correct: Williams–Beuren-associated ELN deletion produces elastin arteriopathy including sinotubular junction supravalvar narrowing. Why not the others: A. A. Congenital valvar aortic stenosis caused by fused aortic cusps — Valvar stenosis is at the aortic cusps, contrary to a normal valve and narrowing above it.; C. C. Discrete subaortic membrane producing fixed LVOT obstruction below the valve — A subaortic membrane lies below the cusps, not at the sinotubular junction.; D. D. Hypertrophic obstructive cardiomyopathy with dynamic septal contact — Dynamic muscle obstruction is subvalvar and would have a different echocardiographic mechanism.", "pearl": "Williams: identify supravalvar (not valvar or subvalvar) obstruction and wider arteriopathy.", "srcAnswer": "B"}, {"num": 43, "level": "", "question": "An infant with valvar AS has severe LV dysfunction but modest Doppler gradient. Why can this still warrant intervention?", "options": ["Low stroke volume may underestimate obstruction severity", "Gradient may be low because the stenosis has regressed", "LV dysfunction more strongly suggests isolated myocarditis", "Only invasive peak-to-peak gradient is valid during LV failure"], "answer": 0, "explanation": "Indian guidance recommends intervention for dysfunction attributable to severe AS regardless of gradient. Why not the others: B. Gradient may be low because the stenosis has regressed — A fixed stenotic valve does not regress simply because output falls.; C. LV dysfunction more strongly suggests isolated myocarditis — Severe valvar obstruction itself can depress LV function.; D. Only invasive peak-to-peak gradient is valid during LV failure — Invasive measures are also flow dependent and must be interpreted with anatomy.", "pearl": "Low-flow low-gradient disease is a recurring congenital obstruction trap.", "srcAnswer": "A"}, {"num": 44, "level": "", "question": "A cyanotic newborn has critical valvar PS, small RV and right-to-left atrial shunting. Which support is reasonable before intervention?", "options": ["PGE1 if pulmonary circulation is duct dependent", "Routine diuresis to reduce pulmonary flow", "Immediate pulmonary artery band", "Close PDA to increase RV forward flow"], "answer": 0, "explanation": "Critical PS can be a duct-dependent pulmonary-flow lesion. Why not the others: B. Routine diuresis to reduce pulmonary flow — Could further impair preload/flow.; C. Immediate pulmonary artery band — Would worsen restricted pulmonary flow.; D. Close PDA to increase RV forward flow — Would remove compensatory pulmonary supply.", "pearl": "Cyanosis can result from atrial right-to-left shunting in critical PS.", "srcAnswer": "A"}, {"num": 45, "level": "", "question": "A child with Noonan syndrome has a dysplastic pulmonary valve, hypoplastic annulus and severe PS. Which caveat applies?", "options": ["Balloon valvuloplasty has the same response in dysplastic and doming valves", "Pulmonary artery banding may relieve RV systolic pressure", "Branch PA dilation is preferred before treating the pulmonary valve", "Surgical intervention may be needed despite attempted balloon strategy"], "answer": 3, "explanation": "Dysplastic PS with hypoplastic annulus is a recognized surgical scenario. Why not the others: A. Balloon valvuloplasty has the same response in dysplastic and doming valves — Dysplastic morphology and annular hypoplasia may reduce success.; B. Pulmonary artery banding may relieve RV systolic pressure — Banding increases RV outflow resistance rather than relieving PS.; C. Branch PA dilation is preferred before treating the pulmonary valve — The dominant lesion is valvar/annular, not a branch narrowing.", "pearl": "Distinguish commissural fusion from dysplastic leaflets.", "srcAnswer": "D"}, {"num": 46, "level": "", "question": "A cyanotic neonate with pulmonary atresia becomes markedly hypoxemic after stopping PGE1. What is the most likely mechanism?", "options": ["Acute rise in pulmonary vascular resistance despite unchanged ductal caliber", "Reduced antegrade RV output from critical valve disease", "Loss of ductal pulmonary blood flow", "Restrictive interatrial communication with decreased mixing"], "answer": 2, "explanation": "Ductal closure can abruptly remove the sole pulmonary blood supply. Why not the others: A. Acute rise in pulmonary vascular resistance despite unchanged ductal caliber — PVR can worsen oxygenation, but the close temporal link to stopping PGE1 favors duct closure.; B. Reduced antegrade RV output from critical valve disease — Underlying anatomy limits flow, but the lost duct is the abrupt precipitant.; D. Restrictive interatrial communication with decreased mixing — Could worsen cyanosis in some lesions but not the main duct-dependent pulmonary mechanism.", "pearl": "Do not stop PGE1 until anatomy and alternate pulmonary flow are secure.", "srcAnswer": "C"}, {"num": 47, "level": "", "question": "A 3-day-old with suspected interrupted aortic arch has worsening metabolic acidosis as ductal flow falls. Which vascular bed is directly threatened?", "options": ["Coronary perfusion distal to the interruption", "Cerebral perfusion through the carotid arteries", "Pulmonary blood flow through branch pulmonary arteries", "Descending systemic circulation"], "answer": 3, "explanation": "Arch interruption may depend on ductus for lower-body systemic perfusion. Why not the others: A. Coronary perfusion distal to the interruption — Coronary origins are generally proximal to the arch interruption.; B. Cerebral perfusion through the carotid arteries — Head vessels usually arise proximal to the interrupted segment.; C. Pulmonary blood flow through branch pulmonary arteries — The immediate duct-dependent vascular bed is distal systemic aorta.", "pearl": "Urgent PGE1 can be life-saving before anatomical confirmation.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day19',label:'Day 19',set:'Quiz 3',href:'Day19/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day19_QuizSet3_Q33-47_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 19 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 33–47</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 19 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 19'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 19');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day19:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=a980f196"></script></body></html>
