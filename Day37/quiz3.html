<script>
const quiz=[{"num": 31, "level": "Clinical", "question": "Most common childhood acute leukaemia subtype?", "options": ["Acute promyelocytic leukaemia", "Hairy-cell leukaemia", "Chronic myeloid leukaemia", "Acute lymphoblastic leukaemia"], "answer": 3, "explanation": "ALL predominates among paediatric acute leukaemias. Why not the others (added — not from source): A. Acute promyelocytic leukaemia — APL is a subtype of AML, which itself is much less common than ALL in children.; B. Hairy-cell leukaemia — Hairy-cell leukaemia is a chronic B-cell disease of adults and essentially absent in children.; C. Chronic myeloid leukaemia — CML is rare in childhood, accounting for only a small fraction of paediatric leukaemias, and is chronic, not acute.", "pearl": "", "srcAnswer": "B"}, {"num": 32, "level": "Clinical", "question": "Tumour lysis syndrome classically causes?", "options": ["Isolated hypernatraemia", "Hyperkalaemia, hyperphosphataemia and hyperuricaemia", "Hypokalaemia and hypophosphataemia", "Low urate and low potassium"], "answer": 1, "explanation": "Rapid cell breakdown releases intracellular potassium, phosphate and nucleic acids. Why not the others (added — not from source): A. Isolated hypernatraemia — Isolated hypernatraemia is not a feature of TLS; the defining changes are high potassium, phosphate and urate with low calcium.; C. Hypokalaemia and hypophosphataemia — TLS causes hyperkalaemia and hyperphosphataemia, not hypokalaemia and hypophosphataemia.; D. Low urate and low potassium — Cell breakdown raises urate and potassium; both are low in this option.", "pearl": "", "srcAnswer": "C"}, {"num": 33, "level": "Clinical", "question": "Tumour lysis syndrome can cause hypocalcaemia because?", "options": ["Vitamin D increases", "Albumin rises acutely", "Phosphate binds calcium", "Urate binds iron"], "answer": 2, "explanation": "Hyperphosphataemia promotes calcium-phosphate precipitation. Why not the others (added — not from source): A. Vitamin D increases — Hyperphosphataemia actually suppresses calcitriol formation; increased vitamin D would raise calcium.; B. Albumin rises acutely — Albumin does not rise acutely in TLS; a rise would increase, not lower, total calcium.; D. Urate binds iron — Urate does not bind iron, and iron has no role in TLS hypocalcaemia.", "pearl": "", "srcAnswer": "C"}, {"num": 34, "level": "Clinical", "question": "An infant with fever, hepatosplenomegaly, cytopenias and very high ferritin: consider?", "options": ["Haemophagocytic lymphohistiocytosis", "Haemophilia A", "Isolated iron deficiency", "Mild ITP"], "answer": 0, "explanation": "HLH is a hyperinflammatory syndrome with characteristic systemic findings. Why not the others (added — not from source): B. Haemophilia A — Haemophilia A causes bleeding with prolonged aPTT, not fever, organomegaly, cytopenias and hyperferritinaemia.; C. Isolated iron deficiency — Iron deficiency gives a low, not very high, ferritin and causes no fever or splenomegaly.; D. Mild ITP — Mild ITP causes isolated thrombocytopenia without fever, hepatosplenomegaly or raised ferritin.", "pearl": "", "srcAnswer": "C"}, {"num": 35, "level": "Clinical", "question": "In suspected HLH, which measurement is part of established diagnostic criteria?", "options": ["Bleeding time alone", "Serum ceruloplasmin", "Soluble IL-2 receptor (sCD25)", "Serum HbA2"], "answer": 2, "explanation": "Elevated sCD25 reflects T-cell activation and is part of HLH-2004 criteria. Why not the others (added — not from source): A. Bleeding time alone — Bleeding time is a test of platelet function and is not an HLH criterion; hypofibrinogenaemia is the coagulation criterion.; B. Serum ceruloplasmin — Ceruloplasmin is used to evaluate Wilson disease, not HLH.; D. Serum HbA2 — HbA2 is used to screen for beta-thalassaemia trait, not HLH.", "pearl": "", "srcAnswer": "A"}, {"num": 36, "level": "Clinical", "question": "Which peripheral-smear finding is typical of microangiopathic haemolytic anaemia?", "options": ["Hypersegmented neutrophils alone", "Schistocytes", "Target cells alone", "Howell–Jolly bodies alone"], "answer": 1, "explanation": "Mechanical red-cell fragmentation produces schistocytes. Why not the others (added — not from source): A. Hypersegmented neutrophils alone — Hypersegmented neutrophils indicate megaloblastic anaemia, not red-cell fragmentation.; C. Target cells alone — Target cells are seen in thalassaemia, liver disease and haemoglobinopathies, not mechanical red-cell injury.; D. Howell–Jolly bodies alone — Howell-Jolly bodies indicate hyposplenism or asplenia, not microangiopathy.", "pearl": "", "srcAnswer": "C"}, {"num": 37, "level": "Clinical", "question": "A child with anaemia, thrombocytopenia and AKI after bloody diarrhoea: likely?", "options": ["Isolated ITP", "Haemophilia A", "Iron deficiency", "STEC-associated HUS"], "answer": 3, "explanation": "The triad after diarrhoeal illness strongly suggests STEC-HUS. Why not the others (added — not from source): A. Isolated ITP — ITP lacks microangiopathic haemolysis and AKI; the triad after bloody diarrhoea indicates HUS.; B. Haemophilia A — Haemophilia A causes bleeding with normal platelets and no haemolysis or renal failure.; C. Iron deficiency — Iron deficiency does not cause thrombocytopenia or AKI, and is not a post-diarrhoeal acute illness.", "pearl": "", "srcAnswer": "D"}, {"num": 38, "level": "Clinical", "question": "In suspected STEC diarrhoea, avoid routine use of which intervention?", "options": ["Antimotility agents", "Electrolyte monitoring", "Oral rehydration", "Assessment of hydration"], "answer": 0, "explanation": "Antimotility agents may worsen outcomes; antibiotic decisions also require caution. Why not the others (added — not from source): B. Electrolyte monitoring — Electrolyte and renal monitoring is needed to detect evolving HUS and should not be avoided.; C. Oral rehydration — Oral rehydration is core supportive care in STEC diarrhoea and helps protect renal perfusion.; D. Assessment of hydration — Hydration assessment is essential; volume expansion may reduce the risk of severe HUS.", "pearl": "", "srcAnswer": "B"}, {"num": 39, "level": "Clinical", "question": "A neonate has pallor and severe jaundice with positive maternal antibody screen: consider?", "options": ["Thalassaemia trait only", "Fanconi anaemia", "Haemolytic disease of fetus and newborn", "Isolated ITP"], "answer": 2, "explanation": "Maternal alloantibodies can cause fetal and neonatal immune haemolysis. Why not the others (added — not from source): A. Thalassaemia trait only — Thalassaemia trait causes mild microcytosis without significant neonatal haemolysis, and it has no link to a positive maternal antibody screen.; B. Fanconi anaemia — Fanconi anaemia is an inherited marrow failure syndrome presenting with cytopenias later in childhood, not neonatal haemolytic jaundice linked to maternal antibodies.; D. Isolated ITP — ITP causes isolated thrombocytopenia with petechiae, not pallor with severe jaundice; neonatal immune thrombocytopenia would not explain haemolysis.", "pearl": "", "srcAnswer": "D"}, {"num": 40, "level": "Clinical", "question": "An anaemic child has low reticulocyte count despite profound anaemia. This indicates?", "options": ["Always acute haemorrhage", "Normal compensatory erythropoiesis", "Inadequate marrow response", "Obligatory haemolysis"], "answer": 2, "explanation": "Reticulocytopenia points to underproduction or marrow suppression. Why not the others (added — not from source): A. Always acute haemorrhage — Acute haemorrhage is followed by a reticulocyte rise within days; reticulocytopenia does not point to bleeding, and 'always' is wrong.; B. Normal compensatory erythropoiesis — Normal compensation to profound anaemia is an elevated reticulocyte count; a low count means the marrow is failing to respond.; D. Obligatory haemolysis — Haemolysis with a functioning marrow produces reticulocytosis; a low count argues against compensated haemolysis unless there is a superimposed aplastic crisis.", "pearl": "", "srcAnswer": "B"}, {"num": 41, "level": "Clinical", "question": "A child with fever, sore throat, cervical nodes and atypical lymphocytes: likely cause?", "options": ["Factor V deficiency", "Haemophilia", "Iron deficiency", "EBV infection"], "answer": 3, "explanation": "Reactive atypical lymphocytosis commonly accompanies EBV infection. Why not the others (added — not from source): A. Factor V deficiency — Factor V deficiency is a rare bleeding disorder and does not cause fever, pharyngitis, lymphadenopathy or atypical lymphocytes.; B. Haemophilia — Haemophilia is an inherited coagulation defect presenting with deep bleeding; it does not produce an infectious-mononucleosis picture.; C. Iron deficiency — Iron deficiency causes microcytic anaemia, not an acute febrile illness with sore throat, cervical nodes and reactive atypical lymphocytes.", "pearl": "", "srcAnswer": "B"}, {"num": 42, "level": "Clinical", "question": "A child with massive splenomegaly and leucoerythroblastic smear needs assessment for?", "options": ["Isolated uncomplicated ITP", "Marrow infiltration or myeloproliferative process", "Vitamin C deficiency only", "Simple dehydration"], "answer": 1, "explanation": "Immature myeloid and erythroid cells suggest marrow stress or infiltration. Why not the others (added — not from source): A. Isolated uncomplicated ITP — Uncomplicated ITP has a normal spleen and an isolated low platelet count; massive splenomegaly and a leucoerythroblastic film exclude it.; C. Vitamin C deficiency only — Scurvy causes gum bleeding, perifollicular haemorrhage and bone pain, not massive splenomegaly with a leucoerythroblastic picture.; D. Simple dehydration — Dehydration causes haemoconcentration, not massive splenomegaly or circulating nucleated red cells and immature myeloid precursors.", "pearl": "", "srcAnswer": "D"}, {"num": 43, "level": "Clinical", "question": "An isolated prolonged PT with normal aPTT can reflect deficiency of?", "options": ["Factor VII", "Factor VIII", "Factor IX", "Factor XI"], "answer": 0, "explanation": "Factor VII is in the extrinsic pathway assessed by PT. Why not the others (added — not from source): B. Factor VIII — Factor VIII is in the intrinsic pathway; its deficiency prolongs aPTT with a normal PT, the opposite pattern.; C. Factor IX — Factor IX deficiency (haemophilia B) prolongs aPTT with normal PT; only factor VII deficiency isolates the PT.; D. Factor XI — Factor XI deficiency prolongs aPTT, not PT, since factor XI belongs to the intrinsic pathway.", "pearl": "", "srcAnswer": "D"}, {"num": 44, "level": "Clinical", "question": "Which factor deficiency typically does not cause clinical bleeding despite prolonged aPTT?", "options": ["Factor IX", "Factor XI", "Factor XII", "Factor VIII"], "answer": 2, "explanation": "Contact factor XII deficiency prolongs aPTT but generally does not cause bleeding. Why not the others (added — not from source): A. Factor IX — Factor IX deficiency (haemophilia B) prolongs aPTT and causes significant deep-tissue and joint bleeding.; B. Factor XI — Factor XI deficiency prolongs aPTT and causes variable bleeding, especially after surgery or trauma, unlike factor XII deficiency which causes none.; D. Factor VIII — Factor VIII deficiency (haemophilia A) prolongs aPTT and causes clinically important haemarthroses and muscle bleeds.", "pearl": "", "srcAnswer": "D"}, {"num": 45, "level": "Clinical", "question": "Severe neutropenia is conventionally ANC below?", "options": ["3000 cells/µL", "500 cells/µL", "5000 cells/µL", "1500 cells/µL"], "answer": 1, "explanation": "ANC <500/µL is the usual severe-neutropenia threshold. Why not the others (added — not from source): A. 3000 cells/µL — 3000/uL is a normal ANC, not a neutropenia threshold at all.; C. 5000 cells/µL — 5000/uL is a normal ANC; neutropenia is defined as ANC below 1500/uL beyond infancy.; D. 1500 cells/µL — Below 1500/uL defines neutropenia generally (mild is 1000-1500/uL), not severe neutropenia, which is below 500/uL.", "pearl": "", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day37',label:'Day 37',set:'Quiz 3',href:'Day37/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day37_QuizSet3_Q31-45_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 37 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 31–45</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 37 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 37'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 37');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day37:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
