@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 16, "level": "Conceptual", "question": "A toddler has HbSS with painful swelling of hands and feet. This is?", "options": ["Acute lymphoblastic leukaemia", "Septic arthritis in every case", "Dactylitis from vaso-occlusion", "Rheumatic fever"], "answer": 2, "explanation": "Hand-foot syndrome is an early vaso-occlusive manifestation of sickle cell disease. Why not the others (added — not from source): A. Acute lymphoblastic leukaemia — ALL can cause bone pain, but painful hand and foot swelling in a toddler with HbSS is the classic early vaso-occlusive event.; B. Septic arthritis in every case — Osteomyelitis or septic arthritis must be considered, but hand-foot swelling in an HbSS toddler is usually vaso-occlusive dactylitis, not sepsis in every case.; D. Rheumatic fever — Rheumatic fever causes migratory large-joint arthritis in school-age children, not symmetrical hand-foot swelling in an HbSS toddler.", "pearl": "", "srcAnswer": "B"}, {"num": 17, "level": "Conceptual", "question": "A febrile child with sickle cell disease requires?", "options": ["Routine observation without cultures", "Prompt assessment and empiric parenteral antibiotics per local protocol", "Delayed review after 72 hours", "Iron tablets only"], "answer": 1, "explanation": "Functional asplenia increases risk of invasive bacterial infection. Why not the others (added — not from source): A. Routine observation without cultures — Functional asplenia puts these children at risk of fulminant pneumococcal sepsis; observation without cultures is unsafe.; C. Delayed review after 72 hours — Delaying review risks rapid progression of invasive bacterial infection; fever is a medical emergency in SCD.; D. Iron tablets only — Iron is not indicated for fever, and iron deficiency is not the issue in SCD; infection must be addressed urgently.", "pearl": "", "srcAnswer": "B"}, {"num": 18, "level": "Conceptual", "question": "Sickle cell patient has new infiltrate, fever and respiratory symptoms: diagnose?", "options": ["Isolated pain crisis", "Splenic sequestration", "Iron overload", "Acute chest syndrome"], "answer": 3, "explanation": "Acute chest syndrome requires a new pulmonary infiltrate with compatible symptoms. Why not the others (added — not from source): A. Isolated pain crisis — A pain crisis alone does not produce a new pulmonary infiltrate with fever and respiratory symptoms.; B. Splenic sequestration — Splenic sequestration presents with acute splenomegaly and falling haemoglobin, not a pulmonary infiltrate.; C. Iron overload — Iron overload is a chronic transfusion complication affecting liver, heart and endocrine glands, not an acute febrile infiltrate.", "pearl": "", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "A child with sickle cell disease has sudden splenomegaly, shock and falling Hb: suspect?", "options": ["Folate deficiency", "Acute splenic sequestration", "Mild iron deficiency", "Immune thrombocytopenia"], "answer": 1, "explanation": "Rapid splenic pooling may cause life-threatening hypovolaemia. Why not the others (added — not from source): A. Folate deficiency — Folate deficiency can worsen anaemia gradually but does not cause sudden splenomegaly and hypovolaemic shock.; C. Mild iron deficiency — Mild iron deficiency develops slowly and does not cause shock or acute splenomegaly.; D. Immune thrombocytopenia — ITP causes isolated thrombocytopenia with bleeding, not acute splenic enlargement with shock.", "pearl": "", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "Which intervention reduces stroke risk in HbSS children with abnormal TCD velocities?", "options": ["Routine oral iron", "Chronic transfusion programme after specialist assessment", "Avoidance of vaccination", "Splenectomy for all"], "answer": 1, "explanation": "High-risk TCD identifies children who benefit from stroke-prevention transfusions. Why not the others (added — not from source): A. Routine oral iron — Oral iron has no role in stroke prevention and may worsen iron loading in transfused patients.; C. Avoidance of vaccination — Vaccination is essential in SCD for infection protection and does not affect stroke risk.; D. Splenectomy for all — Splenectomy is reserved for recurrent sequestration and does not reduce stroke risk; most HbSS children already have functional asplenia.", "pearl": "", "srcAnswer": "B"}, {"num": 21, "level": "Clinical", "question": "A child with transfusion-dependent thalassaemia needs surveillance primarily for?", "options": ["Vitamin K deficiency only", "Congenital platelet dysfunction", "Isolated neutropenia", "Transfusional iron overload"], "answer": 3, "explanation": "Repeated red-cell transfusions cause progressive tissue iron deposition. Why not the others (added — not from source): A. Vitamin K deficiency only — Vitamin K deficiency is not the main concern; cumulative iron deposition in heart, liver and endocrine organs is.; B. Congenital platelet dysfunction — Transfusion does not cause congenital platelet dysfunction; congenital disorders are inherited, not acquired.; C. Isolated neutropenia — Isolated neutropenia is not the expected major complication of chronic red-cell transfusion.", "pearl": "", "srcAnswer": "B"}, {"num": 22, "level": "Clinical", "question": "Hb electrophoresis with elevated HbA2 commonly supports?", "options": ["G6PD deficiency", "Beta-thalassaemia trait", "Iron deficiency", "Alpha-thalassaemia silent carrier"], "answer": 1, "explanation": "Raised HbA2 is typical of beta-thalassaemia trait, though iron deficiency may complicate interpretation. Why not the others (added — not from source): A. G6PD deficiency — G6PD deficiency is an enzymopathy with a normal haemoglobin electrophoresis.; C. Iron deficiency — Iron deficiency lowers HbA2 and can mask beta-thalassaemia trait; it does not raise it.; D. Alpha-thalassaemia silent carrier — A silent alpha-thalassaemia carrier has normal or low-normal HbA2, not elevated.", "pearl": "", "srcAnswer": "C"}, {"num": 23, "level": "Clinical", "question": "A child with isolated thrombocytopenia after viral illness and no systemic red flags: likely?", "options": ["Aplastic anaemia", "Haemophilia A", "Immune thrombocytopenia", "Vitamin B12 deficiency"], "answer": 2, "explanation": "ITP typically presents with isolated thrombocytopenia and otherwise reassuring examination. Why not the others (added — not from source): A. Aplastic anaemia — Aplastic anaemia causes pancytopenia, not isolated thrombocytopenia.; B. Haemophilia A — Haemophilia A has a normal platelet count with prolonged aPTT and deep bleeding.; D. Vitamin B12 deficiency — B12 deficiency causes macrocytic anaemia, often with pancytopenia, not isolated post-viral thrombocytopenia.", "pearl": "", "srcAnswer": "C"}, {"num": 24, "level": "Clinical", "question": "Newly diagnosed ITP with minor skin-only bleeding is generally managed based on?", "options": ["Routine splenectomy", "Platelet count alone regardless of symptoms", "Mandatory platelet transfusion", "Bleeding severity rather than platelet count alone"], "answer": 3, "explanation": "Observation is often appropriate for mild bleeding; treatment is individualised. Why not the others (added — not from source): A. Routine splenectomy — Splenectomy is reserved for chronic refractory ITP and is not used for newly diagnosed disease with mild bleeding.; B. Platelet count alone regardless of symptoms — Current ASH guidance bases treatment on bleeding severity; children with skin-only bleeding are usually observed even with very low counts.; C. Mandatory platelet transfusion — Platelet transfusion is reserved for life-threatening bleeding, since transfused platelets are rapidly destroyed.", "pearl": "", "srcAnswer": "B"}, {"num": 25, "level": "Clinical", "question": "ITP with intracranial bleeding requires?", "options": ["Emergency haemostatic treatment with specialist support", "Observation only", "Delayed outpatient review", "Routine oral iron"], "answer": 0, "explanation": "Critical bleeding warrants immediate multimodal intervention. Why not the others (added — not from source): B. Observation only — Intracranial haemorrhage is life-threatening; observation is appropriate only for minor skin bleeding.; C. Delayed outpatient review — Delay is dangerous; ICH needs immediate platelet transfusion, IVIG and steroids with specialist input.; D. Routine oral iron — Oral iron has no role in acute haemostasis.", "pearl": "", "srcAnswer": "C"}, {"num": 26, "level": "Clinical", "question": "Boy with recurrent haemarthrosis, normal PT and prolonged aPTT: suspect?", "options": ["Haemophilia A", "Vitamin K deficiency", "Factor VII deficiency", "ITP"], "answer": 0, "explanation": "Factor VIII deficiency classically prolongs aPTT with deep-tissue bleeding. Why not the others (added — not from source): B. Vitamin K deficiency — Vitamin K deficiency prolongs PT first (factor VII has the shortest half-life) and does not cause recurrent haemarthrosis.; C. Factor VII deficiency — Factor VII deficiency prolongs PT with a normal aPTT, the opposite of this pattern.; D. ITP — ITP causes mucocutaneous bleeding with low platelets and normal PT/aPTT, not haemarthrosis.", "pearl": "", "srcAnswer": "A"}, {"num": 27, "level": "Clinical", "question": "A prolonged aPTT that corrects on mixing study suggests?", "options": ["Hyperfibrinogenaemia", "Isolated platelet disorder", "Strong inhibitor", "Coagulation factor deficiency"], "answer": 3, "explanation": "Correction after mixing supports deficiency rather than an inhibitor. Why not the others (added — not from source): A. Hyperfibrinogenaemia — Raised fibrinogen does not prolong the aPTT or correct on mixing.; B. Isolated platelet disorder — Platelet disorders do not prolong the aPTT.; C. Strong inhibitor — An inhibitor (e.g. factor VIII antibody or lupus anticoagulant) fails to correct on mixing because it also acts on normal plasma.", "pearl": "", "srcAnswer": "B"}, {"num": 28, "level": "Clinical", "question": "Mucocutaneous bleeding and heavy menses with normal platelet count suggest?", "options": ["Thalassaemia major", "Sickle cell disease", "Haemophilia A only", "Von Willebrand disease"], "answer": 3, "explanation": "VWF defects impair platelet adhesion and may reduce factor VIII. Why not the others (added — not from source): A. Thalassaemia major — Thalassaemia major is a transfusion-dependent anaemia without a primary bleeding tendency.; B. Sickle cell disease — Sickle cell disease causes vaso-occlusion and haemolysis, not a bleeding diathesis.; C. Haemophilia A only — Haemophilia A causes deep-tissue and joint bleeding, mainly in males, rather than mucocutaneous bleeding and menorrhagia.", "pearl": "", "srcAnswer": "A"}, {"num": 29, "level": "Clinical", "question": "A child with sepsis has thrombocytopenia, prolonged PT/aPTT and low fibrinogen: likely?", "options": ["Disseminated intravascular coagulation", "Isolated ITP", "Factor XII deficiency", "Hereditary spherocytosis"], "answer": 0, "explanation": "DIC consumes platelets and coagulation factors during systemic activation. Why not the others (added — not from source): B. Isolated ITP — ITP lowers platelets only; PT, aPTT and fibrinogen are normal.; C. Factor XII deficiency — Factor XII deficiency prolongs aPTT alone, causes no bleeding, and does not lower platelets or fibrinogen.; D. Hereditary spherocytosis — Hereditary spherocytosis is a haemolytic anaemia without coagulopathy or thrombocytopenia.", "pearl": "", "srcAnswer": "A"}, {"num": 30, "level": "Clinical", "question": "A child has petechiae, fever, bone pain and blasts on smear: priority?", "options": ["Give empiric oral iron only", "Defer marrow evaluation indefinitely", "Assume uncomplicated ITP", "Urgent evaluation for acute leukaemia"], "answer": 3, "explanation": "Blasts and systemic features require urgent haematology assessment. Why not the others (added — not from source): A. Give empiric oral iron only — Oral iron does not address a possible leukaemia and delays urgent assessment.; B. Defer marrow evaluation indefinitely — Blasts on the smear demand urgent bone marrow examination; deferring delays diagnosis and treatment.; C. Assume uncomplicated ITP — Fever, bone pain and blasts are red flags that exclude a diagnosis of uncomplicated ITP.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day37',label:'Day 37',set:'Quiz 2',href:'Day37/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day37_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 37 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 37 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 37'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 37');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day37:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=9b446f1a"></script></body></html>
