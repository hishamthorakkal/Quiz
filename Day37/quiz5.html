<script>
const quiz=[{"num": 61, "level": "High", "question": "Which finding is a major warning against diagnosing uncomplicated ITP?", "options": ["Hepatosplenomegaly with bone pain", "Isolated petechiae", "Otherwise well child", "Recent viral infection"], "answer": 0, "explanation": "Organomegaly and bone pain suggest an alternative marrow/systemic disorder. Why not the others (added — not from source): B. Isolated petechiae — Isolated petechiae with isolated thrombocytopenia are the expected presentation of ITP.; C. Otherwise well child — Being otherwise well is typical of ITP and supports, not argues against, the diagnosis.; D. Recent viral infection — A preceding viral infection is a common trigger of childhood ITP and is consistent with it.", "pearl": "", "srcAnswer": "D"}, {"num": 62, "level": "High", "question": "A patient with thrombocytopenia after heparin and new thrombosis: suspect?", "options": ["Heparin-induced thrombocytopenia", "Hereditary spherocytosis", "Vitamin B12 deficiency", "Iron deficiency"], "answer": 0, "explanation": "HIT is an immune prothrombotic complication of heparin exposure. Why not the others (added — not from source): B. Hereditary spherocytosis — Hereditary spherocytosis causes haemolytic anaemia, not heparin-associated thrombocytopenia with thrombosis.; C. Vitamin B12 deficiency — B12 deficiency may cause pancytopenia but has no relation to heparin exposure or new thrombosis.; D. Iron deficiency — Iron deficiency more often causes reactive thrombocytosis and has no link to heparin exposure or new thrombosis.", "pearl": "", "srcAnswer": "D"}, {"num": 63, "level": "High", "question": "A child with venous thrombosis and nephrotic syndrome has increased risk due partly to?", "options": ["Urinary anticoagulant protein losses and hypercoagulability", "Decreased fibrinogen always", "Increased platelet destruction alone", "Factor VIII deficiency"], "answer": 0, "explanation": "Nephrotic syndrome predisposes to thrombosis through multiple haemostatic changes. Why not the others (added — not from source): B. Decreased fibrinogen always — Fibrinogen is typically increased, not decreased, in nephrotic syndrome, contributing to hypercoagulability.; C. Increased platelet destruction alone — Platelet destruction is not the mechanism; platelets are often increased and hyperaggregable, and urinary antithrombin loss is key.; D. Factor VIII deficiency — Factor VIII is usually raised in nephrotic syndrome; deficiency would cause bleeding, not thrombosis.", "pearl": "", "srcAnswer": "D"}, {"num": 64, "level": "High", "question": "In suspected anaemia of chronic inflammation, a typical pattern is?", "options": ["Always high reticulocytes", "Markedly increased HbA2", "Low serum iron with normal/high ferritin", "High serum iron and low ferritin"], "answer": 2, "explanation": "Hepcidin-mediated iron sequestration lowers available serum iron while ferritin may rise. Why not the others (added — not from source): A. Always high reticulocytes — Anaemia of inflammation is hypoproliferative with low reticulocytes, not always high.; B. Markedly increased HbA2 — Raised HbA2 suggests beta-thalassaemia trait, not anaemia of chronic inflammation.; D. High serum iron and low ferritin — High serum iron with low ferritin is the reverse of the inflammatory pattern, where serum iron is low and ferritin normal or high.", "pearl": "", "srcAnswer": "A"}, {"num": 65, "level": "High", "question": "An infant with beta-thalassaemia major becomes symptomatic after several months because?", "options": ["HbA2 disappears at birth", "Iron stores rise abruptly", "HbF declines and beta-chain production becomes necessary", "Maternal antibodies always cause haemolysis"], "answer": 2, "explanation": "Switching from fetal to adult haemoglobin unmasks beta-chain deficiency. Why not the others (added — not from source): A. HbA2 disappears at birth — HbA2 does not disappear at birth; it is low at birth and rises, and it does not explain symptom timing.; B. Iron stores rise abruptly — Iron stores do not rise abruptly at a few months; symptom onset reflects the fall in HbF.; D. Maternal antibodies always cause haemolysis — Thalassaemia major is not immune haemolysis; maternal antibodies are irrelevant to its onset.", "pearl": "", "srcAnswer": "D"}, {"num": 66, "level": "High", "question": "A child with unexplained bruising and prolonged PT and aPTT has poor intake and cholestasis: consider?", "options": ["Vitamin K deficiency", "G6PD deficiency", "Thalassaemia trait", "Isolated factor XII deficiency"], "answer": 0, "explanation": "Vitamin K is required for factors II, VII, IX and X; malabsorption increases risk. Why not the others (added — not from source): B. G6PD deficiency — G6PD deficiency causes episodic haemolysis, not a coagulopathy with prolonged PT and aPTT.; C. Thalassaemia trait — Thalassaemia trait causes mild microcytosis, not bruising or prolonged PT and aPTT.; D. Isolated factor XII deficiency — Factor XII deficiency prolongs only the aPTT, leaves PT normal and causes no bleeding.", "pearl": "", "srcAnswer": "B"}, {"num": 67, "level": "High", "question": "A child with massive haemorrhage needs transfusion. The immediate priority is?", "options": ["Wait for ferritin result", "Stabilisation and appropriately matched blood products under emergency protocol", "Defer haemodynamic assessment", "Routine folate alone"], "answer": 1, "explanation": "Life-threatening haemorrhage requires resuscitation and safe transfusion. Why not the others (added — not from source): A. Wait for ferritin result — Ferritin is irrelevant to acute haemorrhage management, and waiting for it delays resuscitation.; C. Defer haemodynamic assessment — Haemodynamic assessment must be immediate in massive haemorrhage; deferring it risks death.; D. Routine folate alone — Folate supplementation does nothing for acute haemorrhagic shock.", "pearl": "", "srcAnswer": "D"}, {"num": 68, "level": "Integrated", "question": "A febrile child with pallor and petechiae has high WBC and blasts: avoid before specialist assessment?", "options": ["Empiric systemic corticosteroids without a clear indication", "Urgent oncology referral", "Tumour lysis risk assessment", "Peripheral blood smear"], "answer": 0, "explanation": "Steroids may obscure leukaemia diagnosis and complicate initial evaluation. Why not the others (added — not from source): B. Urgent oncology referral — Urgent oncology referral is required for suspected leukaemia and should not be avoided.; C. Tumour lysis risk assessment — Tumour lysis risk assessment is an appropriate early step in suspected leukaemia with high WBC, not something to avoid.; D. Peripheral blood smear — A peripheral smear is a key, simple test to look for blasts and should be done, not avoided.", "pearl": "", "srcAnswer": "D"}, {"num": 69, "level": "Integrated", "question": "A child with severe anaemia has tachycardia and heart failure signs. Most important initial action?", "options": ["Empiric aspirin", "No monitoring", "Routine outpatient follow-up only", "Urgent stabilisation and carefully planned transfusion assessment"], "answer": 3, "explanation": "Cardiorespiratory compromise makes anaemia an emergency; transfusion rate/volume require care. Why not the others (added — not from source): A. Empiric aspirin — Aspirin has no role in anaemic heart failure and adds bleeding risk.; B. No monitoring — Cardiorespiratory compromise needs close monitoring, especially during transfusion because of volume overload risk.; C. Routine outpatient follow-up only — Heart failure from severe anaemia is an emergency; outpatient follow-up alone is unsafe.", "pearl": "", "srcAnswer": "C"}, {"num": 70, "level": "Integrated", "question": "Which test quantifies fetal haemoglobin in suspected haemoglobinopathy?", "options": ["Bleeding time", "Direct Coombs alone", "Serum ferritin alone", "HPLC or capillary electrophoresis"], "answer": 3, "explanation": "Haemoglobin fractionation quantifies HbF and variants. Why not the others (added — not from source): A. Bleeding time — Bleeding time assesses platelet-vessel interaction, not haemoglobin fractions.; B. Direct Coombs alone — The direct Coombs test detects red-cell-bound antibody, not HbF levels.; C. Serum ferritin alone — Ferritin reflects iron stores and does not quantify HbF or haemoglobin variants.", "pearl": "", "srcAnswer": "B"}, {"num": 71, "level": "Integrated", "question": "A child with prolonged fever, splenomegaly and pancytopenia requires evaluation for?", "options": ["Haemophilia A alone", "Infection, malignancy and HLH", "Physiologic anaemia only", "Isolated ITP only"], "answer": 1, "explanation": "The combination has a broad serious differential and warrants urgent workup. Why not the others (added — not from source): A. Haemophilia A alone — Haemophilia A is a coagulation factor deficiency and does not cause fever, splenomegaly or pancytopenia.; C. Physiologic anaemia only — Physiological anaemia does not cause prolonged fever, splenomegaly and pancytopenia.; D. Isolated ITP only — ITP causes isolated thrombocytopenia without fever or splenomegaly; pancytopenia excludes it.", "pearl": "", "srcAnswer": "D"}, {"num": 72, "level": "Integrated", "question": "A child with suspected thalassaemia trait has iron deficiency too. Appropriate next step?", "options": ["Prescribe lifelong iron without testing", "Assume no coexistence", "Treat confirmed iron deficiency and interpret haemoglobin fractions in context", "Give chelation immediately"], "answer": 2, "explanation": "Iron deficiency can coexist and influence interpretation; avoid unnecessary iron when stores are normal. Why not the others (added — not from source): A. Prescribe lifelong iron without testing — Lifelong iron without testing risks iron overload, especially in thalassaemia carriers; treat only confirmed deficiency.; B. Assume no coexistence — Iron deficiency and thalassaemia trait commonly coexist, and iron deficiency can lower HbA2 and mask beta-thalassaemia trait.; D. Give chelation immediately — Chelation is for iron overload, not for a child who is iron deficient.", "pearl": "", "srcAnswer": "D"}, {"num": 73, "level": "Integrated", "question": "What does an increased corrected reticulocyte count generally indicate in anaemia?", "options": ["Vitamin K deficiency", "Compensatory marrow production", "Pure iron deficiency without treatment always", "Marrow aplasia"], "answer": 1, "explanation": "A robust corrected reticulocyte response suggests blood loss or haemolysis. Why not the others (added — not from source): A. Vitamin K deficiency — Vitamin K deficiency causes a coagulopathy; any reticulocyte rise would only reflect resulting blood loss.; C. Pure iron deficiency without treatment always — Untreated iron deficiency typically has an inappropriately low reticulocyte response, so 'always' is wrong.; D. Marrow aplasia — Marrow aplasia causes reticulocytopenia, the opposite of an increased corrected count.", "pearl": "", "srcAnswer": "C"}, {"num": 74, "level": "Integrated", "question": "Which test identifies immune antibodies bound to infant red cells in haemolytic disease?", "options": ["Serum ferritin", "HbA2 level", "Direct antiglobulin test", "Prothrombin time"], "answer": 2, "explanation": "DAT detects red-cell-bound immunoglobulin/complement. Why not the others (added — not from source): A. Serum ferritin — Ferritin measures iron stores and does not identify antibodies on red cells.; B. HbA2 level — HbA2 quantification is used for beta-thalassaemia trait, not detection of red-cell-bound antibodies.; D. Prothrombin time — PT assesses the extrinsic coagulation pathway, not immune haemolysis.", "pearl": "", "srcAnswer": "A"}, {"num": 75, "level": "Integrated", "question": "An adolescent with recurrent epistaxis and family history of bleeding has prolonged platelet-function testing. What is a reasonable initial diagnostic panel?", "options": ["Hb electrophoresis alone", "G6PD enzyme assay alone", "VWF antigen, VWF activity and factor VIII", "Serum ferritin alone"], "answer": 2, "explanation": "VWF antigen/activity and factor VIII are core tests when VWD is suspected. Why not the others (added — not from source): A. Hb electrophoresis alone — Haemoglobin electrophoresis assesses haemoglobinopathies and has no role in investigating VWD.; B. G6PD enzyme assay alone — G6PD assay evaluates haemolysis, not mucocutaneous bleeding with abnormal platelet-function testing.; D. Serum ferritin alone — Ferritin may show iron deficiency from chronic bleeding but does not diagnose the underlying bleeding disorder.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day37',label:'Day 37',set:'Quiz 5',href:'Day37/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day37_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 37 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 37 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 37'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 37');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day37:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
