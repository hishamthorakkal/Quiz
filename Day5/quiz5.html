<script>
const quiz=[{"num": 61, "level": "High-Difficulty", "question": "Stable neonatal pneumomediastinum with minimal support. Best management?", "options": ["Large PEEP increase", "Routine needle thoracentesis", "Thoracotomy", "Observation/supportive care"], "answer": 3, "explanation": "Many stable pneumomediastina resolve without drainage. Why not the others: A. Large PEEP increase — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.; B. Routine needle thoracentesis — Needle thoracentesis is for urgent decompression of pleural air under tension; it is not routine therapy for a stable pneumomediastinum or interstitial air.; C. Thoracotomy — Thoracotomy is not routine neonatal management for an uncomplicated stable pneumomediastinum; supportive observation is usually sufficient.", "pearl": "Observation/supportive care: Many stable pneumomediastina resolve without drainage.", "srcAnswer": "D"}, {"num": 62, "level": "High-Difficulty", "question": "Which setting raises MAP on conventional ventilation without changing PIP?", "options": ["Set rate zero", "Decrease FiO2", "Increase PEEP", "Reduce trigger sensitivity"], "answer": 2, "explanation": "PEEP raises baseline airway pressure and often MAP. Why not the others: B. Decrease FiO2 — Decreasing FiO2 reduces oxygen exposure; it is appropriate only when oxygenation permits and does not directly correct CO2 clearance or mechanical obstruction.", "pearl": "Increase PEEP: PEEP raises baseline airway pressure and often MAP.", "srcAnswer": "C"}, {"num": 63, "level": "High-Difficulty", "question": "Why avoid routine continuous morphine/midazolam in all ventilated preterm infants?", "options": ["They cause pneumothorax", "Routine exposure may prolong ventilation/adverse effects; use selectively", "They lower bilirubin", "Sedation always improves outcomes"], "answer": 1, "explanation": "Guidance favors selective, clinically indicated analgesia/sedation. Why not the others: A. They cause pneumothorax — Pneumothorax is pleural air; diagnosis requires compatible clinical/imaging findings such as sudden asymmetry and absent peripheral markings, not merely a change in required ventilator pressure.", "pearl": "Routine exposure may prolong ventilation/adverse effects; use selectively: Guidance favors selective, clinically indicated analgesia/sedation.", "srcAnswer": "B"}, {"num": 64, "level": "High-Difficulty", "question": "Increasing O2 need after PEEP decreases 7→4; PaCO2 unchanged. Explanation?", "options": ["Loss of recruitment increased shunt", "Resistance disappeared", "Minute ventilation increased", "Bicarbonate fell"], "answer": 0, "explanation": "Lower PEEP can derecruit lung and worsen oxygenation. Why not the others: D. Bicarbonate fell — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.", "pearl": "Loss of recruitment increased shunt: Lower PEEP can derecruit lung and worsen oxygenation.", "srcAnswer": "A"}, {"num": 65, "level": "High-Difficulty", "question": "HFOV PaCO2 too low, oxygenation appropriate. Direct adjustment?", "options": ["Decrease amplitude", "Increase conventional PEEP", "Increase FiO2", "Increase MAP"], "answer": 0, "explanation": "Lower amplitude reduces oscillatory VT and CO2 clearance. Why not the others: C. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; D. Increase MAP — Increasing HFOV mean airway pressure increases lung volume/recruitment and primarily improves oxygenation; it does not directly target isolated CO2 retention.", "pearl": "Decrease amplitude: Lower amplitude reduces oscillatory VT and CO2 clearance.", "srcAnswer": "A"}, {"num": 66, "level": "High-Difficulty", "question": "Term/near-term infant with persistent OI >40 despite optimized care. Concept?", "options": ["Stop OI monitoring", "OI is only for hypercapnia", "ECMO evaluation may be appropriate if eligible", "Mild disease"], "answer": 2, "explanation": "Persistent OI around 40 is severe oxygenation failure.", "pearl": "ECMO evaluation may be appropriate if eligible: Persistent OI around 40 is severe oxygenation failure.", "srcAnswer": "C"}, {"num": 67, "level": "High-Difficulty", "question": "27-week infant on CPAP 7, FiO2 0.30, intermittent apnea. Best intervention to reduce MV need?", "options": ["Routine intubation", "High-dose dexamethasone day 1", "Caffeine", "Routine iNO"], "answer": 2, "explanation": "Caffeine treats apnea and facilitates avoidance/weaning of MV. Why not the others: A. Routine intubation — Routine intubation exposes the preterm lung to invasive ventilation; current neonatal guidance favors CPAP first when spontaneous breathing and heart rate are adequate.", "pearl": "Caffeine: Caffeine treats apnea and facilitates avoidance/weaning of MV.", "srcAnswer": "C"}, {"num": 68, "level": "Integrated/Rank-Differentiating", "question": "25-week infant after surfactant: VT 8.5 mL/kg, PaCO2 29, early PIE. Best response?", "options": ["Increase rate", "Reduce VT/driving pressure and move toward lung-protective volume targeting", "Increase PIP", "Increase FiO2 only"], "answer": 1, "explanation": "Improved compliance produced excessive VT, hypocapnia and air-leak risk. Why not the others: A. Increase rate — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.; C. Increase PIP — Increasing PIP raises driving pressure and often VT in pressure-controlled ventilation, increasing volutrauma/air-leak risk if the actual problem is obstruction, improved compliance, or trapping.; D. Increase FiO2 only — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.", "pearl": "Reduce VT/driving pressure and move toward lung-protective volume targeting: Improved compliance produced excessive VT, hypocapnia and air-leak risk.", "srcAnswer": "B"}, {"num": 69, "level": "Integrated/Rank-Differentiating", "question": "26-week infant day 18 remains ventilated, rising O2 need, poor growth, elevated RV pressure. Plan?", "options": ["Only increase FiO2", "Treat isolated apnea", "Treat severe BPD physiology and PH while optimizing ventilation, oxygenation and nutrition", "Stop all support"], "answer": 2, "explanation": "BPD and PH require multimodal management. Why not the others: A. Only increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.", "pearl": "Treat severe BPD physiology and PH while optimizing ventilation, oxygenation and nutrition: BPD and PH require multimodal management.", "srcAnswer": "C"}, {"num": 70, "level": "Integrated/Rank-Differentiating", "question": "Ventilated infant pH 7.08, PaCO2 75, HCO3 21, poor perfusion, sudden unilateral transillumination. Priority?", "options": ["Treat suspected tension pneumothorax immediately, then residual abnormalities", "Increase PEEP", "Bicarbonate first", "Calculate AG first"], "answer": 0, "explanation": "The reversible life-threatening mechanical cause takes priority. Why not the others: B. Increase PEEP — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.; C. Bicarbonate first — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.", "pearl": "Treat suspected tension pneumothorax immediately, then residual abnormalities: The reversible life-threatening mechanical cause takes priority.", "srcAnswer": "A"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "HFOV: FiO2 0.9, MAP 17, PaO2 45, PaCO2 70. Pair of changes?", "options": ["Decrease amplitude and MAP", "Increase MAP/recruitment and increase amplitude", "Give bicarbonate", "Increase FiO2 only"], "answer": 1, "explanation": "Both oxygenation and ventilation are inadequate and require separate HFOV controls. Why not the others: A. Decrease amplitude and MAP — Decreasing HFOV amplitude reduces oscillatory VT and CO2 clearance; it is useful for hypocapnia, not hypercapnia.; C. Give bicarbonate — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.; D. Increase FiO2 only — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.", "pearl": "Increase MAP/recruitment and increase amplitude: Both oxygenation and ventilation are inadequate and require separate HFOV controls.", "srcAnswer": "B"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "At 36 wk PMA infant on 1 L/min NC but significant PH. Jensen grade and implication?", "options": ["No BPD; PH impossible", "Grade 3; intubate", "Grade 2; PH excluded", "Grade 1; PH still requires separate management"], "answer": 3, "explanation": "Support defines BPD grade; PH is a separate comorbidity. Why not the others: A. No BPD; PH impossible — In the Jensen support-based definition, no BPD means no respiratory support at 36 weeks PMA.; B. Grade 3; intubate — Jensen Grade 3 requires invasive mechanical ventilation at 36 weeks PMA.; C. Grade 2; PH excluded — Jensen Grade 2 is nasal cannula >2 L/min or non-invasive positive airway pressure at 36 weeks PMA.", "pearl": "Grade 1; PH still requires separate management: Support defines BPD grade; PH is a separate comorbidity.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "Evolving BPD with chronic CO2 60/HCO3 34 suddenly hypoxemic with asymmetric chest movement. Best reasoning?", "options": ["Search immediately for acute mechanical problem such as pneumothorax", "Normalize chronic CO2 first", "Assume PH only", "Increase rate automatically"], "answer": 0, "explanation": "Sudden asymmetry suggests an acute air leak, not chronic compensation. Why not the others: D. Increase rate automatically — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.", "pearl": "Search immediately for acute mechanical problem such as pneumothorax: Sudden asymmetry suggests an acute air leak, not chronic compensation.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "28-week infant extubated to CPAP develops recurrent apnea and rising CO2. Best sequence?", "options": ["Give bicarbonate", "Optimize caffeine/NIV but reintubate if ventilation continues to fail", "Ignore CO2", "High PIP ventilation immediately without caffeine"], "answer": 1, "explanation": "Avoid both premature reintubation and prolonged failed NIV. Why not the others: A. Give bicarbonate — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.; D. High PIP ventilation immediately without caffeine — Increasing PIP raises driving pressure and often VT in pressure-controlled ventilation, increasing volutrauma/air-leak risk if the actual problem is obstruction, improved compliance, or trapping.", "pearl": "Optimize caffeine/NIV but reintubate if ventilation continues to fail: Avoid both premature reintubation and prolonged failed NIV.", "srcAnswer": "B"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "24-week infant on VTV target 5 mL/kg needs rising PIP, rising CO2 and develops PIE. Interpretation?", "options": ["Increase target VT to 10", "Ventilator necessarily broken", "PIE improves with higher pressure", "Compliance worsening; forcing target with more pressure may aggravate leak, so reassess lung/ETT/strategy"], "answer": 3, "explanation": "VTV still requires clinical pressure limits and reassessment. Why not the others: A. Increase target VT to 10 — Increasing VT increases alveolar ventilation but also increases volutrauma risk; it is inappropriate when VT is already adequate/excessive or an air leak such as PIE is present.", "pearl": "Compliance worsening; forcing target with more pressure may aggravate leak, so reassess lung/ETT/strategy: VTV still requires clinical pressure limits and reassessment.", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day5',label:'Day 5',set:'Quiz 5',href:'Day5/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 5'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 5');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day5:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
