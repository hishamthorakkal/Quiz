<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 Quiz 5 — Q61–Q75</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 5 — Quiz 5</h1>
<div class="sub">Questions 61–75 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 61, "level": "High", "question": "A ventilated infant has pH 7.29, PaCO2 55, HCO3− 26 but lactate is normal and oxygenation is stable. Which is the least appropriate action?", "options": ["Give sodium bicarbonate to normalize pH immediately", "Check delivered VT and waveforms", "Accept modest hypercapnia if otherwise stable", "Review trend and work of breathing"], "answer": 0, "explanation": "pH 7.29 with PaCO2 55 and normal HCO3− and lactate is mild respiratory acidosis that is acceptable when stable. Bicarbonate does not treat respiratory acidosis and is the least appropriate action; reviewing trends and VT and accepting modest hypercapnia are appropriate.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 62, "level": "High", "question": "A 25-week infant has unilateral PIE. Which intervention is most likely to worsen the condition?", "options": ["Considering HFOV if severe", "Minimizing ventilator injury", "Increasing VT/PIP to normalize PaCO2 aggressively", "Affected-side-down positioning"], "answer": 2, "explanation": "PIE results from ventilator-induced overdistension and air leak. Aggressively increasing VT/PIP to normalize PaCO2 worsens it; minimizing ventilator injury, affected-side-down positioning and HFOV are the recommended strategies.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 63, "level": "High", "question": "An infant has a small pneumothorax but is stable on low support with no cardiovascular compromise. Best management principle?", "options": ["Mandatory thoracotomy", "Every pneumothorax requires immediate chest tube", "Close observation may be appropriate depending on size and trajectory", "Increase PIP"], "answer": 2, "explanation": "A small pneumothorax in a stable infant on low support without cardiovascular compromise may be closely observed, depending on size and trajectory. Not every pneumothorax needs a chest tube.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 64, "level": "High", "question": "A preterm infant with severe RDS is ventilated with target VT 5 mL/kg but requires PIP 30–32 repeatedly. Which next step is best?", "options": ["Lower PEEP to zero", "Raise pressure limit indefinitely", "Reassess recruitment, tube, surfactant status, compliance and whether an alternative mode is needed rather than simply accepting high pressure", "Increase target VT to 8 mL/kg first"], "answer": 2, "explanation": "Repeated high PIP (30–32) needed for VT 5 mL/kg means severely reduced compliance or a mechanical problem. Reassess recruitment, the tube, surfactant status and whether an alternative mode (e.g., HFOV) is needed, rather than accepting high pressure.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 65, "level": "High", "question": "A ventilated infant has PaCO2 75 but pH 7.32 because HCO3− is 38. Which statement is best?", "options": ["It proves metabolic alkalosis only", "It is acute respiratory failure by definition", "This pattern suggests chronic compensated hypercapnia; urgency depends on clinical status and trajectory", "Immediate bicarbonate is indicated"], "answer": 2, "explanation": "PaCO2 75 with pH 7.32 because HCO3− is 38 indicates chronic hypercapnia with renal compensation, not acute respiratory failure. Urgency depends on clinical status and trend; bicarbonate is not indicated.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 66, "level": "High", "question": "A 28-week infant has FiO2 0.70, PaCO2 40, poor oxygenation, and echo shows no pulmonary hypertension. CXR suggests severe atelectasis. Which strategy is more rational than iNO?", "options": ["Increase VT to 9 mL/kg", "Routine iNO because FiO2 >0.60", "Optimize lung recruitment/MAP and underlying lung disease", "Accept saturations in low 80s"], "answer": 2, "explanation": "Poor oxygenation with no pulmonary hypertension on echo and severe atelectasis on CXR is a recruitment problem. Optimize MAP/recruitment and treat the lung disease; iNO acts on pulmonary vasculature and is not routine in preterm infants.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 67, "level": "High", "question": "A preterm infant on invasive ventilation develops repeated hypocarbia despite low pressure settings because of vigorous spontaneous breathing. Which is the best principle?", "options": ["Increase mandatory rate", "Increase VT target", "Optimize synchrony/triggering and consider mode adjustments rather than sedating solely to normalize CO2", "Deep sedation is always first-line"], "answer": 2, "explanation": "Hypocarbia from vigorous spontaneous breathing on assisted modes is best managed by optimizing synchrony, trigger and support or adjusting the mode. Deep sedation just to normalize CO2 is not first-line, and more rate or VT worsens hypocarbia.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 68, "level": "Integrated", "question": "A 25-week infant, day 3, on AC-VTV: target VT 5 mL/kg, PEEP 6, FiO2 0.35. ABG 7.20/66/58/25. Measured VT is 3.2 mL/kg; leak 45%; CXR shows ETT high at thoracic inlet. Best next step?", "options": ["Start dexamethasone", "Reposition ETT and reassess VT/ABG before increasing target VT", "Increase FiO2 to 0.70", "Increase target VT to 7 mL/kg immediately"], "answer": 1, "explanation": "Measured VT is 3.2 mL/kg against a 5 mL/kg target, with a 45% leak and the ETT high at the thoracic inlet: the tube is malpositioned. Reposition the ETT and reassess VT/ABG before increasing the VT target or FiO2.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 69, "level": "Integrated", "question": "A 26-week infant on day 10 has hyperinflation, PaCO2 67, pH 7.25, PEEP 8, rate 55, expiratory flow not returning to zero. Which change best addresses the dominant problem?", "options": ["Increase FiO2 only", "Reduce rate and allow longer expiratory time while reassessing PEEP and VT", "Increase inspiratory time", "Increase rate to 70"], "answer": 1, "explanation": "Hyperinflation, hypercapnia and expiratory flow not returning to zero at rate 55 indicate air trapping in evolving BPD. Reduce rate to lengthen expiratory time while reassessing PEEP and VT.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 70, "level": "Integrated", "question": "A 25-week infant suddenly deteriorates: FiO2 0.35→1.0, BP 48/18, HR 90, right chest hyperexpanded with absent breath sounds. CXR is not immediately available. What is the best sequence?", "options": ["Give surfactant first", "Wait for X-ray, then decide", "Increase PEEP to 10, then obtain gas", "Emergency decompression first, then confirm/secure definitive drainage and reassess ventilation"], "answer": 3, "explanation": "Acute hypoxemia, hypotension, bradycardia, a hyperexpanded chest and absent breath sounds indicate tension pneumothorax. Decompress immediately without waiting for an X-ray, then place definitive drainage and reassess ventilation.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 71, "level": "Integrated", "question": "A 24-week infant at 3 weeks has pH 7.33, PaCO2 61, HCO3− 32, FiO2 0.35, VT 6.2 mL/kg, hyperinflation and poor weight gain. Which strategy best fits evolving BPD?", "options": ["Accept chronic compensated hypercapnia, optimize nutrition and avoid excessive rate/VT while facilitating extubation", "Reduce calories to limit CO2 production", "Normalize PaCO2 to 40 with VT 8–9 mL/kg", "Eliminate PEEP entirely"], "answer": 0, "explanation": "pH 7.33 with PaCO2 61 and HCO3− 32 is compensated chronic hypercapnia typical of evolving BPD. Accept it, optimize nutrition (poor growth impairs lung development), avoid excessive rate/VT and work toward extubation.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 72, "level": "Integrated", "question": "A 27-week infant at 36 weeks PMA needs HFNC 4 L/min and FiO2 0.25. Another infant needs invasive ventilation at 36 weeks PMA. Which statement is most accurate?", "options": ["Only CXR determines severity", "Neither can have BPD unless FiO2 >0.30", "FiO2 alone makes them equally severe", "Both may meet BPD frameworks, but the second infant has greater support-based severity"], "answer": 3, "explanation": "Both infants may meet support-based BPD definitions at 36 weeks PMA, but the infant needing invasive ventilation has greater support-based severity and worse prognosis. FiO2 alone does not grade severity.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 73, "level": "Integrated", "question": "A preterm infant with BPD has worsening hypoxemia, echo-proven pulmonary hypertension, and stable PaCO2. Which sequence is best?", "options": ["Lower saturation target to reduce oxygen exposure", "Increase VT first despite normal PaCO2", "Optimize oxygenation/lung recruitment and hemodynamics, then consider a monitored iNO trial if hypoxic failure persists", "Use routine iNO indefinitely without assessing response"], "answer": 2, "explanation": "Hypoxemia with PH and stable PaCO2: first optimize oxygenation, lung recruitment and hemodynamics. If hypoxic failure persists, a monitored iNO trial may be considered and stopped if there is no response. Increasing VT does not address the problem.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 74, "level": "Integrated", "question": "A ventilated infant has pH 7.11, PaCO2 68, HCO3− 20, lactate 5, hypotension and a new pneumothorax. Which answer best captures management?", "options": ["Accept as permissive hypercapnia", "Increase FiO2 only", "Give bicarbonate as sole therapy", "Treat pneumothorax and shock while restoring effective ventilation; this is mixed respiratory and metabolic acidosis"], "answer": 3, "explanation": "pH 7.11 with high PaCO2 (68) and low HCO3− (20) plus lactate 5 and hypotension is mixed respiratory and metabolic acidosis. Treat the pneumothorax and shock while restoring effective ventilation; bicarbonate or FiO2 alone is inadequate.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}, {"num": 75, "level": "Integrated", "question": "A 25-week infant has repeated PIE and pneumothoraces on pressure-limited ventilation. PaCO2 is 55, pH 7.29, but delivered VT varies 4–8 mL/kg. Which strategy most directly addresses the injury mechanism?", "options": ["Switch to a volume-targeted lung-protective approach or appropriate rescue mode to limit excessive VT", "Remove PEEP entirely", "Increase fixed PIP to stabilize PaCO2", "Increase respiratory rate to 70"], "answer": 0, "explanation": "Repeated PIE and pneumothoraces with VT varying 4–8 mL/kg on pressure-limited ventilation point to intermittent excessive VT (volutrauma). Switching to volume-targeted lung-protective ventilation, or a rescue mode such as HFOV, directly limits VT.", "pearl": "Integrate ABG, mechanics, imaging and hemodynamics before choosing the next step.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet5_Q61-75_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 61–75</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
