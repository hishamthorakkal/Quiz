<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 Quiz 3 — Q31–Q45</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 5 — Quiz 3</h1>
<div class="sub">Questions 31–45 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 31, "level": "Clinical", "question": "A 25-week infant on high pressures develops multiple linear and cystic radiolucencies in the right lung without a pleural line. Diagnosis?", "options": ["Pulmonary edema", "Simple pneumothorax", "Pneumomediastinum only", "Pulmonary interstitial emphysema"], "answer": 3, "explanation": "Multiple linear and cystic radiolucencies within the lung of a ventilated very preterm infant, without a pleural line, is pulmonary interstitial emphysema — air in the interstitium, not the pleural space.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 32, "level": "Clinical", "question": "The same infant has severe unilateral PIE. Which adjunctive strategy is most reasonable?", "options": ["Increase rate to shorten expiration", "Give routine chest tube despite no pleural air", "Increase PIP to recruit the affected side", "Position affected lung down and reduce injurious ventilation; consider HFOV if needed"], "answer": 3, "explanation": "For unilateral PIE: position the affected lung down (to splint it and favour the healthier lung), minimize injurious ventilation, and consider HFOV as rescue in severe cases. Raising PIP worsens air leak; a chest tube is not indicated without pleural air.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 33, "level": "Clinical", "question": "A stable infant has a small pneumomediastinum on CXR and no hemodynamic compromise. Best management?", "options": ["Mandatory surgical thoracotomy", "Bilateral chest tubes", "Immediate pericardiocentesis", "Observation and minimize ventilator injury"], "answer": 3, "explanation": "A small pneumomediastinum without hemodynamic compromise is usually observed while minimizing ventilator injury. It rarely needs drainage, pericardiocentesis or surgery.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 34, "level": "Clinical", "question": "A ventilated preterm infant develops pneumopericardium with hypotension and muffled heart sounds. Best action?", "options": ["Urgent decompression for tamponade physiology", "Increase PEEP", "Start caffeine only", "Observe only"], "answer": 0, "explanation": "Pneumopericardium with hypotension and muffled heart sounds indicates cardiac tamponade. It needs urgent decompression (pericardiocentesis); observation, more PEEP or caffeine are inappropriate.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 35, "level": "Clinical", "question": "A 27-week infant at 36 weeks PMA still requires NIPPV with oxygen. Which statement is best?", "options": ["This represents clinically important BPD in support-based frameworks", "BPD cannot be diagnosed unless invasive ventilation continues", "Oxygen concentration alone defines prognosis", "BPD requires pneumothorax history"], "answer": 0, "explanation": "Needing non-invasive positive pressure (NIPPV) plus oxygen at 36 weeks PMA represents clinically important BPD under modern support-based frameworks. Invasive ventilation is not required for diagnosis, and support intensity — not FiO2 alone — guides severity.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 36, "level": "Clinical", "question": "A 28-week infant is ventilator-dependent at 3 weeks. Which strategy best reduces ongoing lung injury?", "options": ["Continue invasive ventilation regardless of readiness", "Reassess extubation readiness, optimize VTV/caffeine/nutrition and minimize oxygen exposure", "Routinely add iNO without pulmonary hypertension", "Maintain high VT to normalize PaCO2"], "answer": 1, "explanation": "To limit ongoing injury in a ventilator-dependent preterm infant: reassess extubation readiness, use VTV/lung-protective settings, give caffeine, optimize nutrition and avoid unnecessary oxygen. High VT, prolonged ventilation and routine iNO add harm.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 37, "level": "Clinical", "question": "A preterm infant with severe hypoxemia has echo-confirmed pulmonary hypertension despite optimized ventilation. Which statement about iNO is best?", "options": ["iNO should be used routinely in all preterm infants", "iNO is contraindicated whenever pulmonary hypertension exists", "iNO is a standard BPD-prevention drug", "A therapeutic trial may be reasonable; stop if there is no response"], "answer": 3, "explanation": "In preterm infants, iNO is not routine or a BPD-prevention therapy. With echo-confirmed pulmonary hypertension and hypoxic failure despite optimized ventilation, a monitored therapeutic trial is reasonable — stop if there is no response.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 38, "level": "Clinical", "question": "A 24-week infant on VTV has recurrent desaturation. Exhaled VT is stable, tube position is correct, PaCO2 is normal, but FiO2 requirement is rising and CXR shows derecruitment. Best next adjustment?", "options": ["Lower PEEP further", "Increase rate to 70/min", "Increase VT to 8 mL/kg", "Optimize PEEP/MAP while reassessing hemodynamics"], "answer": 3, "explanation": "Rising FiO2 with derecruitment on CXR, stable VT, correct tube position and normal PaCO2 is an oxygenation/recruitment problem. Optimize PEEP/MAP while watching hemodynamics; more VT or rate does not recruit and causes injury.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 39, "level": "Clinical", "question": "A 26-week infant on VTV is tachypneic and triggers 80 assisted breaths/min with PaCO2 28 mmHg. Best response?", "options": ["Adjust trigger/support and/or backup strategy to prevent overventilation while maintaining synchrony", "Ignore hypocarbia", "Increase pressure limit", "Increase VT target"], "answer": 0, "explanation": "Triggering 80 assisted breaths/min in AC-VTV produces overventilation and hypocarbia (PaCO2 28). Adjust trigger sensitivity, support level or mode/backup strategy to prevent overventilation while keeping synchrony. Hypocarbia must not be ignored.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 40, "level": "Clinical", "question": "A preterm infant has pH 7.22, PaCO2 62, HCO3− 25 during weaning, with stable oxygenation and no distress. Best approach?", "options": ["Give bicarbonate", "Increase FiO2 to 1.0", "Increase VT until PaCO2 is <40 regardless of pressure", "Accept cautiously and continue weaning if clinically appropriate"], "answer": 3, "explanation": "pH 7.22 with PaCO2 62 and normal HCO3− is at the permissive-hypercapnia floor (pH >7.22). In a stable infant during weaning, accept cautiously, recheck the trend and continue weaning if appropriate; forcing PaCO2 <40 with large VT is harmful.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 41, "level": "Clinical", "question": "A ventilated infant has high peak pressures but low plateau pressure and copious secretions. Most likely physiologic problem?", "options": ["Excessive venous return", "Low airway resistance", "Increased airway resistance", "Severely reduced compliance only"], "answer": 2, "explanation": "A large gap between high peak and low plateau pressure reflects resistive pressure — increased airway resistance (secretions, narrow/obstructed ETT, bronchospasm). Low compliance would raise the plateau pressure as well.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 42, "level": "Clinical", "question": "A ventilated infant has both peak and plateau pressures elevated, with diffuse bilateral loss of aeration. Most likely problem?", "options": ["Isolated ETT resistance", "Reduced lung compliance", "Pure tachypnea", "Low MAP"], "answer": 1, "explanation": "When both peak and plateau pressures are raised, the problem is reduced lung compliance (stiff lungs), consistent with diffuse loss of aeration. Isolated ETT resistance raises peak but not plateau pressure.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 43, "level": "Clinical", "question": "A 30-week infant has a large ETT leak but normal PaCO2 and appropriate exhaled VT. Best response?", "options": ["Add chest tube", "Continue monitoring; do not intervene solely because a leak exists if ventilation is effective", "Immediately replace ETT with a much larger tube", "Double PIP"], "answer": 1, "explanation": "An ETT leak matters only if it impairs ventilation. With normal PaCO2 and appropriate exhaled VT, continue monitoring rather than changing the tube or escalating pressure.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 44, "level": "Clinical", "question": "A BPD infant has repeated desaturations during feeds but stable respiratory status at rest. Best next reasoning?", "options": ["Increase ventilator pressure despite being extubated", "Give routine iNO", "Diagnose pneumothorax", "Evaluate aspiration/feeding coordination and not attribute every event to worsening BPD"], "answer": 3, "explanation": "Desaturations only during feeds with stable respiratory status at rest suggest aspiration or poor suck–swallow–breathe coordination. Evaluate feeding rather than assuming every event is worsening BPD.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 45, "level": "Clinical", "question": "A 27-week infant has chronic oxygen need, poor growth and echo evidence of pulmonary hypertension. Which management principle is most important?", "options": ["Accept recurrent hypoxemia to avoid oxygen entirely", "Use routine high-dose diuretics as definitive therapy", "Ignore growth because it does not affect lung development", "Optimize oxygenation/nutrition and manage pulmonary hypertension with specialist input"], "answer": 3, "explanation": "BPD with pulmonary hypertension requires avoiding chronic hypoxemia, optimizing nutrition and growth (needed for lung development) and specialist PH management. Diuretics are not definitive therapy.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet3_Q31-45_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 31–45</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
