<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 Quiz 3 — Q31–Q45</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}
</style></head>
<body><div class="wrap">
<div style="margin-bottom:10px"><a class="btn secondary" href="index.html#/quizzes">← Day 5 portal</a></div>
<h1>Day 5 — Quiz 3</h1>
<div class="sub">Questions 31–45 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 31, "level": "Clinical/Application", "question": "pH 7.49, PaCO2 27, HCO3 21 on MV. Best change?", "options": ["Increase VT", "Increase FiO2", "Reduce minute ventilation", "Increase PEEP"], "answer": 2, "explanation": "This is respiratory alkalosis from overventilation. Why not the others: A. Increase VT — Increasing VT increases alveolar ventilation but also increases volutrauma risk; it is inappropriate when VT is already adequate/excessive or an air leak such as PIE is present.; B. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; D. Increase PEEP — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.", "pearl": "Reduce minute ventilation: This is respiratory alkalosis from overventilation."}, {"num": 32, "level": "Clinical/Application", "question": "pH 7.22, PaCO2 31, HCO3 13 in septic shock. Primary disorder?", "options": ["Respiratory acidosis", "Metabolic alkalosis", "Respiratory alkalosis only", "Metabolic acidosis with respiratory compensation"], "answer": 3, "explanation": "Low HCO3 is primary; low CO2 is compensatory. Why not the others: A. Respiratory acidosis — Primary respiratory acidosis requires CO2 retention that explains the acidemia; the bicarbonate pattern and expected compensation must also fit.; B. Metabolic alkalosis — Primary metabolic alkalosis requires elevated bicarbonate causing alkalemia; that pattern is not present in the stem.; C. Respiratory alkalosis only — Primary respiratory alkalosis requires a low PaCO2 driving alkalemia; this diagnosis does not fit when the dominant abnormality is low bicarbonate or CO2 retention.", "pearl": "Metabolic acidosis with respiratory compensation: Low HCO3 is primary; low CO2 is compensatory."}, {"num": 33, "level": "Clinical/Application", "question": "On VTV 5 mL/kg, required PIP falls steadily after surfactant. Interpretation?", "options": ["Compliance improving", "Resistance worsening", "Pneumothorax proven", "Ventilator failure"], "answer": 0, "explanation": "Less pressure is needed for the same VT. Why not the others: B. Resistance worsening — Worsening resistance produces higher resistive pressure requirements and prolonged time constants; it does not explain a falling PIP requirement at a fixed VT.; C. Pneumothorax proven — Pneumothorax is pleural air; diagnosis requires compatible clinical/imaging findings such as sudden asymmetry and absent peripheral markings, not merely a change in required ventilator pressure.", "pearl": "Compliance improving: Less pressure is needed for the same VT."}, {"num": 34, "level": "Clinical/Application", "question": "Desaturation; breath sounds equal, ETT unchanged, circuit disconnected. DOPE cause?", "options": ["Displacement", "Equipment failure", "Pneumothorax", "Obstruction"], "answer": 1, "explanation": "The circuit disconnection is equipment failure. Why not the others: A. Displacement — ETT displacement typically changes tube depth, chest expansion, air entry and exhaled CO2; the stem does not show those displacement clues.; C. Pneumothorax — Pneumothorax is pleural air; diagnosis requires compatible clinical/imaging findings such as sudden asymmetry and absent peripheral markings, not merely a change in required ventilator pressure.; D. Obstruction — ETT obstruction causes increased resistance, reduced airflow/VT and difficulty ventilating; it is usually assessed by suction catheter passage and airway inspection.", "pearl": "Equipment failure: The circuit disconnection is equipment failure."}, {"num": 35, "level": "Clinical/Application", "question": "High resistance, persistent hypercapnia, adequate VT, full exhalation, no obstruction. Next?", "options": ["Increase FiO2", "Lower amplitude on HFOV", "Increase rate cautiously", "Stop caffeine"], "answer": 2, "explanation": "With adequate VT and no trapping, rate can raise minute ventilation. Why not the others: A. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; B. Lower amplitude on HFOV — Decreasing HFOV amplitude reduces oscillatory VT and CO2 clearance; it is useful for hypocapnia, not hypercapnia.; D. Stop caffeine — Stopping caffeine removes a therapy that supports respiratory drive in preterm infants and would not correct the ventilatory mechanics described.", "pearl": "Increase rate cautiously: With adequate VT and no trapping, rate can raise minute ventilation."}, {"num": 36, "level": "Clinical/Application", "question": "28-week infant improving on MV: PaCO2 52, pH 7.28, stable oxygenation. Strategy?", "options": ["Normalize CO2 aggressively", "Give bicarbonate", "Increase VT greatly", "Accept modest hypercapnia while weaning"], "answer": 3, "explanation": "Lung protection favors avoiding excessive ventilation. Why not the others: B. Give bicarbonate — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.; C. Increase VT greatly — Increasing VT increases alveolar ventilation but also increases volutrauma risk; it is inappropriate when VT is already adequate/excessive or an air leak such as PIE is present.", "pearl": "Accept modest hypercapnia while weaning: Lung protection favors avoiding excessive ventilation."}, {"num": 37, "level": "Clinical/Application", "question": "FiO2 0.80, MAP 16, PaO2 50. OI?", "options": ["25.6", "12.8", "40", "64"], "answer": 0, "explanation": "OI = 0.8×16×100/50.", "pearl": "25.6: OI = 0.8×16×100/50."}, {"num": 38, "level": "Clinical/Application", "question": "Preterm infant on CPAP has recurrent apnea despite caffeine, rising CO2 and fatigue. Next?", "options": ["Continue unchanged CPAP", "Escalate support, potentially intubation/MV", "Stop caffeine", "Give bicarbonate"], "answer": 1, "explanation": "Non-invasive support is failing. Why not the others: A. Continue unchanged CPAP — CPAP provides distending pressure to a spontaneously breathing infant but cannot reliably provide adequate ventilation when respiratory drive is failing or severe hypercapnia is progressing.; C. Stop caffeine — Stopping caffeine removes a therapy that supports respiratory drive in preterm infants and would not correct the ventilatory mechanics described.; D. Give bicarbonate — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.", "pearl": "Escalate support, potentially intubation/MV: Non-invasive support is failing."}, {"num": 39, "level": "Clinical/Application", "question": "Hyperinflation and hypotension after PEEP increase. Interpretation?", "options": ["PEEP improved venous return", "Metabolic acidosis proven", "Overdistension may impair venous return", "Rate definitely low"], "answer": 2, "explanation": "Excess intrathoracic pressure can reduce preload. Why not the others: B. Metabolic acidosis proven — Primary metabolic acidosis requires reduced bicarbonate as the major driver of acidemia, with an appropriate compensatory fall in PaCO2.", "pearl": "Overdistension may impair venous return: Excess intrathoracic pressure can reduce preload."}, {"num": 40, "level": "Clinical/Application", "question": "HFOV with refractory hypoxemia but acceptable PaCO2. Which control first for recruitment?", "options": ["Amplitude", "Frequency", "Trigger", "MAP"], "answer": 3, "explanation": "HFOV oxygenation is driven by lung volume/MAP and FiO2.", "pearl": "MAP: HFOV oxygenation is driven by lung volume/MAP and FiO2."}, {"num": 41, "level": "Clinical/Application", "question": "Unilateral PIE. Potential adjunctive position?", "options": ["Affected lung dependent", "Affected lung always uppermost", "Trendelenburg only", "Never use position"], "answer": 0, "explanation": "Dependent positioning can reduce ventilation to affected lung.", "pearl": "Affected lung dependent: Dependent positioning can reduce ventilation to affected lung."}, {"num": 42, "level": "Clinical/Application", "question": "27-week infant intubated on day 14 despite optimized support, high BPD risk. Possible extubation aid?", "options": ["Prolonged midazolam", "Short low-dose dexamethasone course", "High-dose dexamethasone from birth", "Routine iNO"], "answer": 1, "explanation": "Selected later low-dose dexamethasone may facilitate extubation.", "pearl": "Short low-dose dexamethasone course: Selected later low-dose dexamethasone may facilitate extubation."}, {"num": 43, "level": "Clinical/Application", "question": "Spontaneously breathing 29-week infant needs respiratory support after birth, good HR. Preferred initial support?", "options": ["Routine intubation", "Chest compressions", "CPAP", "No support"], "answer": 2, "explanation": "Current guidance favors CPAP in spontaneously breathing preterm infants. Why not the others: A. Routine intubation — Routine intubation exposes the preterm lung to invasive ventilation; current neonatal guidance favors CPAP first when spontaneous breathing and heart rate are adequate.; B. Chest compressions — Chest compressions are indicated for persistent heart rate <60/min despite effective ventilation, not for a spontaneously breathing infant with an adequate heart rate.; D. No support — No respiratory support is appropriate only if the infant maintains adequate breathing and gas exchange; the stem explicitly describes a need for respiratory support.", "pearl": "CPAP: Current guidance favors CPAP in spontaneously breathing preterm infants."}, {"num": 44, "level": "Clinical/Application", "question": "pH 7.36, PaCO2 60, HCO3 33. Interpretation?", "options": ["Acute respiratory acidosis", "Metabolic acidosis", "Respiratory alkalosis", "Compensated chronic respiratory acidosis"], "answer": 3, "explanation": "High HCO3 with near-normal pH suggests chronic compensation. Why not the others: A. Acute respiratory acidosis — Primary respiratory acidosis requires CO2 retention that explains the acidemia; the bicarbonate pattern and expected compensation must also fit.; B. Metabolic acidosis — Primary metabolic acidosis requires reduced bicarbonate as the major driver of acidemia, with an appropriate compensatory fall in PaCO2.; C. Respiratory alkalosis — Primary respiratory alkalosis requires a low PaCO2 driving alkalemia; this diagnosis does not fit when the dominant abnormality is low bicarbonate or CO2 retention.", "pearl": "Compensated chronic respiratory acidosis: High HCO3 with near-normal pH suggests chronic compensation."}, {"num": 45, "level": "Clinical/Application", "question": "After chest drain for pneumothorax, same high VT/PIP continue. Best principle?", "options": ["Reduce injurious support as mechanics allow", "Increase rate automatically", "Keep unchanged", "Stop monitoring"], "answer": 0, "explanation": "Prevent recurrence by correcting ventilator stress. Why not the others: B. Increase rate automatically — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.", "pearl": "Reduce injurious support as mechanics allow: Prevent recurrence by correcting ventilator stress."}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet3_Q31-45_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 31–45</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day5:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
