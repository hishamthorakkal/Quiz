<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 Quiz 4 — Q46–Q60</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 5 — Quiz 4</h1>
<div class="sub">Questions 46–60 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 46, "level": "High", "question": "A 25-week infant on VTV: target VT 5 mL/kg, measured VT 5.2, PEEP 7, FiO2 0.32, pH 7.24, PaCO2 60. Infant is calm and perfused. Which change is most appropriate?", "options": ["Increase PEEP to 10 solely to lower PaCO2", "No immediate ventilator escalation; reassess trend and tolerate moderate hypercapnia", "Raise FiO2 to 0.60", "Raise VT to 7 mL/kg solely to normalize PaCO2"], "answer": 1, "explanation": "pH 7.24 with PaCO2 60 in a calm, well-perfused infant receiving target VT is tolerable moderate hypercapnia (pH >7.22). Reassess the trend rather than escalating VT, FiO2 or PEEP just to normalize PaCO2.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 47, "level": "High", "question": "Same infant next hour: pH 7.14, PaCO2 74, measured VT 3 mL/kg, ventilator shows pressure limit reached. CXR shows worsening diffuse atelectasis. Best next step?", "options": ["Reduce VT target further", "Accept unchanged because permissive hypercapnia has no pH limit", "Decrease PEEP immediately", "Reassess recruitment/PEEP, ETT patency and pressure limit while restoring effective VT"], "answer": 3, "explanation": "pH 7.14 with PaCO2 74 now exceeds permissive limits. Measured VT 3 mL/kg with the pressure limit reached and worsening atelectasis means VT cannot be delivered. Reassess recruitment/PEEP, ETT patency and the pressure limit to restore effective VT.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 48, "level": "High", "question": "A 27-week infant on SIMV has adequate mandatory VT but marked retractions between ventilator breaths. Best modification?", "options": ["Lower rate and remove synchronization", "Reduce all spontaneous support", "Increase FiO2 only", "Add/optimize pressure support or use a mode supporting spontaneous breaths"], "answer": 3, "explanation": "In SIMV, spontaneous breaths between mandatory breaths are unsupported, increasing work of breathing. Retractions between breaths call for pressure support or a mode that supports every spontaneous breath (AC/PSV).", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 49, "level": "High", "question": "A preterm infant with long time-constant disease has PaCO2 68 despite high rate. Flow waveform shows incomplete exhalation. Which change is most physiologically sound?", "options": ["Increase rate further", "Raise FiO2", "Reduce rate and allow longer expiratory time, then reassess VT/PEEP", "Increase inspiratory time without changing rate"], "answer": 2, "explanation": "Incomplete exhalation on the flow waveform in long time-constant disease means air trapping is causing hypercapnia. Reduce rate to lengthen expiratory time, then reassess VT/PEEP; more rate or longer inspiration worsens trapping.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 50, "level": "High", "question": "A 26-week infant on conventional ventilation has recurrent PIE despite reduced VT. Which rescue strategy is most defensible?", "options": ["Increase conventional VT to 8 mL/kg", "Consider HFOV in an experienced unit while minimizing MAP to the level needed for recruitment", "Eliminate PEEP completely", "Use iNO regardless of pulmonary pressures"], "answer": 1, "explanation": "Recurrent PIE despite reduced VT on conventional ventilation is a recognized indication to consider HFOV as rescue in an experienced unit, using the lowest MAP needed for recruitment. Higher VT, zero PEEP or iNO do not address the injury.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 51, "level": "High", "question": "A 28-week infant with RDS has worsening oxygenation. PEEP increase from 5→7 reduces FiO2 0.55→0.32 without hypotension. Interpretation?", "options": ["PEEP worsened venous return and should be reversed automatically", "Lower FiO2 proves overdistension", "VT should now be doubled", "Improved recruitment and oxygenation at a better PEEP"], "answer": 3, "explanation": "Raising PEEP from 5 to 7 lowered FiO2 from 0.55 to 0.32 without hypotension, showing better recruitment. This is a more optimal PEEP; nothing suggests overdistension.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 52, "level": "High", "question": "Same infant after PEEP 9 requires FiO2 0.38 and BP falls. Best conclusion?", "options": ["The higher PEEP may have caused overdistension/hemodynamic compromise; step back and reassess", "Increase VT first", "PEEP should be raised further because MAP always improves oxygenation", "Hypotension proves sepsis only"], "answer": 0, "explanation": "At PEEP 9, FiO2 rose and BP fell: overdistension can increase dead space and impair venous return. Step back to the previous PEEP and reassess — more pressure is not always better.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 53, "level": "High", "question": "A preterm infant has PaCO2 30 for 6 hours on ventilation. Which complication is of greatest concern from this gas pattern?", "options": ["NEC from hypercapnia", "PDA reopening from low CO2", "Hyperkalemia from respiratory acidosis", "Cerebral hypoperfusion/brain injury associated with hypocarbia"], "answer": 3, "explanation": "Sustained hypocarbia (PaCO2 30) causes cerebral vasoconstriction and is associated with cerebral hypoperfusion and brain injury (e.g., PVL) in preterm infants. That is why PaCO2 <35 mmHg is avoided.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 54, "level": "High", "question": "A 24-week infant with evolving BPD requires VT 6.5 mL/kg to maintain acceptable PaCO2 despite low pressures. Best interpretation?", "options": ["Increased dead space/heterogeneous mechanics may require somewhat higher VT than acute RDS", "Any VT >5 mL/kg is automatically malpractice", "PEEP must be zero", "The infant must have pneumothorax"], "answer": 0, "explanation": "Evolving BPD has more dead space and heterogeneous mechanics, so slightly higher VT (about 6–7 mL/kg) may be needed than in acute RDS to keep PaCO2 acceptable. VT must be individualized; >5 mL/kg is not automatically wrong.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 55, "level": "High", "question": "A 27-week infant has pH 7.35, PaCO2 65, HCO3− 35 after weeks of BPD. Which interpretation is best?", "options": ["Chronic respiratory acidosis with metabolic compensation", "Mixed metabolic acidosis", "Primary metabolic alkalosis only", "Acute uncompensated respiratory acidosis"], "answer": 0, "explanation": "Near-normal pH (7.35) with high PaCO2 (65) and high HCO3− (35) after weeks of BPD is chronic respiratory acidosis with renal metabolic compensation.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 56, "level": "High", "question": "A 25-week infant on VTV suddenly shows low exhaled VT and high leak after position change; breath sounds are louder on the right than left. Best first step?", "options": ["Check ETT depth/position before increasing ventilator settings", "Increase VT target", "Start steroids", "Increase PEEP to 12"], "answer": 0, "explanation": "Low exhaled VT and high leak after a position change, with louder breath sounds on the right, suggest ETT displacement (into the right main bronchus or toward the glottis). Check tube depth/position before increasing ventilator settings.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 57, "level": "High", "question": "A 26-week infant with established BPD develops rising oxygen need and hepatomegaly. Echo shows elevated RV pressure. Best interpretation?", "options": ["BPD-associated pulmonary hypertension should be considered", "Oxygen should be reduced to avoid toxicity regardless of saturation", "BPD cannot cause pulmonary vascular disease", "This proves PDA only"], "answer": 0, "explanation": "Rising oxygen need, hepatomegaly and raised RV pressure in established BPD point to BPD-associated pulmonary hypertension, caused by abnormal pulmonary vascular development.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 58, "level": "High", "question": "A preterm infant with BPD and pulmonary hypertension has frequent saturations 86–88%. Which principle is best?", "options": ["Avoid chronic hypoxemia; higher saturation targets may be appropriate with pulmonary hypertension", "Keep saturation below 88% to minimize oxygen toxicity", "Pulse oximetry is unnecessary", "FiO2 should always be 0.21"], "answer": 0, "explanation": "In BPD with pulmonary hypertension, chronic or intermittent hypoxemia worsens pulmonary vasoconstriction. Avoid saturations of 86–88%; higher saturation targets may be appropriate.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 59, "level": "High", "question": "A ventilator-dependent infant is being considered for postnatal corticosteroids. Which framing is most appropriate?", "options": ["Give routinely to all infants at 24 h", "Use solely to treat pneumothorax", "Avoid in every circumstance", "Consider only after individualized BPD-risk versus neurodevelopmental-risk assessment and extubation difficulty"], "answer": 3, "explanation": "Postnatal corticosteroids may help selected high-risk ventilator-dependent infants, but timing and regimen matter. Use them only after an individualized assessment of BPD risk versus neurodevelopmental risk and extubation difficulty — never routinely.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}, {"num": 60, "level": "High", "question": "A preterm infant has chronic loop-diuretic therapy but no edema and stable mechanics. Which is the best concern?", "options": ["Diuretics eliminate oxygen toxicity", "Diuretics cure BPD", "Routine long-term use may cause electrolyte/bone/renal adverse effects without proven disease-modifying benefit", "Diuretics improve alveolarization directly"], "answer": 2, "explanation": "Diuretics may give transient improvement in mechanics, but they do not modify BPD. Long-term routine use causes electrolyte disturbance, nephrocalcinosis/renal and bone effects. Without edema or mechanical benefit, ongoing use should be questioned.", "pearl": "The best option is often the one that respects both physiology and harm minimization.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet4_Q46-60_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 46–60</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
