<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 Quiz 2 — Q16–Q30</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 5 — Quiz 2</h1>
<div class="sub">Questions 16–30 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 16, "level": "Conceptual", "question": "A falling PIP requirement in VTV at constant target VT most likely indicates:", "options": ["Improving compliance", "Larger ETT leak", "Worsening obstruction", "New pneumothorax"], "answer": 0, "explanation": "In VTV, the pressure needed to deliver the same VT falls when compliance improves (e.g., after surfactant). The ventilator is auto-weaning PIP. Obstruction, pneumothorax and a larger leak would raise the pressure requirement or lower measured VT.", "pearl": "Link the ventilator change to respiratory mechanics, not to memorized numbers alone.", "srcAnswer": "A"}, {"num": 17, "level": "Conceptual", "question": "A rise in PIP requirement in VTV at the same target VT should prompt evaluation for:", "options": ["Normal transition only", "Worsening compliance, obstruction, air leak syndrome or edema", "Hyperglycemia only", "Improved lung mechanics only"], "answer": 1, "explanation": "Needing more PIP for the same VT means mechanics have worsened: falling compliance, airway/ETT obstruction, air leak (pneumothorax/PIE) or pulmonary edema. Evaluate the cause rather than just accepting higher pressure.", "pearl": "Link the ventilator change to respiratory mechanics, not to memorized numbers alone.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "Why can excessive PEEP cause hypotension?", "options": ["PEEP always causes PDA closure", "Increased intrathoracic pressure can reduce venous return", "PEEP directly lowers hemoglobin", "PEEP reduces systemic vascular resistance to zero"], "answer": 1, "explanation": "Excessive PEEP raises intrathoracic pressure, reducing systemic venous return and cardiac output, which can cause hypotension. It can also overdistend lungs and worsen oxygenation.", "pearl": "Link the ventilator change to respiratory mechanics, not to memorized numbers alone.", "srcAnswer": "A"}, {"num": 19, "level": "Conceptual", "question": "The most important conceptual distinction in modern BPD is that it is predominantly:", "options": ["Arrested alveolar and vascular development with superimposed injury", "Persistent surfactant deficiency only", "Pure bacterial pneumonia", "Isolated pleural fibrosis"], "answer": 0, "explanation": "Modern ('new') BPD is mainly arrested alveolar and pulmonary vascular development in extremely preterm infants, with superimposed injury from oxygen, stretch, inflammation and infection — rather than fibrosis or persistent surfactant deficiency.", "pearl": "Link the ventilator change to respiratory mechanics, not to memorized numbers alone.", "srcAnswer": "A"}, {"num": 20, "level": "Conceptual", "question": "Why is support intensity at 36 weeks PMA useful in BPD classification?", "options": ["It replaces all clinical assessment", "It correlates with ongoing disease severity and later respiratory morbidity better than oxygen concentration alone", "It eliminates gestational-age effects completely", "It proves pulmonary hypertension"], "answer": 1, "explanation": "The mode and intensity of respiratory support at 36 weeks PMA reflects ongoing disease severity and predicts later respiratory morbidity better than oxygen concentration alone. Hence newer, support-based BPD grading.", "pearl": "Link the ventilator change to respiratory mechanics, not to memorized numbers alone.", "srcAnswer": "A"}, {"num": 21, "level": "Clinical", "question": "A 26-week infant on VTV has VT 5 mL/kg, PEEP 6, FiO2 0.28, pH 7.30, PaCO2 57 mmHg and is comfortable. What is the best next step?", "options": ["Continue current support and monitor because permissive hypercapnia is acceptable", "Increase FiO2 to 0.50 to treat hypercapnia", "Add bicarbonate despite normal HCO3−", "Increase VT to 7 mL/kg immediately to normalize PaCO2"], "answer": 0, "explanation": "pH 7.30 with PaCO2 57 on VT 5 mL/kg in a comfortable infant is acceptable permissive hypercapnia (pH >7.22). Raising VT risks volutrauma, FiO2 does not treat CO2, and bicarbonate is not indicated with normal HCO3−.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "B"}, {"num": 22, "level": "Clinical", "question": "A 25-week infant on AC-VTV has pH 7.18, PaCO2 70 and exhaled VT 2.5 mL/kg despite a target of 5 mL/kg. A large ETT leak is displayed. Best next step?", "options": ["Accept the gas without troubleshooting", "Increase FiO2 only", "Correct tube/interface leak and reassess delivered VT", "Reduce target VT to 3 mL/kg"], "answer": 2, "explanation": "Severe respiratory acidosis with exhaled VT half of target and a large leak means VT is not being delivered. Fix the tube/interface leak first, then reassess delivered VT. More FiO2 or a lower VT target does not address ventilation.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 23, "level": "Clinical", "question": "A ventilated neonate abruptly desaturates. Peak pressure rises, exhaled VT falls, and a suction catheter cannot pass through the ETT. Best immediate diagnosis?", "options": ["Improving compliance", "ETT obstruction", "Pulmonary hypertension alone", "BPD progression"], "answer": 1, "explanation": "Sudden desaturation with rising peak pressure, falling exhaled VT and a suction catheter that cannot pass indicates ETT obstruction (the 'O' in DOPE). Restore patency or replace the tube promptly.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 24, "level": "Clinical", "question": "A ventilated preterm infant develops sudden hypoxemia, hypotension, bradycardia and absent right-sided breath sounds. Best next action?", "options": ["Give furosemide first", "Obtain a CXR before intervention", "Immediate needle decompression followed by definitive drainage", "Increase PEEP and wait"], "answer": 2, "explanation": "Sudden hypoxemia, hypotension, bradycardia and absent unilateral breath sounds indicate tension pneumothorax. In an unstable infant, perform immediate needle decompression and then definitive drainage — do not wait for a CXR.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 25, "level": "Clinical", "question": "A 27-week infant has pH 7.48, PaCO2 28, VT 8 mL/kg on pressure ventilation. Best ventilator strategy?", "options": ["Reduce delivered VT/minute ventilation", "Increase respiratory rate", "Increase FiO2 only", "Increase PIP"], "answer": 0, "explanation": "pH 7.48 with PaCO2 28 on VT 8 mL/kg shows overventilation with hypocarbia and volutrauma risk. Reduce delivered VT/minute ventilation promptly; raising PIP or rate would worsen it.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical", "question": "A preterm infant has pH 7.25, PaCO2 58, HCO3− 25 and stable hemodynamics. Which interpretation is best?", "options": ["Severe metabolic acidosis", "Mixed alkalosis", "Mild respiratory acidosis that may be acceptable depending on context", "Immediate need for bicarbonate"], "answer": 2, "explanation": "pH 7.25 with PaCO2 58 and normal HCO3− (25) is a mild respiratory acidosis. In a stable preterm infant it may be acceptable permissive hypercapnia; it is not metabolic and does not need bicarbonate.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 27, "level": "Clinical", "question": "ABG: pH 7.16, PaCO2 49, HCO3− 17, lactate 6 mmol/L. Infant is cool with capillary refill 5 s. Best interpretation?", "options": ["Pure respiratory acidosis", "Pure respiratory alkalosis", "Significant metabolic acidosis from hypoperfusion with limited respiratory compensation", "Normal permissive hypercapnia"], "answer": 2, "explanation": "Low pH with low HCO3− (17), high lactate and poor perfusion indicates metabolic (lactic) acidosis from hypoperfusion. PaCO2 49 is not appropriately low, so respiratory compensation is limited. Treat the shock; ventilator escalation alone is insufficient.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 28, "level": "Clinical", "question": "A ventilated infant has persistent hypoxemia but PaCO2 is 42 and VT is appropriate. CXR shows diffuse under-recruitment. Best next ventilator concept?", "options": ["Reduce PEEP", "Optimize PEEP/MAP rather than increasing VT", "Decrease FiO2 to room air immediately", "Increase VT aggressively"], "answer": 1, "explanation": "Hypoxemia with normal PaCO2 and appropriate VT is an oxygenation problem caused by under-recruitment. Optimize PEEP/MAP to recruit lung; raising VT targets CO2, not oxygenation, and adds volutrauma.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical", "question": "A preterm infant with evolving BPD has hypercapnia, hyperinflation, and expiratory flow that does not return to baseline. Best initial ventilator change?", "options": ["Increase VT without changing timing", "Shorten expiratory time further", "Reduce rate to lengthen expiratory time", "Increase rate substantially"], "answer": 2, "explanation": "Expiratory flow not returning to baseline with hyperinflation and hypercapnia indicates air trapping (auto-PEEP). Reduce rate to lengthen expiratory time, then reassess PEEP and VT. Increasing rate worsens trapping.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}, {"num": 30, "level": "Clinical", "question": "A VTV infant after surfactant requires PIP 14 instead of 24 cm H2O to deliver the same 5 mL/kg VT. Best interpretation?", "options": ["Improved compliance with automatic pressure weaning", "New tension pneumothorax", "Worsening obstruction", "New PIE"], "answer": 0, "explanation": "Delivering the same 5 mL/kg VT with PIP 14 instead of 24 means compliance has improved after surfactant and the VTV mode has weaned pressure automatically. Do not raise PIP back.", "pearl": "Choose the intervention that corrects the immediate physiologic problem with the least added lung injury.", "srcAnswer": "A"}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation</b> <small>(added — not from source)</small><b>:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
