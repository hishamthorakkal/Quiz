const quiz=[{"num": 16, "level": "Conceptual", "question": "Jensen BPD grading is primarily based on:", "options": ["Respiratory-support level at 36 weeks PMA", "Birth weight", "Chest CT", "FiO2 alone"], "answer": 0, "explanation": "Jensen classification uses support mode/flow at 36 weeks PMA.", "pearl": "Respiratory-support level at 36 weeks PMA: Jensen classification uses support mode/flow at 36 weeks PMA.", "srcAnswer": "D"}, {"num": 17, "level": "Conceptual", "question": "Lowering HFOV frequency may improve CO2 removal because:", "options": ["Bicarbonate rises", "Oscillatory VT often increases", "Dead space disappears", "MAP always falls"], "answer": 1, "explanation": "HFOV VT typically rises as frequency falls. Why not the others: A. Bicarbonate rises — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.", "pearl": "Oscillatory VT often increases: HFOV VT typically rises as frequency falls.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "Tension pneumothorax causes shock because:", "options": ["Only CO2 changes", "It causes alkalosis", "Venous return increases", "Intrathoracic pressure impairs venous return and cardiac output"], "answer": 3, "explanation": "Mediastinal pressure reduces preload.", "pearl": "Intrathoracic pressure impairs venous return and cardiac output: Mediastinal pressure reduces preload.", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "'New BPD' is developmental because:", "options": ["It is pleural air", "Prematurity and injury interrupt alveolar and vascular development", "Only infection causes it", "It occurs only in term infants"], "answer": 1, "explanation": "Modern BPD reflects arrested lung development.", "pearl": "Prematurity and injury interrupt alveolar and vascular development: Modern BPD reflects arrested lung development.", "srcAnswer": "C"}, {"num": 20, "level": "Conceptual", "question": "Normal pH with high PaCO2 and high HCO3− may indicate:", "options": ["Pure metabolic alkalosis only", "Spurious CO2", "Compensated chronic respiratory acidosis", "No lung disease"], "answer": 2, "explanation": "Renal bicarbonate retention can normalize pH despite chronic CO2 elevation. Why not the others: A. Pure metabolic alkalosis only — Primary metabolic alkalosis requires elevated bicarbonate causing alkalemia; that pattern is not present in the stem.", "pearl": "Compensated chronic respiratory acidosis: Renal bicarbonate retention can normalize pH despite chronic CO2 elevation.", "srcAnswer": "D"}, {"num": 21, "level": "Clinical/Application", "question": "A 26-week infant receives surfactant; VT rises from 5 to 9 mL/kg and PaCO2 falls to 28. Best next step?", "options": ["Increase FiO2", "Increase PEEP only", "Reduce inspiratory pressure/target VT", "Increase rate"], "answer": 2, "explanation": "Compliance improved and support is now excessive. Why not the others: A. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; B. Increase PEEP only — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.; D. Increase rate — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.", "pearl": "Reduce inspiratory pressure/target VT: Compliance improved and support is now excessive.", "srcAnswer": "A"}, {"num": 22, "level": "Clinical/Application", "question": "Ventilated infant: pH 7.21, PaCO2 70, VT falling, thick secretions. First action?", "options": ["Increase FiO2", "Give bicarbonate", "Suction/check ETT patency", "Increase PIP"], "answer": 2, "explanation": "Obstruction should be corrected before pressure escalation. Why not the others: A. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; B. Give bicarbonate — Sodium bicarbonate does not correct the primary mechanical/ventilatory lesion and can generate additional CO2; the underlying ventilation or perfusion problem must be treated first.; D. Increase PIP — Increasing PIP raises driving pressure and often VT in pressure-controlled ventilation, increasing volutrauma/air-leak risk if the actual problem is obstruction, improved compliance, or trapping.", "pearl": "Suction/check ETT patency: Obstruction should be corrected before pressure escalation.", "srcAnswer": "B"}, {"num": 23, "level": "Clinical/Application", "question": "Low PaO2, normal PaCO2, diffuse atelectasis. Best strategy?", "options": ["Increase caffeine", "Increase rate", "Reduce PEEP", "Optimize PEEP/MAP and FiO2"], "answer": 3, "explanation": "This is primarily recruitment/oxygenation failure. Why not the others: A. Increase caffeine — Caffeine improves respiratory drive and reduces apnea in preterm infants; it does not directly recruit atelectatic lung, drain an air leak, or correct an ETT obstruction.; B. Increase rate — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.; C. Reduce PEEP — Reducing PEEP can decrease overdistension but may derecruit alveoli and worsen shunt when the problem is low lung volume.", "pearl": "Optimize PEEP/MAP and FiO2: This is primarily recruitment/oxygenation failure.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical/Application", "question": "Evolving BPD; expiratory flow does not reach baseline before next breath. Best change?", "options": ["Shorten expiration", "Increase expiratory time", "Increase rate", "Increase FiO2 only"], "answer": 1, "explanation": "The waveform shows air trapping. Why not the others: A. Shorten expiration — Shortening expiratory time increases the risk of incomplete emptying, dynamic hyperinflation and auto-PEEP in long time-constant disease.; C. Increase rate — Increasing rate increases mandatory breath frequency/minute ventilation but shortens expiratory time; it can worsen air trapping when exhalation is incomplete.; D. Increase FiO2 only — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.", "pearl": "Increase expiratory time: The waveform shows air trapping.", "srcAnswer": "D"}, {"num": 25, "level": "Clinical/Application", "question": "pH 7.10, PaCO2 65, HCO3 19, lactate high. Interpretation?", "options": ["Compensated respiratory acidosis", "Mixed respiratory and metabolic acidosis", "Pure respiratory acidosis", "Pure metabolic acidosis"], "answer": 1, "explanation": "Both CO2 retention and low bicarbonate contribute. Why not the others: A. Compensated respiratory acidosis — Primary respiratory acidosis requires CO2 retention that explains the acidemia; the bicarbonate pattern and expected compensation must also fit.; C. Pure respiratory acidosis — Primary respiratory acidosis requires CO2 retention that explains the acidemia; the bicarbonate pattern and expected compensation must also fit.; D. Pure metabolic acidosis — Primary metabolic acidosis requires reduced bicarbonate as the major driver of acidemia, with an appropriate compensatory fall in PaCO2.", "pearl": "Mixed respiratory and metabolic acidosis: Both CO2 retention and low bicarbonate contribute.", "srcAnswer": "A"}, {"num": 26, "level": "Clinical/Application", "question": "HFOV: PaCO2 74, oxygenation acceptable, chest wiggle minimal. Best first change?", "options": ["Increase amplitude", "Increase FiO2", "Increase PEEP", "Reduce MAP"], "answer": 0, "explanation": "Amplitude is the primary HFOV CO2 control. Why not the others: B. Increase FiO2 — Increasing FiO2 raises inspired oxygen concentration and may improve hypoxemia, but it does not increase alveolar ventilation or correct ETT obstruction, excessive VT, or tension physiology.; C. Increase PEEP — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.; D. Reduce MAP — Reducing MAP can relieve overdistension but may derecruit lung and worsen oxygenation if lung volume is already inadequate.", "pearl": "Increase amplitude: Amplitude is the primary HFOV CO2 control.", "srcAnswer": "B"}, {"num": 27, "level": "Clinical/Application", "question": "At 36 weeks PMA an infant remains on CPAP. Jensen grade?", "options": ["Grade 1", "Grade 2", "No BPD", "Grade 3"], "answer": 1, "explanation": "Non-invasive positive pressure is Grade 2. Why not the others: A. Grade 1 — Jensen Grade 1 requires nasal cannula flow ≤2 L/min at 36 weeks PMA.; C. No BPD — In the Jensen support-based definition, no BPD means no respiratory support at 36 weeks PMA.; D. Grade 3 — Jensen Grade 3 requires invasive mechanical ventilation at 36 weeks PMA.", "pearl": "Grade 2: Non-invasive positive pressure is Grade 2.", "srcAnswer": "C"}, {"num": 28, "level": "Clinical/Application", "question": "Severe BPD with rising O2 need, poor growth and elevated RV pressure on echo. Concern?", "options": ["Physiologic anemia only", "NEC", "Apnea only", "BPD-associated pulmonary hypertension"], "answer": 3, "explanation": "This pattern strongly suggests BPD-PH.", "pearl": "BPD-associated pulmonary hypertension: This pattern strongly suggests BPD-PH.", "srcAnswer": "D"}, {"num": 29, "level": "Clinical/Application", "question": "Ventilated 29-week infant suddenly cyanotic, bradycardic, hypotensive with asymmetry. Next?", "options": ["Increase PEEP", "Immediate decompression", "Wait for ABG", "CXR first"], "answer": 1, "explanation": "Classic unstable tension pneumothorax. Why not the others: A. Increase PEEP — Increasing PEEP raises end-expiratory lung volume and can recruit atelectatic lung, but excessive PEEP can overdistend alveoli, reduce venous return, and—if PIP is fixed—reduce driving pressure.; D. CXR first — Chest radiography is diagnostic in a stable infant, but suspected tension pneumothorax with hemodynamic compromise must be decompressed immediately rather than delayed for imaging.", "pearl": "Immediate decompression: Classic unstable tension pneumothorax.", "srcAnswer": "A"}, {"num": 30, "level": "Clinical/Application", "question": "25-week infant on high pressures has linear/cystic hilar lucencies. Diagnosis?", "options": ["Pleural effusion", "Pneumomediastinum", "PIE", "Atelectasis"], "answer": 2, "explanation": "The radiographic pattern is classic PIE. Why not the others: A. Pleural effusion — Pleural effusion produces pleural fluid opacity/blunting rather than the linear or cystic interstitial lucencies described for PIE.; B. Pneumomediastinum — Pneumomediastinum is mediastinal air, often with a spinnaker-sail appearance; it is anatomically distinct from pleural pneumothorax and interstitial PIE.; D. Atelectasis — Atelectasis causes increased density and volume loss, not the characteristic air-containing linear/cystic lucencies of PIE.", "pearl": "PIE: The radiographic pattern is classic PIE.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day5',label:'Day 5',set:'Quiz 2',href:'Day5/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&!a.correct&&!a.tag}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert('Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day5_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 5 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 5'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 5');
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day5:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script></body></html>
