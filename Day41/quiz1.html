:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}

@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "", "question": "A 2-year-old has an adrenal mass crossing the midline, calcification and elevated urinary catecholamine metabolites. Most likely diagnosis?", "options": ["Neuroblastoma", "Hepatoblastoma", "Adrenocortical carcinoma", "Wilms tumour"], "answer": 0, "explanation": "Neural crest tumour; catecholamine metabolites and calcification favour neuroblastoma. Why not the others (added — not from source): B. Hepatoblastoma — Hepatoblastoma is a liver mass marked by raised AFP, not an adrenal mass with urinary catecholamine metabolites.; C. Adrenocortical carcinoma — Adrenocortical carcinoma is adrenal but presents with virilisation or Cushing features from steroid excess, not raised VMA/HVA with calcification crossing the midline.; D. Wilms tumour — Wilms tumour arises within the kidney, rarely calcifies and rarely crosses the midline; it does not raise urinary catecholamine metabolites.", "pearl": "", "srcAnswer": "A"}, {"num": 2, "level": "", "question": "A 3-year-old has a painless unilateral renal mass and hypertension. Most likely tumour?", "options": ["Neuroblastoma", "Wilms tumour", "Renal cell carcinoma", "Rhabdomyosarcoma"], "answer": 1, "explanation": "Intrarenal origin with hypertension and typical age favours Wilms. Why not the others (added — not from source): A. Neuroblastoma — Neuroblastoma is usually suprarenal, often crosses the midline, calcifies and makes the child look unwell; a painless intrarenal mass in a well 3-year-old favours Wilms.; C. Renal cell carcinoma — Renal cell carcinoma is a tumour of adolescents and adults; in a 3-year-old a renal mass is far more likely to be Wilms.; D. Rhabdomyosarcoma — Rhabdomyosarcoma usually arises in the head and neck, genitourinary tract or extremities, not as a primary renal mass with hypertension.", "pearl": "", "srcAnswer": "D"}, {"num": 3, "level": "", "question": "An infant has leukocoria and strabismus. What is the most appropriate immediate next step?", "options": ["Routine vision review in six months", "Start topical antibiotic drops", "Observe until school age", "Urgent dilated retinal examination by ophthalmology"], "answer": 3, "explanation": "Leukocoria is an urgent referral sign for retinoblastoma and other sight-threatening causes. Why not the others (added — not from source): A. Routine vision review in six months — A six-month routine review is far too late; leukocoria with strabismus needs urgent dilated fundus examination.; B. Start topical antibiotic drops — Leukocoria is not conjunctivitis; antibiotic drops only delay diagnosis of retinoblastoma or another sight-threatening cause.; C. Observe until school age — Observation risks loss of the eye, extraocular spread and death from retinoblastoma; leukocoria needs urgent assessment.", "pearl": "", "srcAnswer": "C"}, {"num": 4, "level": "", "question": "A toddler has a large liver mass and markedly elevated AFP. Most likely diagnosis?", "options": ["Hepatoblastoma", "Hepatic hemangioma", "Biliary atresia", "Focal nodular hyperplasia"], "answer": 0, "explanation": "Hepatoblastoma is the classic malignant liver tumour in young children with AFP elevation. Why not the others (added — not from source): B. Hepatic hemangioma — Infantile hepatic haemangioma is a vascular lesion of early infancy without marked AFP elevation beyond the age-expected range.; C. Biliary atresia — Biliary atresia presents with cholestatic jaundice and pale stools in early infancy, not a large liver mass with markedly raised AFP.; D. Focal nodular hyperplasia — Focal nodular hyperplasia is a benign lesion, usually in older children, with normal AFP.", "pearl": "", "srcAnswer": "B"}, {"num": 5, "level": "", "question": "A teenager has progressive knee pain and a destructive metaphyseal distal femur lesion with sunburst periosteal reaction. Diagnosis?", "options": ["Chondroblastoma", "Ewing sarcoma", "Osteomyelitis", "Osteosarcoma"], "answer": 3, "explanation": "Metaphyseal long-bone location and osteoid-producing aggressive lesion favour osteosarcoma. Why not the others (added — not from source): A. Chondroblastoma — Chondroblastoma is a benign epiphyseal lesion, not an aggressive metaphyseal tumour with sunburst periosteal reaction.; B. Ewing sarcoma — Ewing sarcoma favours the diaphysis with an onion-skin reaction and soft-tissue mass; a metaphyseal distal femur lesion with sunburst reaction favours osteosarcoma.; C. Osteomyelitis — Osteomyelitis gives fever and periosteal new bone but not a destructive sunburst pattern of tumour osteoid in a teenager with progressive pain.", "pearl": "", "srcAnswer": "A"}, {"num": 6, "level": "", "question": "A 12-year-old has fever, diaphyseal bone pain and an onion-skin periosteal reaction. Which tumour is most characteristic?", "options": ["Ewing sarcoma", "Osteosarcoma", "Giant cell tumour", "Osteochondroma"], "answer": 0, "explanation": "Ewing typically arises in diaphysis and may mimic infection. Why not the others (added — not from source): B. Osteosarcoma — Osteosarcoma typically involves the metaphysis with a sunburst reaction; a diaphyseal onion-skin lesion with fever is classic for Ewing.; C. Giant cell tumour — Giant cell tumour is an epiphyseal lesion of skeletally mature young adults, without fever or onion-skin periosteal reaction.; D. Osteochondroma — Osteochondroma is a benign exostosis projecting from the metaphysis, not a painful febrile diaphyseal lesion.", "pearl": "", "srcAnswer": "D"}, {"num": 7, "level": "", "question": "A child presents with a rapidly growing orbital soft-tissue mass. Which childhood sarcoma should be considered?", "options": ["Wilms tumour", "Osteosarcoma", "Rhabdomyosarcoma", "Hepatoblastoma"], "answer": 2, "explanation": "Embryonal rhabdomyosarcoma commonly affects head and neck including orbit. Why not the others (added — not from source): A. Wilms tumour — Wilms tumour is a renal tumour and does not present as a primary orbital mass.; B. Osteosarcoma — Osteosarcoma is a bone tumour of long-bone metaphyses, not a rapidly growing orbital soft-tissue mass.; D. Hepatoblastoma — Hepatoblastoma is a liver tumour; it is not an orbital soft-tissue sarcoma.", "pearl": "", "srcAnswer": "C"}, {"num": 8, "level": "", "question": "A child with high-burden leukaemia develops hyperkalaemia, hyperphosphataemia, hypocalcaemia and rising creatinine after therapy. Diagnosis?", "options": ["Tumour lysis syndrome", "Fanconi syndrome", "SIADH", "Diabetes insipidus"], "answer": 0, "explanation": "Rapid cellular breakdown releases potassium and phosphate and causes urate-associated renal injury. Why not the others (added — not from source): B. Fanconi syndrome — Fanconi syndrome causes hypokalaemia and hypophosphataemia from proximal tubular losses, the opposite of this pattern.; C. SIADH — SIADH causes hyponatraemia with concentrated urine, not hyperkalaemia, hyperphosphataemia and hypocalcaemia.; D. Diabetes insipidus — Diabetes insipidus causes polyuria and hypernatraemia, not the potassium, phosphate and calcium pattern of cell lysis.", "pearl": "", "srcAnswer": "B"}, {"num": 9, "level": "", "question": "A child receiving chemotherapy has fever and profound neutropenia. Best immediate approach?", "options": ["Give antipyretic alone and discharge", "Prompt sepsis assessment, cultures if feasible without delay, and empiric IV antibiotics", "Wait for blood-culture positivity before treatment", "Defer assessment until morning"], "answer": 1, "explanation": "Febrile neutropenia is a time-sensitive emergency; empiric antibiotics should not be delayed. Why not the others (added — not from source): A. Give antipyretic alone and discharge — Antipyretic alone with discharge ignores a potentially fatal bacteraemia; febrile neutropenia needs assessment and empiric IV antibiotics.; C. Wait for blood-culture positivity before treatment — Waiting for culture positivity delays treatment by hours to days; febrile neutropenia mortality rises with every hour without antibiotics.; D. Defer assessment until morning — Deferring assessment until morning breaches the time-to-antibiotic standard, usually within about an hour of presentation.", "pearl": "", "srcAnswer": "A"}, {"num": 10, "level": "", "question": "A child with cancer develops new back pain, weakness and urinary retention. Priority?", "options": ["Emergency assessment for malignant spinal cord compression", "Delay imaging for two weeks", "Reassurance and discharge", "Routine outpatient physiotherapy"], "answer": 0, "explanation": "New neurological deficits require urgent imaging and specialist management. Why not the others (added — not from source): B. Delay imaging for two weeks — Neurological outcome depends on function when treatment starts; imaging must be urgent (MRI spine), not delayed for two weeks.; C. Reassurance and discharge — New weakness and urinary retention in a child with cancer are red flags; reassurance and discharge is unsafe.; D. Routine outpatient physiotherapy — Physiotherapy without imaging misses cord compression, where delay causes permanent paralysis and sphincter loss.", "pearl": "", "srcAnswer": "D"}, {"num": 11, "level": "", "question": "A child with an anterior mediastinal mass has orthopnoea and stridor. Which procedural principle is safest?", "options": ["Avoid unnecessary deep sedation or supine positioning; urgent expert airway planning", "Give oral sedation in clinic", "Force supine positioning for examination", "Perform elective general anaesthesia without planning"], "answer": 0, "explanation": "Airway/cardiovascular collapse risk rises with sedation and loss of spontaneous ventilation. Why not the others (added — not from source): B. Give oral sedation in clinic — Sedation reduces airway tone and spontaneous effort and can cause collapse; it is unsafe in clinic with stridor and orthopnoea.; C. Force supine positioning for examination — Supine positioning lets the mass compress the trachea and great vessels, precipitating airway or cardiovascular collapse.; D. Perform elective general anaesthesia without planning — General anaesthesia with loss of spontaneous ventilation can cause complete obstruction; it needs expert multidisciplinary planning, never an unplanned elective approach.", "pearl": "", "srcAnswer": "C"}, {"num": 12, "level": "", "question": "Which biological factor is a major adverse prognostic marker in neuroblastoma?", "options": ["Age younger than 18 months alone", "Favourable histology", "MYCN amplification", "Localized tumour alone"], "answer": 2, "explanation": "MYCN amplification correlates with aggressive disease and risk stratification. Why not the others (added — not from source): A. Age younger than 18 months alone — Age under 18 months is a favourable factor in neuroblastoma, not adverse.; B. Favourable histology — Favourable histology (INPC/Shimada) is a good prognostic feature, not an adverse one.; D. Localized tumour alone — Localised disease is favourable; extent alone does not denote high risk the way MYCN amplification does.", "pearl": "", "srcAnswer": "B"}, {"num": 13, "level": "", "question": "Which congenital syndrome is strongly associated with Wilms tumour?", "options": ["Noonan syndrome", "WAGR syndrome", "Marfan syndrome", "Turner syndrome"], "answer": 1, "explanation": "WAGR includes Wilms tumour, aniridia, genitourinary anomalies and developmental delay. Why not the others (added — not from source): A. Noonan syndrome — Noonan syndrome predisposes to JMML and some other tumours, not specifically Wilms tumour as WAGR (WT1 deletion) does.; C. Marfan syndrome — Marfan syndrome is a fibrillin-1 connective tissue disorder without Wilms tumour predisposition.; D. Turner syndrome — Turner syndrome is associated with horseshoe kidney but is not a classic Wilms predisposition syndrome like WAGR.", "pearl": "", "srcAnswer": "A"}, {"num": 14, "level": "", "question": "Bilateral multifocal retinoblastoma most strongly suggests what?", "options": ["Acquired bacterial infection", "Isolated trauma", "Germline RB1 predisposition", "Vitamin A deficiency"], "answer": 2, "explanation": "Heritable RB1 predisposition is especially likely with bilateral multifocal disease. Why not the others (added — not from source): A. Acquired bacterial infection — Infection does not produce multifocal bilateral retinal tumours; bilaterality reflects a germline RB1 mutation.; B. Isolated trauma — Trauma does not cause retinoblastoma; bilateral multifocal tumours indicate heritable disease.; D. Vitamin A deficiency — Vitamin A deficiency causes xerophthalmia and keratomalacia, not retinoblastoma.", "pearl": "", "srcAnswer": "D"}, {"num": 15, "level": "", "question": "Which condition increases hepatoblastoma risk?", "options": ["Cystic fibrosis alone", "Turner syndrome", "Achondroplasia", "Beckwith–Wiedemann syndrome"], "answer": 3, "explanation": "Overgrowth syndromes including Beckwith–Wiedemann increase risk. Why not the others (added — not from source): A. Cystic fibrosis alone — Cystic fibrosis causes liver disease but is not a hepatoblastoma predisposition; overgrowth syndromes such as BWS are.; B. Turner syndrome — Turner syndrome is not a recognised hepatoblastoma predisposition; the classic associations are BWS, FAP and extreme prematurity.; C. Achondroplasia — Achondroplasia (FGFR3) does not carry an increased hepatoblastoma risk.", "pearl": "", "srcAnswer": "C"}];
const NB_CTX={srcId:'Day41',label:'Day 41',set:'Quiz 1',href:'Day41/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day41_QuizSet1_Q1-15_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 41 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–15</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 41 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 41'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 41');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day41:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
