<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 3 Quiz 3 — Q31–Q45</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 3 — Quiz 3</h1>
<div class="sub">Questions 31–45 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 31, "level": "High", "question": "A 35-week infant is born after 20 h ROM. Mother is afebrile and GBS negative. Infant is well. Which is the best reasoning?", "options": ["ROM ≥18 h alone proves EOS", "Risk should be integrated with gestation, maternal factors and infant examination; serial assessment may be appropriate", "Mandatory 10-day antibiotics", "Mandatory LP"], "answer": 1, "explanation": "ROM is one risk factor; integrated risk assessment and serial examination are more appropriate than declaring disease.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 32, "level": "High", "question": "A 30-week infant is delivered by cesarean for severe maternal preeclampsia without labor or ROM. Infant has expected RDS but is otherwise stable. Which statement is best?", "options": ["All preterm infants have identical EOS risk", "Circumstances of preterm birth matter; this scenario may carry lower EOS risk than PPROM/intra-amniotic infection", "EOS calculator should automatically be used", "Meningitis is proven"], "answer": 1, "explanation": "Preterm birth circumstances matter; cesarean without labor/ROM for noninfectious maternal disease can carry lower EOS risk.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 33, "level": "High", "question": "A preterm infant has sterile cultures at 48 h, stable chronic respiratory support and an I/T ratio of 0.28. What is the best antibiotic principle?", "options": ["Continue antibiotics solely because I/T is elevated", "Do not prolong empiric therapy based on laboratory abnormality alone without clinical/site-specific evidence", "Add meropenem", "Add vancomycin"], "answer": 1, "explanation": "AAP guidance cautions against extending antibiotics solely for lab abnormalities when cultures are sterile.", "pearl": "Clinical trajectory and microbiology outweigh isolated screening-test abnormalities.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 34, "level": "High", "question": "A 2-day-old infant received maternal intrapartum antibiotics. Blood culture remains sterile. Which statement is most accurate?", "options": ["Modern culture systems can still detect bacteremia; intrapartum antibiotics do not automatically invalidate cultures", "Cultures are always useless after maternal antibiotics", "CRP becomes the gold standard", "LP is never needed"], "answer": 0, "explanation": "Modern culture systems remain useful despite maternal intrapartum antibiotics.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 35, "level": "High", "question": "A neonate with GBS bacteremia is improving, but LP was not done before antibiotics. Which is the key concern?", "options": ["Occult meningitis may alter treatment duration", "GBS never causes meningitis", "Blood culture excludes CNS infection", "Therapy can always stop at 48 h"], "answer": 0, "explanation": "Without CSF evaluation, occult meningitis may be missed and treatment duration may be inadequate.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 36, "level": "High", "question": "A 16-day-old NICU infant has one blood culture positive for CoNS, is clinically stable, and repeat peripheral culture is negative. Best reasoning?", "options": ["CoNS always means true sepsis", "Consider contamination versus line infection using clinical context, number/site of positive cultures and repeat cultures", "Treat 21 days automatically", "Diagnose meningitis"], "answer": 1, "explanation": "CoNS interpretation depends on clinical context, repeat cultures and line/peripheral concordance.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 37, "level": "High", "question": "A neonate has persistent S. aureus bacteremia despite appropriate antibiotics. What is the next conceptual step?", "options": ["Search for source/deep focus and assess line removal", "Ignore persistence", "Stop antibiotics", "Diagnose TTN"], "answer": 0, "explanation": "Persistent S. aureus bacteremia demands source/deep-focus evaluation and device assessment.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 38, "level": "High", "question": "A 6-day-old infant with meningitis has CSF pleocytosis, high protein and low glucose. Blood culture is negative after prior antibiotics. Best interpretation?", "options": ["Negative blood culture excludes meningitis", "CSF findings and clinical syndrome may still support bacterial meningitis", "This is definitely viral", "No treatment is needed"], "answer": 1, "explanation": "Prior antibiotics can sterilize blood culture; compatible CSF and clinical syndrome can still represent bacterial meningitis.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 39, "level": "High", "question": "A neonate has suspected Gram-negative meningitis. Which duration principle is most appropriate?", "options": ["48 h", "At least about 21 days, adjusted for organism, sterilization and complications", "3 days", "One dose"], "answer": 1, "explanation": "Gram-negative neonatal meningitis generally requires at least about 21 days, individualized to response/complications.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 40, "level": "High", "question": "A neonate has uncomplicated GBS meningitis with good response and sterile follow-up as appropriate. A commonly used duration is approximately:", "options": ["3 days", "7 days", "14 days", "6 weeks for every case"], "answer": 2, "explanation": "Uncomplicated GBS meningitis is commonly treated for about 14 days.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 41, "level": "High", "question": "A shocked neonate receives antibiotics and cautious fluid but remains poorly perfused. Next management principle?", "options": ["Consider vasoactive support with ongoing reassessment", "Give unlimited fluid without reassessment", "Stop monitoring", "Delay all support until culture result"], "answer": 0, "explanation": "Persistent shock after cautious fluid resuscitation may require vasoactive support.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 42, "level": "High", "question": "A neonate has hyperbilirubinemia and needs meningitis therapy. Which drug is generally avoided in neonates?", "options": ["Ceftriaxone", "Ampicillin", "Gentamicin", "Penicillin G"], "answer": 0, "explanation": "Ceftriaxone is generally avoided in neonates because of bilirubin displacement and calcium-related safety concerns.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 43, "level": "High", "question": "A term infant is asymptomatic but maternal temperature was elevated intrapartum. Which statement is most accurate?", "options": ["Clinical condition after birth remains central to risk assessment", "Maternal fever automatically proves neonatal sepsis", "CRP at birth proves infection", "Every infant needs 21 days of therapy"], "answer": 0, "explanation": "Maternal fever raises risk but the infant's clinical condition remains central.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 44, "level": "High", "question": "A preterm infant has new apnea. Blood culture is obtained. Which additional finding would most increase concern for systemic infection?", "options": ["New thrombocytopenia and glucose instability", "Stable weight gain", "Normal perfusion", "Improving oxygen need"], "answer": 0, "explanation": "New thrombocytopenia and glucose instability add systemic evidence beyond isolated apnea.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}, {"num": 45, "level": "High", "question": "A neonate has culture-proven bacteremia. After susceptibilities return, the broad empiric regimen is still continued unchanged despite a narrow susceptible option. What principle is being violated?", "options": ["Antimicrobial de-escalation/stewardship", "Thermal care", "Developmental care", "Kangaroo care"], "answer": 0, "explanation": "Once susceptibilities are known, narrowing therapy is core antimicrobial stewardship.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This tests rank-differentiating integration of neonatal epidemiology, diagnostics and management."}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day3_QuizSet3_Q31-45_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 3 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 31–45</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
