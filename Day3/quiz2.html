<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 3 Quiz 2 — Q16–Q30</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amber:#92400e;--amberbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.progress-shell{height:9px;background:#e6edf7;border-radius:999px;overflow:hidden;margin:20px 0 7px}.progress{height:100%;background:var(--blue);transition:.25s}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.q{font-size:21px;font-weight:750;line-height:1.45;margin-bottom:18px}.option{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;cursor:pointer;background:#fff}
.option:hover{border-color:#9db6ea;background:#f8fbff}.option.correct{border-color:var(--green);background:var(--greenbg);color:#14532d;font-weight:650}.option.wrong{border-color:var(--red);background:var(--redbg);color:#7f1d1d;font-weight:650}
.option input{margin-right:10px;transform:scale(1.15)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}
.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fca5a5;color:#7f1d1d}
.explain{margin-top:10px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;border-radius:7px;color:#273449}.pearl{margin-top:10px;background:var(--amberbg);color:var(--amber);padding:11px;border-radius:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#e2e8f0;color:#1e293b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:24px}
.wrongitem{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.good{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:14px;margin-top:14px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quizcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.quizcard h2{margin:0 0 7px;font-size:19px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr}.q{font-size:18px}}
</style></head>
<body><div class="wrap">
<h1>Day 3 — Quiz 2</h1>
<div class="sub">Questions 16–30 · 15 MCQs · +4 correct / −1 wrong</div>
<div class="progress-shell"><div class="progress" id="progress" style="width:0%"></div></div>
<div class="topline"><span id="counter"></span><span id="score"></span><span id="counts"></span></div>
<div class="card" id="card"></div>
</div>
<script>
const quiz=[{"num": 16, "level": "Clinical", "question": "A term infant started empirically for EOS is well at 40 h. Blood culture is sterile and there is no focal infection. CRP was mildly elevated once. Best action?", "options": ["Continue 7 days", "Stop empiric antibiotics", "Add vancomycin", "Perform exchange transfusion"], "answer": 1, "explanation": "Sterile culture at 40 h, well infant and no focal infection support stopping empiric therapy despite one mildly abnormal CRP.", "pearl": "Clinical trajectory and microbiology outweigh isolated screening-test abnormalities.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 17, "level": "Clinical", "question": "A 9-day-old infant has fever, poor feeding and lethargy. Which investigation should now be included because this is LOS?", "options": ["Urine culture", "Gastric aspirate culture only", "Surface swabs only", "No cultures"], "answer": 0, "explanation": "Urine culture belongs in LOS evaluation.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 18, "level": "Clinical", "question": "A 12-day-old NICU infant with a central line develops recurrent apnea and thrombocytopenia. Most appropriate initial approach?", "options": ["Assume apnea of prematurity", "Evaluate for LOS including cultures and start empiric therapy based on local NICU flora", "Stop feeds only", "CRP alone"], "answer": 1, "explanation": "Central-line NICU infant with new apnea/thrombocytopenia should be evaluated for LOS/CLABSI.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 19, "level": "Clinical", "question": "A neonate has seizures, bulging fontanelle and bacteremia. Which test is essential once clinically stable?", "options": ["Sweat chloride", "Lumbar puncture", "Bone age", "Stool culture"], "answer": 1, "explanation": "Bacteremia plus neurologic signs requires assessment for meningitis with LP when safe.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 20, "level": "Clinical", "question": "A neonate has severe sepsis with poor perfusion. Blood culture can be obtained immediately, but LP would delay resuscitation. What should be done?", "options": ["Delay antibiotics until LP", "Obtain blood culture, start treatment and defer LP until stable", "Do neither culture nor antibiotics", "Wait 24 h"], "answer": 1, "explanation": "Do not delay life-saving treatment for LP in an unstable infant.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 21, "level": "Clinical", "question": "A 28-week infant has WBC 7,000/µL, normal platelets and a normal CRP 2 h after new apnea. Which conclusion is correct?", "options": ["Sepsis is excluded", "Early normal labs do not exclude sepsis; clinical context and cultures matter", "The infant has proven viral infection", "Antibiotics are contraindicated"], "answer": 1, "explanation": "Early normal CBC/CRP cannot exclude sepsis.", "pearl": "Clinical trajectory and microbiology outweigh isolated screening-test abnormalities.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 22, "level": "Clinical", "question": "A 3-day-old infant has a positive blood culture for GBS and irritability. What additional concern must be addressed?", "options": ["Meningitis", "Rickets", "Celiac disease", "Nephrotic syndrome"], "answer": 0, "explanation": "GBS bacteremia can coexist with meningitis, changing duration and follow-up.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 23, "level": "Clinical", "question": "A neonate with suspected EOS has a blood culture drawn with only 0.1 mL. Why is this problematic?", "options": ["Small volume may reduce sensitivity for low-level bacteremia", "It increases sensitivity", "It causes false-positive CRP", "It prevents Gram stain"], "answer": 0, "explanation": "Very small culture volume reduces sensitivity for low-level bacteremia.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 24, "level": "Clinical", "question": "A clinically well infant has sterile cultures at 48 h but persistent baseline oxygen need from established RDS. Best antibiotic decision?", "options": ["Continue antibiotics because oxygen is still required", "Stop antibiotics if no focal infection/other evidence supports sepsis", "Add antifungal therapy", "Treat 14 days"], "answer": 1, "explanation": "Baseline RDS instability alone does not justify prolonged empiric antibiotics with sterile cultures.", "pearl": "Clinical trajectory and microbiology outweigh isolated screening-test abnormalities.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 25, "level": "Clinical", "question": "A 14-day-old infant with a PICC has two concordant blood cultures positive for S. aureus. Best interpretation?", "options": ["Always contamination", "Treat as true bacteremia and evaluate source/device", "Ignore if CRP is low", "Repeat in one week without therapy"], "answer": 1, "explanation": "Repeated/concordant S. aureus bacteremia is clinically significant; evaluate device/source.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 26, "level": "Clinical", "question": "A neonate with E. coli meningitis remains clinically unwell after several days. What is the best next principle?", "options": ["Assume normal slow recovery", "Reassess CSF sterilization, susceptibility and complications", "Stop antibiotics immediately", "Switch to oral amoxicillin without review"], "answer": 1, "explanation": "Persistent illness in Gram-negative meningitis requires reassessment for sterilization, resistance and complications.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 27, "level": "Clinical", "question": "A newborn has hypothermia, lethargy, glucose 38 mg/dL and poor perfusion. Which statement is best?", "options": ["Absence of fever rules out sepsis", "Neonatal sepsis may present with hypothermia and metabolic instability", "Hypoglycemia proves an endocrine disorder", "No urgent evaluation is needed"], "answer": 1, "explanation": "Neonates may present with hypothermia and metabolic instability rather than fever.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 28, "level": "Clinical", "question": "A 5-day-old infant has respiratory distress and maternal chorioamnionitis history, but CXR now shows focal consolidation. What is the best interpretation?", "options": ["Focal pneumonia/site-specific infection can justify treatment despite culture uncertainty", "Culture-negative means no infection", "CRP is the only deciding test", "Antibiotics must stop at exactly 36 h regardless of focal disease"], "answer": 0, "explanation": "A focal pneumonia is site-specific infection; the 36–48 h stopping rule does not override clear focal disease.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 29, "level": "Clinical", "question": "A 20-day-old preterm infant on TPN and broad-spectrum antibiotics develops thrombocytopenia and worsening glucose instability. Bacterial cultures are negative. Which infection should be considered in the right NICU context?", "options": ["Invasive candidiasis", "Measles", "Pertussis only", "Rotavirus only"], "answer": 0, "explanation": "Prematurity, TPN and broad-spectrum antibiotics are classic invasive-candidiasis risk factors.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}, {"num": 30, "level": "Clinical", "question": "A neonate with suspected sepsis has prolonged capillary refill and rising lactate. The key implication is:", "options": ["Possible tissue hypoperfusion/shock", "Normal transition", "Isolated meningitis only", "No need for hemodynamic assessment"], "answer": 0, "explanation": "Poor perfusion plus lactate rise suggests shock/tissue hypoperfusion.", "pearl": "Identify the decision-changing clue rather than treating every abnormality as equally important.", "why": "This is a high-frequency stewardship/diagnostic reasoning principle."}];
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else next();}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day3_QuizSet2_Q16-30_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 3 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 16–30</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const msg=[`Total questions: ${quiz.length}`,`Attempted: ${attempted}`,`Score: ${score} / ${max}`,`Correct: ${correctCount}`,`Wrong: ${wrongCount}`,`Skipped (unanswered): ${skipped.size}`,`Not reached: ${quiz.length-attempted-skipped.size}`,`Percentage: ${pct}%`,`Time: ${duration()}`].join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 notifyResult(attempted,max,pct,early);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
}
render();
</script></body></html>
