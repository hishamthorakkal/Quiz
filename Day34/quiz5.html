<script>
const quiz=[{"num": 69, "level": "Conceptual", "question": "A toddler has bulky oily foul-smelling stools and failure to thrive. Which mechanism best explains steatorrhoea?", "options": ["Primary lactose intolerance alone", "Isolated excess dietary iron", "Functional abdominal pain alone", "Fat maldigestion or malabsorption"], "answer": 3, "explanation": "Steatorrhoea suggests impaired lipolysis, bile delivery or mucosal absorption. Why not the others: A. Primary lactose intolerance alone — Lactose intolerance causes osmotic diarrhoea, not typical steatorrhoea.; B. Isolated excess dietary iron — Iron does not typically cause oily stools.; C. Functional abdominal pain alone — Functional pain does not cause fat malabsorption.", "pearl": "", "srcAnswer": "C"}, {"num": 70, "level": "Clinical", "question": "An infant with recurrent chest infections, poor growth and greasy stools needs evaluation for which disease?", "options": ["Cystic fibrosis with exocrine pancreatic insufficiency", "Coeliac disease before gluten exposure", "Isolated cow’s-milk IgE sensitisation", "Functional constipation"], "answer": 0, "explanation": "Exocrine pancreatic insufficiency is a key cause of fat malabsorption in CF. Why not the others: B. Coeliac disease before gluten exposure — Coeliac requires gluten exposure and does not explain chronic suppurative lung disease.; C. Isolated cow’s-milk IgE sensitisation — This does not usually cause this combined phenotype.; D. Functional constipation — This does not explain greasy stools and recurrent lung disease.", "pearl": "", "srcAnswer": "A"}, {"num": 71, "level": "Integrated", "question": "A child develops acidic watery stools, bloating and perianal excoriation after viral gastroenteritis; symptoms worsen with lactose. Most likely mechanism?", "options": ["Pancreatic lipase deficiency", "Inflammatory colitis with blood loss", "Bile-duct obstruction", "Secondary lactase deficiency causing osmotic diarrhoea"], "answer": 3, "explanation": "Brush-border lactase deficiency can follow mucosal injury. Why not the others: A. Pancreatic lipase deficiency — This causes fat malabsorption/steatorrhoea.; B. Inflammatory colitis with blood loss — No blood or inflammatory alarm is described.; C. Bile-duct obstruction — This produces cholestatic features rather than isolated lactose symptoms.", "pearl": "", "srcAnswer": "D"}, {"num": 72, "level": "", "question": "A preterm infant has zone II stage 2 ROP with definite plus disease. What is the ETROP classification?", "options": ["Type 2 ROP suitable for routine distant review", "Mature retina needing no follow-up", "Type 1 ROP needing prompt treatment evaluation", "Stage 4 retinal detachment"], "answer": 2, "explanation": "Zone II stage 2 with plus is ETROP Type 1. Why not the others: A. Type 2 ROP suitable for routine distant review — Plus disease makes this Type 1.; B. Mature retina needing no follow-up — Active ROP is present.; D. Stage 4 retinal detachment — Stage 2 is ridge, not retinal detachment.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R2", "from": "Day 11 Q25 — ETROP Type 1 ROP"}}, {"num": 73, "level": "Clinical", "question": "Which feature best differentiates osmotic from secretory diarrhoea?", "options": ["Osmotic diarrhoea is always bloody", "Osmotic diarrhoea usually improves with fasting", "Secretory diarrhoea always stops during fasting", "Secretory diarrhoea always produces steatorrhoea"], "answer": 1, "explanation": "Osmotically active unabsorbed solutes disappear when intake is stopped. Why not the others: A. Osmotic diarrhoea is always bloody — Blood suggests inflammatory injury.; C. Secretory diarrhoea always stops during fasting — Secretory losses tend to persist.; D. Secretory diarrhoea always produces steatorrhoea — Fat loss is not universal.", "pearl": "", "srcAnswer": "A"}, {"num": 74, "level": "High", "question": "Stool Na is 35 mmol/L and K is 25 mmol/L. Using 290 − 2(Na+K), what is the stool osmotic gap?", "options": ["110 mOsm/kg", "230 mOsm/kg", "50 mOsm/kg", "170 mOsm/kg"], "answer": 3, "explanation": "290 − 2(35+25) = 170; a high gap suggests osmotic diarrhoea. Why not the others: A. 110 mOsm/kg — It underestimates the gap for these values.; B. 230 mOsm/kg — It does not subtract twice the summed electrolytes.; C. 50 mOsm/kg — That is not the result of the stated formula.", "pearl": "", "srcAnswer": "C"}, {"num": 75, "level": "Conceptual", "question": "A 3-year-old has diarrhoea that persists during fasting and stool osmotic gap 25 mOsm/kg. Which mechanism is favoured?", "options": ["Secretory diarrhoea", "Functional constipation", "Osmotic lactose malabsorption", "Pancreatic fat maldigestion"], "answer": 0, "explanation": "Low osmotic gap and persistence during fasting support secretory losses. Why not the others: B. Functional constipation — It does not cause persistent high-volume watery stool.; C. Osmotic lactose malabsorption — High gap and fasting improvement would be more typical.; D. Pancreatic fat maldigestion — This more often causes greasy stools.", "pearl": "", "srcAnswer": "D"}, {"num": 76, "level": "Clinical", "question": "An infant with persistent watery diarrhoea from the first days of life has severe electrolyte losses even while fasting. Which category merits urgent specialist evaluation?", "options": ["Isolated dietary fibre excess", "Typical postinfectious lactose intolerance", "Congenital secretory diarrhoea or enteropathy", "Functional toddler’s diarrhoea"], "answer": 2, "explanation": "Neonatal onset with fasting persistence suggests congenital transport/epithelial disease. Why not the others: A. Isolated dietary fibre excess — The neonatal onset and fasting persistence are incompatible.; B. Typical postinfectious lactose intolerance — Symptoms started before infection and persist during fasting.; D. Functional toddler’s diarrhoea — This does not cause neonatal severe dehydration.", "pearl": "", "srcAnswer": "C"}, {"num": 77, "level": "Integrated", "question": "A child has chronic diarrhoea, iron deficiency and poor growth but no visible blood. Which diagnosis remains important?", "options": ["Coeliac disease", "Simple constipation alone", "Functional pain is certain because stool is not bloody", "Acute appendicitis for 2 years"], "answer": 0, "explanation": "Coeliac can present with extraintestinal nutritional deficiency. Why not the others: B. Simple constipation alone — Constipation does not explain malabsorptive anaemia and growth failure.; C. Functional pain is certain because stool is not bloody — Malabsorption may occur without bleeding.; D. Acute appendicitis for 2 years — This does not fit chronic nutritional deficiency.", "pearl": "", "srcAnswer": "C"}, {"num": 78, "level": "Clinical", "question": "A child with obstructive cholestasis develops steatorrhoea. Which physiological step is most impaired?", "options": ["Bile-acid-dependent micelle formation", "Colonic chloride secretion alone", "Gastric intrinsic factor secretion", "Salivary amylase secretion"], "answer": 0, "explanation": "Bile salts facilitate intestinal lipid solubilization and absorption. Why not the others: B. Colonic chloride secretion alone — This does not explain impaired fat micelles.; C. Gastric intrinsic factor secretion — Intrinsic factor is for vitamin B12 absorption.; D. Salivary amylase secretion — Amylase digests starch, not fats.", "pearl": "", "srcAnswer": "D"}, {"num": 79, "level": "High", "question": "A child with terminal ileal resection develops B12 deficiency and bile salt diarrhoea. Which site normally absorbs the intrinsic-factor–B12 complex?", "options": ["Proximal jejunum", "Terminal ileum", "Stomach", "Ascending colon"], "answer": 1, "explanation": "The terminal ileum absorbs the IF–B12 complex and recycles bile acids. Why not the others: A. Proximal jejunum — Jejunum absorbs many nutrients but not IF–B12 specifically.; C. Stomach — Intrinsic factor is produced there, but complex absorption occurs in ileum.; D. Ascending colon — The colon is not the primary IF–B12 absorption site.", "pearl": "", "srcAnswer": "C"}, {"num": 80, "level": "", "question": "A hyperammonaemic infant has very low citrulline and high urinary orotic acid. Which urea-cycle defect is most likely?", "options": ["NAGS deficiency", "Argininosuccinate lyase deficiency", "Ornithine transcarbamylase deficiency", "CPS1 deficiency"], "answer": 2, "explanation": "Excess carbamoyl phosphate in OTC deficiency drives orotic acid production. Why not the others: A. NAGS deficiency — Typically low citrulline with low/normal orotic acid.; B. Argininosuccinate lyase deficiency — Usually elevates argininosuccinate and does not show this low-citrulline pattern.; D. CPS1 deficiency — Orotic acid is usually low/normal in CPS1 deficiency.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R3", "from": "Day 10 Q65 — OTC versus CPS1/NAGS — urinary orotic acid"}}, {"num": 81, "level": "Basic", "question": "Which vitamin deficiency is particularly associated with prolonged fat malabsorption?", "options": ["Vitamin B1 deficiency exclusively", "Vitamin K deficiency with coagulopathy", "Vitamin C deficiency exclusively", "Folate deficiency exclusively"], "answer": 1, "explanation": "Fat-soluble vitamins A, D, E and K may be deficient in steatorrhoea. Why not the others: A. Vitamin B1 deficiency exclusively — Thiamine is water soluble.; C. Vitamin C deficiency exclusively — Vitamin C is water soluble.; D. Folate deficiency exclusively — Folate is water soluble and absorbed proximally.", "pearl": "", "srcAnswer": "C"}, {"num": 82, "level": "Clinical", "question": "A child has normal appetite but poor weight gain, greasy stools and low faecal elastase. Which process is implicated?", "options": ["Lactose malabsorption alone", "Exocrine pancreatic insufficiency", "Primary growth hormone deficiency alone", "Functional dyspepsia alone"], "answer": 1, "explanation": "Low faecal elastase supports reduced pancreatic exocrine output, though watery stool can falsely lower it. Why not the others: A. Lactose malabsorption alone — Lactase deficiency does not reduce pancreatic elastase.; C. Primary growth hormone deficiency alone — This does not explain steatorrhoea and low elastase.; D. Functional dyspepsia alone — Functional dyspepsia does not cause low pancreatic elastase.", "pearl": "", "srcAnswer": "B"}, {"num": 83, "level": "High", "question": "An infant has watery stool that becomes acidic after a lactose-containing feed and improves on lactose reduction. Which test finding supports carbohydrate malabsorption?", "options": ["Positive stool reducing substances with low stool pH", "High stool fat alone", "High faecal calprotectin alone", "Positive occult blood alone"], "answer": 0, "explanation": "Unabsorbed sugars undergo bacterial fermentation to organic acids. Why not the others: B. High stool fat alone — That points toward lipid malabsorption.; C. High faecal calprotectin alone — This indicates inflammation, not specifically carbohydrate malabsorption.; D. Positive occult blood alone — Blood is not a carbohydrate-specific marker.", "pearl": "", "srcAnswer": "B"}, {"num": 84, "level": "Conceptual", "question": "A child has severe diarrhoea and weight loss after extensive small-bowel resection. Which condition is most likely?", "options": ["Simple isolated lactose intolerance", "Primary milk allergy by definition", "Short bowel syndrome with reduced absorptive surface", "Functional IBS alone"], "answer": 2, "explanation": "Loss of intestinal length reduces nutrient, fluid and electrolyte absorption. Why not the others: A. Simple isolated lactose intolerance — Extensive resection causes broader deficits.; B. Primary milk allergy by definition — Resection does not establish immune allergy.; D. Functional IBS alone — Anatomic loss explains nutrient and fluid malabsorption.", "pearl": "", "srcAnswer": "D"}, {"num": 85, "level": "Clinical", "question": "A child with Crohn ileitis has poor weight gain and fat-soluble vitamin deficiency. What combined mechanism may contribute?", "options": ["Pure colonic functional pain", "Only behavioural food refusal in every case", "Normal intestinal absorption despite ileitis", "Small-bowel inflammation and impaired bile-acid handling"], "answer": 3, "explanation": "Ileal disease can impair bile-acid recycling and absorption while intake may also be reduced. Why not the others: A. Pure colonic functional pain — Ileal inflammation can cause malabsorption.; B. Only behavioural food refusal in every case — Organic disease may impair absorption.; C. Normal intestinal absorption despite ileitis — Inflammation can reduce nutrient uptake.", "pearl": "", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day34',label:'Day 34',set:'Quiz 5',href:'Day34/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day34_QuizSet5_Q69-85_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 34 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 69–85</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 34 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 34'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 34');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day34:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
