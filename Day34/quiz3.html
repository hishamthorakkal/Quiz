<title>Day 34 Quiz 3 — Q35–Q51</title><style>:root{color-scheme:only light}

@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 35, "level": "Clinical", "question": "A 13-year-old has bloody diarrhoea, weight loss and raised calprotectin. Which work-up best establishes paediatric IBD phenotype?", "options": ["Trial of steroids before infection exclusion", "Abdominal radiograph alone", "Upper endoscopy and ileocolonoscopy with biopsies, with appropriate small-bowel assessment", "Calprotectin alone"], "answer": 2, "explanation": "Porto criteria combine endoscopy, histology, labs and small-bowel assessment. Why not the others: A. Trial of steroids before infection exclusion — Steroids may mask infection and complicate diagnosis.; B. Abdominal radiograph alone — Plain imaging cannot define mucosal histology.; D. Calprotectin alone — A biomarker is not a complete diagnosis or phenotype.", "pearl": "", "srcAnswer": "C"}, {"num": 36, "level": "Integrated", "question": "Which colonoscopic pattern is most characteristic of typical ulcerative colitis?", "options": ["Isolated perianal fistulae", "Normal rectum with isolated jejunal disease", "Skip lesions with deep ileal ulcers", "Continuous mucosal inflammation extending proximally from rectum"], "answer": 3, "explanation": "Typical UC has continuous rectal-to-proximal colitis. Why not the others: A. Isolated perianal fistulae — Fistulae are more typical of Crohn disease.; B. Normal rectum with isolated jejunal disease — This is not typical UC.; C. Skip lesions with deep ileal ulcers — These favour Crohn disease.", "pearl": "", "srcAnswer": "A"}, {"num": 37, "level": "Clinical", "question": "A teenager has oral aphthae, perianal fistula and terminal ileal ulcers. Which phenotype is most likely?", "options": ["Crohn disease", "Isolated lactose intolerance", "Typical ulcerative proctitis", "Functional abdominal pain"], "answer": 0, "explanation": "Transmural, skip and perianal features favour Crohn disease. Why not the others: B. Isolated lactose intolerance — Lactase deficiency does not cause fistulae.; C. Typical ulcerative proctitis — Perianal fistula and ileal ulcers favour Crohn disease.; D. Functional abdominal pain — Objective ulcers and fistula exclude a purely functional diagnosis.", "pearl": "", "srcAnswer": "D"}, {"num": 38, "level": "High", "question": "A child with suspected IBD has stool culture positive for an invasive pathogen. Which principle is correct?", "options": ["Assume faecal calprotectin excludes infection", "Label all bloody stools UC immediately", "Assess and treat infection before assigning a definitive IBD flare diagnosis", "Give immunosuppression without infection assessment"], "answer": 2, "explanation": "Porto work-up requires exclusion of enteric infection. Why not the others: A. Assume faecal calprotectin excludes infection — Calprotectin can rise in infectious colitis.; B. Label all bloody stools UC immediately — Infection can mimic inflammatory colitis.; D. Give immunosuppression without infection assessment — This can worsen infection.", "pearl": "", "srcAnswer": "D"}, {"num": 39, "level": "Conceptual", "question": "A newly diagnosed low-risk child with active luminal Crohn disease prefers nutrition-based induction. What does the 2026 ECCO–ESPGHAN update support?", "options": ["Long-term steroids as maintenance", "Exclusive enteral nutrition as a preferred first-line induction option", "Antibiotics alone for all luminal disease", "Immediate colectomy for all children"], "answer": 1, "explanation": "EEN or Crohn disease exclusion diet plus partial EN are preferred low-risk nutritional induction strategies. Why not the others: A. Long-term steroids as maintenance — Corticosteroids are not appropriate maintenance treatment.; C. Antibiotics alone for all luminal disease — Antibiotics are not routine definitive induction for uncomplicated luminal Crohn disease.; D. Immediate colectomy for all children — Surgery is not first-line for low-risk luminal disease.", "pearl": "", "srcAnswer": "C"}, {"num": 40, "level": "", "question": "A ventilated neonate suddenly desaturates and the breathing circuit is visibly disconnected. In DOPE troubleshooting, what is the immediate category?", "options": ["Equipment failure", "Obstruction of ETT", "Displacement of ETT", "Pneumothorax"], "answer": 0, "explanation": "The E in DOPE denotes equipment, including circuit disconnection. Why not the others: B. Obstruction of ETT — There is no evidence of tube blockage.; C. Displacement of ETT — The described problem is in the circuit, not tube position.; D. Pneumothorax — A mechanical disconnection is directly visible.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R3", "from": "Day 5 Q34 — DOPE equipment disconnection"}}, {"num": 41, "level": "Clinical", "question": "A child has deep ulcers, perianal fistula and marked growth delay at Crohn diagnosis. According to the 2026 guideline, which strategy is favoured?", "options": ["Wait years before escalating therapy", "Early anti-TNF therapy for high-risk disease", "Dietary reassurance alone", "Use corticosteroids indefinitely as maintenance"], "answer": 1, "explanation": "High-risk paediatric Crohn disease warrants early biologic therapy and monitoring. Why not the others: A. Wait years before escalating therapy — Delay can worsen growth and bowel damage.; C. Dietary reassurance alone — High-risk phenotype requires active disease control.; D. Use corticosteroids indefinitely as maintenance — Chronic steroid toxicity and poor maintenance efficacy are major concerns.", "pearl": "", "srcAnswer": "A"}, {"num": 42, "level": "Integrated", "question": "A child with UC has PUCAI 70. What is the correct clinical classification?", "options": ["Acute severe colitis requiring urgent inpatient assessment", "Clinical remission", "Isolated functional pain", "Mild UC"], "answer": 0, "explanation": "PUCAI ≥65 defines acute severe colitis in paediatric UC. Why not the others: B. Clinical remission — PUCAI 70 is far above remission range.; C. Isolated functional pain — PUCAI reflects inflammatory colitis activity.; D. Mild UC — Severe threshold is ≥65.", "pearl": "", "srcAnswer": "B"}, {"num": 43, "level": "Clinical", "question": "A hospitalized child with acute severe UC remains PUCAI 70 on day 5 of IV steroids. What is indicated?", "options": ["Replace all therapy with oral ORS alone", "Discharge on no treatment", "Escalation to rescue therapy assessment, commonly infliximab, with surgical team involvement", "Continue IV steroids indefinitely without reassessment"], "answer": 2, "explanation": "2025 UC guidance emphasizes timely rescue treatment when day-5 severe activity persists. Why not the others: A. Replace all therapy with oral ORS alone — Rehydration does not control severe colitis.; B. Discharge on no treatment — Persistent severe activity is unsafe.; D. Continue IV steroids indefinitely without reassessment — Nonresponse by day 5 requires escalation.", "pearl": "", "srcAnswer": "A"}, {"num": 44, "level": "High", "question": "A child with Crohn disease improves symptomatically but faecal calprotectin remains high and growth is poor. Best long-term treatment target?", "options": ["No follow-up if pain resolves", "Persistent steroid use regardless of response", "Weight gain alone without inflammatory assessment", "Objective mucosal remission and normal growth, not symptoms alone"], "answer": 3, "explanation": "Treat-to-target integrates clinical, biochemical, endoscopic and growth outcomes. Why not the others: A. No follow-up if pain resolves — Symptoms can underestimate inflammation.; B. Persistent steroid use regardless of response — Steroids are not maintenance targets.; C. Weight gain alone without inflammatory assessment — Growth is necessary but not sufficient.", "pearl": "", "srcAnswer": "A"}, {"num": 45, "level": "Basic", "question": "An adolescent has elevated faecal calprotectin. Which interpretation is most accurate?", "options": ["It supports intestinal inflammation but is not specific for IBD", "It definitively diagnoses Crohn disease", "It distinguishes UC from Crohn with certainty", "A normal CRP makes it meaningless"], "answer": 0, "explanation": "Use calprotectin as a marker within clinical, infectious and endoscopic evaluation. Why not the others: B. It definitively diagnoses Crohn disease — Infection and other inflammation also elevate it.; C. It distinguishes UC from Crohn with certainty — Calprotectin cannot reliably classify subtype.; D. A normal CRP makes it meaningless — CRP may be normal despite intestinal inflammation.", "pearl": "", "srcAnswer": "C"}, {"num": 46, "level": "Clinical", "question": "Which histological feature, when genuine and away from crypt injury, most supports Crohn over typical UC?", "options": ["Isolated villous atrophy", "Noncaseating epithelioid granulomas", "Normal mucosal architecture", "Diffuse continuous cryptitis alone"], "answer": 1, "explanation": "Granulomas support Crohn when infection and crypt-rupture granulomas are excluded. Why not the others: A. Isolated villous atrophy — This is not specific for Crohn and raises other causes.; C. Normal mucosal architecture — Normal tissue does not establish Crohn.; D. Diffuse continuous cryptitis alone — Continuous colitis is more typical of UC.", "pearl": "", "srcAnswer": "D"}, {"num": 47, "level": "High", "question": "A child has colitis that cannot be confidently assigned to UC or Crohn after full investigation. Which term is appropriate?", "options": ["IBD-unclassified (IBD-U)", "Functional diarrhoea by default", "Crohn disease based solely on age", "Coeliac disease without serology"], "answer": 0, "explanation": "IBD-U is reserved for genuine uncertainty after complete phenotyping. Why not the others: B. Functional diarrhoea by default — Objective chronic inflammation has been demonstrated.; C. Crohn disease based solely on age — Age alone does not classify IBD.; D. Coeliac disease without serology — IBD-U is a distinct classification.", "pearl": "", "srcAnswer": "B"}, {"num": 48, "level": "", "question": "A jaundiced neonate has marked unconjugated bilirubin, a negative DAT and modest anaemia. Which condition must remain in the differential?", "options": ["Immune Rh haemolysis alone", "Physiological jaundice always", "Biliary atresia", "G6PD deficiency"], "answer": 3, "explanation": "G6PD-related haemolysis can be DAT-negative and anaemia may be modest. Why not the others: A. Immune Rh haemolysis alone — DAT may be positive and maternal/infant blood-group history is relevant.; B. Physiological jaundice always — Severe bilirubin requires evaluation for pathological causes.; C. Biliary atresia — Usually causes conjugated hyperbilirubinaemia.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R3", "from": "Day 6 Q60 — G6PD neonatal unconjugated jaundice with DAT-negative hemolysis"}}, {"num": 49, "level": "Conceptual", "question": "A teenager on anti-TNF therapy loses response with low trough level and anti-drug antibodies. Which next concept is relevant?", "options": ["Stop all monitoring once an infusion was given", "Therapeutic drug monitoring to guide dose optimization or switching", "Use calprotectin alone to measure drug exposure", "Assume every loss of response is functional pain"], "answer": 1, "explanation": "The 2026 Crohn update incorporates proactive and reactive drug monitoring. Why not the others: A. Stop all monitoring once an infusion was given — Loss of response needs reassessment.; C. Use calprotectin alone to measure drug exposure — Calprotectin measures inflammation, not trough concentration.; D. Assume every loss of response is functional pain — Objective markers and drug levels should be evaluated.", "pearl": "", "srcAnswer": "D"}, {"num": 50, "level": "High", "question": "A child with suspected Crohn has a normal colonoscopy but growth failure and persistent inflammatory markers. Which next investigation may identify proximal small-bowel disease?", "options": ["MR enterography or other appropriate small-bowel imaging", "Repeat stool occult blood only", "Electrocardiography", "Chest radiograph"], "answer": 0, "explanation": "Porto criteria recommend small-bowel evaluation, especially when Crohn is suspected. Why not the others: B. Repeat stool occult blood only — It does not image small bowel.; C. Electrocardiography — It does not investigate small-bowel Crohn disease.; D. Chest radiograph — It does not assess bowel inflammation.", "pearl": "", "srcAnswer": "C"}, {"num": 51, "level": "Basic", "question": "An adolescent with newly diagnosed UC asks whether normal stool frequency guarantees remission. Which response is best?", "options": ["Only serum sodium predicts relapse", "Clinical improvement should be corroborated by objective inflammation monitoring", "No monitoring is needed until adulthood", "Yes, stool frequency alone proves mucosal healing"], "answer": 1, "explanation": "Treat-to-target uses clinical and objective measures, not symptoms alone. Why not the others: A. Only serum sodium predicts relapse — Sodium is not a specific UC activity biomarker.; C. No monitoring is needed until adulthood — Paediatric IBD needs ongoing assessment.; D. Yes, stool frequency alone proves mucosal healing — Inflammation can persist despite symptoms improving.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day34',label:'Day 34',set:'Quiz 3',href:'Day34/quiz3.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day34_QuizSet3_Q35-51_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 34 Quiz 3 — Wrong Answer Report</h1><p><b>Questions:</b> 35–51</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 34 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 34'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 34');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day34:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['3']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['3']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 3 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
