@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 18, "level": "High", "question": "A well infant has streaks of blood and mucus in stool but normal growth and no systemic illness. Which non-IgE phenotype is most compatible?", "options": ["Coeliac disease at 2 months", "Pyloric stenosis", "Food protein-induced allergic proctocolitis (FPIAP)", "Classic IgE anaphylaxis"], "answer": 2, "explanation": "FPIAP often presents with blood-streaked stool in an otherwise well infant. Why not the others: A. Coeliac disease at 2 months — Coeliac requires gluten exposure and is unusual in early infancy.; B. Pyloric stenosis — Pyloric stenosis causes progressive nonbilious vomiting, not isolated blood streaks.; D. Classic IgE anaphylaxis — There is no immediate multisystem reaction.", "pearl": "", "srcAnswer": "A"}, {"num": 19, "level": "Conceptual", "question": "A 4-month-old has repetitive vomiting 2 hours after milk ingestion, pallor and lethargy without urticaria. Which diagnosis is most likely?", "options": ["Uncomplicated physiological reflux", "Immediate IgE-mediated urticaria", "Acute food protein-induced enterocolitis syndrome (FPIES)", "Functional constipation"], "answer": 2, "explanation": "Delayed repetitive vomiting and systemic symptoms suggest FPIES. Why not the others: A. Uncomplicated physiological reflux — Repetitive vomiting with lethargy is not benign reflux.; B. Immediate IgE-mediated urticaria — FPIES usually lacks typical skin/respiratory IgE features.; D. Functional constipation — Constipation does not explain acute delayed vomiting and pallor.", "pearl": "", "srcAnswer": "D"}, {"num": 20, "level": "Clinical", "question": "A thriving infant with isolated colic is labelled milk allergic and placed on indefinite avoidance. Which diagnostic principle is most important?", "options": ["Use total serum IgE as a definitive test", "Continue elimination for life without challenge", "Positive family atopy alone proves allergy", "Avoid overdiagnosis; confirm clinically relevant symptoms by time-limited elimination and reintroduction"], "answer": 3, "explanation": "DRACMA emphasizes elimination followed by reintroduction to establish causality. Why not the others: A. Use total serum IgE as a definitive test — Total IgE cannot establish milk allergy.; B. Continue elimination for life without challenge — Unconfirmed avoidance has nutritional and social harms.; C. Positive family atopy alone proves allergy — Family history is not diagnostic.", "pearl": "", "srcAnswer": "D"}, {"num": 21, "level": "Integrated", "question": "For suspected mild non-IgE cow’s-milk allergy, what is the usual diagnostic elimination interval before reintroduction?", "options": ["Exactly 24 hours", "At least 12 months before any reintroduction", "Approximately 2–4 weeks", "Only 30 minutes"], "answer": 2, "explanation": "WAO DRACMA suggests 2–4 weeks for diagnostic elimination in non-IgE CMA. Why not the others: A. Exactly 24 hours — Delayed symptoms may require longer to resolve.; B. At least 12 months before any reintroduction — That confuses diagnosis with later therapeutic avoidance.; D. Only 30 minutes — That may assess immediate symptoms, not delayed non-IgE disease.", "pearl": "", "srcAnswer": "D"}, {"num": 22, "level": "Clinical", "question": "A child had immediate wheeze and hypotension after milk. Where should diagnostic re-exposure, if clinically appropriate, occur?", "options": ["During school lunch without observation", "Through prolonged empirical elimination without assessment", "Under specialist-supervised oral food challenge with emergency capability", "At home using a milk ladder"], "answer": 2, "explanation": "IgE-mediated severe reactions require risk-stratified supervised challenge, not unsupervised home exposure. Why not the others: A. During school lunch without observation — This is unsafe after severe immediate reactions.; B. Through prolonged empirical elimination without assessment — The need and timing of challenge require specialist judgment.; D. At home using a milk ladder — High-risk immediate reactions require supervision.", "pearl": "", "srcAnswer": "A"}, {"num": 23, "level": "High", "question": "A mother breastfeeding an infant with suspected non-IgE milk allergy is asked to eliminate dairy. Which additional step is essential?", "options": ["Assume symptoms prove milk allergy without reintroduction", "Avoid all grains indefinitely", "Stop breastfeeding immediately", "Plan time-limited diagnostic reintroduction and protect maternal calcium/nutrition"], "answer": 3, "explanation": "Diagnostic maternal elimination must be purposeful, time-limited and nutritionally supported. Why not the others: A. Assume symptoms prove milk allergy without reintroduction — Symptom fluctuation can mislead.; B. Avoid all grains indefinitely — Broad restrictions are not indicated.; C. Stop breastfeeding immediately — Breastfeeding can usually continue.", "pearl": "", "srcAnswer": "B"}, {"num": 24, "level": "", "question": "A child has fasting-triggered hypoketotic hypoglycaemia and newborn-screen acylcarnitine elevation dominated by C8. Most likely disorder?", "options": ["Propionic acidemia", "MSUD", "VLCAD deficiency", "MCAD deficiency"], "answer": 3, "explanation": "C8 is the classic acylcarnitine clue for MCAD. Why not the others: A. Propionic acidemia — C3 propionylcarnitine is more typical.; B. MSUD — Alloisoleucine and branched-chain amino acids are characteristic.; C. VLCAD deficiency — Often shows elevated C14:1.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 15 Q77 — MCAD deficiency — C8 acylcarnitine"}}, {"num": 25, "level": "Conceptual", "question": "An infant with confirmed cow’s-milk allergy needs formula and tolerates extensively hydrolysed formula. Best routine approach?", "options": ["Use ordinary cow’s-milk formula", "Use lactose-free intact cow’s-milk formula", "Use extensively hydrolysed formula as a suitable therapeutic option", "Use unmodified goat milk"], "answer": 2, "explanation": "Extensively hydrolysed formula is commonly appropriate; severe reactions may need amino-acid formula. Why not the others: A. Use ordinary cow’s-milk formula — Intact milk proteins can trigger symptoms.; B. Use lactose-free intact cow’s-milk formula — Removing lactose does not remove allergenic milk proteins.; D. Use unmodified goat milk — Cross-reactivity and nutritional inadequacy are concerns.", "pearl": "", "srcAnswer": "D"}, {"num": 26, "level": "Clinical", "question": "A severely affected infant continues reacting to extensively hydrolysed formula with growth faltering. Which alternative is appropriate after specialist assessment?", "options": ["Lactose-free intact cow milk", "Goat milk formula", "Amino-acid-based formula", "Diluted standard formula"], "answer": 2, "explanation": "Amino-acid formula can be needed for severe or eHF-refractory CMA. Why not the others: A. Lactose-free intact cow milk — Milk proteins remain intact.; B. Goat milk formula — Milk protein cross-reactivity can occur.; D. Diluted standard formula — Dilution worsens nutritional adequacy and retains allergen.", "pearl": "", "srcAnswer": "A"}, {"num": 27, "level": "Integrated", "question": "A toddler tolerates yoghurt but develops hives within minutes of fresh milk. Which mechanism should be considered?", "options": ["FPIAP alone", "IgE-mediated cow’s-milk allergy with variable tolerance to processed forms", "Lactase deficiency", "Coeliac disease"], "answer": 1, "explanation": "Immediate hives after exposure suggest IgE-mediated allergy; individual processing tolerance varies. Why not the others: A. FPIAP alone — FPIAP primarily causes delayed blood-streaked stools.; C. Lactase deficiency — Lactose intolerance causes GI symptoms, not immediate urticaria.; D. Coeliac disease — Coeliac disease is gluten-related, not milk-IgE related.", "pearl": "", "srcAnswer": "B"}, {"num": 28, "level": "Clinical", "question": "A 7-month-old with chronic diarrhoea improves after milk elimination. What establishes a causal non-IgE milk-allergy diagnosis more reliably than improvement alone?", "options": ["Elevated total IgE alone", "A family history of eczema", "Recurrence of compatible symptoms with appropriate reintroduction", "An abdominal radiograph"], "answer": 2, "explanation": "Elimination response alone is insufficient because symptoms often fluctuate. Why not the others: A. Elevated total IgE alone — Total IgE is nonspecific.; B. A family history of eczema — Atopy increases suspicion but does not prove causation.; D. An abdominal radiograph — Imaging is not a confirmatory allergy test.", "pearl": "", "srcAnswer": "A"}, {"num": 29, "level": "High", "question": "Why should a diagnostic milk ladder not automatically replace an oral food challenge after elimination?", "options": ["A ladder is not a validated substitute for diagnostic challenge in DRACMA", "The ladder is diagnostic for coeliac disease", "The ladder tests lactose intolerance exclusively", "The ladder is always safer after anaphylaxis"], "answer": 0, "explanation": "DRACMA distinguishes diagnostic challenge from later graded reintroduction strategies. Why not the others: B. The ladder is diagnostic for coeliac disease — Coeliac disease is gluten-related.; C. The ladder tests lactose intolerance exclusively — It changes protein processing/exposure, not just lactose.; D. The ladder is always safer after anaphylaxis — High-risk children require supervised assessment.", "pearl": "", "srcAnswer": "B"}, {"num": 30, "level": "Basic", "question": "An infant has diarrhoea, severe eczema and weight loss while on standard formula. Which first priority is appropriate?", "options": ["Assess nutritional status and arrange supervised elimination/formula plan with follow-up", "Ignore faltering growth if stools are frequent", "Prescribe multiple food exclusions without review", "Assume lactose intolerance is the sole cause"], "answer": 0, "explanation": "Faltering growth requires a structured assessment and nutrition-safe management. Why not the others: B. Ignore faltering growth if stools are frequent — Growth failure is an alarm sign.; C. Prescribe multiple food exclusions without review — Broad exclusion risks malnutrition.; D. Assume lactose intolerance is the sole cause — Severe eczema and systemic features require broader assessment.", "pearl": "", "srcAnswer": "C"}, {"num": 31, "level": "Clinical", "question": "Which presentation most strongly supports lactose malabsorption rather than immune cow’s-milk protein allergy?", "options": ["Delayed shock-like vomiting after milk", "Bloating and acidic watery stools after lactose, without eczema or blood", "Blood-streaked stools in a thriving young infant", "Immediate wheeze and hives after milk"], "answer": 1, "explanation": "Lactose malabsorption is carbohydrate intolerance, not milk-protein allergy. Why not the others: A. Delayed shock-like vomiting after milk — This is suggestive of FPIES.; C. Blood-streaked stools in a thriving young infant — This can suggest FPIAP.; D. Immediate wheeze and hives after milk — This is an IgE-type pattern.", "pearl": "", "srcAnswer": "B"}, {"num": 32, "level": "", "question": "A neonate has recurrent low glucose after 60 hours of life. Which timing distinction is correct?", "options": ["The values 48 and 72 refer to glucose mg/dL rather than hours", "CPS transitional period ends at 48 h and PES begins at 72 h", "PES evaluation for persistent hypoglycaemia begins after 48 h, whereas CPS transitional period extends through 72 h", "Both organisations use 24 h for the transition"], "answer": 2, "explanation": "Do not confuse the PES >48 h evaluation window with CPS <72 h transitional definition. Why not the others: A. The values 48 and 72 refer to glucose mg/dL rather than hours — They are time cutoffs.; B. CPS transitional period ends at 48 h and PES begins at 72 h — This reverses the two boundaries.; D. Both organisations use 24 h for the transition — These guidance time windows differ.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R2", "from": "Day 10 Q8 — CPS 72 h vs PES 48 h"}}, {"num": 33, "level": "High", "question": "A child with suspected milk allergy has a positive milk-specific IgE test but has never reacted clinically. Which statement is most accurate?", "options": ["Milk-specific IgE diagnoses non-IgE FPIAP", "Any positive IgE establishes anaphylaxis risk and clinical disease", "Sensitisation alone does not prove clinical allergy", "A negative skin test rules out all non-IgE disease"], "answer": 2, "explanation": "Interpret sensitisation with reaction history and supervised assessment. Why not the others: A. Milk-specific IgE diagnoses non-IgE FPIAP — Non-IgE disease cannot be confirmed by IgE alone.; B. Any positive IgE establishes anaphylaxis risk and clinical disease — Sensitisation and clinical reactivity differ.; D. A negative skin test rules out all non-IgE disease — Non-IgE phenotypes may have negative tests.", "pearl": "", "srcAnswer": "A"}, {"num": 34, "level": "Conceptual", "question": "After a diagnostic elimination period, a stable infant with suspected mild non-IgE CMA has no red flags. What is the main purpose of planned reintroduction?", "options": ["To measure serum calcium absorption", "To diagnose coeliac disease", "To induce immediate lifelong tolerance in one day", "To determine whether milk exposure reproduces symptoms and confirms the diagnosis"], "answer": 3, "explanation": "Reintroduction reduces unnecessary prolonged elimination and overdiagnosis. Why not the others: A. To measure serum calcium absorption — That is not the allergy confirmation goal.; B. To diagnose coeliac disease — Milk reintroduction does not test gluten autoimmunity.; C. To induce immediate lifelong tolerance in one day — Diagnostic reintroduction does not guarantee tolerance.", "pearl": "", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day34',label:'Day 34',set:'Quiz 2',href:'Day34/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day34_QuizSet2_Q18-34_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 34 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 18–34</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 34 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 34'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 34');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day34:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=267c69f6"></script></body></html>
