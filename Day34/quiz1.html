@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 1, "level": "Basic", "question": "A 9-year-old with growth faltering has continued eating wheat. Which first-line laboratory pair best evaluates possible coeliac disease?", "options": ["Stool reducing substances alone", "Anti-gliadin IgG alone", "Total serum IgA and tTG-IgA", "HLA-DQ2 typing alone"], "answer": 2, "explanation": "Check IgA sufficiency when interpreting IgA-based tTG. Why not the others: A. Stool reducing substances alone — This assesses carbohydrate malabsorption, not coeliac autoimmunity.; B. Anti-gliadin IgG alone — Older gliadin assays are not preferred initial screening.; D. HLA-DQ2 typing alone — Risk alleles are common and not diagnostic.", "pearl": "", "srcAnswer": "C"}, {"num": 2, "level": "Clinical", "question": "A child with normal total IgA has tTG-IgA 13× assay ULN. Which additional finding is required for the ESPGHAN 2020 no-biopsy pathway?", "options": ["Raised total IgE", "Iron deficiency alone", "HLA-DQ2 positivity alone", "Positive EMA-IgA on a second blood sample"], "answer": 3, "explanation": "The 10× ULN threshold and second-sample EMA are both required, with specialist agreement. Why not the others: A. Raised total IgE — IgE is unrelated to the coeliac no-biopsy criterion.; B. Iron deficiency alone — Symptoms or iron deficiency do not replace second-sample EMA.; C. HLA-DQ2 positivity alone — HLA testing is not obligatory in this pathway.", "pearl": "", "srcAnswer": "B"}, {"num": 3, "level": "High", "question": "A 7-year-old has tTG-IgA 6× ULN and normal total IgA while eating gluten. Best diagnostic next step?", "options": ["Rely on HLA-DQ2 alone", "Apply the 10× ULN no-biopsy pathway", "Start a gluten-free diet before confirmation", "Paediatric gastroenterology assessment for duodenal biopsies"], "answer": 3, "explanation": "For positive tTG-IgA <10× ULN, ESPGHAN recommends biopsies. Why not the others: A. Rely on HLA-DQ2 alone — HLA positivity is not diagnostic.; B. Apply the 10× ULN no-biopsy pathway — A 6× elevation is below its threshold.; C. Start a gluten-free diet before confirmation — Diet withdrawal can reduce test sensitivity.", "pearl": "", "srcAnswer": "C"}, {"num": 4, "level": "Conceptual", "question": "An IgA-deficient child has strong clinical suspicion of coeliac disease. Which change is most appropriate?", "options": ["Interpret negative tTG-IgA as exclusion", "Declare no-biopsy diagnosis from isolated IgG positivity", "Use an IgG-based coeliac serology pathway with specialist evaluation", "Use serum total IgE as the screening test"], "answer": 2, "explanation": "IgA deficiency requires IgG-based testing and generally histologic assessment if positive. Why not the others: A. Interpret negative tTG-IgA as exclusion — IgA deficiency makes an IgA assay unreliable.; B. Declare no-biopsy diagnosis from isolated IgG positivity — ESPGHAN no-biopsy pathway does not apply to IgA-deficient IgG-positive cases.; D. Use serum total IgE as the screening test — Total IgE is not a coeliac marker.", "pearl": "", "srcAnswer": "A"}, {"num": 5, "level": "Clinical", "question": "Which duodenal sampling strategy is recommended when biopsy is indicated in suspected paediatric coeliac disease?", "options": ["At least four distal duodenal samples and one duodenal bulb sample", "Only terminal ileal biopsies", "One random gastric biopsy only", "One distal duodenal biopsy only"], "answer": 0, "explanation": "Multiple samples including the bulb reduce missed patchy lesions. Why not the others: B. Only terminal ileal biopsies — The relevant mucosal lesion is duodenal.; C. One random gastric biopsy only — Gastric mucosa is not the target tissue.; D. One distal duodenal biopsy only — Patchy disease makes a single sample inadequate.", "pearl": "", "srcAnswer": "C"}, {"num": 6, "level": "Integrated", "question": "A child begins a gluten-free diet two months before diagnostic blood tests. What is the main concern?", "options": ["A new IgE-mediated wheat allergy", "False-negative or attenuated coeliac serology and histology", "Increased tTG-IgA sensitivity", "Immediate disappearance of HLA risk alleles"], "answer": 1, "explanation": "Document gluten exposure before interpreting negative testing. Why not the others: A. A new IgE-mediated wheat allergy — Avoidance alone does not establish wheat allergy.; C. Increased tTG-IgA sensitivity — Gluten avoidance generally lowers antibodies.; D. Immediate disappearance of HLA risk alleles — HLA genotype is unchanged by diet.", "pearl": "", "srcAnswer": "A"}, {"num": 7, "level": "Clinical", "question": "An asymptomatic sibling of a child with coeliac disease has tTG-IgA ≥10× ULN, normal total IgA and second-sample EMA positivity. Under ESPGHAN 2020, which statement is correct?", "options": ["Abdominal pain is mandatory", "Symptoms are not obligatory for the no-biopsy diagnostic pathway", "No-biopsy diagnosis is forbidden in asymptomatic children", "HLA-DQ2 is mandatory"], "answer": 1, "explanation": "ESPGHAN 2020 permits a no-biopsy pathway independent of symptom status. Why not the others: A. Abdominal pain is mandatory — ESPGHAN 2020 removed mandatory symptoms.; C. No-biopsy diagnosis is forbidden in asymptomatic children — ESPGHAN 2020 allows it when criteria are met.; D. HLA-DQ2 is mandatory — HLA is not obligatory for this pathway.", "pearl": "", "srcAnswer": "A"}, {"num": 8, "level": "", "question": "A 2-month-old has bilateral cataracts, elevated galactitol and no sepsis or severe hepatic dysfunction. Which defect is most compatible?", "options": ["Galactokinase (GALK1) deficiency", "Medium-chain acyl-CoA dehydrogenase deficiency", "Classic GALT deficiency", "Aldolase B deficiency"], "answer": 0, "explanation": "Isolated cataracts with galactitol accumulation favour GALK1 deficiency. Why not the others: B. Medium-chain acyl-CoA dehydrogenase deficiency — Causes hypoketotic hypoglycaemia, not isolated galactitol cataracts.; C. Classic GALT deficiency — Usually causes systemic hepatic illness, sepsis risk and failure to thrive.; D. Aldolase B deficiency — Symptoms occur after fructose, sucrose or sorbitol exposure.", "pearl": "", "srcAnswer": "B", "retest": {"stage": "R1", "from": "Day 15 Q61 — Galactokinase versus GALT versus hereditary fructose intolerance"}}, {"num": 9, "level": "High", "question": "A teenager with coeliac disease asks whether a positive HLA-DQ2 test alone confirms disease. Best response?", "options": ["No; it indicates susceptibility but has low positive predictive value", "Yes; HLA-DQ2 is diagnostic", "Yes, if haemoglobin is low", "Yes, if lactose intolerance coexists"], "answer": 0, "explanation": "HLA absence is useful to make disease unlikely; presence is not proof. Why not the others: B. Yes; HLA-DQ2 is diagnostic — Many healthy individuals carry DQ2.; C. Yes, if haemoglobin is low — Anaemia is nonspecific.; D. Yes, if lactose intolerance coexists — Lactase deficiency does not establish coeliac disease.", "pearl": "", "srcAnswer": "B"}, {"num": 10, "level": "Conceptual", "question": "A child has high tTG-IgA but second-sample EMA-IgA is negative. Which action best respects ESPGHAN 2020?", "options": ["Stop all evaluation if symptoms are mild", "Diagnose coeliac without further evaluation", "Use anti-tTG IgG instead without context", "Do not automatically apply no-biopsy diagnosis; investigate discordance"], "answer": 3, "explanation": "Discordant results warrant review of assay, gluten intake and histology decisions. Why not the others: A. Stop all evaluation if symptoms are mild — Discordance requires specialist interpretation.; B. Diagnose coeliac without further evaluation — The confirmatory EMA criterion is unmet.; C. Use anti-tTG IgG instead without context — Switching is not a substitute when total IgA is normal.", "pearl": "", "srcAnswer": "C"}, {"num": 11, "level": "Clinical", "question": "A child with established coeliac disease continues to have diarrhoea despite a reported gluten-free diet. Best first reassessment?", "options": ["Review inadvertent gluten exposure, adherence, growth and alternative causes", "Exclude disease because symptoms persist", "Give prolonged empirical corticosteroids", "Assume refractory coeliac disease immediately"], "answer": 0, "explanation": "Re-evaluate diagnosis and dietary exposure before rare refractory labels. Why not the others: B. Exclude disease because symptoms persist — Symptoms can persist from exposure or comorbidity.; C. Give prolonged empirical corticosteroids — Steroids are not routine first-line for persistent symptoms.; D. Assume refractory coeliac disease immediately — True refractory disease is uncommon in children.", "pearl": "", "srcAnswer": "B"}, {"num": 12, "level": "High", "question": "Which histologic pattern most supports active coeliac enteropathy in the correct clinical and serologic context?", "options": ["Full-thickness ileal granulomas", "Isolated colonic crypt abscesses", "Villous blunting with crypt hyperplasia and increased intraepithelial lymphocytes", "Normal duodenal villi with eosinophilic oesophagitis"], "answer": 2, "explanation": "The triad is supportive but must be interpreted with serology and clinical context. Why not the others: A. Full-thickness ileal granulomas — This favours Crohn disease or another granulomatous disorder.; B. Isolated colonic crypt abscesses — These suggest colitis, not characteristic coeliac enteropathy.; D. Normal duodenal villi with eosinophilic oesophagitis — This does not establish coeliac enteropathy.", "pearl": "", "srcAnswer": "D"}, {"num": 13, "level": "Conceptual", "question": "An 8-year-old with Down syndrome and faltering growth needs coeliac case finding. What is the appropriate initial test while on gluten?", "options": ["Serum amylase alone", "Total IgA with tTG-IgA", "Anti-endomysial IgE alone", "HLA-DQ8 alone"], "answer": 1, "explanation": "At-risk groups still use serology with total IgA. Why not the others: A. Serum amylase alone — Amylase is a pancreatic enzyme, not a coeliac test.; C. Anti-endomysial IgE alone — EMA-IgE is not the recommended screen.; D. HLA-DQ8 alone — Genetic predisposition is insufficient.", "pearl": "", "srcAnswer": "C"}, {"num": 14, "level": "High", "question": "A child has tTG-IgA 9× ULN and positive EMA-IgA on a second sample. Which statement is most accurate under ESPGHAN 2020?", "options": ["The 10× ULN threshold is not met; duodenal biopsy remains indicated", "Positive EMA overrides any tTG threshold", "Repeat total IgE to confirm", "HLA-DQ2 alone permits no-biopsy diagnosis"], "answer": 0, "explanation": "EMA positivity does not lower the tTG threshold for no-biopsy diagnosis. Why not the others: B. Positive EMA overrides any tTG threshold — The no-biopsy threshold remains obligatory.; C. Repeat total IgE to confirm — IgE does not settle the diagnostic pathway.; D. HLA-DQ2 alone permits no-biopsy diagnosis — HLA is not a replacement for the 10× criterion.", "pearl": "", "srcAnswer": "C"}, {"num": 15, "level": "Basic", "question": "A newly diagnosed child asks why strict gluten avoidance must include barley as well as wheat. Which explanation is best?", "options": ["Rice is the major gluten source", "Gluten exposure is harmless after symptoms resolve", "Only lactose causes mucosal damage", "Both wheat and barley contain gluten proteins capable of triggering coeliac autoimmunity"], "answer": 3, "explanation": "A lifelong gluten-free diet avoids wheat, barley and rye. Why not the others: A. Rice is the major gluten source — Rice is naturally gluten-free.; B. Gluten exposure is harmless after symptoms resolve — Mucosal injury may persist despite symptom improvement.; C. Only lactose causes mucosal damage — Lactose is not the autoimmune trigger.", "pearl": "", "srcAnswer": "B"}, {"num": 16, "level": "", "question": "An inpatient with complicated SAM weighing 7 kg is prescribed F-75 at 130 mL/kg/day. What is the total daily feed volume?", "options": ["700 mL/day", "910 mL/day", "1,300 mL/day", "650 mL/day"], "answer": 1, "explanation": "130 × 7 = 910 mL/day; individual clinical regimens vary with oedema and local protocols. Why not the others: A. 700 mL/day — That corresponds to 100 mL/kg/day, not 130.; C. 1,300 mL/day — This incorrectly treats the daily target as mL without multiplying by 7 kg.; D. 650 mL/day — This underestimates the prescribed volume.", "pearl": "", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 14 Q30 — F-75 daily feed volume"}}, {"num": 17, "level": "Clinical", "question": "A 12-year-old with coeliac disease has normal symptoms but poor linear growth and persistent tTG elevation after diagnosis. Most useful interpretation?", "options": ["Stop follow-up once diagnosis is made", "Normal stools prove histologic healing", "Growth failure is unrelated to coeliac disease", "Assess dietary gluten exposure and nutritional recovery rather than declaring remission"], "answer": 3, "explanation": "Follow-up requires growth, nutrition, symptoms and serology trends. Why not the others: A. Stop follow-up once diagnosis is made — Growth and serologic follow-up remain important.; B. Normal stools prove histologic healing — Clinical symptoms do not reliably prove healing.; C. Growth failure is unrelated to coeliac disease — Untreated or ongoing disease can impair growth.", "pearl": "", "srcAnswer": "A"}];
const NB_CTX={srcId:'Day34',label:'Day 34',set:'Quiz 1',href:'Day34/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day34_QuizSet1_Q1-17_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 34 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–17</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 34 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 34'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 34');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day34:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=f2ea51d5"></script></body></html>
