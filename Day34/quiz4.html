<script>
const quiz=[{"num": 52, "level": "Clinical", "question": "A 10-year-old has recurrent periumbilical pain, normal growth, no bleeding and normal examination. Which principle best applies?", "options": ["A positive diagnosis of a disorder of gut–brain interaction can be considered after appropriate assessment", "Pain must be fabricated if tests are normal", "All chronic pain requires routine CT scanning", "Empirical steroids are first-line"], "answer": 0, "explanation": "Functional abdominal pain is a positive clinical diagnosis, not an accusation of fabrication. Why not the others: B. Pain must be fabricated if tests are normal — Functional pain is genuine.; C. All chronic pain requires routine CT scanning — Imaging without alarms is not routinely justified.; D. Empirical steroids are first-line — Steroids are not standard functional-pain treatment.", "pearl": "", "srcAnswer": "B"}, {"num": 53, "level": "High", "question": "Which feature is an alarm sign in a child with chronic abdominal pain?", "options": ["Pain related to school stress alone", "Involuntary weight loss with faltering linear growth", "Occasional pain without nocturnal symptoms", "Normal growth and normal examination"], "answer": 1, "explanation": "Growth failure should prompt targeted investigation for organic disease. Why not the others: A. Pain related to school stress alone — Stress association is not a specific organic alarm.; C. Occasional pain without nocturnal symptoms — This alone is nonspecific.; D. Normal growth and normal examination — These reduce concern for major organic disease.", "pearl": "", "srcAnswer": "B"}, {"num": 54, "level": "Conceptual", "question": "A child with recurrent pain and constipation improves after defecation. Which disorder may be considered after appropriate evaluation?", "options": ["Crohn disease solely from relief with stool", "Acute appendicitis for 8 months", "Irritable bowel syndrome with constipation", "Biliary atresia"], "answer": 2, "explanation": "IBS involves pain associated with defecation or altered stool form/frequency. Why not the others: A. Crohn disease solely from relief with stool — IBD requires objective inflammation.; B. Acute appendicitis for 8 months — Chronic defecation-related pain is not typical acute appendicitis.; D. Biliary atresia — This is a neonatal cholestatic disorder.", "pearl": "", "srcAnswer": "D"}, {"num": 55, "level": "Clinical", "question": "A 12-year-old with functional abdominal pain misses school frequently. Which treatment has strong guideline support in 2025?", "options": ["Prolonged systemic corticosteroids", "Routine broad-spectrum antibiotics", "Repeated abdominal CT scans", "Gut-directed cognitive behavioural therapy"], "answer": 3, "explanation": "ESPGHAN/NASPGHAN 2025 strongly recommends CBT; evidence certainty is low. Why not the others: A. Prolonged systemic corticosteroids — Steroids have no routine role in FAP.; B. Routine broad-spectrum antibiotics — Antibiotics do not address a gut–brain pain disorder.; C. Repeated abdominal CT scans — Imaging without red flags adds radiation without benefit.", "pearl": "", "srcAnswer": "B"}, {"num": 56, "level": "", "question": "At 100 mL/kg/day, what dextrose percentage provides a GIR of 8 mg/kg/min? Use D% = GIR × 144 / fluids.", "options": ["8%", "11.52%", "5.56%", "18%"], "answer": 1, "explanation": "8×144/100 = 11.52%; check practical formulation and venous access before prescribing. Why not the others: A. 8% — This ignores infusion volume in the conversion.; C. 5.56% — This is the reciprocal-type conversion error.; D. 18% — This overestimates the target concentration.", "pearl": "", "srcAnswer": "D", "retest": {"stage": "R3", "from": "Day 10 Q47 — GIR to dextrose concentration"}}, {"num": 57, "level": "Integrated", "question": "Which nonpharmacological treatment also has a strong 2025 recommendation for paediatric IBS/FAP-NOS?", "options": ["Prophylactic appendectomy", "Long-term bed rest", "Mandatory gluten-free diet for every patient", "Gut-directed hypnotherapy"], "answer": 3, "explanation": "Hypnotherapy has a strong recommendation with moderate-certainty evidence. Why not the others: A. Prophylactic appendectomy — There is no indication in functional pain.; B. Long-term bed rest — Rest can worsen function and disability.; C. Mandatory gluten-free diet for every patient — Unselected dietary exclusion is not a universal treatment.", "pearl": "", "srcAnswer": "B"}, {"num": 58, "level": "Clinical", "question": "A child with chronic abdominal pain has persistent fever, nocturnal diarrhoea and blood in stool. Best next action?", "options": ["Reassure without testing because pain is chronic", "Diagnose lactose intolerance from bleeding", "Prescribe CBT as the only assessment", "Investigate organic inflammation or infection before assigning a functional diagnosis"], "answer": 3, "explanation": "Alarm features demand targeted clinical and laboratory evaluation. Why not the others: A. Reassure without testing because pain is chronic — Alarm features require work-up.; B. Diagnose lactose intolerance from bleeding — Lactose intolerance does not usually cause blood.; C. Prescribe CBT as the only assessment — CBT may help coping but cannot replace alarm evaluation.", "pearl": "", "srcAnswer": "C"}, {"num": 59, "level": "High", "question": "A family is told a child’s functional abdominal pain is “all in the head.” Which correction is most appropriate?", "options": ["Prohibit all school attendance", "Tell the child the pain is imaginary", "Promise that no symptoms can recur", "Explain real pain arising from altered gut–brain signalling and offer a functional recovery plan"], "answer": 3, "explanation": "Validation and a biopsychosocial explanation support engagement. Why not the others: A. Prohibit all school attendance — Avoidance can reinforce disability.; B. Tell the child the pain is imaginary — This invalidates a genuine condition.; C. Promise that no symptoms can recur — Symptoms may fluctuate.", "pearl": "", "srcAnswer": "C"}, {"num": 60, "level": "Conceptual", "question": "Which test result alone cannot reliably distinguish functional pain from paediatric IBD?", "options": ["Histologically confirmed continuous colitis", "Normal serum CRP", "Positive intestinal granulomas on biopsy", "Perianal fistula with ileal ulcers"], "answer": 1, "explanation": "CRP can be normal in IBD; integrate growth, stool markers and alarm signs. Why not the others: A. Histologically confirmed continuous colitis — This supports organic UC.; C. Positive intestinal granulomas on biopsy — This is objective inflammatory pathology.; D. Perianal fistula with ileal ulcers — These strongly suggest Crohn disease.", "pearl": "", "srcAnswer": "D"}, {"num": 61, "level": "Clinical", "question": "A child with functional abdominal pain has significant anxiety and avoidance. Which goal is most appropriate?", "options": ["Increase emergency investigations after each episode", "Guarantee zero pain before any activity", "Restore function and school participation alongside symptom management", "Prescribe opioids for chronic daily pain"], "answer": 2, "explanation": "Guideline care targets quality of life, coping and functioning. Why not the others: A. Increase emergency investigations after each episode — Repeated testing without alarms may reinforce anxiety.; B. Guarantee zero pain before any activity — Function can improve despite some symptoms.; D. Prescribe opioids for chronic daily pain — Opioids carry harms and are not routine treatment.", "pearl": "", "srcAnswer": "A"}, {"num": 62, "level": "High", "question": "An adolescent has epigastric pain/fullness after meals without structural disease. Which Rome IV category may fit?", "options": ["Functional dyspepsia", "Acute severe ulcerative colitis", "Coeliac crisis", "FPIES"], "answer": 0, "explanation": "Postprandial distress and epigastric pain syndromes are functional dyspepsia phenotypes. Why not the others: B. Acute severe ulcerative colitis — No bloody diarrhoea or objective colitis is described.; C. Coeliac crisis — No malabsorption or autoimmune evidence is presented.; D. FPIES — FPIES is a food-triggered acute vomiting syndrome.", "pearl": "", "srcAnswer": "D"}, {"num": 63, "level": "Clinical", "question": "A 9-year-old has stereotyped attacks of severe midline pain with nausea, pallor and symptom-free intervals. Which functional diagnosis is plausible?", "options": ["Pyloric stenosis", "Abdominal migraine", "Nephrotic syndrome", "Chronic appendicitis in every episode"], "answer": 1, "explanation": "Abdominal migraine is episodic, stereotyped and often accompanied by pallor/nausea. Why not the others: A. Pyloric stenosis — Pyloric stenosis presents in early infancy with vomiting.; C. Nephrotic syndrome — Nephrotic syndrome presents with proteinuria and oedema.; D. Chronic appendicitis in every episode — Stereotyped symptom-free attacks are not classic appendicitis.", "pearl": "", "srcAnswer": "B"}, {"num": 64, "level": "", "question": "AEEG has recurrent rising saw-tooth episodes, and simultaneous raw EEG shows evolving rhythmic discharges. Which interpretation is best?", "options": ["Electrode impedance artifact alone", "Motion artifact alone", "Normal sleep cycling", "Electrographic seizures"], "answer": 3, "explanation": "Confirm aEEG patterns against raw EEG evolution and clinical context. Why not the others: A. Electrode impedance artifact alone — Artifact does not show convincing evolving ictal morphology.; B. Motion artifact alone — Evolving ictal raw EEG supports true seizure.; C. Normal sleep cycling — Sleep cycling lacks this evolving ictal correlate.", "pearl": "", "srcAnswer": "A", "retest": {"stage": "R3", "from": "Day 7 Q34 — aEEG seizure vs artifact"}}, {"num": 65, "level": "High", "question": "A child with IBS asks whether a negative endoscopy must be repeated monthly. Best answer?", "options": ["No assessment is ever needed again", "Repeat testing should be driven by new alarm features or a change in clinical course", "Yes, monthly endoscopy is mandatory", "Yes, because IBS always progresses to Crohn disease"], "answer": 1, "explanation": "A positive functional diagnosis is revisited when clinically indicated. Why not the others: A. No assessment is ever needed again — New red flags require reassessment.; C. Yes, monthly endoscopy is mandatory — Routine serial endoscopy is not indicated for stable functional symptoms.; D. Yes, because IBS always progresses to Crohn disease — IBS is not a precursor of Crohn disease.", "pearl": "", "srcAnswer": "A"}, {"num": 66, "level": "Basic", "question": "An adolescent with IBS-D is offered loperamide as an evidence-proven first-line pain treatment. What is the key 2025 guideline caution?", "options": ["Loperamide cures the underlying gut–brain disorder", "Paediatric evidence for common drugs such as loperamide is limited", "Loperamide is a replacement for assessing bloody stools", "Loperamide is a diagnostic test for coeliac disease"], "answer": 1, "explanation": "The 2025 guideline highlights evidence gaps for many commonly used medications. Why not the others: A. Loperamide cures the underlying gut–brain disorder — It does not address the full syndrome.; C. Loperamide is a replacement for assessing bloody stools — Blood requires organic evaluation.; D. Loperamide is a diagnostic test for coeliac disease — Response is not diagnostic.", "pearl": "", "srcAnswer": "A"}, {"num": 67, "level": "Clinical", "question": "A child with recurrent pain, normal growth and no alarms has substantial parental concern. Which communication approach is most effective?", "options": ["Offer a clear positive diagnosis, shared plan and planned follow-up", "Suggest pain is deliberate school avoidance", "Order every possible test regardless of yield", "Dismiss the concern because examination is normal"], "answer": 0, "explanation": "Education and shared decision-making are best-practice elements. Why not the others: B. Suggest pain is deliberate school avoidance — This is not a clinically justified conclusion.; C. Order every possible test regardless of yield — Indiscriminate testing can cause harm.; D. Dismiss the concern because examination is normal — Dismissal harms therapeutic alliance.", "pearl": "", "srcAnswer": "A"}, {"num": 68, "level": "High", "question": "A 15-year-old with functional abdominal pain has tried reassurance alone without functional improvement. Which escalation is evidence-supported?", "options": ["Refer for structured gut-directed psychological therapy", "Initiate long-term oral prednisolone", "Begin chronic opioid analgesics", "Prescribe lifelong fasting"], "answer": 0, "explanation": "CBT and gut-directed hypnotherapy have the strongest guideline support. Why not the others: B. Initiate long-term oral prednisolone — Steroids are inappropriate without inflammatory disease.; C. Begin chronic opioid analgesics — Opioids have important harms.; D. Prescribe lifelong fasting — This risks malnutrition and is not evidence-based.", "pearl": "", "srcAnswer": "D"}];
const NB_CTX={srcId:'Day34',label:'Day 34',set:'Quiz 4',href:'Day34/quiz4.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div>${q.pearl?`<div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl)}</div>`:''}${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day34_QuizSet4_Q52-68_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 34 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 52–68</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const full=String(q.retest.from||''),sm=full.match(/Day\s*\d+(?:\s*Q\d+)?/),src=sm?sm[0].replace(/\s+/g,' '):'';
  const name=sm?full.slice(sm.index+sm[0].length).replace(/^[\s—–:-]+/,'').trim():'';   // "Day 10 Q8 — Neonatal hypoglycemia …"
  const id=`Day 34 Q${q.num}${src?` retest ${src}`:' retest'}${name?` (${name})`:''}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 34'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 34');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 Notify.send(title,'memo',msg);
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day34:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
