const quiz=[{"num": 49, "level": "Clinical/Application", "question": "A preterm infant is being discharged with active zone II stage 2 ROP without plus. What is the safest discharge arrangement?", "options": ["Advise review only if parents notice poor vision", "Stop screening because the infant leaves the NICU", "Document a dated ophthalmology follow-up and communicate responsibility", "Book review at 6 months regardless of findings"], "answer": 2, "explanation": "Missed appointments can be more harmful than imperfect inpatient screening. Closest distractor: Clinical stability does not mean retinal maturity. Why not the others: A. Advise review only if parents notice poor vision — Early progression is clinically silent.; B. Stop screening because the infant leaves the NICU — Discharge does not end retinal vascularization.; D. Book review at 6 months regardless of findings — Stage 2 zone II typically needs earlier follow-up.", "pearl": "Put the date, location and contact in the discharge summary.", "srcAnswer": "C"}, {"num": 50, "level": "High-Difficulty", "question": "A 27-week infant at 35 weeks PMA has zone I stage 2 ROP with preplus. Forty-eight hours later the ridge is unchanged, vascular tortuosity has increased but still does not meet the plus reference standard, and there is no stage 3 neovascularisation. Which plan best applies ETROP/ICROP3 reasoning?", "options": ["Treat immediately because any worsening posterior tortuosity is Type 1 disease", "Classify as stage 3 because increasing tortuosity substitutes for extraretinal neovascularisation", "Stop screening because absence of plus at 35 weeks PMA predicts spontaneous regression", "Continue very close surveillance as Type 2/posterior high-risk disease, with treatment if plus or qualifying stage progression appears"], "answer": 3, "explanation": "Zone I stage 2 without true plus remains Type 2 under ETROP; worsening preplus heightens surveillance urgency but does not itself meet the plus threshold. Closest distractor: The close distractor is 'almost plus': greater tortuosity increases concern but treatment classification still requires standardized plus or another Type 1 criterion. Why not the others: A. Treat immediately because any worsening posterior tortuosity is Type 1 disease — Preplus exists on a continuum but is not automatically plus for ETROP Type 1.; B. Classify as stage 3 because increasing tortuosity substitutes for extraretinal neovascularisation — Stage is retinal morphology; plus/preplus is posterior vascular status.; C. Stop screening because absence of plus at 35 weeks PMA predicts spontaneous regression — Posterior zone I disease remains high-risk and needs close review.", "pearl": "Do not let a continuum concept erase a binary treatment threshold used by the exam framework.", "srcAnswer": "D"}, {"num": 51, "level": "High-Difficulty", "question": "A 28-week infant has zone II stage 3 without plus, then two days later develops unequivocal plus. What changed?", "options": ["Observation category converted to Type 1 requiring treatment", "The prior stage 3 was never true ROP", "Stage automatically becomes stage 4", "Zone automatically becomes zone I"], "answer": 0, "explanation": "Plus converts this zone II stage 3 lesion from Type 2 to Type 1. Closest distractor: The stage can remain 3 while treatment urgency changes. Why not the others: B. The prior stage 3 was never true ROP — Both findings can be sequentially valid.; C. Stage automatically becomes stage 4 — Plus does not imply detachment.; D. Zone automatically becomes zone I — Zone is retinal location, not vascular activity.", "pearl": "Record serial zone/stage/plus, not just maximum stage.", "srcAnswer": "A"}, {"num": 52, "level": "High-Difficulty", "question": "A 29-week infant initially had posterior zone II stage 2 preplus. Forty-eight hours later there is severe plus, flat posterior neovascularisation without a classical ridge, and rapid circumferential progression. Which diagnosis and action best fit ICROP3?", "options": ["Conventional zone II stage 2 Type 2 disease; review in two weeks", "Aggressive ROP phenotype requiring urgent retina-specialist treatment assessment despite the atypical flat morphology", "Stage 4A tractional detachment because the disease progressed rapidly", "Normal posterior vascular immaturity because a classical stage-2 ridge is absent"], "answer": 1, "explanation": "Rapid posterior progression, severe plus and flat neovascularisation without orderly stages is the ICROP3 aggressive ROP phenotype. Closest distractor: Absence of a classical ridge is not reassurance when posterior plus and rapid flat neovascularisation are present. Why not the others: A. Conventional zone II stage 2 Type 2 disease; review in two weeks — Severe plus and rapid flat neovascularisation are incompatible with routine Type 2 surveillance.; C. Stage 4A tractional detachment because the disease progressed rapidly — No retinal detachment or foveal-sparing traction is described.; D. Normal posterior vascular immaturity because a classical stage-2 ridge is absent — ICROP3 specifically recognizes flat neovascularisation in aggressive disease.", "pearl": "A-ROP is defined by behavior and posterior vascular severity as much as by conventional stage appearance.", "srcAnswer": "B", "img": "img/image3_q52.png", "imgCaption": "Purpose-built educational schematic; not a patient image."}, {"num": 53, "level": "High-Difficulty", "question": "A 26-week infant with posterior Type 1 ROP is treated with anti-VEGF. At 52 weeks PMA peripheral avascular retina persists, no active ridge. Which follow-up plan is strongest?", "options": ["Continue long-term retinal surveillance with specialist-directed peripheral assessment", "Treat with immediate vitrectomy for avascularity alone", "Consider recurrence impossible after 8 weeks", "Stop all examinations at 45 weeks PMA"], "answer": 0, "explanation": "Anti-VEGF creates a prolonged surveillance obligation. Closest distractor: Do not apply untreated-eye 45-week stopping criteria to anti-VEGF eyes. Why not the others: B. Treat with immediate vitrectomy for avascularity alone — Vitrectomy addresses tractional detachment, not simple avascularity.; C. Consider recurrence impossible after 8 weeks — Reactivation can occur substantially later.; D. Stop all examinations at 45 weeks PMA — The AAP stopping rule differs after anti-VEGF treatment.", "pearl": "At least 65-week PMA follow-up is an AAP 2018 reference anchor.", "srcAnswer": "A"}, {"num": 54, "level": "High-Difficulty", "question": "A 30-week, 1700-g infant in India had no oxygen therapy but developed severe NEC and sepsis. Does the NHM ROP screen criterion apply?", "options": ["Only if the infant has visual symptoms", "No: oxygen therapy is mandatory for screening", "No: only infants <1500 g qualify in India", "Yes: birth weight <2000 g independently qualifies"], "answer": 3, "explanation": "Indian NHM eligibility includes any birth weight <2000 g. Closest distractor: The risk-factor clause is not required when a weight criterion already applies. Why not the others: A. Only if the infant has visual symptoms — ROP screening is preventive and presymptomatic.; B. No: oxygen therapy is mandatory for screening — Oxygen is a risk factor, not a mandatory condition.; C. No: only infants <1500 g qualify in India — This imports a narrower US criterion.", "pearl": "National criteria may differ from individual tertiary NICU protocols.", "srcAnswer": "D"}, {"num": 55, "level": "High-Difficulty", "question": "A 24-week infant born in the US is 4 weeks old (28 weeks PMA). Under the AAP 2018 initial examination table, which statement is correct?", "options": ["Wait until 40 weeks PMA", "The first routine exam is scheduled at about 31 weeks PMA (7 weeks PNA)", "Use the Indian 2–3-week rule as if it were AAP", "Screen immediately at 28 weeks PMA as a universal rule"], "answer": 1, "explanation": "The AAP table for 24-week GA reaches 31 weeks PMA at 7 weeks PNA. Calculation: Formula: PNA at first exam = target PMA − birth GA. Substitution: 31 −24. Units/final answer: 7 weeks PNA. Unit/conversion trap: Do not substitute India 2–3-week timing into an AAP-table question. Closest distractor: The India high-risk earlier first screen is a different framework. Why not the others: A. Wait until 40 weeks PMA — This risks missing treatable ROP.; C. Use the Indian 2–3-week rule as if it were AAP — National timing frameworks differ.; D. Screen immediately at 28 weeks PMA as a universal rule — This is earlier than the table, absent special indication.", "pearl": "Name the country/guideline before selecting an examination date.", "srcAnswer": "B"}, {"num": 56, "level": "High-Difficulty", "question": "A 27-week infant has zone I stage 3 ROP without plus, clear media and persistent avascular posterior retina. One clinician wants to wait for plus; another proposes immediate treatment and asks whether laser or anti-VEGF should be considered. Which response is best?", "options": ["Observation is required because treatment criteria in zone I always require plus disease", "Laser is prohibited in zone I, so no treatment can be offered until retinal detachment develops", "This already meets Type 1 criteria without plus; treatment should not wait, while modality is individualized by posterior location, anatomy and specialist protocol", "The lesion is Type 2 unless stage 4 detachment appears"], "answer": 2, "explanation": "Zone I stage 3 without plus is already ETROP Type 1. The treatment threshold is separate from the choice of laser versus anti-VEGF. Closest distractor: First decide whether treatment is indicated; only then choose laser versus anti-VEGF based on posterior anatomy, visualization and protocol. Why not the others: A. Observation is required because treatment criteria in zone I always require plus disease — Zone I stage 3 is the key exception: plus is not required.; B. Laser is prohibited in zone I, so no treatment can be offered until retinal detachment develops — Posterior disease may be treated; modality is specialist- and anatomy-dependent.; D. The lesion is Type 2 unless stage 4 detachment appears — Waiting for traction would miss the established treatment window.", "pearl": "Zone I stage 3 is Type 1 even without plus.", "srcAnswer": "C"}, {"num": 57, "level": "High-Difficulty", "question": "A 26-week infant has zone II stage 2 ROP with unequivocal plus, no extraretinal tufts, and a good peripheral view. Which interpretation best integrates threshold and treatment planning?", "options": ["This is Type 1 ROP despite absence of stage 3; prompt treatment assessment is indicated, with laser often favored when zone II avascular retina is accessible", "It remains Type 2 until stage 3 neovascularisation appears", "Plus disease automatically converts the retinal stage to stage 3", "Anti-VEGF is mandatory because any plus disease makes laser ineffective"], "answer": 0, "explanation": "Zone II stage 2 with plus is Type 1 even without stage 3; with a good peripheral view, laser remains a common durable treatment option, while anti-VEGF is not automatically mandatory. Closest distractor: Do not confuse the treatment threshold with the retinal stage or with the choice of treatment modality. Why not the others: B. It remains Type 2 until stage 3 neovascularisation appears — ETROP includes zone II stage 2 with plus in Type 1.; C. Plus disease automatically converts the retinal stage to stage 3 — Plus describes posterior vascular dilation/tortuosity; it does not change the retinal stage.; D. Anti-VEGF is mandatory because any plus disease makes laser ineffective — Agent choice depends on zone, visualization and specialist judgment; plus does not make laser ineffective.", "pearl": "Zone II stage 2 plus = Type 1; stage and plus are independent descriptors.", "srcAnswer": "A"}, {"num": 58, "level": "High-Difficulty", "question": "An extremely preterm infant has an initial US showing intraventricular clot, then a new echogenic wedge lateral to the ventricle. The report calls it “grade IV IVH.” What is the best correction?", "options": ["Call it cystic PVL immediately", "Describe PVHI separately from the IVH grade", "Downgrade to isolated grade I GMH", "Call it normal periventricular flare"], "answer": 1, "explanation": "PVHI has a venous mechanism and may be unilateral. Closest distractor: PVHI is not the same as ventricular blood volume. Why not the others: A. Call it cystic PVL immediately — PVL cysts evolve later and often bilaterally.; C. Downgrade to isolated grade I GMH — There is ventricular blood and parenchymal injury.; D. Call it normal periventricular flare — A focal wedge with IVH is abnormal.", "pearl": "Separate parenchymal injury from intraventricular grade in reports.", "srcAnswer": "B", "img": "img/image4_q58.png", "imgCaption": "Purpose-built educational schematic; not a patient image."}, {"num": 59, "level": "High-Difficulty", "question": "A 25-week infant with IVH has VI above p97 and AHW 8 mm. The fontanelle is soft. Which interpretation best reflects ELVIS?", "options": ["No action until AHW >15 mm", "Grade III IVH is impossible if the fontanelle is soft", "Normal because the fontanelle is soft", "The infant has crossed a studied low-threshold PHVD marker"], "answer": 3, "explanation": "Low-threshold PHVD is an ultrasound-based trigger. Closest distractor: AHW 8 mm is above low but below high threshold (>10 mm). Why not the others: A. No action until AHW >15 mm — This exceeds the studied high threshold.; B. Grade III IVH is impossible if the fontanelle is soft — Fontanelle exam does not exclude IVH/PHVD.; C. Normal because the fontanelle is soft — Clinical pressure signs can lag behind ultrasound changes.", "pearl": "The trial informs early escalation; exact intervention remains unit/neurosurgery-specific.", "srcAnswer": "D"}, {"num": 60, "level": "High-Difficulty", "question": "A 24-week infant with grade III IVH shows serial ventricular enlargement: VI rises from p97+1 mm to p97+5 mm over 72 hours, AHW is now 11 mm and TOD 31 mm. Head circumference and fontanelle remain normal. Which interpretation and next step best reflect ELVIS-era evidence?", "options": ["Defer action because absence of head-growth acceleration excludes clinically important PHVD", "Continue routine monthly ultrasound because ventricular measurements alone should never trigger escalation", "High-threshold measurements and rapid trajectory mandate urgent neonatology-neurosurgery review for temporizing drainage planning; do not wait for pressure signs", "Insert a permanent VP shunt immediately because any high-threshold crossing proves long-term shunt dependence"], "answer": 2, "explanation": "Both high-threshold ventricular measurements and a rapid serial trajectory indicate advanced progressive PHVD. Clinical pressure signs lag and should not be awaited. Closest distractor: The closest distractor is immediate VP shunt: crossing ELVIS high thresholds triggers urgent escalation, not automatic permanent hardware. Why not the others: A. Defer action because absence of head-growth acceleration excludes clinically important PHVD — Head circumference/fontanelle changes are late in the compliant preterm skull.; B. Continue routine monthly ultrasound because ventricular measurements alone should never trigger escalation — Serial cUS measurements are central to PHVD escalation and should be more frequent during progression.; D. Insert a permanent VP shunt immediately because any high-threshold crossing proves long-term shunt dependence — Temporizing drainage and individualized shunt readiness usually precede permanent shunting.", "pearl": "2026 ELVIS Bayesian reanalysis strengthens earlier measurement-led intervention, but still supports a pathway rather than a one-number operation rule.", "srcAnswer": "C"}, {"num": 61, "level": "High-Difficulty", "question": "A 26-week infant has day-5 HUS showing grade II IVH, day-14 HUS showing enlarged ventricles, and stable head circumference. Which is the key management change?", "options": ["Move from routine IVH surveillance to PHVD-specific serial measurements", "Stop scans because IVH grade is only II", "Replace ultrasound with routine skull X-ray", "Start retinal laser"], "answer": 0, "explanation": "PHVD surveillance depends on evolution, not initial IVH grade alone. Closest distractor: Stable head circumference does not exclude ultrasound progression. Why not the others: B. Stop scans because IVH grade is only II — PHVD can occur after grade II+ hemorrhage.; C. Replace ultrasound with routine skull X-ray — X-ray cannot quantify ventricular dilatation.; D. Start retinal laser — Eye therapy does not treat ventricular expansion.", "pearl": "Document VI, AHW, TOD serially.", "srcAnswer": "A"}, {"num": 62, "level": "High-Difficulty", "question": "A 29-week infant has bilateral periventricular echogenicity on day 4, resolving by day 6, with normal follow-up. What interpretation is most cautious?", "options": ["Definite grade IV IVH", "Transient periventricular flare rather than established cystic PVL", "Definite cystic PVL", "MRI-proven noncystic WMI"], "answer": 1, "explanation": "Transient echogenicity alone is not synonymous with PVL. Closest distractor: Persistence >7 days and later cysts raise concern for WMI. Why not the others: A. Definite grade IV IVH — No intraventricular hemorrhage or focal infarct is described.; C. Definite cystic PVL — No cysts or persistent echogenicity are present.; D. MRI-proven noncystic WMI — MRI was not performed.", "pearl": "Continue routine surveillance appropriate to gestational age.", "srcAnswer": "B"}, {"num": 63, "level": "", "question": "A term neonate develops bilirubin 22 mg/dL at 60 h, predominantly unconjugated. DAT is negative, hemoglobin only mildly reduced, and there is a family history of neonatal jaundice. Which mechanism deserves specific testing?", "options": ["Physiologic jaundice requiring no evaluation", "ABO immune hemolysis confirmed by DAT", "Biliary atresia", "G6PD deficiency-related nonimmune hemolysis"], "answer": 3, "explanation": "Severe indirect jaundice with modest anemia and absent immune evidence is compatible with G6PD deficiency. Closest distractor: DAT negativity does not exclude nonimmune hemolysis; distinguish from direct hyperbilirubinemia. Why not the others: A. Physiologic jaundice requiring no evaluation — Bilirubin 22 mg/dL at 60 h is too high to dismiss as physiologic.; B. ABO immune hemolysis confirmed by DAT — A negative DAT and lack of immune evidence weaken this mechanism.; C. Biliary atresia — Biliary atresia causes conjugated cholestasis, not predominantly unconjugated jaundice.", "pearl": "G6PD screening can be falsely normal during reticulocytosis; repeat when clinically indicated.", "srcAnswer": "D", "retest": {"stage": "R1", "from": "Day 6 Q60 — G6PD and DAT-negative severe jaundice"}}];

let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day11_QuizSet4_Q49-63_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 11 Quiz 4 — Wrong Answer Report</h1><p><b>Questions:</b> 49–63</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 11 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 11'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 11');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day11:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['4']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['4']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 4 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
