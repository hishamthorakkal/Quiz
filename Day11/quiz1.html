<script>
const quiz=[{"num": 1, "level": "Basic/Recall", "question": "In ICROP3, the anatomical lesion defining stage 1 ROP is:", "options": ["Extraretinal fibrovascular proliferation", "Partial retinal detachment", "An elevated ridge", "A demarcation line at the vascular–avascular junction"], "answer": 3, "explanation": "ICROP3 stage 1 is a flat demarcation line between vascular and avascular retina. Closest distractor: Line vs ridge is the closest adjacent-stage discriminator. Why not the others: A. Extraretinal fibrovascular proliferation — Extraretinal proliferation defines stage 3.; B. Partial retinal detachment — A partial detachment defines stage 4.; C. An elevated ridge — An elevated ridge defines stage 2, not stage 1.", "pearl": "Stage 1 line; stage 2 ridge; stage 3 extraretinal neovascular tissue.", "srcAnswer": "D"}, {"num": 2, "level": "Basic/Recall", "question": "The ROP stage indicating extraretinal neovascular proliferation is:", "options": ["Stage 2", "Stage 3", "Stage 4", "Stage 1"], "answer": 1, "explanation": "Stage 3 describes extraretinal fibrovascular proliferation, including flat neovascularization in ICROP3. Closest distractor: A ridge alone is not stage 3; extra-retinal proliferation is required. Why not the others: A. Stage 2 — Stage 2 is an elevated ridge without extraretinal proliferation.; C. Stage 4 — Stage 4 is partial retinal detachment.; D. Stage 1 — Stage 1 is a demarcation line.", "pearl": "ICROP3 permits flat neovascularization in stage 3.", "srcAnswer": "B"}, {"num": 3, "level": "Basic/Recall", "question": "A partial retinal detachment sparing the fovea is classified as:", "options": ["Stage 4A ROP", "Stage 4B ROP", "Stage 5 ROP", "Stage 3 ROP"], "answer": 0, "explanation": "Stage 4A spares the fovea; 4B involves it. Closest distractor: Foveal involvement is the precise 4A/4B separator. Why not the others: B. Stage 4B ROP — Stage 4B includes foveal involvement.; C. Stage 5 ROP — Stage 5 is total retinal detachment.; D. Stage 3 ROP — Stage 3 is neovascularization without retinal detachment.", "pearl": "Stage 5 denotes total detachment.", "srcAnswer": "A"}, {"num": 4, "level": "Basic/Recall", "question": "The most common anatomical origin of preterm germinal-matrix hemorrhage is:", "options": ["Cerebellar vermis", "Occipital cortex", "Caudothalamic groove", "Choroid plexus of the fourth ventricle"], "answer": 2, "explanation": "The germinal matrix at the caudothalamic groove is highly vascular and vulnerable in prematurity. Closest distractor: An echogenic focus at the caudothalamic notch favors GMH over choroid-plexus artifact. Why not the others: A. Cerebellar vermis — Cerebellar hemorrhage is a separate injury pattern.; B. Occipital cortex — A cortical bleed has different anatomy.; D. Choroid plexus of the fourth ventricle — This is not the usual source of GMH in very preterm infants.", "pearl": "Germinal matrix involutes with increasing gestation.", "srcAnswer": "C"}, {"num": 5, "level": "Basic/Recall", "question": "In Papile/Volpe-style ultrasound grading, IVH with ventricular dilatation is classically:", "options": ["Grade III", "Grade I", "Periventricular hemorrhagic infarction only", "Grade II"], "answer": 0, "explanation": "Grade III is intraventricular blood accompanied by acute ventricular enlargement. Closest distractor: Blood without dilatation remains grade II; do not confuse PVHI with simple extension. Why not the others: B. Grade I — Grade I is confined to the germinal matrix.; C. Periventricular hemorrhagic infarction only — PVHI is a distinct parenchymal venous infarction, not simply grade III.; D. Grade II — Grade II enters the ventricle without dilatation.", "pearl": "The old term grade IV is better described as PVHI.", "srcAnswer": "A"}, {"num": 6, "level": "Basic/Recall", "question": "The bedside imaging modality used for serial routine screening of IVH in very preterm infants is:", "options": ["MR angiography at birth", "Plain skull radiography", "Cranial ultrasonography", "CT for every infant"], "answer": 2, "explanation": "Cranial US is repeatable, accessible and avoids radiation. Closest distractor: MRI better detects noncystic white-matter injury but does not replace serial US for routine IVH surveillance. Why not the others: A. MR angiography at birth — MRA is not the screening modality for routine GMH–IVH.; B. Plain skull radiography — Skull radiographs do not assess ventricular hemorrhage.; D. CT for every infant — CT adds ionizing radiation and is not routine surveillance.", "pearl": "Cranial US is the workhorse; MRI is selective.", "srcAnswer": "C"}, {"num": 7, "level": "Basic/Recall", "question": "Postmenstrual age (PMA) is calculated as:", "options": ["Chronological age minus gestational age", "Gestational age plus corrected age", "Birth weight divided by age", "Gestational age at birth plus chronological age"], "answer": 3, "explanation": "PMA (weeks) = GA at birth (weeks) + elapsed postnatal weeks. Closest distractor: PMA and corrected age are not interchangeable. Why not the others: A. Chronological age minus gestational age — Subtraction has no physiological meaning here.; B. Gestational age plus corrected age — Corrected age is a post-term developmental construct.; C. Birth weight divided by age — Weight is unrelated to the PMA formula.", "pearl": "A 28-week infant at 5 weeks PNA is 33 weeks PMA.", "srcAnswer": "D"}, {"num": 8, "level": "Conceptual", "question": "Why does plus disease change management even when ROP stage appears relatively low?", "options": ["It can occur only with stage 3", "It reflects severe posterior vascular dilation and tortuosity associated with progression", "It means the retina is already completely detached", "It proves that screening can stop"], "answer": 1, "explanation": "Plus disease is a posterior vascular activity marker, not a retinal-detachment stage. Closest distractor: Zone I any stage with plus qualifies as Type 1 ROP. Why not the others: A. It can occur only with stage 3 — Plus can accompany stage 1 or 2 and alter treatment urgency.; C. It means the retina is already completely detached — Plus describes vascular abnormality, not detachment.; D. It proves that screening can stop — Plus indicates closer evaluation and often treatment.", "pearl": "ICROP3 treats normal–preplus–plus as a continuum.", "srcAnswer": "B"}, {"num": 9, "level": "Conceptual", "question": "Why are Indian ROP screening eligibility thresholds broader than traditional US thresholds?", "options": ["Clinically important ROP can occur in larger and more mature sick infants", "The retinal zones are anatomically different in Indian infants", "US recommendations require screening all term newborns", "ROP never occurs below 1500 g in India"], "answer": 0, "explanation": "India-specific eligibility accounts for ROP in heavier and older preterm infants with unstable courses. Closest distractor: Do not apply a US <1500 g/≤30-week rule to Indian practice without qualification. Why not the others: B. The retinal zones are anatomically different in Indian infants — Retinal anatomy does not explain the policy difference.; C. US recommendations require screening all term newborns — US eligibility is generally narrower, not universal.; D. ROP never occurs below 1500 g in India — Very small infants remain at high risk.", "pearl": "NHM India: <2000 g or <34 weeks; 34–36 weeks with risks; unstable course.", "srcAnswer": "A"}, {"num": 10, "level": "Conceptual", "question": "What distinguishes Type 1 from Type 2 ROP in ETROP-based treatment decisions?", "options": ["Type 2 never progresses", "Type 1 requires stage 5 disease", "Type 2 always means retinal detachment", "Type 1 crosses treatment criteria; Type 2 needs close surveillance"], "answer": 3, "explanation": "Type 1 is treatment-requiring disease; Type 2 is observation with close re-evaluation. Closest distractor: Zone I stage 3 without plus is Type 1; zone II stage 3 without plus is Type 2. Why not the others: A. Type 2 never progresses — Type 2 may progress to Type 1 and needs scheduled re-exams.; B. Type 1 requires stage 5 disease — Treatment is intended well before detachment.; C. Type 2 always means retinal detachment — Type 2 describes prethreshold observation categories, not stage 4.", "pearl": "Treatment categories combine zone, stage and plus.", "srcAnswer": "D"}, {"num": 11, "level": "Conceptual", "question": "Why must anti-VEGF-treated ROP infants receive prolonged retinal follow-up?", "options": ["Retinal detachment is impossible after anti-VEGF", "Recurrence occurs only within the first 24 hours", "Peripheral avascular retina can persist and late reactivation can occur", "Anti-VEGF permanently destroys all peripheral retina"], "answer": 2, "explanation": "Regression after anti-VEGF is not the same as full retinal vascularization. Closest distractor: Laser-treated and anti-VEGF-treated infants have different late surveillance demands. Why not the others: A. Retinal detachment is impossible after anti-VEGF — Treatment does not eliminate late detachment risk.; B. Recurrence occurs only within the first 24 hours — Late reactivation is well documented.; D. Anti-VEGF permanently destroys all peripheral retina — Laser ablates peripheral retina; anti-VEGF does not necessarily.", "pearl": "AAP 2018 framework suggests monitoring to at least 65 weeks PMA after anti-VEGF when appropriate.", "srcAnswer": "C"}, {"num": 12, "level": "Conceptual", "question": "Why is a flat posterior neovascular lesion with marked plus disease concerning for aggressive ROP?", "options": ["Absence of a ridge excludes ROP", "Aggressive ROP may progress rapidly without orderly stage 1→2→3 evolution", "Only a prominent peripheral ridge can progress rapidly", "It is invariably normal vascular maturation"], "answer": 1, "explanation": "Aggressive ROP is a tempo/morphology phenotype that can bypass classic staged appearance. Closest distractor: Do not require a stage-2 ridge before suspecting aggressive disease. Why not the others: A. Absence of a ridge excludes ROP — ICROP3 explicitly recognizes flat neovascularization.; C. Only a prominent peripheral ridge can progress rapidly — Aggressive disease may have subtle/flat posterior morphology.; D. It is invariably normal vascular maturation — Marked plus and rapid progression are pathologic.", "pearl": "A-ROP is not restricted to the posterior pole in ICROP3 terminology.", "srcAnswer": "B"}, {"num": 13, "level": "Conceptual", "question": "Why is routine cranial ultrasound repeated at 4–6 weeks in very preterm infants after an early normal scan?", "options": ["Cystic white-matter injury can evolve over weeks after the initial scan", "The second scan is only to measure skull size", "Early US cannot detect any hemorrhage", "All PVL cysts are present on day 1"], "answer": 0, "explanation": "PVL may progress from echogenicity to cysts weeks after an insult. Closest distractor: Normal day-5 US does not exclude later WMI. Why not the others: B. The second scan is only to measure skull size — It assesses parenchymal and ventricular evolution.; C. Early US cannot detect any hemorrhage — Early US is useful for GMH–IVH.; D. All PVL cysts are present on day 1 — Cyst formation is often delayed.", "pearl": "CPS: first HUS 4–7 days, repeat 4–6 weeks for ≤31+6 weeks.", "srcAnswer": "A"}, {"num": 14, "level": "Conceptual", "question": "Why is the historical label “grade IV IVH” less precise than PVHI?", "options": ["It always affects both hemispheres symmetrically", "It is identical to grade I GMH", "It means no hemorrhage occurred", "Parenchymal injury often represents venous infarction secondary to obstruction, not simple ventricular blood extension"], "answer": 3, "explanation": "PVHI is a periventricular hemorrhagic venous infarction associated with GMH–IVH. Closest distractor: Distinguish echogenic wedge-shaped parenchymal injury from ventricular blood alone. Why not the others: A. It always affects both hemispheres symmetrically — PVHI is often unilateral/asymmetric.; B. It is identical to grade I GMH — Grade I is confined to the germinal matrix.; C. It means no hemorrhage occurred — PVHI is hemorrhagic parenchymal injury.", "pearl": "Describe PVHI separately rather than simply calling it grade IV.", "srcAnswer": "D"}, {"num": 15, "level": "Conceptual", "question": "Why can a rapidly enlarging ventricular index precede a bulging fontanelle in preterm PHVD?", "options": ["Preterm fontanelles are always closed", "High cranial compliance permits ventricular expansion before overt pressure signs", "PHVD occurs only after discharge", "Ultrasound cannot measure ventricular width"], "answer": 1, "explanation": "Preterm infants may have clinically silent progressive PHVD. Closest distractor: Do not wait for accelerated head growth or apnea to trigger serial ventricular measurement. Why not the others: A. Preterm fontanelles are always closed — They are open and compliant.; C. PHVD occurs only after discharge — PHVD commonly evolves in the NICU.; D. Ultrasound cannot measure ventricular width — VI and AHW are ultrasound measures.", "pearl": "VI, AHW and TOD support early surveillance and referral.", "srcAnswer": "B"}, {"num": 16, "level": "", "question": "A 26-week ventilated infant abruptly desaturates. Chest excursion disappears and the ventilator circuit is visibly detached at the Y-piece. Which DOPE category is the immediate cause?", "options": ["Pneumothorax", "Obstruction of the endotracheal tube", "Equipment failure", "Displacement of the endotracheal tube"], "answer": 2, "explanation": "The visibly disconnected ventilator circuit is the decisive DOPE Equipment clue; reconnect and verify ventilation immediately. Closest distractor: A disconnected circuit differs from displaced ETT; inspect the entire ventilator–patient path. Why not the others: A. Pneumothorax — A pneumothorax does not cause the observed Y-piece separation.; B. Obstruction of the endotracheal tube — A mucus plug would not explain a visibly separated circuit.; D. Displacement of the endotracheal tube — ETT displacement is possible in sudden deterioration but the identified disconnection is at the circuit.", "pearl": "DOPE = Displacement, Obstruction, Pneumothorax, Equipment.", "srcAnswer": "C", "retest": {"stage": "R1", "from": "Day 5 Q34 — DOPE"}}];
const NB_CTX={srcId:'Day11',label:'Day 11',set:'Quiz 1',href:'Day11/quiz1.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day11_QuizSet1_Q1-16_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 11 Quiz 1 — Wrong Answer Report</h1><p><b>Questions:</b> 1–16</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 11 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 11'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 11');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day11:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['1']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['1']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 1 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
