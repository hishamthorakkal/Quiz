@media(max-width:650px){.stats,.homegrid{grid-template-columns:1fr 1fr}.q{font-size:17px;margin-bottom:12px}.wrap{padding:12px 10px 20px}h1{font-size:20px;margin:0 0 2px}.sub{font-size:13px;margin-bottom:6px}.progress-shell{margin:10px 0 6px}.topline{font-size:12.5px;margin-bottom:10px;gap:4px 10px}.card{padding:14px;border-radius:14px}.option{padding:12px;margin:8px 0;font-size:15.5px}.option input{transform:scale(1.3)}.feedback{padding:12px}.actions{position:sticky;bottom:0;z-index:5;background:#fff;margin:14px -14px -14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 -6px 18px rgba(15,23,42,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.actions>*{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px}.actions #mainBtn{grid-column:1/-1;order:-1;min-height:50px;font-size:16px}}

<script>
const quiz=[{"num": 17, "level": "Conceptual", "question": "Why is MRI superior to cranial ultrasound for many noncystic white-matter lesions?", "options": ["MRI detects subtle diffuse injury and maturation abnormalities beyond US resolution", "Ultrasound cannot detect cystic PVL", "MRI is required daily for all preterm infants", "MRI can always predict an individual child’s IQ accurately"], "answer": 0, "explanation": "MRI adds sensitivity for diffuse noncystic WMI but is a selective adjunct. Closest distractor: A normal US does not rule out subtle WMI; MRI findings do not guarantee outcome. Why not the others: B. Ultrasound cannot detect cystic PVL — US is excellent for cystic PVL.; C. MRI is required daily for all preterm infants — Routine daily MRI is impractical and not recommended.; D. MRI can always predict an individual child’s IQ accurately — Prognosis remains probabilistic and multifactorial.", "pearl": "Term-equivalent MRI is considered for higher-risk infants, not universally mandated.", "srcAnswer": "A"}, {"num": 18, "level": "Conceptual", "question": "Why does cystic PVL often predispose to spastic diplegia?", "options": ["PVL selectively destroys peripheral motor nerves", "Periventricular descending motor fibers serving the legs are vulnerable", "Cystic PVL affects only the cerebellum", "Spastic diplegia is caused by retinal neovascularization"], "answer": 1, "explanation": "Periventricular white-matter injury has characteristic motor consequences. Closest distractor: Diplegic spasticity is a long-term risk, not an immediate neonatal examination finding. Why not the others: A. PVL selectively destroys peripheral motor nerves — PVL is central white-matter injury.; C. Cystic PVL affects only the cerebellum — PVL is periventricular cerebral white matter.; D. Spastic diplegia is caused by retinal neovascularization — ROP and PVL are different prematurity complications.", "pearl": "Neurodevelopmental follow-up must include tone, posture and motor trajectories.", "srcAnswer": "B"}, {"num": 19, "level": "Conceptual", "question": "Why should early-intervention services be initiated for a high-risk preterm infant before a definitive CP diagnosis?", "options": ["A normal neonatal neurological examination excludes later motor impairment", "CP is reliably diagnosed by ultrasound grade alone", "Therapy can begin only after school age", "Developmental plasticity and evolving deficits make early therapy time-sensitive"], "answer": 3, "explanation": "High-risk follow-up is proactive and multidisciplinary. Closest distractor: Risk-based referral does not require diagnostic certainty. Why not the others: A. A normal neonatal neurological examination excludes later motor impairment — Early examinations may miss emerging deficits.; B. CP is reliably diagnosed by ultrasound grade alone — Diagnosis requires clinical trajectory and examination.; C. Therapy can begin only after school age — Early referral is appropriate.", "pearl": "Motor, language, hearing, vision and feeding domains all need surveillance.", "srcAnswer": "D"}, {"num": 20, "level": "Conceptual", "question": "Why is corrected age preferable to chronological age for early developmental interpretation in a 27-week infant?", "options": ["Chronological age must never be recorded", "Corrected age is irrelevant before two years", "Prematurity shifts expected maturational milestones relative to the due date", "Corrected age equals PMA in weeks"], "answer": 2, "explanation": "Corrected age = chronological age − weeks premature relative to 40 weeks. Closest distractor: Use PMA for neonatal scheduling and corrected age for early developmental comparison. Why not the others: A. Chronological age must never be recorded — Both ages should be documented for different purposes.; B. Corrected age is irrelevant before two years — It is especially important during early infancy.; D. Corrected age equals PMA in weeks — Corrected age is time since the expected term date.", "pearl": "Corrected age commonly used through 24 months; some contexts extend longer.", "srcAnswer": "C"}, {"num": 21, "level": "Conceptual", "question": "Why is a negative routine cranial ultrasound insufficient to exclude cerebellar hemorrhage in an extremely preterm infant?", "options": ["Posterior fossa lesions may require mastoid-window ultrasound or MRI", "Cerebellar injury never affects outcome", "Anterior-fontanel imaging is universally 100% sensitive", "Cerebellar hemorrhage is always visible on skull X-ray"], "answer": 0, "explanation": "Posterior-fossa imaging needs deliberate technique. Closest distractor: Consider mastoid views when cerebellar injury is suspected. Why not the others: B. Cerebellar injury never affects outcome — Cerebellar injury can affect motor/cognitive development.; C. Anterior-fontanel imaging is universally 100% sensitive — Sensitivity depends on window, size and expertise.; D. Cerebellar hemorrhage is always visible on skull X-ray — Radiographs do not visualize parenchymal hemorrhage.", "pearl": "MRI may detect lesions missed by routine cranial US.", "srcAnswer": "A"}, {"num": 22, "level": "Clinical/Application", "question": "A 29-week, 1120-g infant is 4 weeks old. Fundus examination shows a demarcation line in zone II without plus disease. What is the best classification and plan?", "options": ["Zone I stage 1; immediate anti-VEGF", "Zone II stage 3; urgent laser", "Mature retina; stop surveillance", "Zone II stage 1, no plus; review in about 2 weeks"], "answer": 3, "explanation": "Line in zone II without plus is mild ROP requiring surveillance. Closest distractor: Stage 1 line vs stage 2 ridge is decisive. Why not the others: A. Zone I stage 1; immediate anti-VEGF — The location is zone II, not zone I, and Type 1 criteria are absent.; B. Zone II stage 3; urgent laser — No extraretinal neovascularization or plus is described.; C. Mature retina; stop surveillance — Persistent avascular retina requires follow-up.", "pearl": "Follow-up interval depends on zone, stage and vascular activity.", "srcAnswer": "D"}, {"num": 23, "level": "Clinical/Application", "question": "A 26-week infant at 34 weeks PMA has zone I stage 3 ROP without plus. What is the next step?", "options": ["Stop screening because plus is absent", "Observe for three weeks", "Arrange urgent Type 1 ROP treatment assessment", "Wait until 45 weeks PMA"], "answer": 2, "explanation": "Zone I stage 3 without plus is Type 1 disease. Closest distractor: Contrast zone II stage 3 without plus, which is Type 2. Why not the others: A. Stop screening because plus is absent — Plus is not required for this Type 1 category.; B. Observe for three weeks — Zone I stage 3 is treatment-requiring even without plus.; D. Wait until 45 weeks PMA — Delay risks retinal detachment.", "pearl": "Treat Type 1 promptly, ideally within 72 h after confirmation.", "srcAnswer": "C"}, {"num": 24, "level": "Clinical/Application", "question": "A 31-week, 1350-g infant has zone II stage 3 ROP without plus at 36 weeks PMA. Which management is best?", "options": ["Urgent treatment is mandatory for all stage 3 lesions", "Close ophthalmic surveillance, commonly within 1 week", "Discharge from screening", "Routine follow-up after 6 weeks"], "answer": 1, "explanation": "Zone II stage 3 no plus = Type 2 observation with close follow-up. Closest distractor: Zone I stage 3 without plus is the nearby Type 1 trap. Why not the others: A. Urgent treatment is mandatory for all stage 3 lesions — Zone and plus determine Type 1 criteria.; C. Discharge from screening — Stage 3 disease is active and requires re-examination.; D. Routine follow-up after 6 weeks — Zone II stage 3 can progress quickly.", "pearl": "Type 2 can convert to Type 1 at the next examination.", "srcAnswer": "B"}, {"num": 25, "level": "Clinical/Application", "question": "A 27-week infant has zone II stage 2 ROP with unequivocal plus disease. What should be recommended?", "options": ["Two-to-three-week observation only", "Screening cessation at 37 weeks", "Prompt Type 1 treatment assessment", "No treatment unless stage 3 appears"], "answer": 2, "explanation": "Zone II stage 2 with plus meets treatment criteria. Closest distractor: Stage 2 with preplus is not equivalent to stage 2 with plus. Why not the others: A. Two-to-three-week observation only — Plus changes the category to treatment-requiring.; B. Screening cessation at 37 weeks — Active plus disease cannot be discharged.; D. No treatment unless stage 3 appears — Zone II stage 2 plus already qualifies.", "pearl": "Type 1 combines stage, zone and plus.", "srcAnswer": "C"}, {"num": 26, "level": "Clinical/Application", "question": "A 28-week infant at 33 weeks PMA has zone I stage 2 ROP without plus. What is the best interval?", "options": ["Immediate laser is required in all stage 2 zone I cases", "Stop examinations after a normal pupil response", "Wait 4 weeks", "Ophthalmic review within one week"], "answer": 3, "explanation": "Zone I stage 2 no plus is Type 2 with weekly-or-less surveillance. Closest distractor: Posterior location shortens follow-up despite no treatment criterion. Why not the others: A. Immediate laser is required in all stage 2 zone I cases — Without plus or stage 3, Type 1 criteria are absent.; B. Stop examinations after a normal pupil response — Pupillary response does not assess retinal vascularization.; C. Wait 4 weeks — Posterior disease can progress rapidly.", "pearl": "Type 2 is not benign; it is an active surveillance category.", "srcAnswer": "D"}, {"num": 27, "level": "Clinical/Application", "question": "A 33-week, 1820-g infant in an Indian NICU had sepsis and prolonged oxygen exposure. Which screening approach is best?", "options": ["No screen because birth weight exceeds 1500 g", "Schedule ROP screening under Indian risk-based criteria", "Screen only if visual fixation is abnormal", "Wait until the infant is walking"], "answer": 1, "explanation": "This infant meets Indian screening eligibility on weight and clinical risk. Closest distractor: The Western ≤1500-g cutoff would miss this infant. Why not the others: A. No screen because birth weight exceeds 1500 g — That applies an inappropriately narrow international threshold.; C. Screen only if visual fixation is abnormal — ROP is asymptomatic in early stages.; D. Wait until the infant is walking — Delayed screening forfeits the treatment window.", "pearl": "Document the first screening date before discharge.", "srcAnswer": "B"}, {"num": 28, "level": "Clinical/Application", "question": "A 27-week, 980-g infant in India is clinically stable at day 14. Which first-screening plan is consistent with NHM high-risk timing?", "options": ["Perform first ROP examination around 2–3 weeks of life", "No screening if oxygen has stopped", "Screen only when the child reaches 40 weeks PMA", "Delay all screening to 6 weeks of life"], "answer": 0, "explanation": "NHM calls for earlier screening in the smallest/least mature infants. Closest distractor: Do not substitute the US PMA-based initial table for the Indian 2–3-week high-risk rule. Why not the others: B. No screening if oxygen has stopped — Eligibility persists after oxygen is discontinued.; C. Screen only when the child reaches 40 weeks PMA — This is too late for early severe ROP.; D. Delay all screening to 6 weeks of life — Early aggressive disease can be missed.", "pearl": "India overlay: <28 weeks or <1200 g → 2–3 weeks.", "srcAnswer": "A"}, {"num": 29, "level": "Clinical/Application", "question": "A 24-week infant is now 7 weeks old. What is the PMA for ROP scheduling?", "options": ["17 weeks PMA", "31 weeks PMA", "40 weeks PMA", "24 weeks PMA"], "answer": 1, "explanation": "PMA is gestational age plus elapsed postnatal age. Calculation: Formula: PMA = GA + PNA. Substitution: 24 + 7 weeks. Units/final answer: 31 weeks PMA. Unit/conversion trap: Do not use corrected age in this formula. Closest distractor: A 24-week infant needs 7 weeks to reach 31 weeks PMA. Why not the others: A. 17 weeks PMA — This incorrectly subtracts age.; C. 40 weeks PMA — Term-equivalent age has not been reached.; D. 24 weeks PMA — This ignores chronological age.", "pearl": "Always state whether a protocol uses PMA or postnatal age.", "srcAnswer": "B"}, {"num": 30, "level": "Clinical/Application", "question": "A 29-week infant received intravitreal anti-VEGF for posterior Type 1 ROP. At 48 weeks PMA the retina looks quiet but remains avascular peripherally. What is appropriate?", "options": ["Stop follow-up because the fundus is quiet", "Treat every quiet avascular retina with emergency vitrectomy", "Continue specialist retinal surveillance for reactivation", "Assume complete retinal vascularization at 48 weeks"], "answer": 2, "explanation": "Anti-VEGF requires prolonged follow-up and possible delayed peripheral laser depending on findings. Closest distractor: Quiet disease vs mature vasculature are different endpoints. Why not the others: A. Stop follow-up because the fundus is quiet — Late reactivation remains possible.; B. Treat every quiet avascular retina with emergency vitrectomy — Vitrectomy is for tractional detachment, not all avascular retina.; D. Assume complete retinal vascularization at 48 weeks — Persistent avascular retina is explicitly described.", "pearl": "AAP surveillance after anti-VEGF may extend to ≥65 weeks PMA.", "srcAnswer": "C"}, {"num": 31, "level": "Clinical/Application", "question": "During indirect ROP screening of a 26-week infant on low-flow oxygen, the baby develops marked desaturation and bradycardia after the speculum is inserted. The pupils are fully dilated but the temporal retina has not yet been seen. What is the safest next step?", "options": ["Continue rapidly because completing the peripheral examination prevents blindness", "Increase phenylephrine and continue, because inadequate dilation is the likely cause", "Remove monitoring leads to reduce stimulation, then finish the exam", "Pause the examination, allow cardiorespiratory recovery, stabilize the infant, and resume only when safe"], "answer": 3, "explanation": "ROP examination itself can provoke short-term bradycardia, apnea and desaturation. Physiologic stability outranks completing the retinal view. Closest distractor: Urgency of ROP screening never overrides immediate stabilization of apnea, bradycardia or severe desaturation. Why not the others: A. Continue rapidly because completing the peripheral examination prevents blindness — The retina must be examined, but not through ongoing cardiorespiratory instability.; B. Increase phenylephrine and continue, because inadequate dilation is the likely cause — The pupils are already dilated; extra sympathomimetic exposure can add systemic risk.; C. Remove monitoring leads to reduce stimulation, then finish the exam — Monitoring is protective in a sick preterm infant and should not be removed.", "pearl": "Use swaddling, topical anesthetic, optional sucrose, asepsis and physiologic monitoring; keep the examination efficient.", "srcAnswer": "D"}, {"num": 32, "level": "Clinical/Application", "question": "A 27-week infant has retinal photographs showing a thin junctional line but no elevation. Which image interpretation is best?", "options": ["Stage 1 ROP rather than stage 2", "Stage 2 ROP", "Stage 3 ROP", "Stage 4A ROP"], "answer": 0, "explanation": "The left teaching panel depicts a line rather than a ridge. Closest distractor: The adjacent right panel is stage 2; elevation is the discriminator. Why not the others: B. Stage 2 ROP — The raised ridge is absent in the left panel.; C. Stage 3 ROP — No extraretinal neovascular tissue is seen.; D. Stage 4A ROP — No retinal detachment is shown.", "pearl": "Fundus pattern interpretation must separate line and ridge.", "srcAnswer": "A", "img": "img/image2_q32.png", "imgCaption": "Purpose-built educational schematic; not a patient image."}];
const NB_CTX={srcId:'Day11',label:'Day 11',set:'Quiz 2',href:'Day11/quiz2.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day11_QuizSet2_Q17-32_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 11 Quiz 2 — Wrong Answer Report</h1><p><b>Questions:</b> 17–32</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 11 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 11'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 11');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day11:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['2']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['2']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 2 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
