<h1>Day 11 — Quiz 5</h1>

<script>
const quiz=[{"num": 64, "level": "High-Difficulty", "question": "A 27-week infant has normal day-5 HUS but develops NEC at day 18. Which imaging approach follows CPS reasoning?", "options": ["Cancel the 4–6-week scan because day 5 was normal", "No imaging is useful after NEC", "Consider additional HUS after the acute illness and keep the 4–6-week scan", "Only obtain MRI if the infant is clinically unstable"], "answer": 2, "explanation": "New major illness can modify the routine surveillance schedule. Closest distractor: Do not let an earlier normal scan freeze later imaging decisions. Why not the others: A. Cancel the 4–6-week scan because day 5 was normal — WMI may emerge later.; B. No imaging is useful after NEC — Acute illness can change neurologic risk.; D. Only obtain MRI if the infant is clinically unstable — Selective MRI may help later but does not replace serial HUS.", "pearl": "WMI can evolve weeks after infection/inflammation.", "srcAnswer": "C"}, {"num": 65, "level": "High-Difficulty", "question": "A 25-week infant at term-equivalent age has abnormal tone but normal serial cranial US. Which counseling statement is best?", "options": ["All abnormal tone proves spastic CP", "Normal US reduces some risks but does not exclude noncystic WMI or later NDI", "MRI is forbidden if ultrasound is normal", "Normal US guarantees normal cognition"], "answer": 1, "explanation": "Imaging has only moderate predictive value for individual outcome. Closest distractor: Normal US vs no injury are not synonymous. Why not the others: A. All abnormal tone proves spastic CP — Tone can evolve and needs structured assessment.; C. MRI is forbidden if ultrasound is normal — Selective MRI may be reasonable with concerning examination.; D. Normal US guarantees normal cognition — Individual prognosis cannot be guaranteed.", "pearl": "Combine neurologic exam, trajectory, sensory status and imaging.", "srcAnswer": "B"}, {"num": 66, "level": "High-Difficulty", "question": "A 26-week infant with cystic PVL develops asymmetric lower-limb spasticity at 12 months corrected age. Which finding most warrants action?", "options": ["The absence of neonatal seizures", "A previously treated ROP lesion", "A normal newborn hearing screen", "Persistent abnormal tone and delayed gross motor milestones"], "answer": 3, "explanation": "PVL plus evolving motor signs raises CP risk. Closest distractor: Imaging alone cannot diagnose CP; longitudinal motor examination matters. Why not the others: A. The absence of neonatal seizures — Seizures are not required for CP.; B. A previously treated ROP lesion — ROP treatment does not explain motor tone.; C. A normal newborn hearing screen — Hearing screen does not rule out motor disability.", "pearl": "Consider standardized motor assessment and early physiotherapy.", "srcAnswer": "D"}, {"num": 67, "level": "High-Difficulty", "question": "A 27-week infant is 7 months chronological age and 4 months corrected age. A milestone screen shows skills typical of 4 months. How should this be interpreted?", "options": ["Development is consistent with corrected age; continue risk-based follow-up", "Definite 3-month developmental delay", "No need for future follow-up", "Use PMA of 7 months as corrected age"], "answer": 0, "explanation": "Use corrected age for early milestones but maintain high-risk follow-up. Closest distractor: Correcting age prevents mislabeling normal maturation as delay. Why not the others: B. Definite 3-month developmental delay — Chronological age alone overcalls delay.; C. No need for future follow-up — Very preterm birth still warrants surveillance.; D. Use PMA of 7 months as corrected age — PMA and corrected age are different concepts.", "pearl": "A normal screen at one visit does not eliminate future risk.", "srcAnswer": "A"}, {"num": 68, "level": "High-Difficulty", "question": "A 25-week infant with severe IVH had a normal hearing screen at discharge. At 2 years corrected age, language scores fall and caregivers report inconsistent response to sound. What is most appropriate?", "options": ["Treat as isolated autism without hearing assessment", "Wait until age 5 years", "Repeat formal audiology and comprehensive developmental assessment", "Rely on the newborn pass result"], "answer": 2, "explanation": "Neurosensory follow-up is longitudinal. Closest distractor: New hearing concerns supersede a prior screening pass. Why not the others: A. Treat as isolated autism without hearing assessment — Hearing loss must be excluded.; B. Wait until age 5 years — Early detection supports intervention.; D. Rely on the newborn pass result — A pass is not a lifelong guarantee.", "pearl": "Assess hearing, language, cognition and social communication together.", "srcAnswer": "C"}, {"num": 69, "level": "High-Difficulty", "question": "A 28-week infant with severe ROP treated by laser is being discharged. Which surveillance domain remains necessary even if the retina regresses?", "options": ["No eye follow-up after laser scars appear", "Long-term visual acuity, refractive error and strabismus follow-up", "Only monitoring for neonatal hypoglycemia", "Hearing assessment alone"], "answer": 1, "explanation": "Regression of active ROP is not the end of ophthalmic care. Closest distractor: Acute screening cessation differs from later visual-development follow-up. Why not the others: A. No eye follow-up after laser scars appear — Late refractive and visual complications remain.; C. Only monitoring for neonatal hypoglycemia — This does not replace ophthalmic surveillance.; D. Hearing assessment alone — Vision requires separate follow-up.", "pearl": "Refractive error and amblyopia can be treatable sequelae.", "srcAnswer": "B"}, {"num": 70, "level": "High-Difficulty", "question": "A 24-week infant has grade III IVH and progressive PHVD. Parents ask whether a ventricular shunt is always inevitable. Best response?", "options": ["A soft fontanelle proves no hydrocephalus", "MRI alone determines shunt placement", "Not always; early serial measurement and staged CSF diversion may avoid permanent shunting in some infants", "Every grade III IVH requires a VP shunt"], "answer": 2, "explanation": "PHVD management is individualized; neither fatalism nor reassurance is justified. Closest distractor: An IVH grade is a risk marker, not a deterministic shunt indication. Why not the others: A. A soft fontanelle proves no hydrocephalus — Clinical signs can lag.; B. MRI alone determines shunt placement — Serial ultrasound and clinical/neurosurgical assessment guide management.; D. Every grade III IVH requires a VP shunt — Severity raises risk but does not make shunting universal.", "pearl": "Discuss possible temporary drainage, reservoir and permanent shunt pathways.", "srcAnswer": "C"}, {"num": 71, "level": "Integrated/Rank-Differentiating", "question": "A 25-week, 800-g infant is 3 weeks old in India. Retinal exam shows zone I stage 2 with plus, and day-5 US showed grade II IVH. What are the correct parallel priorities?", "options": ["Urgent Type 1 ROP treatment assessment plus scheduled IVH/PHVD surveillance", "Treat the IVH with retinal laser", "Delay all follow-up until term-equivalent age", "Observe ROP for a month and ignore the IVH"], "answer": 0, "explanation": "Retinal and cerebral screening schedules are independent and concurrent. Closest distractor: Type 1 eye disease is urgent while grade II IVH requires repeat US, not eye therapy. Why not the others: B. Treat the IVH with retinal laser — Laser is for retinal disease, not brain hemorrhage.; C. Delay all follow-up until term-equivalent age — Retinal and ventricular complications can progress earlier.; D. Observe ROP for a month and ignore the IVH — Both conditions need time-specific action.", "pearl": "Prematurity complications should not be managed sequentially at the expense of another.", "srcAnswer": "A"}, {"num": 72, "level": "Integrated/Rank-Differentiating", "question": "A 27-week infant at 35 weeks PMA has zone II stage 3 no plus, progressive VI >p97 and AHW 8 mm after IVH. Which plan is best?", "options": ["Immediate retinal laser and no cranial follow-up", "Ignore ventricular measures until bulging fontanelle", "Stop ROP review because brain injury is more important", "Weekly-or-closer retinal surveillance and PHVD escalation under a low-threshold protocol"], "answer": 3, "explanation": "A high-risk PHVD finding does not transform Type 2 ROP into Type 1. Closest distractor: Different organ-specific thresholds dictate different actions. Why not the others: A. Immediate retinal laser and no cranial follow-up — Zone II stage 3 no plus is not automatically Type 1.; B. Ignore ventricular measures until bulging fontanelle — PHVD can progress silently.; C. Stop ROP review because brain injury is more important — Both require active surveillance.", "pearl": "Coordinate ophthalmology, neonatology and neurosurgery.", "srcAnswer": "D"}, {"num": 73, "level": "Integrated/Rank-Differentiating", "question": "A 24-week infant in the US is 6 weeks old, 30 weeks PMA; the unit plans the first ROP exam at 31 weeks PMA. A second infant born at 27 weeks in India is 2 weeks old. Which statement is best?", "options": ["The Indian infant should wait until 31 weeks PMA regardless of local guidance", "The US and India must use identical first-screen dates", "Both schedules may be appropriate under their separately named national frameworks", "Neither infant needs screening without oxygen exposure"], "answer": 2, "explanation": "Guideline frameworks are not interchangeable. Closest distractor: PMA-based AAP schedule and early PNA-based Indian rule can both be correct. Why not the others: A. The Indian infant should wait until 31 weeks PMA regardless of local guidance — That can delay an early Indian high-risk screen.; B. The US and India must use identical first-screen dates — National eligibility/timing protocols differ.; D. Neither infant needs screening without oxygen exposure — Gestational age alone qualifies both.", "pearl": "Write the framework in the question answer.", "srcAnswer": "C"}, {"num": 74, "level": "Integrated/Rank-Differentiating", "question": "A 26-week infant had normal day-5 HUS, then severe NEC and sepsis at day 17. At day 35, US shows bilateral periventricular cysts and motor asymmetry. Best synthesis?", "options": ["Normal maturation with no follow-up needed", "Delayed cystic WMI/PVL after critical illness; initiate high-risk neurodevelopmental pathway", "Acute grade I GMH only", "Retinal plus disease explains motor findings"], "answer": 1, "explanation": "A normal early scan does not rule out delayed WMI after NEC. Closest distractor: Delayed cystic evolution separates PVL from transient periventricular flare. Why not the others: A. Normal maturation with no follow-up needed — Cysts and asymmetry are abnormal.; C. Acute grade I GMH only — Cysts in white matter are not confined germinal-matrix hemorrhage.; D. Retinal plus disease explains motor findings — Retinal vascular changes do not cause periventricular cysts.", "pearl": "Arrange early therapy and structured follow-up rather than waiting for CP diagnosis.", "srcAnswer": "B"}, {"num": 75, "level": "Integrated/Rank-Differentiating", "question": "A 28-week infant had zone I stage 3 without plus treated with anti-VEGF and grade III IVH with PHVD. At 48 weeks PMA, the retina is quiet and the fontanelle is soft. What is the safest plan?", "options": ["Continue long-term retinal surveillance and ventricular/neurodevelopmental follow-up", "Only measure head circumference and ignore neurodevelopment", "Stop all follow-up because both examinations are reassuring", "Only review retina if the child squints"], "answer": 0, "explanation": "Clinical quiescence is not equivalent to completed surveillance. Closest distractor: Anti-VEGF follow-up and brain-injury follow-up have different endpoints. Why not the others: B. Only measure head circumference and ignore neurodevelopment — PHVD and WMI need multidomain follow-up.; C. Stop all follow-up because both examinations are reassuring — Neither quiet retina nor soft fontanelle excludes delayed complications.; D. Only review retina if the child squints — ROP reactivation can be silent.", "pearl": "Plan ophthalmology, neurology, therapy and sensory assessments.", "srcAnswer": "A"}, {"num": 76, "level": "Integrated/Rank-Differentiating", "question": "A 25-week infant with IVH has US: VI p97+2 mm, AHW 7 mm, TOD 26 mm; clinically stable. Under an ELVIS low-threshold approach, what is the most defensible interpretation?", "options": ["Normal scan because the infant is asymptomatic", "High-threshold criteria definitely met", "No follow-up until term-equivalent MRI", "Low-threshold PHVD criteria are exceeded; intensify monitoring and discuss intervention"], "answer": 3, "explanation": "Low vs high intervention thresholds must be distinguished numerically. Closest distractor: VI p97+2 and AHW 7 are low-threshold, not high-threshold, markers. Why not the others: A. Normal scan because the infant is asymptomatic — Symptoms lag imaging changes.; B. High-threshold criteria definitely met — VI is not p97+4 and AHW is not >10.; C. No follow-up until term-equivalent MRI — Progressive PHVD needs immediate serial US.", "pearl": "Use trial cutoffs as a referral framework, not an automatic universal drainage order.", "srcAnswer": "D"}, {"num": 77, "level": "Integrated/Rank-Differentiating", "question": "A 27-week infant at 40 weeks PMA has no cysts on HUS but diffuse MRI white-matter signal changes and poor spontaneous general movements. Which statement best guides counseling?", "options": ["Risk of NDI is increased, but prognosis requires serial functional assessment and early intervention", "MRI abnormalities prove severe CP in every infant", "Therapy should wait for Bayley testing at age 2", "Normal US excludes neurological injury"], "answer": 0, "explanation": "MRI adds information but not deterministic prediction. Closest distractor: Concordant functional abnormalities strengthen risk without guaranteeing disability. Why not the others: B. MRI abnormalities prove severe CP in every infant — Individual outcomes vary.; C. Therapy should wait for Bayley testing at age 2 — Early intervention can start on risk-based findings.; D. Normal US excludes neurological injury — Noncystic WMI may be missed on ultrasound.", "pearl": "Serial motor assessment, sensory testing and family-centered intervention are essential.", "srcAnswer": "A"}, {"num": 78, "level": "Integrated/Rank-Differentiating", "question": "A 29-week infant is discharged at 36 weeks PMA with zone II stage 2 without plus and a history of grade II IVH. Which discharge summary is safest?", "options": ["“Follow up if symptoms occur” without appointments", "Dated ophthalmic review, planned cranial follow-up if indicated, corrected-age developmental pathway and sensory surveillance", "“No development review” because IVH was not grade III", "“No further eye review” because plus is absent"], "answer": 1, "explanation": "The discharge summary must close each surveillance loop. Closest distractor: Retinal screening, cranial imaging and developmental follow-up are separate responsibilities. Why not the others: A. “Follow up if symptoms occur” without appointments — Both complications may progress silently.; C. “No development review” because IVH was not grade III — Even grade II IVH and extreme prematurity justify risk-based follow-up.; D. “No further eye review” because plus is absent — Stage 2 ROP still requires surveillance.", "pearl": "Communicate date, venue, escalation trigger and responsible clinician.", "srcAnswer": "B"}];
const NB_CTX={srcId:'Day11',label:'Day 11',set:'Quiz 5',href:'Day11/quiz5.html'};
let queue=quiz.map((_,i)=>i),idx=0,score=0,correctCount=0,wrongCount=0,checked=false,answers=[],skipped=new Set(),startedAt=new Date();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){
 idx=queue[0];const q=quiz[idx];
 document.getElementById('progress').style.width=`${(answers.length/quiz.length)*100}%`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('card').innerHTML=`
 <div class="badge">${esc(q.level)}</div>${skipped.has(idx)?' <div class="badge" style="background:var(--amberbg);color:var(--amber)">Skipped earlier — answer now</div>':''}
 <div class="q">Q${q.num}. ${esc(q.question)}</div>${q.img?`<figure class="qfig"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Image for question ${q.num}"></a>${q.imgCaption?`<figcaption>${esc(q.imgCaption)}</figcaption>`:''}</figure>`:''}
 ${q.options.map((o,i)=>`<label class="option" id="opt-${i}"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
 <div id="feedback" class="feedback"></div>
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Quiz Sets</a><button class="secondary" onclick="finishEarly()">Finish Quiz</button>${queue.length>1?'<button class="secondary" id="skipBtn" onclick="skipQuestion()">Skip for Now</button>':''}<button class="primary" id="mainBtn" onclick="mainAction()">Submit Answer</button></div>`;
 checked=false;
}
function mainAction(){if(!checked)submitAnswer();else{if(needTag()){nudgeTag();return}next();}}
// Required K/C/R/G/S tag for every wrong answer (learning mode shows the answer immediately, so the cause is tagged right here).
const TAGN={K:'Knowledge',C:'Concept',R:'Reasoning',G:'Guess',S:'Silly'};
function tagBox(){return `<div class="tagbox" id="tagBox"><b>Why did you get this wrong?</b><span class="req">required</span><div class="tagbtns">${Object.keys(TAGN).map(t=>`<button type="button" data-tag="${t}" title="${TAGN[t]}" onclick="setTag('${t}')">${t}</button>`).join('')}</div><div class="taglegend">K Knowledge · C Concept · R Reasoning · G Guess · S Silly</div><input class="tagnote" maxlength="140" placeholder="One-line correction rule (optional)" oninput="setNote(this.value)"></div>`}
function confBox(){return `<div class="tagbox" id="tagBox"><b>How secure was this answer?</b><span class="req">required</span><div class="tagbtns"><button type="button" data-tag="understood" onclick="setConf('understood')">Understood</button><button type="button" data-tag="guessed" onclick="setConf('guessed')">Guessed</button></div><div class="taglegend">Understood = you could explain why · Guessed = right answer, unsure reasoning</div></div>`}
function setConf(v){const a=curAns();if(!checked||!a||!a.correct||!a.retest)return;a.conf=v;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===v));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function curAns(){return answers[answers.length-1]}
function needTag(){const a=curAns();return checked&&a&&((!a.correct&&!a.tag)||(a.correct&&a.retest&&!a.conf))}
function setTag(t){const a=curAns();if(!checked||!a||a.correct)return;a.tag=t;document.querySelectorAll('#tagBox [data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag===t));const m=document.getElementById('mainBtn');m.disabled=false;m.textContent=m.dataset.label||'Next Question';}
function setNote(v){const a=curAns();if(a&&!a.correct)a.note=v.trim().slice(0,140)}
function nudgeTag(){const b=document.getElementById('tagBox');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function skipQuestion(){if(checked||queue.length<2)return;skipped.add(idx);queue.push(queue.shift());render();}
function submitAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Please select an answer first.');return;}
 const q=quiz[idx],chosen=Number(selected.value),correct=chosen===q.answer;
 checked=true;skipped.delete(idx);const sb=document.getElementById('skipBtn');if(sb)sb.remove();if(correct){score+=4;correctCount++;}else{score-=1;wrongCount++;}
 answers.push({...q,chosen,correct});
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById(`opt-${q.answer}`).classList.add('correct');
 if(!correct)document.getElementById(`opt-${chosen}`).classList.add('wrong');
 const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'correct':'wrong'}`;
 fb.innerHTML=`<strong>${correct?'✓ Correct (+4)':'✗ Incorrect (−1)'}</strong>${!correct?`<div style="margin-top:7px"><b>Correct answer:</b> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`:''}<div class="explain"><b>Explanation:</b> ${esc(q.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(q.pearl||'')}</div>${!correct?tagBox():q.retest?confBox():''}`;
 document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('counts').textContent=`Correct: ${correctCount} | Wrong: ${wrongCount}`;
 document.getElementById('counter').textContent=`Question ${idx+1} / ${quiz.length} (Source Q${q.num})${skipped.size?` · Skipped: ${skipped.size}`:''}`;
 document.getElementById('mainBtn').textContent=queue.length===1?'Finish Quiz':skipped.has(queue[1])?'Next (Skipped) Question':'Next Question';
 {const m=document.getElementById('mainBtn');m.dataset.label=m.textContent;if(!correct){m.disabled=true;m.textContent='Tag K/C/R/G/S to continue';}else if(q.retest){m.disabled=true;m.textContent='Choose Understood or Guessed';}}
}
function next(){queue.shift();if(queue.length)render();else showSummary(false);}
function finishEarly(){if(needTag()){nudgeTag();alert(curAns().correct?'Choose Understood or Guessed first.':'Choose K/C/R/G/S for this wrong answer first.');return}const left=quiz.length-answers.length;if(confirm(`Finish now? You have attempted ${answers.length} question(s).${left?` ${left} unanswered question(s)${skipped.size?` (including ${skipped.size} skipped)`:''} will score 0.`:''}`))showSummary(true);}
function fileTimestamp(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function reportBaseName(){
 return `Day11_QuizSet5_Q64-78_${fileTimestamp()}_Wrong_Answers`;
}
function duration(){const s=Math.round((new Date()-startedAt)/1000);return `${Math.floor(s/60)}m ${s%60}s`;}
function reportBody(){
 const wrong=answers.filter(a=>!a.correct);let s=`<h1>Day 11 Quiz 5 — Wrong Answer Report</h1><p><b>Questions:</b> 64–78</p><p><b>Score:</b> ${score} / ${answers.length*4} &nbsp; <b>Correct:</b> ${correctCount} &nbsp; <b>Wrong:</b> ${wrongCount}</p>`;
 if(!wrong.length)s+='<p>No wrong answers.</p>';
 wrong.forEach((a,n)=>s+=`<hr><h2>${n+1}. Q${a.num}. ${esc(a.question)}</h2><p><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}</p><p><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}</p><p><b>Explanation:</b> ${esc(a.explanation)}</p><p><b>Exam pearl:</b> ${esc(a.pearl||'')}</p>`);
 return s;
}
function downloadWord(){
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${reportBody()}</body></html>`],{type:'application/msword'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=reportBaseName()+'.doc';a.click();URL.revokeObjectURL(u);
}
function printPDF(){
 const w=window.open('','_blank');const pdfName=reportBaseName();w.document.write(`<!doctype html><html><head><title>${pdfName}</title><style>body{font-family:Arial;padding:30px;line-height:1.45}h1{font-size:22px}h2{font-size:16px}</style></head><body>${reportBody()}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();
}
let notified=false;
function wrongLines(list,lines,label){if(!list.length)return;const L=i=>String.fromCharCode(65+i),parts=[];for(let i=0;i<list.length;i++){const w=list[i],p=`Q${w.num} → ${L(w.chosen)} → ${L(w.answer)}`;if(new Blob([lines.join('\n')+`\n${label} → `+parts.concat(p).join(', ')]).size>3800){parts.push(`…and ${list.length-i} more`);break}parts.push(p)}lines.push('',`Wrong (${list.length}): chosen → correct`,`${label} → `+parts.join(', '))}
// "Day 10 Q19 retest Day 7 Q34 → Correct + understood → R1 → Improving" for each notebook retest in this set
// (the original mistake is "Day N QN" when the document names it, otherwise just "Day N").
function retestLines(){
 const rq=quiz.filter(q=>q.retest);if(!rq.length)return[];
 return['','Retests:',...rq.map(q=>{const a=answers.find(x=>x.num===q.num),st=q.retest.stage||'R1';
  const src=(String(q.retest.from||'').match(/Day\s*\d+(?:\s*Q\d+)?/)||[''])[0].replace(/\s+/g,' ');
  const id=`Day 11 Q${q.num}${src?` retest ${src}`:' retest'}`;
  if(!a)return`${id} → Not answered → ${st} → Pending`;
  if(a.correct)return a.conf==='guessed'?`${id} → Correct + guessed → ${st} → Not secure (repeat ${st})`:`${id} → Correct + understood → ${st} → Improving`;
  return`${id} → Wrong + ${a.tag||'?'} → ${st} → Repeat failure ×2`;})];
}
function notifyResult(attempted,max,pct,early){
 if(notified)return;notified=true;
 const nr=quiz.length-attempted-skipped.size;
 const lines=[`Score: ${score} / ${max} (${pct}%)`,`Attempted ${attempted}/${quiz.length} · Correct ${correctCount} · Wrong ${wrongCount} · Skipped ${skipped.size}${nr>0?` · Not reached ${nr}`:''}`,`Time: ${duration()}`];
 if(window.__nbIds&&window.__nbIds.length&&window.Notebook)lines.push('',...Notebook.compact(window.__nbIds,'Day 11'));else wrongLines(answers.filter(a=>!a.correct).sort((a,b)=>a.num-b.num),lines,'Day 11');
 lines.push(...retestLines());
 const msg=lines.join('\n');
 const title=`${document.title}${early?' (finished early)':''}`;
 fetch(`https://ntfy.sh/neetss?title=${encodeURIComponent(title)}&tags=memo`,{method:'POST',body:msg}).catch(()=>{});
}
// Save this attempt for the study-portal progress view (browser-local only).
function recordResult(attempted,max,pct){
 if(!attempted)return;
 try{const k='portal:Day11:quiz',all=JSON.parse(localStorage.getItem(k)||'{}'),p=all['5']||{attempts:0,best:null,bestPct:null};
  p.attempts++;p.last={score,max,pct,correct:correctCount,wrong:wrongCount,attempted,of:quiz.length,at:Date.now()};
  if(p.best===null||pct>p.bestPct){p.best=score;p.bestMax=max;p.bestPct=pct}
  all['5']=p;localStorage.setItem(k,JSON.stringify(all));}catch(e){}
}
function showSummary(early){
 document.getElementById('progress').style.width='100%';answers.sort((a,b)=>a.num-b.num);
 const attempted=answers.length,max=attempted*4,pct=attempted?Math.round(score/max*10000)/100:0,wrong=answers.filter(a=>!a.correct);
 // Error notebook first (tags were chosen during the quiz), so the single result message can include the error notes.
 window.__nbIds=window.Notebook?Notebook.record(NB_CTX,answers.map(a=>({num:a.num,srcNum:a.num,question:a.question,options:a.options,chosen:a.chosen,answer:a.answer,explanation:a.explanation,pearl:a.pearl,correct:a.correct,tag:a.tag,note:a.note}))):null;
 notifyResult(attempted,max,pct,early);recordResult(attempted,max,pct);
 document.getElementById('counter').textContent='Completed';
 document.getElementById('card').innerHTML=`<h2 style="margin-top:0">Quiz 5 Result</h2><p>${early?'<b>Finished early.</b><br>':''}Attempted ${attempted} of ${quiz.length} questions.${skipped.size?` Skipped and not answered: ${skipped.size}.`:''}</p>
 <div class="stats"><div class="stat"><strong>${score}</strong><span>Score / ${max}</span></div><div class="stat"><strong>${correctCount}</strong><span>Correct</span></div><div class="stat"><strong>${wrongCount}</strong><span>Wrong</span></div><div class="stat"><strong>${pct}%</strong><span>Score %</span></div></div>
 <p><b>Time:</b> ${duration()}</p><h3>Wrong-answer review</h3>
 ${wrong.length?wrong.map((a,n)=>`<div class="wrongitem"><b>${n+1}. Q${a.num}. ${esc(a.question)}</b><br><br><b>Your answer:</b> ${String.fromCharCode(65+a.chosen)}. ${esc(a.options[a.chosen])}<br><b>Correct answer:</b> ${String.fromCharCode(65+a.answer)}. ${esc(a.options[a.answer])}<div class="explain"><b>Explanation:</b> ${esc(a.explanation)}</div><div class="pearl"><b>Exam pearl:</b> ${esc(a.pearl||'')}</div></div>`).join(''):'<div class="good"><b>No wrong answers.</b></div>'}
 <div class="actions"><a class="btn secondary" href="index.html#/quizzes">Back to Quiz Sets</a><button class="secondary" onclick="downloadWord()">Download Word</button><button class="secondary" onclick="printPDF()">Print / Save PDF</button></div>`;
 // Error notebook: record wrong answers with the K/C/R/G/S tags chosen during the quiz, then send the error notes automatically.
 if(window.Notebook&&window.__nbIds){
  const card=document.getElementById('card'),box=document.createElement('div'),h=card.querySelector('h3');card.insertBefore(box,h||null);
  Notebook.panel(box,window.__nbIds,`${NB_CTX.label} ${NB_CTX.set} — Error notes`,{inResult:true});}
}
render();
</script><script src="../assets/countdown.js?v=57f27952"></script></body></html>
